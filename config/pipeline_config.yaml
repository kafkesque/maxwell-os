  min_pass_rate: 0.8
  min_fbs: 30
  convergent_ratio: 0.2
  # D2531: corpus-aware verify pass-rate (OPT-IN, NOT auto-applied).
  # The single min_pass_rate: 0.8 above is calibrated for a convergent-dominant
  # corpus. The 2026-09-03 e2e run exposed that single-source FBs (origin=
  # single_source) are genuinely unentailed by NLI (27.4% PASS) and even
  # convergent FBs sit at 31.1% — NEITHER reaches 80%. This is NOT a threshold
  # bug: it is a real signal that (a) evidence passages are weak/truncated and
  # (b) the B2 strict-majority vote is harsh for this corpus. Until evidence
  # quality is fixed in a separate investigation, this OPT-IN block lets
  # validate_results gate each origin tier against its own observed floor so a
  # genuinely degraded run still FAILS. enabled: false keeps the legacy single
  # threshold active (no silent behavior change — the recommendation is explicit).
