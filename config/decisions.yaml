  title: One writer for the serving gate, with an audit stamp on every script that may touch it (D-274h)
  source: governance/ROUNDTABLE_CROSSEXAM_20260919.md
  verification: 'measured: three hand-run scripts in scripts/ can move status on label grounds, with no pipeline-side guard and no audit stamp (BUG-299)'
  description: 'The documented root cause of the circling - verification by the artefact own outputs - has a concrete new instance: the serving gate was redefined by a hand-run script, so every later measurement inherited an unstated membership rule, and each adjudication round silently re-defined the gate again. Ruling: (1) exactly one writer may set status, and it derives it from the verification record (D274a); (2) any script outside pipeline/ that writes status must declare its rule as config, stamp an audit record (script, commit, rule hash, row count, before/after distribution) and be re-runnable from that record; (3) a CI invariant asserts that no label column can determine status. Same class as BUG-284 and D-271a: a governed question answered outside the governance path.'
  files:
  - scripts/apply_phase1_finalize.py
  - scripts/apply_phase1_adjudication.py
  - scripts/repass_pair_agreed.py
  - pipeline/integrity_check.py

