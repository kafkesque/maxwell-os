# config/declaration_consumers.yaml - the CONSUMER JOIN (D-2669). The ONE home of the fact "<declaration> is read by
# <code>". A declaration and the code that reads it are ONE object: D-405 joins a claim to its reality, and BUG-562
# measured the cost of NOT joining them at COMMIT time - config/serving_gate.yaml (GRANTED) landed while
# pipeline/serving_gate.py, its ONLY reader, was withheld (will_not_touch). Nothing refused that commit set; the
# property held only because a session looked.
#
# Consumed by scripts/check_declaration_consumers.py at TWO moments of the SAME home (the RAIL 3 precedent,
# config/recalibration_pins.yaml): --staged at the WRITE moment (the commit boundary, git-path:hooks/pre-commit) and the default STATE mode
# in the ladder (justfile: health).
#
# Rules the rail enforces, all mechanical:
#   * every declaration named here must EXIST (a declaration whose subject is absent is an assertion, BUG-488);
#   * every consumer must EXIST on disk (a declaration joined to nothing is prose, D-405);
#   * in --staged mode a STAGED declaration whose consumer is in NEITHER HEAD NOR the index is a WITHDRAWN CONSUMER
#     and the commit is refused. Worktree existence is deliberately NOT enough: the BUG-562 state was a consumer that
#     EXISTED and was UNTRACKED.
#   * there is deliberately NO "the consumer lands later" escape. The escape is: do not stage the declaration.
#   * a declaration with NO consumer must say so with exempt_reason (the config/flag_consumer_registry.yaml
#     vocabulary), so the emptiness is explicit instead of implied.
# This registry does NOT census all config/*.yaml: a filename grep would LIE about a config read through another
# config key (config/anchor_family.yaml#anchor4_depth_annex is the live example). An edge is declared by a decision,
# and its growth is an edit with a reason.
schema_version: '1'
authority: D-2669
decisions: [D-2669]
declarations:
- declaration: config/serving_gate.yaml
  consumers: [pipeline/serving_gate.py]
  decisions: [D-2668, BUG-562]
  why: >-
    the serving-gate declaration is read by exactly ONE module (pipeline/serving_gate.py::CONFIG_PATH); the BUG-562
    incident was this pair landing in two commits, declaration first, reader withheld because pipeline/** was
    will_not_touch.
- declaration: config/label_provenance.yaml
  consumers: [pipeline/label_traceability.py]
  decisions: [D-2640, BUG-497]
  why: >-
    the label-provenance declaration's reader is pipeline/label_traceability.py::CONFIG_PATH; the module fails closed
    on a missing or incomplete block, so a withheld reader leaves the declaration UNREAD, not broken.
- declaration: config/flag_consumer_registry.yaml
  consumers: [scripts/audit_flag_consumers.py]
  decisions: [BUG-380]
  why: >-
    the flag registry is read by scripts/audit_flag_consumers.py::REGISTRY_PATH; a flag registry whose audit is
    withheld is a registry nothing joins to a decision.
- declaration: config/rail_registry.yaml
  consumers: [scripts/check_rail_registry.py, scripts/check_rail_mutations.py, scripts/run_ladder.py]
  decisions: [D-2665, D-2679, D-2680]
  why: >-
    D-2680: scripts/run_ladder.py::declared() reads #ladder and #recipes from this registry, so the recipe the
    collector runs, and the lines it collects, have ONE home and no rail name is restated in code.
        the rail registry is read by scripts/check_rail_registry.py::CFG (which verifies its commit_boundary against the
    bytes at the path GIT resolves (git-path:hooks/pre-commit)) AND by scripts/check_rail_mutations.py#boundary_rails (D-2679), which derives
    the standing rule's COVERAGE from commit_boundary.must_contain instead of restating it. A registry whose reader
    is withheld is a declaration that no rail reports on - the class (i) shape this registry exists to catch.
- declaration: config/handoffs.yaml
  consumers: [scripts/verify_handoffs.py]
  decisions: [BUG-559, D-2670, BUG-581]
  why: >-
    the handoff registry is read by scripts/verify_handoffs.py; a handoff registry whose reader is withheld is a
    declaration nothing verifies, and a handoff nobody verifies is a session nobody can resume (BUG-559).
    MEASURED 2026-09-27 (BUG-581, found by the D-2679 audit): this edge carried the RAIL REGISTRY's rationale -
    a why attached to a subject that does not contain it, which is how a reader is taught the wrong fact by a
    file that spells the right one two edges up. The rationale moved back to config/rail_registry.yaml.
- declaration: config/freeze_window.yaml
  consumers: [scripts/check_freeze_window.py]
  decisions: [D-2688]
  why: >-
    D-2688: the freeze window is the ONE home of what is parked and what ENDS it, read by scripts/check_freeze_window.py
    (ONE reader, wired into justfile:health). MEASURED 2026-09-27: the META-LANE FREEZE was asserted in fifteen prose
    homes and read by NOTHING, so it could not fail, declared no exit and counted nothing. A window whose only reader
    is withheld is that same defect with a filename on it, which is what this edge refuses.
- declaration: config/config_defaults_census.json
  consumers: [scripts/check_config_defaults.py, tests/test_config_defaults_census_spec.py]
  decisions: [D-2982]
  why: >-
    the census receipt is read by its own rail (the debt SET is the baseline a later measurement is compared to)
    and by the spec contract (INV-5 asserts the receipt equals the live measurement). Joining them here means a
    staged receipt with a withheld reader is refused at the commit boundary (the BUG-562 shape) - and a receipt
    nobody reads is exactly the state in which a ceiling becomes a rubber stamp.
- declaration: config/serving_call_sites.yaml
  consumers: [tests/test_retrieval_serving_spec.py]
  decisions: [D-2980]
  why: >-
    the serving call-site matrix is read by the spec contract (INV-5): the contract asserts the
    ROUTING rule (every production call site calls the dispatcher) and the INVENTORY rule
    (every leg call is declared, every declaration is live). Joining them here means a staged
    matrix with a withheld reader is refused at the commit boundary (the BUG-562 shape).
- declaration: config/delegation_economy.yaml
  consumers: [pipeline/delegation_economy.py]
  decisions: [D-3023, BUG-832]
  why: >-
    the economy's ceilings, its tier vocabulary and the homes it reads are declared in ONE config home and read
    by exactly ONE module (pipeline/delegation_economy.py). Joining them here means a staged ceiling with a
    withheld reader is refused at the commit boundary (the BUG-562 shape) - and a ceiling nobody reads is a
    rubber stamp, which is the state T-104 already measured once on a different ceiling.
- declaration: config/task_register.yaml
  consumers: [scripts/gov_sync.py]
  decisions: [D-2981]
  why: >-
    the machine-readable TASK register is read by scripts/gov_sync.py, which renders the MUST/SHOULD/WORTH view
    into the user-facing faces and fails closed when a face stops equalling its re-derivation. Joining them here
    means a staged register with a withheld reader is refused at the commit boundary (the BUG-562 shape).
- declaration: config/capability_registry.yaml
  consumers: [scripts/resolve_route.py]
  decisions: [D-3024, T-156]
  why: >-
    the route graph is read by exactly ONE module (scripts/resolve_route.py::CFG) - it resolves every `just <recipe>`
    route against the ladder's bytes, follows every composed receipt pointer, and composes the joins this registry
    deliberately does not restate (declaration consumers, flag consumers, rail guards, handoff receipts, the
    delegation economy's tier vocabulary). A withheld reader would leave the graph UNREAD, not broken, which is the
    BUG-837 class one level up.
