pipeline_root: null
run:
  default_id: t11
pipeline_manifest:
  schema_version: '3.0'
  taxonomy_version: v5.1
  pipeline_commit: v3.0-D2485
  models:
    generator: Qwen3-Coder-30B-A3B-Instruct-MLX-4bit
    classifier: gpt-oss-20b-MXFP4-Q8
    embeddings: bge-m3
    nli: MoritzLaurer/DeBERTa-v3-large-mnli-fever-anli-ling-wanli
  prompt_versions:
    s2_convergent_extract: v7.0
    s4_cribs_classify: v2.0
    s5_factual_check: v3.0
stages:
  stage0_convert: knowledge pipeline/stage0_convert
  stage0_5_extract_metadata: knowledge pipeline/stage0_5_extract_metadata
  stage1_chunk: knowledge pipeline/stage1_chunk
  stage1_3_prefilter: knowledge pipeline/stage1_3_prefilter
  stage1_5_embed: knowledge pipeline/stage1_5_embed_cluster
  stage2_extract: knowledge pipeline/stage2_extract
  stage4_merge: knowledge pipeline/stage4_merge
  stage5_verify: knowledge pipeline/stage5_verify
  stage6_commit: knowledge pipeline/stage6_commit
  timeouts:
    '0': 3600
    '0.5': 3600
    '1': null        # BUG-143/D2411: full-corpus chunk (940 books → ~323K segs) takes ~1.5h
    '1.3': 3600
    '1.5': null      # BUG-143/D2411: full-corpus embed+cluster is multi-hour (D2409 incremental cache)
    '2': null
    '4': null
    '5': 3600
    '6': 3600
stage_files:
  stage0: null
  stage1: chunks.jsonl
  stage2: principles.jsonl
  stage4: fbs.jsonl
  stage5: verified.jsonl
  stage5_human_review: human_review/
  stage6_db: maxwell.db
  stage6_parquet: snapshot.parquet
  checkpoint: checkpoint.jsonl
  log: pipeline.log
  meta: run_meta.yaml
paths:
  checkpoint_dir: knowledge pipeline/checkpoints
  db_path: knowledge pipeline/maxwell.db
  parquet_dir: knowledge pipeline/parquet
  data_dir: knowledge pipeline
books_dir: knowledge pipeline/books
global_log: knowledge pipeline/pipeline.log
archive_dir: knowledge pipeline/archive
services:
  ollama:
    host: localhost
    port: 11434
    min_version: 0.32.0      # D2456: version drift detection (was silent before — homebrew 0.30.0 vs app 0.32.15)
    nomic_max_chars: 4000
    embed_max_chars: 4000
    batch_size: 100
    embed_timeout: 180        # D2348: 60s too short under 4-worker concurrent load → read timeouts (3% drop, BUG-105)
    embed_keep_alive: -1      # D2348: pin bge-m3 in VRAM (keep_alive thrash → cold reload stalls, BUG-105)
    single_source_guard:  # D2456: exactly ONE Ollama install (GUI app). Same pattern as D2455 OMLX.
      canonical_app: /Applications/Ollama.app
      forbidden_bins:  # unambiguous homebrew formula markers
        - /opt/homebrew/opt/ollama
        - /opt/homebrew/Cellar/ollama
      shim_paths:  # ambiguous: the app writes /usr/local/bin/ollama -> /Applications/Ollama.app/...
        - /opt/homebrew/bin/ollama
        - /usr/local/bin/ollama
      forbidden_launchd_labels:
        - homebrew.mxcl.ollama
      launch_agents_dir: ~/Library/LaunchAgents
  omlx:
    host: localhost
    port: 11435
    api_key: sk-maxwell-local
    min_version: 0.4.0
    bin: null
    default_timeout: 300
    max_retries: 2
    retry_delay: 3
    cold_reload_delay: 45  # D2301: wait for reasoning-model cold reload (GPT-OSS evict/reload ~30-60s)
    circuit_breaker_enabled: true
    circuit_breaker_failure_threshold: 5
    circuit_breaker_cooldown_seconds: 60
    single_source_guard:  # D2455: exactly ONE OMLX install (GUI app). Detect homebrew/duplicate re-infection.
      canonical_app: /Applications/oMLX.app
      forbidden_bins:  # unambiguous homebrew formula markers (only homebrew creates Cellar/opt)
        - /opt/homebrew/opt/omlx
        - /opt/homebrew/Cellar/omlx
      shim_paths:  # ambiguous: the APP also writes /opt/homebrew/bin/omlx -> ~/.omlx/bin/omlx. Flag only if it resolves to a Cellar install.
        - /opt/homebrew/bin/omlx
      forbidden_launchd_labels:
        - com.maxwell.omlx
        - homebrew.mxcl.omlx
      launch_agents_dir: ~/Library/LaunchAgents
models:
  generator:
    model: Qwen3-Coder-30B-A3B-Instruct-MLX-4bit
    provider: omlx
    temperature: 0.0
    max_tokens: 1024
  verifier:  # D2340: MISNAMED — this is actually the S4 classifier (D2249), consumed as VERIFY_MODEL in stage4_merge.py
    model: gpt-oss-20b-MXFP4-Q8
    provider: omlx
    temperature: 0.0
    reasoning_off_prefix: 'Reasoning: low'   # D2359: valid Harmony level ('none' is ignored); caps CoT
    reasoning_off_models:
    - gpt-oss-20b-MXFP4-Q8
    max_tokens: 1024
    chat_template_kwargs: {enable_thinking: false}   # D2359: oMLX-native CoT cap (top-level flags silently dropped)
    thinking_budget: 256   # D2367/BUG-132: merged CRIBS call CoT cap (X8 verified 256 -> 45% faster, valid JSON)
    depth_thinking_budget: 128   # D2367/BUG-132: focused depth call CoT cap (D2359 verified 128 -> 72%/7.3s)
  verifier_v2:  # D2340: MISNAMED — this is actually the S2 fast probe (D2319), consumed as VERIFY_MODEL_V2 in stage2_extract.py
    model: Phi-4-mini-instruct-8bit
    provider: omlx
    temperature: 0.0
    notes: 'D2319: S2 fast probe (~1.5s). D2298 removed Phi from S5 *verification* only; S5 = DeBERTa-only (models.nli_large).'
  embeddings:
    model: bge-m3
    provider: ollama
    alternative: mlx-community/Qwen3-Embedding-0.6B-4bit-DWQ
  nli_large: MoritzLaurer/DeBERTa-v3-large-mnli-fever-anli-ling-wanli
  # nli_cross: REMOVED (D2298) — RoBERTa-large added zero signal on paraphrase evidence (D2227).
pipeline:
  schema_version: '3.0'
  commit: v3.0-D2485
  taxonomy_version: v5.1
  max_domains_per_fb: 5
  chunk_size_words: 300
  chunk_overlap_words: 50
  min_chunk_words: 10
  enhance_min_header_gap_chars: 3000
  borp_min_sources: 2
  intent_top_k_ratio: 0.3
  intent_threshold: 0.35
  smoke_book_limit: 3
smoke:
  plumbing:
    skip_llm: true
    fast_model: null
    timeout_per_stage: 10
  fast:
    skip_llm: false
    fast_model: Phi-4-mini-instruct-8bit
    skip_gemma_deep_check: true
    max_books: 3
stage1_5:
  faiss_threshold: 0.75
  min_cluster_size: 2
  max_cluster_size: 500
  min_source_diversity: 2
  neighbor_k: 50
  embed_model: bge-m3
  embed_dim: 512
  embed_backend: ollama
  embed_model_hf: BAAI/bge-m3
  embed_chunk_size: 20000
  embed_batch_size: 64
  max_embed_drop_rate: 0.005
  embed_checkpoint_enabled: true   # D2409: crash-safe incremental embedding cache (Ollama) — resume S1.5 mid-embedding instead of re-embedding ~5h
stage0:
  max_failed_ratio: 0.0          # D2326: fail-closed — if failed/total > this ratio, exit non-zero (0.0 = any failure is fatal). Operator may raise to approve known-bad exclusions.
stage1_3:
  min_len: 40
  cite_density: 0.6
  enabled: true
  drop_patterns_extra:
  - author and publisher have provided this e-book
  - personal use only
  - z-library
  - libgen
  - do not redistribute
  - no part of this text may be reproduced
  - ebooks, downloads
  - unauthorized use of this book
stage2:
  batch_size: 10
  minhash_threshold: 0.9
  minhash_num_perm: 128
  golden_path: config/golden/stage2_fewshot_convergent.yaml
  golden_positive: 4      # D2377: one per epistemic form (stratified selection)
  golden_negative: 1
  golden_max_examples: 5
  golden_inject_enabled: true
  golden_seed: 42
  # BUG-152 (2026-08-20): single-source/singleton clusters previously got ZERO
  # golden few-shot, inheriting the convergent 100%-principle bias (re-labelling
  # + over-fire). A balanced single-source golden (all 5 content_type roles +
  # negatives) is injected into the multi-type single-source prompt instead.
  golden_single_source_path: config/golden/stage2_fewshot_single_source.yaml
  golden_single_source_inject_enabled: true
  golden_single_source_negative: 7
  golden_single_source_max: 21   # 14 positives (3 principle + 2 PT + 7 TI + 1 PI + 1 GE) + 7 negatives. D2457 added SS-POS-014 (R→TI) but max stayed 20 → round-robin budget 13 silently dropped the 7th TI (SS-POS-014). Bumped to 21 so all roles + anchors load.
  split_probe_enabled: true
  split_probe_min_size: 20
  split_probe_max_cohesion: 0.85
  gate_enabled: true
  gate_strict: true
  evidence_tracking: true
  high_cohesion_threshold: 0.9
  med_cohesion_threshold: 0.75
  source_book_match: exact
  max_cluster_samples: 5
  max_probe_samples: 8
  max_probe_per_book: 2      # D2357: per-book probe sample cap (was literal MAX_PER_BOOK=2)
  split_probe_kmeans_random_state: 42
  omlx_retry_attempts: 2
  gen_max_tokens: 3072       # D2381: S2 extraction output budget (was hardcoded 2048 in call_llm → JSON truncation / finish_reason=length)
  gen_max_tokens_retry: 4096 # D2381: JSON-failure fallback budget (retry with more room before giving up)
  batch_position_monitor: false
  max_workers: 3        # D2459: reverted 6→3 — 6 concurrent batches DEGRADE on the 128-expert MoE (server serializes + KV-store dispatch thrash); 3 = original T0.2
  singleton_batch_size: 4        # D2xxx: batch N singletons per LLM call (option-1 speedup, BUG-155 follow-up)
  singleton_batch_max_tokens_per_item: 1000  # per-singleton output budget inside a batch call (batch max_tokens = size x this)
  singleton_prefilter_enabled: true  # D2452: gate singleton pass on singletons.prefiltered.jsonl EXTRACT verdicts (D2437 prefilter)
  route_values: ["FB", "NULL"]   # D2323/C12: S2 route gate — FB=forward to S4, NULL=skip cluster (quoted: YAML parses bare NULL as None)
  max_failed_ratio: 0.01   # D2381: allow ≤1% terminal failures (was 0.0) — persistent JSON-failure clusters no longer halt the stage; failed clusters retried on resume (D2331).
  gated_seed_marker: "summary gated"   # D2421: runner-log marker for a summary-gated cluster (scripts/seed_gated_ids.py)
  gated_seed_id_regex: 'cluster_\d+(_s\d+)?(_sub\d+)?'   # D2421: cluster-id pattern on gated log lines
  extraction_type_dominance_warn_ratio: 0.95   # D2376: warn if a single extraction_type > this ratio of output (over-claim canary — causal_mechanism is the strongest epistemic claim)
  relabel_max_workers: 4   # D2434: R1 relabel sweep parallelism — OMLX serves concurrent requests; 4 workers ≈ 2-3× throughput on the ~15-20s/rec Qwen3 FORM re-judgment
  relabel_cross_family_model: "gpt-oss-20b-MXFP4-Q8"   # P1.3 (D2469): cross-family FLAG judge (Generator≠Verifier, R5). D2482: ENABLED — gpt-oss is cross-family from the S2 generator (Qwen3-Coder); flags (does not auto-apply) extraction_type disagreements.
watchdog:
  interval_secs: 60        # D2384: S2 watchdog poll interval
  stall_checks: 3          # D2384: consecutive no-growth polls before flagging "stuck" (D2382 signature)
  causal_warn_ratio: 0.5   # D2384: warn if causal_mechanism share exceeds this (D2377 bias drift)
  causal_halt_ratio: 0.9   # D2384: exit non-zero if causal share exceeds this (bias confirmed)
stage4:
  process_template_output: process_templates.jsonl
  process_instance_output: process_instances.jsonl
  growth_edge_output: growth_edges.jsonl
  tool_instruction_output: tool_instructions.jsonl
  max_principles_per_cluster: 25
  dedup_cosine_threshold: 0.92
  semantic_near_threshold: 0.8
  related_fbs_max_neighbors: 20     # BUG-188: hard cap on per-FB related_fbs neighbors (bounds graph to O(n·k); was unbounded O(n²) → 32M edges → 2GB truncation)
  related_fbs_exclude_domains: [emerging]  # BUG-188: fallback domains excluded from domain_overlap (shared fallback label ≠ meaningful relationship)
  related_fbs_exclude_disciplines: [emerging]  # BUG-194: fallback discipline excluded from discipline_overlap (shared placeholder ≠ relationship)
  merged_call_enabled: true
  merged_call_max_tokens: 2048   # GPT-OSS reasoning+JSON: 1024 truncated sparse (discipline/domains) → quarantine
  batch_enabled: false            # D2265 batch CRIBS — D2477 A/B: 2.67x speed BUT domain granularity degrades (12% canonical exact-match, Jaccard 0.48 vs merged). Quality-tradeoff → keep OFF for full run.
  batch_size: 4
  batch_call_max_tokens: 2048
  depth_focused_classification: true
  depth_max_tokens: 1024   # D2351/BUG-109: GPT-OSS is a reasoning model — 512 truncates reasoning_content → empty content → silent "domain"
  depth_batch_size: 4      # D2354: batch the focused depth prompt (removes the ~10s/FB serialized call)
  depth_batch_max_tokens: 2048   # BUG-184: 4-FB batch needs > depth_max_tokens (1024) headroom — gpt-oss truncates the Nth JSON object otherwise (reasoning_content consumes the budget)
  depth_batch_enabled: true        # D2477: wire D2354 batch depth into stage4 (quality-neutral — same short prompt, batched transport)
  # D2483 (2026-08-28): BUG-185 depth-collapse (97.5%->"domain") prompt fix, A/B-verified on BOTH paths.
  # "baseline" = unchanged production prompt. "v3_contrastive" = strip the DEFAULT-to-"domain"
  # bias lines + forced 4-way choice + contrastive boundary anchors. FOCUSED-path A/B (n=20): V3
  # breaks the collapse without over-assigning cross-domain (D2365 failure) and is speed-neutral.
  # BATCH-path A/B (n=20, production batch_depth_classify): V3 golden accuracy 3/5→5/5 (recovers
  # Feedback Loop→cross-domain, Backpropagation→specialized), speed-neutral 1.88→1.95s/FB, no
  # over-assignment (80% domain). Confirmed safe → enabled for the 7,898-FB full run.
  depth_prompt_variant: v3_contrastive
  # D2354 FrugalGPT cascade: GPT-OSS keeps the hard CRIBS/classification work;
  # a cheap third-family model does ONLY the 4-way depth classification.
  # GATED — default off until tools/benchmark_s4_depth_frugal.py shows ≥90%
  # agreement with GPT-OSS focused-depth AND ≥90% held-out accuracy.
  depth_frugal_enabled: false
  depth_model: gemma-4-E4B-it-MLX-4bit   # fast, non-reasoning (no CoT burn)
  depth_fallback_depth: domain
  # D2451: config-driven S4 classification golden few-shot (was hardcoded inline in
  # CLASSIFY_SYSTEM_PROMPT). Spans all 4 depth levels; validated against content_types.yaml.
  golden_path: config/golden/stage4_golden.yaml
  golden_inject_enabled: true
  golden_max_examples: 5   # D2501: file has 5 examples (incl S4-GOLD-005 D2482 cross-domain boundary); 4 silently dropped it
  # D2364/C12 (X7): signal sets extracted from hardcoded Python literals (cross-LLM audit).
  # context_signals: applied-domain → context routing hint (v1 Anytype "context" property).
  # temporal_signals: keyword heuristics for temporal_scope (timeless / contemporary).
  # universal_signals: name/mechanism substrings that flag a likely-universal depth.
  context_signals:
    business:
    - business operations
    - business development
    - entrepreneurship
    - organizational behavior
    - marketing
    design:
    - graphic design
    - brand identity
    - editorial & advertising
    - motion design
    - environmental design
    - digital product
    - illustration
    - packaging
    - web & ui
    - user experience
    - creative technology
    - data visualization
    system:
    - systems & frameworks
    - code & computation
    - engineering practice
    - ai & agents
    - ai systems
    - computational science & physics
    - software engineering
    academic:
    - research & methodology
    - semiotics & communication
    - computational art
    - philosophy
  temporal_signals:
    timeless:
    - always
    - universal
    - fundamental
    - any system
    contemporary:
    - '202'
    - current
    - modern
    - recent
    - today
    - now
  # D2410: difficulty_level mapping (C12) — depth → difficulty. `domain` is
  # cardinality-aware: single-domain FB = deep specialization ("expert");
  # multi-domain FB = breadth ("intermediate"). Mirrors the prior hardcoded
  # branch exactly (config-first only, no behavior change).
  difficulty_map:
    specialized: expert
    universal: beginner
    cross-domain: intermediate
    domain_single: expert
    domain_multi: intermediate
  universal_signals:
  - entropy
  - thermodynamic
  - evolution
  - natural selection
  - system 1
  - system 2
  - cognitive bias
  - feedback loop
  - power law
  - exponential
  - equilibrium
  - conservation
  - symmetry
  - optimization
  - gradient
  max_failed_ratio: 0.01   # D2386: allow ≤1% terminal failures (was 0.0, D2338) — mirror S2 D2381; 1 CRIBS-quality exclusion (empty application) within tolerance
  checkpoint_interval: 5   # D2370: intra-stage incremental checkpoint cadence (clusters) — crash recovery for the long serial S4
  fb_name_max_words: 8        # BUG-149: max words in normalized FB names (C12 — was hardcoded 5 in normalize_fb_name)
s2:
  dspy_max_labeled_demos: 3
  dspy_max_bootstrapped_demos: 3
  dspy_max_tokens: 4096  # D2304/C12: ConvergentExtraction needs 4K for 11 output fields (was hardcoded in dspy_trainer.py)
  dspy_program_path: data/dspy_mipro_optimized.json  # D2304: C12 config-driven (was hardcoded /tmp)
  dspy_enabled: false  # D2482: gate the DSPy extraction path in stage2. Default off — few-shot prompt injection stays the safe default until a program is trained (data/dspy_mipro_optimized.json) + live-smoked.
  gate:
    enabled: false
    model: Qwen3-Coder-30B-A3B-Instruct-MLX-4bit
    max_tokens: 64
    temperature: 0.0
    system_prompt: You are a principle discovery gate. Answer ONLY with 'FB' or 'NULL'. No explanation.
    user_prompt_template: 'Examine these text segments from {n_sources} different books.


      {segments}


      Does this cluster contain a discoverable convergent principle —

      a named, reusable mechanism with a clear ''how it works'' and ''when it fails''?

      Answer ONLY: FB (yes, extractable principle) or NULL (no extractable principle).

      '
stage5:
  borp_bypass_types:
  - process_template
  - process_instance
  - growth_edge
  - tool_instruction
  factscore_enabled: false
  nli_model: MoritzLaurer/DeBERTa-v3-large-mnli-fever-anli-ling-wanli
  # nli_model_fallback: REMOVED (D2298) — ModernBERT fallback deleted with RoBERTa.
  nli_entailment_threshold: 0.1
  nli_pass_threshold: 0.1
  nli_marginal_threshold: 0.1
  nli_max_premise_chars: 256
  nli_max_hypothesis_chars: 256
  mechanism_min_length: 150
  citation_echo_source_threshold: 20
  banned_mechanism_prefixes:
    - "because it enables"
    - "because it allows"
    - "because it helps"
    - "because it provides"
    - "because it makes"
    - "because it can"
  confidence:
    mechanism_weight: 0.35
    enrichment_weight: 0.25
    isor_weight: 0.40
    quarantine_cap: 0.25
    human_review_isor_rating: strong
  checkpoint_interval: 50   # D2409: intra-stage incremental checkpoint cadence (FBs) — crash recovery for the serial S5
stage6:
  commit_non_fb_types: false
  okf_export_enabled: true
  max_failed_ratio: 0.0   # D2338: fail-closed commit — if failed_inserts/total > this ratio, exit non-zero (0.0 = any failed insert fatal)
stage4_5:   # F1/D2400: post-S4 enrichment — producers for prerequisite_fbs / contradicts_fbs / procedural_skill (NOT inline-S4, NOT S6)
  enabled: false                 # OFF for T1.1 (principle-only; the LLM edge pass is post-T1.1 cost). Flip to true to run.
  model: gpt-oss-20b-MXFP4-Q8   # R5: cross-family from S2 generator (qwen); same family as S4 classifier (gpt-oss)
  procedural_skill_enabled: true
  edge_enabled: true
  edge_candidate_threshold: 0.80           # cosine threshold proposing candidate FB pairs (mirrors S4 semantic_near_threshold)
  edge_max_candidates_per_fb: 10           # bloat/health guard: cap candidate pairs per FB
  edge_max_tokens: 512
  procedural_skill_max_tokens: 256
  max_failed_ratio: 0.01        # D2338-style fail-closed tolerance
  checkpoint_interval: 5        # D2370-style intra-stage incremental checkpoint cadence (FBs)
coverage:
  threshold: 0.5
  flag_fraction: 0.3
retrieval_eval:
  model: Phi-4-mini-instruct-8bit
  provider: omlx
  max_tokens: 1024
  confidence_threshold: 0.85
  max_iterations: 3
  max_fbs_to_evaluate: 15
  fb_definition_max_chars: 300
  fb_name_max_chars: 200
reliability:
  stable_threshold: 0.85
  watch_threshold: 0.5
  garbage_threshold: 0.2
taxonomy:
  flood_threshold_ratio: 0.2
  replacement_threshold_ratio: 1.1
  emerging_freq_threshold: 10
  max_domains: 35       # D2378: canonical domain cap (matches taxonomy_v5.yaml; closed-loop — promote requires demote)
  max_disciplines: 75   # D2378: canonical discipline cap (matches taxonomy_v5.yaml; D2422 removed education overlap; +4 promotions 2026-08-20: design thinking, product design, industrial design, information retrieval)
  # D2485: post-S4 emerging-rate gate (BUG-150 discipline-emerging 33% on probe).
  # emerging_real = genuine taxonomy gap (promotion candidate, counted);
  # emerging_unmapped = empty/invalid raw label (NOT a promotion signal, excluded
  # from promotion logic — fabricating "emerging" from garbage was the BUG-167-adjacent risk).
  emerging_discipline_rate_max: 0.35   # frac of FBs with discipline == 'emerging' (real gaps)
  emerging_domain_rate_max: 0.30       # frac of FBs whose domains collapsed ENTIRELY to ['emerging']
  emerging_unmapped_rate_max: 0.05     # frac of FBs with empty/invalid raw label (garbage detector — should be ~0)
e2e:
  borp_min_sources: 2
  min_pass_rate: 0.8
  min_fbs: 30
  convergent_ratio: 0.20  # D2336: 0.25 was a pre-data default; first 20-book run = 24.5% (SE≈3.4%)

  diagnostic:
    yield_pct_pass: 1.0
    yield_pct_fail: 0.5
    s5_pass_rate_pass: 0.4
    s5_pass_rate_fail: 0.2
    quick_clusters: 50
    default_books: 100
test:
  full_run:
    books: []   # D2439: shadow-library filename manifest REDACTED from public repo (929 titles w/ z-lib/libgen/Anna's provenance). Derive at runtime: sorted(BOOKS_DIR.rglob("*.md")).
    output_subdir: full-run
    pipeline_commit: full-run-v3
    schema_version: '2.3'
    taxonomy_version: v5.1
    extract_model: Qwen3-Coder-30B-A3B-Instruct-MLX-4bit
    extract_max_tokens: 2048
    classify_max_tokens: 512
    extract_system_prompt: "You extract reusable principles from text.\nReturn a JSON array of principle objects:\n[{\"name\"\
      : \"Principle Name\", \"definition\": \"2-3 sentence definition...\",\n  \"mechanism\": \"X causes/enables/prevents\
      \ Y because Z\",\n  \"boundary\": \"Applies when...; fails when...\",\n  \"consequence\": \"What follows from this mechanism\"\
      ,\n  \"elaboration\": \"3-5 sentences of deeper nuance (edge cases, exceptions, conditions). Empty string if passages\
      \ add nothing beyond mechanism/boundary.\",\n  \"is_summary\": false,\n  \"evidence_passages\": [\"verbatim quote 1\"\
      , \"verbatim quote 2\"],\n  \"application\": \"When [situation] -> do [action]\",\n  \"failure_mode\": \"The principle\
      \ fails when...\",\n  \"keywords\": \"term1, term2\",\n  \"jargon\": {\"term\": \"explanation\"} or omit if none,\n\
      \  \"route\": \"FB\"}].\nevidence_passages MUST be verbatim quotes from the source text — never paraphrase.\nDefault\
      \ route is FB; use NULL only when the passage clearly contains no principle."
    context_signals:
      business:
      - business operations
      - business development
      - entrepreneurship
      - marketing
      - organizational behavior
      design:
      - graphic design
      - brand identity
      - user experience
      - web & ui
      - digital product
      - editorial & advertising
      - motion design
      - environmental design
      - illustration
      - packaging
