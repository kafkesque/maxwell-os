# config/capability_registry.yaml — THE ROUTE GRAPH (D-3024 / T-156). The ONE home of the fact "<this entry
# point> is a CAPABILITY: here is how it is invoked, how it is CHECKED, what it LEAVES BEHIND, and what it COSTS."
#
# WHY (the class, not the instance). MEASURED 2026-10-15 by `python3 scripts/resolve_route.py --census` (the
# instrument is named with the number, D-2642 — a number quoted after its instrument was invalidated is not a
# reading, and the READING is quoted with its corpus FINGERPRINT because this file and the resolver are themselves
# part of the corpus they measure): 538 python files across pipeline/ + scripts/ + the repo root, of which 32 are
# named by NO justfile recipe, NO config file and NO governance document; 74 of the 538 DECLARE a check verb
# (--selftest/--check). Fingerprint 6943898c4e273509 over 509 declared-home file(s), 11,168,252 bytes. "Who runs what" therefore lived in prose (a CLAUDE.md
# delegate_rules block, ADVISORY) and in a justfile, so a TASK could not be RESOLVED to the capability that owns
# it, and a capability whose entrypoint or check does not exist could not be REFUSED. This file is the declared
# graph; scripts/resolve_route.py is its ONE deterministic reader.
#
# THE RULE (D-3024). A capability declares its KIND, ENTRYPOINT, CHECK, RECEIPT and COST TIER. `--check` FAILS on
# a capability missing any of them, on an entrypoint / check / owned path that is ABSENT, on a lane whose recipe or
# command is gone, on an open item whose MOVER has no declared disposition, and on routing debt that GREW past its
# declared ceiling. An LLM may write a PROPOSAL into temp/ and never an assignment (D-2898/D-2941): this file is a
# GOVERNED home and `resolve_route.py --propose <file>` validates a proposal instead of applying it.
#
# WHAT THIS FILE DELIBERATELY DOES NOT DO. It does not restate the joins that already exist: the
# declaration -> consumer edges are read from config/declaration_consumers.yaml, the flag -> consumer edges from
# config/flag_consumer_registry.yaml, the rail set and its receipts from config/rail_registry.yaml, the stage
# receipts from config/handoffs.yaml, and the cost-tier VOCABULARY from config/delegation_economy.yaml (a second
# copy of a fact IS the drift, C12). It is not a census of every file either: the 32 unnamed files are a REPORTED
# debt (see routing_debt), never something a route declaration papers over.
#
# WHAT IT IS FOR. Two questions, both deterministic: (1) "which capability owns this open item?" —
# `--route T-156`; (2) "is the graph well-formed and is its debt shrinking?" — `--check`.
schema_version: '1'
authority: D-3024
updated: '2026-10-27'

# ─── THE VOCABULARIES (a value that is not declared here is refused, never inferred) ───
#: The KIND of route. A kind is a CLAIM about how a capability is entered and what it leaves behind.
kinds:
  script: 'a file invoked as a command; its receipt is a file (or a census) it writes'
  recipe: 'a justfile recipe: the route to a stage, a rail chain or an operator lane'
  harness_job: 'a detached job run through the harness; its receipt is a workspace under temp/runs/'
  skill: >-
    an agent-session capability addressed by name. NO skill is declared below: a skill carries no receipt of its
    own yet, and a kind with zero members is declared rather than implied - the day one carries a receipt, the
    entry appears here and the check accepts it without an edit to code

#: COST TIERS ARE NOT DECLARED HERE. The vocabulary lives in config/delegation_economy.yaml (T0 deterministic
#: script / T1 local engine / T2 cloud), which owns it; the reader REFUSES a tier token that does not appear in
#: that file, so a re-badged economy is a fault and not a silent re-labelling.
cost_tier_home: config/delegation_economy.yaml

# ─── THE CAPABILITIES ───
#: Every field is checked: `entrypoint` and `check` must RESOLVE (a file path must exist; `just <recipe>` must be
#: a recipe in the ladder file), `owns` names the paths this capability is responsible for (an item that names one
#: of them ROUTES here), `receipt` names what is left behind — a path, or `<file>#<key>` when an existing
#: declaration already owns that fact (the pointer is followed, so a composed receipt is verified, not asserted).
capabilities:
  # ── the ladder and the registers ──
  - id: ladder
    kind: recipe
    entrypoint: just health-full
    check: python3 scripts/run_ladder.py --receipt-check
    receipt: temp/ladder_receipt.json
    cost_tier: T0
    owns: [justfile]
    note: 'the whole declared rail set in one run (D-2983); the rail set ITSELF is not restated here - it is config/rail_registry.yaml#guards'
  - id: rail_registry
    kind: script
    entrypoint: python3 scripts/check_rail_registry.py
    check: python3 scripts/check_rail_registry.py --selftest
    receipt: config/rail_registry.yaml
    cost_tier: T0
    # D-3214 (OWNER'S WORD, 2026-10-28): THE RAIL BUCKET. The owner approved the DIRECTORY-LEVEL ownership rule,
    # applied here mechanically: a `scripts/check_*` or `scripts/audit_*` that NO declared capability names in its own
    # entrypoint/check/receipt is a rail that nobody owns - and an UNREGISTERED rail is a rail-registry concern by
    # definition, because this capability's whole subject is the fact "this rail is a rail" (D-2665). The entries are
    # enumerated, one per line, NOT folded into a `scripts/` prefix: a prefix would claim every artifact in the directory
    # and a declaration that every path in a tree is owned owns nothing in particular (D-3034).
    owns:
    - config/rail_registry.yaml
    - scripts/audit_e2e_cohesion.py
    - scripts/audit_false_convergence.py
    - scripts/audit_final_chain.py
    - scripts/audit_flag_consumers.py
    - scripts/audit_form_axis.py
    - scripts/audit_full_corpus_labels.py
    - scripts/audit_human_verification.py
    - scripts/audit_menu_rescope_cohort.py
    - scripts/audit_sidecar_commit.py
    - scripts/check_anchor_axis_consistency.py
    - scripts/check_config_defaults.py
    - scripts/check_delete_target.py
    - scripts/check_depth_load_bearing.py
    - scripts/check_encoding_homes.py
    - scripts/check_human_instruments.py
    - scripts/check_menu_reclass_gate.py
    - scripts/check_register_divergence.py
    - scripts/check_serving_gate.py
    - scripts/check_session_plan.py
    - scripts/check_silent_repair.py
    - scripts/check_stale_toolcall_rows.py
    - scripts/check_store_authority.py
    - scripts/check_store_columns.py
    - scripts/check_undeclared_encoding.py
  - id: governance_faces
    kind: script
    entrypoint: python3 scripts/gov_sync.py --apply
    check: python3 scripts/check_governance_faces.py
    receipt: DECISION-LOG.md
    cost_tier: T0
    owns: [config/gov_sync.yaml, DECISION-LOG.md, MASTER-TASK-REGISTER.md, governance/buglog.md]
    note: 'the four USER-FACING faces are one capability: they are re-cut from one register and one reader (D-2981)'
  - id: decision_mint
    kind: script
    entrypoint: python3 scripts/recompute_decision_summary.py --mint
    check: python3 scripts/recompute_decision_summary.py --check
    receipt: config/decisions_summary.json
    cost_tier: T0
    owns: [config/decisions.yaml, config/decisions_summary.json, config/decisions_policy.yaml]
  - id: bug_census
    kind: script
    entrypoint: python3 scripts/bug_status.py
    check: python3 scripts/check_bug_status.py
    receipt: governance/bug_status.json
    cost_tier: T0
    owns: [governance/bug_status.json]
  # T-175/D-3046 (BUG-856): THE ROUTE GRAPH OWNS ITSELF NOWHERE. MEASURED 2026-10-16: no capability's `owns`
  # named scripts/resolve_route.py or config/capability_registry.yaml, so a finding ABOUT the route graph joined
  # the unrouted population BY CONSTRUCTION - the two artifacts whose whole subject is routing were the only ones
  # the graph could not route, and the dispositions reason ("a bug routes only when its title names a declared
  # capability's artifact") became a closed loop. Its receipt is a COMPOSED pointer into its own registry: what
  # this capability leaves behind is the shrink-only debt reading it maintains and refuses to raise.
  - id: route_graph
    kind: script
    entrypoint: python3 scripts/resolve_route.py --check
    check: python3 scripts/resolve_route.py --selftest
    receipt: config/capability_registry.yaml#routing_debt
    cost_tier: T0
    # D-3212: scripts/lib/artifact_tokens.py is owned HERE because the route graph is where "is this token an
    # artifact?" is ENFORCED; the census imports the same definition (D-2642 - one home), so a finding that names
    # the token pattern itself routes to the rail that judges it.
    owns: [scripts/resolve_route.py, config/capability_registry.yaml, scripts/lib/artifact_tokens.py]
  - id: store_write
    kind: script
    entrypoint: python3 scripts/apply_relabel_store_write.py
    check: python3 scripts/apply_relabel_store_write.py --selftest
    receipt: config/label_store_write_receipt.json
    cost_tier: T0
    owns: [config/relabel_rulings.yaml, knowledge pipeline/maxwell.db, pipeline/schemas.py,
           # D-3134/BUG-977 (2026-10-23): the STORE's own vocabulary and the paths that write INTO it were owned by
           # NO capability, which is why BUG-975/976/977 read `no_artifact_named` and the routing debt grew past its
           # ceiling the moment they were filed. The four declarations are TRUE statements, not a papering-over: each
           # one writes or measures the governed store. The rule these bugs live under is the content_type column's
           # (a disposition is not a ROLE, D-2965/BUG-741) and its census is the gate that owns it.
           scripts/restamp_content_type_adjudications.py, config/content_type_restamp.yaml,
           scripts/rule_content_type_census.py, pipeline/insert_single_concept.py,
           scripts/repair_single_concept_provenance.py, pipeline/backfill_embeddings.py]

  # ── the delegation fleet (D-3020/D-3028) ──
  - id: fanout
    kind: harness_job
    entrypoint: python3 pipeline/subagent_fanout.py start
    check: python3 pipeline/subagent_fanout.py --selftest
    receipt: temp/runs/
    cost_tier: T1
    owns: [pipeline/subagent_fanout.py, config/engine.yaml]
    note: 'the delegation EXECUTOR; a run is a job whose receipt is its workspace'
  - id: research_run
    kind: harness_job
    entrypoint: python3 pipeline/research_run.py run
    check: python3 pipeline/research_run.py --selftest
    receipt: temp/runs/
    cost_tier: T1
    owns: [pipeline/research_run.py]
  - id: model_sweep
    kind: script
    # T-167/D-3035: the ONE route by which MODEL-STORE bytes leave the disk. It is the census's ACTING half: the
    # census measures and OFFERS (read-only, R-D410), and this route proves the copy by CONTENT one more time from
    # the bytes on disk, refuses any class config does not offer, removes a parked NAME before the bytes it points
    # into, takes NO copy (safe_delete.py copies into this Dropbox-synced repo - BUG-818c) and writes a RECEIPT.
    # The BARE form is deliberate: it is how an operator and the ladder run it, so resolve_route requires the bit
    # (BUG-842/T-146) - and the act itself takes the owner word as its licence (D-3010).
    entrypoint: python3 pipeline/model_store_sweep.py --plan
    check: python3 pipeline/model_store_sweep.py --selftest
    receipt: governance/DELETION_RECEIPT_20261016.json
    cost_tier: T0
    owns: [pipeline/model_store_sweep.py, pipeline/model_store_census.py]
  - id: harness_adapter
    kind: harness_job
    entrypoint: python3 pipeline/harness_env.py --print
    check: python3 pipeline/harness_contract.py --selftest
    receipt: config/harness_policy.yaml
    cost_tier: T0
    #: T-138/D-3041: the adapter SURFACE - the binding that points a client at the local engine and the policy
    #: that says which client a job earns. Declared 2026-10-16 because the route graph had NO capability for the
    #: adapter root at all, so T-174 (the everyday path must USE the binding) resolved to nothing while the
    #: contract rail that measures it is `fatal` in the ladder.
    owns:
    - agent/adapters/
    - AGENTS.md
    - config/harness_policy.yaml
    - pipeline/harness_env.py
    - pipeline/harness_contract.py
    - scripts/bind_harness_env.sh
    - scripts/check_agent_surface.py
    - config/agent_surface.yaml
    - scripts/check_harness_homes.py
    - agent/adapters/goose/apply_provider_flip.py

  - id: extension_residency
    kind: script
    entrypoint: python3 scripts/goose_profile.py --launch
    check: python3 scripts/goose_profile.py --check
    receipt: config/extension_profiles.yaml
    cost_tier: T0
    #: T-186/D-3056/D-3064: WHAT THE HARNESS RUNS AS AN EXTENSION, AND WHETHER IT STARTS. Declared 2026-10-17
    #: because this lane had NO route at all: `config/extension_profiles.yaml` and `scripts/goose_profile.py` existed
    #: while no capability owned them, so every bug about a resident extension (including BUG-878, a write gate born
    #: dead from the wrong directory) resolved to nothing - the exact shape the route graph's `facts_census` reports as
    #: an existing artifact with no owner.
    owns:
    - scripts/goose_profile.py
    - config/extension_profiles.yaml
    - mcp_doc_guard.py

  - id: ingest_identity_door
    kind: script
    entrypoint: python3 scripts/check_ingest_identity_gate.py
    check: python3 scripts/check_ingest_identity_gate.py --selftest
    receipt: config/ingest_identity_gate.yaml
    cost_tier: T0
    #: T-130/D-2997/BUG-781: the identity screen the INGEST path never read. It PRODUCES a per-batch deferral
    #: receipt under the declared runtime home (temp/ingest_deferrals, gitignored) and its RECEIPT pointer here
    #: is its ONE policy home, which is what a reader consults to know what the door reads. Declared 2026-10-16
    #: because the route graph had NO capability for the door at all: T-130, T-172 and T-173 all resolved to
    #: nothing, i.e. the debt these rows carried was the route graph's, not the tasks'.
    owns:
    - pipeline/ingest_gate.py
    - scripts/check_ingest_identity_gate.py
    - config/ingest_identity_gate.yaml
    - scripts/normalise_corpus_names.py
    - governance/duplicate_adjudication.json

  - id: delegate_journal
    kind: script
    # T-168/BUG-844/D-3036: THE TRACE A DELEGATED RUN LEAVES. MEASURED 2026-10-16: three delegates were reported
    # cancelled, ONE of them had already written its artifact and nothing on disk distinguished it from the two that
    # had written nothing - so a STALL, a KILL and a SUCCESS were one state, and the standing rule ("delegate to the
    # right local model, in parallel") could not be verified by any later reader. This route is the ACT's half of
    # the delegation economy: the economy measures the COST (pipeline/delegation_economy.py, from the harness ledger)
    # and this measures the ACT (purpose, model, claims, budget BEFORE the call; state, measured wall time and
    # artifacts VERIFIED ON DISK after it). The model is the JOIN KEY between the two; no price is restated here.
    entrypoint: python3 scripts/delegate_journal.py status
    check: python3 scripts/delegate_journal.py --selftest
    receipt: governance/delegate_journal.jsonl
    cost_tier: T0
    owns: [scripts/delegate_journal.py, governance/delegate_journal.jsonl]
  - id: model_fetch
    kind: script
    # BUG-842/T-146: the BARE form, because that is how an OPERATOR-typed command is declared in this file
    # (all eight lanes below are bare, and every one of them is executable). MEASURED 2026-10-16: the owner ran
    # the bare form of this route and got "permission denied" - the file carried a shebang that promises direct
    # execution and was mode 644, because its mode was whatever last wrote it. Declaring the form he types is
    # what makes scripts/resolve_route.py#_bare_form_faults require the executable bit, so the next silent
    # rewrite cannot break the route again.
    entrypoint: pipeline/hf_fetch_model.py --repo
    check: python3 pipeline/hf_fetch_model.py --verify-only
    receipt: config/engine.yaml#model_store
    cost_tier: T0
    owns: [pipeline/hf_fetch_model.py]

  # ── the pipeline (S0 -> S6): one capability per PHASE, and the phase's receipt is the handoff journal ──
  - id: pipeline_ingest
    kind: recipe
    entrypoint: just stage1
    check: python3 scripts/verify_handoffs.py
    receipt: config/handoffs.yaml#journal
    cost_tier: T0
    owns: [pipeline/stage0_convert.py, pipeline/stage0_5_extract_metadata.py, pipeline/stage1_chunk.py, config/handoffs.yaml]
  - id: pipeline_cluster
    kind: recipe
    entrypoint: just stage1_5
    check: python3 scripts/verify_handoffs.py
    receipt: config/handoffs.yaml#journal
    cost_tier: T0
    owns: [pipeline/stage1_3_prefilter.py, pipeline/stage1_5_embed_cluster.py]
  - id: pipeline_extract
    kind: recipe
    entrypoint: just stage2
    check: python3 scripts/verify_handoffs.py
    receipt: config/handoffs.yaml#journal
    cost_tier: T1
    owns: [pipeline/stage2_extract.py]
  - id: pipeline_merge
    kind: recipe
    entrypoint: just stage4
    check: python3 scripts/verify_handoffs.py
    receipt: config/handoffs.yaml#journal
    cost_tier: T1
    # D-3214: `stage4_merged_call.py` is stage4's own call path - MEASURED: it is 1,245 lines and `pipeline/stage4_merge.py`
    # names it. It belongs to the stage that runs it, so the rule assigns it to that stage's capability and to nothing else.
    owns:
    - pipeline/stage4_merge.py
    - pipeline/stage4_merged_call.py
  - id: pipeline_verify
    kind: recipe
    entrypoint: just stage5
    check: python3 scripts/verify_handoffs.py
    receipt: config/handoffs.yaml#journal
    cost_tier: T1
    owns: [pipeline/stage5_verify.py]
  - id: pipeline_commit
    kind: recipe
    entrypoint: just stage6
    check: python3 scripts/verify_handoffs.py
    receipt: config/handoffs.yaml#journal
    cost_tier: T0
    owns: [pipeline/stage6_commit.py]
  #: D-3047: THE REGISTER'S RECALL. MEASURED 2026-10-16: no artifact in this repository computed which
  #: findings share a shape, so the register could be appended to and never queried - and the routing debt's
  #: own reader could not route a finding ABOUT the register until this capability existed (BUG-856's shape:
  #: a graph that owns itself nowhere joins the unrouted population by construction).
  # T-176/D-3048: THE SOURCE LIBRARY as a measurable subject - what its names cost (D-3045's census) and what a
  # repair would be (the plan-first rename). Two readers, ONE declared home; neither writes to the library, and the
  # plan a human reads is the only file either produces.
  - id: source_library_names
    kind: script
    entrypoint: python3 scripts/plan_source_rename.py
    check: python3 scripts/plan_source_rename.py --selftest
    receipt: config/ingest_identity_gate.yaml#source_library
    cost_tier: T0
    owns:
      - scripts/census_source_names.py
      - scripts/plan_source_rename.py
      - scripts/plan_admission.py   # D-3051: the admission plan - what the pipeline has never seen, by the door own key
      - scripts/apply_admission.py  # T-183/D-3068: the APPLIER half - one crash-safe, plan-keyed, receipted writer
  # ── the tool-call emission instruments (T-213 / T-215 / BUG-951 / D-3200) ──
  #: WHY THIS CAPABILITY EXISTS (added 2026-10-27, MEASURED). These two instruments are the most active lane in the
  #: repo and NO capability owned them, so every task and bug about them resolved to no route: `resolve_route.py
  #: --check` listed T-217, T-218 and BUG-1084 among its unowned_artifact items while the instruments sat in
  #: scripts/ owned by nothing. That is a missing ROUTE, not prose that cannot be routed, and the SHRINK-ONLY ceiling
  #: could not be met by work on the items themselves.
  - id: loop_emission
    kind: script
    entrypoint: python3 scripts/harmony_red_loop.py --mode replay
    check: python3 scripts/harmony_red_loop.py --selftest
    receipt: governance/evidence/HARMONY_RED_LOOP_20261027_ALLOWANCE_2970_REPLAY.json
    cost_tier: T1
    owns: [scripts/harmony_red_loop.py, scripts/measure_subagent_loop.py, config/model_assignments.yaml,
           config/agent_context.yaml]
    # BUG-1091/D-3207: the turn budget, the transport slack and the measured decode/prefill readings are THIS
    # capability's subject matter, and NO capability owned agent_context.yaml - so every bug whose evidence
    # cites it was unroutable by construction. Declared here rather than in a new capability: one subject, and
    # the allowance is the thing this capability's own instrument prices.
    note: 'the T-213 emission gate and the T-199 loop battery share ONE engine witness (D-3200 clause 2); the role registry is owned here because the gate adjudicates the ROLE it names (D-3202) and BUG-1084 is about that registry holding a second home'
  - id: bug_recall
    kind: script
    entrypoint: python3 scripts/check_bug_recall.py
    check: python3 scripts/check_bug_recall.py --selftest
    receipt: config/bug_recall.yaml#ceilings
    cost_tier: T0
    owns: [scripts/check_bug_recall.py, config/bug_recall.yaml]

  # ── D-3078: THE ACQUISITION LANE — gap → manifest → bytes in the INBOX, and it stops at the pen ──
  - id: acquisition_lane
    kind: script
    entrypoint: python3 scripts/acquire.py status
    check: python3 scripts/acquire.py --selftest
    receipt: config/acquisition.yaml#pens
    cost_tier: T0
    owns:
      - scripts/acquire.py
      - pipeline/acquisition/
      - config/acquisition.yaml
    why: >-
      The lane has four acts (gap, map, fetch, status) behind one entry point. Its ONE write surface is the pen
      `education_inbox`, resolved from the ingest door's own placement declaration — it may not write
      `knowledge pipeline/books`, an .md, a signature or a conversion (D-3078). The selftest is the control: 31
      checks including a shadow rung that is unreachable without an owner word, a name that carries no
      door-refused marker, and a manifest row that must rebuild into a Candidate.

  #: D-3075 landed `scripts/container_alert.py` + `pipeline/container_integrity.py` and put the alert on the ladder,
  #: but neither the capability nor its probe module was ever declared here — so a rail that runs daily had no route,
  #: no owner and no cost, which is the exact blindness this registry exists to refuse (T-156). It WRITES NOTHING by
  #: design (a notify, never a mover), so its receipt is the declaration whose probes it reads, not an artifact.
  - id: container_alert
    kind: script
    entrypoint: python3 scripts/container_alert.py --brief
    check: python3 scripts/container_alert.py --selftest
    receipt: config/ingest_identity_gate.yaml#source_library
    cost_tier: T0
    owns:
      - scripts/container_alert.py
      - pipeline/container_integrity.py

  #: BUG-948/D-3112 — THE OWNER WORD INTAKE (T-129/T-130). scripts/owner_marks.py (render/check/apply/sign)
  #: turns the owner's word into a rendered sheet + signed receipt, reading config/owner_marks.yaml (vocabulary)
  #: and config/corroboration_collapse.yaml (rule), leaving the pair object + apply receipt behind. It was owned
  #: by NO capability, so a finding about it could not route (BUG-948) — the exact blindspot this registry exists
  #: to refuse (T-156). Declared 2026-10-19 so the fix task for BUG-948 has a capability to name.
  - id: owner_marks
    kind: script
    entrypoint: python3 scripts/owner_marks.py --check
    check: python3 scripts/owner_marks.py --selftest
    receipt: governance/owner_marks_receipt.json
    cost_tier: T0
    owns:
      - scripts/owner_marks.py
      - scripts/check_corroboration_collapse.py
      - config/owner_marks.yaml
      - config/corroboration_collapse.yaml
      - governance/owner_marks_receipt.json
      - governance/corroboration_collapse_pairs.json

# ─── THE OPERATOR LANES (T-164/BUG-837's disposition) ───
#: An operator lane is an entry point a HUMAN runs and that produces a READING or a STATE CHANGE, not a receipt —
#: which is why it is a LANE and not a capability: declaring it a capability would force a receipt field to be
#: filled with something invented. Each lane names its RECIPE, the exact COMMAND the recipe must still carry, and
#: what the operator gets. The reader checks all three: the recipe exists in the ladder file, the command is in
#: THAT recipe's body, and the command appears in NO governed recipe (if it did, it would be a ladder rail and its
#: guard class would belong in config/rail_registry.yaml#guards).
#
# These eight are the declarations that were appended at COLUMN 0 of config/rail_registry.yaml (BUG-837) and read
# by nothing. They are not deleted knowledge: they are re-homed here, where a reader checks them.
lanes:
  - recipe: research-selftest
    cmd: pipeline/research_run.py --selftest
    produces: reading
    capability: research_run
    why: 'the durable-research executor''s own known-answer controls, run by hand when a run is suspected'
  - recipe: research-status
    cmd: pipeline/research_run.py status
    produces: reading
    capability: research_run
    why: 'what the detached runs are doing RIGHT NOW - a run outlives the session that started it (D-3020)'
  - recipe: model-loadability
    cmd: python3 pipeline/model_loadability_probe.py
    produces: reading
    capability: model_fetch
    why: 'whether the engine can actually serve a candidate; 2 = the engine refused it (owner-owed, loud). BUG-842/T-146: declared in the INTERPRETER form because the file carries a shebang and is not executable - a bare path would need the exec bit, and a route that needs a mode is a route that breaks by accident'
  - recipe: engine-guard
    cmd: pipeline/omlx_engine_guard.sh
    produces: state
