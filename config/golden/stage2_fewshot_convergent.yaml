    '
- id: CONV-014
  domain: systems & frameworks
  discipline: systems thinking
  source_books:
  - Thinking in Systems — Donella Meadows
  - The Fifth Discipline — Peter Senge
  - Antifragile — Nassim Taleb
  cluster_segments:
  - source_book: Thinking in Systems — Donella Meadows
    text: 'Leverage points are places in a system where a small change can produce a large

      shift in behavior. The most powerful leverage points are not parameters (like tax

      rates) but the structure of information flows and the goals of the system itself.

      Changing the rules of the game has more leverage than changing the players.

      '
  - source_book: The Fifth Discipline — Peter Senge
    text: 'Systems thinking reveals that the most effective interventions often target the

      feedback loops and mental models that shape behavior, not the events themselves.

      ''Small changes can produce big results — but the areas of highest leverage are often

      the least obvious.''

      '
  - source_book: Antifragile — Nassim Taleb
    text: 'Systems that are robust to small perturbations fail catastrophically when exposed to

      rare events. Antifragile systems, by contrast, gain from disorder — they use

      optionality and redundancy to convert volatility into benefit. The location of the

      intervention matters more than its size.

      '
  is_convergent: true
  should_extract: true
  expected_fb:
    is_summary: false
    route: FB
    name: Structural Leverage
    definition: 'In any system, the highest-leverage interventions target structure (information

      flows, feedback loops, goals, and rules) rather than parameters (quantities, rates,

      stocks). A small structural change can produce outsized behavioral shifts, while

      large parameter changes often produce only marginal effects.

      '
    mechanism: 'Parameters are the weakest points because they merely scale existing dynamics.

      Information flows and feedback loops change the dynamics themselves — they alter how

      signals propagate through the system, which compounds across all downstream behavior.

      Goals are the most powerful because they redefine what the system optimizes for.

      '
    consequence: 'Systems interventions should be sequenced from structure-first to parameter-last:

      change the goal, change the information flows, change the feedback loops, then change

      parameters. This ordering maximizes the probability of durable system change.

      '
    boundary: 'Applies to complex adaptive systems with feedback. Fails when: (1) the system is

      linear and decoupled (parameter changes dominate); (2) stakeholders have veto power

      over structural change; (3) the system is too small for structural intervention to

      matter relative to noise.

      '
    evidence_passages:
    - places in a system where a small change can produce a large shift in behavior
    - the most effective interventions often target the feedback loops and mental models
    - The location of the intervention matters more than its size
    depth: universal
    evidence: cited
    jargon:
    - leverage point
    - feedback loop
    - mental model
    - antifragility
    keywords:
    - systems thinking
    - leverage
    - intervention
    - feedback
    application: Policy design, organizational change, software architecture, economics
    elaboration: 'Meadows ranked 12 leverage points from parameters (lowest) to paradigm shifts

      (highest). Senge''s ''small changes, big results'' formulation and Taleb''s

      antifragility both independently arrive at the same structural-vs-parametric

      distinction.'
    prerequisite_fbs:
    - 'LOOP-BASE-001: Feedback Loop Identification'
    contradicts_fbs:
    - 'PARAM-ONLY-001: Parameter Adjustment Sufficiency'
    related_fbs:
    - 'ANTIFRAG-001: Antifragility Through Optionality'
    - 'MODELL-001: Systems Modeling'
    procedural_skill: 'When planning any system intervention: (1) map the feedback loops; (2) identify the

      goal the system currently optimizes; (3) choose the highest-leverage structural point

      available; (4) predict second-order effects; (5) measure baseline before intervening.

      '
    failure_mode: 'Intervening at parameter level when the system is structurally misaligned produces

      ''fighting the last war'': the system compensates and returns to its prior behavior

      (homeostasis), making the intervention appear ineffective.

      '
    extraction_type: causal_mechanism
    content_type: principle
  rationale: 'Meadows, Senge, and Taleb converge on structural-vs-parametric leverage. Demonstrates

    Systems group, contradicts_fbs, related_fbs, procedural_skill.

    '
- id: CONV-015
  domain: computational art
  discipline: generative design
  source_books:
  - The Nature of Code — Daniel Shiffman
  - Generative Design — Benedikt Gross
  - A New Kind of Science — Stephen Wolfram
  cluster_segments:
  - source_book: The Nature of Code — Daniel Shiffman
    text: 'Complex behavior in natural systems often arises from simple rules repeated over

      many agents. Flocking emerges from three local rules: alignment, cohesion, and

      separation. No bird knows the flock''s global shape — it emerges from local

      interactions. This is the heart of generative art: design the rules, not the

      outcome.

      '
  - source_book: Generative Design — Benedikt Gross
    text: 'Generative design is not about coding a specific image but about coding a system

      that produces images. The designer''s role shifts from drawing the artifact to

      designing the rules and parameters that generate the artifact. Small rule changes

      produce vastly different outputs — the design space is explored computationally.

      '
  - source_book: A New Kind of Science — Stephen Wolfram
    text: 'Simple programs can produce behavior of great complexity. Wolfram''s cellular

      automata experiments show that a one-dimensional rule with three neighbors can

      produce patterns as complex as anything in nature. This suggests that complexity

      is not imported from outside but generated from within by simple rules.

      '
  is_convergent: true
  should_extract: true
  expected_fb:
    is_summary: false
    route: FB
    name: Emergent Complexity from Simple Rules
    definition: 'Complex, organic-looking systems and artifacts can be generated from simple local

      rules applied repeatedly. The creator controls the rules and parameters, not the

      final form; the form emerges from the interactions. This is the foundational

      principle of generative and computational art.

      '
    mechanism: 'Iterated local rules produce global patterns because each application of the rule

      propagates information through the system. In flocking, three local rules

      (alignment, cohesion, separation) produce coherent global motion; in cellular

      automata, simple update rules produce complex spatiotemporal patterns. Emergence

      requires iteration — one application is trivial, thousands produce complexity.

      '
    consequence: 'Designers can create systems whose output space is vastly larger than what they

      could specify by hand. The aesthetic value moves from the artifact to the rule set;

      ''interestingness'' becomes a property of the generative system, not individual

      outputs.

      '
    boundary: 'Applies when the system is iterated enough times for emergence to manifest and the

      rules are local (interactions are spatially or topologically nearby). Fails when:

      (1) rule application is too sparse to propagate; (2) rules are globally coupled

      (everything affects everything — no local structure); (3) the parameter space is

      not explored systematically.

      '
    evidence_passages:
    - 'Flocking emerges from three local rules: alignment, cohesion, and separation'
    - The designer's role shifts from drawing the artifact to designing the rules
    - Simple programs can produce behavior of great complexity
    depth: cross-domain
    evidence: cited
    jargon:
    - emergence
    - generative system
    - cellular automata
    - local rules
    keywords:
    - generative art
    - emergence
    - complexity
    - rules
    application: Generative art, procedural content generation, simulation, data art
    elaboration: 'The same principle underlies Conway''s Game of Life, reaction-diffusion systems,

      and L-systems — all generate complex forms from simple local rules.'
    prerequisite_fbs: []
    contradicts_fbs:
    - 'TOP-DOWN-001: Top-Down Design Control'
    related_fbs:
    - 'PATCH-001: Procedural Patterning'
    procedural_skill: 'When building a generative system: (1) define 3-7 simple local rules; (2) iterate

      the system many times; (3) map the parameter space; (4) curate outputs — not all

      emergent forms are interesting; (5) treat the rule set as the primary artifact.

      '
    failure_mode: 'If rules are too complex (many global conditions), emergence collapses into

      scripted behavior and the output space shrinks to the designer''s imagination —

      the generative advantage is lost.

      '
    extraction_type: causal_mechanism
    content_type: principle
  rationale: 'Shiffman, Gross, and Wolfram converge on emergence from simple rules. Demonstrates

    Computational Art group, contradicts_fbs, depth, procedural_skill.

    '
- id: CONV-016
  domain: illustration
  discipline: color theory
  source_books:
  - Interaction of Color — Josef Albers
  - Color and Light — James Gurney
  - The Elements of Color — Johannes Itten
  cluster_segments:
  - source_book: Interaction of Color — Josef Albers
    text: 'Colors are the most relative medium in art. A color''s appearance changes completely

      based on its neighbors. Restricting the palette to a few colors forces the artist to

      understand these relationships deeply — with fewer colors, each one must work harder

      and its interaction with others becomes the entire composition.

      '
  - source_book: Color and Light — James Gurney
    text: 'Professional illustrators often restrict their palette deliberately. A limited

      palette creates harmony because all colors share common pigment characteristics. The

      beginner''s urge to use every color available usually produces mud — too many hues

      competing creates visual noise rather than richness.

      '
  - source_book: The Elements of Color — Johannes Itten
    text: 'Color harmony is a matter of proportion and relationship, not the number of colors.

      Itten''s seven color contrasts show that even two colors can produce powerful effects

      when their relationship is understood — complementary contrast, simultaneous

      contrast, and warm-cool contrast all emerge from pairings, not palettes.

      '
  is_convergent: true
  should_extract: true
  expected_fb:
    is_summary: false
    route: FB
    name: Limited Palette Discipline
    definition: 'Restricting the color palette to a small set of deliberate colors (typically 2-5)

      produces more harmonious and powerful visual work than using a wide palette,

      because color harmony is a function of relationships and proportion, not quantity.

      '
    mechanism: 'With few colors, each color''s appearance is determined by its interaction with the

      others, forcing the artist to understand simultaneous contrast and relative

      appearance. Wide palettes dilute this understanding — every color is diluted by

      competing relationships, producing visual noise (mud).

      '
    consequence: 'Artists working within constraints produce more coherent work: the palette becomes

      a unifying element, and the limited vocabulary forces compositional clarity. This

      applies to illustration, UI design, branding, and data visualization.

      '
    boundary: 'Applies when the goal is harmony and coherence. Fails when: (1) the subject

      requires naturalistic color (photorealism) where wide gamut is necessary;

      (2) the palette is so limited it cannot represent required distinctions

      (colorblind-safe data viz needs distinguishable hues); (3) the artist lacks

      understanding of the colors chosen (limited palette without mastery = flat work).

      '
    evidence_passages:
    - Restricting the palette to a few colors forces the artist to understand these relationships deeply
    - The beginner's urge to use every color available usually produces mud
    - even two colors can produce powerful effects when their relationship is understood
