      it — and arrived late more often, not less.

      '
  - source_book: Thinking, Fast and Slow — Daniel Kahneman
    text: 'The planning fallacy describes the systematic tendency to underestimate the time, costs, and risks of future actions
      while overestimating their benefits. This pattern is remarkably robust: it appears in construction projects, software
      development, home renovations, and even academic estimates of task completion time. The error is not random — it''s
      systematically optimistic. The inside view (focusing on the specific case) consistently beats the outside view (looking
      at base rates of similar cases) in people''s intuitive forecasts.

      '
  is_convergent: false
  should_extract: true
  expected_fb:
  - is_summary: false
    route: FB
    name: Incentive Frame Displacement — When Fines Backfire
    definition: Introducing an extrinsic incentive (money, penalty, reward) can backfire when it reframes an intrinsically
      motivated behavior as a market transaction. The new frame displaces the original motivation — guilt becomes price, passion
      becomes paid labor — and behavior shifts opposite to what the incentive intended.
    mechanism: 'When a behavior is governed by social/moral norms (guilt, duty, passion), adding a monetary incentive reframes
      it as a market exchange. People then optimize the market exchange — they pay the fine and arrive late, they work for
      the money and stop when it stops, they calculate costs instead of honoring obligations. The pattern is: incentive introduction
      → frame shift → behavior inversion.'
    boundary: 'Applies when: (1) the original behavior is intrinsically or socially motivated; (2) the extrinsic incentive
      is small enough to reframe but not large enough to dominate. Fails when: (1) no intrinsic motivation exists; (2) the
      incentive is so large it overwhelms the frame shift; (3) the behavior is already framed as a market transaction.'
    consequence: Well-intentioned incentive programs — fines, bonuses, pay-for-performance — can destroy the very motivation
      they aim to strengthen, producing worse outcomes than doing nothing.
    extraction_type: empirical_pattern
    content_type: principle
    depth: domain
    evidence_passages:
    - When a day-care center in Israel started fining parents who arrived late to pick up their children, late arrivals INCREASED
      rather than decreased.
    - The fine replaced a moral obligation (guilt about keeping teachers waiting) with a market transaction (paying for extended
      care).
  - is_summary: false
    route: FB
    name: Planning Fallacy — Systematic Optimism Bias
    definition: The planning fallacy is the systematic tendency to underestimate the time, costs, and risks of future actions
      while overestimating their benefits. This error is not random — it is consistently optimistic across domains from construction
      to software to personal tasks.
    mechanism: People adopt an inside view — focusing on the specific case, constructing a narrative of success — rather than
      the outside view that uses base rates of similar prior cases. The inside view consistently beats the outside view in
      intuitive forecasts, producing optimistic predictions that ignore distributional information from comparable projects.
    boundary: 'Applies when people estimate complex future tasks under uncertainty. Fails when: (1) the task is a routine,
      well-calibrated activity; (2) explicit base-rate data is salient and forced into consideration; (3) accountability mechanisms
      require outside-view referencing.'
    consequence: Large infrastructure projects, software development, and personal task planning systematically overrun budgets
      and timelines by 50-100% or more, despite repeated past experience.
    extraction_type: empirical_pattern
    content_type: principle
    depth: domain
    evidence_passages:
    - The planning fallacy describes the systematic tendency to underestimate the time, costs, and risks
    - The inside view (focusing on the specific case) consistently beats the outside view (looking at base rates of similar
      cases) in people's intuitive forecasts.
  rationale: '1:N SPLIT — Incentive frame displacement (Freakonomics: day-care fines backfire) and the planning fallacy (Kahneman:
    systematic optimism bias) are two INDEPENDENT empirical patterns. They share only the topic ''when predictions fail''
    — no shared causal structure. Like CONV-037, teaches S2 to split multi-source clusters when mechanisms differ. is_convergent=false
    despite 2 books.'
- id: CONV-040
  domain: typography
  discipline: graphic design
  source_books:
  - About Face — Alan Cooper
  - Generative Design — Benedikt Gross
  cluster_segments:
  - source_book: About Face — Alan Cooper
    text: 'Typography in user interfaces serves two masters: readability and hierarchy. Font size, weight, spacing, and color
      create an information hierarchy that guides the user''s attention. Body text at 14-16px with a line height of 1.5 is
      optimal for reading on screens. But the real craft is in the subtle adjustments — kerning pairs (adjusting space between
      specific letter combinations like ''AV'' and ''To''), tracking (uniform letter-spacing across a word), and leading (line
      spacing) — that transform legible text into polished, professional typography.

      '
  - source_book: Generative Design — Benedikt Gross
    text: 'In computational typography, letterform spacing can be defined algorithmically rather than manually. Each glyph
      has a bounding box and sidebearings (left and right margins) that determine default spacing. Kerning exceptions override
      these defaults for specific letter pairs where the default spacing creates optical gaps — classic examples include ''AV,''
      ''WA,'' ''To,'' and ''Ve.'' In variable fonts, these spacing parameters become axes that can be interpolated continuously,
      allowing responsive typography that adapts to screen size and reading distance.

      '
  is_convergent: true
  should_extract: true
  expected_fb:
    is_summary: false
    route: FB
    name: Optical Kerning Adjustment
    definition: Specific letter pair combinations (AV, WA, To, Ve) require custom spacing overrides because the default sidebearing
      spacing creates optical gaps. Kerning pairs are hand-tuned or algorithmically defined exceptions to standard letter
      spacing that make text appear evenly spaced to the human eye, even when geometric spacing between bounding boxes is
      unequal.
    mechanism: The human eye perceives spacing between letters optically, not geometrically. Two letters with diagonal strokes
      (A and V) create a triangular gap that appears larger than the rectangular gap between straight-sided letters (H and
      I) at the same geometric distance. Kerning corrects this by reducing the space for diagonal-adjacent pairs and increasing
      it where strokes nearly touch. The adjustment is pair-specific and perceptually driven — there is no universal formula,
      only perceptual judgment refined by tradition.
    boundary: 'Applies specifically to Latin-script typography where letters are spaced side-by-side. Fails for: (1) monospaced
      fonts where all characters occupy equal width (kerning is disabled by design); (2) scripts where character spacing follows
      different rules (Arabic cursive connections, CJK ideographic squares); (3) purely geometric typefaces where optical
      correction is deliberately rejected as part of the design philosophy.'
    consequence: Well-kerned text is processed faster and perceived as more professional than unkerned text at the same content
      and layout. The difference is often unconscious — readers sense something is 'off' without identifying the cause. For
      body text, automatic kerning (metric or optical) is sufficient; for headlines, logos, and display text, manual kerning
      pair adjustment is standard practice.
    evidence_passages:
    - kerning pairs (adjusting space between specific letter combinations like 'AV' and 'To')
    - Kerning exceptions override these defaults for specific letter pairs
    - classic examples include 'AV,' 'WA,' 'To,' and 'Ve.'
    extraction_type: causal_mechanism
    content_type: principle
    depth: specialized
  rationale: 'GENUINE SPECIALIZED POSITIVE (D2226). Optical kerning is a narrow sub-technique within typography, which is
    itself a sub-field of graphic design. It passes the specialization test: most practitioners IN the parent domain (graphic
    design) would understand this, but it requires typography-specific knowledge. It is tool-adjacent (applies to any vector
    design software with kerning controls) but specialized enough that a general ''design principles'' book would not cover
    it. Essential for teaching S2 and S4 that valid principles exist at narrow, tool-bound scope with depth=''specialized''.
    D2226: this fills the missing specialized positive gap identified in the Kimi audit.'
