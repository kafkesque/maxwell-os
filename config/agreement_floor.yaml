# agreement_floor.yaml - the CHANCE-CORRECTED inter-rater agreement floor (OWNER-RULED 2026-09-25).
#
# WHY A NEW FILE: config/eval_integrity.yaml is not digest-pinned, but it IS named as a declared input in
# places; adding a gate there risks tripping a declared-input fingerprint (C-3) for a value that has nothing
# to do with that file's subject. A floor that cannot move anything else is cheaper to trust.
#
# OWNER RULING (2026-09-25): "alpha floor - whichever is better/more accurate, approve."
# THE DETERMINATION, and why it is NOT one number:
#   There is no universally valid alpha threshold; what exists is Krippendorff's own published convention,
#   and the accurate implementation of a convention is to state WHICH conclusion each band licenses:
#     0.800  reliable         - required for anything LOAD-BEARING (a value that changes the anchor, a gate,
#                               a published rate, an admission rule). Below this the number is context only.
#     0.667  tentative        - reportable as a finding; licences NO decision, no gate, no anchor edit.
#   Declaring only 0.667 would licence a decision on a tentative number. Declaring only 0.800 would discard
#   real signal. Declaring BOTH, with the operative one named, is the accurate choice.
#
# THE RULE THAT MATTERS MORE THAN THE NUMBER: this file is written BEFORE the raters run. A floor chosen
# after seeing the result is not a floor, it is a description. Do not edit this file after a score exists
# without a new owner ruling and a new decision id.
schema_version: '1.0'
authority: 'OWNER-RULED 2026-09-25 (decision id pending; config-first per C12, owner gate per C22)'
statistic: krippendorff_alpha          # NOT raw agreement, NOT pairwise kappa
missing_cells: capable                 # alpha tolerates a rater who skipped a row; raw agreement cannot
reporting_floor: 0.667                 # Krippendorff (2004): tentative conclusions only
operative_floor: 0.800                 # reliable: the only floor that may gate or change anything
bands:
  below_reporting: 'not a measurement of agreement - report the disagreement, decide nothing'
  reporting_to_operative: 'reportable finding; licenses NO gate, NO anchor edit, NO admission rule'
  at_or_above_operative: 'reliable; may be cited as an agreement figure and may gate a decision'
applies_to:
  - extraction_type_panel      # human + Claude + Kimi + DeepSeek + Qwen3.8 (only if all 4 are run)
  - claim_shape_instrument     # the claim bit instrument (NOT the FORM axis - see C21)
  - depth_axis_panel           # BUG-462 / D-391: the blindly coded depth panel (4 coders vs the owner pass)
                               # DECLARED 2026-09-25 BEFORE any depth alpha was computed, so the floor was
                               # not chosen after seeing the result. The depth PANEL predates this file;
                               # the FLOOR VALUE is Krippendorff's published convention and was not tuned
                               # to the depth data. A score below it is a finding, not a verdict.

# ── Panels (D-391): what a panel IS, so the statistic has exactly one reading ───────────────────────
panels:
  depth_axis_panel:
    unit_of_analysis: the anchor row (item_id)
    # The three blind LLM coders + the owner's INDEPENDENT blind pass (2026-09-24 drop-in).
    # `depth_final` is deliberately NOT a rater: the owner adjudicated WITH the coder columns in
    # view, so scoring the adjudicated answer against the panel would be circular.
    rater_columns:
      - Qwen3.8-27B-MLX-4bit_depth
      - claude-sonnet-5_depth
      - deepseek-v4-pro_depth
      - kimi_depth
      - owner_depth            # the human reading: blind, write-locked, independent of the panel
    human_column: owner_depth
    metrics: [nominal, ordinal]   # depth is an ORDERED menu; ordinal is reported beside nominal
    abstention_tokens: [none_fits]  # a declared menu refusal is an ABSENT cell, never a class
    exclusions: [carry_forward, axis_exempt, absent]   # each set read from the artifact that OWNS it
    consumer: scripts/depth_pass_agreement.py
    # BUG-476 (2026-09-25): a DECLARATION is not a measurement. On the 148 measured rows the two columns
    # below hold ZERO depth cells each (both hold 148/148 on the DOMAIN axis), so the figure this floor gates
    # was a 3-rater figure read under a 5-rater label. Written HERE so the gap is a declared state rather
    # than an empty column no statistic can distinguish from a rater who skipped a few rows.
    # `declared_not_run` is NOT a deletion: the rater stays in the panel and in every count, and
    # scripts/depth_pass_agreement.py --report-only prints it while --gate fails on it.
    rater_status:
      claude-sonnet-5_depth: run
      kimi_depth: run
      owner_depth: run
      Qwen3.8-27B-MLX-4bit_depth: declared_not_run
      deepseek-v4-pro_depth: declared_not_run
    rater_status_note: >
      rerun_condition: a column becomes `run` when its blind pass is ingested through
      scripts/ingest_panel_column.py - NOT through scripts/cross_examine_anchor_axes.py, which rebuilds the
      workbook from the dispute set and blanks the owner's cells (BUG-478, measured 2026-09-25).
    # The declared writer for a rater column: one target column per coder tag, and the ingest refuses any
    # change outside it. Filling a panel may never edit the gold (the anti-BUG-478 rail).
    ingest:
      workbook: governance/anchor_adjudication_workbook_20260924.csv
      id_column: item_id
      writer: scripts/ingest_panel_column.py
      column_by_coder:
        raw_qwen38: Qwen3.8-27B-MLX-4bit_depth
        raw_deepseek: deepseek-v4-pro_depth
      refuse_overwrite: true
must_not_be_cited_as:
  - governance/F11_ANCHOR_REVIEW_20260923.csv#form_agree   # that column is RAW agreement on a skewed 4-class
                                                          # marginal with no chance correction (BUG-452)
pairwise_kappa_note: >
  Pairwise kappa is not a substitute: it silently drops rows a rater skipped and treats 'which two raters'
  as a free choice, so the highest pair can be reported. Alpha is the only one of the three that is
  missing-cell capable and single-valued.
