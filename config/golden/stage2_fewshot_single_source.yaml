    text: "Pilots remember critical information using three techniques: first they write it down, second they enter it into their equipment as it is read so minimal memory is required, and third they remember selectively, holding only the few items needed in the next few minutes."
  is_convergent: false
  should_extract: true
  expected_fb:
    is_summary: false
    route: FB
    name: Pilot Memory Protocol
    definition: "A repeatable three-step method for managing critical information: write it down, enter it into equipment as read, and remember selectively only what is needed in the next few minutes."
    mechanism: "Externalizing information to paper and equipment offloads memory, while selective retention limits the remaining load to the few items immediately needed."
    boundary: "Applies when a person must retain many critical items under time pressure. Fails when the items cannot be externalized or must all be held simultaneously."
    consequence: "Practitioners who externalize and remember selectively retain critical information more reliably than those who try to hold everything in mind."
    elaboration: ""
    extraction_type: normative_heuristic
    content_type: process_template
    trigger: "When a person must retain many critical items under time pressure"
    prerequisite: ""
    steps:
    - "Write down the critical information"
    - "Enter it into equipment as it is read, minimizing memory load"
    - "Remember selectively — hold only the few items needed in the next few minutes"
    done_condition: "All critical information is externalized and only the immediately-needed items are held in memory"
    failure_mode: "Fails when the items cannot be externalized or must all be held simultaneously"
    evidence_passages:
    - "Pilots remember critical information using three techniques: first they write it down, second they enter it into their equipment, and third they remember selectively."
  rationale: "A repeatable human how-to method with ordered steps a person follows. content_type=process_template (NOT principle, NOT tool_instruction)."
  tier: CORE

