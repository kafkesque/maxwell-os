- id: D-399
  category: VERIFICATION/INSTRUMENT
  state: RESOLVED
  title: "The CLAIM-SHAPE gate is a perfect screen and a weak classifier: 10/11 -> class-1 admission stays UN-GATED"
  decision: >
    MEASURED blind with a NON-AUTHOR elicitor (Qwen3.8-27B-MLX-4bit, item_id withheld, declared rule
    q1&q2&q3 declared BEFORE the score): negatives rejected 7/7, false positives 0, candidates admitted 3/4
    (U002 missed, q1=0); the q4 variant gives the same 3/4. D-395's bar (7/7 AND 4/4) is NOT met, so
    scripts/score_claim_shape_gate.py exits 1 and NO gate is shipped. STRUCTURAL DEFECT found: q3 (boundary)
    is 1 on 11/11 - a CONSTANT on this cohort, contributing nothing to the conjunction; only q1 (4/11) and
    q2 (3/11) discriminate. CONSEQUENCE: class-1 admission remains un-gated; the screen (0 false positives)
    may still be used to REJECT, never to ADMIT, until a second elicitor reproduces it. The instrument is
    NOT wired into `just health` while it is unanswered-or-failing by design.
  evidence: "receipt governance/frontier_pack_20260924/CLAIM_SHAPE_ELICITED_Qwen3.8-27B-MLX-4bit.csv"

- id: D-400
  category: VERIFICATION/INSTRUMENT
  state: PROPOSED
  date: '2026-09-25'
  title: 'No instrument may decide until it has a confusion matrix on a sealed known-answer control'
  decision: >
    Generalises D-374 from ONE check to EVERY instrument that decides: a gate, a classifier, a head or a
    threshold may not rule on production data until its error has been measured against a SEALED control
    whose answer is known and unavailable to the builder. Driver (RC-5): seven instruments were shipped this
    month whose error had never been measured on a control, so an instrument's confidence in itself was the
    only evidence of its quality (BUG-480: a perfect screen measured at 10/11; the depth head at n=2).
    OWED: the depth head, the CLAIM-SHAPE gate, the S4 classifier and the depth instrument each need a sealed
    control sheet with a stated confusion matrix before they may gate anything.
  files:
  - config/eval_integrity.yaml
  - config/claim_shape_instrument.yaml
- id: D-401
  category: GOVERNANCE/DATA-INTEGRITY
  state: ACTIVE
  date: '2026-09-25'
  title: 'Every artifact has a declared owner-of-record, and a writer may not change a cell it does not own'
  decision: >
    The RC-1 gate. config/artifact_ownership.yaml declares, per artifact, the mutability class
    (immutable / append_only / derived_regenerable / human_authored), the id column, the owner cells, the
    writer_of_record and any machine writer forbidden. scripts/lib/write_guard.py is the ONLY sanctioned way
    to write an artifact holding cells you do not own: it backs the file up byte-exact, REFUSES if any
    non-owned cell would change (nothing is written), writes via tempfile -> fsync -> os.replace (C6),
    re-measures after the write and appends a mutation record to governance/MUTATION_JOURNAL.jsonl.
    OWNED_ANY ('*') permits a whole-file regeneration but must be EXPLICIT, never a default. Its self-test
    asserts four invariants and is wired into `just health`. Driver: BUG-478 (a panel ingester blanked 148
    owner cells) and 156 of 274 scripts holding a 'w' write with no declared ownership.
  files:
  - config/artifact_ownership.yaml
  - scripts/lib/write_guard.py
  - governance/MUTATION_JOURNAL.jsonl
- id: D-402
  category: GOVERNANCE/VERIFICATION
  state: ACTIVE
  date: '2026-09-25'
  title: 'A rail may not take its evidence from the same source as the artifact it checks'
  decision: >
    The RC-3 gate. A check whose evidence is re-derived by the same code (or the same file) that produced the
    artifact can only ever certify the producer, never the artifact: scripts/check_bug_status.py re-derives
    from the same headers as governance/bug_status.json, so it could not see BUG-481 (8 bugs closed in prose
    and still counted OPEN); /compact re-derives nothing. Every rail must therefore name its evidence source
    and, where the artifact and the evidence share a source, an INDEPENDENT second oracle must exist.
    Mechanism in force: scripts/reconcile.py re-derives each fact from the DECLARATION and the ARTIFACT
    independently and never reads another rail's output. OWED: an audit of the pre-existing verify_* rails
    for shared-source evidence, recorded rail by rail.
  files:
  - scripts/reconcile.py
  - scripts/check_register_divergence.py
- id: D-403
  category: PIPELINE/PROVENANCE
  state: PROPOSED
  date: '2026-09-25'
  title: 'Stage handoffs are content-addressed; a hash claim never points at a mutable path'
  decision: >
    The RC-2/BUG-376 gate. A stage that declares an input path cannot prove WHICH bytes it consumed, so a
    producer that rewrites that path after the run invalidates every downstream claim without any transaction
    failing (BUG-376: the t11 checkpoint_enriched.jsonl was rewritten after the S5 run and the verified image
    no longer exists; BUG-341/BUG-433 are the same class). Handoffs are therefore RECEIPTS: input digests,
    output digest, code_sha and stamp recorded at run time, so `verify` compares bytes, not paths.
    Mechanism: scripts/lib/handoff.py + config/handoffs.yaml + governance/HANDOFFS.jsonl.
  files:
  - scripts/lib/handoff.py
  - config/handoffs.yaml
  - governance/HANDOFFS.jsonl
- id: D-404
  category: VERIFICATION/INSTRUMENT
  state: ACTIVE
  date: '2026-09-25'
  title: 'No number without its ruler: every emitted metric carries population, denominator, ruler_sha and code_sha'
  decision: >
    A number that travels without the population it was measured on, the denominator it was divided by, the
    ruler that produced it and the code that ran is not a measurement (BUG-391 class). scripts/lib/measure.py
    is the only sanctioned way to publish a number: emit_metric FAILS CLOSED when population or denominator is
    absent, stamps code_sha (git rev + dirty flag) and appends the envelope to governance/METRICS.jsonl;
    `--gaps` audits the stored set for envelopes that lost a field. Driver: the agreement floor (0.667/0.800)
    quoted against panels of three different populations (148 / 144 / 116) with the ruler named only in prose.
  files:
  - scripts/lib/measure.py
  - governance/METRICS.jsonl
- id: D-405
  category: GOVERNANCE/VERIFICATION
  state: ACTIVE
  date: '2026-09-25'
  title: 'One reconciliation engine: one command answers where a declaration disagrees with reality'
  decision: >
    The RC-2 gate. ~30 verify_* scripts each checked one declaration against one artifact, ad hoc, and each
    had to be REMEMBERED - which is why one class (declaration diverges from reality) arrived 30 times under
    30 names (BUG-462/463/466/476/450/468/455/456/412). scripts/reconcile.py + config/reconciliation.yaml
    evaluate every declared object in one pass, each entry naming its declaration, its artifact and its check
    kind; an UNDECLARED check kind is a hard failure, never a silent pass. Two meta-checks are mandatory:
    `reach` (every check_*/verify_* that declares a contract must be invoked by a recipe - BUG-482) and
    `cover` (every artifact in artifact_ownership.yaml must have an entry or an unreconciled_reason). Tri-state
    exit: 0 ok, 1 drift, 2 owner-owed (loud, not fatal - BUG-457).
  files:
  - scripts/reconcile.py
  - config/reconciliation.yaml
  - governance/RECONCILIATION.json
- id: D-2637
  state: RESOLVED
  category: GOVERNANCE/VERIFICATION
  title: "A resolver declares and publishes its resolution domain, and a finding may not name an artifact defective without naming what was searched"
  decision: >-
    Minted 2026-09-25 to separate TWO rules that one id was carrying. (1) THIS rule: config/resolution_domains.yaml
    is the ONE declared home of what each resolver resolved an identifier AGAINST; scripts/lib/measure.py refuses a
    declared resolver metric with no domain block; scripts/reconcile.py joins the declaration to the rail; and a
    finding may not name an artifact defective without printing the domain it searched (BUG-488/BUG-489: resolving
    a digest against live paths only made a SUPERSEDED revision read as "resolves to nothing"). Every rail that
    publishes a domain stamps `decided: D-2637` and prints its domain beside its rows. (2) D-405 remains the
    SEPARATE rule it was minted for - the declaration-to-reality JOIN (config/reconciliation.yaml, scripts/
    reconcile.py): a declaration and reality are joined in one place, or the join is owed. The overload was
    invisible because a stamp is a bare id: config/resolution_domains.yaml stamped D-405 while D-405's subject was
    the join. D-405's record is NOT edited (records are append-only). NAME-SPACE RULE: one id, one subject; if two
    rules need one id, the id is not yet minted.
  date: "2026-09-25"
- id: D-2638
  category: GOVERNANCE/VERIFICATION
  state: ACTIVE
  date: '2026-09-25'
  title: 'A declaration pointer that resolves to nothing is a broken rail, never a pending ruling'
  context: >
    BUG-501. config/reconciliation.yaml#depth_workbook_row_count declared a key that was never written anywhere
    (config/agreement_floor.yaml#panels.depth_axis_panel.rows_declared) while the rule it was waiting for had
    already been ruled (D-393) and the declaration had MOVED to config/cohort_declaration.yaml, where a
    consumer already verified it. The engine reported its own dangling pointer as owner-owed debt, so a ruled
    rule printed as a pending one for a day and the message ('until the rule is ruled') misdirected the reader.
  decision: >
    The reconciliation engine must separate THREE states it had been collapsing into one verdict: a declaration
    whose pointer DOES NOT RESOLVE is DRIFT (a broken rail - the declaration moved and nobody repointed the
    entry), a declaration of the wrong SHAPE is DRIFT, and only a declared value that MISMATCHES reality may be
    owner-owed. `optional: true` may downgrade a mismatch to a pending ruling; it may never launder a pointer
    that resolves to nothing. Companion rule from the same fix: a denominator that is only COMPUTED cannot
    disagree with anything, so a cohort's measured count must be DECLARED and asserted against the artifact
    (two independent oracles, D-402), never merely derived at run time.
  authority: "assistant + senior-RAG (both: a rail may not be silent about its own brokenness)"
  files: [scripts/reconcile.py, config/reconciliation.yaml, config/cohort_declaration.yaml, scripts/depth_pass_agreement.py]
  evidence: >
    Fixed and measured 2026-09-25: 5/5 known-answer controls fire through the same classifier (dangling ->
    drift, optional cannot launder, wrong shape -> drift, 150 vs 148 -> drift, real entry -> ok); reconcile
