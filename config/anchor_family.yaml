#
# WHY THIS FILE EXISTS
#   On 2026-09-24 the owner asked twice whether the anchor family contains the domain axis, and
#   then could not find the frozen anchor at all. A registry that lists only what a family OWNS
#   cannot answer "does it include axis X?", and prose cannot be checked (BUG-416/BUG-424/BUG-425).
#   So: EVERY axis is declared here, either `owned` by an artifact of this family or `disowned`
#   with the cohort it actually comes from plus the MEASURED intersection with the 150 anchor rows.
#
# NO VALUE IN THIS FILE IS HAND-TRUSTED
#   `scripts/verify_anchor_family_registry.py` re-derives every count below from the artifacts
#   themselves and exits 1 naming the field on any disagreement. It runs in `just health`.
#   Regenerate with: python3 scripts/verify_anchor_family_registry.py --print-config
#
# Reading rule: when asked "did you include axis X?" read THIS file — never an artifact's own
# derived or copied column (that mistake is BUG-422).

