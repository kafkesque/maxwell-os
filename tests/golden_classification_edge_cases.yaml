- id: L02_baseline_software_engineering
  description: Clear software engineering FB
  fb_name: Immutable Infrastructure Deployment
  fb_definition: Servers and infrastructure components should be replaced rather than updated in-place. Immutable deployments
    eliminate configuration drift, ensure reproducibility, and enable instant rollback by keeping previous versions available.
    This principle underpins container orchestration and infrastructure-as-code practices.
  expected_output:
    application: Use Docker images with versioned tags and Terraform state files to define infrastructure. Never SSH into
      production servers — if a configuration change is needed, update the image/template and redeploy the entire stack.
    failure_mode: Teams apply hotfixes directly to production servers during incidents, creating configuration drift that
      makes future deployments unpredictable and rollback impossible.
    elaboration: 'Mutable infrastructure accumulates ''snowflake servers'' — unique configurations that only one person understands.
      When that person leaves, the server becomes a black box. Immutable infrastructure treats servers as cattle, not pets:
      when one is sick, you replace it, not nurse it.'
    keywords: immutable, idempotent, declarative, container orchestration, infrastructure-as-code, cattle not pets
    jargon: 'Immutable infrastructure: Servers replaced rather than updated, preventing configuration drift. Container orchestration:
      Automated deployment, scaling, and management of containerized applications.'
