    is_summary: false
    route: FB
    name: Johari Window — Interpersonal Awareness Matrix
    definition: 'Interpersonal awareness is structured as a 2×2 matrix: what is known to self vs. unknown to self, crossed
      with what is known to others vs. unknown to others. This yields four quadrants — open (known to both), blind (known
      to others only), hidden (known to self only), and unknown (known to neither). A descriptive model of self-awareness
      and mutual knowledge in relationships.'
    mechanism: This is a DESCRIPTIVE MODEL — a classification system for interpersonal knowledge states. It categorizes information
      about a person into four quadrants based on two binary dimensions (self-knowledge × other-knowledge). Goleman describes
      the blind quadrant through emotional intelligence (feedback reduces blind spots), while Brown describes the hidden quadrant
      through vulnerability research (appropriate disclosure builds connection). The model does not explain WHY any particular
      information falls into a given quadrant — it provides the vocabulary and structure for discussing awareness gaps.
    boundary: 'Applies to dyadic and small-group relationships where mutual knowledge is relevant. Fails for: (1) anonymous
      or one-way relationships where ''known to others'' is meaningless; (2) situations where power dynamics make honest disclosure
      unsafe; (3) the unknown quadrant — by definition, its contents are inaccessible. The model is a thinking tool, not a
      measurement instrument — quadrant boundaries are fuzzy in practice.'
    consequence: 'The model implies that relationship depth is a function of expanding the open quadrant: self-disclosure
      shrinks the hidden area, feedback shrinks the blind area, and shared discovery shrinks the unknown area. Leaders with
      large blind spots make decisions that ignore their impact on others. Individuals who never disclose (large hidden self)
      cannot form deep connections. The Johari Window provides the vocabulary for diagnosing interpersonal stuckness.'
    evidence_passages:
    - there are things about ourselves that others see clearly and we do not
    - Reducing the blind self through feedback is one of the highest-leverage activities in personal development
    - Not everything about yourself belongs in every relationship — there is a healthy 'hidden self'
    - The boundary between privacy (healthy hidden self) and shame (unhealthy hidden self) is defined by whether concealment
      serves connection or disconnection
    extraction_type: descriptive_model
