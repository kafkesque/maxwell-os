    cap, never hardcode) for D-293 MTP tuning; re-open A/B only if a Qwen3-Coder/gpt-oss DSpark/DFlash
    drafter ships. NO SWAP, NO INTEGRATION: oMLX 0.7 already ships lossless speculative decode (MTP) and is
    the only engine serving Maxwell's catalog on Metal 3. Artifact governance/MARKET_RESEARCH_20260922.md.
