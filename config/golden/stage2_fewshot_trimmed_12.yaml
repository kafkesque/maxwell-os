    text: 'A sign, or representamen, is something which stands to somebody for something in some respect or capacity. It addresses
      somebody, that is, creates in the mind of that person an equivalent sign, or perhaps a more developed sign. That sign
      which it creates I call the interpretant of the first sign. I define three trichotomies of signs: qualisign/sinsign/legisign,
      icon/index/symbol, and rheme/dicisign/argument.

      '
  - source_book: 'Semiotics: The Basics — Daniel Chandler'
    text: 'Peirce offered a triad of basic sign types: the icon (which resembles its referent, like a photograph), the index
      (which is directly connected in some way to its referent, like smoke indicating fire), and the symbol (which has an
      arbitrary or conventional relationship to its referent, like most words in language). These three categories classify
      signs by their mode of reference, not by what they mean.

      '
