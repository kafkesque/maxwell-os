- id: 3bdf9a39e5030843e40921a4565a38cfb3603435f8052a8b1c3e69694c325562
  input_fb:
    name: Metaphorical Reasoning in Communication
    definition: Metaphors function as cognitive tools that make abstract or complex
      ideas more accessible by mapping familiar concepts onto unfamiliar domains.
      They enable communication of nuanced ideas through vivid, relatable comparisons
      that resonate with shared experience.
    mechanism: Metaphors work by creating analogical bridges between known and unknown
      domains, leveraging existing mental models to explain new situations. The effectiveness
      of a metaphor depends on its relevance to the audience's prior knowledge and
      emotional resonance. When metaphors align with intuitive understanding, they
      reduce cognitive load and increase comprehension. The strength of a metaphor
      lies in its ability to capture key structural or functional similarities between
      domains without requiring deep domain expertise.
    boundary: Applies when the comparison domain is sufficiently familiar to the audience
      and the analogy highlights relevant features of the target concept. Fails when
      the metaphor is obscure, irrelevant, or misaligned with the audience's mental
      models. Also fails when the metaphor introduces misleading associations or oversimplifies
