  golden_inject_enabled: true
  golden_seed: 42
  golden_single_source_path: config/golden/stage2_fewshot_single_source.yaml
  golden_single_source_inject_enabled: true
  golden_single_source_negative: 7
  golden_single_source_max: 21
  split_probe_enabled: true
  split_probe_min_size: 20
  split_probe_max_cohesion: 0.85
  gate_enabled: true
  gate_strict: true
  evidence_tracking: true
  high_cohesion_threshold: 0.9
  med_cohesion_threshold: 0.75
  source_book_match: exact
  max_cluster_samples: 5
  max_probe_samples: 8
  max_probe_per_book: 2
  split_probe_kmeans_random_state: 42
  omlx_retry_attempts: 2
  accept_conditional_within_tolerance: true   # BUG-609: advance to S4 when failed/total ≤ max_failed_ratio (deterministic schema failures never clear on re-run → would loop forever)
  gen_max_tokens: 3072
  gen_max_tokens_retry: 4096
  batch_position_monitor: false
  max_workers: 3
  singleton_batch_size: 4
  singleton_batch_max_tokens_per_item: 1000
  singleton_prefilter_enabled: true
  route_values:
  - FB
  - 'NULL'
  max_failed_ratio: 0.01
  gated_seed_marker: summary gated
  gated_seed_id_regex: cluster_\d+(_s\d+)?(_sub\d+)?
  extraction_type_dominance_warn_ratio: 0.95
  relabel_max_workers: 4
  relabel_cross_family_model: gpt-oss-20b-MXFP4-Q8
  # BUG-263 (2026-09-17): OUTPUT budget for the FORM judge. call_omlx_json() returns []
  # (not an error) when the response is unparseable, and a Harmony reasoning model
  # (gpt-oss) spends its whole budget on the reasoning pass BEFORE emitting content.
  # Measured on one live record: max_tokens=64 -> content 0c; 256 -> 0c; 1024 -> 29-42c, JSON parses.
  # The old hardcoded 64 guaranteed zero labels from the cross-family judge while the run
  # still reported 'done'. 1024 is the smallest measured budget that yields content.
  relabel_judge_max_tokens: 1024
  relabel_judge_min_content_chars: 2
  relabel_apply_reasoning_off_prefix: true
  relabel_report_dir: governance
  fingerprint_files:
    - pipeline/stage2_extract.py
    - pipeline/io_guard.py
watchdog:
  interval_secs: 60
  stall_checks: 3
  causal_warn_ratio: 0.5
  causal_halt_ratio: 0.9
stage4:
  # D-325 (2026-09-21): ruled boundary discriminators, D-318 byte-compared in the run path
  # BUG-374/C-2 (fixed 2026-09-23): D-327 ruled the boundary block REJECTED on measurement
  # ('set back to false') but the flip never landed; the rejected experiment ran live 2 days.
  boundary_inject_enabled: false
  boundary_path: config/boundary_discriminators.yaml
  process_template_output: process_templates.jsonl
  process_instance_output: process_instances.jsonl
  growth_edge_output: growth_edges.jsonl
  tool_instruction_output: tool_instructions.jsonl
  quarantine_output: quarantined.jsonl
  max_principles_per_cluster: 25
  dedup_cosine_threshold: 0.92
  # BUG-614 (D-2806): config-owned S4 code-fingerprint source list (C12), mirroring
  # stage5.fingerprint_files (D-330). The S4 routing/classification modules + the
  # content-type axis config determine S4 output; ANY edit (committed or not)
  # invalidates the S4 checkpoint fail-closed via stamp.stage_code_fingerprint("stage4").
  fingerprint_files:
    - pipeline/stage4_merge.py
    - pipeline/content_types.py
    - config/pipeline_config.yaml
    - config/content_types.yaml
  semantic_near_threshold: 0.8
  related_fbs_max_neighbors: 20
  related_fbs_exclude_domains:
  - emerging
  related_fbs_exclude_disciplines:
  - emerging
  merged_call_enabled: true
  merged_call_max_tokens: 2048
  batch_enabled: false
  batch_size: 4
  reclassify_chunk_size: 200
  batch_call_max_tokens: 2048
  depth_focused_classification: true
  depth_max_tokens: 1024
  depth_batch_size: 4
  depth_batch_max_tokens: 2048
  depth_anchor_path: governance/depth_anchor_conformance_20261002.json
  depth_conformance_kappa_floor: 0.800
  depth_batch_enabled: true
  depth_prompt_variant: v3_contrastive
  depth_frugal_enabled: false
  # BUG-403/405 (Gate D, 2026-09-23): KEPT and deliberately UNSET. The gemma depth route is REFUTED
  # (governance/S4_DEPTH_EMPIRICAL_RESULTS_2026-08-14.md: 62.5% vs a >=90% gate) and
  # depth_frugal_enabled is false, so the served depth path is VERIFY_MODEL (gpt-oss). DO NOT DELETE
  # this key - deleting it resurrects the code default in pipeline/pipeline_paths.py. Give it a value
  # only after a depth route WINS an A/B arm (D2618/D2635).
  depth_model: null
  depth_fallback_depth: domain
  # D2607 (C): LLM-hybrid student pre-classifier. ModernBERT student classifies
  # discipline/domains; low-confidence/abstain falls back to gpt-oss (VERIFY_MODEL).
  # OFF by default — enable only after R5 review + agreement-threshold A/B.
  student_preclassifier_enabled: false
  student_preclassifier_checkpoint: knowledge pipeline/classifier_hierarchical
  student_preclassifier_threshold: 0.35
  student_preclassifier_coarse_threshold: 0.70
  # D2556 (D2548): grammar-constrained decoding pilot for S4 enum output.
  # Outlines/XGrammar NOT installed (assessed 2026-09-04) — gate OFF until added.
  grammar_decoding_enabled: false
  golden_path: config/golden/stage4_golden.yaml
  golden_inject_enabled: true
  golden_max_examples: 7
  discipline_anchor_path: governance/discipline_anchor_conformance_20261002.json
  discipline_conformance_kappa_floor: 0.8
  # D-2798 (BUG-622): discipline is ADVISORY-ONLY — this floor is a REPORTING reference,
  # NOT a hard gate. discipline_conformance_gate.py --gate is a NO-OP in advisory mode
  # (discipline does NOT gate routing). Set 'hard' to restore the legacy fail-closed.
  discipline_gate_mode: advisory
  # BUG-622 (D-2796): discipline floors are HUMAN-UNREACHABLE — fine ceiling 0.581,
  # coarse 0.728, macro-3way 0.766. Gate at human parity; fine-62 is advisory, macro is advisory-only (D-2798).
  discipline_coarse_kappa_floor: 0.73   # re-targeted from 0.9 (D-2790) to the human coarse ceiling
  discipline_macro_groups_path: config/discipline_macro_groups.yaml
  # D-2797 (BUG-622): owner ratified the 3-way macro scheme + human-parity gate (~0.73-0.77).
  # D-2798 (BUG-622): Condition C measured kappa 0.6066 < 0.65 ship threshold AND < 0.73 human-parity
  # floor (human 3-way ceiling 0.766) -> macro NOT shipped as a routing facet; discipline is ADVISORY-ONLY
  # (fine-62 -> advisory multi-label tags, soft facet). Flag kept false until the S4 advisory re-wire.
  discipline_macro_kappa_floor: 0.73
  discipline_macro_enabled: false
  discipline_model: gpt-oss-20b-MXFP4-Q8
  # D-2820 (2026-10-05): anchor re-derivation harness (scripts/rederive_anchor_axes_v6.py).
  # generator produces CANDIDATE labels (INPUT only); the owner adjudicates (D-2839 c2); a
  # second coder of a DIFFERENT model family cross-checks (R5 generator != verifier).
  anchor_rederive_generator_model: gpt-oss-20b-MXFP4-Q8
  anchor_rederive_second_coder_model: gemma-4-E4B-it-MLX-4bit
  anchor_rederive_anchor_version: v6
  swap_eval_baseline_model: gpt-oss-20b-MXFP4-Q8   # D-2767/D-2783 classifier-of-record (baseline)
  swap_eval_candidate_model: gemma-4-12B-it-qat-OptiQ-4bit   # D-2788 REJECTED (slower on BOTH axes) — kept for audit trail; classifier-of-record remains gpt-oss-20b-MXFP4-Q8
  swap_eval_kappa_bar: 0.7   # D-2782 classifier-kappa bar (Cohen, classifier-vs-gold), declared pre-eval
  # D-2773 (2026-10-02): closed 62-discipline menu injection (BUG-622 fix, MEASURE-gated).
  # OFF by default — when false the prompt is byte-identical to the pre-fix baseline.
  # Adopt only if a full-204 discipline A/B shows Cohen's kappa >= 0.800 (D-2767).
  # See pipeline/stage4_merged_call.py::_render_discipline_closed_menu.
  discipline_closed_menu_enabled: false
  # D-2814 (2026-10-05): definition-anchored closed menu (label + definition + explicit 'emerging')
  # replaces the free-generation discipline/domains instruction in BOTH the merged S4 call and the
  # direct classify fallback. OFF by default (byte-identical baseline); adopt only after R5 review
  # (gemma != verifier) of the rendered prompt + a full-204 A/B (D-2767). C16: enabled + empty menu -> raise.
  # D-2814 supersedes D-2773 (the label-only closed menu) — do not enable both. Enforced
  # fail-closed in pipeline/stage4_merged_call.py (D-2833 / BUG-647): both true -> RuntimeError.
  # D-2835: the rendered menu is a CONSTANT, byte-deterministic prefix (~5k tokens) — amortized by
  # a serving-layer prefix cache; group-prefilter is DEFERRED (it risks re-opening BUG-629/630).
  definition_anchored_menu_enabled: false
  # D-2814/BUG-630 (2026-10-05): curated same-axis fall-through. The opposite-axis guard in
  # map_to_canonical_with_fallback correctly blocks coercion, but must retry a declared SAME-axis home
  # before abstaining. Keys are normalized raw labels; values are the same-axis canonical. Seeded with
  # the two rescues MEASURED on rechunk-v4-20260929 (BUG-630): 'organizational behavior' -> 'organizational
  # theory', 'product design' -> 'design thinking'. 'urban planning' is deliberately ABSENT (genuine gap).
