- id: CONV-007
  domain: economics
  source_books:
  - The Intelligent Investor — Benjamin Graham
  - The Art of Strategy — Avinash Dixit & Barry Nalebuff
  - 'The Great Mental Models, Volume 4: Economics and Art — Shane Parrish'
  cluster_segments:
  - source_book: The Art of Strategy — Avinash Dixit & Barry Nalebuff
    text: 'Keynes used the beauty contest as a metaphor for the stock market, where each investor

      wants to buy the stocks that will rise in price, which means the stocks that investors,

      in general, think will appreciate. The value of a stock is not what YOU think it''s worth,

      but what you think OTHERS think it''s worth — and what they think others think, in an

      infinite recursion of mutual expectation.

      '
  - source_book: The Intelligent Investor — Benjamin Graham
    text: 'Graham''s parable of Mr. Market captures the same recursive dynamic. Imagine that you and Mr. Market are partners
      in a private business. Every day, without fail, Mr. Market quotes a price at which he will either buy your stake or
      sell you his. His quote is driven by emotion — optimism one day, pessimism the next — not by the underlying value of
      the business. The intelligent investor treats Mr. Market''s price as a quote to be exploited, not as a verdict on value:
      you are free to ignore him or take advantage of his mood swings, but you must never let his opinion dictate your judgment
      of intrinsic worth.'
  - source_book: 'The Great Mental Models, Volume 4: Economics and Art — Shane Parrish'
    text: 'Economist John Maynard Keynes used the metaphor of a beauty contest to explain how stock

      prices are set. He asked readers to imagine a contest where entrants must choose six faces

      out of a hundred; those who pick the faces chosen by the most other people win. Keynes

      believed stocks are priced not according to their intrinsic value but according to

      investors'' perceptions of other investors'' perceptions — a recursive prediction problem

      where the fundamental value becomes almost irrelevant to short-term price movements.

      '
  is_convergent: true
  should_extract: true
  expected_fb:
    is_summary: false
    route: FB
    name: Keynesian Recursive Expectation
    definition: 'In markets where asset prices depend on collective belief rather than intrinsic value,

      successful prediction requires reasoning about what others believe others believe — a

      recursive chain of mutual expectation. The asset''s fundamental value decouples from its

      market price with each recursion step, as each participant optimizes for the anticipated

      average opinion rather than underlying reality.

      '
    mechanism: 'Recursive expectation drives price formation through higher-order belief coordination.

      Level-1 investors value assets on fundamentals. Level-2 investors value based on predicted

      level-1 beliefs. Level-k investors value based on predicted level-(k-1) beliefs. The

      mechanism amplifies small errors: misperceptions about others'' beliefs compound with each

      recursion level, producing price cascades where individually rational decisions generate

      collectively destabilizing speculation. The recursion has no natural termination — at

      sufficiently high k, the fundamental value becomes negligible relative to the recursive

      belief component.

      '
    boundary: 'Applies when future prices depend primarily on other investors'' behavior rather than

      measurable cash flows. Fails when: (1) the asset has a contractually guaranteed terminal

      value (zero-coupon bond) — the recursion collapses to a known endpoint; (2) participants

      have identical information and reasoning — recursion converges to fundamentals; (3)

      transaction costs exceed speculative margin — the game is not worth playing; (4) a

      dominant player can unilaterally set the price — no need to predict others.

      '
    consequence: 'Markets governed by recursive expectations exhibit excess volatility relative to

      fundamentals, spontaneous coordination on arbitrary focal points (round-number prices),

      and vulnerability to self-fulfilling prophecies where collective belief in a price

      movement causes that movement. This explains why assets with zero cash flows

      (cryptocurrencies, collectibles, meme stocks) can sustain high valuations indefinitely

      as long as participants believe others will continue to believe.

      '
    evidence_passages:
    - Keynes used the beauty contest as a metaphor for the stock market, where each investor wants to buy the stocks that
      will rise in price, which means the stocks that investors, in general, think will appreciate
    - Mr. Market quotes a price at which he will either buy your stake or sell you his
    - His quote is driven by emotion — optimism one day, pessimism the next
    - The intelligent investor treats Mr. Market's price as a quote to be exploited, not as a verdict on value
    - stocks are priced not according to their intrinsic value but according to investors' perceptions of other investors'
      perceptions
    extraction_type: causal_mechanism
    content_type: principle
    depth: domain
  rationale: 'STEM domain expansion: economics/game theory, sourced from real cluster_90 in the S1.5 bge-m3 run (3 books,
    cohesion=0.865). Three independent sources (Dixit/Nalebuff, Graham, Parrish) converging on Keynes'' beauty contest mechanism.
    The mechanism explicitly traces recursion levels (1→2→k) and identifies the compounding-error dynamic that produces speculative
    instability — going beyond "prices reflect beliefs" to explain WHY recursive belief coordination creates excess volatility.
    Graham''s Mr. Market parable provides the investor-facing articulation of the same recursive dynamic: the quoted price
    is collective emotion, not intrinsic value. The boundary distinguishes speculative from contractual assets as a testable
    condition. This expands golden set domain coverage from psychology/marketing into economics and game theory, demonstrating
    convergent extraction on academic/theoretical source material.'
