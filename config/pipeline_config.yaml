pipeline_root: null
run:
  default_id: rechunk-v4-20260929
  singleton_lock: true                 # BUG-602: refuse a second runner on one run_id (duplicate-runner conflict)
  singleton_lock_path: ".pipeline_runner.lock"  # BUG-602: pid lock, relative to pipeline_root (C12)
  preflight_timeout_sec: 90            # BUG-606: must exceed watchdog restart cycle (kill 10s + sleep 3s + RESTART_WAIT 30s ≈ 43s)
  python_bin: /Users/barn/miniforge3/bin/python3  # BUG-607: canonical stage interpreter. Bare "python3" drifted between shells (login zsh→conda base, non-login→framework 3.12) so S2 lost datasketch. Pin the full-dep-chain env (C12).
  # BUG-1000 (2026-10-25): the modules a bare `python3` MUST be able to import before any NON-PYTHON surface
  # (justfile ladder, git pre-commit hook) is allowed to run under it. The values are not a preference: they are
  # the two measured failure modes of this exact bug — `yaml` refused `git commit` at RAIL 0, and `mcp` refused
  # `just health` at line 20. scripts/resolve_python.sh reads this list and PROVES the pin against it, so a pin
  # that points at an interpreter missing a dep is refused with a diagnostic instead of failing 40 rails later.
  python_required_modules: [yaml, mcp]
#: T-206/D-3153 — THE CONFIG AUDIT'S OWN DEBT IS DECLARED, COUNTED AND SHRINK-ONLY.
#: MEASURED 2026-10-26: fixing BUG-1025 let the audit speak for the first time and it reported 9 unchecked
#: hardcoded values plus 1 config/code mismatch. The count is held against a ceiling that may only move DOWN
#: (D-2644); a new hardcode is therefore a FAULT, never a shrug absorbed by an acknowledgement set.
config_audit:
  unchecked_hardcoded:
    direction: shrink_only
    ceiling: 0          # after T-206's classification every item has a declared home (format spec, rc vocabulary, or YAML)
    baseline: 9         # the first reading BUG-1025 exposed, recorded so the shrink is visible
    measured_on: '2026-10-26'
    why: >-
      A hardcoded value is a value with two homes unless its class says otherwise. Binary-format offsets stay in
      code as FORMAT_SPEC_HARDCODED with their source; exit-code vocabulary stays in ACKNOWLEDGED_HARDCODED
      because making an exit code configurable would make the meaning of a run configurable; every MEANING value
      moves to YAML. Raising this ceiling requires a named decision, not an edit.

#: BUG-1015 — THE LINT GATE'S OWN DEBT IS DECLARED, COUNTED AND SHRINK-ONLY.
#: MEASURED 2026-10-26: `just audit` ran `ruff | tail -5` under `@`, so its exit status was always tail's 0 and
#: the real findings grew to 2462 unseen (a control that cannot be seen to FAIL is not a control, BUG-492). The
#: certified gate narrows to the CORRECTNESS family (F = pyflakes: undefined name, unused import/local, f-string
#: defect, redefinition) because that is the family whose growth means a real defect; E722 (bare except) is already
#: 0 and C16 covers it. The modernisation/style families (UP/I/W/E/B) are registered as acknowledged debt OUTSIDE
#: the failing gate (D-3038) and reported by `scripts/lint_gate.py --report`, never allowed to fail the build until
#: a named decision promotes them. The count is held against a ceiling that may only move DOWN (D-2644); a new
#: F-finding is therefore a FAULT, never a shrug.
lint_gate:
  certified_select: ["F"]      # pyflakes correctness only
  direction: shrink_only
  ceiling: 62                  # RE-MEASURED 2026-10-26 after 3 real-bug + 5 hygiene fixes + 182 safe autofixes (was 252); remaining 62 are UNSAFE F841 (RHS may carry a side effect — per-item review, never --unsafe-fixes)
  baseline: 252
  measured_on: '2026-10-26'
  scope: ["pipeline/", "scripts/"]

serving:
  # D-2936 (2026-10-11): SERVING INDEX SCOPE — scope must be enforced by the INDEX, not
  # only by a WHERE clause. The store holds every run ever committed (t11: 7855 rows,
  # rechunk-v4-20260929: 6591, e2e: 122, bug198_reinject: 6). Serving is already pinned to
  # the canonical run by D-2881 (canonical_run_clause), but vec_fbs / vec_fbs_ctx / fbs_fts
  # index EVERY run, and sqlite-vec computes KNN *before* the run filter is applied.
  # Measured cost (2026-10-11): of the vec_fbs top-100 for a canonical query, only 19-26
  # candidates survive the run+PASS filter (53.9% of the index is the superseded t11 run).
  index_scope: canonical_run            # canonical_run (production) | all_runs (diagnostic only)
  # D-2939 (label vs pointer): an owner approves the query + the answer NAME; the
  # fb_id is a content hash (D-2898) and is resolved per run by pipeline/golden.py.
  # 'name_then_id' = prefer expected_names, keep expected ids as a legacy fallback.
  golden_anchor_mode: name_then_id
  # D-2937: runs superseded by run.default_id. They must not be served, counted in any
  # census, or left in the vector/text indices. Removal is only permitted once
  # scripts/purge_superseded_runs.py proves (a) zero inbound references from live rows,
  # (b) an archive of every removed row (R-D410: archive, never silent delete),
  # (c) a fresh C13 backup. Dry-run is the default; --apply is the only mutating mode.
  superseded_runs:
  - t11
  - e2e
  - bug198_reinject
  # C16/BUG-710: a benchmark or census whose reference ids fall outside index_scope must
  # FAIL LOUD. BUG-710 exists because 30/30 retrieval goldens pointed at the superseded t11
  # run and the harness reported 0.000 recall as if it were a quality regression.
  # D-2980: the ONE home of the retrieval CANDIDATE-POOL policy (C12/C20). Before this
  # block the policy was two inline literals in pipeline/retrieve.py
  # (min(max(limit*5,20),100) for the rerank/production pool, min(limit*5,100) for the RRF
  # leg pool), so the benchmark's A/B legs could not be CONSTRUCTED to equal the served
  # path and the served path could not be benched at all (BUG-710 residual).
  #   rerank pool  = clamp(limit * rerank_multiplier, rerank_floor, rerank_cap)
  #   rrf leg pool = min(limit * rrf_leg_multiplier, rrf_leg_cap)   (D2176 shape, preserved)
  pool:
    rerank_multiplier: 5
    rerank_floor: 20
    rerank_cap: 100
    rrf_leg_multiplier: 5
    rrf_leg_cap: 100
  # C16/BUG-710: a benchmark or census whose reference ids fall outside index_scope must
  # FAIL LOUD. BUG-710 exists because 30/30 retrieval goldens pointed at the superseded t11
  # run and the harness reported 0.000 recall as if it were a quality regression.
  require_resolvable_goldens: true
