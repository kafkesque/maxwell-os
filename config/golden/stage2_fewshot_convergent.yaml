- id: CONV-016
  domain: illustration
  discipline: color theory
  source_books:
  - Interaction of Color — Josef Albers
  - Color and Light — James Gurney
  - The Elements of Color — Johannes Itten
  cluster_segments:
  - source_book: Interaction of Color — Josef Albers
    text: 'Colors are the most relative medium in art. A color''s appearance changes completely

      based on its neighbors. Restricting the palette to a few colors forces the artist to

      understand these relationships deeply — with fewer colors, each one must work harder

      and its interaction with others becomes the entire composition.

      '
  - source_book: Color and Light — James Gurney
    text: 'Professional illustrators often restrict their palette deliberately. A limited

      palette creates harmony because all colors share common pigment characteristics. The

      beginner''s urge to use every color available usually produces mud — too many hues

      competing creates visual noise rather than richness.

      '
  - source_book: The Elements of Color — Johannes Itten
    text: 'Color harmony is a matter of proportion and relationship, not the number of colors.

      Itten''s seven color contrasts show that even two colors can produce powerful effects

      when their relationship is understood — complementary contrast, simultaneous

      contrast, and warm-cool contrast all emerge from pairings, not palettes.

      '
  is_convergent: true
  should_extract: true
  expected_fb:
    is_summary: false
    route: FB
    name: Limited Palette Discipline
    definition: 'Restricting the color palette to a small set of deliberate colors (typically 2-5)

      produces more harmonious and powerful visual work than using a wide palette,

      because color harmony is a function of relationships and proportion, not quantity.

      '
    mechanism: 'With few colors, each color''s appearance is determined by its interaction with the

      others, forcing the artist to understand simultaneous contrast and relative

      appearance. Wide palettes dilute this understanding — every color is diluted by

      competing relationships, producing visual noise (mud).

      '
    consequence: 'Artists working within constraints produce more coherent work: the palette becomes

      a unifying element, and the limited vocabulary forces compositional clarity. This

      applies to illustration, UI design, branding, and data visualization.

      '
    boundary: 'Applies when the goal is harmony and coherence. Fails when: (1) the subject

      requires naturalistic color (photorealism) where wide gamut is necessary;

      (2) the palette is so limited it cannot represent required distinctions

      (colorblind-safe data viz needs distinguishable hues); (3) the artist lacks

      understanding of the colors chosen (limited palette without mastery = flat work).

      '
    evidence_passages:
    - Restricting the palette to a few colors forces the artist to understand these relationships deeply
    - The beginner's urge to use every color available usually produces mud
    - even two colors can produce powerful effects when their relationship is understood
    depth: domain
    extraction_type: normative_heuristic
    content_type: principle
