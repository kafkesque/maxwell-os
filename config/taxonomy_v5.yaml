# ── D34-R7/R14: Meta labels for unclassified principles ──
# "emerging" is NOT a 26th canonical domain or 48th discipline.
# It is a catch-all for principles that don't fit the 25-domain/47-discipline taxonomy.
# Valid in: domain_canonical, discipline_canonical, classify_domains.py, classify_disciplines.py.
# NOT counted by contract_DOMAIN_COUNT or contract_DISCIPLINE_COUNT.
meta:
  catch_all_domain: emerging
  catch_all_discipline: emerging
  catch_all_description: >
    Used when no canonical domain or discipline fits the principle ontologically
    and pragmatically. Preserves the raw S3A convergence label as s3_original_domain
    for future taxonomy expansion when enough principles accumulate under a label.
