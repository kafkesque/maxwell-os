- id: D273g
  category: RETRIEVAL / ONTOLOGY
  state: OPEN
  date: '2026-09-19'
  title: A chunk/evidence leg IS worth it -- at step 8, and only after the filters constrain (D-273g)
  source: governance/MARKET_RESEARCH_ONTOLOGY_20260919.md
  verification: 'measured: RRF already correct (k=60, 1/(k+rank), 1-based); source_segments join the stage-1 checkpoint 205,813/205,813 = 100%'
  description: 'RRF is ALREADY implemented and correct in search_hybrid: Score(d) = sum 1/(k + rank) with RRF_K=60, 1-based ranks, three legs, rank-based rather than score-based, including the D2511 keyword-pollution fix. So ''adopt RRF'' is a no-op; the question is what to feed it. Chunk-level retrieval IS worth adopting and the cost is MEASURED, not estimated: the DB''s source_segments (214,220 references) are verbatim stage-1 checkpoint segment_ids -- sampled 205,813/205,813 = 100% join against knowledge pipeline/stage1_chunk/t11/checkpoint.jsonl (741.7 MB, 299,861 segments, keys segment_id, text, source_book, source_path, section_title, section_heading, word_count). So a chunk leg needs ~214k vectors (about 438 MB at 512d), one local embedding job, NO mapping, NO re-chunking and NO re-extraction, and each hit returns verbatim source text plus a section heading plus a direct parent-FB link (retrieve the segment, return the parent FB). Granularity reference: Chen et al., Dense X Retrieval,
    EMNLP 2024, 10.18653/v1/2024.emnlp-main.845. CAVEATS THAT MUST SHIP: chunking fixes grounding precision, NOT label accuracy; the segments inherit the corpus defect of 369 duplicate works; chunk config is 300 words with 50 overlap, so adjacent hits must be collapsed at fusion; and adding a leg BEFORE D273a is fixed would AMPLIFY BUG-285. Human gate G16, and decide whether a hit returns the parent FB or the segment.'
  files:
  - pipeline/retrieve.py
  - pipeline/stage1_chunk.py
  - config/pipeline_config.yaml

- id: D273h
  category: LABEL QUALITY / MEASUREMENT
  state: OPEN
