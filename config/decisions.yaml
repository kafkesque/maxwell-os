- id: D2308
  title: Source identity — work-level canonical identity (fix duplicate-edition false convergence)
  category: DATA
  date: '2026-08-12'
  summary: 'Roundtable adjudication found is_convergent:true on same-work duplicate editions (Safe Withdrawal Rate, Transgenic,
    Black Swan). Root cause is 3 stacked failures: (1) compute_source_id SHA-256(author|title) fed inconsistent metadata (subtitle/co-author/title-concat);
    (2) isor_score counts raw filenames; (3) broken author parse. Fix: normalize author/title before hashing (strip subtitles,
    primary author, collapse title+subtitle), add content_hash tiebreaker, redefine is_convergent on distinct canonical works
    >=2 not distinct files. Full Work/Edition/File graph is future work, not a prerequisite.'
  files:
  - pipeline/book_metadata.py
  - pipeline/stage1_5_embed_cluster.py
  state: ACTIVE
- id: D2309
  title: ISOR — metadata-author extraction + canonical source count + precedence fix
  category: VAL
  date: '2026-08-12'
  summary: 'isor_score author extraction (_extract_author_surname) expects "Title — Author" em-dash but corpus uses "Title
    (Author) (source).md" parenthesis (0/268 vs 268/268) → returns full filename → n_authors==n_sources, author_score pinned
    1.0, "weak" bucket dead (0/40). Also rating condition n_authors>=2 or n_domains>=2 and n_sources>=2 has and-binds-tighter
    precedence. Fix: use resolve_book_metadata() author, count canonical source_ids via resolve_source_ids(), parenthesize
    the rating condition.'
  files:
  - pipeline/schema_accessor.py
  state: ACTIVE
- id: D2310
  title: S5 confidence — NLI as gate not 75% weight + per-passage aggregation + human adjudication
  category: QLT
  date: '2026-08-12'
  summary: 'Confidence = 0.15*mech + 0.75*NLI + 0.10*enrich floors at 0.25 on any NLI fail (fact_score=0.0), producing 77.5%
    quarantine (9 PASS / 31 QUARANTINE) and R=0.556. DeBERTa max-entailment over <=8 passages is opaque. Fix: NLI as binary
    gate; compute confidence from ISOR + mechanism + enrichment; per-passage NLI with explicit aggregation; human-adjudication
    path for canonical principles (Progressive Disclosure, Warren Harding, True Cost Accounting false-quarantined).'
  files:
  - pipeline/stage5_verify.py
  state: ACTIVE
