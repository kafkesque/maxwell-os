  - source_book: Inspired — Marty Cagan
    text: 'The Kano model classifies product features into three categories based on how they affect customer satisfaction.
      Basic features (must-haves) cause dissatisfaction when absent but do not increase satisfaction when present — customers
      expect them. Performance features produce proportional satisfaction: more is better, less is worse. Delighters (excitement
      features) cause disproportionate satisfaction when present but no dissatisfaction when absent — customers did not expect
      them. This is a descriptive model: it categorizes features by their satisfaction response curve, not by their technical
      implementation or cost.'
  - source_book: Hooked — Nir Eyal
    text: Products succeed not by adding more features but by understanding which type of value each feature creates. Some
      features are table stakes — users expect them and are angry when they're missing but never grateful when they work.
      Other features create delight precisely because they were not expected. The skill is not in building all three types
      equally but in recognizing that the same feature migrates from delighter to performance to basic over time as competitors
      adopt it and customer expectations shift.
