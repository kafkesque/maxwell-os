- id: D272d
  category: VERIFICATION / ONTOLOGY
  state: OPEN
  date: '2026-09-19'
  title: Split QUARANTINE into UNVERIFIED and CONTRADICTED; persist the stage-5 verdict (D-272d)
  source: governance/ONTOLOGY_FORENSIC_20260919.md
  verification: measured (BUG-278); human ruling required on the enum
  description: 'stage5_verify.py is fail-closed (D2093) and treats NEUTRAL (unverifiable) and CONTRA (contradicted) as the same outcome. Measured: status PASS 4,745 (59.3%) / QUARANTINE 3,250 (40.7%), retrieval defaults to PASS, so 40.7% of the KB is invisible -- including 1,780 rows labelled ''principle'' and 2,940 carrying a real non-emerging discipline; 2,744 sit at the confidence cap 0.25. contradicts_fbs is NULL for 100% of rows, so NEUTRAL and CONTRA are INDISTINGUISHABLE in the store: the distinction the fail-closed rule depends on is discarded at write time. ''Could not verify'' and ''the evidence contradicts this'' are different claims about the world; collapsing them hides 22% of the principles and makes the S5 threshold untunable because one threshold moves two populations at once. Reference for why a NEUTRAL verdict must never be read as FALSE: Honovich et al., TRUE, NAACL 2022, DOI 10.18653/v1/2022.naacl-main.287. Proposed: split the enum, persist the verdict, and re-expose
    UNVERIFIED rows at a LOWER evidence tier (R14) instead of hiding them.'
