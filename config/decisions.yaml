- id: D281
  category: QUALITY / DATA
  state: RESOLVED
  date: '2026-09-20'
  title: R2 definition-anchored NLI verifier against the closed menu + R5 definitions (D-281)
  source: scripts/definition_nli_verify.py
  verification: 'scripts/definition_nli_verify.py --selfcheck loads the closed menu + r5_slot_repair.yaml overrides (content_type 2, discipline 7) and resolves every re-derived slot to a definition. It reuses the S5 NLI pair scorer (stage5_verify._nli_pair_scores) with premise=FB definition, hypothesis=label definition (r5 override first, else taxonomy), reporting entail/neutral/contra per label. contra at or above the S5 threshold is a hard mislabel signal; this is Mechanism B (a meter) that calibrates confidence and abstention, never a label flipper (D-277).'
  description: 'Definition-anchored NLI replaces the flat "This text is about {label}." hypothesis (which under-entails on broad labels, D2571 anomaly-C) with the label canonical definition as the anchor. The R5 repaired definitions take precedence for the weak slots, so the re-derived boundary (include/exclude) is what gets verified. The corpus-wide run is the next action (a long local inference over the stage5 checkpoint), not executed in this batch.'
  files:
  - scripts/definition_nli_verify.py
  - config/r5_slot_repair.yaml
