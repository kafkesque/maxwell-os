  - The Rule of Law — Tom Bingham
  - Nudge — Richard Thaler & Cass Sunstein
  cluster_segments:
  - source_book: Thinking, Fast and Slow — Daniel Kahneman
    text: When faced with a difficult question, people often substitute an easier one without noticing. Asked "should this
      defendant be granted bail?" a judge may substitute "do I feel this defendant is dangerous?" — a heuristic answer that
      bypasses the legal criteria. This substitution happens automatically and unconsciously through System 1.
  - source_book: The Rule of Law — Tom Bingham
    text: Judges must decide cases based on law and evidence, not intuition. But cognitive biases — anchoring on initial impressions,
      substituting easier questions, over-weighting vivid testimony — can unconsciously shape judicial reasoning. The discipline
      of legal judgment requires active resistance to these natural cognitive tendencies.
  - source_book: Nudge — Richard Thaler & Cass Sunstein
    text: Decision-makers in high-stakes environments — judges, doctors, regulators — are not immune to cognitive biases.
      In fact, the complexity of their decisions makes them MORE susceptible to heuristic substitution because the correct
      answer requires effortful System 2 processing that is easily bypassed when mental resources are depleted.
  is_convergent: true
