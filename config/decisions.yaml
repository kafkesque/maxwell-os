  authority: "owner-accepted 2026-09-25 (BUG-466); implemented as a declaration, not a repair"

- id: D-394
  category: VERIFICATION/INSTRUMENT
  state: RESOLVED
  title: "The depth axis is NOT load-bearing, and the measured panel is 3 raters, not the declared 5"
  context: >
    BUG-476: the depth panel declaration names FIVE raters; only THREE rated (claude 142, kimi 144, owner 144).
    Qwen3.8 and DeepSeek hold 0/148 depth cells while holding 148/148 domain cells - the depth pass was never
    run for them. Because alpha is missing-cell capable, an EMPTY COLUMN is indistinguishable from a rater who
    skipped a few rows, so the receipt printed "5 declared rater column(s)" over a 3-rater measurement.
  decision: >
    (1) The depth axis may NOT be frozen and may NOT be load-bearing on this evidence: no gate, no anchor edit,
    no depth head (D2577/D274d untouched). (2) The declared panel must be made TRUE before any new rater is
    bought - run the two missing depth passes or amend the declaration; a 5-rater declaration over a 3-rater
    measurement is the defect. (3) The disagreement is ADJACENT, not random: of 172 disagreeing rater-pairs 152
    are off-by-one (2<->3 x75, 3<->4 x66), 60/144 units are unanimous and 3 span the whole menu - the ORDERING
    is sound, the BOUNDARY is what fails. (4) Class 1 is not the failure source (2.1-4.9% base rate, 24 of 172
    disagreements) and is also not measurable by alpha at that prevalence - MEASURED alpha on the class-1 bit is
    +0.1730 on 91.5-95.8% raw agreement (the kappa paradox at a rare class, cf. BUG-452). (5) The next
    measurement is D274f (30-row test-retest, window opens 2026-10-08): the only number that separates a RATER
    problem from a RUBRIC-observability problem. (6) Completing the panel is the highest-information next act: a
    2-coder LLM alpha of 0.5472 projects to ~0.83 at 4 coders under Spearman-Brown with INDEPENDENT errors, so
    the completed panel FALSIFIES or CONFIRMS that assumption - near 0.83 the raters were the constraint, near
    0.55 the RUBRIC is, and then only declared re-operationalisation (making the substitution test determinable
    from the row) can move the number, as a NEW instrument version, never as tuning.
  authority: "assistant + senior-RAG (both: do not freeze a 0.40 measurement; do not buy a rater before the declaration is true)"
  files: [config/agreement_floor.yaml, scripts/depth_pass_agreement.py, config/depth_classes.yaml, config/cohort_declaration.yaml]
  evidence: >
    alpha nominal 0.4004 (Do 0.4023 / De 0.6710, n=430) / ordinal 0.5701 on 144 units; leave-one-out: drop kimi
    -> 0.2701, drop owner -> 0.5472 (= the claude+kimi pair), drop claude -> 0.3875. 3-class collapse 0.4172;
    binary class-1 0.1730. Bands from config/agreement_floor.yaml (reporting 0.667 / operative 0.800).
- id: D-395
  category: GOVERNANCE/INSTRUMENT
  state: RESOLVED
  title: "Class-1 admission gates on the CLAIM-SHAPE bit, never on FORM, and is judged as a decision rule"
  context: >
    BUG-451 falsified FORM as a class-1 gate BY MEASUREMENT: the 7 owner-retracted class-1 calls span 3 of the 4
    FORM classes (descriptive_model x5, normative_heuristic x1, causal_mechanism x1); the warrant-admissible pool
    (normative_heuristic + descriptive_model) is 91/150 = 60.7% against a 2.7% class-1 capacity, and the FORM
    precondition excludes 59 rows while catching exactly ONE of the 7 negatives (R139).
  decision: >
    (1) FORM stays a NECESSARY warrant field and is demoted from candidate gate, with its measured catch rate
    (1/7) recorded permanently so the "build the FORM anchor first, then derive depth" plan cannot be
    re-litigated. (2) A FORM 4-coder panel is NOT the floor's second consumer: it buys a reliability number for an
    axis that is already owner-anchored (extraction_type_final 145/150, write-locked) and that cannot gate -
    pure future tax. (3) The class-1 gate is the D-374 CLAIM-SHAPE bit (config/claim_shape_instrument.yaml -
    instrument, builder, scorer and negative set already exist), elicited by a NON-AUTHOR (guards.refuse_elicitor
    already says so) and judged as a DECISION RULE against the declared cohort [U001..U004 candidates;
    R033 R049 R062 R085 R087 R101 R139 negatives]: 7/7 negatives rejected AND 4/4 candidates admitted, reported
    with both denominators. (4) alpha must NOT be the class-1 statistic: at a 2.7-4.9% base rate the kappa
    family collapses (measured +0.1730 nominal, pairwise +0.2310 / +0.3806 / -0.0404 on 91.5-95.8% raw
    agreement); a rare-class admission rule is judged by its confusion matrix against the known negatives, i.e.
    as a SCREENING TEST, not by an agreement coefficient.
  authority: "assistant + senior-RAG (both: BUG-451 already answers this; adding raters cannot supply signal absent from the label set)"
  files: [config/claim_shape_instrument.yaml, scripts/build_claim_shape_instrument.py, scripts/score_claim_shape_gate.py,
          config/anchor_family.yaml, governance/existence_negatives.yaml, config/agreement_floor.yaml]
  evidence: >
    FORM x the negatives, ANCHOR_RULER_CONSOLIDATED_20260923.csv#extraction_type_final (145/150: causal_mechanism
    40, descriptive_model 41, normative_heuristic 50, empirical_pattern 14, blank 5). BUG-477: the FORM coder
    columns are 'label (margin)' strings and owner_form is declared but 0/108 filled - any FORM agreement figure
    needs a declared parse first.

- id: D-396
  category: VERIFICATION/MEASUREMENT
  state: RESOLVED
  title: "G-study on the depth panel: rater bias is ZERO - the remedy is more raters, not a new rubric"
  context: >
    The depth panel's low alpha posed a fork: more raters, or a re-operationalised rubric. Alpha cannot answer
    it - it is one number. A two-way ANOVA without replication over the complete-case design (142 units x 3 real
    raters, 426 values) decomposes the variance instead.
  decision: >
    MEASURED: MS_item 1.4053, MS_rater 0.0446, MS_resid 0.3046; F_rater = 0.146 (2,282 df) - NO rater effect.
    Variance components: item 0.367 (54.6%), rater(systematic bias) 0.000 (0.0%), item x rater residual 0.305
    (45.4%); rater means 2.972 / 2.937 / 0.958~2.958 (range 0.035 on a 1-4 scale). CONSEQUENCE: the disagreement
    is NOT coder bias and NOT scale-usage drift - it is item-specific, and the CLASSICAL remedy for item-specific
    error with zero rater effect is AVERAGING MORE RATERS, not rewriting the rubric. Spearman-Brown under the
    measured single-rater reliability (rho1 = 0.546): 2 raters 0.707, 4 raters 0.828, 5 raters 0.858, 10 raters
    0.923. The declared panel has 4 LLM coders; TWO were never run (BUG-476), so the executed design was 2 coders
    = 0.707 is NOT reachable for claude+kimi alone (measured 0.5472) - i.e. the executed design was BELOW its own
    min. DECISION: (1) run the two missing declared coders - at 4 coders the projection crosses the 0.800
    operative floor, and the run simultaneously FALSIFIES or CONFIRMS the independent-errors assumption; (2) do
    NOT change the rubric, and do NOT buy a frontier coder, until the 4-coder panel has been measured; (3) the
    ORDINAL alpha is the honest statistic for this axis - nominal alpha 0.4004 understates it because 86% of
    disagreements are off-by-one, and ordinal alpha 0.5701 agrees almost exactly with the interval ICC 0.546;
    the band is currently read from NOMINAL and that is a declared-choice question for the owner, NOT a value to
    re-pick now that a score exists (the floor file forbids it); either way BOTH readings are below the 0.667
    reporting floor, so the conclusion (depth may not be frozen) is robust to the choice.
  authority: "assistant + senior-RAG (both: measure the structure before buying raters or rewriting an instrument; the fork was decidable from data already on disk)"
  files: [scripts/depth_pass_agreement.py, config/agreement_floor.yaml, config/depth_classes.yaml]
  evidence: >
    Complete-case two-way ANOVA (no replication) on the 142 units where claude, kimi and owner all rated;
    reliability projections are Spearman-Brown on the measured rho1, i.e. an UPPER BOUND that assumes
    independent errors - the 4-coder run is the test of that assumption.

