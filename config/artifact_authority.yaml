# config/artifact_authority.yaml — BUG-378(b): make ARTIFACT_AUTHORITY.json ENFORCED
# =============================================================================
# WHY: markers were WRITTEN for stage4_merge/t11 and stage5_verify/t11 in session 22 but
# nothing checked them — a claim without a check, which is the exact defect class the
# markers were written to fix (and the last one left open).
#
# DESIGN RULE (BUG-372): a check that fires on expected behaviour is worse than no check.
# These directories legitimately accumulate .stale_*, .bak_* and sidecar files, so an
# "unlisted file" is REPORTED, never RED, unless the marker itself declares otherwise.
# RED is reserved for: a missing marker where one is required, an authoritative file that
# is absent, and a DECLARED hash/size that does not match the bytes on disk.
# =============================================================================

schema_version: "1.0"
decision: D-344

marker_name: ARTIFACT_AUTHORITY.json
roots:
  - "knowledge pipeline/stage4_merge"
  - "knowledge pipeline/stage5_verify"
max_depth: 2                 # t11 sits one level below the stage dir
require_marker_in_dirs: true # RED if a directory holding a declared pattern has no marker
undeclared_policy: report    # report | ignore — never RED (BUG-372)
report_limit: 5              # undeclared files printed per directory before "… (+N more)"

# Fields every marker must carry (a marker that omits them is RED: the claim must be legible)
required_marker_fields:
  - schema_version
  - dir
  - authoritative
  - non_authoritative
required_authoritative_fields:
  - role
  - pattern
  - artifact
  - sha256
  - bytes
# Optional per-entry keys that are honoured when present
optional_authoritative_fields:
  - why
non_authoritative_dispositions:
  - superseded_experiment
  - superseded_declared_suffix
  - intermediate
  - sidecar
  - archive_candidate
  - keep
  - append_only
