schema_version: '1.0'
# Owner domain-axis rulings (2026-10-08 owner review; round 2 = BUG-676/R158, round 3 = the drop
# propagation + R040/R091). C12c: every ruling is DATA, never code.
# Authority 1: governance/Project Domains and Domains.numbers
#   sha256 14726d947959451f7b99715d5b036e94c574f8e63bccb59c3263fbd081beed3d (2026-10-08T14:31)
# Machine face (regenerated by scripts/apply_owner_domain_review.py --export-source):
#   governance/OWNER_DOMAIN_REVIEW_SOURCE_20261008.csv
# Authority 2 (round 2): the OWNER's own answers in the confirmation sheet, pinned below.
# Authority 3 (round 3): the OWNER's acceptance of the round-2 recommendations + the DROP(13)
#   propagation ("ok I accept your recommendations R40,R80,R91" / "R140 drop" / "BUG 679 those are
#   noise drop"), recorded verbatim in governance/OWNER_RULINGS_ROUND3_20261008.md.
source:
  numbers: governance/Project Domains and Domains.numbers
  numbers_sha256: 14726d947959451f7b99715d5b036e94c574f8e63bccb59c3263fbd081beed3d
  export_csv: governance/OWNER_DOMAIN_REVIEW_SOURCE_20261008.csv
  consolidated: governance/ANCHOR_208_CONSOLIDATED_20261007.json
  ruler: governance/DOMAIN_RULER_FROZEN_20261008.json
  taxonomy: config/taxonomy_v8.yaml
  # The face the PIPELINE actually reads for the domain axis (declared authority of record:
  # config/anchor_family.yaml + config/anchor_axis_authority.yaml, D-2868). Declared HERE so the
  # cross-face divergence rail can measure it: a ruling that lands in the ruler but not here is an
  # error leak, not a cosmetic drift (BUG-682).
  authority_of_record: governance/discipline_anchor_rederived_v8_20261007.json
  # The soft-quarantine ledger: the audit trail that makes a declared drop reversible (D-2711).
  quarantine_ledger: governance/frontier_audit/noise_drop_quarantine.json
# The owner's ROUND-2 answers, written by the owner INTO the sheet. Pinned by sha256 and asserted fail-closed
# by the script: an edits-after-the-fact change here is a hard failure, not a silent re-interpretation.
answers_sheet:
  file: governance/OWNER_CONFIRMATION_SHEET_20261008.csv
  sha256: 8e02e65cc5708d5545b76f326221f98b0dcf06376176eb04f1a78a144f2a6d1b
# NOTE (D-2646/D-2649: ONE DERIVED VALUE, ONE HOME): the D150 per-FB domain cardinality cap is NOT declared
# here. Its ONE home is config/pipeline_config.yaml (key max_domains_per_fb), which is what the applier reads
# via cap_domains(); a second declaration of the same number in this file would be a rival home, and a value
# here that no reader consumes is the BUG-548 shape (a record with no consumer). Do not re-add it.
# Abstention placeholder for the domain axis - a catch-all, NEVER a menu value, and never coexists with a
# concrete domain (enforced by scripts/check_anchor_axis_consistency.py). On the DISCIPLINE axis the
# abstention is an ABSENCE, not this token (BUG-676).
abstention: emerging
# Surface normalisations applied to BOTH the base (pipeline) tokens and the owner additions.
normalize:
  educational: education
# BUG-675: the two free-text DISCIPLINE directives carried in the owner's owner_notes column.
# R091 (round 4, owner-approved on the senior recommendation): the discipline of "Autopoesis in Design
# Education" is the RIGID KIND of the content, i.e. the tradition the construct comes from - autopoiesis is
# Maturana & Varela's SYSTEMS-THEORY construct (organisational closure, self-reference), so
# `systems thinking` ("understanding complex systems by analyzing their interrelationships and holistic
# behavior") is the fit. `complex adaptive systems` is REJECTED on the menu's own definition ("systems
# composed of interacting agents that ADAPT and evolve over time"): autopoiesis is deliberately NOT an
# adaptation/evolution account, it is a self-production/closure account - choosing CAS would import the
# wrong rigid kind. `cognitive science` is rejected (this is not a claim about the mind) and
# `design thinking` is rejected (its definition yields "a designed solution", not the explanation of a
# self-producing system). This ruling lives in ONE home: this key, read for reinstated rows too.
discipline_override:
  R091: systems thinking
  R141: machine learning
  R159: risk management
# Primary-domain overrides from owner_notes free text ("X primary ...").
primary_override:
  R041: editorial & advertising
  R072: entrepreneurship
  R155: personal productivity
  R157: marketing & communications
  R159: research practice
# Explicit removals directed by the owner ("only business development remove business operations", and
# round 2: "R158 drop those domains that [are] the least applicable [to] this principle").
# R158 is an APPLICABILITY-RANKED drop, not a positional (tail) truncation:
#   - editorial & advertising - a production/channel domain; the FB is a compositional and meaning
#     principle, not a publication or advertising practice. Weakest of the nine candidates.
#   - motion design - a time-based sub-modality; "motion vs stillness" is one surface example already
#     carried by user experience + graphic design, and illustration (static visual artwork = the FB's own
#     medium) outranks it on the FB's own mechanism vocabulary.
# graphic design is RE-INSTATED: the prior positional cap-drop was mis-ranked (contrast/composition is
# this FB's core vocabulary). Rationale + the full ranking: governance/OWNER_RULINGS_ROUND2_20261008.md
remove_domains:
  R015:
    - business operations
  R158:
    - editorial & advertising
    - motion design
# Rows the OWNER declared noise_drop: cleared on ALL axes, domains do NOT apply (D-2813 precedent: for a
# noise_drop row depth and discipline do not apply). A declared drop is EXHAUSTIVE and is REMOVED from the
# axis-bearing ruler even when an upstream face still carries a pre-drop residue (BUG-679: the owner's
# RATIFY-3 DROP(13) had reached only 4 of 13 rows). Authority: RATIFY-3 DROP(13), owner-ratified 2026-09-30
# (governance/frontier_audit/noise_drop_quarantine.json, D-2711/D-2719) + round 3 propagation + R040.
# Soft-quarantine policy: the row is dropped from the AXIS authority, NEVER hard-deleted from the ledger.
noise_drop_excluded:
  - R012
  - R021
  - R026
  - R034
  - R040
  - R080
  - R082
  - R084
  - R106
  - R140
  - R148
  - R180
  - R182
  - R200
# Rows the owner KEPT that carry NO domain cell in the owner sheet (so they cannot be re-derived from it).
# Round 3: the owner ACCEPTED the round-2 recommendation for R091 - KEEP. The sheet cell said 'noise drop',
# so this is a DECLARED divergence from the sheet cell in favour of the owner's later written word
# (governance/OWNER_RULINGS_ROUND3_20261008.md). Declared here so the reinstatement is DATA, not a special case.
reinstated_rows:
  R091:
    name: Autopoesis in Design Education
    domains:
      - education
      - design strategy
    primary_domain: education
    discipline: ''            # the ruling itself lives in discipline_override (ONE home); see its comment
    abstain_discipline: false
    why: "owner-kept (round 3) + discipline ruled round 4 = 'systems thinking' (the autopoiesis tradition), approved on the senior recommendation; the raw upstream 'creative education' is off the 64-menu and is NOT used"
# Since D-2878 every cap overshoot is resolved by an explicit remove_domains directive above, so NO positional
# (tail) cap-drop remains declared. An undeclared truncation is still reported as CAP-DROP(NEW/UNDECLARED).
declared_cap_drops: {}
# BUG-676 FIX (D-2878). The owner confirmed ABSTENTION for these rows. 'emerging' is an AXIS-LEVEL verdict
# (open-set rejection), not a discipline: it may not sit in a frozen authority as if it were a menu value
# (law of non-contradiction on one axis). The ruler therefore carries discipline='' plus a declared id here.
# R140 left this list in round 3: the owner ruled it a DROP, and an abstention for a dropped row is a
# category error (asserted fail-closed by the script). R091 left it in round 4: the owner approved the
# senior discipline recommendation, so its discipline is ruled rather than abstained.
# R158's PRIMARY (design strategy) was confirmed as FINAL by the owner in round 4 - it is not changed,
# and it is not re-opened by inference (recorded in the frozen artifact's note).
discipline_abstention:
  - R006
  - R059
  - R127
  - R146
  - R165
  - R183
  - R202
# Rows the owner did NOT decide. Round 3 cleared this: every row is now either a declared drop, a declared
# abstention, or an owner-ruled axis value. Kept as an explicit empty map so the mechanism stays live.
pending_owner_rows: {}
# Sheet wrap artefacts: a cell that wrapped mid-token leaves a fragment that the generic resolver cannot and
# must not guess. Every resolved fragment is declared here; every IGNORED fragment is declared below.
token_alias:
  visualization: data visualization
# Audited sheet fragments that resolve to NO canonical domain. Declared so that an UNdeclared fragment is a
# hard failure instead of a silent drop (C16). 'emerging' is the abstention token; 'development' is the tail of
# a wrapped cell in R126 whose head ('industrial design business') was already resolved.
ignored_sheet_fragments:
  - emerging
  - development
# Every owner_notes cell in the sheet must be ACCOUNTED FOR here (role) or the script FAILS CLOSED. This is the
# guard that would have caught BUG-675: R141's 'discipline is machine learning' lived in free text that no config
# column carried, so the ruling was silently unapplied for a round.
owner_notes_accounted:
  R003: domain additions - redundant with the oov_domains cell
  R010: domain additions - redundant with the oov_domains cell
  R005: 'QUESTION - adjudicated round 2: primary stays data visualization (no high-conviction case for engineering practice); information architecture NOT added'
  R113: 'QUESTION - adjudicated round 2: primary engineering practice; computational science & physics kept as additional; systems & frameworks EXCLUDED (no high confidence)'
  R015: removal directive -> remove_domains
  R041: primary directive -> primary_override
  R072: primary directive -> primary_override
  R155: primary directive -> primary_override
  R157: primary directive -> primary_override
  R159: primary directive -> primary_override
  R141: discipline directive -> discipline_override
# CROSS-FACE DIVERGENCE (BUG-682). The ruler is the OWNER-DERIVED truth for the discipline / domain /
# primary_domain axis. The faces below are declared to FOLLOW it. The pipeline still reads the declared
# authority_of_record, which has NOT yet received the round-2/round-3 rulings, so the divergence is measured
# on every run and its declared ceiling is SHRINK-ONLY: it must go to 0 when the projection lands (Stage 2).
#   ceiling_divergence  = axis CELLS that disagree with the ruler on a shared item_id.
#   ceiling_drop_residue = axis cells still populated for a declared noise_drop row (a propagated drop).
# A value equal to the declared abstention token is an ABSENCE, not a value, and is never counted.
faces:
  ceiling_divergence: 92
  ceiling_drop_residue: 46
  must_follow:
    - name: discipline_anchor_rederived_v8
      file: governance/discipline_anchor_rederived_v8_20261007.json
      rows_key: rows
      columns:
        discipline: discipline
        domains: domain
        primary_domain: primary_domain
    - name: ANCHOR_208_CONSOLIDATED
      file: governance/ANCHOR_208_CONSOLIDATED_20261007.json
      rows_key: rows
      columns:
        discipline: discipline
        domains: domain
        primary_domain: primary_domain
