  - Skin in the Game — Nassim Nicholas Taleb
  cluster_segments:
  - source_book: The Black Swan — Nassim Nicholas Taleb
    text: 'Black Swan events — rare, high-impact, retrospectively predictable occurrences — drive history more than the ordinary.
      The 2008 financial crisis, the rise of the internet, and World War I were all Black Swans. Our models fail to predict
      them because we are fooled by the narrative fallacy: we construct stories that make past events seem predictable, then
      project that false certainty forward.'
  - source_book: Antifragile — Nassim Nicholas Taleb
    text: Some systems gain from disorder — they are antifragile. Bones strengthen under stress, startups benefit from market
      chaos, and evolutionary systems thrive on randomness. The opposite of fragile is not robust (which merely resists shock)
      but antifragile (which improves from it). Most of what we design is fragile precisely because we optimize for stable
      conditions.
  - source_book: Skin in the Game — Nassim Nicholas Taleb
    text: 'Decision-makers must have skin in the game — personal exposure to the consequences of their decisions. Without
      asymmetry of risk, bad decisions proliferate because the decider captures upside while transferring downside to others.
      This is why consultants, bankers, and policymakers produce systemic fragility: they are rewarded for short-term gains
      while others bear long-term losses.'
