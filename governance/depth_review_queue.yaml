  input_fb:
    name: Universal Narrative Grammar
    definition: Narrative structures across cultures follow a shared underlying grammar
      composed of recurring character types (actants), plot functions, and relational
      patterns. This grammar provides a systematic framework for organizing stories
      and conversations that transcends cultural and linguistic boundaries.
    mechanism: The principle describes a structural pattern rather than a causal mechanism.
      Narrative systems consistently employ the same fundamental roles (subject, object,
      opponent, helper, sender, receiver) and relational configurations across different
      cultural contexts. These actants and their interactions form a recurring syntactic
      structure that organizes both fictional narratives and conversational discourse,
      suggesting a universal cognitive or communicative framework for storytelling.
    boundary: Applies to narrative systems where stories are structured around character
      roles and plot functions. Fails when narratives are purely descriptive, non-sequential,
