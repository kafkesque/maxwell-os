- id: 0296dd23dc822c1c9708b54943a2b116c18bea44adc23bd677f20eda210c374a
  input_fb:
    name: Archetypal Psychological Resonance
    definition: Certain symbolic forms and narratives resonate across cultures and
      generations because they tap into deep psychological structures rooted in shared
      human experience and unconscious archetypes. These archetypal patterns manifest
      in stories, art, and cultural symbols as recurring themes that reflect fundamental
      aspects of the human condition.
    mechanism: The human psyche contains universal patterns or archetypes that emerge
      from collective unconscious experiences and biological development. These archetypes
      are expressed through symbolic forms in narratives, art, and rituals, creating
      resonance across different cultures and time periods. When individuals encounter
      these archetypal patterns, they activate pre-existing psychological frameworks
      that shape interpretation and emotional response.
    boundary: Applies when symbolic forms or narratives tap into shared psychological
      structures and unconscious patterns. Fails when symbols or stories are purely
      culturally specific or lack psychological depth, or when they are disconnected
      from collective human experience and unconscious processes.
