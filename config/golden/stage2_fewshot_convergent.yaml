- id: CONV-013
  domain: user experience
  discipline: human-computer interaction
  source_books:
  - The Design of Everyday Things — Don Norman
  - Don't Make Me Think — Steve Krug
  - About Face — Alan Cooper
  cluster_segments:
  - source_book: Don't Make Me Think — Steve Krug
    text: 'Users don''t want to think about how an interface works — they want to complete their

      task. Progressive disclosure is the practice of showing only the essential controls

      and revealing advanced options only when needed. It reduces cognitive load and lets

      novices use the interface immediately while experts can still find the power features.

      '
  - source_book: About Face — Alan Cooper
    text: 'Novice and expert users have different needs. Novices need simplicity; experts need

      efficiency. Progressive disclosure serves both by presenting a simple default surface

      while hiding advanced functionality behind progressively deeper layers. The key is

      that the user must be able to discover the deeper layers without prior training.

      '
  - source_book: The Design of Everyday Things — Don Norman
    text: 'Information overload is a design failure, not a user failure. When an interface

      presents all options simultaneously, the user''s working memory is overwhelmed and

      decision quality drops. Reducing the number of visible options at any moment —

      revealing more only on demand — improves both learnability and expert performance.

      '
  is_convergent: true
  should_extract: true
  expected_fb:
    is_summary: false
    route: FB
    name: Progressive Disclosure
    definition: 'Show only the controls relevant to the current task; reveal advanced functionality

      progressively as the user requests it. This reduces cognitive load, improves

      learnability for novices, and preserves efficiency for experts.

      '
    mechanism: 'Progressive disclosure works because working memory is limited (~4 chunks). Presenting

      all options at once forces the user to filter and remember, while revealing options

      on-demand converts the interface into an external memory: the user knows where to

      look rather than needing to remember what exists.

      '
    consequence: 'Interfaces with progressive disclosure are learnable by novices within minutes while

      remaining efficient for experts, because both populations see an appropriate level of

      complexity for their current task.

      '
    boundary: 'Applies when the feature set is large relative to the task set. Fails when: (1)

      hiding is so aggressive that users cannot discover important features; (2) the

      interface must be used by experts exclusively (they prefer flat, dense surfaces);

      (3) the disclosure requires significant interaction cost (too many clicks to reveal).

      '
    evidence_passages:
    - Progressive disclosure is the practice of showing only the essential controls
    - Novices need simplicity; experts need efficiency
    - Reducing the number of visible options at any moment
    depth: domain
    extraction_type: normative_heuristic
    content_type: principle
  rationale: "Krug, Cooper, and Norman converge on progressive disclosure as the UX principle for\nmanaging complexity. Demonstrates\
    \ Digital & Interactive group, depth, evidence,\nprocedural_skill, failure_mode.\n Progressive disclosure is a prescriptive\
    \ design rule: 'Show only the controls relevant to the current task.' It says DO this to reduce cognitive load — it is\
    \ a practical heuristic for interface design, not a causal mechanism."
  tier: GOLD-A
- id: CONV-014
  domain: systems & frameworks
  discipline: systems thinking
  source_books:
  - Six Degrees — Duncan Watts
  - The Fifth Discipline — Peter Senge
  - Antifragile — Nassim Taleb
  cluster_segments:
  - source_book: Six Degrees — Duncan Watts
    text: 'Watts''s research on small-world networks reveals that the structure of connections, not the strength of individual
      nodes, determines how influence propagates through a system. In a small-world network, most nodes connect only to their
      immediate neighbors, yet a few long-range shortcuts collapse the average path length between any two nodes. This is
      structural leverage: rewiring a handful of connections can change the behavior of the entire network more dramatically
      than strengthening any single component — the topology of information flow is the point of intervention.'
  - source_book: The Fifth Discipline — Peter Senge
    text: 'Systems thinking reveals that the most effective interventions often target the

      feedback loops and mental models that shape behavior, not the events themselves.

      ''Small changes can produce big results — but the areas of highest leverage are often

      the least obvious.''

      '
  - source_book: Antifragile — Nassim Taleb
    text: 'Systems that are robust to small perturbations fail catastrophically when exposed to

      rare events. Antifragile systems, by contrast, gain from disorder — they use

      optionality and redundancy to convert volatility into benefit. The location of the

      intervention matters more than its size.

      '
  is_convergent: true
  should_extract: true
  expected_fb:
    is_summary: false
    route: FB
    name: Structural Leverage
    definition: 'In any system, the highest-leverage interventions target structure (information

      flows, feedback loops, goals, and rules) rather than parameters (quantities, rates,

      stocks). A small structural change can produce outsized behavioral shifts, while

      large parameter changes often produce only marginal effects.

      '
    mechanism: 'Parameters are the weakest points because they merely scale existing dynamics.

      Information flows and feedback loops change the dynamics themselves — they alter how

      signals propagate through the system, which compounds across all downstream behavior.

      Goals are the most powerful because they redefine what the system optimizes for.

      '
    consequence: 'Systems interventions should be sequenced from structure-first to parameter-last:

      change the goal, change the information flows, change the feedback loops, then change

      parameters. This ordering maximizes the probability of durable system change.

      '
    boundary: 'Applies to complex adaptive systems with feedback. Fails when: (1) the system is

      linear and decoupled (parameter changes dominate); (2) stakeholders have veto power

      over structural change; (3) the system is too small for structural intervention to

      matter relative to noise.

      '
    evidence_passages:
    - a few long-range shortcuts collapse the average path length between any two nodes
    - the most effective interventions often target the feedback loops and mental models
    - rewiring a handful of connections can change the behavior of the entire network more dramatically than strengthening
      any single component
    - The location of the intervention matters more than its size
    depth: cross-domain
    extraction_type: causal_mechanism
    content_type: principle
  rationale: 'Cross-domain: Watts (network science), Senge (organizational learning), and Taleb (complexity) converge on structural-vs-parametric
    leverage. The mechanism presupposes systems framing (feedback loops, information flows, goals, rules) — a systems-thinking
    lens, not a universal law. A poet manipulating language is not operating on the same feedback-loop mechanics. Fails the
    physicist-chef-poet test.'
