# laya-mlx typed-decision arm - BENCHMARK-ONLY SANDBOX (D-300 / D-322). Not a pipeline dependency (D-275c).
version: '1'
enabled: false                      # nothing in the production path reads this file
role: labeler                       # projected onto OUR menu via caller-supplied criteria (no projection layer)
adoption_bar: 'D-300: >=5.0 absolute pp error-rate gain on the frozen ruler at equal-or-lower abstention'
phase_a_scope: feasibility only     # 61-way criteria degradation, latency, RAM, output validity - NO labels, NO deploy
phase_b_blocked_on: 'F-11 second coder on the 150-row ruler (D-317): a win on single-coder attested labels is advisory'
venv: .venv_laya                    # isolated; never the production interpreter
imports_in_production_code: false
licence:
  repo: Apache-2.0                  # pip install laya-mlx
  checkpoint: UNVERIFIED            # HF checkpoint licence MUST be recorded before first measured use (R14)
weights:
  - repo: aac6fef/laya-mlx
    role: primary
    revision: PIN-AT-INSTALL
    sha256: PIN-AT-INSTALL
  - repo: aac6fef/laya-multilingual-mlx
    role: required (multilingual corpus)
    revision: PIN-AT-INSTALL
    sha256: PIN-AT-INSTALL
menu: config/closed_menu_v5.json    # 61-slot criteria list is passed verbatim; menu_hash must be recorded per run
