# config/freeze_window.yaml - THE FREEZE WINDOW (D-2688). The ONE home of "what is parked, and what ENDS it".
#
# WHY THIS FILE EXISTS. MEASURED 2026-09-27: the META-LANE FREEZE was asserted in fifteen prose homes
# (MASTER-TASK-REGISTER.md, governance/SESSION-HANDOFF-2026-09-26.md, governance/buglog.md,
# governance/CONTEXT_INDEX.md) and existed in NO file a machine could read. It therefore failed three ways at
# once: NOTHING READ IT (a claim about work not done can never fail), IT DECLARED NO EXIT (an unwritten exit
# makes a WINDOW indistinguishable from a POLICY, and a policy has no horizon - it outlives the reason it was
# opened for: the D-337 permanent-freeze trap), and IT COUNTED NOTHING (the parked set could grow for ever
# with no reader to notice, so "we are frozen" and "we are stuck" print the same way).
# This file is the ONE home; scripts/check_freeze_window.py is the ONE reader.
#
# WHAT A WINDOW IS NOT. It is not a ban on work. The lane the window protects stays the DEFAULT lane, closing
# a parked bug DRAINS the window rather than breaching it, and a red rail outranks the freeze.
schema_version: '1'
authority: D-2688

window:
  id: META-LANE-FREEZE-1
  state: closed                # open | closed - a window outliving its MET exit is a policy, and the rail is loud
  opened: 2026-09-27
  ruled_by: 'the owner, 2026-09-27 ("ok freeze window + your recommendations")'
  #: THE CLOSE (owner word 2026-10-17, verbatim: "META-LANE-FREEZE-1 close it"). Recorded in the ONE home its
  #: reader reads (D-2688), never in prose: the rail COMPUTES the exit from this file, so a close that lives
  #: anywhere else is a belief. It is a close BY ITS OWN TERMS, not around them - see `released` below.
  closed: '2026-10-17'
  closed_by: 'the owner, 2026-10-17'
  closed_why: >-
    CLOSED BY ITS OWN TERMS. opening_set_closed was already MET. nothing_still_held becomes MET because the two ids
    still OPEN are RELEASED below by an owner ruling - and a release states the truth exactly: they are NOT fixed,
    they are no longer PARKED. A released id stays OPEN in the register and is worked in the ordinary lane; what
    ended is the HOLD, which is all this window ever was. The horizon 2026-10-11 had passed with the exit unmet, so
    the declared choices were RE-RULE or CLOSE (D-337: renewing by default is how a window becomes a policy). The
    owner closed it. NOT claimed here: that the two released defects no longer matter. They matter; they are simply
    no longer held.
  scope: >-
    The governance MACHINERY: the rails, the registries and the controls that make the tree auditable. A NEW
    governance bug may be FILED (measured, with a remedy) but NOT WORKED while this window is open; the product
    lane is the DEFAULT lane.
  why_measured: >-
    MEASURED 2026-09-27: ~37 of the last 40 filed bugs were about the machinery itself. The precondition for
    switching to product work was that the ladder report its WHOLE fault set in one pass, and it does: 94
    line(s) RUN, 0 fault(s), 227.7s.
  not_frozen:
    - 'the PRODUCT lane: it is the default lane, and nothing in this file may be cited to refuse product work'
    - 'closing a bug this window HOLDS: draining the parked set is the exit, not a breach of it'
    - 'a defect a rail reports RED mid-flight: a red rail outranks the freeze (C16)'
  exceptions_spent:
    - 'BUG-575 and BUG-571 were worked after this window was proposed and BEFORE it was ruled: the one exception, now spent (measured: both CLOSED)'
    - 'BUG-586 was FILED and FIXED by the very change that opened this window (the freeze had no home and no reader): a change that OPENS a window cannot be behind it, and filing the defect it fixes is not working a new bug - the exception, now spent'

  # THE PARKED SET, pinned BY IDENTITY. A parked id the register does NOT carry is a STALE declaration (D-405),
  # and the set outgrowing `max_held` is FATAL - a window whose parked set grows silently is exactly the policy
  # this file exists to remove. Raising the ceiling is a one-line diff a human reads, in the SAME change that
  # parks the bug.
  held:
    - BUG-585     # agent/session_seed.yaml states the open-bug count TWICE (a stale 77 beside the DERIVED 134)
    - BUG-584     # the BUG-582 fix wrote three of its justfile lines TWICE (the ladder over-reports its own size)
    - BUG-583     # 5 of 812 decision records spell the state 'active' while 505 spell it 'ACTIVE'
    - BUG-572     # a state word that enters the decision registry unread (the BUG-575 class, one level down)
    - BUG-570     # a machinery defect, filed and unworked behind the window
    - BUG-568     # a machinery defect, filed and unworked behind the window
    - BUG-569     # a machinery defect, filed and unworked behind the window
    - BUG-559     # filed before this window; a machinery defect, not a product one
    - BUG-588     # FILED by D-2690: DECISION-LOG.md declares a decision COUNT stale by 169, in an append_only
                  # file where no append can repair it
    - BUG-587     # FILED by D-2689 while minting D-2689: the registry's write path cannot be SEEN to lose
                  # a record - the same class as this window's own oracle, one file over
    - BUG-591     # FILED by D-2696, MEASURED while instrumenting BUG-568: scripts/lib/fixture.py#git() INHERITS
                  # the ambient git subject, so a known-answer fixture can be built into a FOREIGN repository -
                  # or into THIS one, under the hook's legitimate GIT_DIR. A new governance bug may be FILED and
                  # PARKED while this window is open, never WORKED: which is why max_held moves with it.
    - BUG-593     # FILED by D-2699, MEASURED while attempting the BUG-559 drain (D-2676 limb iv): the
                  # mutation gate's fixture is built from git init + add + commit - ONE commit, NO history -
                  # so a rail whose oracle joins git refs of the LIVE repository has a RED baseline inside
                  # the fixture, and limb (iv) cannot be satisfied for it. Remedy declared in the block: a
                  # fixture.history recipe (preferred), or a rule declared uncoverable with its reason and
                  # joined both ways (D-405). A new governance bug may be FILED and PARKED while this window
                  # is open, never WORKED: which is why max_held moves with it.
  max_held: 12

  # AN OWNER RULING, recorded where its reader is. A released id MUST also be in `held` (else the ruling is
  # about nothing), and its reason is REQUIRED: `released: {}` is the honest empty case.
  released:
    BUG-591: >-
      DRAINED by D-2697, under this window own not_frozen clause (closing a bug the window HOLDS is the exit, not
      a breach of it). The defect was the fixture BUILDER handing its child git the ambient environment; the fix
      DERIVES the child env from the pin ONE home (git_subject.cleared_env, D-2646) and the control is a REAL
      DECOY with its own marker, MUTATION-SEEN (floor 31 -> 32). The id STAYS in window.held above: a release is
      a ruling ABOUT a hold, not a deletion of it, and the freeze rail refuses a release of an id held does not
      name (D-2688).

    BUG-559: >-
      RELEASED, NOT DRAINED, by the owner's close of this window (2026-10-17). MEASURED at the close: the register
      carries BUG-559 OPEN (a receipt can be cut over bytes joined to NO revision, so mutability: human_authored was
      certified by a claim the machine cannot check) and this window never worked it. The ruling is therefore about
      the HOLD and nothing else: it is no longer parked, it is not fixed, and it is worked from now on in the
      ordinary lane like any other open defect. Recorded here rather than by deleting it from `held`, because a
      release is a ruling ABOUT a hold (D-2688).
    BUG-593: >-
      RELEASED, NOT DRAINED, by the same owner word (2026-10-17). MEASURED at the close: BUG-593 (the mutation
      gate's fixture carries ONE commit, so a rule whose oracle joins GIT HISTORY cannot satisfy limb (iv)) is
      still OPEN, and it stayed parked for TWO windows' worth of days because a window with an unmet exit cannot
      be re-opened for it. Its remedy is a fixture.history recipe - ordinary product work, not a governance
      emergency - which is exactly what the ordinary lane is for. NOT fixed; no longer held.

  # THE WRITTEN EXIT. Each clause is a fact a reader settles WITHOUT judgement; `review_by` is the horizon a
  # WINDOW must have and a POLICY never does.
  exit:
    criteria:
      - id: opening_set_closed
        claim: 'every bug this window was opened to finish is CLOSED in the register'
        bugs: [BUG-577, BUG-575, BUG-571]
      - id: nothing_still_held
        claim: 'nothing is still parked: every held id is CLOSED in the register, or RELEASED here by a ruling with a reason'
    review_by: 2026-10-11
    on_exit_met: >-
      The owner CLOSES the window (state: closed) or re-rules its exit. The rail goes OWNER-OWED (rc 2, loud,
      NOT fatal) the moment the exit is MET: a window that outlives its own exit is a policy.
    on_horizon_passed: >-
      The owner RE-RULES the window (a new review_by with a reason) or closes it. Renewing by default is how a
      window becomes a policy, which is the defect this file was written to remove.
