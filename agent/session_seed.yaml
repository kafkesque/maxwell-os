session:
  version: 3.0.0
  pipeline_commit: v3.0-D2370
  schema_version: '3.0'
  project_root: knowledge pipeline/
models:
  generator:
    model: Qwen3-Coder-30B-A3B-Instruct-MLX-4bit
    provider: omlx
    temperature: 0.0
    family: qwen
  classifier:
    model: gpt-oss-20b-MXFP4-Q8
    provider: omlx
    temperature: 0.0
    family: gpt-oss
    notes: 'D2249: S4 classifier (NOT the S5 verifier). D2340 renamed from `verifier`
      to stop role confusion.'
  probe:
    model: Phi-4-mini-instruct-8bit
    provider: omlx
    family: phi
    notes: 'D2319: S2 fast probe (~1.5s), NOT an S5 verifier. D2298 removed Phi from
      S5 verification only (67% acc, hallucination risk); S5 = DeBERTa-only. D2340:
      renamed from misleading `verifier_v2`.'
  embeddings:
    model: bge-m3
    provider: ollama
    dims: 512
    family: bge
  nli:
    model: MoritzLaurer/DeBERTa-v3-large-mnli-fever-anli-ling-wanli
    provider: local
    family: deberta
    notes: 'D2298: DeBERTa-v3-large sole NLI verifier, threshold 0.10. D2322 honest
      auto-cal: P=0.647/R=0.386/F1=0.484 (D2293''s P=1.000 was on the broken pre-D2321
      call — NOT reproducible). RoBERTa/ModernBERT removed (zero signal / superseded).
      D2440 (pending): run AlignScore + MiniCheck through pipeline/calibrate.py harness
      vs DeBERTa before any threshold change — F1>0.484 gate + fail-closed (D2093).'
  evidence_tier:
    axis: convergence
    values:
    - convergent
    - single_source
    - singleton
    persisted: true
pipeline:
  stages:
    stage0: convert
    stage0_5: extract_metadata
    stage1: chunk
    stage1_3: prefilter
    stage1_5: embed_cluster
    stage2: extract
    stage4: classify
    stage5: verify
    stage6: commit
  clustering:
    method: FAISS
    metric: cosine
    threshold: 0.75
    embed_model: bge-m3
    min_source_diversity: 2
  classification:
    method: multi_label
    model: classifier
    max_domains_per_fb: 5
  verification:
    borp_min_sources: 2
    nli_model: MoritzLaurer/DeBERTa-v3-large-mnli-fever-anli-ling-wanli
    nli_entailment_threshold: 0.1
    cross_family_verifier: null
    fail_mode: fail_closed
services:
  omlx:
    host: localhost
    port: 11435
    api_key: sk-maxwell-local
    watchdog: pipeline/omlx_watchdog.py
    memory_guard: pipeline/memory_guard.py
    memory_limit_gb: 24
  ollama:
    host: localhost
    port: 11434
storage:
  canonical: knowledge pipeline/maxwell.db
  checkpoints: knowledge pipeline/checkpoints/
  parquet: knowledge pipeline/parquet/
  archive: knowledge pipeline/archive/
content_type:
  registry: config/content_types.yaml
  content_types:
  - principle
  - process_template
  - process_instance
  - tool_instruction
  - growth_edge
  extraction_types:
  - causal_mechanism
  - descriptive_model
  - normative_heuristic
  - empirical_pattern
  note: 2 orthogonal axes. Core body shared; per-type extension delta. D2150 (extraction→content)
    + D2128 (route→content) mappings in registry.
governance:
  constitution: CONSTITUTION.md
  decision_log: DECISION-LOG.md
  master_task_register: MASTER-TASK-REGISTER.md
