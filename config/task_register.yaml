    \ half of BUG-844, because it turns a discipline the\n  caller keeps into a GREPPABLE token a reader can refuse on.\
    \ (2) A JOURNAL FIELD, not a boolean:\n  `isolation: enforced|instructed`, where `enforced` may be claimed ONLY when\
