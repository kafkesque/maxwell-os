  summary: 'S4 CRIBS enrichment was ~61s/FB. Root cause: batch_cribs_classify results were silently ignored (merged_call_enabled config orphaned; _use_merged never set), forcing the slow two-call path.
    Peer-reviewed alternatives evaluated (vLLM continuous batching, speculative decoding, prompt compression/LLMLingua, distillation, constrained decoding). Verdict: batch CRIBS (D2265) is the reliable/viable/feasible
    choice — amortizes GPT-OSS reasoning across 4 FBs (~19.4s/FB vs ~61s/FB, ~3x). Fixed the wiring so _pre_classified batch results are consumed (elif cluster_id in _pre_classified).'
  files:
  - pipeline/stage4_merge.py
  - pipeline/stage4_merged_call.py
  state: ACTIVE
- id: D2304
  title: DSPy Tier-Aware Split + Program Load — D2286 enforced
  category: ARCH
  date: '2026-08-12'
  summary: 'Implemented tier_aware_split() in dspy_trainer.py: GOLD-A (49) → train, GOLD-B (3) → dev, CHALLENGE (21) → test. Default split strategy is now "tier" (was random, which leaked CHALLENGE hard
    negatives into train). Added load_optimized_program() for D2243 persistence, config-driven DSPY_PROGRAM_PATH (was hardcoded /tmp). CLI --split {tier,random} and --load flags. golden_to_examples() now
    attaches ex.tier.'
  files:
  - pipeline/dspy_trainer.py
  - pipeline/pipeline_paths.py
  - config/pipeline_config.yaml
  state: ACTIVE
- id: D2305
  title: Pipeline Audit Revelation — recall + latency SLA blindspots logged
  category: ARCH
  date: '2026-08-12'
  summary: 'Senior RAG audit identified remaining blindspots: (1) no end-to-end recall measurement against golden set (yield was never measured vs ground truth), (2) no end-to-end latency SLA. Also: modularity
    gaps (D2300), DSPy gaps (D2302), CRIBS bottleneck (D2303). Recall blindspot closed via D2307 recall_measure.py.'
  files:
  - governance/aggregated_remaining_tasks.md
  - pipeline/recall_measure.py
  state: ACTIVE
- id: D2306
  title: InferenceProvider + EmbeddingProvider Protocol Implemented
  category: ARCH
  date: '2026-08-12'
  summary: Implemented OMLXInferenceProvider (pipeline/providers/omlx_provider.py) and OllamaEmbeddingProvider (pipeline/providers/ollama_provider.py), both implementing the D2055 protocols from providers/base.py.
    They delegate to omlx_call/ollama_embed (single HTTP code path). Exported from providers/__init__.py. Closes the D2300 component-level gap for inference + embedding; StorageBackend (stage6 SQLite) remains.
  files:
  - pipeline/providers/omlx_provider.py
  - pipeline/providers/ollama_provider.py
  - pipeline/providers/__init__.py
  state: ACTIVE
- id: D2307
  title: Recall Measurement — golden-set recall_measure.py
  category: VAL
  date: '2026-08-12'
  summary: 'Created pipeline/recall_measure.py to close the recall blindspot. Measures golden-set recall via normalized name token-overlap (Jaccard) matching — deterministic (R7), no LLM call. Reports recall/precision/F1
    + per-tier breakdown (D2286). Name-based matching chosen over evidence matching because S2 paraphrases evidence (D2227), which would under-count recall. Smoke-tested on probe output: recall 0.019 on
    40-FB probe (expected — probe did not sample golden principles).'
  files:
  - pipeline/recall_measure.py
  state: ACTIVE
- id: D2308
  title: Source identity — work-level canonical identity (fix duplicate-edition false convergence)
  category: DATA
  date: '2026-08-12'
  summary: 'Roundtable adjudication found is_convergent:true on same-work duplicate editions (Safe Withdrawal Rate, Transgenic, Black Swan). Root cause is 3 stacked failures: (1) compute_source_id SHA-256(author|title)
    fed inconsistent metadata (subtitle/co-author/title-concat); (2) isor_score counts raw filenames; (3) broken author parse. Fix: normalize author/title before hashing (strip subtitles, primary author,
    collapse title+subtitle), add content_hash tiebreaker, redefine is_convergent on distinct canonical works >=2 not distinct files. Full Work/Edition/File graph is future work, not a prerequisite.'
  files:
  - pipeline/book_metadata.py
  - pipeline/stage1_5_embed_cluster.py
  state: ACTIVE
- id: D2309
  title: ISOR — metadata-author extraction + canonical source count + precedence fix
  category: VAL
  date: '2026-08-12'
  summary: 'isor_score author extraction (_extract_author_surname) expects "Title — Author" em-dash but corpus uses "Title (Author) (source).md" parenthesis (0/268 vs 268/268) → returns full filename →
    n_authors==n_sources, author_score pinned 1.0, "weak" bucket dead (0/40). Also rating condition n_authors>=2 or n_domains>=2 and n_sources>=2 has and-binds-tighter precedence. Fix: use resolve_book_metadata()
    author, count canonical source_ids via resolve_source_ids(), parenthesize the rating condition.'
  files:
  - pipeline/schema_accessor.py
  state: ACTIVE
- id: D2310
  title: S5 confidence — NLI as gate not 75% weight + per-passage aggregation + human adjudication
  category: QLT
  date: '2026-08-12'
  summary: 'Confidence = 0.15*mech + 0.75*NLI + 0.10*enrich floors at 0.25 on any NLI fail (fact_score=0.0), producing 77.5% quarantine (9 PASS / 31 QUARANTINE) and R=0.556. DeBERTa max-entailment over
    <=8 passages is opaque. Fix: NLI as binary gate; compute confidence from ISOR + mechanism + enrichment; per-passage NLI with explicit aggregation; human-adjudication path for canonical principles (Progressive
    Disclosure, Warren Harding, True Cost Accounting false-quarantined).'
  files:
  - pipeline/stage5_verify.py
  state: ACTIVE
- id: D2323
  title: Content-Type Ontology Consolidation — 5 roles × 4 forms, single config registry
  category: ARCH
  date: '2026-08-13'
  summary: 'Fractured content-type taxonomy consolidated into config/content_types.yaml (single source of truth). Two orthogonal axes: content_type (5 roles) × extraction_type (4 forms). Shared core body
    + per-type extension delta. tool_instruction gets a 13-field MCP/JSON-Schema/man-page schema (was undefined). Drops vestigial fact/meta. Reconciles D2072 + D2150 + D2128. Rationale: PT/PI are the Layer-2
    product, currently orphaned at S2→S4 + trained on stale content_type vocabulary (contamination under temp=0.0). Contract frozen; code wiring + golden-example fix next session.'
  files:
  - config/content_types.yaml
  state: ACTIVE
