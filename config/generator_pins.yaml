  #   farm (`hf cache rm bbecedefd8…`) because the engine serves `main` (readlink -f ~/.omlx/models/<name> ->
  #   snapshots/main), and the pin was never carried to the served copy, so `rev: <commit>` stopped resolving. A
  #   real-file dir is NOT content-addressed, so identity_sha256 is DEEP-ONLY and not a daily-checked fact: the
