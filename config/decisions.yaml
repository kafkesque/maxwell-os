- id: D-369
  category: INFRA
  state: PROPOSED
  title: "Model-store reclaim is config-reference-driven and LIST-FIRST: no byte moves until the keep/delete list is owner-approved"
  description: 'Gate A2 accepted 2026-09-23, and Gate A is KILLED (no external volume is mounted and its ~16.5 GB
    is ~2% of a 28 GiB deficit). The measured reclaim target is the model stores, not the archive: 280 GB total
    against 28 GiB free. Config-reference classification (keep only what config/model_assignments.yaml or
    config/pipeline_config.yaml names) yields ~84 GB genuinely in use and ~78 GB of candidates
    (governance/MODEL_STORE_RECLAIM_A2_20260923.md). THREE rules: (1) never rm a model store - remove it from the
    SERVING list, restart, load from the surviving store and confirm the model ANSWERS, then reclaim; (2)
    ~/.omlx/cache (92.5 GB) is content-addressed with no names and is the LIVE cache of a running server, so it
    cannot be pruned by config reference and is touched last, server stopped; (3) two candidates are decisions,
    not deletions - ~/models/Qwen3.6-35B-A3B-6bit (27.1 GB) is named by nothing, and ~/.mtplx/models holds
    Qwopus3.6-35B (20.6 GB) which model_assignments.yaml calls a PHANTOM that "does not exist locally" while it
    does. PROPOSED, not RATIFIED, because no byte has moved and the 27.1 GB orphan needs an owner answer.
    Corollary: this session produced the LIST and stopped exactly where the rule says to stop.'
  target_files: ['governance/MODEL_STORE_RECLAIM_A2_20260923.md']
  created: 2026-09-23

- id: D-370
  category: GOVERNANCE / FORENSIC AUDIT
  state: RESOLVED
  title: "A model store is classified by RESOLUTION (readlink + served-model list), never by directory name and never by du (append-only amendment to D-369)"
  description: 'APPEND-ONLY AMENDMENT to D-369 - D-369 is unchanged, R-D410 (BUG-414, 2026-09-23). The A2
    PROCEDURE in D-369 stands: list first, and move no byte until the owner approves. Its CLASSIFIER is
    replaced, because the first pass produced exactly one class of error and it was the expensive class:
    the single largest candidate on the list WAS the served generator. RULE: a model store is classified by
    RESOLUTION - the resolved readlink target plus the SERVED-MODEL LIST - never by directory name, and
    never by du, which reports 0 MB for a symlink and then the FULL size of its target, so it double-counts
    and mis-labels. Corollary 1: huggingface hub is not a cache - it IS the serving store for 5 of the 7
    served models. Corollary 2: a DIGEST TEST IS NOT A DELETION TEST - an artifact that no longer matches a
    digest is not thereby unserved. Corollary 3: the evidence that a reclaim is safe is (a) absent from the
    serving list, (b) zero references in config, code and golden sets, (c) a surviving store that loads AND
    ANSWERS after a restart, (d) a logged restorable source id. Corollary 4: execute LAST-VERIFIED-FIRST,
    never list-first, so a failure at item k leaves the verified prefix reclaimed and every unverified item
    untouched. No byte moved under this record; the corrected resolution-first list still requires the owner
    answer on its two knowledge items.'
  target_files: ['governance/MODEL_STORE_RECLAIM_A2_CORRECTED_20260923.md',
    'governance/MODEL_STORE_RECLAIM_A2_20260923.md']
  created: 2026-09-23

