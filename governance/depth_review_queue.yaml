  input_fb:
    name: Automation-driven Economic Displacement
    definition: The widespread adoption of AI and automation technologies creates
      systemic shifts in employment patterns, productivity, and wealth distribution.
      These changes manifest as job displacement, reallocation of labor, and increased
      inequality when not managed with deliberate policy intervention.
    mechanism: Automation and AI systems increase productivity by replacing human
      labor in routine and predictable tasks, leading to job losses in sectors where
      these technologies are deployed. As productivity rises, the economic gains often
      concentrate among capital owners and highly skilled workers, while lower-skilled
      workers face reduced employment opportunities and declining job quality. Without
      managed acceleration or policy adjustments, this process can exacerbate wealth
      inequality and create jobless recoveries where economic growth does not translate
      into proportional employment growth.
    boundary: 'Applies when: (1) AI and automation technologies are widely adopted
      in labor markets, (2) these technologies displace human workers in routine or
      predictable roles, and (3) there is insufficient managed policy response to
      guide reallocation. Fails when: (1) automation is limited to specific sectors
      or industries, (2) there is strong institutional support for retraining and
      job transition, or (3) the economy experiences a demand-driven recovery that
      absorbs displaced workers.'
