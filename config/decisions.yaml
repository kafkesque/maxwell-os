    are near-INDEPENDENT (phi=0.093, kappa=0.062; both=532 / cleanlab-only=2,890 / NLI-only=342 / neither=3,278, n=7,042). REFINES the ChatGPT correlation worry — the Dawid-Skene independence assumption
