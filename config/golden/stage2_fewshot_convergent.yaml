    text: 'High-quality work produced = time spent × intensity of focus. When you give yourself an entire day to complete
      a three-hour task, the intensity drops to fill the slack and the output quality suffers. Fixed-schedule productivity
      — committing to finish work by a specific time and treating that deadline as non-negotiable — forces the intensity that
      produces both quantity and quality. The heuristic is counterintuitive but robust: constrain the time to improve the
      output.'
