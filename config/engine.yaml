schema_version: "1.0"
# THE ENGINE'S OWN FACTS, in one home (C12). Nothing that reads this file may restate a value.
# A CHANGE HERE INVALIDATES THE CACHED ARCHITECTURE ORACLE, and that is now a MECHANISM rather than a hope
# (BUG-1016, measured 2026-10-25): pipeline/model_loadability_probe.py keys its cache on the ENGINE'S IDENTITY -
# the bundle, the app version from its Info.plist, the mlx_lm dist-info and a sha256 over its model module names -
# and tests that identity BEFORE the clock. An app install therefore invalidates the cache by itself, with no flag.
# MEASURED 2026-10-25: oMLX 0.7.2 -> 0.7.3.dev2 moved the bundled runtime from mlx_lm 0.31.4.dev132 (134
# architectures) to 0.32.3.dev8+g0d4d3d04f (137 module files), and the same probe command re-measured by itself.
# A verdict here is a statement about THAT BUILD, never about a version number: 0.32.3 was newer than the upstream
# commit that added flint.py and still had no flint module (BUG-1019).
engine:
  name: omlx
  bundle: /Applications/oMLX.app/Contents   # the installed app's Contents; Resources/omlx is the engine source
  oracle_python: Resources/Python/cpython-3.11/bin/python3      # relative to bundle
  oracle_site: Resources/Python/framework-mlx-base/lib/python3.11/site-packages
  oracle_ttl_days: 7
  host: 127.0.0.1
  port: 11435
  auth_token_home: pipeline.pipeline_paths.OMLX_API_KEY   # POINTER ONLY - the value lives in one place
  model_dir: /Users/barn/.omlx/models
  parked_dir: /Users/barn/.omlx/_unloaded
  settings: /Users/barn/.omlx/settings.json
  launch_cli: /Users/barn/.omlx/bin/omlx
  install: app                              # gui app with auto_start_on_launch true (measured)
  status_endpoint: /v1/models/status        # residency, pinned flag, engine_type, config_model_type
  observed:
    measured_at: "2026-10-15"
    served: 8
    loaded: 4
    final_ceiling_bytes: 52708965240
    current_model_memory_bytes: 42164115844
    resident_note: 'adaptive eviction is what failed the agent_loop budget (BUG-803), not the model'

# Harnesses the engine can WIRE to itself in one command (omlx launch TOOL). Measured by
# "omlx launch list" 2026-10-15. installed=true means the CLI exists on this machine.
harnesses:
  measured_at: "2026-10-15"
  # Which goose provider id IS this engine. goose's own config enables several providers
  # (maxwell_omlx, custom_deepseek, nvidia, ollama) and a DECLARED provider is not a BOUND one:
  # measured 2026-10-15, goose run -t answered without the local engine's request counter moving.
  goose_provider_id: maxwell_omlx
  # WHICH CLIENT IS THE DEFAULT ONE (T-175/D-3046). The engine WIRES nine other tools to itself
  # (harnesses.tools, measured by `omlx launch list`); the client this repository runs by default is NOT one of
  # them - MEASURED 2026-10-16, `omlx launch list` names claude/codex/opencode/openclaw/hermes/pi/copilot/dsh
  # and goose is absent from both the list and the command's own help. So the engine cannot launch it, and the
  # form that exists is the binary plus the declared executor (config/agent_surface.yaml#adapter). This key is
  # a WORD, never a path in code: a core script that must launch the client asks HERE which one it is, then
  # reads that client's binding from the surface. A swap moves this word.
  default_harness: goose
  # WHICH PROVIDER KEY IS THE ESCALATION (T-174/D-3044). D-3023 says a cloud token is an ESCALATION, not a
  # fallback; this names WHICH provider that is, so the distinction can be READ BACK from the client home
  # (scripts/check_harness_homes.py) instead of asserted here: the escalation must stay reachable and must
  # never be the ACTIVE provider, and the run that takes it says in its own words why the local route
  # cannot answer.
  escalation_provider_id: custom_deepseek
  escalation_rule: 'allowed, never the active provider, never silent: governed by D-3023'
  launch_by: "omlx launch TOOL - the engine's own wiring module sets the env (C12: never hand-write it)"
  tools:
    claude:    {display: "Claude Code",      installed: true}
    codex:     {display: "Codex",            installed: false}
    codex_app: {display: "Codex App",        installed: false}
    opencode:  {display: "OpenCode",         installed: false}
    openclaw:  {display: "OpenClaw",         installed: false}
    hermes:    {display: "Hermes Agent",     installed: false}
    pi:        {display: "Pi",               installed: true}
    copilot:   {display: "Copilot CLI",      installed: false}
    dsh:       {display: "DeepSeek Harness", installed: false}

# JOB -> HARNESS (D-3017). A harness is deployed for a NAMED JOB CLASS, never for a mood, and the
# class names are the ones config/agent_context.yaml#classes already declares. The measured cost of
# an invocation decides: goose one-shot 0.4 s, pi 28.2 s, claude 104.7 s (2026-10-15). A class with
# harness: null says the harness LOSES for that class - the pipeline or goose already wins it.
  jobs:
    agent_loop:       # a loop with a human watching it
      harness: pi
      fallback: claude
      why: 'the only class a harness wins: 28.2 s/invocation (pi) against a loop the owner is in'
      # T-154: the DEPLOYMENT's argument vector, declared once so the front door and the owner run the SAME
      # bytes (C12: never hand-write the wiring at the call site). `-p` takes the prompt, which
      # pipeline/subagent_fanout.py appends from the workstream's own prompt file. The class's TRANSCRIPT
      # binding is not here on purpose: it is config/agent_context.yaml#classes.agent_loop.env, set by the
      # runner for the child, so no command carries a path and no transcript can land outside the run.
      args: ['--approve', '--tools', 'read,grep,find,ls', '-p']
      #: MEASURED 2026-10-15 (harness_20261015a): the launcher's own banner lines reach the harness's stdout
      #: and must never be graded as an answer. Declared as a regex so the stripper is not a literal in code.
      stdout_noise_regex: '^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9:]+ - '
    agent_probe:      # single-question delegation
      harness: null
      why: 'pipeline/oneshot_ask.py answers in 0.4 s; a harness is 70x-260x that for the same answer'
    pipeline_batch:   # unattended
      harness: null
      why: 'the pipeline calls the model directly and a harness holds no governed pen (D-3016)'


# Fetching is pipeline/hf_fetch_model.py: resumable, verified, receipted.
hf:
  download_workers: 4        # keeps the engine's own decode traffic viable while bytes land
  lock_dir: /Users/barn/.cache/huggingface/hub/.maxwell_locks   # T-141/D-3015: ONE fetch per repo
  lock_suffix: .lock
  # BUG-814: two .incomplete blobs for ONE target hash are two attempts at one blob and no tool
  # can assemble them. pipeline/hf_fetch_model.py refuses while they exist and needs the flag.
  duplicate_fragments: refuse

# Fan-out: many small sub-tasks, one serial pool (D-3005). The cap is declared here because the resource
# it protects is the ENGINE's, not the orchestrator's. An instrument that finds this block missing must
# FAIL, not invent a default (C12/C16 - this is exactly what went wrong on 2026-10-15, BUG-817).
fanout:
  max_parallel: 3
  default_max_tokens: 512
  excerpt_bytes: 24000
  verify_with_another_family: true     # R5: the verifier may never be the generator

  # ── THE SUB-AGENT RECIPE VOCABULARY (approved by the owner 2026-10-17). A RECIPE answers three questions and
  # ── nothing else: WHAT it asks for (shape), WHICH axis model serves it (a POINTER into
  # ── config/model_assignments.yaml#harness_roles - never a model name here), and HOW we know it FINISHED
  # ── (done_check: a command whose EXIT CODE decides). THE ONE RULE: a loop may run with NO human in it only when
  # ── done_check RESOLVES; human_free: true with done_check: null is REFUSED by the runner
  # ── (pipeline/subagent_recipe.py), because an LLM judging an LLM is not a verifier (R5). A recipe that cannot
  # ── yet be run declares what it OWES instead of pretending (D-3038).
  task_recipes:
    review-artifact:
      question: >-
        Review the artefact {target}. Report the DEFECTS you can point at, each one as <file>:<line> followed by
        the reasoning that says what is WRONG there. A list of locations with no claim about them is not a review.
      shape: review
      model_role: AGENT_LOOP_SHORT
      mode: oneshot
      max_tokens: 900
      done_check: 'python3 pipeline/subagent_fanout.py verify --run {run} --model {model} --out {out}'
      human_free: true
    read-and-report:
      question: >-
        Read {target} and report what it CONTAINS as an inventory: every item you name must carry its
        <file>:<line>. Make no claim beyond what the bytes say.
      model_role: PROBE_S2
      mode: oneshot
      max_tokens: 700
      done_check: 'python3 pipeline/subagent_fanout.py citations --answer {answer}'
      human_free: true
      caveat: 'a TRUE listing is not an answer to a question that needs a claim - use it only where an inventory IS the deliverable'
    summarize-with-source:
      question: >-
        Summarise {target} USING ONLY ITS OWN TEXT, and cite the span each sentence comes from as <file>:<line>.
        If the file does not support a statement, do not make it.
      model_role: PROBE_S2
      mode: oneshot
      max_tokens: 700
      done_check: 'python3 pipeline/subagent_fanout.py citations --answer {answer}'
      human_free: true
    draft-then-verify:
      question: >-
        Change {target} so that it does what this asks: {question_extra}. Return the COMPLETE edited file.
      model_role: AGENT_TOOL_SHORT_ONESHOT
      mode: oneshot
      max_tokens: 1200
      done_check: 'python3 scripts/r5_review_gate.py --file {file} --no-llm'
      human_free: true
      note: 'human-free ONLY on the DETERMINISTIC layers (syntax, lint, C11/C12). The advisory reviewer verdict is recorded beside it and is never the decider (R5).'
    measure-two-point:
      question: >-
        Run the measurement for {target} TWICE under the same conditions and report BOTH readings with the
        exact command each came from, then their ratio.
      model_role: AGENT_LOOP_SHORT
      mode: oneshot
      max_tokens: 600
      done_check: null
      human_free: false
      owed: 'a slope reader: the two receipts exist (scripts/measure_subagent_loop.py writes one per model) but no command yet computes their ratio and refutes/accepts it. Until that command exists this recipe is NOT runnable - and it says so rather than borrowing confidence.'
    grind-a-register:
      question: >-
        Apply the ACCEPTED rows of {target}. Dry-run first; refuse a row the plan does not carry.
      model_role: null
      mode: oneshot
      max_tokens: 400
      done_check: null
      human_free: false
      owed: 'the T-183 admit applier (plan-keyed, dry-run default, receipted) does not exist yet; a register grind is owner-gated BY CONSTRUCTION, so it is never human-free.'


  guards:                              # D-3020 (BUG-809): a delegation that cannot finish must SAY SO
    default_timeout_s: 120             # measured oneshot: 0.4-17 s, so 120 s is 7x the slowest ever seen
    agent_timeout_s: 600               # `goose run -t` holds tools; the only mode that earns minutes
    deadline_s: 900                    # the whole run, retries included: the parent never blocks past it
    stall_s: 45                        # silence this long is REPORTED (a slow model is not a failure)
    kill_on_stall: false               # ...so silence alone never kills; declare it per task if wanted
    max_attempts: 2
    retry_on: [EMPTY, FAILED, TIMEOUT, STALLED]
    fallback_model: gemma-4-E4B-it-MLX-4bit   # a retry may never repeat the model that failed (R5)
    min_answer_chars: 80
  # T-163 (BUG-836): WHAT AN ANSWER MUST *CONTAIN*, per declared SHAPE - a different question from how long it is.
  # MEASURED 2026-10-15: gemma-4-E4B answered a 22 KB review request with 2,294 chars of `file:line` lines and
  # NOTHING else, and the citation reader CERTIFIED it - 82 citations checked, 0 refuted, because every location
  # it names really exists. A true listing of locations is still not a review: nothing in the chain asked whether
  # the answer made a CLAIM. A task chooses a shape in its own task file (`shape: review`); the numbers live HERE
  # and never in code (C12); the requirement is DISCLOSED to the model in the prompt, because a gate the answer
  # was never told about is a trap and not a guard; and a task that declares a shape nobody declared is FATAL at
  # plan time, before any model is called. SHAPE IS NOT TRUTH: this decides whether an answer EXISTS, and the
  # verifier (R5/D-3022) decides whether it is right.
  answer_shapes:
    review:
      min_findings: 1                    # a review that carries no finding is a listing
      min_finding_chars: 40              # the reasoning a finding must carry BESIDE its citation
      artifact_required: true            # the finding must cite a location IN the artefact under review
      defect_markers: [bug, defect, wrong, incorrect, broken, break, breaks, fail, fails, failing, failure,
                       missing, absent, unguarded, unbounded, unchecked, unsafe, unsound, silently, silent,
                       risk, leak, leaks, race, cascade, mismatch, contradicts, contradiction, drift, drifts,
                       hardcoded, unreachable, unused, dead, collision, overwrite, overwrites, loses, lost,
                       swallows, ignored, never, cannot, but, however, should, must, owes, owed, trap, hole,
                       gap, blind, stale, bypass, bypasses, skips, skipped, duplicate, shadowed, ambiguous,
                       mislabelled, mislabeled, redundant, no-op]
  # T-163: the FROZEN known-answer controls the SHAPE reader is proved against. The path is DECLARED because a
  # control whose subject is a literal in code is a second home (C12) - and because this control is a
  # MEASUREMENT, not a fixture: it is the bytes one local model actually returned on 2026-10-15, kept so that the
  # claim "a citation list reads as NOT AN ANSWER" stays falsifiable.
  answer_shape_controls:
    - name: the_measured_gemma_citation_list_is_NOT_a_review_T163
      path: governance/evidence/BUG836_gemma_citation_list.md
      shape: review
      artifact: [pipeline/research_run.py]
      expect: not_an_answer
      measured: >-
        2026-10-15 21:55, gemma-4-E4B-it-MLX-4bit, answering the 22 KB T-154 diff review (prompt:
        temp/t154_review_prompt.md). VERBATIM bytes with no header added - a control with a preamble is no
        longer the bytes it measures, which is why the provenance lives here and not in the file. It is the
        case the two existing readers CANNOT refuse: `citations` on it returns 82 checked / 0 refuted, and the
        80-char floor passes it (BUG-836/T-163).
    - name: the_measured_gemma_prose_review_IS_a_review_T163
      path: governance/evidence/BUG836_gemma_prose_review.md
      shape: review
      artifact: [pipeline/subagent_fanout.py]
      expect: an_answer
      measured: >-
        2026-10-15 22:5x, gemma-4-E4B-it-MLX-4bit, answering this module's own R5 review request through the
        fan-out front door (run t163_r5b). It is the FALSE NEGATIVE the first run of this gate found, kept as a
        control because it is the answer that taught the grammar the LINE RANGE: it names its finding as
        "**338-342**" and "(lines 349-351)", so a reader that knows only `path.py:111` refuses a located,
        predicated finding as if no location had been given. Two-sided proof on REAL model bytes: the listing
        above must stay refused and this must stay accepted.

# The STORE's deletion rule (D-3018). Below this floor the DECISION costs more attention than the
# bytes, and the floor is 2x the largest model a live code DEFAULT resolves into
# (BAAI/bge-small-en-v1.5, 128 MiB), so no mention-based sweep may reach one. It is applied PER REPO.
model_store:
  deletion_floor_bytes: 268435456    # 256 MiB
  census_move_ratio: 0.05            # a re-measure counts as MOVED only above this RELATIVE change; below it the two readings are the same measurement (D-3021/T-151)

  # WHAT THE PARTITION IS A PARTITION OF (D-3033/BUG-838, C12/D-402). The census publishes a partition of
  # THE MODEL REPOS THIS HUB HOLDS, never of every directory entry, because ORPHAN is the only class a
  # deletion may be proposed from (D-3004(3)) - so a class that admits a non-member is a safety hole, not
  # untidiness. Measured before this block existed: .locks and version.txt (the hub's own machinery) were
  # counted as repos and fell into ORPHAN, blobs read DECLARED because the word appears in the reader's own
  # source, and the eval datasets were protected by nothing but an incidental citation although D-3014(2)
  # says a dataset is never swept with model bytes. An entry matching NO declared kind is a FAULT: a new
  # kind must be DECLARED here, never silently inherited by the candidate class (the inverse of green by
  # vacancy, BUG-487). This block states WHAT MAY BE COUNTED, which is upstream of any count.
  census_domain:
    member_prefixes: [models--]                    # THE MEMBERS: the model repos, the only candidate class
    non_member_repo_prefixes: [datasets--, spaces--]   # a REPO, NEVER A CANDIDATE (D-3014(2)); spaces-- has zero members today and is DECLARED rather than implied (D-3031)
    store_metadata: [.locks, version.txt, CACHEDIR.TAG, blobs]   # NOT A REPO AT ALL: the store's own machinery

  # WHAT MAY DECLARE ONE (T-142/D-3034/BUG-840, C12/D-402). DECLARED used to be a MENTION INDEX: the census
  # asked whether a repo's stem appeared anywhere in the joined text of config/, pipeline/ and scripts/, so a
  # GOVERNANCE WRITE reclassified 267.9 MB with no byte moving - the evidence line a landing had just added to
  # config/task_register.yaml named a stem, and that prose then "declared" the bytes. MEASURED 2026-10-16: the
  # homes that declared most of the bucket were config/decisions.yaml and config/task_register.yaml, two
  # registers whose strings are SENTENCES. A record that mentions a model is not an owner of its bytes, so
  # DECLARED now requires a RESOLUTION (D-3018: the byte-owner test is RESOLUTION, not MENTION) in exactly
  # three forms: an engine entry whose realpath lies inside the repo dir; a VALUE that IS the reference (the
  # full org/name or the bare name - a sentence is never equal to a model id); or a PATH that EXISTS and lies
  # inside that dir (a citation whose subject is absent is an assertion, D-405). A string that merely CONTAINS
  # a reference is reported as a MENTION and confers nothing. This is the DECLARED HOME of the rule: a reader
  # that cannot find it REFUSES to run, because the alternative is the mention index this block replaces.
  resolution_domain:
    value_homes: [config]              # PARSED values only: a comment is not a value, so a remark cannot declare
    code_homes: [pipeline, scripts]    # AST STRING CONSTANTS only: a docstring is prose, not a consumer
    file_suffixes: [.yaml, .yml, .json, .py]
    exclude: [pipeline/model_store_census.py]   # THE READER'S OWN VOCABULARY MAY NOT DECLARE A BYTE (BUG-838 limb 3); an empty list is FATAL rather than permissive
    re_acquirable_marker: refs         # an entry carrying it was FETCHED by repo id, so its bytes can come back (T-142's re-acquirability column)
    report_rows: 12                    # how many audit rows the printed face shows; the full set stays in --json-out

  # HOW A SECOND COPY IS PROVED REDUNDANT (T-167/D-3035, C12/D-402). The first rule compared FILE INVENTORIES, and
  # equality can never be reached between a hub snapshot and a repacked directory: MEASURED 2026-10-16, the served
  # copy of Phi-4-mini-instruct-8bit carries .gitattributes and README.md that the snapshot does not, so the census
  # printed "NOT the same bytes" and "the only pristine copy of that fetch" while the SAME instrument printed the
  # digest that disproves it - served model.safetensors and the snapshot blob both hash to
  # 84bcf5553d78094fd6fbe8d7b547a94c6b21996c4066a7a1e89ee4d347a50a24 at 4076012072 B. A weight is proved the same
  # by CONTENT, never by the other files a directory happens to carry. So: weight_suffixes are the files that ARE
  # the model, digest is the declared proof (the hub names a blob BY it), partial_marker is declared because a
  # cache holds PARTIAL downloads beside complete ones - 1,676,647,640 B of this very model sat in the same repo
  # under a .incomplete name - and max_weight_files BOUNDS the rule (C28) so a directory with hundreds of weight
  # files is reported rather than read.
  redundancy:
    weight_suffixes: [.safetensors, .bin, .gguf, .npz, .h5, .pt, .pth, .msgpack]   # the files that ARE the model
    digest: sha256                    # the declared proof; the reader REFUSES a declared algorithm it does not implement
    partial_marker: .incomplete       # a partial download is not a copy of anything, and it is NAMED on the face
    max_weight_files: 64              # above this a copy is REPORTED as uncompared rather than read (C28)

  # HOW MODEL BYTES LEAVE (T-167/D-3035, C12/D-402). safe_delete.py is the route for PIPELINE OUTPUT and its
  # protocol COPIES the target into backup/deletions/ inside this Dropbox-synced repo (BUG-818c); MEASURED
  # 2026-10-15 the 12.4 GB model sweep was therefore done by hand under an exception recorded in PROSE
  # (governance/DELETION_RECEIPT_20261015.json#method) - an act with no route. This block declares the route's
  # bounds: which classes may be offered (a LIVE repo never, and a PARKED name is a NAME, not a proved copy),
  # that the owner's word must NAME a decision (D-3010: one word per batch), that nothing is copied for weights
  # (the served twin already holds the bytes, and a 4 GB copy costs the repo its own headroom), the order the
  # batch is executed in (a NAME is removed before the bytes it points into, so no window holds a broken name -
  # BUG-808), and where the receipt goes. floor_bytes is NOT re-declared here: the census floor (D-3018) is read.
  sweep:
    offered_classes: [SHADOW, ORPHAN]        # SHADOW = a redundant same-name copy; ORPHAN = no live resolver
    owner_word_prefix: D-                    # the word must name a record in config/decisions.yaml, or it is not a licence
    order: [name, bytes]                     # a parked NAME first, then the bytes it points into (BUG-808)
    copy_policy: none-for-weights            # safe_delete copies into the repo; weights leave by RECEIPT instead (BUG-818c/D-3013)
    receipt_dir: governance                  # evidence, not scratch: temp/ is purged (7d), a receipt must outlive it
    receipt_prefix: DELETION_RECEIPT_
    receipt_suffix: .json
    verify_digest: true                      # the served twin is re-hashed after the batch, so the receipt says what SURVIVED


# Download decisions are made by pipeline/model_loadability_probe.py, never by download counts.
candidates:
  probe:
    - openbmb/MiniCPM5-2B-MLX
    - Edge0/Edge0-35B-A3B-preview
    - LiquidAI/LFM2.5-24B-A2B
    - prism-ml/Ternary-Bonsai-2-27B-mlx-2bit
    - google/embeddinggemma-2
    - ornith-ai/Ornith-1.5-35B-A3B-MLX-4bit
    - ConwayResearch/Underdog-Saluki-27B-1.0
    - empero-ai/Qwen3.8-35B-A3B-Distill
  served_now:
    - Phi-4-mini-instruct-8bit
    - Qwen3-Coder-30B-A3B-Instruct-MLX-4bit
    - Qwen3.8-27B-MLX-4bit
    - gemma-4-E4B-it-MLX-4bit
    - gpt-oss-20b-MXFP4-Q8
    - Ornith-1.5-35B-A3B-REAP-19B
    - Ornith-1.5-9B-MLX-8bit
    # gemma-4-12B-it-qat-OptiQ-4bit RETIRED 2026-10-15 (T-139, D-3013): the worst measured non-27B
    # decode (13.4 tok/s) and its only live declarations were a REJECTED swap (D-2788) plus one R5
    # candidate slot. Entry and bytes are gone, so the name must not appear here.

  # ── THE REFUSAL REGISTER (D-3038 applied to MODELS; D-3151) ────────────────────────────────────────────────
  # WHAT WE REJECT WE REGISTER. A model Maxwell OS has considered and refused used to live ONLY in the prose of
  # governance/NOT-YET-EVALUATED-RESEARCH.md, so nothing could check it and its verdict could drift freely in a
  # summary - which is exactly what happened on 2026-10-25: the agent said "Flint is not available in oMLX" while
  # R-14 itself said both runtimes EXIST and named the MLX conversion. The owner answered with two real repo names.
  # MEASURED that day (governance/evidence/MODEL_AVAILABILITY_FLINT_20261025.json): both exist upstream, NEITHER's
  # bytes are here, and NEITHER can be served by this engine (`ARCH_UNSUPPORTED`, model_type=flint absent from the
  # bundle's 134-architecture mlx_lm). FOUR propositions were fused into one sentence; this block keeps them apart.
  #
  # THE RULE THIS BLOCK EXISTS TO MAKE CHECKABLE: a refusal is a REPO ID plus a VERDICT that RESOLVES to an engine
  # reading, never a sentence (D-3034). `scripts/check_model_claims.py` refuses:
  #   - a repo that is a bare name or a sentence (a model id is `org/name`, quoted exactly)
  #   - a `refused_by` that does not resolve to a decision in config/decisions.yaml or a row in the research file
  #   - a `probe.evidence` PATH that does not exist or does not hold that repo id (a citation whose subject is
  #     absent is an assertion, D-405)
  #   - a repo refused AND served_now at once (a contradiction is a fault, not a preference)
  # and reports OWNER-OWED (loud, rc=2) for a verdict of NEVER: refused on judgement with no engine reading on
  # file is a RECOLLECTION, and the honest cost of fixing it is one 2-second command:
  #     python3 pipeline/model_loadability_probe.py <org/name>
  # The vocabulary is DECLARED here so the rail holds no literal (C12).
  refused:
    # THE COMPLETE EMITTED VOCABULARY, read from the instrument (pipeline/model_loadability_probe.py:174-187), not
    # from memory: a vocabulary that omits a verdict the instrument can emit is a blind spot wearing a rule's
    # clothes (the first draft of this list omitted UNDETERMINED and REPO_ABSENT, and the very next probe run
    # returned UNDETERMINED for Saluki — a GGUF-only repo whose config.json declares no model_type).
    # NEVER is the register's own word for "refused on judgement, no engine reading on file": always OWNER-OWED.
    verdicts: [LOADABLE_CANDIDATE, ARCH_UNSUPPORTED, NEEDS_FORK_RUNTIME, NO_MLX_WEIGHTS, EMPTY_REPO,
               UNDETERMINED, REPO_ABSENT, NEVER]
    entries:
      # R-14. The four blockers are OPERATING-POINT / GRAMMAR / HARDWARE / QUALITY - none of them an existence
      # claim. Its verdict here is about THIS BUILD: upstream CREATED mlx_lm/models/flint.py on 2026-10-24T00:10:47Z
      # ("Recursive Flint model support (#1998)"), while this bundle pins a wheel built from commit 0d4d3d04f dated
      # 2026-10-22T09:47:59Z - 1 day 14 h too old. MEASURED POST-SWAP 2026-10-25 at oMLX 0.7.3.dev2 / mlx_lm
      # 0.32.3.dev8 / 137 modules: STILL ARCH_UNSUPPORTED. The distance is therefore not an app refresh but the first
      # build whose wheel is cut at or after that commit - T-201's corrected gate, which tests the CAPABILITY.
      - repo: mlx-community/flint-mixed-3-4bit
        refused_by: R-14
        refused_because: 'four measured blockers: temp-1.0 operating point vs R7, no grammar-constrained decoding path, rec needs an M4/M5 Pro + >=48 GB, and quality behind Qwen3.6-35B-A3B'
        exists_upstream: true          # dl 1166, 17.84 GB, model_type=flint, created 2026-10-22
        bytes_local: false             # MEASURED: 12 K hub entry holding only README.md + refs/main
        probe: {verdict: ARCH_UNSUPPORTED, evidence: governance/evidence/MODEL_AVAILABILITY_FLINT_POSTSWAP_20261025.json, date: '2026-10-25'}
      # The owner's name, measured the day after it was published (created 2026-10-24, dl 138, 27.48 GB).
      - repo: mlx-community/flint-OptiQ-4bit
        refused_by: R-14
        refused_because: 'same architecture and same four blockers as the mixed quant; a different quantisation of one refused model, not a new candidate'
        exists_upstream: true
        bytes_local: false             # not present in any of the seven locations searched
        probe: {verdict: ARCH_UNSUPPORTED, evidence: governance/evidence/MODEL_AVAILABILITY_FLINT_POSTSWAP_20261025.json, date: '2026-10-25'}
      # R-15. Refused to DOWNLOAD, lane left OPEN: the refusal is about serving it from THIS stack, and it is
      # temp-0-native (card: thinking off, temperature 0), so unlike Flint it does NOT conflict with R7.
      - repo: ConwayResearch/Underdog-Saluki-27B-1.0
        refused_by: R-15
        refused_because: 'engine-role-bound (Ollama is the declared embedder, the generation pool is OMLX-only), 2-bit costs the axis Maxwell is most exposed on, vendor-set headline, duplicates a served 27B at lower precision, and the 1-task instrument cannot resolve a 3-point gap'
        exists_upstream: true
        bytes_local: false
        probe: {verdict: UNDETERMINED, evidence: governance/evidence/MODEL_AVAILABILITY_REFUSED_20261025.json, date: '2026-10-25'}
      # T-139 / D-3013 / D-2788. The LOCAL entry and bytes are gone; the UPSTREAM repo still resolves (9.0 GB,
      # 5536 downloads, fetch=OK) — which is the same three-axis distinction this register exists to keep. Its
      # architecture is absent from the engine too, so the retirement removed a model this engine could not serve.
      - repo: mlx-community/gemma-4-12B-it-qat-OptiQ-4bit
        refused_by: D-3013
        refused_because: 'RETIRED 2026-10-15: worst measured non-27B decode (13.4 tok/s); its only live declarations were a rejected swap (D-2788) and one R5 slot. Local entry and bytes removed; upstream repo remains fetchable.'
        exists_upstream: true
        bytes_local: false
        probe: {verdict: ARCH_UNSUPPORTED, evidence: governance/evidence/MODEL_AVAILABILITY_REFUSED_20261025.json, date: '2026-10-25'}
