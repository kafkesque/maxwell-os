- id: CONV-020
  is_convergent: true
  should_extract: true
  domain: economics
  discipline: behavioral economics
  source_books:
  - Thinking, Fast and Slow — Daniel Kahneman
  - Misbehaving — Richard Thaler
  - 'Phishing for Phools: The Economics of Manipulation and Deception — George A. Akerlof & Robert J. Shiller'
  cluster_segments:
  - label: ''
    source_book: Thinking, Fast and Slow — Daniel Kahneman
    text: 'The endowment effect is the finding that the value of a good increases when it becomes part of a person''s endowment.
      Losses loom larger than gains: in the classic mug experiment, the minimum price at which students who received a mug
      would sell it was about twice the maximum price other students were willing to pay to acquire it. Ownership changes
      the reference point, making any departure from the status quo a potential loss rather than a forgone gain.'
  - label: ''
    source_book: Misbehaving — Richard Thaler
    text: I coined the term endowment effect to describe the tendency for people to value an item more once they own it. Once
      something becomes part of your endowment, giving it up feels like a loss, and losses hurt about twice as much as equivalent
      gains feel good. The asymmetric valuation between buyers and sellers persists even when the good is randomly assigned
      — mere possession is enough to trigger the effect.
  - label: ''
    source_book: 'Phishing for Phools: The Economics of Manipulation and Deception — George A. Akerlof & Robert J. Shiller'
    text: 'Akerlof and Shiller describe the phishing equilibrium: firms exploit the endowment effect by giving consumers temporary
      ownership through free trials, test drives, and money-back guarantees. Once a product enters the consumer''s reference
      bundle, the consumer will pay more to keep it than they would have paid to acquire it — and firms price accordingly,
      converting a psychological bias into systematic profit.'
  expected_fb:
    is_summary: false
    route: FB
    name: Endowment Effect — Ownership Reference Point
    definition: When a person acquires ownership of a good, its perceived value increases not because of rational appreciation
      but because ownership shifts the psychological reference point, making any sale or exchange feel like a loss rather
      than a forgone gain.
    mechanism: Prospect theory posits that individuals evaluate outcomes relative to a reference point, and losses weigh approximately
      twice as heavily as equivalent gains. Ownership moves the reference point to include the possessed object, so giving
      it up is coded as a loss, while the buyer codes the same transaction as a gain-weighted acquisition. This asymmetry
      — called the endowment effect — creates a systematic valuation gap between sellers and buyers that persists even when
      the good is randomly assigned and rational self-interest would predict no difference.
    boundary: (1) Professional traders and merchants do not exhibit the endowment effect because they hold goods for exchange,
      not personal use. (2) It attenuates for goods that are easily substitutable or whose value is publicly observable. (3)
      It does not apply to purely monetary transactions because there is no reference-point shift. (4) It can be temporarily
      suppressed by repeated trading experience that recalibrates expectations.
    consequence: 'The endowment effect explains persistent market anomalies: the gap between willingness-to-accept and willingness-to-pay
      (roughly 2:1), the winner''s curse in auctions, low acceptance of buyout offers, and the power of free trials and money-back
      guarantees. Policies that create even symbolic ownership transfer achieve higher engagement due to endowment-based retention.'
    elaboration: 'The endowment effect and the default effect are related but distinct: the default effect sets the initial
      endowment via inertia, whereas the endowment effect inflates the value of whatever the person already owns regardless
      of how ownership was acquired. Both operate through loss aversion but at different points in the choice architecture.'
    evidence_passages:
    - the value of a good increases when it becomes part of a person’s endowment
    - giving it up feels like a loss
    - once a product enters the consumer’s reference bundle, the consumer will pay more to keep it
    extraction_type: causal_mechanism
    content_type: principle
    depth: cross-domain
  rationale: Three genuinely independent sources converge on the endowment effect from complementary angles — Kahneman providing
    the empirical proof and reference-point model, Thaler coining the term and identifying real-world implications, and Akerlof
    & Shiller providing the market-structure perspective on how firms systematically exploit the bias. The mechanism (loss
    aversion + reference-point shift) is shared across all three works, the evidence is independently sourced, and the boundary
    conditions are well-defined.
- id: CONV-021
  domain: systems & frameworks
  discipline: systems thinking
  source_books:
  - Thinking in Systems — Donella Meadows
  - Freakonomics — Steven Levitt & Stephen Dubner
  - The Logic of Life — Tim Harford
  cluster_segments:
  - source_book: Thinking in Systems — Donella Meadows
    text: 'Every action in a system has second-order effects — effects that were not

      intended and often not predicted. Policy resistance occurs when the system

      compensates for an intervention, producing the opposite of the intended effect.

      The cure for policy resistance is to find the source of the resistance and

      change the rules that create it.

      '
  - source_book: Freakonomics — Steven Levitt & Stephen Dubner
    text: 'Incentives are the cornerstone of modern life. When the incentive structure is

      misaligned, behavior follows the incentive, not the stated goal. The authors

      document how well-intentioned policies (e.g., Chicago school reform) created

      unintended behaviors (teaching to the test, cheating) when the incentive

      metric was gameable.

      '
  - source_book: The Logic of Life — Tim Harford
    text: 'The law of unintended consequences: interventions that ignore the rational

      responses of the people they target will be evaded or exploited. Rational

      economic agents respond to incentives in ways that the policy designer often

      fails to anticipate.

      '
  is_convergent: true
  should_extract: true
  expected_fb:
    is_summary: false
    route: FB
    name: Incentive-Driven Unintended Consequences
    definition: 'Any intervention that changes the incentive structure of a system will produce

      responses that the designer did not intend, because the agents in the system

      optimize against the new incentives rather than the stated goal. This is the

      fundamental source of policy resistance and gaming behavior.

      '
    mechanism: 'Agents in any system respond to incentives, not intentions. When an

      intervention alters the payoff structure, agents re-optimize their behavior;

      this re-optimization often exploits gaps in the intervention''s design,

      producing behaviors that counteract the stated goal (Goodhart''s law: when a

      measure becomes a target, it ceases to be a good measure).

      '
    consequence: 'Policies and incentives must be designed with the expectation of gaming and

      adaptation. The metric used to measure success will be gamed if it is visible;

      the intervention will be evaded if it is costly; second-order effects will

      emerge from the interaction of rational agents.

      '
    boundary: 'Applies when the intervention changes observable incentives AND agents have

      freedom to respond. Fails when: (1) agents lack the information to perceive

      incentive changes; (2) the system is closed with no adaptive freedom; (3) the

      intervention is invisible to agents (they cannot react to what they cannot see).

      '
    evidence_passages:
    - Every action in a system has second-order effects
    - When the incentive structure is misaligned, behavior follows the incentive, not the stated goal
    - Interventions that ignore the rational responses of the people they target will be evaded or exploited
    depth: universal
    evidence: cited
    jargon:
    - second-order effects
    - policy resistance
    - Goodhart's law
    - incentive gaming
    keywords:
    - incentives
    - unintended consequences
    - systems
    - policy
    application: Public policy, management, product design, economics, regulation
    elaboration: 'This is the systems-theoretic restatement of Goodhart''s law and the cobra

      effect (the classic example of a bounty program that backfired).'
    prerequisite_fbs:
    - 'INCENT-BASE-001: Incentive Structure Analysis'
    contradicts_fbs:
    - 'STATIC-POLICY-001: Static Policy Sufficiency'
    related_fbs:
    - 'GOODHART-001: Metric Gaming'
    - 'POLICY-RESIST-001: Policy Resistance'
    procedural_skill: 'Before implementing any policy or metric: (1) model the incentive change;

      (2) ask who can game the new metric and how; (3) predict second-order effects

      (what will the system do to compensate?); (4) design countermeasures;

      (5) pilot on a small scale and watch for gaming; (6) review the metric itself

      periodically.

      '
    failure_mode: 'Using a metric as a target without monitoring gaming leads to Goodhart collapse:

      the metric rises while the underlying goal deteriorates (e.g., call-center

      handle-time targets reducing service quality).

      '
    extraction_type: causal_mechanism
    content_type: principle
  rationale: 'Meadows, Levitt/Dubner, and Harford converge on incentive-driven unintended

    consequences. Demonstrates contradiction, related_fbs, procedural_skill.

    '
- id: NEG-005
  domain: systems & frameworks
  discipline: systems thinking
  source_books:
  - Thinking in Systems — Donella Meadows
  - The Feynman Lectures on Physics — Richard Feynman
  cluster_segments:
  - source_book: Thinking in Systems — Donella Meadows
    text: 'Leverage points are places within a complex system where a small shift in one thing

