ponytail_rule:
  description: 'Before every change, ask 3 questions. If any answer is "no",  the
    approach needs simplification.

    '
  questions:
  - Am I fixing the bottleneck, or building around it?
  - Does this need a new file, or can I modify an existing one?
  - Is this the minimum change that solves the measured problem?
  enforcement:
  - 'Session seed: ponytail_rule loaded at session start (Option B)'
  - 'justfile: ponytail-check command runs before commits (Option A)'
  override:
    condition: New subsystem warranted (requires justification in handoff)
    justification: Must cite which bottleneck, why existing files can't absorb it
