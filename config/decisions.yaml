- id: D-381
  category: GOVERNANCE / PROCESS
  state: RATIFIED
  date: '2026-09-25'
  title: 'Every owner gate carries a stated recommendation - and a senior RAG-engineer recommendation'
  decision: >
    The owner is the decision-maker; the assistant must never present a gate without the option it would
    choose. Every blocked task is therefore reported with (1) the assistant's recommendation, and (2) a
    SENIOR RAG-ENGINEER recommendation - the option that is most beneficial and most reliable for the
    situation (retrieval/generation quality, provenance, reversibility, cost, and failure modes), with its
    cost stated. A gate with no recommendation transfers work instead of information, and pushes a decision
    onto whoever reads last (the pressure that produces fabricated values).
