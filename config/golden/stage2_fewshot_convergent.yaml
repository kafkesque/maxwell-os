  - source_book: Algorithms to Live By — Brian Christian & Tom Griffiths
    text: 'The explore-exploit trade-off is one of the most fundamental problems in decision theory. When should you try something
      new (explore) versus stick with what you know works (exploit)? The optimal strategy depends on the time horizon: with
      unlimited time, explore extensively; with a known deadline, shift increasingly toward exploitation as the deadline approaches.
      The multi-armed bandit problem formalizes this: each arm of the slot machine has an unknown payoff distribution, and
      you must decide how many pulls to allocate to exploration before committing to the best arm.

      '
  - source_book: Antifragile — Nassim Nicholas Taleb
    text: 'The barbell strategy is a method for navigating uncertainty: put 90% of your resources in maximally safe instruments
      and 10% in maximally speculative ones, avoiding the middle entirely. The safe side ensures survival; the speculative
      side captures unlimited upside from rare events. This is the opposite of the ''medium risk'' approach, which exposes
      you to the worst of both worlds — you don''t gain enough from success to offset the steady drain of moderate risks that
      compound over time.

      '
