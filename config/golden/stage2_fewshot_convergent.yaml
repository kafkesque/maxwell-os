      establish a baseline, then exploit when quality exceeds that baseline.'
    - Without pre-committed criteria, decision-makers fall prey to confirmation bias — they adjust their criteria to justify
      whichever option they emotionally prefer.
    - Satisficers — those who choose the first option meeting their criteria — are happier than maximizers — those who exhaustively
      search for the absolute best.
  rationale: CONVERGENT POSITIVE — NORMATIVE HEURISTIC (D2223). Three decision-science sources converge on the explore-exploit
