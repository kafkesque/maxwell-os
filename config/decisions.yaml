- id: D271a
  category: LABEL QUALITY / DATA
  state: RESOLVED
  date: 2026-09-17
  title: "The research-methodology collision is a DECLARED HOMONYM - change nothing (D-271a)"
  source: governance/DECISION_D271_IDENTITY_20260917.md
  verification: "scripts/identity_tax_ab_test.py R5 gemma-4-E4B APPROVE digest d89a44a21a1a8295"
  description: "DECLARED HOMONYM (FINAL RULING): the discipline 'research methodology' and the domain 'research & methodology' keep their shared name and BOTH stay canonical -- nothing migrated, nothing relabelled, nothing adjudicated. Retrieval precedence is explicit: the DISCIPLINE wins for partitioning and the DOMAIN wins for recall, so if a collapse were ever forced the discipline side survives, the reverse of a row-count heuristic. SUPERSEDED FIRST RULING, retained for the audit trail: two concepts, keep both, sharpen each definition, add each to the other's exclude list, send the 167 BOTH rows to gate G8 (withdrawn after the user's correction -- renaming the domain adds difficulty without adding separation, and the two carry the same name without contaminating each other). Original reasoning: Ruled TWO CONCEPTS for the discipline 'research methodology' (261 rows) and the domain 'research & methodology' (648 rows). Population 742 rows = 94 discipline-only + 167 carrying BOTH + 481 domain-only. Keep both; sharpen each definition; add each to the other's exclude list; the 167 BOTH rows go to human gate G8. Collapsing the discipline costs 261 relabels, forces 94 rows into the 'emerging' fail-closed catch-all and destroys the exact-match facet key that depth 'cross-domain' depends on (789 rows); collapsing the domain loses 648 rows of recall and leaves 150 rows with zero domains. Option A costs 0 migrations and 167 adjudications, and is reversible to 1 alias row under D271c. Rationale for treating discipline as the primary retrieval facet: single-valued at 1.00 labels/row with 100% coverage and an exact '=' filter, while domains fan out 1..7 per row."
  files: ["config/eval_integrity.yaml", "governance/DECISION_D271_IDENTITY_20260917.md"]
