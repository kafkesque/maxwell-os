- id: D-2645
  state: 'active'
  category: 'GOVERNANCE'
  title: 'Revocation ontology - a revoked scope is a DECLARED SUB-FACT with a rail'
  measured: 'MEASURED 2026-09-25: the D2205 P3 migration is abandoned while the D2205 roadmap is ACTIVE (live retrieval P0/P1 and CRAG citations), so a whole-record state would be FALSE. Declared with prefixed scalar keys on the record (audit F2: no record carries a mapping-shaped value, so no new shape enters a governed registry). 24 pre-rule SUPERSEDED/ARCHIVED records are pinned BY IDENTITY, never by a count.'
  decision: 'A tombstone stops EXECUTION; a registry stops RE-PROPOSAL (D-2643). Required fields scope/reason/evidence/date/tokens; whole-record states REVOKED/ABANDONED; rules in config/decisions_policy.yaml; rail scripts/check_revoked_references.py with known-answer controls and a RESERVED fixture namespace. First subject: D2205 P3. Declaring a revocation is a structural edit of an append_only registry: the handoff receipt is refreshed in the same sequence and a forgotten refresh is LOUD (verify_handoffs), never silent.'
- id: D-2646
  state: 'active'
  category: 'GOVERNANCE'
  title: 'One derived value, one home - a rule that decides a stored value has ONE implementation'
  measured: 'MEASURED 2026-09-25 by a tree-wide AST scan: BUG-499 and BUG-502 were one defect three times - a rule deciding a stored value existed verbatim in TWO scripts with nothing reporting divergence. config/derivations.yaml holds 9 rows: 6 homed, 1 orphan_magic_threshold (an undeclared literal 10), 1 dead_but_read (borp_score: 7995/7995 constant 0.0, no writer, still ORDER BY-ed), 1 declared_but_empty (feedback_score 0/7995).'
  decision: 'config/derivations.yaml declares each derived value with home plus parity rail plus status; home: null is the machine-readable statement that NO code decides it. The same rule governs config reads: a value read with a code default is UNDECLARED (D-2644), ceilings shrink-only (179 shadowed / 20 undeclared) and the RAIL owns the number, not the probe.'
- id: D-2647
  state: RATIFIED
  category: GOVERNANCE / INTEGRITY
  title: A Dropbox conflicted copy is silent drift, not a merge conflict
  measured: MEASURED 2026-09-26 - 36 conflicted-copy siblings; 26 held NEWER work than the live file, which Dropbox had reverted to an older blob. The D-2645/D-2646 rail work, the wired justfile and the 782-record decisions.yaml all lived in a sibling while every rail read the stale live file and printed ok.
  decision: 'Resolution is measured, never guessed - scripts/resolve_dropbox_conflicts.py + config/conflict_policy.yaml. identical-to-INDEX is restored from it (lossless); identical-to-HEAD means the sibling is the committed mark; otherwise a real 3-way merge with base = the HEAD blob, a line-superset wins outright, and a two-sided divergence is HELD in governance/CONFLICT_REGISTER.md. Pipeline state is owner judgement: a checkpoint is not a document to be text-merged.'
- id: D-2649
  state: OPEN
  category: GOVERNANCE / INTEGRITY
  title: A declared fact has ONE declaration home; two homes that disagree are a defect
  measured: MEASURED 2026-09-26 - scripts/lib/artifact_encoding.py joins config/reconciliation.yaml and config/cohort_declaration.yaml
    for an artifact's encoding. Before this rule the join was last-writer-wins, so a second home could declare cp1252
    for an artifact the first declared mac_roman and every reader would silently pick one. 0xD1 is an em dash in
    MacRoman and 'N-tilde' in cp1252, so that disagreement would not crash - it would quietly change the text two
    readers then compare (BUG-511).
  decision: 'An artifact''s declared facts (its encoding first) are joined across every declaration home and the
    join FAILS CLOSED when two homes disagree, naming the artifact, both values and both homes. A reader never picks
    a side: picking is the read-side twin of guessing, which D-2644 already forbids. This is D-2646 (one rule, one
    home) applied to the DECLARATION rather than to the code that reads it. Where the same value is declared twice
    and AGREES, the duplicate is checked and tolerated, not presumed harmless.'
- id: D-2654
  state: REJECTED
  category: INFRASTRUCTURE / SERVING
  date: 2026-09-26
  title: An unverifiable arm is not a cheaper arm - Apple Foundation Models NOT ADOPTED
  measured: MEASURED 2026-09-26 on this host (macOS 27). The system binary /usr/bin/fm returns rc=69 for every subcommand
    until a machine-wide licence is granted, so no arm can be exercised non-interactively; the weights live under
    /System/Library/AssetsV2/com_apple_MobileAsset_UAF_FM_GenerativeModels and are System-Integrity-Protected (Operation
    not permitted), so they can be neither read nor hashed; FoundationModels.framework is resident only in the dyld
    shared cache, so the model VERSION cannot be recorded at all. The four candidate risks (cost, quality, latency,
    privacy) were therefore measured as MOOT against those structural facts rather than against a running arm, and
    the egress question is a machine-wide fact rather than a per-project cost.
  decision: 'The Apple Foundation Models arm stays NOT ADOPTED and config/apple_fm.yaml keeps enable false. An arm
    whose weights cannot be read cannot be hashed, and an arm that cannot be hashed cannot be PINNED (D-382), so
    every number it produced would be unreproducible and unverifiable - a dependency whose identity is unrecordable
    is a future tax, not a saving. Its availability is also a machine-wide fact (an OS licence and OS state) rather
    than something this project declares, and it cannot be pinned, re-measured or reverted version by version. The
    refusal is STRUCTURAL, not a verdict on model quality: it would be re-opened only if the weights became readable
    and hashable, which is exactly what would turn the four risks into measurements instead of moot points.'
  files:
  - config/apple_fm.yaml
  - config/serving_gate.yaml
- id: D-2655
  state: RATIFIED
  category: GOVERNANCE / INTEGRITY
  date: 2026-09-26
  title: A derived value has NO home inside the append-only artifact it describes
  measured: 'MEASURED 2026-09-26. config/decisions.yaml declares mutability append_only and its handoff receipt
    is a PREFIX rule (the receipted bytes must be a byte-prefix of the current bytes), while it ALSO carried a derived
    head (total_decisions, decisions_sha256_16, last_sync, written_by) and a derived summary block that move on
    every mint. No position inside an append-only file is compatible with a prefix rule while a derived value lives
    there: every mint rewrote bytes inside the receipted region, so verify_handoffs reported the registry as rewritten
    and the writer had grown a mid-file splice to re-derive the derived fields in place (BUG-539). The symptom read
    as a careless writer; the defect was a derived value living in the wrong home. MEASURED BEFORE the fix: 604309
    bytes and 8863 lines carrying 142 bytes of derived head plus a 4426-byte summary block that no record could
    ever be appended after. MEASURED AFTER: 599742 bytes, 8677 lines, 784 records and an UNMOVED content stamp 0d7a746350d62e14,
    with the census re-derived to seven keys in its own home.'
  decision: 'A derived value lives in exactly ONE home, and NEVER inside the append-only artifact it describes.
    The census (total_decisions, summary, decisions_sha256_16, written_by) moved to config/decisions_summary.json,
    declared derived_regenerable and a PURE FUNCTION of the registry bytes; config/decisions.yaml is RECORDS ONLY
    and its records list extends to end of file. A mint is therefore a pure byte APPEND, and it is CHECKED as one
    (the minted text must have the bytes already on disk as a prefix) rather than asserted, with the census carried
    in the SAME invocation by the same writer. The derived keys ABSENCE from the registry IS the contract, and a
    rail fails closed when one comes back (REGISTRY_DERIVED_KEYS + registry_shape_problems). The one-time re-baseline
    of the decisions_registry receipt was recorded as a supersession in the append-only handoff journal, so the
    rewrite is VISIBLE rather than laundered. Repairs are routed by KIND: the steady-state repair touches the census
    only, and the one-shot strip that removed the head stays disabled behind an explicit flag so it cannot be re-run
    as routine maintenance.'
  files:
  - config/decisions.yaml
  - config/decisions_summary.json
  - config/artifact_ownership.yaml
  - config/derivations.yaml
  - scripts/recompute_decision_summary.py
  - tests/test_decision_summary_sync.py
  bugs:
  - BUG-539
