    WARNING, never as a rule: it printed "DECLARED-DROP: ..." and left the row where it was (the BUG-548 shape: a
    record with no consumer). BOTH limbs fixed: the ladder now runs --selftest (9 known-answer controls), --check
    (re-derivation proof + the partition invariant) and --check-faces (cross-face divergence), and the drop list
    now EXCLUDES.

    R091 "Autopoesis in Design Education" REINSTATED BY DECLARATION. It has no domain cell in the owner sheet, so
    it cannot be re-derived - the reinstatement is data (config#reinstated_rows), never a special case in code:
    domains [education, design strategy], primary education (owner-accepted), discipline = declared abstention
    because the upstream raw value 'creative education' is OFF the 64-discipline menu and naming a discipline
