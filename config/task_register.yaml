  mover: owner
  title: 'MCP payload decision - the owner words are GRANTED and EXECUTED: the retired scalar left the wire and the graded
    measure took its place'
  why: 'THE OWNER''S CHALLENGE WAS RIGHT AND THE FIRST RECOMMENDATION WAS WRONG — so it was re-MEASURED, not repeated.
    (a) BORP''s original concept is the BOOK OF RECORD PRINCIPLE ("at least two independent sources for convergence"),
    implemented in the v2 module as `check_borp`, whose ratio `min(distinct / min_sources, 1.0)` has its pass bar AT
    the minimum — i.e. it is a CONSTANT on every admitted row: a boolean wearing a ratio''s name, never a score. (b)
    The SCORE died because its producer was DELETED at S5 on the argument that the guarantee had moved to S1.5, and because
    the ranking repair (D-2979/D-2980) repointed its last live reader — leaving a column that nothing writes, that SQL
    reads as a VALUE and Python reads as ABSENT inside one function, and that three outward surfaces still PUBLISH. (c)
    The PRINCIPLE is alive and UNDER-SERVED: the S1.5 gate only covers the CLUSTER route, so the singleton route reached
    the store unguarded — the measurement is in BUG-768. (d) The REAL scoring logic already EXISTS and is persisted:
    ISOR (D2284/D2309) over canonical source_ids (D2185) computes an INDEPENDENCE measure (author independence x domain
    diversity x source count) with a strong/medium/weak rating, and NO surface advertises it. RECOMMENDATION, corrected:
    RETIRE `borp_score` from every served surface and PROMOTE `corroboration` (the ISOR block) in its place; KEEP `feedback_score`
    — it is a CACHE whose LEDGER and writer exist, and its defect is that a bare null cannot be told from a score of
    0.0, not that it is dead. The owner word, the ENFORCED vocabulary and the dispositions live in config/served_fields.yaml;
    the evidence is governance/BORP_FEEDBACK_ASSESSMENT_20261013.md; the sheet is governance/OWNER_DECISION_T107_20261013.md.'
