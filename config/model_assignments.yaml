# If a model appears in BOTH files, pipeline_config.yaml takes precedence.
# OptiQ variant: experimental — not yet adopted in main pipeline.
# Updated: 2026-08-06 — D2199: fixed REVIEWER, documented OptiQ/non-OptiQ split.
