# ═══════════════════════════════════════════════════════════════════════════
# stage4_golden.yaml
# Purpose: S4 classification few-shot (depth / discipline / domains / evidence).
#
# WHY (D2451, 2026-08-24): S4 classification had its depth examples HARDCODED
# inline in CLASSIFY_SYSTEM_PROMPT (C12 violation + untestable). The live smoke
# showed depth cross-domain 21.6% and discipline `emerging` 15.5% — calibration
# drift that only a config-driven golden set can tighten reproducibly.
#
# This file makes those examples config-first (C12), spans all 4 depth levels,
# and is validated by tests/test_stage4_golden_contract.py against
# config/content_types.yaml + the canonical taxonomy (pipeline/schemas.py).
#
# Scope: CLASSIFICATION only (depth/discipline/domains/evidence/is_specialized).
# CRIBS (application/failure_mode/jargon) has its own inline prompt and is out
# of scope for this golden — keep the two concerns separated.
# ═══════════════════════════════════════════════════════════════════════════
meta:
  version: '1.0'
  purpose: S4 classification golden few-shot (depth/discipline/domains/evidence)
  decision: D2451
  status: WIRED      # wiring into the 4 S4 classification prompts = D2454 (2026-08-27, fail-closed)
  total_examples: 7
  expected_coverage:
  - depth_universal
  - depth_cross_domain
  - depth_domain
  - depth_specialized
  - domain_discipline_disjointness

examples:

# ── universal: mechanism applies across ALL reality ────────────────────────
- id: S4-GOLD-001
  depth: universal
  input_fb:
    name: Power-Law Heavy-Tailed Distribution
    definition: "Many natural and social quantities follow a power-law distribution, where a small number of large events dominate and a long tail of small events is disproportionately common."
    mechanism: "Preferential attachment and multiplicative growth produce scale-free structure: each increment is proportional to current size, so large entities grow faster and the distribution becomes heavy-tailed across many orders of magnitude."
    boundary: "Applies to systems with multiplicative growth or preferential attachment. Fails for quantities with a characteristic scale (normal distribution) or hard upper bounds."
  expected_classification:
    discipline: "complex adaptive systems"
    domains: ["science & research", "business operations"]
    depth: "universal"
    evidence: "cited"
    is_specialized: false
  rationale: "The heavy-tailed mechanism (proportional growth → scale-free) applies across wealth, earthquakes, word frequency, and city sizes — ALL reality, not one field. depth=universal. discipline is the structural science (complex adaptive systems), NOT a single application domain."

# ── cross-domain: mechanism bridges two+ DISTINCT disciplines ──────────────
- id: S4-GOLD-002
  depth: cross-domain
  input_fb:
    name: Feedback Loop
    definition: "A circular causal structure where a system's output is routed back as input, either amplifying (positive) or dampening (negative) the original signal."
    mechanism: "The output of a process feeds back into its input, so positive feedback compounds deviations (runaway growth or collapse) while negative feedback stabilizes the system around a set point."
    boundary: "Applies to systems with a detectable output→input path and a delay shorter than the response needed. Fails when feedback is absent or too slow to correct the deviation."
  expected_classification:
    discipline: "complex adaptive systems"
    domains: ["systems & frameworks", "organizational behavior", "engineering & infrastructure"]
    depth: "cross-domain"
    evidence: "cited"
    is_specialized: false
  rationale: "The SAME causal structure (output routed back to input) bridges biology (homeostasis), engineering (control systems), and economics (supply/demand). It structurally connects distinct disciplines → depth=cross-domain, not domain."

# ── domain: mechanism operates within ONE field ────────────────────────────
- id: S4-GOLD-003
  depth: domain
  input_fb:
    name: Color Gamut
    definition: "The range of colors a device or color space can represent, bounded by the chromaticities of its primaries."
    mechanism: "A gamut is the convex hull of the primary color coordinates in a color space; any color inside the hull can be reproduced by mixing the primaries, while colors outside cannot."
    boundary: "Applies to a specific color space or output device. Fails when comparing across color spaces with different primaries or rendering intents."
  expected_classification:
    discipline: "color theory"
    domains: ["graphic design", "digital product"]
    depth: "domain"
    evidence: "cited"
    is_specialized: false
  rationale: "Gamut math is meaningful only within color science/design — strip the field's vocabulary and the mechanism becomes meaningless. It does NOT bridge distinct disciplines → depth=domain (NOT cross-domain, NOT universal)."

# ── specialized: narrow sub-technique within a field ───────────────────────
- id: S4-GOLD-004
  depth: specialized
  input_fb:
    name: Backpropagation
    definition: "An algorithm for computing the gradient of a loss function with respect to every weight in a neural network by applying the chain rule backward from the output layer."
    mechanism: "The chain rule propagates the error gradient layer-by-layer from output to input, so each weight's contribution to the total loss is computed in a single backward pass and used to update the weight."
    boundary: "Applies to differentiable neural-network architectures. Fails for non-differentiable components or when gradients vanish/explode over many layers."
  expected_classification:
    discipline: "machine learning"
    domains: ["ai & agents"]
    depth: "specialized"
    evidence: "cited"
    is_specialized: true
  rationale: "A narrow sub-technique within machine learning — a specific algorithm, not a field-spanning principle. Strip ML jargon and it is meaningless. depth=specialized, is_specialized=true."

# ── cross-domain BOUNDARY case (D2482): analogical transfer across industries ──
# Added 2026-08-28 after live depth probe showed the classifier collapsing 97.5%
# of principle FBs to "domain". This is a REAL corpus FB (S2 extraction, 2 sources:
# Creative Confidence + HBR Guide to Unlocking Creativity) that the depth pass
# itself classifies cross-domain — the boundary the collapse erases.
- id: S4-GOLD-005
  depth: cross-domain
  input_fb:
    name: Cross-Industry Insight Transfer
    definition: "Drawing meaningful insights from seemingly unrelated industries or domains can reveal novel solutions to problems within one's own field. This principle describes the process of recognizing parallels between different contexts and applying learned patterns to new situations."
    mechanism: "This is a practical heuristic for innovation: when facing a challenge in one's field, deliberately seeking analogies from other domains can trigger novel solutions. The mechanism works through pattern recognition and metaphorical thinking, where a solution from one context is adapted to fit a different but structurally similar problem. The process requires both domain expertise in the target field and exposure to diverse sources of information or unrelated fields."
    boundary: "Applies when there is sufficient structural similarity between domains to enable meaningful analogy. Fails when the domains are completely dissimilar or when the transfer requires extensive adaptation that loses the original solution's effectiveness."
  expected_classification:
    discipline: "creative process"
    domains: ["business operations", "science & research"]
    depth: "cross-domain"
    evidence: "cited"
    is_specialized: false
  rationale: "The mechanism (analogical transfer via pattern recognition + metaphorical thinking) is structurally domain-independent — it works across any pair of structurally-similar fields. It is NOT a single field's method (depth=domain) and NOT a universal law (it requires structural similarity, so it fails across truly dissimilar domains). depth=cross-domain. Discipline is the structural science of creative ideation (creative process), not one application domain."

# ── domain/discipline disjointness (D2528 / BUG-197): "data visualization" is a
# DOMAIN, NEVER a discipline. Emitting it as a discipline fails canonical matching
# → wrongly `emerging` (the BUG-197 leak). The classifier must keep the two axes
# DISJOINT (D2422): domain labels land in `domains`, discipline labels in `discipline`.
- id: S4-GOLD-006
  depth: domain
  input_fb:
    name: Data-Ink Ratio
    definition: "The proportion of ink in a chart that encodes data, versus decorative ink that adds no information; maximizing data-ink minimizes chart junk and improves readability."
    mechanism: "Every non-data element (gridlines, 3D effects, decorative fill) competes for the viewer's limited visual attention, so removing it raises the signal-to-noise ratio and speeds comprehension."
    boundary: "Applies to static 2D explanatory charts. Fails for artistic or exploratory visualization where decoration is the point."
  expected_classification:
    discipline: "information science"
    domains: ["data visualization"]
    depth: "domain"
    evidence: "cited"
    is_specialized: false
  rationale: "Data-ink is a principle of visualization practice — a DOMAIN. `data visualization` must land in `domains`, NEVER `discipline` (D2422 disjointness); the epistemic discipline is information science. Emitting `data visualization` as a discipline would fail canonical matching → wrongly `emerging` (BUG-197)."

# ── domain/discipline disjointness (D2528 / BUG-197): "organizational behavior" is a
# DOMAIN (Business & Strategy), NOT a discipline — the discipline is organizational theory.
- id: S4-GOLD-007
  depth: domain
  input_fb:
    name: Structural Inertia
    definition: "Organizations resist change because their routines, capabilities, and sunk investments lock them into past behavior even when the environment shifts."
    mechanism: "Established structures and processes create self-reinforcing commitments; the cost of reconfiguring them exceeds the perceived benefit of adaptation, so the organization reproduces prior patterns."
    boundary: "Applies to mature organizations with entrenched routines. Fails for young, small organizations that can reconfigure cheaply."
  expected_classification:
    discipline: "organizational theory"
    domains: ["organizational behavior"]
    depth: "domain"
    evidence: "cited"
    is_specialized: false
  rationale: "Structural inertia is organizational behavior — a DOMAIN. `organizational behavior` is a domain, NOT a discipline; the discipline is organizational theory. Same BUG-197 boundary: domain labels stay in `domains`, discipline labels in `discipline`."
