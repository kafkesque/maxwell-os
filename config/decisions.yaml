- id: D284
  category: MEASUREMENT
  state: RESOLVED
  date: '2026-09-20'
  title: R2 hypothesis-construction A/B — paraphrase beats definition as mislabel detector (D-284)
  source: scripts/r2_ab_harness.py
  verification: 'Ran 2026-09-20 on the 30-row ceiling sheet (DeBERTa-v3-large, MPS). Arm B (definition hypothesis, r5-overridden): false_contra 0.267, entail 0.600, neutral 0.100. Arm C (paraphrase content-claim hypothesis): false_contra 0.233, entail 0.433, neutral 0.333. Wrong-probe (principle rows vs tool_instruction hypothesis): definition 6/11 contra, paraphrase 10/11 contra. Verdict: (1) BUG-305 was NOT fundamental — the new r5 principle definition (D-283) dropped principle-class false-contra ~1.0 -> 0.27, so KEEP NLI on content_type (reject drop-CT arm A); (2) paraphrase (arm C) is the better mislabel detector (91% vs 55% wrong-contra) with comparable false-contra; (3) growth_edge is the hardest class (0.40 false-contra in both arms).'
  description: 'A/B-tests the R2 hypothesis construction instead of committing by fiat. IMPLEMENTED 2026-09-20: arm C adopted — scripts/definition_nli_verify.py now builds the content_type hypothesis from a per-role PARAPHRASE content-claim (config/content_types.yaml `nli_paraphrase`, single source also read by r2_ab_harness.py); discipline/domains keep the definition hypothesis. r5_hash + menu_hash are stamped on the R2 report (BUG-307 resolved). Caveat: the reference labels are coder-2 (same-person, kappa 0.333 vs coder-1), so the A/B figures are DIRECTIONAL until the ceiling is re-measured (BUG-306).'
  files:
  - scripts/r2_ab_harness.py
  - governance/r2_ab_harness_20260920.json
  - scripts/definition_nli_verify.py
  - config/content_types.yaml
- id: D283
