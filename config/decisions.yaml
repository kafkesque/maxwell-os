- id: D-2639
  category: GOVERNANCE/ONTOLOGY
  state: ACTIVE
  date: '2026-09-25'
  title: 'A derived column with no declared home is an unanswerable question - and a 1:1 coupling must be PROVEN from its source, not declared by its shape'
  context: >
    BUG-499. The D2284 epistemic label existed as three identical inline copies with rating literals in
    code and no declaration, so when the rail reported 'every label maps to exactly one status' the repo
    could not say whether that was a hidden gate (D274a's defect) or a property of one shared record.
    Both offered declarations were unusable: 'independent' demands a decoupling that measurement
    contradicts (0/7,995 labels fail to re-derive from the record), and 'derived_mirror' inverts the
    causal arrow while checking nothing about the label's provenance.
  decision: >
    (1) A DERIVED column gets ONE implementation and one config block; every other site imports it - a
    second copy is a second truth (C21), and an undeclared rule cannot be reasoned about, only observed.
    (2) When two columns are functions of the SAME record, declare their relationship as CO_DERIVED:
    the rail must then re-derive the dependent column from the record and fail on mismatch
    (max_label_mismatch, shrink-only), because inspecting the SHAPE of a coupling verifies nothing about
    its SOURCE. A hand-set value, or a rule that moved while the rows did not, must be a DEFECT.
    (3) An ontology is declared in config (C12) and is never inferred from the data it explains.
  authority: 'assistant + senior-RAG (both: measure the provenance before naming the coupling)'
  files: [pipeline/serving_gate.py, pipeline/stage5_verify.py, config/serving_gate.yaml,
          scripts/check_serving_gate.py, scripts/sync_s5_checkpoint_from_db.py,
          scripts/reinject_bug198_singletons.py, tests/test_serving_gate.py]
  evidence: >
    MEASURED 2026-09-25: 7,995/7,995 stored labels re-derive from (factual.passed, isor.rating), 0
    mismatch; all three inline copies deleted (grep for an inline label assignment: NONE); 10/10
    known-answer controls fire incl. 'a HAND-SET label contradicts the record -> LABEL_MISMATCH';
    check_serving_gate.py rc=0 with the co_derived proof in the headline (was owner_owed on every run);
    extraction behaviour-preserving (new function != stored label: 0/7,995); 25 tests pass.

- id: D-2640
  category: GOVERNANCE/PROVENANCE
  state: ACTIVE
  date: '2026-09-25'
  title: 'A provenance state that only a human can tell apart must be DECLARED by the store, bounded by a closed set, and enforced by a rail'
  decision: >
    (1) An empty label-provenance stamp is NOT evidence of anything until the store declares which generation
    runs are inside a PRE_PROVENANCE_BOUNDARY. The boundary is a CLOSED SET of runs plus a DECLARED measured
    population (never a date predicate: a date lets a new run silently join the boundary and absorb its own gap).
    (2) Rows inside the boundary are classified pre_boundary and NEVER backfilled (D-277). A row OUTSIDE the
    boundary lacking the quartet is a DEFECT (a broken stamp must not hide behind the boundary).
    (3) The state is a DECLARED FIELD OF THE QUERY SURFACE, attached at the one row-mapping choke point, so no
    consumer infers traceability from an empty column. (4) This is the TRACEABILITY axis; it is NOT the C29
    authorship vocabulary and NOT the eval provenance tiers - three axes, three names, one meaning each.
  measured: '7995/7995 rows empty on menu_hash + 3 *_source; runs t11 7,867 | bug198_reinject 6 | e2e 122; 0 missing'
- id: D-2641
  category: GOVERNANCE/INVARIANT
  state: ACTIVE
  date: '2026-09-25'
  title: 'An invariant needs both halves: a pre-write refusal in the one writer and a post-hoc rail - and one comparator, never two'
  decision: >
    (1) A declared invariant whose only enforcement is a rail over stored rows is half-enforced: the store can be
    mutated before anyone looks. The single write path must evaluate the SAME rule BEFORE the write and refuse the
    row (fail closed). (2) The comparator is ONE function (pipeline/serving_gate.py::store_verdict) imported by the
    writer and the rail; two implementations of one comparison are two truths (BUG-499/BUG-502). (3) The pre-write
    policy is declared in config and an unknown value is fatal, so the guard cannot be turned into an off switch.
  measured: 'pre_write_verdict refuses 0 of 7,995 stored rows; rail 7995 MATCH; 10/10 + 6/6 known-answer controls'
