# store_bridge - the anchor<->corpus BRIDGE (BUG-420). The join is keyed by CONTENT (the item's NAME), never by
# a row position (D-2658): a coordinate is not a fact about the row. Derived and verified by
# scripts/build_anchor_store_bridge.py (--check re-derives and compares, so the artifact cannot go stale silently).
# An UNRESOLVED row may only exit 2 (owner-owed) if it is NAMED in declared_unresolved below.
store_bridge:
  artifact: governance/ANCHOR_STORE_BRIDGE_20260926.json
  artifact_id: ANCHOR-STORE-BRIDGE
  ruler_sheet: governance/ANCHOR_RULER_CONSOLIDATED_20260923.csv
  ruler_encoding: utf-8-sig
  store: knowledge pipeline/maxwell.db
  store_table: fbs
  store_key: fb_id
  store_name_column: name
  item_key: item_id
  join: content_name
  normalization: collapse_whitespace
  declared_unresolved: []
  golden:
    path: archive/golden_retired_D2618/stage4_golden_mined.yaml
    id_key: id
    name_path: input_fb.name

  # DECLARED GOLDEN-SIDE BRIDGE GAPS (BUG-551, 2026-09-26). MEASURED: both rows below do NOT join because their
  # `input_fb.name` normalises onto TWO corpus rows (`histogram: {ambiguous: 2}`) - the bridge refuses to PICK, so
  # the row is OWNER-OWED until it carries an explicit fb_id. Before this key existed the rail exited 2 on ANY
  # unjoined golden row while the config declared NOTHING: the verdict claimed a declaration nobody made and a real
  # receiving-side breakage would have been filed as owner-owed instead of DRIFT (the BUG-548 class). ONE rule for
  # BOTH sides now: UNDECLARED unjoined = 1 (DRIFT), DECLARED = 2, no adequate why = 1, and a declaration whose row
  # now JOINS = 2 - the ceiling is SHRINK-ONLY and it shrinks LOUDLY.
  declared_golden_unjoined:
    - id: S4-GOLD-MINED-00478
      why: >-
        Ambiguous under the declared normalization: two corpus rows share the folded name, so the join refuses to
        pick one (D-2658 - a join is by content, never by position). OWED: an explicit fb_id before this row enters
        any train/eval set. It is NOT evidence that the anchor and the corpus disagree.
    - id: S4-GOLD-MINED-00600
      why: >-
        Same cause as S4-GOLD-MINED-00478: two candidate corpus rows under collapse_whitespace, recorded and never
        picked. OWED: an explicit fb_id. Keeping it declared forever would hide the owed repair, which is exactly
        why a declaration that starts JOINING is reported as owner-owed.
