  rationale: 'MEASURED 2026-09-26S (BUG-542, third occurrence): config/silent_repair.yaml declared rail 0''s one
    repair site as `lines: [280]`; rail 0 grew for BUG-547 and the site moved to 306, so the register reported ONE
