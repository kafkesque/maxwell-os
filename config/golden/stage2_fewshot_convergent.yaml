    text: 'Power laws govern the distribution of outcomes in networks and complex systems. The 80/20 rule — 80% of effects
      come from 20% of causes — is observed across an astonishing range of domains: 80% of wealth is held by 20% of the population,
      80% of scientific citations go to 20% of papers, 80% of internet traffic flows through 20% of websites. This is not
      a coincidence — it''s a signature of scale-free networks, where preferential attachment causes the rich to get richer
      through cumulative advantage. In such systems, small initial differences compound into extreme disparities over time.
      The mechanism is mathematically simple: new nodes preferentially connect to already well-connected nodes, creating a
      feedback loop that amplifies early advantages into permanent dominance.'
  - source_book: Algorithms to Live By — Brian Christian & Tom Griffiths
    text: 'Preferential attachment is the mechanism behind many power-law distributions. In a growing network, new nodes are
      more likely to connect to nodes that already have many connections — ''the rich get richer.'' This creates a distribution
      where a few nodes have enormous numbers of connections while most have very few. The pattern is observed in scientific
      citations, website links, social networks, and even the distribution of species in ecosystems. The key insight is that
      the pattern emerges from the growth process itself, not from any intrinsic quality of the nodes.

      '
