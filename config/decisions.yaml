  decision: 'Adopt as the STANDING RULE: no rule lands without (i) ONE HOME for the rule, (ii) a BOUNDARY CONTROL
    that has been SEEN, (iii) a NAMED oracle, (iv) a MUTATION that REDs that oracle. (iv) is mechanized as scripts/check_rail_mutations.py
    plus config/rail_mutations.yaml (the ONE home of every declared mutation), wired into just health with its own
    selftest and a tri-state exit. The gate MEASURES, per entry: the oracle baseline is GREEN, the mutation is applied
    in a REAL fixture repository (git init + add + commit) built from DECLARED paths in the SYSTEM temp dir, the
    declared control goes RED through its own named MARKER, and that marker was ABSENT before (two runs, one difference).
    An entry whose find-text no longer matches the bytes is FATAL: a refactored rail cannot silently lose its own
    control (the BUG-542 class, one level up). A declared subject with no mutation entry is FATAL, the mutation
    count carries a declared FLOOR (shrink guard read in a diff a human reads), and a runner slower than the declared
    ceiling is OWNER-OWED, never fatal (BUG-457).'
  measured: '--selftest 15/15 known-answer controls (two joins read the DECLARATION itself; one NEGATIVE control:
    a no-op mutation must NOT red). --check rc=0: 2 declared rules SEEN to red through their own control (provenance_count_is_load_bearing,
    widening_record_rule_is_load_bearing), 1 negative control stayed green, 2/2 declared subjects covered. just
    health rc=0; check_rail_registry rc=0 (43 rail scripts, 5 declared writers). THE GATE FOUND THREE REAL DEFECTS
    IN ITS OWN FIRST RUNS, which is its evidence of teeth: (1) single-quoted YAML does not process an escape, so
    the declared no-op append was the literal two characters backslash-n and the subject died with a SyntaxError
    - a no-op mutation that was not a no-op; (2) a rail that prints a control LABEL on BOTH verdicts has no baseline
    differential, now declared per entry (marker_absent_in_baseline: false); (3) the FORENSIC AUDIT BEFORE THE COMMIT
    found a synthetic observation in the gate selftest restating the boundary rehearsal control count (a second
    home of a declared fact, D-2646) and a docstring claiming the SUBJECT bytes are restored where the code restores
    the FIXTURE copy - both fixed. Nothing here is committed by this record (D-381 owner gate).'
