  cluster_segments:
  - source_book: The Art of Strategy — Avinash Dixit & Barry Nalebuff
    text: 'Keynes used the beauty contest as a metaphor for the stock market, where each investor

      wants to buy the stocks that will rise in price, which means the stocks that investors,

      in general, think will appreciate. The value of a stock is not what YOU think it''s worth,

      but what you think OTHERS think it''s worth — and what they think others think, in an

      infinite recursion of mutual expectation.

      '
  - source_book: Algorithms to Live By — Brian Christian & Tom Griffiths
    text: 'As Keynes put it, making a crucial distinction between beauty and popularity: professional

      investment may be likened to those newspaper competitions in which the competitors have

      to pick out the six prettiest faces from a hundred photographs, the prize being awarded

      to the competitor whose choice most nearly corresponds to the average preferences of the

      competitors as a whole. Each competitor has to pick, not those faces which he himself

      finds prettiest, but those which he thinks likeliest to catch the fancy of the other

      competitors. We have reached the third degree where we devote our intelligences to

      anticipating what average opinion expects the average opinion to be.

      '
  - source_book: 'The Great Mental Models, Volume 4: Economics and Art — Shane Parrish'
    text: 'Economist John Maynard Keynes used the metaphor of a beauty contest to explain how stock

      prices are set. He asked readers to imagine a contest where entrants must choose six faces

      out of a hundred; those who pick the faces chosen by the most other people win. Keynes

      believed stocks are priced not according to their intrinsic value but according to

      investors'' perceptions of other investors'' perceptions — a recursive prediction problem

      where the fundamental value becomes almost irrelevant to short-term price movements.

      '
  is_convergent: true
