- id: D-329
  category: EVALS
  state: RESOLVED
  date: 2026-09-22
  title: 'F-11 first measurement: the ruler human labels are an outlier against two independent model coders; no floor certifiable from this sheet'
  decision: >-
    Two LLM coders from different families (claude-sonnet, kimi-k3), each blind to the human and to each other,
    labelled the exported 122-row ruler. On the common 79 rows: human~claude k = 0.47 (CT) / 0.40 (DISC) / 0.37
    (FORM); human~kimi k = 0.55 / 0.35 / 0.33; claude~kimi k = 0.80 / 0.71 / 0.62. Both models agree with each
    other roughly twice as much as either agrees with the single human coder, on all three axes. Consequences:
    (a) the provenance tier stays llm-attested/advisory and F-11 stays OPEN - a third attested set is not
    independent human truth; (b) NO eval floor in config/eval_integrity.yaml may be certified from this
    reference sheet - it is not reproducible enough; (c) D-327's relative verdict stands (baseline vs treatment
    compared on one reference), but its ABSOLUTE error rate (0.8000) is not a classifier property: it is bounded
    below by the reference's own reproducibility; (d) both model coders stayed INSIDE the closed menu (0
    out-of-vocabulary labels), which shows the menu is usable from text alone and therefore the S4 classifier's
    out-of-menu emission (13-18 of 60 rows, D-327) is a classifier/prompt defect, NOT a menu defect; (e) next
    step is 3-way arbitration on the disagreed rows to locate granularity, feeding
    config/boundary_discriminators.yaml. Artifacts: governance/f11_llm_coder_{claude-sonnet,kimi3}_20260922.*
- id: D-330
  category: HARDENING
  state: RESOLVED
  date: 2026-09-22
  title: 'S5 checkpoint identity bound to its real inputs (never global HEAD) + a single-writer lock; migration is an explicit validated re-stamp'
  decision: >-
    BUG-361/BUG-362 fixed. _s5_input_fingerprint() no longer binds pipeline_commit (global HEAD) or the whole-config
    manifest_hash: those move on governance-only commits, which hard-discarded a live 1,250-record S5 checkpoint
    (D2485 behaviour). The fingerprint now binds the S4 checkpoint content, schema/taxonomy versions, the model lineup,
    the S5-relevant source files (C12 config list stage5.fingerprint_files: stage5_verify.py, serving_gate.py,
    io_guard.py) and the stage5 config slice; pipeline_commit and manifest_hash are still recorded but under
    `informational`, so they never change the id. The scheme change is migrated by an EXPLICIT, validated act:
    `stage5_verify.py --adopt-fingerprint` re-stamps only if all 7 substantive inputs are byte-identical and refuses
    otherwise (fail-closed, C16); on 2026-09-22 it changed exactly manifest_hash, pipeline_commit, s5_code_sha256 and
    s5_config_sha256 (id 63f823bd1175b97f -> c2754fc63f845084) with all substantive inputs identical, and the 1,250
    verified records survived the resume (1250 -> 6745 remaining). Additionally the S5 checkpoint now has a
    single-writer lock (<checkpoint>.lock, pid + timestamp, atexit release, live-holder refusal, dead-pid reclaim,
    config gate stage5.single_writer_lock) because two writers on one checkpoint is worse than a crash: on 2026-09-21
    two runs wrote it within 4 minutes and only the io_guard shrink guard prevented a 50-row rollback. Proven live by a
    deliberately started second run being refused.
