services:
  ollama:
    host: localhost
    port: 11434
    min_version: 0.32.0
    nomic_max_chars: 4000
    embed_max_chars: 4000
    batch_size: 100
    embed_timeout: 180
    embed_keep_alive: -1
    single_source_guard:
      canonical_app: /Applications/Ollama.app
      forbidden_bins:
      - /opt/homebrew/opt/ollama
      - /opt/homebrew/Cellar/ollama
      shim_paths:
      - /opt/homebrew/bin/ollama
      - /usr/local/bin/ollama
      forbidden_launchd_labels:
      - homebrew.mxcl.ollama
      launch_agents_dir: ~/Library/LaunchAgents
  omlx:
    host: localhost
    port: 11435
    api_key: sk-maxwell-local
    min_version: 0.4.0
    # D-291 (2026-09-21): pin to 0.7.0.dev2 — 0.7.0.dev4 fails to start on
    # externally-accessible servers with API-key auth disabled (Maxwell exposes
    # external server_aliases). Enable auth in ~/.omlx/settings.json to use dev4.
    # D-2772 (2026-10-02): OMLX updated to 0.7.0 release (build 2987), verified
    # healthy on this M1 Max. Pin synced to the now-running release.
    pinned_version: 0.7.0
    # D-293: Lightning MTP drafter for Qwen3 adapters (+34-58% decode, lossless at
    # temp=0.0). Enabled per-model in ~/.omlx/model_settings.json; flag records intent.
    mtp_enabled: false
    bin: null
    default_timeout: 300
    max_retries: 2
    retry_delay: 3
    cold_reload_delay: 45
    read_timeout: 60
    wedge_recovery_sleep: 20
    # BUG-658 (2026-10-06): TOTAL wall-clock deadline per inference call. The per-read
    # read_timeout is defeated by OMLX SSE keepalive bytes (sse_keepalive_mode: 'chunk'),
    # which reset the read timer forever and leave the client silently hung. This is a
    # hard ceiling keepalive cannot reset; the A/B harness reads it until call_omlx does.
    wall_clock_deadline_sec: 180
    # BUG-658: preflight smoke classification deadline — proves the model is loaded AND
    # chat completions return parseable JSON before an N-request run (a /v1/models ping
    # cannot prove chat readiness; see stress_test_omlx for the distinction).
    preflight_smoke_deadline_sec: 120
    circuit_breaker_enabled: true
    circuit_breaker_failure_threshold: 5
    circuit_breaker_failure_threshold_floor: 25
    circuit_breaker_cooldown_seconds: 60
    single_source_guard:
      canonical_app: /Applications/oMLX.app
      forbidden_bins:
      - /opt/homebrew/opt/omlx
      - /opt/homebrew/Cellar/omlx
      shim_paths:
      - /opt/homebrew/bin/omlx
      forbidden_launchd_labels:
      - com.maxwell.omlx
      - homebrew.mxcl.omlx
      launch_agents_dir: ~/Library/LaunchAgents
models:
  generator:
    model: Qwen3-Coder-30B-A3B-Instruct-MLX-4bit
    provider: omlx
    temperature: 0.0
    max_tokens: 1024
  verifier:
    model: gpt-oss-20b-MXFP4-Q8
    provider: omlx
    temperature: 0.0
    reasoning_off_prefix: 'Reasoning: low'
    reasoning_off_models:
    - gpt-oss-20b-MXFP4-Q8
    max_tokens: 1024
    chat_template_kwargs:
      enable_thinking: false
    thinking_budget: 256
    depth_thinking_budget: 128
  verifier_v2:
    model: Phi-4-mini-instruct-8bit
    provider: omlx
    temperature: 0.0
    notes: 'D2319: S2 fast probe (~1.5s). D2298 removed Phi from S5 *verification*
      only; S5 = DeBERTa-only (models.nli_large).'
  embeddings:
    model: bge-m3
    provider: ollama
    alternative: mlx-community/Qwen3-Embedding-0.6B-4bit-DWQ
  nli_large: MoritzLaurer/DeBERTa-v3-large-mnli-fever-anli-ling-wanli
label_vote:
  # D2577/D2580 3-model label vote. Three INDEPENDENT (cross-family) voters that
  # must NOT include gpt-oss-20b (the S4 teacher whose silver labels this vote
  # verifies). 2026-09-10 (user override): Phi-4-mini + gemma ruled unreliable for
  # this pass; voters are now DeepSeek-v4-pro (frontier, C22 opt-in) + Qwen3.8-27B
  # + Qwen3-Coder-30B. DeepSeek is CLOUD (C1 $0 / C3 sovereignty) — explicit opt-in
  # via DEEPSEEK_API_KEY / --key; falls back to the two local Qwen voters if absent.
  models:
  - model: deepseek-v4-pro
    provider: deepseek
  - model: Qwen3.8-27B-MLX-4bit
    provider: omlx
  - model: Qwen3-Coder-30B-A3B-Instruct-MLX-4bit
    provider: omlx
  # D2610 (2026-09-10) LABEL POLICY v2 - measured, not assumed:
  #   DeepSeek-v4-pro vs Qwen3.8-27B agree on 678/982 = 69.0% of co-voted FBs;
  #   Qwen3-Coder-30B matches that consensus on only 303/678 = 44.7% and, under
  #   2-of-3, can only ever DECIDE the 304 rows where the pair disagrees (the
  #   hardest 31%) - so 2/3 majorities were partly coin flips (BUG-236).
  #   fail-closed-to-domain fabricated a label for 8.1% of FBs and the encoder
  #   scores 0.300 accuracy on exactly those rows (BUG-235).
  # Policy: reliable voters must be UNANIMOUS -> label + confidence high; anything
  # else ABSTAINS (confidence low + needs_review) and is queued for adjudication.
  # Advisory voters are recorded for the audit trail and never decide.
  policy: reliable_pair_agreement
  reliable_voters:
  - deepseek-v4-pro
  - Qwen3.8-27B-MLX-4bit
  advisory_voters:
  - Qwen3-Coder-30B-A3B-Instruct-MLX-4bit
  abstain_on_disagreement: true
  # legacy (D2577, superseded by the D2610 policy above): kept so old checkpoints
  # and the label_vote.py challenger path still resolve their keys.
  majority_threshold: 2
  fail_closed_discipline: emerging
  fail_closed_depth: domain
  catch_all_disciplines:
  - interdisciplinary studies
  single_fb_calls: true
  recovery_sleep_seconds: 1.0
  checkpoint_interval: 25
  max_tokens: 256
  timeout: 120
pipeline:
  schema_version: '3.0'
  commit: v3.0-D2485
  taxonomy_version: v5.7
  max_domains_per_fb: 5
  chunk_size_words: 300
  chunk_overlap_words: 50
