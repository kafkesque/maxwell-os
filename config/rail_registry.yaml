# config/rail_registry.yaml - THE RAIL REGISTRY (D-2665). The ONE home of the fact "this rail is a rail".
#
# WHY THIS FILE EXISTS. The rail set had no registry, so "which invariant has no owner" could only be found by
# inspiration, and three classes of mechanical defect kept recurring (BUG-537 and BUG-556 are both class iii):
#   (i)   a rail NOTHING RUNS        - a control that never fires (BUG-492)
#   (ii)  a rail whose PRINTED verdict and EXIT CODE disagree - a green line over a red code
#   (iii) a rail whose REMEDY or INPUT is uncontrolled - a rail that rewrites the thing it checks (BUG-537),
#         or whose input the ladder itself mutates (BUG-556)
# The registry is the ONE home of two facts a machine can settle without judgement:
#   * every `scripts/check_*.py` / `scripts/verify_*.py` is either INVOKED by a declared ladder recipe, or
#     declared DORMANT here with the exact thing that exercises it (a path that must EXIST, C16);
#   * every rail DECLARED as a writer must have its own `--selftest` run BY THE LADDER (class iii: a rail that
#     writes is a rail whose remedy is a claim, and a claim needs a known-answer control that has been SEEN).
# A `guard:` declared here is matched against the ladder's own text; a disagreement is class (ii), fail closed.
# This registry does NOT decide policy: it reports which invariant has no owner.
schema_version: '1'
authority: D-2665
ladder: justfile
recipes: [health, health-deep]     # the ladder(s) this registry governs; every other recipe is out of scope

#: D-2983 (BUG-759): the ladder's verdict is a MEASUREMENT, not a moment. `just health` reports a PREFIX, and a
#: prefix read as a verdict is how the full ladder stood RED on SEVEN lines while nobody knew - a session that
#: mints a decision cannot get past the commit-frontier rail, and a session that never runs the whole set never
#: sees the rest. So the collector now RECORDS what it measured - coverage fingerprint, line count, worst rc,
#: every fault, cost, age, HEAD - and BOTH readers of that record, the banner FIRST in the recipe (before any
#: rail can abort it) and the recipe's LAST line, derive the whole-set entry point from the ladder's own bytes.
#: This path is gitignored runtime state, the same disposition as scripts/check_tests.py's
#: temp/tests_rail_last_run.json: the record is THIS clone's observation, so committing it would dress a
#: machine-local measurement as durable evidence, while its ABSENCE is itself a reported state (rc 2, UNKNOWN,
#: loud), never a silent one.
ladder_receipt:
  path: temp/ladder_receipt.json
  recipe: health                 # the recipe the record is a verdict ABOUT
  max_age_hours: 72              # beyond this budget the record is UNKNOWN (owner-owed, loud): evidence ages out

#: Rails the ladder does NOT invoke. Each MUST name the thing that exercises it, and that path MUST exist: a
#: dormancy claim is a declaration, and a declaration whose subject is absent is an assertion (D-405/BUG-488).
dormant:
  scripts/check_stale_toolcall_rows.py:
    exercised_by: ['governance/p0_p1_criteria.yaml']
    reason: 'a CRITERION of drift_monitor.py, declared as an args/cmd line in governance/p0_p1_criteria.yaml (measured 2026-09-26)'
  scripts/check_suite_coverage.py:
    exercised_by: ['governance/p0_p1_criteria.yaml']
    reason: 'a CRITERION of drift_monitor.py, declared as an args/cmd line in governance/p0_p1_criteria.yaml (measured 2026-09-26)'
  scripts/check_corroboration_collapse.py:
    exercised_by: ['config/corroboration_collapse.yaml']
    reason: >-
      T-119's read-only collapse measurement. It is DORMANT because a measurement is not a gate: it cannot fail a
      build, so wiring it into `just health` would turn a number into a verdict. Its rule file names it
      (`rail.script`) and carries the population, the falsifier bars and the probe targets, so the invocation is
      DECLARED rather than left to inspiration. Declared dormant 2026-10-14; the ladder is unchanged.
      RE-MEASURED 2026-10-14 (D-2996/BUG-780): limb_voice became COMPUTABLE ($0, read-only, opt-in `--voice`)
      where the earlier step-0 report called it BLOCKED - the probe had asked for persisted EMBEDDINGS while the
      limb needs the segment TEXT, which the S1 chunk store persists. Selftest 8/8; live rc=0. The ladder is
      still unchanged, and the reason to keep it dormant is stronger now, not weaker: its number is an OWNER
      RULING'S input (T-129), not a build verdict.

#: Rails that WRITE or REGENERATE an artifact. Each must be run with --selftest BY THE LADDER, because such a
#: rail's remedy is a claim about bytes it replaces, and an unproven remedy is where BUG-537/BUG-556 came from.
writers:
  scripts/apply_owner_domain_review.py:
    writes: ['governance/DOMAIN_RULER_FROZEN_20261008.json']
    why: >-
      BUG-678/BUG-679/BUG-682: the OWNER-derived authority for the discipline/domain/primary_domain axis.
      It is a WRITER (it re-stamps the ruler from the pinned owner sheet + the declared rulings), so its
      remedy is a claim about bytes and the ladder must run BOTH its --selftest (the known-answer controls)
      and its --check (re-derivation proof + the partition invariant) before believing it.
  scripts/check_boundary_rehearsal.py:
    writes: ['<system temp>/boundary_rehearsal_*/ (NEVER inside the synced tree: BUG-537)']
    why: >-
      D-2675: the rehearsal materializes TRACKED HEAD bytes into a REAL repository under the system temp dir and runs
      real commits there. Declared as a WRITER so a rail that writes is never a rail nothing accounts for, and so the
      ladder's own audit of declared writers keeps its --selftest wired (config/rail_registry.yaml#writers).
  scripts/apply_relabel_store_write.py:
    writes: ['knowledge pipeline/maxwell.db#fbs (discipline, discipline_macro, discipline_source, taxonomy_match_method — for the LICENSED fb_ids only)', 'config/label_store_write_receipt.json']
    why: >-
      T-103/D-2988: the ONLY writer that EXECUTES an owner ruling on a stored label. Declared as a writer because
      its remedy is a claim about bytes it replaces - 163 canonical labels plus the store's own counts - so the
      ladder must run its --selftest (11 known answers: six refusals each NAMED by its guard, five acceptance and
      agreement controls) before its remedy can be believed. It refuses to write without the owner word in
      config/relabel_rulings.yaml#store_write_license, and it is mutation-locked twice (D-2676): the SCOPE guard
      and the TARGET-agreement guard.
  scripts/check_rail_mutations.py:
    writes: ['<system temp>/rail_mutations_*/ (a REAL fixture repository: NEVER inside the synced tree, BUG-537)']
    why: >-
      D-2676: the MUTATION GATE mutates a SUBJECT inside a fixture repository and runs the declared runner there.
      Declared as a WRITER so a rail that writes is never a rail nothing accounts for, and so the registry audit
      keeps its --selftest wired (class iii of D-2665: a rail whose REMEDY is an unproven claim).
  scripts/build_archive_index.py:
    writes: ['archive/index.yaml']
    why: 'regenerates the archive census; its remedy was the subject of BUG-537 (a silent de-listing) and BUG-556 (a volatile input)'
  scripts/check_config_defaults.py:
    writes: ['config/derivations.yaml', 'config/config_defaults_census.json']
    why: >-
      D-2982: the census rail OWNS its own number, because a human transcribing a probe is not a measurement
      (D-2642). It re-cuts config_reads.ceilings, writes the coverage fingerprint that makes a measurement
      comparable only to one taken the same way, and records config/config_defaults_census.json - the measured
      KEY SET that stops a rotating debt from passing as a stable one (BUG-758). Class iii applies: this rail
      writes an invariant, so its own known-answer controls must be SEEN to fire in the ladder, which is why
      justfile invokes --selftest BEFORE the check.
  scripts/gov_sync.py:
    writes: ['MASTER-TASK-REGISTER.md', 'DECISION-LOG.md', 'governance/buglog.md', 'agent/session_seed.yaml']
    why: >-
      D-2981: the ONE writer for the USER-FACING faces. It renders the GOV-INDEX block in each face from
      governance/task_register.yaml + config/decisions_summary.json + governance/bug_status.json, re-cuts every
      census restatement line (BUG-588/D-2692 - this retires BUG-756, whose remedy had no tracked home), and
      derives session_seed's pipeline_commit/status. Declared here because its remedy is a claim about bytes it
      replaces: the ladder runs its --selftest (8 known answers, including a STALE block that must be SEEN to
      differ) BEFORE its check, and the check BYTE-COMPARES the block against its re-derivation.
  scripts/check_tests.py:
    writes: ['temp/tests_rail_last_run.json']
    why: 'records the suite census a later run is compared against'
  scripts/recompute_decision_summary.py:
    writes: ['config/decisions.yaml', 'config/decisions_summary.json']
    why: 'the MINT gate: it appends a record, so its own controls must be SEEN (D-2660/BUG-492)'
  scripts/run_ladder.py:
    writes: ["temp/ladder_receipt.json (gitignored runtime state: this clone's last full-scan verdict, D-2983)"]
    why: >-
      D-2983/BUG-759: the collector RECORDS what it measured, because a whole-set verdict that lives only in a
      scrollback is a verdict reasoned about from memory - and that is exactly how seven red ladder lines went
      unnoticed for longer than they had been measured. Class iii applies: its remedy is a claim about bytes it
      replaces, so the ladder runs its --selftest (24 known answers, including the ten receipt answers) BEFORE
      the check, and the record is written crash-safely (tempfile -> fsync -> os.replace, C6).

#: Optional: the guard class a rail is DECLARED to have. Omit unless the declared class must be pinned: an
#: entry that disagrees with the ladder is class (ii) and fails CLOSED. fatal = `|| exit 1`; tri_state =
#: `|| [ $? -eq 2 ]` (2 is owner-owed: loud, NOT fatal, BUG-457); report_only = `--report-only`.
guards:
  #: D-2688: the freeze window's EXIT is settled by rc 2 (owner-owed, LOUD, not fatal, BUG-457). Pinned here so that
  #: the day someone writes `|| exit 1` - or drops the guard - the registry calls it class (ii) instead of letting
  #: the ladder silently turn "the window is due to CLOSE" into a broken build.
  scripts/check_freeze_window.py: tri_state
  scripts/check_freeze_window.py --selftest: fatal
  #: D-2997/BUG-781: the INGEST DOOR. The health line is tri_state: 2 = OWNER-OWED (a ledger pair or a T-129
  #: collapse row with no owner word; a corpus name defect whose fix is a write) — loud, NOT fatal (BUG-457).
  #: The SAME rc REFUSES at the ingest step: the door's reading is declared in config#door.ingest_reading, so a
  #: rail pinning the health line to `|| exit 1` would turn an owner's owed word into a broken build, and one
  #: pinning the ingest line to tri_state would let a run mint a corroboration claim its evidence contradicts.
  #: It is a READER of four declared homes (the D-2738 ledger, T-129's sheet, the two detector reports, and
  #: book_metadata's identity + sanitizer) and writes ONLY a deferral receipt under declared runtime state.
  scripts/check_ingest_identity_gate.py: tri_state
  scripts/check_ingest_identity_gate.py --selftest: fatal
  #: BUG-782 — THE OWNER-WORD INTAKE. It renders the T-129 review sheet from the measurement that owns it (never
  #: from a column), validates the owner's vocabulary, derives the effective word (override > signed tier > none),
  #: tests the transitivity conflict rule and binds the sheet to the census by digest. `--check` is the owner lane's
  #: ONE reading: rc 2 = words still owed (loud, NOT fatal, BUG-457); rc 1 = the words contradict each other, or the
  #: sheet is out of phase with its own measurement (the 42-vs-37 class). It writes NOTHING unless --apply is asked,
  #: and then only derived words + a receipt (an agent may EXPAND a signed predicate; it may never mint a label).
  scripts/owner_marks.py --check: tri_state
  scripts/owner_marks.py --selftest: fatal
  #: BUG-785 — THE T-117 READER. The owner's 72 words had no reader (the applier reads config/relabel_rulings.yaml
  #: instead), so a COMPLETED act read as owed. It validates the packet against the DECLARED vocabulary, refuses a
  #: CORRECT with no home and a home no canonical declares (both would MINT a word, D-2898), keys the write by
  #: unit_key (never the ordinal, BUG-751), reports an owner_canonical on a non-CORRECT row as ADVISORY and never
  #: writes it, and never writes `applied:` (that is the licensed store write's receipt).
  scripts/ingest_relabel_rulings.py --selftest: fatal
  scripts/build_archive_index.py --check: fatal
  scripts/build_archive_index.py --selftest: fatal
  scripts/recompute_decision_summary.py --check: fatal
  scripts/validate_depth_domain_contract.py --gate-if-active: tri_state
  #: D-2983 (BUG-759): the receipt's tri-state IS the line's point - 2 (UNKNOWN: never measured here, measured
  #: against a DIFFERENT ladder, or older than the declared budget) is OWNER-OWED, loud and NOT fatal, because
  #: only a full scan can clear it; 1 (a red RECORDED under exactly this coverage) must stay FATAL, because a
  #: measured fault may not go quiet. Pinned here so the day someone writes `|| exit 1` - or drops the guard to
  #: silence the line - the registry calls it class (ii) instead of letting an UNMEASURED ladder read as measured.
  scripts/run_ladder.py --receipt-check: tri_state
  #: D-2984 (BUG-760): the faces' CLAIM SURFACE is FATAL, and pinned here because the failure it catches looks
  #: like style: a face that tells the owner a RESOLVED decision is still pending is not a wording problem, it
  #: is the register lying through the one artifact the owner actually reads. Both its controls and the check
  #: stand as `|| exit 1` for that reason.
  #: D-2985 (BUG-762/763/764): the rail now also polices the LIVE region - the part of the face the OWNER
  #: actually opens - and the failure it catches is the one the owner reported out loud twice. A face that
  #: claims to BE the current index, cites a file that does not exist, or omits WHO must move the work is
  #: FATAL for the same reason D-2984's pin is: the artifact that carries the register to the owner would be
  #: lying, and this is the only surface that reads it.
  scripts/check_governance_faces.py: fatal
  scripts/check_governance_faces.py --selftest: fatal
  scripts/gov_sync.py --selftest: fatal
  #: D-2989: the advertised-field rail's EXIT CODE IS ITS VERDICT, so its class is pinned. 2 = the OWNER WORD is
  #: owed (T-107: borp_score / feedback_score / classification_status are published by three surfaces while a
  #: register that owns their truth calls them defective) - loud and NOT fatal, because an owner-gated contract
  #: change may not abort the ladder (BUG-457); 1 = an UNDECLARED advert or a stale declaration, which is FATAL
  #: because that is the class where an agent reads a fabricated measurement with nothing naming the debt.
  scripts/check_served_fields.py: tri_state
  scripts/check_served_fields.py --selftest: fatal
  #: D-2989/D-2642: the ledger<->cache parity rail. FATAL: a stored aggregate that no longer equals what its ledger
  #: recomputes is a WRONG VALUE, not a debt - nothing about it is the owner's to decide.
  scripts/check_feedback_parity.py: fatal
  scripts/check_feedback_parity.py --selftest: fatal
  #: D-2993/BUG-775: the corroboration parity rail. FATAL, for the same reason as the feedback arm: a stored
  #: `is_convergent`/`source_diversity` that no longer equals what the row's own `source_ids` re-derive is a WRONG
  #: VALUE about the row's evidence, not a policy debt. Read-only (it re-derives; it never clusters, writes or
  #: migrates), so it carries no `writers:` entry.
  scripts/check_corroboration_bit.py: fatal
  scripts/check_corroboration_bit.py --selftest: fatal
  #: D-2995/BUG-776: the RETIRED-NAME rail. FATAL, because a live code path reading a retired name is a WRONG
  #: READING (it branches on a value nothing writes - the BUG-511 class), not a debt the owner owes a word for;
  #: and its second direction (an allowance that outlives its reason) is a stale declaration, the same class
  #: check_served_fields.py calls a DEFECT. It reads config/retired_names.yaml only - no store, no writer.
  scripts/check_retired_names.py: fatal
  scripts/check_retired_names.py --selftest: fatal
  #: D-2991: the golden re-anchor gate's judgment. FATAL: the ladder runs the CONTROLS, not the applier -- the
  #: reviewed sheet + draft exist only at a review sitting, so a liveness pin on --check would be a rail that reds
  #: on a laptop for the wrong reason. The judgment those controls prove is the SAME function both modes call
  #: (judge_review), and the applier itself writes only with --apply plus a C13 backup.
  scripts/reanchor_retrieval_goldens.py --selftest: fatal

#: The COMMIT BOUNDARY (BUG-564). A dormancy claim says WHICH file exercises a rail; it cannot say the file still
#: DOES. This hook lives OUTSIDE the synced tree (BUG-500) - it is not in git, so no diff, no review and no backup
#: would show a line someone deleted, and the strictest gate in the system (RAIL 0/3/4/5) would silently disarm.
#: Its REQUIRED TEXT is therefore a declaration, verified against the bytes on disk, fail closed (C16).
  #: T-132/D-3000 — THE AGENT CONTEXT PROBE. The four layers between a local model's SERVED window and the
  #: words an agent session can afford (served window -> harness declaration -> compaction trigger -> the
  #: ledger's own cache evidence) had no single home and no rail: every link is SILENT when it is wrong, which
  #: is how a local agent session came to compact at 80% of a 32768-token window on a machine that already
  #: serves 262144 to two other models. The --selftest line is fatal (twelve known answers, two of which read
  #: the file's own bytes to prove the report path names no path, host or baseline number, C12). The LIVE line
  #: is tri_state: 2 = OWNER-OWED drift (a declared model the server cannot serve, or a served window nothing
  #: declares) — loud, NOT fatal (BUG-457), because the remedy is a declaration, not a broken build.
  scripts/agent_context_probe.py --selftest: fatal
  scripts/agent_context_probe.py: tri_state
commit_boundary:
  path: git-path:hooks/pre-commit
  why: 'a commit is the one act that makes a conflicted tree permanent (RAIL 0); four rails run ONLY there, so a deleted line is a rail that nothing runs - class (i) at the commit boundary. TWO SMALLER ACTS DISARM IT JUST AS SILENTLY, and neither was the subject of any rail (D-2687). (1) THE ROUTE: this declaration used to name a PATH SHAPE (gitdir: + hooks/). git does not promise to run that file - core.hooksPath decides, and the --git-dir of a linked worktree is not where hooks live. MEASURED 2026-09-27 in a real repository: with core.hooksPath set, `git rev-parse --git-path hooks/pre-commit` answered hooks/pre-commit while --git-dir answered .git, the file at gitdir:hooks/pre-commit DID NOT EXIST, and a DIFFERENT file received the commit and refused it. The route is therefore declared as git-path:<rel>: GIT ITSELF, never a path shape. (2) THE MODE: MEASURED the same day, a mode-644 hook is IGNORED - git LANDS the commit (rc=0), runs none of the four rails, and prints only a `hint:` git documents how to suppress. A byte-perfect verification of a file that may not be executed is class (i) with a green verdict, so the declared subject is the RESOLVED path, its bytes, AND its mode'
  must_contain:
  - 'python3 scripts/check_repo_integrity.py'
  - 'python3 scripts/verify_recalibration_pins.py --staged'
  - 'python3 scripts/check_declaration_consumers.py --staged'
  - 'python3 scripts/check_session_plan.py --staged'
