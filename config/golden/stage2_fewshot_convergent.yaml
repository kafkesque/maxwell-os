  - source_book: The Art of Thinking Clearly — Rolf Dobelli
    text: 'Hanlon''s Razor advises: never attribute to malice that which is adequately explained by incompetence, neglect,
      or misunderstanding. The human mind has a systematic bias toward intentionality — we assume that actions that harm us
      were intended to harm us, even when the far more likely explanation is carelessness, systems failure, or simple error.
      This bias is costly: it escalates conflicts that could be resolved, burns relationships that could be repaired, and
      directs investigative energy toward motive when it should be directed toward process.'
  - source_book: Crucial Conversations — Kerry Patterson et al.
    text: 'When someone does something that hurts or offends us, the brain instantly constructs a villain story: they did
      it because they are selfish, malicious, or indifferent to our wellbeing. The alternative — the victim story — casts
      us as innocent targets of their character flaw. But most harmful actions arise from incompetence, conflicting priorities,
      or incomplete information — not malice. The heuristic is: before assuming bad intent, ask "what else could explain this?"
      The answer is usually less personal and more fixable than the villain story suggests.'
  is_convergent: true
  should_extract: true
