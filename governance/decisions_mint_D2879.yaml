    consolidated face) so a re-run would have SILENTLY REVERTED the owner's rulings (D-387 anti-REVERT class);
    (c) the D-2870 catch-all guard read a HARDCODED column key ("domain") - the day the declared authority's
    column changes, it scans ZERO rows and prints a green line.

    LANDED THIS ROUND (the three limbs of BUG-682 that are fixable without a projection):
