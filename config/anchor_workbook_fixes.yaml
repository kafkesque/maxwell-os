# Declared fixes for the owner's FILLED adjudication workbook (owner review of 2026-09-25).
# AUTHORITY: this file decides what may be rewritten. The script never guesses and never fuzzy-matches:
# a token is fixed only on an EXACT match below, and anything off-menu that is not declared here fails
# the run CLOSED and is printed for the owner.
#
# OWNER RULING (2026-09-25), recorded verbatim in substance: "always consider the first domain the primary
# domain" and "I include more canonical labels occasionally on one instead of writing every unit" - i.e. a
# single-label row is a complete answer, and multiple labels are a set whose FIRST member is the primary.

axis: domains

# The owner separates with commas; the workbook's own coder columns use '|'. Normalising to ONE separator is a
# format decision, not a semantic one - the raw string is preserved in `domains_final_raw`.
separator_out: "|"

# Applied to the whole cell BEFORE splitting. The owner's comma ALSO appears inside one canonical label, so
# 'business,operations' was being split into two non-labels ('business' + 'operations'). Under the first-token
# rule that defect was silently deciding the PRIMARY domain of R024 - which is why it is fixed at cell level.
cell_replacements:
  - from: "business,operations"
    to: "business operations"
  # BUG-449 (owner ruling 2026-09-25: "fix it to user experience - it's a typo"). MEASURED: the defect is a
  # TRAILING SEPARATOR, not a misspelt word - R137 `domains_final_raw` is exactly 'user experience|', so the
  # cell ends in a separator and the split yields a phantom EMPTY token after the real label. Declared at
  # CELL level (the trailing byte is the defect; the label is already correct), exact match only.

# Applied per token AFTER splitting. All EXCEPT 'emerging' are truncated canonical labels: the tail was cut,
# the head is unambiguous, and the completion is the only canonical label that fits.
# WHOLE-CELL ONLY (BUG-458). A cell replacement is applied only when the trimmed cell EQUALS `from`. Applied as
# a SUBSTRING edit it will one day merge two tokens of a pipe-joined list, and the result is an undeclared raw
# token - an unrecorded edit of the owner's bytes, which is the failure this file exists to prevent.
trailing_separator_trim: ['|', ',']   # the owner's trailing separators are TRIMMED, never replaced (BUG-449)

token_fixes:
  "business developmen": business development
  "media & entertainmen": media & entertainment
  "research & methodolog": research & methodology
  "user experienc": user experience
  "esign systems": design systems
  "systems & framework": systems & frameworks
  "systems & frameworks " : systems & frameworks

# Off-menu values that are DECLARED and awaiting an owner ruling. They are left EXACTLY as the owner typed
# them, listed in the receipt, and listed in the fix log with status=UNRESOLVED - never repaired, never
# silently dropped. 'emerging' (R040) matches no label on the 43-label domain menu by any edit distance worth
# acting on, so the only honest move is to ask.
unresolved_allowed:
  - emerging

# Depth: the owner answered in WORDS (the menu's own names). The numeric class is written to a NEW column
# `depth_final_class`; the owner's word stays untouched in `depth_final`.
# MUST mirror config/depth_classes.yaml (the script asserts every label below is present in that file).
depth_alias:
  universal: 1
  cross-domain: 2
  domain: 3
  specialized: 4

# NOTE (BUG-474, fixed 2026-09-25): a SECOND `expect_blank:` block used to be declared below the rulings,
# so this key was DUPLICATED in one YAML document. PyYAML resolves a duplicate key by last-wins, which
# silently discarded the [R140]/[R070,R080,R130] declaration and kept `[]` — the reading happened to be
# the intended one, but a reader (or a stricter parser) would have seen a file with two answers. The
# declaration now lives in exactly ONE place, in the OWNER-RULED section below.
#
# OWNER RULING (2026-09-25): the four discipline cells that hold DOMAIN-menu labels were written there
# ACCIDENTALLY - they are domain labels, misfiled into the discipline column of the frozen ANCHOR-3 sheet.
# Treatment: the value is RELOCATED to the domain axis (where it is a legal canonical label) and is NOT
# counted as a discipline reading. The discipline axis for these rows is declared UNAVAILABLE until the
# owner supplies a real discipline label - this map moves a value, it never invents one.
# Effect: the 4 OFF_MENU cells are classified as a FILING error (recoverable, axis-attributable), not as
# ontology drift or as four bad disciplines - which is why they must not trigger a menu-widening change.
discipline_cell_relocations:
  R042: {value: "design strategy",      axis: domain, discipline_status: UNAVAILABLE-OWNER-OWED}
  R086: {value: "personal productivity", axis: domain, discipline_status: UNAVAILABLE-OWNER-OWED}
  R091: {value: "personal productivity", axis: domain, discipline_status: UNAVAILABLE-OWNER-OWED}
  R117: {value: "personal productivity", axis: domain, discipline_status: UNAVAILABLE-OWNER-OWED}

column_renames:            # D-383: a column NAME is config, not code. The rename happens once,
  flags: row_flags         # while the column has exactly one consumer (none in scripts/ - measured 2026-09-25).

# ── OWNER-RULED 2026-09-25 (D-387/D-388): the four cells this file once declared BLANK ──────────────────
# The owner accepted the assistant recommendation + the senior-RAG recommendation for each blocked cell.
# Every entry carries a `basis`: a value whose provenance is not a row-citable artifact is an INVENTION.
# Applied ONLY by scripts/apply_workbook_rulings.py, which is checked by `just health` (--check) so a
# re-run of normalize_owner_workbook.py --apply cannot silently revert a ruling (it WOULD: normalize
# re-derives the blank, therefore the applier must follow it - order is load-bearing, not cosmetic).
rulings_io:
  workbook: governance/anchor_adjudication_workbook_20260924.csv
  fixlog: governance/anchor_adjudication_fixlog_20260925.csv
  backup_dir: backups
  backup_suffix: PRE_RULINGS_20260925

# Expectation for the CURRENT workbook. Amended from [R140]/[R070,R080,R130]: nothing is blank now.
# Kept as a key so normalize_owner_workbook.py still reads a declaration rather than assuming one.
expect_blank:
  domains_final: []
  depth_final: []

owner_rulings:
  # CARRY-FORWARD (D-387, policy: a later pass that OMITS a cell the owner already filled does NOT
  # withdraw it; withdrawal requires the explicit ..._DECLINED token). The value is the owner's OWN
  # 24.09 answer, read from the write-locked drop-in, not a coder value and not an inference.
  R070: {column: depth_final, value: cross-domain, class: '2', status: CARRY-FORWARD,
         basis: 'owner depth pass 2026-09-24, DEPTH=2 conf=2', source: 'governance/Copy of ANCHOR4_DEPTH_BLIND_SHEET_20260923.csv'}
  R080: {column: depth_final, value: domain, class: '3', status: CARRY-FORWARD,
         basis: 'owner depth pass 2026-09-24, DEPTH=3 conf=1', source: 'governance/Copy of ANCHOR4_DEPTH_BLIND_SHEET_20260923.csv'}
  R130: {column: depth_final, value: domain, class: '3', status: CARRY-FORWARD,
         basis: 'owner depth pass 2026-09-24, DEPTH=3 conf=3', source: 'governance/Copy of ANCHOR4_DEPTH_BLIND_SHEET_20260923.csv'}
  # OWNER-RULED. 'emerging' is the domain menu's ABSTENTION slot ("none of the 43 fits") and cannot be the
  # answer for a row whose owner depth is 'domain' (class 3 requires >=1 real domain). Every non-empty
  # coder cell leads with the same label (claude/kimi/deepseek: arts & culture first; deepseek adds a 3rd).
  R040: {column: domains_final, value: 'arts & culture', raw: 'arts & culture', primary: 'arts & culture',
         status: OWNER-RULED, basis: 'coders 3/3 lead arts & culture; resolves the abstention-vs-class-3 contradiction',
         source: 'governance/anchor_adjudication_workbook_20260924.csv#coder columns'}
  # R140 is NOT cell-edited: its axes are declared NOT APPLICABLE in config/depth_domain_contract.yaml
  # (abstention.axis_exempt_rows) because its CT is a non-claim class. An exemption is a declaration; a
  # rewritten cell would be an edit of the owner's answer. Recorded for the reader:
  R140: {column: both, value: null, status: DECLARED-NOT-APPLICABLE,
         basis: "CT='noise drop' (blind sheet 2026-09-24); neither axis applies; parity, never owed",
         source: 'config/depth_domain_contract.yaml#abstention.axis_exempt_rows'}
