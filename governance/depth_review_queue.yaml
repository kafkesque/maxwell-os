- id: 08c9214e07c0a82095a9c69859e229117e41fc0ae68ec57eed0462cda6e57d8d
  input_fb:
    name: Strategic Surprise
    definition: Strategic surprise occurs when the existence or nature of a strategy
      is unrecognized or underestimated, even in situations where a clear strategy
      is present. This phenomenon reveals that strategic thinking is often invisible
      to observers who expect only chaos or random action.
    mechanism: Strategic surprise emerges because observers focus on surface-level
      events or preconceptions about how conflicts unfold. They fail to recognize
      that actors in complex situations—whether military, political, or social—develop
      focused approaches to achieve specific objectives. The strategy exists but is
      not immediately apparent to those who do not look for it or expect it.
    boundary: Applies when actors in a conflict or situation have a coherent plan
      but it is not recognized by external observers or participants who are not looking
      for strategic intent. Fails when the situation is truly chaotic or lacks any
      organizational structure or goal-directed behavior.
