  - engineering practice
  expected_depth: cross-domain
  expected_evidence: axiomatic
  test_property: 'baseline: data science, cross-domain, axiomatic'
  expected_discipline: research methodology
- id: L07_baseline_graphic_design
  description: Clear graphic design FB
  fb_name: Visual Hierarchy Through Scale and Contrast
  fb_definition: Viewers scan pages in an F-pattern, fixating first on the largest, highest-contrast elements. Establishing
    a clear visual hierarchy — where element size, weight, and color saturation correspond to information importance — guides
    attention predictably and reduces cognitive load.
  expected_output:
    application: 'Design landing pages with 3 hierarchical levels: hero headline (largest, boldest), subheadline (medium),
      body text (smallest). Use contrast ratios of at least 3:1 between hierarchy levels. Test with the squint test — squint
      at the page and verify the most important element still dominates.'
    failure_mode: Everything screams for attention when everything is bold, large, and high-contrast. The page becomes visual
      noise — users can't find the primary action and bounce.
    elaboration: Visual hierarchy isn't about making things 'look good' — it's about information architecture rendered visually.
      The eye should land on the most important element within 200ms. If it doesn't, the design has failed regardless of aesthetic
      quality.
    keywords: visual hierarchy, F-pattern, contrast ratio, squint test, typographic scale, visual weight
    jargon: 'Visual hierarchy: The arrangement of design elements to show their order of importance. F-pattern: The typical
      eye-tracking path where users scan horizontally across the top, then down the left side.'
  expected_domains:
  - graphic design
  - user experience
  expected_depth: domain
  expected_evidence: cited
  test_property: 'baseline: graphic design, domain-specific'
  expected_discipline: visual perception
- id: L08_baseline_engineering_practice
  description: Clear engineering methodology FB
  fb_name: Test-Driven Development Cycle
  fb_definition: Write a failing test first, then implement the minimum code to pass it, then refactor while keeping tests
    green. This red-green-refactor cycle ensures every line of production code has a corresponding test, catches regressions
    immediately, and enforces modular design by making untestable code obvious.
  expected_output:
    application: 'For each new feature: 1) Write the test describing desired behavior (RED), 2) Write minimal code to pass
      (GREEN), 3) Refactor for clarity/performance while tests stay green (REFACTOR). Commit after each cycle.'
    failure_mode: Teams write tests after implementation. Post-hoc tests only verify that code does what it already does —
      they don't drive design and miss the edge cases that TDD's test-first approach naturally surfaces.
    elaboration: TDD isn't about testing — it's about design. When you write the test first, you're forced to define the interface
      before the implementation. This constraint produces modular, testable code because untestable designs are painful to
      write tests for. The test is the first client of your API.
    keywords: red-green-refactor, unit test, regression, test coverage, mock, stub, test-driven development
    jargon: 'Red-green-refactor: The TDD cycle — write failing test (red), implement code to pass (green), improve code without
      changing behavior (refactor). Regression: A bug reintroduced after a change that breaks previously working functionality.'
  expected_domains:
  - code & computation
  - engineering practice
  expected_depth: domain
  expected_evidence: cited
  test_property: 'baseline: engineering practice, methodology'
  expected_discipline: software engineering
  accept_any_of_evidence:
