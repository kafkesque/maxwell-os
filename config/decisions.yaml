  source: governance/ROUNDTABLE_CROSSEXAM_20260919.md
  verification: 'measured: status disagrees with verification_results[factual].passed on 2,447 rows (30.6%); an honest gate moves PASS 4,745 -> 3,310 (BUG-299)'
  description: 'Stage 5 sets status from fact_passed, but scripts/apply_phase1_finalize.py:18 sets status = PASS if content_type == principle else QUARANTINE and writes it at :163, and two further hand-run scripts (apply_phase1_adjudication.py, repass_pair_agreed.py) move rows across the gate on label grounds. The live DB matches the label rule with 100% fidelity: 4,745/4,745 PASS rows are content_type=principle, 0/1,470 non-principle rows are PASS. Result: 1,941 PASS rows have factual.passed=False (138 NLI CONTRA-majority, 1,514 NEUTRAL, 278 with all evidence flagged non-evidence fragments, 9 mechanism FAIL, 2 BUG-181 conversion artifacts) and 506 QUARANTINE rows are NLI ENTAIL-majority. THE AXIS THAT DECIDES WHAT IS RETRIEVABLE IS THE AXIS WITH LIFT -0.010 OVER A CONSTANT ANSWER. Ruling: status is derived from verification_results plus a typed s5_reason; one writer only; a label-derived status write is a hard error; CI invariant: status=PASS implies factual.passed AND reason NOT IN (CONTRA, MECH_FAIL, EVIDENCE_CONTAMINATED, NO_EVIDENCE, VACUOUS). This DE-SERVES 1,941 rows; it deletes nothing (R-D410). Human gate G17. Supersedes the framing of D272d and inverts D272g.'
  files:
  - scripts/apply_phase1_finalize.py
  - scripts/apply_phase1_adjudication.py
  - scripts/repass_pair_agreed.py
  - pipeline/stage5_verify.py
  - pipeline/stage6_commit.py

- id: D274b
  category: RETRIEVAL / ONTOLOGY
  state: OPEN
  date: '2026-09-19'
  title: ROLE is the highest-leverage axis, not a decorative one (D-274b)
  source: governance/ROUNDTABLE_CROSSEXAM_20260919.md
  verification: 'measured: 4,745/4,745 PASS rows are content_type=principle (BUG-299); ruler content_type accuracy 0.740 against a 0.750 constant-answer baseline'
  description: 'BUG-280 / D6 stated that content_type influences nothing and called it decorative. That is inverted: content_type IS the serving gate, because a hand-run script defined status from it. Consequences: (1) ROLE error is not cosmetic, it is the KB exposure rate; (2) on the blind ruler content_type agrees with a human 0.740 of the time against a constant-answer baseline of 0.750, so roughly a quarter of served rows are not principles by a human reading; (3) the ruler cross-tab is asymmetric - 13 stored-principle rows are not principles by the human (false positives IN the serving set) and 29 human-principle rows carry a non-principle stored label (true principles HIDDEN). Fix order: make the gate verification-derived (D274a) BEFORE repairing ROLE, so that ROLE repair is measured on an honest serving set. D6 and BUG-280 must be restated, not deleted.'
