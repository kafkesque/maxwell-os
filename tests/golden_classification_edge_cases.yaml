  # ═══════════════════════════════════════════════════════════════════════
  # GROUP I: Cross-Domain Semantic Ambiguity
  # ═══════════════════════════════════════════════════════════════════════
  - id: I01_homonym_domain_names
    description: "FB uses terms that mean different things in different domains"
