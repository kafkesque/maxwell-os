- id: D-320
  category: GOVERNANCE
  state: RESOLVED
  date: 2026-09-21
  title: '**Owner rulings 2026-09-21 (four): normalization_map pruned; PART 2 boundary items 24/26 REJECTED; `behavioral'
  decision: >-
    **Owner rulings 2026-09-21 (four): normalization_map pruned; PART 2 boundary items 24/26 REJECTED; `behavioral 
    economics` re-read from the taxonomy; laya + repair-queue recommendations recorded.** (1) The owner pruned the 
    dead `human-computer interaction: human computer interaction` entry from `config/normalization_map.yaml` -> 
    **BUG-355(b) CLOSED**, and the prune is **inert by measurement**: `scripts/anchor2_kappa.py` re-run produces a 
    byte-identical `governance/anchor2_kappa_20260921.json` (domain 0.4385, macro_kappa_active 0.4906, jaccard 
    0.4426, active_domains 39 unchanged), so no published number moves; BUG-355(a) (flat index / `kind=None` order 
    dependence) stays OPEN. (2) Owner **rejected** boundary items 24 and 26 because the `behavioral economics` 
    terminology was mis-stated; the re-read (from the taxonomy text, not memory) gives BE three load-bearing 
    requirements — **R1 object** (an economic decision: price, purchase, demand, incentive, market), **R2 
    mechanism** (psychological cause: heuristic, framing, affect, social norms), **R3 stance** (descriptive, never 
    prescriptive) — with `excludes` = economics, psychology, cognitive science, design psychology, decision 
    making. Items 24 and 26 dropped R1 and mis-read `incentive/price/uncertainty` as BE when that is `economics`, 
    which BE excludes. Corrected definition-anchored tests **24'/26'** are drafted in 
    `governance/BOUNDARY_DISCRIMINATORS_20260921.md` **Part D** (the rejected text stays visible: R-D410). (3) The 
    re-read exposed a real **ontology defect, BUG-357**: BE's written definition is **narrower than its 
    operational denotation** — row 60 (*Same-age Peer Modeling*, no economic object) is labelled BE while the 
    definition string licenses `psychology`, which is what the pipeline answered. A classifier whose only BE 
    evidence is the definition string must reproduce that error, so **no boundary rule can fix it**. Owner gate: 
    (i) widen the `definition:` string to name the mechanism class + behaviour-change object (**recommended**) or 
    (ii) keep it and re-label row 60. No slot moves either way (denotation, never spelling). (4) **laya-mlx**: 
    recommendation recorded — approve a narrow **benchmark-only feasibility arm** (isolated `.venv_laya`, revision 
    + checkpoint licence pinned in config, zero production imports, measuring the one untested question: 61-way 
    `criteria` degradation), but hold the full D-300 A/B until a **second coder** exists on the ruler, because a 
    >=5 pp win measured against single-coder attested labels (F-11/D-317) cannot license adoption; 
    `arm_typed_head` stays a stub meanwhile. (5) **repair_queue**: recommendation recorded — **do not create** 
    `governance/REPAIR_QUEUE.md`; declare the write-path + `fb_id` de-dup key + owner instead (BUG-358), since the 
    queue's only writer (the abstention rule) does not exist, so a file created today could never receive a row 
    (an Emission-class artifact) and an empty queue would assert "no repairs pending". **Not applied:** nothing 
    wired into any prompt, no menu slot added, no canonical renamed, taxonomy bytes unchanged.

