version: 1
# VERIFIED REFERENCE LIBRARY — the evidence base behind the ontology/retrieval programme.
#
# WHY THIS FILE EXISTS: the forensic reports cite ~35 works inline, which a frontier LLM (or an auditor)
# cannot resolve or check without chasing prose. This is the single source of truth for the bibliography:
# every entry carries an identifier that resolves, and `scripts/build_reference_library.py` FETCHES the
# metadata from OpenAlex by DOI rather than letting anyone type it (so a wrong year, venue or DOI cannot
# survive a rebuild).
#
# C12: the list lives here; the script only renders. C16: a DOI that fails to resolve is reported, never
# silently dropped.
#
# Fields:
#   id      short handle used in the reports
#   doi     the resolving identifier ('' when the work is a W3C/ISO standard with a URL instead)
#   url     used only for standards that have no DOI
#   role     why Maxwell OS cares
#   bears    the specific finding/repair it supports (traceable back to the forensic reports)
#   used_in  where it is cited
#
# Rebuild:  python3 scripts/build_reference_library.py            (fetch + verify, needs network)
#           python3 scripts/build_reference_library.py --cached   (re-render from the cache, offline)

references:

