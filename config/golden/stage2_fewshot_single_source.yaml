# ── POSITIVE: principle (normative_heuristic — NOT causal) ─────────────────
# SS-POS-001 shows principle=causal, SS-POS-010 shows principle=descriptive.
# This shows the THIRD form: a prescriptive rule of thumb. The 50-sample live
# smoke mislabeled normative rules (precautionary principle, market-growth
# strategy) as causal_mechanism because the golden had NO principle+normative
# example — the model defaulted "rule of thumb" to causal.
- id: SS-POS-013
  domain: risk-management
  source_books:
  - Antifragile — Nassim Nicholas Taleb
  cluster_segments:
  - source_book: Antifragile — Nassim Nicholas Taleb
    text: "Where the results of a new technology are still unknown, or where there is a lack of scientific knowledge or consensus regarding its safety, the precautionary principle says it is smarter not to use it until its safety is established."
  is_convergent: false
  should_extract: true
  expected_fb:
    is_summary: false
    route: FB
    name: Precautionary Principle
    definition: "A prescriptive rule: when a new technology's effects are unknown or lack scientific consensus on safety, avoid using it until safety is established."
    mechanism: "The rule routes decision-making under uncertainty toward inaction: because the downside risk is unquantified and potentially irreversible, the burden of proof shifts to the proponent to demonstrate safety before adoption."
    boundary: "Applies to novel technologies with unknown or contested safety. Fails when the risk is well-characterized and reversible, where the precautionary stance would block beneficial low-risk adoption."
    consequence: "Following the rule avoids irreversible harm from technologies whose risks only become apparent after widespread adoption."
    elaboration: "The principle is a decision heuristic, not a causal law: it does not claim uncertainty causes harm, but prescribes caution because the harm is unquantified. It is contested precisely because its application is a value trade-off — it protects against irreversible downside at the cost of slowing beneficial innovation, so its force depends on how risk-averse the decision context is."
    extraction_type: normative_heuristic
    content_type: principle
    evidence_passages:
    - "The precautionary principle says it is smarter not to use it until its safety is established."
  rationale: "A prescriptive rule of thumb ('when uncertain, don't adopt'), NOT a cause→effect chain. content_type=principle with extraction_type=normative_heuristic — a principle can be a normative heuristic, not always causal_mechanism."
  tier: CORE

