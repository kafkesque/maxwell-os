# HARD NEGATIVE: Platitude Masquerading as Principle
# ──────────────────────────────────────────────────────────────────────────
- id: NEG-CONV-002
  domain: business
  source_books:
    - "Good to Great — Jim Collins"
    - "Built to Last — Jim Collins"
  cluster_segments:
    - source_book: "Good to Great — Jim Collins"
      text: |
        Great companies have great people. The right people are the most important asset of any
        organization. Getting the right people on the bus and in the right seats is the first
        step to building a great company.
    - source_book: "Built to Last — Jim Collins"
      text: |
        Visionary companies prioritize people development. They invest heavily in training and
        create cultures where talented people can thrive and grow. The commitment to people
        is what separates the truly great companies from the merely good ones.
  is_convergent: true
  should_extract: false
  expected_fb:
    is_summary: false
    route: "NULL"
    name: ""
    definition: ""
    mechanism: ""
    boundary: ""
    consequence: ""
    evidence_passages: []
  rationale: |
    HARD NEGATIVE: Both segments say "good people are important" in different words. This is
    a platitude, not a principle. There is no mechanism (HOW do great people cause great
    outcomes?), no boundary (when does great talent NOT help?), no testable consequence. All
    segments agree, but they agree on a truism. Stage 2 should detect the absence of causal
    mechanism and reject this cluster. Even though there are 2 sources, having multiple sources
    echoing the same platitude does not create a convergent principle.
    
    NOTE: Collins' "First Who, Then What" IS a defended principle with a mechanism in Good to
    Great (Chapter 3: rigorous people decisions → right people self-motivate → no need for
    heavy management). However, the EXCERPTS selected for this cluster deliberately omit that
    mechanism. This teaches the LLM to evaluate the cluster it RECEIVES — not the books it
    recognizes — and reject when the provided segments lack causal depth, even if the source
    material contains it elsewhere.

# ═══════════════════════════════════════════════════════════════════════════
# CONVERGENT EXAMPLE 6: 1:N Extraction — Two Distinct Principles from One Cluster
# ──────────────────────────────────────────────────────────────────────────
- id: CONV-006
  domain: economics
  source_books:
    - "Algorithms to Live By — Brian Christian & Tom Griffiths"
    - "Thinking, Fast and Slow — Daniel Kahneman"
    - "Misbehaving — Richard Thaler"
  cluster_segments:
    - source_book: "Algorithms to Live By — Brian Christian & Tom Griffiths"
      text: |
        The multi-armed bandit problem captures the fundamental tension between exploration and
        exploitation. You face a row of slot machines, each with an unknown payout rate. You
        must decide: pull the arm you know is decent (exploit), or try a new arm that might be
        better (explore)? The mathematically optimal strategy — the Gittins index — assigns a
        dynamic value to each option based on both its estimated return and the uncertainty
        around that estimate. Options with high uncertainty get exploration bonuses.
    - source_book: "Thinking, Fast and Slow — Daniel Kahneman"
      text: |
        Loss aversion refers to the asymmetry between the psychological weight of gains and losses:
        losses hurt roughly twice as much as equivalent gains feel good. This is not a cognitive
        error but a deeply wired feature of human decision-making, observable across cultures and
        even in other primates. In negotiation, the endowment effect — valuing what you already
        have more than what you could acquire — is a direct consequence of loss aversion.
    - source_book: "Misbehaving — Richard Thaler"
      text: |
        The endowment effect is one of the most robust findings in behavioral economics. In a
        classic experiment, students given a coffee mug demanded roughly twice as much to sell
        it as students without mugs were willing to pay. This violates standard microeconomic
        theory, which predicts willingness-to-pay and willingness-to-accept should be nearly
        identical for small stakes. The effect is driven by loss aversion: giving up the mug
        feels like a loss, while buying it feels like a gain, and losses loom larger.
  is_convergent: true
  should_extract: true
  expected_fb:
    - is_summary: false
      route: "FB"
      name: "Explore-Exploit Exploration Bonus"
      definition: |
        In sequential decision problems with uncertain options, the optimal strategy assigns an
        "exploration bonus" to uncertain options — their value includes not just estimated mean
        return but also a premium proportional to information gain. This causes decision-makers
        to sample apparently suboptimal options because the knowledge acquired has intrinsic worth.
      mechanism: |
        The exploration bonus works because uncertainty represents option value above expected
        return. The Gittins index formalizes this: each arm's value = estimated mean + uncertainty
        premium. As an arm is pulled more, uncertainty decreases, the bonus shrinks, and the index
        converges to the true mean. Early exploration of high-uncertainty options minimizes
        cumulative regret by avoiding indefinite commitment to a potentially suboptimal choice.
      boundary: |
        Applies when outcomes are stochastic with unknown distributions and repeated trials are
        possible. Fails when: (1) trials are severely limited (near-zero horizon) — the optimal
        strategy is to maximize expected immediate return; (2) the cost of a bad outcome is
        ruinous — uncertainty bonuses don't account for catastrophic risk; (3) arms are
        non-stationary — changing payout distributions break the Gittins assumption.
      consequence: |
        Systems using exploration bonuses systematically outperform pure-exploitation strategies
        in domains from clinical trials (adaptive allocation) to A/B testing (bandit algorithms).
        The cost of initial exploration is repaid many times over by avoiding indefinite
        commitment to a suboptimal option discovered too late.
      evidence_passages:
        - "Options with high uncertainty get exploration bonuses"
        - "you must decide: pull the arm you know is decent (exploit), or try a new arm"
    - is_summary: false
      route: "FB"
      name: "Loss-Aversion Endowment Gap"
      definition: |
        Ownership creates a psychological valuation asymmetry: owners demand roughly 2x more to
        give up an item than non-owners would pay to acquire it. This "endowment effect" is driven
        by loss aversion — giving up the item is coded as a loss (weighted ~2x), while acquiring
        it is coded as a gain (weighted ~1x). The gap is not irrational valuation but asymmetric
        reference-point weighting.
      mechanism: |
        The endowment gap arises because transactions are evaluated relative to a reference point
        set by current ownership. Selling = losing the item (a loss); buying = gaining the item
        (a gain). Since losses are approximately twice as psychologically impactful as gains, the
        minimum acceptable selling price is ~2x the maximum buying price. This is consistent with
        prospect theory's value function, which is steeper in the loss domain than the gain domain.
      boundary: |
        Applies when the item is held for personal use and the owner has formed subjective
        attachment. Fails when: (1) the holder is a professional trader — experience resets the
        reference point to market value; (2) the item is purely fungible (cash, tokens) — no
        attachment forms; (3) the transaction is framed as an exchange rather than a sale — trading
        mugs for pens eliminates the loss frame and the effect disappears.
      consequence: |
        The endowment effect creates systematic market friction: goods are held by owners who value
        them less than potential buyers, but transactions fail because the ask-bid spread exceeds
        the true value gap. This explains housing lock-in, low trading volume in collectibles
        markets, and the difficulty of negotiated buyouts where the seller's reference point is
        anchored to past acquisition cost rather than current market value.
      evidence_passages:
        - "students given a coffee mug demanded roughly twice as much to sell it as students without mugs were willing to pay"
        - "Losses hurt roughly twice as much as equivalent gains feel good"
        - "the endowment effect — valuing what you already have more than what you could acquire"
  rationale: |
    1:N extraction example. This cluster contains TWO distinct convergent principles: (1)
    Explore-Exploit Exploration Bonus, synthesized from the Christian/Griffiths segment on
    the multi-armed bandit and Gittins index; (2) Loss-Aversion Endowment Gap, synthesized
    from the Kahneman and Thaler segments on loss aversion and the endowment effect. The LLM
    returns a JSON array of 2 principle objects. This example teaches that clusters may
    contain multiple separate mechanisms; the LLM should enumerate all distinct convergent
    principles rather than forcing them into a single synthesis. This is essential training
    for the split-probe gate (discover_principles) which asks "how many distinct principles?"

