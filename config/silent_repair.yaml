# config/silent_repair.yaml - the D-2646/C16 register for `errors=` reads (BUG-518/BUG-519 class).
#
# MEASURED 2026-09-26 by scripts/check_silent_repair.py over scan_roots: 31 silent-repair sites that this register
# DECLARES - 11 where repair is correct (a runtime log or a foreign stream, not an artifact) and 20 that still owe
# a repoint to the one decode home. Both numbers are a MEASUREMENT; `ceiling.debt` is SHRINK-ONLY (D-2642), and an
# entry with no measured site is reported STALE rather than left to rot (BUG-424 class).
schema_version: '1.0'
decided: D-2809
home: scripts/lib/artifact_encoding.py          # the ONE place a byte-level repair is allowed to be replaced by a declaration
rail: scripts/check_silent_repair.py
scan_roots: [scripts, pipeline, tools]          # tools/ was OUTSIDE the first census and is audited by this rail now
# 2026-09-26: scripts/vote_anchor_domains.py:120 (a repair mode on .env) was REPAIRED rather than declared - the
# operator-key rule now has one home, scripts/lib/operator_env.py, which reads .env through the decode home.
# 2026-09-26S (BUG-542): an entry keys its site by CONTENT (`match:`) or, legacy, by `lines:`. A line-keyed
# entry that goes STALE is not maintenance noise - it is this class: the SITE moved and the declaration did not,
# and while it lasted `just health` aborted above the rails below it (BUG-457).
# 2026-09-26 (BUG-521/522): scripts/audit_flag_consumers.py:72,89 and scripts/definition_nli_verify.py:207 were
# REPAIRED, not declared - the first reads through the decode home, the second named ONE rule for its input
# (its silent repair could never fire: the module already opened the same file strictly).
ceiling:
  debt: 13          # LOWERED 14 -> 13 on 2026-10-16 by D-3050/BUG-866 (the bridge's read-back was DELEGATED to
                    # scripts/lib/artifact_encoding.py, so its entry is gone) and 17 -> 14 on 2026-10-14 in the same act as the code (D-2642: SHRINK-ONLY). MEASURED
                    # after the change: 25 sites found, 25 declared, 0 undeclared, 0 stale, 14 of them `debt`-kind.
                    # The DRIFT that reddened this rail (`scripts/verify_anchor_family_registry.py:66`) is now
                    # DELEGATED to scripts/lib/artifact_encoding.py, and three entries whose debt had already been
                    # PAID in code (check_config_defaults.py [114,140] - strict decode since D-2982 - and
                    # verify_anchor_family_registry.py [61] - the CSV path) are deleted instead of STALE forever.
  direction: shrink_only

allowed:
  # 2026-10-28 (BUG-1097's sitting; `just health` was RED for these two). Both were UNDECLARED, not paid: the bytes
  # they decode come from a FOREIGN PRODUCER (an HTTP error body, and the engine's own runtime log), never from an
  # artifact whose encoding is a declared fact - so `allowed` is the CORRECT classification and the `debt` ceiling is
  # NOT the number they belong to. Keyed by CONTENT, never by line (BUG-542): the second entry moved 105 -> 106 the
  # same afternoon an import was added above it, which is precisely how a line-keyed entry goes stale and aborts the
  # ladder.
  - path: scripts/kv_working_set.py
    match: exc.read().decode(errors="replace")
    mode: replace
    why: the engine's HTTP error BODY is decoded to decide whether the reply says "not loaded" - a foreign stream
         shown for diagnosis, never parsed into a stored object or written back.
  - path: scripts/measure_subagent_loop.py
    match: path.open("r", encoding="utf-8", errors="replace")
    mode: replace
    why: the ENGINE LOG is a runtime log, not an artifact. It is read from a byte offset to attribute one turn's
         rows; a repaired byte becomes U+FFFD in a log line that is displayed and counted, never stored as truth.
  # repair is CORRECT here: these bytes come from a RUNTIME LOG or a FOREIGN producer, never from an artifact whose
  # encoding is a declared fact. Nothing is written back, so no text is laundered into a stored object (C16 clean).
  - path: scripts/_omlx_restart.py
    lines: [33]
    mode: replace
    why: the watchdog socket's reply is decoded for a one-line DISPLAY echo; it is never parsed or stored.
  - path: scripts/check_repo_integrity.py
    # BUG-542 (MEASURED 2026-09-26S): this entry was `lines: [280]` and became FALSE when rail 0 grew for BUG-547 -
    # the site moved to 306, so ONE site was reported twice (STALE 280 + DRIFT 306) and the FATAL DRIFT aborted
    # `just health`, hiding every rail below it. Keyed by CONTENT now: the substring ties the entry to the
    # repairing CALL, not to a coordinate.
    match: 'reflog.read_text(errors'
    mode: replace
    why: git reflog output - a foreign stream produced by git, not an artifact this repo declares.
  - path: scripts/pipe_stage_probe.py
    lines: [71, 190, 215]
    mode: replace
    why: a probe that PRINTS a head of the run's own markdown and reads the run's own checkpoint jsonl.
  - path: scripts/s4_post_finish.py
    lines: [64]
    mode: replace
    why: the S4 run log - the logger's own output, tailed for display.
  - path: scripts/s4_status.py
    lines: [77, 90]
    mode: replace
    why: the S4 run log, tailed for display.
  - path: scripts/s4_watch.py
    lines: [64, 80]
    mode: replace
    why: the S4 run log, tailed for display.
  - path: scripts/seed_gated_ids.py
    lines: [75]
    mode: replace
    why: the S4 run log, mined for ids; a repaired byte cannot create or change an id.
  # ── BUG-962 (MEASURED 2026-10-21): 13 of the 35 undeclared sites are FOREIGN streams / runtime logs /
  #    arbitrary external inputs - bytes with NO declaration home (a repo artifact is not their source). Repair
  #    is CORRECT here: nothing read is written back into a census or verdict, so no text is laundered (C16).
  - path: pipeline/acquisition/net.py
    match: 'response.read(4_000_000).decode(charset, errors="replace")'
    mode: replace
    why: an HTTP response body - a foreign stream; the charset is the header's, not a repo-declared fact.
  - path: pipeline/acquisition/net.py
    match: 'error.read(240).decode("utf-8", errors="replace")'
    mode: replace
    why: an HTTP error snippet, decoded for a display message; never stored.
  - path: pipeline/hf_fetch_model.py
    match: 'self.path.read_text(errors="ignore"'
    mode: ignore
    why: a lock-file payload written by another process; read only to name the holder.
  - path: pipeline/research_run.py
    match: 'for raw in report.read_text(errors="replace"'
    mode: replace
    why: the run's own report log, mined for the terminal marker - a runtime log.
  - path: pipeline/research_run.py
    match: 'lines = [l for l in report.read_text(errors="replace"'
    mode: replace
    why: the run's own report log, mined for heartbeat lines - a runtime log.
  - path: pipeline/research_run.py
    match: 'bool(path.read_text(errors="replace"'
    mode: replace
    why: a prompt file, checked for non-emptiness only; nothing is parsed or stored.
  - path: pipeline/stage0_convert.py
    match: 'raw.decode("utf-8", errors="replace")'
    mode: replace
    why: S0 conversion input - a foreign container whose encoding is arbitrary; the repair IS the normalization to UTF-8.
  - path: pipeline/stage0_convert.py
    match: 'done.stderr.decode("utf-8", errors="replace")'
    mode: replace
    why: a textutil error tail, decoded for the failure message; never stored.
  - path: pipeline/stage0_convert.py
    match: 'done.stdout.decode("utf-8", errors="replace")'
    mode: replace
    why: textutil stdout - a foreign producer; the converter's normalization of arbitrary bytes.
  - path: pipeline/research/ws_harness_survey.py
    match: 'cand[0].read_text(errors="replace"'
    mode: replace
    why: an installed OMLX app bundle's integration code - a foreign producer outside the repo.
  - path: scripts/model_integrity_gate.py
    match: 'p.read_text(encoding="utf-8", errors="replace")'
    mode: replace
    why: a chat-template path from the CLI - an arbitrary input scanned for a denylist, not a repo-declared artifact.
  - path: pipeline/subagent_fanout.py
    match: 'citation_defects(a.read_text(errors="replace"'
    mode: replace
    why: an answer path from the CLI (args.answer) - an arbitrary input scanned for citations, not a repo-declared artifact.
  - path: pipeline/subagent_fanout.py
    match: 'shape_defects(a.read_text(errors="replace"'
    mode: replace
    why: an answer path from the CLI (args.answer) - an arbitrary input scanned for shape, not a repo-declared artifact.
  - path: scripts/normalise_corpus_names.py
    match: 'child.read_text(errors="ignore"'
    mode: ignore
    why: a derived run receipt (checkpoint/parquet), mined ONLY for a normalized book-name stem; a repaired byte cannot
      create a normalized stem, nothing is written back, and the receipt is re-derivable - a runtime log, not a source.

debt:
  # ARTIFACT/SOURCE reads that still repair silently. MEASURED 2026-09-26: every one is INERT today (the 3
  # non-UTF-8 artifacts in this repo are all declared, and no source file is non-UTF-8), so nothing is mis-read
  # right now. It is declared debt because a repair that never fired cannot be trusted to have been tested.
  - path: scripts/audit_final_chain.py
    match: 'read_text(encoding="utf-8", errors="replace")'
    mode: replace
    why: reads run jsonl; a repaired byte becomes U+FFFD INSIDE a parsed row. Repoint to scripts/lib/artifact_encoding.py.
  # REMOVED 2026-10-14 (the debt was PAID in code and never shrunk here): scripts/check_config_defaults.py carried
  # `errors="replace"` at lines 114/140 until D-2982 replaced it with a STRICT decode (the comment at :306 is the
  # only trace left). A register that keeps a paid entry reports STALE forever and hides the next real one.
  # PAID 2026-10-28 IN CODE and the entry DELETED, not left to rot as STALE (the lesson at :151 above): this site
  # read SOURCE text - which is UTF-8 by contract, the interpreter and ruff both require it - through
  # `errors="replace"`, in the very rail that decides whether silent repairs are allowed. It now reads strictly and
  # a non-UTF-8 byte is a NAMED refusal naming the file and the byte offset, which is exactly the rule its own
  # sibling load_artifact() already stated below the offending site. Debt 14 -> 13 = back at its shrink-only
  # ceiling with zero headroom; nothing was raised.
  - path: scripts/check_revoked_references.py
    lines: [100, 134]
    mode: replace
    why: the anti-resurrection rail reads source text; its verdict must never rest on repaired bytes.
  - path: scripts/f11_anchor_review.py
    lines: [81]
    mode: replace
    why: reads the coders' label files (a Kimi return arrived as .md) - the artifact class where Mac Roman is real here.
  # REMOVED 2026-10-14 (the debt was PAID in code and never shrunk here): the CSV path of
  # scripts/verify_anchor_family_registry.py was already delegated to scripts/lib/artifact_encoding.py, and the
  # JSONL path (read_jsonl) is delegated in the SAME act - so the entry has nothing left to declare.
  # REMOVED 2026-10-16 (D-3050/BUG-866): this entry was `lines: [160]` - a COORDINATE that went stale the moment
  # the bridge was rewritten, and a coordinate is not a fact about the code (BUG-542's class). The DEBT BEHIND IT
  # WAS PAID IN CODE in the same act: pipeline/batch_convert_epubs.py::read_back() now delegates its read-back to
  # scripts/lib/artifact_encoding.py, so there is no silent repair left to declare. An entry with no measured site
  # is STALE rather than tolerated (BUG-424 class), and the ceiling below is LOWERED with it (SHRINK-ONLY).
  - path: pipeline/enhance_md_headers.py
    # BUG-542: was `lines: [182, 248]`, a COORDINATE that went stale when the header pass grew a line above each
    # site (182->183, 248->249) - ONE site reported twice (STALE + FATAL DRIFT). Keyed by CONTENT now.
    match: 'md_path.read_text(errors'
    mode: replace
    why: the header pass writes the text it repaired; repoint to scripts/lib/artifact_encoding.py.
  - path: pipeline/fix_remaining.py
    lines: [235, 263]
    mode: replace
    why: pipeline/** is will_not_touch this session (rail 4); the fix pass writes the text it repaired.
  - path: tools/watch_s2.py
    lines: [89]
    mode: replace
    why: tools/ was outside the first census - declared from measurement so the debt is visible, not forgotten.
  - path: tools/model_eval_suite.py
    # BUG-542: was `lines: [918]`, a COORDINATE that went stale when the file grew (site moved 918 -> 1039) -
    # ONE site reported twice (STALE 918 + DRIFT 1039). Keyed by CONTENT now (D-2658).
    match: 'CKPT.read_text(encoding="utf-8", errors="replace")'
    mode: replace
    why: reads a checkpoint jsonl for the golden keys; tools/ was outside the first census.
  - path: tools/voting_report.py
    lines: [65]
    mode: replace
    why: tools/ was outside the first census - declared from measurement so the debt is visible, not forgotten.
  - path: tools/model_eval_report.py
    lines: [57]
    mode: replace
    why: tools/ was outside the first census - declared from measurement so the debt is visible, not forgotten.
