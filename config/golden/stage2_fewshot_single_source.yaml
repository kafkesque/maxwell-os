    mechanism: "The read_index call deserializes a previously saved index file back into memory, restoring the indexed vectors and their search structure."
    boundary: "Applies when an index was previously written to disk in a FAISS-compatible format. Fails when the file path is absent or the file is not a valid index."
    consequence: "Persisting and reloading an index avoids recomputing it from scratch on every session."
