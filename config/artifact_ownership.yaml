      census of those values now lives in config/decisions_summary.json. Records-only removed a second failure
      mode at the same time: a record appended after a LATER top-level key (the BUG-505 shape) cannot happen
      when the records list is last. BUG-483: 62 of 766 records carried their state under a legacy status: key
