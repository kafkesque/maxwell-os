      teams building a compiler, you'll get a four-pass compiler. The architecture of software reflects the social structure
      that produced it. This means you cannot design a system's architecture independently of how the team communicates.
  - source_book: Clean Architecture — Robert C. Martin
    text: Good architecture maximizes the number of decisions you can defer. The longer you can keep options open, the more
      information you have when you finally commit. This is why dependency inversion matters — it decouples high-level policy
      from low-level detail, allowing you to defer implementation choices until the last responsible moment. Premature commitment
      to technical details is the primary cause of architectural rigidity.
  is_convergent: true
  should_extract: true
  expected_fb:
    is_summary: false
    route: FB
    name: Communication Overhead Limits Scale
    definition: Adding personnel to complex engineering projects creates coordination costs that eventually exceed the productive
      contribution of each additional person. Communication paths grow quadratically with team size (n(n-1)/2), while productive
      output grows at best linearly. Beyond a threshold, each added person makes the project later, not earlier.
    mechanism: 'Coordination costs dominate because every new person must: (1) learn the existing system architecture (ramp-up
      time), (2) coordinate their work with every other team member to avoid conflicts, and (3) participate in team-wide communication
      (meetings, reviews, documentation). The quadratic communication growth means a team of 10 has 45 communication paths;
      a team of 20 has 190. At some point, the marginal person spends more time coordinating than producing. This is a property
      of any task with interdependent sub-components — it applies to software, construction, film production, and scientific
      collaboration.'
    boundary: 'Applies when: (1) tasks are interdependent (not parallelizable), (2) coordination requires human communication
      (not automated conflict resolution), (3) new members require ramp-up. Fails when: tasks are fully independent (embarrassingly
      parallel), coordination is automated (e.g., CI/CD pipeline resolves merge conflicts), or new members need zero ramp-up
      (identical copies of existing expertise).'
    consequence: Software projects should staff with the smallest feasible team, not the largest affordable one. Architectural
      decisions should maximize independence between components to reduce coordination costs. Conway's Law implies that to
      change a system's architecture, you must first change the team's communication structure.
    application: When staffing a complex engineering project → limit team size to the minimum needed, structure the system
      architecture to minimize inter-team dependencies, and enforce interface contracts between components to reduce coordination
      overhead.
