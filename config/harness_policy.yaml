schema_version: "1.0"
# WHERE A CODING HARNESS IS WORTH ITS PLACE IN MAXWELL OS - a layered verdict.
#
# A harness is a CLIENT of the engine (C21/C25): Claude Code, Codex, Pi, OpenClaw, Hermes, Copilot,
# OpenCode, DeepSeek Harness all speak to 127.0.0.1:11435. Its value is ERGONOMICS x MODEL
# CAPABILITY, and the second term is the binding one. This file is therefore downstream of the
# inventory (config/engine.yaml#harnesses) and the capability measurements
# (governance/model_eval_report.md, temperature 0.0, identical prompts).
#
# The rule that produces every verdict below: a harness must be introduced where a HUMAN is in the
# loop and the work is exploratory. Where the work is deterministic, unattended, or governed, a
# harness adds a conversation where a script belongs (C27: no future tax).

# ── 1. THE MEASURED CAPABILITY AXES (this is what actually limits a coding harness) ──
capability_axes:
  tool_calling:                  # the axis every agentic harness lives on
    best: {model: Qwen3-Coder-30B-A3B-Instruct-MLX-4bit, score: 0.7}
    never: {model: gpt-oss-20b-MXFP4-Q8, score: 0.0, why: "a 0.0 tool-caller must never drive a tool loop"}
  long_context_reasoning_16k:    # the axis a harness creates by design (it stuffs the window)
    best: {model: Qwen3.8-27B-MLX-4bit, score: 1.0}
    fails: [{model: Qwen3-Coder-30B-A3B-Instruct-MLX-4bit, score: 0.0},
            {model: gemma-4-E4B-it-MLX-4bit, score: 0.0}]
    consequence: "a harness pointed at the coder for long-context work is pointed at the model's measured worst axis"
  code_generation_humaneval:
    order: [{model: Qwen3.8-27B-MLX-4bit, score: 0.96},
            {model: Qwen3-Coder-30B-A3B-Instruct-MLX-4bit, score: 0.8},
            {model: Ornith-1.5-9B-MLX-8bit, score: 0.8},
            {model: Ornith-1.5-35B-A3B-REAP-19B, score: 0.56},
            {model: gemma-4-E4B-it-MLX-4bit, score: 0.16}]
  stability_self_agreement:
    best: {model: gemma-4-E4B-it-MLX-4bit, score: 0.7}
    note: "the best STABILITY is not the best QUALITY - the two axes disagree, so an agent loop that needs repeatability and one that needs correctness take different models"
  latency_agent_loop:            # T-131 (temp/prefill_bench_20261015.json)
    routable: [gemma-4-E4B-it-MLX-4bit]
    refused: [Qwen3-Coder-30B-A3B-Instruct-MLX-4bit, gpt-oss-20b-MXFP4-Q8]
    means: "only one served model currently fits an interactive per-turn budget; the rest are batch models"
  pool: "8 served, 46.88 GB resident, 55 GB guard, adaptive eviction observed mid-request (BUG-803). ONE pool: harnesses queue on it, they do not add to it."

# ── 2. THE LAYERED VERDICT ──
layers:
  L0_engine:
    is_for: "oMLX owns the model; a harness here is a test client"
    harness_verdict: NEVER_LOAD_BEARING
    file: config/engine.yaml
  L1_pipeline_S0_S6:
    is_for: "deterministic stages S0 convert -> S6 commit, each pinned to a model by script"
    harness_verdict: NOT_APPLICABLE
    why: "the pipeline must be reproducible and $0; a conversational client in a stage is a future tax (C27) and a drift surface (R7 temp 0.0)"
    file: config/pipeline_config.yaml
  L2_governance_rails:
    is_for: "decision/task/bug registers, gov_sync, the pre-commit rails, the human gate"
    harness_verdict: NOT_APPLICABLE
    why: "a harness may PROPOSE into temp/, never write a governed home: buglog/DECISION-LOG/config are protected (see L4 write rules)"
  L3_research_intake_curator:
    is_for: "fetch, screen, curate the owner's streams"
    harness_verdict: NOT_APPLICABLE
    why: "deterministic fetchers + evidence-requiring checks (config/curator_intake.yaml, config/intake_sources.yaml); a browse-by-conversation curator is unreproducible and unauditable"
    file: config/intake_sources.yaml
  L4_dev_tooling:
    is_for: "debugging, everyday coding, scaffolding, refactors, test design - the human explores"
    harness_verdict: WORTH_IT_WITH_CONSTRAINTS
    recommended: [claude, pi]
    model_routing:
      interactive_edit_loop_short_context: gemma-4-E4B-it-MLX-4bit    # the only agent_loop-routable model
      read_and_change_code_correctly: Qwen3.8-27B-MLX-4bit           # humaneval 0.96, lc_reason 1.0, reviewing 1.0
      tool_heavy_short_tasks: Qwen3-Coder-30B-A3B-Instruct-MLX-4bit  # toolcalling 0.7 - the best, and one-shot only
      repeatable_classification: gpt-oss-20b-MXFP4-Q8                # never for tools
    constraints:
      - "launch through the engine (omlx launch TOOL) so the wiring is the engine's, not a hand-written env (C12)"
      - "a harness writes PROPOSALS into temp/; the agent applies them through the rails. No harness holds write access to governance/, config/, DECISION-LOG.md, MASTER-TASK-REGISTER.md, buglog.md"
      - "never --permission-mode bypassPermissions on this repository: the rails exist because a fast writer can outrun a slow reader"
      - "one harness at a time on the pool unless the work is cheap: the pool is serial (BUG-803)"
      - "a harness's output is a claim, never a verification: R5 (generator != verifier) is not suspended for a nice UI"
  L5_human_gate:
    is_for: "the OWNER's approve/drop/final word"
    harness_verdict: FORBIDDEN
    why: "a proposal a harness makes about itself is not a gate (C15/owner-gate discipline: no_llm_canonical_promotion, D-2898)"
  L6_unattended_ops:
    is_for: "research runs, long fetches, batch measurement, repair scripts"
    harness_verdict: SCRIPTS_AND_DETACHED_WORKSTREAMS
    why: "durability comes from detachment + a TERMINAL marker, not from an agent session (D-3005, pipeline/research_run.py); goose run -t is the fallback when JUDGEMENT is needed, and it runs on the local provider (maxwell_omlx)"

# ── 3. WHAT WOULD CHANGE THE VERDICT ──
change_conditions:
  - "a PINNED pool (engine is_pinned: 'Never evict if True') so an interactive session's model cannot be evicted mid-turn (T-137)"
  - "the tiered cache proven by an A/B, so prefill stops being the wall (T-137)"
  - "a long-context measurement of MiniCPM5-2B-MLX at its class context size (BUG-805 discipline: never generalise a 17-token spot reading)"
  - "if a served model ever exceeds 0.9 on BOTH tool_calling and long_context_reasoning_16k, harness count stops being a risk"

# ── 4. THE MEASURED CLIENT MATRIX (2026-10-16, T-138) — WHAT A CLIENT COSTS, AND WHICH ONE IS THE DEFAULT ──
# THE OLD QUESTION ("how many harnesses can this machine afford?") is already answered in §1: the POOL is the
# server's cost and the clients queue on it. The remaining questions are the client's OWN cost, its capability,
# and WHO decides which one runs. All three are readings below. A reading I could not take says UNMEASURED —
# never 0, never a plausible guess (D-795/BUG-805: a spot reading is not a class reading either).
harness_matrix:
  measured_at: '2026-10-16'
  the_pool_is_the_SERVER_cost:
    served: 8
    resident_gb: 46.88
    guard_gb: 55
    reading: >-
      RSS read at 2026-10-16 11:50: omlx-server 4.57 GB resident, with the models paged and loaded on demand — so a
      resident moment is not a ceiling. Route by the declared pool figures, never by one moment's RSS.
  measured_client_footprints:
    goose_cli_process_mb: 712        # RSS of /Applications/Goose.app/Contents/Resources/bin/goose (pid 87724), 11:50
    goose_desktop_renderer_mb: 4736  # the app WINDOW's webview helper (pid 87725) — 6.6x the CLI process
    goose_binary_on_disk_mb: 267
    claude_on_disk_mb: 192           # ~/.local/share/claude/versions/2.1.101 (a NATIVE binary, no node runtime)
    pi_on_disk_mb: 162               # ~/.nvm/.../node_modules/@earendil-works (node package; the runtime is shared)
    uninstalled: >-
      a client that is not installed has NO footprint reading here, and absent is never 0. Adoption is ONE command
      per client and the wiring ships with the engine — MEASURED 2026-10-16, not quoted from a doc: 12 modules
      exist on disk at /Applications/oMLX.app/Contents/Resources/omlx/integrations/ (base, claude, codex, codex_app,
      copilot, dsh, hermes, macapp, openclaw, opencode, pi) and `omlx launch list|--help` names all nine clients.
  the_matrix:
    goose:
      installed: true
      version: '1.54.0'
      kind: cli_plus_desktop_app
      headless: 'goose run -t <text> | --recipe <name> — MEASURED 2026-10-15: ~28 s, rc 0'
      local_engine: >-
        DECLARED and enabled (config/engine.yaml#harnesses.goose_provider_id: maxwell_omlx) but NOT BOUND in the
        process that runs the harness: GOOSE_PROVIDER is unset and active_provider is custom_deepseek, so an
        UNWRAPPED run leaves the machine. THE RAIL ALREADY MEASURES IT: `python3 pipeline/harness_contract.py`
        reads rc 2 (OWNER-OWED) with all three GOOSE_* names UNBOUND and names the consequence (a cloud price tier is
        the fallback default). The declared remedy is to wrap the launch (pipeline/harness_env.py --exec, D-3000) —
        the same lesson as T-132 one layer out. See BUG-849 (the consequence is unmonitored) and T-174 (the everyday
        path must USE the wrapper).
      mcp: 'MEASURED: 27 extensions declared in the live ~/.config/goose/config.yaml, incl. skills, developer, orchestrator, scheduler, analyze, docguard, summon'
      agent_surfaces: 'recipes + subrecipes, the delegate (subagent) tool, SKILL.md skills, sessions/boot rules'
      verdict: DEFAULT
    claude:
      installed: true
      kind: native_cli
      headless: 'omlx launch claude -p — MEASURED 2026-10-15: 104.7 s, rc 0, LOCAL (the engine request counter moved 153 -> 154)'
      local_engine: 'via the engine wiring module: ANTHROPIC_BASE_URL + ANTHROPIC_AUTH_TOKEN + the three tier models'
      verdict: >-
        SECOND, and the only client with a NAMED reason to exist beside goose: a pre-tool HOOK surface is the
        candidate mechanism for T-171 (auto-journaling a delegated run at the harness boundary). That is a
        HYPOTHESIS WITH A RED LOOP OWED (D-3036), not a reading: no hook has been run on this machine.
    pi:
      installed: true
      kind: node_cli
      headless: '--print / --prompt — MEASURED 2026-10-15: 28.2 s, rc 0, LOCAL'
      verdict: 'CHEAPEST measured interactive loop; the fallback when a session is latency-bound'
    codex:
      installed: false
      kind: native_cli_plus_desktop
      local_engine: 'omlx launch codex (module on disk; --tools-profile is OpenClaw-only)'
      verdict: ON_DEMAND
    codex_app: {installed: false, kind: desktop_app, verdict: ON_DEMAND}
    opencode: {installed: false, kind: node_cli, verdict: ON_DEMAND}
    openclaw: {installed: false, kind: node_cli, verdict: ON_DEMAND}
    hermes: {installed: false, kind: cli, verdict: ON_DEMAND}
    copilot: {installed: false, kind: cli, verdict: ON_DEMAND}
    dsh: {installed: false, kind: cli, verdict: ON_DEMAND}
  default_rule:
    everyday_scaffolding_and_governed_work: >-
      goose, in its HEADLESS CLI form. The measured reason to prefer the CLI over the app is not taste: the desktop
      renderer held 4.74 GB against the CLI process's 712 MB in the same minute, so the GUI is for a human WATCHING
      and the CLI is for driving work.
    interactive_human_in_the_loop: 'goose; pi when latency is the binding constraint'
    unattended_batch: >-
      NEVER a client. A harness costs 28-105 s per invocation against 0.4 s for pipeline/oneshot_ask.py on the same
      prompt; unattended work is pipeline/research_run.py or a script (D-3005).
    hook_shaped_work: >-
      the one case where a DIFFERENT client is worth measuring: claude, IF its hook surface is verified here (T-171).
    smallest_footprint: >-
      among the three installed clients the CLI processes are comparable and ALL are small next to the pool; claude
      is a native binary (no node runtime) and pi is a node package, so `claude` is the lighter INSTALL and pi the
      lighter LOOP. Neither fact should drive the choice: the binding constraint is the model, not the client.
  decision_rule: >-
    THE CHOICE IS NOT LEFT TO A MODEL AT TASK TIME. A harness selected by an LLM per task is a non-deterministic
    dependency nobody can verify (C25/C27/D-3036). A decider may only SELECT A DECLARED ROW of this matrix: a client
    not declared here, or a row whose verdict is ON_DEMAND with no named job, is NOT a choice — the same shape as
    every other route in this repository, where the graph refuses a route it does not declare and the deterministic
    rule beats a proposal (D-2898). Where two rows disagree, the deterministic row wins and the disagreement is
    recorded rather than averaged.

