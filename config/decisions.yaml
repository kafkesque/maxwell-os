- id: D2298
  title: DeBERTa-Only NLI — RoBERTa Removed, Final S5 Architecture
  category: ARCH
  date: '2026-08-12'
  summary: 'RoBERTa-large removed from S5 after calibration showed zero added signal beyond DeBERTa. Root cause (D2227): evidence
    passages are LLM paraphrases, not verbatim — RoBERTa cannot differentiate paraphrase from contradiction. Calibration (12
    FBs, threshold 0.10): Precision 1.000, Recall 0.556, F1 0.714. 0.3s/FB on MPS. Single DeBERTa-v3-large encoder: ENTAIL
    ≥ 0.10 → PASS, else → QUARANTINE. No human FLAG path — DeBERTa is final authority. D2293 COMPLETE. 4 FNs are D2227 evidence-quality
    issues, not verification problems. DeBERTa-only at 0.10 is the ultimate best local solution. Redundancies resolved: RoBERTa,
    Phi-4-mini (S5), Gemma-4-E4B all removed. Active: DeBERTa-v3-large (S5), GPT-OSS-20B (S4), Qwen3-Coder-30B (S2).'
  files:
