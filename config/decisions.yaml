  source: governance/ONTOLOGY_FORENSIC_20260919.md
  verification: measured (ruler_measurement_20260917.md + live DB audit); human gate G4a
  description: 'Governing architectural finding. Reliability by blind human: extraction_type 0.831 > content_type 0.740 > discipline 0.506. Retrieval load (pipeline/retrieve.py): discipline is the PRIMARY exact-match filter (''discipline = ?''), domains is a substring filter (''domains LIKE ?'', non-sargable), depth is an exact filter undefined for every non-principle row, and status defaults to PASS -- while extraction_type, the best measured axis, is NOT a retrieval facet at all. Compounded by BUG-278: the exact filter runs over a 59.3% slice. CONCLUSION: the axes are ordered inversely to their reliability relative to their retrieval load, and this -- not any single bad label -- is the mechanism behind the ''a new weak point appears every day'' pattern. No axis change is proposed here; the finding constrains the ORDER of repair (repair the label instrument first, then re-rank the facets against a retrieval benchmark).'
  files:
  - pipeline/retrieve.py
  - governance/ONTOLOGY_FORENSIC_20260919.md

