pipeline_root: null
run:
  default_id: t11
pipeline_manifest:
  schema_version: '3.0'
  taxonomy_version: v5.5
  pipeline_commit: v3.0-D2485
  models:
    generator: Qwen3-Coder-30B-A3B-Instruct-MLX-4bit
    classifier: gpt-oss-20b-MXFP4-Q8
    embeddings: bge-m3
    nli: MoritzLaurer/DeBERTa-v3-large-mnli-fever-anli-ling-wanli
  prompt_versions:
    s2_convergent_extract: v7.0
    s4_cribs_classify: v2.0
    s5_factual_check: v3.0
stages:
  stage0_convert: knowledge pipeline/stage0_convert
  stage0_5_extract_metadata: knowledge pipeline/stage0_5_extract_metadata
  stage1_chunk: knowledge pipeline/stage1_chunk
  stage1_3_prefilter: knowledge pipeline/stage1_3_prefilter
  stage1_5_embed: knowledge pipeline/stage1_5_embed_cluster
  stage2_extract: knowledge pipeline/stage2_extract
  stage4_merge: knowledge pipeline/stage4_merge
  stage5_verify: knowledge pipeline/stage5_verify
  stage6_commit: knowledge pipeline/stage6_commit
  timeouts:
    '0': 3600
    '0.5': 3600
    '1': null
    '1.3': 3600
    '1.5': null
    '2': null
    '4': null
    '5': 3600
    '6': 3600
stage_files:
  stage0: null
  stage1: chunks.jsonl
  stage2: principles.jsonl
  stage4: fbs.jsonl
  stage5: verified.jsonl
  stage5_human_review: human_review/
  stage6_db: maxwell.db
  stage6_parquet: snapshot.parquet
  checkpoint: checkpoint.jsonl
  log: pipeline.log
  meta: run_meta.yaml
paths:
  checkpoint_dir: knowledge pipeline/checkpoints
  db_path: knowledge pipeline/maxwell.db
  parquet_dir: knowledge pipeline/parquet
  data_dir: knowledge pipeline
books_dir: knowledge pipeline/books
global_log: knowledge pipeline/pipeline.log
archive_dir: knowledge pipeline/archive
services:
  ollama:
    host: localhost
    port: 11434
    min_version: 0.32.0
    nomic_max_chars: 4000
    embed_max_chars: 4000
    batch_size: 100
    embed_timeout: 180
    embed_keep_alive: -1
    single_source_guard:
      canonical_app: /Applications/Ollama.app
      forbidden_bins:
      - /opt/homebrew/opt/ollama
      - /opt/homebrew/Cellar/ollama
      shim_paths:
      - /opt/homebrew/bin/ollama
      - /usr/local/bin/ollama
      forbidden_launchd_labels:
      - homebrew.mxcl.ollama
      launch_agents_dir: ~/Library/LaunchAgents
  omlx:
    host: localhost
    port: 11435
    api_key: sk-maxwell-local
    min_version: 0.4.0
    bin: null
    default_timeout: 300
    max_retries: 2
    retry_delay: 3
    cold_reload_delay: 45
    circuit_breaker_enabled: true
    circuit_breaker_failure_threshold: 5
    circuit_breaker_cooldown_seconds: 60
    single_source_guard:
      canonical_app: /Applications/oMLX.app
      forbidden_bins:
      - /opt/homebrew/opt/omlx
      - /opt/homebrew/Cellar/omlx
      shim_paths:
      - /opt/homebrew/bin/omlx
      forbidden_launchd_labels:
      - com.maxwell.omlx
      - homebrew.mxcl.omlx
      launch_agents_dir: ~/Library/LaunchAgents
models:
  generator:
    model: Qwen3-Coder-30B-A3B-Instruct-MLX-4bit
    provider: omlx
    temperature: 0.0
    max_tokens: 1024
  verifier:
    model: gpt-oss-20b-MXFP4-Q8
    provider: omlx
    temperature: 0.0
    reasoning_off_prefix: 'Reasoning: low'
    reasoning_off_models:
    - gpt-oss-20b-MXFP4-Q8
    max_tokens: 1024
    chat_template_kwargs:
      enable_thinking: false
    thinking_budget: 256
    depth_thinking_budget: 128
  verifier_v2:
    model: Phi-4-mini-instruct-8bit
    provider: omlx
    temperature: 0.0
    notes: 'D2319: S2 fast probe (~1.5s). D2298 removed Phi from S5 *verification*
      only; S5 = DeBERTa-only (models.nli_large).'
  embeddings:
    model: bge-m3
    provider: ollama
    alternative: mlx-community/Qwen3-Embedding-0.6B-4bit-DWQ
  nli_large: MoritzLaurer/DeBERTa-v3-large-mnli-fever-anli-ling-wanli
pipeline:
  schema_version: '3.0'
  commit: v3.0-D2485
  taxonomy_version: v5.5
  max_domains_per_fb: 5
  chunk_size_words: 300
  chunk_overlap_words: 50
  min_chunk_words: 10
  enhance_min_header_gap_chars: 3000
  borp_min_sources: 2
  intent_top_k_ratio: 0.3
  intent_threshold: 0.35
  smoke_book_limit: 3
smoke:
  plumbing:
    skip_llm: true
    fast_model: null
    timeout_per_stage: 10
  fast:
    skip_llm: false
    fast_model: Phi-4-mini-instruct-8bit
    skip_gemma_deep_check: true
    max_books: 3
stage1_5:
  faiss_threshold: 0.75
  min_cluster_size: 2
  max_cluster_size: 500
  min_source_diversity: 2
  neighbor_k: 50
  embed_model: bge-m3
  embed_dim: 512
  embed_backend: ollama
  embed_model_hf: BAAI/bge-m3
  embed_chunk_size: 20000
  embed_batch_size: 64
  max_embed_drop_rate: 0.005
  embed_checkpoint_enabled: true
stage0:
  max_failed_ratio: 0.0
stage1_3:
  min_len: 40
  cite_density: 0.6
  enabled: true
  drop_patterns_extra:
  - author and publisher have provided this e-book
  - personal use only
  - z-library
  - libgen
  - do not redistribute
  - no part of this text may be reproduced
  - ebooks, downloads
  - unauthorized use of this book
stage2:
  batch_size: 10
  minhash_threshold: 0.9
  minhash_num_perm: 128
  golden_path: config/golden/stage2_fewshot_convergent.yaml
  golden_positive: 4
  golden_negative: 1
  golden_max_examples: 5
  golden_inject_enabled: true
  golden_seed: 42
  golden_single_source_path: config/golden/stage2_fewshot_single_source.yaml
  golden_single_source_inject_enabled: true
  golden_single_source_negative: 7
  golden_single_source_max: 21
  split_probe_enabled: true
  split_probe_min_size: 20
  split_probe_max_cohesion: 0.85
  gate_enabled: true
  gate_strict: true
  evidence_tracking: true
  high_cohesion_threshold: 0.9
  med_cohesion_threshold: 0.75
  source_book_match: exact
  max_cluster_samples: 5
  max_probe_samples: 8
  max_probe_per_book: 2
  split_probe_kmeans_random_state: 42
  omlx_retry_attempts: 2
  gen_max_tokens: 3072
  gen_max_tokens_retry: 4096
  batch_position_monitor: false
  max_workers: 3
  singleton_batch_size: 4
  singleton_batch_max_tokens_per_item: 1000
  singleton_prefilter_enabled: true
  route_values:
  - FB
  - 'NULL'
  max_failed_ratio: 0.01
  gated_seed_marker: summary gated
  gated_seed_id_regex: cluster_\d+(_s\d+)?(_sub\d+)?
  extraction_type_dominance_warn_ratio: 0.95
  relabel_max_workers: 4
  relabel_cross_family_model: gpt-oss-20b-MXFP4-Q8
watchdog:
  interval_secs: 60
  stall_checks: 3
  causal_warn_ratio: 0.5
  causal_halt_ratio: 0.9
stage4:
  process_template_output: process_templates.jsonl
  process_instance_output: process_instances.jsonl
  growth_edge_output: growth_edges.jsonl
  tool_instruction_output: tool_instructions.jsonl
  max_principles_per_cluster: 25
  dedup_cosine_threshold: 0.92
  semantic_near_threshold: 0.8
  related_fbs_max_neighbors: 20
  related_fbs_exclude_domains:
  - emerging
  related_fbs_exclude_disciplines:
  - emerging
  merged_call_enabled: true
  merged_call_max_tokens: 2048
  batch_enabled: false
  batch_size: 4
  batch_call_max_tokens: 2048
  depth_focused_classification: true
  depth_max_tokens: 1024
  depth_batch_size: 4
  depth_batch_max_tokens: 2048
  depth_batch_enabled: true
  depth_prompt_variant: v3_contrastive
  depth_frugal_enabled: false
  depth_model: gemma-4-E4B-it-MLX-4bit
  depth_fallback_depth: domain
  golden_path: config/golden/stage4_golden.yaml
  golden_inject_enabled: true
  golden_max_examples: 7
  context_signals:
    business:
    - business operations
    - business development
    - entrepreneurship
    - organizational behavior
    - marketing & communications
    design:
    - graphic design
    - brand identity
    - editorial & advertising
    - motion design
    - environmental design
    - digital product
    - illustration
    - packaging
    - web & ui
    - user experience
    - creative technology
    - data visualization
    system:
    - systems & frameworks
    - code & computation
    - engineering practice
    - ai & agents
    - computational science & physics
    academic:
    - research & methodology
    - semiotics & communication
    - computational art
  temporal_signals:
    timeless:
    - always
    - universal
    - fundamental
    - any system
    contemporary:
    - '202'
    - current
    - modern
    - recent
    - today
    - now
  difficulty_map:
    specialized: expert
    universal: beginner
    cross-domain: intermediate
    domain_single: expert
    domain_multi: intermediate
  universal_signals:
  - entropy
  - thermodynamic
  - evolution
  - natural selection
  - system 1
  - system 2
  - cognitive bias
  - feedback loop
  - power law
  - exponential
  - equilibrium
  - conservation
  - symmetry
  - optimization
  - gradient
  max_failed_ratio: 0.01
  checkpoint_interval: 5
  fb_name_max_words: 8
s2:
  dspy_max_labeled_demos: 3
  dspy_max_bootstrapped_demos: 3
  dspy_max_tokens: 4096
  dspy_program_path: data/dspy_mipro_optimized.json
  dspy_enabled: false
  gate:
    enabled: false
    model: Qwen3-Coder-30B-A3B-Instruct-MLX-4bit
    max_tokens: 64
    temperature: 0.0
    system_prompt: You are a principle discovery gate. Answer ONLY with 'FB' or 'NULL'.
      No explanation.
    user_prompt_template: 'Examine these text segments from {n_sources} different
      books.


      {segments}


      Does this cluster contain a discoverable convergent principle —

      a named, reusable mechanism with a clear ''how it works'' and ''when it fails''?

      Answer ONLY: FB (yes, extractable principle) or NULL (no extractable principle).

      '
stage5:
  borp_bypass_types:
  - process_template
  - process_instance
  - growth_edge
  - tool_instruction
  factscore_enabled: false
  nli_model: MoritzLaurer/DeBERTa-v3-large-mnli-fever-anli-ling-wanli
  nli_entailment_threshold: 0.1
  nli_pass_threshold: 0.1
  nli_marginal_threshold: 0.1
  nli_max_premise_chars: 256
  nli_max_hypothesis_chars: 256
  mechanism_min_length: 150
  citation_echo_source_threshold: 20
  evidence_garbage_min_words: 6
  evidence_garbage_max_underscore: 2
  evidence_garbage_min_alpha_ratio: 0.5
  b2_majority_ratio: 0.5
  banned_mechanism_prefixes:
  - because it enables
  - because it allows
  - because it helps
  - because it provides
  - because it makes
  - because it can
  confidence:
    mechanism_weight: 0.35
    enrichment_weight: 0.25
    isor_weight: 0.4
    quarantine_cap: 0.25
    human_review_isor_rating: strong
  checkpoint_interval: 50
stage6:
  commit_non_fb_types: false
  okf_export_enabled: true
  max_failed_ratio: 0.0
stage4_5:
  enabled: false
  model: gpt-oss-20b-MXFP4-Q8
  procedural_skill_enabled: true
  edge_enabled: true
  edge_candidate_threshold: 0.8
  edge_max_candidates_per_fb: 10
  edge_max_tokens: 512
  procedural_skill_max_tokens: 256
  max_failed_ratio: 0.01
  checkpoint_interval: 5
coverage:
  threshold: 0.5
  flag_fraction: 0.3
retrieval_eval:
  model: Phi-4-mini-instruct-8bit
  provider: omlx
  max_tokens: 1024
  confidence_threshold: 0.85
  max_iterations: 3
  max_fbs_to_evaluate: 15
  fb_definition_max_chars: 300
  fb_name_max_chars: 200
retrieval_benchmark:
  top_k: 10
  candidate_pool: 30
rerank:
  enabled: true
  model: BAAI/bge-reranker-v2-m3
  device: cpu
  max_length: 512
  batch_size: 8
ranking:
  # D2537: opt-in fused quality ranking. borp_score is ~all 0.0 (verified 3310/3310
  # PASS rows), so the legacy `ORDER BY borp_score` collapses to rowid order. When
  # enabled, rank by S5 NLI confidence_score + epistemic boosts (convergent /
  # source-diverse). OFF by default so legacy behaviour stays the benchmark baseline.
  quality_score_enabled: false
  confidence_weight: 1.0
  convergent_boost: 0.10
  diversity_boost: 0.05
contextual_embed:
  enabled: false
  context_fields:
  - discipline
  - domains
  - name
  max_context_chars: 200
hyde:
  enabled: false
  model: Qwen3-Coder-30B-A3B-Instruct-MLX-4bit
  max_tokens: 256
reliability:
  stable_threshold: 0.85
  watch_threshold: 0.5
  garbage_threshold: 0.2
taxonomy:
  flood_threshold_ratio: 0.2
  replacement_threshold_ratio: 1.1
  emerging_freq_threshold: 10
  max_domains: 43
  max_disciplines: 61
  emerging_discipline_rate_max: 0.35
  emerging_domain_rate_max: 0.3
  emerging_unmapped_rate_max: 0.05
  # D2519 (D2399 policy A): promotion governance. promotions_frozen is a manual
  # kill-switch (set true to halt all D2399 promote/demote). allow_both_axes_emerging
  # = false enforces "never promote a label emerging on BOTH axes" (axis-confused
  # labels like 'human factors engineering' are rejected, not promoted).
  d2399_promotions_frozen: true
  d2399_allow_both_axes_emerging: false
e2e:
  borp_min_sources: 2
  min_pass_rate: 0.8
  min_fbs: 30
  convergent_ratio: 0.2
  # D2531: corpus-aware verify pass-rate (OPT-IN, NOT auto-applied).
  # The single min_pass_rate: 0.8 above is calibrated for a convergent-dominant
  # corpus. The 2026-09-03 e2e run exposed that single-source FBs (origin=
  # single_source) are genuinely unentailed by NLI (27.4% PASS) and even
  # convergent FBs sit at 31.1% — NEITHER reaches 80%. This is NOT a threshold
  # bug: it is a real signal that (a) evidence passages are weak/truncated and
  # (b) the B2 strict-majority vote is harsh for this corpus. Until evidence
  # quality is fixed in a separate investigation, this OPT-IN block lets
  # validate_results gate each origin tier against its own observed floor so a
  # genuinely degraded run still FAILS. enabled: false keeps the legacy single
  # threshold active (no silent behavior change — the recommendation is explicit).
  corpus_aware_pass_rate:
    enabled: false
    convergent_min_pass_rate: 0.25
    single_source_min_pass_rate: 0.20
  diagnostic:
    yield_pct_pass: 1.0
    yield_pct_fail: 0.5
    s5_pass_rate_pass: 0.4
    s5_pass_rate_fail: 0.2
    quick_clusters: 50
    default_books: 100
test:
  full_run:
    books: []
    output_subdir: full-run
    pipeline_commit: full-run-v3
    schema_version: '2.3'
    taxonomy_version: v5.5
    extract_model: Qwen3-Coder-30B-A3B-Instruct-MLX-4bit
    extract_max_tokens: 2048
    classify_max_tokens: 512
    extract_system_prompt: "You extract reusable principles from text.\nReturn a JSON\
      \ array of principle objects:\n[{\"name\": \"Principle Name\", \"definition\"\
      : \"2-3 sentence definition...\",\n  \"mechanism\": \"X causes/enables/prevents\
      \ Y because Z\",\n  \"boundary\": \"Applies when...; fails when...\",\n  \"\
      consequence\": \"What follows from this mechanism\",\n  \"elaboration\": \"\
      3-5 sentences of deeper nuance (edge cases, exceptions, conditions). Empty string\
      \ if passages add nothing beyond mechanism/boundary.\",\n  \"is_summary\": false,\n\
      \  \"evidence_passages\": [\"verbatim quote 1\", \"verbatim quote 2\"],\n  \"\
      application\": \"When [situation] -> do [action]\",\n  \"failure_mode\": \"\
      The principle fails when...\",\n  \"keywords\": \"term1, term2\",\n  \"jargon\"\
      : {\"term\": \"explanation\"} or omit if none,\n  \"route\": \"FB\"}].\nevidence_passages\
      \ MUST be verbatim quotes from the source text — never paraphrase.\nDefault\
      \ route is FB; use NULL only when the passage clearly contains no principle."
    context_signals:
      business:
      - business operations
      - business development
      - entrepreneurship
      - marketing & communications
      - organizational behavior
      design:
      - graphic design
      - brand identity
      - user experience
      - web & ui
      - digital product
      - editorial & advertising
      - motion design
      - environmental design
      - illustration
      - packaging
      - creative technology
      - data visualization
      ai:
      - ai & agents
      - code & computation
      - computational art
      research:
      - research & methodology
      - semiotics & communication
      system:
      - systems & frameworks
      - engineering practice
      - computational science & physics
    temporal_signals:
      contemporary:
      - '202'
      - current
      - modern
      - recent
      - today
      timeless:
      - always
      - universal
      - fundamental
      - any system
      - all
    difficulty_map:
      specialized: expert
      universal: beginner
      cross-domain: intermediate
      domain: intermediate
    defaults:
      confidence: 0.7
      borp_score: 1
      grounding_evidence: source_text
      accessibility: self-evident
      intimacy_boundary: public
      provenance: llm_extracted_from_source
    citation_format: author_title
    body_only_fields:
    - definition
    - application
    - failure_mode
    - elaboration
    - keywords
    - jargon
    - source_text
    metadata_cache_file: book_metadata.jsonl
    extraction_top_n: 8
    extraction_combined_chars: 600
    extraction_prompt_limit: 3000
source_epub_dir: null
source_pdf_dir: null
omlx_wired_stress:
  rounds: 5
  prompts_per_round: 20
  prompt_size_chars: 1000
  max_tokens: 128
  growth_threshold_pct: 10.0
  round_trend_gb: 2.0
  per_request_timeout: 30
  model: null
recall:
  match_threshold: 0.55
