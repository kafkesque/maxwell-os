  why: >-
    THE OWNER'S CHALLENGE WAS RIGHT AND THE FIRST RECOMMENDATION WAS WRONG — so it was re-MEASURED, not repeated.
    (a) BORP's original concept is the BOOK OF RECORD PRINCIPLE ("at least two independent sources for
