- id: D285
  category: ONTOLOGY
  state: RESOLVED
  date: '2026-09-20'
  title: Discipline boundary re-derivation — cognitive science / design psychology / psychology / behavioral economics / design thinking (D-285)
  source: config/r5_slot_repair.yaml
  verification: 'User-dictated re-derivation 2026-09-20. design psychology redefined as the EXPLOITATION of cognitive-science biases/loopholes to persuade/manipulate a user or consumer (applied persuasion), NOT the study of cognition. cognitive science = how the mind works (perception, memory, attention, reasoning) as pure cognition — the DEFAULT home for memory/reasoning/cognitive-load claims (e.g. "how cognitive load shapes interface layout" is cognitive science, not design psychology). psychology = mind/behaviour beyond computation (emotion, personality, development, social). behavioral economics = DESCRIPTIVE study of bias in economic/market choice. design thinking = the empathise->prototype->test innovation PROCESS. All five mutually exclusive (symmetric excludes verified). menu_hash re-rendered 14540ec3... because taxonomy discipline definitions feed the closed menu.'
  description: 'The D-282 depth fix held, but the discipline axis had unresolved overlaps across design psychology / cognitive science / psychology / behavioral economics / design thinking. All five re-derived with definition + include + exclude in r5_slot_repair.yaml, and taxonomy_v5.yaml canonical definitions updated in lockstep (zero canonical<->repair drift). Symmetry verified: every exclude has a matching reverse.'
  files:
  - config/r5_slot_repair.yaml
  - config/taxonomy_v5.yaml
  - config/closed_menu_v5.json
  - config/closed_menu_v5.sha256
