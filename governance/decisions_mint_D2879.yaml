    BUG-682 - THE REAL DEFECT BEHIND BUG-679, NOW MEASURED. The discipline/domain/primary_domain axis has TWO
    homes: the OWNER-SHEET-DERIVED ruler (which carries every round-2/round-3 ruling) and
    governance/discipline_anchor_rederived_v8_20261007.json (declared authority by
