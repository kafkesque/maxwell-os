- id: D2585
  category: LABEL QUALITY / DATA
  state: ACTIVE
  description: 'LABEL-QUALITY ARCHITECTURE FINAL VERDICT (roundtable adjudication + second-round peer review). Three independent auditors (Claude/ChatGPT/Qwen at pinned commit 436fabc) + adjudicator synthesis
    + second-round peer review (ChatGPT, Qwen) CONVERGED: the 3-model generative vote is NOT the ultimate label-quality solution — it is one weak labeling function, not an oracle. DECISION: retire full-corpus
    1,027-FB 3-model vote (wasted compute on the ~80% correct labels; cleanlab already flags 48.7% = 3,424/7,026) and adopt a weak-supervision label model as the durable architecture. PIPELINE: gpt-oss
    teacher → { T-NLI (per-label thresholds, taxonomy.semantic_error_rate_max.per_label, 96 entries) + cleanlab + (limited generative challenger) } as labeling functions → weak-supervision label model (Snorkel
    LabelModel / Dawid-Skene EM) → human adjudication on the high-disagreement subset (GOLD-A/B/CHALLENGE, 300-500 stratified, book/author-disjoint) → ModernBERT-base classifier (train → temperature-scale
    → conformal/selective abstention on top of ABSTAIN_THRESHOLD=0.35). SECOND-ROUND REFINEMENTS (adopted from ChatGPT+Qwen): (1) MANDATORY LF-audit/dependency gate BEFORE writing build_label_model.py —
    the LFs are NOT automatically independent (gpt-oss/NLI/cleanlab/challenger share correlated failure modes; alias-canonicalization is deterministic preprocessing, NOT a voter; cleanlab issue-probability
    is NOT a calibrated mislabel probability) → Step 3A = LF schema + conditional-dependence analysis, Step 3B = label model; (2) evaluate against frozen human GOLD, never against gpt-oss agreement (D2286);
    (3) benchmark gate = ΔF1 > +0.02 (label-model labels vs silver labels on ModernBERT) + >70% agreement on a 10% held-out flagged subset; (4) selective prediction to trade coverage for accuracy on the
    61-way rare classes. PRIORITY: P0 train ModernBERT baseline NOW (macro-F1 + confusion matrix, from D2578 0.2621); P1 LF audit; P2 build_label_model.py; P3 targeted generative challenger on ~100-200
    cleanlab∩T-NLI-flagged FBs ONLY; P4 retrain + calibrate + abstain; P5 freeze GOLD-A/B/CHALLENGE; P6 retire label_vote.py to rare spot-checks. MEMORY: only one non-pinned generative voter resident at
    a time (sequential calls do NOT imply sequential residency — wire model_lazyload.py --unload first).'
  champion: goose
  target_files:
  - scripts/build_label_model.py
  - scripts/train_discipline_classifier.py
  - scripts/label_vote.py
  - pipeline/model_lazyload.py
  created: '2026-09-06'
