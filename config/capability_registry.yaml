#: SHRINK-ONLY (the D-3023 ceiling shape). These are the instrument's own readings, not targets: the reader FAILS
#: when the measured debt EXCEEDS the declared number, so inherited debt cannot grow unnoticed, and it reports a
#: SHRINK as good news. Clearing an item is a route declaration or an item edit - never a raised ceiling.
routing_debt:
