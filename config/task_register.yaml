    Phi-4-mini 394 at 4466, gpt-oss-20b 210 at 50082, Qwen3.8-27B 39 at 32026) - and the cache proof now carries a MEASURED
    verdict instead of a hope: twelve byte-identical-prefix calls, every one reporting prompt_tokens_details.cached_tokens
    = 0, speedup 1.01x then 1.04x through the probe''s own --prefill-ab against the declared 5x bar -> status DISPROVEN
    (BUG-792). Reachability re-tested rather than inferred: 50082 prompt tokens accepted whole by a model declared at
