  - id: I02_conflicting_domain_signals
    description: "FB has strong signals for 2 conflicting taxonomies"
    fb_name: "Generative Art Authorship Ethics"
    fb_definition: "When AI generates artwork based on training data from human artists, questions of authorship, copyright, and creative ownership arise. This sits at the intersection of AI engineering, art history, legal theory, and design practice — each with conflicting frameworks for attribution."
    expected_disciplines: ["ai engineering", "design strategy"]
    expected_domains: ["creative technology", "ai & agents", "digital product"]
    expected_depth: "cross-domain"
    expected_evidence: "cited"
    test_property: "conflicting domain signals"

  - id: I03_everything_everywhere
    description: "FB is genuinely universal — could fit ALL domains"
    fb_name: "Entropy Increases"
    fb_definition: "In any closed system, entropy — the measure of disorder — always increases over time. This thermodynamic law applies to software systems (code rots), organizations (processes degrade), markets (efficiency erodes), and relationships (communication decays). Maintenance is the universal counter-force."
    expected_disciplines: ["strategic thinking"]
    expected_domains: ["engineering practice", "business operations", "code & computation", "digital product", "ai & agents"]
    expected_depth: "universal"
    expected_evidence: "axiomatic"
    test_property: "genuinely universal — should pick top 5 domains"

