#: when the measured debt EXCEEDS the declared number, so inherited debt cannot grow unnoticed, and it reports a
#: SHRINK as good news. Clearing an item is a route declaration or an item edit - never a raised ceiling.
routing_debt:
  #: T-130 option (B), 2026-10-16: both ceilings LOWERED to the measured reading. The new capability
  #: `ingest_identity_door` routed 2 tasks (T-172, T-173) and 3 bugs that resolved to NOTHING before - the debt
  #: these items carried was the route graph's, not the tasks'. A shrink-only ceiling follows its measurement
  #: DOWN (D-2644/D-3023), so the next unrouted item is a fault rather than a shrug.
  #: RE-MEASURED 2026-10-28 (D-3212) and both ceilings LOWERED to the reading: tasks 31 -> 26, bugs 221 -> 172.
  #: THE BUGS NUMBER MOVED BY COVERAGE, NOT BY PAYMENT, and the distinction is the whole point of recording it here:
  #: the rail used to read a bug as `id + title` while it read a task from six evidence fields, so a bug whose
  #: EVIDENCE named an artifact an owning capability already held was counted as debt. The census now publishes
  #: those artifacts and 69 more bugs resolve (routed 20 -> 89 of 266). The ceiling follows the measurement DOWN
  #: (D-2644/D-3023), and that is deliberate: from here EVERY new finding must be BORN routed or explicitly
  #: dispositioned, because one unrouted item is over a ceiling set at today's reading. That is the whole
  #: closure mechanism - the register stops being a pool of observations with no owner (D-3212).
  measured: '2026-10-28'
  unrouted_open_tasks: 14
  #: RE-MEASURED 222 -> 225 on 2026-10-17 by D-3080, and the raise is DISCLOSED rather than smuggled: two bugs
  #: (BUG-911, BUG-912) were appended to a register that is APPEND-ONLY, so their TITLES could not be made to name
  #: an artifact owned by `acquisition_lane` — and this file's own reason `bug_is_a_finding` says a bug routes only
  #: when its title names one. The `unrouted:` override above did NOT reduce the measured count (BUG-913), so a new
  #: finding whose title names no path could NEITHER be routed NOR dispositioned — a defect in the INSTRUMENT.
  #:
  #: THEN THE INSTRUMENT WAS FIXED (BUG-913 CLOSED the same day), AND THE CEILING FOLLOWED THE READING DOWN 225 -> 223.
  #: `item_faults` now subtracts the per-item `unrouted:` declaration from the debt count, so the escape the rail
  #: offers ("declare the route, or disposition the item") MOVES THE NUMBER it tells the reader to move. Re-measured
  #: after the fix: BUG-911/BUG-912 overridden (-2), BUG-913 closed (-1), BUG-914 opened (+1) => 223. The ceiling is
  #: pinned to that reading, so the next unrouted item is a fault rather than a shrug. The raise above is retired;
  #: this line is the current number, and it may only go down.
  #: 2026-10-23: debt 224 -> 221 (three per-item dispositions added: BUG-964, BUG-967 bug_is_a_finding;
  #: BUG-972 route_graph_incomplete) and the ceiling followed the measurement DOWN (D-2644/D-3023).
  unrouted_open_bugs: 68
  #: BUG-1097 (2026-10-28): THE ANCHOR. Until this list existed the ceiling was a number nothing read in the
  #: OTHER direction: `check()` compared `debt > ceiling` and never looked at the ceiling itself, so this register
  #: could carry the receipt of a raise in PROSE ("RE-MEASURED 222 -> 225 on 2026-10-17 by D-3080", above) and
  #: still leave the ceiling 49 items above its own reading - a value merely MENTIONED in a comment declares no
  #: bytes (D-3034). Now the declared number must be the number this record ENDS at, every row must chain onto
  #: the row before it, a row that RAISES must cite a decision id that EXISTS in config/decisions.yaml, and
  #: `measured` must be no older than the last act (so `measured` finally has a consumer - it had none at all).
  #: Written ONLY by `scripts/resolve_route.py --rebaseline --set <tasks|bugs>=<n> [--because D-xxxx]`: a
  #: LOWERING needs no citation (D-2644: a shrink is not a decision), a RAISE is a decision and is refused
  #: without one. The two rows below are the ORIGIN: the last real move of each ceiling, recorded here because
  #: both were MEASURED (D-3212) and neither had a machine-readable line to point at. A raise whose row is
  #: missing/dates wrong is fault (viii); an unsigned raise is fault (ix); an undated or stale reading is (x).
  ceiling_changed:
    - {date: '2026-10-28', target: unrouted_open_tasks, frm: 31, to: 26, decision: D-3212, why: 'lowered to the corrected reading - a shrink-only ceiling follows its measurement DOWN (D-2644/D-3023)'}
    - {date: '2026-10-28', target: unrouted_open_bugs, frm: 221, to: 172, decision: D-3212, why: 'lowered to the corrected reading: the reader saw only id + title, so 69 bugs whose EVIDENCE named an owner counted as debt (BUG-1096)'}
    - {date: '2026-10-28', target: unrouted_open_bugs, frm: 172, to: 173, decision: D-3212, why: "RAISED 172 -> 173 under D-3212"}
    - {date: '2026-10-28', target: unrouted_open_bugs, frm: 173, to: 172, decision: null, why: "LOWERED 173 -> 172 to the measured reading"}
    - {date: '2026-10-28', target: unrouted_open_bugs, frm: 172, to: 171, decision: null, why: "LOWERED 172 -> 171 to the measured reading"}
    - {date: '2026-10-28', target: unrouted_open_bugs, frm: 171, to: 162, decision: null, why: "LOWERED 171 -> 162 to the measured reading"}
    - {date: '2026-10-28', target: unrouted_open_tasks, frm: 26, to: 25, decision: null, why: "LOWERED 26 -> 25 to the measured reading"}
    - {date: '2026-10-28', target: unrouted_open_tasks, frm: 25, to: 14, decision: null, why: "LOWERED 25 -> 14 to the measured reading"}
    - {date: '2026-10-28', target: unrouted_open_bugs, frm: 162, to: 68, decision: null, why: "LOWERED 162 -> 68 to the measured reading"}
  note: >-
    the readings below are RE-MEASURED every run and printed per item; the ceiling exists so that a NEW unrouted
    item is a fault instead of a shrug, and so the worklist of the route graph is a number someone can shrink
