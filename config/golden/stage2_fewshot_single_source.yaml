- id: SS-POS-007
  domain: computer-science
  source_books:
  - LLM Engineer's Handbook — Paul Iusztin, Maxime Labonne
  cluster_segments:
  - source_book: LLM Engineer's Handbook — Paul Iusztin, Maxime Labonne
    text: "Using SQLAlchemy, define a User ORM class with a declarative base, set the table name with __tablename__, and declare columns as class attributes. Then create the engine and metadata, call metadata.create_all() to create the table, and use session.add() and session.commit() to persist a record."
  is_convergent: false
  should_extract: true
  expected_fb:
    is_summary: false
    route: FB
    name: SQLAlchemy ORM Mapping
    definition: "Map a Python class to a database table via SQLAlchemy's declarative base (declaring columns as class attributes), then create the table and persist records with session.add() and session.commit()."
    mechanism: "The declarative base maps class attributes to table columns and __tablename__ to the table name, so the ORM translates object operations into the underlying SQL INSERT/SELECT statements."
    boundary: "Applies to Python applications using SQLAlchemy against a relational database. Fails when the database connection is not established or the class does not map to a valid table."
    consequence: "Developers create, read, update, and delete records through Python objects instead of writing raw SQL queries."
    elaboration: ""
    extraction_type: normative_heuristic
    content_type: tool_instruction
    tool_name: "SQLAlchemy"
    platform: "Python (ORM library)"
    description: "Map a Python class to a database table and run CRUD operations through the ORM instead of raw SQL"
    syntax: "class User(Base): __tablename__ = 'users'; ...; session.add(user); session.commit()"
    parameters:
    - name: declarative_base
      type: class
      description: "Base class that maps subclasses to database tables"
    - name: __tablename__
      type: str
      description: "Database table name the class maps to"
    - name: session
      type: Session
      description: "ORM session used for add/commit/query operations"
    output: "The mapped table and persisted records in the database"
    example: "class User(Base): __tablename__ = 'users'; id = Column(Integer, primary_key=True)"
    caveats: "Fails when the database connection is not established or class attributes do not map to valid columns"
    evidence_passages:
    - "Using SQLAlchemy, define a User ORM class with a declarative base, set the table name with __tablename__, and declare columns as class attributes."
  rationale: "A software library/API usage pattern (ORM mapping + CRUD calls). content_type=tool_instruction, NOT process_template — it is a framework's API, not a repeatable human how-to (BUG-166 PT-vs-TI contrastive)."
  tier: CORE

