  singleton_lock_path: ".pipeline_runner.lock"  # BUG-602: pid lock, relative to pipeline_root (C12)
  preflight_timeout_sec: 90            # BUG-606: must exceed watchdog restart cycle (kill 10s + sleep 3s + RESTART_WAIT 30s ≈ 43s)
  python_bin: /Users/barn/miniforge3/bin/python3  # BUG-607: canonical stage interpreter. Bare "python3" drifted between shells (login zsh→conda base, non-login→framework 3.12) so S2 lost datasketch. Pin the full-dep-chain env (C12).
pipeline_manifest:
  schema_version: '3.0'
  taxonomy_version: v5.7
  pipeline_commit: v3.0-D2485
  models:
    generator: Qwen3-Coder-30B-A3B-Instruct-MLX-4bit
    # D2635 (2026-09-15): gpt-oss RETIRED as GENERATOR (ARM-2 — non-viable, empty-content +
    # schema-incomplete). Classifier role RETIRING -> ModernBERT student (classifier_modernbert_p5final)
    # once ARM-3 abstention + student-readiness gate pass. Keep gpt-oss here until then.
    classifier: gpt-oss-20b-MXFP4-Q8
    embeddings: bge-m3
    nli: MoritzLaurer/DeBERTa-v3-large-mnli-fever-anli-ling-wanli
  prompt_versions:
    s2_convergent_extract: v7.0
    s4_cribs_classify: v2.1  # D-325: boundary discriminator block injected
    s5_factual_check: v3.0
classifier_training:
  # D2577: auto-sorter student — full fine-tune (NO LoRA).
  student_model: answerdotai/ModernBERT-base
  # D2608 (forensic): align training output dir with the student inference dir
  # (stage4.student_preclassifier_checkpoint). Was drift: training default wrote
  # to classifier_modernbert while the student loaded classifier_modernbert_p5final.
  # NOTE: p5final (macro-F1 0.2036) < p4_clean (0.2758) on ONE noisy held-out run,
  # but p5final carries the 28 latest human-corrected labels — preferred on
  # label-quality grounds; the F1 delta is within run variance (±0.05).
  checkpoint_dir: knowledge pipeline/classifier_modernbert_p5final
