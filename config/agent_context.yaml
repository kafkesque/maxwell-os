# config/agent_context.yaml
# ─────────────────────────────────────────────────────────────────────────────
# THE AGENT HARNESS'S CONTEXT CONTRACT. ONE home (C12/C12c) for the layers that sit between a local
# model's SERVED window and the words an agent session can actually afford. Authority: D-3000
# (PROPOSED — measured and declared; the knobs that change behaviour wait on the owner's word, and
# nothing here rewrites a live setting).
#
# AMENDED 2026-10-14, same day, BEFORE ratification, and the amendment is the point:
#   * the first draft ranked models by WINDOW (agent_loop >= 131072) and read a prefill from a
#     chars/token rule. Both were wrong, and both were caught by measuring rather than by reasoning:
#       - a "truncation at 32,026 tokens" was an ARTEFACT: the filler unit is exactly 10 tokens per
#         45 characters (0.222 tok/char), not 4 chars/token (0.25). The prompt was 32,026 tokens and
#         was NOT truncated. An ESTIMATE is not a MEASUREMENT (BUG-794).
#       - the local server reuses NO prefix: 12 calls with byte-identical 4.5k-5.3k prefixes returned
#         `cached_tokens = 0` every time (speedup 1.01x against a declared bar of 5x). The cache is
#         OFF, so every turn pays its WHOLE prompt again, and the binding constraint is PREFILL
#         THROUGHPUT, not the window. A 131072-token turn on the 27B costs ~56 minutes of prefill.
#   * the corrected ranking is therefore two-sided (window AND prefill bill), and it DEMOTES the
#     big-window models for loop work while keeping them for single-shot probes.
#
# WHY THIS EXISTS — MEASURED 2026-10-14, read-only, on this machine:
#   * oMLX serves Phi-4-mini / gemma-4-E4B / Qwen3-Coder-30B at `max_context_window: 32768`,
#     gpt-oss-20b-MXFP4-Q8 at 131072, Qwen3.8-27B-MLX-4bit at 262144
#     (`~/.omlx/model_settings.json`; confirmed by the OpenAI-compatible `/v1/models.max_model_len`).
#   * those windows are REACHABLE, and that was verified rather than assumed: a 50,082-token prompt
#     on gpt-oss-20b (declared 131072) came back as `prompt_tokens = 50,082`. The global
#     `sampling.max_context_window` does NOT cap input, so a declared window above it is real.
#   * goose DECLARES the same numbers (`custom_providers/maxwell_omlx.json#models[].context_limit`),
#     so there is NO belief mismatch today. That is exactly why the parity must be DECLARED: today it
#     is a coincidence of two hand-edited files in two different directories, and a reader that reads
#     the wrong window is silent in both directions (truncated request, or a window thrown away).
#   * goose's compaction trigger defaults to `min(GOOSE_AUTO_COMPACT_THRESHOLD x window,
#     GOOSE_AUTO_COMPACT_TOKEN_LIMIT)` = `min(0.8 x 32768, 225000)` = 26214 tokens on the local
#     models. The 225000 cap is a CLOUD PRICE-TIER artifact and is meaningless on hardware we own
#     (C1/C22) — but on a 262144-declared model it would let a LOCAL session grow to a two-hour prefill.
#   * the harness's own ledger measures prefix reuse (`usage_ledger.cache_read_tokens`); the SERVER
#     reports its own counter (`usage.prompt_tokens_details.cached_tokens`). MEASURED across 28646
#     calls: cloud deepseek-* models report ~96% of input tokens as cache reads, and the local
#     agent-loop calls report nothing. ABSENT IS NOT ZERO (D-2957) — and now it is not UNKNOWN either:
#     the two-call A/B below was RUN on this machine and it FAILED.
#
# THE LAYERS. A mismatch between any two is a fault, and every mismatch is silent:
#   1 served_window        what the SERVER can attend to          (~/.omlx/model_settings.json)
#   2 declaration          what the HARNESS is TOLD               (goose custom provider)
#   3 trigger              when the harness COMPACTS              (GOOSE_* env, defaults from goose)
#   4 cache_ledger         the MEASURED prefix reuse              (goose sessions.db + the server's own counter)
#   5 prefill_budget       what a turn COSTS in seconds           (this file, measured per model)
#
# THE PROBE. `scripts/agent_context_probe.py` re-measures the layers and reports the parity, the
# derived trigger, the cache verdict and the prefill bill. It reads EVERY path, threshold and
# vocabulary from THIS file: it names no path, no host and no magic number of its own (C12), and it
# WRITES NOTHING. `--prefill-ab` is the ONLY mode that SENDS a prompt, and it is opt-in and OFF the
# ladder (a rail that needs the network must never be the thing that decides whether a build is green).
schema_version: '2'
authority: D-3000
authority_state: PROPOSED
updated: '2026-10-14'
state: measured_awaiting_owner_word

#: The homes. A path that lives in code rather than here is the defect C12 names.
homes:
  served_window: '~/.omlx/model_settings.json#models.<model>.max_context_window'
  served_window_endpoint: '{base_url}/models#max_model_len'      # base_url comes from the declaration
  chat_endpoint: '{base_url}/chat/completions'                   # the ONE place a probe may SEND a prompt
  server_settings: '~/.omlx/settings.json'                       # the server's launch-time source of truth
  declaration: '~/.config/goose/custom_providers/maxwell_omlx.json'
  harness_config: '~/.config/goose/config.yaml'                  # top-level GOOSE_* keys = the env defaults
  cache_ledger: '~/.local/share/goose/sessions/sessions.db#usage_ledger'
  # T-174/T-157: the ENGINE'S OWN request counter. The one witness that says whether a session was served
  # BY THIS MACHINE, read here so the answer is a line in `just health` instead of a probe somebody
  # remembers to run (a run that answers while this number stands still is a run that left the machine).
  engine_stats: '~/.omlx/stats.json#total_requests'
  env_defaults_doc: 'https://goose-docs.ai/docs/guides/environment-variables.md#session-management'

#: LAYER 1 <-> LAYER 2. The invariant: what the harness is TOLD equals what the server SERVES.
# ── THE FACTS A DECISION NAMES ABOUT A HARNESS HOME, READ BACK (T-157 / D-3044) ──────────────────────
# Each fact is declared ONCE here: the home (by pointer), the KEY to read inside it, what the declaration
# says it must hold (a '@config/...' pointer, a literal, or null = not decided yet), who decided it and
# which row owns a disagreement. scripts/check_harness_homes.py reads these back and reports
# BOUND / CONFLICT / WAITING-ON-A-HUMAN-WORD; a reversal is a READING there and not a discovery (T-157).
home_facts:
  # MEASURED 2026-10-15: the home read custom_deepseek while BUG-243 (CLOSED) rested on
  # 'active_provider=maxwell_omlx' and D-295 recorded the same remedy. MEASURED 2026-10-16 (T-174): a
  # headless run answered without the engine counter moving, which is the consequence of this fact.
  - id: active_provider
    home: harness_config
    key: active_provider
    must_equal: '@config/engine.yaml#harnesses.goose_provider_id'
    decided_by: [D-295, D-3023, D-3044]
    row: T-174
    because: >-
      the everyday path (an app launch that never passes through pipeline/harness_env.py) must bind the
      engine that owns the models; a harness home that says otherwise is a session that can leave the
      machine while every declaration in this repository looks right.
  # The model the client serves for the agent loop is a ROLE that config/model_assignments.yaml owns
  # (harness_roles.AGENT_LOOP_SHORT: the only served model measured routable for an interactive loop).
  - id: harness_model_pin
    home: harness_config
    key: 'providers.<provider>.model'
    must_equal: '@config/model_assignments.yaml#harness_roles.AGENT_LOOP_SHORT.model'
    decided_by: [D-3044]
    row: T-174
    because: >-
      a client pinned to a model the role does not name runs the agent loop on the role's KNOWN worst
      axis (MEASURED: the coder model collapses over a long context, DELEGATE-002).
  # The escalation route must stay REACHABLE and must never be the ACTIVE provider: one fact says which
  # provider is the exception (engine.yaml#harnesses), this one says it is still enabled in the client.
  - id: escalation_provider_reachable
    home: harness_config
    key: 'providers.<escalation_provider>.enabled'
    must_equal: true
    decided_by: [D-3023, D-3044]
    row: T-174
    because: >-
      D-3023: a cloud token is an ESCALATION, so the route is kept enabled (an escalation that cannot be
      taken is not one) while fact #1 keeps it out of the default. Removing it would make the escalation
      impossible; leaving it ACTIVE is what T-174 fixed.
  # ── BUG-854/T-135: the two knobs the safe phase binds, read back from the SAME home the writer writes. Before
  # these facts the two values were readable ONLY from the script that wrote them - a declaration nothing compares
  # is a claim (D-3034), so each knob now has a home_fact and scripts/check_harness_homes.py reads it back.
  - id: safe_phase_nvidia_off
    home: harness_config
    key: 'providers.nvidia.enabled'
    must_equal: '@config/agent_context.yaml#ratified.knobs.safe_phase.nvidia_enabled.value'
    decided_by: [D-3023, D-3049]
    row: T-135
    because: >-
      C1: the everyday path must not hold an accelerator route open. The writer sets it; this fact reads it back
      from the client's own home, so a hand-edit that switched it on again would be a READING, not a discovery.
  - id: safe_phase_thinking_effort
    home: harness_config
    key: 'GOOSE_THINKING_EFFORT'
    must_equal: '@config/agent_context.yaml#ratified.knobs.safe_phase.thinking_effort.value'
    decided_by: [D-3049]
    row: T-135
    because: >-
      the effort tier is what the safe phase lowered and nothing but the writer's own constant recorded it
      (BUG-854). BOUND here means the client home and the declaration agree about the thought budget.

parity_rule:
  statement: 'served_window == declared_context_limit for every model the harness may run'
  on_served_below_declared: truncation_risk     # the harness builds a prompt the server cannot attend to
  on_declared_below_served: wasted_window       # the harness compacts early and throws away usable context
  on_missing_either_side: unverifiable          # a model with no served window is not a routable slot
  fault_rc: 2                                   # the probe's rc when the rule is broken
  #: A window is REACHABLE or it is not, and reachability is measured, never inferred from the
  #: global sampling setting: MEASURED 2026-10-14, a 50082-token prompt on a 131072-declared model
  #: was accepted whole, so the server's global context setting does not cap an input.
  reachability_evidence: 'prompt_tokens echoed by the server for a prompt LARGER than the setting'

#: LAYER 3. The trigger is derived, never guessed. `cloud_cap` is declared so that the day a local run
#: is capped by a cloud price tier, the config says so instead of the default silently binding.
trigger:
  formula: 'min(threshold * window, cap)'
  threshold_env: GOOSE_AUTO_COMPACT_THRESHOLD
  threshold_default: 0.8
  cap_env: GOOSE_AUTO_COMPACT_TOKEN_LIMIT
  cap_default: 225000
  cap_origin: 'cloud price tier (OpenAI long-context), meaningless locally (C1/C22)'
  window_override_env: GOOSE_CONTEXT_LIMIT      # main model context limit; default model-specific or 128000
  ollama_input_limit_env: GOOSE_INPUT_LIMIT      # maps to num_ctx for ollama requests
  tool_cutoff_env: GOOSE_TOOL_CALL_CUTOFF        # full-detail tool calls kept before older output is summarized
  strategy_env: GOOSE_CONTEXT_STRATEGY
  #: DECLARED HEADROOM. Compaction must fire BEFORE the window is full (the request that triggers
  #: compaction is itself large) and late enough that one session compacts once, not five times.
  min_headroom_tokens: 2048
  max_compactions_per_session: 1
  #: THE TRIGGER IS CONDITIONAL ON THE CACHE, and this is the whole of T-132's second knob.
  #: With a PROVEN cache, growth is nearly free and the threshold may sit at the window's edge.
  #: HISTORY (superseded 2026-10-17 by BUG-885): while the cache was DISPROVEN the threshold had to
  #: satisfy the LATENCY budget (threshold <= per_turn_budget_s * measured_prefill_tps / window),
  #: because every turn re-prefilled the whole prompt. MEASURED 2026-10-14, the default 0.8 was right
  #: for the FASTEST local model BY COINCIDENCE (0.8 x 32768 = 26214, 26214/455 = 58 s <= 60 s) and
  #: wrong for every other. BUG-885 PROVED the prefix cache (22.2x on a 26,240-token prefix), so the
  #: threshold now rises toward the window and is capped only by the min_headroom_tokens headroom.
  cache_conditional:
    cache_proven: 'threshold = (window - min_headroom_tokens) / window = 0.94; growth is nearly free (BUG-885 PROVEN 2026-10-17)'
    cache_disproven: 'threshold = min(0.8 x window, per_turn_budget_s x measured_prefill_tps)'
    measured_state: cache_proven
  #: A compaction is the MOST EXPENSIVE single act the harness performs on a local model: it rewrites
  #: the prefix, so the next turn pays a full COLD re-prefill of the summary AND the summary is lossy.
  #: A DECLARED HANDOFF read at the head of a FRESH session is a SHORTER, byte-stable prefix: cheaper,
  #: auditable, and local (C3). Prefer it, and keep the harness's compaction as the fallback.
  prefer: declared_handoff_over_in_place_compaction
  handoff_home: 'governance/session_plan_*.yaml + the session-resume skill'

#: ── RATIFIED 2026-10-15 (owner: "Approve your ... T-132 recommendation") ──────────────────────────

#: ── THE CLIENT NAMES A PIPELINE WORKER MUST NOT INHERIT (T-175 / D-3046) ───────────────────────────────
#: MEASURED 2026-10-16: pipeline/parallel.py dropped two client knobs by their LITERAL names inside a worker
#: initializer, which is what made the deterministic core read as a hand-bound client coupling on the adapter
#: surface (config/agent_surface.yaml#adapter.binding_sites, row T-175). The BEHAVIOUR was right and it stays: a
#: worker is not a session, and a harness binding leaking into a batch worker is a routing fact nobody declared.
#: The NAMES now live here, each with the reason that keeps it here; the ONE reader is
#: pipeline/harness_env.py#worker_strip, and the list is read in the PARENT so an unreadable declaration fails
#: loudly instead of inside a forked worker.
worker_env:
  strip:
    GOOSE_PROVIDER: >-
      a worker's model call is routed by the pipeline (config/model_assignments.yaml), never by a client
      binding: a worker that inherited one would answer as the session it was forked from.
    GOOSE_THINKING_EFFORT: >-
      thinking mode is a SESSION's knob. A batch worker pays its whole prompt again (the cache is DISPROVEN,
      BUG-792) and gets nothing from a deeper thought budget it never asked for.
  #: A name with no reason is a name nobody can remove: pipeline/harness_env.py --selftest refuses an entry that
  #: is not an env-shaped name or carries no reason (the same rule the accepted-debt declarations carry, D-3043).

#: THE TWO KNOBS AN AGENT MUST NEVER CHOOSE FOR ITSELF are now DECLARED rather than inherited. Both values
#: are the measurement's, not a preference's, and both are reversible by one word.
ratified:
  date: '2026-10-15'
  by: owner
  basis: 'the per-turn budget is the owner''s knob; the trigger is derived from it and from the served window'
  knobs:
    per_turn_budget_s: 90      # agent_loop class. RAISED 60 -> 90 on 2026-10-15 with T-132 approved. The only
                               # agent_loop-capable model measured 54.7 s against the 60 s budget - a 5.3 s margin - while the
                               # pool was crowded and adaptive_prefill_throttle was evicting a resident model mid-request
                               # (BUG-803). The budget was failed by RESIDENCY, not by the model. Return to 60 when a
                               # pre-turn eviction policy exists AND the bill is re-measured on an uncrowded pool.
                               # MEASURED consequences at 60 s, routing UNCHANGED: the loop is the 4B;
                               # at 180 s gpt-oss-20b becomes usable (26214/210 = 125 s); no budget
                               # makes Qwen3.8-27B one (26214/39 = 672 s)
    trigger:
      GOOSE_CONTEXT_LIMIT: 32768              # declare the SERVED window; never inherit 128000
      GOOSE_AUTO_COMPACT_THRESHOLD: 0.94      # = (32768-2048)/32768 = 0.9375; cache PROVEN (BUG-885), so the
                                              # trigger rises to leave exactly min_headroom_tokens (2048) of cold-prefill headroom
      GOOSE_AUTO_COMPACT_TOKEN_LIMIT: 32768   # the 225000 default is a cloud price-tier artifact (C1/C22)
      # 2026-10-15 (T-132 addendum): a harness's IDENTITY is part of its context contract. Measured:
      # goose run -t answered while the local engine's counter stood still - a declared provider is not
      # a bound one. These two names are what make a headless run provably local (C1/C3).
      GOOSE_PROVIDER: "@config/engine.yaml#harnesses.goose_provider_id"
      GOOSE_MODEL: "@config/model_assignments.yaml#harness_roles.AGENT_LOOP_SHORT.model"
      max_compactions_per_session: 1
      min_headroom_tokens: 2048
      strategy: declared_handoff_first    # declared_handoff_over_in_place_compaction (above)
    # ── BUG-854/T-135 (2026-10-16): THE TWO VALUES THE SAFE PHASE WRITES ────────────────────────────────────
    # A value a client will OBEY may not be a constant inside the script that writes it - that was the C12 defect
    # one layer below the one T-175 fixed (the writer stopped CONSTRUCTING a home and still OWNED two values). The
    # writer now READS both from here through the ONE resolver, so a future decision about the thinking budget
    # moves THIS line and the writer follows. Strings, not YAML booleans: the value is written into a client home
    # as TEXT, and str(False) would spell "False" into a field that expects "false".
    safe_phase:
      nvidia_enabled:
        value: 'false'
        key: 'providers.nvidia.enabled'
        why: 'this engine owns no NVIDIA tier, so an accelerator route can only spend money and add a failure mode (C1) - the safe phase switches it off, and the reason lives here instead of in a constant'
      thinking_effort:
        value: 'medium'
        key: 'GOOSE_THINKING_EFFORT'
        why: 'a thought on a LOCAL engine is prefill seconds nobody bills for, so the safe phase lowers the effort while the block cache was unproven (F6/BUG-792) — MEASURED 2026-10-17 (BUG-885): the cache is PROVEN (22.2x, cached 26,237/26,240 on a 26,240-token prefix), so this line is no longer blocked by evidence and MOVING it is an owner decision, not a correction; the value stays medium until that word'
  binding:                       # T-132/D-3003: a declaration that is not in the environment is a comment.
                                 # The executor is a SIBLING of the knobs it binds and is named by them, so the
                                 # declaration cannot drift from the thing that executes it.
    script: pipeline/harness_env.py
    state: 'BOUND-BY-SCRIPT - the values under knobs are read from this file at run time and never restated (C12)'
    owner_command: 'eval "$(python3 pipeline/harness_env.py --print)"'
    ladder: 'python3 pipeline/harness_env.py --check -> 0 every name bound, 2 OWNER-OWED, 1 fatal on CONFLICT'
  revisit_when: 'FIRED 2026-10-17 (BUG-885) - the block cache IS PROVEN: `agent_context_probe.py --prefill-ab` read
                 cached 26,237/26,240 and 22.2x against a 5.0x bar, on BUG-792''s own protocol. With growth nearly
                 free the threshold MAY rise toward the window, and that rise is now a DECISION for the owner (it
                 buys decode time per turn and costs a longer prefix to refresh whenever the head changes, BUG-872);
                 nothing here moved automatically, because a fired trigger is a question, never an edit'

#: LAYER 4. Cache accounting. A ratio is computed ONLY over rows that CARRY the field; the rows that do
#: not are counted and REPORTED as unknown. A fabricated 0 is BUG-767's defect class, not a measurement.
cache_accounting:
  field: cache_read_tokens                                   # the HARNESS's ledger (goose sessions.db)
  served_field: 'usage.prompt_tokens_details.cached_tokens'  # the SERVER's own counter (the vocabulary
                                                             #   of the thing that actually reuses a prefix)
  input_field: input_tokens
  absent_is_not_zero: true
  decision: D-2957
  min_calls_for_a_ratio: 20        # below this the ratio is reported as inconclusive, never as a number
  proof:
    method: 'two-call A/B on ONE resident model with a BYTE-IDENTICAL prefix (the server echoes the reused count)'
    min_speedup: 5.0               # below this, prefix reuse is UNPROVEN and every ledger field is UNTRUSTED
    measured_reference: '6.1 s warm vs 268 s cold = 44x (the referenced walkthrough, same session, same model)'
    status: DISPROVEN_20261014__REMEASURED_PASSING_20261016   # BUG-872: this DISPROOF is stale; a LIVE prefix cache is measured below.
    remeasured_20261016:                      # BUG-872. Read-only, same host, declared protocol, byte-identical prefix.
      probe: 'python3 scripts/agent_context_probe.py --prefill-ab  (the DECLARED rail; no scratch script)'
      protocol: 'three calls per model, byte-identical 2,616-token prefix, max_tokens=32, temperature=0.0'
      gemma-4-E4B-it-MLX-4bit:
        cold_wall_s: 6.90
        warm_wall_s: [0.39, 0.16]
        cached_tokens: [0, 2613, 2613]
        prompt_tokens: 2616
        prefill_rate_cold_tok_s: 379
        speedup_cold_to_warm: 25.01            # declared bar is min_speedup 5.0 -> PASSES BY 5x
      Qwen3.8-27B-MLX-4bit:
        cold_wall_s: [81.01, 111.14]           # the SECOND call was SLOWER than the first
        warm_wall_s: 2.87
        cached_tokens: [0, 0, 2612]
        prompt_tokens: 2619
        prefill_rate_cold_tok_s: 32
        speedup_cold_to_warm: 1.42             # fails the bar, but only because cold is catastrophic
      server_evidence: >-
        ~/.omlx/logs/server.log, 2026-10-16 22:43: "Reserved prefill capacity for 5847 tokens across 4
        caches", "Using boundary cache snapshot ... storing 5844/6111 tokens (tail terminal, 11 intermediate
        snapshots)", "Cache phase timings: ... prefix_cache_lookup=33.9ms/53". The subsystem is not merely
        present, it is LOOKING THINGS UP.
      why_it_changed_not_guessed: >-
        pipeline/omlx_cache_enable.sh (F6/BUG-792 ACT 3) records that "cache.enabled is false in the live
        settings"; ~/.omlx/settings.json now reads cache.enabled = true, hot_cache_max_size 8GB,
        gdn_ssd_split_enabled true, ssd_cache_dir ~/.omlx/ssd_cache, initial_cache_blocks 256. So the SETTING
        changed and the ENABLING ACT must be located before any cause is named - cause_state stays UNVERIFIED
        until it is. The 2026-10-14 conclusion below is NOT deleted: it was true of that version, which is the
        point of keeping it.
      active_parameters_rule: >-
        MEASURED, and it corrects this file's OWN ranking: prefill cost tracks ACTIVE parameters, not total.
        The dense 27B (262144 window) is 12-15x SLOWER per prompt token than the 4B E4B, so "a bigger window
        is faster" is FALSE here, and a two-sided (window x prefill bill) ranking MUST take the
        active-parameter count as the bill's FIRST term. The resident MoE arms
        (gemma-4-26B-A4B-it-OptiQ-4bit, Qwen3.6-35B-A3B-4bit, ~3-4B active) therefore read as 4B-class bills
        with larger-model capacity - the correct candidates for a HARNESS LOOP - and NONE is currently
        exposed to goose: ~/.omlx/model_settings.json and custom_providers/maxwell_omlx.json disagree on the
        model set, which is what the parity_rule block above exists to catch.
      conclusion: >-
        SUPERSEDED 2026-10-16. Prefix reuse is LIVE on this machine and PASSES the declared bar by 5x. The
        honest model of a local turn is therefore NOT "every turn pre-pays its whole prompt": it is "the FIRST
        turn of a prefix pays the prompt; every later turn on the same prefix is nearly free". Two consequences
        the cache-free doctrine had inverted: (1) the binding constraint is no longer prefill throughput but
        PREFIX STABILITY - one byte changed at the head converts a 0.16 s turn back into a 6.9 s turn;
        (2) COMPACTION IS NOW THE MOST EXPENSIVE EVENT IN A SESSION, because rewriting the history destroys a
        live cache and re-prefills the summary cold. THAT is the mechanism that made a session capped at 32768
        feel both frequently compacted AND slow: every compaction threw away a ~25x cheaper prefix. Shorter
        prompts and fewer requests remain good hygiene; they are no longer the ONLY lever.
    measured_20261014:
      identical_prefix_calls: 12
      arms: ['large fixed SYSTEM block', 'large fixed USER block', 'large SYSTEM block with a per-call nonce at its head']
      prefix_tokens: [4466, 4468, 5358]
      cached_tokens_every_call: 0
      speedup_measured: 1.01
      prefill_repayed_per_call: 'the full prefix, every call (~9.8 s for ~4.5 k tokens on the fastest local model)'
      the_one_nonzero: >-
        a single cached_tokens=4096 appeared immediately after a model LOAD - i.e. the reuse mechanism is a
        4096-token BLOCK cache, and 4096 is its block boundary. That is the cache this machine has switched OFF.
      cause_candidate: 'the server settings declare the paged block cache disabled (the D2460 thrash guard is a RAIL that refuses inference when it is on)'
      cause_state: UNVERIFIED            # a candidate, not a finding: the flag is refused by declaration, and flipping it re-opens a measured regression
      re_test_rung: >-
        ONE variable at a time under a declared protocol with a decode-rate oracle (the D2460 baseline is a
        decode collapse; a re-test that cannot red on the collapse is not a re-test), never a hunch-driven flip
      conclusion: >-
        prefix reuse is DISPROVEN on this machine today, so the honest model of a local turn is
        "every turn pre-pays its whole prompt". Every prefill optimisation must therefore be CACHE-FREE:
        fewer requests per unit of work, shorter prompts, and a model whose throughput can pay the bill.
      superseded_by: remeasured_20261016        # ADDED 2026-10-16 (BUG-872). The text above is NOT rewritten.

#: PREFIX STABILITY. The invariant that makes prefill cheap, and the three ways this harness breaks it.
prefix_stability:
  invariant: 'the prompt PREFIX is byte-stable across turns; only the TAIL may change'
  stable: [system_prompt, tool_definitions, extension_set, project_hints]
  volatile_allowed_at_tail: [user_turn, tool_result, per_turn_injection]
  hazards:
    - id: compaction_rewrites_the_prefix
      why: 'a compaction replaces the whole history, so the next call re-prefills the summary cold'
    - id: per_turn_injection_at_the_head
      why: >-
        the `tom` extension injects context "into every turn" (GOOSE_MOIM_MESSAGE_TEXT /
        GOOSE_MOIM_MESSAGE_FILE). Injected at the HEAD it changes the prefix every turn and NO turn can
        ever hit the cache; injected at the TAIL it is free. MEASURED: neither variable is set today.
    - id: dynamic_head_content
      why: >-
        timestamps, git status or a rotating file list inside the system prompt / project hints make
        the prefix unique per turn. A per-turn block belongs in the TAIL (a turn-context block is
        exactly this shape and must never be prepended).
    - id: no_cache_behind_a_stable_prefix
      state: RESOLVED_MEASURED_20261016          # BUG-872: cached 2613 of 2616 -> the cache behind a stable prefix is LIVE
      why: >-
        RESOLVED, and kept because the LESSON is the durable part. A byte-stable prefix is NECESSARY and NOT
        SUFFICIENT: on 2026-10-14 twelve calls with an identical prefix reused nothing; on 2026-10-16 three
        calls reused 2613 of 2616 tokens at 25.01x. A stability claim without an A/B is a claim about the
        prompt, not about the machine - and a CACHE claim without a RE-MEASUREMENT is a claim about a VERSION.
        The hazard survives as: a stale measurement must be re-run before any doctrine or ranking rests on it.
    - id: compaction_destroys_a_live_cache    # NEW 2026-10-16 (BUG-872). The most expensive event in a session.
      why: >-
        MEASURED: a warm turn on a stable prefix costs 0.16-0.39 s and a cold one 6.90 s on the SAME prompt.
        A compaction REPLACES THE WHOLE HISTORY, so the next call re-prefills the summary cold and every turn
        after it keeps paying until the prefix stabilises again. This is why a session capped at 32768 felt
        BOTH repeatedly compacted AND slow: the cap forced compactions, and each compaction threw away a prefix
        ~25x cheaper to reuse than to re-read. The counter-measure is the wall itself - do not cap, compact
        rarely, and never compact a prefix that is still being appended to.
  injection_envs: [GOOSE_MOIM_MESSAGE_TEXT, GOOSE_MOIM_MESSAGE_FILE]   # the per-turn injection homes
  verification: 'the probe prints the hazards it can measure from the live config and names the rest as UNVERIFIED'

#: TOOL RESULTS are where an agent's context actually goes. Two knobs, one on each side of the wire.
tool_results:
  harness: {env: GOOSE_TOOL_CALL_CUTOFF, default: 'computed from window and threshold'}
  server: {home: '~/.omlx/model_settings.json#models.<model>.max_tool_result_tokens', measured_default: 4096}
  rule: 'older tool output is summarized, the recent calls stay in full detail'

#: LAYER 5. THE PREFILL BILL. A window is not a budget. An agent turn pays
#: `working_set / prefill_tps` seconds BEFORE a single token is decoded, and with the cache disproven
#: it pays it again on the next turn. A model is routable to a class only if it satisfies BOTH sides.
prefill_budget:
  predicate: 'window >= class.min_window AND prefill_seconds(class.working_set) <= class.prefill_budget_s'
  prefill_seconds: 'prompt_tokens / measured_prefill_tps'
  working_set: 'the class names the prompt size it must be able to pay for (not the window it may grow to)'
  measured_tps_field: 'usage.prompt_tokens_per_second   (the server''s own counter, read back from a real call)'
  unknown_tps: refuse_route        # an unmeasured model is not routable: fail-closed, never optimistic
  rule_estimate_is_not_a_measurement: >-
    a prefill cost, a prompt size or a reuse ratio is read from the SERVER'S OWN COUNTERS. A
    chars-per-token rule is a guess wearing a number's clothes, and on 2026-10-14 such a guess produced a
    "truncation" that did not exist (BUG-794). A claim whose input was estimated is refused, not reported.
  ab_probe:
    mode: '--prefill-ab'
    sends: 'THREE calls: one to warm nothing, one on the same prefix (the A/B), one on the same prefix on a DIFFERENT model (the control)'
    ladder: false               # declared OFF the ladder: a rail that needs the network must not gate a build
    why: 'the only certification of REUSE is two calls on one cold process with one identical prefix'
    filler: 'the quick brown fox jumps over the lazy dog. '
    # BUG-1044 (MEASURED 2026-10-27): the cold-prefill probe's prompt was byte-identical between
    # runs, and the engine's prefix cache served the second call in 0.54 s against 39.22 s cold for
    # the same 2060-token prompt -- a ~70x phantom speedup. Every call now prepends this tag.
    nonce_chars: 32
    filler_tokens_measured: 10          # MEASURED: the unit above is EXACTLY ten tokens
    chars_per_token_measured: 4.5       # 45 chars / 10 tokens. The first draft assumed 4.0, published a
                                        # truncation that did not exist, and was retracted the same day (BUG-794)
    control_model: Phi-4-mini-instruct-8bit   # the same prefix on a DIFFERENT model must not be reused

#: THE WINDOW CLASSES. Routing is declared and TWO-SIDED: a class names the minimum served window an
#: agent LOOP may run on AND the prompt size it must be able to pay for inside the latency budget.
classes:
  agent_loop:
    min_window: 32768
    working_set: 26214
    prefill_budget_s: 60
    # ── T-154 (BUG-828): the CLASS's own turn bound. The BUDGET is the owner's
    # (ratified.knobs.per_turn_budget_s); what a class adds is how long its SILENCE may last, how many
    # turns it may take, and where its transcript goes. Every number here is CHECKED against a
    # measurement by pipeline/subagent_fanout.py doctor - a bound nobody can check is BUG-828.
    workstream_class: true             # a class a workstream may run AS (the runner resolves it)
    max_turns: 3                       # MEASURED: the 2026-10-15 guard review took 3 model turns (20/18/521 tokens)
    stall_s: 120                       # DERIVED FLOOR: > longest_turn_measured_s x stall_margin (45.58 x 2 = 91.2)
    timeout_guard: agent_timeout_s     # the declared wall this class's workstream is bounded by (engine.yaml)
    transcript_in_ws: true             # a harness streams a transcript WHILE it works; count it, inside the ws
    env:                               # what the class's child MUST have bound. ONE home: the runner
      PI_CODING_AGENT_DIR: '{ws}/agent'   # (pipeline/research_run.py) and the deploy line both read THIS.
    evidence:                          # (pi honours it - `pi --help`: "Config directory (default: ~/.pi/agent)")
      longest_turn_measured_s: 45.58   # MEASURED 2026-10-15 harness_20261015a: 521 tokens @ 27.4 tok/s, prompt 12438
      longest_turn_measured_on: 'harness_20261015a, gemma-4-E4B-it-MLX-4bit'
      source: '~/.omlx/logs/server.log - the "Chat completion" line of each turn'
    why: >-
      LOWERED FROM 131072 on the same day it was written, before ratification, because the first number
      selected on window ARITHMETIC and the measurement says the binding constraint is the prefill BILL:
      at the measured throughputs a 131072-token turn costs ~56 minutes on the 27B and ~10 minutes on the
      20B, so no local model can hold a loop at that size. A loop is a SMALL working set paid REPEATEDLY.
  agent_loop_patient:
    min_window: 32768
    working_set: 26214
    prefill_budget_s: 120
    # ── T-212: the agent_loop's OWN second point - the OWNER's ratified per-turn prefill budget, beside the
    # aspirational 60s point above. SAME working set; the two classes differ ONLY in the latency ceiling,
    # because a loop is one role with more than one acceptable turn length and quietly re-budgeting the 60s
    # point is the class of defect this repo keeps finding. `patient` names the latency the owner will accept
    # per turn, never a different context size.
    workstream_class: false           # a PRICING point, not a runner-resolved class: the runner never INFERS a
    max_turns: 1                      # class from budget bytes (BUG-828). It declares what a 26k loop turn COSTS,
    stall_s: 120                      # not that a workstream may run AS it - that claim needs T-214's dependent chain.
    transcript_in_ws: false
    timeout_guard: default_timeout_s
    env: {}
    evidence:
      owner_number_s: 120             # T-212: the OWNER's ONE number (approved 2026-10-27), never a measurement
      required_prefill_tps: 218.45    # DERIVED: working_set / budget = 26214 / 120 - the rate a model must beat
      admits_at_class_context: [gemma-4-E4B-it-MLX-4bit, MiniCPM5-2B-MLX, Ornith-1.5-35B-A3B-REAP-19B]
      # ⚠️ THIS LIST IS A PREFILL READING AND NOTHING ELSE (D-3200 clause 5, added 2026-10-27). It answers ONE
      # question - can this model pay a 26,214-token turn inside 120s - and it says NOTHING about whether its tool
      # calls ARRIVE. MEASURED the same day: gpt-oss-20b passes every capability gate it was given and still loses
      # 3 of 16 calls to a harmony parse failure, so an admission here must never be read as "may drive a loop".
      # The emission axis is `scripts/harmony_red_loop.py`, and a model RED there may not hold an AGENT_LOOP_* role.
      emission_axis: 'scripts/harmony_red_loop.py (T-213/D-3200) - a model RED there is not admitted by this list'
      source: 'D-3199 / T-209 closure / calibration_receipts.jsonl rows 35-36'
    why: >-
      THE SECOND POINT T-212 OWED. The 60s point above is a budget no served model pays at 26,214 tokens
      (best class-context reading 417.67 tok/s = 62.8s), so the class declared exactly one thing a loop is
      NOT at that size. The owner ratified 120s as the longest prefill a loop turn may spend; at 26,214
      tokens that needs 218.45 tok/s and is paid by gemma (62.8s), MiniCPM5 (88.8s) and Ornith-REAP (90.7s)
      on class-context readings - and not by the batch models (Ornith-9B 185.4s, MTP4 611.2s, Qwen3.8-27B
      672.2s). The two classes are ONE curve: fast (60s, a target) and patient (120s, ratified).
  agent_probe:
    min_window: 32768
    working_set: 32768
    prefill_budget_s: 600
    workstream_class: true             # T-154: the class a one-shot delegation runs as
    max_turns: 1
    stall_s: 45
    transcript_in_ws: false            # a one-shot writes one answer at the end; the report+log are its progress
    timeout_guard: default_timeout_s
    env: {}
    evidence:
      longest_turn_measured_s: 17.0    # MEASURED 2026-10-15: oneshots answered in 0.4-17 s
      longest_turn_measured_on: 'fanout oneshot runs, 2026-10-15'
      source: 'temp/runs/*/state.json elapsed_s, one-shot delegations'
    why: 'single-question delegation: summarize WITH source, review a diff, one classification, one long read'
  pipeline_batch:
    min_window: 32768
    working_set: 32768
    prefill_budget_s: 3600
    workstream_class: false            # NOT a workstream class: the pipeline calls the model itself (D-3016),
    max_turns: 1                       # so the runner never resolves it and no stall threshold is claimed here
    stall_s: 45
    transcript_in_ws: false
    timeout_guard: default_timeout_s
    env: {}
    why: 'bounded prompt, one answer, no history (the pipeline never re-sends a prefix it grew)'

#: ── THE WORKSTREAM CONTRACT (T-154). What a runner may claim, and what it must refuse. ONE home: both
#: halves of the delegation machinery read THIS - pipeline/research_run.py (the runner) and
#: pipeline/subagent_fanout.py (the front door). An undeclared mode or an unclaimed class is FATAL: the
#: runner never INFERS a class from the command bytes, because inference is how a harness came to be
#: measured against a script's threshold (BUG-828).
workstreams:
  default_class: agent_probe                  # an ad-hoc workstream with no declared class is a one-shot
  mode_class:
    oneshot: agent_probe                      # one deterministic call, temp 0.0, no tools
    agent: agent_loop                         # goose run -t: HAS tools, streams, and costs minutes
    harness: agent_loop                       # an engine-launched coding harness (pi/claude): the streaming class
  harness_cmd_markers: ['omlx launch ']       # a command carrying one of these MUST run as a transcript-bound class
  env_placeholders: ['{ws}', '{run}']         # the only substitutions a class env may use; both resolve INSIDE the ws

#: ── T-154 / BUG-828: THE PER-TURN CEILING IS DERIVED, NEVER PICKED (D-3027) ────────────────────────
#: WHAT WAS MEASURED, and why this block exists: pi sends `max_tokens=None` (83 of 83 gemma calls in the
#: engine log carried `request_max_tokens=None`), so the class inherits the model's global 32768 - about
#: 20 minutes of decode at 27.4 tok/s against the owner's 90 s per-turn knob. The bound that actually bit
#: was the WORKSTREAM WALL, which is why a wall nobody derived is a wall nobody can defend. Everything
#: below is a named SOURCE plus a FORMULA: no number here is chosen, and the checker recomputes each one.
turn_budget:
  budget_home: 'ratified.knobs.per_turn_budget_s'      # the owner's knob - the ONE home for the budget
  formula: 'max_tokens_per_turn(model) = floor(per_turn_budget_s * conservative_decode_tps(model))'
  #: AMENDED 2026-10-27 (D-3203 / BUG-1081). The formula used to say `decode_tps(model)` - the cell's POINT
  #: ESTIMATE - and MEASURED 20:10 that grant (3753 tokens for gpt-oss) ran 96.00 s against the ratified 90 s,
  #: 6.7% OVER, because the turn actually decoded at 39.1 tok/s (engine log line 9641; receipt
  #: governance/evidence/HARMONY_RED_LOOP_20261027_ALLOWANCE_3753_BLANKECHO.json). The rate is therefore the
  #: CONSERVATIVE reading declared in the same cell - min(decode_tps, previous), 41.7/33 -> 33, ceiling 2970 - which
  #: fits the wall by construction. A rate is a READING (D-3199); a grant must be priced on the one that cannot
  #: overshoot.
  conservative_rate: 'min(decode_tps, previous) where both are declared in the cell; the point estimate when only
                     one is'
  decode_source: 'measured_decode_20261015.decode_tps'  # measured, size-declared where it matters
  #: WHO CONSUMES THE DERIVATION - named, because a formula with no reader is a comment (D-3034). Both loop
  #: instruments read it through measure_subagent_loop.instrument_allowance(model); neither may hold a literal
  #: (BUG-1081, and both --selftest suites assert the literal can never come back).
  consumed_by:
  - 'scripts/measure_subagent_loop.py#instrument_allowance / instrument_max_tokens'
  - 'scripts/harmony_red_loop.py#run_model (the T-213 gate)'
  unmeasured_model: >-
    A served model with NO reading in decode_source is granted the LARGEST derived ceiling the table can pay,
    labelled PROVISIONAL_CEILING in its row and its receipt with a named reason - never a default (C16). A PASS at
    such a grant is safe; a FAIL at it is never a reading about the model. Its cost is BUG-1087.
  stall_rule: 'stall_s(class) > longest_turn_measured_s(class) * stall_margin'
  stall_margin: 2.0
  wall_rule: 'guards[timeout_guard] >= max_turns * per_turn_budget_s'
  #: The wall uses the OWNER'S per-turn budget and the class's declared turn count, and NOTHING ELSE. A
  #: prefill term was drafted here and RETRACTED the moment it was computed: a class's `working_set` is the
  #: prompt size it must be able to PAY FOR (a routing gate the prefill bill already owns), not the prompt
  #: it actually sends, so adding `working_set/prefill_tps` to the wall inflated a 15 s one-shot class into
  #: a 690 s wall and contradicted a guard that is measurably right. An estimate dressed as a derivation
  #: is BUG-794's defect, so the derivation keeps only terms that are declared facts.
  ceiling_declared_source: '@config/engine.yaml#fanout.default_max_tokens'   # what a ONE-SHOT caller passes itself
  bindings:                          # A DERIVED CEILING IS NOT A BOUND CEILING (T-132: declared is not bound)
    oneshot: 'the caller passes it: pipeline/oneshot_ask.py --max-tokens (fanout.guards.default_max_tokens)'
    harness: '~/.omlx/model_settings.json#models.<model>.max_tokens - the server''s OWN per-model fallback,
              which is what a caller that sends none receives (server.py: request > per-model > global)'
  bind_state_20261015: 'UNBOUND for the harness class: model_settings.json#models is EMPTY, so the pi class
                        still inherits sampling.max_tokens=32768. Binding it is an OWNER act on the live
                        server''s home, not a silent edit - see the checker''s tri-state report.'
  why_derived: >-
    A budget a model can raise is not a budget, and a budget a model RATES is a measurement this repo does
    not have: decode is not the binding axis (every served model answers 320 tokens in 2-13 s) while prefill
    is, and a self-rated difficulty optimises the axis that does not bind (D-3027).

routing:
  rule: 'select the MOST capable class the model satisfies on BOTH sides (window and prefill bill); first-declared wins a tie'
  floor_note: >-
    window_class() is the FLOOR a class declares, never the decision: a model with a large window and a
    small throughput satisfies the floor and fails the bill. The decision is routable_classes().
  #: MEASURED 2026-10-14 against the declared 60-second per-turn budget: ONE model qualifies for a loop.
  measured_routable_20261014:
    superseded_20261027: >-
      BOTH LISTS BELOW ARE HISTORY AND THE agent_loop LINE IS REFUTED, not merely old. gemma-4-E4B was routed
      here on a 4,468-token reading of 455 tok/s (26214 / 455 = 58 s, under the 60 s budget). Measured at CLASS
      CONTEXT on 2026-10-27 the same model reads 417.67 tok/s at 26,254 prompt tokens -> 62.8 s -> prefill_bill
      (governance/calibration_receipts.jsonl row 36; D-3199 limb 2). The live route table is LAYER 5 of
      `python3 scripts/agent_context_probe.py`, which prints every bill WITH its basis; this block is kept as the
      record of what was known on 2026-10-14 (D-2642) and must not be quoted as the current routing.
    agent_loop: [gemma-4-E4B-it-MLX-4bit]                      # 26214 / 455 = 58 s  [REFUTED 2026-10-27: 62.8 s at class context]
    agent_probe: [gemma-4-E4B-it-MLX-4bit, Phi-4-mini-instruct-8bit, gpt-oss-20b-MXFP4-Q8]
    pipeline_batch: [gemma-4-E4B-it-MLX-4bit, Phi-4-mini-instruct-8bit, gpt-oss-20b-MXFP4-Q8,
                     Qwen3.8-27B-MLX-4bit]
  refused_for_a_loop_20261014:          # every line here still holds: D-3199 adds that NO served model passes
    Phi-4-mini-instruct-8bit: '26214 / 394 = 66 s — SIX SECONDS over the budget, and the budget is the owner''s knob'
    gpt-oss-20b-MXFP4-Q8: '26214 / 210 = 125 s — a usable PROBE, an unusable loop'
    Qwen3.8-27B-MLX-4bit: '26214 / 39 = 672 s — eleven minutes per turn; no budget makes this a loop'

#: ── MEASURED 2026-10-15: THE DECODE AXIS, and the refinement it forced ────────────────────────────
#: METHOD: two calls, ONE prompt, two max_tokens (64/320) -> decode_tps = (c2-c1)/(t2-t1). No streamed
#: TTFT is trusted (it measured 0.044 vs 0.025 s in the 2026-10-14 probe). The 2026-10-14 prefill
#: column is kept BESIDE the new decode column and the two are not mixed: a slope does not need a
#: first-token time, and it is why decode could be measured at all on a 36-token prompt.
#:
#: THE REFINEMENT: prefill_tps is a FUNCTION OF PROMPT SIZE. This run's prompts were ~36 tokens while
#: the 2026-10-14 readings used ~4,468, so a prefill figure taken here is dominated by fixed kernel
#: and scheduling overhead and is NOT comparable to the baseline. A prefill reading that does not
#: declare the prompt size it was taken at is therefore INCOMPARABLE, not merely imprecise. The routing
#: tables below keep the size-declared baseline as the bill's source of truth; this axis adds the cost
#: of the ANSWER (320 tokens of decode = 2.0 s on the 49.5 tok/s model, 13.3 s on the 7.5 tok/s one).
measured_decode_20261015:
  method: 'two-point slope on one prompt (64 and 320 max_tokens), non-streaming'
  engine: 'the local server, started 2026-10-15 11:33 after a clean shutdown at 02:11 (not a crash)'
  controls: '10/10 known answers on the instrument; Phi-4-mini FAILED the implied-prefill control and its
             reading is REFUSED rather than published (the 2026-10-14 reading of 40 tok/s stands)'
  decode_tps:
    gemma-4-E4B-it-MLX-4bit: {decode_tps: 36.3, previous: 27, ratio: 1.34, agreement: REPRODUCED}
    Phi-4-mini-instruct-8bit: {decode_tps: 35.0, previous: 40, ratio: 0.88, agreement: REPRODUCED,
                              verdict: 'REFUSED — the implied prefill was negative, so the two calls disagree'}
    gpt-oss-20b-MXFP4-Q8: {decode_tps: 41.7, previous: 33, ratio: 1.26, agreement: REPRODUCED}
    Qwen3-Coder-30B-A3B-Instruct-MLX-4bit: {decode_tps: 49.5, previous: null, agreement: 'NEW (first reading)'}
    gemma-4-12B-it-qat-OptiQ-4bit: {decode_tps: 13.4, previous: null, agreement: 'NEW (first reading)'}
    Qwen3.8-27B-MLX-4bit: {decode_tps: 7.5, previous: 1.7, ratio: 4.41, agreement: DRIFTED,
                           note: 'BUG-793: 4.4x BETTER than the 2026-10-14 reading — the earlier figure was
                                  a cold/pressured state, not the model. Still the worst of the eight by 6.6x.'}
  the_conclusion_this_axis_settles: >-
    DECODE IS NOT THE BINDING CONSTRAINT. Every served model decodes the answer in 2-13 s at 320 tokens,
    and the small ACTIVE-parameter MoE (30B-A3B) decodes FASTER than the 4B dense (49.5 vs 36.3) because it
    reads only its active experts. The bill is PREFILL, which is why routing is decided on the prefill bill
    and why a bigger model with a small ACTIVE count is the shape worth buying (llmfit's MoE-aware estimates
    agree: A3B 56-59 tok/s, A4B 42, dense E4B 27.5).
  routability_after_this_run: >-
    UNCHANGED for the new candidates, and deliberately so: Qwen3-Coder-30B-A3B-Instruct-MLX-4bit and
    gemma-4-12B-it-qat-OptiQ-4bit were measured on ~36-token prompts, which cannot decide a 26214-token
    bill. They stay REFUSED a route (fail-closed) until a size-declared prefill reading exists - and that
    reading is precisely T-131's preflight cell.

#: D-3102 ENGINE A/B + THE OWED >=128-TOKEN DECODE BENCHMARK (2026-10-19). The A/B's decode column
#: (96.91 -> 222.13 tok/s) was read at max_tokens=1, i.e. a SINGLE-TOKEN artifact, and was NOT promoted.
#: The owed benchmark is now delivered: measure_prefill.py gained --max-tokens, so a real decode rate is
#: read with --max-tokens >= 128. The real Ornith-REAP-19B decode is ~39 tok/s, not 222 nor 96.
measured_engine_ab_20261019:
  d3102_adopt_rc1: true          # oMLX 0.7.1rc1 ADOPTED (load 5.9->3.68s, wall 17.7->15.8s; prefill/TTFT flat)
  decode_128_ornith_reap_19b:
    model: Ornith-1.5-35B-A3B-REAP-19B
    prompt_tokens: 4010
    max_tokens: 128
    decode_tps: 39.14            # THE REAL decode rate - corrects the 96.91/222.13 single-token artifact
    ttft_s: 0.25
    model_load_s: 6.24           # rc1 cold load
    note: >-
      the 222.13 tok/s (max_tokens=1) and the A/B's 96.91 were single-token artifacts; the real 128-token
      decode is ~39 tok/s. The prompt_tokens_per_second counter (19.88) on this same cold call is
      CONTAMINATED by the 6.24 s cold load folded into its denominator - it is NOT a canonical prefill
      reading and does not supersede measured_prefill_20261016 (155.1 warm).

#: ── THE DELEGATION CANDIDATE SET, MEASURED 2026-10-15 (HF API + llmfit, read-only) ────────────────
#: WHAT THIS IS: the pool the bench (T-131) draws from, with each row's weight bytes MEASURED from the
#: repo's own file listing and llmfit's MoE-AWARE decode estimate beside it. WHAT IT IS NOT: a route. A
#: row here is ELIGIBLE FOR THE BENCH and refused a route until a size-declared prefill reading exists.
#: RULE OF SHAPE: the machine pays for BYTES READ PER STEP, not for parameters held. A MoE with a small
#: ACTIVE count (A3B/A4B) prefills like its active size and decodes faster than a dense model of half its
#: size - MEASURED: 30B-A3B decodes 49.5 tok/s against the 4B dense's 36.3, at 6.8 GB and 17.2 GB.
candidates_20261015:
  already_served:
    gemma-4-E4B-it-MLX-4bit: {weight_gb: 6.8, class: 'agent_loop (the only one that ever passed a 60 s bill)'}
    gpt-oss-20b-MXFP4-Q8: {weight_gb: 12.1, window: 131072, decode_measured: 41.7}
    Qwen3-Coder-30B-A3B-Instruct-MLX-4bit: {weight_gb: 17.2, window: 262144, decode_measured: 49.5,
                                            shape: A3B, note: 'the strongest PREFILL-per-quality shape available here'}
