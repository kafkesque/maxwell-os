  input_fb:
    name: Constructivist Facture As Design Principle
    definition: A design principle that emphasizes the use of rough surfaces, imperfect
      materials, and honest representation of labor to create art as production rather
      than aesthetic expression.
    mechanism: Constructivist theory transforms artistic expression into production
      by rejecting fine printing and luxurious materials in favor of rough paper,
      imperfect type, and found materials that demonstrate the hand of the worker
      and the material's honest structure.
    boundary: Applies to constructivist design philosophy in the Soviet Union during
      the 1920s, particularly in educational contexts like Vkhutemas. Fails when applied
      to modern design practices that don't emphasize political or material honesty.
