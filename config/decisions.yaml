- id: D2636
  category: QUALITY / DATA
  state: RESOLVED
  description: 'BGE-RERANKER DOMAIN CLASSIFICATION THRESHOLD SWEEP - DEAD END (2026-09-15). scripts/benchmark_domain_taxonomy_match.py --reranker-only --sweep on 234 gold_4axis rows vs 43 domains. RESULT:
    threshold calibration does NOT help - best threshold 0.15 gives micro-F1 0.219 vs fixed top-k=3 baseline 0.324; macro-F1 0.0 at EVERY threshold 0.05-0.95 (the cross-encoder collapses onto the same few
    domains, cannot discriminate 43 classes). CONFIRMS D2613/D2634: the 43-way domain head is TRAINING-DATA-limited, NOT model-limited - bge-reranker-v2-m3 is not a viable domain classifier even with calibration.
    MoritzLaurer/bge-m3-zeroshot-v2.0 ONNX path still separate/unbenchmarked. Artifact governance/domain_taxonomy_match_benchmark.json.'
  champion: goose
  target_files:
  - scripts/benchmark_domain_taxonomy_match.py
  - governance/domain_taxonomy_match_benchmark.json
  created: '2026-09-15'
