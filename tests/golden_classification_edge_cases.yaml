- id: L09_baseline_strategic_thinking
  description: Clear strategic thinking FB
  fb_name: Second-Order Effects Dominate Long-Term Outcomes
  fb_definition: First-order effects of decisions are immediately visible and often beneficial, but second-order effects —
    the reactions of systems and actors to the initial change — frequently reverse or amplify outcomes in unexpected ways.
    Effective strategy requires modeling at least two levels of causal chain beyond the obvious.
  expected_output:
    application: 'Before major decisions, run a second-order effects workshop: list the immediate outcome (1st order), then
      ask ''and then what?'' for each stakeholder affected (2nd order), then ask ''and then what happens to the system?''
      (3rd order). Only proceed if net effect across all three levels is positive.'
    failure_mode: Leaders optimize for first-order metrics (this quarter's revenue) while destroying second-order value (customer
      trust, employee retention, brand equity). The damage surfaces 12-18 months later when the leader has already been promoted.
    elaboration: First-order thinking is easy and immediately rewarding. Second-order thinking is hard and its benefits are
      delayed — which is exactly why it's a durable competitive advantage. Organizations that institutionalize second-order
      analysis make fewer catastrophic mistakes and capture opportunities that first-order competitors can't see.
    keywords: second-order effects, systems thinking, causal chains, unintended consequences, feedback loops
    jargon: 'Second-order effects: The consequences of the consequences — what happens because systems and actors react to
      the initial change. Systems thinking: An approach analyzing how constituent parts interrelate within a whole system.'
  expected_domains:
  - business operations
  - engineering practice
  expected_depth: cross-domain
  expected_evidence: cited
  test_property: 'baseline: strategic thinking, cross-domain'
  expected_discipline: strategic thinking
  accept_any_of_discipline:
  - systems thinking
- id: L10_baseline_user_research
  description: Clear UX research FB
  fb_name: Observed Behavior Trumps Self-Reported Preference
  fb_definition: Users consistently misreport their own preferences and behaviors in surveys and interviews. Direct observation
    — watching users attempt real tasks with real products — reveals friction points, workarounds, and unmet needs that users
    cannot articulate. Self-report measures what users think they do; observation measures what they actually do.
  expected_output:
    application: Run at least 5 moderated usability sessions per feature before launch. Record screen + face. Count friction
      events (hesitations, sighs, wrong clicks) rather than asking 'was that easy?'. Prioritize fixes for behaviors observed
      in 3+ participants.
    failure_mode: Teams run surveys asking 'would you use this feature?' and get 80% positive responses, then launch to find
      5% actual adoption. The gap between stated and revealed preference can be 10-20×.
    elaboration: The say-do gap is one of the most replicated findings in behavioral research. People say they want salad
      and buy burgers. They say they value privacy and click 'accept all cookies.' Observation bypasses the rationalization
      layer and shows what the body does, not what the mind says.
    keywords: contextual inquiry, usability testing, say-do gap, revealed preference, think-aloud protocol, friction counting
    jargon: 'Say-do gap: The discrepancy between what people report they do and what they actually do. Revealed preference:
      Actual behavior as a more reliable indicator of preference than stated preference.'
  expected_domains:
  - user experience
  - digital product
  expected_depth: domain
  expected_evidence: cited
  test_property: 'baseline: user research, behavioral'
  expected_discipline: design psychology
- id: L11_baseline_semiotics
  description: Clear semiotics/communication FB
  fb_name: Signifier-Signified Gap Creates Interpretive Space
  fb_definition: The relationship between a signifier (word, image, symbol) and its signified (concept, meaning) is arbitrary
    and culturally constructed. This gap creates space for multiple interpretations — the same visual element can signify
    different concepts across cultures, contexts, and time periods. Effective communication requires awareness of this gap.
  expected_output:
    application: When designing icons for international products, test each icon with users from at least 3 cultural backgrounds.
      The 'hamburger menu' icon means 'menu' to Western users but may signify nothing or 'food' elsewhere. Maintain an icon-meaning
      glossary with cultural annotations.
    failure_mode: Designers assume their cultural signifiers are universal. A 'thumbs up' icon means approval in the US, offense
      in parts of the Middle East, and the number one in Germany. The signifier stays the same; the signified shifts catastrophically.
    elaboration: 'Saussure''s key insight was that the signifier-signified relationship is arbitrary — there''s nothing inherently
      ''treelike'' about the word ''tree.'' This arbitrariness is a feature, not a bug: it''s what allows the same concept
      to be expressed differently across languages and the same symbol to carry different meanings. Designers who ignore this
      create accidental international incidents.'
    keywords: signifier, signified, semiotics, denotation, connotation, cultural encoding, Saussurean gap
    jargon: 'Signifier: The form a sign takes (word, image, sound). Signified: The concept the sign represents. Saussurean
      gap: The arbitrary relationship between signifier and signified.'
  expected_domains:
  - creative technology
  - graphic design
  expected_depth: domain
  expected_evidence: cited
  test_property: 'baseline: semiotics, humanities discipline'
  expected_discipline: semiotics
- id: L12_baseline_design_psychology
  description: Clear design psychology FB
  fb_name: Hick's Law Governs Decision Latency
  fb_definition: Decision time increases logarithmically with the number of choices presented. Each additional option adds
    cognitive load proportionally to the log of the total options — doubling choices from 4 to 8 adds roughly the same decision
    delay as going from 1 to 2. Interface design should minimize simultaneous options.
  expected_output:
    application: 'Progressive disclosure: show 3-5 top-level options, reveal sub-options on click/hover. For navigation, use
      5-7 items max. For pricing pages, show 3 tiers (not 7). For filters, collapse options behind ''More filters'' after
      the first 5.'
    failure_mode: E-commerce category pages showing 50+ unfiltered options trigger decision paralysis — users leave without
      purchasing rather than process the overwhelm. Each doubling of options roughly halves conversion rate.
    elaboration: Hick's Law is logarithmic, not linear — the biggest jump in decision time is from 1 to 2 options. After about
      8 choices, additional options add negligible delay because users stop evaluating and start satisficing (picking the
      first acceptable option). The damage isn't slower decisions but worse decisions made by satisficing.
    keywords: Hick's Law, decision latency, cognitive load, progressive disclosure, choice architecture, satisficing
    jargon: 'Hicks Law: Decision time increases logarithmically with number of choices. Satisficing: Accepting the first adequate
      option rather than optimizing, triggered by choice overload.'
  expected_domains:
  - user experience
  - digital product
  expected_depth: domain
  expected_evidence: cited
  test_property: 'baseline: design psychology, UX'
  expected_discipline: design psychology
  accept_any_of_evidence:
  - axiomatic
- id: L13_baseline_ethnography
  description: Clear design research/ethnography FB
  fb_name: Contextual Inquiry Reveals Tacit Knowledge
  fb_definition: Observing users in their natural environment — rather than a lab or conference room — reveals tacit knowledge,
    environmental constraints, and tool adaptations that users cannot articulate because they have become invisible through
    habituation. The workplace context is an essential part of understanding the work itself.
  expected_output:
    application: 'Schedule 2-hour contextual inquiry sessions: 1 hour of silent observation (master-apprentice model), 30
      min of guided walkthrough, 30 min of retrospective discussion. Take photos of the physical workspace including post-it
      notes, cheat sheets, and makeshift tools.'
    failure_mode: Researchers conduct interviews in conference rooms and miss the spreadsheet macros, paper checklists, and
      Slack workarounds that constitute 40% of actual work practice. The designed solution addresses the official workflow,
      not the real one.
    elaboration: Tacit knowledge is what people know but can't say. It lives in muscle memory, environmental cues, and social
      routines. A nurse knows which patients need attention by the sound of their breathing — they'd never think to mention
      this in an interview. Contextual inquiry surfaces these invisible competencies by making the researcher a humble apprentice
      to the expert.
    keywords: contextual inquiry, tacit knowledge, master-apprentice model, ethnographic observation, work practice, situated
      action
    jargon: 'Tacit knowledge: What people know but cannot articulate — skills, intuitions, and routines. Contextual inquiry:
      An ethnographic research method observing users in their natural environment.'
  expected_domains:
  - user experience
  - digital product
  expected_depth: domain
  expected_evidence: cited
  test_property: 'baseline: ethnography-inspired, dual discipline'
  expected_discipline: design psychology
- id: L14_baseline_interaction_design
  description: Clear interaction design FB
  fb_name: Affordances Must Be Perceivable to Be Actionable
  fb_definition: 'An object''s affordances — the actions it enables — must be visually or haptically perceivable by the user
    to influence behavior. A door that can be pushed but has only a pull-handle creates a false affordance. Digital interfaces
    have the same requirement: buttons must look clickable, draggable elements must signal their draggability.'
  expected_output:
    application: 'Audit every interactive element before launch: does it look interactive? Use established patterns (underlined
      text = link, raised rectangle = button, gripper dots = draggable). Never require users to hover-randomly to discover
      functionality. Test with first-time users who have zero prior knowledge.'
    failure_mode: Flat design removes affordance signals (shadows, bevels, underlines) in pursuit of aesthetic minimalism,
      leaving users unable to distinguish static text from interactive buttons. Click-through rates drop 25-40% because users
      don't know what's clickable.
    elaboration: 'Gibson''s concept of affordance was about the environment ''offering'' action possibilities to an organism.
      Norman adapted it for design: perceived affordances are what matter, not actual affordances. A glass door technically
      affords pushing, but if there''s no visible push plate, users will pull the handle and feel stupid. The designer''s
      job is making the true affordance visible.'
    keywords: affordance, perceived affordance, signifier, flat design, discoverability, Norman door, gulfs of execution/evaluation
    jargon: 'Affordance: The action possibilities an object offers a user. Perceived affordance: What the user believes they
      can do, which may differ from actual affordances. Norman door: A door design where the affordance signifier contradicts
      the actual operation.'
  expected_domains:
  - user experience
  - digital product
  expected_depth: domain
  expected_evidence: cited
  test_property: 'baseline: interaction design, affordances'
  expected_discipline: design strategy
  accept_any_of_evidence:
  - axiomatic
- id: L15_baseline_universal_principle
  description: Clear universal/cross-domain FB
  fb_name: Feedback Delay Causes Oscillation
  fb_definition: 'Any control system — whether mechanical, biological, economic, or social — will oscillate when feedback
    arrives after a delay that exceeds the system''s response time. Shortening feedback loops is the universal solution: tighter
    code-review cycles, faster market testing, immediate performance feedback, real-time dashboards.'
  expected_output:
    application: 'Map every decision loop in your organization and measure its cycle time. Target: code review <4 hours, customer
      feedback to product response <1 week, performance review <1 quarter. The loop with the longest delay is your system''s
      bottleneck regardless of where you think the bottleneck is.'
    failure_mode: Annual performance reviews create 12-month feedback loops — by the time an employee hears they're underperforming,
      they've been underperforming for a year and the corrective action comes too late to salvage the situation.
    elaboration: 'This is control theory''s most portable insight: delay destabilizes. A thermostat with a 5-minute delay
      overshoots wildly. A startup with 6-month product cycles builds features nobody wants. A relationship where feedback
      is withheld until it becomes a fight explodes. The universal prescription — tighten the loop — works because it addresses
      the root cause (delay) rather than the symptom (oscillation).'
    keywords: feedback loop, oscillation, cycle time, control theory, damping, lead time, system dynamics
    jargon: 'Feedback loop: A system where outputs are routed back as inputs, creating self-reinforcing or self-correcting
      cycles. Oscillation: Fluctuation around a central value caused by delayed feedback in a control system.'
  expected_domains:
  - engineering practice
  - business operations
  - code & computation
  - digital product
  - ai & agents
  expected_depth: universal
  expected_evidence: cited
  test_property: 'baseline: universal depth, 2 disciplines, 5 domains'
  expected_discipline: strategic thinking
  accept_any_of_discipline:
  - systems thinking
