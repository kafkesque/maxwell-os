# derivations.yaml - ONE DERIVED VALUE, ONE HOME (D-2646; the BUG-499/BUG-502 class).
#
# WHY. BUG-499 and BUG-502 were one defect three times: a rule that decides a stored value existed as a verbatim
# copy in TWO scripts, so the copies could diverge with nothing reporting it, and the question "which code decides
# this column?" could not be answered FROM THE REPO. This registry turns that question into a lookup.
#
# WHAT THIS FILE IS NOT. It is not a list of every file that touches a column. A producer may legitimately carry
# a value the home computed (that is declared_writers); what may never exist is a SECOND implementation of the
# RULE - the one-home invariant, checked by FUNCTION NAME across the tree.
#
# SCAN ROOTS ARE A DECLARATION. backups/ and archive/ are excluded ON PURPOSE: they hold PRE-IMAGES of the same
# module, and a pre-image of a home function is not a rival implementation. MEASURED 2026-09-25: the only
# duplicate def recompute / def decisions_digest in the tree live under backups/, so scanning them would make the
# rail fire on this repo's own backup discipline (BUG-372).

schema_version: '1'
decided: D-2646
scan_roots: [pipeline, scripts, tools]

# COORDINATE HOMES (D-2661, the BUG-553 class). `table:` and `column:` are CLAIMS about WHERE a value lives,
# and until this block existed NO rail read either field: both were written by a human and joined by nothing, so a
# row could cite a table and a column that exist NOWHERE while the registry printed ok. The rule this block turns
# into a machine:
#
#   a cited COORDINATE must RESOLVE to its ONE census home - existence + membership, DELEGATED, never the VALUE.
#
# DELEGATED, because the column question already has a home: scripts/check_store_columns.py measures every column of
# the governed store against a declared role, and a SECOND census of one fact is the defect this registry exists to
# prevent (D-2646/BUG-502). This rail therefore consumes that census; it never re-measures a column and NEVER OPENS
# THE STORE. It must not: the store carries a vec0 virtual table, so a naive "verify the cited table exists" join
# would raise `no such module: vec0` and kill the rail on its first run.
#
# TWO KINDS, machine-distinct (a kind is a rule, not a label - BUG-492):
#   document     - the coordinate lives in a document this repo writes. The path must EXIST, must PARSE as a
#                  mapping, and `column` must be a TOP-LEVEL KEY of it. `producer_key` names the field holding the
#                  document's own writer, and that path must exist: a coordinate whose producer is unnamed is a
#                  fact nobody owns (D-2649/D-2646).
#   store_census - the coordinate lives in a governed STORE whose column census is ANOTHER rail's register.
#                  `census` names it, `membership` names the dotted key path inside it that lists the measured
#                  columns (declared, never a code default - D-2644), its declared `table` must equal this row's
#                  table, its `rail` must exist, and `column` must appear in that membership map. Existence in the
#                  STORE is check_store_columns' measurement, and the ladder runs it.
#
# A cited table with NO entry here is UNVERIFIABLE and fails CLOSED. That IS the guarantee: a new row cannot cite
# a new coordinate until the coordinate's census home is declared, so "nobody reads two fields of one record
# together" cannot come back by adding a row.
coordinate_homes:
  fbs:
    kind: store_census
    census: config/store_columns.yaml
    membership: measured.columns
  config/decisions_summary.json:
    kind: document
    producer_key: written_by
# PARITY RAILS (D-2662, the BUG-553 class a THIRD time). parity_rail is a row's claim about WHAT RE-DERIVES the
# value, and until this clause no machine read it either: a row could name a script that exists NOWHERE, or a script
# that exists and that the LADDER NEVER RUNS, and the registry printed ok - the same shape as the coordinate fields
# above. The rule:
#
#   a cited PARITY RAIL must RESOLVE - the path must EXIST, and the declared ladder must INVOKE it.
#
# WHY INVOCATION IS HALF OF EXISTENCE. A rail nothing runs is not a rail (BUG-508/510: the controls nothing ran got
# wired). The comparison of re-derived bytes against the stored corpus stays the parity rail's OWN job; this registry
# proves only that the machine is there and that something runs it, and a mention inside a comment is NOT a run.
#
# WHY A HOMED ROW MAY NOT LEAVE IT NULL. parity_rail: null says "no re-derivation exists" - the same statement the
# three defective rows already make through their status: - so the null is checked AGAINST the row's own status, two
# fields of ONE record joined (the BUG-550 class). MEASURED 2026-09-26T: 7 of 10 rows name a rail over 3 distinct
# scripts, all three invoked by the ladder (check_serving_gate, check_s5_score_axis, recompute_decision_summary),
# and the 3 nulls are exactly the 3 NON-homed rows (orphan_magic_threshold, dead_but_read, declared_but_empty). The
# strongest status this file has would otherwise be a claim with nothing behind it.

derivations:
- name: fbs.status
  table: fbs
  column: status
  kind: derived_regenerable
  home: pipeline/serving_gate.py::derive_status
  parity_rail: scripts/check_serving_gate.py
  status: homed
  note: D274a invariant; the stored corpus is the only acceptable proof (D-2642) - 7995 MATCH.
- name: fbs.epistemic_status
  table: fbs
  column: epistemic_status
  kind: derived_regenerable
  home: pipeline/serving_gate.py::derive_epistemic_status
  parity_rail: scripts/check_serving_gate.py
  status: homed
  note: BUG-499 - the D2284 label rule had two verbatim copies and no home.
- name: fbs.confidence_score
  table: fbs
  column: confidence_score
  kind: derived_regenerable
  home: pipeline/serving_gate.py::derive_conf_and_review
  parity_rail: scripts/check_s5_score_axis.py
  status: homed
  note: BUG-502 - the axis was a verbatim copy in stage5_verify.py AND reinject_bug198_singletons.py.
- name: fbs.needs_human_review
  table: fbs
  column: needs_human_review
  kind: derived_regenerable
  home: pipeline/serving_gate.py::derive_conf_and_review
  parity_rail: scripts/check_s5_score_axis.py
  status: homed
  note: co-derived with confidence_score by the ONE comparator (D-2641); 7995/7995 identical on re-derivation.
- name: fbs.classification_status
  table: fbs
  column: classification_status
  kind: derived_regenerable
  home: scripts/reinject_bug198_singletons.py::_classify_s4
  parity_rail: null
  status: orphan_magic_threshold
  note: >-
    BUG-504 instance 2, MEASURED 2026-09-25: 7995/7995 stored rows carry one value (CLEAN) decided by an
    UNDECLARED literal 10 in _classify_s4. A threshold that exists only as a literal has no home and no config
    row. Declared now so the defect is DECLARED, not discovered twice; T2 moves it into config and re-proves the
    7995 stored values against the new read.
- name: fbs.borp_score
  table: fbs
  column: borp_score
  kind: derived_regenerable
  home: null
  parity_rail: null
  status: dead_but_read
  note: >-
    MEASURED 2026-09-25: 7995/7995 non-null with distinct values [0.0] - a constant except that NO writer exists
    anywhere in the tree. It is still ORDER BY-ed as an arbitrary top-10 in pipeline/query.py and averaged in
    pipeline/run_monitor.py where avg_borp_score can only ever be 0.0. D2537 already calls it the dead borp_score
    ordering. home null is ON PURPOSE: a null home is the machine-readable statement that no code decides this.
- name: fbs.feedback_score
  table: fbs
  column: feedback_score
  kind: derived_regenerable
  home: pipeline/feedback.py::_update_fb_aggregates
  parity_rail: null
  status: declared_but_empty
  note: >-
    MEASURED 2026-09-25: 0 of 7995 rows populated; the writer is never called by any run. A column declared but
    never populated is a lie the schema tells. T2 wires a call site or declares the field unpopulated.
- name: decisions.summary
  table: config/decisions_summary.json
  column: summary
  kind: derived_regenerable
  home: scripts/recompute_decision_summary.py::recompute
  parity_rail: scripts/recompute_decision_summary.py
  status: homed
  note: >-
    BUG-402/483 - total, per-state counts and by_category are recomputed from the records. D-2655 HALF B
    (2026-09-26) re-pointed this row: the counts no longer have a copy inside the append_only registry,
    so the census is their only home, and recompute is still the ONE implementation of the rule.
- name: decisions.decisions_sha256_16
  table: config/decisions_summary.json
  column: decisions_sha256_16
  kind: derived_regenerable
  home: scripts/recompute_decision_summary.py::decisions_digest
  parity_rail: scripts/recompute_decision_summary.py
  status: homed
  note: >-
    BUG-402 - a CONTENT-derived stamp proves WHAT was written, not WHEN. D-2655 HALF B (2026-09-26)
    re-pointed this row from table config/decisions.yaml, where the stamp could not survive the
    append-only prefix receipt (BUG-539).
- name: decisions.census_json
  table: config/decisions_summary.json
  column: source_sha256
  kind: derived_regenerable
  home: scripts/recompute_decision_summary.py::census_document
  parity_rail: scripts/recompute_decision_summary.py
  status: homed
  note: >-
    D-2655 HALF A (2026-09-26). The census LEAVES the append-only registry because the handoff receipt is a
    PREFIX rule while total_decisions/summary/decisions_sha256_16/last_sync change on every mint (BUG-539): no
    position inside an append-only file is compatible with it. source_sha256 names the registry BYTES this
    document describes (D-382). HALF B (2026-09-26) has removed the copy from the registry, so this document is
    that value's only home and the writer refuses to write either home unless they agree.

# C12/C16 census (D-2644): a config value read with a code default is an UNDECLARED value.
# BUG-504 was five S5 weights read as _CFG.get(key, <literal>): the config miss WAS the bug. The class is not
# one file. MEASURED 2026-09-25 by a probe: 199 such reads, two distinct debts, both shrink-only:
#   shadowed_declared - the key IS declared and the call site still supplies a default, so a typo or a rename
#                       moves behaviour with no error (the D-2644 defect proper);
#   undeclared        - the key is declared NOWHERE, so the default IS the declaration (the
#                       stage5.nli_model_fallback = "" case: a SILENT EMPTY NLI FALLBACK in the verifier path).
# Ceilings are a DECLARATION of the measured state and the direction is shrink_only (D-401 precedent). The RAIL,
# not the probe, owns the number: the first rail run re-measures and its value replaces this one.
config_reads:
  receivers: [_CFG, cfg, config, conf, settings]
  config_glob: 'config/*.yaml'
  ceilings:
    shadowed_declared: 229
    undeclared: 3
    measured_by: scripts/check_config_defaults.py





  direction: shrink_only
  ceiling_changed: >-
    initial declaration 2026-09-25 from the PROBE measurement (179 shadowed / 20 undeclared); the rail
    (scripts/check_config_defaults.py, next step) re-measures and its number replaces this one, recorded here.
    REMEASURED 2026-09-26 by scripts/check_config_defaults.py: shadowed_declared 179 -> 209, undeclared 20 -> 2. The RAIL owns the number (D-2642): the probe's value was a CLAIM, and a claim is not a measurement. From here the ceiling may only be LOWERED.
    REMEASURED 2026-09-26 by scripts/check_config_defaults.py: shadowed_declared 209 -> 210, undeclared 2 -> 2. The RAIL owns the number (D-2642): the probe's value was a CLAIM, and a claim is not a measurement. From here the ceiling may only be LOWERED.
    REMEASURED 2026-09-26 by scripts/check_config_defaults.py: shadowed_declared 210 -> 211, undeclared 2 -> 2. The RAIL owns the number (D-2642): the probe's value was a CLAIM, and a claim is not a measurement. From here the ceiling may only be LOWERED.
    REMEASURED 2026-09-27 by scripts/check_config_defaults.py: shadowed_declared 211 -> 212, undeclared 2 -> 2. The RAIL owns the number (D-2642): the probe's value was a CLAIM, and a claim is not a measurement. From here the ceiling may only be LOWERED.
    REMEASURED 2026-10-03 by scripts/check_config_defaults.py: shadowed_declared 212 -> 221, undeclared 2 -> 2. The RAIL owns the number (D-2642): the probe's value was a CLAIM, and a claim is not a measurement. From here the ceiling may only be LOWERED.
    REMEASURED 2026-10-07 by scripts/check_config_defaults.py: shadowed_declared 221 -> 229, undeclared 2 -> 3. The RAIL owns the number (D-2642): the probe's value was a CLAIM, and a claim is not a measurement. From here the ceiling may only be LOWERED.

enforcement:
  rail: scripts/check_derivation_homes.py
  # D-2662: WHERE THE PARITY RAILS ARE RUN is a DECLARATION, never a path hardcoded in the rail (C12). The parity
  # clause resolves each cited parity_rail against this file: a script that EXISTS but that nothing runs is a rail
  # that protects nothing (the BUG-508/BUG-510 class - "the controls nothing ran got wired"), and a ladder that
  # cannot be read is DRIFT, not a pass.
  ladder: justfile
  # SHRINK-ONLY: how many registered derivations are NOT homed. Measured 2026-09-25 = 3 (1 orphan
  # magic threshold, 1 dead-but-read, 1 declared-but-empty). Raising it is a DECISION, not an edit
  # (the D-401/guard_coverage precedent): a count that can grow by edit is not a ceiling.
  # LOWERED 3 -> 1 on 2026-09-26 by the rail's own instruction ("a ceiling may only be LOWERED"). The rail
  # reported the stale ceiling as owner-owed (RC=2) on every run; a ceiling above the measured count is a number
  # nothing enforces. Raising it remains a DECISION.
  # CORRECTED 2026-09-26T (D-2661, the BUG-521 class - a verdict must state the counts it measured). This comment
  # claimed "the registry now carries 9 rows, 8 homed" while the rail measured 10 rows, 9 carrying a home and 1
  # with home null (borp_score). The registry grew and the prose did not: a count written in prose is a claim NO
  # MACHINE READS. The rail PRINTS the count it measured on every run, and that print is the number.
  max_non_homed: 1
  direction: shrink_only
