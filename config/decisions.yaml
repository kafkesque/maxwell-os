  title: Cross the ruler strata with status and always report both frames (D-273h)
  source: governance/ruler_measurement_20260917.md
  verification: 'measured: sheet 47.3% PASS vs KB 59.3% PASS; PASS-only ROLE lift is exactly 0.000 (BUG-294)'
  description: 'The ruler sheet sampled the full KB -- 47.3% PASS rows in the sheet against 59.3% in the KB -- so stratum A mixes retrievable and hidden rows. Re-measured restricted to status=''PASS'': content_type 0.891 with a constant-answer baseline of 0.891, i.e. lift EXACTLY 0.000 (cleaner and stronger than the all-rows figure of 0.740 against 0.750 = -0.010); discipline 0.492 (essentially unchanged); extraction_type 0.852. On QUARANTINE rows content_type is 0.472 against a 0.500 constant, i.e. worse than a constant. The defect is that TWO ESTIMANDS are being answered by one number: ''is the stored label trustworthy across the KB?'' (all rows) and ''is what I retrieve correctly labelled?'' (PASS only). Fix: cross the ruler strata with status, report both frames in every artifact, and never quote a single frame as if it were the answer.'
