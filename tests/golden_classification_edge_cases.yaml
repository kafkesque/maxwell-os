golden_cases:
- id: A01_single_discipline_clear
  description: FB clearly in ONE discipline only — should not hallucinate extras
  fb_name: Recursive Function Optimization
  fb_definition: Recursive functions can be optimized through tail-call elimination, transforming stack-consuming recursion
    into iterative loops that use constant stack space. This technique is specific to compiler design and functional programming
    paradigms.
  expected_domains:
  - code & computation
  - engineering practice
  expected_depth: domain
  expected_evidence: cited
  test_property: single-discipline, no hallucination
  expected_discipline: software engineering
- id: A02_two_disciplines_bridge
  description: FB spans 2 related disciplines — classifier must pick the PRIMARY one
  fb_name: Data-Informed UX Architecture
  fb_definition: User experience architecture benefits from quantitative behavioral data to inform information hierarchy decisions.
    Statistical analysis of user flows reveals patterns that intuition alone cannot detect, bridging the gap between data
    science and design strategy.
  expected_domains:
  - user experience
  - digital product
  expected_depth: cross-domain
  expected_evidence: cited
  test_property: 'disciplines: picks primary when FB bridges 2 disciplines'
  expected_discipline: design strategy
- id: A03_three_disciplines_max
  description: FB touches 3 distinct disciplines — classifier must pick the dominant one without hallucinating
  fb_name: AI-Augmented Creative Direction
  fb_definition: Creative direction increasingly leverages generative AI for concept exploration, requiring directors to understand
    machine learning capabilities, design principles, and business strategy simultaneously. The role blends artistic vision
    with algorithmic thinking and market positioning.
  expected_domains:
  - creative technology
  - ai & agents
  - business operations
  - digital product
  expected_depth: cross-domain
  expected_evidence: cited
  test_property: 'disciplines: picks dominant when FB touches 3 disciplines'
  expected_discipline: design strategy
- id: A04_discipline_edge_case_emerging
  description: FB belongs to a field not in the canonical discipline list
  fb_name: Bioelectric Morphogenesis Patterning
  fb_definition: Cellular voltage gradients serve as a medium for storing and processing pattern information during organism
    development. Bioelectric signals form a computational layer that operates alongside genetic and biochemical systems to
    control anatomical shape.
  expected_domains:
  - emerging
  expected_depth: domain
  expected_evidence: cited
  test_property: emerging discipline (not in taxonomy)
  expected_discipline: emerging
  accept_any_of_discipline:
  - complex adaptive systems
- id: A05_discipline_ambiguous_boundary
  description: FB could reasonably be 2 different disciplines — classifier must pick ONE. Either strategic thinking or marketing
    is valid.
  fb_name: Market Psychology in Product Launches
  fb_definition: Product launch success depends on psychological triggers like scarcity, social proof, and anchoring. Understanding
    cognitive biases allows product teams to time and frame releases for maximum adoption, blending behavioral economics with
    product management.
  expected_domains:
  - business operations
  - digital product
  expected_depth: cross-domain
  expected_evidence: cited
  test_property: ambiguous discipline boundary — accepts either valid answer
  expected_discipline: strategic thinking
  accept_any_of_discipline:
