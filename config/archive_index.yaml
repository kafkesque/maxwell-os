# config/archive_index.yaml — the archive index contract (D-365)
# =============================================================================
# WHY: archive/index.yaml declared `authority: D2226`, and D2226 sits in state
# REJECTED in config/decisions.yaml. It was generated 2026-08-10 against an
# OUT-OF-REPO archive_root and never regenerated, so the in-repo archive/
# (16 GB, 36 top-level entries) was unindexed, and NO reader anywhere consumes
# the file. Derived data with no writer and no checker is BUG-342's class, not a
# document. This file configures the writer (scripts/build_archive_index.py) and
# its check.
#
# C12: every path, section rule, vocabulary word and reason lives here — none in
#      the script. C6: the writer is atomic. C16: a declared input that is
#      missing refuses; it does not silently produce an empty section.
# R-D410: an archive entry is REGISTERED, never rewritten or removed by this
#      script. It reads bytes and writes an index; it never touches archive/.
# =============================================================================
schema_version: "1.0"
decision: D-365

# The archive this index governs: inside the repo, covered by .gitignore line 64.
local_archive: archive
output: archive/index.yaml

# Verified 2026-09-23: the out-of-repo archive the OLD index described. It exists
# (35 top-level entries) but is Dropbox-replicated, not a named volume, and no
# repo operation moves bytes into or out of it. Reported, never operated on.
external_archive_root:
  path: /Users/barn/Library/CloudStorage/Dropbox/claude projects/archived/maxwell os
  generated_by: 'index.yaml generation 2026-08-10T09:25:13.827454 (pre-tiered, D2226 REJECTED)'
  operated_on_by_this_repo: false

# Ordered rules; FIRST match wins. A disposition is a claim about what may be done
# to the entry, not something this script does.
# BUG-469 (2026-09-25): macOS Finder / Dropbox writes '.DS_Store' into any directory it browses, and a
# directory's OWN mtime moves with it. This rail went RED with ZERO content change (measured: +1 file,
# +6148 bytes, and archive/.DS_Store rewritten at 18:01:21 today). OS metadata is not archive content, so
# it is excluded from every count AND from the `modified` date (the date is the newest non-ignored
# descendant, never the directory's own mtime). Without this the rail is flaky by construction and a
# flaky rail is a rail the owner learns to ignore - the failure class BUG-462 already names.
ignore:
  names: ['.DS_Store', 'Thumbs.db']
  globs: ['^\._', '-(wal|shm|journal)$']   # AppleDouble sidecars; SQLite transient sidecars (BUG-556)                    # AppleDouble sidecars
  category: os_metadata
  disposition: purge_candidate
  authority: hygiene
  reason: 'machine-generated, regenerable, never archive content (file-browser metadata, AppleDouble sidecars, SQLite -wal/-shm/-journal sidecars). A transient sidecar moves whenever any process OPENS the database beside it, so counting one makes this rail a function of whoever read the DB last (BUG-556); excluded from every count and from the modified date, and REPORTED rather than silently absent (BUG-537). This block is the ONE home of the excluded class: the classifier reports a rules: pattern that this block already excludes as a DECLARATION CONFLICT, fail closed (C16/D-2646)'

rules:
  - match: '^bak_sweep_'
    category: sweep
    disposition: external_move_candidate
    authority: BUG-401
    reason: bulk-sweep payload; the external-drive gate could not execute (no volume mounted)
  - match: '^session_'
    category: session_scratch
    disposition: external_move_candidate
    authority: BUG-401
    reason: per-session scratch; large, not evidence-bearing beyond the session it names
  - match: '^temp_archive_'
    category: temp_overflow
    disposition: keep
    authority: folder_protocol
    reason: protocol temp disposition is archive-first, not delete (R-D410); purging is owner-gated
  - match: '^db_backups$'
    category: restore_point
    disposition: keep_append_only
    authority: D-361
    reason: pre-repair restore point; the vec repair receipt names this state
  - match: '^governance_pre_tiered_'
    category: governance_history
    disposition: keep_append_only
    authority: R-D410
    reason: pre-tiered append-only governance history; the reference source for thin tiered entries
  - match: '^golden_retired_'
    category: retired_training_set
    disposition: keep_append_only
    authority: D2618
    reason: retired silver pool; the live default path, never move it
  - match: '^root_filing_'
    category: root_filing
    disposition: keep
    authority: folder_protocol
    reason: root one-in-one-out filings kept as evidence of the filing
  - match: '^housekeeping_'
    category: pycache
    disposition: purge_candidate
    authority: C19
    reason: regenerable bytecode; the only entry class with no evidence value
  - match: '\.archived-\d{4}-\d{2}-\d{2}$'
    category: dead_code
    disposition: keep_append_only
    authority: C19
    reason: C19 dead code keeps its bytes under archive/<name>.py.archived-<date>
  - match: '\.(bak_|pre_|pre369$|prewrite|archived-)'
    category: declared_suffix
    disposition: keep_append_only
    authority: R-D410
    reason: superseded generation of a live artifact; the superseded bytes stay visible
  - match: '^maxwell_os_v1$'
    category: empty_placeholder
    disposition: purge_candidate
    authority: folder_protocol
    reason: empty directory; carries no bytes and no evidence
  # C19/BUG-537 (D-2664): a rule HERE for a name the ignore block already excludes can never fire -
  # ignored names never reach classify(). The `- match: '^\.DS_Store$'` rule that used to sit on this line
  # was measured to match nothing, and it is the reason the hygiene object left the index unnoticed.
  # shadowed_rules() now reports such a rule as a DECLARATION CONFLICT (exit 2, fail closed), so the
  # declaration cannot go dead in silence again.

default:
  category: unclassified
  disposition: keep
  authority: null
  reason: no rule matched — classify it in config/archive_index.yaml before any removal

# Vocabulary this index is allowed to emit (D-355: assert the state you are in).
dispositions:
  keep: bytes stay, no action contemplated
  keep_append_only: bytes stay and are evidence; never edited, never removed (R-D410)
  external_move_candidate: bytes may leave the repo once a real external volume exists (BUG-401)
  purge_candidate: regenerable or metadata; safe to delete, but deletion is owner-gated

