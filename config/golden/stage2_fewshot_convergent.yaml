    name: System Fragility Taxonomy
    definition: 'Systems can be classified by their response to perturbation: fragile systems break under stress, robust systems
      resist stress unchanged, and antifragile systems improve from stress. This classification framework applies across physical,
      biological, organizational, and computational systems.'
    mechanism: 'Fragility arises when a system is optimized for a narrow range of conditions and has no mechanism to benefit
      from deviation. Robustness arises from redundancy and tolerance. Antifragility arises from optionality — the ability
