# config/task_register.yaml — THE MACHINE-READABLE TASK REGISTER (D-2981).
#
# WHY THIS FILE EXISTS. Before it, "how many tasks are open?" had no answer: the tasks lived as
# PROSE inside MASTER-TASK-REGISTER.md (2,202 lines of open items, session notes and dated
# history mixed together), so the face could not be counted, ordered, or joined to anything.
# The face is now DERIVED from this file by scripts/gov_sync.py (one writer), and
# scripts/check_gov_sync.py fails closed when the face and this register disagree.
#
# CONVENTIONS (enforced by the rail, not by convention):
#   * id          : T-<n> for real work; R-<n> for a RULE that must keep holding (a standing rule).
#   * priority    : MUST | SHOULD | WORTH   (the MTR tier order; MUST is strategic-consequential)
#   * state       : open | blocked | gate (an OWNER word is required) | done | superseded
#   * source      : the register that EVIDENCES the task (a bug, a decision, a measurement file)
#   * evidence    : a path or a measured figure — never an adjective
#   * gate        : what would have to be true for it to leave 'gate' (owner word, or a rail)
# APPEND-ONLY DISCIPLINE: a task is CLOSED by setting state: done + closed: <date>; it is never
# deleted (a register that forgets cannot be diffed). New entries are APPENDED at the end.
