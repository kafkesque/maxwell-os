# artifact_ownership.yaml - who may write which artifact, and how (D-401, the RC-1 gate).
#
# WHY: the register's most destructive class is "one artifact, many writers, no ownership partition".
# A writer regenerates its own columns and rewrites the whole file; another owner's cells are collateral
# (BUG-478 blanked 148 owner cells). This file makes the ownership DECLARED, and scripts/lib/write_guard.py
# makes it ENFORCED: a writer that would change a cell it does not own is refused, and nothing is written.
#
# mutability classes:
#   immutable          - never rewritten in place; a new revision = a new file (content-addressed, I2)
#   append_only        - rows/cells may be added; an existing cell may never be edited or blanked
#   derived_regenerable- may be regenerated wholesale, but ONLY through write_guard with OWNED_ANY
#   human_authored     - typed by the owner; a machine writer may add columns, never edit a filled cell
#
# `guard_exemption` is a DECLARATION OF DEBT, not a permission: scripts/lib/write_guard.py --audit AST-scans
# every writer_of_record below for a real guard CALL site, and a writer with neither a call site nor an
# exemption is DRIFT (D-401/I1). The count is bounded by guard_coverage.max_unguarded (SHRINK-ONLY). This key
# exists because MEASURED 2026-09-25: 0 of 6 declared script writers imported the guard at all, so the
# invariant was DECLARED and UNENFORCED - the state in which BUG-478 destroyed 148 owner cells.
#
# Every entry here must have a reconciliation entry in config/reconciliation.yaml, or an
# unreconciled_reason. That is the cover check: a declared artifact with no reconciliation is RED.
schema_version: "1.0"
decided: D-401

guard_coverage:
  # SHRINK-ONLY (same direction as config/register_divergence.yaml#declared_max): routing a writer through the
  # guard LOWERS max_unguarded. RAISING it to admit a new exemption is a declared decision, not an edit.
  max_unguarded: 3
  direction: shrink_only
  measured: "3 unguarded of 7 declared script writer(s) - pipelines/stage4_merge.py and pipeline/stage5_verify.py (both owner-gated under pipeline/**) and scripts/render_closed_menu.py (owner decision owed on the answer-space pin). Guarded: scripts/reconcile.py, scripts/recompute_decision_summary.py, scripts/ingest_panel_column.py, scripts/f11_anchor_review.py."
  ceiling_changed: "6 -> 4 -> 3 by edit 2026-09-25. The first move was measured only AFTER the fact (the audit's import detector could not see `from lib import write_guard`, so two genuinely-guarded writers read as unguarded - BUG-492); this move is the receipt of a GREEN audit run: 4/7 guarded, 3 unguarded, printed by scripts/lib/write_guard.py --audit. LOWERING is the permitted direction: raising this number is a decision, not an edit."
  enforced_by: scripts/lib/write_guard.py   # --audit (a rail in `just health`)
  reason: >-
    MEASURED 2026-09-25: 0 of 6 declared script writers imported scripts/lib/write_guard.py, so the ownership
    invariant was declared and unenforced. Each unguarded writer now carries a guard_exemption REASON and is
    printed on every run; the ceiling makes the debt bounded and forces a decision to grow it. A writer whose
    exemption is retirable (not owner-gated) is named as the next I1 step inside its own reason.

