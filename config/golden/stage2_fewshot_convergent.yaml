      arrivals INCREASED rather than decreased. The fine replaced a moral obligation (guilt about keeping teachers waiting)
      with a market transaction (paying for extended care). Once parents framed the fine as a price, they were happy to pay
      it — and arrived late more often, not less.

      '
  - source_book: Thinking, Fast and Slow — Daniel Kahneman
    text: 'The planning fallacy describes the systematic tendency to underestimate the time, costs, and risks of future actions
      while overestimating their benefits. This pattern is remarkably robust: it appears in construction projects, software
      development, home renovations, and even academic estimates of task completion time. The error is not random — it''s
      systematically optimistic. The inside view (focusing on the specific case) consistently beats the outside view (looking
      at base rates of similar cases) in people''s intuitive forecasts.

      '
