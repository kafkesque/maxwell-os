  rationale: 'Measured 2026-09-23 over all 7995 committed FBs in bge-m3 512d space (scripts/representability_sweep.py, config/representability_sweep.yaml, receipt governance/evidence/REPRESENTABILITY_SWEEP_20260923/): neighbour label-agreement vs a seeded permutation null and vs the modal-label share. discipline 0.2652 vs constant 0.1134 (+15.2 pp) vs null 0.0398 (+22.5 pp) = SEPARABLE; domains 0.3095 vs 0.0879 (+22.2 pp) vs 0.0832 (+22.6 pp) = SEPARABLE; extraction_type 0.4165 vs 0.3265 (+9.0 pp) vs null 0.2675 (+14.9 pp) = WEAK, calibrated abstention only; content_type 0.7863 vs constant 0.8161 (-2.98 pp) = LOSES TO THE CONSTANT (confirms F-17); depth 0.6540 vs constant 0.8193 (-16.5 pp) = LOSES TO THE CONSTANT (the ''domain'' class alone is 82%). Consequence: content_type and depth must not be classified; a kNN over this representation already beats the pipeline on discipline and domains, which is where the partition is load-bearing.'
  consequence: No new model may be adopted for an axis on the strength of a lift over chance alone. Menu coarsening (D2556 per-label error budgets) is the accuracy lever for the weak axes, not model scale.
