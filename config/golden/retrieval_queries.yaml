# Golden retrieval query set — D2511 (benchmark harness un-gates S1/S2/S3).
# =============================================================================
# Each entry maps a natural-language query to the fb_id(s) it MUST retrieve.
# fb_ids are committed FBs (status=PASS) verified to be the semantically-correct
# answer via live hybrid search BEFORE locking them in (no false-positive goldens).
#
# Contract:
#   - `query`      : natural-language retrieval query (what a user would type)
#   - `expected`   : list of fb_id prefixes (≥8 hex chars) that are correct hits
#   - `query_type` : vocabulary-overlap | synonym | cross-domain | abstract
#                    (used to segment benchmark results by difficulty)
#
# Vocabulary-overlap queries are "easy" for FTS; synonym/abstract queries are
# where the VECTOR leg must carry the retrieval (the exact gap M1/D2509 fixed).
# Do NOT edit expected ids without re-verifying against the live DB.

version: 1
queries:
