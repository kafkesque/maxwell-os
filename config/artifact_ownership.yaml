  config/decisions_policy.yaml:
    mutability: append_only
    writer_of_record: scripts/recompute_decision_summary.py
    guard_note: >-
      DECLARED 2026-10-28 by D-3218 (closes BUG-1100), and the debt this entry retires is the reason it is a
      guard_note rather than a guard_exemption: the writer was ALREADY guarded (write_guard --audit reports
