# register_divergence.yaml - the LOG and the REGISTER diverge in TWO shapes, both declared and both
# SHRINK-ONLY (BUG-481: closed in prose, counted OPEN. BUG-571: named in the log, carried by no header).
#
# WHY: scripts/bug_status.py folds STATUS EVENTS and a status event is a HEADER. A closure written as a body
# paragraph is invisible, so the machine register over-reports: MEASURED 2026-09-25, 8 ids carry an explicit
# `**Status:** FIXED|RESOLVED|CLOSED` in the body while their last header classifies OPEN. "114 open" was a
# parse artifact, and the C15 handoff rule was driven by that phantom count.
#
# check_bug_status.py CANNOT catch this - it re-derives the register from the same headers and byte-compares,
# so it certifies the PARSER, never the LOG.
#
# THE RULE: one fact (is this bug open?) has one HOME (the header event). The other place is made LOUD.
# This list is SHRINK-ONLY: an id listed here that is NO LONGER divergent is itself a FAILURE, so the list
# can only be emptied by promoting each closure to a header event (or re-opening the bug). Raising
# declared_max requires a declared decision, not an edit.
schema_version: "1.0"
decided: D-402   # the rail rule this list implements (a bug id is not a decision)
driver: BUG-481   # the bug that produced the rule
declared_max: 0

declared_divergent: []   # EMPTIED 2026-09-25: all eight were promoted to header events (see governance/buglog.md,
                         # REGISTER PROMOTION 20260925). SHRINK-ONLY: a new prose-only closure must be promoted
                         # to a header event, never declared here.

# BUG-571 (2026-09-27) - THE SECOND DIVERGENCE SHAPE. The first shape (above) is a bug closed in
# prose and counted OPEN. This one is the same disease one notch over: the register is a HEADER projection
# of the log, so an id the LOG NAMES but no HEADER carries is real to every human and absent from every
# machine home. MEASURED 2026-09-27: the log names 62 distinct id(s) the register does not
# carry, out of 383 distinct id(s) named in the file - they sit in the LEGACY shapes of the log (a
# `| BUG-099 | date | title |` row, a `- **BUG-098** - ...` bullet) and in BUG-492's 33 citations, which is
# the id the standing rule itself quotes as evidence.
#
# NOT BACKFILLED (D-2645, the same judgement as the revoked-reference debt): an id a tool PROMOTED to a
# header would carry a status no author ever wrote, and 'no closure claim is not a closure' would count
# every legacy record OPEN. The list is therefore PINNED BY IDENTITY and SHRINK-ONLY, and nothing in this
# file decides what a bug IS: it declares which NAMES the register cannot answer for. A NEW name is RED.
declared_max_uncarried: 63   # CEILING (shrink guard): raising it requires a declared decision, not an edit
