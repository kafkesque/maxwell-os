# ═══════════════════════════════════════════════════════════════════════════
# stage2_fewshot_single_source.yaml
# Purpose: balanced few-shot for SINGLE-SOURCE / SINGLETON S2 extraction.
#
# WHY THIS FILE EXISTS (BUG-152, 2026-08-20): single-source/singleton clusters
# previously received ZERO golden few-shot (`few_shot=... if is_conv else None`),
# so the model inherited the 100%-principle bias of the convergent golden and
# either (a) re-labelled methods/tools/case-studies/speculation as `principle`, or
# (b) over-fired on pure factual description. A mono-type "principle-only" prompt
# was A/B tested and made it WORSE (the model re-labels to principle instead of
# returning NULL). The fix is a BALANCED few-shot showing all 5 content_type roles
# + hard negatives, injected into the multi-type single-source prompt.
#
# This SUPERSEDES config/golden/stage2_fewshot_convergent_nontype.yaml (which is
# convergent-framed and was never wired). Archive that fork (C19).
#
# Contrast with the convergent golden (stage2_fewshot_convergent.yaml): convergent
# clusters are ~99% principle, so that golden stays principle-only. Single-source
# is where process_template / tool_instruction / process_instance / growth_edge
# actually live, so its golden must be role-balanced.
# ═══════════════════════════════════════════════════════════════════════════
meta:
  version: '1.0'
  architecture: cluster-before-extract
  purpose: single-source balanced few-shot (all 5 content_type roles)
  d2345_fork: false
  status: WIRED
  total_examples: 12
  single_source_positives: 9
  hard_negatives: 3
  expected_coverage:
  - role_balance_all_5_content_types
  - process_template_positive
  - tool_instruction_positive
  - framework_library_tool_instruction_positive
  - tool_vs_template_disambiguation
  - process_instance_positive
  - growth_edge_positive
  - pure_fact_rejection
  - platitude_rejection
  - speculation_not_principle_rejection

examples:

# ── POSITIVE: principle (reusable concept, causal) ─────────────────────────
- id: SS-POS-001
  domain: behavior-change
  source_books:
  - Atomic Habits — James Clear
  cluster_segments:
  - source_book: Atomic Habits — James Clear
    text: "Once a small habit is established, it compounds. Marginal gains of one percent per day accumulate into roughly thirty-seven times improvement over a year because each increment builds on the last rather than adding linearly."
  is_convergent: false
  should_extract: true
  expected_fb:
    is_summary: false
    route: FB
    name: Compounding Habit Gains
    definition: "Small habits compound because each marginal improvement builds on the previous one, producing exponential rather than linear growth over time."
    mechanism: "Each 1% improvement raises the baseline from which the next improvement starts, so gains multiply geometrically instead of adding arithmetically."
    boundary: "Applies when improvements are retained and stacked. Fails when gains are one-off and do not raise the subsequent baseline."
    consequence: "Consistent marginal improvement yields outsized long-term results that linear effort estimates under-predict."
    elaboration: "The 37x figure assumes each day's 1% gain is retained and stacked, so the baseline keeps rising rather than resetting. Because the effect is multiplicative, the curve is nearly flat at first and only diverges dramatically from linear growth after sustained repetition, which is why early results feel underwhelming. The compounding rate collapses toward linear if gains decay or are lost between sessions. The same logic generalizes to any system where one cycle's output becomes the next cycle's input."
    extraction_type: causal_mechanism
    content_type: principle
    evidence_passages:
    - "Marginal gains of one percent per day accumulate into roughly thirty-seven times improvement over a year because each increment builds on the last."
  rationale: "Reusable conceptual statement (why small habits compound) with a demonstrated cause→effect chain. A principle, not a method."
  tier: CORE

