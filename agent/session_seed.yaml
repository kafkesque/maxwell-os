# Maxwell OS v3.0 — Session Seed
# Loaded at agent startup. Source of truth for session config.
# Updated: 2026-07-26 (v3.0 cluster-before-extract architecture + model sync)

session:
    version: "3.0.0"
    pipeline_commit: v3.0-D2298
    schema_version: "3.0"
    project_root: knowledge pipeline/

# ── Models (synced with config/pipeline_config.yaml — D2115/D2298) ──
models:
    generator:
        model: Qwen3-Coder-30B-A3B-Instruct-MLX-4bit
        provider: omlx
        temperature: 0.0
        family: qwen
    verifier:
        model: gpt-oss-20b-MXFP4-Q8
        provider: omlx
        temperature: 0.0
        family: gpt-oss
    verifier_v2:
        model: Phi-4-mini-instruct-8bit
        provider: omlx
        temperature: 0.0
        family: phi
        notes: "D2264: S5 deep check (67% acc). R5: DeBERTa FEVER (encoder) ≠ Phi-4-mini (decoder)."
    embeddings:
        model: bge-m3
        provider: ollama
        dims: 512                       # E7: Matryoshka truncated from 1024 (95.3% neighbor overlap, 2× speed)
        family: bge
    nli:
        model: MoritzLaurer/DeBERTa-v3-large-mnli-fever-anli-ling-wanli
        provider: local
        family: deberta
        notes: "D2298: DeBERTa-v3-large sole NLI verifier, threshold 0.10 (P=1.000, R=0.556, F1=0.714). RoBERTa/ModernBERT removed (zero signal / superseded)."

# ── Pipeline (8-stage v3.0 — cluster-before-extract) ──
# D2197: stage3 removed (D2120). Pipeline is 8-stage, not 9.
pipeline:
    stages:
        stage0:    convert           # EPUB/PDF → MD (Pandoc/Docling)
        stage0_5:  extract_metadata  # Filename → author/title/year (LLM)
        stage1:    chunk             # MD → segments + SHA-256 dedup
        stage1_3:  prefilter         # Regex structural garbage filter (D2080)
        stage1_5:  embed_cluster     # FAISS clustering on raw segments (D2094)
        stage2:    extract           # Clusters → convergent FBs (1 LLM call per cluster — REWRITE D2110)
        # stage3: REMOVED (D2120) — HDBSCAN semantic dedup replaced by cluster-before-extract
        stage4:    classify          # Multi-label classification + formatting (D2066 multi-label, not SALSA)
        stage5:    verify            # DeBERTa-v3-large NLI only (D2298, D2093 fail-closed)
        stage6:    commit            # SQLite + Parquet export
    clustering:
        method: FAISS
        metric: cosine
        threshold: 0.75              # D2205: synced with pipeline_config.yaml faiss_threshold (was 0.70 on 3 books — recalibrate at 20+ books)
        embed_model: bge-m3
        min_source_diversity: 2
    classification:
        method: multi_label          # D2066: raw labels dethrone canonicals. Not SALSA.
        model: verifier              # R5: Generator ≠ Classifier
        max_domains_per_fb: 5
    verification:
        borp_min_sources: 2
        nli_model: MoritzLaurer/DeBERTa-v3-large-mnli-fever-anli-ling-wanli   # D2298: DeBERTa-only
        nli_entailment_threshold: 0.10
        cross_family_verifier: null   # D2298: removed (RoBERTa/Phi-4-mini/Gemma deleted)
        fail_mode: fail_closed       # D2093: QUARANTINE on any check failure, never PASS

# ── Services ──
services:
    omlx:
        host: localhost
        port: 11435
        api_key: sk-maxwell-local
        watchdog: pipeline/omlx_watchdog.py
        memory_guard: pipeline/memory_guard.py
        memory_limit_gb: 24          # BUG-017 mitigation: restart OMLX if RSS exceeds
    ollama:
        host: localhost
        port: 11434

# ── Storage ──
storage:
    canonical: knowledge pipeline/maxwell.db
    checkpoints: knowledge pipeline/checkpoints/
    parquet: knowledge pipeline/parquet/
    archive: knowledge pipeline/archive/

# ── Governance ──
governance:
    constitution: CONSTITUTION.md
    decision_log: DECISION-LOG.md
    master_task_register: MASTER-TASK-REGISTER.md
    buglog: governance/buglog.md
    protected_files:
        - CONSTITUTION.md
        - DECISION-LOG.md
        - MASTER-TASK-REGISTER.md
        - AGENTS.md
        - .env
        - config/*.yaml
        - governance/*.md

# ── Boot Sequence ──
boot:
    1: Read CONSTITUTION.md
    2: Load agent/session_seed.yaml
    3: Run OMLX stress test (pipeline/omlx_watchdog.py --pre-stage)
    4: Verify OMLX + Ollama running
    5: python3 pipeline/status.py

# ── Phase Tracking ──
phase:
    current: Phase 1 (v3.0 architecture validation)
    status: Tier 1 complete (15/18). E2E validated on 3 books. Scaling to 20+ books next.
    completed:
        - Phase 0: 14/14 foundation fixes ✅
        - Phase 0.5: cleaning pipeline spec'd, partially implemented
        - Tier 1: architecture restructure (cluster-before-extract) ✅
        - Tier 1: Stage 5 fail-closed + DeBERTa NLI ✅
        - D2092-D2114: v3.0 architecture decisions recorded ✅
    pending:
        - Q6: 5+ book E2E test with meaningful convergent extraction
        - Tier 2: quality calibration (golden set audit, manual FB review)
        - Tier 3: speed benchmarks (MLX vs OMLX, FAISS GPU)
        - C8: D2066 dynamic canonical taxonomy
        - C9: D2067 cross-run incremental extraction
    next_phase: Tier 2 quality calibration → Tier 3 speed → 20-book production run

# ── Book Library ──
book_library:
    total_books: 852 MD (8 domains)
    test_domains:
        - DOMAIN 7 Influence + Power (21 books, 7,500 segments)
        - Pricing subset (3 books, 237 segments — E2E test)
    source: knowledge pipeline/books/