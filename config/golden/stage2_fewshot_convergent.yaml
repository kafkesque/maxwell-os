      requires deeper reconstruction. Cramming produces short-term gains that fade

      quickly, while spaced retrieval produces durable long-term learning.

      '
  - source_book: Moonwalking with Einstein — Joshua Foer
    text: 'Memory athletes do not have exceptional brains — they use systematic techniques.

      The spacing effect is the single most powerful memory technique: reviewing

      material at expanding intervals produces dramatically better retention than

      equal-interval or massed review.

      '
  - source_book: Why We Sleep — Matthew Walker
    text: 'Sleep consolidates memory. Memories are transferred from the hippocampus to the

      neocortex during sleep, making them stable and integrated. This is why spaced

      practice with sleep between sessions works better than cramming — each sleep

      period consolidates what was practiced that day.

      '
