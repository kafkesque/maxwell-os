# ── POSITIVE: principle (descriptive_model — NOT causal) ───────────────────
# SS-POS-001 shows principle=causal_mechanism; this shows the SAME role can be a
# descriptive taxonomy. Guards against the live-smoke 4/4 causal_mechanism
# over-claim (normative/descriptive patterns labeled causal). D2323: one role
# accepts multiple extraction_types.
- id: SS-POS-010
  domain: decision-science
  source_books:
  - Noise — Daniel Kahneman, Olivier Sibony, Cass Sunstein
  cluster_segments:
  - source_book: Noise — Daniel Kahneman, Olivier Sibony, Cass Sunstein
    text: "Judgment errors come in two distinct kinds: bias and noise. Bias is a systematic error that pushes judgments consistently in one direction, while noise is random scatter that pushes different judgments unpredictably in different directions, and the two require different remedies."
  is_convergent: false
  should_extract: true
  expected_fb:
    is_summary: false
    route: FB
    name: Bias Versus Noise Taxonomy
    definition: "A classification of judgment error into two kinds: bias, a systematic error pushing judgments consistently in one direction, and noise, random scatter pushing judgments unpredictably in different directions."
    mechanism: "Bias and noise partition judgment error by structure — bias is directional and consistent, noise is non-directional and variable — which determines whether a bias correction or a noise-reduction procedure applies."
    boundary: "Applies to aggregate or repeated judgments where error can be measured. Fails to distinguish bias from noise from a single judgment, since one data point cannot show direction versus scatter."
    consequence: "Diagnosing which kind of error dominates tells practitioners whether to apply a bias correction or a noise-reduction procedure."
    elaboration: "The bias-versus-noise distinction matters because the two error types respond to opposite interventions: bias is reduced by changing the judge's reference point or incentives, while noise is reduced by averaging independent judgments or standardizing the decision procedure. Most real judgment systems contain both, so a practitioner must measure the relative contribution of each before choosing a remedy; treating noise as bias (or vice versa) leaves the dominant error uncorrected."
    extraction_type: descriptive_model
    content_type: principle
    evidence_passages:
    - "Judgment errors come in two distinct kinds: bias and noise. Bias is a systematic error, while noise is random scatter, and the two require different remedies."
  rationale: "A reusable conceptual taxonomy (bias vs. noise), NOT a cause→effect chain. content_type=principle with extraction_type=descriptive_model — a principle is not always causal_mechanism."
  tier: CORE

