# config/task_register.yaml — THE MACHINE-READABLE TASK REGISTER (D-2981).
#
# WHY THIS FILE EXISTS. Before it, "how many tasks are open?" had no answer: the tasks lived as
# PROSE inside MASTER-TASK-REGISTER.md (2,202 lines of open items, session notes and dated
# history mixed together), so the face could not be counted, ordered, or joined to anything.
# The face is now DERIVED from this file by scripts/gov_sync.py (one writer), whose --check BYTE-COMPARES
# the block it renders against the block in the face, and whose schema validation FAILS CLOSED (C16) on an
# entry that breaks the conventions below.
#
# CONVENTIONS (enforced by scripts/gov_sync.py's task_faults(), not by convention):
#   * id          : T-<n> for real work; R-<n> for a RULE that must keep holding (a standing rule).
#   * priority    : MUST | SHOULD | WORTH   (the MTR tier order; MUST is strategic-consequential)
#   * state       : open | rule (a standing rule: in effect, NEVER closes) | done | superseded
#   * mover       : owner | pipeline  (REQUIRED — WHO must act for it to advance, D-2985)
#   * source      : the register that EVIDENCES the task (a bug, a decision, a measurement file)
#   * evidence    : a path or a measured figure WITH ITS DATE — never an adjective, never undated
#   * gate        : what must arrive for it to advance ('none' when nothing blocks it). A gate that names
#                   the OWNER's word and mover: pipeline is a contradiction and FAILS CLOSED.
# D-2985 — WHY 'mover' EXISTS, and why 'gate' is no longer a STATE. One word ("open") covered three
# different situations: a rule that never closes, work only the OWNER can advance, and work the pipeline
# will advance. The face then led with three rows the owner could not act on and the agent could not move,
# session after session — which is what "the resolved items are still on top" was actually describing.
# A count a register owns has ONE home: a measured count in `title`/`why` is refused, because a count
# restated in prose is stale the moment it is written (BUG-588/D-2692) — state it in `evidence`, dated.
# APPEND-ONLY DISCIPLINE: a task is CLOSED by setting state: done + closed: <date>; it is never
# deleted (a register that forgets cannot be diffed). New entries are APPENDED at the end.
