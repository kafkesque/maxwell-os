schema_version: '1'
authority: D-2997
kind: ingest_identity_gate
# ─────────────────────────────────────────────────────────────────────────────────────────────
# ONE HOME of the INGEST-SIDE identity gate's policy (BUG-781). It CROSS-REFERENCES, never restates:
#   * the two detectors + the owner-ledger vocabulary : config/eval_integrity.yaml#duplicate_gate (D-2736/37/38)
#   * the collapse bar and its measured census       : config/corroboration_collapse.yaml#lexical_limb (D-2996)
#   * the corpus root / checkpoint root              : pipeline/pipeline_paths.py (BOOKS_DIR, CHECKPOINT_DIR)
#   * the source-noise markers and the sanitizer     : pipeline/book_metadata.py (D2449) + config/filtering.yaml
#   * the identity function itself                   : pipeline/book_metadata.py::compute_source_id (D2176/D2308)
# WHY THIS FILE EXISTS. The identity machinery was never missing — its ENFORCEMENT POINT was. MEASURED
# 2026-10-14: governance/duplicate_adjudication.json holds 59 adjudicable pairs with `adjudicated: 0` from
# 2026-09-30, because nothing in the INGEST path read it (the gate is declared POST-RUN only). BUG-780 measured
# the consequence: 530 of 1,393 corroborated rows are ONE TEXT under TWO NAMES (84 pairs), 369 served.
# This gate ADDS the missing enforcement point and NOTHING ELSE: it never re-detects (detection has one home),
# never merges, never deletes (R-D410), and never labels (D-2898 — a work-identity label is an owner word).

door:
  # The door is DELTA-SCOPED (the cascade rule): only files ABSENT from the metadata cache are candidates, so
  # an already-ingested file can never be re-classified here and no row, checkpoint or source_id can move
  # because of this gate. A deferred candidate is skipped IN PLACE (never deleted), loudly named, and recorded.
  new_file_definition: absent_from_metadata_cache
  action: defer_new            # defer_new | report | abort
  # A first run has no metadata cache yet (S0.5 WRITES it), and pre-S0 no corroboration claim is minted, so a
  # missing cache degrades LOUDLY (receipted as `identity_available: false`) instead of aborting. The same
  # absence at `--gate` (post-S0.5) is FATAL: there the door is the last screen before the claim is minted.
  on_missing_cache: degrade_loud       # degrade_loud | abort
  points: [pre_s0, pre_s1_5]   # ONE function, two declared call points; the identity screen is stronger after S0.5 (author|title exists)
  override_env: MAXWELL_INGEST_GATE   # value `warn` = publish the deferrals and proceed (logged AND counted, never silent)
  deferral_dir: temp/ingest_deferrals # gitignored runtime state: THIS batch's deferral receipt (D-2983 disposition)
  # The SAME rc means two things, by DECLARATION (never by accident): in `just health` rc 2 is OWNER-OWED and
  # NOT fatal (BUG-457); at the ingest door rc 2 REFUSES, because a run that proceeded would mint the very
  # claim (corroboration by two VOICES) that the unresolved identity makes false.
  ingest_reading: rc2_refuses

identity:
  # Deterministic name defects — MACHINE-decidable, so they are never an owner question; they are reported with
  # the sanitized name the file should carry. MEASURED 2026-10-14 on the 962-record cache: 571 names carry an
  # ingest-site marker, 34 carry a repeated internal space, 3 carry leading/trailing whitespace. Fixing an
  # already-ingested name is a WRITE, so the count is a DEBT rather than a fatal line — and WHICH debt it is, is
  # its DISPOSITION below (T-130 option B, owner word 2026-10-16): the whitespace classes are ACCEPTED DEBT
  # (printed and counted by this door, never an rc 2 trigger), the marker class stays OWNER-OWED and owns its
  # own row (T-173), because bundling them would let one act answer for two different blast radii.
  name_defect_patterns:
    leading_or_trailing_whitespace: '^\s|\s$'
    repeated_internal_whitespace: '\S\s{2,}\S'
  ingest_site_marker_pattern: '(?i)(z-libr|libgen|liber3|anna''s archive|annas-archive|1lib)'

  # ── T-130 OPTION (B) — THE OWNER WORD 2026-10-16 ("T-130 ok go with B") ──────────────────────────────────
  # B is TWO things and nothing else: (1) the door's record lookup becomes DECLARED and ORDERED, so the 37
  # names it calls defective are found through the SAME key it compares with (`_key()` already collapses
  # whitespace) instead of through the very bytes it calls defective (BUG-799, D-3034); (2) the whitespace
  # classes become DECLARED DEBT — printed, counted, and NOT an rc 2 trigger — while the marker class keeps a
  # disposition of its own. It does NOT rename anything: the approved rename is a CASCADE until it rides a
  # re-ingest (BUG-800: 2,952 references inside 13 already-written run receipts), so it is scheduled by a
  # REGISTER ROW (T-172) rather than by this file, and this file only declares what the door must now read.
  # The FIRST lookup that answers wins, and a receipt names WHICH one did. The order is not cosmetic: the
  # canonical fallback is what lets the DECISION ground a variant name in IDENTITY, so a renamed or
  # noise-suffixed file is DEFERRED and RECORDED (skipped in place, loudly) instead of being treated as a work
  # the corpus has never seen. It deliberately does NOT govern candidacy — see candidate_lookup below.
  candidate_lookup: [exact_name, exact_path]
  #: WHY CANDIDACY IS A SEPARATE, DECLARED RULE (BUG-848, MEASURED 2026-10-16). pipeline/stage0_convert.py
  #: converts the corpus MINUS the deferrals this door NAMES, so candidacy is VISIBILITY: a file no EXACT lookup
  #: names must be DECIDED (candidate -> a recorded deferral -> skipped in place). If the canonical lookup were
  #: allowed to decide candidacy, a noise-suffixed or freshly-renamed duplicate would be silently absorbed,
  #: never named in the receipt, and then CONVERTED — the duplicate work this gate exists to prevent — while the
  #: door's own reading still said 0 candidates. A candidate lookup that is not a SUBSET of record_lookup is
  #: FATAL, because the only way back into that trap is to add `canonical_name` here.
  record_lookup: [exact_name, exact_path, canonical_name]
  #: Every class the door COUNTS must have a disposition — a class with none, a token outside this vocabulary,
  #: or an `accepted_debt` with no named owner word is FATAL (the door's own reader faults on it). Acceptance is
  #: the riskiest reading a gate can make; it may be a WORD, never a default (D-3038 records what we accept).
  defect_disposition:
    leading_or_trailing_whitespace: accepted_debt
    repeated_internal_whitespace: accepted_debt
    ingest_site_marker: accepted_debt
  accepted_debt:
    # ONE WORD PER CLASS (D-3043 / T-173). An acceptance is a WORD ABOUT A CLASS: the word, the row it
    # names and the reason it is not a hazard are declared ON the class they are about. `same_as` is a
    # POINTER to another class's declaration and must RESOLVE (D-3034); an accepted class with no word of
    # its own, or a declaration for a class that is NOT accepted, is FATAL (the door's own reader).
    declarations:
      leading_or_trailing_whitespace:
        owner_word: 'OWNER WORD 2026-10-16 (verbatim): "T-130 ok go with B" — ACCEPT the 37 corpus-name
          defects with the debt declared, and make the acceptance safe with the canonical reader fallback
          and its own control.'
        declared_by: [D-3040]
        row: T-130
        because: 'MEASURED 2026-10-15 (BUG-800): the approved whitespace rename cannot be applied against a live
          corpus — the 37 stems are referenced 2,952 times INSIDE 13 already-written run receipts (the parquet export
          2,419; the stage0/2/4/5 checkpoints and their input_fbs), which are RUN RECEIPTS and cannot be rewritten
          without re-recording history (D-2642). The plan is written and waiting (89 rows -> 37 rows, apply_ready
          False, each row naming its artifact), and the act becomes non-cascading when those artifacts are
          regenerated anyway: T-172.'
        not_a_hazard_because: 'MEASURED 2026-10-15 (BUG-799): the door''s own comparison key `_key()` already
          collapses whitespace and strips, so a whitespace defect is STORAGE-non-canonicality, not ambiguity — it
          converts no duplicate work into a distinct one and hides no collision. The 2 canonical collisions in the
          live cache are duplicate records of ONE work (identical source_id), not two works under one name.'
        safe_because: 'the acceptance is CARRIED BY A MECHANISM, not by tolerance: identity.record_lookup resolves a
          defective name by the canonical key the door ALREADY compares with, so the DECISION grounds it in identity
          (`record_resolution: canonical_name`) and the outcome is a RECORDED deferral, skipped in place — never a
          work re-classified as new, and never a silent exclusion from the gate (BUG-848: candidacy stays EXACT).
          Both directions are controlled (scripts/check_ingest_identity_gate.py: the fallback resolves, an exact
          match still wins, a variant name STAYS a candidate and is deferred on identity, a record with no
          author|title still defers on its sanitized stem, and a genuinely new name is still admitted).'
      repeated_internal_whitespace:
        same_as: leading_or_trailing_whitespace
      ingest_site_marker:
        owner_word: 'OWNER WORD 2026-10-16 (verbatim): "T-173 accept" — the 459 ingest-site markers are
          ACCEPTED with the debt declared, and the SANITISE route is REFUSED with its reason (an accepted
          negative, D-3038), not left as an open question.'
        declared_by: [D-3043]
        row: T-173
        because: 'MEASURED 2026-10-16: 459 of 940 corpus stems carry an ingest-site marker (571 of 962
          cache names), and the remedy for this class is the SANITIZER — which would rename 571 names,
          not 37: T-130 option (B) deliberately did not widen its whitespace act into this class. The
          marker is STORAGE noise, not identity: the door key `_key()` = sanitize_source_book(stem)
          strips the marker before any comparison, so no work is read twice because of it and no
          collision is hidden by it.'
        not_a_hazard_because: 'the REFUSED route is the one with the blast radius. Renaming 571 names is
          ~15x the accepted whitespace act for ZERO identity gain, and against a live corpus it is a
          CASCADE (the same class of reference debt that makes T-172 refuse at 37 stems, BUG-800).
          Accepting a storage class is therefore cheaper AND safer than repairing it, and the repair
          stays available on the terms of T-172 if human-browsable names are ever wanted.'
        safe_because: 'the acceptance is CARRIED BY MECHANISMS, not tolerance: (1) the door key strips
          the marker, so a marker-bearing file resolves by the same canonical key as a clean one; (2)
          since T-172 the identity layer DEFERS a renamed file whose cache record still carries the old
          name (`already_ingested_by_canonical_name`) instead of re-ingesting it as a new work; (3) the
          class stays COUNTED and PRINTED here and in `just health` — the acceptance changes the rc a
          class triggers, never its visibility (D-3043).'

ledger:
  file: governance/duplicate_adjudication.json     # D-2738 — the ONE owner ledger (59 pairs, PENDING)
  verdicts_open: [PENDING]
  verdicts_closed: [MERGE, KEEP_SEPARATE]
  # ONE act, two sheets: T-129's sheet and the ledger carry the SAME ruling in two vocabularies. Declared here
  # so the gate can never report one owner act as two different debts (nor two debts as one).
  collapse_sheet: governance/work_identity_collapse_review_20261014.csv
  collapse_words:
    CONFIRM-ONE-WORK: MERGE
    DISTINCT: KEEP_SEPARATE
    LEAVE: PENDING
  #: BUG-782: the sheet's ruling COLUMN is resolved from its DECLARED home (ONE home, C12). A reader must never
  #: sniff a column by NAME: the v1 sheet carried a machine screen in a column named `owner_ruling`, and on the
  #: rendered sheet a name-sniff lands on `proposed_ruling` — i.e. it would count a PROPOSAL as an owner's word.
  collapse_word_column_from: config/owner_marks.yaml#homes.collapse_sheet.derived_column
  #: BUG-786 (MEASURED 2026-10-14): the DERIVED column is not enough. The sheet on disk carried a word in all 84
  #: rows while `ruling_source` said `none` for every one of them - the cells were typed by hand into the column
  #: `--apply` writes - and this reader counted them as RULED (84 ruled / 0 owed). A reader that cannot tell a
  #: hand-typed cell from a signature releases the lane without an owner act. So the PROVENANCE column is declared
  #: too, and a word whose provenance is blank or the `none` token below is OWED: `--apply` always records 'row'
  #: (a per-row override) or 'signature:<tier>@<date>' (a signature expansion).
  collapse_word_source_column: config/owner_marks.yaml#homes.collapse_sheet.provenance_column
  collapse_word_source_none: none

content:
  # P2 (post-S0, pre-S1.5): the D-2737 detector's report is the authority for content-level same-work pairs.
  report: governance/same_work_content_candidates.json
  title_report: governance/title_rename_candidates.json
  # A report OLDER than the newest corpus file certifies a corpus that no longer exists: measured, not assumed.
  staleness: fatal

name_normalisation:
  # T-130, OWNER-APPROVED 2026-10-15 ("Approve your T-130 Write recommendation"). The door's rc 2 named ONE
  # debt whose remedy is a WRITE: 37 of 940 corpus stems carry a name defect. MEASURED 2026-10-15.
  #
  # THE REMEDY CLASS MUST EQUAL THE DEFECT CLASS. The defect is whitespace, so the write is WHITESPACE-ONLY.
  # It deliberately does NOT run the file stem through `sanitize_source_book()` even though that function is
  # one line away: the sanitizer ALSO strips piracy markers, and applying it would rename 571 names instead of
  # 37 (571/962 cache names carry an ingest-site marker). That is a DIFFERENT debt with a different blast
  # radius; widening this act's scope to cover it is how a bounded repair becomes a corpus-wide rewrite.
  scope: whitespace_only
  transform: whitespace_collapse_then_strip
  transform_pattern: '\s{2,}'
  invariant:
    # The door compares names through ingest_gate._key() = sanitize_source_book(name).strip().lower(), which
    # ALREADY collapses whitespace and strips. So these defects are STORAGE-non-canonicality, not ambiguity:
    # the rename must leave the door's comparison key IDENTICAL, and a row that would move it is refused.
    key_preserved: 'gate._key(stem_before) == gate._key(stem_after), computed with the door''s own function'
    bytes_unchanged: 'sha256 before == after per row; a delta rolls the rename back mid-act'
    suffix_unchanged: true
    parent_unchanged: true
    collision: refuse
  # THE CASCADE IS MEASURED, NOT ASSUMED. A filename is referenced by things other than itself. The act can
  # rewrite the metadata cache (it is the gate's own store of `source_book`); it CANNOT rewrite a stage-output
  # filename or a store row, so a reference there makes the plan NOT apply-ready and the reason is printed.
  # An absent surface reads as null with a reason and is never reported as zero (D-795).
  surfaces:
    stage_dir_attrs: [S0_DIR, S1_DIR, S13_DIR, S15_DIR, S2_DIR, S4_DIR, S5_DIR, S6_DIR]
    # MEASURED 2026-10-15 (and the reason this key exists): a FILENAME-ONLY census read 0 references for
    # every one of the 37 rows while the same stems sat 3,171 times INSIDE 13 derived artifacts - the
    # parquet export (2,419), the stage0/stage2/stage4/stage5 checkpoints and their input_fbs. An instrument
    # that scans names and not content reports a false green (the BUG-787 shape). These are RUN RECEIPTS:
    # this act cannot rewrite them, so a hit here refuses the apply rather than dangling.
    artifact_dir_attrs: [CHECKPOINT_DIR, PARQUET_DIR]
    artifact_suffixes: ['.jsonl', '.json']
    store_db_attrs: [DB_PATH]
    store_columns:
      - [fbs, source_books]
      - [fbs, source_text]
  plan: governance/normalise_corpus_names_plan_20261015.json
  receipt: governance/normalise_corpus_names_receipt_20261015.json
  reading: scripts/normalise_corpus_names.py
  #: The door's own count of this debt (identity.name_defect_patterns above) is the DEFECT source of truth;
  #: this act never re-declares the patterns (C12) and never invents a second census home.
  #:
  #: T-130 OPTION (B), owner word 2026-10-16: this act is NOT applied against the live corpus. The whitespace
  #: debt is DECLARED, and the rename RIDES THE NEXT RE-INGEST — when the artifacts that reference the 37 stems
  #: are regenerated anyway, so the write stops being a cascade (BUG-800). The TRIGGER is a REGISTER ROW, T-172,
  #: and the reason is a MEASUREMENT rather than a preference: `apply_ready` is False with 37/37 rows refused,
  #: each naming its referencing artifact. Until then the refusal IS the finding.
  #: The declaration above is what makes that day safe: with identity.record_lookup, a renamed file whose cache
  #: record still carries the old name resolves canonically instead of reading as a NEW candidate and being
  #: re-classified — so the deferral is a SCHEDULE, not a debt that can decay into a surprise.
