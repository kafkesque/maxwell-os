- id: D-359
  category: ARCHITECTURE
  state: PROPOSED
  date: 2026-09-23
  title: "The vector store is keyed by ROWID: a re-commit retires the previous rowid's vector and completeness is asserted at the rowid level"
  decision: >-
    fbs' primary key is the TEXT fb_id, so INSERT OR REPLACE re-issues the implicit rowid; the vec store is keyed by
    that rowid. Every re-commit therefore moved the spine (fbs 7997..15991) while the old vectors survived (1..7996,
    7995 dead entries = 50% of vec_fbs), and the in-run completeness check was a COUNT that could not see it. The
    commit loop now captures the rowid an fb_id held BEFORE the insert and retires that vector in the same
    transaction (fail-loud if the retire fails), insert_embedding is idempotent per rowid, and the count check is
    replaced by assert_vector_integrity(): a ROWID-level join that RAISES on orphans (dead index entries silently
    dilute k-NN) while a missing vector is DEGRADED (that row still answers through FTS) and an absent vec table is
    DEGRADED (BUG-104). Verification owed before this is trusted: an R5 gemma-4-E4B review of the diff and a
    re-commit rehearsal on a scratch copy.
  artifacts: [pipeline/stage6_commit.py, tests/test_vec_rowid_contract.py, governance/FORENSIC_AUDIT_20260923f.md]
  related: [BUG-387, D-354, D-357, D-2185, BUG-104, D-359]
- id: D-361
  category: ARCHITECTURE
  state: RATIFIED
  title: "The D-354 vec store integrity gate is a chained control of just health"
  description: "Discharges the sequencing condition recorded in config/vec_integrity.yaml, which deliberately withheld the gate while the store was RED (a permanently RED gate is its own future tax). REPAIR RECEIPT 2026-09-23: 15990 dead vec rows deleted (7995 vec_fbs + 7995 vec_fbs_ctx) in one transaction after a backup_guardian copy and the script's own pre_d354 copy; post-repair vec_fbs live 7995 orphans 0 missing 0 (live_pct 100.0), vec_fbs_ctx dormant empty, 0 RED, gate exit 0. fbs was never touched: 7995 rows, rowids still 7997..15991, pragma integrity_check ok, 0 foreign-key violations, fbs_fts 7995. The gate then became a chained control of just health in the same session. It is fail-closed: an absent run DB is RED, so a machine without the run DB cannot pass health - intended, because the run DB is the served artifact. The control reads the SHADOW rowid tables, so it needs no sqlite-vec extension (the BUG-104 interpreter constraint applies to REPAIR only)."
  artifacts: [justfile, config/vec_integrity.yaml, scripts/verify_vec_integrity.py, scripts/repair_vec_integrity.py, knowledge pipeline/maxwell.db]
  related: [D-354, D-357, D-355, BUG-387, BUG-394, BUG-104]
