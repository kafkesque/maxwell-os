- id: CONV-044
  domain: psychology
  discipline: interpersonal communication
  source_books:
  - Emotional Intelligence — Daniel Goleman
  - Daring Greatly — Brené Brown
  cluster_segments:
  - source_book: Emotional Intelligence — Daniel Goleman
    text: 'Self-awareness — knowing one''s own emotions, strengths, weaknesses, and impact on others — is the foundation of
      emotional intelligence. But self-awareness has a structural blind spot: there are things about ourselves that others
      see clearly and we do not. Every person has a ''blind self'' — behaviors, habits, and patterns visible to everyone in
      the room except the person exhibiting them. Reducing the blind self through feedback is one of the highest-leverage
      activities in personal development.'
  - source_book: Daring Greatly — Brené Brown
    text: Vulnerability is the birthplace of connection, but it requires discernment about what to share with whom. Not everything
      about yourself belongs in every relationship — there is a healthy 'hidden self' that you choose to reveal only in trusted
      contexts. The boundary between privacy (healthy hidden self) and shame (unhealthy hidden self) is defined by whether
      concealment serves connection or disconnection. Knowing what to reveal and to whom is a skill that sits at the intersection
      of courage and wisdom.
