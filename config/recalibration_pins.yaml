schema_version: '1.0'
decision: D-353
rule: any change to a pinned artifact requires a NEW decision id in config/decisions.yaml, and the
  new sha256 and the new id are recorded HERE in the same commit (a re-pin is a re-mint, BUG-535). The SCAN is
  tri-state (BUG-536) - 0 clean | 1 a BROKEN declaration, fail closed | 2 the OWNER owes the re-measure and the
  re-mint - while the WRITE gate (--staged, pre-commit) refuses EITHER kind with 1, so the declaration and the
  code cannot drift apart by wording alone (D-2648)
