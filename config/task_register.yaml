    The audit owes: a protocol inventory, a POSIX-only call-site census, and a declared
    cross-platform smoke (the suite currently runs on macOS only).
    MEASURED 2026-10-13 (the two parallel read-only audits that fed this item were NOT recoverable as evidence -
    a task result that cannot be read is not a measurement, so the census was re-measured deterministically
    in-tree by the main session; that lesson is itself recorded here). CROSS-OS (C26): 131 subprocess call sites,
    of which 2 pass shell=True; 17 POSIX-only process/signal calls (os.fork/setsid, signal., resource., pty.,
    fcntl., termios., pwd., grp.); 7 privileged calls (os.getuid/geteuid/getgid/kill/chmod); 4 hardcoded /tmp or
    /var literals; and ZERO platform guards - no sys.platform, no platform.system, no os.name anywhere under
    pipeline/, scripts/, tools/. The POSIX assumption is therefore real, unguarded and UNDECLARED: on Windows
    those 24 sites fail with no diagnostic that names a platform contract. MODULARITY (C21): 65
