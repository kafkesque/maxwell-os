    text: 'Habit stacking is a strategy where you pair a new habit with an existing one using the formula: ''After I [CURRENT
      HABIT], I will [NEW HABIT].'' For example: ''After I pour my morning coffee, I will meditate for 60 seconds.'' The existing
      habit becomes the cue for the new one. This works because it eliminates the need to decide when to act — the trigger
      is already built into your routine. No motivation required; no willpower consumed.

      '
  - source_book: Influence — Robert Cialdini
    text: 'Commitment and consistency is one of the six principles of persuasion. Once people make a small commitment, they
      tend to behave consistently with it in subsequent, larger requests. The foot-in-the-door technique works because people
      construct a self-image from their past actions and then act to maintain that self-image. The key is the initial commitment
      — it must be voluntary, active, and public (or at least privately recorded) to trigger the consistency drive. Passive
      agreement doesn''t work.

      '
  is_convergent: false
  should_extract: true
  expected_fb:
