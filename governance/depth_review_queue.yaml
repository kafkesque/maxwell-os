    definition: Visual and auditory artistic media share common conceptual vocabularies
      for describing perceptual and emotional experiences. These shared terms—such
      as rhythm, texture, tone, color, and resonance—map onto analogous sensory dimensions
      across different artistic modalities.
    mechanism: This is an empirical pattern describing how artistic expression across
      modalities (visual vs. auditory) uses overlapping semantic frameworks. The shared
      vocabulary reflects common cognitive mappings between sensory experiences—such
      as associating 'rhythm' with both musical beats and visual movement, or 'color'
      with both visual hues and emotional tone. The pattern is observed in how designers
      and musicians describe their work using cross-modal metaphors.
    boundary: Applies when artistic media use shared conceptual frameworks for describing
      sensory experience. Fails when artistic domains use entirely distinct vocabularies
      or when the media are purely functional (e.g., technical manuals, architectural
      plans) rather than expressive.
