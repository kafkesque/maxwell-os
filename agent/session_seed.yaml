# Maxwell OS v2.1 — Session Seed
# Loaded at agent startup. Source of truth for session config.
# Updated: 2026-07-21 (M1 re-sync)

session:
    version: "2.1.0"
    pipeline_commit: v2.1-Phase0
    schema_version: "2.1"
    project_root: knowledge pipeline/

# ── Models (from CONSTITUTION.md §2) ──
models:
    generator:
        model: Qwen3-Coder-30B-A3B-Instruct-MLX-4bit
        provider: omlx
        temperature: 0.0
        family: qwen
    verifier:
        model: Phi-4-mini-instruct-8bit
        provider: omlx
        temperature: 0.0
        family: phi
    embeddings:
        model: bge-m3
        provider: ollama
        dims: 1024
        family: bge
    nli:
        model: DeBERTa-v3-base-mnli
        provider: local
        family: deberta

# ── Pipeline (7-stage) ──
pipeline:
    stages:
        stage0:  convert          # EPUB/PDF → MD (Pandoc/Docling)
        stage1:  chunk            # MD → segments + SHA-256 dedup
        stage1_5: intent_filter   # Semantic pre-filter (Phase 1)
        stage2:  extract          # Segments → principles + MinHash dedup
        stage3:  cluster          # UMAP + HDBSCAN clustering
        stage4:  merge            # Clusters → FBs + SALSA classify
        stage5:  verify           # FActScore + DeBERTa + BORP
        stage6:  commit           # SQLite + Parquet export
    clustering:
        method: UMAP
        metric: cosine
        random_state: 42
        n_dims: 50
        hdbscan_min_cluster_size: 8
    classification:
        method: SALSA
        model: verifier           # R5: Generator ≠ Classifier
        max_domains_per_fb: 5
    verification:
        borp_min_sources: 2
        nli_model: DeBERTa-v3-base-mnli
        fact_score: enabled

# ── Services ──
services:
    omlx:
        host: localhost
        port: 11435
        api_key: sk-maxwell-local
        watchdog: pipeline/omlx_watchdog.py
        memory_guard: pipeline/memory_guard.py
    ollama:
        host: localhost
        port: 11434

# ── Storage ──
storage:
    canonical: knowledge pipeline/maxwell.db
    checkpoints: knowledge pipeline/checkpoints/
    parquet: knowledge pipeline/parquet/
    archive: knowledge pipeline/archive/

# ── Governance ──
governance:
    constitution: CONSTITUTION.md
    decision_log: DECISION-LOG.md
    master_task_register: MASTER-TASK-REGISTER.md
    buglog: governance/buglog.md
    protected_files:
        - CONSTITUTION.md
        - DECISION-LOG.md
        - MASTER-TASK-REGISTER.md
        - AGENTS.md
        - .env
        - config/*.yaml
        - governance/*.md

# ── Boot Sequence ──
boot:
    1: Read CONSTITUTION.md
    2: Load agent/session_seed.yaml
    3: Run OMLX stress test (pipeline/omlx_watchdog.py --pre-stage)
    4: Verify OMLX + Ollama running
    5: python3 pipeline/status.py

# ── Phase Tracking ──
phase:
    current: Phase 0
    status: 11 of 14 fixes applied
    completed:
        - P0.1-P0.4    # Chunker fixes
        - P0.5         # UMAP replaces PCA
        - P0.6         # bge-m3 replaces nomic
        - P0.7         # HDBSCAN min_cluster_size=8
        - P0.8         # Verify cluster map
        - P0.9         # Stamp lineage singleton
        - P0.10        # R5: VERIFY_MODEL for SALSA
        - P0.11        # sqlite-vec load
        - P0.12        # OMLX watchdog (replaces guard)
        - P0.13        # Cloud code audit (none found)
        - P0.14        # Model audit (phantoms nuked)
    pending:
        - T-0.1        # OMLX memory stress test
        - M3            # D316 vs D2024 resolution
    next_phase: Phase 0.5 (4-layer cleaning)

# ── Book Library (v1 reference, not active in v2) ──
book_library:
    status: archived
    total_books: 863 MD, 505 EPUB, 673 PDF
    v2_source: knowledge pipeline/books/