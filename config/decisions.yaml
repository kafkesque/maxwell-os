  state: RESOLVED
  date: '2026-09-20'
  title: CT boundary sharpening — principle/growth_edge/process_template SHARPEN + BOUND (D-283)
  source: config/r5_slot_repair.yaml
  verification: 'Drafted 2026-09-20 after the single-coder ceiling showed CT kappa 0.333 (16/30) with drift concentrated on principle->growth_edge (x4) and principle->process_template (x2) — NOT the depth axis (0 specialized-principle->quarantine drift, confirming D-282). Added principle + growth_edge entries to config/r5_slot_repair.yaml with include/exclude. The principle<->growth_edge discriminator is epistemic STATUS (established/settled vs unverified-correlation/open-tension), NOT scope; principle<->process_template is procedural INTENT + done-condition. The A/B harness measured principle-class false-contra drop ~1.0 -> 0.27 after the new principle definition.'
  description: 'The D-282 depth fix held, but testing it exposed that the CT axis is under-specified at principle<->growth_edge and principle<->process_template (the real drift source). These boundaries are now SHARPEN + BOUND (pending human ratification, same as the D-278 repair slots). growth_edge remains the hardest class and may need further sharpening.'
