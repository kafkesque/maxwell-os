    mechanism: 'This is a DESCRIPTIVE MODEL — a classification system for product features based on their satisfaction dynamics.
      The model categorizes features into three types defined by their asymmetric satisfaction curves: basic features have
      a floor (dissatisfaction when absent) but no ceiling; performance features are linear; delighters have a ceiling but
      no floor. Cagan describes the model as a product management diagnostic, Eyal extends it with the time-migration dynamic
      (features shift categories as expectations evolve). Neither claims a causal mechanism — the model describes WHAT types
      of feature-satisfaction relationships exist and HOW they change over time.'
    boundary: 'Applies to products and services where customer satisfaction can be measured and features can be categorized.
      Fails for: (1) completely novel product categories where "basic" expectations don''t yet exist; (2) products where satisfaction
      is driven by factors other than features (brand, network effects, ecosystem lock-in); (3) B2B purchasing where the user
      and the buyer are different people with different satisfaction criteria. The model is a lens, not a formula — it helps
      you think about features, not calculate what to build.'
    consequence: 'The model implies that product teams should invest asymmetrically: ensure basic features work flawlessly
      (but don''t over-invest), compete on performance features (where more IS better), and selectively invest in delighters
      (where ROI is highest but temporary). It also predicts that yesterday''s delighter becomes today''s performance feature
      and tomorrow''s basic expectation — continuous innovation is structural, not optional.'
