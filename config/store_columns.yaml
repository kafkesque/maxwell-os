# store_columns.yaml - the register for the COLUMNS axis (BUG-524). Every column of the governed store must
# declare a lifecycle the MEASUREMENT supports; scripts/check_store_columns.py is the machine that fails when the
# declaration and the ruler disagree.
#
# MEASURED 2026-09-26 (7995 rows / 75 columns). The ruler is the blind spot, so this rail measures FIVE numbers per
# column and never one: nonnull | nonblank | hollow | distinct | mentions. `count(col)` counts '' as present and
# cannot see a blank; it cannot see '[]' either. That is why an earlier hand census of this store reported
# "procedural_skill is 0/7995" when the truth is: 7995/7995 rows carry a BLANK, and separately it reported ten
# zero-populated columns where the named rulers show 12 content-empty and 20 single-valued.
#
# DEFAULT DECLARATION (required, C12): every column NOT listed below is declared `value` - it must be non-blank on
# every row and must VARY. 52 of the 75 columns satisfy that today; the 23 that do not are named below.
#
# A column that must vary but is constant is NOT a separate role: it is `role: value` + `status: debt`, which is how
# the approved varying-column rule fails CLOSED instead of being remembered.
schema_version: '1.0'
decided: D-2809
bug: BUG-524
rail: scripts/check_store_columns.py
store: knowledge pipeline/maxwell.db
table: fbs
scan_roots: [scripts, pipeline, tools]
default_role: value
default_why: >-
  Declared default: every column not named under `columns:` carries a non-blank value on every row and the value
  varies (>= 2 distinct). Measured 2026-09-26: 52 of 75 columns; the exceptions are named below, each with a why.
columns:
  # ---- state: one value that IS this run's fact (a stamp or a genuinely single-state flag) ----
  provenance: {role: state, why: "constant 'llm_extracted_from_source' - the store is entirely LLM-extracted, which is a fact about this run and not a label"}
  verifier_model: {role: state, why: "constant 'MoritzLaurer/DeBERTa-v3-large-mnli-fever-anli-ling-wanli' - one NLI verifier, R5 satisfied, one run"}
  schema_version: {role: state, why: "constant '3.0' - the schema stamp of this run, R14 satisfied at row level"}
  gen_model: {role: state, why: "constant 'Qwen3-Coder-30B-A3B-Instruct-MLX-4bit' - one generator for this run"}
  fb_version: {role: state, why: "constant 1 - the first committed version of every feedback object in this run"}
  usage_count: {role: state, why: "constant 0 - the knowledge layer has never served this store, so nothing has ever been retrieved"}
  feedback_count: {role: state, why: "constant 0 - no feedback has ever been recorded against this store"}
  is_summary: {role: state, why: "constant 0 - this run produced no summary feedback objects, so the flag is true as declared"}
  practicality: {role: value, why: "D2622 advisory applicability tier (immediately-applicable|context-dependent|abstract), deterministic; persisted 2026-10-10 and backfilled on the canonical serving run (6591 rows: 5092/1499/0), NULL on excluded non-canonical runs (D-2881)"}
  # ---- reserved: nothing has written it yet (blank or hollow), so `filled_by` is REQUIRED ----
  procedural_skill: {role: reserved, filled_by: "pipeline/stage4_5_enrich.py Phase 1", why: "BLANK on 7995/7995 rows (not NULL - count(col) cannot see it) while 11 files read the column; the skill-orchestration field exists and is unwritten"}
  prerequisite_fbs: {role: reserved, filled_by: "pipeline/stage4_5_enrich.py graph pass", why: "hollow literal '[]' on 7995/7995 rows - an empty JSON array is not a value, and a reader cannot tell it from 'no prerequisite'"}
  contradicts_fbs: {role: reserved, filled_by: "pipeline/stage4_5_enrich.py contradiction pass", why: "NULL on 7995/7995 rows while 9 files name it"}
  last_retrieved_at: {role: reserved, filled_by: "the knowledge layer query path (T4)", why: "blank on 7995/7995 rows - retrieval has never been recorded"}
  feedback_score: {role: reserved, filled_by: "the feedback loop that does not exist yet", why: "NULL on 7995/7995 rows while 14 files name it; part of the unwired 4-column feedback subsystem"}
  menu_hash: {role: sparse, why: "6591 of 14574 rows carry content - the S4 menu provenance is now stamped on the post-boundary rows and correctly blank on the 7983 pre-boundary rows (never imputed, D-277)"}
  classification_error: {role: sparse, why: "52 of 14574 rows carry content - the D-2838 writer-limb (BUG-631) appends the domain-cardinality truncation receipt here; a scalar diagnostic on the rows that hit the cap, correctly blank on the rest"}
  discipline_macro: {role: sparse, why: "6591 of 14574 rows carry content - the D-2884(a) operative 3-way macro routing facet is stamped only on the canonical rechunk-v4-20260929 run that the serving layer reads; correctly NULL on the 7983 stale non-canonical rows (never served, BUG-691)"}
  # ---- sparse: a row-carried diagnostic ----
  classification_errors: {role: sparse, why: "2 of 7995 rows carry content ('Too many domains: 6 > 5' and 7 > 5) - a diagnostic carried by the rows that failed, which is the correct shape for it"}
  # ---- debt: KNOWN defects, OWED and shrink-only ----
  content_type: {role: value, status: debt, why: "constant 'principle' on 7995/7995 rows - the S4 content-type classifier never varied, so this column cannot carry the label authority the eval floor assumes"}
  classification_status: {role: value, status: debt, why: "constant 'CLEAN' on 7995/7995 rows while classification_errors records 2 real errors and status QUARANTINEs 2972 rows - a status column that is FALSE, not merely unvarying"}
  borp_score: {role: value, status: debt, why: "constant 0.0 on 7995/7995 rows - retired per T2, still NAMED by 13 files, so a reader can branch on a value nothing writes (the BUG-511 family)"}
  application: {role: value, status: debt, why: "blank on 1 of 7995 rows (measured nonblank 7994) - a single blank makes the column indistinguishable from unwritten for that row; repair the writer"}
  jargon: {role: value, status: debt, why: "blank on 2091 of 7995 rows (measured nonblank 5904) with 5868 distinct - a partially written field whose blank rows cannot be told from 'no jargon'"}
  duplicate_of: {role: reserved, status: debt, filled_by: "a dedup stage that no longer exists (D2120/D2198)", why: "blank 0/7995 for a REMOVED stage while 11 files still name the column"}
  content_type_source: {role: reserved, status: debt, filled_by: "the S4 label-provenance stamping pass", why: "blank 0/7995 while governance/gold_4axis.jsonl is 100% stamped per axis - R14 holds at ROW level and FAILS at LABEL level"}
  discipline_source: {role: reserved, status: debt, filled_by: "the S4 label-provenance stamping pass", why: "blank 0/7995 while the anchor records 142 reliable-pair and 60 human labels for this axis"}
  extraction_type_source: {role: reserved, status: debt, filled_by: "the S4 label-provenance stamping pass", why: "blank 0/7995 - the weakest anchor axis (joint-vote 202 of 251) is also the one with no store-side provenance"}
