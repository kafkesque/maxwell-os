- id: L03_baseline_marketing_psychology
  description: Clear marketing/psychology FB
  fb_name: Loss Aversion in Pricing Strategy
  fb_definition: Consumers feel losses approximately twice as intensely as equivalent gains. Framing a price as 'avoiding
    a $100 loss' is more persuasive than 'gaining $100 in value'. Effective pricing strategies leverage this asymmetry by
    emphasizing what customers stand to lose by not purchasing.
  expected_output:
    application: Structure pricing pages to show the cost of NOT using the product (lost revenue, wasted time, missed opportunities)
      BEFORE showing the price. Use 'Save $X' rather than 'Get $X off' messaging.
    failure_mode: Overusing loss framing creates negative brand association — customers feel manipulated rather than informed.
      Balance loss framing with gain framing for loyalty-focused segments.
    elaboration: 'Loss aversion is prospect theory''s cornerstone: the pain of losing $100 is psychologically equivalent to
      the pleasure of gaining $200. Marketing that only emphasizes gains is fighting an uphill battle against this 2:1 asymmetry.
      Smart pricing surfaces the avoided loss and then offers the solution as relief.'
    keywords: loss aversion, prospect theory, framing effect, anchoring, reference point
    jargon: 'Loss aversion: The psychological tendency to feel losses more intensely than equivalent gains. Prospect theory:
      A behavioral model describing how people choose between probabilistic alternatives involving risk.'
  expected_domains:
  - business operations
  expected_depth: domain
  expected_evidence: cited
  test_property: 'baseline: marketing + psychology, dual discipline'
  expected_discipline: marketing
- id: L04_baseline_ai_engineering
  description: Clear AI/ML engineering FB
  fb_name: Embedding Drift Detection in Production
  fb_definition: ML models in production degrade when input distributions shift from training data. Monitoring embedding drift
    — the semantic distance between current and reference input embeddings — provides an early warning signal before accuracy
    drops below acceptable thresholds. Cosine distance above 0.3 typically indicates meaningful drift.
  expected_output:
    application: 'Implement a drift monitoring pipeline: compute reference embeddings on training data, batch-embed production
      inputs nightly, calculate cosine distance distribution, and trigger alerts when the 95th percentile exceeds 0.3.'
    failure_mode: Teams monitor only accuracy metrics which lag behind drift by days or weeks. By the time accuracy drops,
      the model has been serving degraded predictions to users, causing silent business impact.
    elaboration: Embedding drift catches semantic shift that accuracy metrics miss. If users start asking about 'crypto wallets'
      when the model was trained on 'banking,' the words change but accuracy might not drop until users churn. Embedding distance
      captures this shift within hours.
    keywords: distribution shift, embedding drift, cosine distance, reference distribution, concept drift, data drift
    jargon: 'Embedding drift: The change in semantic representation of input data over time as real-world distributions shift.
      Cosine distance: A measure of similarity between two vectors, with 0 meaning identical direction.'
  expected_domains:
  - ai & agents
  - code & computation
  expected_depth: domain
  expected_evidence: cited
  test_property: 'baseline: ai engineering + data science'
  expected_discipline: machine learning
- id: L05_baseline_cognitive_science
  description: Clear cognitive science FB
  fb_name: Chunking Overcomes Working Memory Limits
  fb_definition: Human working memory holds approximately 4±1 items simultaneously. Chunking — grouping related information
    into meaningful units — effectively expands capacity by treating each chunk as a single item. Expert chess players chunk
    board positions into tactical patterns, enabling them to remember far more than novices.
  expected_output:
    application: Design interfaces that present information in groups of 3-5 items. Phone numbers use chunking (XXX-XXX-XXXX).
      Navigation menus should have 5-7 top-level items max. Form fields should be grouped into logical sections of 3-5 fields.
    failure_mode: Interfaces that present 10+ ungrouped options trigger choice paralysis. Users scan randomly rather than
      systematically, missing critical options and making errors.
    elaboration: The magic number 7±2 (Miller's Law) was later refined to 4±1 for working memory. But chunking effectively
      bypasses this limit — a chess grandmaster doesn't remember 25 individual pieces but 5-6 tactical patterns. The key to
      good UX is providing the chunks, not asking users to create them.
    keywords: working memory, chunking, Miller's Law, cognitive load, pattern recognition
    jargon: 'Working memory: The cognitive system holding a limited amount of information temporarily for processing. Chunking:
      Grouping related information into meaningful units to expand effective memory capacity.'
  expected_domains:
  - user experience
  expected_depth: domain
  expected_evidence: cited
  test_property: 'baseline: cognitive science, single discipline'
  expected_discipline: cognitive science
  accept_any_of_evidence:
