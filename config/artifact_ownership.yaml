    note: >
      The registry is the source of truth for decision ids. Records are APPEND-ONLY and EXTEND TO
      END-OF-FILE: a record is never deleted, retitled or rewritten in place, and NO existing key may be
      rewritten by any writer - which is why owned_by is EMPTY rather than a list of columns. ONE exception,
