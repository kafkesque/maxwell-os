stage5:
  borp_bypass_types:
  - process_template
  - process_instance
  - growth_edge
  - tool_instruction
  factscore_enabled: false
  nli_model: MoritzLaurer/DeBERTa-v3-large-mnli-fever-anli-ling-wanli
  nli_entailment_threshold: 0.05
  nli_pass_threshold: 0.5
  nli_marginal_threshold: 0.0
  nli_max_premise_chars: 1500
  nli_max_hypothesis_chars: 500
  evidence_contamination_ratio: 0.15
  mechanism_min_length: 150
  citation_echo_source_threshold: 20
  evidence_garbage_min_words: 6
  evidence_garbage_max_underscore: 2
  evidence_garbage_min_alpha_ratio: 0.5
  b2_majority_ratio: 0.5
  # D-2822: S5 cross-passage NLI aggregation mode. 'majority' = D2507/B2 strict-majority
  # (current, calibrated). 'or_entail_and_no_contra' = D-2822 Gate A(d): a convergent FB is
  # VERIFIED only when at least ONE clean passage entails (OR-entail) AND ZERO passages
  # contradict (AND-no-contra). FLIP ONLY after D-2822 threshold recalibration (nli_calibrate.py).
  nli_aggregation: or_entail_and_no_contra
  # D-2858/D-2863: fail-closed calibration stamp. stage5_verify.py (D-2858 step 4 guard) refuses
  # or-entail mode unless aggregation matches, threshold == nli_pass_threshold, decision non-empty.
  # Re-minted from the 2026-10-07 recalibration (best_precision_threshold 0.5, precision 0.852).
  nli_calibration:
    aggregation: or_entail_and_no_contra
    threshold: 0.5
    decision: D-2863
    precision: 0.852
    recall: 0.414
  # D-B (BUG-705): paraphrase-aware grounding — RECALL path. ⛔ RETIRED (D-2932, owner approved
  # 2026-10-11). bge-m3 STS cosine measures semantic relatedness, NOT paraphrase/entailment — it
  # is the WRONG primitive to override the stronger DeBERTa entailment signal. Measured
  # non-discriminative (true-vs-false Δ=0.048) and below the ship bar (R=0.065 at P>=0.85).
  # The correct lever for faithful-reworded NEUTRAL recall is the NLI entailment calibration
  # (D-2822 or-entail + AND-no-contra, threshold 0.5, D-2863) — already ratified, see
  # stage5.nli_aggregation. paraphrase_path_enabled stays FALSE PERMANENTLY; do NOT re-enable.
  paraphrase_path_enabled: false
  paraphrase_similarity_threshold: 0.85
  paraphrase_model: bge-m3
  paraphrase_min_entail: 1
  # BUG-705-threshold: WEAK-entail pre-filter for the paraphrase RECALL path. This must be
  # BELOW nli_pass_threshold (0.5) or the path can never fire — the target rows are
  # "max entail 0.13-0.46 < 0.5". 0.10 matches D-2920's documented "ent>=1" recoverable
  # population. Config-first (C12); re-tune only via gold-set calibration, never by hand.
  paraphrase_entail_threshold: 0.10
  paraphrase_require_no_contra: true
  paraphrase_max_chars: 1500
  paraphrase_calibration:
    decision: D-2932
    threshold: null
  banned_mechanism_prefixes:
  - because it enables
  - because it allows
  - because it helps
  - because it provides
  - because it makes
  - because it can
  # BUG-504 (2026-09-25): these five values were read with SILENT CODE DEFAULTS in
  # pipeline_paths.py - a config miss could change the S5 score axis with no error anywhere. They
  # are now DECLARED and read loudly (C12/C16). The values are byte-identical to the former
  # defaults, so behaviour is unchanged and the stored corpus still reproduces on 7,995/7,995 rows
  # (scripts/check_s5_score_axis.py). D2310.
  #
  # BUG-525 (2026-09-26): this key was declared TWICE in this mapping - a shadowed `confidence:` sat
  # directly above `borp_bypass_types:` and PyYAML silently kept the LAST one, so the declaration
  # above was a fact nobody read (D-2649). The shadowed copy was deleted. The surviving values are
  # parse-IDENTICAL (0.4 and strong), so no score moves and the D-330 stage5 slice fingerprint is
  # unmoved; only the ambiguity is gone. No reader ever saw the deleted copy.
  confidence:
    mechanism_weight: 0.35
    enrichment_weight: 0.25
    isor_weight: 0.4
    quarantine_cap: 0.25
    human_review_isor_rating: strong
  checkpoint_interval: 50
  # D-330 (BUG-362): the S5 input fingerprint binds ONLY these files + the stage5 config
  # slice + the S4 checkpoint content + the model lineup — never global HEAD, which moved on
  # governance-only commits and hard-discarded a live 1,250-row checkpoint.
  fingerprint_files:
    - pipeline/stage5_verify.py
    # T-196/D-3136 (2026-10-23): the per-record sequence MOVED OUT of stage5_verify into one home. A module that
    # changes S5's output must be in this list or an edit to it would leave the checkpoint looking valid
    # (BUG-614: the fingerprint must cover every module that changes the OUTPUT, not only the ones that existed
    # when the list was written).
    - pipeline/verify_record.py
    - pipeline/serving_gate.py
    - pipeline/io_guard.py
  single_writer_lock: true  # BUG-361: refuse a second S5 writer on one checkpoint
stage6:
  # D-2933 (owner-ratified 2026-10-11, "rule V"): VERIFICATION-SCOPED COMMIT.
  # S4 owns the ontology (name/definition/domains/discipline/content_type/...); S5 owns
  # provenance (status/verification_results/...). A commit that rewrites S4-owned columns
  # from an S5 checkpoint REGRESSES ratified labels (BUG-709: 770/6591 rows differ, 466
  # caught by D2620, ~304 silently) and can never be more correct than the store it
  # overwrites. In this mode an existing fb_id receives ONLY the S5-owned columns below;
  # a fb_id that is absent from the store still takes the full INSERT path (a genuinely
  # new row has no ratified ontology to protect). `full_upsert` restores the legacy
  # INSERT OR REPLACE and must only be used when the store is known to be behind the
  # artifact. An unknown value FAILS CLOSED (C16).
  commit_scope: verification_scoped
  # D-2934 (2026-10-11): the taxonomy-skew guard is COLUMN-SCOPED, not row-scoped.
  # The S5 checkpoint is stamped taxonomy_version v5.6 / menu_hash 99e1df82… (it was produced
  # 2026-09-29) while the store was re-stamped to v9 by D-2899. A row-scoped guard would refuse
  # every row forever, because the checkpoint artifact is permanently v5.6 — blocking the
  # canonical run on a stale stamp rather than on a real risk. The real risk is narrower:
  # writing a MENU-DERIVED value from a v5.6 menu onto a v9 row. No column in the S5-owned set
  # is menu-derived, and that is PROVEN, not assumed:
  #   * pipeline/stage5_verify.py derives status/s5_reason/verification_results/verifier_model/
  #     verification_method/isor/epistemic_status/needs_human_review from (definition, evidence)
  #     — its ONLY taxonomy reference is the fingerprint guard (line ~905), never the verdict;
  #   * practicality is classified from config/practicality.yaml alone (pipeline/practicality.py);
  #   * committed_at is the write clock.
  # Empirically: definition drift checkpoint↔store = 0/6591 (fb_id is a content hash), so the
  # verified input is byte-identical across the menu change.
  # Guard behaviour: if ANY column being written appears in this list, the row is REFUSED
  # (fail-closed). An empty list therefore means "the skew is immaterial and is recorded as a
  # loud advisory". Never add a column here to silence a failure — add it to stop a real write.
  taxonomy_dependent_columns: []
  # Only columns PRESENT in the S5 checkpoint are written, so a field the checkpoint does
  # not carry can never be default-injected over an existing store value. `borp_score` is
  # deliberately absent: no S5 checkpoint carries it, so writing it would zero the column.
  # D-2970 (BUG-745): the SCORE AXIS is written as an AXIS or not at all. `confidence_score` and
  # `needs_human_review` are ONE rule with TWO outputs (pipeline/serving_gate.py::derive_conf_and_review,
  # BUG-502) - and this list carried only the SECOND half. MEASURED (A/B against the pre-re-verification
  # store): the D-2822 re-verification (or-entail + AND-no-contra @ 0.5) rewrote the record + status +
  # s5_reason + epistemic_status of all 6,591 rows, the confidence of NONE, so 2,247 rows kept a
  # confidence computed by the SUPERSEDED majority@0.1 aggregation (the stored confidence is
  # byte-identical on 6,591/6,591 rows across the re-verification, while `factual.passed` flipped on
  # exactly those 2,247). scripts/check_s5_score_axis.py is the rail that measured it; the repair is
  # scripts/repair_s5_score_axis.py (re-derive from the record through the ONE home).
  # Drift-proofing: a column added here must not SPLIT a declared axis (stage6.s5_axis_columns) - the
  # stage6 preflight refuses a partially-present axis (fail-closed, C16), so this cannot recur silently.
  s5_owned_columns:
  - status
  - s5_reason
  - verification_results
  - verifier_model
  - verification_method
  - confidence_score
  - needs_human_review
  - epistemic_status
  - isor
  - practicality
  - committed_at
  # D-2970 (BUG-745): DECLARED WRITE AXES. A group declared here is written WHOLE: the stage6
  # preflight refuses a commit scope that carries only PART of a group, because half an axis is a
  # split truth - the store would then hold a value its own record does not derive (D274h). The
  # declaration lives HERE (C12) so the guard is a rule, not a comment a reader has to remember.
  s5_axis_columns:
    score_axis:  # serving_gate.derive_conf_and_review - confidence + human-review flag, ONE rule
    - confidence_score
    - needs_human_review
  # D-2951 (2026-10-12): COMMIT-TIME DEDUP GATE — the PREVENTION half of D-2949.
  # D-2949 #4 root-caused the 3 near-duplicate name groups to "stage1 SHA-256 EXACT-dedup +
  # no name-level uniqueness at commit": stage1 dedups SEGMENTS, so two extractions of the
  # same concept from the same work produced two fb_ids and both landed. This gate supplies
  # the missing check AT THE COMMIT BOUNDARY, over the deterministic identity model of
  # D-2950 (pipeline/dedup_identity.py): grouping key = (normalize_name(name), source_ids);
  # merge gate = body divergence of definition+mechanism (thresholds in config/dedup_identity.yaml).
  # No LLM in this path (D-343). It checks the store AND the rows already accepted by this
  # batch, so a collision created WITHIN one run is caught too.
  #   mode: report  -> compute every decision, write the receipt, CHANGE NOTHING. (default:
  #                    evidence before enforcement; the flip is an owner call)
  #   mode: enforce -> additionally LINK a convergent re-extraction: duplicate_of = incumbent
  #                    fb_id + status QUARANTINE via serving_gate.derive_status (the ONE status
  #                    rule, D274h). That is the locked policy "mark duplicate_of + QUARANTINE,
  #                    NEVER delete" (D2625/D2630) — nothing is deleted and retrieval keeps
  #                    serving the incumbent. Applied ONLY when the INCUMBENT is the richer row;
  #                    a candidate richer than the store's row is reported as a supersede
  #                    candidate for an owner call instead (D-2933 rule V: a commit never
  #                    rewrites an existing row; D-2950 supersession ruling still pending).
  #                    Divergent same-name rows are KEEP-BOTH and are only reported — renaming
  #                    them is owner-gated (D-271a).
  dedup_gate:
    enabled: true
    mode: report
  commit_non_fb_types: true
  okf_export_enabled: true
  max_failed_ratio: 0.0
  vec_require: true  # D-2727: fail-closed vec0 gate at RATIFY-2 launch (vec0 verified under /opt/homebrew/bin/python3)
  vec_python: /opt/homebrew/bin/python3
  fingerprint_files:
    - pipeline/stage6_commit.py
    - pipeline/serving_gate.py
    - pipeline/io_guard.py
    # D-2951: the dedup gate decides what S6 writes, so a checkpoint produced by these two is no
    # longer the checkpoint the list above describes. BUG-614: the fingerprint must cover every
    # module that changes the OUTPUT, not only the ones that existed when it was written.
    - pipeline/dedup_gate.py
    - pipeline/dedup_identity.py
stage4_5:
  enabled: false
  model: gpt-oss-20b-MXFP4-Q8
  procedural_skill_enabled: true
  edge_enabled: true
  edge_candidate_threshold: 0.8
  edge_max_candidates_per_fb: 10
  edge_max_tokens: 512
  procedural_skill_max_tokens: 256
  max_failed_ratio: 0.01
  checkpoint_interval: 5
coverage:
  threshold: 0.5
  flag_fraction: 0.3
retrieval:
  method: vector  # D-2724: production candidate pool. 'vector' = pure vector + cross-encoder rerank (vector+rerank, D-2723 recommendation — RRF fusion is recall-negative); 'rrf' = RRF fusion of FTS+vector+keyword (legacy hybrid/hybrid+rerank).
  # A2/BUG-274: related_fbs relationship types that are semantically SYMMETRIC
  # (undirected). The store materialises related_fbs under a per-FB top-k
  # neighbour cap (BUG-188), so a weak overlap edge may survive on only ONE side.
  # graph_expand therefore follows INCOMING edges of these types too (reverse
  # adjacency) to restore reachability symmetry WITHOUT mutating the store —
  # backfilling the pruned direction would fabricate adjacency the cap
  # intentionally dropped (D-277). All four are overlap/similarity signals and
  # inherently undirected.
  symmetric_relationship_types: [semantic_near, source_crossover, discipline_overlap, domain_overlap]
  fts_stopwords: [a, an, the, and, or, of, to, in, on, for, with, is, are, was, were, be, been, how, what, why, when, where, which, who, do, does, did, can, could, should, would, will, this, that, these, those, it, its, as, at, by, from, about, into, than, then, so, if, but, not, no, have, has, had, i, me, my, we, our, you, your, they, them, their]
retrieval_eval:
  model: Phi-4-mini-instruct-8bit
  provider: omlx
  max_tokens: 1024
  confidence_threshold: 0.85
  max_iterations: 3
  max_fbs_to_evaluate: 15
  fb_definition_max_chars: 300
  fb_name_max_chars: 200
retrieval_benchmark:
  top_k: 10
  # D-2980: 0 = DERIVE the per-leg pool from serving.pool (the policy the SERVED path uses);
  # a non-zero value is an explicit A/B override. The harness used a literal 30 while
  # production used 50-100, so no leg was ever the served path.
  candidate_pool: 0
  # D-2940: the LABEL-FREE slice. Mints no gold label (D-2898 governs LABELS, and
  # there are none here) so it is not owner-gated; always runnable, unlike the
  # semantic golden slice, which needs an owner-signed anchor. A FB name is a
  # LEXICAL query, so FTS is flattered: this is the REGRESSION rail, not a quality claim.
  self_retrieval:
    sample: 30
    order: fb_id          # deterministic sample (C12/C20: no unrecorded randomness)
    legs: [production, fts, vector, vector+rerank, hybrid, hybrid+rerank]   # D-2980: production = the SERVED path (the dispatcher) is the REFERENCE leg
  reanchor:
    candidates: 5
    snippet_chars: 220
    # D-2987: the REVIEW VOCABULARY the applier accepts - ONE home (C12), read by
    # scripts/reanchor_retrieval_goldens.py. MEASURED 2026-10-13: it existed ONLY as a Python tuple inside
    # the reader, and TWO consecutive session handoffs (D-2985, D-2986) told the owner to write
    # `keep/replace/drop/add` - tokens this applier accepts NOWHERE. A vocabulary that exists only inside
    # its reader is a vocabulary the writer guesses at, and the guess costs real work: `--apply` fails
    # closed on an unrecognised verdict (exit 2), so the owner would have filled 150 cells and been refused.
    # The four tokens, in the owner's terms:
    #   anchor        = THIS candidate NAME is the right answer for this query. Exactly ONE row per query.
    #   rewrite-query = the query is worth keeping but is worded badly; drop it from the set now.
    #   retire-query  = the query is no longer a question the system should answer; drop it on purpose.
    #   ambiguous     = the owner judged THAT CANDIDATE undecidable (D-2991): it is EXCLUDED from the
    #                   expected set and COUNTED. It PARKS the query - and blocks `--apply` - only when
    #                   the query carries no anchor at all, rather than guessing a label (D-2898).
    decisions: [anchor, rewrite-query, retire-query, ambiguous]
    # D-2939 declares anchors are OWNER-SIGNED and that no model may sign one. MEASURED 2026-10-13: the CSV's
    # `owner_signature` column was written by the generator and read by NOTHING in the repository - the
    # declaration had no control behind it (BUG-492: a detector nobody has seen fail is not a detector).
    # When true, `--apply` refuses to write an anchor whose chosen row carries no signature.
    owner_signature_required: true
    # D-2991: a query's expected answer is EITHER exactly one owner-signed anchor row (`single`) OR every row the
    # owner marked, ordered by rank (`set` = the expected SET that recall@k is micro-averaged over). MEASURED
    # 2026-10-13: the owner's 150-cell review marked 3-5 candidates per query, and the v2 applier - which hardcoded
    # `single` in TWO places - refused that sheet for a limit the harness it feeds never had (`expected_names` is a
    # list; `_recall_at_k` divides by len(expected)). DECLARED here and never INFERRED from the sheet: an inferred
    # mode is a ruler whose meaning depends on the data it measured, and T-101 exists because that ruler saturated.
    # 2026-10-14: owner word GRANTED = `set` (T-101). The reviewed sheet's 120 anchors now apply as the expected
    # SET recall@k is micro-averaged over. `--apply` remains gated by owner_signature_required and C13 backup.
    anchor_mode: set
    # BUG-971 (2026-10-23): THE VOCABULARY IS DECLARED HERE, ONCE. `anchor_mode` names a token; until today the
    # IMPLEMENTED tokens were a code tuple `("single", "set")` in the applier AND a second one in the resolver
    # (pipeline/golden.py, BUG-970) - two homes for one closed vocabulary, which is the drift this OS refuses.
    # The same read also DEFAULTED to `single` when the key was absent, so a missing declaration silently changed
    # the ruler's semantics (the D-2982 fail-open class). A reader that finds no list, or no mode, must REFUSE.
    anchor_modes: [single, set]
    # BUG-784 (2026-10-14): WHERE THE REVIEWED SHEET LIVES. MEASURED: `--check`/`--apply` defaulted to
    # `governance/golden_reanchor_candidates_20261011.csv` + `governance/golden_reanchor_proposed_20261011.yaml`,
    # which are the GENERATOR's outputs (both carry EMPTY `decision`/`owner_signature` columns). The pre-flight read
    # the UNREVIEWED sheet, reported "0 / 30 queries carry an anchor" and T-101 was recorded as OWED - while the
    # SIGNED sheet (150 rows, 120 anchors, 19 abstentions, 150 owner signatures, dated 2026-10-13) sat one filename
    # away, unread by anything. A reader that names its input by a GENERATOR's default path cannot see the artifact a
    # human filled. Declared HERE (ONE home, C12); the reader PRINTS the sheet it read plus its marked/signed counts,
    # so a wrong path can no longer be misread as the owner's omission.
    reviewed_sheet: governance/golden_reanchor_candidates_20261011.reviewed.csv
    # The DRAFT is the judgment's denominator (its query list, in order). It was a PROJECTION living in the
    # gitignored, auto-purging `temp/` (temp/golden_proposed_v5.yaml): the artifact `--apply` depends on would have
    # vanished within 7 days, which is the same class of home as the pair object BUG-782 found under temp/. Moved to
    # a durable home 2026-10-14; its header records how it was built (judge_review(mode='set') over the reviewed
    # sheet) so it stays reproducible rather than becoming a new single copy of record.
    reviewed_draft: governance/golden_reanchor_proposed_v5.yaml
