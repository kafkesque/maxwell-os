  input_fb:
    name: Three-form Work Engagement
    definition: 'Work can be systematically categorized into three distinct forms:
      Mapping (planning and design), Making (execution and creation), and Meshing
      (integration and collaboration). Effective engagement requires deliberate participation
      in all three forms to achieve optimal contribution and capability.'
    mechanism: This is a descriptive model that categorizes work into three structural
      forms based on function and process. The model describes how work naturally
      organizes into these three modes rather than explaining a causal relationship
      between them. Each form serves a distinct organizational role in the work lifecycle.
    boundary: Applies to work environments where tasks can be meaningfully decomposed
      into planning, execution, and integration components. Fails when work is purely
      linear or when the three forms do not clearly differentiate in practice (e.g.,
      in highly specialized roles where only one form is relevant).
