    name: Incentive Frame Displacement — When Fines Backfire
    definition: Introducing an extrinsic incentive (money, penalty, reward) can backfire when it reframes an intrinsically
      motivated behavior as a market transaction. The new frame displaces the original motivation — guilt becomes price, passion
