  - The Pragmatic Programmer — Andrew Hunt, David Thomas
  cluster_segments:
  - source_book: The Pragmatic Programmer — Andrew Hunt, David Thomas
    text: "To debug effectively, first reproduce the failure with a minimal test case, then narrow the cause by repeatedly bisecting the suspect code, then write a failing test that captures the bug, and only then fix the underlying cause so the test passes."
  is_convergent: false
  should_extract: true
  expected_fb:
    is_summary: false
    route: FB
    name: Reproduce-Bisect-Test Debugging Protocol
    definition: "A repeatable method for fixing a defect: reproduce the failure with a minimal case, bisect to narrow the cause, capture it in a failing test, then fix the cause so the test passes."
    mechanism: "Reproduction makes the failure observable and deterministic; bisection halves the search space per step; the failing test localizes the defect and guards against regression; fixing is then verified when the test turns green."
    boundary: "Applies to reproducible software defects. Fails when the bug is non-deterministic or cannot be reproduced in a minimal case, which blocks bisection."
    consequence: "Debuggers who reproduce, bisect, and test-lock the bug before fixing spend less time in unfocused code inspection and prevent regressions."
    elaboration: ""
    extraction_type: normative_heuristic
    content_type: process_template
    trigger: "When a software defect needs to be located and fixed"
    prerequisite: ""
    steps:
    - "Reproduce the failure with a minimal test case"
    - "Bisect the suspect code to narrow the cause"
    - "Write a failing test that captures the bug"
    - "Fix the underlying cause until the test passes"
    done_condition: "The failing test passes and the defect no longer reproduces"
    failure_mode: "Fails when the bug cannot be reproduced in a minimal case, blocking bisection"
    evidence_passages:
    - "To debug effectively, first reproduce the failure with a minimal test case, then narrow the cause by bisecting, then write a failing test, and only then fix the cause."
  rationale: "A repeatable HUMAN how-to method with ordered steps. content_type=process_template (NOT tool_instruction — mentioning tests/bisection does not make it a software API)."
  tier: CORE

