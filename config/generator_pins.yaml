# ── config/generator_pins.yaml — WHO PRODUCED THE NUMBERS (BUG-538 / D-2653) ──
#
# WHY THIS FILE EXISTS. Maxwell pinned its SCRIPTS (config/recalibration_pins.yaml) and its EVIDENCE
# (sha256 blocks in the anchor configs) but pinned ZERO GENERATORS. Every metric record names its
# generator with a STRING, and a name is not an identity: an `ollama pull`, an HF re-download or an
# LM Studio re-quantisation moves the bytes while every stored `gen_model` keeps saying the same words.
# A measurement whose generator silently changed is not a smaller measurement - it is an UNCOMPARABLE
# one. This was found by measuring, not by reasoning: `Qwen3-Coder-30B-A3B-Instruct-MLX-4bit` (the
# generator) and `gemma-4-E4B-it-MLX-4bit` (the R5 reviewer) are the two cache entries that are NOT
# content-addressed (rev=main, no symlinks), i.e. exactly the two whose identity could not be read off
# the store. Checked by scripts/verify_generator_pins.py, on the rail, tri-state (BUG-536 convention).
#
# BOUNDARY - WHY THIS IS NOT A RIVAL HOME (D-2646, the BUG-499/BUG-502 class):
#   * config/pipeline_config.yaml + config/model_assignments.yaml own NAME -> ROLE. They carry no bytes.
#   * config/recalibration_pins.yaml owns SCRIPT digests - a meter's identity.
#   * this file owns BYTES-ON-DISK -> DIGEST for a GENERATOR.
#   Three different RULES, three homes, each boundary declared. A model may appear in all three.
#
# THE RAIL CANNOT RE-PIN ITSELF (D-382 / BUG-535). `--pin` PRINTS the measurement and writes nothing:
# a pin is re-minted by a DECISION, never by a quiet re-hash, so a moved digest must arrive with a
# NEW decision id.
#
# HONEST LIMIT: `sparse_sha256` is a manifest over (relpath, bytes) - it catches an added, removed or
# re-sized file, which is what a re-pull / re-quantisation does. A byte-swap that preserves every
# (path, size) is NOT caught by the daily check; it IS caught by `--deep` (per-file sha256) and by
# `identity_sha256` wherever the snapshot is symlinked (the blob basename is the content digest).

schema_version: '1'
decided: D-3221            # re-minted generator_s2 + reviewer_r5 via kind omlx_dir (BUG-1105, D-3221) after D-3181/D-3185
                           # deleted their HF blob farms; prior re-mint D-3124 moved probe_phi4mini the same way. The
                           # rail never writes this file (D-382) - a pin is re-minted by a DECISION, never a quiet re-hash.

hf_cache: "~/.cache/huggingface/hub"
ollama_manifests: "~/.ollama/models/manifests"
omlx_models: "~/.omlx/models"

pins:
