    family: gemma
    notes: "D2199: Must be cross-family from generator (Qwen) per R5. Pipeline config uses Gemma."
verification_tolerance:
  version: 2026-07-08.V2
  s6_validation:
    max_disagreement: 0.33
    on_exceed: flag
    min_verifiers: 3
  t2_gate:
    max_disagreement: 0.4
    on_exceed: re-verify
    min_verifiers: 2
  t3_gate:
    max_disagreement: 0.25
    on_exceed: quarantine
    min_verifiers: 2
  s3a_verification:
    max_disagreement: 0.5
    on_exceed: flag
    min_verifiers: 2
