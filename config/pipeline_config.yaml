gates:
  G0:
    description: Pre-flight liveness check
    check: Anytype API + OMLX available
  G1:
    description: OID parity between SPACE_CONFIG and live Anytype API
    check: Tag counts match live API
  G2:
    description: Canonical domain guard
    check: All domains in batch are canonical taxonomy values
  G3:
    description: Post-push object verification
    check: Ledger OIDs match live API OIDs via LIST pagination
  G4:
    description: Routing correctness
    check: Intimacy=private/selective → Private, context=personal → Private
  G5:
    description: Body format verification
    check: Pipeline FBs have ZONE 1-2 in snippet (Z3 truncated in preview)
  G6:
    description: Name quality
    check: No sentence-like names (>7 words, starts with A/The/An)
  G7:
    description: HUMAN GATE — manual review
    check: Maxwell reviews and approves batch
  G8:
    description: Idempotency
    check: No same-space duplicates >2 copies
  G9:
    description: Depth-label validation
    check: specialized=1 domain, domain=1-2, cross-domain=2+
  G10:
    description: Gemma-4 independent claim verification (advisory)
    check: Name quality, claim verifiability, consistency
  G11:
    description: Taxonomy validation
    check: All discipline/domain/status/accessibility are canonical
  G12:
    description: Live API canonical check (Phase 2)
    check: Pull 20 live objects, verify all property values canonical
source_of_truth:
  S3a:
    authoritative_for:
    - domain_classification
    - discipline_classification
    - depth_classification
    file: knowledge pipeline/input/3.converged/{domain}/converged_principles.json
    rule: domain_canonical + discipline_canonical are authoritative. Raw fields are
      historical.
  S6:
    authoritative_for:
    - fb_content
    - field_completeness
    - violation_status
    file: knowledge pipeline/output/6.validated/{batch}/_manifest.json
    rule: Validated .md files are authoritative for FB body content. Manifest status
      (PASS/FLAG/QUARANTINE) is authoritative.
  S8:
    authoritative_for:
    - final_artifact
    - live_state
    file: Anytype space (live API)
    rule: "The pushed Anytype object is the FINAL authority. Any discrepancy between\
      \ local files and Anytype objects \u2192 Anytype wins. Re-push if needed."
  discrepancy_resolution: "If S3a says 'specialized' but S8 object has 'cross-domain'\
    \ \u2192 S8 wins (pipeline corrected it). If S6 says PASS but S8 object has NULL\
    \ jargon \u2192 S8 wins (push verification caught it). If S3a says 'psychology'\
    \ domain but S8 doesn't \u2192 S8 wins (canonical filter)."
circuit_breakers:
  BORP_quarantine_rate:
    threshold: 0.3
    action: HALT_PIPELINE
    description: If >30% of FBs are quarantined, something is fundamentally wrong.
      Stop and diagnose.
  OID_mismatch:
    threshold: 1
    action: HALT_PIPELINE
    description: Any OID mismatch between SPACE_CONFIG and live Anytype API halts
      push.
  depth_violation_rate:
    threshold: 0.05
    action: HALT_PIPELINE
    description: If >5% of FBs have depth-vs-domain-count violations, S3a/S5 classification
      is broken.
  name_sentence_rate:
    threshold: 0.0
    action: HALT_PIPELINE
    description: Any sentence-like name halts push. Run normalize_fb_names.py first.
  canonical_domain_leak:
    threshold: 1
    action: HALT_PIPELINE
    description: Any non-canonical domain in output halts. Fix S6 canonical filter.
  push_failure_rate:
    threshold: 0.1
    action: WARN
    description: If >10% of FBs fail to push, log and continue but flag for review.
