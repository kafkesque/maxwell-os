- id: L01_baseline_design_strategy
  description: Clear, unambiguous design strategy FB
  fb_name: Iterative Prototyping Reduces Risk
  fb_definition: Building and testing low-fidelity prototypes early in the design process surfaces usability issues before
    significant engineering investment. Each iteration costs less than the previous, creating an asymmetric risk-reward profile
    that favors rapid experimentation over upfront specification.
  expected_output:
    application: Product teams should allocate 20% of sprint capacity to prototype testing before committing to implementation.
      Use Figma click-through prototypes for UX flows and paper prototypes for physical products.
    failure_mode: Teams skip prototyping under time pressure and discover critical UX flaws post-launch, requiring 10× more
      effort to fix compared to early-stage iteration.
    elaboration: 'The asymmetry comes from the cost curve: prototype fixes cost hours, development fixes cost days, production
      fixes cost weeks. Each stage amplifies fix cost by roughly 10×, making early cheap iteration the highest-ROI activity
      in product development.'
    keywords: low-fidelity, wireframe, click-through prototype, usability testing
    jargon: 'Wireframe: A skeletal visual guide showing page layout and element placement without design details. Click-through
