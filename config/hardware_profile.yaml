# ── the record step: how a receipt is produced (composes scripts/measure_prefill.py, C21) ────────────────
record:
  prompt_tokens: 2048      # >= the engine's fixed prefill shape; small enough to be cheap per candidate
  max_tokens: 128          # a real decode sample, never a 1-token artifact (D-3102)
  timeout_s: 1800
