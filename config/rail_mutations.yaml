# config/rail_mutations.yaml - THE MUTATION GATE (D-2676): the ONE HOME of the STANDING RULE's teeth (iv).
#
# THE STANDING RULE (adopted 2026-09-27, D-2676): no rule lands without (i) ONE HOME for the rule, (ii) a
# BOUNDARY CONTROL that has been SEEN, (iii) a NAMED oracle, (iv) a MUTATION that REDs that oracle.
# (iv) is the only one a machine can settle without judgement, and it is the one that was never mechanized.
# MEASURED: every instance of the class behind BUG-527/566/568/569/574 was a rule whose DECLARATION was read
# while its SUBJECT was never mutated. A rule that cannot be made to fail is not a rule (BUG-492, one level
# up), and a rule nobody can mutate is a rule nobody can keep true after a refactor.
#
# WHAT THE GATE MEASURES, per entry: the oracle's BASELINE is GREEN, the mutation is APPLIED, the declared
# control goes RED through its own named marker, and that marker was ABSENT before. Two runs, ONE difference.
# An entry whose 'find' text no longer matches the bytes is a DECLARATION THAT DRIFTED FROM REALITY and is
# FATAL, never a quiet pass: that is what stops a refactored rail from silently losing its own control.
schema_version: '1'
authority: D-2676
why: >-
  Every entry claims: if THIS text changes, THAT control must go RED. The gate tests the claim in a REAL
  repository (git init + commit) in the SYSTEM temp dir, because a rail derives its ambient git subject from
  REPO = Path(__file__).parents[1], and a fixture that is NOT a repository would red for a reason that is not
  the mutation's (the BUG-527 lesson: the environment a rail actually reads is part of its subject).
fixture:
  under: system_temp
  prefix: rail_mutations_
  include_dirs: [scripts, config]
  # BUG-589: the list is FILE-GRANULAR on purpose - a whole directory would carry inputs no runner reads.
  # MEASURED 2026-09-27: recompute_decision_summary.py --selftest checks its own bug citations against the
  # register, so it reads governance/bug_status.json; while the fixture did not carry it, EVERY baseline of that
  # runner was red and the gate reported the MUTATION as the fault. A declared input that EXISTS is the point.
  include_files: [justfile, governance/bug_status.json]
  include_globs: [governance/session_plan_*.yaml]   # MEASURED: check_session_plan.py --selftest reads the LIVE plan
  git: [init, add, commit]                               # a REAL repository: the rails read the ambient subject
  commit_message: rail-mutations fixture base
  commit_identity: {email: mutation-gate@localhost, name: mutation-gate}
  keep: false
  timeout_seconds: 600
coverage:
  min_mutations: 33            # FLOOR (shrink guard): deleting an entry means editing the floor in a diff a human reads (33 = 32 + the D-2983 receipt entry)
  # D-2679: the coverage set is DERIVED, never restated. Which rails gate a COMMIT is one fact and it already has
  # ONE home (config/rail_registry.yaml#commit_boundary), so restating it here would be a SECOND HOME - and two
  # lists of one fact drift, and only one of them can be right. scripts/check_rail_mutations.py joins the two and
  # REFUSES a rail that gates every commit and is not covered below.
  boundary_join:
    registry: config/rail_registry.yaml
    key: commit_boundary.must_contain
    script_prefix: scripts/
    script_suffix: .py
    why: >-
      MEASURED 2026-09-27 (D-2679): RAIL 3 (scripts/verify_recalibration_pins.py) and RAIL 5
      (scripts/check_declaration_consumers.py) ran at the commit boundary in every commit, and this list did not
      name them - so the gate reported coverage of the list it happened to hold while two boundaries were covered
      on PAPER only. The registry this join reads is itself verified against the bytes AT THE PATH GIT RESOLVES (git-path:hooks/pre-commit)
      by scripts/check_rail_registry.py, so the derivation rests on a checked declaration, not on a copy.
  required_subjects:          # SUPERSET of the derived boundary rails (D-2679): every path here MUST be the subject
                              # of >= 1 mutation (D-405: join BOTH directions). A rail whose own rule gates the
                              # BOUNDARY itself (the rehearsal, D-2675) is declared here BEYOND the boundary - the
                              # superset direction is declared, not an accident, and is NOT a fault.
    - scripts/check_boundary_rehearsal.py
    - scripts/check_declaration_consumers.py
    - scripts/check_rail_mutations.py
    - scripts/check_register_divergence.py
    - scripts/check_rail_registry.py
    - scripts/check_repo_integrity.py
    - scripts/check_session_plan.py
    - scripts/run_ladder.py
    - scripts/lib/fixture.py
    - scripts/reconcile.py
    - scripts/check_freeze_window.py
    - scripts/verify_recalibration_pins.py
    - scripts/bug_status.py
budget:
  max_seconds_per_runner: 120 # a slower runner has an UNCONTROLLED INPUT (class iii of D-2665) -> OWNER-OWED, loud
mutations:
  # D-2677: the UNBORN branch of the HEAD rule (BUG-576). Reduced to a no-op, a FRESH repository is read as
  # broken metadata again and the rail REFUSES the first commit of a RECOVERED one - the BUG-574 class (a rule
  # that cannot fire on the legitimate case), caught because the control asserts ACCEPTANCE, not refusal.
  - id: unborn_head_branch_is_load_bearing
    subject: scripts/check_repo_integrity.py
    op: replace
    find: '    if rc == 0 and ref:'
    replace: '    if False:  # MUTATION (D-2676)'
    runner: scripts/check_repo_integrity.py
    runner_args: [--selftest]
    expect: red
    mutated_rc: 1
    marker: 'FAIL repo-integrity selftest/unborn_head_is_accepted'
    why: >-
      the UNBORN branch (BUG-576): with it inert, head_state() reads a FRESH repository as broken metadata, the
      rail refuses the only commit that repairs it, and the acceptance control fires.
  - id: provenance_count_is_load_bearing
    subject: scripts/check_boundary_rehearsal.py
    op: replace
    find: '        if got_n != want_n:'
    replace: '        if False:  # MUTATION (D-2676)'
    runner: scripts/check_boundary_rehearsal.py
    runner_args: [--selftest]
    expect: red
    mutated_rc: 1
    marker: 'FAIL selftest/wrong_note_provenance'
    why: >-
      the count of notes of a DECLARED provenance is the whole of D-2675: with the count uncompared, a note whose
      provenance is wrong (a PARTIAL commit read as this repository's OWN index, BUG-567) is ACCEPTED. Removing
      one comparison must red the control that exists for exactly that shape.
  - id: widening_record_rule_is_load_bearing
    subject: scripts/check_session_plan.py
    op: replace
    find: '            if pat in gone or any(fnmatch.fnmatch(pat, a) for a in allow):'
    replace: '            if True:  # MUTATION (D-2676)'
    runner: scripts/check_session_plan.py
    runner_args: [--selftest]
    expect: red
    mutated_rc: 1
    marker: 'BUG-548: an entry that RECORDS a widening may_touch does not GRANT'
    # MEASURED: this rail prints the control's LABEL on BOTH verdicts (an ok line and a FAIL line), so absence in
    # the baseline cannot be required here - the differential is the EXIT CODE (0 -> 1) plus the label. Declared
    # per entry rather than assumed: every other red entry keeps the ABSENCE requirement (its marker names a FAIL).
    marker_absent_in_baseline: false
    why: >-
      BUG-548's rule stops an entry from RECORDING a permission the contract does not GRANT (may_touch is the
      rule; the record is not). Short-circuit that comparison and the record becomes the rule again, so the
      control that NAMES BUG-548 must red: a rule that cannot be unhooked silently.
  - id: no_op_comment_is_the_negative_control
    subject: scripts/check_boundary_rehearsal.py
    op: append
    # MEASURED (the gate's own first run): single-quoted YAML does NOT process an escape, so this was appended as
    # the literal two characters backslash-n and the subject died with a SyntaxError - a no-op mutation that was not
    # a no-op. Double quotes are REQUIRED here (C12: the declaration must mean what the reader thinks it means).
    append: "\n# MUTATION (D-2676, NEGATIVE CONTROL): a comment changes no behaviour and must NOT red anything.\n"
    runner: scripts/check_boundary_rehearsal.py
    runner_args: [--selftest]
    expect: green
    mutated_rc: 0
    marker: 'boundary-rehearsal controls:'
    why: >-
      THE NEGATIVE CONTROL, and the reason this gate is not a red-generator: a gate never seen to PASS is not a
      gate (the mirror of BUG-492). A no-op mutation must leave the runner CLEAN; if it reds, the runner's INPUT
      is uncontrolled and every red this gate reports is suspect.
  # BUG-578 / D-2678: the OVERLAY of the LANDING bytes. Reduced to a no-op, the rehearsal rehearses the bytes that
  # LANDED again - measured 2026-09-27: it was GREEN while the working tree already held a RAIL 0 that refused every
  # fresh commit of a recovered repository (the BUG-576 fix, invisible to the rail that exists to catch it).
  - id: overlay_of_the_landing_bytes_is_load_bearing
    subject: scripts/check_boundary_rehearsal.py
    op: replace
    find: '            shutil.copy2(src / rel, dst)'
    replace: '            continue  # MUTATION (D-2676): the overlay copies NOTHING'
    runner: scripts/check_boundary_rehearsal.py
    runner_args: [--selftest]
    expect: red
    mutated_rc: 1
    marker: 'FAIL selftest/the overlay replaces the fixture bytes with the LANDING bytes'
    why: >-
      the overlay is the whole of BUG-578: with the copy inert the fixture keeps its OWN bytes and the rehearsal is
      a verdict about the last commit. The control pre-seeds stale bytes at a path DERIVED from the declaration and
      requires them to be REPLACED, so it REDs whether or not the live tree happens to differ from HEAD.
  # RAIL 3 (BUG-535) - the boundary every commit of a pinned artifact passes. Owed since D-2679 read the coverage
  # list against the commit boundary: this rail gated every commit while no mutation proved its rule was READ.
  - id: laundering_repin_rule_is_load_bearing
    subject: scripts/verify_recalibration_pins.py
    op: replace
    find: '        if pin.get("sha256") != old.get("sha256") and pin.get("decision") == old.get("decision"):'
    replace: '        if False:  # MUTATION (D-2676): the re-pin rule stops reading the pair'
    runner: scripts/verify_recalibration_pins.py
    runner_args: [--selftest]
    expect: red
    mutated_rc: 1
    marker: 'FAIL BUG-535: a sha256 moved under the SAME decision'
    why: >-
      RAIL 3's BUG-535 rule: a pinned sha256 may move only in the SAME commit that re-mints its decision. With the
      pair unread, the LAUNDERING move is TOLERATED again - the old decision keeps certifying a measurement nobody
      re-ran while the scan goes green - and the control that names BUG-535 stops firing.
  # RAIL 5 (BUG-562) - the same boundary, one commit earlier: a declaration may not land apart from its reader.
  - id: withdrawn_consumer_rule_is_load_bearing
    subject: scripts/check_declaration_consumers.py
    op: replace
    find: '        if withheld:'
    replace: '        if False:  # MUTATION (D-2676): a withdrawn consumer stops being a fault'
    runner: scripts/check_declaration_consumers.py
    runner_args: [--selftest]
    expect: red
    mutated_rc: 1
    marker: 'FAIL staged_withheld_consumer'
    why: >-
      RAIL 5's BUG-562 rule: a STAGED declaration whose consumer is in NEITHER HEAD NOR the index is refused. With
      the fault unread, the declaration lands separated from the only code that reads it - the exact BUG-562 commit
      set - and the control that names that shape stops firing.
  # THE STANDING RULE APPLIED TO ITS OWN COVERAGE (D-2679). Inert, the join reads nothing and this list is a second
  # home of the commit boundary again.
  - id: boundary_registry_join_is_load_bearing
    subject: scripts/check_rail_mutations.py
    op: replace
    find: '        if r not in declared:'
    replace: '        if False:  # MUTATION (D-2676): the coverage join reads nothing'
    runner: scripts/check_rail_mutations.py
    runner_args: [--selftest]
    expect: red
    mutated_rc: 1
    marker: 'FAIL selftest/boundary_rail_missing_from_coverage'
    why: >-
      D-2679: with the join inert, a rail that gates every commit can sit outside coverage and the gate still
      reports the coverage it happens to hold. The control REMOVES a derived boundary rail from the coverage list
      and requires the gate to refuse: a coverage claim that cannot be falsified is the BUG-492 shape one level up.

  - id: ladder_scan_reports_every_fault_is_load_bearing
    subject: scripts/run_ladder.py
    op: replace
    find: '        if rc:'
    replace: '        if False:  # MUTATION (D-2676): a fault stops being recorded'
    runner: scripts/run_ladder.py
    runner_args: [--selftest]
    expect: red
    mutated_rc: 1
    marker: 'FAIL selftest/late_fault_is_visible'
    why: >-
      D-2680/BUG-573: every fault of the ladder is COLLECTED, so a red line never hides the lines after it. With
      the collection inert, the scan reports a clean ladder while a red stands in it - the prefix-read-as-a-verdict
      defect one level up, in the very report that exists to end it.
  - id: worktree_undeclared_dirty_path_rule_is_load_bearing
    why: >-
      BUG-563/D-2684: the rule is 'a dirty path must be GRANTED by the plan or DECLARED-EXCLUDED, never
      tolerated'. Replacing the fault with a pass must make the declared control go RED through its own
      named marker; if it does not, the rule is a comment and this entry is what refuses it (D-2676 iv).
    subject: scripts/check_repo_integrity.py
    op: replace
    find: '        faults.append(dirty_msg(st, path))'
    replace: '        pass  # MUTATION (D-2676): an undeclared dirty path is tolerated'
    runner: scripts/check_repo_integrity.py
    runner_args: [--selftest]
    expect: red
    mutated_rc: 1
    marker: 'FAIL repo-integrity selftest: an undeclared dirty path is a FAULT'
  - id: ruling_scope_join_is_load_bearing
    subject: scripts/apply_workbook_rulings.py
    op: replace
    find: '            if col not in owned:'
    replace: '            if False:  # MUTATION (D-2676): a ruling may reach any column it likes'
    runner: scripts/apply_workbook_rulings.py
    runner_args: [--selftest]
    expect: red
    mutated_rc: 1
    marker: 'FAIL selftest/ruling_outside_the_declared_scope_is_refused'
    why: >-
      BUG-560/D-2685: the applier writes cells the OWNER owns, and which cells those are is DECLARED in
      config/anchor_workbook_fixes.yaml#rulings_io.owned_columns. With the join inert, the column map in
      targets() becomes the authority instead of the declaration - a code edit silently widens what the applier
      may overwrite, which is the D-401/BUG-478 class one layer down (the applier that exists to defend the
      owner's rulings becomes the writer that overwrites them).

  - id: append_lines_suffix_only_rule_is_load_bearing
    subject: scripts/lib/write_guard.py
    op: replace
    find: '    if post[: len(pre)] != pre:'
    replace: '    if False:  # MUTATION (D-2676): the suffix-only proof stops proving'
    runner: scripts/lib/write_guard.py
    runner_args: [--selftest]
    expect: red
    mutated_rc: 1
    marker: 'FAIL selftest/suffix_only_append_reports_a_changed_pre_image'
    why: >-
      BUG-560/D-2685: append_lines exists because append_rows REGENERATES the pre-image lines it does not own
      (MEASURED: the owner's fixlog holds 14 CRLF and 9 LF lines, so 23 lines would have been re-terminated).
      With the prefix clause inert, the API still claims a suffix-only append while a changed pre-image passes:
      a ledger whose earlier lines were rewritten would read as evidence of an append that never happened.

  - id: workbook_write_term_follows_the_workbook
    subject: scripts/apply_workbook_rulings.py
    op: replace
    find: '    newline = artifact_terminator(wb)'
    replace: '    newline = "\n"  # MUTATION (D-2676): the workbook is rewritten with a terminator nobody measured'
    runner: scripts/apply_workbook_rulings.py
    runner_args: [--selftest]
    expect: red
    mutated_rc: 1
    marker: 'FAIL selftest/the_workbook_keeps_its_own_terminator'
    why: >-
      BUG-560/D-2685: write_guard.write_rows REGENERATES every line of the workbook it rewrites, so the
      terminator it is handed decides the bytes of the 149 lines this writer does not own. With the terminator
      hardcoded to LF, a CRLF workbook comes back re-terminated end to end and the named control goes RED: the
      convention is MEASURED from the artifact, never assumed by the writer.

  - id: fixlog_terminator_is_not_borrowed_from_the_workbook
    subject: scripts/apply_workbook_rulings.py
    op: replace
    find: '    term = artifact_terminator(fixlog)'
    replace: "    term = newline  # MUTATION (D-2676): the ledger append borrows the workbook's terminator"
    runner: scripts/apply_workbook_rulings.py
    runner_args: [--selftest]
    expect: red
    mutated_rc: 1
    marker: 'FAIL selftest/the_two_artifacts_keep_their_own_terminators'
    why: >-
      BUG-560/D-2685: the OLD applier handed the fixlog the WORKBOOK's terminator - two artifacts, one
      convention, and the one that did not own it was destroyed (MEASURED: this ledger holds 14 CRLF and 9 LF
      lines). With the terminator borrowed again, a CRLF ledger gains LF lines and the named control goes RED
      through its own marker: each artifact's terminator is read from THAT artifact (D-2676 iv).

  - id: register_uncarried_rule_is_load_bearing
    subject: scripts/check_register_divergence.py
    op: replace
    find: '            if tok not in carried:'
    replace: '            if False:  # MUTATION (D-2676): every name counts as carried'
    runner: scripts/check_register_divergence.py
    runner_args: [--selftest]
    expect: red
    mutated_rc: 1
    marker: 'FAIL selftest/uncarried_id_is_reported'
    why: >-
      D-2683/BUG-571: with the walker inert, the register reports the ids it happens to carry while an id the log
      NAMES has no machine home at all - the BUG-481 shape one notch over, and the reason check_bug_status.py
      cannot see it: a rail that re-derives from the same projection certifies the PARSER, never the LOG.

  - id: fixture_outside_tree_rule_is_load_bearing
    subject: scripts/lib/fixture.py
    op: replace
    find: '    if root == AUDITED or AUDITED in root.parents:'
    replace: '    if False:  # MUTATION (D-2676): the BUG-537 refusal is reduced to a no-op'
    runner: scripts/lib/fixture.py
    runner_args: [--selftest]
    expect: red
    mutated_rc: 1
    marker: 'FAIL selftest/outside_tree_refuses_the_audited_tree'
    why: >-
      BUG-577 / D-2676(i): the BUG-537 rule "a fixture must resolve OUTSIDE the tree it audits" was restated
      VERBATIM by two rails and built inline by a third, so a repair could land in one and leave the others
      silently stale - and a mis-derived temp root cleans, commits in and rmtrees the LIVE tree. With the refusal
      inert, the rule ACCEPTS the audited tree itself and the named control goes RED through its own marker: the
      shared rule is READ, not merely declared.

  # BUG-591 / D-2697: the fixture BUILDER handed its child git the AMBIENT environment. MEASURED 2026-09-27 while
  # instrumenting BUG-568: with GIT_DIR=<decoy>/.git ambient, real_repo() built into a FOREIGN repository and
  # returned None, and a caller selftest died with FileNotFoundError on a <fixture>/.git/HEAD git never wrote.
  - id: the_fixture_builder_does_not_inherit_the_ambient_subject
    subject: scripts/lib/fixture.py
    op: replace
    find: '                              env=git_subject.cleared_env(git_subject.config())).returncode'
    replace: '                              env=None).returncode  # MUTATION (D-2676): the AMBIENT subject is inherited again (BUG-591)'
    runner: scripts/lib/fixture.py
    runner_args: [--selftest]
    expect: red
    mutated_rc: 1
    marker: 'FAIL selftest/a_fixture_is_built_in_its_own_worktree_under_a_decoy_git_dir'
    why: >-
      BUG-591: the shared builder runs every child git with the guard variables CLEARED, derived from the pin ONE
      home (git_subject.cleared_env, D-2646). With the ambient environment inherited again, the DECOY control goes
      RED through its own marker: the builder lands in whichever repository the environment names. The other
      controls stay GREEN (they run with a clean environment), so the differential isolates the ENVIRONMENT.
  - id: decision_supersession_rule_is_load_bearing
    subject: scripts/reconcile.py
    op: replace
    find: '        if _norm_state(r) != state_word or _token(r) in pinned:'
    replace: '        if False:  # MUTATION (D-2676): the SUPERSESSION filter stops filtering'
    runner: scripts/reconcile.py
    runner_args: [--selftest]
    expect: red
    mutated_rc: 1
    marker: 'FAIL selftest/supersession_reports_a_gap'
    why: >-
      BUG-575 / D-2676(iv): the succession rule is the graph's whole point - a SUPERSEDED record must name a
      machine-followable successor unless it is PINNED debt. With the filter inert, EVERY record is examined as
      if it were a retirement, so the fixture's ACTIVE and PROPOSED records are reported as gaps and the named
      control goes RED through its own marker: the rule is READ, not merely declared (BUG-492, one level up).
      This is also what makes the rail refactor-proof: the entry FAILS if this line is renamed or re-shaped.
  - id: pre_image_containment_is_load_bearing
    subject: scripts/lib/write_guard.py
    op: replace
    find: '    if resolved != REPO and REPO not in resolved.parents:'
    replace: '    if False:  # MUTATION (D-2676): a pre-image may be kept for an artifact of any tree'
    runner: scripts/lib/write_guard.py
    runner_args: [--selftest]
    expect: red
    mutated_rc: 1
    marker: 'FAIL selftest/the_pre_image_store_refuses_an_out_of_tree_artifact'
    why: >-
      D-2686 (the BUG-560 class): the ONE store an auditor reads must hold the pre-images of the tree's OWN
      artifacts - a pre-image's name carries the artifact's STEM only, so a fixture's is indistinguishable from a
      tracked artifact's. MEASURED 2026-09-27: the applier's own --selftest left five of them in the live
      backups/. With the containment predicate reduced to a no-op, the guard keeps a system-temp fixture's
      pre-image, deposits it, and the named control goes RED through its own marker (D-2676(iv)).

  - id: commit_boundary_route_and_mode_is_load_bearing
    subject: scripts/check_rail_registry.py
    op: replace
    find: '    if not b.executable:'
    replace: '    if False:  # MUTATION (D-2676): a hook git may not execute is still a declared boundary'
    runner: scripts/check_rail_registry.py
    runner_args: [--selftest]
    expect: red
    mutated_rc: 1
    marker: 'FAIL selftest/boundary_hook_is_not_executable'
    why: >-
      D-2687 (the BUG-564 remainder): the boundary was declared as a PATH SHAPE and verified BY BYTES ONLY, so
      two small acts disarmed the strictest gate in the system with no verdict anywhere. MEASURED 2026-09-27 in
      real repositories outside the tree: (1) with core.hooksPath set, `git rev-parse --git-path hooks/pre-commit`
      answered hooks/pre-commit while --git-dir answered .git, the declared file DID NOT EXIST and a DIFFERENT file
      received the commit and refused it; (2) a mode-644 pre-commit is SKIPPED - the commit LANDS (rc=0), none of
      the four rails run, and the only sign is a `hint:` git documents how to suppress. With the executability
      limb reduced to a no-op the rail calls a hook that cannot run a verified boundary, and the named control goes
      RED through its own marker (D-2676(iv)). The entry FAILS if that line is renamed or re-shaped.

  - id: freeze_window_exit_is_load_bearing
    subject: scripts/check_freeze_window.py
    op: replace
    find: '            if not held_open:'
    replace: '            if False:  # MUTATION (D-2676): a window whose exit can never be MET is a POLICY'
    runner: scripts/check_freeze_window.py
    runner_args: [--selftest]
    expect: red
    mutated_rc: 1
    marker: 'FAIL selftest/exit_is_met_when_every_clause_is_satisfied'
    why: >-
      D-2688: MEASURED 2026-09-27 - the META-LANE FREEZE was asserted in fifteen prose homes and existed in NO
      file a machine could read, so it could not fail, declared no exit (an unwritten exit makes a WINDOW a
      POLICY, the D-337 trap) and counted nothing. With the drain condition reduced to a no-op, a window whose
      parked set is empty can never be seen to be DUE TO CLOSE, and the named control goes RED through its own
      marker (D-2676(iv)). The entry FAILS if that line is renamed or re-shaped.

  # BUG-572 / D-2689: the register's STATUS SLOT. Reduced to "read the whole header", the parser takes a bug's
  # status off a word in a sentence ABOUT the bug - MEASURED 2026-09-27 over 422 heading events: BUG-419 (the
  # schema asymmetry, still live), BUG-570 and the duplicate BUG-493 block read CLOSED, and a FILENAME in
  # BUG-307's title ("closed_menu.py") decided it too. This is the freeze window's OWN ORACLE - the reader
  # check_freeze_window.py consumes the register this generator writes, so a misreading register can silently
  # drain the parked set.
  - id: status_slot_is_a_boundary_not_prose
    subject: scripts/bug_status.py
    op: replace
    find: '    return ""'
    replace: '    return rest  # MUTATION (D-2689): the PROSE TITLE is read as a status slot again'
    runner: scripts/bug_status.py
    runner_args: [--selftest]
    expect: red
    mutated_rc: 1
    marker: 'FAIL selftest/a_clause_about_the_incident_may_not_decide'
    why: >-
      D-2689/BUG-572: the slot is a POSITION AT A HEADER BOUNDARY (the leading parenthetical, the first segment,
      the first word after the colon, the trailing parenthetical) and prose in between may not decide. Restoring the
      whole-header fallback makes the FIRST named control - a heading whose title merely DESCRIBES a closed block -
      read CLOSED as an event, and the control that names that shape stops firing: a rule that cannot be made to
      fail is not a rule (D-2676 iv). FIND-TEXT: the EMPTY slot is the rule; it is one line so the declaration
      cannot drift into a shape a reader would have to interpret.


  # BUG-587 (D-2690) - the ARRIVAL rule of the mint path: an append that moved the census by NOTHING stayed GREEN
  # everywhere because nothing asked whether the mint ARRIVED.
  - id: a_mint_must_be_seen_to_arrive
    subject: scripts/recompute_decision_summary.py
    op: replace
    find: '        if not hits:'
    replace: '        if False:  # MUTATION (D-2676): the arrival rule stops reading the TOP LEVEL'
    runner: scripts/recompute_decision_summary.py
    runner_args: [--selftest]
    expect: red
    mutated_rc: 1
    marker: '  !!  a mint whose id is ABSENT from the top level fires'
    why: >-
      BUG-587: the mint appends a record it VALIDATED and re-derives the registry SHAPE, and never asked whether the
      record ARRIVED at the top level. The clause this mutation removes is the only one that reads the top level.

  # BUG-587 (D-2690) - the membership join: the oracle a RETIRED tool NAMED and no file implemented (D-405).
  - id: a_logged_id_that_names_no_record_is_load_bearing
    subject: scripts/check_decision_membership.py
    op: replace
    find: '        if n not in top and n not in pinned:'
    replace: '        if False:  # MUTATION (D-2676): the membership join stops reading the log'
    runner: scripts/check_decision_membership.py
    runner_args: [--selftest]
    expect: red
    mutated_rc: 1
    marker: '  !!  an id named in the log with no record fires'
    why: >-
      BUG-587 second face: the oracle that would have caught the absorbed mint was NAMED by a tombstone and existed
      nowhere. Landing the file is not enough - the join must be SEEABLE to fail.

  # BUG-589 (D-2690) - the FIXTURE DECLARATION. The gate reads a fixture built from DECLARED paths; the first
  # subject whose runner read a path the fixture never carried made that runner red in its BASELINE, and the
  # verdict named the MUTATION. The declaration is now read BEFORE the fixture is built, and this entry makes
  # that read SEEABLE to fail (D-2676 iv) - a guard nobody can red is a comment.
  - id: fixture_declaration_is_read
    subject: scripts/check_rail_mutations.py
    op: replace
    find: '    for bucket, kind in (("include_dirs", "dir"), ("include_files", "file")):'
    replace: '    for bucket, kind in ():  # MUTATION (D-2676): the fixture declaration stops being read'
    runner: scripts/check_rail_mutations.py
    runner_args: [--selftest]
    expect: red
    mutated_rc: 1
    marker: 'FAIL selftest/a declared fixture input that does not EXIST is a fault, so an under-declared fixture is caught before it is blamed on a mutation (BUG-589)'
    why: >-
      BUG-589: a runner reads the fixture, so a declared input the fixture never carries reds a BASELINE and the
      gate blames the mutation. With both loops neutered the two-sided control stops firing (a missing include
      file AND a glob matching nothing must each be a fault, while the LIVE declaration must be clean): the
      differential is real, the marker is the control's own name, and a refactor that stops reading the fixture
      declaration loses its control instead of silently misdiagnosing.

  # BUG-584 (D-2691) - the LADDER'S OWN SIZE. The census IS the count of declaring lines and every line is
  # EXECUTED, so a duplicated line over-reports the ladder AND repeats the work. The refusal lives where the
  # counted unit is decided (scripts/run_ladder.py#duplicate_declaring_lines); this entry makes that read SEEABLE
  # to fail (D-2676 iv) - a guard nobody can red is a comment.
  - id: a_duplicated_declaring_line_is_refused
    subject: scripts/run_ladder.py
    op: replace
    find: '    return [(line, n) for line, n in seen.items() if n > 1]'
    replace: '    return []  # MUTATION (D-2676): the duplicate census stops being read'
    runner: scripts/run_ladder.py
    runner_args: [--selftest]
    expect: red
    mutated_rc: 1
    marker: '  FAIL selftest/a_duplicated_declaring_line_is_refused'
    why: >-
      BUG-584: `just health` carried 98 declaring line(s) where 97 are DISTINCT and every duplicated line ran
      twice. With the census neutered the TWICE case is no longer refused, so the control that NAMES the rule
      stops firing while the live control (every declared recipe is clean) stays green: the differential is real
      and the marker is the control's own name.

  # D-2983 (BUG-759) - THE RECORDED VERDICT. A whole-set scan that is recorded and then read as evidence is the
  # strongest claim in the ladder, so it must be falsifiable: this mutation makes a RECORDED RED read as GREEN
  # and the control that names the rule has to go red (D-2676 iv). A receipt nobody can make fail is a receipt
  # nobody can trust.
  - id: a_recorded_ladder_red_is_load_bearing
    subject: scripts/run_ladder.py
    op: replace
    find: '    if payload.get("faults"):'
    replace: '    if False:  # MUTATION (D-2676): a recorded red reads as green'
    runner: scripts/run_ladder.py
    runner_args: [--selftest]
    expect: red
    mutated_rc: 1
    marker: '  FAIL selftest/a_recorded_ladder_red_is_not_silently_green'
    why: >-
      D-2983/BUG-759: the collector RECORDS the whole-set verdict so a PREFIX report can no longer be read as a
      verdict - MEASURED 2026-10-13, seven ladder lines stood red and nobody knew. With the recorded-red branch
      inert, a scan that measured faults is reported as MEASURED GREEN: the exact blindness BUG-759 filed, one
      level up.

  # BUG-570 (D-2692) - the BUGLOG BLOAT rail. A block occurring TWICE with identical bytes is a COPY, and
  # the comparison that REFUSED the real copy was `occurrence -> EOF`: length-dependent, so two identical
  # copies could never satisfy it (BUG-492, both directions) - the REFUSAL was the defect, not the copy. The
  # comparison now reads BLOCK BYTES (scripts/check_buglog_coverage.py#duplicate_block_problems); this entry
  # makes that read SEEABLE to fail (D-2676 iv) - a guard nobody can red is a comment.
  - id: a_duplicated_buglog_block_is_load_bearing
    subject: scripts/check_buglog_coverage.py
    op: replace
    find: '        if len(spans) > 1:'
    replace: '        if len(spans) > 1 and False:  # MUTATION (D-2676): a duplicated block stops being read'
    runner: scripts/check_buglog_coverage.py
    runner_args: [--selftest]
    expect: red
    mutated_rc: 1
    marker: '  FAIL selftest/a_block_that_occurs_twice_byte_identically_is_a_named_fault_the_bug_493_copy'
    why: >-
      BUG-570: a block copied byte-for-byte is BLOAT, and the ONLY control that names the fault is the TWICE case; with the
      comparison neutered that control stops firing while the control that refuses to delete a DIFFERENT block keeps
      passing, so the differential is real and the marker is the control's own name - DERIVED from it, never transcribed.

  # BUG-588 (D-2692, REWRITE-HEADER) - a prose header may POINT at the census; it may never RESTATE a
  # count. The rule lives in config/decisions_policy.yaml#log_header and is READ where the log's own claims
  # about the registry are read (scripts/check_decision_membership.py#header_problems), so the file that
  # restated a count stale by 171 is checked by the same rail that joins its ids. MEASURED 2026-09-27: the
  # FIRST run of this entry REFUSED with rc=0, because the control's input isolated no reason - the repair
  # landed with the finding; this entry makes the read SEEABLE to fail (D-2676 iv).
  - id: a_log_header_that_restates_a_count_is_load_bearing
    subject: scripts/check_decision_membership.py
    op: replace
    find: '        if pattern.search(line):'
    replace: '        if False:  # MUTATION (D-2676): the header count stops being read'
    runner: scripts/check_decision_membership.py
    runner_args: [--selftest]
    expect: red
    mutated_rc: 1
    marker: '  FAIL selftest/a_header_that_points_at_the_census_and_still_restates_a_count_is_a_named_fault_bug_588'
    why: >-
      BUG-588: the header's count had drifted 171 records behind the registry because NOTHING read it; with the pattern
      match neutered the control that NAMES the fault stops firing while the control that accepts a header POINTING at the
      census keeps passing, so the differential is real. This entry's first run was REFUSED by the gate with rc=0 - the
      control fired for its POINTER reason too, so the entry proved nothing until the control was repaired to isolate the
      count (BUG-492, both directions).

  # BUG-583 (D-2692, DECLARE) - a state is ONE value with ONE spelling, and `active` / `ACTIVE` were two
  # spellings of one state. The census was always RIGHT while the BYTES of five records carried the other
  # case (the D-2646 two-homes class); the record's declared pin lives in
  # config/decisions_policy.yaml#state_vocabulary.legacy_non_canonical_ids and the refusal lives in
  # scripts/recompute_decision_summary.py#spelling_problems, so the writer that OWNS the vocabulary is the
  # file that refuses an undeclared spelling; this entry makes that read SEEABLE to fail (D-2676 iv).
  - id: a_second_spelling_of_a_state_is_load_bearing
    subject: scripts/recompute_decision_summary.py
    op: replace
    find: '        if normalized_id(record) not in pin:'
    replace: '        if False:  # MUTATION (D-2676): a second spelling of a state stops being read'
    runner: scripts/recompute_decision_summary.py
    runner_args: [--selftest]
    expect: red
    mutated_rc: 1
    marker: '  FAIL selftest/a_state_spelled_in_a_non_canonical_case_with_no_pin_is_a_named_fault_bug_583'
    why: >-
      BUG-583: an undeclared second spelling of a state is a NAMED fault, so a NEW one may never land silently; with the pin
      lookup neutered that control stops firing while the stale-pin control (a pin that describes nothing) keeps passing, so
      the differential is real and the marker is the control's own name - DERIVED from it, never transcribed.

  # BUG-583 (D-2693, CANONICALISE) - the debt is paid by a DECLARED ROUTE, and the clause that makes the route a
  # RULE rather than a LICENCE is `extra` in scripts/recompute_decision_summary.py#splice_problems: the check that
  # every moved `state:` cell was an id the pin NAMED. An in-place route that can move a cell nobody pinned is a
  # licence to rewrite an append_only registry (D-2655), which is the whole reason the pin still exists at all.
  # With that read neutered the named fault stops firing while the control that ACCEPTS a pinned-cell-only splice
  # keeps passing - and that acceptance is what lets the pin shrink to empty - so the differential is real and the
  # marker is the control's own name, DERIVED from it and never transcribed (D-2676 iv, MEASURED 1 of 18 red).
  - id: the_canonicalisation_licence_is_load_bearing
    subject: scripts/recompute_decision_summary.py
    op: replace
    find: '    extra = [i for i in moved if i not in pin]'
    replace: '    extra = []  # MUTATION (D-2676): an unpinned moved cell stops being read'
    runner: scripts/recompute_decision_summary.py
    runner_args: [--selftest]
    expect: red
    mutated_rc: 1
    marker: '  FAIL selftest/a_splice_that_moves_a_state_the_pin_never_named_is_a_named_fault_d_2655_bug_583'
    why: >-
      D-2693/BUG-583: the route EARNS its exception from an append_only artifact by proving, BEFORE a byte moves,
      that it touched only cells the pin named and that the registry re-derives canonical EVERYWHERE afterwards.
      With the `extra` read neutered, splice_problems() returns [] for a registry whose unpinned record moved a
      state; the fault that NAMES that move stops firing while the accepting control still passes, so the red is
      the read failing and not a crash (D-2676 iv).

  # D-2695 (BUG-569): the ADOPTION is a RAIL-level rule, not a property of its one home. MEASURED 2026-09-27 while
  # instrumenting the control (temp/b569_probe.py): the rail run with NO --index-file at an ambient minted name
  # PRINTS the ADOPTED note naming that path and AUDITS that index (rc=1 over the one probe path). The mutant
  # below removes the NOTE only - the adoption itself is untouched, so exactly ONE control flips: a mutation that
  # removed the adoption would red the BUG-527 refusal control as well, and a differential that moves two
  # controls proves neither.
  - id: the_adopted_index_note_is_load_bearing
    subject: scripts/check_session_plan.py
    op: replace
    find: '    if adoption:'
    replace: '    if False:  # MUTATION (D-2676): the ADOPTED note stops being printed'
    runner: scripts/check_session_plan.py
    runner_args: [--selftest]
    expect: red
    mutated_rc: 1
    marker: '  FAIL BUG-569: run with NO --index-file at a REAL minted ambient index, the rail PRINTS the ADOPTED note naming THAT path and AUDITS it (the wiring the pre-commit hook depends on)'
    why: >-
      BUG-569: the ADOPTED note is the ONLY thing that tells a human or a log WHICH index was audited, and the
      note and the audited subject diverging is BUG-567 - so the wiring that prints it is load-bearing, not
      cosmetic. With the note suppressed the rail still adopts and still reads the minted index (rc stays 1 and
      the probe path is still named), so the red isolates the PRINT: measured baseline 24/24 rc 0 -> mutated
      23/24 rc 1 with this control the single FAIL, restored byte-identical (D-2676 iv).
  # D-2696 (BUG-568): the subject pin is a RAIL-level rule for RAIL 0 too, and this entry is where that claim
  # stops being prose. MEASURED 2026-09-27 before the fix (temp/b568_probe.py): with an ambient GIT_DIR naming a
  # DECOY repository this rail printed "ok repo-integrity: git dir <decoy>/.git" rc=0 - it CERTIFIED A FOREIGN
  # REPOSITORY - --worktree reported 723 phantom dirty paths through the decoy's index, and --selftest crashed
  # with a FileNotFoundError instead of reporting. The mutant below makes the pin inert (no subject, no note),
  # which leaves every OTHER control intact: the broken-repository control calls recovery_subject() directly, so
  # the differential moves exactly ONE control and isolates the PIN itself.
  - id: the_rail0_subject_pin_is_load_bearing
    subject: scripts/check_repo_integrity.py
    op: replace
    find: '        subj, note = git_subject.recovery_subject()'
    replace: '        subj, note = None, ""  # MUTATION (D-2676): the pin comes out - the ambient subject decides again (BUG-568)'
    runner: scripts/check_repo_integrity.py
    runner_args: [--selftest]
    expect: red
    mutated_rc: 1
    marker: 'FAIL repo-integrity selftest/rail0_pins_its_own_subject'
    why: >-
      BUG-568: RAIL 0 derives its subject from the WORKTREE with the guard variables cleared, refuses an ambient
      value naming a DIFFERENT subject, and REPORTS (never refuses) a repository whose metadata is broken. With
      the pin inert the rail still RUNS and still prints ok, so the red isolates one fact: the ambient
      environment is deciding what the recovery rail reads. MEASURED: baseline rc 0 with the marker ABSENT ->
      mutated rc 1 with the marker the SINGLE red line; restored byte-identical (D-2676 iv).
      BUG-592 (D-2698): the control's NESTED run is BOUNDED with --no-pin-probe, because the probe re-enters
      this rail through --selftest; before that bound this entry measured rc=124 at 600.0s (a
      DID-NOT-RED) instead of the single red line above.

