  - Blink — Malcolm Gladwell
  cluster_segments:
  - source_book: Certain to Win — Chet Richards
    text: 'The OODA loop (Observe, Orient, Decide, Act) is John Boyd''s model of decision

      superiority. The key insight is that speed of iteration matters more than

      optimization of any single step. Whoever cycles through the loop faster than

      their opponent forces the opponent into a reactive posture.

      '
  - source_book: The Art of Action — Stephen Bungay
    text: 'In military command, the key is not to make the perfect plan but to create

      shared intent (the commander''s intent) and then let subordinates act decisively

      within it. Over-control slows the decision cycle and hands initiative to the

      enemy. The objective is tempo — operating faster than the opponent''s decision

      cycle.

      '
  - source_book: Blink — Malcolm Gladwell
    text: 'Rapid cognition — ''thin-slicing'' — can outperform extensive deliberation in

      certain domains. Experts who have compressed years of experience into

      pattern-recognition can make better decisions in seconds than novices make in

      hours. Speed is not the enemy of accuracy; it is often its ally.

      '
  is_convergent: true
