    governance contradiction. Attestation is NOT independence: F-11 (no second coder) still forbids repointing any floor.
  also_recorded: >-
    BUG-344 (opened + fixed same session): authority_paths() never read the *_sha256 pins declared in
    config/eval_integrity.yaml, so the annotation drift guard was INERT in the run path and the artifact cited an
    empty annotation_sha256. Declared pins are now enforced fail-closed (C16) and the artifact cites the hash consumed.

- id: D318
  category: EVALS
  state: RATIFIED
  date: "2026-09-21"
  title: >-
    A declared pin is a control only when it is byte-compared in the RUN PATH (BUG-344/345)
  decision: >-
    Every sha256 declared in config/eval_integrity.yaml must be (a) read by the code that asserts it, (b) compared
    with FULL equality, and (c) enforced fail-closed before the artifact is consumed. BUG-344: authority_paths()
    never read the pins, so the BUG-340 annotation drift guard received an empty declared hash and could not fire,
    while the artifact cited an empty annotation_sha256. BUG-345: once enforced, the authority pin turned out to
    carry a one-character typo (index 34) that had passed for two sessions because every prior check compared a
    16-char PREFIX. Both are fixed: verify_declared_pin() enforces the pin before the read (C16/D-313),
    --allow-pin-drift is the only loud override, and scripts/pin_audit.py byte-compares every declared pin.
    Numbers are unchanged (4750 result leaves identical to the superseded artifact).
  rule_added: >-
    D-318: a prefix comparison is NOT a verification. A pin that is not read by the run path is documentation, not
    a control; a control that cannot fail is not a control. Pin→file pairs must be declared EXPLICITLY (never
    inferred by proximity to a filename), audited byte-exactly (scripts/pin_audit.py), and an artifact must cite
    the hash it ACTUALLY consumed, not the hash it was configured with.
  also_recorded: >-
    BUG-346: scripts/score_ruler_labels.py retired as a second truth path (C21) -- it now exits 2 unless
    --legacy-sheet-truth is passed. BUG-333 partially fixed: the R5 verifier requires quoted evidence per
    number-deciding question and exits 2 unless PASS. The superseded ruler artifact (66c9ba33...) is recorded in
    config:ruler_authority.artifact_superseded, never deleted (R-D410).
