    13 known-answer controls) builds a REAL repository in the SYSTEM temp dir in the LIVE --separate-git-dir layout,
    materializes TRACKED HEAD bytes (git archive HEAD), installs the hook with THIS repository''s OWN installer
    (scripts/install_git_hooks.sh, whose --check re-derivation is asserted), then performs a REAL normal commit
    and a REAL partial commit THROUGH the hook, runs every write-boundary rail ALONE with the ambient GIT_INDEX_FILE
    the hook receives, asserts each in-place PLANTED violation is REFUSED by its DECLARED rail, and runs every rail''s
    own --selftest plus the git-subject module''s. Every fact it asserts is DECLARED in config/boundary_rehearsal.yaml
    (C12): which rails, which staged rc, which NOTE PROVENANCE (ambient_note at a normal commit, partial_note at
    a partial one), which planted violation, which debt. The note provenance is READ from its ONE home (scripts/lib/git_subject.py#note_kind,
    D-2646), never restated. The fixture must resolve OUTSIDE the tree it audits (fail-closed, derived from the
    rail''s own location, BUG-537). It writes ONLY in the system temp dir, so it is declared as a WRITER in config/rail_registry.yaml.
    A declared debt (BUG-576) is re-measured every run: a refusal the declaration NAMES is tolerated and printed,
    a refusal it does NOT name is FATAL, and a PAID debt returns 2 OWNER-OWED because the declaration must then
    be WITHDRAWN by a decision (BUG-542 class).'
  measured: '--selftest: 13/13 controls, each SEEN to fire, including partial_note_declaration_is_read (the control
    for the declaration this fix added; it was the 11/12 RED that found provenance is SCENARIO-DEPENDENT and can
    never be declared once per rail). On the live tree: rc=0 in 11.5s - a real NORMAL commit and a real PARTIAL
    commit both PASSED through the hook with 3 notes of the declared provenance each, 2 planted violations REFUSED
