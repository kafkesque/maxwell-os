    text: 'Parkinson''s Law states that work expands to fill the time available for its completion. Give yourself a week to
      write a report and it will take a week; give yourself 90 minutes and it will take 90 minutes. The mechanism is not laziness
      — it is the human tendency to add complexity, polish, and scope until the available time is consumed. Counterintuitively,
      shorter deadlines produce equivalent or BETTER quality because they force ruthless prioritization: only the essential
      gets done, and perfectionism gets starved of oxygen.'
