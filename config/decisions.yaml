  source: governance/MARKET_RESEARCH_ONTOLOGY_20260919.md
  verification: measured; R5 review pending on the implementable prompt; human gate required
  description: 'D2138 (''classify freely, then map'') is falsified by measurement. pipeline/stage4_merge.py lines 341 and 472 instruct the model to invent labels (''no canonical lists''; ''not what label fits best from a predefined list''), which contradicts the module docstring at line 13 claiming D316 lists all valid labels inline. Measured cost: taxonomy_match_method synonym 3,990 (49.9%) / exact 2,127 (26.6%) / emerging_real 1,181 (14.8%) / alias 697 (8.7%), and human agreement by method runs exact 0.61 > synonym 0.49 > emerging_real 0.33, so the CEILING of the current design is ~0.61, i.e. AT the 0.60 floor -- no amount of alias-table repair can lift it. Raw label space: 1,089 distinct raw disciplines for 61 slots (17.9:1) and 4,982 distinct raw domain members for 43 slots (115.9:1), of which only 31 are canonical and 61% are hapax. The result is config/alias_map.yaml: 999 curated rescue rules (362 discipline + 637 domain, 14.8:1 for domains) -- a COMPENSATING CONTROL for a prompt defect,
    to be retired rather than extended. Decision: present the closed menu WITH each label''s definition, require one of N or an explicit ''none'', and keep logging the raw answer for drift measurement. Reference: Yin, Hay & Roth, EMNLP 2019, DOI 10.18653/v1/d19-1404.'
