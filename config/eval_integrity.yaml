# LABEL SNAPSHOTS (D-312 / BUG-311 / BUG-341)
# The stage5 label snapshot is NOT a durable file: stage5 ROTATES it to `<name>.stale_<ts>` whenever
# its input fingerprint (S4 checkpoint sha + taxonomy version + pipeline commit) moves. That is
# correct behaviour -- resuming from pre-repair labels would silently contaminate the corpus -- but
# it means the live path can be ABSENT with the bytes preserved under .stale. Never "restore" it to
# the live path to make a reader happy: that re-arms the silent stale resume. Cite the .stale file.
