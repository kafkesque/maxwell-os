# config/served_fields.yaml — THE ONE HOME of the fact "this field is advertised to an agent, and this is its disposition".
#
# WHY (the class, not the instances). A serving surface that publishes a store field is making a CLAIM about the
# store. Nothing joined the claim to the registers that already own its truth, so an agent could be told a
# fabricated measurement and every rail stayed green. MEASURED 2026-10-13: the MCP payload advertises 20 fields that
# name `fbs` columns, and THREE of them are flagged as defective by a register that already owns the fact
# (`config/derivations.yaml` — home + status, D-2646; `config/store_columns.yaml` — role + status, D-2960):
#     borp_score           derivations dead_but_read            store_columns status debt   (constant 0.0, nothing writes it)
#     feedback_score       derivations declared_but_empty       store_columns role reserved (NULL on every row; ledger exists)
#     classification_status derivations orphan_magic_threshold  store_columns status debt   (constant 'CLEAN')
# The rail (scripts/check_served_fields.py) re-measures that join on every ladder run. It does NOT re-census the
# store: the two registers are the oracle, so this file cannot become a second truth about the same column (C12).
#
# THE RULE. A field the payload advertises that a register flags as defective MUST carry a DECLARATION here with the
# owner word that closes it. Undeclared = DEFECT (the BUG-511 family: a value nothing writes, presented as a
# measurement). Declared but no longer advertised = DEFECT (an assertion whose subject is gone — BUG-488/D-405). A
# word outside the declared vocabulary, or a word with no anchor, = DEFECT, fail closed (T-101 lesson). A field
# whose debt is SOURCE-owned (a content field the store-shape register already counts) is DECLARED once in
# `acknowledged` and owes no owner word. Debt = the declared-and-still-advertised count. The ceiling is SHRINK-ONLY
# (D-2644): the only act that may raise it is a DECISION. MEASURED at birth (2026-10-13): 3 owner-word rows
# (borp_score, feedback_score, classification_status) + 2 source-owned rows (application, jargon), 0 undeclared.
schema_version: '1'
authority: D-2989
decisions: [D-2537, D-2979, D-2980, D-2989]
subjects: [T-107]
assessment: governance/BORP_FEEDBACK_ASSESSMENT_20261013.md   # the EVIDENCE; this file is the RULE

#: The surfaces whose advertised store fields are governed. A file, never a glob (C12): adding a surface is a
#: visible edit. `kind: dict_keys` = the advertised fields are the string keys of the dicts in that file's AST, so
#: the scan cannot be satisfied by a comment or a docstring.
surfaces:
  - file: maxwell_mcp_server.py
    kind: dict_keys
    why: >-
      the MCP serving surface (C25 agent-agnostic): query_knowledge, get_fb and the trust-metrics block all publish
      `fbs` columns to agents. D-2980 declared the payload exposure of borp_score/feedback_score as a deliberate,
      owner-gated residual; this file is that decision's home.
  - file: pipeline/stage6_okf_export.py
    kind: string_mentions
    why: >-
      OWED (T-107): the OKF export emits `borp_score: 0.0` as a trust line, so the fabricated value LEAVES the
      machine. Named here so the change-set cannot move the payload and leave the export publishing it (BUG-767).
  - file: pipeline/stage6b_anytype_push.py
    kind: dict_keys
    why: >-
      OWED (T-107): the Anytype push writes borp_score into the external knowledge store. Same change-set, same
      reason as the OKF export (BUG-767).

#: The store the claim is about. The population is DECLARED (stated, not implied) so the measured number is
#: reproducible; it is read from pipeline.pipeline_paths, never restated as a literal (D-2881/D-2644).
store:
  path_from: pipeline.pipeline_paths::DB_PATH
  table: fbs
  population:
    run_from: pipeline.pipeline_paths::CANONICAL_RUN
    status: PASS
  columns_from: 'PRAGMA table_info(fbs)'

#: The registers that ALREADY own the truth about a column. This rail is a JOIN, not a census.
registers:
  derived: config/derivations.yaml
  shape: config/store_columns.yaml
flagged_status:
  derived: [dead_but_read, declared_but_empty, orphan_magic_threshold]
  shape: [debt]

#: The declared disposition of every flagged field that is advertised. `word` is the OWNER WORD (T-107); `anchor` is
#: the owner's signature (required as soon as the word leaves `pending` — T-101: an unsigned decision is not a rule).
declared:
  - field: borp_score
    word: pending
    anchor: ''
    owed: T-107
    recommendation: 'retire + promote corroboration'
    why: >-
      constant 0.0 on 7,640/7,640 rows and nothing writes it; the ratio it inherited is degenerate by construction
      (min(distinct/2,1.0) with the pass bar at distinct>=2 is exactly 1.0 on every admitted row); still published to
      agents and to two export surfaces as a trust metric, where it reads as "no corroboration" on rows that are
      `strong`. FOUR reasons of record: producer deleted (S5 check_borp -> S1.5), degenerate formula, false absence
      read two ways in ONE function (SQL COALESCE 0.0 vs Python `or 0.5`), no home and no parity rail.
      The healthy signal already exists: `isor` (D2284/D2309, 6,591 rows) — see promotions.
  - field: feedback_score
    word: keep-and-declare
    anchor: 'pipeline/feedback.py::_update_fb_aggregates (writer) + pipeline/feedback.py::declared_aggregate (the ONE formula home: shrunk_mean) + config/feedback.yaml (the numeric policy: prior 0.5, prior_weight 0.0) + scripts/check_feedback_parity.py (the ledger->cache parity rail D-2642 lacked) + specs/served_fields.spec.md INV-7/INV-8'
    owed: T-107
    granted: 2026-10-13
    granted_by: 'owner approval of the T-107 recommendation (keep-and-declare), conditional on it being verifiable'
    recommendation: keep-and-declare
    why: >-
      NULL on 7,640/7,640 rows, but the LEDGER (fb_feedback) and the WRITER (pipeline/feedback.py::
      _update_fb_aggregates) both exist and the serving path already ranks on it through a declared prior. The
      defect is not the null, it is the AMBIGUITY: a bare null cannot be told from "score 0.0 = useless". Keep the
      field and make its absence explicit ({score, count, state, prior, effective}).
  - field: classification_status
    word: pending
    anchor: ''
    owed: T-107
    recommendation: keep-and-repair
    why: >-
      constant 'CLEAN' on 4,503/4,503 PASS rows while the store's own `status` column QUARANTINEs 2,972 rows and the
      register that owns the column calls it a FALSE status (config/store_columns.yaml `status: debt`), with a
      derived-value home that is an orphan carrying a magic threshold (config/derivations.yaml
      `orphan_magic_threshold`). Two statuses on one row is the D-2987 defect on the wire: an agent reads 'CLEAN'
      and cannot see the quarantine.

#: A `promote <field>` word needs a target with a NAMED home. The rail asserts the home EXISTS (file + symbol), so a
#: promotion can never name a home that is only a hope.
promotions:
  corroboration:
    home: pipeline/schema_accessor.py::isor_score
    inputs: ['fbs.source_ids (D2185, canonical works)', 'fbs.is_convergent', 'fbs.source_diversity']
    shape: '{sources: int, convergent: bool, independence: weak|medium|strong, independence_score: 0.0-1.0, home: str}'
    measured: 'fbs.isor is populated on 6,591 of 7,640 rows (weak 5,212 / medium 969 / strong 410) and on 4,503 of 4,503 PASS rows'
    measured_gap: 'MEASURED 2026-10-13 on the canonical PASS population: the count-based BORP is already COARSER than the measure we hold — of 938 rows it certifies as corroborated, 35 are rated WEAK by isor, 148 carry ONE author and 170 ONE domain (the same author''s second book counts as a second source). Evidence + hardening: governance/BORP_REVITALIZATION_RISK_20261013.md'

#: A flagged advertised field whose debt is SOURCE-owned (a data-shape repair the store's own register already
#: counts) owes no OWNER WORD: the payload publishes the FB's own text, not a judgment about it, and the repair is a
#: writer fix, not a contract change. MEASURED 2026-10-13: the OKF export publishes `application` (blank on 1 of
#: 7,640 rows) and `jargon` (blank on 2,091) — both CONTENT fields, both owned by the store-shape register's ceiling.
#: Naming them here is what distinguishes "declared, owned elsewhere" from a field nobody has looked at: an
#: UNDECLARED advert is a DEFECT. The rail checks both directions — an acknowledgement whose field is no longer
#: advertised is an assertion (DEFECT_STALE).
acknowledged:
  - field: application
    owned_by: 'config/store_columns.yaml#ceiling (role: value, status: debt)'
    why: >-
      published as the FB's own text by the OKF export while the store-shape register measures it blank on 1 of
      7,640 rows. A partially-written CONTENT field is a writer repair, not a payload contract change.
  - field: jargon
    owned_by: 'config/store_columns.yaml#ceiling (role: value, status: debt)'
    why: >-
      published as the FB's own text by the OKF export and the Anytype push while the shape register measures it
      blank on 2,091 of 7,640 rows (5,868 distinct). Same disposition as `application`: repair at source.

#: THE OWNER WORD. This block declares the vocabulary and the state; the words themselves live on the `declared`
#: rows above (ONE home per field — a second copy of the same word here would be a rival truth).
owner_word:
  decision: T-107
  vocabulary: [retire, keep, keep-and-declare, keep-and-repair, 'promote <field>']
  state: pending            # pending | granted
  sheet: governance/OWNER_DECISION_T107_20261013.md

#: THE SINGLE-SOURCE TIER (T-118, owner word GRANTED 2026-10-14 = `tier`). WHAT THE SYSTEM MAY SAY ABOUT A ROW THE
#: PRINCIPLE DOES NOT COVER. The gate was a POLICY question, not a schema edit (D-2989/BUG-768): the corpus is
#: admitted through TWO routes and only the CLUSTER route passes the at-least-two-source gate the deleted S5 check
#: used to assert per row, so the SINGLETON route reaches the store with ONE source work and nothing re-asserts the
#: principle. MEASURED 2026-10-14 on the canonical run (rechunk-v4-20260929, 7,640 rows): 6,247 rows carry exactly
#: ONE source work (3,565 of them served PASS). Three dispositions were offered - tier | withhold | leave - and the
#: owner's word is TIER, which is the only one that publishes a MEASUREMENT where the other two publish a JUDGEMENT:
#: `withhold` deletes evidence the corpus paid for, and `leave` publishes a row as if the principle were satisfied.
#:
#: THE MEASURE IS NOT RESTATED HERE (C12/D-2642). The tier vocabulary and the decision rule live in the measure's
#: OWN home - `pipeline/schema_accessor.py::isor_score` (D2284: author independence x domain diversity x source
#: count; D2309 canonical works) - and the rail asserts THIS block's vocabulary against the string constants of that
#: function, so a second definition of a tier in config is refused as the BUG-499/BUG-502 class, not tolerated.
tier_policy:
  decision: T-118
  word: tier
  vocabulary: [weak, medium, strong]
  vocabulary_home: pipeline/schema_accessor.py::isor_score
  accessor: pipeline/schema_accessor.py::isor_rating
  rule: >-
    no served row is WITHHELD and no served row is SILENTLY TRUSTED: every row publishes the tier that was MEASURED
    about it, so a single-source row publishes `weak` because that is what it measured - never an absence, never a
    default, never silence. The tier is a MEASURE of the row's own evidence, so it re-derives when the evidence
    grows (D-2992) and is never frozen by one run's clustering (BUG-772).
  granted: 2026-10-14
  granted_by: 'owner approval of the T-118 recommendation (tier) - one word: tier'
  owed_change_set: >-
    OWED (the T-107 change-set, same act): the surfaces (maxwell_mcp_server.py, pipeline/stage6_okf_export.py,
    pipeline/stage6b_anytype_push.py) publish the graded corroboration tuple
    {sources, convergent, independence, independence_score, home} and STOP publishing `borp_score: 0.0` (BUG-767).
    This block is the POLICY; the surface change is the act that consumes it - a policy with no consumer is prose.
  measured:
    - >-
      MEASURED 2026-10-14 (read-only, canonical run, 7,640 rows): `is_convergent` = 1 on 1,393 rows and
      `source_diversity` = 1 on exactly the other 6,247 - the two columns are the SAME BIT, and
      P(source_works>=2 | is_convergent=1) = 1.0000 with P(...| is_convergent=0) = 0.0000
      (governance/T120_S1_RECON_20261014.md)
    - 'isor tiers: weak 5,212 / medium 969 / strong 410 over 6,591 populated rows; NULL 1,049 = the D-2590 non-FB sidecar tier (quarantined)'
    - >-
      so the tier is not a re-write of the corpus: 6,247 rows publish `weak` - a TRUE statement about evidence -
      where today they publish NOTHING and 1,393 of their neighbours publish a false 0.0 (BUG-767)

coverage:
  max_declared_debt: 3      # CEILING — SHRINK-ONLY. The only act that may RAISE it is a DECISION (D-2644).
  min_declared_debt: 0      # FLOOR — the state this file exists to reach: every advertised field is true.
