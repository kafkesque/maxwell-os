  rationale: 'The previous pass edited scripts/definition_nli_verify.py (additive provenance block only; the 2026-09-23 measurement artifact is byte-unchanged and was NOT back-filled) and left config/recalibration_pins.yaml describing a file that no longer existed. just health was RED for a whole pass while every individual rail was green, because the digest rail is exercised nowhere else. Re-pinned under this decision.'
