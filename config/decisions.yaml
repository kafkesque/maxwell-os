- id: D-365
  category: GOVERNANCE/ARCHIVE
  state: RATIFIED
  date: '2026-09-23'
  title: 'The archive index is derived data with a writer and a checker, and an archive sweep may not move a declared input'
  decision: 'archive/index.yaml is DERIVED data: its writer is scripts/build_archive_index.py and its checker is the same script with --check (exit 1 on a body_sha256 mismatch), configured entirely by config/archive_index.yaml (C12) and written atomically (C6). Its authority is D-365; the previous authority was D2226, which is in state REJECTED (BUG-404). The script READS bytes and WRITES one index and never moves, edits or deletes an archive entry: a disposition in the index is a claim about what MAY be done, not an act. An archive sweep may NOT be driven by age alone - every path declared as an input by any script or config is listed in protected_paths and is exempt, because moving a declared input is a silent input removal (BUG-406 measured: 35 of 414 swept temp/ entries were declared inputs, including the pipeline relay SOURCE_MAP temp/golden_source_map.json; all restored). temp/ overflow is dispositioned archive-first, never deleted, because the entries include date-stamped LLM transcripts that are evidence under R-D410. RECEIPT: archive/index.yaml regenerated - 34 entries, 17.3 GB, --check exit 0.'
  artifacts: ['config/archive_index.yaml', 'scripts/build_archive_index.py', 'archive/index.yaml', 'archive/temp_archive_20260923/MANIFEST.tsv']
  related: ['D2226', 'R-D410', 'C19', 'C12', 'C6', 'BUG-404', 'BUG-406', 'BUG-342']
- id: D-366
  category: SOVEREIGNTY
  state: RATIFIED
  title: "BUG-400 accepted-and-documented: the Dropbox File Provider replication is a KNOWN C3 exception, with a torn-upload guard, not a silent one"
  description: 'The repo, CONSTITUTION.md, config/decisions.yaml, pipeline/stage6_commit.py, the knowledge pipeline
    tree and knowledge pipeline/maxwell.db live under ~/Library/CloudStorage/Dropbox (a File Provider domain),
    which does not satisfy C3 (all data and compute local) or C22 (local-first, any remote an EXPLICIT opt-in).
    Owner decision 2026-09-23: ACCEPT AND DOCUMENT rather than relocate now. This record makes the exception
    explicit and dated, which is the difference between an accepted risk and a leak. (1) The cloud copy is a
    REPLICA, never an authority: no pipeline reader may resolve its input from a Dropbox path other than the
    working tree. (2) Interim guard: scripts/assert_db_torn_upload_guard.py hashes knowledge pipeline/maxwell.db
    and reports a pre/post-run digest pair, so a partial or torn upload cannot be served as authoritative
    (the failure mode is silent corruption of the only copy, not a missing file). (3) Relocation, when
    scheduled, is a planned window, never a bare mv: 20+ artifacts bake the absolute path, including S5 input
    fingerprints, and 3 crontab entries plus ~/Library/LaunchAgents/com.maxwell.omlx-api-key.plist must be
    re-grepped. (4) Selective sync is REJECTED: it evicts local copies and can pull the live DB mid-run.
    Supersedes nothing; narrows BUG-400 from an open leak to a documented exception.'
  target_files: ['scripts/assert_db_torn_upload_guard.py', 'governance/buglog.md']
  created: 2026-09-23

- id: D-367
  category: PROCESS
  state: RATIFIED
  title: "An R5 verdict is produced by scripts/r5_code_review.py and lands as an artifact - never through a tool-using agent channel"
  description: 'BUG-407 root cause: two consecutive sessions recorded gemma-4-E4B as having FAILED an R5 review
    when the failures were turn-context failures of the delegate tool (empty response; then "the read_file tool
    was not available in the turn context"). The model was never at fault: a direct one-shot returned "OK Gemma 4."
    in 0.74s and the repo harness returned APPROVE/1.0 on scripts/build_archive_index.py. RULE: an R5 verdict is
    evidence only when (a) it is produced by python3 scripts/r5_code_review.py --file <path> --reviewer <model>,
    which reaches OMLX over plain HTTP (tools/model_eval_suite.call) with no tool channel, and (b) it is appended
    to governance/r5_reviews.jsonl with the reviewer, the sha256_16 of the reviewed bytes, the verdict and the
    concerns. A reviewer that depends on a tool it may not have can fail silently, and a silent reviewer failure
    read as a model failure is how a broken channel survives two sessions. Corollary: an owed verdict is a
    BLOCKER on the change it gates, and is listed as owed until it lands, not until it is attempted.'
  target_files: ['scripts/r5_code_review.py', 'governance/r5_reviews.jsonl']
  created: 2026-09-23

