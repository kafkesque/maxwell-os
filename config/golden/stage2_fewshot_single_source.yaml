# ═══════════════════════════════════════════════════════════════════════════
# stage2_fewshot_single_source.yaml
# Purpose: balanced few-shot for SINGLE-SOURCE / SINGLETON S2 extraction.
#
# WHY THIS FILE EXISTS (BUG-152, 2026-08-20): single-source/singleton clusters
# previously received ZERO golden few-shot (`few_shot=... if is_conv else None`),
# so the model inherited the 100%-principle bias of the convergent golden and
# either (a) re-labelled methods/tools/case-studies/speculation as `principle`, or
# (b) over-fired on pure factual description. A mono-type "principle-only" prompt
# was A/B tested and made it WORSE (the model re-labels to principle instead of
# returning NULL). The fix is a BALANCED few-shot showing all 5 content_type roles
# + hard negatives, injected into the multi-type single-source prompt.
#
# This SUPERSEDES config/golden/stage2_fewshot_convergent_nontype.yaml (which is
# convergent-framed and was never wired). Archive that fork (C19).
#
# Contrast with the convergent golden (stage2_fewshot_convergent.yaml): convergent
# clusters are ~99% principle, so that golden stays principle-only. Single-source
# is where process_template / tool_instruction / process_instance / growth_edge
# actually live, so its golden must be role-balanced.
# ═══════════════════════════════════════════════════════════════════════════
meta:
  version: '1.0'
  architecture: cluster-before-extract
  purpose: single-source balanced few-shot (all 5 content_type roles)
  d2345_fork: false
  status: WIRED
  total_examples: 8
  single_source_positives: 5
  hard_negatives: 3
  expected_coverage:
  - role_balance_all_5_content_types
  - process_template_positive
  - tool_instruction_positive
  - tool_vs_template_disambiguation
  - process_instance_positive
  - growth_edge_positive
  - pure_fact_rejection
  - platitude_rejection
  - speculation_not_principle_rejection

examples:

# ── POSITIVE: principle (reusable concept, causal) ─────────────────────────
- id: SS-POS-001
  domain: behavior-change
  source_books:
  - Atomic Habits — James Clear
  cluster_segments:
  - source_book: Atomic Habits — James Clear
    text: "Once a small habit is established, it compounds. Marginal gains of one percent per day accumulate into roughly thirty-seven times improvement over a year because each increment builds on the last rather than adding linearly."
  is_convergent: false
  should_extract: true
  expected_fb:
    is_summary: false
    route: FB
    name: Compounding Habit Gains
    definition: "Small habits compound because each marginal improvement builds on the previous one, producing exponential rather than linear growth over time."
    mechanism: "Each 1% improvement raises the baseline from which the next improvement starts, so gains multiply geometrically instead of adding arithmetically."
    boundary: "Applies when improvements are retained and stacked. Fails when gains are one-off and do not raise the subsequent baseline."
    consequence: "Consistent marginal improvement yields outsized long-term results that linear effort estimates under-predict."
    elaboration: ""
    extraction_type: causal_mechanism
    content_type: principle
    evidence_passages:
    - "Marginal gains of one percent per day accumulate into roughly thirty-seven times improvement over a year because each increment builds on the last."
  rationale: "Reusable conceptual statement (why small habits compound) with a demonstrated cause→effect chain. A principle, not a method."
  tier: CORE

# ── POSITIVE: process_template (repeatable human method) ───────────────────
- id: SS-POS-002
  domain: aviation
  source_books:
  - Checklist Manifesto — Atul Gawande
  cluster_segments:
  - source_book: Checklist Manifesto — Atul Gawande
    text: "Pilots remember critical information using three techniques: first they write it down, second they enter it into their equipment as it is read so minimal memory is required, and third they remember selectively, holding only the few items needed in the next few minutes."
  is_convergent: false
  should_extract: true
  expected_fb:
    is_summary: false
    route: FB
    name: Pilot Memory Protocol
    definition: "A repeatable three-step method for managing critical information: write it down, enter it into equipment as read, and remember selectively only what is needed in the next few minutes."
    mechanism: "Externalizing information to paper and equipment offloads memory, while selective retention limits the remaining load to the few items immediately needed."
    boundary: "Applies when a person must retain many critical items under time pressure. Fails when the items cannot be externalized or must all be held simultaneously."
    consequence: "Practitioners who externalize and remember selectively retain critical information more reliably than those who try to hold everything in mind."
    elaboration: ""
    extraction_type: normative_heuristic
    content_type: process_template
    trigger: "When a person must retain many critical items under time pressure"
    prerequisite: ""
    steps:
    - "Write down the critical information"
    - "Enter it into equipment as it is read, minimizing memory load"
    - "Remember selectively — hold only the few items needed in the next few minutes"
    done_condition: "All critical information is externalized and only the immediately-needed items are held in memory"
    failure_mode: "Fails when the items cannot be externalized or must all be held simultaneously"
    evidence_passages:
    - "Pilots remember critical information using three techniques: first they write it down, second they enter it into their equipment, and third they remember selectively."
  rationale: "A repeatable human how-to method with ordered steps a person follows. content_type=process_template (NOT principle, NOT tool_instruction)."
  tier: CORE

# ── POSITIVE: tool_instruction (code/API — contrastive vs process_template) ─
- id: SS-POS-003
  domain: computer-science
  source_books:
  - The Self-taught Programmer — Cory Althoff
  cluster_segments:
  - source_book: The Self-taught Programmer — Cory Althoff
    text: "Load a persisted index from disk with: index = faiss.read_index(\"data/my_index.index\"). This lets you reuse the index across sessions instead of rebuilding it from scratch each time."
  is_convergent: false
  should_extract: true
  expected_fb:
    is_summary: false
    route: FB
    name: FAISS read_index
    definition: "Load a persisted FAISS vector index from a file with faiss.read_index(path), so the index can be reused across sessions instead of rebuilt."
    mechanism: "The read_index call deserializes a previously saved index file back into memory, restoring the indexed vectors and their search structure."
    boundary: "Applies when an index was previously written to disk in a FAISS-compatible format. Fails when the file path is absent or the file is not a valid index."
    consequence: "Persisting and reloading an index avoids recomputing it from scratch on every session."
    elaboration: ""
    extraction_type: descriptive_model
    content_type: tool_instruction
    tool_name: "faiss"
    platform: "Python (FAISS library)"
    description: "Load a persisted vector index from a file so it can be reused across sessions instead of rebuilt from scratch"
    syntax: "index = faiss.read_index(\"data/my_index.index\")"
    parameters:
    - name: path
      type: str
      description: "File path to the persisted index"
    output: "The deserialized FAISS index object"
    example: "index = faiss.read_index(\"data/my_index.index\")"
    caveats: "Fails when the file path is absent or the file is not a valid FAISS index"
    evidence_passages:
    - "Load a persisted index from disk with: index = faiss.read_index(\"data/my_index.index\")."
  rationale: "A specific command/API/library call. content_type=tool_instruction (NOT process_template — it is not a human how-to method)."
  tier: CORE

# ── POSITIVE: tool_instruction (algorithm — the BUG-147 trap case) ─────────
- id: SS-POS-004
  domain: computer-science
  source_books:
  - Grokking Algorithms — Aditya Bhargava
  cluster_segments:
  - source_book: Grokking Algorithms — Aditya Bhargava
    text: "Depth-first search visits a graph by pushing the start node onto a stack, then repeatedly popping a node, marking it visited, and pushing each unvisited neighbor back onto the stack until the stack is empty."
  is_convergent: false
  should_extract: true
  expected_fb:
    is_summary: false
    route: FB
    name: Depth-First Search Traversal
    definition: "An algorithm that traverses a graph by pushing the start node onto a stack, then repeatedly popping a node, marking it visited, and pushing each unvisited neighbor until the stack empties."
    mechanism: "The stack enforces last-in-first-out ordering, so the traversal goes as deep as possible down one branch before backtracking to explore siblings."
    boundary: "Applies to connected graph traversal where depth-first order is acceptable. Fails when breadth-first or weighted shortest-path order is required."
    consequence: "Depth-first search visits every reachable node without tracking a visited set producing infinite loops, and terminates when the stack is empty."
    elaboration: ""
    extraction_type: descriptive_model
    content_type: tool_instruction
    tool_name: "Depth-First Search"
    platform: "algorithm (language-agnostic)"
    description: "Traverse a graph depth-first using an explicit stack, marking visited nodes so each is visited once"
    syntax: "push(start); while stack not empty: pop node, mark visited, push unvisited neighbors"
    parameters:
    - name: graph
      type: Graph
      description: "The graph to traverse"
    - name: start
      type: Node
      description: "The starting node"
    output: "A visitation order covering all reachable nodes"
    example: "dfs(graph, start) visits each reachable node exactly once"
    caveats: "Requires a visited set to avoid infinite loops on cyclic graphs"
    evidence_passages:
    - "Depth-first search visits a graph by pushing the start node onto a stack, then repeatedly popping a node, marking it visited, and pushing each unvisited neighbor."
  rationale: "An algorithm/code description. content_type=tool_instruction, NOT process_template — it is a computational procedure, not a repeatable human how-to (BUG-147 contrastive)."
  tier: CORE

