- id: CONV-041
  domain: psychology
  discipline: cognitive psychology
  source_books:
  - The Invisible Gorilla — Christopher Chabris & Daniel Simons
  - The Confidence Game — Maria Konnikova
  cluster_segments:
  - source_book: The Invisible Gorilla — Christopher Chabris & Daniel Simons
    text: The illusion of confidence tells us that people who are the most confident are the most competent — but the Dunning-Kruger
      effect shows the opposite is often true. In a classic study, students who scored in the bottom quartile on tests of
      grammar, logic, and humor estimated their performance to be above average. The problem is not just that unskilled people
      make mistakes — it's that their lack of skill also deprives them of the ability to recognize their own mistakes. Competence
      in a domain requires the same knowledge needed to evaluate competence in that domain.
  - source_book: The Confidence Game — Maria Konnikova
    text: 'Confidence artists exploit a simple truth: people trust those who seem confident, and confidence is easy to fake.
      The con artist doesn''t need to be competent — they only need to project competence convincingly. And because most people
      cannot reliably distinguish between confidence and competence, the confident actor wins by default. The Dunning-Kruger
      effect operates in the background: those most confident in their judgments are often those least qualified to make them,
      while genuine experts are more likely to express uncertainty.'
  is_convergent: true
  should_extract: true
  expected_fb:
    is_summary: false
    route: FB
    name: Dunning-Kruger Effect — Competence-Confidence Inversion
    definition: In many domains, the least competent individuals systematically overestimate their ability while the most
      competent underestimate theirs. This occurs because the metacognitive skill required to evaluate competence is the same
      skill required to BE competent — those who lack it cannot recognize its absence. An observed empirical pattern documented
      across domains from grammar and logic to medicine and investing.
    mechanism: 'The Dunning-Kruger effect is an EMPIRICAL PATTERN, not a causal mechanism. It arises from a metacognitive
      deficit: the skills needed to perform well in a domain are largely the same skills needed to evaluate performance in
      that domain. Those who lack competence therefore lack the calibration tool to assess their own level. Meanwhile, experts
      suffer from a false consensus effect — they assume others know what they know, causing them to underestimate their relative
      standing. The pattern has been replicated in domains ranging from firearm safety (where bottom-quartile hunters rated
      themselves above average) to medical diagnosis (where least-accurate residents were most confident).'
    boundary: 'Applies to domains where competence and metacognitive evaluation share underlying skills — most cognitive and
      professional domains. Fails when: (1) objective feedback is immediate and unavoidable (e.g., sports where you win or
      lose); (2) the domain is so simple that everyone reaches competence quickly; (3) individuals have received explicit
      calibration training with performance feedback. Also note: this is a statistical pattern at group level, not a deterministic
      claim about any individual.'
    consequence: 'In hiring, promotion, and expert testimony, confidence is a misleading signal of competence. Organizations
      that select for confidence over demonstrated competence systematically promote the least qualified. Structured evaluation
      — blind review, standardized tests, performance rubrics — outperforms confidence-based assessment. The effect also predicts
      that training improves self-assessment accuracy: novices become better at recognizing what they don''t know.'
    evidence_passages:
    - students who scored in the bottom quartile on tests of grammar, logic, and humor estimated their performance to be above
      average
    - their lack of skill also deprives them of the ability to recognize their own mistakes
    - those most confident in their judgments are often those least qualified to make them
    - genuine experts are more likely to express uncertainty
    extraction_type: empirical_pattern
    content_type: principle
    depth: cross-domain
  rationale: 'NEW EMPIRICAL PATTERN (D2234: extraction type expansion). Chabris/Simons and Konnikova converge on the Dunning-Kruger
    empirical regularity from different angles: cognitive psychology (the metacognitive deficit) and real-world exploitation
    (confidence artists). Both describe the same observed pattern — low-competence individuals overestimate, high-competence
    individuals underestimate — without claiming a causal law. This is an EMPIRICAL PATTERN because it describes WHAT reliably
    happens without a universal causal mechanism.'
