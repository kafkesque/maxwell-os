- id: L06_baseline_data_science
  description: Clear data science FB
  fb_name: Correlation Does Not Imply Causation Without Intervention
  fb_definition: Observational correlations between variables do not establish causation unless accompanied by an intervention
    that breaks confounding pathways. Randomized controlled trials, instrumental variables, or difference-in-differences designs
    are required to move from association to causal claim.
  expected_output:
    application: When analyzing A/B test results, confirm randomization was successful by checking pre-treatment covariate
      balance. Never claim 'X causes Y' from observational data without an identified instrument or natural experiment.
    failure_mode: Analysts discover correlation between user engagement and revenue, then recommend 'increase engagement to
      increase revenue' without establishing that engagement causes revenue rather than both being caused by product quality.
    elaboration: 'This is the most expensive statistical error in business. Companies spend millions building features to
      increase correlated metrics that have no causal relationship with revenue. The antidote is always an intervention: split
      users into treatment/control, change only one variable, measure the difference.'
    keywords: causal inference, confounding, randomized controlled trial, instrumental variable, difference-in-differences,
      covariate balance
    jargon: 'Confounding: A variable influencing both the independent and dependent variable, creating a false association.
      Instrumental variable: A variable used to estimate causal relationships when controlled experiments are infeasible.'
  expected_domains:
