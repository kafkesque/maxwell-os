# repo_integrity.yaml - the SYNC-INTEGRITY surface (BUG-400 class; P0-A / P0-B, 2026-09-25).
#
# WHY THIS FILE EXISTS
#   The repo lives inside a Dropbox File Provider domain, and the File Provider renames files out from under
#   the tools that read them. On 2026-09-25 that hit two layers at once, and BOTH were invisible to every
#   rail in this repo because no rail looked at the repository itself:
#     P0-A (git METADATA): .git/refs/heads/main was renamed to "main (M1 max's conflicted copy 2026-09-25)".
#       HEAD stopped resolving, `git log` said "does not have any commits yet", and `git status` claimed 1,220
#       files were ADDED (a first-commit-of-everything view). A commit from that state would have been a
#       bogus root commit. Later the same day .git/logs/HEAD was renamed away and git's reflog for main was
#       ROLLED BACK to an older file, so `git reflog` reported HEAD@{0}=a1061cd while HEAD was 96b1e9c - a
#       quiet disagreement between two records of the same fact, exactly the kind that misleads a recovery.
#     P0-B (worktree): 43 files were renamed to "<name> (<client>'s conflicted copy <date>)", and for 38 of
#       them the canonical path was LEFT EMPTY, so the conflict copy was the ONLY surviving copy - including
#       this repo's own justfile, config/decisions.yaml, DECISION-LOG.md and governance/buglog.md. `just
#       health` could not even start: there was no justfile to parse.
#
# THE INVARIANT
#   A repository whose git metadata resolves, and in which no name carries a sync conflict marker, and in
#   which every tracked path is present. scripts/check_repo_integrity.py is the enforcement; `--plan` prints
#   the deterministic repair, so a recovery is a REVIEWED PLAN and not an improvised `mv` (this file is the
#   single source for the marker pattern, the vault, and the git paths, so rail and plan cannot drift).
#
# WHAT THIS FILE IS NOT
#   It does not stop Dropbox. A rail cannot. It makes the condition LOUD within one `just health` (and it is
#   wired FIRST, before anything that needs git), and it refuses a COMMIT through a conflicted git (the
#   pre-commit hook calls it before rail 4). The root-cause fix is an owner act: get `.git` out of the synced
#   tree (BUG-400 / BUG-500 class), or stop the second client writing it.
schema_version: "1.0"
bug: BUG-400
provenance: "measured 2026-09-25 22:1x in this repo: 43 conflict copies, 38 with the canonical path missing, 3 inside .git"

conflict_marker:
  # The File Provider's naming, taken from the 43 measured names - not invented. The capture group is the
  # marker text (which machine caused it), reported so a recurrence names its source.
  patterns:
    - ' \(([^)]*conflicted copy[^)]*)\)'
  # BUG-528 (MEASURED 2026-09-26): the provider uses a SECOND form - a PREFIX, not a suffix. Unlike the
  # patterns above these do NOT mark a conflict to repair; they name a SIBLING whose canonical path is INTACT.
  # That makes them a rename-laundering vector: a rail that protects a path by NAME can be defeated by touching
  # the sibling (`governance/Copy of ANCHOR4_DEPTH_BLIND_SHEET_20260923.csv` was itself listed in may_touch
  # while its canonical name sat in will_not_touch). Declared HERE so the renaming vocabulary has one home and
  # rail 4 CONSUMES it rather than restating a pattern (D-2646).
  # OWED, GATED (BUG-528b): scripts/check_repo_integrity.py does NOT yet scan for these names - it must, but a
  #   `Copy of <owner instrument>` is owner-owed (exit 2) and the pre-commit hook treats exit 2 as fatal, so
  #   widening the integrity rail's subject would refuse EVERY commit until the one measured sibling is ruled
  #   on. Sequence first, then widen: the plan rail consumes this vocabulary today.
  prefix_patterns:
    - '^Copy of '

git:
  # The DEFAULT/bootstrap value only. The rail resolves the REAL git dir from git itself (resolve_from below):
  # after the BUG-500 fix .git is a one-line pointer FILE, and a rail that demanded a directory would then
  # fail on a repository that is perfectly intact.
  git_dir: .git
  # BUG-500. `git rev-parse --absolute-git-dir` is the only authority on where git metadata lives.
  resolve_from: 'rev-parse --absolute-git-dir'
  # BUG-500 PREVENTION. A sync client RENAMES what it syncs, and git metadata that gets renamed is a
  # repository that lies. Markers are substrings of the resolved ABSOLUTE path (platform-agnostic, C26) -
  # never a client name hardcoded in the script (C12).
  sync_root_markers:
    - 'Library/CloudStorage/Dropbox'
    - 'Library/Mobile Documents'
    - 'OneDrive'
    - 'Google Drive'
  # true = a git dir inside a sync domain is a FAILURE (exit 1), and the pre-commit hook refuses to commit
  # through it. This is the BUG-500 switch: it is turned to true ONLY once the git dir lives outside the
  # synced tree, and only an owner decision may turn it back.
  require_git_dir_outside_sync_root: true
  # P0-A. Each is an argv tail for `git`. If one of these does not resolve, EVERY other rail is reading a
  # repository that is not there, so this is the first thing `just health` evaluates.
  must_resolve:
    - 'rev-parse --verify HEAD^{commit}'
    - 'rev-parse --show-toplevel'
  # BUG-576 (MEASURED 2026-09-27 by the BOUNDARY REHEARSAL, in a real fresh repository). An UNBORN HEAD is a
  # LEGITIMATE state - HEAD names a branch with no commit yet, and git creates logs/HEAD AT the first commit -
  # and it is EXACTLY the state the BUG-400/BUG-564 RECOVERY route produces (a git dir re-created by hand, by a
  # clone, or by --separate-git-dir). Treating it as broken metadata made this rail REFUSE the one commit that
  # repairs the repository: a rule that cannot fire on the legitimate case (the BUG-574 class).
  # The three probes are DECLARED here so the verdict is never invented in the rail (C12). 'unborn' is not a
  # blanket excuse: the ref HEAD names must still NOT resolve as an object, and a ref that DOES resolve while
  # the born probe does not is BROKEN, never unborn (C16).
  head_born_probe: 'rev-parse --verify HEAD^{commit}'   # HEAD is BORN iff this resolves
  head_unborn_probe: 'symbolic-ref -q HEAD'             # ... UNBORN iff this names a ref that
  head_unborn_ref_probe: 'rev-parse --verify --quiet'   # ... resolves to NOTHING (the ref is appended)
  # P0-A. The reflog for HEAD and the commit HEAD names are two records of one fact. `.git/logs/HEAD` was
  # renamed away on 2026-09-25 and `git reflog` silently served a STALE branch reflog instead.
  head_reflog_relpath: logs/HEAD
  reflog_must_agree_with_head: true

repair:
  # Bytes are never deleted: a conflict copy that is NOT restored is MOVED to this vault, which is outside
  # the synced tree (so it cannot conflict again) and holds a byte-exact copy plus a sha256 manifest.
  vault_dir: ~/maxwell_os_conflict_snapshot_20260925
  vault_subdir: vaulted
  # A reflog is append-only, so the file that CONTAINS the other as a byte-prefix is strictly newer
  # information about the same linear history: restoring it loses nothing. Measured for logs/refs/heads/main
  # (94,781 -> 96,921 bytes, prefix=True). If containment does NOT hold the two are different histories and
  # this rail refuses to choose. Paths are relative to git.git_dir.
  prefer_superset_prefixes:
    - logs/refs/heads/main
    - logs/HEAD
  # Transient git bookkeeping whose losing copy carries no information (git rewrites it every commit).
  # Vaulted rather than restored: restoring a COMMIT_EDITMSG would re-create a stale file git does not need.
  transient_git_paths:
    - COMMIT_EDITMSG
    - MERGE_MSG
    - TAG_EDITMSG


worktree:
  # BUG-563 (2026-09-27, D-2684). The invariant above is 'every TRACKED path is present'; this is its other
  # half: 'every DIRTY path has a DECLARED HOME'. MEASURED 2026-09-27 before the fix: 124 dirty paths, 1 of
  # which (governance/RECONCILIATION.json) the plan granted - so 123 paths could never be committed AND were
  # never ignored, and the tree was permanently dirty for a reason no declaration named.
  #
  # TWO HOMES, ONE READER, NO OVERLAP:
  #   * GRANTED  - the plan's may_touch. Rail 4 already owns 'a session may write/commit this', so the grant is
  #     asked THERE (this file does not restate an allow-list - D-2646).
  #   * EXCLUDED - declared below, joined to git's OWN verdict by `git check-ignore --no-index`, and enforced
  #     by the .gitignore bytes. A declaration git does not honour is a FAULT, never a quiet pass (D-405).
  # A path in NEITHER home can never be committed and will never be ignored: it is FATAL (exit 1), because the
  # fix is a declaration (grant it, named, or declare the exclusion with a why) and never a silent cleanup.
  bug: BUG-563
  why: >-
    BUG-563 filed the class: 'an on-disk object is either INDEXED or DECLARED excluded, never silently absent'
    (the archive census rule, BUG-537/BUG-556), applied to the WORKTREE. Rail 4 audits the STAGED set and rail 0
    audits git METADATA, so the dirty worktree sat between the two rails and no declaration named it.
  plan: governance/session_plan_20260924.yaml    # the GRANTING home - consumed, never restated
  excluded:
    - pattern: 'backups/**'
      why: >-
        PRE_* PRE-IMAGES written by pipeline/backup_guardian.sh (C13) - evidence of a batch write, not content.
        MEASURED 2026-09-27: 112 of the 124 dirty paths. Committing them would bloat history with pre-images
        whose only reader is a human doing a revert, and leaving them untracked-but-visible is the defect filed.
    - pattern: 'governance/drift_report_2*.json'
      why: >-
        per-RUN snapshots of drift_monitor.py. The CONSUMED output is governance/drift_report_latest (the
        timestamped siblings are run artifacts); config/derivations.yaml already treats PRE-IMAGES this way.
    - pattern: 'governance/bench_preflight_2*.json'
      why: >-
        per-RUN snapshots; the consumed output is governance/bench_preflight_latest.json, declared in
        config/bench_preflight.yaml. Same disposition and same reason as the drift snapshots above.
    - pattern: '.pipeline_runner.lock'
      why: >-
        D-2800 (BUG-563 recurrence). A runtime lock written by pipeline/runner.py at every run; a transient
        mutual-exclusion artifact, never content. Committing it would bloat history with a lock that is
        re-created on the next run.
    - pattern: 'governance/*.numbers'
      why: >-
        D-2800 (BUG-563 recurrence). Owner SOURCE MATERIAL (research books) dropped into the worktree by a
        Dropbox sync - not repo content, never indexed. Declared excluded rather than left silently absent.
    - pattern: 'governance/anchor ruler*.csv'
      why: >-
        D-2800 (BUG-563 recurrence). Owner anchor-ruler drop-in (human instrument, will_not_touch family), not a
        machine artifact. Declared excluded so it stays on disk for the owner but is never tracked.
    - pattern: 'config/taxonomy_v9.yaml'
      why: >-
        D-2897 v9 menu-edit build intermediate. scripts/build_taxonomy_v9.py writes config/taxonomy_v9.yaml
        from config/taxonomy_v8.yaml; scripts/apply_taxonomy_v9.py promotes it to the LIVE
        config/taxonomy_v5.yaml (whose 'v5' name is a documented historical artifact, content now v9). The v9
        intermediate is byte-identical to live and regenerable, so it is declared excluded (never indexed),
        never left silently absent.

crossing_rate_limit:
  # D-2802 (Tier 2, 2026-10-03): a will_not_touch family that needs repeated one-off crossing permits has
  # drifted semantically (the BUG-528 failure mode: pipeline/** was crossed ~5x/week while NOTHING counted the
  # frequency). This ceiling converts that drift into a MACHINE signal, consumed by
  # scripts/check_session_plan.py#crossing_rate_faults: an ACTIVE crossing is one that resolves into a
  # will_not_touch family, has `acked_by` + `acked_on`, and carries no `spent_by:` yet. >N active crossings into
  # ONE family is refused (rc=2, owner gate) - the fix is a FAMILY-level re-scope decision, never another
  # file-level crossing. N=1: an owner-instrument family should never need even one; a single active crossing
  # already emits the D-2803 Tier-3 re-ask note.
  max_active_per_family: 1

severity:
  # report_only_globs: a conflict copy here is real but not a repository-integrity defect, so it is reported
  # as owner-owed (loud, exit 2) rather than fatal (BUG-457 convention: 2 = owner-owed, never silent).
  report_only_globs:
    - 'knowledge pipeline/**'
    - '**/__pycache__/**'
    - '.pytest_cache/**'
exit_codes:
  ok: 0
  fail: 1
  owner_owed: 2

git_subject:
  # BUG-527 (MEASURED 2026-09-26). A rail that shells git audits whichever index/repository the ENVIRONMENT
  # names, because GIT_DIR / GIT_WORK_TREE / GIT_INDEX_FILE are inherited by every child process. This block is
  # the ONE home of the guard set (D-2646); scripts/lib/git_subject.py is the ONE implementation; consumers are
  # scripts/verify_recalibration_pins.py (RAIL 3), scripts/check_session_plan.py (RAIL 4),
  # scripts/check_declaration_consumers.py (RAIL 5) and - since D-2696 - scripts/check_repo_integrity.py (RAIL 0),
  # which pins through git_subject.recovery_subject(): the TOLERANT variant. Its exemption is HONOURED, not
  # dropped: where nothing resolves it pins NOTHING and runs its children with the guards CLEARED, so a broken
  # repository is still REPORTED rather than refused (BUG-568); where something DOES resolve the ambient values
  # are compared and git's own minted index adopted exactly as for rails 3/4/5. MEASURED 2026-09-27 before the
  # fix: `GIT_DIR=<decoy>/.git` made this rail print `ok repo-integrity: git dir <decoy>/.git` rc=0 (it
  # CERTIFIED A FOREIGN REPOSITORY), --worktree reported 723 phantom dirty paths through the decoy's index, and
  # --selftest crashed with a traceback.
  # Measured bypass: `GIT_INDEX_FILE=/tmp/abidx ... --staged` returned
  # rc=0 while the real staged set was never read; the same day an unflagged `git add` moved the commit set
  # 42 -> 43 and nothing observed it.
  decided: D-2674   # the owner's RATIFY word put this guard set IN FORCE (see DECISION-LOG D-2674);
                    # the change itself landed as the BUG-527 fix and claimed no decision id
  bug: BUG-527
  home: scripts/lib/git_subject.py
  # subject_env: compared against the DISCOVERED subject. An ambient value that names the SAME subject is
  #   TOLERATED - MEASURED probe 2026-09-26: git DOES hand the pre-commit hook GIT_DIR + GIT_INDEX_FILE for the
  #   real repository (in this separate-git-dir layout), so a presence-detecting rule would refuse EVERY commit.
  #   A value naming a DIFFERENT subject is REFUSED (C16, fail closed; nothing is guessed).
  # clear_env: REMOVED from every child git environment. Where there is no path-like value to compare against,
  #   clearing is strictly stronger than refusing and cannot misfire: an alternate object store can supply an
  #   object a read would otherwise fail to find, and a GIT_CONFIG can redirect core.worktree.
  subject_env: [GIT_DIR, GIT_WORK_TREE, GIT_INDEX_FILE, GIT_COMMON_DIR, GIT_OBJECT_DIRECTORY]
  clear_env: [GIT_ALTERNATE_OBJECT_DIRECTORIES, GIT_CONFIG, GIT_CONFIG_PARAMETERS, GIT_CONFIG_COUNT,
              GIT_IMPLICIT_WORK_TREE, GIT_GRAFT_FILE, GIT_NO_REPLACE_OBJECTS, GIT_REPLACE_REF_BASE, GIT_PREFIX,
              GIT_INTERNAL_SUPER_PREFIX, GIT_SHALLOW_FILE]
  # UNION CONTROL (--selftest): git's OWN `rev-parse --local-env-vars` (16 variables, measured 2026-09-26 on git
  # 2.39.5) must be covered by the two sets above, or a variable a FUTURE git adds escapes the pin silently.
  guard_union: 'rev-parse --local-env-vars'
  # -- INDEX TOLERANCE (BUG-566/D-2673, MEASURED 2026-09-27) ------------------------------------------------
  # git mints a TEMPORARY index for SOME of its own commits and hands it to the pre-commit hook through
  # GIT_INDEX_FILE. MEASURED on git 2.39.5 (Apple Git-154), separate-git-dir layout, via
  # `scripts/lib/git_subject.py --minted-index-name`: a PARTIAL commit (`git commit -- <path>`) hands the hook
  # GIT_INDEX_FILE=<gitdir>/next-index-<pid>.lock, the file EXISTS at hook time, and git removes it on exit;
  # a NORMAL commit hands <gitdir>/index. TWO rails read that one fact and disagreed - RAIL 4 REFUSED the
  # minted name while RAIL 5 TOLERATED and NAMED it, and RAIL 5's note was FALSE because its child
  # environment DROPPED GIT_INDEX_FILE, so it audited <gitdir>/index while NAMING the temp index (BUG-567,
  # the BUG-527 class: a write-boundary rail reporting on a subject it never read).
  #
  # THE RULE (D-2673): ADOPT, never merely tolerate. An ambient index is READ as the subject when ALL THREE
  # hold - (1) its realpath is a file DIRECTLY inside the PINNED git dir, (2) its basename matches one of
  # owner_name_globs, (3) it EXISTS. Anything else ambient is REFUSED (C16). Mere tolerance is worse than a
  # refusal: the rail would NAME an index it did not read. And (3) is not decoration - git reads a MISSING
  # index as EMPTY, so an absent file would report 'all declared' over no bytes at all.
  # ONE implementation: scripts/lib/git_subject.py#index_subject (explicit --index-file always wins).
  index_tolerance:
    decided: D-2673
    bug: BUG-566
    # The names git MINTS, not a shape we chose. Both spellings are declared because git's own minted name has
    # carried the .lock suffix in every version measured here; a build that mints the bare name is covered too.
    owner_name_globs: ['next-index-[0-9]*', 'next-index-[0-9]*.lock']
    why: >-
      git's OWN temporary index for a partial commit IS the commit set at the WRITE moment, so REFUSING it
      blocks every partial commit (which pushes work toward --no-verify) and NAMING it without reading it
      reports on the wrong bytes. Neither is acceptable at a write boundary.
    control: >-
      `python3 scripts/lib/git_subject.py --selftest` joins these globs to the name git ACTUALLY mints RIGHT
      NOW (minted_index_name builds a temp repo with a hook that records $GIT_INDEX_FILE, then commits once
      normally and once partially): a declared glob that no longer matches reality turns the control RED
      (D-405 join to reality, never a remembered value). Further controls refuse a minted name in a FOREIGN
      git dir, a `..` escape, a name git never mints, and a minted name that does not EXIST.
