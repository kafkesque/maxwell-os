  expected_fb:
    is_summary: false
    route: FB
    name: Keynesian Recursive Expectation
    definition: 'In markets where asset prices depend on collective belief rather than intrinsic value,

      successful prediction requires reasoning about what others believe others believe — a

      recursive chain of mutual expectation. The asset''s fundamental value decouples from its

      market price with each recursion step, as each participant optimizes for the anticipated

      average opinion rather than underlying reality.

      '
    mechanism: 'Recursive expectation drives price formation through higher-order belief coordination.

      Level-1 investors value assets on fundamentals. Level-2 investors value based on predicted

      level-1 beliefs. Level-k investors value based on predicted level-(k-1) beliefs. The

      mechanism amplifies small errors: misperceptions about others'' beliefs compound with each

      recursion level, producing price cascades where individually rational decisions generate

      collectively destabilizing speculation. The recursion has no natural termination — at

      sufficiently high k, the fundamental value becomes negligible relative to the recursive

      belief component.

      '
    boundary: 'Applies when future prices depend primarily on other investors'' behavior rather than

      measurable cash flows. Fails when: (1) the asset has a contractually guaranteed terminal

      value (zero-coupon bond) — the recursion collapses to a known endpoint; (2) participants

      have identical information and reasoning — recursion converges to fundamentals; (3)

      transaction costs exceed speculative margin — the game is not worth playing; (4) a

      dominant player can unilaterally set the price — no need to predict others.

      '
    consequence: 'Markets governed by recursive expectations exhibit excess volatility relative to

      fundamentals, spontaneous coordination on arbitrary focal points (round-number prices),

      and vulnerability to self-fulfilling prophecies where collective belief in a price

      movement causes that movement. This explains why assets with zero cash flows

      (cryptocurrencies, collectibles, meme stocks) can sustain high valuations indefinitely

      as long as participants believe others will continue to believe.

      '
    evidence_passages:
