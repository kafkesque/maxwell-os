- id: D-2661
  state: OPEN
  category: GOVERNANCE / RULES
  date: '2026-09-26'
  title: 'Two fields of every registry row were joined by NOTHING: a cited coordinate (table/column) must RESOLVE
    to the census home declared for it - EXISTENCE + MEMBERSHIP, DELEGATED, NEVER VALUE'
  files:
  - scripts/check_derivation_homes.py
  - config/derivations.yaml
  - config/silent_repair.yaml
  - governance/buglog.md
  bugs:
