- id: D-2866
  state: RATIFIED
  category: ANCHOR / TAXONOMY
  title: 'Anchor domain remap to v8 (20 rows: 16 DROP + 4 ROUTED) — deterministic, anchor-only, silver excluded'
  decision: |
    Deterministic (LLM-free) anchor-only v8 domain remap closes BUG-630's anchor-side consequence: anchors still
    carried the demoted domain labels 'science & research' and 'social sciences' after D-2865 dropped them from the
    v8 domain space. build_anchor_v8_remap_triage.py reads ONLY discipline_anchor_rederived_v7_20261007.json (the
    authoritative 201-row anchor artifact; the D-2853 research & methodology -> research practice rename is already
    applied) and applies RENAME / DROP {science & research, social sciences} / ROUTE (sole-domain rows via
    config/discipline_domain_map.yaml, fallback research practice) plus the six owner overrides, emitting
    anchor_v8_domain_remap_triage_20261007.csv (20 rows: 16 DROP + 4 ROUTED). build_anchor_v8_apply.py applies the
    SAME remap() to emit discipline_anchor_rederived_v8_20261007.json (201 rows), re-stamped taxonomy_version=v8 /
    anchor_version=v8 with the live menu_hash 8218d6db... and answer_space_hash 5bd94568... Owner overrides: R004
    legal & public policy, R198 marketing & communications, R065 media & entertainment, R107 education + user
    experience + research practice, R162 education + leadership, R085 emerging (metacognition / self-awareness /
    critical thinking -> abstain); R031 / R033 / R164 stay research practice (no change). Golden = anchors only;
    silver (gold_4axis.jsonl / gold_frozen.yaml / stage2_fewshot) is regenerated by S4, never hand-remapped.
    Legacy ANCHOR_208_CONSOLIDATED_20261002.json is a different generation (86 discipline disagreements) and must be
    regenerated from rederived_v8, never hand-patched.
  bugs: [BUG-630]
