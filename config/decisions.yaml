- id: D-384
  category: ONTOLOGY / GOVERNANCE
  state: RESOLVED
  title: 'The depth state is three declared layers - 13.09 partial 18/150, 24.09 complete 150/150, 25.09 adjudicated 145/148 - and the canonical column is depth_final_class'
  rationale: 'MEASURED 2026-09-25: the 24.09 drop-in is a strict superset of the tracked sheet (0 conflicting cells on the 18 both fill). Intra-rater agreement between the 24.09 pass and the 25.09 adjudication is raw 0.710 (103/145) but alpha 0.914 nominal / 0.896 ordinal, ABOVE the operative floor 0.800; 38 of the 42 disagreements are adjacent classes concentrated at D2/D3 (18) and D3/D4 (16). The axis is reliable; the BOUNDARY is where the rubric is thin. Raw agreement alone would have argued for re-labelling the whole axis - the chance-corrected statistic says the opposite, which is why the floor must be read, not the raw rate.'
