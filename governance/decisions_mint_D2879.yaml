    ANCHOR_208_CONSOLIDATED -> 92 / 46 total on 194 shared ids. So "what is the domain of anchor Rxxx?" depended
    on WHICH FILE the reader opened: an error leak, not a cosmetic drift. It stayed invisible because (a) the
    ladder's axis rail declares authority=rederived_v8 and consumer=ANCHOR_208_CONSOLIDATED, and CONSOLIDATED is
