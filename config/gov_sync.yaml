# config/gov_sync.yaml — the DECLARED JOINS between the registers and the USER-FACING faces (D-2981).
#
# WHY. The agent-facing registers (decisions.yaml + its census, the buglog + bug_status.json, the
# task register) and the human-facing faces (DECISION-LOG.md, MASTER-TASK-REGISTER.md, buglog.md,
# agent/session_seed.yaml) were only JOINED in two places: the two census restatement lines
# (check_governance_faces) and nothing else. Measured 2026-10-13: session_seed.yaml was SEVEN days
# stale at boot (pipeline_commit v3.0-D2370, status 2026-10-06), MTR and DECISION-LOG headers said
# 2026-10-07 while the registers had moved on, and MTR held 240 lines of prose where a register
# should be. A face nobody derives is a face that drifts, and a boot-loaded file that drifts
# PROPAGATES the drift into every session that reads it.
#
# THE SHAPE (one writer, one rail, both in the ladder):
#   * index_block — a machine-owned block delimited by the GOV-INDEX sentinels. scripts/gov_sync.py
#     renders it from the registers; scripts/gov_sync.py --check BYTE-COMPARES it. Hand edits are
#     therefore detectable, not merely discouraged.
#   * history_boundary — the GOV-HISTORY-START sentinel: below it a face makes NO LIVE CLAIM. MEASURED
#     2026-10-13 (BUG-761): the original wording ("everything below is DATED HISTORY, append-only, never a
#     register, and the rail fails if a new OPEN item is added") was FALSE about what actually sits there - the
#     owner's own INDEX sections, which are maintained (a bug was appended below the marker the day the marker
#     was written) but are NOT a register. So the region has TWO declared kinds of content and the sentinel now
#     says so: declared HAND INDEXES (row-joined on every `just health`, non-authoritative - see the heading
#     rule below) and DATED HISTORY (append-only, never re-counted). A hand index heading must SAY which it is;
#     the rail (scripts/check_governance_faces.py#heading_faults) fails closed on one that does not.
#   * derived_fields — scalar fields a face must carry but must not author (session_seed).
schema_version: '1'
authority: D-2981
decisions: [D-2692, D-2981, BUG-588]
registers:
  decisions: {registry: config/decisions.yaml, census: config/decisions_summary.json}
  bugs: {log: governance/buglog.md, census: governance/bug_status.json}
  tasks: {register: config/task_register.yaml}
  # the PIPELINE commit the pipeline manifest pins (the value session_seed must carry) -
  # NOT config/version.yaml (which carries versions, not the commit).
  manifest: {path: config/pipeline_config.yaml, key: pipeline_manifest.pipeline_commit}
faces:
- path: MASTER-TASK-REGISTER.md
  index_block: true
  history_boundary: true
- path: DECISION-LOG.md
  index_block: true
  history_boundary: true
- path: governance/buglog.md
  index_block: true
  history_boundary: true
- path: agent/session_seed.yaml
  index_block: false
  history_boundary: false
  derived_fields:
  - key: session.pipeline_commit
    from: manifest
  - key: session.status
    from: task_register
# A decision in one of these states is UNRESOLVED: it appears in the faces as needing action.
open_decision_states: [open, proposed, draft, deferred, planned]
# A bug heading must carry a STATE and a SEVERITY: "## BUG-nnn (SEVERITY - STATE ...)".
severity_tokens: [CRITICAL, HIGH, MED, LOW]
state_tokens: [OPEN, CLOSED, FIXED, RESOLVED, SUPERSEDED, FILED, HELD]
task_priorities: [MUST, SHOULD, WORTH]
# D-2985: the two axes EVERY task must declare. `state` says whether it is live; `mover` says WHO must
# act for it to advance. Before this there was one axis and one word for three different things - a
# standing RULE (never closes), an OWNER-gated item (the pipeline cannot move it) and real work - all
# registered as "open". So the face the owner reads led with rows he could not act on and the agent
# could not advance, session after session, which is what "the resolved items are still on top" was
# actually describing. `state: gate` is RETIRED: gatehood is `mover: owner` plus the gate text.
task_states: [open, rule, done, superseded]
task_movers: [owner, pipeline]
# The token that marks a gate as the OWNER's word (never hardcoded in a rule, C12/C20), and the label the
# owner lane LEADS with - one home for the string, read by the writer that renders it and by the faces
# rail that requires the lane to be present.
owner_gate_token: owner
face_owner_lane_label: 'OWNER LANE'
# D-2986 (BUG-761): a HEADING is a claim too. The region below the marker is populated by INDEX sections (a
# tier heading followed by a table of rows), and one of those headings can claim a CURRENT state - and restate
# a count - with nothing joining it. MEASURED 2026-10-13, the day after the LIVE region was policed: TWELVE
# index headings sat inside a region every face declares "NOT a register" while claiming exactly that, and two
# restated a count that had drifted - DECISION-LOG `## 🟢 ACTIVE — in effect (477)` against 565 ACTIVE in the
# register, and `## ⚪ DONE / CLOSED — bottom (97)` against 348 closed (resolved 313 + superseded 16 + archived
# 8 + rejected 11). A count has ONE home (BUG-588/D-2642) - the derived block above - and the index the owner
# navigates by must say what it IS: a hand index, joined on every run of the rail, and NOT the authority.
# The shape that discriminates is the LEADING token: `## 🔴 OPEN — MUST` and `## 🟢 ACTIVE` are INDEX headings
# (heading, then rows), while `## BUG-331 (MED, OPEN)` is a RECORD heading - the register's own status slot,
# scripts/bug_status.py's surface. MEASURED the same day: a word-ANYWHERE form of this rule fires on 399 record
# headings in buglog.md, so the rule reads the leading token ONLY. `face_hand_index_token` is the string every
# such heading must carry (one home for the string, C12: never a literal in the rail).
face_index_head_tokens: [MUST, SHOULD, WORTH, OPEN, CLOSED, ACTIVE, DONE, PENDING, RESOLVED, PROPOSED, SUPERSEDED, ARCHIVED, REJECTED, DEFERRED]
face_hand_index_token: 'HAND INDEX'
# The DECLARATION an index heading owes, as a regex (C12: never a literal in the rail). TWO shapes are already
# true of a heading below the marker and both name the authority, so both are accepted: the repair this act
# writes ("HAND INDEX, not a register (the DERIVED block above is the ONE authority ...)") and the D-2984
# snapshot form the faces already carry ("SNAPSHOT 2026-10-03 - dated history; the DERIVED index at the top owns
# the current state"). MEASURED 2026-10-13, the first run of the limb: DECISION-LOG.md:205
# `### Pending from registry (SNAPSHOT 2026-10-03 - dated history; the DERIVED index at the top owns the current
# state, D-2984)` was the ONLY fault, and it was a fault of the RULE, not of the face - it already declares.
face_head_declaration_re: '(?:HAND\s+INDEX|DERIVED\s+(?:block|index))'
# BUG-757 ceiling, RE-MEASURED 2026-10-13 (D-2985). The population is now the CENSUS's open ids (ONE home
# for OPEN-ness, D-2642) and a severity is read from the id's FIRST heading at ANY hash depth (the
# BUG-426/427 class: three-hash headings were invisible to a `^## ` reader). Under that join the gap is
# 101. The retired 125 counted 88 bugs the register calls CLOSED and was blind to 18 open ids; the
# retired severity_grandfathered_titles (108) was a SECOND number for the same question and is gone -
# one question, one home. LOWERED 125 -> 101 (D-2644: a ceiling may only be LOWERED).
severity_grandfathered: 101
# How many rows the faces print per list (the FULL set stays in the registers; the face is a view).
face_list_limit: 12
