    + 34 NLI-only) = the P3 generative-challenger / GOLD-A seed; mean P(mislabel) 0.236. Outputs governance/label_model_output.{json,md} + temp/golden_labels_probabilistic.jsonl. (4) P3 CHALLENGER PREP:
    residency fix (unload each non-pinned voter after its vote in label_vote.py — Claude finding) + --high-suspicion filter (135 FBs) + gemma-4-E4B re-classification path validated live. Full 135-FB challenger
    run = flagged monitored operation (BUG-224).'
