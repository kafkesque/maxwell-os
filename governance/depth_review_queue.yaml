      options and reducing cognitive burden, even when more choices appear to offer
      greater flexibility. This principle operates through the strategic application
      of constraints that guide user attention and simplify decision-making.
    mechanism: 'This is a normative heuristic: selecting a limited set of options
      or design elements reduces decision fatigue and increases user confidence. By
      constraining choices to a manageable number, designers create a sense of progress
      and accomplishment that reinforces positive user experience. The constraint
      is not arbitrary but purposeful, designed to eliminate confusion and waste while
      preserving essential functionality.'
    boundary: Applies when design decisions can be meaningfully reduced without losing
      core functionality. Fails when constraints eliminate necessary options or when
      users require extensive customization to meet their specific needs. Also fails
      when the constraint creates artificial scarcity that misrepresents the actual
      product capability.
