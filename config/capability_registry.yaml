  # ─── THE ITEM CENSUS (does open WORK route to a declared capability?) ───
  #: A disposition is what an item gets when it does NOT route. It is keyed by MOVER for tasks (the register's own
  #: vocabulary) and by class for bugs, and every reason must be DECLARED below: an item is never silently unrouted.
dispositions:
  tasks:
    pipeline: route_graph_incomplete
    owner: owner_gate
  bugs:
    default: bug_is_a_finding

reasons:
  route_graph_incomplete: >-
    the item names no artifact owned by a declared capability. MEASURED, not assumed: the reader reports which of
    the item's artifacts exist but are owned by NO declared capability (artifact_has_no_route) separately from the
    items whose text names no repo artifact at all (no_artifact_named), because only the first kind is a missing
    ROUTE while the second is prose that cannot be routed by a join.
  owner_gate: >-
    an owner-moved item is an OWNER'S word to give (D-2941: a gate carries INTENT or POLICY), so it is not routable
    to a capability until the word exists - routing it would be an agent minting the intent.
  bug_is_a_finding: >-
    a bug is a FINDING, not a work item: the register that moves work is config/task_register.yaml. A bug therefore
    routes only when its title NAMES a declared capability's artifact; otherwise it stays unrouted until a task or a
    decision names the capability that fixes it. Declaring it routable would fabricate work.

