- id: D-332
  category: RESEARCH
  state: RESOLVED
  date: '2026-09-22'
  title: 'Community-benchmark-first standing rule + mlx-dspark M1 net-loss + on-device topic sweep (no engine beats oMLX on M1 Max)'
  decision: >-
    STANDING RULE: for every speed/latency/quant claim, weight COMMUNITY benchmark results on matching
    hardware ABOVE vendor claims on newer hardware (use both). Vendor M4/M5 numbers do NOT transfer to
    M1 Max. Canonical sources: whichllm (community tok/s), SiliconScope, LM Studio community, engine-repo
    issues. EVIDENCE: ARahim3/mlx-dspark#38 (M1 Max 64GB, exact Maxwell hardware) — speculative decoding
    is a NET LOSS on Qwen3.8-27B-8bit (0.55-0.91x; round cost ~2.4x a decode step; verify compute-bound on
    old GPU, no NAX). mlx-dspark RUNS on M1 (doctor passes) but does not help. CONSEQUENCE: D-293 (oMLX MTP)
    re-scoped from 'enable' to 'measure before/after on a frozen S2 batch, adopt only if faster'; M1 Max is
    bandwidth-bound so D-294 (oQ4e/oQe quant) + D-292 (cache fix) outrank MTP. TOPIC SWEEP (on-device-ai/
    on-device-llm): TinyChatEngine (AWQ+Metal, M1, REFERENCE), LiteRT-LM (mobile-first, WATCH), needle/cactus
    (121M tool-call/extraction model, WATCH as S2 probe head), BigMoeOnEdge/PrismML-Bonsai (WATCH/REJECT).
    NO engine in the topics out-serves oMLX on M1 Max. Artifacts: governance/MARKET_RESEARCH_20260922_M1.md,
    feed.opml (+on-device-ai/on-device-llm topics + 6 evaluated engine entries).
  files:
  - governance/MARKET_RESEARCH_20260922_M1.md
  - feed.opml
