- id: CONV-027
  domain: engineering
  discipline: computer science
  source_books:
  - The Mythical Man-Month — Frederick Brooks
  - The Pragmatic Programmer — Hunt & Thomas
  - Clean Architecture — Robert C. Martin
  cluster_segments:
  - source_book: The Mythical Man-Month — Frederick Brooks
    text: Adding manpower to a late software project makes it later. The reason is that software development involves complex
      communication and coordination. When you add people, the existing team must spend time bringing newcomers up to speed,
      and the communication channels grow quadratically — n people have n(n-1)/2 communication paths. The overhead of coordination
      eventually overwhelms the benefit of additional labor.
  - source_book: The Pragmatic Programmer — Hunt & Thomas
    text: Conway's Law states that organizations design systems that mirror their communication structure. If you have four
      teams building a compiler, you'll get a four-pass compiler. The architecture of software reflects the social structure
      that produced it. This means you cannot design a system's architecture independently of how the team communicates.
  - source_book: Clean Architecture — Robert C. Martin
    text: Good architecture maximizes the number of decisions you can defer. The longer you can keep options open, the more
      information you have when you finally commit. This is why dependency inversion matters — it decouples high-level policy
      from low-level detail, allowing you to defer implementation choices until the last responsible moment. Premature commitment
      to technical details is the primary cause of architectural rigidity.
  is_convergent: true
  should_extract: true
  expected_fb:
    is_summary: false
    route: FB
    name: Communication Overhead Limits Scale
    definition: Adding personnel to complex engineering projects creates coordination costs that eventually exceed the productive
      contribution of each additional person. Communication paths grow quadratically with team size (n(n-1)/2), while productive
      output grows at best linearly. Beyond a threshold, each added person makes the project later, not earlier.
    mechanism: 'Coordination costs dominate because every new person must: (1) learn the existing system architecture (ramp-up
      time), (2) coordinate their work with every other team member to avoid conflicts, and (3) participate in team-wide communication
      (meetings, reviews, documentation). The quadratic communication growth means a team of 10 has 45 communication paths;
      a team of 20 has 190. At some point, the marginal person spends more time coordinating than producing. This is a property
      of any task with interdependent sub-components — it applies to software, construction, film production, and scientific
      collaboration.'
    boundary: 'Applies when: (1) tasks are interdependent (not parallelizable), (2) coordination requires human communication
      (not automated conflict resolution), (3) new members require ramp-up. Fails when: tasks are fully independent (embarrassingly
      parallel), coordination is automated (e.g., CI/CD pipeline resolves merge conflicts), or new members need zero ramp-up
      (identical copies of existing expertise).'
    consequence: Software projects should staff with the smallest feasible team, not the largest affordable one. Architectural
      decisions should maximize independence between components to reduce coordination costs. Conway's Law implies that to
      change a system's architecture, you must first change the team's communication structure.
    extraction_type: causal_mechanism
    content_type: principle
    depth: domain
    evidence_passages:
    - When you add people, the existing team must spend time bringing newcomers up to speed, and the communication channels
      grow quadratically — n people have n(n-1)/2 communication paths.
    - This is why dependency inversion matters — it decouples high-level policy from low-level detail, allowing you to defer
      implementation choices until the last responsible moment.
    - Conway's Law states that organizations design systems that mirror their communication structure.
    - This means you cannot design a system's architecture independently of how the team communicates.
  rationale: CONVERGENT POSITIVE — SOFTWARE ENGINEERING (D2223). Three canonical software engineering sources converge on
    communication overhead as the scaling limiter. Depth is cross-domain — applies to any interdependent creative work. Fills
    software engineering gap that Kimi recommended. Brooks' Law is the classic formulation; Conway's Law and Martin's deferral
    principle extend it.
- id: CONV-028
  domain: data science
  discipline: statistics
  source_books:
  - The Book of Why — Judea Pearl
  - Calling Bullshit — Bergstrom & West
  - Naked Statistics — Charles Wheelan
  cluster_segments:
  - source_book: The Book of Why — Judea Pearl
    text: Correlation is not causation — this is the most fundamental lesson in statistics, yet it is routinely ignored. Two
      variables can be perfectly correlated without either causing the other if both are effects of a common cause. Ice cream
      sales and drowning deaths are correlated not because ice cream causes drowning but because both increase in summer.
      The only way to establish causation is through controlled experiments or causal diagrams that account for confounding
      variables.
  - source_book: Calling Bullshit — Bergstrom & West
    text: 'The correlation-causation fallacy takes a specific form: observing that A and B occur together and concluding that
      A causes B. This ignores three alternatives: B causes A, a third factor C causes both A and B, or the correlation is
      purely coincidental. In an era of big data, spurious correlations are easier to find than ever — with enough variables,
      some will correlate purely by chance.'
  - source_book: Naked Statistics — Charles Wheelan
    text: 'Regression analysis can show that two variables are related but cannot — by itself — prove that one causes the
      other. This is the central limitation of observational data. To establish causality, you need: (1) temporal precedence
      (cause before effect), (2) covariation (cause and effect vary together), and (3) elimination of alternative explanations.
      Only randomized experiments satisfy all three automatically.'
  is_convergent: true
  should_extract: true
  expected_fb:
    is_summary: false
    route: FB
    name: Correlation-Causation Confounding
    definition: 'Observed correlation between two variables does not imply that one causes the other. The association may
      arise from: (1) reverse causation (B causes A), (2) common cause (C causes both A and B), or (3) chance (spurious correlation
      in large datasets). Establishing causation requires eliminating these alternatives through experimental control or causal
      inference methods.'
    mechanism: 'Confounding creates spurious correlation because a hidden variable C simultaneously influences both A and
      B, making them vary together without either causing the other. The mechanism is: C → A and C → B, producing a statistical
      association A ↔ B that disappears when conditioning on C. This is why observational studies show correlations that randomized
      trials fail to replicate — randomization breaks the C→A and C→B links by making A independent of C, isolating the true
      causal effect (if any).'
    boundary: 'Applies when: (1) data is observational (not randomized), (2) potential confounders exist that are unmeasured
      or uncontrolled, (3) the analysis does not account for confounding structure. Fails when: the data comes from a properly
      randomized experiment, all confounders are measured and controlled, or the causal structure is fully known and modeled
      (e.g., Pearl''s do-calculus).'
    consequence: Observational studies generate hypotheses but cannot confirm them. Policy decisions based on correlational
      evidence risk implementing interventions that target the wrong variable. The replication crisis in social science is
      partly attributable to unmeasured confounding in observational research. Causal diagrams (DAGs) and instrumental variables
      provide partial remedies when randomization is impossible.
    extraction_type: causal_mechanism
    content_type: principle
    depth: cross-domain
    evidence_passages:
    - Two variables can be perfectly correlated without either causing the other if both are effects of a common cause.
    - 'This ignores three alternatives: B causes A, a third factor C causes both A and B, or the correlation is purely coincidental.'
    - Regression analysis can show that two variables are related but cannot — by itself — prove that one causes the other.
    - 'To establish causality, you need: (1) temporal precedence (cause before effect), (2) covariation (cause and effect
      vary together), and (3) elimination of alternative explanations.'
  rationale: CONVERGENT POSITIVE — STATISTICS (D2223). Three statistics sources converge on the confounding mechanism. Depth
    is universal — applies to ALL domains that use observational data. Fills the "correlation ≠ causation" gap that both evaluators
    flagged. Application is null (this is a diagnostic principle — it tells you what NOT to conclude).
