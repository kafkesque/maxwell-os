    is_summary: false
    route: FB
    name: Attribute Substitution in High-Stakes Judgment
    definition: Decision-makers substitute difficult target questions with easier heuristic questions unconsciously, even
      in high-stakes professional contexts like judicial sentencing and medical diagnosis. The complexity of the correct analysis
      paradoxically increases susceptibility to substitution because effortful processing is bypassed when cognitive resources
      are depleted or time-pressured.
    mechanism: 'Attribute substitution occurs because System 1 (intuitive) processing automatically generates rapid answers
      to easy questions. When confronted with a computationally difficult target question ("what is the legally correct sentence?"),
      System 1 substitutes an easier heuristic question ("how dangerous does this person feel?") without the decision-maker
      noticing. System 2 (deliberative reasoning) can override this, but doing so requires: (1) awareness that substitution
      occurred, (2) sufficient cognitive resources, and (3) motivation to perform the correct analysis. In high-stakes, high-volume
      settings (judicial calendars, hospital rounds), resource depletion makes substitution the default.'
    boundary: 'Applies when: (1) the correct analysis requires effortful computation, (2) a salient heuristic attribute is
      available, (3) decision-makers face time pressure or cognitive load. Fails when: the correct analysis is simple and
      automatic, no heuristic attribute is available, or decision-makers use structured checklists that force explicit consideration
      of each criterion.'
    consequence: Professional judgment in law, medicine, and regulation is systematically biased by unconscious heuristic
      substitution. Structured decision protocols (checklists, mandatory criteria, blind review) reduce substitution by forcing
      System 2 engagement. The principle implies that expertise does NOT immunize against bias — it may increase susceptibility
      if experts are overconfident in their intuitive judgments.
    extraction_type: causal_mechanism
    content_type: principle
    depth: cross-domain
    evidence_passages:
