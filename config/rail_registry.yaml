# config/rail_registry.yaml - THE RAIL REGISTRY (D-2665). The ONE home of the fact "this rail is a rail".
#
# WHY THIS FILE EXISTS. The rail set had no registry, so "which invariant has no owner" could only be found by
# inspiration, and three classes of mechanical defect kept recurring (BUG-537 and BUG-556 are both class iii):
#   (i)   a rail NOTHING RUNS        - a control that never fires (BUG-492)
#   (ii)  a rail whose PRINTED verdict and EXIT CODE disagree - a green line over a red code
#   (iii) a rail whose REMEDY or INPUT is uncontrolled - a rail that rewrites the thing it checks (BUG-537),
#         or whose input the ladder itself mutates (BUG-556)
# The registry is the ONE home of two facts a machine can settle without judgement:
#   * every `scripts/check_*.py` / `scripts/verify_*.py` is either INVOKED by a declared ladder recipe, or
#     declared DORMANT here with the exact thing that exercises it (a path that must EXIST, C16);
#   * every rail DECLARED as a writer must have its own `--selftest` run BY THE LADDER (class iii: a rail that
#     writes is a rail whose remedy is a claim, and a claim needs a known-answer control that has been SEEN).
# A `guard:` declared here is matched against the ladder's own text; a disagreement is class (ii), fail closed.
# This registry does NOT decide policy: it reports which invariant has no owner.
schema_version: '1'
authority: D-2665
ladder: justfile
recipes: [health, health-deep]     # the ladder(s) this registry governs; every other recipe is out of scope

#: Rails the ladder does NOT invoke. Each MUST name the thing that exercises it, and that path MUST exist: a
#: dormancy claim is a declaration, and a declaration whose subject is absent is an assertion (D-405/BUG-488).
dormant:
  scripts/check_stale_toolcall_rows.py:
    exercised_by: ['governance/p0_p1_criteria.yaml']
    reason: 'a CRITERION of drift_monitor.py, declared as an args/cmd line in governance/p0_p1_criteria.yaml (measured 2026-09-26)'
  scripts/check_suite_coverage.py:
    exercised_by: ['governance/p0_p1_criteria.yaml']
    reason: 'a CRITERION of drift_monitor.py, declared as an args/cmd line in governance/p0_p1_criteria.yaml (measured 2026-09-26)'

#: Rails that WRITE or REGENERATE an artifact. Each must be run with --selftest BY THE LADDER, because such a
#: rail's remedy is a claim about bytes it replaces, and an unproven remedy is where BUG-537/BUG-556 came from.
writers:
  scripts/apply_owner_domain_review.py:
    writes: ['governance/DOMAIN_RULER_FROZEN_20261008.json']
    why: >-
      BUG-678/BUG-679/BUG-682: the OWNER-derived authority for the discipline/domain/primary_domain axis.
      It is a WRITER (it re-stamps the ruler from the pinned owner sheet + the declared rulings), so its
      remedy is a claim about bytes and the ladder must run BOTH its --selftest (the known-answer controls)
      and its --check (re-derivation proof + the partition invariant) before believing it.
  scripts/check_boundary_rehearsal.py:
    writes: ['<system temp>/boundary_rehearsal_*/ (NEVER inside the synced tree: BUG-537)']
    why: >-
      D-2675: the rehearsal materializes TRACKED HEAD bytes into a REAL repository under the system temp dir and runs
      real commits there. Declared as a WRITER so a rail that writes is never a rail nothing accounts for, and so the
      ladder's own audit of declared writers keeps its --selftest wired (config/rail_registry.yaml#writers).
  scripts/check_rail_mutations.py:
    writes: ['<system temp>/rail_mutations_*/ (a REAL fixture repository: NEVER inside the synced tree, BUG-537)']
    why: >-
      D-2676: the MUTATION GATE mutates a SUBJECT inside a fixture repository and runs the declared runner there.
      Declared as a WRITER so a rail that writes is never a rail nothing accounts for, and so the registry audit
      keeps its --selftest wired (class iii of D-2665: a rail whose REMEDY is an unproven claim).
  scripts/build_archive_index.py:
    writes: ['archive/index.yaml']
    why: 'regenerates the archive census; its remedy was the subject of BUG-537 (a silent de-listing) and BUG-556 (a volatile input)'
  scripts/check_tests.py:
    writes: ['temp/tests_rail_last_run.json']
    why: 'records the suite census a later run is compared against'
  scripts/recompute_decision_summary.py:
    writes: ['config/decisions.yaml', 'config/decisions_summary.json']
    why: 'the MINT gate: it appends a record, so its own controls must be SEEN (D-2660/BUG-492)'

#: Optional: the guard class a rail is DECLARED to have. Omit unless the declared class must be pinned: an
#: entry that disagrees with the ladder is class (ii) and fails CLOSED. fatal = `|| exit 1`; tri_state =
#: `|| [ $? -eq 2 ]` (2 is owner-owed: loud, NOT fatal, BUG-457); report_only = `--report-only`.
guards:
  #: D-2688: the freeze window's EXIT is settled by rc 2 (owner-owed, LOUD, not fatal, BUG-457). Pinned here so that
  #: the day someone writes `|| exit 1` - or drops the guard - the registry calls it class (ii) instead of letting
  #: the ladder silently turn "the window is due to CLOSE" into a broken build.
  scripts/check_freeze_window.py: tri_state
  scripts/check_freeze_window.py --selftest: fatal
  scripts/build_archive_index.py --check: fatal
  scripts/build_archive_index.py --selftest: fatal
  scripts/recompute_decision_summary.py --check: fatal
  scripts/validate_depth_domain_contract.py --gate-if-active: tri_state

#: The COMMIT BOUNDARY (BUG-564). A dormancy claim says WHICH file exercises a rail; it cannot say the file still
#: DOES. This hook lives OUTSIDE the synced tree (BUG-500) - it is not in git, so no diff, no review and no backup
#: would show a line someone deleted, and the strictest gate in the system (RAIL 0/3/4/5) would silently disarm.
#: Its REQUIRED TEXT is therefore a declaration, verified against the bytes on disk, fail closed (C16).
commit_boundary:
  path: git-path:hooks/pre-commit
  why: 'a commit is the one act that makes a conflicted tree permanent (RAIL 0); four rails run ONLY there, so a deleted line is a rail that nothing runs - class (i) at the commit boundary. TWO SMALLER ACTS DISARM IT JUST AS SILENTLY, and neither was the subject of any rail (D-2687). (1) THE ROUTE: this declaration used to name a PATH SHAPE (gitdir: + hooks/). git does not promise to run that file - core.hooksPath decides, and the --git-dir of a linked worktree is not where hooks live. MEASURED 2026-09-27 in a real repository: with core.hooksPath set, `git rev-parse --git-path hooks/pre-commit` answered hooks/pre-commit while --git-dir answered .git, the file at gitdir:hooks/pre-commit DID NOT EXIST, and a DIFFERENT file received the commit and refused it. The route is therefore declared as git-path:<rel>: GIT ITSELF, never a path shape. (2) THE MODE: MEASURED the same day, a mode-644 hook is IGNORED - git LANDS the commit (rc=0), runs none of the four rails, and prints only a `hint:` git documents how to suppress. A byte-perfect verification of a file that may not be executed is class (i) with a green verdict, so the declared subject is the RESOLVED path, its bytes, AND its mode'
  must_contain:
  - 'python3 scripts/check_repo_integrity.py'
  - 'python3 scripts/verify_recalibration_pins.py --staged'
  - 'python3 scripts/check_declaration_consumers.py --staged'
  - 'python3 scripts/check_session_plan.py --staged'
