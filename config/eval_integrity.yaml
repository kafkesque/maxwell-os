    manifest: governance/FROZEN_S5_T11_20260922.json
    owner_approval: "2026-09-23"
    qualifier_required: true
    live_path_is_not_a_citation_surface: true
    verify: scripts/verify_frozen_pair.py
  # frozen stage pairs (C-3): cited by manifest, verified by scripts/verify_frozen_pair.py
  frozen_manifests:
    - governance/FROZEN_S5_T11_20260922.json

