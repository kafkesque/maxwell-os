  source: governance/MARKET_RESEARCH_ONTOLOGY_20260919.md
  verification: measured (BUG-281); human ruling required on the criteria
  description: 'noise_drop (1,055 rows) currently fuses an ONTOLOGICAL judgement (''no extractable object here'') with a RELATIONAL judgement (''true, but irrelevant to me''). The blind reviewer stated the relational case unprompted and repeatedly: ''valid fact but irrelevant''; ''too niche, nothing to do with any of my interest (design, business, personal improvement) so closer to noise drop''; and ''CRT is already outdated so it could also be quarantine, but since I am interested in old tech it can be still relevant''. Theoretical basis: relevance is relational -- it exists between a document, a user and a goal, not as an intrinsic property of text (Saracevic, JASIST 2007, DOI 10.1002/asi.20682), so an intrinsic content type can never express it. Proposed: an explicit, named, DATE-REVISABLE relevance/utility axis (criteria such as mission fit, actionability, personal utility), rated on a sample and extended by a local judge -- the QuRating pattern (arXiv 2402.09739) and the FineWeb-Edu
    quality-classifier pattern (arXiv 2406.17557). Revisable because a change of interest must re-rank WITHOUT re-extraction, which is precisely the case the reviewer raised.'
  files:
  - config/content_types.yaml
  - pipeline/stage4_merge.py
  - pipeline/retrieve.py

- id: D272f
  category: ONTOLOGY / GOVERNANCE
  state: RESOLVED
  date: '2026-09-19'
  title: 'Instrument repair, NOT re-engineering: the market-research programme adopted in ranked order (D-272f)'
  source: governance/MARKET_RESEARCH_ONTOLOGY_20260919.md
  verification: 24 candidates title-verified against OpenAlex (DOI + citation count on record)
  description: 'Verdict on ''does it need restructuring'': NO. The object model, the 5-axis schema, the 8-stage pipeline, the identity layer (7,995 objects / 164,202 edges / 0 dangling) and the provenance spine all survive intact. What failed is the LABELING INSTRUMENT and the INSTRUMENTATION. Adopted in consequence order: (1) closed-menu definition-anchored classification, which kills the synonym layer at source; (2) split QUARANTINE and persist the verdict; (3) a relevance axis with named rated criteria and a local judge; (4) a vocabulary quality gate -- mandatory definition plus include/exclude per slot, an OntoClean rigidity/identity/unity/dependence audit of the 104 slots, per-slot inter-annotator agreement against the Landis-Koch 0.61 ''substantial'' threshold, and SHACL enforcement of config/taxonomy_shacl.ttl which already exists; (5) a cleanlab Confident-Learning pass over the existing 7,995 rows to rank likely-mislabeled rows WITHOUT re-running the pipeline; (6) a truth-discovery
    / contradiction pass using the source columns already present; (7) a retrieval benchmark (RGB, DOI 10.1609/aaai.v38i16.29728) plus graph-aware retrieval, because the graph is built and currently unused. DOCUMENTED DEAD ENDS (REJECTED): cluster-derived labelling (the cluster is not a persistent object post-D2120/D2198, a convergent cluster is deliberately cross-discipline, and the label must remain a function of the content-addressed FB); a larger alias table; and any hosted-API solution (violates C1/C3).'
  files:
  - governance/MARKET_RESEARCH_ONTOLOGY_20260919.md
  - governance/ROUNDTABLE_MASTERPROMPT_ONTOLOGY_20260919.md

- id: D272g
  category: LABEL QUALITY / MEASUREMENT
  state: OPEN
  date: '2026-09-19'
  title: 'The ruler is NOT finished: the discipline floor is unresolved, not passed (D-272g)'
  source: governance/ruler_measurement_20260917.md
  verification: stop rule in config/eval_integrity.yaml::ruler_sheet.stop_rule
  description: 'Discipline measured 0.506 with a 95% Wilson interval of [0.401, 0.611] against a floor of 0.60 -- the floor lies INSIDE the interval, and 17 of 100 stratum-A rows were left unanswered. The configured stop rule needs |accuracy - floor| >= 0.10 and the observed margin is 0.094, so the verdict is CONTINUE: roughly 85 additional stratum-A rows are needed. This matters because the repair order depends on the answer -- if discipline is genuinely below its floor, the vocabulary repair (D272f step 4) becomes a blocker rather than an enhancement. ROLE is already decisive (failed, -0.010 lift) and FORM is already decisive (passed, 0.831). Also recorded: F-14''s FORM hypothesis is FALSIFIED -- within stratum A, FORM does not degrade in the untraceable pocket (0.860 untraceable vs 0.804 traceable) while ROLE does (0.667 vs 0.816), so the 3,348-row FORM re-derivation should be RE-TARGETED to ROLE on the pocket rather than executed as specified.'
  files:
