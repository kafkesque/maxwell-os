  - Thinking, Fast and Slow — Daniel Kahneman
  cluster_segments:
  - source_book: Decisive — Chip & Dan Heath
    text: 'The WRAP process counters the four villains of decision making: narrow framing (Widen your options), confirmation
      bias (Reality-test your assumptions), short-term emotion (Attain distance before deciding), and overconfidence (Prepare
      to be wrong). For each decision, run through WRAP: Widen options beyond binary choices, Reality-test by seeking disconfirming
      evidence, Attain distance by asking what you''d tell your successor, and Prepare by setting a tripwire that forces reconsideration.

      '
  - source_book: Thinking, Fast and Slow — Daniel Kahneman
    text: 'When making an important decision, the premortem procedure is the most effective debiasing technique. Before committing
      to a decision, gather the team and say: ''Imagine we are one year into the future. We implemented the decision as it
      stands today. The outcome was a disaster. Write the history of that disaster for five minutes.'' This procedure overrides
      optimistic overconfidence by forcing the brain to construct a narrative of failure — making latent risks concrete and
      actionable before they materialize.

      '
  is_convergent: true
  should_extract: true
  expected_fb:
    is_summary: false
    route: FB
    name: Prospective Hindsight Debiasing
    definition: Formally imagining that a planned decision has already failed — and narrating the causes of that failure —
      surfaces latent risks that optimistic planning overlooks. This 'premortem' technique exploits the brain's narrative-construction
      ability to override overconfidence and short-term emotion in high-stakes decisions.
    mechanism: The planning fallacy causes people to underestimate risks because they construct a best-case narrative and
      anchor on it. Prospective hindsight (premortem) forces the construction of a worst-case narrative, which activates the
      same narrative machinery but in the opposite direction. By making potential failures feel concrete and specific — rather
      than abstract and dismissible — it triggers loss-aversion circuits that motivate precaution-taking. The technique works
      BECAUSE it hijacks the same cognitive bias (narrative construction) that causes overoptimism.
    boundary: 'Applies to decisions with significant consequences and lead time for adjustment. Fails when: (1) the decision
      is trivial — premortem feels theatrical; (2) participants cannot genuinely entertain failure due to organizational pressure
      for optimism; (3) the premortem is performed pro forma without emotional engagement — it becomes a checkbox exercise.'
    consequence: Teams that run premortems identify 30% more potential risks than teams using standard risk-assessment methods.
      The specific, narrative quality of premortem-identified risks makes them more actionable — they come with built-in scenarios
      that suggest mitigation strategies.
    evidence_passages:
    - the premortem procedure is the most effective debiasing technique
    - Imagine we are one year into the future. We implemented the decision as it stands today. The outcome was a disaster.
    - Widen options beyond binary choices, Reality-test by seeking disconfirming evidence, Attain distance by asking what
      you'd tell your successor, and Prepare by setting a tripwire that forces reconsideration.
