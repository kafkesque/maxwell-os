# CONVERGENT EXAMPLE 7: Keynesian Beauty Contest — Economics/Finance (STEM)
# ──────────────────────────────────────────────────────────────────────────
- id: CONV-007
  domain: economics
  source_books:
    - "Algorithms to Live By — Brian Christian & Tom Griffiths"
    - "The Art of Strategy — Avinash Dixit & Barry Nalebuff"
    - "The Great Mental Models, Volume 4: Economics and Art — Shane Parrish"
  cluster_segments:
    - source_book: "The Art of Strategy — Avinash Dixit & Barry Nalebuff"
      text: |
        Keynes used the beauty contest as a metaphor for the stock market, where each investor
        wants to buy the stocks that will rise in price, which means the stocks that investors,
        in general, think will appreciate. The value of a stock is not what YOU think it's worth,
        but what you think OTHERS think it's worth — and what they think others think, in an
        infinite recursion of mutual expectation.
    - source_book: "Algorithms to Live By — Brian Christian & Tom Griffiths"
      text: |
        As Keynes put it, making a crucial distinction between beauty and popularity: professional
        investment may be likened to those newspaper competitions in which the competitors have
        to pick out the six prettiest faces from a hundred photographs, the prize being awarded
        to the competitor whose choice most nearly corresponds to the average preferences of the
        competitors as a whole. Each competitor has to pick, not those faces which he himself
        finds prettiest, but those which he thinks likeliest to catch the fancy of the other
        competitors. We have reached the third degree where we devote our intelligences to
        anticipating what average opinion expects the average opinion to be.
    - source_book: "The Great Mental Models, Volume 4: Economics and Art — Shane Parrish"
      text: |
        Economist John Maynard Keynes used the metaphor of a beauty contest to explain how stock
        prices are set. He asked readers to imagine a contest where entrants must choose six faces
        out of a hundred; those who pick the faces chosen by the most other people win. Keynes
        believed stocks are priced not according to their intrinsic value but according to
        investors' perceptions of other investors' perceptions — a recursive prediction problem
        where the fundamental value becomes almost irrelevant to short-term price movements.
  is_convergent: true
  should_extract: true
  expected_fb:
    is_summary: false
    route: "FB"
    name: "Keynesian Recursive Expectation"
    definition: |
      In markets where asset prices depend on collective belief rather than intrinsic value,
      successful prediction requires reasoning about what others believe others believe — a
      recursive chain of mutual expectation. The asset's fundamental value decouples from its
      market price with each recursion step, as each participant optimizes for the anticipated
      average opinion rather than underlying reality.
    mechanism: |
      Recursive expectation drives price formation through higher-order belief coordination.
      Level-1 investors value assets on fundamentals. Level-2 investors value based on predicted
      level-1 beliefs. Level-k investors value based on predicted level-(k-1) beliefs. The
      mechanism amplifies small errors: misperceptions about others' beliefs compound with each
      recursion level, producing price cascades where individually rational decisions generate
      collectively destabilizing speculation. The recursion has no natural termination — at
      sufficiently high k, the fundamental value becomes negligible relative to the recursive
      belief component.
    boundary: |
      Applies when future prices depend primarily on other investors' behavior rather than
      measurable cash flows. Fails when: (1) the asset has a contractually guaranteed terminal
      value (zero-coupon bond) — the recursion collapses to a known endpoint; (2) participants
      have identical information and reasoning — recursion converges to fundamentals; (3)
      transaction costs exceed speculative margin — the game is not worth playing; (4) a
      dominant player can unilaterally set the price — no need to predict others.
    consequence: |
      Markets governed by recursive expectations exhibit excess volatility relative to
      fundamentals, spontaneous coordination on arbitrary focal points (round-number prices),
      and vulnerability to self-fulfilling prophecies where collective belief in a price
      movement causes that movement. This explains why assets with zero cash flows
      (cryptocurrencies, collectibles, meme stocks) can sustain high valuations indefinitely
      as long as participants believe others will continue to believe.
    evidence_passages:
      - "Keynes used the beauty contest as a metaphor for the stock market, where each investor wants to buy the stocks that will rise in price, which means the stocks that investors, in general, think will appreciate"
      - "We have reached the third degree where we devote our intelligences to anticipating what average opinion expects the average opinion to be"
      - "stocks are priced not according to their intrinsic value but according to investors' perceptions of other investors' perceptions"
  rationale: |
    STEM domain expansion: economics/game theory, sourced from real cluster_90 in the S1.5
    bge-m3 run (3 books, cohesion=0.865). Three independent sources (Dixit/Nalebuff,
    Christian/Griffiths, Parrish) converging on Keynes' beauty contest mechanism. The
    mechanism explicitly traces recursion levels (1→2→k) and identifies the compounding-error
    dynamic that produces speculative instability — going beyond "prices reflect beliefs" to
    explain WHY recursive belief coordination creates excess volatility. The boundary
    distinguishes speculative from contractual assets as a testable condition. This expands
    golden set domain coverage from psychology/marketing into economics and game theory,
    demonstrating convergent extraction on academic/theoretical source material.

