  owner_approved: 2026-10-16 (owner word, the D-3035 sitting)
  title: THE HARNESS CONTEXT CONTRACT — the four layers between a local model's served window and the words an agent
    session can afford, measured and declared instead of inherited
  why: 'MEASURED 2026-10-14 (read-only, on this machine). The harness''s compaction trigger is min(GOOSE_AUTO_COMPACT_THRESHOLD
    x window, GOOSE_AUTO_COMPACT_TOKEN_LIMIT) and NEITHER variable is set, so the defaults govern: 0.8 x 32768 capped
    at 225000 = 26214 tokens for every local model the harness may run as an agent, while two models ALREADY SERVED here
    (gpt-oss-20b-MXFP4-Q8 at 131072, Qwen3.8-27B-MLX-4bit at 262144) qualify for the 131072+ class. The 225000 cap is
    a CLOUD PRICE-TIER artifact (goose docs: headroom below the long-context price tier) and is meaningless on hardware
    we own (C1/C22). Every compaction REWRITES the prompt, so the next turn pays a full COLD re-prefill of the rewritten
    history - which is the measured reason a local agent loop feels slow (prefill, not decode; a same-session A/B cited
    6.1 s cached vs 268 s uncached). The harness''s own usage_ledger already measures prefix reuse: 28,646 calls, 96%
    of cloud input tokens are cache reads, gemma-4-E4B locally reports 37.4% - and no local AGENT-LOOP call carries cache
    evidence at all - SUPERSEDED 2026-10-14 by the A/B, which found that the local server reuses NO prefix at all (BUG-792):
    the ledger''s local ratio is historical, not a live capability, and the binding constraint is the PREFILL BILL, added
    to the contract as a fifth layer the same day. Two of the four layers are also DRIFTED: six models are declared-and-not-served
    or served-and-not-declared (measured by the new probe; BUG-790''s sweep). A reader wired to the wrong window is silent
    in both directions, which is why parity must be DECLARED, not coincidental.'
