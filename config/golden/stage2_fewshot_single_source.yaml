# ── POSITIVE: tool_instruction (algorithm — the BUG-147 trap case) ─────────
- id: SS-POS-004
  domain: computer-science
  source_books:
  - Grokking Algorithms — Aditya Bhargava
  cluster_segments:
  - source_book: Grokking Algorithms — Aditya Bhargava
    text: "Depth-first search visits a graph by pushing the start node onto a stack, then repeatedly popping a node, marking it visited, and pushing each unvisited neighbor back onto the stack until the stack is empty."
  is_convergent: false
  should_extract: true
  expected_fb:
    is_summary: false
    route: FB
    name: Depth-First Search Traversal
    definition: "An algorithm that traverses a graph by pushing the start node onto a stack, then repeatedly popping a node, marking it visited, and pushing each unvisited neighbor until the stack empties."
    mechanism: "The stack enforces last-in-first-out ordering, so the traversal goes as deep as possible down one branch before backtracking to explore siblings."
    boundary: "Applies to connected graph traversal where depth-first order is acceptable. Fails when breadth-first or weighted shortest-path order is required."
    consequence: "Depth-first search visits every reachable node without tracking a visited set producing infinite loops, and terminates when the stack is empty."
    elaboration: ""
    extraction_type: normative_heuristic
    content_type: tool_instruction
    tool_name: "Depth-First Search"
    platform: "algorithm (language-agnostic)"
    description: "Traverse a graph depth-first using an explicit stack, marking visited nodes so each is visited once"
    syntax: "push(start); while stack not empty: pop node, mark visited, push unvisited neighbors"
    parameters:
    - name: graph
      type: Graph
      description: "The graph to traverse"
    - name: start
      type: Node
      description: "The starting node"
    output: "A visitation order covering all reachable nodes"
    example: "dfs(graph, start) visits each reachable node exactly once"
    caveats: "Requires a visited set to avoid infinite loops on cyclic graphs"
    evidence_passages:
    - "Depth-first search visits a graph by pushing the start node onto a stack, then repeatedly popping a node, marking it visited, and pushing each unvisited neighbor."
  rationale: "An algorithm/code description. content_type=tool_instruction, NOT process_template — it is a computational procedure, not a repeatable human how-to (BUG-147 contrastive)."
  tier: CORE

