pipeline_root: null
run:
  default_id: latest
pipeline_manifest:
  schema_version: '3.0'
  taxonomy_version: v5.1
  pipeline_commit: v3.0-D2367
  models:
    generator: Qwen3-Coder-30B-A3B-Instruct-MLX-4bit
    classifier: gpt-oss-20b-MXFP4-Q8
    embeddings: bge-m3
    nli: MoritzLaurer/DeBERTa-v3-large-mnli-fever-anli-ling-wanli
  prompt_versions:
    s2_convergent_extract: v7.0
    s4_cribs_classify: v2.0
    s5_factual_check: v3.0
stages:
  stage0_convert: knowledge pipeline/stage0_convert
  stage1_chunk: knowledge pipeline/stage1_chunk
  stage1_3_prefilter: knowledge pipeline/stage1_3_prefilter
  stage1_5_embed: knowledge pipeline/stage1_5_embed_cluster
  stage2_extract: knowledge pipeline/stage2_extract
  stage4_merge: knowledge pipeline/stage4_merge
  stage5_verify: knowledge pipeline/stage5_verify
  stage6_commit: knowledge pipeline/stage6_commit
  timeouts:
    '0': 3600
    '0.5': 3600
    '1': 3600
    '1.3': 3600
    '1.5': 3600
    '2': null
    '4': 3600
    '5': 3600
    '6': 3600
stage_files:
  stage0: null
  stage1: chunks.jsonl
  stage2: principles.jsonl
  stage4: fbs.jsonl
  stage5: verified.jsonl
  stage5_human_review: human_review/
  stage6_db: maxwell.db
  stage6_parquet: snapshot.parquet
  checkpoint: checkpoint.jsonl
  log: pipeline.log
  meta: run_meta.yaml
paths:
  checkpoint_dir: knowledge pipeline/checkpoints
  db_path: knowledge pipeline/maxwell.db
  parquet_dir: knowledge pipeline/parquet
  data_dir: knowledge pipeline
books_dir: knowledge pipeline/books
global_log: knowledge pipeline/pipeline.log
archive_dir: knowledge pipeline/archive
services:
  ollama:
    host: localhost
    port: 11434
    nomic_max_chars: 4000
    embed_max_chars: 4000
    batch_size: 100
    embed_timeout: 180        # D2348: 60s too short under 4-worker concurrent load → read timeouts (3% drop, BUG-105)
    embed_keep_alive: -1      # D2348: pin bge-m3 in VRAM (keep_alive thrash → cold reload stalls, BUG-105)
  omlx:
    host: localhost
    port: 11435
    api_key: sk-maxwell-local
    min_version: 0.4.0
    bin: null
    default_timeout: 300
    max_retries: 2
    retry_delay: 3
    cold_reload_delay: 45  # D2301: wait for reasoning-model cold reload (GPT-OSS evict/reload ~30-60s)
    circuit_breaker_enabled: true
    circuit_breaker_failure_threshold: 5
    circuit_breaker_cooldown_seconds: 60
models:
  generator:
    model: Qwen3-Coder-30B-A3B-Instruct-MLX-4bit
    provider: omlx
    temperature: 0.0
    max_tokens: 1024
  verifier:  # D2340: MISNAMED — this is actually the S4 classifier (D2249), consumed as VERIFY_MODEL in stage4_merge.py
    model: gpt-oss-20b-MXFP4-Q8
    provider: omlx
    temperature: 0.0
    reasoning_off_prefix: 'Reasoning: low'   # D2359: valid Harmony level ('none' is ignored); caps CoT
    reasoning_off_models:
    - gpt-oss-20b-MXFP4-Q8
    max_tokens: 1024
    chat_template_kwargs: {enable_thinking: false}   # D2359: oMLX-native CoT cap (top-level flags silently dropped)
    thinking_budget: null   # D2367/BUG-132: merged CRIBS call CoT cap (X8 candidate 256/128; gated on accuracy)
    depth_thinking_budget: null   # D2367/BUG-132: focused depth call CoT cap (independent of merged; D2359 verified 128 -> 72%/7.3s)
  verifier_v2:  # D2340: MISNAMED — this is actually the S2 fast probe (D2319), consumed as VERIFY_MODEL_V2 in stage2_extract.py
    model: Phi-4-mini-instruct-8bit
    provider: omlx
    temperature: 0.0
    notes: 'D2319: S2 fast probe (~1.5s). D2298 removed Phi from S5 *verification* only; S5 = DeBERTa-only (models.nli_large).'
  embeddings:
    model: bge-m3
    provider: ollama
    alternative: mlx-community/Qwen3-Embedding-0.6B-4bit-DWQ
  nli_large: MoritzLaurer/DeBERTa-v3-large-mnli-fever-anli-ling-wanli
  # nli_cross: REMOVED (D2298) — RoBERTa-large added zero signal on paraphrase evidence (D2227).
pipeline:
  schema_version: '3.0'
  commit: v3.0-D2367
  taxonomy_version: v5.1
  max_domains_per_fb: 5
  chunk_size_words: 300
  chunk_overlap_words: 50
  min_chunk_words: 10
  enhance_min_header_gap_chars: 3000
  borp_min_sources: 2
  intent_top_k_ratio: 0.3
  intent_threshold: 0.35
  smoke_book_limit: 3
smoke:
  plumbing:
    skip_llm: true
    fast_model: null
    timeout_per_stage: 10
  fast:
    skip_llm: false
    fast_model: Phi-4-mini-instruct-8bit
    skip_gemma_deep_check: true
    max_books: 3
stage1_5:
  faiss_threshold: 0.75
  min_cluster_size: 2
  max_cluster_size: 500
  min_source_diversity: 2
  neighbor_k: 50
  embed_model: bge-m3
  embed_dim: 512
  embed_backend: ollama
  embed_model_hf: BAAI/bge-m3
  embed_chunk_size: 20000
  embed_batch_size: 64
  max_embed_drop_rate: 0.005
stage0:
  max_failed_ratio: 0.0          # D2326: fail-closed — if failed/total > this ratio, exit non-zero (0.0 = any failure is fatal). Operator may raise to approve known-bad exclusions.
stage1_3:
  min_len: 40
  cite_density: 0.6
  enabled: true
  drop_patterns_extra:
  - author and publisher have provided this e-book
  - personal use only
  - z-library
  - libgen
  - do not redistribute
  - no part of this text may be reproduced
  - ebooks, downloads
  - unauthorized use of this book
stage2:
  batch_size: 10
  minhash_threshold: 0.9
  minhash_num_perm: 128
  golden_path: config/golden/stage2_fewshot_convergent.yaml
  golden_positive: 1
  golden_negative: 1
  golden_max_examples: 4
  golden_inject_enabled: true
  golden_seed: 42
  split_probe_enabled: true
  split_probe_min_size: 20
  split_probe_max_cohesion: 0.85
  gate_enabled: true
  gate_strict: true
  evidence_tracking: true
  high_cohesion_threshold: 0.9
  med_cohesion_threshold: 0.75
  source_book_match: exact
  max_cluster_samples: 5
  max_probe_samples: 8
  max_probe_per_book: 2      # D2357: per-book probe sample cap (was literal MAX_PER_BOOK=2)
  split_probe_kmeans_random_state: 42
  omlx_retry_attempts: 2
  batch_position_monitor: false
  max_workers: 3
  route_values: ["FB", "NULL"]   # D2323/C12: S2 route gate — FB=forward to S4, NULL=skip cluster (quoted: YAML parses bare NULL as None)
  max_failed_ratio: 0.0   # D2331: fail-closed cluster extraction — if failed_clusters/total > this ratio, exit non-zero (0.0 = any failure fatal). Operator may raise to approve known-bad skips.
stage4:
  process_template_output: process_templates.jsonl
  process_instance_output: process_instances.jsonl
  growth_edge_output: growth_edges.jsonl
  tool_instruction_output: tool_instructions.jsonl
  max_principles_per_cluster: 25
  dedup_cosine_threshold: 0.92
  semantic_near_threshold: 0.8
  merged_call_enabled: true
  merged_call_max_tokens: 2048   # GPT-OSS reasoning+JSON: 1024 truncated sparse (discipline/domains) → quarantine
  batch_enabled: false            # D2265 batch CRIBS unreliable w/ GPT-OSS (45% malformed + hang) — fall back to individual
  batch_size: 4
  batch_call_max_tokens: 2048
  depth_focused_classification: true
  depth_max_tokens: 1024   # D2351/BUG-109: GPT-OSS is a reasoning model — 512 truncates reasoning_content → empty content → silent "domain"
  depth_batch_size: 4      # D2354: batch the focused depth prompt (removes the ~10s/FB serialized call)
  # D2354 FrugalGPT cascade: GPT-OSS keeps the hard CRIBS/classification work;
  # a cheap third-family model does ONLY the 4-way depth classification.
  # GATED — default off until tools/benchmark_s4_depth_frugal.py shows ≥90%
  # agreement with GPT-OSS focused-depth AND ≥90% held-out accuracy.
  depth_frugal_enabled: false
  depth_model: gemma-4-E4B-it-MLX-4bit   # fast, non-reasoning (no CoT burn)
  depth_fallback_depth: domain
  # D2364/C12 (X7): signal sets extracted from hardcoded Python literals (cross-LLM audit).
  # context_signals: applied-domain → context routing hint (v1 Anytype "context" property).
  # temporal_signals: keyword heuristics for temporal_scope (timeless / contemporary).
  # universal_signals: name/mechanism substrings that flag a likely-universal depth.
  context_signals:
    business:
    - business operations
    - business development
    - entrepreneurship
    - organizational behavior
    - marketing
    design:
    - graphic design
    - brand identity
    - editorial & advertising
    - motion design
    - environmental design
    - digital product
    - illustration
    - packaging
    - web & ui
    - user experience
    - creative technology
    - data visualization
    system:
    - systems & frameworks
    - code & computation
    - engineering practice
    - ai & agents
    - ai systems
    - computational science & physics
    - software engineering
    academic:
    - research & methodology
    - semiotics & communication
    - computational art
    - philosophy
  temporal_signals:
    timeless:
    - always
    - universal
    - fundamental
    - any system
    - all
    contemporary:
    - '202'
    - current
    - modern
    - recent
    - today
    - now
  universal_signals:
  - entropy
  - thermodynamic
  - evolution
  - natural selection
  - system 1
  - system 2
  - cognitive bias
  - feedback loop
  - power law
  - exponential
  - equilibrium
  - conservation
  - symmetry
  - optimization
  - gradient
  max_failed_ratio: 0.0   # D2338: fail-closed merge — if (failed + classification_errors)/total > this ratio, exit non-zero (0.0 = any failure fatal)
s2:
  dspy_max_labeled_demos: 3
  dspy_max_bootstrapped_demos: 3
  dspy_max_tokens: 4096  # D2304/C12: ConvergentExtraction needs 4K for 11 output fields (was hardcoded in dspy_trainer.py)
  dspy_program_path: data/dspy_mipro_optimized.json  # D2304: C12 config-driven (was hardcoded /tmp)
  gate:
    enabled: false
    model: Qwen3-Coder-30B-A3B-Instruct-MLX-4bit
    max_tokens: 64
    temperature: 0.0
    system_prompt: You are a principle discovery gate. Answer ONLY with 'FB' or 'NULL'. No explanation.
    user_prompt_template: 'Examine these text segments from {n_sources} different books.


      {segments}


      Does this cluster contain a discoverable convergent principle —

      a named, reusable mechanism with a clear ''how it works'' and ''when it fails''?

      Answer ONLY: FB (yes, extractable principle) or NULL (no extractable principle).

      '
stage5:
  borp_bypass_types:
  - process_template
  - process_instance
  - growth_edge
  - tool_instruction
  factscore_enabled: false
  nli_model: MoritzLaurer/DeBERTa-v3-large-mnli-fever-anli-ling-wanli
  # nli_model_fallback: REMOVED (D2298) — ModernBERT fallback deleted with RoBERTa.
  nli_entailment_threshold: 0.1
  nli_pass_threshold: 0.1
  nli_marginal_threshold: 0.1
  nli_max_premise_chars: 256
  nli_max_hypothesis_chars: 256
  confidence:
    mechanism_weight: 0.35
    enrichment_weight: 0.25
    isor_weight: 0.40
    quarantine_cap: 0.25
    human_review_isor_rating: strong
stage6:
  commit_non_fb_types: false
  okf_export_enabled: true
  max_failed_ratio: 0.0   # D2338: fail-closed commit — if failed_inserts/total > this ratio, exit non-zero (0.0 = any failed insert fatal)
coverage:
  threshold: 0.5
  flag_fraction: 0.3
retrieval_eval:
  model: Phi-4-mini-instruct-8bit
  provider: omlx
  max_tokens: 1024
  confidence_threshold: 0.85
  max_iterations: 3
  max_fbs_to_evaluate: 15
  fb_definition_max_chars: 300
  fb_name_max_chars: 200
reliability:
  stable_threshold: 0.85
  watch_threshold: 0.5
  garbage_threshold: 0.2
taxonomy:
  flood_threshold_ratio: 0.2
  replacement_threshold_ratio: 1.1
  emerging_freq_threshold: 10
e2e:
  borp_min_sources: 2
  min_pass_rate: 0.8
  min_fbs: 30
  convergent_ratio: 0.20  # D2336: 0.25 was a pre-data default; first 20-book run = 24.5% (SE≈3.4%)

  diagnostic:
    yield_pct_pass: 1.0
    yield_pct_fail: 0.5
    s5_pass_rate_pass: 0.4
    s5_pass_rate_fail: 0.2
    quick_clusters: 50
    default_books: 100
