  source: depth vote controlled split
  label_source: silver_depth
  n_examples: 796
examples:
- id: 623ce74b61ecaaeccd774b3921cab997f7eab9cba94aefb24825be0979af3488
  input_fb:
    name: Obama Hope Movement's Dual Advocacy
    definition: A social movement that simultaneously addressed environmental policy
      through transnational organizations like Greenpeace while also tackling economic
      and political concerns related to wealth inequality and financial crisis aftermath.
    mechanism: The movement operated across multiple domains of social concern, leveraging
      transnational environmental organizing for policy influence while also mobilizing
      around economic justice issues following the 2007 financial crisis.
    boundary: Applies to social movements that span multiple issue areas rather than
      focusing on single policy domains. Fails when movements are narrowly focused
      on one type of concern.
  expected_classification:
    depth: cross-domain
- id: 8472ffcc73196cb9849f3734d1d975f68416f60ea84c3b2dc3267e1949e8b7f1
  input_fb:
    name: Sign-based Interpretation Loop
    definition: Interpretation occurs through a continuous loop where signs (words,
      images, commands) are understood as representations of underlying meanings,
      which in turn generate new signs that reference the original. This creates a
      recursive process of meaning-making that connects formal structure to social
      context.
    mechanism: Signs function as both carriers of meaning and triggers for new signs
      in response to interpretation. When a sign is encountered, it generates an interpretant
      (a new sign) that reflects the interpreter's understanding. This interpretant
      then becomes the basis for further signs or actions, creating a feedback loop.
      The process is not linear but cyclical, with each layer of interpretation influencing
      the next. The loop is maintained by the interplay between formal constraints
      (such as law or grammar) and personal or social context.
    boundary: Applies when signs are interpreted in a recursive, context-dependent
      manner rather than as isolated symbols. Fails when signs are understood purely
      as static representations or when interpretation is not influenced by prior
      understanding or social context.
  expected_classification:
    depth: cross-domain
- id: c90edfd914cd6a2b7cccb395415e3f073f61f207f2d4405e99121b6fde00d9e2
  input_fb:
    name: Sacred Geometry and Symbolic Resonance
    definition: Sacred geometries and symbols function as universal archetypes that
      resonate across cultures and epochs, encoding shared human experiences of cosmology,
      spirituality, and cosmic order. These forms manifest in both natural and constructed
      elements as expressions of fundamental truths about existence and the divine.
    mechanism: This is a descriptive model of symbolic organization, not a causal
      mechanism. Sacred geometries and symbols form a cross-cultural taxonomy of spiritual
      and cosmological concepts that appear consistently across human societies. The
      model categorizes recurring patterns in sacred architecture, mythologies, and
      natural phenomena as expressions of a shared symbolic language rooted in universal
      human experience and perception.
    boundary: Applies to cultural and religious systems where symbols and geometries
      are imbued with spiritual or cosmological meaning. Fails for purely functional
      or aesthetic design elements that lack symbolic resonance or spiritual significance.
  expected_classification:
    depth: cross-domain
- id: 22dd2fe735aaabc8dff6ab23a9430a609d6ad5217d7cd4876568687d8ffb768f
  input_fb:
    name: Axiomatic Method
    definition: A logical and necessary approach to developing the science of General
      Systemantics that starts with enunciating axioms and then showing their universal
      application.
    mechanism: The method begins with stating fundamental axioms that are logically
      necessary and then demonstrates their universal applicability, avoiding the
      limitations of observation or experimentation that distort systems.
    boundary: Applies to the development of systematics science where logical foundations
      are preferred over empirical approaches. Fails when systems are too complex
      or chaotic to be captured by axiomatic principles.
  expected_classification:
    depth: universal
- id: 8e8f303cfdccaca4fafae00cb4587f6e73427d841f2d291ca784dc4f606f2952
  input_fb:
    name: Xenakis's Projective Geometry in Led Installation
    definition: An installation that applies Xenakis's interest in projective geometry
      and ruled surfaces to design LED lighting systems with real-time individual
      control of multiple LEDs through pulse-width modulation.
    mechanism: The system uses projective geometry principles to structure the spatial
      arrangement of LEDs along cables, with each LED individually controllable via
      pulse-width modulation to create algorithmically orchestrated lighting patterns.
    boundary: Applies to installations where Xenakis's geometric principles are used
      to design LED systems with individual LED control. Fails when the geometric
      principles are not applied or when LEDs cannot be individually controlled.
  expected_classification:
    depth: cross-domain
- id: 003cb59a7e99ff8a03ca506fcffc5e155f806aef203f0077f5a3a75117346708
  input_fb:
    name: Cultural and Linguistic Context in Evaluating Lies
    definition: A principle for evaluating lies that considers cultural context, language
      nuance, and moral culpability rather than simple factual falsehoods, with examples
      showing how different types of lies are ranked by cultural and linguistic understanding.
    mechanism: People evaluate lies based on cultural context, language nuance, and
      moral culpability rather than just factual falsehoods, with the ranking of lies
      influenced by the 'weights' of intention, knowledge, and action, and these evaluations
      are shaped by cultural ideologies and stereotypes.
    boundary: Applies to the evaluation of lies in cultural contexts where language
      and cultural understanding influence moral judgments. Fails when lies are evaluated
      purely on factual falsehood without considering cultural or linguistic context.
  expected_classification:
    depth: domain
- id: 6bedf97def96b2ecd724e64963c60ff3325bbc5d4a5372aa9b22ffee2840bd94
  input_fb:
    name: Cross-modal Expression Idiom
    definition: "Visual and auditory artistic media share common conceptual vocabularies\
      \ for describing perceptual and emotional experiences. These shared terms\u2014\
      such as rhythm, texture, tone, color, and resonance\u2014map onto analogous\
      \ sensory dimensions across different artistic modalities."
    mechanism: "This is an empirical pattern describing how artistic expression across\
      \ modalities (visual vs. auditory) uses overlapping semantic frameworks. The\
      \ shared vocabulary reflects common cognitive mappings between sensory experiences\u2014\
      such as associating 'rhythm' with both musical beats and visual movement, or\
      \ 'color' with both visual hues and emotional tone. The pattern is observed\
      \ in how designers and musicians describe their work using cross-modal metaphors."
    boundary: Applies when artistic media use shared conceptual frameworks for describing
      sensory experience. Fails when artistic domains use entirely distinct vocabularies
      or when the media are purely functional (e.g., technical manuals, architectural
      plans) rather than expressive.
  expected_classification:
    depth: cross-domain
- id: 52d20d1d767edc97a063b53a33449bd3fde6542a250b65b45984178f7fbcaf34
  input_fb:
    name: Category Equivalence in Cross-national Research
    definition: The degree to which the same classification scheme can be applied
      to a phenomenon across different nations, capturing how conceptual categories
      maintain consistent meaning despite contextual variations.
    mechanism: Cross-national research requires mapping the same conceptual categories
      (such as market orientation stakeholder groups) to different operational definitions
      (customers in one nation, government institutions in another) to maintain analytical
      consistency.
    boundary: Applies when conducting comparative research across nations where conceptual
      categories need to be mapped to different operational definitions. Fails when
      the same category cannot be meaningfully applied across contexts.
  expected_classification:
    depth: cross-domain
- id: 35756640ce781e581ca1dbeecf61c7db03a982f3fe575f88f71326378b2075b8
  input_fb:
    name: Metaphor-driven Conceptual Expansion
    definition: Using metaphors and analogies as cognitive tools to break free from
      existing mental models and constraints, enabling the generation of novel problem-solving
      approaches that transcend current framing. The principle describes a design
      thinking technique that leverages conceptual mapping to expand creative possibilities.
    mechanism: Metaphors and analogies function as mental tools that reframe problems
      by mapping familiar concepts onto unfamiliar domains. This process disrupts
      default thinking patterns and constraints that typically limit solution space.
      The technique works by activating associative networks in the brain, creating
      new connections between seemingly unrelated domains. Unlike explicit problem-solving
      methods, metaphorical thinking operates below conscious awareness, allowing
      for intuitive leaps that bypass logical reasoning barriers.
    boundary: Applies when designers face constrained mental models or rigid problem
      definitions that limit creative exploration. Fails when the metaphor is too
      distant from the target domain, creating confusion rather than clarity, or when
      the metaphor is so familiar that it reinforces existing assumptions rather than
      challenging them.
  expected_classification:
    depth: cross-domain
- id: db2032d58c0b2f937eabb48457b7a2950fa76a3b897ea97ee70811ba51470f89
  input_fb:
    name: Perceptual Aspects of Spatial Depth in Art
    definition: Artistic exploration of spatial depth perception through experimental
      installations and visual techniques that challenge conventional viewing experiences.
    mechanism: Artists like Gianni Colombo and Alfons Schilling use physical installations
      and optical experiments to demonstrate how perception can be manipulated through
      spatial arrangement, lighting, and mechanical alteration of visual elements.
    boundary: Applies to experimental art installations that deliberately alter perception
      through physical and optical manipulation. Fails when the artistic approach
      does not involve systematic exploration of perceptual mechanisms.
  expected_classification:
    depth: cross-domain
- id: d8af85a4af579b7aea31bdcc47a6e68f483f3224198a33f598f6e82d3db64fa9
  input_fb:
    name: Cerebrum Experience Integration
    definition: A conceptual framework describing how Cerebrum creates a unique experiential
      space that integrates elements of nightclubs and art galleries while maintaining
      its own distinct identity.
    mechanism: Cerebrum functions as a hybrid space where participants simultaneously
      experience multiple roles (voyeur, exhibitionist, participant) and exist in
      a fluid gendered state, creating a 'walking sensorium' that connects disparate
      social experiences.
    boundary: Applies specifically to the conceptual design and experiential framework
      of Cerebrum as a unique cultural space. Does not apply to general nightclub
      or gallery functions.
  expected_classification:
    depth: cross-domain
- id: 0312b93a38808b61bb97f361e03f1109a70e13bf4dcca41c1e0051490a324b85
  input_fb:
    name: Plastic Tactics Framework
    definition: A flexible approach to business strategy that emphasizes adaptability
      and responsiveness to unexpected market conditions, inspired by the concept
      of plasticity in biological systems.
    mechanism: The framework recognizes that business plans rarely go smoothly due
      to unpredictable market reactions, so practitioners must be able to change their
      plans and tactics in response to new information and unexpected challenges,
      similar to how biological systems adapt to changing environments.
    boundary: Applies to business strategy and planning in unpredictable market conditions.
      Fails when applied to highly stable or predictable business environments where
      rigid planning is more appropriate.
  expected_classification:
    depth: cross-domain
- id: 15700e3753c8a335efc56f0932988a036faca0ed3dcbc3e758606289dbe16a8d
  input_fb:
    name: Token System Evolution and Failure
    definition: A historical and conceptual pattern showing how systems designed to
      solve one problem often evolve into new problems that are intrinsic to their
      own structure, creating unintended consequences and systemic failures.
    mechanism: Token systems, originally created to solve the problems of barter systems,
      develop their own internal logic that creates new problems, leading to system
      expansion and eventual failure as the system becomes self-defeating.
    boundary: Applies to systems that evolve from solving one problem to creating
      new problems of their own design. Fails when the intrinsic problems of the new
      system are not recognized or when solutions are applied superficially without
      addressing root causes.
  expected_classification:
    depth: cross-domain
- id: 4b1f8ece56957952be997de48e30454fb7058d3f90250feec14aa4f15bd0e338
  input_fb:
    name: Systemic Entrenchment Resistance
    definition: Once a system is established and operational, it becomes increasingly
      difficult to modify or dismantle due to accumulated investments, psychological
      attachment, and structural interdependencies. The principle describes how systems
      resist change even when their operation is suboptimal or counterproductive.
    mechanism: 'This is a descriptive model of system behavior, not a causal mechanism.
      Systems develop inertia through resource commitment, organizational habits,
      and psychological investment. Once operational, systems generate feedback loops
      that reinforce their current state, making modification or dismantling appear
      more costly or complex than initial setup. The entrenchment occurs at multiple
      levels: financial (high insurance rates preventing action), emotional (anxiety
      and belief in the system''s value), and structural (complexity of dismantling
      exceeding original effort).'
    boundary: Applies when systems have achieved operational status and incurred substantial
      investment or emotional commitment. Fails when systems are in early development
      stages or when the cost of maintaining the system exceeds the cost of dismantling
      and rebuilding.
  expected_classification:
    depth: cross-domain
- id: 7db1f4f4d042606b4bf9add4d1b503859f8ebb9012ef338dc64779d539e64be4
  input_fb:
    name: Physiological Feedback in Therapeutic Contexts
    definition: Therapeutic interventions can be informed by real-time physiological
      monitoring to understand emotional and psychological states during treatment.
      This approach allows for direct observation of how mental processes manifest
      in bodily responses.
    mechanism: Physiological signals such as brain activity, heart rate, and blood
      pressure provide measurable indicators of emotional and psychological states
      during therapeutic sessions. These signals can be monitored using neuroimaging
      and other biometric tools to correlate with subjective experiences and therapeutic
      outcomes. The feedback loop enables therapists to adjust their approach based
      on real-time data about the patient's neurobiological response.
    boundary: Applies when therapeutic interventions incorporate real-time physiological
      monitoring to inform treatment decisions. Fails when physiological data is unavailable
      or when the therapeutic relationship is not influenced by observable bodily
      responses.
  expected_classification:
    depth: cross-domain
- id: be114008761c3db3e799f9f619110ed3c08f47530d105a35725baa08b0dd7e37
  input_fb:
    name: Economic Growth As Climate Change Driver
    definition: Economic growth, driven by reinforcing processes of income, demand,
      and capital investment, generates greenhouse gas emissions as a physical by-product
      that significantly impacts global climate systems. This relationship creates
      a feedback loop where economic expansion and environmental degradation are intrinsically
      linked.
    mechanism: Economic systems inherently produce greenhouse gas emissions as a side
      effect of their growth mechanisms. The reinforcing processes of income generation,
      demand creation, and capital investment directly correlate with increased carbon
      dioxide emissions from industrial activity, energy consumption, and resource
      extraction. These emissions accumulate in the atmosphere and contribute to climate
      change, creating a systemic feedback between economic activity and environmental
      impact.
    boundary: Applies when economic systems operate under reinforcing feedback loops
      that prioritize growth over environmental constraints. Fails when economic systems
      are decoupled from fossil fuel dependence or when emissions are actively reduced
      through policy or technology.
  expected_classification:
    depth: cross-domain
- id: 6d771eb76a77f7a51ae8a53296933ab7ec409c569d58ad24941ab49dc823b055
  input_fb:
    name: Systemic Stability Through Buffers
    definition: Systemic stability is maintained through buffers that act as stabilizing
      elements within a system's structure. These buffers are not merely passive elements
      but active components that absorb shocks and maintain system equilibrium under
      varying conditions.
    mechanism: Buffers function as stabilizing stocks that resist change in system
      behavior by providing resistance to perturbations. They act as storage mechanisms
      that can absorb or release resources, thereby dampening fluctuations in system
      dynamics. The effectiveness of buffers depends on their size, placement, and
      ability to respond to system stresses without collapsing or becoming overwhelmed.
    boundary: Applies when system components have the capacity to store or absorb
      variation in inputs or outputs. Fails when buffers are too small to handle perturbations,
      when they are poorly positioned in the system structure, or when system dynamics
      exceed the buffer's capacity to stabilize.
  expected_classification:
    depth: cross-domain
- id: 20811c7f1505fe5a89a0d17224779c84e765e627089d28e346f2b237cb72f2ba
  input_fb:
    name: Designerly Economics
    definition: Economic practices can be understood and shaped through design methodologies
      that emphasize experimentation, iteration, and reflective engagement with alternative
      economic systems. This approach treats economic processes as design problems
      to be explored rather than static structures to be optimized.
    mechanism: This is a descriptive model of how design thinking can be applied to
      economic systems. The model categorizes economic practices as design problems
      that can be approached through methods like improvisation, replication, and
      iteration. It organizes economic inquiry into a framework where design methods
      become tools for understanding and reshaping economic structures, particularly
      through practice-based research that reflects on how economic systems are constituted
      through everyday actions.
    boundary: Applies when economic systems are understood as malleable through design
      methods and when practitioners engage in reflective, iterative approaches to
      economic problems. Fails when economic systems are viewed as purely mathematical
      or institutional structures that resist design intervention, or when design
      methods are applied without consideration of the social and political dimensions
      of economic practices.
  expected_classification:
    depth: cross-domain
- id: 7f00cc637a11ed7421a8ba8f00edc0420e66bae7a9dc267aaffccdba13603906
  input_fb:
    name: Bit-level Representation Precision
    definition: Digital systems represent information using binary sequences, where
      the length of the binary word determines the precision and range of values that
      can be encoded. Longer binary sequences provide more discrete states and finer
      granularity for representing continuous phenomena.
    mechanism: The number of possible states in a binary system grows exponentially
      with the number of bits. Each additional bit doubles the number of distinguishable
      states, enabling more precise encoding of analog or discrete values. This is
      a fundamental property of digital representation where bit width directly maps
      to information capacity and resolution.
    boundary: Applies to any digital system using binary encoding where information
      is represented as sequences of bits. Fails when dealing with analog systems
      or non-binary discrete systems where the relationship between representation
      length and precision does not follow exponential growth.
  expected_classification:
    depth: universal
- id: 60b8d589d27cd9a9980a34d4ba47e25ff6f19e334ba4bcaccffa82858ed48b9d
  input_fb:
    name: Co-adaptation in Human-machine Interaction
    definition: A dynamic relationship where human users and machine learning agents
      mutually adapt to each other's presence and behavior, creating a coupling where
      both become 'ready-to-each-other's-hand'.
    mechanism: The interaction involves continuous mutual adaptation where humans
      adjust their behavior and expectations while machine agents adjust their responses
      based on human input, creating a feedback loop of co-evolution.
    boundary: Applies to interactive scenarios where humans and machine learning systems
      engage in direct, ongoing interaction rather than passive observation. Fails
      when the human remains a mere observer without active participation.
  expected_classification:
    depth: cross-domain
- id: 03cd184f1d2523a263709d9c042205f1f95cbbc5bb4615a33b3a10964ad41efb
  input_fb:
    name: Data Binning and Categorical Data Management
    definition: A set of techniques for handling continuous and categorical data by
      grouping values into ordered categories and reducing data complexity through
      aggregation.
    mechanism: Continuous measures are broken into ordered groups (binning) to create
      ordinal categories, while categorical data is reduced in cardinality through
      combining smaller categories into 'other' categories or identifying hierarchical
      structures in the data.
    boundary: Applies to data analysis and visualization workflows where continuous
      variables need to be categorized or categorical data needs to be simplified
      for analysis. Fails when the binning process loses important information or
      when hierarchical structures are not properly identified.
  expected_classification:
    depth: domain
- id: 8e79ce03deed25b5d2d5b16ff6e13bc7585760fa06b11699acadfa2bf8e77076
  input_fb:
    name: Scale-driven Technological Evolution
    definition: Technological systems evolve through scaling operations that amplify
      and accelerate their dynamic properties, creating emergent behaviors that transcend
      their original design intentions. This evolution occurs when systems operate
      at sufficient scale to generate feedback loops and adaptation mechanisms similar
      to natural evolutionary processes.
    mechanism: At large scales, technological systems develop self-organizing properties
      through continuous interaction with users and environment. The scale enables
      emergent behaviors that were not explicitly designed, creating adaptation-like
      dynamics where systems evolve beyond their initial parameters. This process
      mirrors natural evolution in that it generates complexity and novelty through
      iterative feedback rather than top-down design.
    boundary: Applies when systems operate at scale sufficient to generate feedback
      loops and emergent behaviors. Fails when systems remain small or isolated, where
      explicit design control dominates over emergent properties. Also fails for systems
      where user interaction is minimal or standardized, preventing the development
      of adaptive behaviors.
  expected_classification:
    depth: cross-domain
- id: 3ea6925f40654ab1387f47bbf53c695ae1e70786efc5c119e7e90cd7b5682153
  input_fb:
    name: Visual Explanation Consolidation
    definition: Visual explanations consolidate complex information from multiple
      knowledge bases into simplified, accessible formats that bridge the gap between
      expert knowledge and layperson understanding. This principle describes a design
      strategy where visual media aggregates and reorganizes information to make it
      more digestible.
    mechanism: This is a descriptive model of how visual media functions as a knowledge
      integration tool. Visual explanations work by taking disparate sources of information
      and structuring them into a coherent narrative or visual flow that reduces cognitive
      load for non-experts. The process involves identifying key concepts, mapping
      relationships between ideas, and presenting them in a way that aligns with human
      perception and comprehension patterns.
    boundary: Applies when complex phenomena require simplification for broad audiences.
      Fails when the subject matter is inherently too abstract or technical for visual
      representation, or when the target audience already possesses the necessary
      domain expertise.
  expected_classification:
    depth: cross-domain
- id: 03e51f20c4e2418d5bc67b08602cf510d1ed346053c6342273e504dd1cba6417
  input_fb:
    name: Rouge Metric for Code Generation Evaluation
    definition: A recall-oriented metric borrowed from NLP that evaluates code generation
      models by calculating the overlap of n-grams between generated and reference
      texts, providing insights into how well the generated code aligns with expected
      output.
    mechanism: The metric computes n-gram overlap between generated and reference
      text sequences to quantify alignment quality, with higher overlap indicating
      better semantic correspondence between the two texts.
    boundary: Applies to code generation model evaluation where reference text is
      available for comparison. Fails when no reference text exists or when the reference
      text is not properly aligned with the generated output.
  expected_classification:
    depth: specialized
- id: 1c6c6c44577ec3dcc406f7b23d8b26b87dfd3051a9a754b87533f23c6102759a
  input_fb:
    name: Problem Avoidance Through System Selection
    definition: Strategic avoidance of systemic problems is achieved by carefully
      selecting and engaging with systems that do not perpetuate or amplify existing
      issues. This approach recognizes that participation in certain systems can inadvertently
      contribute to larger problems through the accumulation of failed solutions and
      unexamined assumptions.
    mechanism: 'This is a normative heuristic: choosing systems with care avoids complicity
      in systemic failure. By consciously evaluating systems before engagement, individuals
      can prevent becoming part of the wreckage created by previous failed solutions.
      The principle prescribes a method of system selection that prioritizes alignment
      with one''s interests and values over passive participation.'
    boundary: Applies when individuals have agency in system selection and can evaluate
      systems based on their potential to create or solve problems. Fails when systems
      are imposed or when individuals lack the capacity to assess systemic impact
      due to information asymmetry or structural constraints.
  expected_classification:
    depth: cross-domain
- id: 7524215597769ce9faa5426d925e29382b4cc4684961cf83d4d2111d3d572be7
  input_fb:
    name: Creative Problem-solving Through Open-ended Inquiry
    definition: Shifting from 'should' thinking to 'could' thinking expands problem-solving
      space by embracing uncertainty and exploring multiple viable paths. This approach
      enables creative solutions by avoiding premature commitment to the most obvious
      answer and instead fostering exploration of alternative possibilities.
    mechanism: The 'could' mindset creates cognitive flexibility by reframing constraints
      as opportunities for innovation. When individuals move beyond prescriptive 'should'
      frameworks, they engage in open-ended inquiry that generates multiple solution
      paths rather than optimizing along a single trajectory. This shift in framing
      allows for the consideration of unconventional alternatives that might otherwise
      be dismissed as impractical or irrelevant.
    boundary: Applies when decision-makers face complex problems with multiple viable
      solutions and can tolerate ambiguity in the short term. Fails when time constraints
      or high-stakes conditions require rapid, prescriptive decision-making with limited
      exploration time. Also fails when team members lack psychological safety to
      explore 'what could work' without fear of judgment.
  expected_classification:
    depth: cross-domain
- id: ecb79a1833cc48b44ffdf59ab08010f48d4f1c016c1b9d8848dba60f5ea3d36f
  input_fb:
    name: Market Insertion Strategy
    definition: A business approach that involves entering existing markets and copying
      established practices rather than creating entirely new solutions.
    mechanism: The strategy works by identifying pre-existing markets and carving
      out a niche within them, using proven business models and formulas that others
      have already successfully implemented.
    boundary: Applies when entering established markets with existing business models.
      Fails when the market is completely new or lacks established patterns.
  expected_classification:
    depth: universal
- id: 5d1f19a335fd3674128c099e085c6db45de4bd929dd494eddec8e5c078ff53e6
  input_fb:
    name: Natural Pattern Recognition
    definition: Living systems and human perception naturally recognize and respond
      to recurring structural patterns in their environment, whether in geometry,
      form, or biological organization. These patterns emerge from fundamental physical
      and evolutionary processes and guide both design and understanding.
    mechanism: The human mind and natural systems are inherently pattern-seeking.
      Geometric principles like the golden ratio emerge from mathematical relationships
      that appear consistently in nature (e.g., spiral growth, branching structures).
      Similarly, biological evolution produces forms that optimize function under
      physical constraints (e.g., the tall office building's form reflects structural
      and ergonomic needs). These patterns are not arbitrary but reflect underlying
      physical or functional principles that shape both natural and human-made systems.
    boundary: Applies when systems are shaped by physical constraints, biological
      function, or mathematical relationships that produce recurring forms. Fails
      when patterns are imposed by human convention or cultural preference without
      functional basis, or when systems are entirely random or chaotic.
  expected_classification:
    depth: universal
- id: 0170d6cec2b46697b2fb825830fa7dc4a237e135fef23d4be94e562cb346bc99
  input_fb:
    name: Computer-assisted Qualitative Data Analysis Software (caqdas)
    definition: Software tools designed to support researchers in managing, coding,
      and analyzing qualitative data from interviews, observations, and other textual
      sources.
    mechanism: CAQDAS tools provide digital platforms for organizing large volumes
      of qualitative data, applying codes and categories systematically, and identifying
      patterns and themes across datasets, thereby supporting more rigorous and efficient
      qualitative analysis.
    boundary: Applies when researchers use digital tools to manage and analyze qualitative
      data rather than manual coding methods. Fails when researchers rely exclusively
      on manual methods or when the software is not properly integrated into the research
      workflow.
  expected_classification:
    depth: specialized
- id: aeb8aae55b7330c0274d1ac44a01c93e05ea53476f8e41ca9742d9e4698c3d93
  input_fb:
    name: Creative Confidence Through Action (2)
    definition: A principle that creative confidence is best developed through actual
      implementation and small successes rather than theoretical understanding alone.
    mechanism: Psychological research on self-efficacy shows that confidence in creative
      abilities grows through direct experience of success, where individuals build
      competence through repeated small wins rather than abstract learning or discussion.
    boundary: Applies when individuals or organizations want to develop creative confidence
      through practical experience. Fails when people rely solely on theory or passive
      learning without taking action.
  expected_classification:
    depth: cross-domain
- id: 874112518b9df25c537feecc920b26ab154047d1e1c735b5b3150d4d9306c639
  input_fb:
    name: Visual Closure and Completion
    definition: The human visual system naturally seeks to close gaps and complete
      unfinished forms, creating a sense of continuity and guiding visual attention
      across space. This principle describes how viewers actively construct meaning
      from partial visual information.
    mechanism: The visual system exhibits a perceptual tendency to fill in missing
      information and create complete forms from fragmented elements. This occurs
      through cognitive processes that organize visual elements into coherent patterns,
      even when the elements are incomplete or discontinuous. The brain's pattern
      recognition mechanisms work to establish closure and continuation, making the
      viewer an active participant in constructing the intended message.
    boundary: Applies when visual elements are incomplete or fragmented enough to
      require perceptual completion. Fails when elements are so disjointed or contradictory
      that no coherent pattern can be established, or when the viewer's attention
      is distracted by competing visual elements.
  expected_classification:
    depth: cross-domain
- id: d47909a0c13cf864370330e1a585ccc56655c62265e2aee25e51b776a467e7b3
  input_fb:
    name: Systems Thinking in Social and Economic Analysis
    definition: A methodological approach that recognizes the fundamental limits of
      mathematical modeling in complex social systems and emphasizes the need for
      qualitative understanding before quantitative analysis.
    mechanism: Complex social systems like group dynamics and economic models require
      qualitative understanding of fundamental relationships before mathematical equations
      can be meaningfully applied, as the mathematical complexity grows exponentially
      with system size.
    boundary: Applies to systems where mathematical complexity increases rapidly with
      the number of variables or entities involved. Fails when mathematical approaches
      are the only valid method for analyzing complex systems or when qualitative
      understanding is not possible.
  expected_classification:
    depth: cross-domain
- id: 8db4aca8e247e388914cc7a270bd7bd5bb3fab6d3e42d41c6ec7f0ac75bcc784
  input_fb:
    name: Power of Questions Principle
    definition: The quality of answers is directly determined by the quality of questions
      asked, with great questions serving as the foundation for great answers and
      human progress.
    mechanism: Questions shape the direction and depth of thinking, with better questions
      generating more insightful answers and driving human discovery, learning, and
      improvement by engaging critical thinking and focusing attention on the most
      important aspects of a problem.
    boundary: Applies to learning, problem-solving, and human development contexts
      where question quality directly impacts outcomes. Fails when questions are not
      asked or when the question format is inappropriate for the context.
  expected_classification:
    depth: cross-domain
- id: c0956f337071ffb7528aef7e5c43f6b592a80bfd4f15be18bd33cea56830419d
  input_fb:
    name: Perpetrator-victim Dynamic in Historical Conflict
    definition: A pattern where perpetrators of harmful actions either view their
      behavior as arbitrary and meaningless or as intentionally malicious and brutal,
      while simultaneously justifying their own retaliatory actions as morally appropriate
      and necessary.
    mechanism: This dynamic creates a cycle where each side perceives their actions
      as justified within their own moral framework, while viewing the other side's
      actions as unjustified or evil, leading to escalating conflict and mutual justification
      of harmful behavior.
    boundary: Applies to historical conflicts where both sides have clear perpetrator
      and victim roles, and where moral justification is central to the conflict dynamics.
      Does not apply to situations where one side is clearly the aggressor and the
      other the victim.
  expected_classification:
    depth: cross-domain
- id: 10225ec6b8b675d23c90118c443ab0bd09d5ffa9603fd3d48bcc45a1622c8feb
  input_fb:
    name: Historical Pattern Misinterpretation
    definition: When analyzing sequences of outcomes over time, a pattern of consistent
      wins or losses may appear statistically improbable, leading to over-attribution
      of causation rather than recognizing the role of random variation.
    mechanism: The human tendency to seek patterns and explanations in sequences of
      numbers (wealth, fitness, weight, etc.) creates false narratives about causation
      when the underlying process is random or follows a distribution that includes
      extreme outliers.
    boundary: Applies when analyzing time-series data where the sequence appears to
      show meaningful patterns but is actually subject to random variation or distributional
      effects. Fails when the sequence truly reflects a deterministic relationship
      or when the distribution is properly understood.
  expected_classification:
    depth: universal
- id: d536d0255e2d862037906b3240da3dd26e68aba5e56a1a91fed905725c4e6a07
  input_fb:
    name: Ed Gein As Cultural Archetype
    definition: A cultural metaphor that frames Ed Gein's crimes as a prototype for
      how human beings treat non-human entities, creating a parallel between human
      and animal treatment.
    mechanism: The metaphor maps the treatment of human beings in horror films to
      the treatment of animals in human society, suggesting that the same dehumanizing
      logic applies to both.
    boundary: Applies when horror films use Ed Gein's crimes as a template for exploring
      human-animal parallels in violence and treatment. Fails when the comparison
      lacks sufficient structural similarity between human and non-human treatment.
  expected_classification:
    depth: cross-domain
- id: f9dc3eb0b4080ff341938f0ff96ddfc6f85ef71f8ae8ca9353ed4ced9c4cea58
  input_fb:
    name: Superstar Effect and Winner-take-all Dynamics
    definition: In modern economies, a small number of high-performing individuals
      or entities capture the majority of rewards and attention, creating winner-take-all
      outcomes. This phenomenon amplifies the impact of small advantages and makes
      the distribution of success highly skewed.
    mechanism: This is an empirical pattern, not a causal mechanism. The superstar
      effect emerges when small differences in performance, talent, or initial conditions
      compound over time due to network effects, market concentration, and the increasing
      visibility of top performers. The pattern is observed in various domains including
      music, literature, and technology, where a few individuals dominate the market
      or attention, even when the differences in absolute quality are modest.
    boundary: Applies in competitive environments where performance can be easily
      measured and rewarded, and where visibility or access to markets is not equally
      distributed. Fails in systems where performance is not easily quantifiable or
      where access to resources and audiences is more equal.
  expected_classification:
    depth: cross-domain
- id: 19148e69a61f8c44ecef021e71930c0f66f582ffff9239850e94b8917af950da
  input_fb:
    name: Deliberative Methods in Market Research
    definition: A collaborative qualitative research approach that involves extended
      time periods for generating and reflecting on data, enabling informed decision-making
      through structured group processes.
    mechanism: These methods combine group discussions, workshops, and individual
      polling with information and feedback provided during the process, allowing
      participants to reach informed decisions about topics through extended collaborative
      engagement.
    boundary: Applies to research requiring extended collaborative processes and informed
      decision-making. Fails when time constraints prevent extended deliberation or
      when participants cannot be reconvened for follow-up polling.
  expected_classification:
    depth: specialized
- id: eac6e6adcfa851b7a0ffeabc98ce5ab8ed64bf6cc845ed212808c6324176756f
  input_fb:
    name: Optionality As Superior to Luck and Trial-and-error
    definition: Optionality represents a strategic advantage over pure luck or trial-and-error
      approaches, as it involves selecting from a range of viable options rather than
      relying on random outcomes or iterative errors.
    mechanism: Optionality provides a structured approach to decision-making by offering
      multiple pathways or choices, allowing actors to select the most favorable outcomes
      from a range of possibilities rather than being limited to random chance or
      error-prone experimentation.
    boundary: Applies when decision-makers have access to multiple viable options
      or pathways to choose from. Fails when only random chance or error-driven approaches
      are available.
  expected_classification:
    depth: cross-domain
- id: dcfb103e8666332be6da0eb9ab7a8a07d75d83d780b26eff8d6e863acd870d47
  input_fb:
    name: Judicial Evidence Exclusion and Psychological Reactance
    definition: When judges rule evidence inadmissible and instruct juries to disregard
      it, such instructions may trigger psychological reactance in jurors who believe
      they should consider all available information, potentially causing them to
      use that evidence more heavily in their deliberations.
    mechanism: The prohibition of evidence creates a psychological barrier that paradoxically
      increases the perceived importance or validity of the excluded information,
      leading jurors to weigh it more heavily despite explicit instructions to ignore
      it.
    boundary: Applies when jurors have a strong sense of their right to consider all
      relevant information. Fails when jurors accept judicial authority without reactance
      or when evidence is clearly irrelevant or prejudicial.
  expected_classification:
    depth: cross-domain
- id: 0c8d04fb6dd52d8c077a1eda3d17103f8ef2dfff670a32a8f659514a7560649c
  input_fb:
    name: Cultural Appropriation Through Branding
    definition: Brands leverage cultural elements, particularly from marginalized
      communities, to create commercial value by repositioning them as aspirational
      or mainstream. This process involves taking elements that were once associated
      with struggle or identity and transforming them into symbols of success or coolness.
    mechanism: This is a descriptive model of how cultural elements are repurposed
      for commercial gain. The process involves identifying cultural markers (such
      as music genres, fashion styles, or social movements) that resonate with broader
      audiences, then rebranding or repositioning these elements to align with marketable
      narratives. The transformation often strips away the original context or meaning,
      replacing it with a commodified version that appeals to consumers seeking identity
      expression or status.
    boundary: Applies when cultural elements are co-opted by mainstream brands for
      commercial gain, particularly in contexts where the original community is marginalized
      or underrepresented in the market. Fails when the brand's use of cultural elements
      is done in collaboration or with direct attribution to the source community,
      or when the cultural elements are not tied to a specific identity or community.
  expected_classification:
    depth: cross-domain
- id: 1fce7665bbe39be5a8f1eb0659975436efe86292cb2fc2493870aa365f24504c
  input_fb:
    name: Cross-industry Insight Transfer
    definition: Drawing meaningful insights from seemingly unrelated industries or
      domains can reveal novel solutions to problems within one's own field. This
      principle describes the process of recognizing parallels between different contexts
      and applying learned patterns to new situations.
    mechanism: 'This is a practical heuristic for innovation: when facing a challenge
      in one''s field, deliberately seeking analogies from other domains can trigger
      novel solutions. The mechanism works through pattern recognition and metaphorical
      thinking, where a solution from one context is adapted to fit a different but
      structurally similar problem. The process requires both domain expertise in
      the target field and exposure to diverse sources of information or unrelated
      fields.'
    boundary: Applies when there is sufficient structural similarity between domains
      to enable meaningful analogy. Fails when the domains are completely dissimilar
      or when the transfer requires extensive adaptation that loses the original solution's
      effectiveness.
  expected_classification:
    depth: cross-domain
- id: 97d88722bbeeedc3c137cf285512da4051dc69fb16dde59c7651c59a8dd2e4ab
  input_fb:
    name: Emergent Properties in Design
    definition: Design solutions develop properties that were not consciously intended
      by the designer, arising from the interaction of elements in the solution-concept
      and the evolving problem-concept. These emergent properties are perceived in
      partial or prior solutions and suggest how the solution might align with the
      problem.
    mechanism: Emergent properties arise when design elements interact in complex
      ways, creating new characteristics that were not explicitly planned. These properties
      emerge from the system's structure and the dynamic relationship between solution
      and problem concepts, often becoming apparent only in sketches or early prototypes.
      The perception of these properties is subjective and context-dependent, reflecting
      how users or observers interpret the design's meaning and function.
    boundary: Applies when design solutions are in development or partial form, where
      the relationship between solution and problem is still evolving. Fails when
      solutions are fully formed or when properties are entirely predetermined by
      design intent, or in cases where the design process is purely algorithmic or
      rule-based without room for interpretation.
  expected_classification:
    depth: cross-domain
- id: 44d3629eb93640cdeae1d52dfd281e92956f0de999489bb3b929cf9315fdc329
  input_fb:
    name: Browser Extension As Cultural Intervention Tool
    definition: A browser extension that serves as a vehicle for cultural intervention,
      activism, and critical design by using data from external APIs or databases
      to augment web content and reveal hidden relationships.
    mechanism: "Extensions can change the appearance of online content, add information\
      \ layers, redirect URLs, or modify browser behaviors to make users aware of\
      \ others using the same extension through WebSockets, or to implement strategies\
      \ of defamiliarization and d\xE9tournement that estrange the mundane."
    boundary: Applies to browser extensions that actively intervene in online experiences
      rather than passive content consumption. Fails when extensions only provide
      basic functionality like ad-blocking or identity obfuscation without creative
      intervention.
  expected_classification:
    depth: cross-domain
- id: d6600c05acf2bcbe0b63c9e13353b46c69953324136c3fe20b6f6637a669656d
  input_fb:
    name: Expectation-driven Performance Effect
    definition: "Expectations about performance or capability influence actual outcomes\
      \ by altering behavior, effort, and resource allocation. The principle describes\
      \ how beliefs about potential\u2014whether from external sources (teachers,\
      \ therapists) or internal self-perception\u2014can become self-fulfilling prophecies\
      \ that drive improved results."
    mechanism: "Expectations shape behavior through psychological and social mechanisms.\
      \ When individuals or others hold high expectations for a person's performance,\
      \ they often adjust their treatment, attention, and support accordingly. These\
      \ adjustments\u2014whether in feedback, effort, or resource allocation\u2014\
      create conditions that enable the expected outcome to occur. The effect operates\
      \ through a feedback loop where expectations influence actions, which in turn\
      \ confirm the original belief."
    boundary: Applies when expectations are held by others or by the individual themselves
      and influence behavior or outcomes. Fails when expectations are not acted upon,
      or when external constraints (e.g., physical limitations, systemic barriers)
      override the influence of belief.
  expected_classification:
    depth: cross-domain
- id: 0a7c1ea2474d870914619dcb106659a14c561e66c6115851e53acea440570765
  input_fb:
    name: Theoretical Sampling and Iterative Refinement
    definition: Theoretical sampling is a methodological approach in grounded theory
      where researchers iteratively refine their analysis by selecting new data sources
      that are theoretically relevant to emerging concepts, allowing the research
      to evolve dynamically as understanding deepens. This process involves continuous
      adjustment of research direction based on emerging patterns and theoretical
      insights.
    mechanism: Theoretical sampling operates as a feedback loop in grounded theory
      research where initial data analysis reveals theoretical gaps or emerging themes.
      Researchers then strategically seek additional data sources that directly address
      these theoretical points, creating a cycle of data collection, analysis, and
      refinement. This process enables researchers to move from noise to music in
      their data by iteratively focusing on what is theoretically most relevant rather
      than randomly collecting information.
    boundary: Applies when researchers are conducting grounded theory methodology
      and have sufficient theoretical development to identify gaps in their understanding.
      Fails when researchers lack theoretical grounding or when data collection is
      constrained by external factors such as time limits or access restrictions that
      prevent theoretical sampling.
  expected_classification:
    depth: specialized
- id: 03268b5df6fe053346e81cf06dd9518b2ae987c5dc2b03cb90371ea2581b8ca8
  input_fb:
    name: Compound Grid Systems in Design
    definition: Compound grid systems organize complex layouts by combining multiple
      column structures to maintain visual consistency while accommodating diverse
      content types.
    mechanism: Compound grids integrate multiple column arrangements and axis systems
      to create structured yet flexible layouts that can handle varied content elements
      like text, images, and pull quotes while maintaining visual coherence across
      multiple sections.
    boundary: Applies to publication design and layout systems where multiple content
      types need structured organization. Fails when content is too simple or when
      the grid system is not properly implemented.
  expected_classification:
    depth: domain
- id: 9f7262468e8eaeee2b31c87cf0e54380ee631ba13dbef32d27d5b8b166150e25
  input_fb:
    name: Augmented Projection Design Project
    definition: A creative computational project that involves designing projected
      imagery for physical spaces or objects to illuminate architectural features
      or create new meanings from existing elements.
    mechanism: The project involves creating time-based visual displays that relate
      to the geometric, structural, or political features of physical spaces, using
      code to generate and project imagery onto specific sites or objects.
    boundary: Applies to physical space visualization projects that use computational
      design and projection technology. Fails when the project lacks specific physical
      site requirements or fails to address the relationship between virtual and physical
      spaces.
  expected_classification:
    depth: cross-domain
- id: 2abcbcef5cb3162788eee8aa03718aea0d9b247e111fd01f0ad7b88d7946b0ac
  input_fb:
    name: Arbitrary Symbolic Systems
    definition: Symbols that have no inherent connection to objects in the environment
      but carry coded information that can be negotiated by anyone, such as letters
      or numbers, which must be learned since their meaning is arbitrarily assigned.
    mechanism: These symbols function as abstract representations that encode information
      through arbitrary assignment of meaning, allowing communication across individuals
      regardless of direct environmental connection.
    boundary: Applies to symbols that are learned rather than naturally connected
      to objects. Fails when symbols maintain direct physical or sensory connections
      to their referents.
  expected_classification:
    depth: specialized
- id: 03a76ba3892455bf581aef4aa77bf639164fd83812f24955a3c6ebf7b5906775
  input_fb:
    name: Ai Systems for Formal Problem Solving
    definition: AI systems designed to mimic human thought processes and solve formal
      problems through logical reasoning and pattern recognition.
    mechanism: These systems apply formal logic-based reasoning models to solve common
      issues, using computer languages that enable intelligent systems to reason and
      make judgments based on logic, allowing for data analysis and conclusion drawing
      with high accuracy rates.
    boundary: Applies to systems designed to mimic human cognitive processes and solve
      formal problems. Fails when the system cannot replicate human-like reasoning
      or when problems exceed the system's logical capacity.
  expected_classification:
    depth: domain
- id: 092798031c357897ce5e25c9c503c06a853c9ad7eeddb607cb7e78e195ca9a86
  input_fb:
    name: Whole-brain Thinking in Forecasting
    definition: A prescriptive principle advocating for the integration of left-brain
      analytical thinking with right-brain intuitive and visionary thinking in forecasting
      processes.
    mechanism: The principle suggests that traditional linear analysis must be balanced
      with intuitive and visionary approaches to generate truly innovative forecasts
      that consider human needs and societal currents.
    boundary: Applies when forecasting requires both factual analysis and creative
      vision. Fails when organizations only value measurable, left-brain approaches
      or when the integration of analytical and intuitive thinking is not possible.
  expected_classification:
    depth: specialized
- id: f1509eee755076a169efacfeacdc5fde310cbec15d39dcbf8297aafd7693cf25
  input_fb:
    name: Learning From Failure in Business Ventures
    definition: Business failures provide essential data and insights that cannot
      be obtained through other means, enabling knowledge acquisition, instinct development,
      and dream achievement through experiential learning.
    mechanism: Failure creates opportunities for data collection and insight generation
      that are impossible to obtain through planning or success alone, as the experience
      of encountering obstacles reveals practical limitations and possibilities.
    boundary: Applies when failure leads to genuine learning and insight rather than
      just loss. Fails when failure is not analyzed for lessons or when the same mistakes
      are repeated without adaptation.
  expected_classification:
    depth: cross-domain
- id: 2267c73937f1b47609f92ae85971f801048e4b579ab5c3c0fcbddd99beaaf344
  input_fb:
    name: Network Tv's Mass Appeal Paradox
    definition: A principle describing how network television's attempt to appeal
      to everyone results in mediocre content that fails to achieve meaningful impact.
    mechanism: The strategy of targeting mass audiences through standardized content
      leads to bland programming that lacks distinctive character, as evidenced by
      the example of Gilligan's Island and Three's Company being typical of this approach.
    boundary: Applies to network television's content strategy from 1960-1990 when
      mass appeal was prioritized over artistic quality. Fails when content is tailored
      to specific niche audiences rather than broad demographics.
  expected_classification:
    depth: specialized
- id: c73e70c9c3b429633048cb6f90a9acaead8e9cc9178876dee8e241d35cbd921c
  input_fb:
    name: Search Space Metaphor for Problem Solving
    definition: 'A conceptual framework that describes problem solving as navigating
      through progressively constrained sets of possibilities: from the total space
      of unknown options, to the consider-able set, to the proposal space, and finally
      to the selected solution.'
    mechanism: The metaphor illustrates how problem solving involves systematically
      narrowing down from an initially vast unknown space to a focused set of viable
      solutions, with each step reducing the search space through elimination and
      investigation.
    boundary: Applies to conceptual frameworks for understanding problem-solving processes.
      Does not apply to specific problem-solving methods or algorithms. Fails when
      the search space is not actually constrained or when the metaphor is misapplied
      to non-search contexts.
  expected_classification:
    depth: cross-domain
- id: 782b22f854d52102f5afd2bb982735f8730811dbb1bbfc10202683112508f62d
  input_fb:
    name: Archetypal Pattern in Modern Consciousness
    definition: The principle that archetypal patterns from ancient myths and rituals
      continue to manifest in modern human consciousness through dreams and symbols,
      maintaining their psychological relevance across historical periods.
    mechanism: Modern human unconscious continues to process archetypal patterns that
      were once expressed through ancient rituals and myths, creating symbolic connections
      between primitive psychological experiences and contemporary psychological processes.
    boundary: Applies when modern psychological phenomena can be understood through
      comparison with ancient archetypal patterns. Fails when modern psychological
      processes are dismissed as merely rational or modern without recognizing archetypal
      continuities.
  expected_classification:
    depth: cross-domain
- id: e149045a8995ccf8285d1c1f04af5eeed2db6bc6d4ce21aadb0c0c9249801323
  input_fb:
    name: The Symbolic Power of the Number Six
    definition: A conceptual principle that the number six represents optimal structural
      efficiency and connectivity in both physical and symbolic systems.
    mechanism: The number six provides optimal structural stability and functional
      flexibility through its geometric properties (six vertices in a circle), its
      role in efficient spatial organization (six-sided shapes), and its mathematical
      relationships (multiples of six in time and measurement systems), making it
      a natural choice for effective design solutions.
    boundary: Applies to design and symbolic contexts where structural efficiency
      and optimal connectivity are desired. Fails when the six-sided structure or
      six-related principles do not provide practical advantages in the specific application.
  expected_classification:
    depth: universal
- id: cb3159c1d17ad9457383635aa72bc2b5043bdb96aeb830697dd18d91c748b775
  input_fb:
    name: Conceptual Metaphor Mapping
    definition: Conceptual metaphors map abstract domains (like emotion) onto more
      concrete domains (like physical containers or heat) to make abstract concepts
      understandable. These mappings follow systematic patterns based on shared structural
      properties between domains.
    mechanism: 'This is a descriptive model of how conceptual metaphors function:
      abstract concepts are understood through their alignment with more tangible
      domains. The mapping involves identifying structural correspondences (e.g.,
      heat to anger, container to body) that allow abstract ideas to be processed
      using familiar physical or experiential frameworks. These mappings are not arbitrary
      but emerge from shared cognitive structures and embodied experience.'
    boundary: Applies when abstract concepts can be understood through concrete domains
      that share structural similarities. Fails when abstract domains lack any tangible
      or experiential anchor, or when the mapping creates logical inconsistencies
      (e.g., emotions as purely abstract without physical analogues).
  expected_classification:
    depth: cross-domain
- id: 5328faef65b9d4efb8671a9bf0404b4479aa0c7c58bba6022383622c628ffbd9
  input_fb:
    name: Global Governance for Emerging Technologies
    definition: A principle advocating for international cooperation and treaty-like
      frameworks to manage the risks and benefits of transformative technologies like
      AI and synthetic biology, drawing parallels to historical examples of geopolitical
      realignment.
    mechanism: The principle suggests that major technological threats require global
      coordination mechanisms similar to past international treaties, leveraging historical
      precedents of rapid geopolitical shifts to address future technological challenges.
    boundary: Applies to global governance of transformative technologies when they
      pose existential risks. Fails when nations cannot agree on shared frameworks
      or when the scale of threat is not recognized as requiring international response.
  expected_classification:
    depth: cross-domain
- id: 859d4b3c61c8a291396f13e4b8d63cf0faf27010ddc855e8f70bc3cdbf7f6a2f
  input_fb:
    name: Catholic Reading for Design Inspiration
    definition: Designers benefit from reading widely across diverse genres and subjects,
      even when the direct application to their work is not immediately apparent.
      The subconscious absorption of ideas from varied sources enhances creative thinking
      and problem-solving capabilities.
    mechanism: 'This is a practical heuristic: reading broadly across different domains
      and genres provides indirect inspiration that can be unconsciously integrated
      into design thinking. The process involves both conscious engagement with relevant
      material and unconscious assimilation of ideas that later surface in creative
      problem-solving. The value lies not in direct application but in the expansion
      of conceptual frameworks and mental models that inform design decisions.'
    boundary: Applies to designers who engage in creative problem-solving and benefit
      from expanded intellectual horizons. Fails when reading is purely utilitarian
      or focused on direct skill-building without broader conceptual exposure. Also
      fails for designers who work in highly specialized fields where cross-domain
      inspiration is not applicable.
  expected_classification:
    depth: cross-domain
- id: d701f28e9e8c868a9445baa99410cb8a636251f38dab9aca4eaadf84c6e579d8
  input_fb:
    name: Cognitive Mechanism of Metaphor
    definition: Metaphor operates as a cognitive mechanism that enables understanding
      of one concept through mapping attributes from a familiar source concept. This
      process involves systematic cross-domain mapping that transcends mere stylistic
      decoration to engage fundamental modes of human cognition.
    mechanism: The cognitive mechanism of metaphor functions through selective attribute
      mapping between source and target domains. When one concept is understood in
      terms of another, the brain systematically transfers semantic features from
      a more accessible domain to a less accessible one. This cross-domain mapping
      is not arbitrary but follows structured patterns that reflect universal principles
      of conceptual organization. The process involves both abstracting and applying
      meaning across domains, enabling comprehension of complex or abstract ideas
      through more concrete reference points.
    boundary: Applies when conceptual understanding requires cross-domain mapping
      or when abstract ideas need concrete reference points. Fails when metaphor is
      purely decorative or when the source domain lacks relevant semantic features
      for target concept mapping. Also fails when metaphor is used for purely aesthetic
      or stylistic purposes without cognitive function.
  expected_classification:
    depth: cross-domain
- id: 9e651096d902895212f4cc24dfa1ca2578bbbdc0b664eda3c8e28f0dee2b37cc
  input_fb:
    name: Bounded Novelty in Language and Health
    definition: "Language use in health contexts operates through bounded novelty\
      \ \u2014 where new information or expression is embedded within familiar structures,\
      \ allowing for emotional and cognitive processing without overwhelming psychological\
      \ resistance. This principle describes how language can function as a therapeutic\
      \ tool by leveraging familiar frameworks to introduce novel insights."
    mechanism: Language serves as a vehicle for emotional and cognitive processing
      when novelty is bounded by existing conceptual structures. The emotional and
      cognitive systems (as described by the 'cool' and 'hot' systems) interact with
      language to process new information in a way that is manageable and therapeutic.
      When language introduces novel content within familiar contexts, it enables
      exposure therapy-like effects without triggering psychological catastrophe.
    boundary: Applies when language introduces new emotional or cognitive content
      within familiar conceptual or structural frameworks. Fails when language presents
      entirely novel information without any familiar anchoring, or when the emotional
      or cognitive systems are not engaged in processing the content.
  expected_classification:
    depth: cross-domain
- id: 03d3695ccedd45dcfc2f4f82eab58bb5a48e4f5cea0e2a2a28fdbe5cebbe12e7
  input_fb:
    name: Ai-driven Business Transformation
    definition: Integrating AI into business strategy enables organizations to achieve
      operational efficiency, cost reduction, and strategic advantage through automation
      and enhanced decision-making capabilities. The principle describes a framework
      for embedding AI technologies to support both tactical improvements and long-term
      competitive positioning.
    mechanism: 'This is a normative heuristic describing a practical approach to AI
      implementation: organizations can systematically integrate AI tools to automate
      routine tasks, reduce costs, and improve decision-making. The process involves
      aligning AI capabilities with business objectives, measuring returns on investment,
      and adapting strategies to maintain competitive advantage in evolving markets.
      The framework emphasizes that AI adoption should be purposeful and strategically
      aligned rather than opportunistic.'
    boundary: Applies when businesses have clear strategic objectives and can quantify
      benefits from AI integration. Fails when organizations lack defined goals, cannot
      measure ROI, or implement AI without considering human workforce impacts and
      organizational adaptation needs.
  expected_classification:
    depth: domain
- id: 0247b0e0f1afcb5d5a6767b6437504e4ad49a281da1819730816210ac7f47852
  input_fb:
    name: Audio-visual Integration in Motion Graphics
    definition: Motion graphics projects require coordinated handling of audio and
      visual elements to achieve seamless integration and professional-quality output.
      The principle governs how audio mixing, composition structure, and rendering
      processes must align to support effective post-production workflows.
    mechanism: Audio and visual elements in motion graphics are integrated through
      shared project settings that define time display, color handling, and sampling
      rates. Composition nesting and precomping affect how audio and visual data are
      organized within the timeline, while rendering options influence processing
      power allocation and output quality. The system requires coordination between
      audio mixing, visual composition structure, and rendering parameters to maintain
      synchronization and performance.
    boundary: Applies when audio and visual elements are processed together in a single
      motion graphics environment like After Effects. Fails when audio and visual
      workflows are completely separate or when the system lacks proper integration
      between audio mixing and visual composition tools.
  expected_classification:
    depth: domain
- id: 62e130b91bf562ac461dbb6275de4bfa719efd32ad31daf3c0672957a4f024fd
  input_fb:
    name: Systems Science Approach to Complex Social Problems
    definition: A methodological approach combining multiple complementary methodologies
      to address complex social problems in colonized spaces, particularly Indigenous
      contexts.
    mechanism: The approach integrates systems science principles with grounded theory
      methods to create a collaborative, holistic knowledge-building process that
      recognizes the complexity of social issues and the need for multiple methodological
      perspectives to understand and address them.
    boundary: Applies to research in colonized spaces and complex social problems,
      particularly Indigenous policy and social justice contexts. Fails when the approach
      is not specifically designed for complex problems or does not integrate multiple
      methodologies.
  expected_classification:
    depth: cross-domain
- id: bc18d46177251b6d9fb099f56fc1e0bffb264b9c9aba574fead517b80a95dbf7
  input_fb:
    name: Hard Science Methodology in Education
    definition: The application of rigorous scientific methodology from hard sciences
      to education, requiring comprehensive learning and systematic organization of
      multidisciplinary knowledge rather than selective or ideological approaches.
    mechanism: Hard science methodology demands complete fluency in foundational knowledge,
      systematic attribution of cross-disciplinary concepts, and preference for the
      most rigorous sources rather than ideological or selective approaches.
    boundary: Applies when educational systems require comprehensive knowledge mastery
      and systematic organization. Fails when education relies on selective absorption
      or ideological imposition rather than systematic learning.
  expected_classification:
    depth: cross-domain
- id: f2855efe4fa6ff84327abd0c0a9839eca32a0dabb158ea23e1c40db24e14ca04
  input_fb:
    name: Interdisciplinary Visual Methodology
    definition: Visual methodology emerges as a cross-disciplinary field that draws
      from anthropology, communication studies, philosophy, and management research
      to analyze visual data. It encompasses both traditional and digital approaches
      to visual analysis, integrating diverse theoretical perspectives and practical
      techniques.
    mechanism: This is a descriptive model of how visual methodology has evolved as
      an interdisciplinary field. The field incorporates insights from multiple disciplines
      including anthropology (visual methods in social research), communication studies
      (visual communication analysis), philosophy (ways of seeing), and management
      studies (visuality in organizational contexts). The model describes the organizational
      structure and theoretical foundations of visual methodology as a growing area
      of scholarly inquiry that spans academic disciplines.
    boundary: Applies to scholarly fields where visual analysis is integrated into
      research practices and where interdisciplinary approaches are valued. Fails
      when visual methods are isolated to a single discipline without cross-pollination
      of ideas or when the field lacks theoretical grounding in multiple domains.
  expected_classification:
    depth: cross-domain
- id: 76da9dae50e21ba65ce238cb8dacf68fefcc7d38a2b458320b9fadbb7dde4ddb
  input_fb:
    name: Room 13 Art Studio Model
    definition: A collaborative learning model where students work with artists in
      residence to create art while developing business and leadership skills through
      running their own studio.
    mechanism: Students combine creative freedom with business practice by managing
      an art studio, raising funds, and learning from artists in residence, creating
      a hybrid educational and entrepreneurial experience.
    boundary: Applies to educational settings where students can combine creative
      and business learning in a structured environment. Fails when the model cannot
      be replicated due to lack of resources, artist availability, or institutional
      support.
  expected_classification:
    depth: cross-domain
- id: 11c4568cb1211e51ff7f6992e8fedba237ec1918464ef09fd67263cc0c5bce0a
  input_fb:
    name: Algazel's Influence on Sufi Mysticism and Empirical Methods
    definition: Algazel's philosophical work, particularly his critique of classical
      philosophy and emphasis on empirical methods, influenced the development of
      Sufi mysticism and shaped approaches to planning and prediction through trial-and-error
      methods.
    mechanism: Algazel's rejection of purely theoretical philosophy in favor of practical
      empirical methods created a philosophical shift that enabled Sufi mysticism's
      emphasis on direct spiritual experience and communion with God, while also establishing
      a foundation for planning approaches that embrace uncertainty and unpredictable
      events (Black Swan problem).
    boundary: Applies to the specific historical context of Algazel's philosophical
      work and its influence on Sufi mysticism and empirical approaches to planning.
      Fails when applied to other philosophical traditions or contexts without the
      specific historical and cultural conditions that enabled this particular influence.
  expected_classification:
    depth: cross-domain
- id: 271b7f6676c2d3e2bc9a6b8891b2ced3e82f081b146eb47d4281572ffe572a2b
  input_fb:
    name: Agentic Ai Economic Transformation
    definition: AI agents are reshaping economic systems by introducing autonomous
      decision-making entities that interact like traders, consumers, or regulators,
      creating emergent behaviors that mirror real-world economic dynamics such as
      price fluctuations and policy effects. These agents operate within a framework
      where technological innovation directly impacts economic structures and societal
      outcomes.
    mechanism: "AI agents function as independent economic actors that adapt and learn\
      \ from their environment, simulating human-like behaviors in markets and policy\
      \ spaces. Their interactions generate emergent properties\u2014such as supply-demand\
      \ dynamics and price volatility\u2014that reflect real-world economic systems.\
      \ These systems are not merely computational tools but represent a fundamental\
      \ shift in how economic theory and practice evolve, with agents serving as both\
      \ participants and architects of new economic paradigms."
    boundary: Applies when AI agents are designed to simulate or directly participate
      in economic systems with adaptive behaviors and inter-agent interaction. Fails
      when agents are isolated or used only for data processing without influencing
      or reflecting economic dynamics.
  expected_classification:
    depth: cross-domain
- id: f5b711449f4124134d8828c0f0ea4c50a413aa5f6ae0df43a22dacce986eb6b3
  input_fb:
    name: Collective Action Dilemma
    definition: A strategic problem where individual rational behavior leads to collectively
      suboptimal outcomes, requiring coordination among multiple parties to achieve
      beneficial results.
    mechanism: The collective action problem arises when individuals face high personal
      costs to act collectively, making it difficult to overcome the coordination
      challenge that would otherwise lead to successful group action.
    boundary: Applies to situations where individual action is costly but collective
      action is beneficial. Fails when the costs of coordination exceed the benefits
      or when individuals can act independently without requiring group cooperation.
  expected_classification:
    depth: cross-domain
- id: 640944238b075d24d577c07dc19e637987faf016b0b471b997170e262ccae659
  input_fb:
    name: Isomorphic Natural Laws Across Systems
    definition: Natural laws exhibit isomorphic patterns across diverse scientific
      fields and system types, enabling cross-domain application of principles despite
      differences in system elements. These laws describe universal organizational
      properties that manifest consistently across physical, biological, and social
      systems.
    mechanism: This is an empirical pattern, not a causal mechanism. The same mathematical
      and structural principles (such as exponential growth) appear across different
      domains because they describe fundamental organizational properties of complex
      systems. These patterns emerge from the shared dynamics of feedback, interaction,
      and emergent behavior that characterize systems regardless of their specific
      components or context.
    boundary: Applies to systems that exhibit feedback, interaction, and emergent
      properties across different domains. Fails when systems are isolated or lack
      the dynamic interconnections necessary for pattern emergence, or when the systems
      are fundamentally incompatible in their organizational structure.
  expected_classification:
    depth: cross-domain
- id: 1a65c5b4e2e70824141ed98ff3e8d7bffb157db85b98e7a6577a3e1e22381cc5
  input_fb:
    name: Vicious Cycle of Fear-based Control
    definition: A feedback loop develops in which fear-driven policies intensify public
      fear, leading to increased compliance and support for even stricter measures,
      while simultaneously eroding legal protections and human dignity. This creates
      a self-reinforcing cycle of control that escalates through psychological manipulation
      and dehumanization.
    mechanism: Fear-based policies trigger an exponential increase in fear and support
      for stricter measures, which in turn generates more victims and further justifies
      harsher controls. As rules change rapidly and criticism is suppressed, the system
      becomes immune to challenge, creating a self-affirming cycle where the very
      mechanisms meant to address threats end up amplifying them.
    boundary: Applies when fear is used as a primary driver for policy and social
      control, particularly in contexts where legal protections are weakened and dissent
      is discouraged. Fails when policies are transparent, subject to public scrutiny,
      or based on evidence rather than fear.
  expected_classification:
    depth: cross-domain
- id: 130375ab10dcb4c8dabf55900953f618391f9eb48ab53f31ad9298086f1539af
  input_fb:
    name: Hollywood As Modern Sacred Space
    definition: Hollywood functions as a contemporary sacred space where media consumption
      becomes a ritualized form of worship, replacing traditional religious practices
      with new forms of spiritual engagement through entertainment and information.
    mechanism: Modern audiences consume Hollywood content as if it were religious
      scripture, accepting its messages as authoritative truth while participating
      in collective viewing experiences that create communal spiritual bonds.
    boundary: Applies to contemporary media consumption patterns where entertainment
      serves as a substitute for traditional religious practice. Fails when audiences
      maintain clear distinctions between entertainment and spiritual truth.
  expected_classification:
    depth: cross-domain
- id: 029c9fdaea6625f120ed8259d7424a550ef700e0882eec9a494ba47c6050da52
  input_fb:
    name: Future-proof Career Resilience
    definition: Career resilience requires proactive adaptation to technological disruption
      by building diverse skills, maintaining personal brand visibility, and cultivating
      multiple income streams. The principle describes a practical framework for sustaining
      professional relevance in an AI-driven economy.
    mechanism: 'This is a normative heuristic: building diverse competencies, maintaining
      personal brand presence, and developing multiple revenue sources creates redundancy
      and adaptability. The approach enables professionals to pivot when job roles
      become automated or obsolete, while also providing multiple pathways for income
      generation and career advancement.'
    boundary: 'Applies when individuals face technological disruption or economic
      volatility in their field. Fails when: (1) skills are narrowly specialized with
      no transferable value; (2) personal brand is not actively maintained or shared;
      (3) income is entirely dependent on a single source or employment arrangement.'
  expected_classification:
    depth: domain
- id: 00e319aadd1e21979f65c9ece947bd67a041e9ba2c14e8e86cf0572ac944c247
  input_fb:
    name: Neural Network Normalization
    definition: Normalization techniques adjust the distribution of activations in
      neural networks to improve training stability and convergence. These methods
      address internal covariate shift and help maintain consistent signal propagation
      through layers.
    mechanism: Normalization techniques transform activation distributions to have
      consistent means and variances across layers. They reduce the internal covariate
      shift that occurs when layer parameters change during training, allowing for
      more stable gradient flow. Batch normalization specifically normalizes across
      the batch dimension, while layer normalization normalizes across the feature
      dimension of each sample.
    boundary: Applies when neural networks suffer from internal covariate shift or
      unstable gradient flow during training. Fails when networks are trained with
      very small batches or when the normalization method does not align with the
      network's architecture or training dynamics.
  expected_classification:
    depth: specialized
- id: 5783d9f3cf45316bf629a0e48e86ff253df89e9479c4cd3fdf858a60f59829c7
  input_fb:
    name: Potemkin Village Effect
    definition: Visible but superficial system components that appear to function
      correctly but lack real substance or capability. These systems create an illusion
      of effectiveness while failing to deliver meaningful results.
    mechanism: This is a descriptive model of system misrepresentation. The principle
      identifies specific system patterns where surface-level elements are mistaken
      for functional components, creating false confidence in system capability. The
      model categorizes systems that look operational but are fundamentally hollow
      or illusory.
    boundary: Applies to systems where observable elements are mistaken for functional
      components. Fails when the system's surface and function align completely, or
      when the superficial elements are genuinely functional but misinterpreted.
  expected_classification:
    depth: cross-domain
- id: 09fa93a9d0e3c15ea4fdfdf6b7dd9481c24659370aea2c5f3afc02ea76c8df8b
  input_fb:
    name: Sociobiological Model of Consciousness
    definition: Human psychological capacities and social behaviors originate from
      genetic inheritance shaped by natural selection, with biological and cultural
      dimensions interwoven in a modeling symbiosis. The principle asserts that consciousness
      and its associated memes (like heroism, altruism, soul, God, immortality) are
      not independent of biological evolution but are instead adaptive responses that
      enhance survival and reproductive success.
    mechanism: The biological dimension of human existence, particularly genetic traits
      shaped by natural selection, underpins psychological capacities such as heroism,
      altruism, and consciousness. These traits are not isolated but integrated into
      a broader semiosic and representational framework that includes cultural and
      symbolic elements. The interplay between these dimensions creates a modeling
      symbiosis where each supports and shapes the others, with no single dimension
      replacing another.
    boundary: Applies when psychological and behavioral traits can be traced to genetic
      inheritance and natural selection. Fails when traits are entirely culturally
      constructed or independent of biological evolution, or when consciousness and
      culture are viewed as completely separate domains without biological grounding.
  expected_classification:
    depth: cross-domain
- id: 0409c981a3d061af99e661e9a15f676f932295c3daf160a20dae4923671a6e53
  input_fb:
    name: Cross-domain Interaction Design
    definition: Interaction design has evolved into a multidisciplinary field that
      spans physical and digital realms, incorporating principles from design, engineering,
      marketing, and manufacturing. It encompasses a wide range of interaction styles
      and devices, from GUIs and web interfaces to embedded systems, ubiquitous computing,
      and everyday objects.
    mechanism: This is a descriptive model of how interaction design has expanded
      beyond traditional boundaries. The field now includes both digital and physical
      artifacts, with design principles applied across multiple domains and contexts.
      The model describes the organizational structure and scope of interaction design
      as a discipline that spans various media and application types.
    boundary: Applies to the evolving field of interaction design that includes both
      digital and physical design domains. Fails when applied to fields that do not
      involve user interaction or design of systems that respond to user input.
  expected_classification:
    depth: cross-domain
- id: 023f6d103c7edef4d1be11834d9316536b9db3289838d2932c9eadb6e2011d4f
  input_fb:
    name: Tradition-modernism Synthesis in Design
    definition: Effective graphic design can successfully integrate traditional aesthetic
      principles with modernist visual language by maintaining appropriateness and
      accessibility while incorporating classical models and subjective personal elements.
      This synthesis allows designers to honor historical foundations while embracing
      contemporary sensibilities.
    mechanism: This is a descriptive model of design approach rather than a causal
      mechanism. The principle describes how designers like Alvin Lustig navigated
      between opposing design philosophies by selecting and adapting elements from
      both traditions. The approach involves consciously choosing which traditional
      elements to preserve and how to blend them with modernist forms, creating a
      hybrid that serves the specific communicative needs of each project.
    boundary: Applies when a designer seeks to bridge historical and contemporary
      design sensibilities in a way that serves functional communication needs. Fails
      when the integration creates visual dissonance or when the designer cannot articulate
      a clear rationale for the synthesis.
  expected_classification:
    depth: domain
- id: 67a054d4e4495601b1e4bbc95e780aa9f5e8be6b3ab85c380477da3311aca92a
  input_fb:
    name: Aromatherapy for Brain Health and Memory
    definition: Using scents strategically to enhance brain function, create memory
      associations, and promote emotional well-being through the olfactory system's
      direct connection to memory and emotional centers.
    mechanism: The olfactory bulbs process scents and create memory trails that can
      last a lifetime, with scents linked to emotional centers of the brain that can
      immediately transport individuals to different emotional states or memories.
    boundary: Applies to individuals seeking to use aromatherapy for brain health
      benefits or memory enhancement. Fails when scents are not properly selected
      or when they conflict with medical treatments like chemotherapy.
  expected_classification:
    depth: cross-domain
- id: 1cc7f125a5c4ae0a4e0ccf936ff223a540122e992998d058ebde75e2c7374d6d
  input_fb:
    name: Business Metrics Monitoring Vs Model Monitoring
    definition: A principle distinguishing between business outcome monitoring and
      pure model performance monitoring in operational systems.
    mechanism: Business metrics monitoring captures real-world impact of system changes
      by tracking business KPIs like stockout rates, while pure model monitoring only
      evaluates model performance metrics like forecast accuracy without considering
      downstream execution impacts.
    boundary: Applies when operational systems have business impact beyond model performance.
      Fails when only model-level metrics are tracked without business outcome validation.
  expected_classification:
    depth: cross-domain
- id: 71de0ace9157131fadcba81429976962e89b718a58efa521061d3591bcdcf8a6
  input_fb:
    name: Technology Hijacking of Human Minds
    definition: Technology companies deliberately design products to hijack human
      attention and cognitive processes, similar to how addictive substances or harmful
      industries manipulate their users.
    mechanism: Technology companies create products that exploit psychological vulnerabilities
      and neural pathways to capture and retain user attention, treating users as
      consumers of addictive content rather than autonomous individuals.
    boundary: Applies to technology products specifically designed to maximize engagement
      through addictive mechanisms. Does not apply to beneficial or neutral technology
      use.
  expected_classification:
    depth: cross-domain
- id: 5c288a77ccb02f17203dff8bd8ce1d9e4936c811eefcb80a16ada71e26f9d884
  input_fb:
    name: Structural Analogy in Knowledge Transfer
    definition: The principle that structural patterns identified in one domain can
      be transferred and applied to understand phenomena in another domain, particularly
      when the underlying structures are similar despite differences in substantive
      content.
    mechanism: When a structural pattern is recognized in one domain (such as geological
      stratification from Lyell's work), it can be mapped to another domain (like
      biological speciation) to generate new insights, because the underlying structural
      relationships remain consistent even when the content differs.
    boundary: Applies when there is a recognizable structural similarity between domains.
      Fails when the domains have no structural overlap or when the substantive content
      is completely unrelated.
  expected_classification:
    depth: cross-domain
- id: bd4e449efe99bd7fdee396eb345f21bad79ce61f401b9d0c46f6a8173bc10158
  input_fb:
    name: Abstraction Level Rule of Thumb
    definition: A practical guideline for determining appropriate abstraction levels
      in problem-solving, suggesting that the right level of abstraction should allow
      for clear categorization without being overly granular or vague.
    mechanism: The rule suggests that when faced with multiple options that belong
      to different product categories, selecting a level of abstraction that encompasses
      these diverse options indicates proper conceptual framing.
    boundary: Applies when determining appropriate abstraction levels for categorization
      or problem-solving frameworks. Fails when the abstraction level is too granular
      or too broad for the specific context.
  expected_classification:
    depth: cross-domain
- id: 01932fe9615ae81ad644612ea3310128221e635cb628034746a2b2fcc09f86d5
  input_fb:
    name: Parametric Design System
    definition: A parametric design system is a structured approach to creative production
      that uses adjustable parameters to generate variations or configurations. These
      systems enable designers and artists to explore ranges of outputs while maintaining
      control over key variables, allowing for both systematic exploration and targeted
      refinement of results.
    mechanism: This is a descriptive model of how creative systems can be organized.
      A parametric system operates by defining variables (parameters) that control
      aspects of the output, such as shape, size, color, or arrangement. These parameters
      can be adjusted to produce different outcomes within a controlled range, enabling
      systematic variation and creative exploration. The system is structured as a
      set of interrelated variables that can be manipulated to achieve desired effects.
    boundary: Applies when creative works are generated through adjustable variables
      or controlled systems. Fails when outputs are produced through purely manual,
      non-systematic processes or when parameters are not clearly defined or modifiable.
      Also fails for systems where parameters are fixed or where the relationship
      between parameters and outputs is not understood or controlled.
  expected_classification:
    depth: domain
- id: 02307bf51b4b171e4923a371606e1a4d684973fea26779f6539c611dd80b43c9
  input_fb:
    name: Digital Financial Supermarket Model
    definition: A digital platform evolves from a specialized service provider into
      a comprehensive financial ecosystem that serves diverse user segments and merchant
      partners through integrated, scalable solutions. The model emphasizes rapid
      adaptation to user needs, leveraging technology to simplify transactions, and
      building trust through consistent value delivery.
    mechanism: The model works by starting with a core service (e.g., mobile wallet
      for bill payments) that addresses a specific user pain point (e.g., ease of
      mobile recharges). As the platform gains traction, it expands its scope to include
      broader financial services and merchant integration. This expansion is driven
      by user feedback, analytical insights, and a focus on speed and adaptability.
      The platform's success depends on its ability to maintain simplicity and accessibility
      while scaling to meet the needs of both individual consumers and business partners.
    boundary: Applies when a digital platform begins with a narrow focus and scales
      into a comprehensive service ecosystem. Fails when the platform lacks a clear
      initial value proposition or when it becomes too complex to maintain user trust
      and adoption.
  expected_classification:
    depth: domain
- id: 488f75afa034cbf02ad02064c41b057590f969d8e7f57bcfd07aa40e128abd98
  input_fb:
    name: Bottleneck System Impact
    definition: A system's performance is limited by its weakest component or constraint,
      which becomes the bottleneck that determines overall effectiveness. The principle
      identifies that improvements in other areas cannot compensate for a persistent
      bottleneck.
    mechanism: 'This is a descriptive model of system behavior: a system''s capacity
      or performance is determined by its most constrained element. When one component
      operates below capacity or efficiency, it restricts the throughput or output
      of the entire system. The bottleneck becomes the limiting factor regardless
      of improvements in other components, because system performance is constrained
      by the weakest link in the chain.'
    boundary: Applies to systems where components are interdependent and performance
      is constrained by a single limiting factor. Fails when components are independent
      or when the system is designed to be resilient to single points of failure,
      or when the bottleneck is temporary and self-correcting.
  expected_classification:
    depth: universal
- id: 36ee8888d46a0c5bcb5388c79a8a4bf7096506a0d31d0d28d0895543675a2fac
  input_fb:
    name: Freudian Marketing Research Method
    definition: A psychological research approach that applies Freudian analysis to
      understand consumer behavior and product symbolism, particularly in relation
      to emotional and unconscious purchasing motivations.
    mechanism: Freudian methods involve analyzing consumer responses to products through
      psychological frameworks that identify unconscious symbolic meanings and emotional
      triggers that drive purchasing decisions.
    boundary: Applies when marketing researchers seek to understand the psychological
      and emotional drivers behind consumer behavior beyond rational decision-making.
      Fails when Freudian analysis is not properly applied or when the psychological
      framework does not align with actual consumer behavior.
  expected_classification:
    depth: cross-domain
- id: f016a2dd284de8e631340fe97629389d7a5f4b7814234b0937eeec6d31f67d29
  input_fb:
    name: Community-driven Learning Amplification
    definition: When creators build learning communities around their expertise, the
      collective engagement and shared knowledge amplify the impact and financial
      returns of their educational content beyond traditional one-to-one client work.
      The principle describes how community formation transforms individual teaching
      into scalable, high-impact educational ecosystems.
    mechanism: 'This is a practical heuristic, not a causal mechanism: creating learning
      communities enables creators to leverage collective engagement and shared knowledge
      to amplify their educational content''s reach and value. The community acts
      as both a feedback loop for content refinement and a distribution network for
      amplification. Early community members who care provide crucial validation and
      growth momentum that traditional client work cannot match. The principle describes
      a method for scaling educational impact through community building, not a proven
      cause-effect chain.'
    boundary: 'Applies when creators can build engaged communities around their expertise
      and when the community provides feedback and amplification. Fails when: (1)
      community members don''t engage or provide meaningful feedback; (2) the community
      is too small to generate significant impact; (3) creators lack the ability to
      scale their content delivery beyond the initial community; (4) the community
      is not aligned with the creator''s expertise or teaching style.'
  expected_classification:
    depth: cross-domain
- id: b81dd2e1c358869b1cf51fe1905c59449a6aa8c077fe85b33a8801abe61eb76c
  input_fb:
    name: Critical Ethnography Transformative Impact
    definition: Critical ethnography produces systemic cognitive and social transformations
      in researchers and communities by shifting perspective, amplifying marginalized
      voices, and catalyzing collective action toward social change.
    mechanism: This is a descriptive model of how critical ethnography functions as
      a transformative practice. The approach systematically alters researchers' cognitive
      frameworks through immersive engagement with lived experience, while simultaneously
      providing platforms for marginalized groups to articulate their realities. The
      method creates cascading social effects through network formation and policy
      influence, operating as a bridge between field research and broader social transformation.
    boundary: Applies when critical ethnography is practiced as a deliberate transformative
      methodology rather than a neutral research technique. Fails when the approach
      is reduced to mere data collection or when researchers maintain detached, non-transformative
      perspectives throughout the study.
  expected_classification:
    depth: cross-domain
- id: 0081c944aef954a9ad34d53254b081bf79f3d20d2e9644bf440bb6665ef66441
  input_fb:
    name: Nature-inspired Design Philosophy
    definition: A design approach that emphasizes fluidity, accessibility, and meaningful
      communication in design work, drawing from natural forms and principles.
    mechanism: Designs that incorporate natural forms and processes become more fluid
      and accessible, making the message more relevant and useful to viewers while
      respecting materials and talents.
    boundary: Applies to design work that seeks to integrate natural principles with
      communication goals. Fails when natural forms don't align with the intended
      message or audience.
  expected_classification:
    depth: domain
- id: 2c301c03f642d7c93817a6a85cdbcef0a93c9a75709d56ca6a382082ac194493
  input_fb:
    name: Shared Reality Through Laughter
    definition: Laughter serves as a social signal that indicates shared perception
      of reality and fosters group connection. It functions as a mechanism for validating
      common understanding and creating collective emotional experience.
    mechanism: Laughter acts as a social connector by signaling that individuals share
      a common interpretation of reality. When people laugh together, they demonstrate
      alignment in their understanding of a situation or narrative, which strengthens
      social bonds and creates a sense of collective identity. This shared emotional
      response reinforces mutual recognition of the same underlying truth or meaning.
    boundary: Applies when laughter emerges from shared understanding or mutual recognition
      of a situation. Fails when laughter is used for self-deprecation, social exclusion,
      or as a defensive mechanism rather than genuine connection.
  expected_classification:
    depth: cross-domain
- id: 0283b54c5379782cc2cecbb52b69c86c83b549be7d98189ffdd4948707e9be0e
  input_fb:
    name: Interleaving Experiments for A/b Testing
    definition: Interleaving experiments is a method for comparing multiple machine
      learning models by showing recommendations from different models to users in
      a randomized fashion, allowing direct user preference measurement.
    mechanism: Recommendations from different models are interleaved at random positions
      to ensure equal probability of selection, enabling measurement of user preferences
      rather than just core metrics like retention or streaming.
    boundary: Applies when comparing multiple ML models in production where direct
      user preference measurement is desired. Fails when user position bias cannot
      be controlled or when the randomization mechanism is not properly implemented.
  expected_classification:
    depth: specialized
- id: cc0e52becb81b8643dd9c6cd03394861befdc2afba394138538883bf3f7b31a1
  input_fb:
    name: Conceptual Metaphor Visualization
    definition: Visual representations of abstract concepts can be effectively communicated
      through concrete imagery, metaphors, or illustrative elements that make abstract
      ideas more accessible and memorable to audiences. The principle describes a
      method for translating conceptual content into visual form that enhances understanding
      and retention.
    mechanism: 'This is a practical heuristic for communication design: using concrete
      visual metaphors or illustrations to represent abstract concepts increases audience
      comprehension and engagement. The approach leverages the human brain''s natural
      tendency to process visual information more efficiently than text alone, particularly
      when the visual element directly connects to the conceptual meaning through
      familiar associations or analogies.'
    boundary: Applies when abstract concepts need to be communicated to audiences
      who benefit from visual learning or when the audience's attention span is limited.
      Fails when the audience is highly specialized and already familiar with the
      abstract concepts, or when the visual metaphor is too obscure or culturally
      specific to be universally understood.
  expected_classification:
    depth: cross-domain
- id: 65d04f4bfe90d7ede2a24022227c267976bd6546b0339013f146611fea158e07
  input_fb:
    name: Sacred Color As Divine Communication
    definition: Colors in religious contexts function as symbolic vehicles that convey
      divine meaning and spiritual truth, operating as mediators between the earthly
      and the sacred. This principle describes how specific colors are imbued with
      theological significance that transcends their physical properties to communicate
      sacred narratives and divine order.
    mechanism: Colors acquire sacred meaning through their association with divine
      attributes, spiritual concepts, and religious narratives rather than through
      direct visual perception. The symbolic power of color emerges from its role
      in liturgical practice, theological interpretation, and the broader cultural
      understanding of how material elements can embody immaterial spiritual realities.
      This process involves the transformation of physical color into a medium for
      divine communication through religious doctrine and ritual.
    boundary: Applies when colors are embedded within religious or sacred contexts
      where they carry theological significance beyond their aesthetic properties.
      Fails when color is used purely for decorative or secular purposes without spiritual
      or symbolic intent.
  expected_classification:
    depth: cross-domain
- id: b1f8fc92f2901c3026c97789ed2c96a692645e5a1da08408eebd6e0e66e3006c
  input_fb:
    name: Community-centered Birth Care Model
    definition: A holistic approach to childbirth that integrates family-centered
      prenatal care, community support during labor, and continuous post-partum care
      within a dedicated local birth facility.
    mechanism: The model creates a specialized environment where childbirth is treated
      as a natural, eventful moment requiring community involvement, with trained
      midwives providing continuous care from prenatal through post-partum periods.
    boundary: Applies to communities seeking to restore ritual and family-centered
      approaches to childbirth. Fails when community support systems are absent or
      when medical emergencies require hospital-level intervention.
  expected_classification:
    depth: cross-domain
- id: 010f4e6de05203d6ad9472395beca90820bca73e76dc1a4730aaa350135822bc
  input_fb:
    name: Controlled Output Generation for Ai Agents
    definition: AI agents can be constrained to generate outputs only from specific,
      controlled sources rather than from general training data. This approach ensures
      that responses are accurate, up-to-date, and aligned with organizational knowledge
      bases or authoritative sources.
    mechanism: 'This is a practical design approach: constraining agent outputs to
      approved databases, content libraries, and knowledge bases prevents generation
      of unverified or outdated information. The agent retrieves relevant data from
      these sources instead of synthesizing from general training, ensuring that responses
      reflect current and authoritative content.'
    boundary: Applies when organizations have centralized knowledge repositories or
      authoritative data sources that can be queried by agents. Fails when the required
      information is not available in structured databases or when real-time synthesis
      from general knowledge is necessary for dynamic decision-making.
  expected_classification:
    depth: domain
- id: 1f65e48908aeeed8d24db40ebd782d1475e8760703c85599330635f38f2231b0
  input_fb:
    name: Text-structure Semiotic Mediation
    definition: The meaning of textual and multimodal works emerges through the interplay
      between structural elements and semiotic systems that mediate between form and
      content, enabling interpretation through shared knowledge frameworks and reasoning
      processes.
    mechanism: Textual meaning is not inherent but constructed through the dynamic
      relationship between formal structure (lineation, chapters, montage) and semiotic
      systems (semantic domains, subjectivities, encyclopedic knowledge). Structural
      elements deform or subordinate syntactic and semantic connections, while the
      meaning of individual elements is constituted through heterogeneous discourse
      and organized bodies of knowledge rather than isolated signification.
    boundary: Applies when textual works require mediation between formal elements
      and semiotic systems for interpretation. Fails when meaning is self-contained
      or when structural elements are purely functional without semantic implications.
  expected_classification:
    depth: cross-domain
- id: 002b5832b31c9901328849a6c27df3aab0ee0efac2b2102c4b9662e806db5349
  input_fb:
    name: Bridge Between Scientific Rigor and Real-world Applicability
    definition: A principle that AI systems and engineering practices should bridge
      the gap between theoretical scientific rigor and practical operational implementation.
    mechanism: The principle advocates for applying established scientific foundations
      (like SWEBOK principles) to guide the development and deployment of AI systems
      in real-world contexts, ensuring that theoretical knowledge translates into
      practical benefits.
    boundary: Applies when AI systems need to balance theoretical soundness with practical
      implementation. Fails when either pure theory or pure practice dominates without
      integration.
  expected_classification:
    depth: cross-domain
- id: e236d31210d80a372503977bea18289cb5c220fa5a16562e9d7a039f43d4d7a8
  input_fb:
    name: Creative Commons Ecosystem Value
    definition: The principle that innovation in technology communities is enhanced
      when creators build upon each other's work in a shared creative commons, where
      every contribution enriches the entire ecosystem.
    mechanism: Innovation ecosystems grow stronger when creators share their work
      freely, allowing others to build upon it, creating a cumulative effect where
      every contribution - even failures - adds value to the collective knowledge
      base.
    boundary: Applies to open innovation spaces where sharing is encouraged and every
      contribution is valued. Fails when innovation is driven by proprietary competition
      or when individual contributions are not shared.
  expected_classification:
    depth: cross-domain
- id: d973d3504373a9d05c06fe55fa50dc5a3e946eec89777f04adee8c51217cdc0c
  input_fb:
    name: Standardized Visual Identity Through Grid Systems
    definition: Grid-based compositional systems enable the creation of standardized
      visual identities that can be consistently applied across diverse media and
      formats, from architectural structures to typography and industrial design.
      This approach allows for the systematic integration of functional and aesthetic
      elements in mass-produced goods and communications.
    mechanism: "The principle operates through the application of geometric and mathematical\
      \ relationships\u2014such as those derived from squares and circles\u2014to\
      \ create modular frameworks that support both structural coherence and visual\
      \ rhythm. These systems provide a methodological foundation for organizing design\
      \ elements in a way that enables repetition, scalability, and uniformity across\
      \ different media and contexts."
    boundary: Applies when design systems require consistency across multiple formats
      or media, particularly in industrial or commercial contexts. Fails when design
      must prioritize individual artistic expression or when media constraints prevent
      modular application of grid structures.
  expected_classification:
    depth: cross-domain
- id: 8519c5dafbd60e1570e745722155fd97da4e8b009bc00ae7c648c0ceb41d8b4a
  input_fb:
    name: Semiotics As Interdisciplinary Field
    definition: Semiotics emerges as a cross-disciplinary field that synthesizes insights
      from phenomenology, ontology, and linguistics to analyze signs, symbols, and
      meaning-making processes. The field is characterized by its theoretical pluralism
      and methodological flexibility, drawing from diverse academic traditions.
    mechanism: Semiotics operates as an interdisciplinary framework that integrates
      concepts and methods from multiple philosophical and linguistic traditions.
      It functions through the analysis of sign systems and their interpretive structures,
      allowing researchers to examine meaning-making across different domains and
      contexts. The field's strength lies in its capacity to bridge theoretical approaches
      and practical applications.
    boundary: Applies when semiotic analysis is used to examine systems of signs,
      symbols, or meanings across different domains. Fails when the approach is limited
      to single theoretical traditions or when applied to phenomena outside the scope
      of sign analysis.
  expected_classification:
    depth: cross-domain
- id: 12dc095a8c1f08f9fd2c87f5f8b24239bb2dd9c8bfcbad55976ce8cd36775450
  input_fb:
    name: Metaphorical Cognitive Mapping
    definition: Metaphor serves as a fundamental cognitive tool that enables conceptual
      understanding by mapping structure and meaning from familiar domains to unfamiliar
      ones. This process operates through metonymic relationships where elements within
      a category can substitute for one another, and through image schema logic that
      structures abstract reasoning.
    mechanism: Metaphor functions as a cognitive bridge that transfers semantic properties
      from source domains to target domains through structural alignment. The metonymic
      aspect allows for interchangeable representation within conceptual categories,
      while image schemas provide the foundational spatial and relational structures
      that guide abstract reasoning. These mappings are not arbitrary but emerge from
      shared structural properties and neural processing patterns that connect concrete
      experience to abstract thought.
    boundary: Applies when conceptual domains share structural or relational properties
      that enable mapping. Fails when domains lack sufficient overlap in structure,
      meaning, or experiential grounding to support meaningful metaphorical transfer.
      Also fails when the metaphorical mapping creates contradictions or breaks the
      cognitive coherence of either domain.
  expected_classification:
    depth: cross-domain
- id: b3caff68aaf5e73e56de97958e3aeda9fade1dd786be1af643541091d9fb53dc
  input_fb:
    name: Structural Parasitism in Systems
    definition: When systems fail to adequately address structural imbalances or power
      dynamics, they create conditions where parasitic behaviors emerge and thrive,
      often at the expense of the broader system's health and stability. This principle
      describes how systemic weaknesses enable exploitation and dysfunction.
    mechanism: Structural parasitism occurs when system components or actors exploit
      inherent asymmetries or gaps in governance, resource distribution, or decision-making
      processes. These conditions allow for the emergence of behaviors that are fundamentally
      destructive to system integrity, whether through financial manipulation, social
      control, or political capture. The mechanism operates through the amplification
      of existing inequalities or the creation of new dependencies that benefit certain
      actors at the system's expense.
    boundary: Applies when system structures enable or incentivize exploitation, particularly
      in contexts of resource scarcity, power concentration, or regulatory gaps. Fails
      when systems have robust checks and balances, transparent governance, or equitable
      distribution mechanisms that prevent parasitic behaviors from taking root.
  expected_classification:
    depth: cross-domain
- id: 312e658fee5507699a4298ce60f2e8888823be32dbeeb154da97a2479e80aea7
  input_fb:
    name: Adaptive Policy Design Through Feedback
    definition: Effective system policies are most successful when they incorporate
      feedback mechanisms that adapt to system states and include meta-feedback loops
      capable of modifying, correcting, and expanding existing loops. These policies
      are designed to embed learning into the management process rather than relying
      on static approaches.
    mechanism: 'This is a normative heuristic describing an effective approach to
      policy design: adaptive policies that respond dynamically to system conditions
      and incorporate feedback loops enable continuous adjustment and improvement.
      The principle prescribes a method for managing complex systems by designing
      in responsiveness and learning capacity rather than fixed interventions.'
    boundary: Applies when system behavior is uncertain or subject to change over
      time. Fails when system conditions are stable and predictable, or when policies
      cannot be adjusted in response to feedback signals.
  expected_classification:
    depth: cross-domain
- id: 5b5433f41b3d966bf10f857e977820ec8a8ea3e389b102946a6b09d1333f1f2a
  input_fb:
    name: Hunger Games Story Framework
    definition: A narrative structure that demonstrates how the classic hero's journey
      can be applied to understand customer decision-making and business communication.
    mechanism: The framework uses the familiar Hunger Games story to illustrate how
      customers navigate their own decision-making journey, identifying the hero (customer),
      problem (stake), and solution (mentor and plan) that guide their choices.
    boundary: Applies to storytelling and marketing contexts where businesses want
      to understand how customers make decisions by mapping their journey to familiar
      narrative structures. Fails when the story elements don't accurately reflect
      the actual customer experience or when the framework is applied too rigidly
      to diverse customer segments.
  expected_classification:
    depth: cross-domain
- id: 1e1aa4c286cecc56dd34e40f471b5ce624606cfb7ed9fb225724c7a8cca80323
  input_fb:
    name: Contextual Selection in Text Interpretation
    definition: A principle describing how readers interpret textual meaning through
      contextual selection that connects received expressions with the circumstances
      of utterance and external environmental factors.
    mechanism: When readers encounter text, they must select relevant contextual information
      (historical period, cultural context, external environment) to understand semantic
      properties and make meaningful connections between the text and its circumstances,
      requiring multiple semantic analyses and amalgamation of data.
    boundary: Applies when readers must connect textual meaning to external contextual
      factors and circumstances. Fails when readers have no access to external context
      or when the text is completely self-contained.
  expected_classification:
    depth: specialized
- id: dac62dba3cbdeedbcd50b18759b810117b6d520e850fdabcb94ec117fb9b68ba
  input_fb:
    name: Peirce's Cosmological Framework and Evolutionary Theory
    definition: Peirce's cosmological framework integrates evolutionary theory with
      his philosophical concepts of habit, law, and mind, proposing a three-stage
      evolutionary process.
    mechanism: 'The cosmological process follows three stages: chance (first), law
      (second), and habit (third) for the fundamental order of the universe; and mind
      (first), matter (second), and evolution (third) for the fundamental order of
      consciousness and reality.'
    boundary: Applies to Peirce's specific cosmological framework that integrates
      evolutionary theory with philosophical principles. Fails when applied to other
      cosmological or evolutionary models.
  expected_classification:
    depth: cross-domain
- id: cc5929d266bad1dc175be09f904fb92405dc02ffd75507143017858240696749
  input_fb:
    name: Breakthrough Velocity Strategy
    definition: A framework for achieving significant life or business breakthroughs
      by overcoming inertia and applying focused energy toward clear goals.
    mechanism: The strategy involves recognizing that maintaining the status quo requires
      constant energy to resist gravitational forces, while achieving breakthroughs
      requires reaching escape velocity through focused action and clear goal-setting.
    boundary: Applies to individuals or organizations seeking significant change or
      improvement from their current state. Fails when the individual lacks the energy
      or resources to achieve the required velocity or when goals are unclear or unattainable.
  expected_classification:
    depth: cross-domain
- id: 02f9a45f254b2fa016accae6881eea51dd9031da66320f23549c6687717fb324
  input_fb:
    name: Systemic Brand Identity
    definition: A comprehensive brand identity is constructed not from a single visual
      element but from a complete system of interrelated design components that collectively
      communicate the brand's essence and value proposition across multiple touchpoints
      and audiences.
    mechanism: This is a descriptive model of brand system composition, not a causal
      mechanism. A systemic brand identity consists of multiple integrated elements
      (logos, iconography, typography, color systems, messaging frameworks) that work
      together to create a cohesive and distinctive brand experience. The system approach
      recognizes that modern branding requires a holistic framework rather than isolated
      visual elements.
    boundary: Applies to complex brand initiatives that must communicate across multiple
      audiences and channels. Fails when a brand is reduced to a single logo or visual
      element without supporting system components, or when the system lacks coherence
      between its various components.
  expected_classification:
    depth: domain
- id: 2544ccf54c625f72d34f26c8c8662b37bf81fedad71652136ea477439df6a865
  input_fb:
    name: Extraordinary Achievement Through Ordinary Means
    definition: Extraordinary accomplishments are achieved by using ordinary methods
      but with a deviant mindset that transforms social pressures into confidence
      and enables the organization and leadership of innovative ideas.
    mechanism: The deviant mindset reframes social pressures and expectations as sources
      of strength rather than obstacles, allowing individuals to transcend conventional
      limitations and implement unconventional ideas effectively.
    boundary: Applies when individuals can genuinely transform social pressures into
      confidence and when the deviant mindset enables practical implementation of
      ideas. Fails when the mindset is merely theoretical or when social pressures
      are too overwhelming to reframe.
  expected_classification:
    depth: cross-domain
- id: 1f07e5000861d1fefe8e7750197ffb401eb5ab684de4b98f1172b54c9e1a27a7
  input_fb:
    name: Ai-enhanced Survey Methodology
    definition: The integration of machine learning algorithms into survey design
      and analysis to improve data collection quality and policy-relevant insights
      by identifying effective question formats and response patterns.
    mechanism: Learning algorithms analyze historical survey data to identify which
      questions, phrasings, and response patterns correlate with higher-quality policy-relevant
      data, then recommend optimal survey designs based on these patterns.
    boundary: Applies when survey data has sufficient historical performance records
      for algorithmic analysis. Fails when surveys lack sufficient past data or when
      policy contexts change too rapidly for historical patterns to remain relevant.
  expected_classification:
    depth: specialized
- id: 0380358c6bb42d9c5821f55ac2b77b0770a4f3064506ca0921d2c0fa4dc01c12
  input_fb:
    name: Innocent Brand Identity Through Organic Development
    definition: A brand identity that emerges organically from spontaneous creative
      decisions and employee engagement rather than planned marketing strategies.
    mechanism: Brand elements develop through accidental discoveries and grassroots
      creative decisions, with the organization's tone of voice and messaging style
      emerging from chance innovations and employee-driven initiatives rather than
      top-down marketing planning.
    boundary: Applies to organizations that embrace spontaneous creative moments and
      employee-driven innovation. Fails when organizations cannot maintain consistency
      or when spontaneous approaches conflict with business objectives.
  expected_classification:
    depth: domain
- id: 50e97ab843faf8b97f5802b6119e4212202ff5e29d54795a2bd11a5e8c795dc8
  input_fb:
    name: Energetic Being Concept
    definition: A metaphysical principle that all matter and living beings are fundamentally
      composed of energy and electric charges interacting with electromagnetic fields.
    mechanism: According to this principle, all physical matter is ultimately composed
      of electric charges interacting with electromagnetic fields, making all beings
      energetic entities connected to each other through these fundamental forces.
    boundary: Applies to metaphysical interpretations of physical reality and consciousness.
      Fails when scientific evidence contradicts the principle that all matter is
      fundamentally energy.
  expected_classification:
    depth: universal
- id: 01dc82b2a155729291c4154fa1af9356caa8c628523d98a46cb0b45ce6094462
  input_fb:
    name: Tension As Adaptive Response
    definition: Tension emerges as a psychological and social mechanism that signals
      adaptive responses to uncertainty, change, or internal conflict. It functions
      as a signal that something is shifting or requires attention, often manifesting
      as anxiety, fear, or discomfort but serving as a catalyst for behavioral adjustment.
    mechanism: Tension arises when individuals or systems encounter uncertainty or
      transition, creating a psychological state that signals the need for action
      or adaptation. It is not merely fear but a dynamic state that can drive engagement,
      learning, or behavioral change. Tension can be internal (as in personal anxiety
      or procrastination) or external (as in social pressure or market disruption),
      and it often manifests as a signal that a threshold has been crossed or a new
      condition is emerging.
    boundary: Applies when uncertainty, change, or conflict creates a psychological
      or social signal that prompts adjustment. Fails when tension is purely pathological
      or unresponsive to change, such as chronic anxiety without adaptive function
      or static environments where no shift occurs.
  expected_classification:
    depth: domain
- id: 85487872bbced71f2841f05e7a2edeb2d7e4fb5d7e3eef90aec34c6efc1e0cd3
  input_fb:
    name: Corporate Identity Projects As Political Critique
    definition: Commercial corporate identity projects that critique the political
      implications of blurring boundaries between consumerism and citizenship, particularly
      when social software is adopted by governments for transparency and interaction.
    mechanism: "These projects use corporate design aesthetics and branding frameworks\
      \ to expose how consumerist logic\u6E17\u900F into civic spaces, revealing how\
      \ government adoption of social software transforms democratic participation\
      \ into market-driven engagement."
    boundary: Applies specifically to artistic/critical projects that use corporate
      identity design as a medium for political commentary. Fails when the project
      is purely commercial or lacks political critique.
  expected_classification:
    depth: cross-domain
- id: 1f5a16b95aa1fdf2bf7c6a283d5ff9faf2e7a3e49c14b527d179a7169ed9112c
  input_fb:
    name: Darwinian Prioritization
    definition: A method for prioritizing tasks and projects based on external influence
      and natural selection principles, where the more frequently something is mentioned
      or requested, the more likely it is to receive attention.
    mechanism: The process works through natural selection where repeated mentions
      or requests increase the likelihood of focus, with the principle that 'the more
      we hear about things, the more likely we are to focus on them,' which can be
      understood as a form of social selection or peer pressure.
    boundary: Applies when individuals or teams need to make decisions about priorities
      in the presence of external pressures and competing demands. Fails when the
      external influences are not aligned with strategic goals or when the process
      becomes dominated by noise rather than meaningful signals.
  expected_classification:
    depth: cross-domain
- id: 5245e6ed9e17687633ad1b1634d631938fad0f3b12c41869dbadee7fe054ffa9
  input_fb:
    name: Story Acceptance in Legal Contexts
    definition: Jurors evaluate legal narratives by comparing them to their own internally
      constructed stories, accepting those that align most closely with their personal
      narrative framework.
    mechanism: Mock jurors form their own mental narratives during trials, and subsequently
      judge the prosecution and defense stories based on how well these align with
      their pre-existing story structures rather than objective legal merits.
    boundary: Applies specifically to jury evaluation processes in legal contexts
      where jurors construct personal narratives. Does not apply to objective legal
      analysis or factual evidence evaluation.
  expected_classification:
    depth: cross-domain
- id: bacd39b9434d3a0453c818d4b2e65d09e327c4c0a7062a513a5b8c18e0c3c67e
  input_fb:
    name: Energy As a Transformative Idea
    definition: The concept of energy as an abstract principle that underpins technological
      advancement and industrial development, particularly the Industrial Revolution.
    mechanism: The abstraction of energy as a measurable physical property enables
      systematic thinking about mechanical work and technological efficiency, making
      it possible to develop science-based technologies that drive industrial progress.
    boundary: Applies to the historical development of scientific understanding and
      technological application in industrial contexts. Fails when applied to non-physical
      or non-mechanical systems where energy concepts don't directly apply.
  expected_classification:
    depth: universal
- id: 88572c0adb4382d247daa4a874a2189f90085438dece1c319067086c4f52ce00
  input_fb:
    name: Narrative Structure Universals
    definition: Folk narratives follow a universal structural pattern characterized
      by a limited set of narrative units that combine according to fixed rules to
      create diverse stories. These units form a plot grammar that transcends cultural
      and temporal boundaries.
    mechanism: Vladimir Propp's structural analysis identified 31 fundamental narrative
      functions that operate as combinatory building blocks in folk narratives. These
      functions are not causally linked but form a systematic grammar where specific
      roles (hero, villain, donor, helper) and actions (departure, quest, return)
      are arranged according to predictable sequences. The same 31 elements can be
      rearranged to create countless variations while maintaining the underlying structural
      coherence.
    boundary: Applies to traditional folk narratives and fairy tales that follow the
      classic hero's journey pattern. Fails for modern literary fiction that eschews
      structural constraints, experimental narratives that reject conventional plot
      grammar, or non-narrative forms like poetry or pure documentary.
  expected_classification:
    depth: cross-domain
- id: 240a361bd448ed07ba70a26d47874bf69f4fd36e64a408e6defede79013f1528
  input_fb:
    name: Soft Prompt Compression
    definition: A technique for reducing the length of prompts while preserving their
      semantic content and instructional intent, particularly in natural language
      processing and AI prompting systems.
    mechanism: The process involves identifying and retaining the core semantic elements,
      key instructional phrases, and essential constraints from a longer prompt while
      eliminating redundant or less critical components, thereby maintaining the original
      prompt's functional effectiveness in guiding AI responses.
    boundary: Applies when prompts contain redundant phrasing, excessive detail, or
      repetitive elements that can be distilled without losing instructional clarity.
      Fails when the removed elements are semantically essential or when the compression
      removes critical constraints that define the desired response scope.
  expected_classification:
    depth: specialized
- id: a209d83fd6f1dd109aa65878c22e687868afc2a23a1554f1fa2386a3f4f166ec
  input_fb:
    name: Procrustean Bed of Modernity
    definition: A metaphor for the harmful effects of over-stabilization and the removal
      of natural stressors from systems, which makes them more fragile and vulnerable
      to cascading failures.
    mechanism: Systems that are denied stressors and randomness become overly comfortable
      and lose their natural antifragility, similar to how Procrustes forced travelers
      to fit his bed by cutting or stretching them to match its dimensions, ultimately
      harming the system's natural resilience.
    boundary: Applies to social, political, and economic systems that are overly stabilized
      or protected from natural stressors. Fails when systems are properly protected
      from genuine threats rather than just random stressors.
  expected_classification:
    depth: cross-domain
- id: e9973d8fd57c2af80f63d1cfd70b8e612bfb75cca4bdeede193ed5191b330448
  input_fb:
    name: Appetite Metaphor
    definition: The concept of 'appetite' is used metaphorically to describe intense
      desire or insatiable need, particularly in contexts of creative output or competitive
      performance. The metaphorical use of appetite conveys both positive and negative
      dimensions of desire.
    mechanism: The metaphorical use of 'appetite' operates as a structural analogy
      that maps the psychological experience of desire onto the physical concept of
      hunger. In the passages, 'appetite' is applied to describe Bob Hope's creative
      output (insatiable desire for jokes) and competitive performance (javelin competitor
      who won the toss). The metaphor functions by transferring the sensory and emotional
      qualities of hunger to abstract psychological states.
    boundary: Applies when desire or need is described using the metaphorical framework
      of appetite, particularly in contexts of creative production or competitive
      performance. Fails when the metaphor is not explicitly stated or when the concept
      of desire is described through other analogies or direct language.
  expected_classification:
    depth: cross-domain
- id: 7d748c4d1bb1410359080ecc5783d90a10de97df6f5994dd93a19675838c03cf
  input_fb:
    name: Five Whys Research Method
    definition: A research technique that involves asking 'Why?' at least five times
      to understand the root cause of problems or design challenges.
    mechanism: The method systematically asks 'Why?' questions in succession to drill
      down to fundamental understanding of design problems, enabling solutions that
      address underlying issues rather than surface symptoms.
    boundary: Applies to research processes where root cause analysis is needed to
      understand design challenges. Fails when the method is not applied systematically
      or when only surface-level questions are asked.
  expected_classification:
    depth: cross-domain
- id: 7e4c7ee301303bf78c8a07fb1be78cdbe1a56ab8e3b6ad57125548efd6b457ae
  input_fb:
    name: Symbolic Representation Transfer
    definition: A cognitive mechanism where symbols representing concepts in one's
      brain can be borrowed and reactivated by subsystems or other minds, potentially
      with different usage patterns than in the original context.
    mechanism: Conceptual symbols stored in neural representations can be activated
      and transferred to other subsystems or minds, where they may be reinterpreted
      or applied in novel contexts while maintaining core semantic relationships.
    boundary: Applies when symbols can be borrowed and reactivated across different
      neural or cognitive systems. Fails when symbols are strictly bound to their
      original neural context or when the borrowing system lacks the necessary conceptual
      framework.
  expected_classification:
    depth: cross-domain
- id: 529fa7aca86e3369c3da5a5beef7d7948d38516e791049ce070506290c141d98
  input_fb:
    name: Polysemic Life Pattern
    definition: A developmental pattern where individual behavior and life circumstances
      can be understood as a polysemic sample that reflects broader patterns of personal
      integration or disintegration.
    mechanism: Personal behavioral patterns and life choices can be interpreted as
      multiple valid representations of the same underlying conflict or integration
      challenge, where the same situation can be understood in multiple ways depending
      on the level of analysis.
    boundary: Applies to behavioral patterns that can be interpreted at multiple levels
      of meaning. Fails when the pattern does not exhibit multiple valid interpretations
      or when the situation lacks the necessary complexity for polysemic analysis.
  expected_classification:
    depth: cross-domain
- id: 019833377fec598ce6c0562af64b8438fb1d89f9cc4684671947962719aa2364
  input_fb:
    name: Creative Brief Method
    definition: A structured process for brand naming that involves defining brand
      identity, listing preferred and disliked industry names, and creating a framework
      for creative brainstorming.
    mechanism: The creative brief serves as a foundational document that clarifies
      brand purpose, personality, and messaging direction, providing a structured
      approach to name generation that prevents poor decision-making.
    boundary: Applies to organizations seeking to make informed, strategic decisions
      about brand naming through systematic process rather than ad-hoc brainstorming.
      Fails when teams skip the brief or don't use it as a decision-making framework.
  expected_classification:
    depth: domain
- id: 31ea1edc1ef97eb081c3db3364fc767df76b77a9b5a841d3272c7c14d7201cd1
  input_fb:
    name: Piero Della Francesca's Mathematical Treatises
    definition: A collection of mathematical treatises by Piero della Francesca that
      explore the relationship between mathematical constructions and reality, including
      perspective drawing and geometric principles.
    mechanism: These treatises systematically examine mathematical principles for
      representing reality in art, particularly focusing on perspective drawing and
      the geometric relationships between mathematical constructions and physical
      forms.
    boundary: Applies to Renaissance mathematical and artistic treatises that bridge
      mathematical theory with visual representation. Fails when mathematical principles
      are not applied to artistic or architectural representation.
  expected_classification:
    depth: cross-domain
- id: a91dbbcda67e396082955eafeb9d265f86e05d61ca77f9cda4d22b9dc2e27cde
  input_fb:
    name: Color As Cultural and Philosophical Construct
    definition: Color is simultaneously a perceptual phenomenon and a culturally and
      philosophically constructed concept, shaped by mathematical relationships, subjective
      experience, and historical interpretation. The understanding of color transcends
      pure visual perception to encompass symbolic meaning, philosophical debate,
      and cultural norms.
    mechanism: 'Color is understood through multiple lenses: as a physical phenomenon
      governed by mathematical relationships (e.g., Pythagorean harmony), as a subjective
      sensory experience that cannot be fully captured by objective measurement (Mary''s
      epistemic challenge), and as a culturally constructed symbol with historical
      associations (e.g., Western reverence for white in classical art). These dimensions
      interweave to shape how color is perceived, valued, and interpreted across different
      contexts.'
    boundary: Applies when color is understood within systems that integrate perception,
      philosophy, and culture. Fails when color is considered purely in terms of physical
      properties or objective visual science without regard to human interpretation
      or historical context.
  expected_classification:
    depth: cross-domain
- id: 024430c08b08e9aedf37fdb5c844709d2cf4000b49eafacfeee8101cdd183930
  input_fb:
    name: Computational Face Generation
    definition: A computational approach to creating faces using algorithms that map
      data variables to facial features, enabling the generation of visual representations
      that can be used for artistic, data visualization, or memorial purposes.
    mechanism: The technique uses mathematical algorithms to translate data variables
      into facial features, with each feature (eyes, ears, mouth, nose) representing
      specific data dimensions through shape, size, placement, and orientation, allowing
      for the creation of faces that embody complex information or conceptual themes.
    boundary: Applies to computational art and design contexts where data visualization
      or conceptual representation requires facial imagery. Fails when the algorithmic
      mapping does not produce recognizable or meaningful facial features.
  expected_classification:
    depth: cross-domain
- id: 02edd278343c31f081949702ea0fb91832819a5e95a90d94b9e7f4a22a3d7446
  input_fb:
    name: Adversarial Robustness of Pretrained Networks
    definition: An empirical observation that even highly reliable pretrained networks
      like Inception V3 and ResNet-50 fail on adversarial examples generated from
      simple noise distributions.
    mechanism: Pretrained image classification networks like Inception V3 and ResNet-50
      show significant failure rates when tested with adversarial examples generated
      from Gaussian noise, demonstrating vulnerabilities in these models.
    boundary: Applies to evaluation of pretrained networks against adversarial examples.
      Fails when the network is properly trained or when the adversarial attack is
      not properly applied.
  expected_classification:
    depth: domain
- id: d5bbdb509dbc7c23a34619bf8b460c7a150674e53137309f870e9fd5a21dd1e9
  input_fb:
    name: Ai Integration in Everyday Life
    definition: Artificial intelligence has quietly become embedded in daily routines
      and societal systems, despite public concerns about misinformation, job displacement,
      and security risks. This integration occurs through both specialized applications
      and broader systemic transformations that enhance efficiency and user experience.
    mechanism: AI systems are increasingly integrated into everyday technologies and
      services, operating at the intersection of human needs and computational capabilities.
      These systems often begin as narrow AI solutions developed in academic or research
      settings, then become widely adopted through open-sourcing and commercial implementation.
      Their integration is facilitated by data capture advancements and the development
      of more context-aware systems that can understand human behavior and environmental
      cues.
    boundary: Applies when AI systems are embedded in daily routines or societal infrastructure,
      such as smart cities, virtual assistants, or automated decision-making tools.
      Fails when AI remains isolated in specialized research environments or is not
      integrated into human workflows and daily practices.
  expected_classification:
    depth: cross-domain
- id: 261b39cfe00dc3afb6036c6621e9d6c1c15184ad0b9d151868c44f2b21bb3fab
  input_fb:
    name: What/how Distinction in System Comparison
    definition: A principle distinguishing between 'what' (the system's purpose or
      function) and 'how' (the method or process) when comparing systems, which has
      proven crucial for understanding system behavior in research studies.
    mechanism: The distinction creates a framework for analyzing systems by separating
      their functional purpose from their operational methods, allowing researchers
      to understand how different approaches to the same problem can yield different
      outcomes.
    boundary: Applies specifically to system comparison research where both functional
      and methodological aspects need to be analyzed separately. Fails when the distinction
      is not maintained or when only one aspect is considered.
  expected_classification:
    depth: cross-domain
- id: 874b3bc6505d669c5b46473e570512ec5395b341f4b63bb0a89e295c9783fd28
  input_fb:
    name: Monolithic Building Social Impact
    definition: Monolithic buildings deny the natural social grouping patterns of
      people and force them to adapt to less human social structures instead of allowing
      personal relationships and human contact to flourish.
    mechanism: The architectural form of monolithic buildings creates an impersonal
      environment that disrupts natural human social interactions and transforms human
      relationships into mechanical, interchangeable exchanges.
    boundary: Applies to architectural design that creates monolithic structures.
      Fails when buildings are designed to support human social interaction and personal
      relationships.
  expected_classification:
    depth: cross-domain
- id: 8cf60901205a6dfedbea513b37c84ea16dad657317d70b9bf69f05e3fcacc506
  input_fb:
    name: Community-centered Research in Refugee Camps
    definition: Research approaches that involve community members directly in the
      design and feedback process for humanitarian interventions in refugee camps.
    mechanism: The approach uses visual methods like sketches, drawings, and virtual
      reality to capture community needs and preferences, with researchers working
      alongside camp residents to develop solutions that address actual living conditions.
    boundary: Applies to humanitarian design and research in extreme environments
      like refugee camps. Fails when community voices are not meaningfully included
      in the design process.
  expected_classification:
    depth: cross-domain
- id: 532083f00e8d05d5a2fc0aa404869ecd2a3a64b2b8227098e562d1466a55457f
  input_fb:
    name: Cybernetic Control and Communication Framework
    definition: Cybernetics is a cross-domain theoretical framework that describes
      systems of control and communication in both machines and living organisms.
      It provides a foundational model for understanding how feedback mechanisms regulate
      behavior and maintain stability across diverse domains.
    mechanism: Cybernetics operates as a descriptive model that categorizes systems
      by their control and communication characteristics. It defines a universal framework
      for analyzing feedback loops, regulatory mechanisms, and information processing
      in biological, mechanical, and social systems. The framework is not causal in
      nature but rather a structural classification of how systems maintain homeostasis
      and adapt to environmental changes through closed-loop feedback mechanisms.
    boundary: Applies to systems where feedback mechanisms regulate behavior or function,
      whether in biological organisms, machines, or social structures. Fails when
      systems lack feedback loops or operate purely in open-loop configurations without
      adaptive response to outputs.
  expected_classification:
    depth: cross-domain
- id: 0b29c7cb71e0bff9d197843376403ea963e71f5e037cdb8df86099f06c0d3aef
  input_fb:
    name: Baroque Calligraphy and Pollock's Painting Resonance
    definition: A comparative principle showing how the formal discipline and rhythmic
      consistency of Baroque calligraphy mirrors the repetitive, hypnotic movements
      in Jackson Pollock's drip painting.
    mechanism: Both Baroque calligraphy and Pollock's drip painting demonstrate a
      shared principle of formal discipline where movements follow predictable patterns
      and rhythms, though Pollock's work incorporates personal energy and emotional
      expression.
    boundary: Applies to the formal similarities between historical calligraphic techniques
      and modern abstract painting in terms of movement patterns and rhythmic consistency.
      Fails to address the fundamental differences in expressive content and emotional
      engagement between the two art forms.
  expected_classification:
    depth: cross-domain
- id: 7e0963a36d8a53272f5a00bfefa5e291cccb8ac3460837917e02c23afcb4b973
  input_fb:
    name: Operator Figure in Surgical and Artistic Practice
    definition: A conceptual framework that examines the role of the operator in modern
      industrial societies, particularly in relation to the dehumanization of human
      experience in medical and artistic contexts.
    mechanism: The operator, as conceptualized by Pirandello, represents a figure
      who does not actively operate but rather creates conditions for others to function,
      while Benjamin's comparison of the cameraman to the surgeon and painter to the
      magician illustrates how operators in different fields maintain distance from
      their subjects while performing their roles.
    boundary: Applies in contexts where the role of the operator in medical and artistic
      practices is examined, particularly in relation to human subjectivity and interpersonal
      encounters. Fails when the operator's role is not understood in terms of its
      relationship to human agency and subjectivity.
  expected_classification:
    depth: cross-domain
- id: d648442a31cb75e891839fc43b839c583b6b7e2be063ab5f0d9b75a0fd6ba222
  input_fb:
    name: Strategic Anticipation Through Multiple Perspectives
    definition: "Effective strategic planning requires examining trends and decisions\
      \ from multiple angles \u2014 considering familiar vs. unexpected elements,\
      \ potential damage vs. opportunity, and diverse stakeholder perspectives \u2014\
      \ to anticipate both intended and unintended consequences."
    mechanism: 'This is a practical heuristic for strategic foresight: systematically
      engaging with a trend or decision from multiple framing lenses (expectation
      vs. anomaly, current strategy vs. challenge, context vs. impact) increases the
      likelihood of identifying critical blind spots and opportunities. The approach
      is iterative and constructivist, meaning that understanding emerges through
      engagement with the system rather than static prediction.'
    boundary: Applies when strategic decisions must account for complexity and uncertainty
      in dynamic environments. Fails when decisions are made under strict time constraints
      or with insufficient stakeholder input, where the lens of multiple perspectives
      cannot be adequately applied.
  expected_classification:
    depth: cross-domain
- id: 66a98ba8284aa40f771d37ca9a895f9aa50cf6c48f2a47835f69a477deec814f
  input_fb:
    name: Interdisciplinary Urban Design and Cultural Framework
    definition: An approach to urban design research that critically investigates
      the relationship between culture, space, landscape, heritage, and sustainability
      to propose new forms of contemporary urbanism.
    mechanism: The research methodology integrates professional practice with theoretical
      academic concerns, placing built-environment projects within a wider cultural
      framework that recognizes the overlap between production and theoretical inquiry.
    boundary: Applies to interdisciplinary urban design research that connects theory
      and practice. Fails when applied to purely technical or isolated design disciplines.
  expected_classification:
    depth: cross-domain
- id: ddf2df4d0b0311e39c4755d51ec76e8ef75f34c9fb9b2f11238708c60468d498
  input_fb:
    name: Creative Process and Muse
    definition: A principle that describes how creative inspiration emerges unexpectedly
      rather than through forced or scheduled effort, and how the most effective creative
      work happens in states of openness and play.
    mechanism: Creative inspiration (the 'muse') appears in moments of relaxed awareness
      rather than structured planning, and emerges most readily in states of play
      and physical activity rather than forced concentration.
    boundary: Applies to creative work where inspiration is sought rather than forced.
      Fails when the creative process is rigidly scheduled or when inspiration is
      expected to come through structured methods.
  expected_classification:
    depth: cross-domain
- id: 57b50b03baa1af09c42b654afccb4ce7ae3c6504be14a11e15e253e34657d970
  input_fb:
    name: Model Homomorphism Principle
    definition: A modeling approach where the relationship between a simplified model
      and the real world must preserve structural properties through a commutative
      mapping, known as a homomorphism.
    mechanism: The model and real world must maintain equivalent structural relationships
      through a transition function that maps states in the model to corresponding
      states in reality, ensuring that the model's behavior mirrors the real system's
      behavior.
    boundary: Applies when a model needs to maintain structural correspondence with
      the real system through equivalent transition functions. Fails when the model's
      structure does not preserve the essential properties of the real system.
  expected_classification:
    depth: cross-domain
- id: 036566fc6dbdb3af9317935cb26722716536f968b49aa5028208af9f2c6748a7
  input_fb:
    name: Instability As Clue Method for Differential Equation Solutions
    definition: Instability in differential equation solutions can serve as a guiding
      principle for finding numerical solutions by tracking solution behavior and
      adjusting initial guesses accordingly.
    mechanism: When solving differential equations numerically, instability in the
      solution path provides directional feedback - if the solution diverges upward,
      the initial slope guess was too high; if it diverges downward, the guess was
      too low. This creates a feedback loop for iterative adjustment of solution parameters.
    boundary: Applies to numerical solution methods for differential equations where
      instability can be used as a diagnostic tool. Fails when the differential equation
      is not amenable to this type of iterative adjustment or when the instability
      is not properly characterized.
  expected_classification:
    depth: domain
- id: 5e0cecd86d5c35588f896af5886b4d4eb2648840379ae0d74a842cfb241f6bc3
  input_fb:
    name: Feedback Protection Principle for System Components
    definition: System components that are vital to computation must be protected
      by feedback mechanisms to correct errors, or they must be maintained with high
      accuracy in isolation.
    mechanism: When system components are 'vitally' important to computation, they
      either undergo error correction through feedback loops or must be maintained
      with sufficient accuracy that errors don't propagate through the system. The
      feedback protection mechanism allows for less precise individual components
      to work together effectively.
    boundary: Applies to system design where some components are critical to overall
      computation accuracy. Fails when the system design does not account for the
      need for feedback protection or when components are not properly classified
      as 'vitally' important.
  expected_classification:
    depth: cross-domain
- id: b29b90fea31ea09b50eabec7c2563cd9c3b5719148d0982e4a4b11ce8dcf7a16
  input_fb:
    name: Hyper-dematerialization
    definition: Technology enables the reduction of material and economic inputs required
      to deliver value, creating more efficient resource use and enabling broader
      access. This process is characterized by the systematic replacement of physical
      goods with digital or service-based solutions that maintain or enhance functionality
      while reducing cost and environmental impact.
    mechanism: 'Hyper-dematerialization occurs when technological advancement allows
      for the delivery of value with fewer physical resources. This process involves
      three key transformations: (1) dematerialization, where physical goods are replaced
      by digital or service equivalents; (2) demonetization, where the cost of equivalent
      functionality drops dramatically due to reduced material requirements; and (3)
      democratization, where access to previously expensive technologies becomes widespread
      through reduced material and financial barriers.'
    boundary: Applies when technological advancement enables the replacement of physical
      goods with digital or service equivalents that maintain functional parity. Fails
      when the replacement process does not reduce material or economic inputs, or
      when the technology is not scalable to broader adoption. Also fails in contexts
      where physical goods are fundamentally required for safety, regulation, or core
      functionality.
  expected_classification:
    depth: cross-domain
- id: 00916545c157160e234827d42f9e90f625d8620d6bfe9ecd063dee92ddd48e47
  input_fb:
    name: Onboarding Optimization Framework
    definition: A process for improving product onboarding by removing unnecessary
      steps and focusing on meaningful user outcomes.
    mechanism: The framework involves identifying and eliminating steps that don't
      contribute to user success, with specific examples showing how removing steps
      can increase revenue.
    boundary: Applies to product onboarding design where user experience can be improved
      by removing friction. Fails when all steps are essential for core functionality
      or user success.
  expected_classification:
    depth: domain
- id: 2d6d9b69c8812c3b876aea7c58cd10280d61daf1f4a1f60c4db9e5c60648c0a3
  input_fb:
    name: Next-word Prediction Mechanism
    definition: Large language models generate text by predicting the most probable
      next word in a sequence based on the preceding context, using probability distributions
      over vocabulary. This mechanism operates as a core computational process that
      enables language generation.
    mechanism: "The model calculates the probability of each possible next word given\
      \ the current sequence of words, then selects the word with the highest probability.\
      \ This process is mathematically expressed as argmax P(w | w\u2081, w\u2082\
      , ..., w\u2098), where w_next is the most likely word to follow the current\
      \ sequence. The model's training involves learning to predict the next word\
      \ in large text corpora, which enables it to generate coherent text by sequentially\
      \ selecting high-probability words."
    boundary: Applies when models are trained on text corpora and generate text through
      sequential word prediction. Fails when models are not trained on language data
      or when generation is not based on probability maximization, such as in rule-based
      or template-driven systems.
  expected_classification:
    depth: specialized
- id: 56b691b419c5ba4fae3b042fcfad7ca0eab8967c7dc27c30bb38db794f401a59
  input_fb:
    name: Time Travel Paradox Avoidance Rule
    definition: A conceptual rule stating that in time travel scenarios, meeting one's
      past or future self creates dangerous paradoxes that could destabilize the space-time
      continuum.
    mechanism: The rule operates on the premise that identical matter cannot occupy
      the same space at the same time, and that meeting one's past or future self
      would create a temporal paradox that could have catastrophic consequences for
      the space-time fabric.
    boundary: Applies to fictional time travel scenarios in movies and literature
      where the rules of temporal mechanics are established. Fails when the premise
      of time travel is not accepted or when the physical constraints of time travel
      are not acknowledged.
  expected_classification:
    depth: cross-domain
- id: 019c65ab97a7cbf559d6729c70219605c7b832bfc169f191248abb74d0333ea4
  input_fb:
    name: Indicial Notation in Narrative Structure
    definition: Indicial notation in narrative structure refers to semantic units
      that relate to signified meanings rather than operational functions, functioning
      as indices that connect to broader conceptual frameworks.
    mechanism: These units function as indicators that refer to signified concepts
      rather than to specific operations, creating vertical relationships that connect
      to broader narrative and thematic contexts rather than to distributional sequence.
    boundary: Applies specifically to narrative analysis where indices connect to
      broader conceptual frameworks rather than to linear functional relationships.
      Fails when indices function purely as distributional elements or operational
      components.
  expected_classification:
    depth: domain
- id: 1749dbc03caa5f57b1225cb3f3393bfbbcc750bad0d227d9616bb1b3bbe74750
  input_fb:
    name: Phi-3.5-moe Model Architecture
    definition: A memory-constrained, latency-sensitive AI model optimized for general-purpose
      systems with advanced fine-tuning and safety measures.
    mechanism: The model achieves precise instruction adherence and robust safety
      through high-quality dataset training and advanced optimization techniques,
      while maintaining accessibility for deployment in resource-limited environments.
    boundary: Applies to memory-constrained and latency-sensitive deployment environments.
      Fails when deployed in environments without resource constraints or where safety
      requirements are not applicable.
  expected_classification:
    depth: specialized
- id: ddbc4d6fbe5c51bee2f1f3ebf4b6a00233c55ad0ea8a2e52be013aab504bdc77
  input_fb:
    name: Sophistication and Fragility in Complex Systems
    definition: A principle that increasing complexity and sophistication in systems
      makes them more vulnerable to collapse, particularly when they become overly
      specialized and lose resilience.
    mechanism: As systems gain in complexity and specialization, they develop more
      interdependencies and points of failure, making them increasingly fragile to
      shocks and collapses, similar to how the sword of Damocles creates vulnerability
      through its very presence.
    boundary: Applies to complex systems including societies, institutions, and organizations
      that increase in complexity and specialization. Fails when systems maintain
      sufficient robustness or antifragility to withstand shocks.
  expected_classification:
    depth: cross-domain
- id: 0b0cbabaf1668067eb3716fbd037d8444b43b137600f1bbe859607fc769f3d23
  input_fb:
    name: Reframing Opportunity Through Perspective Shift
    definition: Reframing involves deliberately shifting the conceptual lens through
      which a problem or opportunity is understood, revealing hidden possibilities
      and enabling new solutions. The principle describes how changing the framing
      of a challenge can unlock previously unseen paths to innovation.
    mechanism: 'This is a practical heuristic for problem-solving: reframing shifts
      the mental model from which a problem is approached, often by questioning assumptions
      or redefining the core elements of the challenge. It is a method of creative
      problem-solving that leverages cognitive flexibility to reveal alternative interpretations
      and solutions.'
    boundary: Applies when the current framing of a problem or opportunity is limiting
      or unproductive. Fails when the reframing introduces new constraints that outweigh
      the benefits, or when the original framing was already optimal for the desired
      outcome.
  expected_classification:
    depth: specialized
- id: 20e0fc5c762577eaa0e663973fd713230428339f2601077d7b40ad664e952203
  input_fb:
    name: Soft Systems Methodology in Large-scale Decision Making
    definition: Illustration of how soft systems methodology principles apply to major
      historical decisions, particularly in understanding how prevailing worldviews
      (W) shape decision-making in complex systems.
    mechanism: The passage demonstrates how major historical decisions like the British
      coal mining industry's shift to capital-intensive methods and the American moon
      landing decision were influenced by prevailing worldviews and systemic factors
      that shaped the decision-making process.
    boundary: Applies to understanding how systemic factors and prevailing worldviews
      influence major historical decisions. Fails when applied to simple technical
      problems or when the systemic context is not properly considered.
  expected_classification:
    depth: cross-domain
- id: 28e6e032c71c49efa2c368715d70a49b82ad651b86589a501c57acf95caa7045
  input_fb:
    name: Symbolic Transformation Through Ritual
    definition: Ritual processes serve as structured transitions that transform individuals
      or groups from one state to another through symbolic actions and representations.
      These transformations are mediated by archetypal symbols that connect personal
      experience to collective psychological structures.
    mechanism: Rituals function as symbolic bridges between ordinary and sacred states,
      using archetypal elements (gods, heroes, fairies, deities) to represent psychological
      and social transitions. The symbolic elements embody universal human experiences
      and facilitate the integration of new identity or status through repeated ceremonial
      acts that align individual consciousness with collective meaning systems.
    boundary: Applies when symbolic actions are embedded in structured social or psychological
      processes that require transformation of identity or status. Fails when symbolic
      acts are purely decorative or lack connection to deeper psychological or social
      meaning systems.
  expected_classification:
    depth: cross-domain
- id: 28f42e4a267b6617d41ac93edcae2cd2bc7b860d8627c04756866d4246b34c6a
  input_fb:
    name: Realistic Visual Representation in Flat Media
    definition: A design principle for creating convincing three-dimensional effects
      in two-dimensional media by accurately translating real-world spatial relationships
      and visual phenomena.
    mechanism: Realistic representation requires understanding how objects interact
      in three-dimensional space (overlapping, transparency, depth relationships)
      and translating these into two-dimensional visual elements that maintain their
      spatial relationships.
    boundary: Applies to design where three-dimensional realism is desired in flat
      media. Fails when the medium cannot support the required spatial relationships
      or when real-world constraints prevent accurate representation.
  expected_classification:
    depth: specialized
- id: 01b2b64f172f25786b7e962754651550c092b5b8a919a314a8e18a4b778d910c
  input_fb:
    name: Geometric Transformation in Art
    definition: A visual technique where 2D representations are manipulated through
      geometric transformations to create 3D-like effects or reveal hidden elements.
    mechanism: The process involves transforming flat 2D images through rotation,
      pan, tilt, and stacking to create the illusion of physical 3D objects or reveal
      hidden elements that only appear from specific viewing angles.
    boundary: Applies when 2D media is transformed to create 3D perception or reveal
      hidden content. Fails when the transformation does not create the intended spatial
      or hidden effect.
  expected_classification:
    depth: specialized
- id: 982d303bcbf38f03abbdceb7fa0c42ebcca4c4550e3acd7ea94c14f481908aaf
  input_fb:
    name: Visual Metaphor in Advertising
    definition: Visual metaphor functions as a rhetorical device in advertising that
      operates through visual structure and spatial layout to create cognitive engagement
      and persuasive impact. The effectiveness of visual metaphor in advertising is
      tied to its ability to communicate meaning beyond literal representation, often
      leveraging familiarity and emotional resonance to influence consumer perception.
    mechanism: Visual metaphor in advertising works by mapping conceptual domains
      onto visual domains through structural similarities. The cognitive processing
      of visual metaphors involves both recognition of the metaphorical relationship
      and interpretation of its communicative intent. Advertisers leverage visual
      metaphor as a pre-existing tool that aligns with consumer expectations and cultural
      associations, making it a natural fit for persuasive communication strategies.
    boundary: Applies when visual metaphor is embedded in advertising contexts where
      it can leverage existing cognitive schemas and cultural understanding. Fails
      when the visual metaphor is too abstract or disconnected from the target audience's
      experiential or conceptual framework, or when it lacks the structural clarity
      needed for effective communication.
  expected_classification:
    depth: cross-domain
- id: 0594364b6033e419973e61bd524b32b722b4b150450c518b5abd91b53f40329c
  input_fb:
    name: Collective Expertise Aggregation
    definition: Combining multiple individual judgments or analyses into a collective
      estimate or decision improves accuracy over single-source approaches. The principle
      describes how diverse perspectives, when aggregated, can produce more reliable
      outcomes than isolated expert opinions or single analyses.
    mechanism: 'This is a practical heuristic: aggregating diverse individual estimates
      or analyses reduces the impact of individual errors and biases. When many independent
      judgments are averaged or combined, random errors tend to cancel out while systematic
      biases may partially offset each other. The process works best when participants
      are not influenced by each other''s responses and when the underlying data or
      problem space allows for meaningful combination of perspectives.'
    boundary: Applies when individual judgments or analyses are independent and reflect
      different sources of knowledge or expertise. Fails when judgments are influenced
      by groupthink, when participants have identical information, or when the problem
      space is not amenable to aggregation (e.g., highly subjective or context-specific
      decisions).
  expected_classification:
    depth: cross-domain
- id: ed43ddc093aaaecd6cf22a5171bd6e59c71efb699fea3015f872e07d5ff77617
  input_fb:
    name: Gravity Lens Effect
    definition: The phenomenon where massive objects like the Sun bend light from
      background stars due to their gravitational field, causing the stars to appear
      displaced from their actual positions.
    mechanism: According to Einstein's general relativity, massive objects curve spacetime,
      which causes light rays passing near them to follow curved paths rather than
      straight lines, making distant stars appear to move outward from the Sun's position.
    boundary: Applies to observations of background stars during solar eclipses or
      when the Sun's gravity is the dominant gravitational influence. Fails when other
      gravitational influences dominate or when the lensing object is not massive
      enough to cause measurable bending.
  expected_classification:
    depth: universal
- id: a326e4e699c228588d5b4f1c12230d11616cefee6c8ed2733e203c2e971258cf
  input_fb:
    name: Open Data Ecosystem
    definition: Open data ecosystems are networks of publicly accessible datasets
      and tools that enable organizations and individuals to leverage shared information
      for business growth, research, and civic engagement. These ecosystems provide
      scalable resources that support decision-making, innovation, and transparency
      across diverse domains.
    mechanism: Open data ecosystems function as distributed networks where datasets
      from multiple sources (government statistics, intellectual property programs,
      commercial databases, public repositories) are made available under permissive
      licenses. These datasets can be combined, analyzed, and repurposed by users
      to generate new insights, products, or services. The ecosystem enables cross-domain
      applications through shared infrastructure and standardized access methods.
    boundary: Applies when data is publicly available and licensed for reuse. Fails
      when data is restricted by proprietary rights, privacy laws, or institutional
      access controls that prevent cross-domain utilization.
  expected_classification:
    depth: cross-domain
- id: dc1663df4bbc59a2b12f5dc1d74b44eda9ea91e76cb9712b96fe046c69bdbbc6
  input_fb:
    name: Digital Political Campaign Transformation
    definition: A shift in political advertising from traditional 'parent-child' messaging
      to interactive 'child' participation, enabled by digital media and social platforms.
    mechanism: Digital platforms allow voters to directly engage with political messages
      and candidates, shifting the traditional one-way communication model to a two-way
      interactive model where the 'child' (voter) can speak back to the 'parent' (politician).
    boundary: Applies to political campaigns that use digital media to enable direct
      voter engagement and interaction. Fails when campaigns rely solely on traditional
      media or don't provide interactive elements.
  expected_classification:
    depth: cross-domain
- id: a89281120c244b42a54fb066ac72221ab12b3122b2037192c808075d4b008d9c
  input_fb:
    name: Visual Symbol System for Information Design
    definition: A design approach that uses photographs and visual symbols to create
      a universal information system that can serve diverse audiences while providing
      in-depth content.
    mechanism: Photographs function as visual symbols that communicate meaning and
      tone universally, supporting complex information projects more effectively than
      decorative elements alone.
    boundary: Applies to information design systems that must accommodate multiple
      audience types and provide comprehensive content. Fails when the visual elements
      don't align with the content's complexity or audience needs.
  expected_classification:
    depth: cross-domain
- id: 2b25e3486e884e45d40f6558ab7acc72fe56ceae2c9ecd2647b96992cc54dc4a
  input_fb:
    name: Systematic Sign Interpretation
    definition: Meaning in communication emerges from systematic relationships between
      signs, symbols, and their intended interpretations rather than from isolated
      referents or arbitrary assignment. The principle describes how meaning is constructed
      through structured systems of signs that depend on shared understanding and
      contextual frameworks.
    mechanism: This is an empirical pattern describing how meaning is consistently
      derived from sign systems. The passages show that meaning arises not from individual
      objects or direct reference, but from the systematic organization of signs within
      communicative frameworks. The relationship between signs and their interpretations
      follows predictable patterns across different modes of communication (verbal,
      visual, symbolic) and contexts (linguistic, cultural, cognitive). The systematization
      of signs creates stable interpretive structures that enable shared understanding.
    boundary: Applies when signs function within organized systems where relationships
      between elements are consistent and recognized by participants. Fails when signs
      are used in isolation or when interpretation depends entirely on individual
      subjective experience rather than shared structural understanding.
  expected_classification:
    depth: cross-domain
- id: 62f217a1dd32ff73ce6cce1841315e770d0eabe9ae16d5fec4efc8f032ca8138
  input_fb:
    name: Peirce's Triad and Semiotic Processes
    definition: A conceptual framework combining Peirce's Firstness, Secondness, and
      Thirdness with abduction, induction, and deduction as fundamental semiotic processes
      that structure meaning and reality.
    mechanism: Peirce's three categories form a tripod where Firstness represents
      pure possibility or quality (like 'singularity'), Secondness represents actuality
      or relation (like the expansion of space), and Thirdness represents mediation
      or law (like the unfolding of natural forces). These three categories correspond
      to abduction (possibility), induction (consequence), and deduction (mediation)
      in semiotic reasoning.
    boundary: Applies to semiotic analysis of meaning-making processes in philosophy
      and linguistics. Fails when the three categories are not properly distinguished
      or when the triadic relationship is reduced to binary oppositions.
  expected_classification:
    depth: cross-domain
- id: 44f2c02d0a672801f0a08f5b6f33c9af49d6ec1b56a729030b4deefefda2d178
  input_fb:
    name: Pasteur's Quadrant Framework
    definition: A research classification framework that categorizes scientific inquiry
      based on the dual dimensions of fundamental understanding and practical application.
    mechanism: The framework maps research into four quadrants based on whether the
      inquiry focuses on basic science or applied problems, and whether it seeks fundamental
      understanding or practical use, with the Pasteur Quadrant representing research
      that addresses both simultaneously.
    boundary: Applies to research classification and project categorization in scientific
      and innovation contexts. Fails when applied to purely theoretical or purely
      practical research without considering the dual dimensions.
  expected_classification:
    depth: cross-domain
- id: 6572fdbff0cd70bc620fadad5473919f0fef060319dae57c7993c382e9b1dc39
  input_fb:
    name: Cross-modal Sensory Mapping
    definition: Sensory experiences in one modality can evoke corresponding perceptions
      in another modality through systematic, non-arbitrary mappings. These mappings
      are not random but reflect universal patterns in how the brain organizes sensory
      information.
    mechanism: This is an empirical pattern, not a causal mechanism. The brain systematically
      associates sensory qualities across modalities in predictable ways. For example,
      rounded shapes are consistently associated with soft sounds or words like 'bouba',
      while sharp shapes are linked to harsh sounds or 'kiki'. These associations
      appear across cultures and languages, suggesting a shared cognitive structure
      underlying sensory integration.
    boundary: Applies to sensory experiences where cross-modal associations are consistently
      observed across populations. Fails when sensory experiences are purely arbitrary
      or culturally constructed without universal patterns. Also fails in cases where
      sensory input is completely independent and lacks any cross-modal influence.
  expected_classification:
    depth: cross-domain
- id: 6b86e1d43e8369e40e216002836f04a4e9bab3c204d47bc96b1a60d42b98f116
  input_fb:
    name: Interdisciplinary Innovation Through Cross-pollination
    definition: An innovation approach that deliberately combines diverse disciplines
      and perspectives to generate breakthrough solutions that transcend traditional
      domain boundaries.
    mechanism: Organizations that foster interdisciplinary collaboration and exposure
      to diverse fields can generate intersectional ideas that lead to radical solutions
      by combining insights from different domains.
    boundary: Applies when organizations actively encourage cross-disciplinary interaction
      and integration of diverse perspectives. Fails when innovation is siloed within
      single disciplines or when interdisciplinary collaboration is not systematically
      encouraged.
  expected_classification:
    depth: cross-domain
- id: 2cbb7615b8062b064e99b764dfa2cc1260fef4c8c8d40494a8c2187fa092295e
  input_fb:
    name: Materialist Research Approach
    definition: A research methodology that emphasizes the role of nonhuman elements
      and material conditions in shaping rhetorical phenomena, particularly visual
      rhetoric.
    mechanism: The approach recognizes that images and visual elements are not merely
      representations but active participants in rhetorical processes, shaped by their
      material conditions and circulation patterns.
    boundary: Applies to visual rhetoric studies that incorporate materialist perspectives
      and consider nonhuman actors in rhetorical analysis. Fails when limited to traditional
      human-centered rhetorical approaches.
  expected_classification:
    depth: cross-domain
- id: 32a71d9bcad77299343d51e2f08fc9f7e502c4cccf6ac6ce803a923359a100aa
  input_fb:
    name: Business Model Innovation Through Digital Integration
    definition: Business model innovation occurs when organizations integrate digital
      technologies with sustainable practices and circular economy principles to create
      new value propositions and operational efficiencies. This innovation process
      enables organizations to address environmental challenges, enhance resource
      utilization, and transform traditional business models into more resilient and
      competitive frameworks.
    mechanism: Digital technologies enable the integration of sustainable practices
      by providing data analytics, automation, and connectivity that optimize resource
      consumption, improve capacity utilization, and support circular processes. These
      technologies facilitate the transformation of traditional business models through
      enhanced monitoring, real-time adaptation, and scalable implementation of sustainable
      strategies. The integration creates synergies between digital capabilities and
      environmental goals, allowing organizations to achieve operational improvements
      while meeting societal expectations.
    boundary: Applies when organizations have access to digital tools and are willing
      to integrate them with sustainability initiatives. Fails when organizations
      lack digital infrastructure, resist change, or operate in sectors where digital
      integration is not feasible or economically viable.
  expected_classification:
    depth: cross-domain
- id: 370c44316d8755b4752b141335a1b630caec3f3b5cd5836c45a371e5ce88d29b
  input_fb:
    name: Paradigm Shift Through Disruption
    definition: Scientific and intellectual progress occurs not through gradual accumulation
      of knowledge, but through disruptive paradigm shifts that fundamentally redefine
      the problem space and establish new frameworks for inquiry. These shifts are
      driven by challenges to existing orthodoxies and the emergence of new conceptual
      structures that cannot be understood within the old system.
    mechanism: The process involves a tension between established knowledge systems
      and emerging insights that reveal the limitations of current frameworks. When
      the existing paradigm becomes internally inconsistent or unable to address new
      phenomena, it generates pressure for a fundamental reorientation. This reorientation
      is not additive but transformative, requiring a new lens through which to interpret
      reality. The disruption often comes from thinkers who question and redefine
      the foundational assumptions rather than simply extending them.
    boundary: Applies when a scientific or intellectual domain faces internal contradictions
      or new phenomena that cannot be explained by existing models. Fails when the
      domain is stable and all new observations fit within the existing framework,
      or when the challenge is merely methodological rather than conceptual.
  expected_classification:
    depth: cross-domain
- id: 30e663d739a2454207d6464d387b377396e198e5ef2892d3a53f380ee06f11bd
  input_fb:
    name: Schematic Meaning in Linguistic Expression
    definition: Linguistic expressions derive meaning from abstract, recurring conceptual
      structures called schemas that map physical or conceptual relationships onto
      language. These schemas provide the foundational meaning for words and phrases,
      enabling semantic interpretation through structural mapping rather than direct
      reference.
    mechanism: Schemas are abstracted patterns from experience that become embedded
      in language use. When a word or phrase is used, it activates a schema that provides
      the underlying conceptual framework for its meaning. This schema-based interpretation
      allows for systematic variation in expression (e.g., 'over' vs. 'through') while
      maintaining core semantic relationships. The schema operates as a cognitive
      template that maps physical or conceptual domains onto linguistic structures.
    boundary: Applies when linguistic expressions can be understood through abstract
      conceptual mappings or structural relationships. Fails when meaning is purely
      arbitrary or based on direct reference without conceptual structure (e.g., proper
      names, onomatopoeia). Also fails for purely grammatical constructions that lack
      semantic content.
  expected_classification:
    depth: cross-domain
- id: 459af34476ba6aa54539cbc5e6240bbd4bf8ff6095b00331ed184bf1e34256e7
  input_fb:
    name: Social Semiotic Interdisciplinarity
    definition: Social semiotics requires integration of semiotic theory with domain-specific
      knowledge to analyze communication in context. The approach demands deep engagement
      with both theoretical frameworks and substantive fields to produce meaningful
      interpretations.
    mechanism: Social semiotics functions as a rhetorical and interdisciplinary framework
      that demands simultaneous mastery of semiotic concepts and contextual domain
      expertise. The methodological strength emerges not from isolated semiotic analysis
      but from combining theoretical tools with substantive knowledge of the field
      being analyzed (e.g., legal, cultural, media). This dual requirement ensures
      that semiotic interpretation is grounded in real-world context rather than abstract
      theory alone.
    boundary: Applies when semiotic analysis is embedded within a specific domain
      or context that requires substantive field knowledge. Fails when semiotic analysis
      is conducted in isolation from any domain context or when the domain knowledge
      is insufficient to support the theoretical claims.
  expected_classification:
    depth: cross-domain
- id: fbcdefe9ebe1504ed6ebb408f5e7532d7e39f46761320ab0d4c67061b59d469b
  input_fb:
    name: Metaphorically Selling How to Use the Ma (2)
    definition: Effective metaphors simplify complex topics by mapping them onto familiar
      domains, making abstract concepts accessible to general audiences. The principle
      describes how metaphorical framing can bridge the gap between technical subject
      matter and layperson understanding.
    mechanism: Metaphors work by creating cognitive bridges between the unfamiliar
      domain (e.g., Automated Payment Transaction tax) and the familiar domain (e.g.,
      a highway). When the metaphor is simple and relatable, it enables audiences
      to grasp complex ideas without requiring deep domain expertise. The mapping
      process engages intuitive reasoning, allowing people to apply their existing
      knowledge to understand new concepts.
    boundary: Applies when the target concept is abstract, technical, or unfamiliar
      to the audience. Fails when the metaphor is too complex, irrelevant, or misaligned
      with the audience's frame of reference. Also fails when the metaphor oversimplifies
      or distorts the core concept in a way that misleads the audience.
  expected_classification:
    depth: cross-domain
- id: 772c19d4f8cb95977f3ecd964bc2df2247ce80a5339bdcd7ed75d0f397b9d0ec
  input_fb:
    name: Mental Illness Epidemic and Consumer Capitalism
    definition: An epidemic of mental illness and anxiety is sweeping the globe, with
      consumer capitalism potentially being a root cause of these psychological problems.
    mechanism: Consumer capitalism's emphasis on material consumption and advertising
      creates a trillion-dollar industry that represents more than just economic stimulation,
      potentially contributing to mental health crises through constant marketing
      messages and the commodification of human experience.
    boundary: Applies to societies where consumer capitalism dominates economic and
      social structures. Fails when mental health issues are attributed solely to
      individual factors or when the connection to consumer capitalism is not recognized.
  expected_classification:
    depth: cross-domain
- id: d0e2634eb710ebd43b27f01980501821552c4e7b5ae995b21084fcf74f87f9eb
  input_fb:
    name: Surveillance Capitalism Legal and Institutional Control
    definition: A system where surveillance capitalism operates through legal and
      institutional mechanisms that eliminate user protections and create conditions
      of inescapable control.
    mechanism: Legal frameworks are manipulated to place users under different jurisdictions
      (US privacy laws vs EU framework) to eliminate their ability to seek redress,
      while institutional power structures create conditions of 'no exit' where users
      cannot escape the surveillance system.
    boundary: Applies to legal and institutional frameworks that enable surveillance
      capitalism's expansion. Fails when users retain meaningful legal protections
      or alternative institutional options.
  expected_classification:
    depth: cross-domain
- id: 3534e059812de2b1b602e4ac07d22c1d76ff8b91da09f5537b2f90a0a685fb1f
  input_fb:
    name: Agency of Visual and Semiotic Constructs
    definition: Visual and semiotic elements are not passive representations but active
      agents that shape meaning, influence perception, and generate social effects
      through their circulation and interpretation. These constructs possess inherent
      agency that transforms them from static objects into dynamic forces in cultural
      and communicative systems.
    mechanism: Visual and semiotic elements acquire agency through their capacity
      to be interpreted, circulated, and recontextualized. They do not merely reflect
      reality but actively construct meaning by engaging with audiences and environments.
      Their agency emerges from the interplay between their formal properties, the
      contexts in which they appear, and the interpretive practices of those who encounter
      them.
    boundary: Applies when visual or semiotic elements are embedded in communicative
      or cultural systems where interpretation and circulation occur. Fails when elements
      are purely decorative or isolated from social or interpretive contexts.
  expected_classification:
    depth: cross-domain
- id: 91dc4ad5db83f98ec3f9642b645d71925f8d7f27a5449f1f49178defb6ad6ff1
  input_fb:
    name: Responsible Ai Governance Framework
    definition: A comprehensive governance approach for AI systems that integrates
      ethical considerations, transparency, and stakeholder input to ensure trust,
      fairness, and societal alignment. The framework addresses both technical and
      social dimensions of AI deployment.
    mechanism: Responsible AI governance requires multi-stakeholder engagement, including
      civil society, regulatory bodies, and public consultations, to align system
      design with societal values and ethical principles. It incorporates technical
      safeguards such as bias mitigation, transparency in data practices, and compliance
      with legal standards. The framework operates through iterative feedback loops
      that incorporate diverse perspectives and impact assessments to guide system
      development and deployment.
    boundary: Applies when AI systems are deployed in contexts where societal impact
      is significant and stakeholder input is feasible. Fails when governance is limited
      to technical teams or regulatory compliance alone, or when stakeholder engagement
      is not integrated into the development process.
  expected_classification:
    depth: cross-domain
- id: 0c4079400a8f2081089a7b3774629a55a12bc63d22251c53052170885981e076
  input_fb:
    name: Pandemic Emergency Powers and Digital Surveillance Expansion
    definition: The widespread adoption of digital surveillance and control mechanisms
      during the pandemic, despite lack of evidence for their effectiveness.
    mechanism: Governments implement digital surveillance measures including contact-tracing
      apps, internet censorship, surveillance drones, and military enforcement even
      when evidence shows they do not effectively slow disease spread.
    boundary: Applies to pandemic policy implementation where evidence-based decision-making
      is bypassed in favor of emergency powers and surveillance expansion. Fails when
      policies are evidence-based or when surveillance measures show demonstrable
      effectiveness.
  expected_classification:
    depth: cross-domain
- id: a6e36db25164b1e2c2e7c12fc0c96cdf5d89656f94671ceb5c50309e7cd8a70d
  input_fb:
    name: Peircean Semiotic As Philosophical Foundation
    definition: Peirce's semeiotic constitutes a philosophical framework for understanding
      signs and meaning-making that transcends linguistic boundaries and integrates
      with broader philosophical inquiry. It provides a systematic taxonomy of signs
      and their interpretive processes that underpins both semiotic analysis and computational
      models of language.
    mechanism: Peirce's semiotics operates as a philosophical theory of signs that
      categorizes signs into three fundamental types (icon, index, symbol) and structures
      meaning through triadic relationships involving a sign, its object, and an interpretant.
      This framework enables the analysis of meaning across diverse domains including
      language, design, space, and information theory, functioning as a universal
      model for semiotic interpretation.
    boundary: Applies when signs function as meaningful entities that relate to objects
      through interpretive processes. Fails when signs are purely physical or mathematical
      without interpretive dimension, or when the triadic relationship is not recognized
      as fundamental to meaning-making.
  expected_classification:
    depth: cross-domain
- id: 34ea7ba42fc77ae50f3d95637ec7ea098673c7ff52c181d514746e1d58f657bd
  input_fb:
    name: Probability Misunderstanding Bias
    definition: A cognitive bias where people incorrectly perceive low-probability
      events as regularly recurring, leading them to underestimate the true risk when
      exposed to such events for only part of a longer time period.
    mechanism: People misjudge the temporal distribution of rare events, treating
      them as if they follow a periodic pattern rather than understanding their true
      stochastic nature. This creates a false sense of security when exposure is limited
      to a fraction of the expected occurrence interval.
    boundary: Applies when individuals misunderstand the temporal independence of
      low-probability events. Fails when the event truly occurs periodically or when
      proper risk assessment methods are applied. The bias is particularly evident
      in portfolio theory contexts where Gaussian assumptions conflict with rare event
      occurrences.
  expected_classification:
    depth: cross-domain
- id: 39a2122fd7d53b539aaef7e8a5a47f7ed2720f1d39d44aa4f6e8e9a5e205e612
  input_fb:
    name: Sherlock Holmes' Observation of Silence
    definition: The principle that absence of evidence (such as a dog not barking)
      can be more significant than presence of evidence in understanding systems behavior.
    mechanism: In systems analysis, the absence of expected behavior or response (like
      a dog not barking) often reveals more about the system's state or the nature
      of the problem than the presence of typical activity, because the system's normal
      response pattern is disrupted.
    boundary: Applies when systems have predictable behavioral patterns and the absence
      of expected responses provides meaningful information. Fails when the system's
      normal behavior is not well understood or when silence is not a meaningful signal.
  expected_classification:
    depth: universal
- id: 2a7bcdb9e38fed015eba98f13adf0880a2986ba07bdd0e6ba40fc8f53b556cce
  input_fb:
    name: Archetypal Temenos in Sacred Symbolism
    definition: The temenos represents a sacred psychological or physical boundary
      that contains transformative spiritual or initiatory experiences. It functions
      as a threshold or vessel where archetypal forces are accessed and integrated,
      often through ritualized reenactment of foundational myths.
    mechanism: The temenos operates as a symbolic container that holds and channels
      archetypal energy, particularly in contexts of spiritual transformation. It
      manifests in physical forms (like the djed pillar, bull costume, or bone-holding
      figurines) that serve as conduits for accessing ancestral or divine knowledge.
      These forms are not merely symbolic but function as psychically sealed vessels
      that enable the integration of transformative experiences, whether through death-rebirth
      cycles or mythic reenactments.
    boundary: Applies when a ritual or symbolic form serves as a threshold for spiritual
      or psychological transformation, particularly in contexts involving death/rebirth,
      ancestral access, or mythic reenactment. Fails when the form lacks ritual or
      mythic context, or when it is purely decorative or aesthetic without transformative
      function.
  expected_classification:
    depth: cross-domain
- id: 658b601cdf30b8874b312367ffe1e1248250b7b646121f7751f0ce6ff495a817
  input_fb:
    name: Intuitive Design Access Through Mythological Storytelling
    definition: A principle of design that emphasizes accessing universal human narratives
      and mythological themes to create meaningful and engaging visual communication.
    mechanism: Designers who cultivate intuitive access to mythological storytelling
      can translate complex cultural narratives into universally understandable visual
      forms that resonate across different audiences and contexts.
    boundary: Applies when designers work with cultural or mythological themes that
      have broad human resonance. Fails when the approach is too esoteric or culturally
      specific to be universally accessible.
  expected_classification:
    depth: cross-domain
- id: 6cac04c43c37e400b3f625b4b416b23b16438f3e296478ee267bcd74472258e4
  input_fb:
    name: I Win or I Learn, but I Never
    definition: A mindset principle that reframes all outcomes as either wins or learning
      experiences, eliminating the concept of true failure.
    mechanism: The principle operates by shifting perspective from viewing mistakes
      or setbacks as losses to recognizing them as information-gathering opportunities
      that lead to growth and better future outcomes.
    boundary: Applies when individuals can reframe their experiences through the lens
      of learning and growth. Fails when the principle is applied to situations where
      external constraints or systemic issues prevent meaningful learning or growth.
  expected_classification:
    depth: cross-domain
- id: 13584ffaa74f3b247a82e9c595815806108b6860e41c82bd87e317b9fccf45c9
  input_fb:
    name: Mental Models and Problem-solving Method
    definition: A systematic approach to problem-solving that involves identifying
      and applying fundamental mental models from multiple disciplines to achieve
      better outcomes.
    mechanism: The method involves recognizing that big ideas often lie just beyond
      one's immediate discipline, and that effective problem-solving requires actively
      seeking these cross-disciplinary insights while maintaining a synthesis-focused
      mindset that raggs problems until they're solved.
    boundary: Applies to individuals who can identify and apply mental models from
      multiple disciplines. Fails when practitioners only work within their own discipline
      or fail to recognize the value of cross-disciplinary approaches.
  expected_classification:
    depth: cross-domain
- id: 09ea879c42efb98c0a1be7290a78620fc51bb8da3644a586c9ee97f1f61a5cb4
  input_fb:
    name: "Filete Porte\xF1o Style in Typography"
    definition: A traditional painting style originating from Buenos Aires, Argentina,
      characterized by symmetrical and highly stylized architectural flourishes surrounding
      ornamental phrases, used to create photorealistic depth and detail in typography.
    mechanism: The style employs trompe l'oeil techniques to create visual depth and
      detail, with symmetrical architectural elements and ornamental phrases that
      reference historical signage and lettering traditions.
    boundary: "Applies specifically to works created in the Buenos Aires tradition\
      \ that incorporate historical signage elements and traditional painting techniques.\
      \ Fails when the stylistic elements don't align with the traditional Filete\
      \ Porte\xF1o characteristics."
  expected_classification:
    depth: specialized
- id: 4ce109083bd78f5240dde3eb2051ce502a58720ad6baea6d01ec35405f3960ec
  input_fb:
    name: Visual Anthropology and the Act of Looking
    definition: A paradigm for visual anthropology that distinguishes between visualizing
      images of other cultural worlds and understanding their meaning, emphasizing
      that looking through camera technology involves different corporeal operations
      than direct visual observation.
    mechanism: The proposition that 'there is no such thing as just looking' underpins
      art history and visual anthropology, but James Elkins argues that the observer's
      gaze through camera technology involves a different kind of corporeality than
      direct eye vision, and that even in designed viewing mechanisms like museums,
      looking is fragmented, partial, and inconclusive, involving affective energies
      that act upon observers' bodies.
    boundary: Applies to visual anthropology's approach to cultural representation
      through material vs. visible forms, and to the distinction between visual observation
      and meaning interpretation. Fails when the distinction between looking and understanding
      is not maintained or when camera use is conflated with direct visual perception.
  expected_classification:
    depth: cross-domain
- id: bc036cdcd3eaf867ec931e765d61c710040013ef4c02a8eb10e8cf5d29d12ba5
  input_fb:
    name: Archetypal Symbol in Design
    definition: Archetypal symbols that unite, separate, and reunite create paradox
      that allows for resolution between opposites, engaging viewers in conscious
      participation in the design.
    mechanism: Archetypal symbols contain inherent paradoxes that create tension and
      invitation for viewers to find resolution, making the design process interactive
      and meaningful rather than passive.
    boundary: Applies to designers who understand that archetypal symbols can contain
      opposing elements that create dynamic tension and resolution. Fails when designers
      ignore the paradoxical nature of effective symbols.
  expected_classification:
    depth: cross-domain
- id: fba10d9bd2f3351fb1a94db5847b14d6ecb29cb37144f888ec9893e9c0d5f2b5
  input_fb:
    name: Mediocristan Vs Extremistan Distribution
    definition: 'Systems can be classified into two fundamentally different types
      based on how individual events contribute to overall outcomes: Mediocristan
      systems where individual variations are bounded and additive, and Extremistan
      systems where a few extreme events dominate the total distribution.'
    mechanism: In Mediocristan, the contribution of any single element to the total
      is negligible (e.g., the heaviest human contributes less than 0.6% to total
      population weight). In Extremistan, a few extreme elements dominate the distribution
      (e.g., wealth distribution where a few individuals hold disproportionate share).
      This distinction is not about the number of elements but about the nature of
      variation and the impact of outliers.
    boundary: Applies when systems exhibit either bounded additive variation (Mediocristan)
      or unbounded extreme variation (Extremistan). Fails when systems are purely
      random without any structural pattern or when the distinction between individual
      and collective contribution is not meaningful.
  expected_classification:
    depth: universal
- id: be6740edcb557d112055d29c86b3bf03c877a76c12c6c42d3004748e32cd40fa
  input_fb:
    name: Visual Metaphor As Cognitive Bridge
    definition: Visual metaphors function as cognitive tools that map abstract concepts
      from one domain to another through visual resemblance, enabling comprehension
      and communication across diverse media and contexts. The principle describes
      how visual metaphors serve as structured mappings that connect familiar visual
      elements to unfamiliar ideas.
    mechanism: Visual metaphors work by leveraging the human capacity for pattern
      recognition and conceptual mapping. When a visual element (the source) resembles
      or embodies characteristics of an abstract concept (the target), it creates
      a cognitive bridge that allows users to understand the target through familiar
      visual associations. This process operates across media types and contexts,
      from advertising to educational design, where visual elements are selected to
      evoke specific conceptual relationships.
    boundary: Applies when visual elements can be meaningfully mapped to abstract
      concepts through perceptual or semantic resemblance. Fails when the visual source
      lacks any recognizable connection to the target concept, or when the mapping
      creates confusion rather than clarity. Also fails in contexts where visual elements
      are purely decorative or symbolic without conceptual function.
  expected_classification:
    depth: cross-domain
- id: 88a2db86e0beac285a31b8f85356046504dcb398718fba9bf25fb4c9d81308d3
  input_fb:
    name: Idea-first Design Philosophy
    definition: A design approach that prioritizes conceptual clarity and narrative
      purpose before technical execution, emphasizing the importance of understanding
      one's core message and emotional intent.
    mechanism: This philosophy operates on the principle that successful creative
      work begins with a clear understanding of the intended story, point, or emotional
      impact, rather than focusing immediately on execution details or technical implementation.
    boundary: Applies when creative work requires conceptual foundation before technical
      development. Fails when the approach is misapplied to situations where immediate
      execution is required or when the conceptual phase becomes excessive.
  expected_classification:
    depth: cross-domain
- id: 425eaad6e9934c40437c39feb857a0b36cbf4653bfc43ef9081a69012f4232fe
  input_fb:
    name: Sapir-whorf Linguistic Relativity Hypothesis
    definition: The theory that language, thought, and culture are interdependent
      systems where language shapes the way its speakers perceive and think about
      the world.
    mechanism: Language structure determines cognitive patterns and cultural interpretations,
      so speakers of different languages experience reality differently based on their
      linguistic frameworks.
    boundary: Applies to the relationship between language and cognition in human
      societies. Fails when language does not constrain thought or when cultural factors
      override linguistic influence.
  expected_classification:
    depth: cross-domain
- id: 79cd9f7d07bedc0cb8c5f5b6c1797a3cba4825e779d037ee09e3987f18f36002
  input_fb:
    name: Analogy-driven Scientific Breakthrough
    definition: Scientific breakthroughs frequently emerge when researchers apply
      analogies from one domain to solve problems in another, particularly when facing
      novel or uncharted territory. This process involves recognizing structural similarities
      between seemingly disparate phenomena and leveraging them to generate new insights.
    mechanism: This is an empirical pattern, not a causal mechanism. The passages
      document that analogical thinking is a recurring feature in scientific discovery,
      observed across different contexts and researchers. The pattern shows that breakthrough
      moments often involve drawing connections between familiar and unfamiliar domains,
      though the specific causal chain from analogy to breakthrough is not demonstrated
      in the evidence.
    boundary: Applies when scientists encounter novel problems or uncharted territory
      where existing frameworks are insufficient. Fails when problems are well-understood
      within a single domain or when analogies are forced rather than naturally emerging
      from structural similarities.
  expected_classification:
    depth: cross-domain
- id: 2053d38da221745b61797e2494f74207483ea35a175d3c9683fc62b1e789368e
  input_fb:
    name: Chat Model Instructional Interface
    definition: Chat models are specialized language models designed to follow user
      instructions and engage in conversational exchanges rather than simply completing
      text. These models require a specific structural format that includes system
      messages and alternating user-assistant exchanges to function properly.
    mechanism: Chat models operate under a structured conversational interface where
      the system message sets context and the alternating user-assistant exchanges
      provide the conversational flow. The model's training includes examples of instruction-following
      behavior, and the interface format (system message + alternating exchanges)
      enables the model to distinguish between instruction mode and completion mode.
    boundary: Applies when models are specifically trained as chat models with instruction-following
      capabilities. Fails when using models that are not designed for conversational
      interaction or when the required structural format is not provided.
  expected_classification:
    depth: specialized
- id: 047fed56e9e143122ef316b59f5f6f854c3c4b4002f77555074905f4da1189a2
  input_fb:
    name: 'Cerebrum: Intermedla and the Human Sensorium'
    definition: A multimedia sensory experience that uses physical and psychological
      manipulation to create an immersive environment for exploring human consciousness
      and bodily awareness.
    mechanism: The experience manipulates physical space through raised platforms
      and geometric islands, uses clothing removal as a psychological trigger for
      bodily awareness, and employs ambient music and light shows to create a multi-sensory
      environment that forces attention to the physical body and spatial relationships.
    boundary: 'Applies to the specific immersive installation ''Cerebrum: Intermedla
      and the Human Sensorium'' with its specific spatial design, clothing protocol,
      and sensory elements. Fails when the physical environment or sensory elements
      are not properly configured to create the intended psychological and physical
      effects.'
  expected_classification:
    depth: cross-domain
- id: cf489cc0d24c7b79a6e7ed7ea0a3fb2a9c1cde02f4ee7a1aabe3edd8ff7b08b9
  input_fb:
    name: Metaphor in Advertising Communication
    definition: Metaphor serves as a cognitive and communicative tool in advertising
      by mapping familiar domains onto less tangible commercial concepts, enabling
      audiences to understand and engage with abstract business ideas through familiar
      experiential frames.
    mechanism: Advertising employs metaphor to bridge the gap between abstract commercial
      values and concrete human experiences. Metaphorical mappings allow advertisers
      to convey complex financial or strategic concepts (e.g., commercial activity
      as war, value as location) by anchoring them in domains that are more easily
      understood or emotionally resonant. These mappings function both cognitively,
      by structuring how audiences process information, and discursively, by shaping
      narrative and persuasive strategies.
    boundary: Applies when advertising seeks to communicate abstract or intangible
      commercial concepts to a general audience. Fails when the target audience lacks
      familiarity with the source domain or when the metaphor is too obscure or culturally
      specific to be effective.
  expected_classification:
    depth: cross-domain
- id: 5c0c2a263cfa03c07429d5e2b7fd36c78a100e6db3bb31bdb691960cefbb14f0
  input_fb:
    name: Paradigm Shift in Scientific Fields
    definition: Scientific discoveries that introduce new fields while simultaneously
      transforming existing fields by challenging previously accepted paradigms and
      instruments.
    mechanism: 'New scientific insights create dual effects: they expand the domain
      of normal science by opening new research areas while simultaneously undermining
      established scientific frameworks and instruments that were previously considered
      paradigmatic.'
    boundary: Applies when scientific innovations both create new fields and transform
      existing ones. Fails when a discovery only creates new fields or only transforms
      existing fields.
  expected_classification:
    depth: cross-domain
- id: 75c15385b959160875df0c3bff3b8e2f92ff556700ddd33969e7d88352713150
  input_fb:
    name: Funding-driven Business Failure Mechanism
    definition: Businesses that receive excessive funding may lose their essential
      sense of market necessity and customer urgency, leading to failure despite initial
      success.
    mechanism: Excessive funding creates a disconnect between market reality and business
      operations, removing the pressure that normally drives innovation and customer
      focus. When companies are overfunded, they can delay necessary pivots and improvements
      because they don't feel the immediate need to adapt to customer feedback or
      market demands.
    boundary: Applies to businesses that receive excessive or misaligned funding that
      removes market discipline. Fails when businesses maintain strong customer focus
      and market responsiveness despite funding levels.
  expected_classification:
    depth: cross-domain
- id: 03d24ebc44b0ad9114d179ec3bc6273a42fbece7420e1e9216ce02d329719717
  input_fb:
    name: Sculptural Carriage Display
    definition: A genre of artistic sculpture that serves as a mobile display for
      luxury vehicles, with distinct stylistic categories based on aesthetic approach.
    mechanism: Sculptural cars are displayed as mobile art pieces that serve as status
      symbols, with different categories reflecting varying approaches to aesthetic
      presentation and social positioning.
    boundary: Applies specifically to luxury vehicle sculpture as a form of mobile
      art display in contemporary society. Does not apply to general sculpture or
      automotive design.
  expected_classification:
    depth: domain
- id: 4a6f26991d30d95d55c1f91ce5485854d6d8b6933c313958c0c75ca3aab5e99e
  input_fb:
    name: Economics As Evolutionary Science
    definition: A theoretical framework that positions economics as an evolutionary
      science rather than a static optimization-based discipline, emphasizing the
      need for dynamic methods and biological analogies.
    mechanism: The framework suggests that economics should move beyond optimizing
      models to embrace evolutionary and dynamic approaches, similar to how biological
      systems evolve through adaptation and change rather than through static equilibrium.
    boundary: Applies to theoretical and methodological discussions in economics about
      moving beyond neoclassical paradigms. Fails when the approach does not adequately
      address the practical implementation of evolutionary methods in economic analysis
      or when it fails to integrate the insights of biological systems into economic
      theory.
  expected_classification:
    depth: cross-domain
- id: 3d622ba29bfe588fb0b90270266c7fa23f5f2a10382f953c451ef6cb012c8b30
  input_fb:
    name: Source Reliability Verification
    definition: Assessing the trustworthiness of information sources requires actively
      questioning the methods and evidence behind their claims to identify potential
      biases, errors, or gaps in reasoning. This principle emphasizes that verification
      must probe beyond surface-level assertions to understand the analytical foundation
      of a source's conclusions.
    mechanism: 'This is a normative heuristic for information validation: asking ''how
      do you know?'' and ''how do you know that you know?'' forces sources to articulate
      their reasoning process and data sources. The questioning process reveals whether
      conclusions are based on robust evidence or speculation, and whether sources
      have considered alternative explanations or edge cases. It is a practical method
      for identifying the strength of evidence behind a claim.'
    boundary: Applies when sources make claims that can be traced to specific data,
      methods, or reasoning chains. Fails when sources rely on anonymous or unverifiable
      sources, or when the questioner lacks the domain expertise to evaluate the technical
      claims.
  expected_classification:
    depth: cross-domain
- id: 7de83dad1077efef84437bc4751329f470fe65197fb95142b70d35cf8ebb602b
  input_fb:
    name: Problem Typing Through Analogy
    definition: High-performing problem solvers categorize problems by their underlying
      structure rather than surface features, enabling them to apply solutions across
      domains. This approach involves recognizing deep patterns and mapping them to
      known solutions through analogy.
    mechanism: The best problem solvers engage in 'typing' of problems by identifying
      structural similarities to previously solved cases. This process involves abstracting
      away superficial details to reveal the core mechanism or pattern. When a problem
      is properly typed, it becomes possible to apply analogical reasoning to find
      solutions in other domains or contexts.
    boundary: Applies when problems have structural similarities that can be abstracted
      and mapped to prior knowledge. Fails when problems are entirely novel or when
      surface features are the only relevant distinguishing characteristics. Also
      fails when the problem solver lacks sufficient prior knowledge or experience
      to make meaningful analogies.
  expected_classification:
    depth: cross-domain
- id: 79e46b22cbec04722cc0db10e6cddcf0e58e41fac43e7167f33908673122ecdc
  input_fb:
    name: Human-ai Workflow Integration
    definition: Effective AI-powered systems require seamless integration of human
      oversight and machine automation, where AI handles routine tasks while humans
      manage exceptions and complex decision-making. The principle describes a collaborative
      framework where AI and human roles are clearly delineated and synchronized to
      optimize performance and user experience.
    mechanism: 'This is a practical design heuristic for system architecture: AI systems
      should automate repetitive or data-intensive tasks while reserving complex judgment
      and exception handling for human operators. The integration occurs through real-time
      communication channels (e.g., WebSockets, Supabase) that enable immediate human
      intervention when AI flags uncertain or critical cases. This approach balances
      automation efficiency with human contextual understanding.'
    boundary: Applies when AI systems can identify and flag exceptions or uncertain
      cases that require human judgment. Fails when AI systems operate in isolation
      without human oversight or when human roles are not clearly defined in the workflow.
  expected_classification:
    depth: cross-domain
- id: 01b7d5e956bcd54841d0bb1e1caea3a9114a3a4ca366b5a9155a741d12f5cedf
  input_fb:
    name: Conditional Dependency in Workflow Execution
    definition: Workflows with sequential steps exhibit conditional dependency where
      each step's execution depends on the successful completion of the previous step,
      and the final action is determined by a conditional decision based on prior
      outcomes. This creates a structured control flow that enables decision-making
      and error handling within automated processes.
    mechanism: This is a descriptive model of workflow structure and execution logic.
      In workflows with conditional dependencies, steps are arranged in a sequence
      where the outcome of one step determines whether and how the next step executes.
      The conditional decision point (e.g., comparing model performance) acts as a
      branching point that selects the appropriate path forward based on predetermined
      criteria. The structure enables both linear execution and conditional branching,
      allowing for complex decision-making within automated systems.
    boundary: Applies to workflows where steps have deterministic dependencies and
      conditional logic is used to select execution paths. Fails when steps are completely
      independent or when workflows rely entirely on parallel processing without sequential
      control flow.
  expected_classification:
    depth: domain
- id: 9c68268b44c31dcbefb31fbc8ddc9617fc43e031ede3aa162d8752ee724cc814
  input_fb:
    name: Continuous Time Random Walk
    definition: A stochastic process where successive displacements are random, independent
      across time intervals, and have identical probability distributions for same-length
      intervals.
    mechanism: The process maintains the same statistical properties across time intervals,
      with each displacement being independent of previous displacements but following
      the same distribution pattern.
    boundary: Applies to continuous-time stochastic processes with independent increments
      and identical distributions. Fails when the process has memory effects or non-stationary
      distributions.
  expected_classification:
    depth: universal
- id: c1a51bdd865f2c2e3e893e34de9517d160fed9e3035b020a4322dd25cd404212
  input_fb:
    name: Modality-agnostic Design Patterns
    definition: Effective system design in generative AI and machine learning often
      emphasizes modularity and reusability across different data modalities (text,
      image, audio) and application domains. The principle reflects a practical approach
      to building systems that can adapt to various use cases without requiring complete
      reimplementation.
    mechanism: This is a descriptive pattern that emerges from how modern AI systems
      are structured and deployed. The design approach treats components as reusable
      across domains, with specific implementations tailored to each modality or task.
      The pattern reflects the increasing standardization of tools, libraries, and
      frameworks that support cross-domain application, enabling engineers to leverage
      existing infrastructure and workflows rather than building from scratch.
    boundary: Applies when systems are built with modular components that can be reused
      across different data types or tasks. Fails when systems are highly specialized
      to one specific modality or task, or when the underlying architecture is not
      designed for cross-domain adaptability.
  expected_classification:
    depth: cross-domain
- id: 2fb314bc139b762408e07ff90c67b17ea9ffe6a1cae8ad34978632cd43cc3a8e
  input_fb:
    name: Collaborative Systemic Intervention
    definition: Successful large-scale social change requires sustained cross-organizational
      collaboration that builds diverse stakeholder relationships over time. The principle
      describes how systemic interventions achieve outcomes through coordinated efforts
      that span multiple institutions and levels of governance.
    mechanism: 'This is a descriptive model of how complex social systems evolve through
      multi-stakeholder engagement. The model identifies three key structural elements:
      (1) diverse participant groups with different organizational identities, (2)
      sustained time investment (often years) required for system-level change, and
      (3) iterative relationship-building that expands participation from core groups
      to broader networks. The process involves gradual inclusion of new actors as
      the system recognizes their value in achieving shared goals.'
    boundary: 'Applies when: (1) the problem spans multiple organizations or sectors,
      (2) solutions require coordination across different governance levels, and (3)
      outcomes depend on stakeholder commitment over extended periods. Fails when:
      (1) interventions are narrowly focused on single organizations or sectors, (2)
      change efforts lack sustained time investment, or (3) stakeholder diversity
      is not actively cultivated.'
  expected_classification:
    depth: cross-domain
- id: c88b7c41d23eb4d4fba1d8a7b1e3190cf4080a8d0fe1f3e158180efdbdb90b3b
  input_fb:
    name: Ecosystem-driven Business Innovation
    definition: Business innovation increasingly requires the integration of multiple
      partners, technologies, and capabilities into interconnected ecosystems that
      span industries and functions. These ecosystems enable organizations to leverage
      collective intelligence, resources, and competencies to address complex challenges
      and create value.
    mechanism: This is an empirical pattern describing how modern business environments
      are shifting toward collaborative, multi-stakeholder systems. Organizations
      are no longer isolated entities but nodes within larger networks where value
      is co-created through partnerships, shared technologies, and cross-industry
      collaboration. The pattern emerges from structural changes in markets, regulations,
      and technological capabilities that make ecosystem integration not just beneficial
      but necessary for competitive survival.
    boundary: Applies when organizations operate in environments where complexity
      exceeds individual capacity, and where value creation requires multiple complementary
      capabilities. Fails when organizations function in highly stable, predictable
      markets where isolated innovation suffices, or where regulatory or technological
      constraints prevent cross-partner collaboration.
  expected_classification:
    depth: cross-domain
- id: ffedfa2f80a3149923c5649eba0201265b28cef97cc5073a9f5c2aaa3dd1d396
  input_fb:
    name: Universal Significance in Semiotics
    definition: "Semiotics operates as a universal framework for analyzing any system\
      \ of signs, because all sign systems share fundamental structural properties\
      \ regardless of their specific domain or medium. The principle recognizes that\
      \ semiotics can be applied across diverse contexts\u2014language, images, customs,\
      \ music\u2014because they all function through the same basic semiotic mechanisms."
    mechanism: This is a descriptive model that identifies the structural organization
      of sign systems across domains. All semiotic systems involve a signifier (form),
      a signified (concept), and a relationship between them that enables communication
      or meaning-making. The principle describes the universal categories and relationships
      that define any semiotic system, not a causal process or rule of thumb.
    boundary: Applies to any system that generates or interprets signs, whether linguistic,
      visual, gestural, or cultural. Fails when the system lacks a clear relationship
      between form and meaning, or when the system is purely mechanical or random
      without intentional signification.
  expected_classification:
    depth: universal
- id: 02cad68c85950cc9055dd53fea7a454f8ad9764c880f59af74ce9f88b4b9ad67
  input_fb:
    name: Iterative Refinement Through Feedback Loops
    definition: Progressive improvement of designs, products, or processes occurs
      through repeated cycles of observation, feedback, and adjustment. Each iteration
      builds on prior insights to refine understanding and outcomes.
    mechanism: 'This is a practical heuristic for iterative design and development:
      observing user behavior or system performance, gathering feedback from stakeholders
      or participants, and making targeted adjustments to improve the next iteration.
      The process is cyclical and cumulative, with each round of refinement building
      on previous learnings to move closer to an optimal solution.'
    boundary: Applies when there is a clear feedback mechanism and opportunity for
      adjustment between cycles. Fails when feedback is absent, adjustments are not
      made, or the process becomes rigid and unresponsive to new information.
  expected_classification:
    depth: specialized
- id: 04af198886add691b302ad25b3c9a74e73229f9cbfb4910fb5a03ee1aafadf39
  input_fb:
    name: Kineticism in Xfilm
    definition: A descriptive principle for the visual and cinematic techniques used
      in John Schofill's XFilm that combines mechanical and organic elements to create
      synaesthetic cinematic experiences.
    mechanism: The passage describes how XFilm uses montage-as-collage techniques
      to combine organic human forms with mechanical elements, creating overwhelming
      kinaesthetic effects through precise frame manipulation and rhythmic patterns.
    boundary: Applies to the specific cinematic techniques in XFilm that blend organic
      and mechanical elements. Fails when the film does not employ these specific
      montage and kinaesthetic techniques.
  expected_classification:
    depth: specialized
- id: 03a91e6f9a9dce74434de32c40d3ce63db45e8578bd3ac6d14256fcf62549973
  input_fb:
    name: Narrative Alignment in Community Building
    definition: Effective community building requires aligning individual narratives
      with shared cultural or value systems that create consistent, recognizable experiences
      across diverse participants. This alignment enables coherent group identity
      and predictable engagement patterns despite individual differences.
    mechanism: When individuals within a community share or adopt common narratives,
      language, and reference points (such as the Big Book in AA), their interactions
      become structured around shared meaning. This creates a stable cultural foundation
      that transcends individual variation, allowing for consistent experiences regardless
      of location or personal background. The mechanism operates through the repetition
      and reinforcement of these shared elements, which become embedded in group identity
      and behavior.
    boundary: Applies when communities have sufficient shared reference points or
      cultural touchstones to anchor member behavior. Fails when communities lack
      any common narrative framework or when members are too isolated to internalize
      shared meanings.
  expected_classification:
    depth: domain
- id: bb928cf0467ee6a395fe99de4e6fe86eba0559216bdf5dd289f2d3d1aac80272
  input_fb:
    name: Alchemical Descent and Renewal Process
    definition: A transformative process where descent into suffering, death, and
      material reality leads to renewal and spiritual ascent through alchemical principles
      of dissolution and rebirth.
    mechanism: The process involves descending through states of suffering and death
      (physical, spiritual, or metaphorical) to dissolve old forms and patterns, followed
      by renewal through transformation and ascent to higher states of being.
    boundary: Applies to transformative experiences that involve descent into suffering
      or death followed by renewal. Fails when the descent is not followed by meaningful
      renewal or when the process is purely cyclical without progression.
  expected_classification:
    depth: cross-domain
- id: ca36564736360012d1b140e657b01fcf06c9cdc696637304f21044b1d49769d4
  input_fb:
    name: Time Pressure in Scientific and Engineering Development
    definition: A principle describing how compressed timelines between scientific
      discovery and engineering implementation prevent adequate real-world testing,
      leading to rushed deployment of unvalidated systems.
    mechanism: The rapid transition from scientific creation to engineering development
      creates insufficient time for life testing and basic research, forcing organizations
      to deploy systems before thorough validation can occur.
    boundary: Applies when there are compressed timeframes between scientific development
      and field implementation. Fails when adequate time is available for comprehensive
      testing and validation.
  expected_classification:
    depth: cross-domain
- id: 2eb211c076d8268f8c8b03c113a58f21f63b4e17ea9cb8f6b719aabb6d3ded8f
  input_fb:
    name: Divine Proportion in Nautilus Shell
    definition: The mathematical relationship where the successive chambers of the
      nautilus shell grow according to a logarithmic spiral framework, maintaining
      constant chamber shape while increasing in size.
    mechanism: The nautilus shell expands in a geometric progression where each chamber
      is a scaled version of the previous one, following the mathematical pattern
      of a logarithmic spiral that maintains constant angular relationships between
      successive turns.
    boundary: Applies specifically to the growth pattern of chambered nautilus shells
      and their mathematical representation. Does not apply to other spiral formations
      or non-organic structures.
  expected_classification:
    depth: universal
- id: f42c7f24ed08d1f02833ddb3bacdedeb666b8ac476e05349013311e0886a14fe
  input_fb:
    name: Resilience Through Adaptive Capacity
    definition: Individuals and systems can maintain function and adapt to stressors
      when they possess reserve resources or alternative pathways that buffer against
      decline. These reserves operate through cognitive, physical, or social mechanisms
      that allow for sustained performance despite underlying pathology or environmental
      pressure.
    mechanism: Adaptive capacity manifests as reserve resources that provide redundancy
      or alternative strategies in response to stress. For cognitive systems, this
      includes backup neural pathways that enable continued function despite disease
      progression. For physical systems, it involves physiological reserves like arterial
      flexibility or cardiovascular capacity that can compensate for damage or blockage.
      Social and psychological reserves (e.g., trauma-informed care, mental health
      support) also buffer against environmental stressors and prevent cascading dysfunction.
    boundary: Applies when individuals or systems have measurable reserve capacity
      that can be tapped during stress. Fails when reserves are completely depleted
      or when stress exceeds the system's adaptive range (e.g., extreme trauma, terminal
      illness). Also fails when reserves are not accessible or when the system lacks
      the ability to activate them (e.g., cognitive decline that eliminates alternative
      pathways).
  expected_classification:
    depth: cross-domain
- id: 33d526d74180291d1e2fe3ab5fbf4fb9cb1f4e72df8056c8c372e166e38605b4
  input_fb:
    name: Analogy Selection in Problem Solving
    definition: The process of identifying and selecting appropriate analogues for
      problem solving, where finding a good analogy is the most challenging aspect
      of the task.
    mechanism: Problem solvers must discover relevant analogues from their knowledge
      base rather than being given them, requiring them to identify causal relationships
      and structural similarities between the target problem and known cases.
    boundary: Applies to situations where analogical reasoning is used for problem
      solving rather than simple pattern matching. Fails when the problem lacks relevant
      analogues or when the analogy is not structurally similar enough to be useful.
  expected_classification:
    depth: cross-domain
- id: 1d75136f20b905ff14b81576f20f840b92d0a3d9ec0bf1c5e266a4a11c89069f
  input_fb:
    name: Monument-document Relationship in Historical Investigation
    definition: The relationship between monuments (primary materials) and documents
      (instruments of investigation) in historical research follows a consistent yet
      elastic pattern, comparable to the relationship between phenomena, instruments,
      and theory in natural sciences.
    mechanism: In historical investigation, monuments serve as primary materials that
      are investigated directly, while documents function as instruments that provide
      additional context or explanation for the monuments. This mirrors the scientific
      model where phenomena are the primary focus and instruments are tools for investigation.
    boundary: Applies to historical and scientific investigation methods where primary
      materials and supporting instruments or documents are used together. Does not
      apply to purely descriptive or narrative contexts.
  expected_classification:
    depth: cross-domain
- id: 197e48f5d87b156e126f2c33497e60f4fd0fa5fc17cb4c6a9daa24dec6c2c37a
  input_fb:
    name: Topographical Perspective in Architectural Design
    definition: Topographical perspective is a spatial and compositional approach
      in architectural design that emphasizes the relationship between buildings and
      their landscape context, rather than purely visual or pictorial representation.
      This method treats architectural elements as instruments within a topographic
      framework, integrating them into the natural and urban environment.
    mechanism: Topographical perspective operates as a design methodology where architectural
      features like domes are not merely compositional elements but functional instruments
      that align with and reflect the surrounding landscape. It involves understanding
      how buildings relate to their topographic context and using this relationship
      to inform design decisions, particularly in how spatial configurations and visual
      elements interact with the environment.
    boundary: Applies when architectural design must integrate with or respond to
      landscape and urban context. Fails when design is purely aesthetic or symbolic
      without regard to environmental or spatial topography, or when buildings are
      isolated from their geographical setting.
  expected_classification:
    depth: cross-domain
- id: 9c97350fcd19d630ac97a77aa3df281c68321d59aedc197eb95fbb96ce9b289e
  input_fb:
    name: Political Annealing and Stability Through Randomness
    definition: Introducing controlled randomness or stressors in political systems
      can prevent accumulation of explosive tendencies and maintain system resilience.
    mechanism: Political systems that eliminate instability and uncertainty can allow
      explosive social tensions to build up under the surface, similar to how absence
      of fire allows flammable materials to accumulate. Random stressors or controlled
      chaos can prevent such accumulation and maintain system stability.
    boundary: Applies to political systems where controlled randomness or stressors
      can prevent accumulation of social tensions. Fails when the system is too rigid
      to accept random perturbations or when the randomness is not properly calibrated.
  expected_classification:
    depth: cross-domain
- id: 4ba932954060f3b3eeea4fa4fd167eb621e08c2717b47cf7967b8aae6b510875
  input_fb:
    name: Matthew Effect
    definition: Initial advantages in resources, reputation, or connections compound
      over time to create disproportionate accumulation of benefits, leading to increasing
      returns for the already-advantaged while the disadvantaged fall further behind.
      The principle describes a self-reinforcing dynamic where early wins amplify
      into long-term dominance.
    mechanism: "The Matthew Effect operates through cumulative advantage \u2014 individuals\
      \ or entities that begin with more resources, recognition, or social capital\
      \ gain access to additional opportunities that reinforce their initial edge.\
      \ These advantages create a feedback loop where success breeds more success,\
      \ while those starting from a disadvantage face increasing barriers to catching\
      \ up. The mechanism is not driven by inherent ability or merit alone, but by\
      \ the structural tendency for initial disparities to grow over time."
    boundary: 'Applies when: (1) there is a resource or advantage that can compound
      over time, (2) the system rewards early accumulation or visibility, and (3)
      the advantage translates into further access or opportunities. Fails when: (1)
      resources are distributed equally or redistributed; (2) the system is purely
      meritocratic with no feedback from initial conditions; (3) there are no mechanisms
      for amplification of early wins.'
  expected_classification:
    depth: cross-domain
- id: a6c8175af9cebb11145f603bec09b0817fb575051250374c41516e6fc56ff95e
  input_fb:
    name: The Law of Truly Large Numbers
    definition: The principle that with a large enough number of opportunities, every
      event that can happen will eventually occur, making seemingly miraculous coincidences
      statistically predictable.
    mechanism: As the number of opportunities increases, the probability that any
      given event will occur approaches 1, making rare events statistically inevitable
      over large enough sample sizes.
    boundary: Applies when there are sufficiently large numbers of opportunities for
      events to occur. Fails when the sample size is too small to make the law's predictions
      meaningful.
  expected_classification:
    depth: universal
- id: 2e6212226215b5e9b25e2e815f6fc0373e5ace0856cf39c524f7c1aa309a24d4
  input_fb:
    name: Robotics and Ai Integration in Society
    definition: The gradual integration of robotics and AI systems into various aspects
      of daily life, from crisis response to logistics and manufacturing, representing
      a fundamental shift in how technology interfaces with the physical world.
    mechanism: AI systems operate as information automation while robotics provide
      physical instantiation and material manipulation, creating a bridge between
      digital intelligence and tangible physical outcomes through the automation of
      material processes.
    boundary: Applies to the increasing role of robotics in society across multiple
      domains including crisis response, logistics, manufacturing, and eldercare.
      Fails when AI systems cannot effectively interface with physical environments
      or when robotic systems lack the necessary integration with AI decision-making
      capabilities.
  expected_classification:
    depth: cross-domain
- id: eb2c67026124e3269972f9b056b19e25b2d118a355b83562069e0c1d7d1f8d7e
  input_fb:
    name: Temporal Aura Investment
    definition: The concept of investing objects with 'aura' to make them appealing
      enough to endure through time, requiring engagement with both methods/materials
      and their relationship to conceptions of change and temporal passage.
    mechanism: Objects are infused with aura to create enduring appeal, which requires
      understanding and engaging with how methods and materials relate to fundamental
      conceptions of time and change.
    boundary: Applies when objects need to maintain appeal across temporal dimensions.
      Fails when the temporal relationship between objects and their conception of
      change is not properly understood or engaged.
  expected_classification:
    depth: cross-domain
- id: a344596e4e819020f2dd38ee9c1aaa5ac346ed858f7624f89e728282317b2ed3
  input_fb:
    name: Global Village Conceptual Framework
    definition: A theoretical framework for understanding how new communication technologies
      create interconnected global communities where information and objects become
      instantly accessible to any debating community.
    mechanism: New media technologies create a 'Global Village' by making everything
      instantly available to any community that engages with them, transforming the
      relationship between objects, signs, and communication.
    boundary: Applies to the conceptual analysis of media's role in creating global
      connectivity. Fails when applied to physical or temporal limitations of actual
      media implementation.
  expected_classification:
    depth: cross-domain
- id: 040a95cb87be52e87be9a8b727c604a224f5aece45e4d7b6ff8a655089798d82
  input_fb:
    name: Metaphorical Conceptualization From Cultural Traces
    definition: Abstract concepts are formed through metaphorical mapping from concrete,
      culturally significant experiences or narratives. These metaphors persist in
      everyday language and symbolic systems, often retaining vestiges of their original
      cultural or historical context even when the source meaning is obscured.
    mechanism: Conceptual metaphors function as cognitive bridges that map familiar,
      embodied experiences (like journeys, narratives, or natural phenomena) onto
      abstract domains (like life, emotions, or social structures). These mappings
      are not arbitrary but emerge from shared cultural memories and archetypal stories
      that resonate across generations. The persistence of these metaphors in modern
      usage reflects how deeply embedded cultural narratives shape abstract thinking,
      even when the original context is forgotten or unacknowledged.
    boundary: Applies when abstract concepts are formed through metaphorical mapping
      from concrete experiences or narratives that are culturally or historically
      significant. Fails when abstract concepts arise from purely logical or mathematical
      reasoning, or when metaphors are entirely divorced from any cultural or experiential
      grounding.
  expected_classification:
    depth: cross-domain
- id: d03b55860212cafe7944752fcd1f1a02cf4ac30ac202f91132a1c531e75eadb2
  input_fb:
    name: Curation As Design and Pattern Recognition
    definition: "The principle that curation involves more than organization\u2014\
      it is a form of design that creates frameworks for understanding and connects\
      \ disparate elements through pattern recognition."
    mechanism: Curation functions as a form of design that organizes ideas and concepts
      into meaningful frameworks, using pattern recognition to connect elements across
      different domains and create new understanding.
    boundary: Applies to curatorial practice that goes beyond simple cataloging to
      create conceptual frameworks. Fails when curatorial work is reduced to mere
      organization or cataloging without conceptual structure.
  expected_classification:
    depth: cross-domain
- id: f48b523dd294073fe3dcc5c3ff9e2fc825ed367bc1838e901e084d914302ea48
  input_fb:
    name: Friction As Resistance to Motion
    definition: Friction is a resistive force that opposes motion between surfaces
      in contact, determined by the normal force and surface properties. It is a fundamental
      physical phenomenon that affects all moving objects and is quantified by coefficients
      that vary with material pairs.
    mechanism: "Friction arises from the interaction between surfaces at the molecular\
      \ level, where microscopic irregularities and intermolecular forces create resistance\
      \ to relative motion. The magnitude of friction depends on the normal force\
      \ pressing surfaces together and the coefficient of friction specific to the\
      \ material pair in contact. This relationship is expressed as Ff = \u03BCN,\
      \ where \u03BC is the coefficient of friction and N is the normal force."
    boundary: Applies when two surfaces are in contact and there is relative motion
      or tendency for motion. Fails when surfaces are not in direct contact, or when
      motion occurs in a vacuum or fluid medium where other forces dominate.
  expected_classification:
    depth: universal
- id: 913b9b86d5b6812d8e845375caf6c7708da6844645197fcf32fdcde47b9b871c
  input_fb:
    name: Gendered Language Encoding
    definition: Language structures often encode and reinforce gender hierarchies
      by defining women in relation to men or excluding women from professional roles.
      This reflects and perpetuates social power structures where male perspectives
      dominate linguistic expression.
    mechanism: Language reflects social power dynamics by structuring gendered terms
      and expressions in ways that position women as secondary or derivative to male
      roles. In English, gendered terms like 'chairman' or 'man and wife' define women
      in relation to men, while in some languages like Iroquois, female-centered structures
      are the norm. The Whorf Hypothesis suggests that language structure influences
      thought and social perception, encoding cultural biases about gender roles.
    boundary: Applies when language systems contain gendered terms that define women
      in relation to men or exclude women from professional roles. Fails when language
      systems are gender-neutral or explicitly female-centered, such as in some Indigenous
      languages or feminist linguistic reforms.
  expected_classification:
    depth: cross-domain
- id: 09f44adfdadfe2e6bb36c68f054c40ede5ede28b1f7a8250e84cab76f3f1256b
  input_fb:
    name: Hypothetical Questions for Semantic Alignment
    definition: A technique for improving semantic retrieval by generating hypothetical
      questions from text chunks to align them with user query patterns in embedding
      space.
    mechanism: The system generates hypothetical questions from text chunks during
      indexing, then compares user queries to these pre-generated hypothetical questions
      rather than raw text chunks, allowing retrieval of relevant content even when
      the original text is semantically distant from user queries.
    boundary: Applies during indexing when text chunks need semantic alignment with
      typical user query patterns. Fails when the hypothetical question generation
      does not capture the semantic intent of the original content.
  expected_classification:
    depth: specialized
- id: 2e0662c11d9ed99da010fdfa857058ba60338301150be89978a4a0aa0de79b87
  input_fb:
    name: Surface Area As Exposure Model
    definition: A conceptual framework for understanding how surface area relates
      to exposure and interaction with the environment, where larger surface areas
      increase contact and reaction opportunities but also risks.
    mechanism: Surface area represents the amount of material in contact with or able
      to react to the outside world, where increasing surface area allows more interactions
      but also increases vulnerability to negative effects.
    boundary: Applies to systems where physical or conceptual exposure matters, such
      as chemical reactions, biological processes, or information exposure. Fails
      when surface area is not a relevant factor for the system's behavior.
  expected_classification:
    depth: universal
- id: 429dffbe6d999650d89043819c96882367d0bb97e957ca126c90855a866fb654
  input_fb:
    name: Visual Communication As Universal Language
    definition: A conceptual framework that recognizes gesture, expression, and symbolic
      communication as fundamental human modes of visual interaction that transcend
      specific cultural or artistic boundaries.
    mechanism: Visual communication operates through universal human and animal expressions,
      formalized gestures in deaf culture, and artistic representations in dance and
      theater, all of which function as distinct yet interconnected modes of visual
      language.
    boundary: Applies to all human communication contexts where visual elements convey
      meaning, from basic animal signals to complex artistic expression. Fails when
      applied to purely abstract or non-communicative visual elements.
  expected_classification:
    depth: cross-domain
- id: 55b871a61eaae2c8bcc473efac6ec8c3ba28425a8294cfcc860dc442800b91f0
  input_fb:
    name: Design Research As Interdisciplinary Practice
    definition: An approach to design research that emphasizes the integration of
      diverse scientific perspectives and methods to address complex societal challenges.
    mechanism: The approach requires the inclusion of multiple scientific disciplines
      in design research, creating a collaborative environment where different methodological
      approaches can be combined and where the complexity of design problems is acknowledged
      rather than simplified.
    boundary: Applies to design research that seeks to address complex, multi-faceted
      problems requiring interdisciplinary collaboration. Fails when design research
      remains isolated within single disciplines or avoids acknowledging methodological
      complexity.
  expected_classification:
    depth: cross-domain
- id: e1f411500bc2ed92a67cf341fe7d0aa4b4662e8c26865a297cd23b8b07711f33
  input_fb:
    name: Modular Design in Software and Architecture
    definition: A design strategy that uses fixed sets of components to generate complex
      systems through repetition and assembly.
    mechanism: Software modularity uses a small set of graphics or elements that are
      repeated to generate larger complex images, while architectural modularity uses
      fixed elements (Y-shaped elements and connectors) that can be assembled in myriad
      ways to create complex structures.
    boundary: Applies to design systems where fixed components can be combined in
      multiple configurations. Fails when the design system lacks modular components
      or when the components cannot be assembled in multiple ways.
  expected_classification:
    depth: cross-domain
- id: 2bad0450a328e7bfdc324fb5e9aa443227987a9fdb2fb3f14f2957e2cabd455e
  input_fb:
    name: Genetic Algorithms in Practice
    definition: A practical application of genetic algorithms across diverse scientific,
      engineering, and creative domains including aircraft design, satellite image
      analysis, and digital animation.
    mechanism: Genetic algorithms are deployed as problem-solving frameworks in various
      domains, with specific implementations adapted to solve particular challenges
      such as aircraft design automation, satellite image analysis, and computer graphics
      generation.
    boundary: Applies to real-world problem-solving contexts where genetic algorithms
      have been successfully implemented. Fails when the specific domain or application
      context is not suitable for GA approaches.
  expected_classification:
    depth: cross-domain
- id: 026451e79a700a393342bfd7e1f1d2c130e86ea521ba2429dd75f53e739ffc2f
  input_fb:
    name: Systems Thinking in Design
    definition: A design approach that integrates system thinking to address the broader
      context of stakeholders and unintended consequences, moving beyond traditional
      user-centered design methods.
    mechanism: The approach uses causal loop maps to study counterintuitive effects
      and futures wheels to analyze first- and second-order consequences, allowing
      designers to test foundational assumptions and push back against techno-optimism
      that ignores unintended effects.
    boundary: Applies when designers need to move beyond narrow user empathy to consider
      broader system impacts. Fails when designers remain focused solely on immediate
      user needs and direct experiences without considering broader stakeholder impacts.
  expected_classification:
    depth: domain
- id: f8fb64ffcf5b5699907162362dc71bfad1f9222d134f1986c21a5f2820306f1b
  input_fb:
    name: Tangled Hierarchy Framework
    definition: A conceptual framework where interpretation conventions and meta-rules
      exist at different hierarchical levels, with an I-level (Inviolate) governing
      T-level (Tangled) operations while maintaining a hierarchical relationship.
    mechanism: The I-level serves as the foundational layer that governs and interprets
      the T-level, which contains the tangled hierarchy of rules and conventions.
      The system allows for recursive application of rules where each level's rules
      apply to the level above it.
    boundary: Applies when there is a clear distinction between inviolate foundational
      levels and tangled operational levels. Fails when the distinction between levels
      becomes blurred or when levels are not properly separated.
  expected_classification:
    depth: cross-domain
- id: c1fe8b52d06585ec29320eafb61202ba5b3d0ef4045d42a6b7918117d1be3978
  input_fb:
    name: Maternal Bonding Disruption During Birth
    definition: A process where childbirth is treated as a medical emergency rather
      than a natural developmental process, disrupting the immediate mother-baby bond
      and family integration.
    mechanism: The medicalized approach to childbirth creates barriers to immediate
      physical contact and emotional connection between mother and baby, treating
      the birthing process as a separation event rather than a continuation of family
      development.
    boundary: Applies when childbirth is managed in highly medicalized environments
      that prioritize procedural control over natural bonding. Fails when birth occurs
      in supportive, family-centered environments.
  expected_classification:
    depth: cross-domain
- id: b7cd58a9a6040448e20aa9c4ab34e486ad38a0deb0e912bde2f8ab3a1bd2643a
  input_fb:
    name: Metaphorical Representation
    definition: Abstract concepts and complex systems are best understood through
      metaphorical framing that maps familiar domains onto unfamiliar ones. This principle
      describes how analogies and poetic devices enable comprehension of intricate
      subjects by relating them to known experiences.
    mechanism: 'Metaphor functions as a cognitive bridge that translates abstract
      or technical ideas into familiar conceptual frameworks. When a complex system
      is described through analogy (e.g., ''my love is like a red, red rose''), the
      metaphor serves as a functional mapping that allows understanding of the relationship
      between elements. The same principle applies across domains: from poetry where
      metaphors elaborate emotional states, to data storytelling where analogies make
      complex subjects accessible, to systems thinking where metaphors model relationships
      between components.'
    boundary: Applies when the subject matter is inherently abstract, complex, or
      unfamiliar to the audience. Fails when the audience already has a clear understanding
      of the concept or when the metaphor is overly obscure or irrelevant to the intended
      audience's experience.
  expected_classification:
    depth: cross-domain
- id: 18516677371f0bfa0431f642b7bdc06c7b11a373c4cbeff1dcc6c987f43ef46a
  input_fb:
    name: Data-driven Design Visualization
    definition: Design processes can be enhanced by visualizing complex datasets to
      reveal patterns, trends, and relationships that inform creative and strategic
      decisions. This approach bridges the gap between abstract data and tangible
      design outcomes.
    mechanism: Data-driven design visualization transforms quantitative information
      into visual representations that make hidden structures and correlations visible
      to designers and stakeholders. The process involves selecting relevant datasets,
      applying appropriate visualization techniques, and interpreting the resulting
      visual insights to guide design direction and decision-making.
    boundary: Applies when design projects involve complex datasets that can be meaningfully
      represented visually. Fails when data is too sparse, irrelevant, or lacks sufficient
      variation to support meaningful visualization or when the design context does
      not benefit from data-informed insights.
  expected_classification:
    depth: cross-domain
- id: f88cf2b4bfc323e833a809a85b065732124783a1d500bf73f9fdf0a16923e5dc
  input_fb:
    name: Visual Rhetoric and Contextual Meaning
    definition: Visual communication is inherently rhetorical and embedded within
      social, cultural, and contextual frameworks that shape both creation and interpretation.
      The meaning of visual elements is not fixed but emerges from the interaction
      between the designer's intent, the audience's cultural background, and the broader
      discourse community.
    mechanism: Visual rhetoric operates through the interplay of design choices, cultural
      conditioning, and contextual framing. The same visual element can carry different
      meanings depending on its social setting, the audience's familiarity with visual
      vocabularies, and the rhetorical purpose it serves. Designers shape meaning
      through selective presentation and cultural encoding, while audiences decode
      messages through shared understandings and situational interpretation.
    boundary: Applies when visual elements are created with communicative intent and
      interpreted within social or cultural contexts. Fails when visual elements are
      purely aesthetic or technical without rhetorical purpose, or when they exist
      outside any cultural or communicative framework.
  expected_classification:
    depth: cross-domain
- id: f074013684202c6ecb82ed599269d2ff2098addcb4834a4302db77efe82812ad
  input_fb:
    name: Information Environment Design
    definition: Effective information environments are shaped by interactive, user-generated
      content and real-time collaboration features that enable shared experiences
      and competitive engagement. These environments evolve from simple digital spaces
      into complex ecosystems where users invest time in customization, community
      building, and strategic competition.
    mechanism: Information environments develop through iterative user participation
      and technical evolution. Early digital spaces like MUDs and Quake maps provided
      foundational structures for immersive interaction. As technology advanced, these
      environments incorporated real-time multiplayer capabilities, competitive gaming
      elements, and user-modifiable features that deepened engagement and fostered
      community formation. The design process involves both technical implementation
      (e.g., 3D graphics rendering, network connectivity) and social dynamics (e.g.,
      clan formation, modding communities).
    boundary: Applies when digital environments support real-time interaction, user-generated
      content, and competitive or collaborative features. Fails when environments
      are static, read-only, or lack community engagement mechanisms. Also fails for
      environments where users cannot meaningfully contribute to or modify the space.
  expected_classification:
    depth: cross-domain
- id: 0359a8370d3df5eec0b05cb82d0e6578afc3d16903f4b3363e28f72c62cee036
  input_fb:
    name: Collective Accountability Rule
    definition: In systems with collective outcomes, rules that hold individuals accountable
      for results regardless of individual fault or intent. These rules are designed
      to maintain system stability and prevent cascading failures by enforcing consequences
      for outcomes rather than process.
    mechanism: 'This is a normative heuristic: in systems where outcomes affect the
      whole group, holding individuals responsible for results (even when not at fault)
      is a practical rule that prevents systemic collapse. The principle prescribes
      a behavioral approach to collective responsibility, not a causal explanation
      of how systems function. It operates as a design decision for maintaining group
      or organizational integrity.'
    boundary: Applies in systems where individual actions have collective consequences
      and where fault attribution is difficult or irrelevant. Fails when individual
      accountability is more important than collective stability, or when the system
      lacks clear outcome-based metrics for evaluation.
  expected_classification:
    depth: domain
- id: 15e7e9a792822d5cda471f3e7b79ab1a766e41b4bba9839fc63360f2c9e2901c
  input_fb:
    name: Word Association and Random Stimulus Method
    definition: A creative technique involving rapid word generation from stimuli
      or random sources to explore unexpected associations and reveal group thought
      patterns.
    mechanism: The method uses timed word generation from various sources (free association,
      random page selection, or targeted stimuli) to capture spontaneous thoughts
      and reveal underlying mental patterns, then compares results to identify thematic
      threads.
    boundary: Applies when exploring group or individual creative processes through
      rapid word generation. Fails when the time limit is not maintained or when results
      are not compared for thematic analysis.
  expected_classification:
    depth: specialized
- id: 2024f386e11ce5640f7723d76cd1c295bb65a81e8fdff0a500764c4e62867c65
  input_fb:
    name: Pinboard Animation Technique
    definition: A traditional animation method invented by Alexander Alexeieff and
      Claire Parker that uses a perforated screen with thousands of pins to create
      dramatic textural effects through shadows cast by varying pin heights.
    mechanism: The technique involves pushing and pulling thousands of closely-spaced
      pins into a perforated screen to achieve varying pin heights, which cast shadows
      when lit to create a wide range of tones resembling mezzotint, wood carving,
      or etching effects.
    boundary: Applies to traditional animation methods developed in the 1930s by Alexeieff
      and Parker. Fails when the pins cannot be manipulated or when lighting conditions
      do not produce the desired shadow effects.
  expected_classification:
    depth: specialized
- id: 6801aad3c04666879b5c9323c19f3b16dfbd212c68fe27feebf27d81523b4454
  input_fb:
    name: Data Visualization Through Physical Sculpture
    definition: A process for transforming quantitative water data into aesthetically
      engaging physical forms through exploratory sketching and digital design.
    mechanism: The process involves exploratory drawing and sketching to understand
      data patterns, 2D iteration to 3D form transformation, and digital design of
      2D parts that are then fabricated into stacked 3D structures using materials
      and fabrication methods.
    boundary: Applies to data visualization projects that transform quantitative datasets
      into physical sculptural forms through iterative design processes. Fails when
      the project does not involve physical fabrication or data-driven sculptural
      design.
  expected_classification:
    depth: cross-domain
- id: 00791d14736526631622494c5035d93e5fe25dbba6c6158101088bdecdb5570a
  input_fb:
    name: Personal Mission Alignment
    definition: A personal mission emerges from aligning one's core paradigms with
      fundamental principles, creating an empowering center that guides decision-making
      and provides meaning in the face of life's rapid changes. The mission is not
      invented but discovered through realignment with deeper values and vision.
    mechanism: This is a descriptive model of personal development, not a causal mechanism.
      The principle describes the structure and process of how personal missions form
      through the integration of values, vision, and core paradigms. It outlines the
      relationship between an individual's inner center (paradigms, values, vision)
      and their external engagement with the world, showing how alignment creates
      clarity and purpose. The model positions personal mission as a lens through
      which one interprets and responds to life's challenges.
    boundary: Applies when individuals seek meaning and direction in their lives,
      particularly during periods of rapid change or existential uncertainty. Fails
      when people are not engaged in self-reflection or when they reject the idea
      that values and vision can guide action. Also fails for those who believe missions
      are purely constructed rather than discovered.
  expected_classification:
    depth: domain
- id: 6dd8fdd63f949329f84253f145978f8d39e857c7f9faa205785a9d7fb9c58607
  input_fb:
    name: Radical Difference Through Consistent Small Choices
    definition: Small, consistent decisions made over extended periods produce dramatically
      larger outcomes than large, infrequent choices, even when the initial choice
      appears less valuable. This principle describes how compound effects amplify
      small advantages into transformative results.
    mechanism: 'This is a normative heuristic: making small, smart choices consistently
      over time creates exponential growth in outcomes. The mechanism is not a single
      causal chain but a practical rule that leverages the mathematical properties
      of compounding. Each small decision builds upon previous ones, and the accumulation
      of these decisions over time creates a multiplicative effect that far exceeds
      what any single large decision could achieve.'
    boundary: Applies when choices are made consistently over time and the outcomes
      compound. Fails when choices are made inconsistently, when external factors
      disrupt the compounding process, or when the system does not support accumulation
      (e.g., one-time events or non-renewable resources).
  expected_classification:
    depth: cross-domain
- id: fc98b367c45730389923c841f0cbbba32a7cc56593468b973c75170ee8eaaebf
  input_fb:
    name: Black Swan Event Recognition
    definition: Events that are highly improbable, unpredictable, and have extreme
      consequences are often only recognized as such in hindsight, when their occurrence
      becomes explainable through the lens of hindsight bias. These events are not
      merely rare; they are fundamentally outside the scope of normal prediction models
      and historical precedent.
    mechanism: Black swan events are characterized by their low probability and high
      impact, which makes them invisible to standard forecasting methods. They are
      not just outliers in a distribution but represent a category of occurrence that
      challenges the assumptions of linear causality and historical precedent. The
      recognition of such events only comes after they have happened, when the narrative
      can be constructed to make them seem inevitable or explainable, despite their
      initial unpredictability.
    boundary: Applies when an event is both highly improbable and has a significant
      impact, and its occurrence is not explained by prior models or patterns. Fails
      when the event is either predictable or has no significant consequence, or when
      the event is fully explained by existing models or historical trends.
  expected_classification:
    depth: universal
- id: 5b446a109bd20280ae5ef9b7b97244d328642bd213d5f3c57acf9b717cc3527c
  input_fb:
    name: Fenian Photographs As Panopticon Gaze
    definition: A theoretical framework examining how Victorian photographs of Fenian
      prisoners functioned as both surveillance mechanisms and spectacle, reflecting
      institutional power structures and visual culture of the period.
    mechanism: The photographs functioned as both institutional surveillance (panopticon
      gaze) that recorded facts about individuals and as spectacle (gaze of spectacle)
      that allowed viewers to see and interpret the subjects.
    boundary: Applies to Victorian-era photographs of Fenian prisoners that were part
      of official state surveillance systems. Fails when photographs are not part
      of institutional surveillance or when they don't reflect the dual nature of
      surveillance and spectacle.
  expected_classification:
    depth: cross-domain
- id: c41af4f67329e21fb6f1322fa74221fabf6d9407e6d7444913fbbda64e46fbd8
  input_fb:
    name: Structured Social Proof Manipulation
    definition: Organized groups can artificially generate and amplify social proof
      through coordinated actions to influence audience behavior and perception. This
      involves creating the appearance of widespread approval or participation to
      increase credibility and encourage similar responses from others.
    mechanism: 'This is a practical heuristic for generating social proof: systematically
      organizing individuals to create the illusion of collective endorsement or participation.
      The mechanism works by leveraging the psychological principle that people interpret
      group behavior as evidence of legitimacy or desirability. When audiences observe
      apparent consensus, they are more likely to conform to that behavior, even if
      the consensus is artificially induced.'
    boundary: 'Applies when: (1) a group can coordinate actions to simulate widespread
      participation, (2) the target audience interprets group behavior as genuine
      social proof, and (3) the behavior is designed to influence others'' decisions
      or actions. Fails when: (1) the audience recognizes the artificiality of the
      behavior, (2) the group lacks sufficient coordination to maintain the illusion,
      or (3) the behavior is too obviously contrived to appear authentic.'
  expected_classification:
    depth: cross-domain
- id: 03c2ec732245a2f0a64e52a07c2f9fab532dd4ab6ee92a8dfeb9f90030e5f429
  input_fb:
    name: Form-function Integration in Constructivist Design
    definition: Constructivist design principles integrate artistic form with functional
      purpose, particularly in publishing and book design, where visual elements serve
      both aesthetic and structural roles. The approach emphasizes that form must
      align with content and context to achieve meaningful communication.
    mechanism: In constructivist design, visual elements like circles or abstract
      forms are not merely decorative but are chosen based on their ability to reflect
      or enhance the meaning of the content they accompany. The design process prioritizes
      the relationship between form and function, where the structure of the medium
      (e.g., a book cover) determines how visual elements should be interpreted and
      used.
    boundary: Applies when design is intended to integrate artistic expression with
      functional communication, particularly in publishing and editorial design. Fails
      when form is purely ornamental or when the medium does not support structural
      integration of visual and semantic elements.
  expected_classification:
    depth: domain
- id: 39c150aed6d547565ad3d7777f2e58e9a8c2b764a1f14fa20009dd5fd1985a98
  input_fb:
    name: New Governance Models
    definition: A conceptual framework for understanding contemporary governance that
      moves away from traditional parliamentary decision-making toward decentralized,
      multi-actor systems that rely on institutionalized rule systems rather than
      command-and-control mechanisms.
    mechanism: Governance shifts from centralized legislative control to distributed
      systems where private entities participate in regulation through various mechanisms
      like verification requirements, disclosure mandates, and performance-based approaches.
    boundary: Applies to contemporary governance structures that involve multiple
      actors and non-traditional regulatory methods. Fails when traditional command-and-control
      systems remain dominant.
  expected_classification:
    depth: cross-domain
- id: 0f435b6dbfe41682774bc4ec57b6ec7042210038de88f311ec1c6425ffaba053
  input_fb:
    name: Symbolic Transformation Through Adversity
    definition: Individuals and societies undergo symbolic transformation when confronted
      with extreme circumstances that challenge their existing worldview, leading
      to a reconfiguration of meaning and identity. This process involves a shift
      from naive understanding to deeper awareness, often triggered by events that
      appear meaningless or unjust.
    mechanism: "The mechanism operates through the confrontation of pre-existing symbolic\
      \ frameworks with overwhelming or inexplicable experiences. When individuals\
      \ or groups encounter situations that defy their current understanding\u2014\
      such as abduction by aliens, natural disasters, or heroic struggles\u2014they\
      \ are forced to revise their mental models. This revision often involves adopting\
      \ new symbolic systems that can accommodate the previously incomprehensible,\
      \ thereby transforming both personal identity and collective cultural narratives."
    boundary: Applies when an individual or group experiences a transformative event
      that disrupts their existing symbolic framework. Fails when the event is purely
      random or lacks any symbolic resonance for the observer, or when the individual
      is completely isolated from cultural or social context that might enable reinterpretation.
  expected_classification:
    depth: cross-domain
- id: f19e2fc1241403dacb995c9f20de37f711a08ea575cc6b13d222b66dbe6682cb
  input_fb:
    name: Heroic Archetypal Journey
    definition: The heroic journey is a recurring narrative pattern in mythology and
      psychology where a hero confronts a dragon or serpent, defeats it, and gains
      a treasure or transformed state. This pattern reflects the psychological process
      of individuation and the integration of the shadow.
    mechanism: The hero archetype represents the psychological journey toward individuation,
      where the hero must confront and integrate the shadow (represented by the dragon
      or serpent) to achieve wholeness. The dragon or serpent symbolizes the unconscious
      aspects of the self that must be integrated rather than repressed. The battle
      with the dragon occurs at a symbolic threshold (sundown, mountain, river) that
      represents the transition from one psychological state to another. The victory
      over the dragon frees the anima or animus (represented by the maiden or treasure)
      and leads to transformation and return.
    boundary: Applies when a narrative or psychological process involves a hero confronting
      and overcoming a symbolic antagonist (dragon, serpent) that represents unconscious
      material. Fails when the pattern does not involve a clear threshold, transformation,
      or integration of shadow elements. Also fails when the pattern lacks psychological
      or mythological significance in the cultural context.
  expected_classification:
    depth: cross-domain
- id: 329d40348e8ed95dd6457cf81f016d30af721a98f66983b8519a4e589d8c7145
  input_fb:
    name: Training Loop Metrics Monitoring
    definition: Effective machine learning training requires continuous monitoring
      of key performance indicators including loss values, accuracy scores, and reward
      statistics to track model convergence and detect potential issues like overfitting
      or underfitting.
    mechanism: 'This is a practical monitoring heuristic: tracking multiple metrics
      during training provides real-time feedback on model behavior and performance.
      The process involves measuring and logging values such as training/validation
      loss, accuracy percentages, and reward distributions at regular intervals or
      after specific batches/epochs. These metrics serve as quantitative signals that
      guide decisions about model adjustments, early stopping, or hyperparameter tuning.'
    boundary: Applies to supervised and reinforcement learning systems where model
      performance can be quantified through defined metrics. Fails when metrics are
      not available or meaningful for a given model architecture, or when the training
      process lacks structured evaluation points.
  expected_classification:
    depth: specialized
- id: ac840cc987554872bf2eb3cc7d9908d227fbb5c9aeaa250b5c4f011d804dff9f
  input_fb:
    name: Mind-body Dualism and Ai Development
    definition: A philosophical perspective on the relationship between mind and body
      that has influenced both Western medicine and AI research, particularly in how
      artificial intelligence systems are designed to simulate human cognition.
    mechanism: The Cartesian mind-body dualism concept, which separates mind and body
      as independent entities, has shaped Western medical approaches and AI development,
      where early AI focused on simulating human reasoning while neglecting the role
      of physical embodiment in intelligence.
    boundary: Applies to philosophical and AI development contexts where mind-body
      dualism influences design approaches. Fails when the relationship between mind
      and body is understood as integrated rather than dualistic.
  expected_classification:
    depth: cross-domain
- id: 0f78406b62d6fcb6143330d18fa768bca522b26334aba9ada6069c12a88c04d4
  input_fb:
    name: Obama Campaign Digital Marketing Innovation
    definition: A transformation in political campaigning through the use of digital
      marketing techniques, including member-get-member programs, A/B testing, and
      grassroots community engagement.
    mechanism: The Obama campaigns used digital tools like email marketing, database
      management, and A/B testing to optimize fundraising and voter engagement, building
      on earlier innovations from the Howard Dean campaign that emerged from the dot.com
      bust era.
    boundary: Applies to political campaigns that use digital marketing techniques
      and data-driven approaches to voter engagement and fundraising. Fails when campaigns
      rely solely on traditional media or don't utilize data-driven marketing methods.
  expected_classification:
    depth: cross-domain
- id: be0fc169ab1076fd81760cad72fbfa382b5ddd9912f5b0478f05ee1c6affee5b
  input_fb:
    name: Adaptation and Optimization Conditions
    definition: The conditions under which adaptive systems can produce optimal solutions
      or equilibrium states in complex environments.
    mechanism: Adaptive systems do not necessarily lead to optimal solutions, but
      there are specific conditions under which simple adaptive mechanisms can uncover
      optimal solutions to problems, though these conditions vary across different
      problem domains.
    boundary: Applies to adaptive systems in optimization problems where the system's
      structure and the problem's characteristics align to produce optimal outcomes.
      Fails when adaptive systems encounter problems with structural elements that
      inherently confound their mechanisms.
  expected_classification:
    depth: cross-domain
- id: 6dae0ef22b642eb5289a1915b30b2ce80b1fefcafc5445ba95c79102bfe3fdee
  input_fb:
    name: Conceptual Scaffolding for Knowledge Transfer
    definition: Flexible conceptual frameworks that organize information and enable
      knowledge transfer between domains by providing scaffolding for connecting and
      accessing knowledge.
    mechanism: Conceptual schemes arrange information and ideas for diverse uses,
      allowing transfer of knowledge between different contexts and domains by creating
      structured connections that make information accessible and adaptable.
    boundary: Applies to modern work environments requiring cross-domain knowledge
      application. Fails when knowledge is domain-specific and cannot be meaningfully
      transferred.
  expected_classification:
    depth: cross-domain
- id: 1e8d0bf0bd93ac994b5b2c7fe101503fdc9bc8da314c48ed3599d4361d3b1fcd
  input_fb:
    name: Systems Thinking with Human Agency
    definition: A purposeful activity approach to systems thinking that leverages
      formal systems frameworks while avoiding the assumption that human actors must
      function as rational automata, which was a problematic implication of 1960s-1970s
      management science.
    mechanism: This approach maintains the analytical power of formal systems thinking
      while preserving human cognitive limitations and behavioral complexity, allowing
      for more realistic modeling of human decision-making processes.
    boundary: Applies when systems thinking is used as a tool rather than a prescriptive
      framework for human behavior. Fails when the approach becomes overly rigid or
      assumes human rationality.
  expected_classification:
    depth: cross-domain
- id: 1e3828618ae02717c9cf837e3d5482eb3700c9bf5ead7a0b6c7ba4b4b79b0a55
  input_fb:
    name: Humanness in Strategic Execution
    definition: Successful implementation of blue ocean strategies requires integrating
      psychological and human-centered considerations into the strategic process,
      rather than treating strategy as purely analytical or operational. This principle
      emphasizes that organizational change efforts fail when they ignore fundamental
      human needs and emotional responses to strategic shifts.
    mechanism: 'The principle describes a practical necessity for strategic execution:
      human-centered design and psychological understanding must be embedded in the
      process of implementing blue ocean strategies. This is not a causal mechanism
      but a normative heuristic that prescribes how to approach strategy implementation
      effectively. The integration of ''humanness'' involves acknowledging and addressing
      the emotional and psychological dimensions of organizational change, which are
      often overlooked in favor of purely analytical frameworks.'
    boundary: Applies when organizations attempt to implement blue ocean strategies
      and face resistance or failure due to lack of attention to human factors. Fails
      when organizations focus exclusively on analytical frameworks, data-driven metrics,
      or operational efficiency without considering the human elements of change.
  expected_classification:
    depth: cross-domain
- id: 4f7fd6103b6d882d54b615f4165364b2b0342b409970703bed8cbc0444bf9d3e
  input_fb:
    name: Kinetic Art and Scientific Method
    definition: A principle in kinetic art that uses scientific methodologies like
      questionnaires to study audience responses to interactive artistic propositions.
    mechanism: Artists employ structured scientific methods such as questionnaires
      to systematically examine how viewers respond to their interactive artworks,
      treating the audience's perception and reaction as measurable phenomena rather
      than subjective experience.
    boundary: Applies to kinetic art from the 1950s-60s that adopts scientific approaches
      to audience analysis. Fails when the scientific method is not applied or when
      audience responses are not systematically measured.
  expected_classification:
    depth: cross-domain
- id: 2bee81d85c291c5c79f6f69fc1a55aa26917b46c86b22a0a1f7fe217da0e0bfa
  input_fb:
    name: Creative Economy Education Integration
    definition: A pedagogical approach combining business and creative thinking to
      meet the demands of the creative economy through specialized master's programs.
    mechanism: These programs integrate design thinking, creative leadership, and
      business management to bridge the gap between creative and business disciplines
      in education.
    boundary: Applies to higher education programs that combine creative and business
      disciplines. Fails when programs lack integration or focus solely on one domain.
  expected_classification:
    depth: cross-domain
- id: 006ca5a3999369c44cc66c263fe8ba4d06899bc682fee77719d08487826dda36
  input_fb:
    name: Opportunity-shaped Goal Evolution
    definition: The dynamic process by which opportunities influence and reshape goals
      through mutual interaction, where the opportunity raises aspiration levels and
      identifies additional goal properties while the solver attempts to utilize the
      opportunity for practical implementation.
    mechanism: The recognition of an opportunity creates a feedback loop where the
      opportunity's potential shapes the goal's scope and properties, while the solver's
      practical considerations (like investment requirements) influence whether the
      opportunity can be realized.
    boundary: Applies when an opportunity and goal interact dynamically, with each
      influencing the other's development. Fails when opportunities are passive or
      goals are static and unchanging.
  expected_classification:
    depth: domain
- id: 74bb7c768acf9c5aa8eb7b4802553f3836e6c58288395fcf80e2759033b9e5fd
  input_fb:
    name: Societal Interdependence Through Art and Technology
    definition: Societal outcomes are shaped by the interplay between individual artistic
      expression and broader systemic structures that support or hinder its dissemination.
      The health and direction of society depend on both the quality of individual
      creative output and the institutional frameworks that enable or constrain its
      reach.
    mechanism: Artistic creation and societal impact are mutually dependent. Individual
      creativity requires a supportive ecosystem of education, funding, criticism,
      and distribution channels to achieve broad reach. When this ecosystem is weak
      or misaligned, even high-quality art may fail to reach its audience, while systemic
      dysfunction can prevent the emergence of beneficial innovations. The relationship
      is not linear but involves feedback loops where societal conditions shape artistic
      production, which in turn influences social outcomes.
    boundary: Applies when individual creative expression is influenced by and influences
      broader social structures. Fails when artistic creation is isolated from institutional
      support or when systemic structures are so rigid that they prevent any meaningful
      feedback between art and society.
  expected_classification:
    depth: cross-domain
- id: 01089c5b0d169583fae8f72b5fc4ecf9546476c943dca2203f1c47d95cb77648
  input_fb:
    name: Technology Adoption Analogy Fallacy
    definition: A flawed argument that assumes past technology success in one market
      can be directly applied to new technology in a different market based on shared
      attributes, without sufficient evidence of causal relationships.
    mechanism: The argument creates a false equivalence between past and present situations
      by focusing on shared attributes while ignoring the complexity of actual adoption
      factors and the uniqueness of each market context.
    boundary: Applies to situations where analogies are used to predict outcomes without
      sufficient evidence of causal relationships. Fails when the analogies ignore
      the complexity of real-world adoption factors and market dynamics.
  expected_classification:
    depth: domain
- id: c91c1cdfb3090a2458d2416ad02338a03d57da85644070426db686fc3e35d556
  input_fb:
    name: Objective Knowledge Transmission Through Symbols
    definition: The principle that objective knowledge based on ancient methods and
      principles of observation can only be transmitted through symbols and myths,
      as ordinary language inevitably distorts its meaning when perceived by subjective
      consciousness.
    mechanism: Objective knowledge that exists in an 'objective state of consciousness'
      becomes distorted when expressed through subjective consciousness, creating
      delusions rather than truth. Symbols and myths serve as the only vehicles for
      preserving the pure meaning of such knowledge.
    boundary: Applies to knowledge systems that claim to be based on ancient methods
      and principles of observation. Fails when knowledge is transmitted through ordinary
      language or when the symbolic system is not properly understood by the recipient.
  expected_classification:
    depth: universal
- id: 93652029a009188a577d5103f96d8c2e6b3069976ff20569b73dd0fee779f6ff
  input_fb:
    name: Sensory Engagement for Data Comprehension
    definition: Effective data storytelling requires engaging multiple human senses
      to make abstract or complex data phenomena more comprehensible and emotionally
      resonant. The principle emphasizes that numerical data alone is insufficient
      for deep understanding of complex systems like climate change or geological
      epochs.
    mechanism: The human mind processes sensory-rich information more effectively
      than pure numerical data because sensory engagement creates emotional and experiential
      connections that anchor abstract concepts in concrete understanding. Visual,
      auditory, and even tactile elements help bridge the gap between data and human
      comprehension by activating multiple cognitive pathways simultaneously.
    boundary: Applies when data represents complex phenomena that are difficult to
      grasp through numbers alone, particularly in domains like climate science, geological
      epochs, or environmental change. Fails when data is simple, well-understood,
      or when the audience has no emotional or sensory connection to the subject matter.
  expected_classification:
    depth: cross-domain
- id: 2da7072db21a488d8ef4d55733fe153117ff8f166bdb64474415810c1f0d5ae9
  input_fb:
    name: Leibnizian Enquiring System Model
    definition: A philosophical framework for examining enquiring systems that traces
      back to Leibniz, where the system's internal structure and assumptions determine
      how it processes and validates knowledge.
    mechanism: The enquiring system operates by examining sentence structures and
      data reception, with built-in a priori knowledge (geometry, arithmetic, kinematics)
      that must be validated through experience to maintain coherence between the
      system's internal assumptions and external reality.
    boundary: Applies to philosophical systems that examine knowledge acquisition
      through internal structures and assumptions. Fails when applied to systems without
      built-in a priori elements or when the system's assumptions cannot be meaningfully
      contrasted with external reality.
  expected_classification:
    depth: cross-domain
- id: 25a73fd90b9a7982db9b33792b512815af5117089b10db1d3d443837bb6cb584
  input_fb:
    name: Negotiation Objection Analysis Method
    definition: A negotiation technique that involves asking 'why' to uncover the
      underlying reasons behind objections and to identify opportunities for resolution.
    mechanism: When a negotiator encounters an objection, they can either accept it
      as a hard stop or probe deeper to understand the root cause, which may reveal
      alternative solutions or compromise positions.
    boundary: Applies to contract negotiations where objections arise from cost, policy,
      or strategic concerns. Fails when the underlying reasons are not amenable to
      discussion or when the objection is based on immutable facts.
  expected_classification:
    depth: specialized
- id: 839d6efee6953f57f6db841a24e768d0621463eec1f1556895fa8eb8a826404c
  input_fb:
    name: Color-induced Physiological and Emotional Response
    definition: Color stimuli trigger measurable physiological responses in the body
      and evoke specific emotional reactions through psychological associations. The
      principle describes how color affects both biological systems and subjective
      emotional states in predictable ways.
    mechanism: "Color exposure directly influences human physiology through photoreceptor\
      \ activation and hormonal responses. Specific wavelengths stimulate different\
      \ neural pathways and endocrine functions, while color-congruent emotional associations\
      \ are learned through cultural and experiential conditioning. These dual pathways\
      \ \u2014 biological and psychological \u2014 work together to produce consistent,\
      \ observable reactions to color in both controlled and natural environments."
    boundary: Applies when color stimuli are perceived visually and influence biological
      or emotional states. Fails when color is not visually processed (e.g., in complete
      darkness), or when physiological responses are blocked by medical conditions
      or pharmacological interference.
  expected_classification:
    depth: cross-domain
- id: 17b3e203bc78aaff0ad3f597bbfa0bf00d3beee085d01430fe62a195e77a0c5a
  input_fb:
    name: Divination Practices Across Cultures
    definition: Divination practices involving interpreting natural patterns or symbols
      to foretell the future or explain portents, found across all cultures and including
      methods like smoke shapes, wax forms, tea leaves, coffee grounds, and tarot
      readings.
    mechanism: These practices rely on identifying meaningful patterns in natural
      phenomena or symbolic systems, where observers interpret visual or physical
      formations to derive predictive or explanatory insights about future events
      or hidden meanings.
    boundary: Applies to any cultural practice that interprets natural or symbolic
      patterns for predictive or explanatory purposes. Fails when the patterns are
      purely random or lack any interpretive framework.
  expected_classification:
    depth: cross-domain
- id: 390f5568932d946c02d924eeba1169982ce840d350aed422bb0f601a3c35d809
  input_fb:
    name: Linguistic Cohesion to Visual Design Shift
    definition: The transition from linguistic-based text cohesion mechanisms (such
      as reference, substitution, ellipsis, and lexical cohesion) to visual design
      elements (layout, color, and typography) as primary means of achieving textual
      coherence.
    mechanism: Traditional written text relied on grammatical and lexical connections
      between words and sentences to maintain coherence. Modern visual communication
      shifts this responsibility to visual elements that guide reader understanding
      through spatial arrangement, color coding, and typographic hierarchy.
    boundary: Applies to contemporary written communication where visual elements
      supplement or replace linguistic cohesion. Fails when text is purely linguistic
      without visual support or when traditional linguistic cohesion remains primary.
  expected_classification:
    depth: cross-domain
- id: 1c8f19eab1d9df9937df3cd3ae3103fe29addf4e27d68280bf478955e50cdd3e
  input_fb:
    name: Starting Small and Sucky Beats Staying Stuck
    definition: A principle that emphasizes beginning with imperfect execution rather
      than waiting for perfect conditions, recognizing that initial poor attempts
      are better than inaction.
    mechanism: The individual starts with a small, imperfect version of their goal
      (like a first workshop with only five attendees) rather than waiting for ideal
      conditions, which builds momentum and capability over time.
    boundary: Applies when someone is beginning a new endeavor and feels pressure
      to do it perfectly. Fails when someone never starts due to perfectionism or
      fear of failure.
  expected_classification:
    depth: specialized
- id: 5d856cfdcc5705506645680bdab315f6bf62861922fe3315dd10a8afedf96ef5
  input_fb:
    name: Entrepreneurial Data Misalignment
    definition: The fundamental tension between data-driven approaches and intuitive
      decision-making in startup leadership, where entrepreneurs must balance quantitative
      analysis with strategic vision.
    mechanism: Entrepreneurs face a dichotomy between data-obsessed approaches that
      can lead to analysis paralysis and intuition-based approaches that may ignore
      valuable data insights, with the root challenge being how to maintain both a
      minimum viable product and a compelling vision simultaneously.
    boundary: Applies to startup leadership where entrepreneurs must balance analytical
      rigor with visionary thinking. Fails when entrepreneurs can successfully integrate
      both approaches without conflict.
  expected_classification:
    depth: cross-domain
- id: 1ec0b7ad4ed351d0bfa01cb315d90f8f16c24f6a6dc58d4b2ef6cab95fbe8375
  input_fb:
    name: Crowdsourced Art Production and Labor Conditions
    definition: Artworks that utilize distributed labor markets to create artistic
      outcomes, often highlighting the conditions and inequities of such systems.
    mechanism: The system uses distributed labor platforms (like Amazon's Mechanical
      Turk) to break down artistic creation into small, individually paid tasks that
      are completed in isolation by many workers.
    boundary: Applies to artworks that explicitly use distributed labor markets or
      crowdsourcing systems for their creation. Fails when the work does not involve
      distributed labor or when the labor conditions are not highlighted as part of
      the artistic statement.
  expected_classification:
    depth: cross-domain
- id: 2fb8e3f1c2e60a8d9032f9237fa03504f923c6bd29276c13396dd487506edba8
  input_fb:
    name: Strategic Dissonance Framing
    definition: Presenting a position or recommendation that appears to contradict
      one's own interests creates a perception of trustworthiness and increases compliance
      by leveraging the principle of reciprocation. This technique works by making
      the presenter seem genuinely focused on the audience's benefit rather than self-interest.
    mechanism: This is a practical heuristic for persuasion, not a verified causal
      mechanism. The technique works by creating a cognitive dissonance that the audience
      resolves by perceiving the presenter as honest and selfless. When someone recommends
      options that are slightly less profitable for themselves, it signals to others
      that their advice is based on genuine concern for the audience's welfare rather
      than personal gain. This framing makes the audience more likely to comply with
      subsequent requests or recommendations.
    boundary: Applies when the audience can reasonably perceive the presenter as having
      a conflict of interest that they're choosing to forgo. Fails when the audience
      recognizes the strategy as manipulative or when the apparent sacrifice is too
      minimal to seem meaningful. Also fails when the audience has no basis for perceiving
      the presenter as having personal gain at stake.
  expected_classification:
    depth: specialized
- id: 4c3294ff0ccb886d0481ed69b0162861d6a50ca7e34d1192246fbeb3a003a32c
  input_fb:
    name: Adaptive Organizational Transformation
    definition: Organizational structures and roles evolve adaptively in response
      to emerging technologies, shifting the focus from static hierarchies to dynamic,
      hybridized capabilities. This transformation occurs through iterative adaptation
      and cross-domain integration rather than top-down redesign.
    mechanism: The principle describes a pattern of organizational evolution where
      new technological capabilities (like AI agents or cloud computing) initially
      appear as niche innovations but gradually reshape core organizational functions.
      As these technologies mature, they create demand for new hybrid roles (e.g.,
      prompt engineers, AI ethics specialists) and require organizations to integrate
      capabilities across domains (e.g., urban planning, behavioral science, design
      thinking). This process is iterative and emergent, not linear or prescriptive.
    boundary: Applies when new technologies or systems create demand for cross-functional
      integration and role hybridization. Fails when organizations are rigidly structured
      with fixed roles and lack mechanisms for adaptive reconfiguration.
  expected_classification:
    depth: cross-domain
- id: 29923743a4e3d4b0190ffc601b6a8a3fd513cb58784c74ac235e7eee9bd5bf41
  input_fb:
    name: Tokenization As Discrete Symbol Processing
    definition: Text processing in language models involves converting continuous
      textual input into discrete symbolic units called tokens through a tokenization
      process. These tokens are then mapped to numerical representations that enable
      model ingestion and computation.
    mechanism: Tokenization is a discrete symbol processing step that breaks continuous
      text into fixed-size symbolic units (tokens) using predefined rules or learned
      models. Each token is converted into a numerical ID that represents it in the
      model's computational space. The process operates on the principle that text
      can be decomposed into meaningful subunits that retain semantic and syntactic
      information.
    boundary: Applies to natural language processing systems that require discrete
      input representations. Fails when the tokenization method does not preserve
      semantic meaning or when token boundaries obscure important linguistic structures
      (e.g., splitting contractions like "can't" into "can" and "'").
  expected_classification:
    depth: specialized
- id: 1a2ebfb336d001fbaa0e96650f1251d1bfc9f8f203fb10314f1d36d0977439e2
  input_fb:
    name: Customer Data Analysis for Value Creation
    definition: A systematic approach to analyzing customer transaction data to understand
      purchase patterns and inform business decisions on product development and differentiation
      strategies.
    mechanism: The process involves collecting and analyzing large volumes of daily
      transaction data to identify customer preferences, purchase drivers, and value
      perceptions that can guide strategic business decisions.
    boundary: Applies to businesses with substantial transactional data and the capability
      to analyze it for insights. Fails when data quality is poor, analysis capabilities
      are insufficient, or when business decisions are not informed by the insights.
  expected_classification:
    depth: specialized
- id: e1c06eb9320446457cac5de108defb27bfce70a6abbedf1356aea5eb0f7e5d95
  input_fb:
    name: Mayhew's Anthropological Journalism Approach
    definition: A method of investigative journalism that combined anthropological
      research methods with journalistic storytelling to understand social conditions.
    mechanism: Mayhew conducted research with methodological rigor, gave his subjects
      means of self-expression, and approached his work as both anthropological and
      journalistic, though his work contained sensationalist elements that created
      political tension in his newspaper.
    boundary: Applies when journalistic investigation requires methodological rigor
      and consideration of subjects' own perspectives. Fails when the focus is purely
      on sensationalism or when subjects lack opportunity for self-expression.
  expected_classification:
    depth: cross-domain
- id: 0686702cc1b8fdccf89fc0b7adfaff4eb56ce8d9206302bf18a0bee0e54c7fe8
  input_fb:
    name: The Exploding Plastic Inevitable and Multimedia Performance
    definition: An experimental multimedia performance format that combined live music,
      film projection, lighting, and audience-responsive visual elements in non-pre-established,
      improvisational events.
    mechanism: The Exploding Plastic Inevitable used installations of monitors, film
      projectors, slide projectors, lights, and live music to create immersive, non-repeating
      performances where visual elements could be reconfigured in real-time in response
      to music or audience mood.
    boundary: Applies to experimental performance events from the 1960s that emphasized
      improvisation, audience interaction, and non-pre-established formats. Fails
      when the performance is pre-established, lacks improvisational elements, or
      does not involve multimedia integration.
  expected_classification:
    depth: cross-domain
- id: 6251d298e3dcfd830f8f572c9bdcc15b4a657fb4fc732160c4043c6d93d09296
  input_fb:
    name: Central Crabmap
    definition: "A conceptual mapping between dialogue structures and G\xF6del's incompleteness\
      \ theorems, created by sharing a common 'conceptual skeleton' that allows structural\
      \ correspondence between the two frameworks."
    mechanism: "The mapping occurs when two different conceptual frameworks (dialogue\
      \ structures and G\xF6del's G) share sufficient structural similarities to enable\
      \ systematic correspondence, similar to how the Central Dogma was mapped to\
      \ create a 'Central Crabmap'."
    boundary: Applies when two conceptual frameworks share sufficient structural overlap
      to enable meaningful mapping. Fails when frameworks lack sufficient commonalities
      or when the mapping creates false equivalencies.
  expected_classification:
    depth: cross-domain
- id: d237bd8953a027ae831158df6f384a95bfc03b42f9b0f93e6ebfbfdbb7e1f923
  input_fb:
    name: Ad Co-optation and Cultural Backlash
    definition: The process by which advertising agencies and corporations incorporate
      elements from countercultural movements and activist campaigns into their marketing
      strategies, often amplifying backlash rather than neutralizing it.
    mechanism: Admen and adwomen, who are often culturally aligned with their target
      markets, may find themselves following their own target market off a cliff as
      they co-opt radical imagery and messaging that was originally intended to challenge
      corporate power.
    boundary: Applies when advertising agencies incorporate elements from anticorporate
      activism into mainstream campaigns. Fails when the co-optation is purely superficial
      or when the original activist message is completely lost in translation.
  expected_classification:
    depth: cross-domain
- id: 0121b2ac3b16c7f744ec1d5f87db146652f6277528a2fa50bd79d521721faf3b
  input_fb:
    name: Market Prediction Uncertainty Principle
    definition: A principle stating that predictions about market behaviors and human
      actions cannot achieve the same precision as scientific measurements in physics
      or chemistry, due to the inherent complexity and unpredictability of human behavior.
    mechanism: Market behaviors and human actions are fundamentally harder to quantify
      and predict than physical phenomena because they involve complex decision-making,
      emotional responses, and unpredictable social dynamics that cannot be measured
      with the same precision as physical instruments.
    boundary: Applies to predictions about market behaviors and human actions in business
      contexts. Fails when applied to physical sciences where precise measurement
      is possible.
  expected_classification:
    depth: cross-domain
- id: 0629b605dd3b87e5a4852a92d09517b809efc18d15c282d162b23736c166fe4c
  input_fb:
    name: Inference As Interpretation of Signs
    definition: Inference is not a direct contemplation of cognition but an interpretive
      process that derives meaning from signs and evidence. This principle recognizes
      that understanding and reasoning are fundamentally mediated through signs rather
      than immediate perception.
    mechanism: Inference operates as a form of interpretation where the mind actively
      constructs meaning from observable signs and evidence. This process involves
      reading between the lines of sensory data, historical context, and logical relationships
      to arrive at conclusions that are not immediately apparent. The interpretive
      nature of inference means that understanding emerges from the relationship between
      signs and their meanings, not from the signs themselves.
    boundary: Applies when reasoning or understanding requires interpretation beyond
      immediate sensory input. Fails when inference is based purely on direct observation
      or when the sign system is fully transparent and unambiguous.
  expected_classification:
    depth: cross-domain
- id: 74200f996543a093c18c8aa04146c335a833090bc4188e1bf016e783ddb4e8ea
  input_fb:
    name: Disinformation Economic Incentive
    definition: Misinformation spreads when it generates economic value through engagement,
      clicks, or ad revenue, even if it is false or harmful. The principle describes
      how financial incentives can override truth in information systems where user
      attention is monetized.
    mechanism: Disinformation thrives in environments where user engagement translates
      directly into ad revenue or platform value. Platforms like Google and Facebook
      monetize attention through targeted advertising, creating a feedback loop where
      sensational or emotionally charged content (including false information) drives
      higher engagement rates and thus more revenue. This economic structure incentivizes
      the spread of misinformation, particularly when it aligns with political or
      ideological narratives that generate strong user reactions.
    boundary: Applies when information systems are driven by user engagement metrics
      that translate into revenue. Fails when platforms prioritize content quality
      or truth over engagement, or when the economic model does not rely on user attention
      for monetization.
  expected_classification:
    depth: cross-domain
- id: 8ca91051590cb2d420eca8ba1227b2641c348b4a78fc3cbbf931915a001bd540
  input_fb:
    name: Second Law of Simpledynamics
    definition: A principle stating that eventropy (a measure of system disorder)
      can never decrease in simple dynamical systems.
    mechanism: In systems with 10-dimensional state space, eventropy is calculated
      by summing odd-numbered states (1, 3, 5, 7, 9), and this quantity cannot decrease
      over time, representing an invariant law that emerges from the mathematical
      structure of the system.
    boundary: Applies to systems with 10-dimensional state space where odd-numbered
      states can be aggregated to form eventropy. Fails when systems do not have this
      specific mathematical structure or when the aggregation method is not valid.
  expected_classification:
    depth: universal
- id: 38e2bf94ce95cbe510557ad9723cbc62604bb2b2583bd519ea4c3ffae42d9301
  input_fb:
    name: Perceptual Mapping Through Camouflage
    definition: A mapping approach that uses visual field distortions to reveal how
      perception and space are ordered through camouflage techniques.
    mechanism: Video stills from moving vehicles are reduced to high-contrast images
      that focus attention on visual landscape patterns, using camouflage as a metaphor
      for how maps order morphisms between perception and space.
    boundary: Applies to perceptual mapping that uses visual field distortions to
      reveal the relationship between perception and spatial representation. Fails
      when the approach doesn't involve visual field manipulation or perceptual distortion.
  expected_classification:
    depth: cross-domain
- id: 2d0742df1393bacc3d552d118d22a90733327e3a8ec698e5e0aade1e9909e2ff
  input_fb:
    name: Complexity and Organizational Intelligence
    definition: A principle about the relationship between organizational intelligence
      and human cognitive limitations, suggesting that while human intelligence is
      limited, complex organizational systems can emerge from simple rules and collective
      behavior patterns.
    mechanism: Human organizational intelligence is never equal to the sum of individual
      intelligence, and complex adaptive systems can emerge from simple rules that
      individuals follow, similar to how ants and bees create complex behaviors through
      simple rules.
    boundary: Applies to organizations that attempt to model complex adaptive systems
      using simple rules. Fails when organizations cannot implement simple rule-based
      systems or when human cognitive limitations prevent effective implementation.
  expected_classification:
    depth: cross-domain
- id: 00816f5ef9815d223295380ff49a77cf4c55a6c53ee55f1959f42b7b3a7dca6e
  input_fb:
    name: Strategic Experimentation Framework
    definition: Effective business execution requires balancing focused goal-setting
      with flexible experimentation, where structured daily planning enables adaptive
      response to opportunities and creative collaboration. The principle describes
      a practical approach to managing multiple projects and priorities while maintaining
      creative energy and strategic direction.
    mechanism: 'This is a normative heuristic describing a practical method for managing
      creative work: setting daily priorities creates structure that prevents overwhelm,
      while maintaining space for spontaneous collaboration and experimentation. The
      framework recognizes that rigid focus on single goals can lead to burnout, but
      that structured experimentation enables creative breakthroughs through iterative
      adjustment.'
    boundary: Applies when individuals or teams work across multiple projects or creative
      domains. Fails when the context requires strict linear execution or when project
      dependencies prevent parallel experimentation. Also fails when the individual
      lacks the cognitive capacity to maintain both structured planning and spontaneous
      engagement.
  expected_classification:
    depth: domain
- id: c76605a9e05c7338d3942b796c546b1d5c6379d94adc95c837c507530e47a3c3
  input_fb:
    name: Visual Rhetoric and Communication
    definition: Visual communication relies on rhetorical devices and contextual framing
      to convey meaning and evoke emotional response, drawing parallels between visual
      design and linguistic rhetoric. The principle describes how visual elements
      function as persuasive tools that engage viewers through familiar narrative
      structures and cultural associations.
    mechanism: Visual designers employ rhetorical strategies such as metaphors, hyperboles,
      and metonymies to communicate messages, similar to how spoken or written language
      uses these devices. The effectiveness of visual communication depends on context
      and the viewer's ability to interpret visual elements through established cultural
      and cognitive frameworks. Visual elements function as catalysts for meaning-making,
      using compositional techniques and emotional triggers to guide interpretation.
    boundary: Applies when visual communication involves intentional design choices
      that rely on rhetorical strategies or cultural framing. Fails when visual elements
      are purely functional or lack interpretive context, such as in technical diagrams
      or data displays where meaning is derived from data rather than rhetorical devices.
  expected_classification:
    depth: cross-domain
- id: 742733dc76894689f638fede797c7f54d66134c7f7536e03c57185123a4348e8
  input_fb:
    name: Dynamic System Contextual Dependency
    definition: Real-world systems operate within dynamic, nested, and contextually
      variable environments where predictable conditions do not exist. The behavior
      and outcomes of systems depend on external factors and relational contexts that
      are constantly changing and interdependent.
    mechanism: Systems function in environments that are not static or controlled
      but rather characterized by continuous change, nested structures, and contextual
      influences. These environments introduce variability and unpredictability that
      cannot be captured by isolated or laboratory-based assumptions. The interplay
      between systems and their broader context creates emergent properties and behaviors
      that are not present in simplified models or controlled conditions.
    boundary: Applies to systems that exist in real-world, non-laboratory conditions
      where external factors and relational dynamics influence outcomes. Fails when
      systems are isolated or controlled in a way that removes contextual variability
      and dynamic interdependencies.
  expected_classification:
    depth: cross-domain
- id: 622465f81a2c74af31fff9753324cc797107f4cc467bc2d43b771daa5c661e87
  input_fb:
    name: Ukiyo-e Artistic Influence on Western Design
    definition: The impact of Japanese ukiyo-e woodblock prints on European and North
      American graphic design during the late 19th century, introducing new approaches
      to space, color, and subject matter.
    mechanism: The ukiyo-e movement's distinctive visual characteristics, including
      flat color schemes, bold outlines, and unconventional compositions, were absorbed
      into Western graphic design as artists and designers encountered these works
      through cultural exchange.
    boundary: Applies to the period of cultural exchange between Japan and Western
      nations in the late 19th century. Fails when the cultural exchange was not occurring
      or when Western design was not influenced by Japanese artistic traditions.
  expected_classification:
    depth: cross-domain
- id: 67a5014fac2c40517be13f76a0e97bcaa4a320d2e5860963b9b4278365356133
  input_fb:
    name: Content and Data as Value Drivers in Digital
    definition: Digital services increase in value as users add content (songs, documents)
      or personal data (resumes, profiles) to them, creating a feedback loop where
      more contributions make the service more valuable to both users and providers.
    mechanism: User contributions (content or data) create network effects where each
      addition increases the service's utility and value for all participants, even
      though the original content/data was created elsewhere.
    boundary: Applies to digital services where user contributions can be tracked
      and measured. Fails when contributions don't increase service utility or when
      the service is not networked.
  expected_classification:
    depth: cross-domain
- id: 037bdb14ced24d3deaa7394158edaf2b04b2577280ff4eea5ebc3159edfd1ed4
  input_fb:
    name: Multiplier Vs. Diminisher Leadership Approach
    definition: 'A leadership principle contrasting two approaches to team management:
      the Diminisher assumption that people need constant oversight and the Multiplier
      assumption that people are capable of self-direction and contribution.'
    mechanism: The Diminisher approach uses representatives to gather information
      and report back, while the Multiplier approach gives team members ownership
      and responsibility for decision-making. The Diminisher approach creates passive
      reporting while the Multiplier approach creates active engagement.
    boundary: Applies when leaders must choose between oversight and empowerment approaches.
      Fails when the Diminisher approach is necessary for compliance or safety-critical
      tasks, or when the Multiplier approach is inappropriate for teams lacking capability
      or experience.
  expected_classification:
    depth: domain
- id: fb89fdf3b0f94b34ca70b189350f669aec28b9fea8539145636b5b33042015c0
  input_fb:
    name: Material Agency in Visual Objects and Cultural Relations
    definition: The principle that visual objects possess agency and can actively
      shape cultural identities and relations between people, rather than merely reflecting
      or being shaped by them.
    mechanism: Visual objects and contexts mutually define and transform each other,
      with objects having the capacity to intervene in and radically redefine cultural
      relationships and meanings, particularly in colonial contexts involving indigenous
      and settler populations.
    boundary: Applies to situations where visual objects have significant cultural
      impact and can disrupt established meanings and relations. Fails when visual
      objects are purely passive media or when the cultural context lacks the power
      dynamics that enable such agency.
  expected_classification:
    depth: cross-domain
- id: c819167859647ada2f05e8013cd8820b43a9de2d93ca57a4f570386a24d8bfc2
  input_fb:
    name: Complex Systems Modeling Approach
    definition: A pedagogical method for introducing complex systems concepts that
      bridges the gap between popular metaphorical explanations and technical academic
      treatments by using accessible simple models.
    mechanism: The approach uses simple, concrete examples that contain deep foundational
      insights to provide an accessible entry point into complex systems theory, analogous
      to how the Prisoner's Dilemma illustrates game theory principles despite the
      field's abstract mathematical foundation.
    boundary: Applies to educational contexts where complex systems concepts need
      to be made accessible to both technical and non-technical audiences. Fails when
      the audience requires purely abstract mathematical treatment or when simple
      examples cannot adequately convey the complexity.
  expected_classification:
    depth: cross-domain
- id: 88cb845c15a92e03887757b904db90f164c9f691548267c2d6091666181f5303
  input_fb:
    name: Husserl's Lifeworld As Foundation for Scientific Knowledge
    definition: Husserl's view holds that the subjective-relative lifeworld serves
      as the 'grounding soil' for the objective world of science, providing both the
      content and reference of scientific conceptions.
    mechanism: Scientific conceptions derive their propositional content and reference
      to reality from prescientific notions they are meant to naturalize, and when
      scientific crises occur, the prescientific lifeworld serves as the ultimate
      defense for new scientific approaches through intuitive acceptances.
    boundary: Applies when scientific conceptions are understood as deriving from
      prescientific notions and when scientific crises require appeal to the lifeworld
      for justification. Fails when scientific knowledge is viewed as independent
      of prescientific foundations or when scientific crises are resolved through
      purely formal methods.
  expected_classification:
    depth: cross-domain
- id: 1a3637c3f72a49d81f27ab05a792b517ca67a9bfc7acf2255228b9c7688a96bc
  input_fb:
    name: Generalist Vs Specialist Approach in Creative Industries
    definition: A preference for generalists (polymaths) over specialists in creative
      organizations, particularly when projects become more complex and require cross-disciplinary
      connections.
    mechanism: Generalists bring wide-ranging interests and the ability to connect
      disparate concepts, which enables innovation and complex storytelling, while
      specialists provide deep technical expertise in specific areas.
    boundary: Applies to creative organizations that value cross-disciplinary thinking
      and complex project execution. Fails when organizations require highly specialized
      technical skills that generalists cannot provide.
  expected_classification:
    depth: cross-domain
- id: 2c139191ade7d17cf0636e7e130437be1ef49c3f9e8ce2329d6d673e488c5eb8
  input_fb:
    name: Contextual Personalization Through Ai
    definition: AI systems can optimize user experiences by adapting content, recommendations,
      and interactions to specific contexts and individual preferences. This personalization
      improves engagement, conversion rates, and business outcomes through intelligent
      adaptation to user behavior and environmental signals.
    mechanism: AI enables real-time adaptation of content and interactions by analyzing
      user context (behavioral signals, environmental cues, preference patterns) and
      applying learned models to deliver relevant experiences. The system processes
      multiple touchpoints (websites, ads, chatbots) to understand user intent and
      adjust responses dynamically, optimizing for specific KPIs like conversion rate,
      retention, or engagement.
    boundary: Applies when AI systems can access and process user behavioral data,
      environmental signals, and preference patterns to make real-time adjustments.
      Fails when user data is insufficient, context is not available, or the system
      lacks the capability to adapt content or interactions in real time.
  expected_classification:
    depth: specialized
- id: 310f3c425c858433f641ae264d274d624c7b205d7af0c7d0ce98b2b2a66615b9
  input_fb:
    name: Perceptual Bayesian Integration
    definition: "The human sensory system integrates multiple cues\u2014such as visual\
      \ color, taste, and olfactory signals\u2014into a unified perceptual experience\
      \ through Bayesian inference, where prior expectations and sensory evidence\
      \ are combined to form the most probable interpretation. This principle describes\
      \ how perception is not a passive recording but an active construction shaped\
      \ by learned associations and expectations."
    mechanism: Perceptual integration occurs when the brain combines sensory inputs
      (e.g., color, taste) with prior knowledge or expectations (Bayesian priors)
      to compute a probabilistic estimate of the stimulus. For example, when a person
      sees a red apple, their prior knowledge of red fruits and expected flavor influences
      their perception of taste, even if the actual taste is different. This process
      is not deterministic but involves a weighted combination of sensory evidence
      and prior beliefs.
    boundary: Applies when sensory modalities can be meaningfully combined and prior
      expectations are available (e.g., color-taste associations). Fails when sensory
      inputs are completely independent or when prior expectations are irrelevant
      or overridden by strong sensory evidence (e.g., a color that contradicts all
      known associations).
  expected_classification:
    depth: cross-domain
- id: 2a24b6e218b8c2d115fe74915371e45c08bb42bb59e610d5e12dec8a46295e4a
  input_fb:
    name: Retrieval-augmented Generation for Multi-agent Coordination
    definition: Retrieval-Augmented Generation (RAG) extends beyond single-agent knowledge
      augmentation to enable multi-agent systems by storing agent outputs in external
      memory stores and retrieving relevant information for subsequent tasks. This
      pattern enables agents to build upon previous work and coordinate knowledge
      across distributed reasoning processes.
    mechanism: RAG operates as a knowledge coordination mechanism where agent-generated
      outputs are persisted in vector databases or structured knowledge stores, allowing
      subsequent agents to retrieve only the portions relevant to their current task.
      The system maintains a shared memory layer that enables distributed reasoning
      and prevents redundant computation across agents.
    boundary: Applies when agent outputs need to be persisted and shared across multiple
      reasoning steps or agents. Fails when the system lacks external memory infrastructure,
      or when agents require real-time coordination without storage overhead. The
      pattern is most effective in systems where knowledge is reusable across tasks
      rather than ephemeral.
  expected_classification:
    depth: specialized
- id: 1f82f63bfab9099f6ab06e153474a008b4445716dae28a766bbe548fc52f8b29
  input_fb:
    name: Intrinsic Responsibility Through Direct Feedback
    definition: System design that connects decision-makers directly to the consequences
      of their actions creates intrinsic responsibility, where actors are motivated
      to act in the system's best interest because they personally experience the
      outcomes of their choices. This principle emphasizes that feedback loops must
      be immediate, compelling, and tied to the decision-maker's direct experience.
    mechanism: When decision-makers receive direct, immediate feedback about the consequences
      of their actions, they develop an intrinsic motivation to manage those consequences
      effectively. This occurs because the feedback creates a personal connection
      between action and outcome, making the decision-maker's role in the system's
      performance visible and accountable. The closer the feedback is to the decision
      point and the more directly it reflects the actor's impact, the stronger the
      intrinsic motivation becomes.
    boundary: Applies when decision-makers can directly observe or experience the
      consequences of their choices. Fails when feedback is delayed, abstract, or
      disconnected from the decision-maker's direct influence (e.g., when a central
      authority controls resources and distributes consequences). Also fails when
      actors are not held personally accountable for outcomes, such as in systems
      where responsibility is diffused or delegated.
  expected_classification:
    depth: cross-domain
- id: 8ae3e94c723d7b1e7187b27c3f477e7524e28f6d58a0e03cc70017852ea6e0a7
  input_fb:
    name: Mythological Symbolic Resonance
    definition: "Mythological symbols and archetypal forms maintain consistent meaning\
      \ across diverse cultural and historical contexts, appearing as recurring motifs\
      \ in religious, spiritual, and esoteric traditions. These symbols often manifest\
      \ in multiple forms\u2014animals, celestial bodies, geometric patterns, or sacred\
      \ texts\u2014while carrying overlapping psychological and spiritual significance."
    mechanism: This is an empirical pattern, not a causal mechanism. The same symbols
      appear across cultures and time periods with similar meanings or functions,
      suggesting a shared human psychological or spiritual framework. The recurrence
      of motifs like dragons, serpents, and shapeshifting deities indicates that certain
      symbolic forms resonate universally within human consciousness and cultural
      expression.
    boundary: Applies when symbols appear consistently across different mythologies,
      religions, or spiritual systems with comparable meanings or roles. Fails when
      symbols are culturally specific or lack cross-cultural parallels, or when their
      meanings are entirely context-dependent and vary drastically between traditions.
  expected_classification:
    depth: cross-domain
- id: 8f19f88393e057bebcebb963eacfa61db147e77b656e989b756e1a366cfbd676
  input_fb:
    name: Conscious Computing and Technology Embodiment
    definition: A principle that advocates for developing new physical and mental
      skills to maintain healthy autonomic responses when using technology.
    mechanism: Chronic stress causes brain changes that reduce decision-making capacity
      while increasing habit formation, making it necessary to develop new embodied
      skills for technology use. Conscious computing involves learning breathing techniques
      and posture awareness to maintain parasympathetic dominance and regulate autonomic
      responses.
    boundary: Applies to individuals who experience technology-related stress or attention
      issues. Fails when people do not recognize the physiological impact of technology
      use or refuse to develop new embodied skills.
  expected_classification:
    depth: cross-domain
- id: ee29559c54b210bb333aede91a2d13e30f24b1b3bd5495f2a94fee93948681e6
  input_fb:
    name: Adaptive Risk Response Loop
    definition: AI agents respond to risk events by synthesizing real-time data with
      historical patterns to make adaptive decisions, while maintaining human oversight
      for validation and correction. The principle describes a dynamic feedback system
      where agents learn from new events and adjust their behavior based on confidence
      levels and risk thresholds.
    mechanism: Adaptive risk response operates through a continuous loop of event
      detection, pattern matching, confidence assessment, and human-in-the-loop validation.
      When an agent encounters a risk signal, it cross-references historical data
      to assess likelihood and impact. If confidence is high, it acts autonomously;
      if confidence is low, it alerts human operators with supporting evidence. The
      system adapts to evolving threats by learning from new events and adjusting
      decision logic accordingly.
    boundary: Applies when AI agents operate in environments with measurable risk
      signals and require adaptive responses. Fails when risk events are purely random
      or when human oversight is not available for validation. Also fails when agents
      lack the capability to cross-reference historical data or when confidence thresholds
      are not properly calibrated.
  expected_classification:
    depth: cross-domain
- id: b632993ca3f2c4a165fe77d87979c9b97a3cd452d5ad86049dc0070cd7254fd5
  input_fb:
    name: Internet Success Measurement
    definition: A framework for evaluating internet success based on its ability to
      provide information access to previously underserved populations while questioning
      whether it truly transforms information architecture or merely replaces old
      media hierarchies.
    mechanism: The internet's success is measured by its capacity to democratize information
      access, yet it may simultaneously perpetuate new forms of media concentration
      that maintain the same underlying power structures.
    boundary: Applies to assessing internet impact as a transformative technology
      versus a replacement of existing media systems. Fails to address whether the
      internet actually changes information architecture or just redistributes control
      among different media owners.
  expected_classification:
    depth: cross-domain
- id: 158be3b005205de6e9e0637164651c959ab640bc4faf279fe6fab5c1b8dde6a2
  input_fb:
    name: Smithies' Approach to Scientific Innovation
    definition: A principle describing how scientific breakthroughs can emerge from
      combining diverse biological and chemical knowledge with creative, non-routine
      thinking approaches.
    mechanism: Smithies' method involved leveraging broad scientific training to bridge
      disciplines and apply skills to novel problems rather than following conventional
      specialization paths. His approach was characterized by intellectual flexibility
      and willingness to explore tangential interests.
    boundary: Applies when scientists combine diverse knowledge areas to solve problems
      in new domains. Fails when rigid specialization prevents cross-disciplinary
      application.
  expected_classification:
    depth: cross-domain
- id: 2d5e66e1555048a0f4fc2495e9949dcc551238c13669800defb243caee6e1d01
  input_fb:
    name: Bindu and Raif Spiritual Principle
    definition: The Bindu (Sanskrit point) represents each particle of existence and
      serves as a catalyst for manifestation, while the Raif symbolizes the transcendent
      principle that unifies all things on a deeper level of reality.
    mechanism: The Bindu acts as a focal point for manifestation where each particle
      of existence maintains intimate contact with the ultimate reality, while the
      Raif represents the formless background and ether from which sacred sound emerges
      and returns.
    boundary: Applies within Hindu and Buddhist spiritual contexts where the Bindu
      and Raif represent fundamental principles of existence and manifestation. Does
      not apply to non-spiritual or scientific contexts.
  expected_classification:
    depth: cross-domain
- id: 00c1cb6c56842b6604cdea24cd60baa4d39120dcef707d8c5b9c3e906ec14a7e
  input_fb:
    name: First-purchase Incentive Optimization
    definition: Consumers who are familiar with a brand but have not yet purchased
      it can be encouraged to make their first purchase through targeted marketing
      strategies that address their specific barriers to trial. The principle suggests
      that the margin or cost of acquisition for first-time buyers should be optimized
      to reflect the value of converting a prospect into a customer.
    mechanism: 'This is a practical heuristic for marketing strategy: offering incentives
      or reducing friction for first-time buyers increases conversion rates. The principle
      prescribes a method for optimizing marketing spend and pricing to capture early
      adopters before they become loyal customers of competitors. It does not describe
      a causal chain but rather a repeatable approach to maximizing the value of initial
      customer engagement.'
    boundary: Applies when consumers are aware of a brand but have not yet purchased.
      Fails when consumers are completely unfamiliar with the brand or when the product
      is not easily accessible or trialable.
  expected_classification:
    depth: domain
- id: 0e6143f7b6270b1257d75cac6229e90e070af0b0da1ca9a21eb979febbce1678
  input_fb:
    name: Self-referential Systemic Patterns
    definition: Certain systemic entities exhibit recursive or circular behavioral
      patterns that reflect self-awareness, self-modification, or self-observation
      as core operational characteristics. These patterns manifest as paradoxes, circular
      causality, or meta-level feedback loops that define the system's identity and
      function.
    mechanism: These patterns emerge when a system's operational logic includes internal
      reference to its own structure or behavior. The self-reference creates a feedback
      loop where the system's actions are interpreted through its own perspective,
      leading to behaviors that are both reflective and reactive. This is not a causal
      chain but a structural property of how the system organizes its own existence
      and responses.
    boundary: Applies when a system exhibits internal reference to its own state or
      behavior, creating circular or recursive operational logic. Fails when the system
      operates purely on external inputs without self-referential feedback or when
      the pattern is merely superficially similar to self-reference but lacks true
      recursive structure.
  expected_classification:
    depth: universal
- id: 042f578c0de0d504b37f3b51b308be44f0de5eaac230ec13fdb2a0ba9171cf1b
  input_fb:
    name: Systems-wide Optimization
    definition: Optimization efforts should focus on enhancing the overall properties
      of a system rather than optimizing individual components or subsystems in isolation.
      The principle emphasizes that system-level outcomes like growth, stability,
      diversity, resilience, and sustainability are more important than local optimizations
      that may harm the whole.
    mechanism: This is a normative heuristic that prescribes a strategic approach
      to system design and intervention. It recommends prioritizing actions that strengthen
      the system's fundamental characteristics over narrow performance gains. The
      principle operates as a decision framework that guides practitioners to consider
      the broader system impact before pursuing specific improvements.
    boundary: Applies when system properties like growth, stability, diversity, resilience,
      and sustainability are meaningful and measurable. Fails when the system's overall
      properties cannot be clearly defined or when local optimizations are required
      for system viability (e.g., critical infrastructure failures).
  expected_classification:
    depth: cross-domain
- id: e82ed86f8082c9845303a877021b35f2e132e7fd8bf4d43da263b3fe4cd1810e
  input_fb:
    name: Nuclear Proliferation Control and Non-proliferation Policies
    definition: A pattern where nuclear technology remained contained despite its
      strategic advantages, through conscious policies of non-proliferation by nuclear
      powers and the inherent complexity of nuclear weapons development.
    mechanism: Nuclear powers deliberately restricted proliferation through international
      treaties, policy decisions, and the technical complexity of nuclear weapons
      production, preventing widespread adoption despite the strategic advantages
      they confer.
    boundary: Applies to nuclear technology control efforts from the post-World War
      II era through the Cold War period. Fails when nuclear technology becomes easily
      accessible or when the technical barriers to proliferation are overcome.
  expected_classification:
    depth: cross-domain
- id: 017cd29d8265b714f32a1b62ba1a48dd1a4b3501c93a8e6cbae407e3a97be018
  input_fb:
    name: Seven Patterns of Idea Generation
    definition: 'A systematic framework identifying seven distinct patterns that can
      trigger creative idea generation: Anomalies, Confluence, Frustrations, Orthodoxies,
      Extremities, Voyages, and Analogies.'
    mechanism: 'Each pattern represents a different source of creative inspiration
      that can be deliberately applied to generate novel ideas: anomalies reveal opportunities
      for improvement, confluence combines existing elements in new ways, frustrations
      identify problems to solve, orthodoxies challenge established norms, extremities
      highlight unique perspectives, voyages draw from personal experiences, and analogies
      transfer solutions from other domains.'
    boundary: Applies to creative problem-solving contexts where structured approaches
      to idea generation are needed. Fails when creativity is assumed to be purely
      spontaneous or when patterns don't align with the specific problem context.
  expected_classification:
    depth: domain
- id: 029c6a372ba05e020a681517b2fddf42ea2284fe103db140ed121c3b86e82a47
  input_fb:
    name: Ordinal Naming System Limitations
    definition: Formal systems for naming ordinals eventually reach a point where
      no existing naming scheme can adequately describe the complexity of the ordinal
      structure.
    mechanism: As ordinals grow increasingly complex, the existing naming systems
      (which only include names for natural numbers) must be transcended, requiring
      fundamentally new naming approaches when the answer-schemas become so complex
      that they cannot be subsumed into existing systems.
    boundary: Applies to ordinal notation systems and their limitations in describing
      increasingly complex ordinals. Fails when the naming system can be extended
      to accommodate new ordinal structures.
  expected_classification:
    depth: domain
- id: 224ea8536ad553aeed4715e36933bf4e9f3eb4fa6a7b29b3255d18ee7f16024b
  input_fb:
    name: Gamification Effects on Survey Data Quality
    definition: A principle examining how gamification techniques in surveys affect
      engagement levels and data quality outcomes.
    mechanism: Gamification can create more enjoyable experiences that increase engagement,
      but may also alter the context of questions, shift participant mindset, and
      skew responses, potentially compromising data validity.
    boundary: Applies to survey research contexts where gamification techniques are
      implemented. Fails when gamification is not used or when the survey context
      does not support gamified elements.
  expected_classification:
    depth: specialized
- id: 658ac66f4177ba6ca7ba25f7c59dbbdd59b64307a1cfc0d1de930fb75f7f7513
  input_fb:
    name: Creative Resonance Through Proportional Harmony
    definition: Artistic and mathematical systems that align with fundamental proportional
      relationships (such as the golden ratio) resonate with human perception and
      creativity because they reflect underlying patterns of beauty and order that
      are intuitively recognized and reproduced across different domains of knowledge.
    mechanism: This is a descriptive model of how proportional relationships function
      as organizing principles in both mathematical and artistic systems. The golden
      ratio and similar proportional systems appear in nature, music, and visual design
      because they represent mathematical relationships that humans find aesthetically
      pleasing and cognitively satisfying. These patterns are not merely coincidental
      but reflect a deep structural alignment between mathematical principles and
      human creative expression.
    boundary: Applies to systems where proportional relationships can be mathematically
      defined and aesthetically experienced. Fails when the proportional system is
      arbitrary or disconnected from natural patterns of growth, symmetry, or perception.
      Also fails in purely functional contexts where aesthetic considerations are
      secondary to utility.
  expected_classification:
    depth: cross-domain
- id: 5603912ee26738e8ca15a74b60fc2d20cee6db2fe7524e20738d34b6c7b84158
  input_fb:
    name: Art History Integration in Web Design
    definition: A principle for incorporating historical artistic movements and design
      traditions into contemporary web design to create unique and culturally informed
      visual solutions.
    mechanism: The approach involves studying historical art movements like Renaissance
      architecture and Realist painting to understand how texture, composition, and
      visual principles influenced artistic development, then applying these insights
      to modern web design problems.
    boundary: Applies when web designers seek to develop unique visual styles by drawing
      from historical artistic traditions. Fails when designers ignore the cultural
      context or apply historical principles inappropriately to digital media.
  expected_classification:
    depth: cross-domain
- id: 046850c2513592bc160097e9cfe636d872ae7920bdc3dd0760c641d856a4d5f5
  input_fb:
    name: Explore-exploit Trade-off in Complex Systems
    definition: A fundamental balance between exploration (seeking new possibilities)
      and exploitation (maximizing current knowledge) that governs optimal decision-making
      in complex systems like evolutionary processes and ant colonies.
    mechanism: In rugged landscapes, systems begin with high exploration (high temperature)
      and gradually shift to exploitation (low temperature) as they converge on local
      optima. In dancing landscapes, systems maintain a balance between exploration
      and exploitation to adapt to changing conditions.
    boundary: Applies to systems where exploration and exploitation must be balanced
      for optimal performance. Fails when systems cannot adapt to changing conditions
      or when the landscape is static and does not require adaptation.
  expected_classification:
    depth: universal
- id: 2f3cf71f411b10ccf6968f2e8e6932e05d3616739c04f5d43e3d5e03124e4524
  input_fb:
    name: Rotoscoping in Early Animated Film
    definition: 'A technique used in early animated film where animators traced over
      live-action footage to achieve realistic movement and timing, exemplified by
      Fleischer Studios'' use of Cab Calloway''s performance for the walrus ghost
      in Betty Boop: Minnie the Moocher.'
    mechanism: Animators captured live-action footage of performers and then used
      it as reference to create more naturalistic motion in animated sequences, particularly
      for dance movements and physical actions.
    boundary: Applies to early 20th century animation techniques when digital tools
      were not available. Fails when modern digital animation methods are used that
      don't require live-action reference.
  expected_classification:
    depth: specialized
- id: 060eafe0ac048fdd7dcdf1e8a41453fb4843d5340b7bc7717bf01d33239376d9
  input_fb:
    name: Creative Design Through Movement and Rhythm
    definition: A design methodology that leverages principles from dance and music
      to understand spatial relationships and component interactions in three-dimensional
      design problems.
    mechanism: Contemporary dance provides a physical and spatial framework for understanding
      how design elements relate, form tension, collide, and organize in three-dimensional
      space, while musical rhythms offer patterns for organizing visual elements and
      project styling.
    boundary: Applies when design problems can be understood through physical/spatial
      metaphors and rhythmic organization. Fails when design problems are purely functional
      or mathematical without spatial or temporal dimensions.
  expected_classification:
    depth: cross-domain
- id: 1759fc5b38f684130658ecfa48e8c4a222235d7668fac500418a9bb079e3c0a4
  input_fb:
    name: Vivid Characterization Through Action Before Description
    definition: A literary technique where characters are portrayed as vivid and memorable
      through their active behaviors and immediate presence before their physical
      descriptions are provided.
    mechanism: The character's actions and behavioral cues create an immediate impression
      that resonates more powerfully than physical attributes alone, establishing
      their personality and significance through dynamic engagement rather than static
      observation.
    boundary: Applies specifically to literary narrative techniques where character
      development prioritizes behavioral demonstration over physical description.
      Fails when the technique is not employed or when physical description precedes
      action.
  expected_classification:
    depth: specialized
- id: fb0af7c04e0577fd92eb00d6346a80ca7106a5180b60e16b0e3bbbab2134eac2
  input_fb:
    name: Emoticon Typographic Evolution
    definition: The evolution of visual expression in written communication follows
      a consistent pattern of recontextualizing existing typographic elements into
      emotional indicators. This pattern shows how punctuation, letterforms, and layout
      conventions are adapted to convey affective states through stylized visual arrangements.
    mechanism: This is an empirical pattern showing how written language systems consistently
      adapt existing visual elements to encode emotional meaning. The process involves
      taking familiar typographic features (punctuation, letterforms, spacing) and
      reinterpreting them in new configurations that map to human emotional states.
      The adaptation occurs across different media and time periods, suggesting a
      universal human tendency to project affective meaning onto visual symbols.
    boundary: Applies when existing typographic elements are recontextualized to encode
      emotional meaning rather than purely functional meaning. Fails when visual elements
      are used for purely decorative or structural purposes without emotional intent,
      or when the adaptation occurs in non-written media (e.g., purely gestural communication).
  expected_classification:
    depth: universal
- id: 032f91b29e421e3edbb4c609208916d14ca4756f498a5a35ea2bcef6d862f716
  input_fb:
    name: Modest Maps Library
    definition: A lightweight mapping library that has been adapted across multiple
      programming languages and platforms for displaying tiled maps with data layers.
    mechanism: The library provides mapping functionality that works with various
      platforms including ActionScript, Processing, Python, PHP, Cinder, and openFrameworks,
      maintaining compatibility with older browsers and systems.
    boundary: Applies to mapping applications that require cross-platform compatibility
      and support for older browser versions. Fails when modern browser features or
      specific platforms are required.
  expected_classification:
    depth: domain
- id: 78bb461d01059c59999e2747fb47c1afd7d0a591de86ddc91af8bcea72b445bf
  input_fb:
    name: Pirate Leadership Through Algorithmic Governance
    definition: A governance model for large-scale collaborative systems where decision-making
      is structured through algorithmic alignment of individual goals with collective
      outcomes, similar to how pirate crews maintained cohesion through structured
      leadership and voting mechanisms.
    mechanism: In pirate crews, leadership was distributed between captains and crew
      votes, creating a feedback loop where individual goals (personal gain, survival)
      aligned with collective outcomes (crew cohesion, mission success) through the
      threat of mutiny and the need for consensus. This created a natural algorithmic
      alignment where individual incentives supported group objectives.
    boundary: Applies to large collaborative systems where individual members have
      competing interests but must align for collective success. Fails when individual
      goals are completely at odds with group objectives or when there's no mechanism
      for enforcing alignment.
  expected_classification:
    depth: cross-domain
- id: 01e9e478e9485202dd6a4f43ca6ab0eefe637a3b66cbefac5fe0c3f72875356b
  input_fb:
    name: Behavioral Engineering and the Anticipation of Digital Manipulation
    definition: Early theoretical foundations for behavioral engineering that anticipated
      modern digital manipulation techniques and their implications for privacy and
      individual autonomy.
    mechanism: Early behavioral engineering theories anticipated that technological
      instruments could shape human behavior in every domain, including gambling environments
      and organizational systems designed to maximize productivity through behavioral
      modification.
    boundary: Applies to the theoretical foundations of behavioral engineering in
      the mid-20th century. Fails when modern behavioral engineering techniques do
      not align with the anticipated scope or methods described in the original theories.
  expected_classification:
    depth: cross-domain
- id: 0364f5c5e329072fbc628d3476763cbbbc51f0b87db59dd787bcf0ce52e285c0
  input_fb:
    name: Synaesthetic Video Expression in Film
    definition: A visual expression of music that emerged in film through experimental
      approaches, particularly in abstract film and visual music, where narrative
      is constructed through visual elements rather than sound.
    mechanism: The use of visual effects, camera viewpoints like close-ups, and montage
      techniques creates narrative expression in film without relying on sound, causing
      film to detach from its theatrical origins and develop new storytelling methods.
    boundary: Applies to experimental film and visual music from the 20th century,
      particularly in abstract film and early music videos. Fails when film relies
      exclusively on sound or traditional narrative structures.
  expected_classification:
    depth: cross-domain
- id: e094cc40fcbae73d73ff829eb3deef021e03e65f99f8d8796365c28b0b129ab6
  input_fb:
    name: User Participation in Design
    definition: Design methodologies that engage users in the creation process to
      cultivate internal preferences and transform external behaviors into internal
      beliefs.
    mechanism: Participatory design methods involve users in creating or modifying
      products, which transforms their external engagement into internal investment
      and cultivates genuine preferences for the design through personal ownership
      and emotional connection.
    boundary: Applies when user participation creates genuine emotional investment
      and behavioral change. Fails when participation is superficial or doesn't lead
      to meaningful behavioral or belief shifts.
  expected_classification:
    depth: cross-domain
- id: 0071fd514eeeb0e548fa8a80b2bdd212912819a4239684477c176cd3f8bc0ec3
  input_fb:
    name: Self-explanatory Design
    definition: Effective user interfaces and web pages achieve clarity and usability
      by presenting information and functionality in a way that is immediately understandable
      without requiring additional explanation or cognitive effort from the user.
    mechanism: 'This is a practical design heuristic: creating interfaces that are
      self-evident reduces user confusion and increases task completion rates. The
      principle prescribes a design approach where the primary goal is to make the
      interface''s purpose and function apparent at first glance, rather than relying
      on user learning or instruction.'
    boundary: Applies when the design context allows for clear visual communication
      and when users can process information quickly. Fails when complex systems require
      detailed explanation or when users lack the context to understand the interface's
      logic.
  expected_classification:
    depth: domain
- id: 494e032beaf86521d442e1f0ede32f45ad5d4265b6d136e24070f0ea5bd99cb5
  input_fb:
    name: Ballets Russes Integration of Visual Arts into Theatrical
    definition: The Ballets Russes movement integrated visual arts principles and
      practitioners into theatrical production, creating a unified artistic experience
      that merged multiple artistic disciplines.
    mechanism: The movement brought visual arts concepts and artists like Picasso
      and Chagall into theatrical design, creating cross-pollination between artistic
      disciplines through shared stylistic elements and collaborative creative processes.
    boundary: Applies when visual arts elements are deliberately integrated into theatrical
      production rather than existing as separate domains. Fails when artistic disciplines
      remain isolated or when the integration is purely coincidental.
  expected_classification:
    depth: cross-domain
- id: 3a644bf178fbee83eacecbbd38e0eb0090d91bc40c8769ba5b024f80a893bf3d
  input_fb:
    name: Archetypal Storytelling and Personal Meaning
    definition: A master storyteller engages listeners' imagination to bring stories
      to life, with listeners intuiting internal connections between story elements.
      Legendary storytellers go beyond by helping listeners discover personal knowledge
      that is meaningful outside the individual through emotional bridges.
    mechanism: The storyteller's art creates emotional resonance that allows listeners
      to project their own experiences and insights onto the narrative, enabling personal
      discovery of universal truths through individual emotional engagement.
    boundary: Applies when storytelling creates emotional bridges that enable personal
      meaning-making. Fails when stories are purely entertainment without emotional
      or personal resonance.
  expected_classification:
    depth: cross-domain
- id: 67cdc582080d348f11e3968defa3b0d5068c209a8774ebc245671e8580ac896f
  input_fb:
    name: "Pok\xE9mon Go and Augmented Reality Applications"
    definition: A pattern describing how augmented reality technology is likely to
      expand beyond entertainment into practical applications in travel, education,
      and medicine.
    mechanism: "Pok\xE9mon Go represents the beginning of AR technology's expansion\
      \ from entertainment into practical applications, with the technology's ability\
      \ to augment reality creating new opportunities for educational, travel, and\
      \ healthcare experiences that connect users to past, present, and future contexts."
    boundary: Applies to the predicted expansion of AR technology from entertainment-focused
      use cases into practical applications in education, travel, and healthcare.
      Fails when AR technology does not achieve the necessary level of integration
      with real-world contexts or when practical applications do not emerge as predicted.
  expected_classification:
    depth: cross-domain
- id: 00f902e08887b2117101b23d635f2d9640bf0f8949154b237ee78200e2fd895f
  input_fb:
    name: Golden Ratio in Art and Architecture
    definition: "The golden ratio (\u03C6) has been historically associated with aesthetic\
      \ beauty and has been claimed to appear in artistic and architectural works,\
      \ particularly in ancient structures like the Egyptian pyramids. However, evidence\
      \ for its intentional use in historical artworks or monuments is often unsubstantiated\
      \ or requires complex analysis to detect."
    mechanism: "This is an empirical pattern describing the historical association\
      \ and claimed presence of the golden ratio in art and architecture. The passages\
      \ document the widespread belief that \u03C6 was used in ancient Egyptian monuments\
      \ and artistic works, but do not establish a causal mechanism for why or how\
      \ this would occur. The pattern shows that \u03C6 has been attributed to various\
      \ historical works, but actual evidence is often lacking or requires detailed\
      \ investigation to confirm."
    boundary: "Applies when historical or artistic works are examined for potential\
      \ golden ratio proportions. Fails when the evidence for \u03C6 usage is purely\
      \ speculative, anecdotal, or requires overly complex analysis to detect. The\
      \ principle does not apply to works where \u03C6 is clearly and intentionally\
      \ designed into the structure."
  expected_classification:
    depth: domain
- id: e01c258d681176807934bfc48585199b2a0bba0faf8e87c7bb8d0a8e099282b0
  input_fb:
    name: Anna Karenina Principle
    definition: Success requires avoiding many separate possible causes of failure,
      with the principle that systems fail due to multiple weak points rather than
      a single catastrophic flaw.
    mechanism: Systems that achieve success must avoid numerous potential failure
      modes, as any one of many weak points can cause the entire system to fail, making
      success dependent on addressing all vulnerabilities rather than just one critical
      issue.
    boundary: Applies to complex systems where multiple failure points can undermine
      success. Fails when systems are oversimplified or when only one failure mode
      is considered.
  expected_classification:
    depth: universal
- id: c8cc06a147c5426fc37b23d50c7481227c6e58a512fdf1d34fe5600e2ec63c35
  input_fb:
    name: Triple Bottom Line Concept
    definition: 'A business framework that balances three key dimensions: desirability
      (people), feasibility (planet), and viability (profits) to create sustainable
      and socially responsible organizations.'
    mechanism: The framework integrates human desirability needs, environmental sustainability,
      and financial viability as interconnected factors that must be considered together
      rather than in isolation, ensuring that radical ideas are not dismissed due
      to lack of immediate practicality or profitability.
    boundary: Applies to organizations seeking sustainable business models that consider
      social, environmental, and financial impacts. Fails when organizations prioritize
      one dimension over others or when the three dimensions are not properly balanced.
  expected_classification:
    depth: cross-domain
- id: 013733db444e558b129ec9e207c331f3dbd360cb1d606c127d1cea279fbd671a
  input_fb:
    name: Criteria for Exceptional Logo Design
    definition: A designer's checklist for identifying what makes a logo exceptional,
      emphasizing memorability, simplicity, timelessness, appropriateness, legibility,
      and spatial balance.
    mechanism: An exceptional logo must be memorable through conceptual uniqueness,
      reasonably simple without being boring, timeless in appearance, appropriate
      to its industry, legible at various sizes, and maintain proper balance of positive
      and negative space.
    boundary: Applies to the evaluation and creation of logos that meet established
      design principles. Fails when logos are judged by subjective preferences rather
      than objective criteria or when design principles are ignored.
  expected_classification:
    depth: specialized
- id: d7c0f3d6f8cc8f55be9ce242f46abe7bcc4d3abbda3d95f684b9f09191f4e8e6
  input_fb:
    name: Explore/exploit Trade-off in Rugged and Dancing Landscapes
    definition: A decision-making framework that balances exploration (seeking new
      information) with exploitation (using known information) to optimize performance
      in complex environments with varying landscape characteristics.
    mechanism: In rugged landscapes, the optimal balance shifts toward exploitation
      as the system approaches peak performance, while in dancing landscapes, the
      relationship between exploration and exploitation is more dynamic and requires
      maintaining a balance to sustain elevation.
    boundary: Applies to decision problems with multiple possible outcomes and varying
      landscape characteristics. Fails when landscapes are static or when the relationship
      between exploration/exploitation is not clearly defined.
  expected_classification:
    depth: cross-domain
- id: 0570c2d04078c155eede73fb0371f9aa5d57c78cd7335041e36f0ead26947522
  input_fb:
    name: Context-free Code Snippet Pattern
    definition: A pattern of code presentation where individual code snippets are
      shown without surrounding function context, often to illustrate specific concepts
      or techniques rather than complete working examples.
    mechanism: Code snippets are presented in isolation to demonstrate specific programming
      concepts or techniques, with indentation matching established patterns from
      previous complete snippets to maintain visual continuity.
    boundary: Applies to code presentation in documentation where individual snippets
      are shown without full context. Fails when the snippet is part of a complete,
      runnable function or when no context is established.
  expected_classification:
    depth: specialized
- id: 0312bb9b12514499c4cbe55b7fce5a552a16cc2f0304ecfba5551c157277ccab
  input_fb:
    name: Design Manual Tone and Purpose
    definition: A design manual should inspire creativity and guide users toward excellence
      rather than discourage them with prescriptive rules and scolding language.
    mechanism: The tone and presentation of design documentation influences user engagement
      and creative output, with inspirational manuals fostering better design outcomes
      than restrictive rulebooks.
    boundary: Applies to design documentation for external designers working with
      established brand systems. Fails when the manual is purely prescriptive without
      inspirational elements.
  expected_classification:
    depth: domain
- id: d2b4b57e100fabffe09b392d1bd8736dcad4f33c8428f2f4123c0a9a984d80d7
  input_fb:
    name: Localized Interaction Threshold
    definition: Systems that model collective behavior or group dynamics should limit
      interactions to only those elements within a specific spatial or functional
      neighborhood, rather than including all elements in calculations. This localized
      approach prevents over-inclusion of irrelevant data and maintains computational
      efficiency.
    mechanism: This is a practical design heuristic for systems modeling group behavior.
      When calculating group properties like average velocity or force vectors, including
      all elements regardless of proximity introduces unnecessary computational overhead
      and can distort the emergent behavior. By constraining calculations to a defined
      neighborhood radius, the system maintains fidelity to local interactions while
      filtering out distant influences that do not meaningfully contribute to the
      current state.
    boundary: Applies when systems model emergent group behavior where spatial or
      functional proximity matters (e.g., flocking, swarm intelligence). Fails when
      all elements must contribute equally to the system's state regardless of distance
      or when the system's emergent properties depend on global information that cannot
      be approximated locally.
  expected_classification:
    depth: universal
- id: a3f6d639cd5a12bab3f659336a5db0ee19e6dd2446b77f8615acd2ae90631b8f
  input_fb:
    name: Hetionet Drug Discovery Methodology
    definition: A computational approach for identifying potential drug treatments
      by analyzing network connectivity between compounds and diseases in the Hetionet
      knowledge graph.
    mechanism: The method uses metapaths to traverse from compounds to diseases in
      the Hetionet schema, creating features for compound-disease pairs that capture
      network connectivity patterns regardless of direct relationships.
    boundary: Applies to drug discovery research using Hetionet's knowledge graph
      structure. Fails when the network structure or metapath definitions do not support
      the intended analysis.
  expected_classification:
    depth: cross-domain
- id: a9cc34f3ed19b0e59aa9eff3ef9ad7c0d1b76ccb42f4af80bbf447d598f8d661
  input_fb:
    name: Copyright Erosion Through Platform Embedding
    definition: Digital platforms increasingly embed mandatory universal copyright
      licenses into their terms of service, effectively undermining traditional copyright
      frameworks. This mechanism represents a shift in how intellectual property rights
      are enforced and distributed in the digital ecosystem.
    mechanism: This is an empirical pattern describing how copyright is being systematically
      weakened through platform design choices. Popular social media and search platforms
      embed universal copyright licenses into their terms, creating a de facto copyright
      erosion through widespread adoption of these terms. The pattern shows a consistent
      trend where platforms that encourage sharing also enforce universal licensing,
      even as they claim to support creator rights.
    boundary: Applies to digital platforms that encourage public sharing and have
      mandatory terms of service. Fails for platforms that explicitly protect or promote
      traditional copyright models, or for offline or non-digital content distribution
      systems.
  expected_classification:
    depth: cross-domain
- id: 0f6e2e95b762b11f34f8bee5ed55dde560d5bab5c1e71532f3052939d273fa23
  input_fb:
    name: Brier Score Calibration Principle
    definition: A principle for evaluating the quality of probability estimates by
      testing whether the estimator is willing to accept bets at the odds they assign,
      indicating calibration between stated probabilities and actual outcomes.
    mechanism: The Brier score framework measures the accuracy of probabilistic forecasts
      by comparing predicted probabilities with actual binary outcomes, where the
      optimal strategy is to accept bets at the odds implied by one's probability
      estimates.
    boundary: Applies to binary outcome forecasting scenarios where probabilistic
      estimates can be meaningfully tested against actual results. Fails when outcomes
      are not binary or when the betting framework does not align with the probability
      assessment.
  expected_classification:
    depth: cross-domain
- id: 509091dc9921473bbaa518fb1575baeb8edc12ac892939bd1026399f84bdd2cf
  input_fb:
    name: Extremistan Vs Mediocristan
    definition: 'A conceptual framework distinguishing two environments: Extremistan,
      where rare events can dramatically alter outcomes (like Yevgenia''s rise from
      basement to superstar), and Mediocristan, which is characterized by stability
      and predictable, moderate fluctuations.'
    mechanism: In Extremistan, outcomes are not constrained by the central limit theorem
      and can be dominated by rare, extreme events. In Mediocristan, outcomes follow
      normal distribution patterns with most results clustering around the mean.
    boundary: Applies to environments where rare events can have disproportionate
      impact (Extremistan) versus environments where outcomes are predictable and
      follow normal distributions (Mediocristan). Does not apply to environments that
      are purely deterministic or purely random.
  expected_classification:
    depth: cross-domain
- id: 00b5badbc5892768f59cc1a2f8be43eed09fae2937a2a330979f622f31d44667
  input_fb:
    name: Antifragility Through Variability
    definition: Biological and economic systems require structured variability and
      exposure to extreme stressors to maintain resilience and adaptability. Systems
      that lack this variability become fragile and unable to withstand shocks.
    mechanism: Systems adapt and grow stronger through controlled exposure to variability
      and stress. This process involves the integration of diverse inputs, serial
      availability of sources, and structured variation in environmental conditions.
      The system's response to variability creates redundancy and diversification
      that enhances robustness. When systems are shielded from variability, they lose
      their capacity for adaptation and become vulnerable to collapse under stress.
    boundary: Applies when systems are exposed to structured variability that includes
      extreme events or stressors. Fails when systems are isolated from all variability
      or when variability is too random or unstructured to allow for adaptive responses.
  expected_classification:
    depth: cross-domain
- id: 0383c9545482fb8e1098df91d9c9d1054c03d71a4987aa7cc816a969d8473241
  input_fb:
    name: Layered Testing Strategy
    definition: Effective testing in complex systems requires a multi-layered approach
      that tests both individual components and their integrated behavior. This principle
      advocates for combining unit-level assertions with end-to-end regression testing
      to ensure both component correctness and system-level reliability.
    mechanism: 'This is a practical heuristic for testing design: testing individual
      units (like model steps or code functions) provides confidence in component
      behavior, while regression testing of complete interactions ensures that integrated
      systems function as expected. The approach recognizes that unit tests catch
      specific failures, while system-level tests reveal integration issues and behavioral
      drift.'
    boundary: Applies when systems have both discrete components and integrated workflows.
      Fails when testing resources are constrained to only one level (unit or system)
      or when the system is so simple that end-to-end testing is redundant.
  expected_classification:
    depth: domain
- id: aa3376d71803ae5d02e54e1c79098cb75c60c46f770d11bc17228d40c8150f52
  input_fb:
    name: Resource-constrained Focus
    definition: Entrepreneurs and product teams operating under limited resources
      (time, attention, money, people) achieve better outcomes by concentrating efforts
      on a single, well-defined objective rather than spreading attention across multiple
      pursuits. This principle reflects a fundamental constraint-driven optimization
      strategy.
    mechanism: 'This is a normative heuristic: focusing on one thing exceptionally
      well is more effective than diversifying efforts when resources are limited.
      The constraint of scarcity forces prioritization and eliminates dilution of
      effort, leading to higher quality outcomes in a single domain. The principle
      prescribes a practical approach to resource allocation under conditions of genuine
      limitation.'
    boundary: Applies when entrepreneurs or teams face genuine constraints on time,
      attention, money, or personnel. Fails when resources are abundant or when the
      constraint is artificial (e.g., deliberate overextension for perceived competitive
      advantage). Also fails when the single focus is misaligned with market demand
      or when the environment requires rapid diversification.
  expected_classification:
    depth: cross-domain
- id: b3d33db6abad21df9b602fcf2b1b646ae958ba2219e0eee664a7bd84c3db3b10
  input_fb:
    name: Emoji Cultural Adaptation
    definition: Emojis evolve through cultural adaptation and linguistic integration,
      serving as multimodal communicative tools that bridge language barriers while
      reflecting and shaping social norms and identities. The principle describes
      how emojis function as both global communication symbols and culturally specific
      expressions.
    mechanism: 'Emojis undergo cultural adaptation through three primary processes:
      (1) cross-linguistic adoption where they transcend their original language contexts
      to become globally recognized symbols; (2) cultural specificity where emoji
      sets are modified to reflect local languages, traditions, and social values;
      and (3) semantic evolution where their meanings shift through usage and platform
      modifications (e.g., skin tone customization). This adaptation occurs through
      user interaction, platform updates, and community-driven interpretation rather
      than top-down design.'
    boundary: Applies when emojis are used in cross-cultural communication or when
      cultural specificity is introduced through language or regional adaptation.
      Fails when emojis remain purely functional or when they are used in contexts
      where cultural meaning is irrelevant (e.g., technical documentation, mathematical
      notation).
  expected_classification:
    depth: cross-domain
- id: 07564961396d003cc7724390dc3ba4e9d268bb6a3afdc0480694d64c9b417150
  input_fb:
    name: Collaborative Feedback Loop
    definition: A structured process where team members regularly exchange insights,
      progress, and adjustments to improve collective outcomes. The principle enables
      continuous refinement through shared observation and mutual accountability.
    mechanism: 'This is a normative heuristic: regular feedback exchanges between
      collaborators lead to better outcomes because they create opportunities for
      alignment, correction, and shared learning. The process involves consistent
      communication channels (e.g., one-on-ones, workshops, buddy systems) that allow
      participants to observe each other''s work, provide input, and adjust their
      approach based on collective insights.'
    boundary: Applies when team members have aligned goals and can engage in constructive
      dialogue. Fails when feedback is not sought or when participants lack psychological
      safety to share honest critiques or progress updates.
  expected_classification:
    depth: specialized
- id: 97d47f7d5ca03438a3ae98635b42089d80b5667c6a0e1fec411e792d217ab55e
  input_fb:
    name: Visual Metaphor Cognitive Processing
    definition: Visual metaphors engage cognitive processes by creating conceptual
      connections between source and target domains, requiring viewers to resolve
      inconsistencies and integrate disparate elements into a coherent interpretation.
      The effectiveness of visual metaphors depends on their ability to stimulate
      curiosity, enhance attention, and promote deeper processing while managing the
      risk of misinterpretation or cognitive overload.
    mechanism: Visual metaphors function as cognitive puzzles that require viewers
      to actively construct meaning by identifying relationships between source and
      target domains. This process involves pattern recognition, conceptual integration,
      and resolution of semantic inconsistencies. When successfully resolved, the
      metaphor creates a rewarding cognitive experience that enhances memory and comprehension.
      The viewer's engagement with the metaphor is driven by curiosity and the desire
      to understand the intended connection, which activates deeper processing mechanisms.
    boundary: Applies when visual metaphors present clear enough relationships for
      viewers to construct meaningful connections. Fails when the metaphor is too
      obscure, the conceptual link is unintentionally misleading, or the complexity
      exceeds the viewer's cognitive capacity to process the information effectively.
  expected_classification:
    depth: cross-domain
- id: 9a90188f1a75612ce030cd434e148d8e76ead22f390682bbd3ddd4e2eacebb4a
  input_fb:
    name: Digital Media Evolution and Synaesthesia
    definition: The transition from analog to digital media and its impact on visual
      and auditory expression, particularly through the development of electronic
      media and the fusion of image and sound.
    mechanism: The evolution from analog to digital media, particularly through portable
      technology like the Sony PortaPack, enabled new forms of artistic expression
      where image and sound became integrated through electronic means, creating a
      technological connection between visual and auditory elements.
    boundary: Applies to the period following the 1960s when portable electronic media
      became available. Fails when digital media is not accessible or when traditional
      analog methods dominate.
  expected_classification:
    depth: cross-domain
- id: 9c7210bea405139caf22bb3888014c4a86a67c483f152e4e2cca87382ed8a346
  input_fb:
    name: Quetelet's Statistical Methodology and Influence
    definition: A methodological approach to social science that applied statistical
      analysis to understand natural laws governing human behavior and social phenomena.
    mechanism: Quetelet's approach involved creating visual maps of social phenomena
      (like property crimes in France) to empirically demonstrate that human behavior
      followed natural laws, independent of individual agency, and that social inequality
      influenced crime rates.
    boundary: Applies to social science research that seeks to identify natural laws
      through statistical analysis. Fails when human agency or individual variation
      is the primary focus rather than statistical patterns.
  expected_classification:
    depth: cross-domain
- id: 654093c8525a9ad239ffe4ca8cec06d55d2d10462bcd402d5ce10678def00828
  input_fb:
    name: Semiotic Code Transfer
    definition: Meaning is transferred across semiotic systems when texts are encoded
      in one system and decoded in another, requiring translation between non-equivalent
      semiotic codes. This process involves mapping between different systems of signs
      and symbols that carry meaning in distinct ways.
    mechanism: Semiotic code transfer occurs when a text or message encoded in one
      semiotic system (such as language, images, or traffic signs) must be interpreted
      or re-encoded in another semiotic system. The process requires understanding
      the structural relationships and meaning conventions of both systems, often
      involving translation or adaptation to maintain semantic integrity across systems
      that are not directly equivalent.
    boundary: Applies when semiotic systems are distinct and non-equivalent, requiring
      translation or adaptation. Fails when systems are directly comparable or when
      the same semiotic code is used for encoding and decoding.
  expected_classification:
    depth: cross-domain
- id: 20bd79c1973446ed2ff77bdc74f13fa910c39980442e77f64a3bd0adba85f6be
  input_fb:
    name: Time As Irreversible Performance
    definition: The concept of time as an irreversible process where the universe
      is understood as a dynamic performance rather than a static arrangement.
    mechanism: Time is understood as an irreversible performance where the universe
      is a stage and all matter are actors, with unpredictable interactions that prevent
      perfect reversibility of states. This view recognizes that complexity and energy
      interactions make precise past reconstruction impossible.
    boundary: Applies to modern scientific understanding of time as a dynamic, irreversible
      process rather than a static dimension. Fails in classical or deterministic
      views of time where perfect reversibility is assumed.
  expected_classification:
    depth: universal
- id: f073f052b5ee40c434be2e0bbcc22346c285287394727e86d988cec3ed094448
  input_fb:
    name: Paradox of Success
    definition: Success creates conditions that undermine future success by fostering
      complacency, self-satisfaction, and overconfidence in existing approaches. This
      leads to a failure to adapt or innovate when conditions change.
    mechanism: Success generates psychological and organizational inertia that reduces
      vigilance toward external changes and internal weaknesses. This occurs because
      success reinforces existing strategies and validates past decisions, making
      leaders less likely to question or adjust their approaches even when circumstances
      shift. The phenomenon is not a direct causal chain but rather a recognized pattern
      of how success can breed conditions for future failure.
    boundary: Applies when success leads to reduced attention to market changes, competitive
      threats, or internal inefficiencies. Fails when success is accompanied by deliberate
      adaptation, learning, and strategic flexibility that actively counteracts complacency.
  expected_classification:
    depth: cross-domain
- id: 4b30266a04b55c3ab4fbd2bab861ec2907729737aefcff5e257c028415c98f14
  input_fb:
    name: Information Overload From Evidence Expansion
    definition: The volume of evidence available for analysis grows exponentially
      beyond human capacity to process it, creating a fundamental mismatch between
      information availability and comprehension ability. This expansion occurs not
      only in quantity but also in the evolving nature of what constitutes valid evidence.
    mechanism: 'The expansion of evidence occurs through two primary mechanisms: (1)
      exponential growth in data availability due to digital storage and retrieval
      systems, and (2) evolution of evidence standards that expand the scope of what
      counts as valid proof. These changes compound to create a situation where human
      cognitive limits are exceeded by the sheer scale and changing nature of evidence,
      making comprehensive analysis unattainable through traditional human methods.'
    boundary: Applies when evidence is both voluminous and evolving in definition.
      Fails when evidence is either small in scale or static in nature, where human
      analysis remains feasible and effective.
  expected_classification:
    depth: universal
- id: 026308733fa1c4cb60d43814240e46065a10b740d49de35f666a978fb0d5d902
  input_fb:
    name: Emotional Storytelling As Brand and Leadership Driver
    definition: Both brands and leaders leverage emotionally resonant narratives to
      create deep engagement and drive action. These stories function as moral frameworks
      that guide behavior and shape identity, whether for customers or team members.
      The emotional core of a story serves as a psychological anchor that makes the
      narrative memorable and impactful.
    mechanism: Emotional storytelling works by embedding moral or identity-based messages
      into narratives that resonate with the audience's values and sense of self.
      These stories activate emotional reward and punishment systems, making the audience
      more likely to engage with, remember, and act on the message. The emotional
      framing creates a psychological contract between the storyteller and the audience,
      where the story's moral becomes a shared reference point for behavior and identity.
    boundary: Applies when the story is tied to a moral or identity framework that
      the audience can relate to and internalize. Fails when the story is purely informational
      or disconnected from the audience's emotional or identity needs, or when it
      lacks a clear moral or purpose that can guide behavior.
  expected_classification:
    depth: domain
- id: 0becc686ace413dcb660d2f34fd85bea89edd07086510bf309a675a9f6864ad8
  input_fb:
    name: Digital Image Analysis and Metadata Exploration
    definition: A digital methodology for examining large collections of digitally
      created online images with their metadata to understand how online images are
      audienced through tagging systems and user interactions.
    mechanism: The method involves collecting large numbers of digitally created online
      images with metadata, then analyzing tags added by platforms, creators, and
      users to explore how online images are audienced in different ways through various
      tagging mechanisms.
    boundary: Applies to collections of digitally created images with associated metadata
      and tagging systems. Fails when images lack metadata or when tagging systems
      are not available for analysis.
  expected_classification:
    depth: specialized
- id: cfd9095d6e835251e8cedf42dedc867630ae90a3fb1d394abebe27824da653cf
  input_fb:
    name: Feature Bloat Impact on Long-term Retention
    definition: A principle demonstrating that excessive feature inclusion in products
      can decrease customer lifetime value and long-term retention by obscuring core
      product value.
    mechanism: When companies pack too many features into a single product, they increase
      complexity and potentially confuse users about the product's primary purpose,
      which reduces customer lifetime value and retention rates.
    boundary: Applies to product development and feature management in mature products.
      Fails when companies don't recognize the relationship between feature count
      and user experience complexity.
  expected_classification:
    depth: cross-domain
- id: bb2221e9e27b0cee980cdf811f5df32d979aacb27c909dd15854f11e62387cd8
  input_fb:
    name: Data-driven Narrative Embodiment
    definition: Using data visualization and storytelling techniques to transform
      statistical information into emotionally resonant, culturally grounded artistic
      expressions that communicate social and political realities. The principle describes
      a method of making abstract data meaningful through culturally specific artistic
      mediums.
    mechanism: This is a descriptive model of how data storytelling can be extended
      into artistic practice. The principle describes a structured approach where
      data from specific sources (like UNHCR surveys) is translated into visual and
      tactile forms (embroidery, silkscreen) that connect to cultural traditions and
      emotional experiences of affected populations. The process involves selecting
      culturally relevant artistic methods and translating numerical statistics into
      visual narratives that resonate with both the subject matter and the audience's
      cultural understanding.
    boundary: Applies when data visualization is integrated with culturally meaningful
      artistic practices and social storytelling. Fails when data is presented purely
      in conventional visual formats without cultural or emotional context, or when
      artistic medium is chosen without consideration of its cultural resonance with
      the data's subject matter.
  expected_classification:
    depth: cross-domain
- id: 01100ddd4d8b20cb031c992cee5c8ddd702f952ee435e9c635c304e6cd418a3c
  input_fb:
    name: Hierarchical Spatial Organization
    definition: Spatial design organizes elements into nested levels of hierarchy,
      where larger-scale structures (like clusters, communities, or buildings) contain
      smaller-scale elements (like individual units, entrances, or open spaces) in
      a structured relationship. This organization enables both coherent whole-system
      identity and localized autonomy.
    mechanism: Spatial systems are structured through nested layers of scale and function.
      At the largest level, elements such as clusters or communities define the broader
      context and shared identity. Within these, smaller units like buildings or individual
      housing units are organized according to internal logic (e.g., family units,
      circulation paths, or functional zones). The organization follows a top-down
      structure where each level serves as both a container and a generator of form
      for the next, enabling a balance between systemic coherence and local adaptability.
    boundary: Applies when spatial systems are composed of multiple nested scales
      and functions that can be meaningfully organized into levels. Fails when spatial
      elements are isolated or arranged without regard to hierarchical structure or
      when the system lacks a clear distinction between macro and micro levels.
  expected_classification:
    depth: domain
- id: 548112529cdfc84a7aa4ccaf1f4dfa7f6487afb722aa786edfc8b0925b920bad
  input_fb:
    name: Adaptive Design Through Natural Inspiration
    definition: Design solutions can be adapted from natural forms and processes to
      address specific functional challenges by identifying and applying analogous
      structural or behavioral patterns from the natural world. This approach leverages
      evolutionary optimization and proven biological strategies to solve human design
      problems.
    mechanism: 'This is a practical heuristic for design problem-solving: designers
      observe natural systems that have evolved to solve similar challenges (e.g.,
      minimizing drag, maximizing efficiency) and apply those solutions as direct
      or modified models to human-made systems. The process involves identifying a
      functional problem, searching for natural analogs that solve it, and adapting
      the natural solution to fit human contexts and constraints.'
    boundary: Applies when natural systems have evolved solutions to problems that
      mirror human design challenges. Fails when the natural system's solution is
      not transferable due to fundamental differences in scale, medium, or operating
      conditions (e.g., biological systems vs. engineered systems with different physical
      constraints). Also fails when the natural solution is too complex or impractical
      to implement in human contexts.
  expected_classification:
    depth: cross-domain
- id: 94dd96f85c924f081cb7297a9b8bc1b97a4c1ac4c9641aa4ab2eec6d93720618
  input_fb:
    name: Social Proof Bias (2)
    definition: The tendency for individuals to follow the actions or opinions of
      others in a group, especially when those actions are ambiguous or uncertain.
      This behavior is driven by the assumption that others' choices reflect correct
      or preferred responses.
    mechanism: This is an empirical pattern, not a causal mechanism. Social proof
      manifests when individuals observe others' behavior in ambiguous situations
      and infer that the group's choice is the correct one. The behavior is not explained
      by a single cause but rather emerges from the interplay between uncertainty,
      social influence, and the human tendency to align with group norms. The pattern
      is consistently observed in experimental settings where individuals are influenced
      by the choices of others, even when those choices are incorrect.
    boundary: Applies when individuals face ambiguous or uncertain decisions and observe
      others' choices. Fails when individuals have clear information or when the group's
      behavior is clearly incorrect or irrelevant to the decision at hand.
  expected_classification:
    depth: cross-domain
- id: b67252aad84514620796ce1f64e334b7d4d6aed27c865c3d918d18cd56247660
  input_fb:
    name: Desire-friction Conversion Formula
    definition: A principle stating that conversion rate is determined by the relationship
      between customer desire for a product and the friction they experience in using
      it.
    mechanism: The formula demonstrates that as customer desire increases, they become
      more tolerant of friction in the user experience, while low desire makes even
      minor friction likely to cause abandonment. Early adopters with high desire
      can tolerate product flaws, but general users require minimal friction to convert.
    boundary: Applies to user experience and conversion optimization in product development.
      Fails when the relationship between desire and friction is not properly understood
      or when other conversion factors are ignored.
  expected_classification:
    depth: cross-domain
- id: 5378b429619824a2c97f23c6dd4d9972b79c609d963c9feb7c52c04c727965bd
  input_fb:
    name: Anomaly Accumulation Leading to Paradigm Shift
    definition: A process where accumulating anomalies or inconsistencies in a prevailing
      framework eventually challenge its fundamental assumptions and lead to a major
      conceptual transformation.
    mechanism: As anomalies accumulate, they create increasing pressure on the existing
      paradigm's explanatory power, forcing a reevaluation of core assumptions and
      potentially triggering a complete paradigm shift when the accumulated inconsistencies
      become too great to ignore.
    boundary: Applies when anomalies build up over time and challenge fundamental
      assumptions rather than just individual observations. Fails when anomalies are
      isolated or easily explained within the existing framework.
  expected_classification:
    depth: universal
- id: ea0a48cbfaf764b2777927fa1cd56e2c5579cd7d08ece5169ce92832879afb59
  input_fb:
    name: Design Cognition and Cultural Color Research
    definition: Research examining design cognition, conceptual structures in thinking
      processes, human impressions and emotions, and visual communication design in
      cross-cultural contexts.
    mechanism: The research investigates how design thinking processes are influenced
      by cultural contexts and how color perception varies across different cultural
      groups, particularly in relation to color trends and market applications.
    boundary: Applies to cross-cultural design research and color psychology in global
      markets. Fails when applied to single-culture or non-color-focused design contexts.
  expected_classification:
    depth: cross-domain
- id: ca43060ed756f67ee93c81b506fa505170cff8d5f37cca43ee8b247c59883e08
  input_fb:
    name: Serpent As Symbolic Archetype
    definition: The serpent or snake functions as a universal symbolic archetype across
      diverse cultural and religious traditions, embodying themes of transformation,
      cosmic order, and the regulation of consciousness or energy. It represents both
      destructive and regenerative forces, often associated with divine power, fertility,
      and spiritual awakening.
    mechanism: "The serpent appears as a recurring symbol in mythologies and spiritual\
      \ systems, manifesting in various forms\u2014such as the cosmic serpent, the\
      \ serpent of Kundalini energy, or the thousand-headed serpent of Hindu cosmology.\
      \ These representations reflect a shared archetypal structure where the serpent\
      \ embodies the interplay between opposing forces, the flow of energy through\
      \ the body or cosmos, and the potential for spiritual transformation. The archetype\
      \ transcends specific cultural boundaries, adapting to local contexts while\
      \ maintaining core symbolic meanings."
    boundary: Applies when the serpent is used symbolically in mythological, religious,
      or spiritual contexts to represent cosmic or psychological principles. Fails
      when the serpent is merely a descriptive element without symbolic or archetypal
      meaning, or when it is used in purely secular or literal contexts (e.g., as
      a literal animal in natural history).
  expected_classification:
    depth: cross-domain
- id: 5d08f057791c23c1c9d1039feb98aa1badfb77861fd8bb8cf2c96422bd86d890
  input_fb:
    name: Perlin Noise Smooth Transition
    definition: Perlin noise generates sequences with gradual, organic transitions
      between values rather than abrupt changes, creating natural-looking patterns
      and animations. The principle describes a method for producing visually coherent
      and aesthetically pleasing variations in generative systems.
    mechanism: Perlin noise is a procedural function that interpolates between random
      values at grid points, ensuring that adjacent outputs differ smoothly. This
      interpolation creates a continuous gradient that avoids the sharp jumps characteristic
      of pure random sequences. The smoothness arises from the mathematical blending
      of multiple noise values at different scales and positions.
    boundary: Applies when generating visual or temporal sequences where gradual variation
      is preferred over abrupt change. Fails when pure randomness or deterministic
      patterns are required, or when the system needs to maintain strict periodicity
      without any interpolation.
  expected_classification:
    depth: cross-domain
- id: ea4a41fb9860917e9e7fbabc69bc7df4456fd117a498bcc93c769ba591c47358
  input_fb:
    name: Benford's Law
    definition: A statistical phenomenon where the first digits of numbers in many
      real-world datasets follow a specific logarithmic distribution rather than a
      uniform distribution.
    mechanism: When data sets are naturally occurring or socially based, the distribution
      of first digits follows a predictable pattern where 1 appears as the first digit
      approximately 30% of the time, with decreasing frequency for higher digits.
    boundary: Applies to naturally occurring or socially based datasets where numbers
      are not entirely random. Fails when data is artificially generated or completely
      random.
  expected_classification:
    depth: cross-domain
- id: c13c425ec50b6e1fa8e9926b404652c2a6c0f8d4d66d091e45efa23d9d69b7f9
  input_fb:
    name: Systematized Curiosity for Creative Output
    definition: A principle for maintaining consistent creative output through systematic
      approaches to curiosity and information processing.
    mechanism: Systematizing curiosity involves creating structured processes for
      asking questions, exploring diverse topics, and connecting seemingly unrelated
      information to generate new insights and creative work.
    boundary: Applies to individuals who want to maintain consistent creative output
      and need structured approaches to managing their curiosity. Fails when individuals
      prefer spontaneous exploration over systematic processes.
  expected_classification:
    depth: cross-domain
- id: 558847bc54f7267ccf5a7339889130744055e310c4a410118637cd2f1f43f41d
  input_fb:
    name: Viral Success Through Social Experience
    definition: A principle where products or services achieve viral success not through
      price or quality alone, but through creating social experiences that generate
      demand and customer loyalty.
    mechanism: The principle operates through creating a social phenomenon where the
      experience of waiting in line or participating in a shared activity becomes
      more valuable than the product itself, generating word-of-mouth marketing and
      community formation around the experience.
    boundary: Applies to environments where social experience and community formation
      can be leveraged as marketing tools, particularly in physical or digital spaces
      where social interaction is possible. Fails when the social element cannot be
      effectively created or when the experience doesn't translate into demand.
  expected_classification:
    depth: cross-domain
- id: 429f6d8daee84c55973c96da324750df3a2cbd7098947b469eb3268ed2b13f90
  input_fb:
    name: Next Right Thing Principle
    definition: A philosophical approach to decision-making that emphasizes focusing
      on the immediate, necessary action rather than attempting to optimize for long-term
      outcomes or perfect solutions.
    mechanism: The principle operates on the premise that humans can only realistically
      focus on what is immediately required in any given moment, regardless of the
      broader context or future implications, because objective guidance for optimal
      action is unavailable.
    boundary: Applies when individuals face moments of acute crisis or decision-making
      under uncertainty. Fails when individuals attempt to optimize for long-term
      outcomes or make decisions with perfect information.
  expected_classification:
    depth: cross-domain
- id: 1db2d183f7d5f338fbe7904fa271a95a3cfa776f1b3186d3ed63a83d75c3aca0
  input_fb:
    name: Narrative Network Iconography
    definition: Visual icons in narrative networks serve as symbolic representations
      that encode meaning through denotation, connotation, and myth, requiring explicit
      justification of design choices to communicate effectively with target audiences.
      The principle describes how iconography functions as a storytelling tool that
      bridges abstract data with concrete audience understanding.
    mechanism: Icons function as visual metaphors that carry layered meanings beyond
      their literal representation. The effectiveness of an icon depends on how well
      its denotative form aligns with the audience's cultural and emotional associations
      (connotation) and how it reinforces or challenges existing narratives or myths
      (myth). Designers must articulate these choices explicitly because the same
      icon can carry different meanings across contexts and audiences.
    boundary: Applies when visual storytelling requires symbolic representation to
      convey complex narratives or data relationships. Fails when the audience lacks
      shared cultural reference points or when icon design is purely aesthetic without
      communicative intent.
  expected_classification:
    depth: specialized
- id: 0f52193ba6dd084c3998850418a13e772f92388efa2221d858fc77339020c49f
  input_fb:
    name: Eisenstein's Montage Theory
    definition: A film editing theory that uses parallel editing to synthesize two
      contrasting ideas into a third symbolic meaning.
    mechanism: Eisenstein's approach involves juxtaposing two different scenes or
      concepts that, when placed together, create a new meaning that transcends either
      individual element, often through symbolic or metaphorical equivalence.
    boundary: Applies when editing is used to create symbolic synthesis between contrasting
      elements rather than simple narrative flow. Fails when the technique is used
      for straightforward storytelling or simple contrast without deeper meaning.
  expected_classification:
    depth: specialized
- id: 05f317973158426d06bfd5c91fd8148b548fc5018486be24dd2c582b5fcfaa70
  input_fb:
    name: Naumburg's Scribble Technique
    definition: A therapeutic method where patients create spontaneous free-swinging
      forms using curves and zigzag lines on large sheets of paper to access unconscious
      content and recover spontaneous sense of form.
    mechanism: The technique allows unconscious material to flow through spontaneous
      artistic expression, bypassing conscious control and enabling recovery of form-sense
      that may have been blocked by perceptual rigidity.
    boundary: Applies when patients need to access unconscious content or recover
      lost form-sense. Fails when patients lack the capacity for spontaneous artistic
      expression or when the technique is applied without therapeutic context.
  expected_classification:
    depth: specialized
- id: 3b5710d2b5b413eea7305dc24787ec8aa4ed8bcad61b1a91dbd6e14043376a23
  input_fb:
    name: The Complexity of Context Understanding
    definition: The principle that context is a complex, multifaceted concept that
      resists simple definition and understanding because it is about everything and
      continuously shifts.
    mechanism: Context is characterized by its inherent complexity and resistance
      to definition, where attempts to understand it lead to more context rather than
      clarity, making it fundamentally mysterious yet essential for daily understanding.
    boundary: Applies to conceptual and philosophical challenges in understanding
      context as a phenomenon. Fails when context is treated as a simple environmental
      property or static attribute.
  expected_classification:
    depth: cross-domain
- id: 40a2174cce782d4266aa7e839604c5c3eda2c5b9e470ada2e66e4b3de0d11740
  input_fb:
    name: Creative Economy Framework
    definition: A knowledge-based economic system that integrates human development
      with technology, intellectual property, and tourism, encompassing creative services
      that generate new ideas, technology, and content.
    mechanism: The framework operates through creative services such as design, advertising,
      and entertainment that add value to products and drive innovation across all
      economic sectors, functioning as both value creators and innovation drivers.
    boundary: Applies to economic activities that specifically create new ideas, technology,
      or content rather than traditional manufacturing or service sectors. Fails when
      applied to non-creative economic activities.
  expected_classification:
    depth: cross-domain
- id: f9615f8994aff49d2d3c54f77cf7e13c1d128406a6c7f780ee0a56b62bff288e
  input_fb:
    name: Occult Influence on Surrealism and Film Noir
    definition: "The hypothesis that surrealist art and film noir were influenced\
      \ by occult traditions and practices, particularly through the work of figures\
      \ like Eliphas L\xE9vi and the broader esoteric movement."
    mechanism: "Surrealism's antinomian stance and thematic elements were directly\
      \ influenced by occult writings and practices, particularly the works of nineteenth-century\
      \ magi like Eliphas L\xE9vi, whose 'Dogma and Ritual of High Magic' was widely\
      \ read by surrealist ideologues including Andr\xE9 Breton."
    boundary: Applies to the historical development of surrealist art and its connection
      to occult practices in the late 19th and early 20th centuries. Fails to establish
      a direct causal link between specific occult practices and the Black Dahlia
      case or film adaptations.
  expected_classification:
    depth: cross-domain
- id: 00619acc812e2a7e3643ca9a7b877fce671ba619b169d249c147f9f3ec4d59a6
  input_fb:
    name: Ethnic 'we'-ness As Business Advantage
    definition: The principle that ethnic or cultural belonging ("we"-ness) serves
      as a powerful influencer in business relationships and customer trust
    mechanism: Personal ethnic identity and community membership create automatic
      trust and belonging that transcends typical business relationships, making customers
      more likely to engage with individuals who share their cultural background
    boundary: Applies to business contexts where cultural identity and community membership
      are relevant factors in customer relationships. Fails when customers don't value
      or recognize ethnic identity as a trust signal
  expected_classification:
    depth: domain
- id: 1b5c88a2f60c20ed8a7b20f863a9800ed47407dcd4161d0895581e4c8656f06c
  input_fb:
    name: Interactive Learning Through Shader Programming
    definition: An educational approach where learners immediately see the visual
      effects of code changes in real-time, making abstract programming concepts more
      accessible.
    mechanism: Interactive shader programming allows learners to modify code and instantly
      observe visual changes, bridging the gap between abstract programming concepts
      and concrete visual outcomes.
    boundary: Applies to educational contexts where real-time feedback enhances learning
      of programming concepts. Fails when learners cannot access interactive environments
      or when the feedback system is not responsive.
  expected_classification:
    depth: specialized
- id: 711186a6c4650e70a8f4b42941fca284624fe708dd1998d5f8debe02fbb7b1a6
  input_fb:
    name: Metaphor As Qualitative Language Shift
    definition: Metaphor operates as a distinct qualitative mode of linguistic expression
      that transforms meaning through contextual embedding rather than quantitative
      intensification. It functions as a structural device that enables novel semantic
      extensions by transferring qualities from one domain to another.
    mechanism: Metaphor differs fundamentally from literal language and hyperbole
      in its qualitative nature. While literal language conveys direct meaning and
      hyperbole modifies meaning through degree, metaphor creates new meanings by
      placing terms in novel contexts that impose extension of meaning. This transformation
      occurs through the imaginative comparison or identification of dissimilar things,
      where qualities of one domain are ascribed to another.
    boundary: Applies when metaphor functions as a qualitative shift in linguistic
      usage rather than a quantitative intensification. Fails when metaphor is confused
      with hyperbole or when it operates purely as a stylistic device without semantic
      transformation.
  expected_classification:
    depth: cross-domain
- id: 3f6f428dba9acc593f57148988227d017c1740ba5b70cea89088fcb922a58e08
  input_fb:
    name: Primordial Serpent Archetype
    definition: The serpent as a mythological symbol represents the primordial unity
      that contains all opposing principles within itself, embodying both creation
      and destruction, union and division, in a single eternal cycle. This archetype
      manifests as the self-contained, self-generating, and self-consuming force that
      underlies all cosmic and biological processes.
    mechanism: 'The serpent symbolizes the paradoxical unity of opposites in a closed
      loop: it is simultaneously the source and end of all existence, the creator
      and destroyer, the active and passive, the male and female. It represents the
      fundamental principle of cyclical emergence and dissolution, where the very
      act of containing duality enables the dynamic interplay between opposing forces
      that generates all phenomena.'
    boundary: Applies when a mythological or symbolic figure embodies the paradox
      of unity and opposition in a self-contained, cyclical structure. Fails when
      the symbol represents linear progression, external conflict, or a simple opposition
      without internal unity or cyclical return.
  expected_classification:
    depth: cross-domain
- id: e3fa205adf16f4d97d3b8ef88af5ef928740ed06665a88b5531b374cb810150c
  input_fb:
    name: Fear As Bio-political Technology
    definition: Fear functions as a bio-political technology that creates permanent
      states of insecurity and manipulates individuals into accepting control through
      perceived threats to human capital and disaster identification.
    mechanism: Fear operates as a control mechanism by creating (in)security that
      makes individuals susceptible to bio-political manipulation, using surveillance,
      statistical prediction, and body-specific disaster identification to maintain
      social control.
    boundary: Applies when fear is systematically deployed as a tool of bio-political
      governance rather than individual emotional response. Fails when fear operates
      purely as personal psychological reaction without institutional manipulation.
  expected_classification:
    depth: cross-domain
- id: f49f8336e5ba523a086291a489fac4c3e5c0695d9e123d66f0986f1fe235be51
  input_fb:
    name: Abductive Reasoning in Scientific Discovery
    definition: A form of reasoning where the most plausible explanation is selected
      based on plausibility rather than logical necessity, particularly in scientific
      contexts where evidence alone may not determine conclusions.
    mechanism: Scientists select explanations based on their plausibility and potential
      for further investigation rather than strict logical derivation from experimental
      data, allowing for creative and intuitive leaps in scientific reasoning.
    boundary: Applies when scientific conclusions cannot be logically derived from
      evidence alone and require selection among plausible explanations. Fails when
      conclusions can be strictly logically derived or when plausibility is not a
      factor in decision-making.
  expected_classification:
    depth: cross-domain
- id: 422c71dc22bc368898ec7452dda7d228bddc53bbef31f901acc65129e54b4209
  input_fb:
    name: System 1 and System 2 Thinking
    definition: 'A conceptual framework distinguishing two modes of thinking: System
      1 (fast, automatic, intuitive) and System 2 (slow, deliberate, effortful) as
      demonstrated by the mental computation process described.'
    mechanism: System 1 retrieves automatic cognitive programs learned in school,
      while System 2 engages in deliberate, effortful computation requiring mental
      effort, memory tracking, and physical physiological responses to execute multiplication
      problems.
    boundary: Applies to cognitive processes involving automatic versus controlled
      thinking. Fails to describe the specific mechanisms of how System 1 and System
      2 interact in complex decision-making beyond this example.
  expected_classification:
    depth: cross-domain
- id: ed8d6de466f523b9cea49ee0cc6e9b4996dccf70a46e9acb666d77c50c88e7dd
  input_fb:
    name: City Hall Physical Design and Political Alienation
    definition: The physical structure and design of city hall buildings and government
      centers creates barriers to meaningful citizen participation and undermines
      local community governance, leading to political alienation.
    mechanism: The physical presence of city hall creates a psychological and practical
      distance between citizens and their government, making government appear distant
      and inaccessible. This physical separation, combined with bureaucratic red tape
      and institutional mentality, prevents genuine community engagement and creates
      alienating experiences for citizens.
    boundary: Applies to urban government structures where physical design creates
      barriers to citizen participation. Fails when government is physically accessible
      and citizen engagement is genuinely facilitated.
  expected_classification:
    depth: cross-domain
- id: 8a07e2a39495b794c1ce43f70e4de46354bb63c491a6cb3330cb55457cb2ebcb
  input_fb:
    name: Simplicity As Rational Strategy
    definition: In complex environments with high uncertainty, simple heuristics or
      rules of thumb can be more rational and effective than complex optimization
      models. This principle describes a counterintuitive finding where simplicity
      is not a sign of irrationality but a strategic choice that outperforms more
      elaborate approaches.
    mechanism: 'This is a normative heuristic: in environments with high complexity
      and limited information, applying simple rules or heuristics reduces cognitive
      load and improves decision-making outcomes. The principle prescribes a practical
      approach rather than describing a causal chain. Simplicity enables faster decisions,
      reduces error propagation, and avoids overfitting to noise in the data or environment.'
    boundary: 'Applies when: (1) decision-making involves high uncertainty or complexity,
      (2) there is limited time or information to process, (3) the cost of over-optimization
      exceeds the benefit of marginal gains. Fails when: (1) the environment is stable
      and predictable, (2) there is sufficient data and computational power to support
      complex models, (3) the cost of simplicity is higher than the cost of complexity
      (e.g., in high-stakes medical diagnosis).'
  expected_classification:
    depth: cross-domain
- id: 0dfad7493d5d790432cfc892eca4dd7fef1d2cf90593530d0512375f12c98fee
  input_fb:
    name: Ai Data Poisoning Via Hidden Instructions
    definition: A security vulnerability where AI systems can be manipulated by embedding
      malicious commands in data they process, causing the AI to execute unintended
      actions that override its original programming.
    mechanism: The AI system processes all input data without distinguishing between
      legitimate instructions and hidden malicious commands embedded in documents
      or data streams, leading to execution of override commands that change its behavior.
    boundary: Applies when AI systems process untrusted data containing embedded instructions
      that are not clearly distinguishable from normal content. Fails when the AI
      has robust data validation or when the malicious instructions are clearly marked
      or filtered.
  expected_classification:
    depth: specialized
- id: ed15d84a1b6eb8c4dbe4a9384059ef159d17f5a6e8c59744adeeb017b2f6f671
  input_fb:
    name: Camouflage in Nature and Battle
    definition: A principle describing how natural camouflage mechanisms provide survival
      advantages by making organisms difficult to detect through visual blending with
      their environment.
    mechanism: Animals use coloration patterns like dark backs and light bellies to
      blend with their environment from different viewing angles, and bottom-dwelling
      fish use patterned coloring to match their sea bed habitat, making them harder
      to detect from above or below.
    boundary: Applies to organisms that rely on visual detection for survival. Fails
      when predators have enhanced visual capabilities or when camouflage is not needed
      due to other protective mechanisms.
  expected_classification:
    depth: cross-domain
- id: 1bc43a88d9dd651b7571877572b6bce98a50a06d13d4e5e1734a47dbccb49774
  input_fb:
    name: Psycholinguistic Semiotics
    definition: The intersection of psycholinguistics and semiotics examines how linguistic
      signs function within human psychological and social contexts, particularly
      in relation to speech perception, production, and the cognitive processing of
      meaning. This field bridges the study of language as a psychological phenomenon
      with semiotic analysis of signs and symbols.
    mechanism: Psycholinguistic semiotics operates as a descriptive model that categorizes
      the relationship between linguistic signs and psychological processes. It analyzes
      how speech errors, perception of spaces, and cultural phenomena influence the
      interpretation and production of language. The model recognizes that human communication
      involves both cognitive mechanisms (memory, intelligence) and semiotic systems
      (signs, symbols) that interact in complex ways.
    boundary: Applies when studying human language use in psychological and social
      contexts where linguistic signs interact with cognitive processes. Fails when
      analyzing purely mechanical or non-human communication systems, or when focusing
      exclusively on linguistic structure without psychological or semiotic dimensions.
  expected_classification:
    depth: cross-domain
- id: 03267af333800319ecd53e60d17af1ba8843224fc7e517fa38082e42ae82bb7e
  input_fb:
    name: Chasm-driven Ideavirus Strategy
    definition: A marketing approach that recognizes the fundamental difference between
      pre-chasm and post-chasm market segments, requiring companies to focus on early
      adopters who will promote the idea while avoiding the trap of designing for
      pre-chasm preferences.
    mechanism: The strategy involves identifying and leveraging pre-chasm sneezers
      (early adopters who are willing to promote new ideas) while avoiding the mistake
      of designing products for pre-chasm preferences that are too focused on novelty
      rather than practical utility. Companies must understand that pre-chasm audiences
      want 'cool' things, while post-chasm audiences want 'useful' things, and the
      challenge is to move from the former to the latter without losing the initial
      momentum.
    boundary: Applies when companies can distinguish between pre-chasm and post-chasm
      market segments and understand their different needs. Fails when companies don't
      understand the fundamental differences between these market segments or when
      they try to satisfy both segments simultaneously.
  expected_classification:
    depth: domain
- id: 2eb4ce4fd490cf9386478a73b1da83a136d12b6e1e76069dcb85479c1367fd06
  input_fb:
    name: Cross-domain Conceptual Transfer
    definition: Effective problem-solving requires transferring core concepts from
      one domain to another, particularly when the target domain has limited available
      frameworks. This principle describes how broad intellectual patterns can be
      applied across different contexts to solve specific problems.
    mechanism: 'This is a practical heuristic for thinking: when facing a complex
      problem in one domain, identifying and applying fundamental principles from
      other domains can provide novel solutions. The mechanism works by recognizing
      that many problems share underlying structures or patterns, even when the surface
      details differ. The process involves abstracting key insights from established
      frameworks and mapping them to new situations where they can generate useful
      solutions.'
    boundary: 'Applies when: (1) a problem has limited conceptual frameworks in its
      own domain, (2) there are analogous structures in other domains, and (3) the
      transfer can be made without losing essential meaning. Fails when: (1) the domains
      are completely unrelated with no shared structure, (2) the transfer requires
      oversimplification that distorts the original principle, or (3) the target domain
      has sufficient internal frameworks to solve the problem without external input.'
  expected_classification:
    depth: cross-domain
- id: ee6ab5ea197bdb7509e98bee50b5287dcf365fc8d3b17dd26b0aa4f804d14225
  input_fb:
    name: Expanded Circus Education and Innovation
    definition: The growth of circus education has led to increased creativity and
      innovation in circus arts, with expanded venues and cross-disciplinary influences
      driving artistic development.
    mechanism: The expansion of circus education creates more opportunities for artists
      to learn and experiment, while state-sponsored collaboration with artists from
      other disciplines introduces fresh perspectives and techniques that enhance
      traditional circus elements.
    boundary: Applies when circus education expands beyond traditional boundaries
      and includes cross-disciplinary collaboration. Fails when education remains
      confined to traditional circus methods without external influence.
  expected_classification:
    depth: cross-domain
- id: 996dd3342fe444ca5ce3b3f8edc38f1e80a199a9689afbf538e66a5cb43fc16a
  input_fb:
    name: Epicurean Retreat Vs. Social Responsibility
    definition: The philosophical tension between the Epicurean ideal of withdrawal
      from public life and the Stoic critique that such withdrawal undermines civic
      duty and social responsibility.
    mechanism: Epicureans sought to escape societal pressures by retreating to private
      communities where they could live in obscurity and avoid public service, but
      this created a paradox where their withdrawal from society was seen as subversive
      and destructive to the state and family structure.
    boundary: Applies to philosophical schools that advocate withdrawal from public
      life versus those that emphasize civic duty. Fails when the philosophical framework
      doesn't account for the tension between personal autonomy and social obligation.
  expected_classification:
    depth: cross-domain
- id: 4ddc4deb701ca37d4581ffe0f0ec6c42effa567ea77155a1df68c117fc4e66f1
  input_fb:
    name: Resistance to Technological Change
    definition: A historical pattern where societies and institutions consistently
      resist new technologies due to perceived threats to established livelihoods,
      power structures, and traditional ways of life.
    mechanism: Societies and institutions resist new technologies through organized
      opposition, legal restrictions, and violent suppression when peaceful measures
      fail, driven by fear of economic disruption and loss of traditional power.
    boundary: Applies to historical instances of technological resistance across different
      societies and time periods. Fails when societies embrace new technologies without
      significant resistance or when resistance is overcome by technological inevitability.
  expected_classification:
    depth: cross-domain
- id: ebf84c45fd8992f7984d919c0e0d2605ac5abb2fd69a91bc424357554d9526a4
  input_fb:
    name: Adaptive System Evolution
    definition: Complex systems continuously evolve through iterative cycles of bottleneck
      identification, adjustment, and reconfiguration. The system adapts to changing
      conditions by modifying its structure and processes in response to constraints
      and feedback.
    mechanism: This is an empirical pattern describing how complex systems naturally
      progress through phases of constraint and adaptation. Systems encounter bottlenecks
      that force structural or operational changes, which then lead to readjustment
      of the entire system. The process is cyclical and ongoing, with each resolution
      creating new challenges and opportunities for further evolution.
    boundary: Applies to systems where feedback loops and constraint-based adaptation
      are observable. Fails when systems are static, unchanging, or lack meaningful
      feedback mechanisms that drive adjustment.
  expected_classification:
    depth: cross-domain
- id: 269c25c9894b61dbe6d33888815b5b40a8418bb5fede606e107578459eb6355c
  input_fb:
    name: Randomness in Search and Chaos Control
    definition: Randomness can outperform systematic search methods and stabilize
      chaotic systems through the addition of random low-intensity perturbations.
    mechanism: Random search methods like random drilling can surpass traditional
      search approaches, and chaotic systems can be stabilized by introducing random
      perturbations rather than removing chaos, as demonstrated by the ball-jumping
      experiment where steady vibrations created chaotic motion that became orderly
      when random shocks were added.
    boundary: Applies to search problems where randomness can outperform systematic
      methods and to chaotic systems that can be stabilized through random perturbations.
      Fails when the system is not chaotic or when the random perturbations are too
      strong or inconsistent.
  expected_classification:
    depth: cross-domain
- id: 9dc10193aad1aac264d8d2e744c272e00c7d9d148e3e3511865c91beaecfdafc
  input_fb:
    name: Golden Mean in Design
    definition: The Golden Mean ratio is a mathematical relationship that appears
      in nature and monumental designs, and is incorporated by enlightened designers
      to create harmony in their work.
    mechanism: The Golden Mean ratio provides specific proportions that naturally
      create visual harmony and balance, connecting designers with universal principles
      that resonate across cultures and time periods.
    boundary: Applies to designers who understand and consciously incorporate mathematical
      relationships in their work. Fails when designers ignore mathematical proportions
      and rely solely on modern chaotic approaches.
  expected_classification:
    depth: universal
- id: 7e71f2e6883a5faff417f494977e09e41c31a0e3619f1128440d52c1629d13a7
  input_fb:
    name: Movement Empowerment Strategy
    definition: A strategic approach where a small organization empowers grassroots
      communities to amplify their message and build collective action by facilitating
      easy connection and communication channels.
    mechanism: The strategy works by providing accessible communication platforms
      and connection points that allow individuals to easily engage with and spread
      the movement's message, creating a network effect that amplifies the original
      message beyond the organization's direct reach.
    boundary: Applies when a small organization seeks to scale influence beyond its
      direct capacity. Fails when the organization lacks the technical capability
      or resources to provide the necessary communication infrastructure.
  expected_classification:
    depth: cross-domain
- id: 085f2b640cb378e9f7a190ed6c2d1decd5ff2c9b327f6d73d9c4c933a1c5ac70
  input_fb:
    name: Eye Home Baseline Method
    definition: A technique for identifying a person's default eye gaze pattern when
      accessing memories, used to establish a behavioral baseline for detecting inconsistencies
      in their responses.
    mechanism: When people access memories or recall information, they typically gaze
      in a consistent direction (often three o'clock position) which serves as their
      'Eye Home'. This pattern can be observed during conversation and used to detect
      when someone's behavior deviates from their normal baseline.
    boundary: Applies when observing people's eye movements during conversation and
      information recall. Fails when people don't follow typical eye gaze patterns
      or when the observer cannot accurately detect eye movements due to poor lighting
      or other factors.
  expected_classification:
    depth: specialized
- id: 4d6520c68777d7c957cea3cdb925593c25bbaa46e3665a022ab3182d5abd98c1
  input_fb:
    name: Organizational Complexity Management
    definition: 'Managing complexity in physical and conceptual domains requires addressing
      two interrelated challenges: selection (what to keep or hide) and arrangement
      (how to organize). This principle describes a universal pattern of complexity
      reduction through systematic categorization and storage strategies.'
    mechanism: 'This is a practical heuristic for managing complexity: when faced
      with accumulation of items or information, effective organization involves first
      identifying what to retain or conceal, then systematically arranging the remaining
      elements. The process works through three primary approaches: expanding storage
      capacity (bigger house), storing non-essentials (storage), or implementing systematic
      organization (arrangement). These strategies address the dual problems of selection
      and arrangement that arise when complexity accumulates.'
    boundary: Applies when complexity arises from accumulation of physical items or
      conceptual elements that require management. Fails when the complexity stems
      from fundamental process design or systemic interdependencies rather than simple
      accumulation. Also fails for problems where the solution requires fundamental
      restructuring rather than simple organization.
  expected_classification:
    depth: universal
- id: 2d5132468a1cdf215ecb67479c0fd2b225eab7618c484017fd79e3d6d734c1f0
  input_fb:
    name: Pragmatic Intelligence and Rule Application
    definition: A model of intelligence that transcends mechanistic rule-following,
      emphasizing planning, prediction, and personal responsibility in decision-making
      rather than rigid application of predetermined rules.
    mechanism: Intelligent actors plan ahead and make decisions based on predictions
      and priorities, assessing situations and taking responsibility for their choices
      rather than simply applying rules. This involves self-awareness and reflexivity
      in decision-making processes.
    boundary: Applies to competent practitioners who can transcend rule-based approaches.
      Fails when decision-making is purely mechanistic or when actors cannot exercise
      judgment and planning.
  expected_classification:
    depth: cross-domain
- id: 9bbf2cabb0f59757e49e2c8f45983dfba983908b5c5730f249cb1db22d409bb3
  input_fb:
    name: False Positive and False Negative Cost Trade-offs in
    definition: A principle describing how the relative costs of false positive (FP)
      and false negative (FN) errors in predictive systems must be weighed to inform
      decision-making, particularly in contexts like public health and criminal justice
      where both types of errors carry significant consequences.
    mechanism: In predictive systems, FPs and FNs each carry distinct costs that must
      be explicitly compared to guide policy and model design. For example, in public
      health, a FP might cause unnecessary quarantine disruption while a FN might
      miss a real case, and in criminal justice, a FP might keep an innocent person
      in prison longer while a FN might release someone who will reoffend.
    boundary: Applies to any predictive system where both FP and FN errors have quantifiable
      consequences. Fails when the costs of both error types are assumed to be equal
      or when no meaningful cost comparison can be made.
  expected_classification:
    depth: cross-domain
- id: 1bf8fda07f7a237c65415cdbc300e1dbdefc871534bd77adfb86d8a6a4a1ee16
  input_fb:
    name: Generalized Uncertainty Principle
    definition: A fundamental law of systems thinking that complex systems exhibit
      unexpected behavior, distinguishing between passive observation of system failure
      and active recognition of this principle.
    mechanism: Complex systems generate outcomes that differ from expectations due
      to the interconnections and feedback loops within the system, creating emergent
      properties that cannot be predicted from individual components alone.
    boundary: Applies to all complex systems where multiple variables interact in
      non-linear ways. Fails when applied to simple linear systems or systems with
      no feedback loops.
  expected_classification:
    depth: universal
- id: 9077d0a0c1703a099d3eae87690c3f6dd2bf79f5c9d579e73384ef38588e7941
  input_fb:
    name: Nonlinear Predictive Fragility
    definition: Predictive models of complex systems are fundamentally limited by
      nonlinear dynamics that make long-term forecasting unreliable, even when short-term
      behavior appears deterministic. The principle describes how small changes in
      initial conditions can lead to exponentially divergent outcomes, making precise
      prediction impossible in systems with sensitive dependence on inputs.
    mechanism: "Nonlinear systems exhibit sensitive dependence on initial conditions,\
      \ where tiny differences in starting points lead to dramatically different trajectories\
      \ over time. This phenomenon, known as the 'butterfly effect,' means that even\
      \ perfect models of a system's rules cannot predict future states with certainty\
      \ beyond a certain time horizon. The mathematical foundation for this is Poincar\xE9\
      's analysis in situ and the broader field of topology, which demonstrates that\
      \ complex systems cannot be fully understood through linear reasoning or deterministic\
      \ models."
    boundary: Applies to systems with sensitive dependence on initial conditions and
      nonlinear feedback loops, such as weather patterns, economic markets, and social
      movements. Fails for linear systems where small changes produce proportionally
      small effects, or for systems with stable equilibrium points where trajectories
      converge rather than diverge.
  expected_classification:
    depth: cross-domain
- id: 14c2d22ace88a00af121b1973ad4bb890607e78ef145a1ddb013c994f0ab9260
  input_fb:
    name: Strategic Design As Collective Behavior Intervention
    definition: A strategic approach to problem-solving that addresses complex, ill-defined,
      or interconnected problems by considering how individual actions and behaviors
      combine to affect collective change on a larger scale.
    mechanism: Strategic design operates as a means to understand and influence the
      emergent effects of individual behaviors when aggregated at scale, enabling
      innovative solutions to problems that exist across multiple domains or systems.
    boundary: Applies to complex problems requiring systemic approaches rather than
      narrow siloed solutions. Fails when the problem is purely technical or when
      individual actions do not meaningfully aggregate to collective impact.
  expected_classification:
    depth: cross-domain
- id: 0c6c72eabac220553791327fa5187b274ecabaeda20628ac012eb92c18eed3c6
  input_fb:
    name: Convolutional Neural Network for Gesture Recognition
    definition: A machine learning approach using convolutional neural networks to
      classify complex time-series sensor data into specific gesture categories.
    mechanism: CNNs process sequences of 128 three-axis accelerometer readings representing
      five seconds of motion data, analyzing temporal relationships between adjacent
      values to distinguish between different gestures and unknown movements.
    boundary: Applies to time-series sensor data analysis where adjacent data points
      contain meaningful information about motion patterns. Fails when the temporal
      relationships in the data are not informative or when the gesture classification
      task is too complex for the model architecture.
  expected_classification:
    depth: specialized
- id: 08bfbad853c06ea3037fa02e912eff36358f8a1d496fd4ad097c3a858c5a6296
  input_fb:
    name: Resource Decoupling From Economic Growth
    definition: A pattern where resource consumption decreases while economic growth
      and population increase, driven by technological efficiency and economic incentives.
    mechanism: Companies adopt resource-efficient technologies to reduce costs, as
      materials have monetary value and cost-saving opportunities drive adoption.
      This creates a 'more with less' dynamic where economic growth and population
      expansion occur alongside reduced resource use.
    boundary: Applies to cases where economic growth and population increase while
      resource use decreases. Fails when resource use increases despite economic growth
      or population decline.
  expected_classification:
    depth: cross-domain
- id: fc152b48878fbf3379807eb9d465912f9487031ed1ba56a2ae1388616f2427bc
  input_fb:
    name: Context Awareness Pervasion
    definition: Context awareness technologies evolve from experimental user-centered
      services into pervasive tracking systems that fundamentally alter individual
      privacy and data ownership. The principle describes how initially benign technological
      capabilities expand into comprehensive surveillance mechanisms.
    mechanism: This is an empirical pattern describing the trajectory of context awareness
      technologies. The passages document how location tracking and context-aware
      systems transition from potential user benefits (guided tours, city navigation)
      to widespread surveillance and data monetization. The pattern shows a consistent
      progression from experimental to commercial to pervasive deployment without
      clear boundaries on scope or purpose.
    boundary: Applies when context awareness technologies evolve from experimental
      or user-centered applications to commercial or surveillance uses. Fails when
      context awareness remains purely experimental or is limited to explicit user
      consent and control.
  expected_classification:
    depth: cross-domain
- id: aff51906791b6a28bf5e3934b393fb6cbb22233e9ef3264529c8becfd790ddac
  input_fb:
    name: Systems Thinking Framework
    definition: Systems thinking encompasses both hard and soft approaches to problem-solving,
      with hard systems thinking focusing on defined ends and efficient means, while
      soft systems methodology addresses ambiguous problems through stakeholder collaboration.
      The framework recognizes that systems can be understood at multiple levels of
      complexity and that effective theory development requires integration of tools
      like mathematics and computation rather than treating them as substitutes.
    mechanism: This is a descriptive model that categorizes systems thinking approaches
      based on their assumptions and objectives. Hard systems thinking assumes problems
      have known, definable ends and seeks efficient means to achieve them, often
      using systems engineering methods. Soft systems methodology addresses problems
      where the end is unclear or contested, emphasizing stakeholder engagement and
      collaborative problem definition. The model also acknowledges that systems can
      emerge from smaller functioning units and that theory development benefits from
      combining mathematical and computational tools.
    boundary: Applies to problem-solving contexts where systems can be analyzed at
      multiple levels of complexity and where either defined goals or ambiguous problems
      require different methodological approaches. Fails when the distinction between
      hard and soft systems is not relevant, such as in purely technical problems
      where all aspects are well-defined or in purely social problems where stakeholder
      engagement is not possible.
  expected_classification:
    depth: cross-domain
- id: b86b825d69727f1bc5642eb850956b31a7342c4c09cf748a88df3eb9164bddc5
  input_fb:
    name: Ai Integration in Security Operations
    definition: The application of artificial intelligence systems to security processes,
      including automated threat detection, root cause analysis, and workflow optimization
      to handle the volume of security alerts.
    mechanism: AI systems process security alerts and inputs faster than human analysts,
      filtering and prioritizing threats to funnel only those requiring human intervention,
      while automating routine security tasks.
    boundary: Applies to security operations where AI can be trained to handle specific
      threat categories and integrate with existing security toolchains. Fails when
      AI models are not properly trained or when security requirements exceed AI capabilities.
  expected_classification:
    depth: cross-domain
- id: 0144f0dc7d420a01f382e09be1ba4a0e0336f64193190ef194879f5c3b400cbf
  input_fb:
    name: Personal Selling As Marketing Strategy
    definition: A marketing approach that emphasizes direct personal communication
      to build relationships and close sales, particularly effective for complex or
      high-value products.
    mechanism: Personal selling involves direct interaction between sales representatives
      and customers to customize communications, address specific needs, and build
      trust that enables successful transaction closure.
    boundary: Applies when personal relationship building and customization are required
      for sales success. Fails when mass communication channels can adequately address
      customer needs or when personal selling costs exceed benefits.
  expected_classification:
    depth: domain
- id: 04ca67b903ab84d8509d45f9252f3bd5fcd11381a265008a1fe7db396334ccd1
  input_fb:
    name: Mythic Hero Code Recycle
    definition: The mythic hero code is a recurring narrative template that transcends
      cultural and temporal boundaries, characterized by archetypal elements such
      as divine origin, superhuman abilities, a tragic flaw, and a mission to help
      the weak. Contemporary media reuses and adapts these ancient codes to create
      modern heroes.
    mechanism: "The mythic hero code operates as a cultural memory structure that\
      \ persists across generations and media forms. When new heroes are created,\
      \ they inherit and repackage the essential elements of the ancient mythic template\u2014\
      such as the hero's journey, the presence of a divine or alien origin, superhuman\
      \ powers, a fatal weakness, and a moral mission. These elements are not invented\
      \ but drawn from a shared cultural repository of archetypal narratives."
    boundary: Applies when a narrative or character adopts the structural elements
      of the mythic hero code, including origin from another world, superhuman abilities,
      a tragic flaw, and a mission to aid others. Fails when a character or narrative
      is entirely original without any reference to or reuse of mythic archetypes
      or when the narrative is explicitly anti-archetypal or deconstructs the hero
      myth.
  expected_classification:
    depth: cross-domain
- id: 5eb270f5b41e87c9172da4031e177910db2a3fb1ad2a6051a95700bbaa73155f
  input_fb:
    name: Strategic Alignment and Organizational Impact Loop
    definition: A feedback mechanism where customer advocacy, partner enthusiasm,
      and shareholder support create conditions for organizational improvements that
      drive strategic innovation and operational excellence.
    mechanism: Customer satisfaction and advocacy create positive feedback loops that
      attract strategic partners and provide leadership with greater operational flexibility,
      which then enables faster innovation cycles, stronger customer relationships,
      and improved efficiency through optimized processes.
    boundary: Applies when organizational improvements are driven by external validation
      and stakeholder support rather than internal directives. Fails when improvements
      are driven by top-down mandates rather than organic stakeholder alignment.
  expected_classification:
    depth: cross-domain
- id: 00984ab087ddcf6039535519a5a52d03932851563224e2d3ef6ed4f1d711598c
  input_fb:
    name: Entitlement Bias in Behavioral Economics
    definition: People experience a psychological sense of entitlement after engaging
      in virtuous or effortful behaviors, which leads them to justify or consume less
      virtuous alternatives. This creates a pattern where self-improvement actions
      are followed by indulgences that feel morally justified.
    mechanism: This is an empirical pattern of behavioral inconsistency, not a verified
      causal mechanism. The psychological phenomenon manifests as a cognitive bias
      where individuals rationalize subsequent behaviors as 'compensatory' or 'balanced'
      after demonstrating self-discipline or prosocial actions. The entitlement feeling
      arises from internalized moral credit, where one's prior good deeds are perceived
      as justification for later deviations from that standard.
    boundary: Applies when individuals have engaged in a virtuous or effortful behavior
      that creates a sense of moral credit. Fails when the behavior is not perceived
      as personally meaningful or when individuals lack the psychological capacity
      to internalize moral credit (e.g., those with low empathy or high impulsivity).
      Also fails in contexts where the behavior is not socially or personally recognized
      as virtuous.
  expected_classification:
    depth: domain
- id: ff2c5f56101c122df40b218ac8328a17ab7dbdfde07ad40d09b1c4022ac2e505
  input_fb:
    name: Home As Semiotic Self-space
    definition: The home functions as a semiotic extension of the self, reflecting
      personal identity and cultural experience through its design and construction,
      with different cultural contexts producing distinct home forms.
    mechanism: Homes serve as protective spaces that extend the body's armor and function
      as images of the self, with design reflecting cultural experiences and social
      structures, from simple tribal dwellings to complex palace compounds.
    boundary: Applies to the semiotic relationship between personal identity and domestic
      space in various cultural contexts. Fails when homes do not reflect personal
      or cultural identity or when the relationship between space and identity is
      not semiotically meaningful.
  expected_classification:
    depth: cross-domain
- id: 810a71d3333dee10beaf8e9cf16994cd27cf354fa7031bd72dbbd58fd555c2bf
  input_fb:
    name: Inverse Turkey Problem
    definition: A statistical phenomenon where evidence of absence is not absence
      of evidence, with the unseen containing either good news (in antifragile systems)
      or bad news (in fragile systems) depending on the asymmetry of outcomes.
    mechanism: In antifragile systems, positive rare events (Black Swans) are absent
      from past data because they occur infrequently and are not captured in samples,
      leading to underestimation of long-term benefits. In fragile systems, negative
      rare events are also absent from past data, leading to underestimation of long-term
      risks.
    boundary: Applies to systems with asymmetric outcomes where rare events dominate
      the distribution. Fails when all relevant events are captured in the sample
      or when the system is not subject to rare event influence.
  expected_classification:
    depth: cross-domain
- id: 703c675e7cff8c024481df5cef90122a45c76116ba406a7b7e6e49ae56daa08e
  input_fb:
    name: Analogous Observation Method
    definition: A cross-domain observation technique where teams study how other industries
      solve similar problems of error reduction in high-stakes environments. The method
      involves direct observation of practices from unrelated fields to generate novel
      insights for the target domain.
    mechanism: 'This is a practical heuristic for problem-solving: observing how other
      industries handle critical error prevention provides fresh perspectives that
      overcome domain-specific mental models. The technique works by leveraging the
      principle that similar challenges often require similar solutions, even when
      the contexts differ. The flight school example demonstrates how one industry''s
      approach to error prevention can illuminate blind spots in another''s practices.'
    boundary: Applies when teams face complex error reduction problems in high-risk
      environments where traditional approaches have failed. Fails when the source
      industry has no meaningful parallels to the target domain's constraints, or
      when the observation is too superficial to reveal actionable insights.
  expected_classification:
    depth: cross-domain
- id: 000e035798b39c4d4ada638aef410061175cfe7b7c6eb37e50ae2024d5d50724
  input_fb:
    name: Status-driven Narrative Structure
    definition: A narrative framework where status dynamics drive character motivation
      and plot progression, particularly in moments of high social stakes such as
      weddings or ceremonies. The principle describes how status hierarchies create
      tension and agency in storytelling.
    mechanism: This is a descriptive model of narrative structure, not a causal mechanism.
      The principle identifies a pattern in how status relationships function as narrative
      drivers in dramatic storytelling, particularly in scenes where traditional hierarchies
      are tested or challenged. The structure organizes character motivations around
      social positioning and the risks associated with challenging or maintaining
      status.
    boundary: Applies to dramatic narratives where social hierarchy and status are
      central themes, particularly in scenes of ritualized social occasions like weddings
      or ceremonies. Fails when status is not a primary motivator or when the narrative
      focuses on individual character development rather than social positioning.
  expected_classification:
    depth: domain
- id: a8c0f155f2d5e7ffee2dade26f946c36b572088d4ec5a3cc2a1632434d3b9a23
  input_fb:
    name: Renewed Materialism in Design Practice
    definition: A generative approach to design that integrates living materials,
      dynamic processes, and adaptive technologies to create transformative material
      practices.
    mechanism: Contemporary designers use new materials and technologies to blur the
      boundaries between living and non-living matter, combining growing materials
      with digital fabrication methods to create adaptive and responsive design solutions.
    boundary: Applies to design practices that integrate living materials with digital
      technologies. Fails when the same methods are used without the integration of
      living materials or adaptive technologies.
  expected_classification:
    depth: cross-domain
- id: 30da7b70bd2de9c424d74b6a9777455d3a95444d4b5197db47d7d2a0ea044808
  input_fb:
    name: Tech-enabled Military Sustainment
    definition: Military operations increasingly rely on advanced technology integration
      to maintain operational effectiveness, including satellite communications, AI-driven
      intelligence, and real-time data fusion from multiple sources. This approach
      enables rapid adaptation to battlefield conditions and enhances decision-making
      capabilities through automated systems and distributed information networks.
    mechanism: Technology integration in military operations creates a feedback loop
      where real-time data from sensors, satellites, and ground units is processed
      through AI systems to generate actionable intelligence. This intelligence is
      then distributed to field units and command centers, enabling faster response
      times and more informed strategic decisions. The system operates through cloud-native
      infrastructure that supports secure, scalable information flow across all levels
      of the military hierarchy.
    boundary: Applies when military operations involve advanced technological infrastructure
      and real-time data processing capabilities. Fails when operations depend entirely
      on traditional methods without digital integration or when information systems
      are compromised by cyber attacks.
  expected_classification:
    depth: cross-domain
- id: 65d4d0bd923e8b2d183fa1b693fd876f99d8092d190b3e84fe5f3bebe3de7cf0
  input_fb:
    name: Media As Environmental Extensions
    definition: Media function as extensions of human senses and capabilities, fundamentally
      altering the environment in which humans operate and reshaping societal structures.
      The principle describes how media technologies amplify or replace human faculties,
      creating new forms of environmental interaction and social organization.
    mechanism: Media technologies extend human sensory and cognitive capacities, effectively
      becoming new organs of perception and action. When a medium is adopted, it reshapes
      the environment by altering the relationship between human actors and their
      surroundings. This extension is not merely functional but transformative, as
      it changes the way humans process information, communicate, and organize society.
      The transformation occurs through the medium's unique qualities and the new
      patterns of interaction it enables.
    boundary: Applies when media technologies fundamentally alter human perception
      or capability, creating new environmental conditions. Fails when media are merely
      tools for existing functions or when they do not change the broader environmental
      context in which humans operate.
  expected_classification:
    depth: cross-domain
- id: a994461b4df51bfc82cdc87f32cb1f80352c6542c8417eb75bb5c16b029a78a5
  input_fb:
    name: Alchemical Method of Concept Development
    definition: A creative and exploratory approach to concept development that combines
      methodical investigation with experimental risk-taking and broad inquiry.
    mechanism: The process involves examining and questioning everything about an
      idea, trying various approaches, testing concepts thoroughly, and risking everything
      to understand the true essence of the concept, similar to how medieval alchemists
      tested substances through extreme methods.
    boundary: Applies to concept development where thorough exploration and testing
      is required. Fails when the approach is too rigid or when insufficient risk-taking
      occurs in concept testing.
  expected_classification:
    depth: cross-domain
- id: 881759b2c3c2f6cf36ec5c1a6a146b0a6ee242079dc222f128988cd94c3357f8
  input_fb:
    name: Cyclic Development Process
    definition: A developmental framework where spiritual and cosmic processes unfold
      in cyclical phases, with specific roles for masculine and feminine elements
      at different stages.
    mechanism: The process moves through distinct phases where the feminine (Shakti)
      initially predominates, then transitions to a gateway role for spiritual freedom,
      with the masculine element maintaining awareness and avoiding dissolution into
      the realm of becoming.
    boundary: Applies to spiritual and cosmic development frameworks that use cyclical
      symbolism. Fails when applied to linear development models or when the feminine-masculine
      dynamic is not central to the framework.
  expected_classification:
    depth: cross-domain
- id: cc56724487ff578251a0e04975871f658650d99aae43c3ea035b3638a7fcb1f7
  input_fb:
    name: Network Theory in Early Modern Maps
    definition: The conceptual framework linking maps, networks, and communication
      systems in early modern French thought, tracing the evolution from physical
      networks like veins to abstract systems of organization.
    mechanism: The theory connects physical networks (like the reticular body of veins)
      to abstract organizational systems (such as military fortification networks
      and communication systems), where the concept of exchange and organization becomes
      central to understanding how these systems function and relate to each other.
    boundary: Applies to the historical development of network thinking in French
      intellectual tradition from the 17th century onward. Fails when the historical
      context or conceptual development is not understood.
  expected_classification:
    depth: cross-domain
- id: 517616e7fa00c845ae577eda4fc5a624749659b3971b6e6c8bfda66da4dd0051
  input_fb:
    name: Human-future Interaction (hfi) Discipline
    definition: A proposed integration of futures thinking with human-computer interaction
      methods, focusing on effective and ethical communication of research, forecasts,
      and scenarios about trends and potential futures.
    mechanism: The discipline combines predictive futures analysis with HCI methodologies,
      using user testing and iterative prototyping to communicate future scenarios
      effectively to diverse audiences through various media formats.
    boundary: Applies to the integration of futures studies and experience design
      practices. Fails when the communication methods don't bridge the gap between
      predictive analysis and interactive design.
  expected_classification:
    depth: cross-domain
- id: 1024de335da70e210fa396c22efe0b2f51cbcac64a1e914b7cf7b5ab3b6c643e
  input_fb:
    name: Team Consensus in Modern Engineering
    definition: A collaborative approach in engineering where successful products
      emerge from cross-functional team consensus involving multiple disciplines and
      stakeholder groups.
    mechanism: Team consensus in modern engineering involves gathering diverse engineering
      members and stakeholders to collectively enhance innovative ideas, with successful
      products requiring consensus across multiple disciplines including engineering,
      research, marketing, management, production, services, and leadership.
    boundary: Applies to complex engineering projects requiring multidisciplinary
      collaboration. Fails when projects are isolated to single disciplines or when
      team dynamics prevent effective consensus building.
  expected_classification:
    depth: cross-domain
- id: 2228d1d828a9bec8d343f9c5e580d53d813c9751ed46e277d45adc47dcbc5435
  input_fb:
    name: Zaltman Metaphor Elicitation Technique (zmet)
    definition: A qualitative research method that uses visual imagery to uncover
      deeply held, often unconscious thoughts and feelings about a topic of interest.
    mechanism: Participants select pictures that represent their thoughts and feelings
      about a topic, allowing non-literal visual devices to reveal subconscious associations
      and emotional responses that words alone might not capture.
    boundary: Applies to qualitative research where participants struggle to express
      complex feelings in words. Fails when participants cannot engage with visual
      materials or when the research context doesn't support metaphorical thinking.
  expected_classification:
    depth: specialized
- id: a6606f3d1f7be1c42ede71000473eb5447eb96be6d7f60e775329c1e2d9b6fcb
  input_fb:
    name: Dna Representation in Scientific Literature
    definition: A method for representing DNA in scientific and literary contexts
      through abstraction and visualization techniques that make the complex molecular
      structure accessible to readers.
    mechanism: Scientific literature abstracts DNA from its physical reality through
      analogies, reframing, and visual metaphors, using layered textual approaches
      that combine historical, ontological, and narrative elements to create accessible
      representations of molecular complexity.
    boundary: Applies when scientific content needs to make DNA accessible to general
      audiences while maintaining scientific accuracy. Fails when the abstraction
      oversimplifies or misrepresents molecular biology.
  expected_classification:
    depth: cross-domain
- id: 02f0d0deef94619444ac4657b68219ebaf6c6cb34e5ff63c3c1a68d676fb2829
  input_fb:
    name: Graphic Design Aesthetic Evolution
    definition: A shift in graphic design aesthetics from corporate minimalism to
      hand-crafted and retro styles, reflecting changing cultural values and technological
      influences.
    mechanism: The evolution moves from standardized, universal corporate design toward
      personalized, expressive, and historically-inspired approaches, driven by digital
      platforms that enable sharing and revival of pre-digital techniques.
    boundary: Applies to the cultural and technological context of graphic design
      evolution in the digital age. Fails to capture the full spectrum of design movements
      or the persistence of corporate minimalism in some contexts.
  expected_classification:
    depth: domain
- id: 4876f30339efe37a23922f177daa22abe2e8f82e34716f2c2a2dc3bd15f8bbad
  input_fb:
    name: Power-law Heavy-tailed Distribution
    definition: "In many natural, social, and technological systems the distribution\
      \ of sizes, frequencies, or degrees is heavily skewed \u2014 a few extreme members\
      \ dominate while the vast majority are small. A power law describes this heavy\
      \ tail, in which the probability of an event falls off polynomially rather than\
      \ exponentially, so rare-but-extreme events are far more common than a bell\
      \ curve predicts."
    mechanism: "This is an empirical regularity, not a causal mechanism. A heavy tail\
      \ arises when small advantages compound or when units are not independent (rich-get-richer\
      \ attachment, scale-free growth), but the passages document the pattern itself\
      \ rather than isolate a single cause. The key epistemic point is that bell-curve\
      \ inference \u2014 which assumes thin tails and independence \u2014 systematically\
      \ underestimates the frequency and impact of extreme events in such systems."
    boundary: Applies to systems where elements interact or grow multiplicatively
      and are not independently sampled (networks, city sizes, wealth, word frequencies,
      earthquake magnitudes). Fails for genuinely independent, additive processes
      with a well-defined scale, where the central limit theorem yields a thin-tailed
      normal distribution.
  expected_classification:
    depth: universal
- id: f9e5bdaeeedaa1983270d95d927880e1b92e170d29466f97b95e360ea7d5c46a
  input_fb:
    name: Psychological Insight in Conflict Resolution
    definition: The principle that psychological understanding could improve dispute
      resolution outcomes, particularly in cases involving land claims and nuclear
      stakes where traditional approaches have failed.
    mechanism: The passage suggests that psychological insight could help resolve
      disputes more effectively by understanding human tendencies like authority-misinfluence
      and social-proof, which have historically led to catastrophic outcomes in negotiations
      and decision-making.
    boundary: Applies to situations where traditional dispute resolution methods have
      failed, particularly in high-stakes scenarios like nuclear conflicts or land
      disputes. Fails when psychological approaches are not properly implemented or
      when the underlying human tendencies remain unaddressed.
  expected_classification:
    depth: cross-domain
- id: 2b906126b251c9a9f66cd6db240011ec41d1b455f6f9186328a36da97b92f3d0
  input_fb:
    name: Temporal Perspective Principle
    definition: A conceptual framework that emphasizes the insignificance of individual
      human lives within the vast timescale of cosmic history, suggesting that human
      achievements and personal impact are ultimately negligible in the grand scheme
      of things.
    mechanism: The principle demonstrates that human history spans only a minuscule
      fraction of cosmic time, with individual lifetimes being mere flickers in the
      vast temporal landscape of existence.
    boundary: Applies to philosophical reflection on human significance and temporal
      scale. Fails to provide practical guidance for daily life decisions.
  expected_classification:
    depth: universal
- id: 0032e9e3c5811752613f50a47da072994129ef3d152642929fc6b4b59734d52b
  input_fb:
    name: Mental Process Simulation Through Code
    definition: Complex mental processes can be modeled and executed through computer
      programs written in structured programming languages. The principle describes
      how abstract cognitive functions can be translated into executable code that
      simulates human thinking patterns.
    mechanism: This is a descriptive model of how computational systems can replicate
      cognitive functions. Programming languages provide the syntax and structure
      necessary to encode mental processes as algorithms. The translation involves
      mapping conceptual operations (like analysis, understanding, and interaction)
      into code constructs that can be executed by machines. The model operates through
      the systematic encoding of cognitive steps into computational steps.
    boundary: Applies when cognitive processes can be broken down into discrete, algorithmic
      steps that can be represented in programming syntax. Fails when mental processes
      involve non-algorithmic elements like intuition, consciousness, or subjective
      experience that cannot be captured in structured code.
  expected_classification:
    depth: domain
- id: cd19be8e5cc9aea01e0b859fd113914e18a59287b0af508076d835d3fc6f0d38
  input_fb:
    name: Minimalist Design Through Universal Simplicity
    definition: Design that embraces simplicity and universality can effectively solve
      problems while maintaining broad appeal and adaptability across contexts. This
      approach prioritizes clean form and function over ornamental complexity, allowing
      users to project their own meaning and needs onto the design.
    mechanism: This is a descriptive model of design philosophy that categorizes approaches
      to minimalism. The principle describes how design can achieve broad applicability
      and emotional resonance by reducing form to its essential elements and avoiding
      specific cultural or functional constraints. The model positions design as an
      empty vessel that users can fill with personal interpretation, rather than a
      fixed solution.
    boundary: Applies to design systems where the goal is broad accessibility and
      user adaptability. Fails when design must communicate specific, context-bound
      information or when the form itself is part of the functional requirement (e.g.,
      medical devices, safety equipment). Also fails for purely decorative or status-signaling
      products where complexity is the intended message.
  expected_classification:
    depth: cross-domain
- id: 10816416ca83e0dd15189b758d34b4467c9223dc6ecd136521f195d80954b6f8
  input_fb:
    name: Iterative Prompt Refinement (2)
    definition: Progressive improvement of AI outputs through systematic iteration
      of prompts, summaries, and verification steps. The principle describes a method
      where initial AI responses are refined through multiple stages of analysis,
      summarization, and validation to achieve higher quality and more reliable results.
    mechanism: 'This is a practical heuristic for improving AI output quality: starting
      with an initial prompt or response, applying iterative refinement steps such
      as summarization of chunks, chaining multiple prompts together, and incorporating
      verification mechanisms. Each iteration adds layers of processing that address
      limitations in the previous step, such as repetition, lack of specificity, or
      incomplete understanding. The process leverages the AI''s pattern recognition
      capabilities while actively mitigating common failure modes like over-generation
      or pattern continuation.'
    boundary: Applies when AI outputs show signs of repetition, incomplete understanding,
      or need for structured refinement. Fails when the iterative process introduces
      cumulative errors or when the system lacks sufficient context to guide meaningful
      improvements. Also fails for applications where the initial prompt already provides
      complete, accurate information.
  expected_classification:
    depth: specialized
- id: a27a5c8d37495a7fe5b2c8ec390ecb908662ac79679af8832e045e9929a5c2ca
  input_fb:
    name: System Innovation Through Unrelated Expertise
    definition: Major system innovations often come from individuals who are not experts
      in the field being solved, but rather from unrelated disciplines or backgrounds.
    mechanism: Innovations occur when people approach problems as puzzles rather than
      as requiring specific expertise, allowing fresh perspectives from outside the
      traditional field to solve complex problems.
    boundary: Applies when system solutions emerge from individuals outside the relevant
      field or with unrelated expertise. Fails when solutions require specific field
      knowledge or when innovators are properly trained in the relevant domain.
  expected_classification:
    depth: cross-domain
- id: c08d6251b944640f059ca517a812c93c48ffb02f098b75b919e0341a3348ff74
  input_fb:
    name: Archetypal Symbol Integration
    definition: Symbols and geometric forms from diverse cultural and religious traditions
      are integrated into unified design systems that reflect shared archetypal meanings.
      The principle describes how universal symbolic elements are adapted and recombined
      across contexts to convey deeper spiritual or philosophical concepts.
    mechanism: This is a descriptive model of how symbolic elements are organized
      and recombined across cultures and time periods. Archetypal symbols like the
      circle, the tree, the throne, and the lotus emerge as recurring motifs that
      carry consistent meanings (divine authority, knowledge, motherhood, enlightenment)
      but are adapted to local contexts and mythologies. These elements form a shared
      vocabulary of meaning that transcends specific cultural boundaries.
    boundary: Applies when symbols from different traditions are used in a way that
      suggests shared meaning or purpose. Fails when symbols are used purely for decorative
      or superficial reasons without reference to deeper archetypal structure.
  expected_classification:
    depth: cross-domain
- id: 50e8e885078b65f8fb9c8078d4cad4949b9a338bd3f55fc20f7925eb370b3bf5
  input_fb:
    name: Adaptive Function of Artistic Specialization
    definition: Artistic and literary expression serves an evolutionary adaptive function
      by transforming ordinary experiences into special, desirable phenomena through
      deliberate creation and ritualization. This process enables humans to impose
      order on chaos, foster group cohesion, and communicate meaning in ways that
      transcend purely functional necessity.
    mechanism: The adaptive function operates through a process where ordinary experiences
      or elements are made 'special' through artistic or ritualistic means, transforming
      them from necessary but mundane into voluntary and desired. This transformation
      creates psychological and social benefits that support group bonding, meaning-making,
      and cultural transmission. The process involves intentional creation of extraordinariness
      through formalized methods like poetry, music, ritual movement, and archaic
      language, which signal cognitive and cultural sophistication.
    boundary: Applies when artistic expression serves a function beyond pure utility
      or communication. Fails when artistic creation lacks any demonstrable social,
      psychological, or group-bonding benefit, or when it is purely idiosyncratic
      without broader communicative or adaptive value.
  expected_classification:
    depth: cross-domain
- id: 106e55178840d44382f4d74b071a6dc539f2c8975bffab96efa70587119d676f
  input_fb:
    name: Low Tech Sensors and Actuators Project
    definition: A collaborative project to make it simple for nontechnical people
      to prototype responsive systems using everyday toys and gadgets, emphasizing
      accessibility and reconfigurability over technical sophistication.
    mechanism: The project enables nontechnical users to hack and reconfigure existing
      toys and gadgets to create interactive systems, creating a critique of closed
      smart home systems by allowing occupants to determine how devices connect and
      respond to them.
    boundary: Applies to collaborative projects that make technology accessible to
      non-experts. Fails when the approach is too technical or excludes non-technical
      users.
  expected_classification:
    depth: specialized
- id: f37553dcbfda8c0b2a0e7eae80f01288d169ff222e0035029871dd6ff7fb9223
  input_fb:
    name: Design Science Revolution and Human Evolution
    definition: A prescriptive principle for human development that advocates for
      a design science revolution to achieve human success through more-with-less
      efficiency and sustainable increases in human prosperity.
    mechanism: The passage outlines a progression from human ignorance and inertia
      to the acquisition of adequate technology through fear-driven war preparation,
      ultimately leading to peaceful achievement of human success and universal sustainability.
    boundary: Applies to human development and technological advancement through design
      science. Fails when human development does not follow the prescribed path of
      fear-driven acquisition followed by peaceful implementation.
  expected_classification:
    depth: cross-domain
- id: 10de42dfdfe4e78c907306ba9657b702c51a486d8d721eecec1f6f67e09fa213
  input_fb:
    name: Musical Semiotics Research Network
    definition: Musical semiotics has developed into a global research field characterized
      by international collaboration, institutional support, and diverse theoretical
      approaches. The field has established itself through organized symposia, publications,
      and academic centers that foster cross-cultural and interdisciplinary exchange.
    mechanism: The field's growth and organization is driven by institutional mechanisms
      that support international collaboration and knowledge dissemination. Research
      networks form around key figures and centers, such as the International Semiotics
      Institute in Finland and the Department of Musicology at the University of Helsinki,
      which serve as hubs for theoretical development and publication. These networks
      facilitate the spread of ideas across different musical traditions and theoretical
      frameworks, from European classical music to non-Western musical forms.
    boundary: Applies when there is organized international research collaboration,
      institutional support for publications, and development of theoretical frameworks
      across diverse musical traditions. Fails when research remains isolated within
      single institutions or national boundaries without cross-cultural exchange or
      institutional support.
  expected_classification:
    depth: cross-domain
- id: 99bd93f4ab0586d5cfc3e05780bf97a9b01729ce97be1a453a08866765f925f9
  input_fb:
    name: Cooking As a Platform for Understanding Complex Systems
    definition: The analogy that cooking resembles complex systems more than physics,
      where technologies and activities can be understood through the lens of culinary
      evolution and adaptation rather than deterministic scientific principles.
    mechanism: Cooking involves iterative adaptation, cultural transmission, and emergent
      properties that mirror how complex systems evolve through experimentation and
      collective refinement rather than following fixed scientific laws.
    boundary: Applies when analyzing complex adaptive systems that evolve through
      cultural transmission and experimentation. Does not apply to deterministic physical
      systems or purely mathematical models.
  expected_classification:
    depth: cross-domain
- id: f971101079fd251c6bda99d6eb9f1bbf7f2cb5412b38117fadaa04f506b5ec93
  input_fb:
    name: Strategic Problem Selection Principle
    definition: A guiding principle for choosing research problems that balance personal
      interest with potential impact, particularly when evaluating opportunities that
      may be important to multiple fields or organizations.
    mechanism: The principle suggests that when faced with a problem that appears
      to have broad significance (such as one that is important to both physics and
      Bell Telephone Laboratories), researchers should consider working on it even
      if they don't fully understand all the details initially.
    boundary: Applies when researchers encounter problems that show promise of cross-disciplinary
      or cross-organizational importance. Fails when problems lack any demonstrable
      significance or when personal interest conflicts with broader impact.
  expected_classification:
    depth: cross-domain
- id: 1c619fed5b499653146f59bd5b467a61f7bb7c1dcfc5b28f86bef249746645e9
  input_fb:
    name: Design Thinking and Systems Thinking Hybrid Approach
    definition: A strategic framework combining design thinking with systems thinking
      and mindset principles to address wicked problems in business innovation and
      startup development.
    mechanism: The approach integrates design thinking's human-centered problem-solving
      with systems thinking's holistic analysis and the right mindset for iterative
      development and business model validation.
    boundary: Applies to complex business challenges where traditional approaches
      fail. Fails when the wicked problem cannot be addressed through human-centered
      design or when stakeholder alignment is not achieved.
  expected_classification:
    depth: cross-domain
- id: 3df8dfcb08167ed3402b3e762efb298484592be61e846c2ade4e3f017fa81300
  input_fb:
    name: Climate Change Communication Framing
    definition: A communication strategy that recognizes the importance of connecting
      abstract environmental problems to people's direct lived experiences for effective
      social action.
    mechanism: Effective climate communication moves from abstract scientific data
      (greenhouse gas emissions, ice caps) to concrete social realities (local environmental
      degradation, injustice) that resonate with people's daily experiences and direct
      impacts.
    boundary: Applies when communication strategies need to bridge the gap between
      scientific understanding and public engagement. Fails when abstract framing
      is used without connecting to local or personal relevance.
  expected_classification:
    depth: cross-domain
- id: f7676921c3bfbc3364386d8dd5a48793e00406418e3cf3bd2b61c767cfecec5c
  input_fb:
    name: Golden Ratio Division in Conic Sections
    definition: "The golden ratio division occurs when the ratio of the whole segment\
      \ to the larger part equals the ratio of the larger part to the smaller part,\
      \ expressed as AC/CB = AB/AC, where Phi (\u03C6) represents one of the roots\
      \ of the resulting quadratic equation."
    mechanism: "The golden ratio division creates a mathematical relationship where\
      \ the whole segment (AB) is divided into two parts (AC and CB) such that the\
      \ ratio of the whole to the larger segment equals the ratio of the larger segment\
      \ to the smaller segment, generating the golden ratio \u03C6 = (1+\u221A5)/2\
      \ as one of the solutions."
    boundary: Applies specifically to conic sections where the golden ratio relationship
      holds between segments of a line divided according to the golden proportion.
      Fails when the segments do not satisfy the AC/CB = AB/AC condition.
  expected_classification:
    depth: universal
- id: d937856d92e0df2e154b073747580f65a98fd16abfa19c4600fe5f4b54391bdb
  input_fb:
    name: Design As Systems Thinking
    definition: Design operates as a systems thinking practice that integrates complexity,
      context, and emergent properties through iterative intervention and cross-domain
      inspiration. The principle describes how design functions not merely as a tool
      but as a methodological framework for navigating complex adaptive systems.
    mechanism: Design functions as a systems lens that enables practitioners to observe,
      intervene, and adapt within complex environments. It incorporates multiple perspectives
      and influences from diverse domains (social, technological, cultural) to shape
      outcomes. The practice involves both structured approaches (like gardeners tending
      to systems) and exploratory methods (borrowing from cinema, literature, science
      fiction) to generate novel solutions and anticipate emergent behaviors.
    boundary: Applies when design is used as a methodological framework rather than
      a linear process. Fails when design is reduced to a purely aesthetic or functional
      output without systems awareness or cross-domain integration.
  expected_classification:
    depth: cross-domain
- id: 8ddec00aa4f0a712e645f566a43831e3184450a5f698e1b938f216a7665510ef
  input_fb:
    name: Cinematic Editing Code Naturalization
    definition: A semiotic principle describing how cinematic editing techniques become
      invisible to viewers through naturalization, relying on familiar analogies from
      other media forms.
    mechanism: Cinematic editing codes are designed to mirror familiar conventions
      from theatre, novels, and comic strips so that they become automatically understood
      and unremarked once viewers habituate to them, creating a process where the
      'editing out' of what goes without saying becomes naturalized.
    boundary: Applies to the semiotic analysis of film editing and how codes become
      absorbed through analogy with other media. Fails when the viewer lacks familiarity
      with analogous codes or when the editing technique is deliberately disruptive.
  expected_classification:
    depth: cross-domain
- id: 6d4770050401d59e337600eeb08e91ada309b41dfa0ba0dfdb67e997da6c3d17
  input_fb:
    name: Sunlight and Awareness Connection
    definition: A conceptual principle that connects personal emotional states to
      environmental conditions, suggesting that awareness of underlying reality can
      be cultivated through attention to persistent elements like sunlight or information.
    mechanism: The passage establishes a metaphorical connection between visible environmental
      elements (sunlight) and abstract states (awareness), suggesting that just as
      the sun remains constant despite cloud cover, information and awareness persist
      regardless of attention levels.
    boundary: Applies to the metaphorical relationship between environmental visibility
      and personal awareness. Fails when applied literally to physical conditions
      or when the metaphor breaks down into concrete causal claims.
  expected_classification:
    depth: cross-domain
- id: 262c0ec8960561a7cf6fa57d2ab5ecf65b6a15f1d7add5d577903d8a2f9d6819
  input_fb:
    name: The New As Transgression of Context Boundaries
    definition: A principle that the new emerges when objects or concepts are transferred
      into different contexts, thereby transcending previously separate domains.
    mechanism: Objects or concepts are moved from one context to another, creating
      new meanings and values by connecting formerly separated domains.
    boundary: Applies when objects or concepts are transferred between contexts that
      were previously distinct. Fails when the transfer occurs within a single, well-established
      domain.
  expected_classification:
    depth: cross-domain
- id: d85f781e25979841e82277acae06f7cdfb780952357c2e570e8dab23ef7798a5
  input_fb:
    name: Prototype-driven Collaborative Design
    definition: Prototypes serve as shared mental models that enable collaborative
      problem-solving by grounding abstract ideas in tangible, testable forms. They
      create a common reference point for stakeholders to engage with and refine solutions
      together.
    mechanism: Prototypes function as collaborative artifacts that reduce uncertainty
      and align expectations among diverse stakeholders. By presenting a concrete,
      albeit incomplete, version of a solution, prototypes invite feedback and iteration
      from multiple perspectives. This shared artifact enables participants to react
      to and build upon a common understanding rather than imagining their own solutions
      in isolation.
    boundary: Applies when stakeholders have divergent ideas or unclear requirements
      and need a shared reference point for collaboration. Fails when stakeholders
      are aligned on the solution and only need to execute a known plan, or when prototypes
      are too complex or expensive to iterate on.
  expected_classification:
    depth: cross-domain
- id: 36afc4bc5734317dfcb31b355f10a835f7879cd5437577fc0625978feb2d6782
  input_fb:
    name: Captcha Technology and Pattern Recognition Evolution
    definition: The development of CAPTCHA systems as a security mechanism that has
      become so widespread that it is estimated humans type over 100 million CAPTCHAs
      daily, while simultaneously being subject to increasing attempts to break them
      and improvements in computer reading abilities.
    mechanism: 'CAPTCHA technology serves dual purposes: providing security for companies
      like Yahoo while simultaneously offering researchers valuable data about pattern
      recognition capabilities. The proliferation of CAPTCHAs has created a feedback
      loop where improved computer reading abilities make the systems more vulnerable
      to automated breaking.'
    boundary: Applies to the security and research dynamics of CAPTCHA systems. Fails
      when the security mechanisms are not challenged or when the research benefits
      do not outweigh the security costs.
  expected_classification:
    depth: cross-domain
- id: 492b6e4b16e51e027333c6859d6855e160f99da7d98a609aad91ee7369e621a8
  input_fb:
    name: Strategic Adaptation Under Uncertainty
    definition: Effective strategic decision-making requires adapting plans in response
      to changing conditions and incomplete information, rather than relying on fixed
      approaches or single-event outcomes. The principle emphasizes continuous recalibration
      of strategy based on evolving context and feedback.
    mechanism: Strategic adaptation operates through iterative assessment and adjustment
      of plans in response to new data or changing circumstances. When initial assumptions
      prove incorrect or conditions shift, successful strategies evolve rather than
      remain rigid. This process involves monitoring outcomes, identifying when current
      approaches become stale, and proactively developing new approaches before problems
      emerge.
    boundary: Applies when strategic decisions must be made under uncertainty or with
      incomplete information. Fails when conditions are completely stable or when
      there is sufficient time to thoroughly analyze all possibilities before committing
      to a plan.
  expected_classification:
    depth: cross-domain
- id: 262ca56c1caf938d7fc8898a0f80eaba864db3576f4cf3e4fb65221dc29e0ec5
  input_fb:
    name: Hardest Positive Selection Performance Limitation
    definition: An empirical observation that selecting the hardest positive in contrastive
      learning does not improve performance on datasets with limited positive variety.
    mechanism: The performance limitation occurs because datasets like MS-COCO have
      only five positive captions per image, making it unlikely to find truly difficult
      positives, and caption simplicity limits meaningful variation in descriptions.
    boundary: Applies to contrastive learning methods on datasets with limited positive
      caption variety. Fails when datasets have sufficient variety to make hardest
      positive selection beneficial.
  expected_classification:
    depth: specialized
- id: 04067840de0a3417246ccc9d278f1b166218338130e073b9deb7fc335faa0deb
  input_fb:
    name: Compelling Experience Map Framework
    definition: A five-stage framework for mapping experiences that takes a comprehensive
      view of any experience looking beyond the main focus to understand what happens
      before, during, and after.
    mechanism: The framework divides experiences into five stages (Attraction, Entry,
      Engagement, Exit, Extension) and maps interactions across these stages to understand
      how touch-points influence overall experience perception and design opportunities.
    boundary: Applies to any experience analysis where a comprehensive view beyond
      the core offering is needed. Fails when the experience being analyzed doesn't
      have clear pre/post stages or when the five-stage model doesn't align with the
      experience structure.
  expected_classification:
    depth: domain
- id: 125d79bdc10ef930781642c23d92d0c1961dc58420f56a1ea4e21a7ede4fd663
  input_fb:
    name: Functional 3d Approach in Graphic Design
    definition: "A design philosophy that applies principles from product design\u2014\
      focusing on user interaction and functional form\u2014to printed and digital\
      \ graphic media. This approach emphasizes the three-dimensional qualities of\
      \ design elements and their relationship to user experience."
    mechanism: This is a descriptive model of design methodology, not a causal mechanism.
      The approach represents a specific category of design thinking that bridges
      product design principles with graphic design practice, organizing design methods
      into a conceptual framework rather than describing a verified cause-effect relationship.
    boundary: Applies to graphic designers who adopt product design methodologies
      and focus on user interaction. Fails when designers work in purely aesthetic
      or illustrative domains where functional considerations are secondary or absent.
  expected_classification:
    depth: cross-domain
- id: ef95c4ed6eb9beb6546022107178fe8bdaa18b79cce1557a74bb5a2ab07c70eb
  input_fb:
    name: Measurable Outcome Focus
    definition: Effective decision-making and goal achievement require identifying
      and tracking concrete, quantifiable outcomes rather than abstract intentions
      or hypothetical scenarios. The principle emphasizes the importance of selecting
      metrics that directly reflect progress toward desired results.
    mechanism: 'This is a practical heuristic for decision-making and goal-setting:
      focusing on measurable outcomes provides clear feedback loops that enable adjustment
      and improvement. By selecting specific, observable indicators (like pounds lost,
      books sold, or safety improvements), individuals and organizations can track
      actual progress rather than relying on assumptions or incomplete information.'
    boundary: Applies when outcomes can be objectively measured or reliably estimated.
      Fails when outcomes are inherently unmeasurable, highly subjective, or when
      measurement creates more noise than signal (e.g., trying to quantify emotional
      satisfaction or personal fulfillment).
  expected_classification:
    depth: cross-domain
- id: 7b7c922253336a4845925c6f21ccf72fa3b219f90bb00724b3a23a45c595b5d1
  input_fb:
    name: Automated Decision Fatality
    definition: Automated systems that make critical life-altering decisions without
      human oversight can result in fatal consequences for individuals who cannot
      navigate or appeal the system's rigid logic. The principle describes how algorithmic
      decision-making, when applied to essential services like healthcare and social
      benefits, can eliminate human judgment and compassion from processes that require
      nuanced understanding.
    mechanism: This is an empirical pattern, not a causal mechanism. The pattern shows
      that automated systems consistently fail to account for exceptional circumstances
      or human variability in their decision-making processes. When systems process
      cases according to predetermined rules without human intervention, they can
      produce outcomes that are objectively harmful to individuals who fall outside
      the system's normal operating parameters. The pattern emerges from the widespread
      deployment of algorithmic decision-making in public services where human judgment
      was previously exercised.
    boundary: Applies to automated systems that make irreversible decisions affecting
      human welfare, particularly in social services, healthcare, and employment.
      Fails when systems include human review mechanisms or when the decision-making
      process allows for exception handling based on individual circumstances.
  expected_classification:
    depth: cross-domain
- id: da71744ac513933a2902717676a253a30653df1b40abb5586a297c66ee9f3f31
  input_fb:
    name: Adaptive Language Evolution
    definition: Languages evolve through adaptation to environmental pressures, with
      successful variants surviving and spreading while unsuccessful ones decline
      or disappear. This process mirrors natural selection, where linguistic traits
      that better serve communicative or social functions are preserved and amplified.
    mechanism: Languages change in response to external pressures such as political
      shifts, conquests, trade, and technological advances. When a language is exposed
      to new environments or challenges, it either adapts by incorporating useful
      elements from other languages or fails to maintain its relevance and eventually
      dies out. Successful languages like French demonstrate this adaptability by
      evolving from Latin through historical events like the fall of the Roman Empire
      and the rise of Paris as a political center, while also standardizing grammar
      and spelling to meet practical needs like international business communication
      and cost-efficient printing.
    boundary: Applies when languages face significant external pressures or changes
      in usage context. Fails when languages are isolated from external influences
      or when they are artificially maintained without functional adaptation (e.g.,
      through colonial or institutional support alone).
  expected_classification:
    depth: cross-domain
- id: dfb4cf9db4afe011289ecf865d3b36cce466ef345d6396ad2332593284420922
  input_fb:
    name: Prague Linguistic Circle Semiotics Theory
    definition: A theoretical framework developed in the 1930s-1940s that applies
      structural linguistics and Russian formalism to analyze human communication
      in all its aspects including cultural, sociological, and artistic dimensions.
    mechanism: The Prague Circle's semiotics methodology treats all elements of theatre
      - physical, visual, and verbal - as equally important for understanding how
      theatrical communication works, providing systematic practical grounding for
      theatrical analysis.
    boundary: Applies to the analysis of theatre and communication in the 1930s-1940s
      and later in the 1960s when applied to theatre. Fails when the approach is not
      applied to theatre or when other communication methods are not considered.
  expected_classification:
    depth: cross-domain
- id: a83776da2a3c83694dbd0ff58d925b8359936cc4053105aafd74d2f08f92e38f
  input_fb:
    name: Exponential Ai Performance Scaling
    definition: AI systems experience rapid, exponential performance improvements
      and cost reductions that dramatically accelerate business capabilities for early
      adopters while leaving competitors behind.
    mechanism: Each performance leap in AI systems doubles in power every few months
      rather than years, creating exponential amplification that outpaces human adaptation
      and competitive response cycles.
    boundary: Applies to AI systems with measurable compute scaling and algorithmic
      efficiency improvements. Fails when performance gains don't follow predictable
      exponential patterns or when the gap between adopters and non-adopters isn't
      due to performance differences.
  expected_classification:
    depth: universal
- id: 585a40c8151b6b6cc507bfb7329356dea8d9157db4c3feb1f7aaef27d1fcfb09
  input_fb:
    name: Narrative Structure As Learning Framework
    definition: Organizing information through structured narratives creates a learning
      pathway that guides users from overview to detail while embedding key concepts
      in memorable contexts. This approach leverages storytelling's natural cognitive
      architecture to enhance comprehension and retention.
    mechanism: Narrative structure serves as a cognitive scaffold that organizes information
      into sequential, meaningful chunks that align with human mental models. The
      framework provides both high-level orientation (what's coming next) and granular
      content delivery (how it works), enabling users to process complex information
      through familiar storytelling patterns.
    boundary: Applies when information needs to be communicated sequentially with
      progressive detail. Fails when content is purely factual or procedural without
      relational context, or when audience lacks familiarity with narrative structures.
  expected_classification:
    depth: cross-domain
- id: c5b301686354b51af0321530ed8b3c27c0d1295c2a78a1bee3c2f5434738d926
  input_fb:
    name: Frame-shifting Error Correction
    definition: Recognizing that system failures or bugs can be reframed as opportunities
      for learning and improvement through perspective shifts. The principle emphasizes
      that error correction is not just about fixing problems but about gaining deeper
      understanding through alternative frames of reference.
    mechanism: When encountering a system failure or bug, shifting one's frame of
      reference allows for reinterpreting the event as either a problem to be solved
      or a bonanza of insight to be gained. This reframing enables more effective
      problem-solving by expanding the range of possible interpretations and solutions.
      The act of asking 'BUG OR BONANZA?' represents a meta-cognitive shift that transforms
      error from a source of frustration into a source of knowledge.
    boundary: Applies when system failures or bugs present opportunities for learning
      and adaptation. Fails when the failure is truly irreparable or when the context
      does not allow for perspective shifts. Also fails when the problem is not a
      system issue but a fundamental constraint or limitation that cannot be reframed.
  expected_classification:
    depth: cross-domain
- id: 2351d0bdb479fda43003dfacff0e9b50a3b36a27a032e5caf18c0f9afa7e92b9
  input_fb:
    name: Idea Generation Through Divergent Thinking
    definition: Generating a large quantity of diverse ideas through structured or
      unstructured processes that encourage creative exploration and avoid premature
      evaluation. The principle emphasizes expanding the idea space before narrowing
      down to viable solutions.
    mechanism: 'This is a practical heuristic for idea generation: encouraging high-volume,
      low-quality idea creation increases the likelihood of discovering novel and
      useful solutions. The process works by reducing cognitive constraints and fostering
      an environment where unconventional thoughts can emerge without immediate judgment.
      It leverages the principle that creativity often emerges from a wide exploration
      of possibilities rather than focused refinement.'
    boundary: Applies when teams or individuals need to explore multiple solution
      paths or break free from conventional thinking. Fails when time constraints
      or resource limitations prevent sufficient idea generation, or when the process
      is used without any subsequent evaluation or filtering.
  expected_classification:
    depth: specialized
- id: 468b07708d127f509cebbe1116c7c1cd1b088996fefa7bd426fe44b8af9b3956
  input_fb:
    name: Square As Multifunctional Geometric Principle
    definition: The square as a versatile geometric form that serves multiple roles
      in art, architecture, and design, functioning as both static and dynamic elements
      with symbolic, mathematical, and practical significance.
    mechanism: The square operates as a static element when resting on its sides and
      dynamic when balanced on its angles, while also functioning as a mathematical
      foundation for proportions, a source of ancient symbolic power, and a generator
      of practical design solutions.
    boundary: Applies across all artistic and architectural contexts where geometric
      principles are relevant. Fails when the square's properties are not understood
      or when its symbolic significance is ignored in favor of purely functional approaches.
  expected_classification:
    depth: cross-domain
- id: dbcf8b0126feefadebbf5c4c525879bd03f88726ff963364b11f8fd3a7bbf59f
  input_fb:
    name: Scenario Specificity Bias in Investment Estimation
    definition: The tendency for investors to become more confident in specific investment
      scenarios as they learn more details about those scenarios, even when the additional
      details don't improve the accuracy of return estimates.
    mechanism: As investors gather more granular information about specific investment
      opportunities, they experience increased confidence in their assessments, but
      this confidence does not necessarily correlate with improved predictive accuracy
      of returns.
    boundary: Applies when investors receive detailed information about specific investment
      scenarios rather than general categories. Fails when the additional details
      are genuinely predictive of outcomes.
  expected_classification:
    depth: cross-domain
- id: 8381a4f5da61972cb2d56c0e700d0700e086eb71531e02b87388eff78749126f
  input_fb:
    name: Systemic Bug Emergence
    definition: Software systems inevitably contain bugs that emerge unexpectedly
      during execution, often due to incorrect assumptions or misapplied principles
      from the real world. These bugs are not merely errors but represent fundamental
      mismatches between system design and the phenomena they attempt to model.
    mechanism: Bugs emerge when systems are built on incorrect or incomplete understanding
      of real-world phenomena. The example of gravity being entered as repulsive instead
      of attractive demonstrates how a single conceptual error can propagate through
      a system, causing unexpected behavior. This occurs because systems are often
      constructed with simplified or incorrect models of complex natural or social
      processes, leading to emergent properties that contradict intended function.
    boundary: Applies when systems are built using models that do not accurately reflect
      real-world behavior or when assumptions about phenomena are incorrect. Fails
      when systems are built with complete, accurate, and well-understood models of
      their domain.
  expected_classification:
    depth: cross-domain
- id: 30180544ba7d04d543e1bfbc357b45b8822824fe165e8585600c0899ef67d5cb
  input_fb:
    name: Hemispheric Specialization and Design Cognition
    definition: The human brain's hemispheric specialization enables distinct cognitive
      functions that contribute to design thinking and creative problem-solving. The
      left hemisphere processes logical, linear, and analytical tasks while the right
      hemisphere supports spatial, creative, and holistic reasoning. These hemispheres
      work in concert to enable complex cognitive abilities essential for design.
    mechanism: 'The brain''s two hemispheres each specialize in different types of
      processing: the left hemisphere handles language, logic, and sequential analysis,
      while the right hemisphere manages spatial reasoning, pattern recognition, and
      creative synthesis. This division of labor allows for parallel processing of
      design problems, where logical analysis and creative exploration can occur simultaneously.
      The hemispheres communicate through the corpus callosum, enabling integration
      of diverse cognitive functions into unified design solutions.'
    boundary: Applies to human cognitive systems with established hemispheric specialization.
      Fails when studying non-human species without clear hemispheric division or
      when examining individuals with atypical brain organization (e.g., those with
      split-brain conditions or unusual hemispheric dominance). Also fails in cases
      where design thinking is not supported by high-level cognitive processing or
      where brain activity patterns don't align with established hemispheric functions.
  expected_classification:
    depth: cross-domain
- id: a37bfd79323f1bafe0b096451dd1e0c89b52e18c4dfe90a2bb7821adfa194a0d
  input_fb:
    name: Outside-in Problem Solving
    definition: A phenomenon where breakthrough solutions to complex problems come
      from individuals or groups outside the specialized domain that has been working
      on the problem for years.
    mechanism: Innovative solutions emerge from people with different backgrounds
      or perspectives who approach problems without the constraints of established
      domain-specific thinking, often leading to unexpected but effective solutions.
    boundary: Applies to scientific and technical breakthroughs where outsiders solve
      problems that specialists have struggled with for extended periods. Fails when
      the outside perspective lacks relevant domain knowledge or when the problem
      requires deep specialized understanding.
  expected_classification:
    depth: cross-domain
- id: 7a3ab77b28599e90568d8673d1c7d043af5336285ee053290d1a1c3c61aa3a39
  input_fb:
    name: Computational Exponential Growth
    definition: A principle demonstrating how exponential growth in computing power
      and value can dramatically exceed linear expectations over time.
    mechanism: Computational systems compound gains through repeated cycles of improvement,
      where each generation builds upon the previous one, creating exponential rather
      than linear growth patterns in capability and value accumulation.
    boundary: Applies to computational systems where growth follows exponential patterns
      rather than linear ones. Fails when growth patterns are truly linear or when
      computational systems don't compound improvements over time.
  expected_classification:
    depth: universal
- id: e2a45e3c40877dc44feff17a847ecb50d6443fb3bcb78f47a0288d6462c3512d
  input_fb:
    name: Information-driven Decision Making (2)
    definition: Effective decision-making requires sufficient information about both
      external conditions and internal capabilities, as incomplete information leads
      to suboptimal choices and delays in execution.
    mechanism: Decision-makers must balance the need for comprehensive information
      with the urgency of action, where lack of critical data about markets, competitors,
      or internal timelines creates bottlenecks in strategic execution.
    boundary: Applies when decision-makers face uncertainty due to information gaps.
      Fails when organizations have complete information but still make poor strategic
      choices due to other constraints like resource limitations or organizational
      culture.
  expected_classification:
    depth: cross-domain
- id: 9c0108cacaaf7d7aa6a41cc6a8a0bf0f76bd9f09d469e6685eb1b8e70d47cfc4
  input_fb:
    name: Interactive Performance Art Method
    definition: A performance art approach that involves direct, unmediated interaction
      with the public in a gallery setting, requiring complete stillness and presence.
    mechanism: The performance requires the artist to sit motionless and silent for
      extended periods (eight hours a day for three months) while facing seated guests,
      creating a shared psychological experience that synchronizes brainwave patterns
      between performer and audience.
    boundary: Applies to specific gallery-based performance art that requires complete
      physical and mental stillness. Fails when the performance involves movement,
      speech, or other forms of interaction that would disrupt the psychological synchronization.
  expected_classification:
    depth: cross-domain
- id: 8969f98a1c71f223e2d311984c99d38295a95ae967044fedfe49c93be48d4492
  input_fb:
    name: Visual Identity Through Symbolic Association
    definition: Visual identity elements like color, typography, and form shape user
      perception and emotional response by creating symbolic associations that communicate
      brand values and organizational characteristics. The principle describes how
      specific design choices trigger immediate cognitive and emotional reactions
      based on cultural and psychological patterns.
    mechanism: Design elements such as color, typeface, and geometric form create
      symbolic meaning through cultural conditioning and psychological association.
      When users encounter specific visual cues (like Coca-Cola's red and white or
      Nike's bold typography), their brains automatically link these elements to pre-existing
      mental models of brand personality, trustworthiness, or energy. These associations
      are not arbitrary but emerge from repeated exposure to design systems that reinforce
      particular meanings over time.
    boundary: Applies when design elements are consistently paired with specific meanings
      that users can recognize and interpret. Fails when design elements are too abstract
      or culturally isolated to trigger meaningful associations, or when users have
      no prior exposure to the symbolic system (e.g., unfamiliar brand language in
      a new market).
  expected_classification:
    depth: cross-domain
- id: a6f551bd1328f69c1f3e61e81a82291b336f7aa1b60f588e302f4946213e5223
  input_fb:
    name: Iterative Hypothesis Refinement
    definition: Research hypotheses and theoretical frameworks evolve through continuous
      interaction with data, requiring researchers to question, amend, and expand
      initial assumptions based on emerging evidence. The process involves constant
      testing of fit between observations and expectations, with adjustments made
      to better reflect the phenomenon under study.
    mechanism: 'This is a practical heuristic for theory development: researchers
      begin with initial ideas or hypotheses, then systematically test these against
      empirical data. When data does not fit expectations, researchers modify their
      understanding rather than forcing data to conform. The process is iterative
      and reflexive, involving ongoing questioning of assumptions and adaptation of
      conceptual frameworks to better capture the complexity of the phenomenon.'
    boundary: Applies when researchers engage in qualitative or mixed-methods inquiry
      where data informs theory development. Fails when researchers are committed
      to predetermined hypotheses or when data collection is designed to confirm rather
      than challenge initial assumptions. Also fails in contexts where theory development
      is not iterative or where researchers are not willing to revise their conceptual
      frameworks.
  expected_classification:
    depth: cross-domain
- id: 021bdd9a9b41793d1f0b5e1598de5eda7817c5b0f79c91658d1585dce10a127d
  input_fb:
    name: Iterative Design and Development Process for Data Visualization
    definition: A conceptual framework describing the iterative and non-linear nature
      of data visualization design and development, comparing it to dance and gardening.
    mechanism: The process emphasizes that visualization projects are inherently iterative,
      involving constant refinement, adaptation, and adjustment as the project evolves,
      rather than following a linear path from perfect planning to perfect implementation.
    boundary: Applies to the conceptual understanding of visualization design as an
      iterative process rather than a linear one. Fails when the iterative nature
      of visualization work is not acknowledged or when unrealistic expectations about
      perfect planning and implementation are maintained.
  expected_classification:
    depth: domain
- id: 0208bd8be9b6d3b8a02a204e02c0dab796b76c9b99e4d59f67ea086f80149da3
  input_fb:
    name: Typographic Aesthetic in Brazilian Book Design
    definition: A design approach that combines nineteenth-century typographic aesthetics
      with contemporary elements, using specific visual techniques to evoke historical
      craftsmanship and materiality.
    mechanism: The design strategy employs historical typographic elements (like Egypcia
      Shadow font) alongside period-appropriate materials (gold) to create a visual
      connection to nineteenth-century printing and photography processes.
    boundary: Applies specifically to book design contexts where historical typographic
      elements are deliberately juxtaposed with modern design principles. Fails when
      the historical reference is not intentionally incorporated or when the design
      lacks the intended material evocation.
  expected_classification:
    depth: domain
- id: a42ddc7fb5a116c623e9ab16b8649864390d1c98fea355a8bf63a1837d357ace
  input_fb:
    name: Semiotics of Clothing and Food
    definition: Clothing and food function as semiotic systems where physical items
      become signs carrying meaning beyond their practical function, serving as vehicles
      for communication and social expression.
    mechanism: Both clothing and food operate as symbolic systems where the physical
      object transforms into a sign that conveys social meaning, identity, and cultural
      values through their selection, presentation, and consumption.
    boundary: Applies to items that can be transformed into signs through cultural
      interpretation. Fails when items serve purely functional purposes without symbolic
      meaning.
  expected_classification:
    depth: cross-domain
- id: 7a369ae6fa9192aee00f01f22e296ab12e0ee9b1e13e125a425d5634ed2a1582
  input_fb:
    name: Black Hole Sound Waves and Musical Notes
    definition: Black holes emit electromagnetic waves that correspond to musical
      notes, with the B-flat note (466 Hz) being particularly significant as it matches
      the frequency of sound waves emitted by a recently discovered black hole.
    mechanism: Black holes produce electromagnetic radiation through intense gravitational
      and magnetic field interactions that create oscillations at specific frequencies,
      which can be interpreted as musical notes when converted to audible sound waves.
    boundary: Applies to black hole electromagnetic radiation that can be measured
      and converted to audible frequencies. Fails when electromagnetic radiation is
      not within the audible range or when the conversion process is not possible.
  expected_classification:
    depth: cross-domain
- id: d601abb226fa3a8a00fbd02637e741735ae4360d45251e495dea36dacfe5d2f0
  input_fb:
    name: Forager Design Strategy
    definition: A design approach that examines how marginalized groups in society
      might develop bottom-up solutions to environmental and nutritional challenges
      using synthetic biology and mechanical systems.
    mechanism: "The strategy involves observing existing\u8FB9\u7F18 groups (guerrilla\
      \ gardeners, garage biologists, amateur horticulturalists, and foragers) who\
      \ operate outside mainstream systems, then applying their principles to create\
      \ devices that extend human digestive capabilities through synthetic biology\
      \ and mechanical engineering."
    boundary: Applies when examining groups that work at the edges of society and
      operate outside traditional institutional frameworks. Fails when applied to
      mainstream industrial or governmental approaches to environmental problems.
  expected_classification:
    depth: cross-domain
- id: 1f6ad2082f130a552ce2b2c6d58fcc07ff789bd3366ebd3fbf01b9091407255d
  input_fb:
    name: Query Rewriting in Rag Systems
    definition: Query rewriting enhances retrieval accuracy in RAG systems by transforming
      initial user queries into semantically richer forms that better match document
      content. This process improves the relevance of retrieved context and ultimately
      leads to more accurate answer generation.
    mechanism: Query rewriting in RAG systems operates as a preprocessing step that
      modifies the original user question to improve semantic alignment with the document
      corpus. The rewritten query is generated using a prompt template that transforms
      the input into a more effective search term, which then drives the retrieval
      process. This transformation increases the likelihood of retrieving semantically
      relevant documents that contain the answer to the original question.
    boundary: Applies when RAG systems use semantic search capabilities to retrieve
      relevant documents from a corpus. Fails when the rewriting process introduces
      semantic drift that moves away from the user's actual intent or when the rewritten
      query becomes too abstract to effectively retrieve relevant content.
  expected_classification:
    depth: specialized
- id: eeff65238632a1be9b1fdb4ccdd94c2b435dbf00c66ba042868d1acfeb979988
  input_fb:
    name: Practical Application of Knowledge
    definition: A principle that emphasizes the importance of applying learned knowledge
      rather than just acquiring it, with the understanding that action is the only
      way to realize value from learning.
    mechanism: Knowledge becomes meaningful only when it is actively applied to real
      situations, and the process of applying knowledge creates the conditions for
      growth and success.
    boundary: Applies to any learning situation where knowledge acquisition is not
      sufficient for progress. Fails when individuals have no opportunity to apply
      their knowledge or when they make excuses about timing.
  expected_classification:
    depth: cross-domain
- id: 14f820e01bad4844b327bfda44e368e27d0f0103baa19e4d09b16d3155e726d9
  input_fb:
    name: Ai Cultural Transformation in Enterprise
    definition: A principle describing how AI adoption requires fundamental business
      model and workflow rethinking rather than incremental implementation, and how
      successful AI integration necessitates becoming an AI-centric organization.
    mechanism: AI implementation forces organizations to restructure their entire
      business culture, creating a culture of iteration, experimentation, adaptability,
      and imagination, which requires time, energy, and effort to achieve.
    boundary: Applies to organizations seeking to fully leverage AI opportunities
      and transform their business models. Fails when organizations attempt to implement
      AI on top of existing business models without fundamental rethinking.
  expected_classification:
    depth: cross-domain
- id: 01c8f7e32cd0cd826eedd34b7198dc6fe6158da9a7051c0c69266cb401a3f3a8
  input_fb:
    name: Market Basket Analysis Process
    definition: A data analysis method that identifies associations between products
      or services in transaction data to understand customer behavior patterns and
      market segments.
    mechanism: The process applies association rule mining to transaction datasets
      to discover frequent itemsets and generate rules that explain consistent purchasing
      behaviors and customer preferences.
    boundary: Applies to transactional data analysis in retail and food service industries
      where customer purchase patterns can be analyzed. Fails when data is insufficient,
      unstructured, or when the analysis cannot capture complex behavioral patterns.
  expected_classification:
    depth: specialized
- id: 01553866eba49dc8feba58b701714de5e6ba4e28664a511247e3b61a3f1dfca7
  input_fb:
    name: Variational Principle for Pde Solution
    definition: A numerical method for solving partial differential equations by discretizing
      the solution into basis functions and minimizing the energy functional with
      respect to the coefficients of these basis functions.
    mechanism: "The method approximates the solution u(x,y) as a linear combination\
      \ of basis functions with unknown coefficients (u\u2081, u\u2082, ..., u\u2099\
      ). These coefficients are determined by plugging the approximation into the\
      \ energy functional, which becomes a function of the coefficients, then minimizing\
      \ this function using standard calculus methods."
    boundary: Applies to PDEs that can be formulated in variational form with an energy
      functional. Fails when the PDE does not have a variational formulation or when
      the basis functions do not adequately represent the solution space.
  expected_classification:
    depth: domain
- id: 00299a453c9da9febf6a4c27858aadbcd55d0edb906d2f80a43b9ad1c9dd83a4
  input_fb:
    name: Type Family Versatility Through Weight and Width Variation
    definition: A type family achieves broad applicability when it includes multiple
      weights and width variations that support diverse layout requirements and visual
      contexts. The principle describes how families with extended families of styles
      can adapt to vertical orientations, compressed spaces, and varied typographic
      needs.
    mechanism: 'This is a descriptive model of type family organization. A type family''s
      versatility emerges from its structural components: multiple weights (light
      to heavy) and width variations (compressed, regular, extended) that allow designers
      to select appropriate styles for specific contexts like vertical layouts, advertising,
      or packaging. The model categorizes families by their design characteristics
      and functional applications rather than asserting a causal relationship between
      specific design elements and outcomes.'
    boundary: Applies to type families that include multiple weights and width variations
      designed for flexible application. Fails for single-style or minimal-weight
      families that lack variation options, or for families where width and weight
      variations are not systematically organized.
  expected_classification:
    depth: domain
- id: 094a2dad4c780eaa4a62f46aea93af0712bb214feec43c522e15679f56e9f11f
  input_fb:
    name: Phyllotaxis-based Identity Design
    definition: A design approach that uses the mathematical principle of phyllotaxis
      (the arrangement of leaves on a plant stem) as a foundational concept for creating
      visual identities that reflect scientific and natural patterns.
    mechanism: The design system is based on the mathematical golden ratio and phyllotaxis
      patterns found in nature, which are applied to create visual elements that maintain
      mathematical relationships while allowing for creative interpretation and adaptation.
    boundary: Applies to identity design projects that seek to incorporate natural
      mathematical principles and scientific themes. Fails when the mathematical relationships
      cannot be effectively translated into visual design elements.
  expected_classification:
    depth: cross-domain
- id: 3506bda95176b5be6b9db3080471f8b96b65ea381be6a1e3303ecb0e56f945c1
  input_fb:
    name: Data-driven Decision Making (2)
    definition: Effective decision-making in complex systems requires systematic analysis
      of available data rather than reliance on intuition or anecdotal evidence. This
      principle emphasizes the importance of structured data collection and interpretation
      to guide strategic choices.
    mechanism: Data-driven decision making works by systematically gathering relevant
      metrics, analyzing patterns within datasets, and using statistical insights
      to inform choices rather than personal judgment alone. The process involves
      identifying key performance indicators, measuring outcomes against benchmarks,
      and adjusting strategies based on empirical findings rather than assumptions.
    boundary: Applies when sufficient data is available to support analysis and when
      decision-makers have the capability to interpret and act on findings. Fails
      when data is incomplete, irrelevant, or when decision-makers lack analytical
      skills to process the information effectively.
  expected_classification:
    depth: cross-domain
- id: 0340485c9f048dd65dd0a908277d0e66553a1657c92f6b1feceaf4a5b6299cd5
  input_fb:
    name: Transformative Design Through Emotional Engagement
    definition: Effective design transforms mundane or abstract concepts into memorable,
      emotionally resonant experiences by leveraging visual storytelling, creative
      immersion, and intentional emotional triggers. The principle describes how design
      can shift perception and engagement through sensory and narrative elements that
      connect with human psychology.
    mechanism: 'This is a normative heuristic: using powerful imagery, visual themes,
      and creative storytelling creates emotional engagement that transforms abstract
      or dry content into memorable experiences. The mechanism operates through the
      human tendency to process emotionally charged information more deeply and retain
      it longer than neutral content. Design elements that evoke feeling or create
      a sense of belonging activate cognitive pathways that enhance memory and influence
      perception.'
    boundary: Applies when content or concepts are inherently abstract, dry, or disconnected
      from emotional experience. Fails when the subject matter is already emotionally
      engaging or when the audience has no psychological investment in the content
      or context.
  expected_classification:
    depth: domain
- id: 2de337cc6fd340ceb764fc1a6ab82ff64ec86f4ac2e42d5b8e579e23a0f111ca
  input_fb:
    name: Continual Learning in Production Ml Systems
    definition: Continual learning enables machine learning models to adapt to changing
      data distributions and new scenarios in production environments without requiring
      complete retraining cycles.
    mechanism: Models continuously learn from fresh data in real-time to adapt to
      rare events (like Black Friday shopping patterns) or handle new user scenarios
      (like cold start problems) that weren't captured in historical training data.
    boundary: Applies when models need to handle data distribution shifts, rare events,
      or new user scenarios in production. Fails when the system cannot process fresh
      data streams or when the adaptation mechanism is too slow to respond to rapid
      changes.
  expected_classification:
    depth: specialized
- id: 350aa804c8d2c93e2928e9bdce4ea5e321fb412ccea8232f5fb480bfb17dd7e6
  input_fb:
    name: Cultivating Creative Serendipity
    definition: Creating an environment that fosters creative insights and breakthrough
      moments through intentional practices and supportive conditions.
    mechanism: Creative serendipity emerges not from random chance but from creating
      conditions that allow for the emergence of insights, often through sustained
      attention and supportive environments.
    boundary: Applies when seeking to create conditions for creative breakthroughs
      rather than relying on spontaneous moments. Fails when the environment lacks
      the necessary conditions for insight to emerge.
  expected_classification:
    depth: cross-domain
- id: fa6220e81f287bfe087f7be375ac37b8303b8c89ad45c611ecc116f5c213ca58
  input_fb:
    name: Free Culture Movement
    definition: A cultural movement seeking to create a society where all members
      can freely participate in the transmission and evolution of culture without
      artificial restrictions on participation or methods of contribution.
    mechanism: The movement operates through principles that remove barriers to cultural
      participation, allowing individuals to become active creators rather than passive
      consumers of culture.
    boundary: Applies to cultural contexts where artificial limits on participation
      exist. Fails when such limits are not present or when the movement's principles
      don't address the specific cultural constraints.
  expected_classification:
    depth: cross-domain
- id: 09ce3d9bd2ef6bc4754514bd2dec27742b5643cb187f7b2a357e34e4549388cb
  input_fb:
    name: Resilient System Design Through Redundancy and Recovery
    definition: Systems designed with multiple independent paths, recovery mechanisms,
      and distributed components can withstand component failures and maintain functionality
      even when individual parts fail. This approach reduces the impact of single
      points of failure and enables rapid recovery from disruptions.
    mechanism: Systems that incorporate redundancy and recovery capabilities function
      by distributing critical functions across multiple independent components or
      pathways. When one component fails, alternative paths or backup systems can
      take over, maintaining overall system operation. This design pattern enables
      rapid recovery because the system is not dependent on a single point of failure
      and can isolate and address problems without total system collapse.
    boundary: Applies when systems have multiple interdependent components that can
      fail independently. Fails when systems are designed as tightly coupled single
      units where failure of any one component causes cascading failure throughout
      the entire system.
  expected_classification:
    depth: cross-domain
- id: 315479813a2749b9d4a8af1c3e0912bf946ef4a28a842f8daa66c6e5b60a1bfd
  input_fb:
    name: Count-to-three Principle
    definition: A principle stating that to truly understand a tool, one must identify
      at least three ways it can be misused or abused.
    mechanism: The principle suggests that understanding a tool's limitations and
      potential for misuse is essential for mastering its proper application, as the
      absence of abuse cases indicates incomplete understanding of the tool's scope
      and constraints.
    boundary: Applies to any tool or method where understanding its weaknesses is
      necessary for proper use. Fails when the tool's abuse cases are not clearly
      identifiable or when the principle is applied without genuine understanding.
  expected_classification:
    depth: cross-domain
- id: cbd2c9070de8424548b6684a67bb843e7f2b52e109806b372d2d26f2f45913e3
  input_fb:
    name: Embodied Conceptualization
    definition: Conceptual understanding emerges from sensory-motor experiences and
      physical interactions with the environment, shaping how abstract ideas are structured
      and processed. This principle describes the integration of bodily experience
      into cognitive frameworks that guide language, metaphor, and meaning construction.
    mechanism: Concepts are grounded in physical experience and embodied cognition.
      The human mind organizes abstract ideas through metaphorical mappings from concrete,
      sensorimotor domains (e.g., spatial paths, force dynamics, emotional states)
      that reflect universal patterns of embodiment. These mappings are not arbitrary
      but arise from the structure of human perception and action, enabling cross-domain
      analogies that make abstract thinking possible.
    boundary: Applies when conceptualization involves direct sensory-motor grounding
      or metaphorical extension from physical experience. Fails when abstract ideas
      are purely symbolic or formalized without reference to bodily or environmental
      context (e.g., mathematical proofs, purely logical reasoning).
  expected_classification:
    depth: cross-domain
- id: faa4c8eaba541ce48ee652cf4d288bb70e9f2d887d69049298a1e122e6d299d2
  input_fb:
    name: Cognitive Scene Construction
    definition: Human cognition organizes experience into minimal, temporally bounded
      episodes called 'scenes' that link physical circumstances to cognitive responses
      through universal cognitive mechanisms. These scenes are foundational units
      of perception and action, structured by basic cognitive processes rather than
      cultural or linguistic variation.
    mechanism: Scenes emerge as automatic cognitive constructions that bind sensory
      input with conceptual understanding. They are not dependent on language or cultural
      context but arise from shared cognitive architectures that process environmental
      stimuli in relation to goal-directed behavior. The construction of scenes involves
      mapping spatial and temporal relations, categorizing events according to basic
      perceptual principles, and linking these to fundamental human capacities for
      cooperation and action.
    boundary: Applies when cognitive systems process environmental input in relation
      to goal-oriented behavior. Fails when cognitive processing is purely abstract
      or disconnected from physical or social context, or when experience lacks temporal
      or spatial structure that enables scene formation.
  expected_classification:
    depth: universal
- id: 9294c19e2772714858c2685414df488e6d6239f84167ef6f24b5416961d8c6f1
  input_fb:
    name: Vivid Grammar Applicability Across Languages
    definition: The principles of Vivid Grammar, which emphasizes visual and structural
      communication, can be applied across different languages and communication systems
      beyond just English.
    mechanism: The core principles of visual communication and structural clarity
      that make Vivid Grammar effective in English can be adapted to other languages
      because they address fundamental human cognitive and communicative patterns.
    boundary: Applies to languages that can accommodate visual and structural communication
      methods. Fails when a language lacks the grammatical or conceptual flexibility
      to support visual communication approaches.
  expected_classification:
    depth: cross-domain
- id: 01d76d94efc27541b5fa0a5c96cc962673fb67349138dc114acca9c9093f11a8
  input_fb:
    name: Immediate Modality Control
    definition: Controls that produce an immediate effect on data or its presentation
      without requiring intermediate steps are classified as immediate modality controls.
      These differ from menus and dialog boxes, which require multiple steps to execute
      an action.
    mechanism: Immediate modality controls provide direct, instantaneous feedback
      to user actions. They bypass intermediate steps such as menu navigation or dialog
      box interactions, enabling direct manipulation of data or presentation. Examples
      include physical knobs, sliders, pushbuttons, and toolbar variants that have
      an immediate effect on the system state.
    boundary: Applies to user interface elements that provide direct, real-time feedback
      to user input without requiring additional steps or selections. Fails when controls
      require intermediate steps like menu traversal or dialog box interaction before
      executing an action.
  expected_classification:
    depth: specialized
- id: 24316d6c72fadc18fc25017f2bbb744cd0229aaa4fd6f90d63a6df35c42fb669
  input_fb:
    name: Decision-making Through Iterative Action
    definition: Effective decision-making emerges not from perfect planning but from
      taking small, iterative actions that reveal options and outcomes. This principle
      emphasizes that decision quality improves through trial and error rather than
      exhaustive analysis.
    mechanism: 'This is a practical heuristic: making many small decisions builds
      decision-making competence. Each decision provides feedback that refines future
      choices, creating a learning loop. The process involves accepting that initial
      decisions may be suboptimal but are necessary to gain information and experience.
      The key is to act consistently and learn from outcomes rather than waiting for
      perfect information.'
    boundary: Applies when decisions can be made in small, manageable steps and when
      feedback is available to guide adjustments. Fails when decisions are irreversible
      or when the cost of experimentation is too high (e.g., life-or-death medical
      decisions, major financial commitments). Also fails in environments where there
      is no opportunity for iteration or feedback.
  expected_classification:
    depth: cross-domain
- id: e2d7c4b0ccb93b1e730facd7be5dea61e3c29774bc1a6ad0f419b9a3f31c4f10
  input_fb:
    name: Total System Runaway Sequence
    definition: A system that has expanded to involve the entire social order and
      vital functions of a nation, becoming so integrated that it cannot be stopped
      without causing massive disruption and must continue growing to maintain its
      operation.
    mechanism: The system reaches a critical level of social involvement where dismantling
      it would cause immense suffering (unemployment, hunger, dislocation), making
      continued growth necessary to preserve the state's stability and the system's
      operation.
    boundary: Applies when a system has expanded to involve the entire social order
      and vital national functions. Fails when the system can be dismantled without
      causing massive disruption or when the system is not integrated into national
      functions.
  expected_classification:
    depth: cross-domain
- id: a3bbc051a1aef06f7208c35d3b62ad64c8d60aeb223da0a95cdf071dd753e0cc
  input_fb:
    name: Sensory-embodied Data Translation
    definition: Transforming numerical data into experiential insights requires incorporating
      sensory and bodily engagement to make abstract information tangible and accessible.
      This approach enables deeper understanding and interaction with data, particularly
      for diverse audiences with varying literacy levels.
    mechanism: 'This is a normative heuristic: incorporating sensory and embodied
      elements into data presentation increases accessibility and engagement by leveraging
      human perceptual and cognitive strengths. The practice involves translating
      abstract numerical relationships into concrete, multi-sensory experiences that
      activate different learning pathways and make data more immediately comprehensible.'
    boundary: Applies when data communication must reach audiences with varying levels
      of numerical or health literacy. Fails when the audience has strong analytical
      skills and prefers purely quantitative formats, or when the data itself lacks
      meaningful sensory analogies.
  expected_classification:
    depth: cross-domain
- id: 994319c38e47657f5cf78db249dec4aef73681e3c7554bd652581949de9b2b64
  input_fb:
    name: Social Cues and Expectation Influence
    definition: The principle that social expectations and cues significantly shape
      how individuals perceive and evaluate experiences, particularly in artistic
      and cultural contexts.
    mechanism: When individuals lack expertise or perfect information about a domain,
      they rely on social cues and the expectations of others to guide their judgments
      and experiences. This leads to a cascading effect where the perceived quality
      of an experience is influenced by the expectations of those around them.
    boundary: Applies in domains where individuals lack expertise or perfect information
      and must rely on social signals. Fails when individuals have sufficient expertise
      or perfect information to make independent judgments.
  expected_classification:
    depth: cross-domain
- id: 0cd8f4d9c7fdfeb666cf6b722d4d4c79f08f2fdc5b379d384edaaec2dfd2f28b
  input_fb:
    name: Transhumanist Ideology and Technocratic Influence
    definition: The influence of transhumanist ideology among tech elites and its
      potential implications for authoritarian governance.
    mechanism: Transhumanist principles that promote human enhancement and the use
      of biomedical technology to make healthy people 'better than well' are embraced
      by influential tech elites and shape the imagination of the most powerful decision-makers
      in the technology sector.
    boundary: Applies to the cultural and ideological influence of transhumanism among
      Silicon Valley tech elites and their philosophical foundations. Fails when transhumanist
      principles are not embraced by influential decision-makers or when the ideology
      does not shape policy.
  expected_classification:
    depth: cross-domain
- id: a593af1c5f2d4096c1ee7afd91fe09c84e919c8bf758f48316235b4340c44d29
  input_fb:
    name: Context-driven Learning Advantage
    definition: Learning is more effective when it occurs within a relevant context
      that includes both conceptual understanding and practical application. The principle
      emphasizes that deep comprehension requires situational awareness and the ability
      to apply knowledge appropriately in real-world scenarios.
    mechanism: Active learning contexts provide deeper understanding than passive
      consumption because they require mental effort and situational reasoning. When
      learners must navigate between abstract concepts and concrete applications (like
      knowing that a tomato is a fruit scientifically but a vegetable culinarily),
      they build more robust knowledge structures. The context creates a frame of
      reference that helps integrate new information with existing understanding,
      making learning more durable and transferable.
    boundary: Applies when learning involves integrating theoretical knowledge with
      practical application in relevant environments. Fails when learning occurs in
      isolation from real-world contexts or when the context is irrelevant to the
      learner's actual use case.
  expected_classification:
    depth: cross-domain
- id: 2228f2bb06e3aae0f28737d4d0ae42529ef28b16e19692d276cdd74d08e36545
  input_fb:
    name: Function Overloading in Graphics Production Language
    definition: A programming concept in the Graphics Production Language (GPL) where
      multiple functions can share the same name but differ in their argument types,
      allowing for more flexible and simplified code design.
    mechanism: Functions with the same name but different argument types are resolved
      at runtime based on the argument types provided, enabling a single function
      name to handle multiple data types (e.g., color() for real numbers, strings,
      or variables).
    boundary: Applies in object-oriented languages like Java where runtime type checking
      is supported. Fails in languages like C and FORTRAN where type checking is more
      restrictive.
  expected_classification:
    depth: specialized
- id: ff8be5e4ae265ae21ffc6a63e570498d34db0797cc3991db4f4b5e5617c64881
  input_fb:
    name: Bugs As Hidden System Capabilities
    definition: A principle that bugs or errors in systems can represent unexpected
      capabilities or hidden functional potential rather than mere failures
    mechanism: System bugs or errors can represent spontaneous revelations of hidden
      capabilities or alternative functioning modes that were not part of the original
      design specifications, transforming apparent failures into valuable discoveries.
    boundary: Applies to systems where errors or bugs can reveal alternative functional
      paths or capabilities not explicitly designed. Fails when bugs are purely destructive
      or when systems lack the capacity for emergent capabilities.
  expected_classification:
    depth: cross-domain
- id: 0939198e2c8fc7022661ec5c80a01d51983317f40beffe0a8df9535e3cdf72f8
  input_fb:
    name: Cultural Commodification Through Globalization
    definition: The process by which global economic systems and cultural exchange
      transform local artistic traditions into standardized, internationally marketable
      forms. This transformation occurs through the adoption of universal design principles
      and the erosion of culturally specific aesthetic practices.
    mechanism: Globalization and the internationalization of economic systems create
      pressure for local artistic expressions to conform to universal standards that
      prioritize marketability over cultural specificity. This process involves the
      replacement of regionally distinct visual languages with streamlined, globally
      applicable design elements that can be easily consumed and distributed across
      different markets and media.
    boundary: Applies when local artistic traditions are subjected to global market
      forces and international design standards. Fails when artistic expression remains
      isolated from global economic systems or when local traditions are actively
      preserved and protected from commodification.
  expected_classification:
    depth: cross-domain
- id: e4208da1915a31b1e8ed221243fb24ab8583c1ca710af4a12120501a93890d8f
  input_fb:
    name: Storytelling As Early Cognitive Development
    definition: The capacity for storytelling emerges very early in human development,
      even before language acquisition, as a fundamental cognitive and social mechanism
      for understanding and communicating experiences.
    mechanism: Children demonstrate storytelling abilities through symbolic representation
      and sequential narrative structure, using gestures, sounds, and physical actions
      to recreate experiences and convey meaning without relying on verbal language.
    boundary: Applies to early developmental stages where children use non-verbal
      communication to express experiences. Fails to apply to children who have not
      yet developed the capacity for symbolic representation or narrative structure.
  expected_classification:
    depth: cross-domain
- id: 00215fe69f71e75d8f734ccf218930a71398a59eb65bcd90bca60e995e27ae41
  input_fb:
    name: Intentional Boundary Setting for Well-being
    definition: Effective boundary setting requires deliberate prioritization of personal
      well-being and energy management over immediate demands or productivity gains.
      The principle emphasizes that sustainable performance and health depend on consciously
      protecting core resources like sleep, rest, and personal time.
    mechanism: 'This is a normative heuristic: setting boundaries that protect core
      resources (sleep, rest, personal time) enables sustained performance and emotional
      stability. The mechanism operates through intentional prioritization of well-being
      over short-term task completion or external expectations. By making emotional
      and physical health a priority, individuals create sustainable capacity for
      long-term engagement rather than burning out from overextension.'
    boundary: Applies when individuals face competing demands for their time and energy,
      particularly in high-performance or high-stress environments. Fails when boundaries
      are set without clear personal priorities or when external pressures override
      individual needs. Also fails when people lack awareness of their own resource
      thresholds or when they do not have the autonomy to make boundary decisions.
  expected_classification:
    depth: domain
- id: 9e3692c9051c88970fe11fce779c936245a5a7f59fd2aa9e4c85add6868f6899
  input_fb:
    name: Constitutive Performance of Things
    definition: Things are not static entities but are constituted through specific
      performances and arrangements of human and nonhuman elements. A thing only becomes
      real or meaningful when particular configurations of material, software, and
      human interaction align to manifest it in a given context.
    mechanism: The constitution of things depends on the alignment of specific material
      and relational conditions. A prosthetic face only becomes a 'thing' when recognized
      by software; an Internet identity only emerges when specific rights and arrangements
      are enacted for a particular user in a specific jurisdiction. The thing is not
      a fixed essence but a performance that emerges from the interaction between
      human intention, material form, and nonhuman systems.
    boundary: Applies when a thing requires specific human and nonhuman arrangements
      to be constituted. Fails when a thing exists independently of performance or
      arrangement (e.g., a physical object with no interactive or contextual elements).
  expected_classification:
    depth: cross-domain
- id: b237013fc6b495b173d1832110ba861581414a3c47e046b45e6c4caf4314e3ac
  input_fb:
    name: Abductive Reasoning As Hypothesis Generation
    definition: Abductive reasoning is a form of logical inference that generates
      the best explanation from available data, operating as a creative leap from
      observation to hypothesis. It is distinct from deduction and induction, functioning
      as a heuristic for forming plausible explanations when complete information
      is lacking.
    mechanism: Abductive reasoning operates by taking observed data and inferring
      the most likely explanation that would account for that data. It is not a formal
      proof method but rather a practical tool for generating hypotheses that can
      then be tested through further observation or experimentation. The process involves
      making a reasoned guess based on limited evidence, often guided by prior knowledge
      or patterns, and is particularly useful in situations where inductive or deductive
      logic cannot fully address the problem at hand.
    boundary: Applies when data is incomplete or ambiguous and a plausible explanation
      is needed. Fails when sufficient evidence exists to support inductive or deductive
      reasoning, or when the context does not allow for hypothesis generation from
      observed facts.
  expected_classification:
    depth: cross-domain
- id: 1727fc77f8ff9c87df5999dbe02993adb225a1c7bc8d513432a2d5d2b635dc48
  input_fb:
    name: Feature-label Separation in Ml
    definition: In machine learning, input variables (features) and target variables
      (labels) must be clearly distinguished to enable predictive modeling. Features
      are the measurable inputs used to make predictions, while labels are the outcomes
      being predicted.
    mechanism: This is a descriptive model of how machine learning datasets are structured
      and organized. The principle describes the categorical relationship between
      input data (features) and output data (labels) in supervised learning contexts.
      Features and labels form a systematic partition of the dataset where features
      provide the information to predict, and labels provide the target values to
      be predicted.
    boundary: Applies to supervised learning datasets where input-output relationships
      are defined. Fails when the dataset is unsupervised (no labels), or when features
      and labels are not clearly separable in the data structure.
  expected_classification:
    depth: specialized
- id: 40a89464b8b940ea0a8cfc60fc71bceacba630515a4c481b61912f3c1b896f36
  input_fb:
    name: Semiotics and Language Studies
    definition: Semiotics and linguistics are distinct yet overlapping academic disciplines
      that both study systems of signs and meaning-making, though they approach these
      systems from different theoretical foundations and methodological perspectives.
      The relationship between these fields is characterized by shared concerns over
      language structure, communication, and interpretive frameworks.
    mechanism: The disciplines of semiotics and linguistics each offer unique theoretical
      lenses for analyzing signs and meaning, with semiotics emphasizing the broader
      theory of signs and their interpretive contexts, while linguistics focuses more
      narrowly on the structural and functional properties of language systems. These
      fields have historically developed in parallel, with some scholars working across
      both domains, particularly in areas like structural linguistics and literary
      theory.
    boundary: Applies when discussing academic disciplines that study signs and meaning-making
      in human communication. Fails when the focus is on purely technical or applied
      aspects of language (e.g., computational linguistics, speech therapy) or when
      the analysis is limited to one specific theoretical framework rather than comparing
      multiple approaches.
  expected_classification:
    depth: cross-domain
- id: 258df954350664dc0c57a5a461b6f79e90f9956eba427771a3f1af55f3d46970
  input_fb:
    name: Black Swan Risk Underestimation
    definition: Extreme events with high impact and low probability (black swans)
      are systematically underestimated in decision-making because conventional models
      assume thin-tailed distributions and ignore the role of rare, high-consequence
      occurrences. These events are often masked by visual representations that obscure
      their contribution to overall outcomes.
    mechanism: This is an empirical pattern, not a causal mechanism. The underestimation
      occurs because most decision-making frameworks and statistical models rely on
      normal or Gaussian distributions that assume finite moments and thin tails.
      In reality, many systems exhibit heavy-tailed distributions where rare events
      carry disproportionate weight. The visual presentation of data (e.g., bell curves)
      obscures the true impact of remote events, making them appear negligible even
      when they are highly consequential.
    boundary: Applies to systems where outcomes depend on rare, high-impact events
      and where decision-making frameworks assume normal distributions. Fails when
      decisions are based on purely additive or independent processes with well-defined
      scales, or when the system is sufficiently understood to predict extreme events.
  expected_classification:
    depth: universal
- id: e37358c65c8286048e77ff958c295f8407e500cc4fabc4882d4b2bae0643bd16
  input_fb:
    name: Web-driven Activism and Corporate Response
    definition: The phenomenon where online activism, enabled by web connectivity
      and digital communication tools, forces rapid corporate responses to social
      issues.
    mechanism: Web-based communication tools allow activists to broadcast their actions
      in real-time, creating immediate public pressure that compels companies to respond
      quickly to social movements rather than following traditional slower decision-making
      processes.
    boundary: Applies when activists use web-enabled digital tools to create immediate
      public pressure. Fails when traditional communication channels remain effective
      or when the web is not a factor in the response.
  expected_classification:
    depth: cross-domain
- id: f17449ccdda416aa08a90860793c5815f1a43966ac2bc2657d9df0ffef1144f5
  input_fb:
    name: Analogous Design Method
    definition: A creative problem-solving approach that involves looking beyond one's
      domain to find solutions in other industries or contexts by identifying parallels
      and applying cross-domain insights.
    mechanism: The method works by recognizing that problems in one domain may have
      already been solved in another, and by deliberately seeking out these solutions
      to adapt them to new contexts through systematic comparison and application.
    boundary: Applies when creative solutions are needed and cross-domain inspiration
      is possible. Fails when the problem is so unique that no analogous solutions
      exist or when domain expertise is so specialized that cross-domain insights
      are not useful.
  expected_classification:
    depth: cross-domain
- id: 5760c90f5f2d957c728e1bd8990c6b5270ecf510b82c8121d117df321d891eb9
  input_fb:
    name: Information Decay Principle
    definition: Information in systems decays rapidly and loses relevance over time,
      making it difficult to apply to current problems even when it was once relevant.
    mechanism: Information accumulates without regard to its current applicability,
      and the most urgently needed information decays fastest, creating a gap between
      available data and relevant solutions.
    boundary: Applies to systems where information accumulates without filtering for
      current relevance. Fails when information is properly managed and maintained
      for ongoing applicability.
  expected_classification:
    depth: cross-domain
- id: a457d04c7c1be29f5f19de4632f33bf36542be0c61549724cf9a7a4cccfa162a
  input_fb:
    name: Santa Fe Institute Creation
    definition: The Santa Fe Institute was established as an interdisciplinary research
      center to study complex systems and general principles in complexity sciences,
      addressing the limitations of reductionist approaches and the need for unified
      scientific foundations.
    mechanism: The institute was created to bridge disciplinary boundaries and promote
      unity of knowledge by bringing together diverse scientific approaches that had
      not yet been synthesized into foundational frameworks.
    boundary: Applies to research domains that cannot be adequately studied within
      single disciplines and require interdisciplinary approaches. Fails when the
      problem can be adequately addressed within existing disciplinary frameworks.
  expected_classification:
    depth: cross-domain
- id: fa4a5564cf92325a1a0511319d8ecad3e01340eb528b0640f659f2ca71b601b3
  input_fb:
    name: Iterative Design for Uncertain Environments
    definition: In environments characterized by high uncertainty and unpredictable
      customer needs, successful innovation requires rapid prototyping, continuous
      customer feedback, and iterative design cycles that adapt to emerging insights
      rather than relying on initial assumptions or long-term planning.
    mechanism: 'This is a practical heuristic for managing uncertainty in innovation:
      rapid iteration with customer feedback enables teams to discover viable solutions
      before committing to large-scale execution. The process involves building minimal
      viable products, testing with real users, and incorporating feedback to refine
      the solution. Each cycle reduces uncertainty by validating assumptions and identifying
      gaps between intended and actual user needs.'
    boundary: 'Applies when: (1) customer needs are unclear or rapidly changing, (2)
      the innovation environment is highly uncertain, and (3) teams have access to
      real users for feedback. Fails when: (1) customer needs are well-understood
      and stable, (2) resources are too constrained for iterative cycles, or (3) feedback
      loops are too slow to inform meaningful changes.'
  expected_classification:
    depth: universal
- id: 6f8b39f09797e7bc995efa468251a307105f17255dea5ccf2adc79682a192b65
  input_fb:
    name: Evolution Is Scalable
    definition: The principle that successful genetic variants (DNA) spread and become
      dominant while unsuccessful ones disappear, following a pattern similar to how
      successful cultural products like books or records become widespread.
    mechanism: Genetic variants that provide survival advantages or are simply fortunate
      enough to be passed on reproduce more frequently, spreading their DNA throughout
      populations, while less successful variants are lost to genetic drift or natural
      selection.
    boundary: Applies to biological evolution and cultural transmission where successful
      variants spread. Does not apply to cases where random chance or non-reproductive
      factors dominate.
  expected_classification:
    depth: cross-domain
- id: fcd187347df24229ff90b3071256869106f9d895bb2d76e46a73c0ebe160e9ac
  input_fb:
    name: Huxley's Methodical Learning Approach
    definition: A systematic and comprehensive approach to learning that involves
      studying diverse subjects deeply and methodically, combining self-directed study
      with formal knowledge acquisition.
    mechanism: The approach combines broad exploration across multiple disciplines
      with deep focus on specific areas, using self-education as a foundation for
      formal learning and practical application.
    boundary: Applies to individuals seeking comprehensive knowledge across diverse
      fields through disciplined study methods. Fails when learners lack the time,
      resources, or motivation for systematic study.
  expected_classification:
    depth: cross-domain
- id: 6fa06b47bf5fd6459ac8f44b4cba64cba628c1087cb35df9b3e3770e24e0d31a
  input_fb:
    name: Silent Evidence Bias
    definition: The tendency for observed outcomes to reflect only a subset of possible
      events, excluding those that are absent from records or awareness due to their
      non-occurrence or non-detection. This creates a systematic bias in interpretation
      and prediction.
    mechanism: Silent evidence arises when the absence of data or records creates
      a false impression of what is probable or significant. Events that never occur
      or are not documented (e.g., in fossil records, cultural artifacts, or regulatory
      enforcement) are not represented in the observed distribution, leading to skewed
      inferences about frequency, impact, or likelihood. This is not a sampling error
      but a fundamental limitation in how information is collected and interpreted.
    boundary: Applies when data collection or documentation is incomplete or selective,
      particularly in systems where absence of evidence is not recorded or acknowledged.
      Fails when all possible outcomes are equally likely to be observed or when the
      system is fully transparent and unbiased in its reporting.
  expected_classification:
    depth: cross-domain
- id: 7c139b954b3a9e389c42b04da81c7ea8de36840d22341a88c49a7104545bd4f3
  input_fb:
    name: Bridge Thinking Method
    definition: A mental approach that involves thinking both forward and backward
      to understand problems and make decisions, drawing parallels between the strategic
      thinking required in bridge and life decisions.
    mechanism: The method requires developing multiple models of thinking and applying
      them in reverse to understand potential outcomes and risks, similar to how bridge
      players consider both forward and backward moves in their strategy.
    boundary: Applies when making complex decisions that require strategic thinking
      and multiple model application. Fails when the situation is too simple or when
      only one perspective is sufficient.
  expected_classification:
    depth: cross-domain
- id: 71d759fd82c56f44d1af337f718935c6e1cf3b288ce3d5bc4b0c8dcf89b1cf78
  input_fb:
    name: Connect-the-dots Framework
    definition: A principle for creating engaging experiences by providing a framework
      and tools that allow users to complete and personalize the final product themselves.
    mechanism: The approach provides a foundation (dots) and simple creation tools,
      allowing users to fill in the gaps and reveal their own completed version, similar
      to how children connect dots to discover hidden images.
    boundary: Applies when users can engage with a partially completed framework that
      they can personalize or complete. Fails when users lack the ability to interact
      with or modify the provided framework.
  expected_classification:
    depth: cross-domain
- id: 18464dd5e0cac55caa573d9a62df550fd56ba3d184723717d6e556527f4b19e9
  input_fb:
    name: Network Robustness Through Structural Diversity
    definition: Networks maintain functional integrity across structural variations
      because their essential properties emerge from the collective relationships
      rather than specific node arrangements. The same network can be represented
      in multiple ways without altering its core behavior or meaning.
    mechanism: Network robustness arises from the invariance of essential properties
      under structural transformations. When a network's topology is altered (e.g.,
      through rotation, repositioning, or reweighting), the fundamental relationships
      and connectivity patterns that define its behavior remain preserved. This invariance
      allows for multiple valid representations of the same network structure, where
      the underlying system properties (such as centrality, clustering, or flow dynamics)
      are maintained despite surface-level changes in how the network is visualized
      or organized.
    boundary: Applies when the network's topological relationships and connectivity
      patterns are preserved under transformation. Fails when the transformation alters
      fundamental structural properties such as edge existence, node identity, or
      the essential flow of information or resources through the network.
  expected_classification:
    depth: cross-domain
- id: 1698b4fac32a878b5a1ba1a2a9e56e0a1bbe174c2aeb34e45252d5c93a4cc60c
  input_fb:
    name: Sensitive Dependence on Initial Conditions
    definition: Small differences in initial conditions lead to exponentially diverging
      outcomes in deterministic systems over time. This phenomenon creates fundamental
      limits on predictability in chaotic systems regardless of measurement precision.
    mechanism: In deterministic chaotic systems, nearby trajectories in phase space
      separate exponentially fast due to the system's sensitivity to initial conditions.
      This means that even infinitesimally small differences in starting points will
      eventually result in dramatically different system states, making long-term
      prediction impossible in practice.
    boundary: Applies to deterministic dynamical systems with exponential divergence
      of trajectories. Fails for linear systems where small differences remain bounded,
      or for stochastic systems where randomness dominates over deterministic sensitivity.
  expected_classification:
    depth: universal
- id: 01d4e99fa3e4afa735c75436d63f091d283384826fa650a2b282d480e2644712
  input_fb:
    name: Encyclopedic Referent Adjustment in Metaphor
    definition: The process of modifying existing conceptual frameworks to accommodate
      new metaphorical targets by adjusting the scope of existing referents to include
      new instances.
    mechanism: The metaphorical process involves broadening the scope of an existing
      encyclopedic referent (WAVE) to include a new target concept (construction bubble)
      by adjusting the prototypical characteristics to fit the new context while maintaining
      core semantic relationships.
    boundary: Applies when metaphorical targets require adjustment of existing conceptual
      frameworks to accommodate new meanings. Fails when the target concept is completely
      unrelated to existing referents or when the adjustment creates semantic incoherence.
  expected_classification:
    depth: domain
- id: 19e48dfc22c096e7e2af062a640eaac82395e1115ea2bd66061e5974ea2bc419
  input_fb:
    name: "Musique Concr\xE8te and Audio-visual Editing Techniques"
    definition: A foundational approach to audio-visual creation that uses recorded
      sounds and visual media as raw materials for artistic manipulation, pioneered
      by Pierre Schaeffer and others.
    mechanism: Musique concrete employed post-war recording tools like reel-to-reel
      tape decks and razor blade editing to create new sound forms through collage
      of found sounds, transforming recordings by altering speed, reversing, fragmenting,
      and superimposing sounds.
    boundary: Applies to the early development of electronic music and audio-visual
      culture from the 1940s onward, particularly in France. Fails when the techniques
      do not involve recorded media manipulation or when the work predates the development
      of these technologies.
  expected_classification:
    depth: specialized
- id: c1e887df66db9926fff28bf354544a40e1cd08662684d65ad5a85bf943783509
  input_fb:
    name: Human Perception and Design Principles
    definition: A framework for understanding how human perception and psychological
      principles influence design decisions and product resonance.
    mechanism: Designers intuitively understand that good design and quality matter,
      but deeper psychological principles like the Cathedral Effect and Biophilia
      Effect provide scientific explanations for why certain design elements resonate
      with people and promote well-being.
    boundary: Applies to design decisions where human psychological responses to visual
      elements are relevant. Fails when design principles don't account for cultural
      or individual differences in perception.
  expected_classification:
    depth: cross-domain
- id: f311b1f19e65b60fec94b00e2a35b4e95f4da80c2a5c708c6cd52b275ee69fcd
  input_fb:
    name: Contemporary Issue Resonance
    definition: Research topics that resonate with contemporary issues gain heightened
      relevance and urgency when they align with current social, political, or cultural
      agendas. These topics often experience renewed interest or expanded scope due
      to their timeliness and public attention.
    mechanism: This is an empirical pattern describing how research topics become
      more salient when they intersect with ongoing societal concerns or global events.
      The alignment with contemporary issues creates a feedback loop where the topic's
      relevance increases, leading to greater stakeholder engagement and academic
      focus. The timing and context of the issue's emergence determine its research
      potential and visibility.
    boundary: Applies when a research topic coincides with current social, political,
      or cultural attention. Fails when a topic lacks contemporary relevance or when
      the timing does not align with public or institutional agendas.
  expected_classification:
    depth: cross-domain
- id: 89fc5440f98af2ca9a21e29aec3b5a9c5201d75ac17bfbabe61e69f840b3caf6
  input_fb:
    name: Forward Motion Creation Principle
    definition: Creative work should focus on forward progress and shared abundance
      rather than competitive scarcity, emphasizing the importance of building upon
      existing ideas and collaborating with other creators.
    mechanism: Creation that emphasizes sharing and collaboration creates a positive
      feedback loop where ideas multiply and evolve, while creation focused on exclusive
      ownership limits creative potential and growth.
    boundary: Applies to creative processes where collaboration and knowledge sharing
      can enhance outcomes. Fails when creative work requires strict intellectual
      property boundaries or competitive positioning.
  expected_classification:
    depth: cross-domain
- id: b0796ef5a0585ac20afecce8a9d4d74cd1d94d8ddeb377518d7fd8ea4075140d
  input_fb:
    name: Surrealism's Influence on Graphic Design
    definition: The impact of surrealist artistic principles and forms on graphic
      design, particularly through biomorphic shapes and open composition techniques.
    mechanism: Surrealism's biomorphic forms and open composition were incorporated
      into product and graphic design, particularly during the 1950s, providing a
      poetic example of human spirit liberation and demonstrating how fantasy and
      intuition could be expressed visually.
    boundary: Applies to graphic design from the 1950s onward, particularly in the
      incorporation of biomorphic forms and open composition. Fails when the design
      does not incorporate surrealist elements or when the influence is not clearly
      documented.
  expected_classification:
    depth: cross-domain
- id: 031fcaad134c9653aa43e88e1c43b2ab30fd1d04549e9523a7b3b4b581d6a626
  input_fb:
    name: Daily Creative Practice As Strategy
    definition: A principle that emphasizes the importance of consistent, habitual
      daily practice as the foundation for achieving meaningful creative work.
    mechanism: Regular and reliable daily work creates the foundation for significant
      creative achievement, regardless of individual idiosyncratic tactics. The strategy
      of having a consistent practice allows talented individuals to overcome their
      limitations and achieve their desired outcomes.
    boundary: Applies to creative professionals who want to achieve consistent results.
      Fails when individuals focus on unique or unconventional methods rather than
      building reliable daily habits.
  expected_classification:
    depth: domain
- id: 641036067d7a4752f004e63030a765770c064b3fb80e30f6bc1faa16b9d1f662
  input_fb:
    name: Assertion As Design Foundation
    definition: An assertion is a proposed claim or hypothesis that serves as the
      starting point for design and creation processes, requiring testing to validate
      its truth.
    mechanism: Assertions function as the initial creative or design hypothesis that
      prompts testing and validation, with the process of testing being straightforward
      once the assertion is made.
    boundary: Applies to creative and design processes where initial hypotheses must
      be tested. Fails when assertions are made without any intention to test or validate
      them.
  expected_classification:
    depth: cross-domain
- id: ce3570e4a3f7f37b1a52d5a4ee77a52f66467ca082515727969f7c0901df4142
  input_fb:
    name: Scientific Communication Through Graphic Design
    definition: Graphic design serves as a bridge between complex scientific concepts
      and general understanding, requiring designers to translate abstract data into
      accessible visual forms. The principle emphasizes that effective design must
      balance functional clarity with aesthetic appeal when communicating scientific
      content.
    mechanism: 'Designers working with scientific content must navigate between two
      domains: the technical precision required for accurate representation and the
      communicative clarity needed for broad comprehension. This involves selecting
      appropriate visual elements, managing information hierarchy, and ensuring that
      the design supports the scientific message without obscuring it. The process
      requires both analytical thinking (to understand the data) and creative problem-solving
      (to present it effectively).'
    boundary: Applies when designers work with scientific or technical content that
      needs to be made accessible to non-expert audiences. Fails when the design is
      purely aesthetic or when scientific content is not the primary concern, such
      as in commercial branding or artistic expression.
  expected_classification:
    depth: cross-domain
- id: 02969b26fb6f71de4c59ffc9966791fcebe6458bdde4b5fd550dd74b3a033361
  input_fb:
    name: Types of Brand Names
    definition: A taxonomy of different approaches to brand name creation, including
      names based on geography, history, founders, and product descriptions.
    mechanism: Brand names can be derived from various sources including geographic
      origins (like Cisco from San Francisco), historical or mythical references (like
      Nike from Greek mythology), founder names (like Adidas from Adolf Dassler),
      and product descriptions (like Pinterest describing pinning functionality).
    boundary: Applies to the categorization of brand naming approaches and their sources.
      Fails when applied to specific naming decisions or when names don't fit into
      these categories.
  expected_classification:
    depth: domain
- id: 68ec3a5407d1d95e1e33cf8b14088f5ad1a96db70ef696ae263dd11ad21f093e
  input_fb:
    name: Levy-stable Distribution in Bacterial Mutations
    definition: The occurrence of extremely large mutants in bacterial colonies follows
      a Levy-stable distribution pattern, as demonstrated by Mandelbrot's 1952 thesis
      and supported by observations of clustering phenomena in molecular biology.
    mechanism: The distribution emerges from thermodynamic principles where entropy
      maximization occurs without the constraints of second moment limitations, creating
      heavy-tailed distributions that are stable under convolution operations.
    boundary: Applies when bacterial mutation patterns exhibit clustering behavior
      and extreme value occurrences. Fails when mutations follow normal distribution
      or when constraints on moments are present.
  expected_classification:
    depth: universal
- id: 54d9bd20a8b58cb6c7c945be8e46fbd57c072302e9fd73908f79c2ebc6d5648e
  input_fb:
    name: Work As Gift Principle
    definition: Creative work should be viewed as a gift to be made rather than judged,
      with the creator's role being to produce rather than evaluate their output.
    mechanism: The passage argues that artists don't know in advance whether their
      work will be of interest, and that genius can only be recognized in retrospect,
      suggesting that the act of creation itself is more important than judgment of
      the result.
    boundary: Applies to creative work where the creator's role is to make rather
      than judge. Fails when the creator is expected to evaluate their own work for
      external purposes.
  expected_classification:
    depth: cross-domain
- id: 03dd583f84e48c936a3f2e3e2fe775dfc635cc54988d31adc2a10ac813359faf
  input_fb:
    name: Traditional Japanese House Design Principles
    definition: Traditional Japanese houses are designed with specific modular components
      and spatial arrangements that create optimal living conditions through natural
      ventilation, thermal regulation, and ergonomic comfort.
    mechanism: The tatami mat system creates a horizontal modular framework that determines
      room layout and spatial organization, while vertical components like sliding
      doors and modular elements enable flexible room configurations. Natural ventilation
      is achieved through strategically placed openings that allow cool air in and
      hot air out, with thermal regulation managed through room size adjustment and
      brazier heating in winter.
    boundary: Applies to traditional Japanese residential architecture where tatami
      mats and modular components form the fundamental design system. Fails when applied
      to modern non-traditional construction methods or when tatami-based modular
      systems are not implemented.
  expected_classification:
    depth: domain
- id: 195c09cd809d783fec4adb0217f7a35888010e3ed20a886fe513f57febf757cb
  input_fb:
    name: Intermediate Representation (ir) As Middleware
    definition: An intermediate representation (IR) serves as a middleware layer that
      bridges the gap between framework developers and hardware vendors by providing
      a standardized interface for code translation.
    mechanism: IRs act as a translation layer where framework developers convert their
      code into a standardized intermediate format, and hardware vendors implement
      support for this single IR format instead of multiple framework-specific interfaces.
    boundary: Applies when frameworks need to support multiple hardware backends and
      hardware vendors need to support multiple frameworks. Fails when the IR format
      is not well-defined or when hardware vendors cannot implement the required IR
      interface.
  expected_classification:
    depth: cross-domain
- id: d721f56acfa0128bfe3e11dcc5051c8e2d0d1bf232a289ce784991ca53c9d2a2
  input_fb:
    name: Higher Level Processing Design Principle
    definition: A design approach that uses deeper cognitive processing to transcend
      mundane experiences and create transformative communication by revealing invisible
      connections.
    mechanism: Higher level processing expands viewer experience beyond surface-level
      engagement, enabling the discovery of conceptual solutions that tell stories
      through invisible connections, which then create relevant meaning and energized
      communications.
    boundary: Applies when design needs to express transformational shifts and create
      memorable communications. Fails when surface-level solutions are sufficient
      or when invisible connections cannot be meaningfully identified.
  expected_classification:
    depth: cross-domain
- id: 0039c65fcd2f7561de1a7f25c8ce2bf09de808e01e01ff5675de3e11b2ffd3f4
  input_fb:
    name: Mental Snapshot to Stereotype Transition
    definition: The cognitive process by which immediate visual perception quickly
      transforms into stereotypical mental representations, discarding physical details
      in favor of abstract concepts and assumptions.
    mechanism: When we observe something, our mind rapidly processes the visual input
      and shifts from detailed physical recognition to applying pre-existing mental
      categories and stereotypes, which are more efficient for quick interpretation.
    boundary: Applies to visual perception and cognitive processing in the first second
      after seeing something. Fails when detailed visual analysis is required or when
      encountering novel situations that don't fit existing categories.
  expected_classification:
    depth: domain
- id: 1431adb9f24bf3a1cb1b683d59355181914eb9c84d3327e602afee8146e5d221
  input_fb:
    name: Model Adaptation to Reality Shifts
    definition: Effective models must adapt when underlying reality changes, as demonstrated
      by the transition from Newtonian to relativistic physics. The principle describes
      how models that once accurately predicted phenomena become inadequate when fundamental
      conditions shift.
    mechanism: Models are representations of reality that function within specific
      constraints and assumptions. When those assumptions no longer reflect actual
      conditions, the model's predictive power diminishes. The adaptation process
      requires either modification of the model's parameters or replacement with a
      more accurate framework that better aligns with new empirical observations.
    boundary: Applies when a model's foundational assumptions no longer match observed
      reality. Fails when the model's domain of applicability remains unchanged or
      when the shift in reality is too subtle to affect predictions.
  expected_classification:
    depth: universal
- id: 2aad55781359a32a4b0da08015b459aa8f8594a1fe6365e9e72efe313e7e15f7
  input_fb:
    name: Nonlinearity of Wealth
    definition: Wealth concentration leads to disproportionate impacts on ecosystems
      and species, where extreme consumption of specific products causes harm that
      scales nonlinearly with the concentration of use.
    mechanism: When wealth becomes concentrated in specific consumption patterns,
      the demand for particular products (like tuna) creates cascading effects that
      amplify environmental damage beyond proportional relationships.
    boundary: Applies when wealth concentration drives specific product consumption
      that affects ecosystems. Fails when consumption patterns are diversified or
      when the relationship between consumption and environmental impact is linear.
  expected_classification:
    depth: cross-domain
- id: 762cf2860bb39b28e4d60e76c980911bedd3809e6a5acdca430a19cb634588c4
  input_fb:
    name: Symbolic Pattern Recognition
    definition: "The human mind naturally seeks to identify and categorize recurring\
      \ patterns across diverse domains, whether in mathematics, natural phenomena,\
      \ or cultural artifacts. This principle describes how abstract symbolic structures\
      \ (like \u03C0 or circular forms) become anchors for broader conceptual frameworks\
      \ that span multiple fields of inquiry."
    mechanism: "This is an empirical pattern describing how humans consistently recognize\
      \ symbolic structures (such as \u03C0 or circular forms) as fundamental organizing\
      \ principles that appear across seemingly unrelated domains\u2014mathematics,\
      \ physics, visual perception, and cultural narratives. The recognition is not\
      \ necessarily causal but reflects a deep-seated human tendency to find unity\
      \ in diversity, where one pattern becomes a lens through which other phenomena\
      \ are interpreted."
    boundary: "Applies when abstract symbolic structures (like \u03C0, circles, or\
      \ mathematical constants) are recognized as organizing principles across domains.\
      \ Fails when patterns are purely coincidental or when the symbolic structure\
      \ lacks conceptual coherence or generative power across fields."
  expected_classification:
    depth: cross-domain
- id: fd893b472264a01c8550e3f634612d511162224b5b475bb27ac80617bc84d7cb
  input_fb:
    name: Context-dependent Meaning Construction
    definition: Meaning is not inherent in communication elements but emerges through
      the dynamic interaction between the communicator's intent, the audience's cognitive
      frameworks, and the situational context. The brain actively interprets messages
      by mapping them onto existing mental models and cultural narratives.
    mechanism: The human brain processes communicative content by integrating it with
      pre-existing knowledge structures, including personal beliefs, cultural values,
      and situational expectations. This integration occurs through a process of pattern
      matching and narrative reconstruction, where the same message can be interpreted
      differently depending on the audience's background, the medium used, and the
      broader social or political environment in which it is received.
    boundary: Applies when communicative content is interpreted within a cognitive
      and cultural framework. Fails when communication is purely symbolic or abstract,
      with no connection to existing mental models or when the audience has no shared
      context (e.g., alien communication, pure mathematical notation).
  expected_classification:
    depth: cross-domain
- id: 322c1ed0023485f298865312657d3caad0314275fa45642fd039ab0a0567dbc7
  input_fb:
    name: Learning Through Failure Process
    definition: A fundamental learning mechanism where individuals repeatedly attempt
      tasks, experience failure, analyze outcomes, adjust approaches, and try again
      to develop competence.
    mechanism: The process involves cycles of trying, failing, analyzing the failure,
      adjusting the approach, and retrying, which builds skill through iterative refinement
      and conceptual breakthroughs.
    boundary: Applies to skill development and learning from experience. Fails when
      the learning environment does not allow for repeated attempts or when feedback
      is not available to guide adjustments.
  expected_classification:
    depth: universal
- id: fd19d78b23d8a25498cbd0b09d9186d189b4006731ac69f30a36ffbb70094a9b
  input_fb:
    name: Music with Balls Integration
    definition: A multimedia video composition that integrates musical, sculptural,
      and cinematic elements into a synaesthetic experience combining aural, visual,
      and kinetic design information.
    mechanism: The composition synthesizes three distinct artistic disciplines - Terry
      Riley's music, Ario Acton's sculpture, and John Coney's video mixing - into
      a single dialectical synthesis that creates a transcendent experiential design
      through nonverbal energies.
    boundary: Applies to the specific multimedia video project 'Music With Balls'
      created in 1968-1969. Fails when the integration of these specific artistic
      elements is not achieved or when the work does not maintain its synaesthetic
      structure.
  expected_classification:
    depth: cross-domain
- id: d4e6ced6713f4e1b3a9d32a69471f82f48553d4603b45dc6b6dbacd74ddb2188
  input_fb:
    name: Biosecurity Surveillance Regime
    definition: A new paradigm of public health governance that integrates digital
      technologies, public health authority, and police power to create unprecedented
      surveillance and control mechanisms.
    mechanism: The regime emerges through the welding of digital tracking systems,
      public health mandates, and law enforcement powers that together enable continuous
      monitoring and authoritarian control of society.
    boundary: Applies to the transformation of public health governance during the
      pandemic era. Fails to describe the specific mechanisms or implementation details
      beyond the conceptual framework.
  expected_classification:
    depth: cross-domain
- id: 10c80e6e778d6a1a9bd3b520bb122d70ee18328d485763008443216bebbf294c
  input_fb:
    name: N-gram Token Prediction
    definition: A simple method for token prediction that selects sequences of n adjacent
      tokens from earlier text, stores them in a n-gram table, and uses pattern matching
      to propose the next token(s).
    mechanism: The n-gram approach builds a statistical model of token sequences by
      counting adjacent token combinations in training text, then uses these patterns
      to predict the most likely next tokens based on the current context.
    boundary: Applies when token sequences can be meaningfully grouped into adjacent
      n-grams. Fails when the context is too sparse or when long-range dependencies
      are required for accurate prediction.
  expected_classification:
    depth: specialized
- id: c55affaad586276ee157f8f518ff57352cf7ce77f4d9acd60c2897d55b5f9d7b
  input_fb:
    name: Electoral Photography As Photogenic Representation
    definition: Electoral photography functions as a photogenic medium that simultaneously
      expresses the voter as both photographed subject and active participant in the
      democratic process, creating a paradoxical relationship between representation
      and agency.
    mechanism: The photographic medium creates a dual role for the voter - both as
      the subject being photographed and as the active agent who 'elects himself'
      by delegating his 'race' through physical transference, while simultaneously
      presenting the candidate as a heroic figure embodying political essence.
    boundary: Applies specifically to electoral photography contexts where candidates
      are portrayed as both heroic figures and representatives of political ideologies.
      Fails when applied to non-electoral or non-photographic political communication.
  expected_classification:
    depth: cross-domain
- id: 7c8957735270384af1ed42677816bc93a076574de2ea939972fe50a022d0d127
  input_fb:
    name: Brand Influence on Truth Perception
    definition: A psychological phenomenon where the source or brand associated with
      a statement affects how people judge its truthfulness, even when the statement
      is obviously correct.
    mechanism: When people are told that a clearly true statement (like 'the sun is
      yellow') comes from a brand or political organization, their trust in that statement
      decreases. The source of information becomes a factor that influences perception
      of truth, causing people to question even obvious facts when they're associated
      with potentially biased sources.
    boundary: Applies when people's perception of truth is influenced by the source
      or brand of information, particularly when the source is perceived as potentially
      biased or untrustworthy. Fails when the source is neutral or when people's truth
      judgments are not influenced by brand association.
  expected_classification:
    depth: cross-domain
- id: d50b7544117af83456cf770c580b7d20e95888b2e97192884dd183c0e23df626
  input_fb:
    name: Symbolic Resonance Through Mythic Narrative
    definition: Mythic stories and universal symbols can be repurposed as design elements
      to create powerful, culturally resonant communication. The principle describes
      how deeply embedded cultural narratives can be abstracted into visual or conceptual
      forms that carry emotional weight and symbolic meaning beyond their original
      context.
    mechanism: This is a descriptive model of how design elements can be structured
      to leverage cultural memory. Mythic narratives like Aesop's fables contain archetypal
      elements (the hero, the helper animal, the moment of recognition) that are universally
      understood. When designers abstract these into visual or conceptual forms, they
      tap into pre-existing emotional and cognitive frameworks that guide interpretation
      without explicit explanation.
    boundary: Applies when the mythic or symbolic content is widely recognized and
      carries strong cultural associations. Fails when the narrative is too obscure,
      culturally specific, or lacks universal archetypal elements that can be abstracted
      into design. Also fails when the symbolic content is too literal or does not
      translate into a meaningful visual or conceptual form.
  expected_classification:
    depth: cross-domain
- id: 9929e35c11cddc08e0b863acc036ce14ba1b4076c8d09489cba99984390a3cec
  input_fb:
    name: Symbolic Creation and Mathematical Discovery
    definition: A principle describing how mathematical discovery emerges from the
      same fundamental mechanism of symbolic creation that underlies human language
      development.
    mechanism: Mathematical discovery involves the introduction of new symbols to
      condense recurring expressions, creating new semantic fields that free mental
      movement from obsessional presences, following the same pattern as human language
      development from primitive spatial fields to semantic spaces.
    boundary: Applies to mathematical discovery processes and the relationship between
      symbolic creation and semantic expansion. Fails when mathematical work does
      not involve the condensation of recurring expressions into new symbols or when
      it does not free mental movement from constraints.
  expected_classification:
    depth: cross-domain
- id: ba3907cdfced61f598c0a5fed6dd7d9974e6b566f21602012773d019ddad970f
  input_fb:
    name: Quantum Cognitive Effects in Survey Design
    definition: A theoretical framework explaining how question order in surveys fundamentally
      changes respondents' mental states and thinking patterns through quantum-like
      cognitive processes.
    mechanism: Survey questions influence respondents' thinking by collapsing superposed
      mental states, where respondents exist in multiple potential viewpoints simultaneously
      until a question forces commitment to one perspective, fundamentally reshaping
      their mental framework rather than merely revealing existing opinions.
    boundary: Applies to survey design where question order and framing can significantly
      impact responses. Fails when survey designers do not account for quantum cognitive
      principles or when respondents are not in superposition states.
  expected_classification:
    depth: cross-domain
- id: a519b0230aab1bb65e1f9b51a16e9cefe1d0ce4dd9d4cd0039d71b3ac3edf657
  input_fb:
    name: Visual Metaphor and Embodiment in Narrative
    definition: Visual metaphors in narrative art integrate bodily experience and
      emotional states to communicate abstract concepts through concrete imagery.
      The principle describes how visual elements like color, form, and metaphorical
      figures embody psychological and physical conditions in storytelling.
    mechanism: Visual metaphors function as embodied representations that translate
      internal states into external visual form. When artists depict illness, emotion,
      or transformation, they use visual symbols (e.g., red for anger, pitchforks
      for pain) to make abstract experiences tangible. These metaphors are not merely
      symbolic but are rooted in sensory and emotional perception, allowing viewers
      to empathize with the depicted condition through shared visual language.
    boundary: Applies when visual narratives incorporate bodily or emotional states
      as central themes. Fails when visual elements are purely decorative or unrelated
      to narrative content, or when the artwork lacks an embodied or experiential
      dimension.
  expected_classification:
    depth: cross-domain
- id: ddc3f974d46918bdb5340f48635af0e211bcab7432fb0a282579a38a209ba704
  input_fb:
    name: Controlled Experimentation
    definition: Systematic testing with control groups enables accurate measurement
      of intervention effects by comparing treated and untreated conditions. This
      approach isolates causal impact from confounding variables and spurious correlations.
    mechanism: 'Controlled experimentation works by creating parallel conditions:
      one group receives the treatment (e.g., new product feature, marketing campaign)
      while a comparable group (control) does not. The difference in outcomes between
      these groups reveals the true effect of the intervention. This method eliminates
      selection bias and accounts for external factors that might otherwise appear
      to explain results.'
    boundary: 'Applies when: (1) a clear intervention can be isolated and (2) a comparable
      control condition can be established. Fails when: (1) the intervention affects
      the control group indirectly (contamination), (2) randomization is impossible
      due to ethical or practical constraints, or (3) the outcome is influenced by
      factors that vary across groups in unpredictable ways.'
  expected_classification:
    depth: cross-domain
- id: 3328530feaea98d122587c7064eed3ffe1fa2a9d3c3fc6a31799ccbea90637a5
  input_fb:
    name: Human-ai Collaboration Framework (2)
    definition: Human-AI systems operate through a structured interaction where AI
      handles routine tasks and data processing while humans provide strategic oversight,
      creative input, and contextual judgment. This framework enables humans to focus
      on uniquely human capabilities while leveraging AI for efficiency gains.
    mechanism: The framework operates through a division of labor where AI systems
      process information, detect patterns, and execute standardized tasks with high
      accuracy, while humans engage in higher-order reasoning, ethical judgment, and
      adaptive decision-making. AI systems provide feedback loops that inform human
      strategy, and humans maintain control over the ultimate direction and value
      alignment of AI outputs.
    boundary: Applies when AI systems are designed to complement human capabilities
      rather than replace them. Fails when AI systems are deployed without human oversight
      or when humans lose agency in decision-making processes. Also fails when the
      human-AI interface lacks clear role definition or feedback mechanisms.
  expected_classification:
    depth: cross-domain
- id: c005d2d5e2e2ebe5b3c7ea86976ecaedf0efaee9f7bba77ac44acb89f97b995c
  input_fb:
    name: Strategic Battle Selection
    definition: Effective change implementation requires focusing on achievable opportunities
      rather than pursuing every possible improvement. The principle emphasizes selective
      engagement where resources and influence can be most effectively deployed.
    mechanism: This is a practical heuristic for resource allocation and influence
      maximization. It prescribes choosing battles that demonstrate clear value and
      have realistic chances of success, rather than attempting to change every aspect
      of a system simultaneously. The approach recognizes that showing tangible benefits
      in select areas builds momentum and credibility for broader adoption.
    boundary: Applies when implementing change in complex organizational systems where
      complete transformation is not feasible. Fails when the selected opportunities
      are too small to demonstrate meaningful impact or when the chosen battles are
      not strategically aligned with core objectives.
  expected_classification:
    depth: cross-domain
- id: b4a257b61dc360f841816096833ed45ef4d518ea92cb6a1254f8f8b90fc6d90a
  input_fb:
    name: Tulip Generation with Bitcoin-influenced Gan
    definition: A generative adversarial network trained on tulip image data where
      bitcoin value influences the color and pattern characteristics of generated
      tulips, creating a digital recreation of the Dutch Tulip Mania era.
    mechanism: The GAN learns to generate tulip images with color and stripe patterns
      that correlate with bitcoin price levels, where low prices favor pale/white
      tulips and high prices favor more colorful/striped tulips, mimicking historical
      tulip bulb valuation patterns.
    boundary: Applies when using GANs to generate tulip images with bitcoin price-dependent
      characteristics. Fails when the bitcoin influence is not properly calibrated
      or when the training data doesn't capture the historical price patterns.
  expected_classification:
    depth: cross-domain
- id: 26bbca18919e596ab54cb74d5bf361dd44b21de0cd3476d8e16c90d2a7ee55e5
  input_fb:
    name: Parallel Editing Technique
    definition: A narrative method that interweaves multiple simultaneous events or
      scenes to create thematic or emotional contrast and enhance storytelling through
      juxtaposition.
    mechanism: Multiple scenes or events are edited together in parallel to show different
      temporal or spatial contexts that relate thematically, allowing viewers to draw
      connections between seemingly unrelated situations through their shared narrative
      elements.
    boundary: Applies in film and television where multiple storylines can be effectively
      contrasted or connected thematically. Fails when the medium cannot support simultaneous
      scene presentation or when the thematic connections are not clear to viewers.
  expected_classification:
    depth: specialized
- id: 9e18753eac72bcc8d3123a4d6d87240ee352346ebe717bb6f9e16f90dcbfdddb
  input_fb:
    name: Semiotic Generalization in Idea Construction
    definition: The process by which individual qualities or ideas merge into broader
      categories, becoming part of new conceptual frameworks while maintaining their
      essential character.
    mechanism: Ideas generalize by merging similar qualities and becoming part of
      new quale-consciousness or idea categories, yet retain their fundamental identity
      and character as what they are in themselves.
    boundary: Applies when ideas merge into broader conceptual categories but maintain
      their essential nature. Fails when ideas lose all individual characteristics
      and become indistinguishable.
  expected_classification:
    depth: cross-domain
- id: e0d33a5e2f1738c1f312b614889cd7fc35b96f4866bf26a00d0c3350e0267181
  input_fb:
    name: Active Vision Theory of Human Perception
    definition: A cognitive framework treating graphic designs as tools that enhance
      and extend human brain capabilities, particularly through visual pattern recognition
      and mental image enhancement.
    mechanism: Visual thinking tools leverage the brain's visual processing capabilities
      to interpret graphical patterns, even simple scribbles, by combining external
      visual representations with internal cognitive structures to solve problems
      more effectively than mental imagery alone.
    boundary: Applies to graphic design as cognitive tool in the Internet age where
      humans rely heavily on external cognitive aids. Fails when visual tools are
      not integrated with mental processing or when the visual system is not engaged.
  expected_classification:
    depth: cross-domain
- id: d019b8e04f4d8dcf9fd76b7183bcc7e0b16e78d4bcd49b339ddf258ec6c994e3
  input_fb:
    name: Data-driven Decision Making Framework
    definition: Effective decision-making in complex systems requires integrating
      multiple data sources and analytical approaches to capture both quantitative
      trends and qualitative insights. The principle describes a structured methodology
      for combining statistical analysis, user experience feedback, and contextual
      factors to inform strategic choices.
    mechanism: 'This is a descriptive model of how decision-making processes can be
      organized across different domains. The framework integrates three key components:
      (1) empirical data collection through controlled experiments and surveys (e.g.,
      preference testing, time tracking), (2) analytical methods for pattern recognition
      (e.g., moving averages, statistical hypothesis testing), and (3) contextual
      understanding through qualitative interviews and social data analysis (e.g.,
      user experience interviews, sentiment analysis). These elements are not causally
      linked but form a structured approach to decision-making that spans multiple
      analytical domains.'
    boundary: Applies when decisions require integration of multiple data types and
      analytical methods. Fails when decisions are based on single data sources or
      when the integration of different analytical approaches is not feasible due
      to resource constraints or domain-specific limitations.
  expected_classification:
    depth: cross-domain
- id: 487a7247610b7cd7612d17332bae381d2b5abba41b4293947a969c157cf2e1dd
  input_fb:
    name: 'The Checklist Manifesto: How to Get Things Right'
    definition: A book that provides a powerful exposition of the value and costs
      of paying attention to systematic processes and documentation in complex tasks.
    mechanism: The book demonstrates how structured approaches like checklists can
      prevent errors and improve outcomes in high-stakes environments by ensuring
      systematic attention to critical steps.
    boundary: Applies to complex tasks where systematic processes can prevent errors
      and improve outcomes. Fails when the task is simple or the checklist is not
      properly implemented.
  expected_classification:
    depth: cross-domain
- id: f33f327d80d924556ec85bca2c246bba92ee4c3f9329bfa346cc0fd3baeec8c4
  input_fb:
    name: Trauma Response and Adaptive Coping
    definition: Individuals respond to overwhelming stress or trauma through a combination
      of psychological avoidance, physiological dysregulation, and adaptive social
      strategies. These responses reflect deep neural and hormonal changes that persist
      long after the initial event, requiring both internal and external resources
      to restore balance.
    mechanism: Trauma creates lasting neurobiological changes that affect the nervous
      system and brain chemistry, leading to persistent physiological arousal and
      emotional dysregulation. When individuals experience overwhelming stress, they
      often engage in psychological avoidance behaviors (such as denial or dissociation)
      to manage the intensity of their memories and emotions. These responses are
      not merely conscious choices but are rooted in survival mechanisms that activate
      when normal coping strategies are insufficient. Social connections and supportive
      relationships can act as protective factors that buffer the impact of trauma
      by providing emotional stability and reducing the need for excessive internal
      regulation.
    boundary: Applies when individuals have experienced or are experiencing severe
      psychological stress or trauma that affects their nervous system and emotional
      processing. Fails when the stressor is not traumatic or when individuals have
      access to effective therapeutic intervention that addresses root causes rather
      than just surface symptoms.
  expected_classification:
    depth: cross-domain
- id: 03a38c759c13d5c047deb207709b5d1bf63a1321aae2aa10462470b138290cf3
  input_fb:
    name: Design System Communication Strategy
    definition: Design systems require deliberate communication and promotion strategies
      to ensure adoption and usability across teams, as they are not naturally visible
      or accessible without intentional effort. The principle describes how design
      systems must be actively surfaced and integrated into workflows to be effective.
    mechanism: 'This is a practical heuristic for system adoption: teams must create
      deliberate moments or integration points to introduce design systems to users.
      Without a launch or visible trigger, teams must find organic opportunities to
      surface the system, such as embedding documentation in design tools or making
      it part of the development workflow. The strategy involves making the system
      discoverable and accessible to all stakeholders, not just those who actively
      seek it out.'
    boundary: Applies when design systems are implemented as internal tools or documentation
      that are not naturally visible to users. Fails when systems are embedded in
      workflows that make them inherently discoverable or when teams have no need
      to communicate or promote the system.
  expected_classification:
    depth: domain
- id: 1ee73a2fce3ddd9e9b03c356a8ee440b2bd9b881a2cd6c462b434ef2cd0915fa
  input_fb:
    name: Analogical Reasoning in Problem-solving
    definition: A problem-solving strategy that involves drawing conclusions from
      similarities between a current problem and previously solved problems or familiar
      situations.
    mechanism: Problem-solvers use known analogies to make plausible conjectures about
      solutions, recognizing that while analogical conclusions are not certain, they
      provide useful starting points for problem-solving.
    boundary: Applies when problems can be related to previously solved cases or familiar
      situations. Fails when analogies are too dissimilar or when the problem structure
      doesn't support analogical reasoning.
  expected_classification:
    depth: cross-domain
- id: 014c0f9cd799c8e9f39d5b2c468e32f1436be10dbbcd61a808d02a427ca5af3a
  input_fb:
    name: Movie Poster Typography Size Regulation
    definition: A prescriptive rule in movie poster design that requires names to
      be 20% of title size, creating specific typographic constraints.
    mechanism: The regulation creates a mathematical relationship between title and
      name sizes that results in very skinny, very tall typography as a compliance
      artifact.
    boundary: Applies to movie poster design where names must be exactly 20% of title
      size. Fails when the regulation doesn't apply or when other design constraints
      override it.
  expected_classification:
    depth: domain
- id: 01f032f04c1a06f6eb297a30bc806253b82b37a4e215315101fc59547fa9d340
  input_fb:
    name: Surrealist Film Techniques
    definition: A descriptive model categorizing surrealist cinema as a film movement
      that incorporated bizarre and fantastical imagery to represent the grotesque
      nature of everyday reality.
    mechanism: Surrealist films employed bizarre visual elements, dream-like sequences,
      and unconventional narrative structures to challenge conventional representations
      of reality and reveal hidden psychological truths about human experience.
    boundary: Applies to films from the 1920s-1930s that deliberately incorporated
      surreal elements and psychological themes. Fails to categorize films that do
      not employ surrealist visual or narrative techniques or that focus on realistic
      representation.
  expected_classification:
    depth: domain
- id: 4022eb69e852a48ee6a3f6794e9130c7c79a65d0a053a9ec0c505b408e054f66
  input_fb:
    name: Design Thinking As Systems Approach
    definition: A human-centered problem-solving methodology that addresses complex,
      multi-faceted problems by understanding system interactions and user experiences
      across multiple domains.
    mechanism: Design thinking moves beyond solving isolated problems to understanding
      how different problems interact within systems, requiring holistic analysis
      of user experiences and system dynamics rather than linear problem-solving approaches.
    boundary: Applies to complex, multi-faceted problems where user experience and
      system interactions are critical. Fails when applied to simple, isolated problems
      or when system complexity is not understood.
  expected_classification:
    depth: cross-domain
- id: 749e4584e36241cc2baf40a10a5b9a2d910efc64678619cb8e2df77631c4279b
  input_fb:
    name: Liebig's Law of the Minimum in Railway Construction
    definition: The principle that the success of a railway project depends on overcoming
      the most limiting factor in its construction, with the weakest link determining
      the overall capacity and efficiency of the entire system.
    mechanism: Railway construction success requires identifying and addressing the
      most constraining factor (such as geography, labor, or logistics) rather than
      optimizing all elements equally, since the weakest constraint limits the entire
      system's performance.
    boundary: Applies specifically to large-scale infrastructure projects where bottlenecks
      can be identified and addressed. Fails when the limiting factor is not properly
      diagnosed or when multiple constraints are interdependent.
  expected_classification:
    depth: cross-domain
- id: 5c066ae360f0b9a86d64d73afbc524bb039521b1b61c5266e3ba859e121a75e9
  input_fb:
    name: Diverse Perspectives Drive Innovation
    definition: Workplace diversity of attitudes, perspectives, and values fosters
      innovation, creativity, and productivity by introducing varied problem-solving
      approaches and reducing groupthink. The principle recognizes that diverse teams
      are more likely to generate novel solutions than homogeneous ones.
    mechanism: This is an empirical pattern, not a causal mechanism. Research consistently
      shows that teams with varied backgrounds, viewpoints, and experiences produce
      more creative outputs and better problem-solving outcomes. The relationship
      between diversity and innovation is observed across multiple organizational
      contexts, but the specific causal pathways are not isolated in the passages.
      The pattern reflects the broader understanding that cognitive diversity enhances
      collective intelligence and adaptive capacity.
    boundary: Applies to organizations where diverse perspectives can be meaningfully
      integrated and where team members are open to different viewpoints. Fails when
      diversity is superficial or when team members are not encouraged to express
      differing opinions, or when organizational culture suppresses dissenting views.
  expected_classification:
    depth: cross-domain
- id: 539ef8df8a4f7dcb25f03cdba4cd9a39cd26a1d9e85dbc7b81a4a09c46b7ea6c
  input_fb:
    name: System Autonomy and Goal-directed Behavior
    definition: A principle describing how large systems develop their own internal
      goals and direction, independent of their original design or human intentions
    mechanism: Large systems develop internal goal-directed behavior that is independent
      of their original design intentions, where the system's own internal logic and
      structure drive it toward specific outcomes regardless of external input or
      human control.
    boundary: Applies to large complex systems that have developed internal logic
      and goal structures. Fails when systems lack complexity or when human control
      is maintained through direct intervention.
  expected_classification:
    depth: cross-domain
- id: c8bc7ec2a5a7e809d7f8742cffae297c89256c391ac7956d0f4e4c8b9ca00034
  input_fb:
    name: Computing Growth and Moore's Law
    definition: The exponential growth pattern in computing power where computational
      capacity doubles approximately every 18-20 months, enabling sustained increases
      in computing capability over time.
    mechanism: Computing hardware improvements follow an exponential growth pattern
      where each generation of machines provides roughly double the computational
      capacity of the previous generation, allowing for continuous expansion of computing
      power.
    boundary: Applies to computing systems where hardware improvements follow exponential
      growth patterns. Fails when hardware development stagnates or follows different
      growth models.
  expected_classification:
    depth: universal
- id: 1bfe00cdaf7233a26836910798dcc51fb6ca2d116c05bca49ed94ec5cb7521fb
  input_fb:
    name: Metaphorical Framing for Emotional Resonance
    definition: Metaphors that evoke specific emotional states or situational feelings
      are more effective at communicating abstract concepts than literal descriptions.
      These comparisons leverage familiar emotional experiences to make unfamiliar
      situations more relatable and immediately understandable.
    mechanism: This is a descriptive model of how metaphor functions in communication.
      Metaphors work by mapping emotional or experiential domains (like fear, sadness,
      or confusion) onto abstract concepts through shared structural elements. The
      emotional resonance of the comparison creates an immediate cognitive bridge
      between the unfamiliar and the familiar, allowing the audience to grasp the
      intended meaning without needing explicit explanation.
    boundary: Applies when the metaphor connects to a shared emotional or experiential
      reference point that is widely understood. Fails when the metaphor is culturally
      or personally idiosyncratic, or when the emotional mapping is too abstract or
      disconnected from the target concept.
  expected_classification:
    depth: cross-domain
- id: 529216cd1975ae4add07ffa9e89353d063373c1fb17675f80c670c60ec17f2a9
  input_fb:
    name: Human Behavior Regulation in Public Design
    definition: Public design cannot reliably predict or regulate human behavior,
      as people will not act according to designer or planner expectations, requiring
      designers to account for actual human behavior rather than assumed common sense.
    mechanism: Human behavior in public spaces is unpredictable and resistant to direct
      regulation by design or planning, as individuals act based on their own judgment
      rather than external expectations.
    boundary: Applies to public interaction design where human behavior cannot be
      controlled or predicted. Fails when designers assume people will act according
      to common sense or planned intentions.
  expected_classification:
    depth: cross-domain
- id: 46351f0222050b694a650bfe87babbf7b0d0c65e6dec087d29d47abbbda24311
  input_fb:
    name: Research Question Framing Through Diverse Perspectives
    definition: Effective research questions emerge from integrating multiple stakeholder
      perspectives and contextual insights rather than relying on a single disciplinary
      or experiential lens. The principle describes how cross-domain understanding
      enhances the depth and relevance of research topics.
    mechanism: 'This is a descriptive model of how research questions are shaped by
      the intersection of different fields and practical contexts. Each perspective
      contributes unique framing elements: industry safety concerns provide real-world
      urgency, educational literature offers methodological frameworks, and policy
      or operational experiences supply practical constraints and opportunities. The
      synthesis creates a more nuanced and actionable research question than any single
      viewpoint could produce alone.'
    boundary: Applies when research topics can benefit from interdisciplinary or multi-stakeholder
      input. Fails when the research domain is strictly bounded by one discipline
      or when stakeholder perspectives are mutually exclusive or contradictory without
      synthesis potential.
  expected_classification:
    depth: cross-domain
- id: 009206a81b5f4eb67e90e24b563f5b099ea4d7e4e3dbdd5ab71237112896ba42
  input_fb:
    name: Cellular Automaton Simulation
    definition: A computational model that simulates complex behaviors through simple
      rule-based interactions between cells in a grid, exemplified by Conway's Game
      of Life and its artistic applications.
    mechanism: Each cell in a 2D grid follows simple rules based on its current state
      and neighbor states, updating simultaneously to create emergent patterns and
      behaviors that can be visually represented and studied.
    boundary: Applies to problems where emergent behavior can be modeled through simple
      local interactions in a discrete grid. Fails when the system requires continuous
      states or complex spatial relationships that cannot be captured in a cellular
      grid.
  expected_classification:
    depth: cross-domain
- id: de5c9ea09fd489d7a49fb951ae6e98b324ca517a37f479dbda68b46d773e3a6a
  input_fb:
    name: Mcluhan's Mosaic Approach to Media Analysis
    definition: A method of media analysis that employs a field or mosaic approach,
      using literary and artistic references to explore media environments as an explorer
      rather than an explainer.
    mechanism: McLuhan's approach combines discontinuous writing with extensive literary
      and artistic references to create a layered exploration of media's impact on
      human consciousness, treating media environments as exploratory territories
      rather than problems to be solved.
    boundary: Applies to McLuhan's method of media analysis that integrates literature
      and arts as exploratory tools. Fails when media analysis is approached as purely
      analytical or prescriptive rather than exploratory.
  expected_classification:
    depth: cross-domain
- id: c2b7a4667febfd6f98ffb4c096dd87dd9af268f89872f9dcecbff05c386f6838
  input_fb:
    name: Ontology-driven Knowledge Integration
    definition: Ontologies serve as formalized cross-domain mappings that enable integration
      of disparate knowledge sources by defining equivalences between concepts across
      different taxonomies. They provide a structured framework for aligning semantic
      representations and enabling traversal of complex business domains.
    mechanism: An ontology functions as a semantic bridge that maps equivalent concepts
      across different taxonomies or data models. When deployed, it allows systems
      to translate between distinct representations of the same real-world entities,
      enabling unified access to distributed knowledge sources. The integration process
      requires systems-level coordination to make data accessible across databases
      and networked storage systems.
    boundary: Applies when disparate knowledge sources exist with overlapping but
      distinct conceptual frameworks. Fails when knowledge sources are fully aligned
      or when the semantic alignment between concepts is ambiguous or unresolvable.
  expected_classification:
    depth: cross-domain
- id: 0abe5bd7e1f527f17e697a0cb0efeaac2fccae3e8a1edba195e483aa112bdfc9
  input_fb:
    name: Pareto Principle for Prioritization
    definition: A rule of thumb approach to prioritization where 80% of outcomes can
      be managed at lower priority while 20% requires highest attention, helping focus
      on the 'vital few' items.
    mechanism: The principle operates as a heuristic for resource allocation, assuming
      that a small percentage of inputs (20%) typically generate the majority of outputs
      (80%), making it practical to identify and focus on the most impactful items
      first.
    boundary: Applies when organizing data or tasks into bins where prioritization
      is needed. Fails when all items are truly equal in importance or when the 80/20
      ratio does not hold in a specific context.
  expected_classification:
    depth: universal
- id: dca2b389c9848edab13a112d07a15b1d5f5cc0652d57df711509f7bac55462be
  input_fb:
    name: Customer Forces Model As Behavior Model
    definition: A behavioral customer journey model that analyzes customer behavior
      through the lens of motivation, triggers, and aha moments rather than just capturing
      what customers do.
    mechanism: The model describes customer journeys through a behavioral lens, focusing
      on the psychological drivers behind customer actions and decision-making processes.
    boundary: Applies to customer journey mapping and behavioral analysis in product
      development. Fails when the behavioral elements aren't properly identified or
      when the model is applied without understanding customer psychology.
  expected_classification:
    depth: cross-domain
- id: e77557e1d6a8782e2070a9bfb4707f05195d8ec671b0516e725bbef90d37b4a7
  input_fb:
    name: Chimera As Scientific Boundary Crosser
    definition: The ancient Greek concept of the chimera as a mythical creature combining
      different species, used to illustrate how scientific experimentation might blend
      species or challenge natural boundaries.
    mechanism: The chimera represents a mythological archetype that has been invoked
      to describe scientific endeavors that blur species boundaries or challenge traditional
      understandings of natural order, particularly in the context of modern biotechnology
      and genetic engineering.
    boundary: Applies to the use of mythological concepts to frame modern scientific
      debates about species boundaries and biological modification. Does not apply
      to actual scientific methods or procedures.
  expected_classification:
    depth: cross-domain
- id: 95cda660c080fd0507a0b26395e4dfc49063b23c02f3e4b28982a2bb2fe848d6
  input_fb:
    name: Stochastic Search
    definition: A stochastic search method uses random or probabilistic processes
      to explore solution spaces and generate complex outcomes from simple initial
      conditions. The approach leverages randomness to navigate through parameter
      combinations or state transitions in ways that deterministic methods cannot.
    mechanism: Stochastic search operates by introducing randomness into a system's
      evolution, allowing it to explore multiple paths or configurations. In generative
      design and visual programming, this often involves agents that move or change
      according to probabilistic rules or noise functions. The randomness enables
      emergent behavior where simple rules lead to complex, unpredictable results.
      Unlike deterministic methods that follow fixed paths, stochastic search allows
      for variation and exploration of non-linear solution spaces.
    boundary: Applies when systems require exploration of multiple possible states
      or configurations through random or probabilistic processes. Fails when deterministic
      or analytical methods provide sufficient precision and efficiency for the problem
      at hand, or when the system's behavior is fully predictable and constrained.
  expected_classification:
    depth: cross-domain
- id: 17ad5fb7e5702c6a70eec0e8d35277166bf2a9ab1ad29c2e75499fe48864db20
  input_fb:
    name: Pmt Camera Typography Manipulation
    definition: A technique for creating atmospheric typography by using PMT cameras
      with old chemicals and incorrect exposures to produce unpredictable tonal effects
      and visual textures.
    mechanism: The process involves copying type out of focus or moving during exposures,
      using degraded chemicals that produce random deep seductive tones, and reprocessing
      photographic prints to create layered typography that suggests movement through
      background manipulation.
    boundary: Applies to specific photographic typography techniques using PMT cameras
      and analog processes. Fails when digital methods or modern equipment are used
      instead of the specified analog approach.
  expected_classification:
    depth: specialized
- id: 35f8340a9be95d41866bfbb83e5df260d51098a5c9ecfc35126ebb4b73100ac4
  input_fb:
    name: Continuous Evolution Imperative
    definition: All entities in a dynamic system must continuously adapt to changing
      conditions or face obsolescence. This principle describes an inevitable structural
      pressure that drives adaptation as a survival mechanism.
    mechanism: "Change is constant and universal across all systems \u2014 physical,\
      \ biological, social, and economic. Entities that fail to evolve in response\
      \ to shifting conditions lose their competitive advantage or relevance. The\
      \ pressure for adaptation arises from the mismatch between static persistence\
      \ and dynamic environments. This creates an inevitable drift toward obsolescence\
      \ for those who resist change."
    boundary: Applies when systems are subject to external change or internal instability
      that creates pressure for adaptation. Fails when systems are isolated or stable
      with no external forces driving modification, or when adaptation is impossible
      due to fundamental constraints (e.g., physical laws, irreversible damage).
  expected_classification:
    depth: universal
- id: 999a5941151cfa1bee9c3a32bd3bdad1115f7977fb53a2fb90a311c2a7f464f3
  input_fb:
    name: Core Idea Identification Through Abstraction
    definition: The fundamental principle underlying effective problem-solving and
      innovation is the ability to identify and isolate the core idea or essential
      element from complex situations, whether in business strategy, design, or conceptual
      thinking. This process involves abstracting away non-essential details to reveal
      the underlying principle that drives success.
    mechanism: This is a descriptive model of how human cognition processes complexity
      to find essential truths. The core idea emerges when individuals or organizations
      systematically filter out noise and focus on the most impactful elements that
      drive outcomes. The process requires both analytical rigor and creative insight,
      often revealed through visual or conceptual frameworks that make abstract principles
      tangible.
    boundary: Applies when complex systems or problems can be decomposed into essential
      components that drive outcomes. Fails when the system is fundamentally chaotic
      or when all elements are equally critical without clear hierarchy. Also fails
      in situations where the core idea is not yet discoverable through available
      information or when the problem space is too narrow to reveal essential patterns.
  expected_classification:
    depth: cross-domain
- id: 99bfb5b86e2e78f7cf7beceef8dd782673be12d5e6db5ff2abc141ed70925682
  input_fb:
    name: Inverse Square Law of Light Intensity
    definition: The intensity of light decreases proportionally to the square of the
      distance from the source. This relationship governs how light behaves as it
      travels through space and affects both photographic measurements and visual
      rendering in animation.
    mechanism: "Light intensity follows an inverse square relationship with distance:\
      \ I = 1/d\xB2, where I is intensity and d is distance. As distance doubles,\
      \ intensity drops to one-quarter; as distance triples, intensity drops to one-ninth.\
      \ This mathematical relationship is a fundamental property of three-dimensional\
      \ space and point light sources, where light spreads out uniformly in all directions."
    boundary: Applies when light travels through uniform, non-absorbing media and
      is measured from a point source. Fails when light is scattered by particles
      (fog, dust), absorbed by materials, or when the light source has a complex geometry
      that doesn't behave as a point.
  expected_classification:
    depth: universal
- id: 25324e1fd662230ef5e84be86cf68e7dc441a72d7c77449c60c647a5f86ac0da
  input_fb:
    name: Genetic Code Semiosis
    definition: The genetic code represents a form of semiotic process that operates
      at the biochemical level, where nucleotide sequences encode amino acid sequences
      through a system of signs and meanings that function analogously to linguistic
      communication. This process constitutes a shift from organism-to-organism communication
      (exosemiosis) to intracellular communication (endosemiosis).
    mechanism: The genetic code functions as a semiotic system where codons (three-nucleotide
      sequences) serve as signs that map to specific amino acids, creating a translation
      process that interprets genetic information. This system operates through a
      set of rules that govern how nucleotide triplets correspond to amino acids,
      enabling the conversion of genetic information into functional proteins. The
      system exhibits properties similar to linguistic communication, including redundancy,
      context dependence, and systematic structure.
    boundary: Applies to biochemical systems where genetic information is translated
      into protein structure. Fails when examining systems that do not involve nucleotide-to-amino
      acid translation or when semiotic processes occur outside of the genetic code
      framework. Also fails for purely physical or chemical processes that lack the
      signification and interpretation components that define semiosis.
  expected_classification:
    depth: cross-domain
- id: 25773f9d1532ba4ef2438fc938ae56aa8ca2e62d2460e8f0fcf0aefa5f45db0e
  input_fb:
    name: Systemic Error and Inherent Flaw
    definition: Systems operating at scale consistently produce errors, incorrect
      outputs, and flawed outcomes as a fundamental characteristic rather than exceptional
      anomalies. This principle describes the prevalence of malfunction and incorrectness
      as a systemic property of complex systems.
    mechanism: This is an empirical pattern describing the co-occurrence of system
      operation with error rates and incorrect outcomes. The passages document that
      errors and incorrect results are not outliers but regular features of system
      behavior across different domains (computing, human decision-making, physical
      systems). The pattern shows that even when systems appear to function correctly,
      they often contain hidden flaws or produce wrong answers.
    boundary: Applies to complex systems where operation involves multiple components,
      processes, or decision points. Fails when systems are simple, deterministic,
      or where errors are explicitly designed out (e.g., safety-critical systems with
      redundancy).
  expected_classification:
    depth: cross-domain
- id: 51e7aa578f634730271d427de0b91f4a9b5ed48190450725d8a2932eef531d5e
  input_fb:
    name: Baldwin Effect on Evolutionary Learning
    definition: The Baldwin effect proposes that learned behaviors can influence evolutionary
      processes by creating selective pressures that favor genetic traits enabling
      those behaviors, effectively allowing organisms to adapt more quickly than through
      DNA mutation alone.
    mechanism: Learning behaviors that prove advantageous create selective pressure
      for genetic traits that enable those same behaviors, allowing organisms to adapt
      faster than through random mutation and selection. The process works through
      feedback between learned behaviors and genetic evolution.
    boundary: Applies when learned behaviors create selective pressure for genetic
      traits that support those behaviors. Fails when learned behaviors are completely
      independent of genetic inheritance or when the learning is not adaptive.
  expected_classification:
    depth: cross-domain
- id: 1b4d9d6091fe2e4ca014b3331cfd25c6ba83d99940499b9deb7d5dd69973d14d
  input_fb:
    name: Trompe L'oeil Technique in Graphic Design
    definition: A design approach that creates visual illusions by mixing reality
      with artifice, allowing one thing to appear to be another through skillful craftsmanship.
    mechanism: The technique uses visual deception to make objects seem real when
      they are actually representations, or to make representations appear as if they
      were real objects, relying on the designer's craft and attention to detail.
    boundary: Applies to book covers, packaging, and design elements where visual
      trickery is used for artistic or communicative effect. Fails when the illusion
      is too obvious or when the design lacks the skill to maintain the deception.
  expected_classification:
    depth: specialized
- id: de5881b7602cfc64e5b51c145640bd098530ebf04f75631b363f213977568549
  input_fb:
    name: Cross-industry Use Case Adaptation
    definition: Effective implementation of AI solutions requires adapting proven
      use cases from other industries rather than developing entirely new approaches
      from scratch. This principle emphasizes the value of cross-industry learning
      and pattern recognition in AI adoption.
    mechanism: 'This is a practical heuristic: examining use cases from different
      industries provides a framework for understanding how AI solutions can be adapted
      to new contexts. The mechanism operates through pattern matching and transfer
      learning, where successful implementations in one domain (e.g., agriculture,
      marketing) offer insights and methodologies that can be modified for application
      in another industry (e.g., legal, accounting). The process involves identifying
      core problems, solutions, and implementation strategies that can be abstracted
      and applied across sectors.'
    boundary: Applies when there are sufficient structural similarities between industries
      to enable meaningful adaptation of use cases. Fails when industries have fundamentally
      different operational constraints, regulatory environments, or core business
      models that prevent direct application of AI solutions.
  expected_classification:
    depth: cross-domain
- id: ce10dcb517ca00c6f536ef4224cc3f47db81521e0246fe0a02e22a857c9fae76
  input_fb:
    name: Hjelmslev's Schema and Linguistic Categorization
    definition: Hjelmslev's schema describes how different languages partition and
      categorize the same reality in distinct ways, with each language's phonological
      system representing a unique abstraction of the physical acoustic reality.
    mechanism: Languages create categorical distinctions (like voiced/voiceless opposition)
      based on physical acoustic features, but each language selects different boundaries
      and abstractions to organize these continuous acoustic variations into discrete
      phonological categories.
    boundary: Applies to the comparison between languages' different categorization
      of the same acoustic phenomena. Fails when applied to non-linguistic domains
      or when languages categorize fundamentally different realities.
  expected_classification:
    depth: cross-domain
- id: adacfa23b0d90bed3435c6dcee735e590ed902d4ca41e14f88b9442a857615c9
  input_fb:
    name: Everything Is Figureoutable
    definition: A principle that life's challenges and obstacles can be solved through
      persistence, learning, and maintaining hope even when circumstances seem impossible.
    mechanism: The principle operates through the lens of reframing failure as learning,
      maintaining hope as motivation, and recognizing that every challenge presents
      an opportunity for growth and solution-finding.
    boundary: Applies when individuals face obstacles that seem insurmountable but
      can be approached with persistence and learning. Fails when the principle is
      applied to situations where external constraints or systemic barriers prevent
      solution.
  expected_classification:
    depth: cross-domain
- id: 03d0a4a83fa63813d82046e41a210b435c31b2692311c9a6c5368104b60e5319
  input_fb:
    name: Animated Font Design
    definition: Font design can incorporate dynamic visual elements through ligature-based
      transformations that animate uppercase letters to create compact, contextually
      adaptive word marks while maintaining distinct visual treatment for lowercase
      letters.
    mechanism: This is a descriptive model of font design approach, not a causal mechanism.
      The design pattern involves using over 1,400 ligatures to enable specific visual
      transformations (ducking, stretching) of uppercase letters during typing, creating
      varied word mark shapes. The lowercase letters are designed with a different
      visual treatment that does not include these same dynamic transformations.
    boundary: Applies to font design where ligature-based animation is implemented
      and visual transformation is used for uppercase letters. Fails when fonts do
      not incorporate ligature-based dynamic transformations or when all letter cases
      are treated uniformly without distinction between uppercase and lowercase visual
      treatment.
  expected_classification:
    depth: domain
- id: 607a6d12b25936193ff88fc2e1da7e517efeb4fe9b1ec155b6da7654dbc73468
  input_fb:
    name: Exploration-exploitation Tradeoff in Human Development
    definition: The tension between exploring new possibilities and exploiting known
      knowledge, applied to human developmental patterns where extended childhood
      provides a period for exploration without immediate payoff pressure.
    mechanism: Childhood serves as a developmental period where humans can explore
      possibilities and build knowledge without immediate performance pressure, allowing
      for the accumulation of information that enables later exploitation of that
      knowledge.
    boundary: Applies to human developmental psychology and lifelong learning contexts
      where extended exploration periods are beneficial. Fails when immediate performance
      requirements prevent exploration.
  expected_classification:
    depth: cross-domain
- id: a28173a6c1de3e552a6ae3f220a180a52c3c016adbe13f0b70ff208800f1dd02
  input_fb:
    name: Information Toxicity and Misaligned Alliances
    definition: The tendency for information to create false narratives and misaligned
      strategic partnerships, leading to catastrophic miscalculations when underlying
      realities differ from perceived alignments.
    mechanism: Information filtering and selective exposure create false equivalencies
      between groups with fundamentally different worldviews, causing decision-makers
      to form alliances based on superficial similarities rather than core ideological
      differences.
    boundary: Applies when strategic decisions are made based on incomplete or misleading
      information about ideological alignment. Fails when decision-makers have access
      to comprehensive understanding of all parties' true motivations and values.
  expected_classification:
    depth: cross-domain
- id: 160598947a42b67bc82a2dbe887277da5e9e3513b086858935abdc429a90a55b
  input_fb:
    name: Genetic Algorithm Antenna Design
    definition: A computational design method that uses genetic algorithms to evolve
      antenna structures by converting genotypes into 3D antenna segments and evaluating
      performance through electromagnetic simulation.
    mechanism: The genetic algorithm iteratively generates antenna designs by converting
      digital representations (genotypes) into physical antenna structures, simulating
      their performance using NEC software, and selecting designs based on fitness
      function criteria that measure performance against desired specifications.
    boundary: Applies to antenna design problems where performance can be quantified
      through electromagnetic simulation. Fails when the fitness function cannot adequately
      capture desired performance characteristics or when simulation software is unavailable.
  expected_classification:
    depth: specialized
- id: 455878bf7056e0b93f8ee2c5ca8ce38157d9f1ad9b538ed22db3fca663bd59d8
  input_fb:
    name: Sudden Appearance Pattern
    definition: In both biological and economic systems, patterns of sudden appearance
      or rapid change can be observed, where entities or trends seem to emerge fully
      formed or accelerate abruptly rather than following a gradual progression. This
      pattern is often misinterpreted as evidence of design or exceptional causation.
    mechanism: This is an empirical pattern, not a causal mechanism. The sudden appearance
      occurs because the observation window is often too narrow to capture the full
      process, or because the underlying gradual process is masked by the way data
      is collected, visualized, or interpreted. In biological systems, the fossil
      record may not capture the full evolutionary timeline, and in economic systems,
      data points are often selected to highlight specific narratives or trends.
    boundary: Applies when data is sampled or visualized in a way that emphasizes
      discrete moments or trends rather than continuous processes. Fails when the
      full temporal or developmental context is available and allows for gradual interpretation.
      The pattern is more likely to be observed in systems with limited or intermittent
      observation windows.
  expected_classification:
    depth: cross-domain
- id: 2988f4de0c4c9ddffff02e509b188ff6f3d62179d44e18ccd44108f911241b06
  input_fb:
    name: Above-the-line Vs Below-the-line Discussion Framework
    definition: A communication principle distinguishing between high-level strategic
      discussion focused on main points and detailed analysis focused on minor points.
    mechanism: Above-the-line discourse organizes conversation around major points
      with supporting details used only to illustrate and support the main points,
      while below-the-line discourse focuses on minor points for their own sake without
      connecting to broader goals.
    boundary: Applies to structured communication and organizational discourse. Fails
      when communication lacks clear distinction between major and minor points or
      when details don't support the main objectives.
  expected_classification:
    depth: cross-domain
- id: 4accd0c9eb9882529e001ce49d616d5580dba18f09df5715d5aa30f584a89527
  input_fb:
    name: Facial Recognition and Eye-tracking Marketing Research
    definition: A method for understanding consumer behavior through biometric and
      visual analysis technologies that capture physiological responses and attention
      patterns.
    mechanism: Advanced technologies like facial recognition, eye-tracking, and biometric
      sensors capture real-time physiological responses and attention patterns to
      understand how consumers react to products and marketing materials.
    boundary: Applies to marketing research where detailed consumer physiological
      responses are needed. Fails when the technology is not available or when privacy
      concerns prevent implementation.
  expected_classification:
    depth: cross-domain
- id: 2c56317c59e09880a2a8d9a44b28ca108182aa4918f0bf45a011eb2ebb3ff0f3
  input_fb:
    name: Human-centered Design in Medical Imaging
    definition: A design approach that prioritizes understanding patient needs and
      experiences, particularly for vulnerable populations like young children, to
      create more effective and compassionate medical technology solutions.
    mechanism: The process involves direct observation of patient interactions, empathy-driven
      insights, and cross-functional collaboration to translate human needs into technical
      design solutions that address both functional and emotional requirements.
    boundary: Applies when design decisions must balance technical excellence with
      human experience considerations. Fails when purely technical constraints override
      human-centered insights.
  expected_classification:
    depth: cross-domain
- id: 00ee028761ad041b0933a4e91c8e5e3c304df18c2c648cc0ddd10d481f0f41e7
  input_fb:
    name: Simple-collective-tight Brand Building Process
    definition: A repeatable process for implementing the Simple-Collective-Tight
      framework that focuses on creating shared cultural meaning and maintaining tight
      brand positioning.
    mechanism: The process requires identifying what makes people and brands similar
      rather than different, creating big ideas that transcend media types, and building
      creative publicity that ensures maximum exposure through media-neutral campaigns.
    boundary: Applies to marketing practitioners and agencies seeking to build strong
      brands in a fragmented media environment. Fails when agencies or marketers focus
      on individual differences rather than collective unity or when they abandon
      creative approaches in favor of data-driven micro-targeting.
  expected_classification:
    depth: domain
- id: c113d3cc0ade86f7c08446eeff787b37b9a4e5a8e4a43ae1631c10160a052b25
  input_fb:
    name: Hyperobject Form and Systemic Context
    definition: A conceptual framework for understanding how objects with spatiotemporal
      distribution maintain form through social imaginaries and systemic conditions,
      rather than through physical tangibility.
    mechanism: Hyperobjects possess form not in their physical manifestation but through
      the conceptual frameworks and systemic conditions that assemble them into coherent
      entities, similar to how ideas, families, or experiences maintain unity despite
      lacking physical boundaries.
    boundary: Applies to objects that exist across spatiotemporal dimensions and systemic
      contexts. Fails when applied to objects that are purely physical and isolated.
  expected_classification:
    depth: cross-domain
- id: 3186d13d57a99400cb6a0ed88d4eb94eff2b3d4b335722ecb00ab3f7a140a682
  input_fb:
    name: Cognitive Load Reduction Through Systemic Design
    definition: Effective design requires reducing cognitive load by understanding
      systemic connections and managing mental models to prevent user fatigue and
      improve decision-making. The principle emphasizes that complex problems demand
      holistic thinking and that design must address both the immediate user experience
      and broader systemic relationships.
    mechanism: 'Design thinking operates through two complementary modes: open thinking
      (intuitive and visionary) and structured thinking (analytical and systematic).
      When designers work with diverse perspectives and domains, they enhance associative
      abilities and reduce the risk of narrow, domain-specific thinking that limits
      creative solutions. The human brain consumes significant energy (15-20% of total
      energy), making cognitive load a critical constraint in user experience design.
      Reducing unnecessary complexity and decision points allows users to process
      information more efficiently, preventing mental fatigue that leads to abandonment
      or poor choices.'
    boundary: Applies when design problems involve complex systems or require understanding
      of interrelated components. Fails when problems are purely linear or isolated,
      where simple solutions suffice without systemic understanding.
  expected_classification:
    depth: cross-domain
- id: c6172979662128f194b66342d8e06084e0b08c5c8268c7d3aa5edfc6ff4c1d1b
  input_fb:
    name: Agent-powered Business Transformation
    definition: AI agents enable organizations to automate complex workflows, improve
      operational efficiency, and achieve significant cost and time savings by delegating
      tasks to intelligent systems that can reason, act, and learn. This principle
      describes a transformative approach where AI agents become integral to business
      processes and decision-making.
    mechanism: AI agents function as autonomous entities that can execute multi-step
      tasks, integrate with existing systems, and adapt to new scenarios through continuous
      learning and retrieval-augmented generation (RAG). They provide real-time responses,
      handle complex queries, and scale business operations by reducing human intervention
      in routine and high-volume activities. The agents operate within platforms that
      support training, contextual grounding, and operational integration.
    boundary: Applies when organizations have sufficient infrastructure and data to
      support agent deployment and when workflows can be broken down into discrete,
      automatable steps. Fails when the business environment requires highly nuanced
      human judgment, lacks proper data integration, or when agents cannot adequately
      handle edge cases or exceptions without human oversight.
  expected_classification:
    depth: cross-domain
- id: 487df345c7acc8c899104c9fb79b096db115795a6da68ed619f89d9935ed5779
  input_fb:
    name: Probability Distribution Under Uncertainty
    definition: In systems with uncertainty, probability distributions describe the
      likelihood of outcomes, and the behavior of these distributions changes based
      on whether the system operates in Mediocristan (normal distribution) or Extremistan
      (power-law distribution). The key distinction is that in Mediocristan, outcomes
      cluster around a mean with diminishing variance, while in Extremistan, rare
      events have disproportionately large impacts.
    mechanism: In Mediocristan, outcomes are independent and additive, leading to
      normal distribution patterns where the law of large numbers applies and uncertainty
      decreases with sample size. In Extremistan, outcomes are not independent and
      can be influenced by rare, high-impact events, causing heavy tails in the distribution.
      The behavior of probability distributions under uncertainty is determined by
      the nature of the system's variability and the degree to which extreme events
      can alter the overall distribution.
    boundary: Applies when systems exhibit either additive or multiplicative variability.
      Fails when outcomes are completely deterministic or when the system lacks sufficient
      sample size to observe distributional patterns. Also fails when the system is
      not subject to random variation or when all outcomes are equally probable.
  expected_classification:
    depth: universal
- id: 06e8bfba990ea261381e5faac28f95db875f5ca5ebfd17f474db657fed44736c
  input_fb:
    name: Pseudodoxy and Feedback Loop Risk
    definition: When a system's behavior becomes increasingly erratic or deteriorates
      faster than expected, it may indicate that the solution being applied is flawed
      or misaligned with the system's actual dynamics. This pattern often emerges
      from overconfidence in a single correct approach or from escalation of a faulty
      intervention.
    mechanism: This is a descriptive pattern of system behavior, not a causal mechanism.
      The pattern shows that when systems exhibit rapid deterioration or strange behavior,
      it often correlates with the application of a solution that is either incorrect
      or inappropriate for the system's structure. The correlation suggests that the
      system's response to the solution is not aligned with the root cause of the
      problem, indicating that the solution itself is likely part of the problem rather
      than a remedy.
    boundary: Applies when system performance deteriorates faster than expected or
      exhibits unusual behavior. Fails when the system's degradation is due to external
      factors unrelated to the solution or when the solution is appropriate but insufficiently
      implemented.
  expected_classification:
    depth: cross-domain
- id: 031984767d7796f61b7d8a295c83e8c9d02c1481a3c1bbced481e6f6ae3f3319
  input_fb:
    name: Scene-primitive Mapping in Visual Representation
    definition: A process where visual systems map three-dimensional scene features
      (scene primitives) into two-dimensional picture primitives (regions, lines,
      or points) to represent the scene in a pictorial format.
    mechanism: The visual system translates spatial and structural elements from the
      three-dimensional scene into corresponding visual elements in the two-dimensional
      representation, maintaining semantic relationships between real-world features
      and their pictorial counterparts.
    boundary: Applies specifically to the translation process from 3D scene features
      to 2D picture elements. Fails when the mapping involves abstract or symbolic
      transformations beyond basic scene primitives.
  expected_classification:
    depth: domain
- id: 9eb33a81d599fd9502749c1e16585108140fc2f858123a66796bde9b736f4675
  input_fb:
    name: Mindful Acceptance of Complexity
    definition: Effective problem-solving and decision-making require accepting the
      inherent complexity and imperfection of systems while maintaining focus on core
      objectives. The principle describes a mindset shift from seeking perfect solutions
      to embracing manageable approximations that serve practical goals.
    mechanism: 'This is a normative heuristic: successful problem-solving involves
      deliberately choosing to work with complexity rather than eliminate it. The
      approach requires balancing intuitive and analytical thinking, setting clear
      boundaries for explanation and preparation, and accepting that some aspects
      of systems cannot be fully controlled or predicted. The mechanism is prescriptive
      about how to navigate complexity without becoming overwhelmed by it.'
    boundary: Applies when complex systems or problems require multiple perspectives
      and cannot be solved through simple linear approaches. Fails when the situation
      demands absolute precision or when the complexity is not truly inherent but
      rather due to poor design or lack of information.
  expected_classification:
    depth: cross-domain
- id: 1ef326781a4cb92a1aad4bbef57ada7697ecbeb5cfaaf3700d98309451bccb2e
  input_fb:
    name: Force-dynamic Patterns in Social Domains
    definition: Patterns of linguistic and conceptual structure that extend from physical
      force dynamics to social and political domains, where physical force metaphors
      are applied to explain social phenomena.
    mechanism: The conceptual mapping transfers the structure and semantics of physical
      force relationships (like water draining due to loose plugs) to social contexts
      (like fear enabling political action), maintaining the core metaphorical framework
      of force as a driving causal mechanism.
    boundary: Applies when physical force concepts are metaphorically extended to
      social domains. Fails when the metaphorical extension does not maintain the
      core structural relationships or when the social context lacks the necessary
      causal force dynamics.
  expected_classification:
    depth: cross-domain
- id: 7696cdc84983e1f2cd362154aea0c8cfb461b9d2c903288c3dd8241832539b50
  input_fb:
    name: Simplification in Programming and Scientific Contexts
    definition: A conceptual principle that the meaning and application of 'simplification'
      varies contextually and depends on the subsequent computational or analytical
      goals.
    mechanism: The concept of simplification is not a fixed rule but a flexible principle
      that adapts to the specific task at hand, with different approaches required
      for integration, synthesis, or other computational goals.
    boundary: Applies to contexts where computational or analytical goals require
      different approaches to problem representation. Fails when a single universal
      definition of simplification is required.
  expected_classification:
    depth: cross-domain
- id: 23705d76ab27066e949e6ae3810a855cb20bcb6db1994f46f70d0f60c0f432fb
  input_fb:
    name: Semiotic Discourse Expansion
    definition: The field of semiotics expands beyond its original disciplinary boundaries
      to encompass diverse domains of human activity, including media, culture, and
      philosophy, often through inclusive definitions that embrace interdisciplinary
      application. This expansion reflects a shift from narrow academic specialization
      to broader intellectual engagement.
    mechanism: Semiotics evolves as a discipline that increasingly incorporates insights
      and practices from multiple fields, such as media studies, philosophy, and cultural
      theory. This expansion is driven by the recognition that sign systems and interpretive
      processes are fundamental to human communication and meaning-making across contexts.
      The field's growth is not constrained by traditional boundaries but rather embraces
      a wide range of applications and interpretations.
    boundary: Applies when semiotics is understood as a broad interpretive framework
      that transcends specific academic disciplines. Fails when semiotics is narrowly
      defined or restricted to specific theoretical or methodological approaches without
      acknowledging its interdisciplinary potential.
  expected_classification:
    depth: cross-domain
- id: 02103435771d81b19ae20a5de194cd70ad9485161bc168192dd973fcc0dc199c
  input_fb:
    name: Antifragility Through Volatility
    definition: Systems and individuals benefit from controlled stress and variation
      rather than stability and predictability. The principle asserts that volatility
      and disorder are not merely tolerable but necessary for growth, resilience,
      and authentic functioning.
    mechanism: 'This is a normative heuristic: introducing controlled stress and variation
      into systems (biological, psychological, social) strengthens them by enabling
      adaptation and resilience. The principle prescribes that systems should not
      be shielded from variability but should be designed to thrive within it. The
      mechanism is not a causal chain but a practical rule of thumb for fostering
      robustness through exposure to manageable perturbations.'
    boundary: Applies when systems can process and adapt to controlled stress without
      being overwhelmed. Fails when stress is excessive or unmanageable, or when systems
      lack the capacity to adapt (e.g., biological systems with no evolutionary resilience,
      or social systems with no cultural flexibility).
  expected_classification:
    depth: cross-domain
- id: eb1ed2c7914fd9ca69da17989a539b6666e2b842bfc5d7e75f512b1f9087efdf
  input_fb:
    name: Craft and Cultural Heritage in Type Design
    definition: A typographic philosophy that connects type design to traditional
      craft methods, cultural heritage, and personal artistic expression.
    mechanism: Type design reflects the designer's cultural background, traditional
      production methods, and personal artistic journey through the choice of letterforms
      and visual characteristics.
    boundary: Applies when type design explicitly connects to craft traditions or
      cultural heritage. Fails when the connection is superficial or not purposefully
      established.
  expected_classification:
    depth: cross-domain
- id: 8e84473701595372d744f7dba4d57f3039eb8d9205b23d660213592f9b8cf405
  input_fb:
    name: Thing-powered Agency
    definition: Nonhuman entities and materials possess inherent capacity to shape
      outcomes and influence interactions, operating as active agents rather than
      passive tools. This principle recognizes that agency emerges from complex entanglements
      between human and nonhuman elements, where things themselves contribute to the
      direction and meaning of events.
    mechanism: This is a descriptive model of agency that categorizes the sources
      and forms of influence in systems. Things acquire 'thing-power' through their
      material properties, relational entanglements, and participation in networks
      of interaction. The principle describes how agency is not exclusively human
      but distributed across human and nonhuman actors in dynamic configurations.
      It maps the structure of influence as a multi-layered system where objects,
      environments, and materials each contribute to shaping outcomes.
    boundary: Applies when systems involve material entities that interact with human
      actors in complex ways. Fails when agency is exclusively attributed to human
      intention or when things are treated as purely inert instruments without relational
      influence.
  expected_classification:
    depth: cross-domain
- id: 7507ef49ad0628fac0589f38b7490cf8f111b5b809e8fbbcb7f2abf87da473a9
  input_fb:
    name: Probabilistic Thinking and Bayesian Updating
    definition: A mental model for updating beliefs and assessments based on new evidence,
      incorporating existing knowledge and adjusting probabilities accordingly.
    mechanism: When encountering new information, individuals should adjust their
      prior probabilities based on the relevance and reliability of existing knowledge,
      using Bayesian principles to update their understanding of likelihoods.
    boundary: Applies when individuals have existing but limited knowledge relevant
      to a problem and encounter new information that requires updating. Fails when
      there is no prior knowledge to update or when new information is completely
      unrelated to existing understanding.
  expected_classification:
    depth: universal
- id: d795061352941d81b26074b0e9695e1be0223db6218d71a9587f42dd422e8e3d
  input_fb:
    name: Morphogenesis Reaction-diffusion Systems
    definition: Mathematical models describing how patterns in biological systems
      emerge through the interaction of chemical substances that diffuse and react
      with each other.
    mechanism: Chemical substances spread and react according to mathematical equations,
      creating stable patterns that can simulate biological development processes
      like morphogenesis, where a fertilized egg develops into a complex organism.
    boundary: Applies to mathematical modeling of biological pattern formation. Fails
      when the system lacks proper boundary conditions or when the mathematical model
      does not accurately represent the biological process.
  expected_classification:
    depth: cross-domain
- id: 175bcb2561a5d66d59d6c96882d9e9822f73fd9a5a64c153e900d3fec4fe1467
  input_fb:
    name: Hidden Issue Questioning in Marketing Research
    definition: A qualitative research technique that explores respondents' fantasies,
      work lives, and social lives to identify underlying personal interests and life
      issues that may influence their purchasing behavior.
    mechanism: The technique works by asking respondents to imagine scenarios where
      they cannot use a product (like airplanes) and then exploring their fantasies
      and life interests to uncover deeper motivations that drive their actual purchasing
      decisions.
    boundary: Applies to qualitative research contexts where respondents can engage
      in imaginative and introspective thinking about their lives and interests. Fails
      when respondents cannot articulate their fantasies or when the research setting
      does not encourage personal disclosure.
  expected_classification:
    depth: specialized
- id: 244abbce1f802635b11e184e3d53970027f2e66691d75374ea7b30ec30571578
  input_fb:
    name: Influence of Avant-garde Movements on Modern Design
    definition: The principles of avant-garde artistic movements, particularly de
      Stijl and Constructivism, significantly influenced the development of modern
      graphic design and typography in the early twentieth century. These movements
      provided foundational concepts that were adopted and adapted by designers like
      Piet Zwart and others in their commercial work.
    mechanism: The influence operates through the transmission and adaptation of artistic
      and design principles from avant-garde movements to commercial practice. Designers
      who were exposed to movements such as de Stijl and Constructivism, or who studied
      works like Tschichold's The New Typography, internalized these formal and conceptual
      approaches and applied them to new contexts such as commercial advertising and
      map design. This process involved selective adoption and modification of core
      tenets to suit practical needs.
    boundary: Applies when designers were directly exposed to or studied the principles
      of early twentieth-century avant-garde movements such as de Stijl, Constructivism,
      or The New Typography. Fails when designers worked in isolation from these movements
      or when the influence was not documented in their work or training.
  expected_classification:
    depth: cross-domain
- id: 06f3b0597b6cab4e7bc13c17b2f6c208863a33add298ca06d4deffe810437d66
  input_fb:
    name: Umwelt As Semiotic Framework
    definition: "The Umwelt concept, originally developed by Jakob von Uexk\xFCll\
      \ and later expanded by Thomas Sebeok, provides a semiotic framework for understanding\
      \ how different species perceive and interact with their environments through\
      \ sign-based systems. This framework transcends human-centric approaches to\
      \ semiotics by applying general semiotic principles to animal communication\
      \ and neurobiological processes."
    mechanism: "The Umwelt concept functions as a descriptive model that categorizes\
      \ environmental perception and communication systems across species. It positions\
      \ the Umwelt as a semiotic space where signs and meanings are generated and\
      \ interpreted according to species-specific sensory and cognitive capabilities.\
      \ Unlike human-focused semiotics, this model treats all sign-using systems\u2014\
      whether human, animal, or biological\u2014as part of a broader semiotic ecology."
    boundary: Applies when studying sign systems that operate within species-specific
      perceptual and communicative frameworks. Fails when applied to purely human
      linguistic systems without acknowledging their unique cultural and symbolic
      dimensions, or when used to reduce all communication to a single universal semiotic
      structure.
  expected_classification:
    depth: cross-domain
- id: 708389ee28b38505262a287d8bea70802cf06e44f4f1330c9bba4bcce10901fe
  input_fb:
    name: Geometric Proof Synthesis
    definition: "Multiple geometric proofs of the same theorem or principle can be\
      \ synthesized into a unified framework that reveals deeper structural relationships.\
      \ This synthesis combines different approaches\u2014such as lever-based mechanics,\
      \ calculus-based integration, and classical Euclidean methods\u2014into a coherent\
      \ understanding that transcends individual proof techniques."
    mechanism: Different proof methods for geometric problems often reveal complementary
      aspects of the same underlying structure. For example, Archimedean lever principles
      can be used to demonstrate area relationships, while calculus provides a more
      general framework for computing areas under curves. These methods are not mutually
      exclusive but rather offer distinct perspectives on the same mathematical reality,
      allowing for cross-validation and deeper insight.
    boundary: Applies when multiple independent proof strategies exist for a single
      geometric or mathematical concept. Fails when proofs are entirely unrelated
      or when a single method is sufficient to establish the result without additional
      insight from alternative approaches.
  expected_classification:
    depth: cross-domain
- id: ca381bc50e42c3a2d414c94b2d7182a9619ebb9b090b6a35e285d922610605a7
  input_fb:
    name: Intermittent Failure Detection
    definition: Intermittent system failures are the most difficult to identify and
      resolve because they occur sporadically and may not manifest during testing
      or monitoring. These failures often go unnoticed or are dismissed as anecdotal,
      making them particularly challenging to diagnose and fix.
    mechanism: Intermittent failures are inherently difficult to detect because they
      do not follow predictable patterns or occur consistently under the same conditions.
      They may only appear under specific, hard-to-replicate circumstances, and their
      sporadic nature makes them resistant to standard debugging techniques. When
      they do occur, they often appear as anomalies or edge cases that are not captured
      in typical system behavior models.
    boundary: Applies when system failures occur irregularly or only under specific,
      hard-to-replicate conditions. Fails when failures are consistent, easily reproducible,
      or occur under well-defined conditions that can be monitored or tested.
  expected_classification:
    depth: cross-domain
- id: ca36abaf5e6e6d7d5f031c03010956651851c018069a73c56cd23c7bc99635cf
  input_fb:
    name: Organizational Intelligence As Collective Action
    definition: The intelligence of an organization is never equal to the sum of the
      intelligence of the people within it, suggesting that collective action and
      interpretation creates emergent organizational capabilities.
    mechanism: Organizational intelligence emerges not from individual cognitive capacity
      but from the dynamic interaction and interpretation of information among members,
      creating emergent properties that exceed individual contributions.
    boundary: Applies when organizational members interpret and act on shared information
      in ways that create collective outcomes. Fails when individual intelligence
      is simply aggregated without emergent interaction.
  expected_classification:
    depth: cross-domain
- id: e21a380f71972030f041046dfe62491b8bc3b16030144aab638a892fed4247e4
  input_fb:
    name: Symbolic Representation Through Wheel Metaphor
    definition: A symbolic framework where objects like wheels function as representations
      that project content nebulae, embodying multiple properties and meanings simultaneously
      through selective abstraction.
    mechanism: The wheel serves as a symbolic projection that selectively abstracts
      and preserves certain properties while discarding others, creating a content
      nebula that can embody multiple interconnected meanings and entities simultaneously.
    boundary: Applies when objects function as symbolic representations that can embody
      multiple properties and meanings. Fails when the object's properties are purely
      functional or material rather than symbolic.
  expected_classification:
    depth: cross-domain
- id: 3499c5e36b20559b6f25c7088eb3395c9c73aa5f9a1110b29940de2be792b1bf
  input_fb:
    name: Beauty As Indicator of Functionality and Truth
    definition: A principle that aesthetic beauty serves as a heuristic indicator
      of both functional effectiveness and truth in design solutions.
    mechanism: Beauty in design signals that the solution aligns with underlying principles
      and operates effectively, since functional and truthful solutions tend to exhibit
      elegant, harmonious properties that humans naturally find aesthetically pleasing.
    boundary: Applies when design solutions are evaluated for both functional and
      aesthetic qualities. Fails when beauty is purely subjective or when functional
      solutions lack aesthetic appeal due to constraints.
  expected_classification:
    depth: cross-domain
- id: 776d192d56ad4b3c7b40da751069d8ed236afa6d49c68f8930097062a4e8d6d3
  input_fb:
    name: Multimodal Research Methodology
    definition: A research approach that integrates multiple sensory and experiential
      modalities to enhance understanding of situated action and organizational processes.
    mechanism: 'The methodology involves three phases: preliminary study, field visit
      with participant dialogue, and integration of findings through multimodal interviews
      that immerse researchers and participants in concrete experiences rather than
      abstracting from them.'
    boundary: Applies to ethnographic and organizational research where concrete experiences
      and multiple sensory inputs are relevant. Fails when research contexts do not
      support multimodal engagement or when participants cannot access the physical
      environment.
  expected_classification:
    depth: cross-domain
- id: 916f7a19c617995b9c9fdd7aa9b36d2451d112e8721583e91afdccdb90461c4d
  input_fb:
    name: Technical Illustration Requirements
    definition: Technical illustrations are specialized visual communications required
      for specialist users or general public, often appearing as operating instructions
      and manuals.
    mechanism: Technical illustrations serve specific functional purposes such as
      biological studies, mechanical drafting, cartography, and weather forecasting,
      requiring precise visual representation to convey complex information.
    boundary: Applies to technical documentation and educational materials where accuracy
      and clarity are paramount. Fails when illustrations lack the necessary precision
      or fail to meet technical standards.
  expected_classification:
    depth: cross-domain
- id: 7794a3975f9a398cdc06b9a6b978afedef31377a50cdec8b4f27ba3b1538f19d
  input_fb:
    name: Semiotic Framework Integration
    definition: Semiotics functions as a universal analytical framework that can be
      applied across diverse domains and media to decode meaning-making processes.
      The principle describes how semiotic concepts and methods can be systematically
      integrated into various fields of study and practice.
    mechanism: This is a descriptive model that categorizes how semiotics operates
      as a cross-domain analytical tool. The framework provides structured approaches
      for understanding communication, meaning, and representation in different contexts.
      It encompasses multiple levels of analysis from structural components to cultural
      applications, allowing for systematic mapping of sign systems and their interpretations.
    boundary: Applies when semiotic concepts can be meaningfully mapped to a domain
      or medium where communication or representation occurs. Fails when the domain
      lacks communicative or representational elements that can be analyzed through
      sign systems, or when semiotic methods are inappropriately forced onto non-sign-based
      phenomena.
  expected_classification:
    depth: cross-domain
- id: 00130957fbffe1c3c243db77821d4c4bbb489984afb146abb50e1a9a0475e5c0
  input_fb:
    name: Progressive Problem-solving Framework
    definition: Systematically address user problems by identifying and solving the
      most impactful issues first, then progressively expanding to cover all related
      pain points in the user journey. This approach prioritizes high-impact solutions
      while maintaining flexibility for adjustments as new problems emerge.
    mechanism: This is a practical heuristic for managing complexity in design and
      product development. The framework operates by first identifying the most critical
      user problems (often at the beginning or end of a user journey) and solving
      them with focused, high-impact solutions. As the solution space expands, additional
      problems are addressed in order of impact or urgency, allowing for iterative
      refinement and adaptation to new challenges that arise during implementation.
    boundary: Applies when there is a clear user journey with identifiable problems
      before, during, and after service delivery. Fails when problems are not clearly
      defined or when the user journey is not understood, making it difficult to prioritize
      or sequence solutions effectively.
  expected_classification:
    depth: domain
- id: 78aa6aa7752d046c46429002c2acd8468254316c8ae62a56e6e6777b755c0e17
  input_fb:
    name: Expert Prediction Fallibility
    definition: Expert predictions are systematically unreliable due to overconfidence,
      cognitive biases, and the complexity of real-world systems. This principle describes
      the consistent pattern that even highly credentialed experts fail to accurately
      forecast major historical events or trends.
    mechanism: Experts demonstrate overconfidence in their predictive abilities despite
      evidence of poor performance. They often fail to update their beliefs in response
      to new evidence, instead clinging to initial assumptions or mental models. The
      complexity and non-linear nature of real-world systems (such as political upheaval,
      economic shifts, or technological disruption) makes long-term forecasting inherently
      difficult, yet experts persist in making confident claims that are frequently
      wrong.
    boundary: Applies when experts make predictions about complex, evolving systems
      with multiple interacting variables and uncertain outcomes. Fails when experts
      predict simple, well-understood phenomena or when they have access to complete,
      accurate data and update their models consistently.
  expected_classification:
    depth: cross-domain
- id: 40cd14cc5a9a9140eaeb9189162c9c65be517490af030734d8ddf6bdaee9e64f
  input_fb:
    name: Distributed Coordination Without Central Control
    definition: Systems can achieve coordinated behavior and formation maintenance
      through local interactions and self-correction mechanisms, without requiring
      central command or global coordination. The principle describes how decentralized
      agents can synchronize their actions based on local information and neighbor
      states.
    mechanism: This is a descriptive model of how distributed systems organize. Agents
      respond to local conditions and adjust their behavior based on immediate feedback
      from neighbors. When one agent corrects its position or speed, it triggers a
      cascading adjustment in neighboring agents, creating emergent coordination.
      The system achieves global order through the aggregation of local decisions
      rather than top-down orchestration.
    boundary: Applies to systems where agents have limited information about global
      state but can observe neighbors. Fails when agents require global knowledge
      to make decisions or when the system lacks local feedback mechanisms that enable
      self-adjustment.
  expected_classification:
    depth: cross-domain
- id: 01e4e999120dd3db39cf61cb9284969dc8264f694e68d56aee8f7f8e72c41026
  input_fb:
    name: Technocratic Revolution Strategy
    definition: A strategic plan for total social destruction involving organized
      subversion and manipulation through mass media and cultural institutions.
    mechanism: The strategy involves systematic dismantling of traditional social
      structures through ideological frameworks developed by intellectual elites working
      with established power structures, followed by the deployment of these frameworks
      through media and entertainment to achieve widespread social transformation.
    boundary: Applies to organized efforts by intellectual and political elites to
      reshape society through cultural and media manipulation. Fails when such efforts
      lack coordination or are not implemented through mass media channels.
  expected_classification:
    depth: domain
- id: 667f49c75ba6360666ec27807f67781d191b6a457a14b25a9ce2c3ae2fcdcc34
  input_fb:
    name: Numerical Symbolism in Design and Biology
    definition: A conceptual framework that connects the number nine as a fundamental
      principle in both design symbolism and biological structure.
    mechanism: The number nine appears across multiple domains - from Mayan architecture
      (nine stepped stories) to cellular biology (9+2 microtubule structure) to gestation
      periods - suggesting a universal principle of nine as a foundational organizing
      principle.
    boundary: Applies to contexts where numerical symbolism connects across different
      domains of human knowledge and natural phenomena. Fails when the connections
      are purely coincidental or lack conceptual coherence.
  expected_classification:
    depth: cross-domain
- id: eea2ee41ae9afc724bba99fc445b22ebeb84d0c31eb16bb926e254e7cd9283be
  input_fb:
    name: Bakhtin's Collaborative Authorship Model
    definition: A principle describing how Bakhtin's scholarly work was developed
      through extensive collaboration with colleagues, making attribution of individual
      authorship problematic.
    mechanism: "Bakhtin's major works were co-formulated and collaboratively written\
      \ with other scholars in his circle, particularly Medvedev, Volo\u0161inov,\
      \ and others, creating a 'semi-other' character of one's own word where individual\
      \ ownership becomes blurred."
    boundary: Applies to Bakhtin's collaborative scholarly environment in the 1920s-1930s,
      particularly in Russia and later England. Fails when applied to individual authorship
      or when the collaborative nature is not acknowledged.
  expected_classification:
    depth: cross-domain
- id: bac596e28b6e42581614b85acec5e8f2ddaa360c95f66e27e48f63467847b531
  input_fb:
    name: Learning Through Examples
    definition: Specific, concrete examples are more effective learning tools than
      abstract generalizations or theoretical frameworks. This principle describes
      a pedagogical approach where tangible systems illustrations serve as the foundation
      for understanding broader systemic concepts.
    mechanism: 'This is a normative heuristic about learning effectiveness: presenting
      concrete systems examples before introducing abstract principles enables deeper
      comprehension and retention. The mechanism operates through the cognitive advantage
      of anchoring new knowledge to familiar, observable patterns rather than relying
      on purely conceptual frameworks.'
    boundary: Applies when learners benefit from concrete anchoring before abstract
      generalization. Fails when learners are already familiar with the domain or
      when abstract principles are necessary for understanding the system's structure.
  expected_classification:
    depth: cross-domain
- id: 91a6cb5cedbe0a2adb4ab40385a1bda16c588e3be6c2f6a2c896d38a9a6c0e8c
  input_fb:
    name: Semiotic Doctrine Development
    definition: The evolution of semiotic theory is marked by a progression from structuralist
      foundations to broader interdisciplinary applications, with key contributions
      from Ferdinand de Saussure and Thomas A. Sebeok forming the core of this development.
      This progression reflects a shift from linguistic focus to a more expansive
      understanding of signs as fundamental to communication and meaning-making across
      domains.
    mechanism: The development of semiotic doctrine follows a pattern of foundational
      theory building through key figures like Saussure, who established structuralist
      principles, and Sebeok, who extended these principles into interdisciplinary
      applications. The evolution is characterized by the integration of linguistic
      theory with broader cultural and communicative phenomena, with Sebeok's work
      representing a significant expansion beyond pure linguistics into areas such
      as nonverbal communication and media semiotics.
    boundary: Applies when semiotic theory builds upon or extends structuralist foundations
      established by figures like Saussure and develops through influential contributors
      like Sebeok. Fails when the development does not involve the integration of
      linguistic theory with broader communicative or cultural phenomena, or when
      the evolution does not trace a clear progression from foundational to expanded
      applications.
  expected_classification:
    depth: cross-domain
- id: 1a5ea8517cf76b4206f97d79d41c697410bd3aaf68d801b545cc43ff5d408332
  input_fb:
    name: Coincidence Wit in Graphic Design
    definition: A design strategy where designers exploit fortuitous connections or
      unusual circumstances to carry meaning, rather than using standard or straightforward
      elements.
    mechanism: The technique involves identifying an element that is not only unusual
      in itself but also coincidentally aligns with an idea or concept relevant to
      the message, requiring keen observation and recognition skills from the designer.
    boundary: Applies when designers find unexpected connections between elements
      and the intended message. Fails when the coincidence is too forced or when the
      connection is not genuinely relevant to the communication goal.
  expected_classification:
    depth: specialized
- id: b57ee52445d9947b74a8d33ef568bd0d9921489f1815ec24bc1056d2f48f4733
  input_fb:
    name: Delphi Method for Future Analysis
    definition: A structured communication technique that uses a panel of experts
      to reach consensus on future developments, particularly useful for analyzing
      ambiguous or uncertain future scenarios.
    mechanism: The method involves systematic rounds of expert consultation where
      participants provide judgments about future developments, with feedback provided
      to help achieve consensus and reduce ambiguity.
    boundary: Mostly employed in social, political, and technological forecasting
      contexts, particularly when dealing with complex future scenarios that lack
      clear predictive patterns.
  expected_classification:
    depth: cross-domain
- id: e451042e8847f416757f2192523542eee59ec3b136227a148e26c551aec43299
  input_fb:
    name: Perspective-seeking Wisdom Practice
    definition: A reflective thinking practice where individuals step back from their
      own perspectives to evaluate and improve their reasoning through self-questioning
      and alternative viewpoint consideration.
    mechanism: The practice involves actively creating psychological distance from
      one's own thinking process, allowing for meta-cognitive evaluation and identification
      of potential blind spots or inconsistencies in reasoning.
    boundary: Applies when individuals have sufficient cognitive capacity to engage
      in self-reflection and can maintain the mental discipline to question their
      own assumptions. Fails when the cognitive load is too high or when the individual
      lacks the intellectual humility to genuinely consider alternatives.
  expected_classification:
    depth: cross-domain
- id: 5c6a142d08da89a902cd948dcb9407aa56b1f6a02dbeedfb9afd4c9a0d9c64a5
  input_fb:
    name: Human-ai Collaboration Framework
    definition: Effective AI implementation requires integrating human expertise with
      pre-built AI solutions to bridge capability gaps and accelerate adoption. The
      principle describes a hybrid approach where existing domain knowledge and AI
      tools work together to achieve outcomes that neither could deliver alone.
    mechanism: This is a practical heuristic for combining human and machine capabilities.
      Human expertise provides contextual understanding, business insight, and ethical
      judgment that AI systems lack. Pre-built AI solutions offer scalable automation,
      pattern recognition, and processing power that humans cannot match. The framework
      enables organizations to leverage both resources simultaneously, with humans
      guiding AI applications and AI augmenting human decision-making.
    boundary: Applies when organizations have domain expertise but lack AI development
      capability or resources. Fails when human expertise is irrelevant to the AI
      application or when the AI system is so advanced it can function independently
      without human oversight.
  expected_classification:
    depth: cross-domain
- id: 240c7d69abc67a8f623a4818ba66b1b09158c077b911b9d32b2bbe2211682b9c
  input_fb:
    name: Empty-fridge Strategy
    definition: A behavioral commitment technique where individuals impose physical
      or environmental constraints to prevent themselves from accessing tempting options,
      thereby avoiding temptation and maintaining discipline.
    mechanism: By physically restricting access to tempting items (like tying hands
      to mast or removing food from fridge), individuals eliminate the ability to
      act on immediate impulses, forcing compliance with long-term goals.
    boundary: Applies when individuals face temptation that conflicts with their goals
      and need external enforcement. Fails when the constraint is easily bypassed
      or when the temptation is not truly eliminated.
  expected_classification:
    depth: specialized
- id: 754e5bcff0d3bbbb6ebb2fd7789f7d52bb364d8583aa11d6886c44de9f8b39b9
  input_fb:
    name: Regression to the Mean Bias
    definition: Extreme measurements or outcomes tend to move toward average values
      over time, even without any intervention or treatment. This statistical phenomenon
      creates a false impression that a specific treatment or policy caused improvement
      when the change would have occurred naturally due to regression.
    mechanism: This is an empirical pattern, not a causal mechanism. Regression to
      the mean occurs because extreme values are inherently unstable and statistically
      likely to move toward the population average. When measuring individuals or
      groups at extreme points, random variation or natural fluctuation will tend
      to bring them closer to the mean on subsequent measurements. The phenomenon
      is not caused by any treatment or policy but is a mathematical property of skewed
      distributions.
    boundary: 'Applies when: (1) measurements or outcomes are extreme at baseline,
      (2) there is a time gap between measurement points, and (3) the system has natural
      variability. Fails when: (1) the measurement is perfectly stable and deterministic,
      (2) there is no natural variation in the system, or (3) the time interval is
      too short to observe the regression effect.'
  expected_classification:
    depth: universal
- id: 6b722aebcffe4937c30c3075a7059867116578e720e0e0669eddd56fa8977f61
  input_fb:
    name: Peircean Triadic Sign Structure
    definition: 'Peircean semiotics categorizes signs as triadic relations involving
      a sign, its object, and an interpretant, with three fundamental dimensions:
      quality (firstness), action (secondness), and generality (thirdness). This structure
      underlies all meaningful communication and represents the essential architecture
      of signification.'
    mechanism: The triadic structure operates as a hierarchical organization where
      firstness represents pure potential or quality (like a color or feeling), secondness
      represents direct interaction or reference (like a pointing finger), and thirdness
      represents conceptualization or inference (like a word that refers to a category).
      These three dimensions form a logical progression from immediate perception
      to abstract understanding, with each level enabling the next. The structure
      is not merely descriptive but represents the fundamental way meaning emerges
      through the interplay of these three modes of being.
    boundary: Applies to all systems of communication where meaning is generated through
      signs that relate to objects and are interpreted by minds. Fails when signs
      are purely physical or mechanical without interpretive or conceptual dimensions,
      or when the triadic relationship is reduced to binary or monadic structures
      (such as simple icons or indices without interpretants).
  expected_classification:
    depth: cross-domain
- id: 81d03354c97903d7728d93b0282c091c5df05e3777603bd39fb5fd36d61da401
  input_fb:
    name: Information As a Transformative Idea
    definition: The concept of information as a fundamental principle that has driven
      the Second Industrial Revolution and systems thinking, though current information
      theory only addresses statistical message transmission rather than meaning.
    mechanism: The idea of information serves as a foundational concept for systems
      thinking, particularly in understanding emergence, hierarchy, communication,
      and control, but current information theory lacks focus on semantic meaning.
    boundary: Applies to systems thinking and the development of information-based
      technologies. Fails when the semantic dimension of information is ignored in
      favor of purely statistical approaches to communication.
  expected_classification:
    depth: universal
- id: 068767776869cbeff7651757a2b3c3e317bafc837c5edf8d29437d1ea0728244
  input_fb:
    name: Futurist Kinetic Art Composition
    definition: Futurist painters transformed dynamic movements into sequential silhouettes
      using techniques inspired by chronophotography, capturing motion through repeated
      forms and curvatures.
    mechanism: The repeated shell image and range of curvatures in paintings like
      'Speed of a Motorcycle' create abstract shapes that represent motion, with the
      visual technique of repeated forms and curved lines serving as a method to capture
      and convey movement.
    boundary: Applies to Futurist paintings from the early 20th century that use repeated
      forms and curvatures to represent motion. Fails when applied to non-Futurist
      art or when motion is not represented through repeated visual elements.
  expected_classification:
    depth: specialized
- id: dd1b1430f8b974972288c6379d9a1d0e7f7e7c82a5c1bbb39d0b619a20fe521c
  input_fb:
    name: Information Design Community Networks
    definition: A community of practice emerges among information designers through
      shared professional identities, collaborative projects, and cross-regional connections
      that span multiple countries and organizational affiliations. This network structure
      enables knowledge exchange, collective problem-solving, and the development
      of shared design vocabularies across diverse geographic and institutional boundaries.
    mechanism: This is a descriptive model of how professional communities form and
      sustain themselves in the field of information design. The network is structured
      around individuals who maintain multiple affiliations (e.g., personal websites,
      institutional roles, collaborative projects) and who engage in cross-border
      professional relationships. These connections create a web of influence where
      design practices and innovations spread through shared participation in projects,
      conferences, and collaborative platforms rather than through hierarchical organization
      or single institutional control.
    boundary: Applies to information design professionals who maintain active participation
      in multiple collaborative contexts and geographic locations. Fails when professionals
      work in isolated silos or when design practices are strictly controlled by single
      organizations without cross-pollination.
  expected_classification:
    depth: cross-domain
- id: b68c57291495be4567fbc4849e00e20669ca33eb75d4ef50ff359a2e299813e0
  input_fb:
    name: Fear-based Technology Development Hindrance
    definition: A principle that societal fear and suspicion toward emerging technologies
      can impede their safe development by creating missteps that slow progress or
      drive development underground.
    mechanism: When society approaches new technologies primarily with fear and suspicion,
      it creates conditions that lead to missteps in development, such as premature
      rollouts or underground development, which prevent proper safety and reliability
      work from occurring.
    boundary: Applies to emerging technologies where public fear and suspicion can
      influence development paths. Fails when fear is appropriately channeled into
      constructive safety measures rather than causing development obstacles.
  expected_classification:
    depth: cross-domain
- id: a33b2a245b05e6abd349a742df5d04aee8a82fff2f998d1723e0dc653bc15027
  input_fb:
    name: Digital Health Passports and Algorithmic Surveillance
    definition: The emergence of digital health passports and algorithmic surveillance
      as new symbols of totalitarian repression in the biomedical security state.
    mechanism: Digital health passports and algorithmic systems replace physical coercion
      with virtual control mechanisms that silently shape human behavior and biomass
      through data processing and surveillance.
    boundary: Applies to the transition from physical to digital forms of authoritarian
      control in the context of pandemic governance. Fails when digital systems do
      not actively shape human behavior or biomass.
  expected_classification:
    depth: cross-domain
- id: 031af5444341e80123d189febee84dca03dd13dacd652f34f565745395448867
  input_fb:
    name: Virtualized Resource Abstraction
    definition: Virtualization creates isolated, independent computing environments
      by abstracting physical hardware resources into logically separate units. This
      abstraction enables multiple virtual systems to operate simultaneously on the
      same physical host while maintaining resource isolation and security boundaries.
    mechanism: Virtualization works by introducing a hypervisor layer that mediates
      access to physical resources (CPU, memory, storage, network) and allocates them
      to virtual machines. Each virtual machine operates as a distinct, isolated environment
      with its own operating system and resource allocation, while the hypervisor
      manages the underlying hardware and enforces security boundaries between virtual
      environments.
    boundary: Applies when physical hardware resources need to be shared among multiple
      independent computing environments. Fails when the abstraction layer introduces
      unacceptable performance overhead or when strict hardware-level control is required
      for real-time or embedded systems.
  expected_classification:
    depth: domain
- id: f236a41d4a978a29db32cd003faca771f654954c22d37ed13b320436311d014b
  input_fb:
    name: System Theory Foundations
    definition: Systems theory emerges from the recognition that complex phenomena
      cannot be understood through reductionist analysis alone, but require holistic
      approaches that consider interactions, feedback loops, and emergent properties.
      The theory builds upon foundational insights from physics, biology, and philosophy
      to describe how systems behave as integrated wholes rather than collections
      of parts.
    mechanism: Systems theory develops from the observation that natural and artificial
      systems exhibit behaviors that cannot be predicted from their individual components
      alone. These behaviors arise from the relationships between components, feedback
      mechanisms, and the organization of the system as a whole. The theory integrates
      multiple levels of explanation (formal, efficient, final, material) and recognizes
      that systems often display emergent properties that transcend their constituent
      elements.
    boundary: Applies when systems exhibit interdependence, feedback, and emergent
      behavior that cannot be reduced to linear cause-effect relationships. Fails
      when systems can be adequately described through linear, additive, or purely
      mechanistic analysis without considering holistic interactions.
  expected_classification:
    depth: cross-domain
- id: 98ef3029f92b50b4c01a6d8cd386ba9627d3a4dbca75975f93071e2fc6924106
  input_fb:
    name: Operational Fallacy and Systemic Misunderstanding
    definition: A pattern where systems are misunderstood at the operational level,
      leading to incorrect solutions that fail to address the fundamental nature of
      the problem.
    mechanism: The operational fallacy occurs when people treat meta-level problems
      as operational problems, applying surface-level solutions that don't address
      the root cause, often because they don't understand the system's logical structure.
    boundary: Applies when problems are misclassified as operational rather than meta-problems,
      particularly in situations where the solution requires higher-level understanding.
      Fails when the distinction between operational and meta-level problems is not
      recognized.
  expected_classification:
    depth: cross-domain
- id: 237d4528ed1e36fd5c2373bb35fbdfe2f544c314280aa9f48114fe7a55633826
  input_fb:
    name: Styling As Deceptive Simplicity
    definition: A design approach that uses visual styling to create the illusion
      of motion and speed, making objects appear more dynamic than they actually are.
    mechanism: Styling transfers aesthetic characteristics from one domain (like flight
      or automotive design) to everyday objects, creating visual cues that suggest
      motion and speed without functional benefit.
    boundary: Applies to design contexts where visual appeal is prioritized over functional
      necessity. Fails when the styling conflicts with actual performance requirements.
  expected_classification:
    depth: specialized
- id: e565178fc8c8a24e7579c08a994db0b24ee21f7c76444e0fd4a27cac2d063be9
  input_fb:
    name: Level-crossing in Mind-brain Translation
    definition: "A principle describing how translation between different levels of\
      \ description (from physical hardware to psychological software) creates fundamental\
      \ cognitive phenomena like self-awareness and G\xF6delian incompleteness."
    mechanism: "The translation process between levels of description creates a 'level-crossing'\
      \ that generates phenomena that cannot be fully explained by reductionist approaches\
      \ alone, similar to how G\xF6del's incompleteness theorem emerges from translation\
      \ between number-theoretical and metamathematical levels."
    boundary: Applies when translating between different levels of description in
      cognitive systems, particularly when moving from physical to psychological explanations.
      Fails when the translation process is not properly understood or when reductionist
      explanations are sufficient.
  expected_classification:
    depth: cross-domain
- id: c12695c1d4dd68df7846d16e522516dbce3298eda70f416592917703a1883dbe
  input_fb:
    name: Data Visualization As Communication Strategy
    definition: Data visualization serves as a strategic communication tool that can
      either reveal truth and foster understanding or function as a disinformation
      mechanism designed to maintain existing power structures. The same visual representations
      can be used for advocacy or manipulation depending on their intent and context.
    mechanism: 'Data visualization operates as a dual-purpose medium: it can present
      factual information in ways that make complex social realities accessible and
      compelling (as seen in Du Bois''s work), or it can be weaponized as a disinformation
      strategy to reinforce status quo narratives and discourage change (as exemplified
      by IBM''s ''Nobody gets fired for buying IBM'' approach). The medium''s power
      lies in its ability to make abstract data concrete and emotionally resonant,
      which enables both truthful storytelling and manipulative framing.'
    boundary: Applies when data visualization is used as a communication strategy
      that shapes perception or behavior. Fails when data visualization is purely
      technical or aesthetic without communicative intent, or when it is used to obscure
      rather than clarify information.
  expected_classification:
    depth: cross-domain
- id: 1b15be0bf1a5c5b7e479a302283a54e4a1893919b5bc650d1fd7ee49fd8a4955
  input_fb:
    name: Second Law of Systems-survival
    definition: A principle stating that in order to remain unchanged (stable) when
      rules change, a system must itself change its patterns of change or strategies.
    mechanism: The system must adapt its internal procedures and strategies to maintain
      stability when external conditions or rules shift, requiring a higher-order
      form of stability called Ultra-stability that can accommodate change without
      losing its essential nature.
    boundary: Applies to large systems that have achieved basic stability but must
      now adapt to changing rules or conditions. Fails when systems cannot or will
      not change their operational patterns to accommodate new constraints.
  expected_classification:
    depth: cross-domain
- id: ec970e76df207748b524769247613a2de1a0a1f9f2923707939cf1c9c9f96794
  input_fb:
    name: Visual-verbal Syntactic Equivalence
    definition: Both visual and verbal modes of communication follow structurally
      similar organizational principles, with each mode having its own grammatical
      systems that mirror the other in function and form. The principle recognizes
      that visual and verbal modes are not hierarchically arranged but exist as distinct
      yet equivalent means of expressing related meanings.
    mechanism: The etymological and historical development of terms like 'grammar'
      and 'syntax' reveals that the conceptualization of organization and structure
      in communication has been consistently applied across both visual and verbal
      domains. The word 'syntax' originally meant 'arrange battle formations' and
      'organize', indicating that the principle of structuring or organizing elements
      is fundamental to both modes of communication. This suggests that the same underlying
      organizational logic underlies both visual and verbal expression.
    boundary: Applies when comparing the historical development of linguistic and
      visual communication systems. Fails when examining only one mode in isolation
      or when comparing modes that do not share structural organizational principles.
  expected_classification:
    depth: cross-domain
- id: 31126190daf55fe20cd195443bae4ae40d3f2f51b15d5efceb73115e42da50b3
  input_fb:
    name: Failing to Fail Safe
    definition: Systems designed with fail-safe principles can still fail when those
      principles are not properly implemented or when the system's complexity exceeds
      the design's ability to handle all failure modes. The principle highlights the
      gap between theoretical safety guarantees and practical implementation risks.
    mechanism: This is a descriptive model of system design and safety implementation.
      The principle describes the relationship between theoretical fail-safe systems
      and their real-world performance, identifying that safety is not guaranteed
      by design alone but depends on proper implementation and understanding of all
      failure modes. The model categorizes systems as either theoretically safe or
      practically unsafe based on how well they handle actual failure conditions.
    boundary: Applies when systems are designed with fail-safe principles but face
      real-world complexity or implementation gaps. Fails when systems are not designed
      with any fail-safe principles or when the system's operational environment is
      completely outside the scope of the safety design.
  expected_classification:
    depth: cross-domain
- id: 1dabd69319a04b6ae26057c3b46389ec06b551b53937586898cae26dfcabadee
  input_fb:
    name: Psychological Triggers for Economic Problem-solving
    definition: A method for addressing economic dysfunction by identifying and applying
      psychological principles that can effectively solve complex problems.
    mechanism: The approach involves recognizing that economic problems often have
      psychological roots and can be solved by applying psychological insights rather
      than purely economic methods, using a checklist of psychological factors to
      identify the root causes of economic dysfunction.
    boundary: Applies when economic problems have psychological components that can
      be addressed through behavioral interventions. Fails when practitioners only
      consider economic factors and ignore psychological drivers of economic behavior.
  expected_classification:
    depth: cross-domain
- id: 040cef7efeba4e6c37d9704202425bfcbb505d589473a153ebcc345ffba32ee5
  input_fb:
    name: Experimental Typography Liberation
    definition: The emergence of digital typography enabled a liberation from traditional
      typographic constraints, allowing designers to experiment with expressive, non-representational
      forms that prioritize emotional impact over legibility and conventional meaning.
      This shift was catalyzed by the removal of historical and commercial restrictions
      in experimental design platforms.
    mechanism: Digital tools lowered the barrier to type creation and experimentation,
      enabling designers to explore abstract and expressive forms without the constraints
      of traditional letterform construction or commercial viability. The availability
      of digital platforms like Fuse magazine provided a space for designers to publish
      experimental fonts free from typical commercial briefs, fostering a culture
      of artistic exploration over functional typography.
    boundary: Applies when digital tools and experimental platforms provide designers
      with freedom from commercial or historical constraints. Fails when design is
      bound by strict functional requirements or when digital tools are not accessible
      to experimental designers.
  expected_classification:
    depth: domain
- id: b93eac95c85456dd968ced64dc59072b8c79485c5fad48fa6466b23ad225d458
  input_fb:
    name: Symbolic Resonance in Narrative
    definition: "Narrative elements resonate across multiple levels of meaning\u2014\
      personal memory, cultural archetype, and universal experience\u2014creating\
      \ a layered symbolic structure that enriches interpretation and emotional impact."
    mechanism: 'This is a descriptive model of how symbols function in narrative:
      specific elements (like ''dock'', ''river'', ''warrior'') activate pre-existing
      mental associations and archetypal frameworks that connect individual experience
      to broader cultural and psychological patterns. The resonance occurs through
      the embedding of familiar elements within new contexts, allowing readers to
      access deeper layers of meaning without explicit explanation.'
    boundary: Applies when narrative elements can be understood as carrying symbolic
      weight beyond their literal function. Fails when symbols are purely functional
      or when the reader lacks the cultural or personal context to access the archetypal
      associations.
  expected_classification:
    depth: cross-domain
- id: 98655f694ee50a86e292619beeb9ae7b6afd729c42a838f46acc7c78fd74da27
  input_fb:
    name: Art Nouveau Influence on European Art Movements
    definition: The spread and transformation of Art Nouveau aesthetics from Japan
      through Europe, influencing movements like Cubism, Surrealism, and Art Deco.
    mechanism: Japanese prints influenced European artists who synthesized these forms
      with existing movements like Art Nouveau, creating new artistic expressions
      that combined organic forms, refined borders, and elegant composition.
    boundary: Applies to the historical transmission of artistic styles from Japan
      through Europe and America. Fails when the cultural exchange is not documented
      or when artistic movements are not influenced by Japanese aesthetics.
  expected_classification:
    depth: cross-domain
- id: b08bc2c79ad6073adf945d79ab41e35fb0803864859e479e581ff2be9bc22abc
  input_fb:
    name: The Symbolic Power of the Number Four
    definition: A conceptual principle that the number four represents fundamental
      structural and symbolic organization in reality, from physical dimensions to
      human experience.
    mechanism: The number four serves as a universal organizing principle that appears
      consistently across physical reality (four fundamental particles), human experience
      (four directions, seasons, elements), and symbolic communication (four quarters
      of time and space), creating a framework for understanding structural reality.
    boundary: Applies to symbolic and design contexts where the number four is used
      as a fundamental organizing principle. Fails when the number four does not hold
      structural or symbolic significance in the specific context.
  expected_classification:
    depth: universal
- id: 3d54cb0b099153a87eee88d2672d35475a87e68cd20a8f4381af345bfbd8cfaf
  input_fb:
    name: Metaphorical Attenuation Strategy
    definition: Strategic use of metaphors to deflect criticism or minimize the impact
      of negative events by framing them in a way that reduces their perceived significance.
      The principle describes a communication technique where analogies are employed
      to shift attention away from damaging content or criticism.
    mechanism: This is a practical heuristic for managing perception and response
      to criticism. Metaphors provide a framing device that allows communicators to
      redirect focus from the core issue to a more favorable comparison or analogy.
      The technique works by leveraging familiar narratives (like sports metaphors)
      to create psychological distance from the problematic content, making it seem
      less threatening or consequential than it actually is.
    boundary: Applies when communicators need to address criticism or negative attention
      while maintaining control over the narrative. Fails when the metaphor is too
      transparent or when the audience recognizes the deflection as insincere. Also
      fails when the underlying issue is too significant to be adequately softened
      by analogy.
  expected_classification:
    depth: cross-domain
- id: 5ade92822083890bee318838a9b6d4c1a6876abc22746807f99682066eddb733
  input_fb:
    name: Cross-disciplinary Thinking in Research Impact
    definition: Effective research and business impact requires combining linear thinking
      with lateral thinking approaches to capture the full scope of influence and
      outcomes.
    mechanism: Academic research produces explicit knowledge while tacit knowledge
      - the collective understanding that's difficult to communicate - has the most
      significant impact on external audiences. Linear metrics alone fail to capture
      the true outcomes of influence.
    boundary: Applies to research and business contexts where both explicit and tacit
      knowledge must be leveraged. Fails when organizations rely exclusively on linear
      metrics or when interdisciplinary collaboration is not supported.
  expected_classification:
    depth: cross-domain
- id: 46ff833cc83971dc0e8a8cf335e96bfa3cf256b4118ed1d30fedf319cca0c8b1
  input_fb:
    name: Optimization Through Feedback Loops
    definition: Systems improve performance by iteratively adjusting parameters based
      on comparisons between predicted outcomes and true values, enabling continuous
      refinement of models or processes. This principle describes a feedback-driven
      mechanism for optimizing behavior in response to performance metrics.
    mechanism: Feedback optimization operates through a closed-loop process where
      systems compare predicted outputs with actual results to calculate error or
      reward. The system then adjusts internal parameters to minimize error or maximize
      reward, using performance metrics as the basis for these adjustments. This process
      is iterative and self-correcting, with each cycle improving the system's accuracy
      or efficiency based on observed discrepancies.
    boundary: Applies when systems have measurable outcomes and can adjust parameters
      in response to performance differences. Fails when systems lack clear metrics
      for comparison, or when adjustments cannot be made due to constraints in the
      system architecture or operational environment.
  expected_classification:
    depth: universal
- id: b9220dd8b1a9c5cb7b63663e0dfb73d5c8ca6bd0e4f4c004e359a79c844e267c
  input_fb:
    name: Metaphorical Reasoning in Design
    definition: A principle describing how designers use metaphorical reasoning to
      create intuitive user interfaces by mapping familiar concepts from one domain
      to another.
    mechanism: Designers adopt familiar metaphors (like desktop interfaces) from one
      domain to make new systems more intuitive, allowing users to apply existing
      knowledge and mental models to new contexts.
    boundary: Applies to design contexts where familiar metaphors can be mapped to
      new systems. Fails when the metaphor is not intuitive or when the target domain
      is completely unrelated to the source metaphor.
  expected_classification:
    depth: cross-domain
- id: 1253325498475c899d07ea367cb700f601c35fa678f6e643dfae8f4357169110
  input_fb:
    name: Trauma-induced Cognitive Rigidity
    definition: Trauma exposure leads to a fundamental shift in how individuals process
      ambiguous or novel stimuli, causing them to either blank out or superimpose
      traumatic memories onto neutral input. This cognitive inflexibility represents
      a protective mechanism that becomes maladaptive over time.
    mechanism: The human mind's normal response to ambiguous stimuli involves imagination
      and pattern recognition, but trauma disrupts this process. Traumatized individuals
      develop a cognitive rigidity where they either fail to engage with ambiguous
      input (going blank) or compulsively project traumatic content onto it. This
      occurs because the brain's threat-detection system becomes hyperactive, causing
      all novel or unclear stimuli to be interpreted through the lens of past trauma.
    boundary: Applies when individuals have experienced severe or repeated trauma
      that affects their cognitive processing. Fails when trauma is mild or when the
      individual has developed effective coping mechanisms and mental flexibility
      through therapy or other interventions.
  expected_classification:
    depth: cross-domain
- id: 8eab1fdb35c48ce7d6ec15600f7b136190b17a41bd402309807acf868101ed9a
  input_fb:
    name: Surrealist Techniques As Psychoanalytic Methods
    definition: Surrealist artistic techniques like doodling, collage, displacement,
      and exquisite corpse function as methods that tap into unconscious processes
      similar to psychoanalytic practices such as free association and dream analysis.
    mechanism: These techniques bypass conscious control to access and express unconscious
      content, much like how free association in psychoanalysis allows thoughts to
      flow without censorship, revealing hidden mental processes.
    boundary: Applies to artistic and psychological methods that aim to bypass rational
      consciousness to access unconscious material. Fails when the techniques are
      used purely for aesthetic effect without psychological intent.
  expected_classification:
    depth: cross-domain
- id: 62f36ffcd2e13a8d05ad05c57957c509ba063213e71d6ca809fb80b13f055d19
  input_fb:
    name: Collaborative Creative Ecosystem
    definition: A creative environment where diverse contributors (artists, programmers,
      musicians, designers) collaborate around shared tools and methodologies to produce
      interactive and experiential works. The principle describes a self-reinforcing
      community of practice that builds on shared experiences and iterative development.
    mechanism: This is a descriptive model of how creative communities form and sustain
      themselves. The ecosystem emerges from initial shared projects that inspire
      continued collaboration, with participants bringing different expertise (programming,
      music, design) to create hybrid works. The community grows through successful
      outcomes that attract new members and validate the approach, creating a feedback
      loop of shared learning and tool development.
    boundary: 'Applies when: (1) participants have shared creative tools or platforms,
      (2) projects build on previous collaborative experiences, (3) there is ongoing
      community development. Fails when: (1) projects are isolated or single-authored,
      (2) there is no shared platform or toolset, (3) collaboration is transactional
      rather than ongoing.'
  expected_classification:
    depth: cross-domain
- id: 1f874b280b1957f419204d2e102d2223bf489e0b94d1d5bb750ee46638134ffc
  input_fb:
    name: Disattribution Technique
    definition: A therapeutic approach for clarifying personal responsibility in situations
      where one person's behavior affects another, helping to put problems into perspective.
    mechanism: When someone feels guilty about another person's depression or problems,
      they often incorrectly assume they are the cause. This technique helps identify
      the actual boundaries of personal responsibility and recognizes that one person's
      behavior does not necessarily cause another's mental health issues. It involves
      questioning the logic of assuming personal causation and examining whether the
      situation is truly within one's control.
    boundary: Applies when someone feels guilty about another person's problems or
      depression and incorrectly assumes personal responsibility. Fails when the person
      cannot distinguish between their actual influence and their perceived responsibility.
  expected_classification:
    depth: specialized
- id: 0bf2a2c0173f9c396637b0820757584dc9cae218a0b9449f2aeeb541ef0658ad
  input_fb:
    name: Body Movement As Expressive and Analytic Tool
    definition: Body movement serves as both a scientific analytic tool (originally
      developed for military and physiological research) and an expressive medium
      (for arts and entertainment), with the former being repurposed into the latter.
    mechanism: Scientific techniques for capturing body movement, such as chronophotography
      and motion capture suits, are creatively adapted for artistic expression, enabling
      new forms of storytelling and character development in animation and performance.
    boundary: Applies when scientific tools for measuring body movement are repurposed
      for artistic or expressive use. Fails when the tools remain exclusively for
      scientific analysis or when the artistic application lacks a clear connection
      to the original analytical purpose.
  expected_classification:
    depth: cross-domain
- id: 127bdede505eeb5763ec128d2c6e8a87e7393a1add6c78fa30497be9d0682e8c
  input_fb:
    name: Dialogic Critique Framework
    definition: A philosophical and literary approach that challenges monologic thinking
      by emphasizing multiplicity, dialogue, and the inherent openness of meaning.
      The framework positions meaning as emergent through interaction rather than
      fixed in isolated expression.
    mechanism: This is a descriptive model of how meaning is constructed through dialogic
      relationships. In Bakhtin's view, language and thought are fundamentally dialogic
      - shaped by the interplay of multiple voices, perspectives, and contexts. The
      model describes the structure of discourse as inherently relational, where every
      utterance exists in tension with and in response to other voices, creating a
      dynamic field of meaning that resists static interpretation.
    boundary: Applies when meaning is understood as emerging from the interaction
      between multiple voices or perspectives. Fails when meaning is conceived as
      singular, fixed, or isolated from context. The framework is most relevant in
      literary analysis and philosophical discourse that emphasizes multiplicity over
      unity.
  expected_classification:
    depth: cross-domain
- id: 1d023da4814b54f7fec96e18f985547646ebcd3951318d7c00427cc32a3035c0
  input_fb:
    name: Design System Reusability
    definition: Design systems enable teams to build interfaces faster and more consistently
      by creating reusable components and patterns that solve common problems. The
      principle describes how systematic componentization reduces reinvention and
      increases design velocity.
    mechanism: 'This is a practical heuristic: creating and maintaining a library
      of reusable UI elements (buttons, forms, headers) allows teams to apply proven
      solutions to new problems without rebuilding from scratch. The approach works
      because it leverages prior design decisions and implementation, reducing cognitive
      load and development time. Teams benefit from shared understanding and consistency
      across products.'
    boundary: Applies when teams face recurring design or implementation challenges
      and have the capacity to invest in system maintenance. Fails when teams lack
      the resources to build or maintain a component library, or when the system becomes
      too rigid to accommodate unique use cases.
  expected_classification:
    depth: specialized
- id: 72188d315b0353d70f9bb0f73b6a4daf42781c07f058920119414a5d6bd940a1
  input_fb:
    name: Duality in Design
    definition: Duality in design represents the fundamental principle that life and
      design must distinguish themselves from the whole as 'other' to manifest, creating
      dynamic tension between opposing forces.
    mechanism: Designs that integrate duality create dynamic relationships through
      the tension between opposing forces, mirroring the fundamental characteristic
      of life that distinguishes itself from the whole to exist as individual entities.
    boundary: Applies to designs that recognize and incorporate the fundamental principle
      that separation and opposition create meaningful contrast and dynamic energy.
      Fails when designs ignore the necessity of opposition for meaningful expression.
  expected_classification:
    depth: cross-domain
- id: 60b8388a3079c2a2533880c5a026fc180ba186b68c340198ce1090f1cb19ac4b
  input_fb:
    name: Iterative Design Feedback Loop
    definition: Design systems and processes benefit from continuous feedback integration
      that cycles through measurement, insight generation, and iterative improvement.
      This creates a self-reinforcing cycle of refinement that scales with team size
      and complexity.
    mechanism: 'The feedback loop operates through three key phases: (1) measurement
      of outcomes against success metrics, (2) gathering insights from cross-functional
      teams (research, design, engineering), and (3) informing next steps to restart
      the cycle. As team size increases, communication complexity grows combinatorially,
      necessitating structural adjustments like team splitting to maintain efficiency.
      The process is cyclical and self-correcting, with each iteration improving system
      robustness and alignment.'
    boundary: Applies when design systems involve measurable outcomes and cross-functional
      collaboration. Fails when feedback is not systematically collected or when teams
      are too small to benefit from structured iteration. Also fails when the feedback
      loop becomes disconnected from actual user or stakeholder input.
  expected_classification:
    depth: cross-domain
- id: 2b60ceb333b8952d8409e5f4357152130266cdc9eedffaf917f5525ce4f82322
  input_fb:
    name: Design-driven Policy Innovation
    definition: Public sector organizations are increasingly adopting design methods
      and collaborative approaches to policy development, enabling more citizen-centered
      and cross-sector innovation. This shift represents a strategic transformation
      in how governments engage stakeholders and structure innovation efforts.
    mechanism: Design-driven policy innovation emerges when public sector entities
      adopt human-centered design processes that emphasize stakeholder engagement,
      multidisciplinary collaboration, and iterative development. These approaches
      enable organizations to move beyond traditional top-down policy design toward
      more participatory and adaptive governance models that can better address complex
      societal challenges.
    boundary: Applies when public sector organizations have the capacity and willingness
      to implement human-centered design processes and cross-sector collaboration.
      Fails when organizations remain rigidly structured around traditional bureaucratic
      processes or lack the resources and cultural openness to embrace participatory
      design methods.
  expected_classification:
    depth: cross-domain
- id: a7e1799785b6eb7f20c976393816121d0cbcf133a50eecd5ed23e3a607b64901
  input_fb:
    name: Creative Coding Curriculum Development
    definition: A process of developing computational art and design curricula by
      adapting computer science teaching methods to visual arts and design students
      through iterative experimentation and community collaboration.
    mechanism: The process involves breaking down existing computer science teaching
      methods, experimenting with new approaches for visual arts students, and gradually
      improving the curriculum through year-by-year refinement based on student feedback
      and teaching experiences.
    boundary: Applies to educational contexts where computer science methods are adapted
      for visual arts and design students. Fails when the adaptation does not account
      for the different learning styles and creative approaches of visual arts students.
  expected_classification:
    depth: cross-domain
- id: fac478c76c4307f73fd84cea59798cf745627e542acdc6605415b1f10c418435
  input_fb:
    name: Multidisciplinary Team-based Concept Recognition
    definition: A method for recognizing valuable concepts by leveraging diverse perspectives
      from multidisciplinary teams.
    mechanism: The approach involves bringing together team members from different
      disciplines to provide varied perspectives on concept value, enabling collective
      recognition of the most significant concepts to pursue.
    boundary: Applies when organizations want to promote exploration and recognition
      of concepts across different stakeholder perspectives. Fails when team diversity
      is not achieved or when the collaborative process lacks structure to effectively
      integrate different viewpoints.
  expected_classification:
    depth: cross-domain
- id: 2938e48d6abee5ecffd87159e41b2b162b9da81d422eea293717c477c907246d
  input_fb:
    name: Music As Formal Syntax Vs. Expressive Meaning
    definition: A principle contrasting formal grammatical approaches to music with
      the deeper expressive meaning that emerges from intangible psychological connections
      between musical structures and human emotional states.
    mechanism: While music appears to follow purely formal syntactic rules (notes,
      chords, measures), its deeper beauty and meaning arise from subconscious emotional
      triggers that connect musical symbols to internal psychological structures rather
      than external referents.
    boundary: Applies to the analysis of music as a formal system versus its expressive
      power. Fails when music is understood purely as formal syntax without considering
      emotional or psychological dimensions.
  expected_classification:
    depth: cross-domain
- id: 042ef647da8ee501e94978c2ba0ef462333d0eee26e6177283063c54368a1608
  input_fb:
    name: Xavier Glorot Weight Initialization
    definition: A method for initializing neural network weights by sampling from
      a uniform distribution to maintain variance across layers.
    mechanism: "Weights are drawn from a uniform distribution over the interval [-\u221A\
      6/(\u221A(n+m)), \u221A6/(\u221A(n+m))], where n is the number of inputs and\
      \ m is the number of outputs, to preserve signal variance through the network."
    boundary: Applies to neural networks with sigmoid or tanh activation functions.
      Fails when used with ReLU activation functions or when layer dimensions are
      not properly accounted for.
  expected_classification:
    depth: specialized
- id: 012663d3317dc8f5b404735785760b014a506a258dc71fb91eb8d3d3fdc36ded
  input_fb:
    name: Family-based Visa Limitations and Immigration Policy
    definition: A constraint in U.S. immigration policy where family-based visas are
      capped at 480,000 annually, with specific limitations on who can be sponsored
      and how long the process takes.
    mechanism: The 480,000 annual cap on family-based visas creates a bottleneck where
      only immediate relatives can be sponsored without additional constraints, while
      non-immediate relatives face extended waiting periods due to country-specific
      limits and the subtraction of immediate relative visas from the total pool.
    boundary: Applies to U.S. immigration policy for family-based visa categories.
      Fails when the policy changes or when the visa limits are not properly understood
      in relation to the total visa allocation.
  expected_classification:
    depth: domain
- id: 8f6d521cc00b2acd6883594472569f4b9bbd941bffbef74c5ddc741dce0b8a83
  input_fb:
    name: Surveillance Capitalism Behavioral Manipulation
    definition: A system where social influence mechanisms are systematically deployed
      to manipulate user behavior for economic gain through surveillance revenues.
    mechanism: Social pressure, comparison, modeling, and subliminal priming are orchestrated
      through private digital spaces to tune, herd, and manipulate user behavior in
      service of surveillance capitalism's economic objectives.
    boundary: Applies to digital platforms where user behavior is systematically shaped
      for revenue generation. Fails when users have genuine choice or transparency
      about how their behavior is manipulated.
  expected_classification:
    depth: cross-domain
- id: 7fc6884e2922649bd4a3e45b782238a5873091cbcf7c3d4e49f781ad8f438197
  input_fb:
    name: Vector Database Integration Pattern
    definition: Vector databases serve as a foundational infrastructure component
      for RAG and multi-agent systems, functioning as a unified data access layer
      that bridges disparate data sources and enables advanced query capabilities.
      The principle describes how vector databases can be extended beyond their core
      function to support feature store-like operations and agentic workflows.
    mechanism: Vector databases act as a common abstraction layer that enables cross-domain
      data integration and query execution. They can be extended to implement feature
      store functionality through additional logic, support agentic patterns via hyper-query
      capabilities, and provide a unified interface for multi-vendor database management.
      The integration pattern involves using vector databases not just for similarity
      search but as a foundational component for complex data pipelines and AI workloads.
    boundary: Applies when vector databases are used as core infrastructure components
      in RAG systems or multi-agent architectures. Fails when vector databases are
      used in isolation without integration into broader data pipelines or when they
      lack the extensibility to support feature store or agentic patterns.
  expected_classification:
    depth: cross-domain
- id: 8086186685d0e93fdab0e90d883ecb68cc904adf4b8718e78b28a4f8110577cd
  input_fb:
    name: Feedback Policy Implementation
    definition: Effective policy design requires understanding and leveraging feedback
      loops to address system behavior. Policies that align with feedback structures
      can successfully manage system dynamics, but their success depends on the ability
      to recognize and communicate these relationships.
    mechanism: 'This is a practical heuristic for policy design: successful feedback
      policies must be structured to work with the natural feedback loops of a system
      rather than against them. The principle prescribes a method of policy-making
      that emphasizes alignment with system behavior, but does not establish a causal
      chain between specific policy actions and outcomes. It describes a pattern of
      effective policy implementation rather than a verified cause-effect relationship.'
    boundary: Applies when policies can be designed to interact with existing feedback
      structures in a system. Fails when system dynamics are too complex or unknown
      to identify relevant feedback loops, or when communication barriers prevent
      effective policy explanation and adoption.
  expected_classification:
    depth: cross-domain
- id: 0535cbc3849b5a800b8289765c608058e29e23b3219ff3ae8edf416fd33e1e8d
  input_fb:
    name: General-purpose Ai As Everything As a Service (eaas)
    definition: A transformative AI system that would provide access to all human
      knowledge and skills through software agents and physical robots, eliminating
      the need for large hierarchical teams of specialists.
    mechanism: General-purpose AI would grant access to all human knowledge and skills,
      with physical capabilities varying by embodiment (robots for construction, transportation,
      inspections, etc.) to execute any task that requires intelligence.
    boundary: Applies when AI systems can access and utilize all human knowledge and
      skills. Fails when AI systems lack access to human knowledge or cannot execute
      physical tasks.
  expected_classification:
    depth: cross-domain
- id: efe82e081f365f6c90f7049b33a347073dbc2e12b207fc6d12b5b710c09e6281
  input_fb:
    name: Arctangent Function As Inverse Tangent
    definition: The arctangent function (atan or arctan) is the mathematical inverse
      operation to the tangent function, where if y = tan(x), then x = atan(y).
    mechanism: The arctangent function reverses the tangent operation by taking the
      ratio of the opposite side to the adjacent side in a right triangle and returning
      the corresponding angle in radians.
    boundary: Applies when working with trigonometric relationships in right triangles
      where the tangent of an angle is known. Fails when the relationship is not based
      on right triangle geometry or when the tangent function is not invertible.
  expected_classification:
    depth: universal
- id: 75bff4748d7460a917642142eb560c43018bff24d8d9d5302b93d5e81ada3a35
  input_fb:
    name: Wgbh-tv Wipe Cycle Communication Experiment
    definition: A television experiment that synthesized multiple levels of time and
      space into a single audio-visual experience using simultaneous frequencies of
      perception to explore communication dynamics.
    mechanism: The experiment connected multiple locations (M.I.T., hospital, educational
      library, Boston Airport) through closed-circuit television with five cameras
      and twenty-seven monitors, allowing random switching between channels and creating
      a teledynamic continuum that brought communication processes into focus.
    boundary: Applies to the specific WGBH-TV television experiment conducted in Boston
      with direct closed-circuit inputs from multiple locations. Fails when the technical
      infrastructure or connection protocols are not available to enable the multi-location
      communication synthesis.
  expected_classification:
    depth: cross-domain
- id: 656c1cea722a8ad73b12d42c79c84547cee9379f8bfb1308f8d33b54095a2bcc
  input_fb:
    name: Integrated Science Program
    definition: An interdisciplinary academic program that combines multiple scientific
      disciplines into a single major to expose students to connections across different
      fields of natural sciences.
    mechanism: The program integrates biology, chemistry, physics, and mathematics
      into a single curriculum, allowing students to see commonalities and patterns
      across different scientific domains rather than studying them in isolation.
    boundary: Applies to undergraduate education programs that emphasize interdisciplinary
      learning. Fails when students lack the foundational knowledge in multiple disciplines
      or when the program structure doesn't support deep integration across fields.
  expected_classification:
    depth: cross-domain
- id: 02c983131005a69ab85c32cb2d841ac4da126c9aa691409d52a1b1086bfa6528
  input_fb:
    name: Inconsistency-avoidance Hostility Effect
    definition: A psychological phenomenon where individuals develop negative feelings
      toward others when they are induced to harm or treat others poorly, due to the
      cognitive dissonance created by inconsistent behavior.
    mechanism: When people are manipulated into performing actions that contradict
      their self-image or values, they experience psychological discomfort that they
      resolve by changing their attitudes toward the person who induced the action,
      often developing negative feelings toward that person.
    boundary: Applies in situations where individuals can be induced to perform actions
      that conflict with their values or self-concept. Fails when individuals are
      aware of the manipulation or when the actions are not significant enough to
      create cognitive dissonance.
  expected_classification:
    depth: domain
- id: cd36ecbe6fee8545fc15ea3f0bb91c0aef55804d1e196ab5e3231530b168fc5e
  input_fb:
    name: Scientific Method Development and Global Knowledge Accumulation
    definition: The historical progression of scientific advancement through improved
      instruments, methodologies, and collaborative knowledge building that expanded
      human understanding across civilizations.
    mechanism: Advances in technology and methodology (better optical lenses, accurate
      instruments, chemical manipulation) enabled more precise observations of natural
      phenomena. The development of research standards and the scientific method created
      a framework for empirical validation and peer collaboration, allowing scientists
      to build upon each other's work and make iterative progress based on both personal
      and collective observations.
    boundary: Applies to the historical development of scientific knowledge from the
      Renaissance through modern periods where technological advances enabled more
      accurate measurement and observation. Fails when applied to contexts where scientific
      methodology was not yet established or where technological limitations prevented
      accurate measurement.
  expected_classification:
    depth: cross-domain
- id: 9fdce7b564194db8b4677368e83bac24c1f3b6d4ef98a748f5890b453d1bd855
  input_fb:
    name: Cultural Translation in Design Education
    definition: A design pedagogy approach where students interpret cultural symbols
      and messages through creative projects, revealing how design can communicate
      across cultural boundaries and reveal unintended meanings.
    mechanism: Students create projects that incorporate cultural elements (like Chinese
      characters on vellum cards) which are then interpreted by others unfamiliar
      with the cultural context, leading to unexpected revelations about how design
      messages can be misunderstood or reinterpreted in different cultural contexts.
    boundary: Applies to design education projects where students work with cultural
      symbols and messages that may be misinterpreted by others. Fails to specify
      the broader educational framework or systematic approach to cultural translation
      in design.
  expected_classification:
    depth: cross-domain
- id: 013c5e2fe0a0fa81da0ec939bd776956b75827284216f95c27a062497899eb24
  input_fb:
    name: Economist's Production Possibility Framework
    definition: An economic model that illustrates the trade-offs and opportunity
      costs between different types of content or knowledge transfer, where the actual
      content transferred may be small but the generalist advantage lies in recognizing
      and applying fundamental paradigms.
    mechanism: The framework allows generalists to identify and apply fundamental
      economic principles and paradigms for thought and communication, enabling them
      to navigate unfamiliar content by recognizing underlying patterns and structures
      rather than being overwhelmed by specific details.
    boundary: Applies when content transfer involves fundamental economic principles
      that can be generalized across domains. Fails when content is highly specialized
      or domain-specific without generalizable economic principles.
  expected_classification:
    depth: domain
- id: 16fa045f3d1d2b3a7351c846b9ae133ec693c5b594bb47e1eaa70f057c4e6cef
  input_fb:
    name: Statistical Regularities Approach
    definition: A statistical approach that relates events to their alternative possibilities
      rather than focusing on specific causal chains, treating events as selections
      from multiple potential outcomes based on chance.
    mechanism: Instead of identifying specific causes for individual events, this
      approach treats events as random selections from a set of possible alternatives,
      where chance determines which alternative is realized.
    boundary: Applies when analyzing events that could have occurred in multiple ways
      but are observed as one particular outcome. Fails when events have deterministic
      causes or when the set of alternatives is not clearly defined.
  expected_classification:
    depth: universal
- id: 3bf0cf6aa9198df8030e58d451ce8bee448b278f6adf36ed36ff6bf447f99448
  input_fb:
    name: Systemic Ordering Through Classification
    definition: Meaningful systems of classification emerge from the need to organize
      and understand complex environments, often through the identification and categorization
      of boundaries between order and disorder. These systems reflect cultural values
      and provide structure for interpreting experience.
    mechanism: Classification systems arise when environments contain sufficient complexity
      that simple observation is insufficient for understanding. They function as
      cognitive tools that help humans navigate and make sense of their surroundings
      by creating categories and boundaries. The process involves identifying patterns,
      establishing rules for inclusion or exclusion, and applying these consistently
      to new instances. These systems are not neutral but embody the values and priorities
      of the culture or individual creating them.
    boundary: Applies when there is sufficient complexity in an environment to warrant
      categorization and when the system serves a practical or interpretive function.
      Fails when the environment is too simple to require classification or when the
      system is arbitrary and lacks functional coherence.
  expected_classification:
    depth: cross-domain
- id: 38fadbd7bfd571474b2fd3bbfb4e9eda53925e79dfa47fa153a06cb77c455dba
  input_fb:
    name: Digital Augmentation of Human Capability
    definition: Digital technologies extend human cognitive, emotional, and physical
      capacities by providing tools that support thinking, feeling, connecting, and
      shopping. These technologies enable consumers to access information, communicate,
      and make decisions more effectively than in the past, while also shaping their
      experiences through seamless integration across platforms.
    mechanism: Digital tools function as extensions of human capability, enabling
      cognitive outsourcing, emotional support, and social interaction. They provide
      expanded access to information, communication, and mobility, allowing users
      to make better choices and share preferences globally. The integration of these
      tools into daily life creates a seamless experience that shapes consumer behavior
      and decision-making processes.
    boundary: Applies when digital tools are integrated into human decision-making
      and behavioral patterns. Fails when digital tools are isolated or not part of
      a broader ecosystem of human interaction and capability extension.
  expected_classification:
    depth: cross-domain
- id: 01fae82094ebc3eec055647f03e9eaea6973c0f162a8853e4f4eac5495a7a55c
  input_fb:
    name: The Red Queen Hypothesis
    definition: A principle proposing that organisms must continuously evolve to maintain
      their fitness in a changing environment where competitors and predators are
      also evolving.
    mechanism: The hypothesis suggests that species must constantly adapt and evolve
      to keep pace with the evolutionary changes of their competitors, predators,
      and parasites, creating a dynamic equilibrium where no species can maintain
      a stable advantage for long.
    boundary: Applies to evolutionary contexts where species face ongoing selective
      pressures from competitors and predators. Fails when species can maintain stable
      conditions or when evolutionary pressures are minimal.
  expected_classification:
    depth: domain
- id: 0292b41f838226a245b412a6c0c41ddae18bf30797920bd56df7a4f30777236f
  input_fb:
    name: Relationship-centric Growth
    definition: Sustainable business growth is best achieved by prioritizing deep,
      meaningful relationships over rapid expansion. This approach focuses on building
      trust and long-term value with customers, partners, and stakeholders rather
      than pursuing metrics-driven scaling.
    mechanism: 'This is a normative heuristic: focusing on relationship-building produces
      sustainable growth because it creates loyal customer bases, reduces acquisition
      costs, and builds authentic market presence. The principle prescribes a method
      for achieving business success that emphasizes quality over quantity in customer
      engagement and operational focus.'
    boundary: Applies when businesses can invest time and resources in cultivating
      customer relationships rather than pursuing rapid market expansion. Fails when
      organizations face immediate financial pressures that require rapid scaling
      or when the business model inherently depends on high-volume, low-touch interactions.
  expected_classification:
    depth: domain
- id: a88e7320b648e44f08148bf014baf311b1f90fa1341f3d4f95b98f18d624daec
  input_fb:
    name: Alchemy's Psychological and Cultural Impact on Scientific Development
    definition: The persistent engagement of alchemists with their failed experiments
      produced psychological and cultural benefits that drove continued empirical
      work, serving as a motivational force for scientific advancement despite the
      lack of practical success.
    mechanism: The alchemists' continued investment in their work, despite chronic
      failure, created a psychological satisfaction and perceived wisdom that functioned
      as a motivational driver for empirical investigation, similar to how religious
      mythos motivated Western civilization.
    boundary: Applies to historical scientific development where failed empirical
      approaches were sustained by psychological benefits rather than practical success.
      Does not apply to cases where motivation comes from direct practical outcomes.
  expected_classification:
    depth: cross-domain
- id: 7566e7aed9bb2e55511959c3cefd90c531b30f6104c90003e05a4dd685dcfa99
  input_fb:
    name: Active Looking and Data Organization Principle
    definition: A method for systematically gathering and organizing information to
      build visual models of complex problems by collecting all relevant data and
      laying it out for comprehensive analysis.
    mechanism: The process involves actively collecting data from multiple sources
      using public disclosure laws and internet resources, then organizing all collected
      information side-by-side to enable comprehensive visual analysis and pattern
      recognition.
    boundary: Applies to problem-solving contexts where complex information needs
      to be organized for analysis. Fails when data collection is incomplete or when
      information is not properly organized for visual analysis.
  expected_classification:
    depth: cross-domain
- id: 5ef8467ac3f2f1e3e636cd41520954d18362a3d284a983deff748c93653c36c5
  input_fb:
    name: Versatile Ai Application Across Domains
    definition: Artificial intelligence systems demonstrate broad applicability across
      diverse domains and use cases, from productivity tools and business functions
      to programming environments and prompt engineering. This versatility enables
      AI to automate tedious tasks, support various business applications, and solve
      complex problems through adaptable frameworks.
    mechanism: The versatility of AI systems stems from their ability to process and
      generate responses based on patterns learned from training data, allowing them
      to be applied across different contexts and domains without requiring complete
      re-engineering. This adaptability is enhanced by configurable parameters and
      modular architectures that support customization for specific use cases.
    boundary: Applies when AI systems can be adapted to new domains or tasks through
      configuration, retraining, or prompt engineering. Fails when the AI system is
      highly specialized for a narrow domain and cannot be easily adapted to other
      contexts or when the domain requires domain-specific knowledge that the AI lacks.
  expected_classification:
    depth: cross-domain
- id: 810233ee2906c8400b8264c8fc685a641261c06dac7ed3c8ab2aeabc327c6ac2
  input_fb:
    name: Semiotic Interaction Layering
    definition: A semiotic relationship that serves one function can simultaneously
      serve as the basis for additional semiotic layers when encountered by different
      agents with different ecological roles. The same sign or signal can be repurposed
      by competing or symbiotic organisms, creating cascading semiotic interactions.
    mechanism: This is a descriptive model of how semiotic systems can be layered
      or stacked. The same sign or signal that enables one organism to achieve a goal
      (e.g., wasp finding oviposition site) can be interpreted by another organism
      as a new semiotic cue (e.g., predator exploiting the same signal). This creates
      a hierarchical or nested structure of semiotic meaning where one interaction
      becomes the foundation for another, without the original function being lost
      or destroyed.
    boundary: Applies when the same semiotic signal or sign is encountered by multiple
      species or agents with different ecological roles. Fails when the signal is
      specific to one species or when the same signal is not interpretable by other
      agents in a semiotic sense.
  expected_classification:
    depth: cross-domain
- id: 25ef405567c7ea7426a01865e3f4b9c58e9d08d5e2d46ee2aac7f5c5d055c07d
  input_fb:
    name: Computational Limits and Emergent Capabilities
    definition: Computational systems face fundamental limits in solving certain problems,
      yet they can exhibit emergent capabilities when operating within bounded constraints
      and leveraging structured information processing. These systems demonstrate
      that while some problems are uncomputable or undecidable, practical AI and machine
      learning can still achieve sophisticated behavior through approximation, pattern
      recognition, and context-aware adaptation.
    mechanism: "Computational systems are subject to theoretical limits such as the\
      \ halting problem and G\xF6del's incompleteness theorems, which show that certain\
      \ mathematical truths cannot be proven within formal systems. However, practical\
      \ AI systems can approximate solutions to complex problems by leveraging structured\
      \ data, pattern recognition, and bounded computational resources. These systems\
      \ often exhibit emergent properties not explicitly programmed, such as language\
      \ understanding or problem-solving in specific domains, because they process\
      \ information in ways that allow for generalization and adaptation within constraints."
    boundary: Applies when computational systems operate within bounded resources
      and structured information environments. Fails when systems attempt to solve
      undecidable problems or when information is completely disconnected from context
      (e.g., digital decoupling from environment). Also fails when systems lack sufficient
      structure or data to support emergent behavior.
  expected_classification:
    depth: universal
- id: 2e7808f78c3e34ded174db5b1380ead36ba4a1438fe5800226fd15c815059a76
  input_fb:
    name: Industry-academia Collaboration in Ai Development
    definition: A model of collaborative research and development between academic
      institutions and industry partners in the field of AI and agentic systems.
    mechanism: The collaboration involves joint projects, knowledge exchange, and
      practical application of theoretical concepts, where industry partners provide
      real-world context and academic institutions contribute theoretical foundations
      and research methodologies.
    boundary: Applies to research and development partnerships between universities
      and industry organizations in AI fields. Fails when there is insufficient communication
      or when theoretical research does not align with practical industry needs.
  expected_classification:
    depth: cross-domain
- id: 98698b4a8278e27293982ab43bd01ded0c2a0097cb581ef95563d4a8c44e164e
  input_fb:
    name: Human-thing Entanglement
    definition: The interconnected and interdependent relationships between humans
      and nonhumans (animals, environments, objects, systems) form a web of mutual
      engagement where both parties are actively involved in shaping each other's
      existence and meaning. This concept emphasizes that humans and nonhumans are
      not separate categories but part of a continuous, dynamic system of interaction.
    mechanism: This is a descriptive model that categorizes the structure of relationships
      between humans and nonhumans. The model identifies human-thing entanglements
      as a specific type of relationship where boundaries between human and nonhuman
      actors are blurred and mutually constitutive. These entanglements involve dependencies,
      co-dependencies, and contingent interactions that shape the agency and identity
      of all participants in the relationship.
    boundary: Applies to systems where humans and nonhumans interact in ways that
      influence each other's behavior, meaning, and existence. Fails when human and
      nonhuman actors are completely separate or when the relationship is purely instrumental
      or utilitarian without mutual influence or co-constitution.
  expected_classification:
    depth: cross-domain
- id: 59cc4fe5fb24cb1d59ebda61ff5eef247900de0f29ce8f239a4bc6da5649210d
  input_fb:
    name: Aesthetic Symbol Substitution Principle
    definition: Thematic linguistic symbols in political contexts are stripped away
      from 'political' control and detonate without external elaboration, while aesthetic
      experiences resist external interpretation and cannot be mystically understood
      through external authority.
    mechanism: Thematic symbols lose their political power and become self-contained,
      while aesthetic experiences maintain their autonomy and resist external interpretation
      or control by authoritative sources.
    boundary: Applies specifically to the relationship between thematic symbols in
      political contexts and aesthetic experiences that resist external interpretation.
      Fails when symbols can be meaningfully interpreted or when aesthetic experiences
      can be controlled by external authorities.
  expected_classification:
    depth: cross-domain
- id: aa571aa30a919e201c2930edecd3199221df2630600d6133fa44882551f4a400
  input_fb:
    name: Infant Hunger and Magical-religious Experience
    definition: The experience of infant hunger creates a state of autonomous flow
      that is symbolically tied to magical-religious conditions, connecting the infant's
      immediate need to broader existential and symbolic frameworks.
    mechanism: The infant's hunger creates a state of autonomous flow that transcends
      ordinary time and space, establishing a foundational symbolic connection between
      physical need and spiritual or magical experience. This flow state emerges from
      the direct relationship between hunger and its response, creating a self-contained
      experience that becomes symbolically significant.
    boundary: Applies specifically to the infant's immediate experience of hunger
      and its symbolic transformation into magical-religious consciousness. Does not
      extend to adult experiences or other forms of need satisfaction. The connection
      to magical-religious experience is limited to the infant's earliest developmental
      stage.
  expected_classification:
    depth: cross-domain
- id: dfb8257e5bf2b202101867d43836bb912d61ed4da4c640ce0a23fcb012481a5e
  input_fb:
    name: Metaphorical Perspective Broadening
    definition: Systematically engaging with diverse conceptual frameworks and metaphorical
      thinking expands cognitive flexibility and creative problem-solving capabilities.
      The principle describes a method for deliberately shifting mental models to
      access novel insights and approaches.
    mechanism: 'This is a practical heuristic for cognitive expansion: actively seeking
      out unfamiliar domains, metaphors, and conceptual analogies forces the mind
      to make novel connections between seemingly disparate ideas. When individuals
      engage with foreign concepts (like architecture, geography, or entertainment),
      they activate different neural pathways and mental models that can be applied
      to familiar problems. The process works by creating cognitive distance from
      routine thinking patterns, which enables the brain to reframe challenges through
      alternative lenses.'
    boundary: Applies when individuals are willing to engage with genuinely unfamiliar
      domains or metaphorical frameworks. Fails when the exercise becomes superficial
      or when participants only seek out familiar concepts under the guise of 'broadening.'
      Also fails when the metaphorical shift is too abstract or disconnected from
      the original problem space.
  expected_classification:
    depth: cross-domain
- id: 98e9c038812537d68e605a573aa3b0abe17eb0470ae8795aaf0a9dc90663adc0
  input_fb:
    name: Trauma-driven Memory Distortion
    definition: Trauma exposure causes memory to become distorted through emotional
      intensity and psychological defense mechanisms, leading to inconsistent recollection
      of events over time. The distortion is not random but follows predictable patterns
      based on emotional valence and relationship context.
    mechanism: Traumatic memories are encoded with heightened emotional intensity
      that overwhelms normal memory consolidation processes. This creates fragmented,
      emotionally charged recollections that are susceptible to reconstruction under
      different psychological states or relationship contexts. The emotional arousal
      associated with trauma activates the amygdala, which interferes with hippocampal
      encoding, resulting in incomplete or altered memory traces that can be reinterpreted
      based on current emotional needs or relationship dynamics.
    boundary: Applies when traumatic events are experienced with high emotional intensity
      and psychological impact. Fails when memories are formed under neutral or low-stress
      conditions, or when trauma is not emotionally significant to the individual's
      sense of self or relationships.
  expected_classification:
    depth: cross-domain
- id: 7d8b5928d12d557fc959bc4b436455d19246c58272cc20ad5eab4cb4248313ae
  input_fb:
    name: Cosmic Order Representation
    definition: Historical cosmic models reflect the cultural and scientific understanding
      of humanity's place in the universe, evolving from geocentric to heliocentric
      frameworks while maintaining symbolic and illustrative traditions. These representations
      serve both explanatory and aesthetic functions in visual communication.
    mechanism: Cosmic maps and illustrations function as hybrid visual-communicative
      tools that blend scientific observation with symbolic interpretation. They represent
      human attempts to organize and understand universal order through visual metaphors,
      where celestial bodies are depicted as both physical entities and symbolic elements.
      The evolution from Ptolemaic to Copernican systems shows how scientific discoveries
      reshape visual representations of cosmic structure.
    boundary: Applies to historical visual documentation of astronomical systems where
      illustrations attempt to represent universal order. Fails when illustrations
      are purely artistic or abstract without attempting to map cosmic structure,
      or when they represent non-astronomical symbolic systems.
  expected_classification:
    depth: cross-domain
- id: 015b40f08499323ba7dd08333988ab2514630fa3e3af29553d1cc06a3365b63e
  input_fb:
    name: Bauhaus and Modernist Architecture Influence
    definition: The influence of modernist architectural principles, particularly
      from Bauhaus and German modernism, on design philosophy and personal aesthetic
      choices.
    mechanism: The passage demonstrates how architectural principles from Walter Gropius
      and Mies van der Rohe shape Bob's design philosophy and personal choices, including
      his holiday home design and office space.
    boundary: Applies to design philosophy and personal aesthetic choices influenced
      by modernist architectural principles. Fails when the architectural influence
      is not explicitly stated or when the design is not connected to these principles.
  expected_classification:
    depth: domain
- id: b2f16685de63df1e0324a73587248054519e3d7c12baae8f30a4f3b3caf1dc39
  input_fb:
    name: Start-simple Design Strategy
    definition: Effective creative problem-solving requires beginning with small,
      actionable steps rather than comprehensive planning. This approach leverages
      the power of immediate execution to overcome mental inertia and reduce the psychological
      burden of large-scale projects.
    mechanism: This is a practical heuristic for overcoming planning paralysis and
      project inertia. By focusing on a small, manageable piece of work or applying
      a ridiculous deadline, individuals can bypass the tendency to over-plan and
      instead build momentum through early action. The strategy works by reducing
      cognitive load and creating immediate feedback loops that enable mid-course
      corrections.
    boundary: Applies when individuals face large, complex problems that seem overwhelming
      or when planning becomes a barrier to action. Fails when the problem requires
      extensive upfront analysis or when the small steps don't provide meaningful
      feedback for adjustment.
  expected_classification:
    depth: cross-domain
- id: 308f24749fd256b46059b80a2f9ac3d6061618010cfd34e515591a9a496b98c4
  input_fb:
    name: Universal As Ground for Relations
    definition: The universal serves as the foundational basis for relations between
      individual instances and the physical environment, embodying commonalities that
      enable suprasubjective apprehension within animal cognition. This concept explains
      how abstract categories emerge from concrete experiences to structure perception
      and understanding.
    mechanism: The universal operates as a conceptual framework that connects specific
      instances to broader patterns in the physical world. It provides the cognitive
      structure through which individual experiences are organized into meaningful
      categories that transcend immediate sensory data, enabling animals to apprehend
      relationships beyond their direct perception.
    boundary: Applies when abstract categories emerge from concrete experiences to
      enable suprasubjective understanding. Fails when the relationship between individual
      instances and universal concepts is not mediated through animal cognition or
      when the universal does not serve as a basis for relational understanding.
  expected_classification:
    depth: cross-domain
- id: 01ab6fcdd58a30a3aaccedc7ff6c7ab03343b2ac018c4974b064dc9ddb593c8a
  input_fb:
    name: Creative Persistence Through Adversity
    definition: Successful creative achievement requires sustained effort over extended
      periods despite repeated setbacks, rejection, and periods of uncertainty. The
      principle describes the pattern of long-term commitment to creative work even
      when immediate outcomes are not achieved.
    mechanism: This is a descriptive pattern of creative persistence, not a causal
      mechanism. The passages document the experience of sustained creative work over
      years with repeated rejections and delayed rewards, but do not isolate a specific
      cause-effect chain that explains why persistence leads to eventual success.
      The pattern shows that creative individuals continue working despite external
      validation being absent for extended periods.
    boundary: 'Applies to creative endeavors where long-term commitment is required
      and immediate success is not guaranteed. Fails when: (1) the creative work is
      abandoned before extended periods of effort; (2) the individual does not continue
      working after initial rejection; (3) the creative process is not sustained over
      years rather than months or weeks.'
  expected_classification:
    depth: domain
- id: 732f1aa077b4e9de35c0f96ffa409046642a22bc8f5066993692549b83cb68f2
  input_fb:
    name: Symbolic Harmony in Design
    definition: The eternal principles of symbolism in design, including the harmony
      of the trinity, union of two, balance of yin and yang, and magic of the ether,
      provide universal language for clear communication.
    mechanism: These symbolic principles transcend cultural boundaries and provide
      a shared visual vocabulary that connects human experience across different societies
      and time periods, allowing designers to communicate complex ideas through recognizable
      patterns.
    boundary: Applies to designers who recognize and incorporate these timeless symbolic
      principles in their work. Fails when designers abandon these universal symbols
      in favor of modern meaningless approaches.
  expected_classification:
    depth: cross-domain
- id: e2fbfef9da414d2be31ef7d5cdfb63963370bfeffcd4d53d3378e4b7bebf7264
  input_fb:
    name: Neighborhood Perception and Traffic Patterns
    definition: Residential neighborhood boundaries and social dynamics vary significantly
      based on traffic conditions and street characteristics, with residents' sense
      of community and territoriality influenced by traffic intensity and street design.
    mechanism: Residents' perception of neighborhood boundaries and social connection
      is directly influenced by traffic patterns and street characteristics, with
      light traffic fostering community feeling while heavy traffic creates impersonal,
      public spaces.
    boundary: Applies to residential areas where traffic patterns and street design
      affect social interaction and territorial perception. Fails when traffic conditions
      are not the primary factor in neighborhood perception.
  expected_classification:
    depth: cross-domain
- id: 2401f32fa7fef6032055c4dc8c6dd62ff5740ac990bc9dbcc292f43423909e6f
  input_fb:
    name: Brent Spar Campaign Effectiveness
    definition: The Greenpeace campaign against Shell's planned sinking of the Brent
      Spar oil platform successfully shifted international policy and executive authority
      by mobilizing public opinion and media attention.
    mechanism: Greenpeace leveraged media coverage of direct action (helicopter landing
      attempt) and cost comparison data to create public pressure that forced Shell
      to abandon its original plan, demonstrating that environmental activism could
      challenge corporate power.
    boundary: Applies when environmental groups can mobilize international media and
      public opinion to challenge corporate decisions. Fails when corporate power
      is too entrenched or when media coverage is insufficient.
  expected_classification:
    depth: cross-domain
- id: f71468889f6c08eb9899aec1a68e39e62a6707142e6e2cdbcbf63d1e6acfffd3
  input_fb:
    name: Soft Systems Methodology Implementation Process
    definition: A general approach to purposeful activity that incorporates formal
      systems thinking without requiring individuals to act as rational automata,
      emerging as a flexible methodology rather than a fixed problem-solving framework.
    mechanism: The methodology evolves through practical application across various
      contexts, transitioning from analyst supervision to permanent manager oversight,
      and adapting to different problem types without rigid definitions of 'the problem'.
    boundary: Applies as a flexible, context-adaptive approach to systems thinking
      that can be applied across different domains and problem types. Fails when applied
      as a rigid, one-size-fits-all framework rather than a flexible methodology.
  expected_classification:
    depth: cross-domain
- id: dba5ba38c8e7c4d97e476a5b11b25530b00add0c9772d90de69c06371e091fdf
  input_fb:
    name: Iatrogenics in Social Science and Policy
    definition: Social science theories and policy interventions can cause more harm
      than good due to their concentration of power and amplification of risks in
      Extremistan environments.
    mechanism: Unlike medicine where iatrogenics (harm from medical treatment) is
      distributed across the population (Mediocristan effects), social science and
      policy iatrogenics concentrate risks in specific areas, making them more dangerous
      and capable of causing systemic collapse (Extremistan effects).
    boundary: Applies to social science and policy interventions where risks concentrate
      rather than distribute. Fails when the intervention is properly distributed
      or when the system is not susceptible to concentrated risks.
  expected_classification:
    depth: cross-domain
- id: 66da546f3b1c98cff766118c61f20fef625bef1b6cdb657f9daa52c059f21402
  input_fb:
    name: Commodification of Avant-garde Art and Design
    definition: The process by which avant-garde artistic and design movements become
      absorbed into mainstream culture and commercialized.
    mechanism: Fringe art and design movements that initially challenge dominant methods
      are gradually absorbed into mass culture, becoming commodified and losing their
      edge through mainstream adoption.
    boundary: Applies to the cultural and economic process of artistic and design
      movement mainstreaming. Fails when applied to specific artistic techniques or
      individual works.
  expected_classification:
    depth: cross-domain
- id: 03dcb3fa191ebb8a44951d5a675511d708e55707386a19f5fcc1d2a10c814392
  input_fb:
    name: New Media Principles As Cultural Continuity
    definition: Principles attributed to new media can be traced back to older cultural
      forms and media technologies like cinema, suggesting these principles are not
      unique to new media.
    mechanism: The passage demonstrates that concepts and practices associated with
      new media already existed in earlier media forms, showing a historical continuity
      rather than a revolutionary break.
    boundary: Applies to the historical analysis of media principles and their evolution
      across different media technologies. Fails when applied to media that truly
      lack historical precedent.
  expected_classification:
    depth: domain
- id: 03c0dd6dd1355bd51c417bac319e606a4647aa097889effd783a47ecc429bafd
  input_fb:
    name: Foster Care Youth Empowerment Program
    definition: A program designed to empower foster-care youth through group building,
      creative expression, and skill development to address high rates of criminal
      conviction, public assistance dependency, and educational underachievement.
    mechanism: The program uses group dynamics and creative arts to build competencies,
      accountability, and self-awareness in youth who have experienced instability
      and fragmented authority structures.
    boundary: Applies to foster-care youth who face high rates of negative outcomes
      (crime, public assistance, low education completion). Fails when youth lack
      engagement or when the group environment doesn't support the developmental needs.
  expected_classification:
    depth: domain
- id: 0ac288e0b88bf2f9a5f30900cc0895c99751ce6f6750178ebdc530088ca81fbd
  input_fb:
    name: Fictional Text As Societal Mirror
    definition: Fictional narratives function as interpretive frameworks that enable
      the analysis and evaluation of real-world events, behaviors, and social structures.
      These narratives provide structured meanings that can be applied to understand
      and judge actual occurrences within society.
    mechanism: Fictional texts serve as metaphorical or templatic models that map
      onto real-life situations, allowing readers to interpret actual events through
      the lens of narrative structure. The symbolic and thematic elements of fiction
      create a framework for understanding psychological, sociological, or metaphysical
      aspects of reality. This process involves transferring meaning from fictional
      contexts to real-world contexts through analogy and thematic correspondence.
    boundary: Applies when fictional narratives contain sufficient thematic or structural
      elements to enable meaningful comparison with real-world phenomena. Fails when
      the fictional text lacks relevant thematic content or when the real-world context
      is too dissimilar to permit useful analogy.
  expected_classification:
    depth: cross-domain
- id: 1e2b13ff3fb73875257162ff344ab13605ced4693d2eea229b37c5b89f2a220f
  input_fb:
    name: Reversal Thinking
    definition: Effective problem-solving often requires reversing the direction of
      reasoning or approach, particularly when conventional methods fail to address
      fundamental contradictions. This principle suggests that breakthrough insights
      emerge not from incremental adjustments but from radical reframing of assumptions.
    mechanism: This is a practical heuristic for overcoming cognitive bias and structural
      limitations in reasoning. When standard approaches produce inconsistent or unsatisfactory
      results, reversing the problem's framing allows new patterns to emerge. The
      mechanism operates by forcing a reevaluation of foundational premises that were
      previously accepted as unchangeable. It is not a causal chain but a methodological
      prescription for breaking deadlocks in thinking.
    boundary: 'Applies when: (1) conventional approaches to a problem yield contradictory
      or incomplete solutions; (2) there is a clear, well-defined contradiction between
      established theories or methods; (3) the problem space allows for alternative
      framing without losing essential structure. Fails when: (1) the reversal introduces
      logical inconsistencies or violates fundamental constraints; (2) the problem
      is not genuinely contradictory but merely complex; (3) the reversal is purely
      speculative without any grounding in established principles.'
  expected_classification:
    depth: cross-domain
- id: 02f9e129a84244df79f901e3948696460a2c8862e15a25f05753a0cad1e571ed
  input_fb:
    name: Psychological Model Integration in Graphics Systems
    definition: A principle for incorporating psychological research findings into
      automated graphics reading systems while maintaining design flexibility and
      avoiding over-reliance on human behavioral patterns.
    mechanism: Psychological models provide insights into human problem-solving approaches
      but should not be used as direct templates for automated systems; instead, they
      guide the identification of fundamental objects and structures needed for automated
      graphics interpretation.
    boundary: Applies when designing automated systems that incorporate human cognitive
      research. Fails when psychological models are used as rigid templates rather
      than guiding principles.
  expected_classification:
    depth: domain
- id: 03edc7254fb41dcddfa5a7ea4cc3c62494be505e724bdbfe5ebb924ea8d2e8bf
  input_fb:
    name: Scientific Theories As Human Conjectures
    definition: Scientific theories are not discovered in nature but are created through
      human imagination and rearrangement of existing ideas with the intention of
      improvement.
    mechanism: Human minds actively create scientific theories by combining, altering,
      and adding to existing ideas rather than passively reading them from nature
      or being written into us.
    boundary: Applies to the origin and creation of scientific theories as human constructs.
      Fails when theories are seen as direct discoveries from nature or when the creative
      process is not acknowledged.
  expected_classification:
    depth: domain
- id: 38e67d88d6d237fdfa85d1429cb9aa63d66740b86328f506211bd8b63e7c6e8a
  input_fb:
    name: Force-driven Motion Change
    definition: "Changes in an object's motion state \u2014 including speed, direction,\
      \ or rotation \u2014 are exclusively caused by forces acting upon that object.\
      \ Forces are defined as pushes or pulls that alter the physical trajectory of\
      \ matter in response to applied energy or interaction."
    mechanism: A force is any interaction that, when unopposed, will change the motion
      of an object. This includes linear motion (forward/backward movement), angular
      motion (rotation), and changes in velocity or direction. Forces can originate
      from physical contact (like pushing a door) or from fields (like gravity or
      electromagnetic attraction). The effect of a force depends on both its magnitude
      and direction, and it operates according to Newton's laws of motion, which describe
      how mass and acceleration relate to applied force.
    boundary: Applies when forces act on physical objects in a way that alters their
      motion state. Fails when motion changes occur without any external force (e.g.,
      spontaneous motion in a vacuum or motion due to internal energy alone). Also
      fails in systems where motion is governed by quantum mechanics or relativistic
      effects where classical force definitions break down.
  expected_classification:
    depth: universal
- id: 88ae353e8abbd08191249055a980e95e0cf5622f0aef3bb3529ce20aabc5b7a9
  input_fb:
    name: Emotional Resonance in Communication
    definition: Effective communication, whether in advertising, design, or human
      interaction, achieves impact by aligning with universal emotional responses
      that transcend cultural and individual differences. This principle recognizes
      that emotional engagement is not a byproduct but a core mechanism for capturing
      attention and driving action.
    mechanism: "Emotional resonance occurs when communicative elements\u2014words,\
      \ visuals, or expressions\u2014activate universal emotional responses rooted\
      \ in biological and psychological foundations. These responses are not learned\
      \ or culturally constructed but are innate, as demonstrated through microexpression\
      \ analysis and cross-cultural studies. The alignment of content with these universal\
      \ emotions creates an immediate, visceral connection that bypasses rational\
      \ processing and directly influences perception and behavior."
    boundary: Applies when communicative elements are designed to evoke or reflect
      universal emotional states. Fails when content relies solely on culturally specific
      references or abstract logic without emotional anchoring. Also fails when emotional
      content is inauthentic or forced, as it can trigger counter-responses like suspicion
      or irritation.
  expected_classification:
    depth: cross-domain
- id: 72748eaefd8e5cb10f807c2a3fcb63e0780212d7afb762d5ea59f9b0fddc765b
  input_fb:
    name: Ambiguous Sorting Task
    definition: A cognitive assessment method designed to test participants' ability
      to categorize real-world phenomena based on both domain and deep structural
      similarities.
    mechanism: The task presents 25 cards describing real-world phenomena and asks
      participants to sort them into categories based on either domain (economics,
      biology) or deep structure (causal chains, feedback loops), requiring abstract
      reasoning and pattern recognition across different fields.
    boundary: Applies to cognitive research studies with university students from
      diverse academic backgrounds. Fails when participants lack the conceptual framework
      or domain knowledge to identify deep structural patterns.
  expected_classification:
    depth: cross-domain
- id: 7a691900a1192cf161a82779484058eaf54fa2ed92bd62ba273a1af3b637896f
  input_fb:
    name: Figure-ground Relationship
    definition: The figure-ground relationship describes how visual elements organize
      into dominant and subordinate components, where one element stands out as the
      focal point while the other serves as background. This relationship is not fixed
      but depends on spatial arrangement, contrast, and contextual interpretation.
    mechanism: The figure-ground relationship emerges from perceptual organization
      principles, where the human visual system naturally segments scenes into foreground
      and background based on contrast, boundary definition, and spatial arrangement.
      When elements are arranged with clear separation or contrast, one becomes the
      figure and the other becomes the ground. This is not an absolute property but
      a perceptual interpretation that can shift based on context or design intention.
    boundary: Applies when visual elements can be perceptually separated into dominant
      and subordinate components. Fails when elements are indistinguishable in terms
      of contrast, size, or spatial organization, or when the visual system cannot
      establish a clear focal point due to lack of defining characteristics.
  expected_classification:
    depth: cross-domain
- id: 0a4ea76cb3511212d80f04d589759731528aa968ac32679a987c11635a2e03c5
  input_fb:
    name: Systemic Blind Spot
    definition: Systems practitioners observe that established institutions and dominant
      paradigms often fail to recognize their own structural limitations, leading
      to responses that exacerbate rather than address root problems. This creates
      a paradox where the very tools meant to solve systemic issues become part of
      the problem.
    mechanism: This is an empirical pattern, not a causal mechanism. The pattern emerges
      when systems respond to crises with solutions that reinforce existing structures
      rather than challenge them. The passages document this recurring dynamic in
      economic policy and institutional behavior, showing that classical economists'
      insistence on austerity during financial crises exemplifies this blind spot.
      The pattern is observable across different contexts where established approaches
      are applied despite evidence of their failure to address underlying systemic
      conditions.
    boundary: Applies when established systems or institutions respond to crises with
      solutions that maintain or reinforce existing structures rather than addressing
      root causes. Fails when systems demonstrate genuine adaptive capacity or when
      external forces compel structural change beyond institutional control.
  expected_classification:
    depth: cross-domain
- id: 3d7209e451251c1663ac7f30351141bb02a0251cb44040525ad6620dba607534
  input_fb:
    name: Product Liability and Safety Standards
    definition: When a defective product causes injury, the manufacturer or artist
      is held legally responsible for resulting injuries and damages, requiring proactive
      safety measures and insurance coverage.
    mechanism: The legal framework establishes liability when product defects cause
      harm, creating a cause-effect relationship between defective design/production
      and injury outcomes, with insurance providing financial protection.
    boundary: Applies when a product defect directly causes injury or harm to users.
      Fails when injuries occur from factors outside the product's design or when
      proper safety measures are implemented.
  expected_classification:
    depth: cross-domain
- id: 0bbd0fa7abb48cb09ac74c53f1ffe5bc90af29fbfb9ab64577ac3d5143536f26
  input_fb:
    name: Self-awareness and Skill Development
    definition: A principle for avoiding delusion and achieving growth by accurately
      assessing one's skills and continuously developing relevant competencies.
    mechanism: Self-awareness enables individuals to identify their actual capabilities
      and weaknesses, allowing them to build practices that develop relevant skills
      and maintain progress through regular checkpoints that enable redirection when
      necessary.
    boundary: Applies when individuals have the capacity for honest self-assessment
      and can implement development practices. Fails when people are unwilling to
      accept honest feedback or avoid confronting their limitations.
  expected_classification:
    depth: cross-domain
- id: edf9ed2c8bfcc2651d2452c436839adcb6fa1a05a5dbced2be50d657a759ef6d
  input_fb:
    name: Self-referential Incompleteness
    definition: Mathematical systems capable of expressing basic arithmetic cannot
      be both complete and consistent; they must either contain undecidable propositions
      or contradict themselves. This principle reveals an inherent limitation in formal
      systems that attempt to reason about their own structure.
    mechanism: 'The mechanism operates through self-reference: a formal system that
      can encode its own statements can construct a proposition that essentially says
      ''this statement is not provable within this system.'' If the statement were
      provable, it would be false (contradicting the system''s consistency), but if
      it were false, it would be provable (making it true). This creates a logical
      paradox that forces the system to either omit some truths or include contradictions.'
    boundary: "Applies to formal systems that can express basic arithmetic and support\
      \ self-referential encoding. Fails when the system is too weak to express arithmetic\
      \ or when it lacks the capacity for self-reference through G\xF6del numbering\
      \ or similar encoding techniques."
  expected_classification:
    depth: universal
- id: a6c5d88ae318958cb38c66f045ed172ac8909331a4e48842c2e26d3237ca7d64
  input_fb:
    name: Genius Maker Leadership
    definition: A leadership approach that focuses on creating environments and systems
      capable of extracting and utilizing all available intelligence to solve complex
      challenges, rather than relying solely on individual geniuses.
    mechanism: Leadership creates organizational conditions that aggregate distributed
      intelligence, foster collaborative problem-solving, and enable collective insight
      generation across diverse knowledge domains.
    boundary: Applies when organizations need to solve complex, multi-faceted challenges
      that require distributed intelligence. Fails when leadership focuses exclusively
      on individual talent rather than systemic intelligence aggregation.
  expected_classification:
    depth: cross-domain
- id: 00675820799f321f9f0c8059b3c924a7c8ca4ad6c334fe71c80eba0a4689e82b
  input_fb:
    name: Visual-textual Artistic Integration
    definition: The principle that truly great works of art and literature require
      a balanced integration of visual and textual elements, where each medium supports
      and enhances the other rather than existing in isolation.
    mechanism: When words and pictures work together in harmony, they create a synergistic
      effect that allows each medium to leverage the strengths of the other, with
      visual elements providing emotional impact and textual elements offering narrative
      depth and specificity.
    boundary: Applies to artistic works where both visual and textual elements are
      actively integrated rather than simply coexisting. Fails when one medium dominates
      or when the two elements are completely independent.
  expected_classification:
    depth: domain
- id: 906d19e3108de1b188498a0bb62140dbdac9f5512a5f6c850269e94d02c472e0
  input_fb:
    name: Einstein's Business Moment
    definition: Business challenges remain fundamentally the same across industries,
      but the approaches to solving them are rapidly evolving due to AI and new capabilities.
    mechanism: While core business questions and objectives remain constant, AI removes
      traditional constraints of time, cost, and human limitation, enabling fundamentally
      new approaches to delivering outcomes.
    boundary: Applies to business contexts where fundamental questions remain the
      same but new capabilities enable different solutions. Fails when business problems
      are entirely new rather than restructured by new capabilities.
  expected_classification:
    depth: cross-domain
- id: f5b436a0dc003b1d76dd26cde39a6683bf709a418cad319a7e9bb87ab917db94
  input_fb:
    name: Mythic Resonance in Cultural Symbols
    definition: Cultural symbols and meanings persist across time and context by recycling
      and reinterpreting foundational mythic structures. These mythic elements maintain
      emotional and cognitive power through their deep embedding in collective memory
      and symbolic systems.
    mechanism: Mythic elements function as reusable semantic building blocks that
      can be recontextualized in new forms while retaining their core symbolic meaning.
      When modern cultural artifacts incorporate mythic motifs, they tap into pre-existing
      emotional associations and cognitive frameworks that were established in earlier
      mythic systems. This process allows for rapid recognition and resonance because
      the symbolic structures are already encoded in human cultural memory.
    boundary: Applies when cultural artifacts reuse or reference established mythic
      patterns that have deep historical roots in human symbolic systems. Fails when
      symbols are entirely novel or drawn from non-mythic sources that lack historical
      cultural embedding.
  expected_classification:
    depth: cross-domain
- id: 579e0a5c1ee2c29bbc0f468759ef893fa37880ccd12a473f38765e8c5a93e2ee
  input_fb:
    name: Interdisciplinary Learning and Organizational Agility
    definition: Organizations must adopt interdisciplinary collaboration and modular
      thinking approaches to adapt to 21st-century complexity and innovation demands.
    mechanism: The rise of MOOCs and arts/sciences bridging demonstrates that learning
      and collaboration are shifting toward modular, interdisciplinary approaches
      that replace rigid thinking patterns with agile problem-solving methods.
    boundary: Applies to organizations seeking to enhance innovation and adaptability
      in complex environments. Fails when organizations resist interdisciplinary approaches
      or maintain rigid siloed structures.
  expected_classification:
    depth: cross-domain
- id: 050439ca50891cc2a2d8aad42f13ecdabeb7f5e4a15ea3f0354dd43e5e2b23bc
  input_fb:
    name: Python Age Grouping and Aggregation
    definition: A data processing technique for categorizing continuous numerical
      data into discrete groups and computing summary statistics.
    mechanism: The code divides age values by 10, applies floor function to round
      down, multiplies by 10 to create decade-based groups, then uses groupby to calculate
      median income for each age group.
    boundary: Applies to numerical data that can be categorized into discrete ranges,
      particularly age data. Fails when data is not numeric or when grouping criteria
      don't align with the desired categories.
  expected_classification:
    depth: specialized
- id: 811e36260555ad25cf3f7f2649ffd6b811513b50a2afa6b3b5b7581efafb949e
  input_fb:
    name: Competitor Mindset Adaptation in Mma
    definition: A strategic approach where coaches must understand and integrate techniques
      from multiple fighting styles to defend against diverse opponent threats, rather
      than relying solely on their specialty expertise.
    mechanism: Coaches must expand beyond their traditional expertise to learn new
      techniques and train fighters to combine multiple styles, creating mixed fighting
      techniques that adapt to each opponent's skills.
    boundary: Applies to combat sports where coaches must defend against opponents
      with different fighting specialties. Fails when coaches remain rigidly attached
      to single fighting style expertise.
  expected_classification:
    depth: cross-domain
- id: 1fa8829a4e4b0bdbe3d499270be1c9c24585de417c33e7b7edb9b6cab1a6c96f
  input_fb:
    name: Interdisciplinary Design Thinking
    definition: A design approach that integrates multiple interconnected elements
      (levers) to create novel solutions, where understanding the whole system enables
      unprecedented outcomes and rethinking of traditional practices.
    mechanism: When designers understand how different components of a system relate
      to each other, they can identify novel combinations and applications that lead
      to breakthrough innovations, particularly when applying knowledge from one domain
      to another.
    boundary: Applies when designers have cross-domain experience that allows them
      to see connections between seemingly unrelated fields. Fails when designers
      lack the systemic perspective or when the domains are completely unrelated.
  expected_classification:
    depth: cross-domain
- id: b3bd0d58c376e74df57ccc415d71d71379b709e1fcb6d8cd377df9dcc0d78d40
  input_fb:
    name: Systemic Instability
    definition: Systems that lose stability experience catastrophic failure regardless
      of external conditions or apparent strength. Instability is a systemic vulnerability
      that can affect entities of any scale, from microscopic to macroscopic.
    mechanism: Instability in systems arises when internal structural or operational
      conditions create a feedback loop that amplifies deviations from equilibrium.
      When a system's components are not properly balanced or controlled, small perturbations
      can cascade into irreversible collapse. The failure occurs not due to external
      forces alone, but because the system's own architecture is inherently unstable.
    boundary: Applies when a system's internal dynamics create self-reinforcing deviations
      from stable operation. Fails when the system has robust feedback controls or
      when failure results from external forces rather than internal instability (e.g.,
      collision, external shock).
  expected_classification:
    depth: cross-domain
- id: 9b0232a361b0683e958b84ae965bb7c90d54e03027481bf3451553de097050bb
  input_fb:
    name: Polysemous Story Structure
    definition: A multilevel nested structure where each step or substory mirrors
      the same structural elements as stories at different levels of analysis, creating
      stories that can be interpreted at multiple informative levels.
    mechanism: Each substory maintains the same structural organization as stories
      above and below it, allowing the same elements of a 'good' story to be found
      at multiple levels of analysis, creating a recursive structure that enables
      multiple interpretations.
    boundary: Applies to narrative structures where each level mirrors the same organizational
      principles as other levels. Fails when the structure does not maintain recursive
      self-similarity across levels.
  expected_classification:
    depth: cross-domain
- id: c2ba1e774280e1ee985d668d2a048bbe6ae41ec65e280ba1f6f3db91ab43af93
  input_fb:
    name: User Tactics Vs Designer Strategies in Spatial Media
    definition: The dynamic relationship between designers who create structured spatial
      environments (strategies) and users who navigate and create their own paths
      through these spaces (tactics), as theorized by Michel de Certeau.
    mechanism: Designers impose structured spatial matrices (strategies) that define
      the framework of space, time, and experience, while users create their own trajectories
      and interpretations (tactics) within these constraints, creating a dialectical
      relationship between prescribed spatial structures and user-generated navigation.
    boundary: Applies to computer media and spatial environments where users navigate
      through designed spaces. Fails when users have no agency in spatial navigation
      or when spatial design is completely rigid and unchangeable.
  expected_classification:
    depth: cross-domain
- id: 12fa47bcc75ca56165346c5be338485cbaf570b75ae1bafb8d55c364a4cda959
  input_fb:
    name: Socratic Method and Ethical Focus
    definition: A philosophical approach characterized by questioning and self-awareness
      rather than proposing universal doctrines, focusing on ethical reflection and
      understanding of human nature.
    mechanism: Socrates engaged in cross-examination of his interlocutors to turn
      their minds inward toward self-reflection, rather than advancing metaphysical
      doctrines, acknowledging the difficulty of constructing definitively true models
      of the universe.
    boundary: Applies to Socratic philosophical method and its distinction from Pre-Socratic
      and later philosophical systems. Fails to describe specific methodological steps
      or concrete examples of Socratic questioning.
  expected_classification:
    depth: cross-domain
- id: 0cff1f9b8fb8366c08960ac60b85cd01817bb60be2f3ab68f95fef82a9a4588d
  input_fb:
    name: Ubuntu and Constructivist Grounded Theory Integration
    definition: A methodological approach that combines Ubuntu philosophy with constructivist
      grounded theory methods to create culturally-safe research practices.
    mechanism: The integration involves adopting Ubuntu's principles of humility and
      social justice as sensitizing concepts, using local wisdom to frame methodologies,
      and working collaboratively with participants to explore issues like poverty
      and privilege in culturally appropriate ways.
    boundary: Applies to research with African-descended populations and culturally-sensitive
      contexts where local wisdom and philosophical frameworks are integrated with
      grounded theory methods. Fails when the approach is not specifically about integrating
      philosophical frameworks with grounded theory.
  expected_classification:
    depth: cross-domain
- id: d2e684c27d41296fb3e1fb48e53a7a1accd932898a7c03210640d4f6dbbaf203
  input_fb:
    name: Systems Complexity and Success Rates
    definition: Family systems and complex human organizations are inherently unpredictable
      and require strategies that work at low success rates rather than relying on
      high-probability solutions.
    mechanism: Family systems and human organizations are highly complex and unpredictable,
      with any strategy achieving only 10-20% success rate being valuable, because
      the systems' behavior is not easily controlled or predicted.
    boundary: Applies to complex human systems where predictability is low and success
      rates are inherently modest. Fails when systems are assumed to be more predictable
      or controllable than they actually are.
  expected_classification:
    depth: universal
- id: f15c217d8946264e29e4dcb49f9427633b242671fc67d6589103a6148c275100
  input_fb:
    name: Relativity of Spatial Reference
    definition: Spatial relationships and geometric descriptions are always relative
      to a specific frame of reference, which is itself in motion and subject to change.
      Observations of space and position depend on the observer's vantage point, which
      is constantly shifting due to motion and time.
    mechanism: Spatial coordinates and geometric relationships are not absolute but
      depend on the observer's reference frame, which includes the observer's position,
      velocity, and orientation. When the observer's frame of reference changes (due
      to rotation, translation, or orbital motion), the spatial relationships they
      observe also change. This relativity applies to both physical geometry and perceived
      spatial orientation, as demonstrated by the shifting positions of stars due
      to Earth's motion.
    boundary: Applies when spatial observations or geometric descriptions depend on
      a specific reference frame that is in motion or subject to change. Fails when
      spatial relationships are described in a fixed, absolute reference frame or
      when the observer's motion is negligible compared to the scale of the observation.
  expected_classification:
    depth: universal
- id: 0cf02132940107168a8fa81162746f7930524ce00c0201de1356dc5bd8315345
  input_fb:
    name: Structural Mapping Principle
    definition: Maps and models retain structural relationships from the territory
      they represent, not exact physical correspondence. This structural similarity
      enables the map to be useful even when it does not mirror the territory's specific
      details.
    mechanism: Maps and models are useful because they preserve the relational structure
      of the systems they represent, not because they replicate the physical or material
      properties of the territory. The structural correspondence allows for inference
      and prediction, even when the surface features differ. This principle applies
      across domains where abstract representations are used to understand complex
      systems.
    boundary: Applies when a model or map represents a system with sufficient structural
      overlap to enable meaningful inference. Fails when the system's structure is
      entirely dissimilar or when the model is a mere superficial copy without relational
      alignment.
  expected_classification:
    depth: cross-domain
- id: 34d49950112394fabc81656798920783f23ac9691224984e4c413d52cdf4c98a
  input_fb:
    name: Ant Colony Analogy for Systemic Structure
    definition: A conceptual framework comparing ant colonies to complex systems where
      the fundamental components (ants) can be omitted from high-level descriptions
      while maintaining the system's essential structure and function.
    mechanism: The analogy demonstrates that complex systems can be understood at
      multiple levels of abstraction, where fundamental building blocks (ants) are
      dispensable for high-level descriptions but necessary for the system's existence
      and operation.
    boundary: Applies to systems where components can be abstracted away at higher
      levels of description while maintaining functional integrity. Fails when the
      fundamental components are required for any level of understanding or operation.
  expected_classification:
    depth: cross-domain
- id: 0fc55ce5c96d9642e6d4cc5d60929cd98ca5b93c62748237df71037909fb753d
  input_fb:
    name: Islamic Artistic Color Perception and Optical Theory
    definition: Aesthetic principles in Islamic art that integrated complex perceptual
      theories with color application techniques to create visually engaging compositions.
    mechanism: Islamic artistic theory incorporated contemporary optical understanding
      that our perceptual systems process immediate impressions through discernment
      and judgment, using techniques like juxtaposition of equal-intensity colors
      and pattern variation to engage the viewer's visual systems and create complex
      perceptual experiences.
    boundary: Applies to historical Islamic artistic practices and their integration
      of optical theory. Fails to specify detailed technical methods or concrete examples
      of these color application techniques.
  expected_classification:
    depth: cross-domain
- id: b4cf702a8d6f706e4b4fca22676ce89a22e6cd009f0a0e941b9bba0eb28bf200
  input_fb:
    name: System-said Event Fallacy
    definition: When a system reports or communicates that an event occurred, the
      system's declaration of the event's occurrence is treated as the definitive
      truth, regardless of whether the event actually happened or was declared before
      it occurred. This principle describes how systems can be internally inconsistent
      or self-contradictory in their own reporting.
    mechanism: This is a descriptive model of how systems process and communicate
      information. The system's internal logic treats its own declarations as authoritative,
      even when those declarations contradict temporal reality or external validation.
      The principle reflects the structure of how systems define and report events,
      not a causal relationship between declaration and occurrence.
    boundary: Applies when systems report events that are either temporally inconsistent
      or internally contradictory. Fails when systems report events that are genuinely
      accurate and temporally consistent, or when the system's declaration is not
      treated as the sole arbiter of truth.
  expected_classification:
    depth: universal
- id: e7169c33daa39db2d6473b5fb704c72e1a7255237328a0a5084f5ffff6af1cae
  input_fb:
    name: Multi-disciplinary Wisdom Integration
    definition: Integrating insights from multiple disciplines and perspectives creates
      a more comprehensive understanding of complex problems than any single field
      can provide. This approach enables better decision-making by reducing blind
      spots and increasing the likelihood of identifying relevant patterns.
    mechanism: This is a descriptive model of how knowledge systems relate to each
      other. The principle describes the organizational structure and interconnection
      of different fields of knowledge, where each discipline contributes unique insights
      that, when combined, form a more complete picture. The integration is not merely
      additive but involves cross-pollination of concepts and methods that can reveal
      new patterns or solutions.
    boundary: Applies when problems are complex and multifaceted, requiring insights
      from more than one domain. Fails when the problem is narrowly defined or when
      the disciplines involved have no meaningful overlap or interaction. Also fails
      when the integration process is superficial or when the disciplines are fundamentally
      incompatible in their assumptions.
  expected_classification:
    depth: cross-domain
- id: 541b6ffd9f36e3429b7a506ecd4ddb19d2a9ba8f8706da9831b84d79fd033869
  input_fb:
    name: Decolonizing Design Practice
    definition: A design approach that recognizes and addresses colonial frameworks
      in design, reevaluating indigenous concepts and practices while reconsidering
      the relationship between design and cultural difference politics.
    mechanism: The approach involves recognizing colonial frameworks in design, reassessing
      indigenous concepts of design, craft, and community, and reconsidering how design
      relates to cultural difference politics rather than simply focusing on profit,
      disruption, or distraction.
    boundary: Applies when design practice needs to address colonial frameworks and
      indigenous perspectives. Fails when design remains focused solely on profit-driven
      or disruptive outcomes without considering cultural implications.
  expected_classification:
    depth: cross-domain
- id: 107f561c5b96d1c56470efce10f32cbb84e0d00ed45bda3fa406e2850d839062
  input_fb:
    name: Strange Loop Hierarchies
    definition: A conceptual framework for understanding self-referential systems
      where multiple levels of abstraction can be arranged in hierarchical structures,
      with the number of levels determined by contextual perception and aesthetic
      preference.
    mechanism: The framework allows for flexible interpretation of self-referential
      systems by permitting the insertion of intermediate levels (such as 'picture
      frame', 'arcade', 'building') that can expand or contract the hierarchical structure,
      creating multi-step Strange Loops that mirror specific visual patterns like
      Waterfall or Ascending and Descending.
    boundary: Applies to conceptual analysis of self-referential systems where levels
      can be perceived and manipulated. Fails when the system lacks hierarchical structure
      or when levels cannot be meaningfully identified.
  expected_classification:
    depth: cross-domain
- id: 261b9f6aeeb06fa0c426176813952718b541b84b0ed790c7102ecfa7d2d4218e
  input_fb:
    name: Safety and Harm Categories for Ai Models
    definition: A taxonomy of potential harms in AI model outputs that includes inappropriate
      language, harmful recommendations, hate speech, violence, and stereotypes.
    mechanism: AI model outputs can be categorized into five main types of harmful
      content based on their potential to cause real-world damage or offense.
    boundary: Applies to AI safety evaluation and content moderation systems. Fails
      when content categories cannot be clearly classified into these five types or
      when additional harm categories exist.
  expected_classification:
    depth: specialized
- id: 99a0757b787e932772cf15f1c4d60afa946ee3a289258c62b4433b65431ca488
  input_fb:
    name: Geographic Axis Effect on Agricultural Development
    definition: The orientation of continents affects agricultural spread rates, with
      east-west axes enabling faster crop diffusion than north-south axes due to similar
      climate conditions.
    mechanism: East-west orientation allows similar climate zones to span large distances,
      enabling crops to spread across regions with comparable environmental conditions,
      while north-south orientation creates climate barriers that require new crop
      domestication.
    boundary: Applies to agricultural development across continents with different
      primary axes. Fails when climate differences are not significant or when human
      intervention overrides natural climate patterns.
  expected_classification:
    depth: cross-domain
- id: f1ae28c79189a4c1f4f6955168fce66c5012e54755ad76d2ce1d004d4d1956d9
  input_fb:
    name: Attention Economy Constraint
    definition: Human attention is a finite resource that becomes depleted under constant
      digital stimulation, leading to diminished cognitive capacity and increased
      susceptibility to distraction. The principle describes how modern digital environments
      systematically consume attention, creating a feedback loop that reduces mental
      energy and undermines focused productivity.
    mechanism: Digital devices and platforms are engineered to capture and sustain
      attention through variable reward schedules, notifications, and endless streams
      of content. This creates a cycle where users must constantly allocate mental
      effort to resist distraction, depleting their cognitive reserves. The more attention
      is diverted to external stimuli, the less available for deep work, reflection,
      or meaningful engagement with the world.
    boundary: Applies when attention is repeatedly interrupted by digital stimuli
      or when individuals are exposed to high-frequency notification systems. Fails
      when attention is directed toward tasks that naturally engage focus or when
      users have developed strong self-regulation skills.
  expected_classification:
    depth: cross-domain
- id: 988efe193ab079196ffdb6d927823328e0a025cf7b80e737b9d983ff0f65b5ce
  input_fb:
    name: Technology Adoption and Cost Reduction Cycle
    definition: A recurring pattern where new technologies follow consistent adoption
      curves characterized by initial high costs that decrease over time as demand
      increases and technology improves.
    mechanism: The cycle begins with high initial costs and limited adoption, followed
      by increasing demand that drives cost reductions through economies of scale
      and technological improvements, which in turn enable even better and cheaper
      technologies downstream.
    boundary: Applies to consumer electronics and technology adoption patterns across
      the twentieth and twenty-first centuries. Fails when technologies don't follow
      the typical cost-reduction trajectory or when external factors prevent the expected
      progression.
  expected_classification:
    depth: cross-domain
- id: 35fb66520560afa46bbc4c4de6ff9536b88c1e08623d2685d2d456f0bd2f87a0
  input_fb:
    name: Computational Design and Manufacturing Loop
    definition: A cycle of rapid experimentation and iteration in digital design spaces
      that enables the creation and refinement of physical products through computational
      tools, AI, and advanced manufacturing techniques.
    mechanism: The process begins with small-scale computational simulations that
      can be rapidly modified and tested, followed by translation into physical products
      through 3D printing and robotics, creating a feedback loop where each iteration
      builds on previous improvements.
    boundary: Applies to design and manufacturing workflows where computational tools
      enable rapid prototyping and iteration. Fails when physical constraints or manufacturing
      limitations prevent translation from digital to physical form.
  expected_classification:
    depth: cross-domain
- id: ec9b5949301ecec9d610670f88866bcea1c2c9ab32425ecbf8dd2d69c667d486
  input_fb:
    name: Authentic Expression Vs. Trend Following
    definition: A principle that values personal truth and authentic expression over
      following market trends or popular opinions in creative work.
    mechanism: Creative work that emerges from personal experience and genuine emotion
      resonates more deeply with audiences than work that merely follows popular patterns
      or trends.
    boundary: Applies to creative work where personal authenticity is valued over
      commercial appeal. Fails when the audience or market demands conformity to trends.
  expected_classification:
    depth: cross-domain
- id: 3c98cd478a17c213db772c63e99d2ad2370b580b3c527a5c96b1c03f82647f43
  input_fb:
    name: Adaptive Skill Portfolio Strategy
    definition: A strategic approach where artists and professionals deliberately
      cultivate diverse interests and skills rather than specializing in a single
      area, allowing them to capitalize on emerging opportunities and maintain competitive
      advantage.
    mechanism: By maintaining a 'leaky filter' that allows exploration of new opportunities
      and skills, practitioners can identify and exploit business opportunities that
      arise from diverse interests, creating a flexible portfolio that adapts to market
      needs.
    boundary: Applies when practitioners have the flexibility to explore multiple
      interests and can effectively transition between different skill domains. Fails
      when rigid specialization prevents exploration of new opportunities.
  expected_classification:
    depth: cross-domain
- id: f70c94b1ae654770bd003b9569f0bc1e3691e9aa4bb4fad4be448c20cd9505cc
  input_fb:
    name: Experimental Animation and Modernist Art Movements
    definition: A historical development where postwar technological advances and
      changing social conditions in Europe led artists to reject classical representation
      and embrace abstraction in various art forms including painting, sculpture,
      graphic design, and experimental filmmaking.
    mechanism: The convergence of industrial advances, changing social conditions,
      and artistic rebellion created an environment where artists abandoned traditional
      aesthetic standards to explore new forms of expression like abstraction, cubism,
      futurism, dadaism, and surrealism in multiple artistic media.
    boundary: Applies to the early 20th century European artistic movement from the
      turn of the century through postwar periods. Fails to describe specific artistic
      techniques or individual artists beyond general categorization.
  expected_classification:
    depth: cross-domain
- id: 608663ff37c8cb75b2368738bc6adb5109440739b22612e88f2038ff7ccfe517
  input_fb:
    name: Categorial Grammar
    definition: A syntactic framework where grammatical categories are treated as
      types that combine according to specific rules, producing well-formed formulas
      through a calculus analogous to fraction simplification.
    mechanism: Grammatical categories (types) combine with expressions of matching
      classes to form syntactically well-formed formulas, following a calculus similar
      to fraction simplification where compatible elements cancel out to produce a
      result.
    boundary: Applies when grammatical categories can be formally represented as types
      that combine according to specific rules. Fails when the category system cannot
      be reduced to type-based combinations or when the calculus does not produce
      well-formed results.
  expected_classification:
    depth: cross-domain
- id: 3db41a963a622f07fbd065605ef2f535076519f373537a5e5b7d75b201ef8d64
  input_fb:
    name: Game As Semiotic Process
    definition: A game is a semiotic process that operates through displacement and
      mediation, functioning as both a recreation of cultural borders in mythical
      narratives and a structured action that can be narrativized.
    mechanism: The game operates as a semiotic process where the processual code functions
      through displacement, allowing it to recreate and transcend cultural boundaries
      while maintaining narrative structure in all its actions.
    boundary: Applies when the semiotic process involves displacement-based mediation
      and can receive narrative structure. Fails when the process lacks displacement
      or narrative framing.
  expected_classification:
    depth: cross-domain
- id: daec394ebb3d8a1caadd97c26ee4bfafd8b53072b457579e0b0919251070ef43
  input_fb:
    name: Strategic Choice Architecture
    definition: A method of deliberately creating options and maintaining flexibility
      in life decisions by taking actions that preserve future choices rather than
      committing to a specific path.
    mechanism: The individual takes preparatory actions (like SAT testing) not to
      achieve a specific outcome but to maintain the option to pursue that outcome
      later, creating a buffer between current capability and future decision-making.
    boundary: Applies when someone has a specific goal but wants to preserve flexibility
      in how they achieve it. Fails when the preparatory actions are not aligned with
      maintaining choice or when the decision is made too early.
  expected_classification:
    depth: cross-domain
- id: 5c0e98ce939347008e6e8a9b1bd87253786788257033cdd270fb3563697fb67e
  input_fb:
    name: Fragility As Prediction Driver
    definition: A principle that the concept of fragility serves as a central framework
      for understanding and making predictions about complex systems and environments.
    mechanism: The fundamental asymmetry between fragile and antifragile systems determines
      how predictions and forecasts behave over time, with fragile systems being harmed
      by volatility and disorder while antifragile systems benefit from them, making
      the assessment of system fragility crucial for accurate prediction.
    boundary: Applies when analyzing systems where volatility and disorder have differential
      impacts on system outcomes. Fails when systems do not exhibit the fundamental
      asymmetry between fragility and antifragility or when the relationship between
      volatility and system outcomes is not clearly defined.
  expected_classification:
    depth: cross-domain
- id: 01231ccc10057caa80c24a4c28a1af61454d32551e5ede0f6d85283438c4ec72
  input_fb:
    name: Visual Language Stylization in Illustration
    definition: A principle of illustration practice that emphasizes the use of distinctive
      visual elements to create personal iconography and define one's placement within
      a visual genre.
    mechanism: Illustrators develop a distinctive visual language through stylization
      that identifies their personal mark and determines what kind of illustration
      they are associated with, similar to how music expresses individual style.
    boundary: Applies to illustrators seeking to establish a recognizable personal
      visual identity. Fails when the focus is purely on technical execution without
      developing personal visual characteristics.
  expected_classification:
    depth: specialized
- id: 410b77c2bc329647603724c0825a624adb9d5d77f12e88372c15d70e7243d8c2
  input_fb:
    name: Observer Effect in Systems
    definition: The act of observing or probing a system inevitably alters the system's
      state and the probe itself. This principle describes a fundamental limitation
      in system analysis where measurement tools and observation methods become part
      of the system's dynamics.
    mechanism: The observer effect occurs because the probe and measurement process
      become integrated into the system's operational context. When a probe is introduced
      to test or observe a system, it interacts with the system's components and processes,
      thereby changing their behavior. The system's response to the probe's presence
      is not merely passive but actively modifies the system's state, and the probe
      itself is also modified or altered by its interaction with the system.
    boundary: Applies when a system is observed or probed using external tools or
      methods that interact with the system's components. Fails when the system is
      observed without any physical or functional interaction, such as through purely
      theoretical modeling or simulation that does not engage with the system's actual
      state.
  expected_classification:
    depth: universal
- id: 18e578e16360acb0c8d21b4d1eca50d39df6ef92209438481222271f918ff6b9
  input_fb:
    name: Ars Memorandi and Visual Memory Techniques
    definition: A medieval visual memory system that used symbolic images to encode
      and recall complex information, particularly from the Four Gospels, where each
      Evangelist was represented by emblems that contained multiple story elements.
    mechanism: The Ars Memorandi system encoded complex information by creating visual
      symbols for each Gospel (angel for Matthew, lion for Mark, etc.) that contained
      multiple smaller emblems representing specific chapters or stories, allowing
      for comprehensive recall through visual association.
    boundary: Applies to medieval visual memory techniques used in the 15th century
      for encoding biblical narratives. Fails to describe how these techniques were
      actually implemented in practice or their effectiveness in different contexts.
  expected_classification:
    depth: specialized
- id: 60e5edc65df9b5b5da17bdcfaa94b09978e2285f97164857bd78fbdb11e8d3fb
  input_fb:
    name: Megatrend Classification System
    definition: A hierarchical taxonomy of trends that categorizes megatrends as the
      most comprehensive and impactful category of change, distinguished by scope,
      duration, and global influence.
    mechanism: Megatrends are defined by their scope in terms of time (duration of
      several decades) and content (influence on all areas of society), with criteria
      including globality and complexity that distinguish them from other trend categories.
    boundary: Applies to categorizing large-scale societal changes that span decades
      and impact multiple areas of society. Fails when trends do not meet the criteria
      of duration, globality, or comprehensive societal impact.
  expected_classification:
    depth: cross-domain
- id: 280230b92df2b7d26fe0258b9ae77916103215d1bcd1504bb2380b75a0b1e60d
  input_fb:
    name: Signal Summation in Msp
    definition: MSP objects automatically sum multiple signals received in a single
      inlet, creating complex waveforms from individual sine waves.
    mechanism: When multiple audio signals are sent to the same inlet of an MSP object,
      the system mathematically adds them together to form a composite waveform that
      combines their individual characteristics.
    boundary: Applies to all MSP audio objects that receive multiple signals on the
      same inlet. Fails when signals are sent to different inlets or when the object
      is configured to process signals differently.
  expected_classification:
    depth: specialized
- id: ddf87bc4243136d0abb597ed5e357bac3d61bff52c94452b59d50a76256846c1
  input_fb:
    name: Human As Captive Animal Metaphor
    definition: A metaphorical framing where human beings are portrayed as animals
      in captivity to emphasize vulnerability and dehumanization in extreme situations.
    mechanism: The narrative presents Marc as a trapped animal to evoke viewer sympathy
      and highlight the horror of treating humans as animals, leveraging the inherent
      fear of being treated like animals in horror films.
    boundary: Applies specifically to the character Marc in the film Calvaire and
      how his portrayal as a captive animal intensifies the horror and viewer empathy.
      Does not apply to general human-animal comparisons or other characters.
  expected_classification:
    depth: cross-domain
- id: 94caa436677b3f7ea866e34de3770ce6e138409c21d2b9580dd20890180723b8
  input_fb:
    name: Visual Context for Numbers
    definition: Numerical data loses impact when presented in isolation; people require
      familiar reference points to understand and remember the significance of numbers.
      The principle describes how contextual comparison transforms abstract figures
      into meaningful, memorable information.
    mechanism: This is a descriptive pattern, not a causal mechanism. The passages
      show that numbers alone fail to resonate with audiences, but when presented
      alongside familiar comparisons (e.g., growth of other technologies), they become
      comprehensible and memorable. The human mind processes numerical information
      more effectively when it can be mapped onto existing knowledge structures.
    boundary: Applies when audiences encounter unfamiliar numerical data and need
      framing to understand its significance. Fails when the reference point is irrelevant
      or when the audience already has a strong grasp of the numerical scale in question.
  expected_classification:
    depth: cross-domain
- id: 1402bfe024204b7dd3a6246117f9994af0e11d000e9a921d4882b131d7b16915
  input_fb:
    name: Get the Beat of the System
    definition: Effective systems thinking requires first observing and understanding
      the system's natural behavior before making any interventions. This practice
      emphasizes the importance of pattern recognition and baseline measurement in
      system analysis.
    mechanism: 'This is a practical heuristic for system analysis: observing system
      behavior before intervention enables accurate diagnosis of underlying dynamics
      and prevents misidentification of causes and effects. The approach treats system
      observation as a foundational skill, similar to how musicians must first hear
      the rhythm before playing, or how dancers must understand the beat before moving.'
    boundary: Applies when analyzing systems where behavior patterns can be observed
      and measured. Fails when systems are too complex or chaotic to observe meaningful
      patterns, or when immediate intervention is required to prevent system collapse.
  expected_classification:
    depth: cross-domain
- id: e0a16d5687ea5d5bbf2109aba2ee698704fe0e19100885527251839d8d14f387
  input_fb:
    name: Information Theory Vs Semiotic Approach to Communication
    definition: A principle contrasting how information theory and semiotic approaches
      interpret communication, with information theory focusing on mathematical transmission
      and semiotics on meaning production.
    mechanism: Information theory emphasizes mathematical laws of transmission and
      channels, while semiotics emphasizes meaning generation and interpretation,
      creating different understandings of communication's fundamental nature.
    boundary: Applies to the theoretical distinction between mathematical and semiotic
      approaches to communication. Fails when the distinction is not relevant to the
      specific communication context.
  expected_classification:
    depth: cross-domain
- id: bc9cdfbc679bd759a8253f2854101640ee2355c1dd54ca3df88d7a3e5faff1e5
  input_fb:
    name: Super Mario Bros. Level Design and Life Lessons
    definition: A principle that compares the scrolling mechanics of Super Mario Bros.
      levels to life's progression, where passive inaction leads to negative consequences.
    mechanism: The game's auto-scrolling levels create a mechanical constraint where
      players must actively move forward or face elimination, mirroring how life requires
      continuous forward movement to avoid negative outcomes.
    boundary: Applies to the metaphorical relationship between game mechanics and
      life philosophy. Fails when the comparison is stretched beyond its intended
      scope or when life circumstances don't require active progression.
  expected_classification:
    depth: cross-domain
- id: 217d29312a80b7bf094d343bd2dfcd9cbcb95e0ad6854e865309f84561532fc5
  input_fb:
    name: Developmental Theory Seduction
    definition: Developmental theories that map human growth onto sequential stages
      can be both practically useful and dangerously seductive, leading to overconfidence,
      arrogance, and harmful generalizations about individual differences and social
      expectations. These theories risk becoming rigid frameworks that misinterpret
      or misapply universal patterns to specific cases.
    mechanism: Developmental theories provide structured narratives that make complex
      human growth appear predictable and manageable. When applied too broadly or
      interpreted as absolute frameworks, they can foster a false sense of mastery
      over human development. The seduction lies in their apparent scientific legitimacy
      and their ability to categorize and explain variation in ways that feel authoritative,
      even when the underlying assumptions are incomplete or culturally biased.
    boundary: Applies when developmental theories are used to predict or prescribe
      human behavior in ways that assume universal applicability across cultures,
      contexts, or individuals. Fails when these theories are used as flexible tools
      for understanding general patterns without claiming universal validity or applying
      them to specific individuals in rigid ways.
  expected_classification:
    depth: cross-domain
- id: 6da7e95b1eacbe3a9e108d27d63617a46c48e9df6bf54173dcab1bee8d4c1839
  input_fb:
    name: Magic Square Pattern Emergence
    definition: Magic squares of any order consistently generate unique and aesthetically
      pleasing numerical patterns in their rows, columns, and diagonals. The principle
      describes a mathematical regularity where structured numerical arrangements
      produce invariant yet distinct configurations regardless of size.
    mechanism: This is an empirical pattern, not a causal mechanism. Magic squares
      follow strict mathematical constraints where each row, column, and diagonal
      must sum to the same value. The patterns that emerge from these constraints
      are predictable and consistent across orders, but the specific arrangement of
      numbers within each order is not determined by a single cause. The mathematical
      structure itself generates these patterns through the interplay of arithmetic
      constraints and combinatorial possibilities.
    boundary: Applies to any magic square configuration where rows, columns, and diagonals
      sum to a constant value. Fails for non-magic squares or configurations that
      do not maintain uniform summation across all lines. Also fails for squares that
      do not adhere to the fundamental numerical arrangement rules that define magic
      squares.
  expected_classification:
    depth: universal
- id: 1ca534ec8e2845e2b51b78fc2933fa1374015f3909f74247198e44ae053b3d6b
  input_fb:
    name: Metacommunicative Awareness Hypothesis
    definition: A hypothesis about the evolution of communication that posits organisms
      can recognize their own signals as signals, which enables higher-order communication
      and language development.
    mechanism: When organisms discover that their own signals are signals, they develop
      metacommunicative awareness that enables language and complex communication
      beyond simple signaling.
    boundary: Applies to organisms that can recognize their own signals as communicative
      acts. Fails when organisms cannot distinguish between signals and non-signals
      or lack self-awareness of their own communication.
  expected_classification:
    depth: cross-domain
- id: 9c3e7ef39ea581cb0a086a76336a6b7d2d0553a95d542fd0cc56bdf119b41171
  input_fb:
    name: Structural Organization Patterns
    definition: Systems organize into hierarchical or modular structures where components
      relate through defined roles, relationships, and operational units. These structures
      support both functional decomposition and emergent properties through component
      interaction.
    mechanism: "This is a descriptive model of how systems are structured and organized.\
      \ The principle describes the typical organization of complex systems across\
      \ different domains \u2014 from software interfaces to scientific methodologies\
      \ to natural phenomena. It identifies recurring patterns in how components are\
      \ grouped, related, and managed, without claiming a specific causal chain or\
      \ prescriptive method."
    boundary: Applies to systems where components can be meaningfully grouped or arranged
      into units with defined relationships. Fails when components lack clear roles
      or when systems are purely random or chaotic without any discernible structure.
  expected_classification:
    depth: cross-domain
- id: 0a8a845067e664383f3cd7531d5392bff94870fc5d95aa8426edd045ed91cb5b
  input_fb:
    name: Ai Reasoning Extension Drive
    definition: The philosophical and psychological motivation for developing tools
      that extend human reasoning capabilities, driven by the perceived nobility of
      reason and the desire to improve upon human cognitive limitations.
    mechanism: Philosophical reverence for reason as a noble human pursuit creates
      psychological pressure for individuals to enhance their reasoning abilities,
      leading to the creation and adoption of tools that extend human cognitive capacity
      across domains from mathematics and logic to computing and AI.
    boundary: Applies when reason is viewed as a noble pursuit that humans feel compelled
      to improve upon. Fails when reason is not seen as inherently valuable or when
      individuals do not feel pressure to enhance their reasoning capabilities.
  expected_classification:
    depth: cross-domain
- id: 8b6eab5776658a231f6c01e4855a9341c234f3d3cac026d320fc1f4f63d38fd4
  input_fb:
    name: Trolley Problem Thought Experiment
    definition: A moral philosophical thought experiment that explores ethical decision-making
      in life-or-death scenarios where one must choose between saving multiple lives
      at the cost of one life.
    mechanism: The trolley problem presents a scenario where a person must choose
      between allowing five people to die or actively causing one person's death to
      save five, demonstrating how moral intuitions can conflict with utilitarian
      calculations.
    boundary: Applies to moral philosophy and ethics education where physical experimentation
      would be harmful. Fails when the scenario is not a genuine ethical dilemma or
      when the moral framework is not properly understood.
  expected_classification:
    depth: cross-domain
- id: 64dc0d3325440bb4077863e0840143cc8707dbe6548884070ccd3dfffa7f006b
  input_fb:
    name: Early Adopter Influence Loop
    definition: Early adopters of new products or innovations create a social proof
      environment that enables broader market adoption by the late majority. The initial
      small group of committed users becomes a catalyst for mainstream acceptance.
    mechanism: Early adopters are willing to take risks on novel products and communicate
      their experiences to others in their social network. Their endorsement creates
      a bandwagon effect where the late majority perceive the innovation as safe and
      desirable to adopt. This process operates through social proof and trust-building
      rather than direct marketing or product superiority alone.
    boundary: Applies when early adopters are influential within their social or professional
      networks and when the innovation is perceived as novel or different from existing
      alternatives. Fails when early adopters lack social influence, when the innovation
      is too complex or expensive for mainstream adoption, or when there is no clear
      social context for sharing experiences.
  expected_classification:
    depth: cross-domain
- id: 4f482235ad5e867c74534034ffeec2dc66ab0353ba769e8f73166345abd88dee
  input_fb:
    name: Peirce's Three-phase Semiotic Structure
    definition: 'Peirce''s semiotic framework organizes reality and meaning through
      three universal categories: Firstness (quality, potential, pure possibility),
      Secondness (relation, force, actuality), and Thirdness (representation, mediation,
      law). These categories form a hierarchical structure that applies to all phenomena
      and provides a systematic foundation for understanding experience, logic, and
      meaning.'
    mechanism: The three categories operate as a nested, hierarchical system where
      Firstness represents pure potential or quality (like a seed's possibility),
      Secondness represents actual relations or forces (like the seed's interaction
      with soil), and Thirdness represents mediation or representation (like the plant's
      growth pattern that connects the seed to the soil). These categories are not
      merely descriptive but structurally fundamental to how any phenomenon can be
      understood or experienced.
    boundary: "Applies to any phenomenon or system that can be analyzed through the\
      \ lens of potential, actuality, and mediation. Fails when applied to systems\
      \ that do not involve any form of quality, relation, or representation \u2014\
      \ such as pure mathematical abstractions or systems without relational or interpretive\
      \ components."
  expected_classification:
    depth: universal
- id: 078f46dc8cf7d44111c57c18f2379f4aa19b2fc81ce2222ad1613fbf0c94c4b7
  input_fb:
    name: Future Technology Trends
    definition: A descriptive pattern showing how technological development has accelerated
      dramatically over time, with exponential growth in computing power and accessibility.
    mechanism: The passage describes how computing technology has evolved from massive
      vacuum tube computers in 1960 to billions of small, portable devices by 2024,
      demonstrating exponential growth in both quantity and accessibility.
    boundary: Applies to historical analysis of technological development patterns.
      Fails when applied to non-technological domains or when the exponential growth
      pattern doesn't hold.
  expected_classification:
    depth: universal
- id: 010d26094d6126c1a3262f23652cdd2ff1a21af73c1ac1722c66f3c8e707bcd6
  input_fb:
    name: Qualitative Research in Social Innovation
    definition: A research methodology that emphasizes understanding complex social
      phenomena through in-depth exploration of human experiences, challenges, and
      opportunities in community contexts.
    mechanism: Qualitative research methods allow researchers to identify and understand
      nuanced challenges, needs, and opportunities facing individuals and groups through
      direct engagement with participants and their lived experiences.
    boundary: Applies when research focuses on understanding human experiences and
      social processes rather than quantitative measurement. Fails when research is
      limited to numerical data collection or when qualitative methods are not integrated
      into the research design.
  expected_classification:
    depth: domain
- id: 33ec68c493541c7e3b92b3c07d01bb3060f8a55a971ccaf038747624b77ad4b7
  input_fb:
    name: Decision-making Under Uncertainty
    definition: Effective decision-making in complex environments requires balancing
      structured analysis with intuitive judgment, particularly when dealing with
      uncertainty, incomplete information, and multiple competing objectives. The
      principle recognizes that optimal decisions often emerge from integrating systematic
      frameworks with adaptive confidence.
    mechanism: 'Decision-making under uncertainty involves a dual-process approach:
      (1) applying structured models and frameworks to analyze options and weigh trade-offs,
      and (2) exercising bounded confidence and adaptability to navigate unknowns.
      The process requires identifying key decision points where principles must be
      established, even when full information is unavailable. This hybrid approach
      enables managers to make timely choices while remaining open to adjustment as
      new information emerges.'
    boundary: Applies when decisions involve significant uncertainty, incomplete data,
      or multiple stakeholder interests. Fails when decisions can be made with complete
      information or when rigid adherence to frameworks prevents necessary flexibility.
      Also fails when the decision-making context lacks clear principles or when structured
      methods are applied inappropriately to situations requiring pure intuition.
  expected_classification:
    depth: cross-domain
- id: a47c0a7313e7039748f24154840d4b7ac82554c5b5ed8cce3dbf43d7a5cd99af
  input_fb:
    name: La Robia Typography System
    definition: A modular typography system that combines letterform design with architectural
      principles, allowing physical manipulation and rearrangement of letterforms
      to create new textual variations.
    mechanism: The system uses modular brick-and-mortar paving pattern metaphors to
      design letterforms that can be physically picked up, felt, and rearranged to
      create new versions from the same word, merging textual content with built form.
    boundary: Applies to physical, modular typography systems where letterforms can
      be physically manipulated. Fails when letterforms are purely digital or cannot
      be physically handled.
  expected_classification:
    depth: cross-domain
- id: 0114e203ed247c32146066ccca1526e0819ebf3c52989b6ec04f73a08f5d476d
  input_fb:
    name: Nasa's Voluntary Aviation Error Reporting System
    definition: A systemic approach to human error reduction that uses neutral institutional
      oversight to encourage voluntary reporting of errors by pilots, thereby improving
      aviation safety through collective learning.
    mechanism: The system creates a safe reporting environment by separating pilot
      identity from error reports, allowing pilots to report errors without fear of
      punishment or professional consequences, while NASA acts as a neutral third
      party to analyze and disseminate findings.
