    text: 'When a problem surfaces, the natural instinct is to fix the immediate symptom. But symptoms are rarely the real
      problem. The Five Whys technique asks ''why?'' repeatedly — typically five times — to trace a symptom back to its root
      cause. If the build server is failing: Why? — a library didn''t compile. Why? — the developer used an unapproved version.
      Why? — they didn''t know the approval process. Why? — onboarding didn''t cover it. Root cause: onboarding process gap.
      Fix the onboarding, not the library version. The technique is procedural, not analytical — it''s a recipe for drilling
      down.'
  - source_book: Thinking in Systems — Donella Meadows
    text: Systems thinkers learn to distinguish proximate causes from root causes. The proximate cause is the last event in
      a chain — 'the bridge collapsed because a bolt failed.' The root cause is the system structure that made failure inevitable
      — 'maintenance inspections were cut to meet quarterly earnings targets.' Moving from proximate to root requires asking
      not just 'what happened?' but 'what structure produced this event?' Repeated questioning — each answer becoming the
      premise of the next question — is the most reliable method for crossing from event-level to structure-level understanding.
