    name: Entropy Arrow of Time
    definition: The second law of thermodynamics establishes that entropy in any isolated system increases irreversibly over
      time, creating the thermodynamic arrow of time. This explains why processes have a direction — heat flows from hot to
      cold, order dissolves into disorder — and why the past is remembered but the future is predicted.
    mechanism: Entropy increases because there are vastly more disordered microstates than ordered ones. A system evolves
      toward the macrostate with the most microstates — the most probable configuration. Since the universe began in an extraordinarily
