- id: 31270fd92b09403c5c1c710277e945065cb0ad9832af52ccaac6152529b7aed1
  input_fb:
    name: Turkey Problem and Statistical Misestimation
    definition: A statistical inference problem where conventional methods fail to
      account for asymmetries in outcomes, leading to systematic underestimation of
      rare events in both fragile and antifragile systems.
    mechanism: In fragile systems (turkey problems), rare negative events don't appear
      in samples, leading to underestimation of risks. In antifragile systems, rare
      positive events don't appear in samples, leading to underestimation of benefits.
      Both cases result in misleading historical track records that fail to capture
      true long-term averages.
    boundary: Applies to any system where rare events have disproportionate impact
      on outcomes. Fails when all relevant events are captured in the sample or when
      the system lacks asymmetry in outcomes.
  silver_depth: cross-domain
