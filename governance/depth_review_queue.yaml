  input_fb:
    name: Metaphorically Selling How to Use the Ma (2)
    definition: Effective metaphors simplify complex topics by mapping them onto familiar
      domains, making abstract concepts accessible to general audiences. The principle
      describes how metaphorical framing can bridge the gap between technical subject
      matter and layperson understanding.
    mechanism: Metaphors work by creating cognitive bridges between the unfamiliar
      domain (e.g., Automated Payment Transaction tax) and the familiar domain (e.g.,
      a highway). When the metaphor is simple and relatable, it enables audiences
      to grasp complex ideas without requiring deep domain expertise. The mapping
      process engages intuitive reasoning, allowing people to apply their existing
      knowledge to understand new concepts.
    boundary: Applies when the target concept is abstract, technical, or unfamiliar
      to the audience. Fails when the metaphor is too complex, irrelevant, or misaligned
