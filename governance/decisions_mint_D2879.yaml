    WHY IT STAYED INVISIBLE FOR TWO ROUNDS (the durable lesson). (i) scripts/apply_owner_domain_review.py was
    named in DECISION-LOG.md as the way to verify the ruler ("verify with: --check") and was invoked by NO rail
