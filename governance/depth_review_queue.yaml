    definition: A modern approach to material transformation that combines traditional
      craft techniques with advanced technology and scientific methods.
    mechanism: Contemporary artists and designers work with modern materials and technologies
      (3D printing, ceramics, digital tools) to create hybrid artistic expressions
      that blend traditional and modern elements, while also engaging with concepts
