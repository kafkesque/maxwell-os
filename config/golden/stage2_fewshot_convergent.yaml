- id: CONV-038
  domain: complex systems
  discipline: network science
  source_books:
  - Antifragile — Nassim Nicholas Taleb
  - Algorithms to Live By — Brian Christian & Tom Griffiths
  cluster_segments:
  - source_book: Antifragile — Nassim Nicholas Taleb
    text: 'The 80/20 rule — 80% of effects come from 20% of causes — is observed across an astonishing range of domains: 80%
      of wealth is held by 20% of the population, 80% of sales come from 20% of customers, 80% of software bugs come from
      20% of the code. This is not a coincidence or a law — it''s a signature of power-law distributions, which arise when
      success breeds more success through cumulative advantage. In such systems, small initial differences compound into extreme
      disparities.

      '
  - source_book: Algorithms to Live By — Brian Christian & Tom Griffiths
    text: 'Preferential attachment is the mechanism behind many power-law distributions. In a growing network, new nodes are
      more likely to connect to nodes that already have many connections — ''the rich get richer.'' This creates a distribution
      where a few nodes have enormous numbers of connections while most have very few. The pattern is observed in scientific
      citations, website links, social networks, and even the distribution of species in ecosystems. The key insight is that
      the pattern emerges from the growth process itself, not from any intrinsic quality of the nodes.

      '
  is_convergent: true
  should_extract: true
  expected_fb:
    is_summary: false
    route: FB
    name: Power-Law Concentration Pattern
    definition: In complex systems with cumulative advantage, outcomes follow power-law (Pareto) distributions where a small
      minority of causes produces a large majority of effects — typically ~80% of outcomes from ~20% of inputs. This pattern
      is observed across wealth, citations, sales, software defects, and species abundance, and it emerges from preferential
      attachment dynamics rather than from intrinsic differences in quality.
    mechanism: 'The empirical pattern is that in systems where success breeds more success (preferential attachment, cumulative
      advantage, Matthew effect), the distribution of outcomes follows a power law rather than a normal distribution. This
      means: (1) the average is not representative — most observations are below average; (2) extreme events are far more
      likely than a normal distribution would predict; (3) the ''tail'' (top performers) dominates the total. The pattern
      is DESCRIPTIVE — it tells you that such systems WILL be concentrated, but it does not predict WHICH nodes will dominate
      (that depends on initial conditions and chance).'
    boundary: 'Applies to systems with positive feedback loops and no upper bound. Fails when: (1) the system has built-in
      equalization mechanisms (progressive taxation, handicapping rules); (2) growth is constrained by physical limits (all
      nodes reach capacity); (3) success is determined by absolute criteria rather than relative comparison (standardized
      tests with fixed passing scores).'
    consequence: Managing a power-law system requires different strategies than managing a normally-distributed one. In a
      normal system, improving the average works. In a power-law system, the average is irrelevant — you must either identify
      and nurture the few extreme performers, or implement structural mechanisms that counteract cumulative advantage. Most
      institutional processes (performance reviews, resource allocation, risk management) are designed for normal distributions
      and systematically fail in power-law domains.
    evidence_passages:
    - 80% of effects come from 20% of causes — is observed across an astonishing range of domains
    - a signature of power-law distributions, which arise when success breeds more success
    - Preferential attachment is the mechanism behind many power-law distributions
    - the rich get richer
    extraction_type: empirical_pattern
    content_type: pattern
    depth: cross-domain
  rationale: 'EMPIRICAL PATTERN — observed statistical regularity. Taleb''s 80/20 observations and Christian & Griffiths''
    preferential attachment converge on the same empirical pattern: power-law concentration in complex adaptive systems. This
    is a PATTERN (''systems with cumulative advantage produce concentrated outcomes''), not a causal mechanism. While preferential
    attachment explains HOW the pattern emerges, the FB focuses on the OBSERVED REGULARITY itself, which is useful for prediction
    and management even without knowing the generative mechanism.'
- id: CONV-039
  domain: economics
  discipline: behavioral economics
  source_books:
