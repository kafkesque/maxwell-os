# decisions_policy.yaml - the REVOCATION ontology (D-2645, completes D-2643/BUG-503).
#
# WHY. D-2643 made the abandoned D2205 migration unreachable to EXECUTE (recipes removed, script refuses with
# exit 2). That is a TOMBSTONE, and a tombstone does not stop RE-PROPOSAL: a future agent can read the kept
# archaeology, find the eight column names, and write a NEW migration with the same defect. A revoked scope
# must therefore be a DECLARED FACT with a rail, not a comment.
#
# DIRECTION OF AUTHORITY. config/decisions.yaml owns WHAT is revoked (the revocation_* keys on the record);
# this file owns the RULES (which states require the declaration, which states carry pinned legacy debt, what
# counts as LIVE code). Code owns neither; no value here may be re-typed in scripts/ (C12/C12c/C20).
#
# WHY PREFIXED KEYS AND NOT A NESTED BLOCK (audit F2, MEASURED 2026-09-25). A revocation is declared with
# revocation_scope / revocation_reason / revocation_evidence / revocation_date / revocation_tokens rather than
# a nested mapping, because none of the 780 records carries a MAPPING-shaped value: the registry's shapes are
# scalar and list-of-scalar (target_files 530, files 125, artifacts 13, related 11, bugs 4, decisions 3,
# superseded_by 1). Adding a new shape to a governed registry is a risk no consumer audit can fully retire,
# and a prefixed scalar key is also greppable without parsing YAML. The audit found no consumer that flattens
# record values, so either shape would LOAD; the flat one is the one that cannot surprise the next consumer.
#
# WHY A SUB-FACT AND NOT A STATE. A revocation is a SUB-FACT: D2205's RAG roadmap is ACTIVE (retrieval P0/P1
# and the CRAG evaluator are live code citing it as authority) while ONE of its migrations is abandoned.
# Relabelling D2205 ABANDONED would be false and would turn every live authority citation into a false
# positive. Only a WHOLE-record withdrawal uses the two whole_record_states.

schema_version: '1'
decided: D-2645

revocation:
  field_prefix: revocation_
  # A revocation without a reason is a rumour; without evidence it cannot be falsified; without a scope it
  # cannot be told apart from a whole-record withdrawal; without tokens the rail has no subject.
  required_fields: [scope, reason, evidence, date, tokens]
  whole_record_states: [REVOKED, ABANDONED]
  # These states SHOULD carry a declaration. The records below predate the rule and are pinned BY IDENTITY,
  # never by a count: a ceiling would let a NEW omission hide inside it. The list may only shrink - a listed id
  # that now carries a declaration, or no longer exists, is a STALE declaration and fails the rail.
  legacy_debt_states: [SUPERSEDED, ARCHIVED]
  legacy_debt_ids:
  - D2000
  - D2001
  - D2002
  - D2034
  - D2052
  - D2070
  - D2080
  - D2085
  - D2087
  - D2091
  - D2195
  - D2196
  - D2204
  - D2223
  - D2224
  - D2293
  - D2317
  - D2318
  - D2430
  - D2582
  legacy_debt_shrunk: >-
    SHRUNK 2026-10-28 by D-3217: 24 -> 20. The four ids removed - D2100 -> D2094, D2253 -> D2362, D2294 -> D2298,
    D2296 -> D2298 - are exactly the "4 carry superseded_by" the measurement above recorded on 2026-09-25. Once a
    retirement NAMES a resolvable successor it is no longer silent, so its pin outlived its subject and D-2645 says
    the list may only shrink (D-3216 clause 4). Nothing was added, no id was re-pinned, and the list still pins BY
    IDENTITY and never by a count. The measurement above is left as it was measured: history is corrected beside
    itself, never rewritten (D-3034/D-3214).

  legacy_debt_measured: >-
    MEASURED 2026-09-25: 16 SUPERSEDED + 8 ARCHIVED = 24 records, 0 carrying a reason or evidence (4 carry a
    date, 4 carry superseded_by). They are NOT backfilled: a reason reconstructed by a tool is not evidence, and
    inventing one to make a rail green is the corruption this register exists to prevent. The debt is DECLARED
    here, and the reference rail still protects what matters: every revocation minted from 2026-09-25 on must
    carry its scope, reason, evidence, date and tokens or it is not a revocation.
  reference_rail: scripts/check_revoked_references.py


# -------------------------------------------------------------------------------------------------------------
# graph - the decision GRAPH (succession + force). BUG-575, D-2682.
#
# WHY. MEASURED 2026-09-27 (BUG-575): 16 records are state=SUPERSEDED and only 4 name their successor, so "what
# replaced X" was answerable from human memory and from NO machine home; and 4 config citation sites name a
# decision that is NOT IN FORCE (D-403 x2 PROPOSED, D-400 PROPOSED, D-2663 OPEN), i.e. a protection enforced by
# nobody - the D-328 defect generalised to the whole registry. MADR is the real-world precedent: status =
# "superseded by ADR-0123" is a LINK, never a label.
#
# DIRECTION OF AUTHORITY (unchanged). config/decisions.yaml owns WHICH record is SUPERSEDED and WHAT replaced
# it; this file owns the RULES - which states are in force, which state means retired, the measured debt. No
# value here may be re-typed in scripts/ (C12/C12c/C20). Authority is a COMMENT, never a `decided:` key: a
# value under a citation key would make this file a citation site of a decision minted after its own rail ran.
#
# DEBT IS PINNED BY IDENTITY, NEVER BY A COUNT (the legacy_debt_ids idiom above). Both pin lists are
# SHRINK-ONLY: a pinned id that now names a successor, no longer exists or changed state, or a pinned citation
# site that no longer exists or now names an in-force decision, is a STALE declaration and FAILS the rail.
#
# authority: D-2682
graph:
  successor_field: superseded_by
  # The state a record must carry to make succession COMPULSORY (a retirement a machine can follow).
  supersession_state: SUPERSEDED
  # The states a CITING site may rest on. Every state present in the registry must be classified by one of
  # these two sets or the rail FAILS CLOSED, so a new state word cannot enter silently. MEASURED 2026-09-27:
  # 812 records across exactly these words (case-insensitively - 'active' is the same state as 'ACTIVE', C21).
  in_force_states: [ACTIVE, RESOLVED, RATIFIED]
  not_in_force_states: [PROPOSED, OPEN, DEFERRED, PLANNED, DRAFT, SUPERSEDED, ARCHIVED, REJECTED]
  pinned_supersession_ids:
  - D2070
  - D2080
  - D2085
  - D2087
  - D2091
  - D2223
  - D2224
  - D2293
  - D2317
  - D2318
  - D2430
  - D2582
  pinned_supersession_measured: >-
    MEASURED 2026-09-27 (BUG-575): of the 16 state=SUPERSEDED records, 4 name their successor (D2100->D2094,
    D2253->D2362, D2294->D2298, D2296->D2298) and these 12 do not. They are NOT backfilled: a successor
    reconstructed by a tool is not evidence, and inventing one to make a rail green is the corruption this
    register exists to prevent (the legacy_debt_ids reasoning is unchanged). One record (D2104) carries a
    `supersedes:` key in the other direction and is not a successor claim for any of these ids.
  pinned_forward_citations:
  - config/evidence_floors.yaml:decided=D-403
  - config/handoffs.yaml:decided=D-403
  - config/instrument_controls.yaml:decided=D-400
  pinned_forward_citations_measured: >-
    MEASURED 2026-09-27 (BUG-575): 4 of the 59 config citation sites name a decision that is not in force, and
    each is the AUTHORING AUTHORITY of a live config file. They are DECLARED forward references, not
    exemptions: the honest remedy is a visible, reasoned declaration a rail reads and can shrink - NOT the
    owner silently ratifying four decisions that no ruling has in fact made.
    SHRUNK 2026-10-13 (D-2973, BUG-542): the fourth declaration (config/recalibration_pins.yaml:decision=D-2663)
    no longer names any site - the r2_meter pin was re-minted to D-2963 (state RESOLVED) and the composite moved
    again under D-2928 - so it is REMOVED, never re-pointed: a declaration that outlives its subject fails the
    rail (BUG-542), and re-pointing would ratify a citation the file no longer carries. 3 declared forward
    references remain, and MEASURED the same day: 0 of the 70 live config citation sites rest on a decision
    that is not in force.

# What counts as LIVE code. governance/** and archive/** are deliberately NOT scanned: those files are the
# archaeology, and a rail that forbids writing down what was abandoned would delete the only evidence that it
# was abandoned (D-2643: keep the archaeology, close the path).
#
# EXEMPTIONS ARE DECLARATIONS, NOT CONVENIENCES (audit F4): every exempt path must EXIST and must carry an
# exempt_reasons entry, or the rail fails closed. An exemption for an absent file is a permission pre-registered
# for a file a future author has not written yet. The detector itself is NOT exempt (audit F1): its known-answer
# controls use a RESERVED fixture token instead of the live subject, so the rail names no revoked token and
# needs no exemption for itself.
reference_rail:
  # BUG-523 (MEASURED 2026-09-26): the rule below said "a RESERVED fixture token" but never declared WHAT
  # the reserved SPACE is, so no machine could answer "is this name reserved?". A reservation that is not a
  # declaration is a comment. MEASURED: the reserved range below is entirely ABSENT from
  # config/decisions.yaml, so it is free; the two fixture ids were drawn from the LIVE space and were
  # collision-free only by luck.
  # D-2655 (2026-09-26): the sentence that used to stand here - "the next decision this project mints is
  # D-2650" - was REMOVED rather than corrected. A claim about the NEXT id is a volatile value with no home
  # and no rail: it is the same defect class as the derived head this sitting deleted from the append-only
  # registry, and the mint it named (D-2654/D-2655) made it false within the same day. Only
  # config/decisions.yaml can answer which ids exist.
  reserved_fixture_ids:
    range: [D-9000, D-9999]
    why: >-
      A known-answer control must use a name no production object can ever claim. Both fixture ids in this
      rail were drawn from the LIVE decision space (D-2650, D-2651) and were collision-free only by luck:
      they were unclaimed on the day they were written. The range is the reservation; the controls assert
      that every fixture id lies inside it and that no id inside it exists in config/decisions.yaml.
  scan_roots: [pipeline, scripts, tools]
  scan_files: [justfile]
  scan_globs: ['config/*.yaml']
  exempt_paths:
  - config/decisions.yaml
  - config/decisions_policy.yaml
  - pipeline/migrate_D2205_epistemic.py
  exempt_reasons:
    config/decisions.yaml: >-
      the DECLARATION must be able to name the tokens it revokes: this file is the evidence for the revocation
      and the rail reads its subject from it. Exempting it is what lets the scan be strict everywhere else.
    config/decisions_policy.yaml: >-
      the RULES file must be able to name the states it governs (REVOKED/ABANDONED) and the legacy debt it
      pins. It declares no token of a revoked scope and it is the rail's own policy input.
    pipeline/migrate_D2205_epistemic.py: >-
      the TOMBSTONE must be able to name its own subject: it is the evidence for the revocation and it is
      unreachable without the explicit owner opt-in flag (D-2643). Exempting it is what lets the scan be
      strict everywhere else.

# MEMBERSHIP (BUG-587, D-2690). The ONE home of the rule that joins the registry to the log its own header calls
# its human face. A RETIRED tool declared this check and no file implemented it (D-405), so an id NAMED in the log
# could name nothing and every rail stayed green. The REVERSE direction is NOT asserted: the log is a TIERED face
# of the registry (its own header) and the full history lives in archive/, so an equality join would RED on ~680
# legitimate records and become a rail nobody can satisfy (BUG-540). Rules live HERE, code lives in
# scripts/check_decision_membership.py, and the id SPELLING rule is imported from the reconciler (D-2646/C21).
membership:
  log: DECISION-LOG.md
  # The THREE surfaces the log NAMES a decision on: the D2552 table row ('| D-2689 | ACTIVE | ... |'), the
  # historical heading ('## ... D-2689 ...'), and the BARE PARAGRAPH entry ('D-3134 (ACTIVE 2026-10-23): ...').
  # MEASURED 2026-09-27: 152 rows + 53 headings, 194 distinct ids. The third form is added 2026-10-24 by BUG-989:
  # D-3134..D-3137 were appended as bare paragraphs and the first two patterns could not see them, so the join
  # printed a GREEN over four records the log named that the registry never minted (the BUG-757/D-2985 shape). A
  # line-start D-id followed by a parenthesised annotation is an ENTRY (the decision is the line's subject); a D-id
  # elsewhere in prose is a REFERENCE and is deliberately NOT matched - matching it would fire on every inline
  # citation (D-3034 etc.) and on list labels 'D1/D2/D3'. Measured: exactly 8 lines match (D-2688, D-2747, D-2802,
  # D-2804 - all minted - plus D-3134..D-3137), zero false positives.
  id_patterns:
  - '^\|\s*(D-?\d+[a-z]?)\s*\|'
  - '^#{1,4}[^\n]*?\b(D-?\d+[a-z]?)\b'
  - '^(D-?\d+[a-z]?)\s*\('
  # Pinned BY IDENTITY, never by a count: a ceiling would let a NEW orphan hide inside it. The list may only
  # SHRINK - an id here that becomes a record, or that the log stops naming, is a STALE declaration and fails
  # the rail (D-405). MEASURED 2026-09-27, each classified: D-271 / D-272 / D-275 are DATED SECTION HEADINGS
  # for groups of lettered records (D271a-d, D272a-e, D273a-g) that ARE in the registry; D637 is a dated owner
  # ruling recorded in governance/, not a minted record.
  # RETIRED 2026-10-13 (D-2984, BUG-760/761): D2537 was pinned here as "a table row in the historical tier whose
  # record does not exist under that spelling". D-2984 joined decision ROWS to the register and found that row
  # (`| D2537 | Ranking fix + raw-label facet (opt-in). |`, in the tier "ACTIVE - in effect") citing an id no
  # record carries - a citation whose subject is absent is an assertion (D-405) - and re-cited it to D-2979, the
  # record that holds the decision. The log therefore stops naming D2537, which is exactly the shrink this pin's
  # own note prescribes. CORRECTED 2026-10-13 (D-2986): the note claimed the id "is still cited ONCE" - it was
  # cited in FOUR places, so the note was itself a stale restatement (BUG-588) and is replaced by the measured
  # truth. REPAIRED 2026-10-28 (BUG-1108): (a) the register's OWN D-2979 title, which had cited "D-2537", was
  # repaired by owner ruling d069d0c (the phantom token dropped; a title is a claim at the moment of mint, D-2660,
  # and an owner-gated citation repair drops a dangling pointer without rewriting the decision); the three
  # record-body mentions (D-2690's orphan list, D-2984, D-2986) were reworded to drop the bare token in the same
  # act. What still survives, and why each is not repaired here: (b) `specs/retrieval_serving.spec.md`, which now names D-2979 and
  # records the legacy spelling instead of citing the absent id; (c) EIGHT code comments (pipeline/retrieve.py x5,
  # pipeline/query.py x2, pipeline/pipeline_paths.py x1) that name the flag by the spelling the record's title
  # uses - not face claims, and not edited inside a governance act under a pipeline write boundary. An ALIAS key
  # was considered and REJECTED: no reader would consume it, and a declaration nothing reads is bloat (C19).
  legacy_orphan_ids: [D-271, D-272, D-275, D637]
  why: >-
    An id NAMED in the human log with no TOP-LEVEL record in the registry is the signature of BUG-587: the record
    was ABSORBED into the previous record's files: list, its bytes are in the file, the file parses, and the
    decision is invisible. Declared so the rail has ONE home and cannot be satisfied by a restatement.

# -------------------------------------------------------------------------------------------------------------
# CITATION RESOLUTION (BUG-1108). A D-token CITED INSIDE a record's own fields (category/title/related/decision/
# verification/measured/evidence/reason, recursively - every string the record carries) must resolve to a MINTED
# top-level record. The membership join above verifies the LOG's direction; this verifies the REGISTER'S OWN
# INTERNAL citations, which no rail read before BUG-1108 (D-3208 clause (3): a prose defect must be CONVERTED
# into an instrumented check, not found by hand).
#
# WHY REPORT-ONLY FIRST (D-2949/D-2951). A regex cannot tell a DECISION citation from an IRON-RULE reference
# (R-D410 safe_delete), a CONFIG VALUE ('the D150 cap'), or a LIST LABEL ('D1/D2/D3'). Enforcing on a naive
# pattern would fire on those false positives - a loud rail nobody can satisfy is not a rail (BUG-540). So the
# rail REPORTS every candidate dangling token WITH its citing record, for owner/classifier resolution, and flips
# to FATAL only after the owner rules each class.
#
# THE GRAMMAR (measured 2026-10-28). 1348 minted ids: 130 with a 3-digit core, 1186 with 4 digits, plus letter-
# suffixed families (D271a-g, D272a-g, D273a-h, D274a-h, D275a, D2177a, D2190a). A `D-\d{4}` pattern therefore
# MISSES 130 records and every lettered id - the exact "green over a whole class" defect this rail exists to kill.
# The pattern is `D-?\d{3,4}[a-z]?` with a negative lookbehind for the IRON-RULE prefix R-, so R-D410 is a rule
# reference, never a citation.
citation:
  pattern: '\b(?<!R-)D-?\d{3,4}[a-z]?\b'
  # Pinned BY IDENTITY: sentinels (placeholder ids in measured/evidence) and the log's own legacy orphans are
  # known-non-record ids a citation may legitimately rest on. The list may only SHRINK (D-405).
  allow_ids: [D-0000, D-9999, D-271, D-272, D-275, D637]
  report_only: true
  why: >-
    A D-token cited INSIDE a record that names no minted top-level record is a declaration that does not resolve
    (D-3034): a forward-reference the author pre-wrote but never landed, a real decision never minted, or a stale
    restatement. The rail reports the class so the owner can mint / drop / repoint each token; it never silently
    edits the append-only registry (D-2660).

# -------------------------------------------------------------------------------------------------------------
# STATE SPELLING (BUG-583). A state is ONE value with ONE spelling.
#
# WHY. MEASURED 2026-09-27: the registry carried ACTIVE 515 and `active` 5 (3 bare, 2 quoted).
# canonical_state() upper-cases, so the CENSUS was always right while the BYTES carried two forms of one state:
# invisible to every rail, and fatal to any future consumer that compares state strings exactly. This is the
# BUG-572 family one level down - a spelling that decides nothing is still a SECOND form of a governed value.
#
# WHY A NAMED ROUTE AND NOT A BLANKET REWRITE. config/decisions.yaml is append_only with a PREFIX receipt
# (D-2655): no writer may rewrite a key in place, so canonicalising the pinned cells needs the registry's OWN
# writer, a PROOF that the edit touched those cells only, and a refreshed receipt. That exception is not granted
# to a willing script - it is DECLARED here (canonicalisation_route), the way the reservation and the debt lists
# are, so a future author cannot re-invent it and a reader can FAIL on its absence. The reader that FAILS on a
# NEW second spelling is scripts/recompute_decision_summary.py#spelling_problems(); this block is the pin AND the
# route, which is why the pin can now be EMPTY and the rule universal (a debt that can never be paid down is a
# permanent exemption wearing a debt's clothes).
state_vocabulary:
  canonical: 'the `STATES` vocabulary in scripts/recompute_decision_summary.py, upper-cased by canonical_state()'
  # The ONLY sanctioned in-place edit of that registry, named as a command so a reader can join it to a writer.
  canonicalisation_route: 'scripts/recompute_decision_summary.py --canonicalise-states [--apply]'
  # The ONLY sanctioned SEMANTIC transition (D-3035/M2, added 2026-10-16). A canonicalisation fixes a SPELLING;
  # this changes a state, and it carries the same three obligations: the ordering decision that NAMES the record
  # it moves (--because, or the route refuses - a licence that names no target would let one order cover any
  # record, D-2972), exactly ONE spliced cell, and the obligation printed because the splice moved bytes inside
  # the receipted region by construction. Declared here so the rule has a home a reader can join to a writer.
  transition_route: 'scripts/recompute_decision_summary.py --set-state <D-id> <STATE> --because <D-id> [--apply]'
  # Pinned BY IDENTITY, never by a count (a ceiling would let a NEW spelling hide inside it), and SHRINK-ONLY:
  # a pinned id that is canonical now is a STALE declaration and fails the rail (D-405). EMPTY after 2026-09-27:
  # all five were canonicalised, so a pin here would now be the stale declaration the rule exists to catch.
  legacy_non_canonical_ids: []
  canonicalised: >-
    MEASURED 2026-09-27: the five records that spelled the SAME state the others spell ACTIVE were replaced in
    place by the declared route (D-2693). The five cells are the WHOLE diff: same record count, same id set, no
    other key of any record moved, and the registry re-derives canonical EVERYWHERE, which is what let the pin
    shrink to empty. The content stamp MOVED (a state is part of it) and the decisions_registry PREFIX receipt was
    re-baselined in the same sitting - a splice moves bytes inside the receipted region by construction, and
    verify_handoffs is the reader that would have caught a forgotten re-baseline.
  why: >-
    spelling_problems() fails on any non-canonical spelling that is NOT pinned, and fails on a pin that no longer
    describes anything. Both directions are live: the pin is empty and a SECOND spelling is still refused the
    moment it is written, so the rule is now universal rather than a five-record exemption.
  # BUG-1101 (D-3222): a state's SPELLING (canonical above) and its SIGN (gov_sync.yaml#state_glyphs) are both
  # declared, but its MEANING had NO home - the BUG-483 class one level up. RATIFIED is the one that bit: 153
  # records carried it, 38 of them with the word "owner" nowhere in their payload, so the face's "⚖ ratified 153"
  # invited two readings (the owner ratified this / this sitting ruled and applied it). The owner chose option B:
  # RATIFIED is a STRUCTURAL claim, never an authorship claim. Declared here so a reader joins the word to what it
  # MEANS, not only to what it spells.
  meanings:
    RATIFIED: >-
      The decision is in force and its act has been applied to the register/tree it rules over - a claim about
      force and application, never about who applied it: whether the owner ratified it (D-2879/D-2880 "Owner review
      ROUND n ... ratified") or a sitting ruled and applied it is provenance carried in the payload, not part of
      what the state means. A reader counting "⚖ ratified" is counting applied in-force decisions, not owner acts.

# -------------------------------------------------------------------------------------------------------------
# LOG HEADER (BUG-588). The human log's header may POINT at the census; it may never RESTATE a count.
#
# MEASURED 2026-09-27: DECISION-LOG.md line 3 declared '(651 decisions)' while the canonical census read 822 -
# stale by 171, and UNFALSIFIABLE where it sat (no rail joined a prose count to the derived one). A count in
# prose is a SECOND HOME for a derived fact (D-2646/BUG-585 class). REWRITE-HEADER, executed: the header names the
# census and states no count; this block is the reader that FAILS on a restatement.
log_header:
  file: DECISION-LOG.md
  scan_lines: 5
  census_pointer: config/decisions_summary.json
  forbidden_count_pattern: '(\d+)\s+decisions'
  why: >-
    scripts/check_decision_membership.py#header_problems() reads this block. It is the same rail that joins the
    log's IDs to the registry: one file, one header, one rule - the file's claims about the registry are checked
    where the file is read, never by a human remembering to re-type the count.

# -------------------------------------------------------------------------------------------------------------
# PIN LISTS - which of the lists above may only SHRINK, declared as DATA (D-3218, closes BUG-1100).
#
# WHY THIS BLOCK EXISTS. Every pin list in this file states its direction in PROSE ("the list may only shrink",
# "Both pin lists are SHRINK-ONLY") and MEASURED 2026-10-28 no machine could READ that sentence - so the ONE
# mutation this file needs had no route, and the act that performed it (24 -> 20, D-3217) was a scratch script in
# temp/. A rule only prose can state is a rule the next hand invents its own version of. The subjects are
# therefore declared here, the ONE route reads them, and a key outside this list is REFUSED rather than guessed:
# graph.in_force_states is ALSO a list, and removing a member of it would make a citation rail accept LESS while
# every declaration still read as satisfied - a route that can shrink any list can shrink a PERMISSION instead of
# a PIN.
#
# A PIN IS REMOVED, NEVER RE-POINTED. A re-point is a drop plus an add, and the ADD is refused: a re-pointable pin
# is a laundering door, since any session could re-point a debt at nothing. What retires a pin is the RECORD's own
# state - a link that now RESOLVES, a citation site that is gone, a state that is canonical - never a new
# declaration invented to make a rail green (D-2645/D-3217).
#
# NO RECEIPT CACHES THESE BYTES (MEASURED 2026-10-28): config/handoffs.yaml declares no artifact for this path, so
# the receipt of a pin shrink is write_guard's mutation-journal row PLUS the READERS below - which is why the route
# PRINTS them instead of promising the act in prose (the BUG-376 shape: an obligation discharged by nobody).
pin_lists:
  # The ONLY sanctioned mutation of this file, named as a command so a reader can JOIN it to a writer - the same
  # idiom as state_vocabulary.canonicalisation_route / transition_route above (D-3218).
  route: 'scripts/recompute_decision_summary.py --shrink-pins <dotted.key> --drop <token> [--drop <token>]... --because <D-id> [--apply]'
  direction: shrink_only
  why: >-
    Every in-place edit here carries the same three obligations (D-2972): a licence (--because) that must RESOLVE
    and must NAME each token it drops - a licence naming no subject would let one order cover any pin - exactly
    ONE proved splice (whole item lines of the named list, in either list style this file uses, with the remaining
    list, the arithmetic and the WHOLE document compared afterwards), and the obligation printed with the readers
    it comes from. The route refuses any subject not listed here, refuses a token that is absent from the list (an
    addition), refuses an empty shrink and a duplicate, and reads the shrunk list back from the bytes ON DISK.
  keys:
  - revocation.legacy_debt_ids
  - graph.pinned_supersession_ids
  - graph.pinned_forward_citations
  - membership.legacy_orphan_ids
  - state_vocabulary.legacy_non_canonical_ids
