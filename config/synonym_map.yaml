# K4: Synonym Map — Domain Label to Search Terms (L2, D29-D)
# 2026-07-08
#
# Maps every S3 canonical domain label to user-searchable terms.
# Addresses FM2 (D28 Pattern Gap): the D28 GENERAL_PATTERNS list
# misses entire domains like information architecture, design systems,
# branding, prototyping, agile, management, business law.
#
# This expands D28's hardcoded pattern matching to cover actual S3 vocabulary.
# Generation: python3 tools/synonym_generator.py --validate
#
# See also: config/taxonomy_v5.yaml, config/context_definitions.yaml
# Related FBs: C5 (Keyword Validation), K5 (FB Relations)

version: "2026-07-08.K4"
classification_version: v1.0

