schema_version: '1'
authority: D-2997
kind: ingest_identity_gate
# ─────────────────────────────────────────────────────────────────────────────────────────────
# ONE HOME of the INGEST-SIDE identity gate's policy (BUG-781). It CROSS-REFERENCES, never restates:
#   * the two detectors + the owner-ledger vocabulary : config/eval_integrity.yaml#duplicate_gate (D-2736/37/38)
#   * the collapse bar and its measured census       : config/corroboration_collapse.yaml#lexical_limb (D-2996)
#   * the corpus root / checkpoint root              : pipeline/pipeline_paths.py (BOOKS_DIR, CHECKPOINT_DIR)
#   * the source-noise markers and the sanitizer     : pipeline/book_metadata.py (D2449) + config/filtering.yaml
#   * the identity function itself                   : pipeline/book_metadata.py::compute_source_id (D2176/D2308)
# WHY THIS FILE EXISTS. The identity machinery was never missing — its ENFORCEMENT POINT was. MEASURED
# 2026-10-14: governance/duplicate_adjudication.json holds 59 adjudicable pairs with `adjudicated: 0` from
# 2026-09-30, because nothing in the INGEST path read it (the gate is declared POST-RUN only). BUG-780 measured
# the consequence: 530 of 1,393 corroborated rows are ONE TEXT under TWO NAMES (84 pairs), 369 served.
# This gate ADDS the missing enforcement point and NOTHING ELSE: it never re-detects (detection has one home),
# never merges, never deletes (R-D410), and never labels (D-2898 — a work-identity label is an owner word).

door:
  # The door is DELTA-SCOPED (the cascade rule): only files ABSENT from the metadata cache are candidates, so
  # an already-ingested file can never be re-classified here and no row, checkpoint or source_id can move
  # because of this gate. A deferred candidate is skipped IN PLACE (never deleted), loudly named, and recorded.
  new_file_definition: absent_from_metadata_cache
  action: defer_new            # defer_new | report | abort
  # A first run has no metadata cache yet (S0.5 WRITES it), and pre-S0 no corroboration claim is minted, so a
  # missing cache degrades LOUDLY (receipted as `identity_available: false`) instead of aborting. The same
  # absence at `--gate` (post-S0.5) is FATAL: there the door is the last screen before the claim is minted.
  on_missing_cache: degrade_loud       # degrade_loud | abort
  points: [pre_s0, pre_s1_5]   # ONE function, two declared call points; the identity screen is stronger after S0.5 (author|title exists)
  override_env: MAXWELL_INGEST_GATE   # value `warn` = publish the deferrals and proceed (logged AND counted, never silent)
  deferral_dir: temp/ingest_deferrals # gitignored runtime state: THIS batch's deferral receipt (D-2983 disposition)
  # The SAME rc means two things, by DECLARATION (never by accident): in `just health` rc 2 is OWNER-OWED and
  # NOT fatal (BUG-457); at the ingest door rc 2 REFUSES, because a run that proceeded would mint the very
  # claim (corroboration by two VOICES) that the unresolved identity makes false.
  ingest_reading: rc2_refuses

identity:
  # Deterministic name defects — MACHINE-decidable, so they are never an owner question; they are reported with
  # the sanitized name the file should carry. MEASURED 2026-10-14 on the 962-record cache: 571 names carry an
  # ingest-site marker, 34 carry a repeated internal space, 3 carry leading/trailing whitespace. Fixing an
  # already-ingested name is a WRITE, so the count is a DEBT rather than a fatal line — and WHICH debt it is, is
  # its DISPOSITION below (T-130 option B, owner word 2026-10-16): the whitespace classes are ACCEPTED DEBT
  # (printed and counted by this door, never an rc 2 trigger), the marker class stays OWNER-OWED and owns its
  # own row (T-173), because bundling them would let one act answer for two different blast radii.
  name_defect_patterns:
    leading_or_trailing_whitespace: '^\s|\s$'
    repeated_internal_whitespace: '\S\s{2,}\S'
  ingest_site_marker_pattern: '(?i)(z-libr|libgen|liber3|anna''s archive|annas-archive|1lib)'

  # ── T-130 OPTION (B) — THE OWNER WORD 2026-10-16 ("T-130 ok go with B") ──────────────────────────────────
  # B is TWO things and nothing else: (1) the door's record lookup becomes DECLARED and ORDERED, so the 37
  # names it calls defective are found through the SAME key it compares with (`_key()` already collapses
  # whitespace) instead of through the very bytes it calls defective (BUG-799, D-3034); (2) the whitespace
  # classes become DECLARED DEBT — printed, counted, and NOT an rc 2 trigger — while the marker class keeps a
  # disposition of its own. It does NOT rename anything: the approved rename is a CASCADE until it rides a
  # re-ingest (BUG-800: 2,952 references inside 13 already-written run receipts), so it is scheduled by a
  # REGISTER ROW (T-172) rather than by this file, and this file only declares what the door must now read.
  # The FIRST lookup that answers wins, and a receipt names WHICH one did. The order is not cosmetic: the
  # canonical fallback is what lets the DECISION ground a variant name in IDENTITY, so a renamed or
  # noise-suffixed file is DEFERRED and RECORDED (skipped in place, loudly) instead of being treated as a work
  # the corpus has never seen. It deliberately does NOT govern candidacy — see candidate_lookup below.
  candidate_lookup: [exact_name, exact_path]
  #: WHY CANDIDACY IS A SEPARATE, DECLARED RULE (BUG-848, MEASURED 2026-10-16). pipeline/stage0_convert.py
  #: converts the corpus MINUS the deferrals this door NAMES, so candidacy is VISIBILITY: a file no EXACT lookup
  #: names must be DECIDED (candidate -> a recorded deferral -> skipped in place). If the canonical lookup were
  #: allowed to decide candidacy, a noise-suffixed or freshly-renamed duplicate would be silently absorbed,
  #: never named in the receipt, and then CONVERTED — the duplicate work this gate exists to prevent — while the
  #: door's own reading still said 0 candidates. A candidate lookup that is not a SUBSET of record_lookup is
  #: FATAL, because the only way back into that trap is to add `canonical_name` here.
  record_lookup: [exact_name, exact_path, canonical_name]
  #: Every class the door COUNTS must have a disposition — a class with none, a token outside this vocabulary,
  #: or an `accepted_debt` with no named owner word is FATAL (the door's own reader faults on it). Acceptance is
  #: the riskiest reading a gate can make; it may be a WORD, never a default (D-3038 records what we accept).
  defect_disposition:
    leading_or_trailing_whitespace: accepted_debt
    repeated_internal_whitespace: accepted_debt
    ingest_site_marker: accepted_debt
  accepted_debt:
    # ONE WORD PER CLASS (D-3043 / T-173). An acceptance is a WORD ABOUT A CLASS: the word, the row it
    # names and the reason it is not a hazard are declared ON the class they are about. `same_as` is a
    # POINTER to another class's declaration and must RESOLVE (D-3034); an accepted class with no word of
    # its own, or a declaration for a class that is NOT accepted, is FATAL (the door's own reader).
    declarations:
      leading_or_trailing_whitespace:
        owner_word: 'OWNER WORD 2026-10-16 (verbatim): "T-130 ok go with B" — ACCEPT the 37 corpus-name
          defects with the debt declared, and make the acceptance safe with the canonical reader fallback
          and its own control.'
        declared_by: [D-3040]
        row: T-130
        because: 'MEASURED 2026-10-15 (BUG-800): the approved whitespace rename cannot be applied against a live
          corpus — the 37 stems are referenced 2,952 times INSIDE 13 already-written run receipts (the parquet export
          2,419; the stage0/2/4/5 checkpoints and their input_fbs), which are RUN RECEIPTS and cannot be rewritten
          without re-recording history (D-2642). The plan is written and waiting (89 rows -> 37 rows, apply_ready
          False, each row naming its artifact), and the act becomes non-cascading when those artifacts are
          regenerated anyway: T-172.'
        not_a_hazard_because: 'MEASURED 2026-10-15 (BUG-799): the door''s own comparison key `_key()` already
          collapses whitespace and strips, so a whitespace defect is STORAGE-non-canonicality, not ambiguity — it
          converts no duplicate work into a distinct one and hides no collision. The 2 canonical collisions in the
          live cache are duplicate records of ONE work (identical source_id), not two works under one name.'
        safe_because: 'the acceptance is CARRIED BY A MECHANISM, not by tolerance: identity.record_lookup resolves a
          defective name by the canonical key the door ALREADY compares with, so the DECISION grounds it in identity
          (`record_resolution: canonical_name`) and the outcome is a RECORDED deferral, skipped in place — never a
          work re-classified as new, and never a silent exclusion from the gate (BUG-848: candidacy stays EXACT).
          Both directions are controlled (scripts/check_ingest_identity_gate.py: the fallback resolves, an exact
          match still wins, a variant name STAYS a candidate and is deferred on identity, a record with no
          author|title still defers on its sanitized stem, and a genuinely new name is still admitted).'
      repeated_internal_whitespace:
        same_as: leading_or_trailing_whitespace
      ingest_site_marker:
        owner_word: 'OWNER WORD 2026-10-16 (verbatim): "T-173 accept" — the 459 ingest-site markers are
          ACCEPTED with the debt declared, and the SANITISE route is REFUSED with its reason (an accepted
          negative, D-3038), not left as an open question.'
        declared_by: [D-3043]
        row: T-173
        because: 'MEASURED 2026-10-16: 459 of 940 corpus stems carry an ingest-site marker (571 of 962
          cache names), and the remedy for this class is the SANITIZER — which would rename 571 names,
          not 37: T-130 option (B) deliberately did not widen its whitespace act into this class. The
          marker is STORAGE noise, not identity: the door key `_key()` = sanitize_source_book(stem)
          strips the marker before any comparison, so no work is read twice because of it and no
          collision is hidden by it.'
        not_a_hazard_because: 'the REFUSED route is the one with the blast radius. Renaming 571 names is
          ~15x the accepted whitespace act for ZERO identity gain, and against a live corpus it is a
          CASCADE (the same class of reference debt that makes T-172 refuse at 37 stems, BUG-800).
          Accepting a storage class is therefore cheaper AND safer than repairing it, and the repair
          stays available on the terms of T-172 if human-browsable names are ever wanted.'
        safe_because: 'the acceptance is CARRIED BY MECHANISMS, not tolerance: (1) the door key strips
          the marker, so a marker-bearing file resolves by the same canonical key as a clean one; (2)
          since T-172 the identity layer DEFERS a renamed file whose cache record still carries the old
          name (`already_ingested_by_canonical_name`) instead of re-ingesting it as a new work; (3) the
          class stays COUNTED and PRINTED here and in `just health` — the acceptance changes the rc a
          class triggers, never its visibility (D-3043).'

ledger:
  file: governance/duplicate_adjudication.json     # D-2738 — the ONE owner ledger (59 pairs, PENDING)
  verdicts_open: [PENDING]
  verdicts_closed: [MERGE, KEEP_SEPARATE]
  # ONE act, two sheets: T-129's sheet and the ledger carry the SAME ruling in two vocabularies. Declared here
  # so the gate can never report one owner act as two different debts (nor two debts as one).
  collapse_sheet: governance/work_identity_collapse_review_20261014.csv
  collapse_words:
    CONFIRM-ONE-WORK: MERGE
    DISTINCT: KEEP_SEPARATE
    LEAVE: PENDING
  #: BUG-782: the sheet's ruling COLUMN is resolved from its DECLARED home (ONE home, C12). A reader must never
  #: sniff a column by NAME: the v1 sheet carried a machine screen in a column named `owner_ruling`, and on the
  #: rendered sheet a name-sniff lands on `proposed_ruling` — i.e. it would count a PROPOSAL as an owner's word.
  collapse_word_column_from: config/owner_marks.yaml#homes.collapse_sheet.derived_column
  #: BUG-786 (MEASURED 2026-10-14): the DERIVED column is not enough. The sheet on disk carried a word in all 84
  #: rows while `ruling_source` said `none` for every one of them - the cells were typed by hand into the column
  #: `--apply` writes - and this reader counted them as RULED (84 ruled / 0 owed). A reader that cannot tell a
  #: hand-typed cell from a signature releases the lane without an owner act. So the PROVENANCE column is declared
  #: too, and a word whose provenance is blank or the `none` token below is OWED: `--apply` always records 'row'
  #: (a per-row override) or 'signature:<tier>@<date>' (a signature expansion).
  collapse_word_source_column: config/owner_marks.yaml#homes.collapse_sheet.provenance_column
  collapse_word_source_none: none

content:
  # P2 (post-S0, pre-S1.5): the D-2737 detector's report is the authority for content-level same-work pairs.
  report: governance/same_work_content_candidates.json
  title_report: governance/title_rename_candidates.json
  # A report OLDER than the newest corpus file certifies a corpus that no longer exists: measured, not assumed.
  staleness: fatal

name_normalisation:
  # T-130, OWNER-APPROVED 2026-10-15 ("Approve your T-130 Write recommendation"). The door's rc 2 named ONE
  # debt whose remedy is a WRITE: 37 of 940 corpus stems carry a name defect. MEASURED 2026-10-15.
  #
  # THE REMEDY CLASS MUST EQUAL THE DEFECT CLASS. The defect is whitespace, so the write is WHITESPACE-ONLY.
  # It deliberately does NOT run the file stem through `sanitize_source_book()` even though that function is
  # one line away: the sanitizer ALSO strips piracy markers, and applying it would rename 571 names instead of
  # 37 (571/962 cache names carry an ingest-site marker). That is a DIFFERENT debt with a different blast
  # radius; widening this act's scope to cover it is how a bounded repair becomes a corpus-wide rewrite.
  scope: whitespace_only
  transform: whitespace_collapse_then_strip
  transform_pattern: '\s{2,}'
  invariant:
    # The door compares names through ingest_gate._key() = sanitize_source_book(name).strip().lower(), which
    # ALREADY collapses whitespace and strips. So these defects are STORAGE-non-canonicality, not ambiguity:
    # the rename must leave the door's comparison key IDENTICAL, and a row that would move it is refused.
    key_preserved: 'gate._key(stem_before) == gate._key(stem_after), computed with the door''s own function'
    bytes_unchanged: 'sha256 before == after per row; a delta rolls the rename back mid-act'
    suffix_unchanged: true
    parent_unchanged: true
    collision: refuse
  # THE CASCADE IS MEASURED, NOT ASSUMED. A filename is referenced by things other than itself. The act can
  # rewrite the metadata cache (it is the gate's own store of `source_book`); it CANNOT rewrite a stage-output
  # filename or a store row, so a reference there makes the plan NOT apply-ready and the reason is printed.
  # An absent surface reads as null with a reason and is never reported as zero (D-795).
  surfaces:
    stage_dir_attrs: [S0_DIR, S1_DIR, S13_DIR, S15_DIR, S2_DIR, S4_DIR, S5_DIR, S6_DIR]
    # MEASURED 2026-10-15 (and the reason this key exists): a FILENAME-ONLY census read 0 references for
    # every one of the 37 rows while the same stems sat 3,171 times INSIDE 13 derived artifacts - the
    # parquet export (2,419), the stage0/stage2/stage4/stage5 checkpoints and their input_fbs. An instrument
    # that scans names and not content reports a false green (the BUG-787 shape). These are RUN RECEIPTS:
    # this act cannot rewrite them, so a hit here refuses the apply rather than dangling.
    artifact_dir_attrs: [CHECKPOINT_DIR, PARQUET_DIR]
    artifact_suffixes: ['.jsonl', '.json']
    store_db_attrs: [DB_PATH]
    store_columns:
      - [fbs, source_books]
      - [fbs, source_text]
  plan: governance/normalise_corpus_names_plan_20261015.json
  receipt: governance/normalise_corpus_names_receipt_20261015.json
  reading: scripts/normalise_corpus_names.py
  #: The door's own count of this debt (identity.name_defect_patterns above) is the DEFECT source of truth;
  #: this act never re-declares the patterns (C12) and never invents a second census home.
  #:
  #: T-130 OPTION (B), owner word 2026-10-16: this act is NOT applied against the live corpus. The whitespace
  #: debt is DECLARED, and the rename RIDES THE NEXT RE-INGEST — when the artifacts that reference the 37 stems
  #: are regenerated anyway, so the write stops being a cascade (BUG-800). The TRIGGER is a REGISTER ROW, T-172,
  #: and the reason is a MEASUREMENT rather than a preference: `apply_ready` is False with 37/37 rows refused,
  #: each naming its referencing artifact. Until then the refusal IS the finding.
  #: The declaration above is what makes that day safe: with identity.record_lookup, a renamed file whose cache
  #: record still carries the old name resolves canonically instead of reading as a NEW candidate and being
  #: re-classified — so the deferral is a SCHEDULE, not a debt that can decay into a surprise.

source_library:
  # THE OWNER'S LIBRARY: files that have NOT entered the corpus yet. It is declared here because WHERE a repair
  # happens decides what it costs: a name repaired BEFORE the first reference carries ZERO references, while the
  # same repair after ingest is a cascade (MEASURED 2026-10-15, BUG-800: 37 defective stems referenced 2,952 times
  # inside 13 run receipts, which is why the approved repair T-172 must ride a re-ingest). Roots are written '~...'
  # and never mirrored (D-3034); the census is scripts/census_source_names.py, READ-ONLY, and it names no path of
  # its own (C12).
  roots:
    - id: books
      path: '~/Library/CloudStorage/Dropbox/education/books'
      kinds: [epub, pdf, md, mobi, azw3, djvu]
      #: D-3051/T-181: WHERE THIS ROOT'S WORKS ARE ADMITTED. A root points at a DECLARATION (the key below lives
      #: in arrangement), never at a path of its own - a path restated here would be a second home for one fact
      #: (C12/D-3034). A root that does not declare this key at all is FATAL: a silence about where a work goes is
      #: never a clean answer (D-3038).
      admits_to: corpus_home
    - id: journals_notes
      path: '~/Library/CloudStorage/Dropbox/education/journals:notes'
      kinds: [pdf, docx, md, txt]
      #: THE NOTE'S SHARE IS DECLARED (D-3062, owner word 2026-10-17; T-181 limb 2 was the last word owed here).
      #: A note is admitted to the SAME one corpus home - never a second corpus (a second home for one fact, C12)
      #: and never out of scope (T-181 measured 341 files of a kind this root declares). What makes it a SHARE
      #: rather than a merge is the AXIS: this root's placement axis is DOMAIN (placement.homes.journals_notes),
      #: the corpus's own layout axis is DOMAIN (its immediate subdirectories), and the two vocabularies are
      #: byte-identical - measured 2026-10-17: both trees carry the same eight DOMAIN names. So an admitted note
      #: lands at corpus_home/<its own DOMAIN>/<its own subtopic>/<name>.md: it keeps the owner's arrangement and
      #: adds nothing to the corpus the corpus does not already materialise. See arrangement.share_rule below for
      #: the rule the reader ENFORCES, and admission.decisions.refused_domain_not_a_corpus_domain for its refusal.
      #:
      #: ADMISSION IS NOT CONVERSION, and this line does not convert anything. The conversion stage accepts
      #: [.epub, .pdf, .md] only (flow.transitions.conversion.accepts, the origin of that set): of this root's
      #: declared kinds, a .pdf and a .md are convertible, while a .docx or a .txt is REFUSED as a container no
      #: stage reads - counted, printed, and owned by T-180 rather than admitted on a promise. MEASURED 2026-10-17
      #: on the live library: 718 files under this root, of which 247 are .pdf and 99 .docx, and the rest are
      #: image/design formats no declaration here owns at all (png, jpg, psd, ai, indd, idml).
      #:
      #: WHAT IS STILL NOT AUTHORISED: no engine admits a note (admission.actor is the owner, row by row, from the
      #: plan), nothing here moves a byte, and the applier is T-183. The 621 rows the plan refused for "no declared
      #: corpus home" now acquire a home and are RE-CLASSIFIED by the same reader; nothing is admitted by this act.
      admits_to: corpus_home
  metadata_cache: 'knowledge pipeline/checkpoints/book_metadata.jsonl'
  #: The three name classes this census counts. They are DIAGNOSTIC, not defects: the door's own key strips the
  #: marker and collapses whitespace before any comparison, so none of them moves identity — they are what a HUMAN
  #: sees in a file list, and the census exists to price a repair rather than to declare one.
  marker_pattern: '(?i)\b(z-?lib|libgen|annas?-?archive|anna.s archive|1lib|zlibrary)\b'
  spine_pattern: '\s--\s|\b[0-9a-f]{16,}\b'
  truncation_pattern: '_(\s|$)|\b(and|with|for|the)\s*$|\([^)]*$'
  #: WHAT THIS DECLARATION DOES NOT DO, recorded so it cannot be re-proposed as a surprise (D-3038): it does NOT
  #: authorise a rename. A source-side repair is an OWNER-LANE act that must be plan-first, must derive any new
  #: name from the file's OWN metadata (never from a guess), and must REFUSE on a name the cache or the corpus
  #: already resolves (that one is ingest-coupled: T-172's shape). Nothing renames the owner's library by default.
  accepted_negative: 'no default renamer: a bulk rename of the owner library is refused, because a name is evidence (a provenance handle including which mirror it came from) and never identity, and the pipeline reads identity from the TEXT and the BYTES (S0.5 metadata + the door key)'
  # ── T-176 / D-3048: THE OWNER'S ANSWER, AND THE ONLY WAY A NAME MAY BE REPAIRED ──────────────────────────────
  # The owner answered on 2026-10-16: human-readable names ARE wanted, in the format below. That answer turns the
  # accepted negative above into a NARROW yes: a name may be repaired ONLY where it carries no reference yet, ONLY
  # from the file's OWN embedded metadata, and NEVER by a bulk renamer. Everything this block does not authorise
  # stays refused, and the refusal is COUNTED rather than silent (D-3038: a rejected idea is registered with its
  # reason so it cannot be re-proposed as a surprise).
  name_policy:
    owner_word: '2026-10-16 (verbatim): "yes I would prefer rename to only include author - title - year format"'
    template: '{author} - {title} - {year}'
    when_year_absent: omit_the_year_segment_and_count_the_row
    author_form: 'the creators as the metadata spells them, joined by "; " - a list is carried, never truncated to one and never invented'
    #: The ORDER is the policy, and every entry is a source the FILE ITSELF carries. The S0.5 metadata cache is
    #: deliberately NOT here: a row the cache resolves is ingest-COUPLED and is refused before any name is proposed,
    #: so in this act the cache is the DISQUALIFIER and never a source (declaring it as a source would be a source
    #: no eligible row could ever reach - a promise, not a measurement). A model is not a source either, ever.
    metadata_priority: [epub_opf, pdf_info]
    #: Which reading each KIND admits. A kind with no entry here carries no metadata this act may read, so its rows
    #: are REFUSED by name rather than renamed from the filename (the filename is the defective handle, not evidence).
    kind_sources:
      epub: epub_opf
      pdf: pdf_info
    sanitiser:
      collapse_whitespace: true
      unicode_form: NFC
      decode_html_entities: true
      drop_characters: ['/', '\\', ':', '\n', '\r', '\t', '\u0000']
      separator: ';'
      separator_spacing: true
      collapse_repeated_separators: true
      trim_trailing: '[-_.;, ]'
      max_segment_chars: 120
      max_name_bytes: 200
      extension_preserved: true
    implausible_author_pattern: '(?i)^\s*(bsmoter|adobe|microsoft|scanner|unknown|user|administrator|admin|guest|sponsored(\s+by)?|www\.|https?://)'
    refusals:
      already_resolved_by_an_ingest: 'the S0.5 cache resolves this name, so a rename here is a re-ingest act (T-172/BUG-800 shape) - it rides the next ingest window, never this one'
      no_metadata_in_a_declared_source: 'no source in metadata_priority supplied BOTH an author and a title - a name is never invented, and a filename is not a source'
      author_is_not_an_author: 'the author field matches implausible_author_pattern (a tool, a scanner or a URL) - the metadata is about whoever made the file, not the work'
      proposed_name_already_exists: 'the proposed name is taken on disk or by another row of this plan - a rename may never land on an existing file'
      referenced: 'a declared surface names this file and this act cannot rewrite it - a rename that leaves a dangling reference is a cascade (BUG-798)'
      kind_has_no_declared_metadata_source: 'this kind has no entry in kind_sources, so the act may not read its metadata'
    reference_surfaces: 'config/ingest_identity_gate.yaml#name_normalisation.surfaces (the SAME declared surfaces the corpus-name act counts - one list, never a second)'
    plan_prefix: governance/SOURCE_RENAME_PLAN_
    reading: scripts/plan_source_rename.py
    ladder: 'python3 scripts/plan_source_rename.py --selftest -> 0/1; --plan writes the plan (a READ of the library plus one file); a bare run PRINTS and writes nothing'
  # ── THE ARRANGEMENT (T-176): WHERE A WORK LIVES, AND WHY A TOPIC IS NEVER A COPY ────────────────────────────
  arrangement:
    authority: D-3048
    one_bytes_home: 'knowledge pipeline/books - the ONE tree S0 reads and the ONE tree the S0.5 cache stamps (MEASURED: every cache record source_path lands inside it)'
    corpus_home: 'knowledge pipeline/books'
    #: THE SHARE RULE (D-3062), stated so a future root has somewhere to land and so the reader has something to
    #: ENFORCE rather than something to remember. A root's share of the one corpus home is expressed on THAT
    #: HOME'S OWN AXIS, never as a new top-level folder: the domain vocabulary's ONE materialisation is the corpus's
    #: own immediate subdirectories (census_source_names.axis_vocabulary), so a top-level folder invented by an
    #: admission would silently WIDEN the vocabulary the pipeline classifies against. Therefore a file may only be
    #: admitted into a subpath whose FIRST component is a name the corpus already materialises; anything else is
    #: refused as refused_domain_not_a_corpus_domain, counted and printed. This is why a note needs no folder of
    #: its own: its DOMAIN is already a share of the corpus.
    share_rule: 'a share is a subtree on the HOME OWN axis and never a new top-level folder: the first component of an admitted path must be a name the corpus already materialises, or the row is REFUSED (D-3062)'
    compare_key: "the door's OWN comparison key (pipeline/book_metadata.sanitize_source_book) - two homes resolve to one work only through the key the pipeline itself uses"
    #: MEASURED 2026-10-16 (D-3048): of the corpus stems, most also exist in the reading view and only a minority
    #: of those pairs are byte-identical - the same work under the same name with DIFFERENT bytes. That is the
    #: duplicate hazard this repository actually has, and it is not caused by the names: it is caused by TWO
    #: MATERIALISATIONS of one work. A topic copy would make it a THIRD. The ceiling below is set from the reader's
    #: own live reading (a measurement plus one declared slot), and it is SHRINK-ONLY (D-3023/D-2644).
    drift_ceiling: 727   # MEASURED 2026-10-16 by the reader itself; SHRINK-ONLY (D-3023/D-2644)
    #: SUPERSEDED 2026-10-16 by D-3050 (see `flow` at the end of this block). This key read `library_is_a_view`,
    #: claiming the library was "a reading view of the rest". The BYTES refute it: a view is GENERATED, and the
    #: library md tree is OLDER than the corpus in 727 of 727 same-name pairs (MEASURED by --arrangement plus
    #: mtime), so the library is the ORIGIN and the corpus is the derived tree. The key is RENAMED rather than
    #: left standing: a claim the measurement refutes is a false declaration (C16/D-3030 class).
    library_is_the_origin: "the library is where the works CAME FROM - the epub/pdf the owner downloaded and the md materialised beside them, arranged by the owner's own topic folders; the corpus is the pipeline's DERIVED tree. Neither is an authority over the other, and the same work in both homes with different bytes is COUNTED (--arrangement), never invisible"
    format_is_the_physical_axis: 'the library separates by FORMAT (books/epub, books/pdf, books/md, journals:notes) - format is what decides how a file is read, so it is the one axis a physical layout carries'
    #: SUPERSEDED 2026-10-16 by D-3050: this key read `topic_is_a_derived_view` and claimed the topic was
    #: "already materialised once, in the corpus". MEASURED the same day: the topic is materialised in BOTH
    #: homes and in TWO levels each - the corpus carries DOMAIN/<subtopic>/file.md (939 of its 940 files sit
    #: below the first level) and the library mirrors the same DOMAIN/<subtopic> shape. What stays forbidden is
    #: a THIRD copy: a facet used for QUERYING is derived from the catalogue and printed, never materialised as
    #: another tree (no_topic_copies below still holds).
    topic_is_materialised_in_both_homes: 'MEASURED 2026-10-16: DOMAIN/<subtopic> in the corpus AND in the library. The topic is therefore a real physical axis in two trees, which is exactly why the drift between them is counted (--arrangement) and why a THIRD materialisation is refused'
    no_topic_copies: 'a copied work is two works to every reader that joins by path (BUG-780: 530 rows, one text under two names) and it doubles storage and sync for zero new identity'
    no_links_in_the_library: 'the library lives inside Dropbox (APFS, MEASURED 2026-10-16: /System/Volumes/Data, APFS); an APFS CLONE would share bytes locally and still be uploaded as a second file by the provider, and a symlink is not what the provider syncs - so neither is the mechanism, a GENERATED view is'
    view_rule: 'a view is GENERATED from the bytes home or it is not a view; the generator is declared before any view is materialised (none is declared yet, and that is a declaration rather than a silence)'
    drift_reading: 'python3 scripts/census_source_names.py --arrangement: the same work in two homes with DIFFERENT bytes is drift, counted and printed, never invisible'

  # ── THE PLACEMENT (T-180/D-3049): WHERE A FILE BELONGS, DECLARED ONCE ────────────────────────────────────────
  # The owner asked (2026-10-16): keep books and notes in the right folders, be told when something is unorganised
  # or sitting in the inbox, and be told when a name carries no author and no title. A file cannot be MISPLACED
  # until PLACED is declared: MEASURED on the live library the same day, the TWO declared roots carry TWO different
  # axes (books separates by KIND, journals:notes by DOMAIN) and the sibling folders of their common parent appeared
  # in NO declaration at all. That is a judgement where a declaration belongs (C12), so the declaration is written
  # here and the reading is scripts/census_source_names.py --placement (one line: --brief), which MOVES NOTHING.
  placement:
    authority: D-3049
    reading: 'python3 scripts/census_source_names.py --placement (the full reading) | --brief (ONE line, run by the ladder so an arrival is LOUD without becoming a fault)'
    axes:
      kind: 'the subfolder IS the file kind (books/epub, books/pdf, books/md): format decides how a file is READ, so it is the one axis a physical layout can carry (D-3048)'
      domain: 'the subfolder is one of the pipeline OWN DOMAIN names, read from their one materialisation (the immediate subdirectories of the corpus home), never restated here - a note has no converter, so topic is the only axis it can carry'
    #: THE AXIS HAS A DEPTH, and everything BELOW it is the blind spot this row closes (BUG-865). MEASURED
    #: 2026-10-16: below the declared axis both homes carry the owner's own topic arrangement, in TWO further
    #: levels (books/epub/DOMAIN 6 AI + Computing/ai+engineering+agents/, notes/DOMAIN 2 Design/design-notes/) -
    #: 30 distinct folder names in books and 16 in journals:notes, with 636 files deeper than three levels.
    #: Those names are maintained by a human and owned by NO vocabulary here, so the reading COUNTS them and
    #: prints their number: it never enumerates them as a vocabulary and never moves one. A home whose row does
    #: NOT declare what sits below is reported as UNDECLARED and is LOUD (rc 2) - a silence must never read as a
    #: clean tree (D-3038).
    #: ONE ROW PER DECLARED ROOT, and a root with no row is FATAL (D-3034: a declaration must resolve). The ADMITTED
    #: KINDS are not restated here - they are read from source_library.roots[].kinds, their one home.
    homes:
      books:
        axis: kind
        axis_depth: 1
        subfolder_required: true
        below_the_declared_axis: "the owner's own topic arrangement (DOMAIN/<subtopic>), counted and printed, never enumerated, never read, never moved"
      journals_notes:
        axis: domain
        axis_depth: 1
        subfolder_required: true
        below_the_declared_axis: "the owner's own subtopic folders under each DOMAIN (e.g. design-notes, business-notes), counted and printed, never enumerated, never read, never moved"
    #: AN ARRIVAL PEN IS A QUEUE, NEVER A DEFECT. What would be a defect is the pen being UNDECLARED (a silence) or
    #: a file outliving staleness_days (a queue nobody drains) - so the pen is declared HERE, with a reason, and the
    #: reading counts what is waiting instead of an unorganised pile being argued about.
    pens:
      education_inbox:
        path: '~/Library/CloudStorage/Dropbox/education/inbox'
        staleness_days: 30
        why: 'the owner OWN admission queue. MEASURED 2026-10-16: 12 files / 219 MB, every one a book, none of them in the corpus'
      education_unsorted:
        path: '~/Library/CloudStorage/Dropbox/education/unsorted'
        staleness_days: 365
        why: 'the owner own holding pen. MEASURED 2026-10-16: 1,729 files under 18 topical subfolders, nothing newer than 2026-03. Declared so it reads as a QUEUE WITH A NUMBER instead of an undeclared silence'
    undeclared_is_the_class: 'a folder inside a declared root that the declared axis does not name, or a sibling of the declared roots that is neither a root nor a pen, is reported as OUTSIDE THE DECLARATION - the reading does not call it wrong (the declaration simply does not cover it) and it never WALKS a sibling: walking one would be this reading quietly widening its own domain, which is the very defect it reports'
    refusals:
      no_move: 'this reading never moves, copies, renames or deletes. A placement repair is an owner-lane act with its own plan (T-180), and a mover nobody can audit is the failure mode this repository refuses'
      no_second_policy_home: 'a GUI rule engine may not OWN a placement rule. MEASURED 2026-10-16 on this machine: Hazel.app is installed with three rule sets stored as NSKeyedArchiver data (the shell file command reads "data" and plutil cannot parse it), one of them naming HazelMoveAction on the destinations ~/Downloads/00_INBOX, ~/Downloads/ebook and ~/Downloads/docs - and NONE of those three exists on disk. Rules that are undiffable, unversioned, move files while nobody watches and leave no receipt are the C12 defect with a GUI (BUG-864). Hazel is REFUSED as a decider; the owner existing Downloads rules are RECORDED here rather than adopted'
      no_second_library: 'a second library app may own a READING surface and never the bytes. MEASURED 2026-10-16: the installed Calibre library (61 rows, ONE author, "Ismeretlen") holds this repository OWN governance documents, not the books - so it is not a metadata source the T-176 plan may read (a declared source no eligible row can reach would be a promise, not a measurement, D-3034)'
      no_topic_copy: 'a topic is never a folder of COPIES (D-3048): a copied work is two works to every reader that joins by path'
    new_file_definition: 'REUSED, never restated: config/ingest_identity_gate.yaml#door.new_file_definition (a name the S0.5 metadata cache cannot resolve) - so the pen reading counts what the PIPELINE has never seen, not what a script guesses is new'
  # ── THE FLOW (T-181/D-3050): THE FIVE TRANSITIONS BETWEEN AN ARRIVAL AND A STAMPED WORK ─────────────────
  # The owner asked (2026-10-16): how does a file actually GET organised, how do PDF/EPUB become MD, and how are
  # the library and the corpus kept in step? The answer is a DECLARATION with measurements, not a reassurance.
  # MEASURED the same day: the pipeline never reads the library (config/pipeline_config.yaml#books_dir is the
  # corpus, and 962 of 962 S0.5 cache records carry a source_path inside it); the two trees are TWO
  # MATERIALISATIONS of the same works (830 shared names, 103 byte-identical, 727 DIFFERENT, and the corpus copy
  # is NEWER in 727 of 727); and the ONE script that bridged them matched by FILENAME STEM until today (BUG-865).
  flow:
    authority: D-3050
    reading: "python3 scripts/census_source_names.py --flow (the detail). The same check runs inside --placement, so the ONE ladder line that prints the notify also proves every command below is still on disk (D-3034)"
    transitions:
      arrival:
        where: "the declared pens (source_library.placement.pens)"
        actor: owner
        counter: "python3 scripts/census_source_names.py --brief (ONE line, on every health run)"
        moves: false
        why: "an arrival is a QUEUE with a number: nothing is moved, renamed or converted on arrival, so a drop can never race a run (D-3049)"
      placement:
        where: "the declared homes (source_library.placement.homes: kind for books, domain for journals:notes)"
        actor: owner
        moves: "the owner, by hand or in Finder - NO engine moves a file because of its name"
        why: "a name is evidence, never identity (D-3045): a mover that decides by extension or by substring is a second policy home with no identity key, which is why Hazel is refused as a decider (placement.refusals.no_second_policy_home)"
      admission:
        authority: D-3051
        state: "DECLARED 2026-10-16 (T-181 limb 1) - it stood UNDECLARED until this date"
        was: "MEASURED 2026-10-16 (before this transition existed): pipeline/stage0_convert.py reads the CORPUS (books_dir = knowledge pipeline/books) and NOTHING declared the transition that puts a library file into it, so the pipeline's OWN INPUT PATH was the one step a human did by hand with no counter and no receipt"
        where: "from a declared library kind root (source_library.roots) INTO the corpus home that root declares (roots[].admits_to -> arrangement.corpus_home), carrying the source's own path below its DECLARED AXIS folder (kind for books, domain for journals:notes) - see arrangement.share_rule"
        actor: owner
        moves: "the owner's word, row by row, from the plan this transition names - NO engine admits a file because of its name, exactly as no engine PLACES one (D-3045, D-2898)"
        counter: "python3 scripts/plan_admission.py --brief (ONE line, on every health run, beside the arrival counter)"
        plan: "python3 scripts/plan_admission.py --plan -> writes the plan file (READ-ONLY: it admits nothing). See source_library.admission for the target rule and the CLOSED decision vocabulary"
        refuses: "a root that declares no corpus home, a container the conversion stage cannot read, a file outside its declared kind folder, and a name a defect pattern matches - each COUNTED and printed, never silently skipped (D-3038)"
        owed: "T-183 (the applier limb: a plan-keyed, dry-run-default, crash-safe writer) | T-176 (the rename rides BEFORE the first admit: an admitted name becomes the corpus name AND the door's key) | T-179 (the library md twin's fate). CLOSED 2026-10-17: T-181 limb 2 (a note's home) - declared as a SHARE on the corpus's own domain axis, D-3062"
      conversion:
        command: "python3 pipeline/stage0_convert.py"
        accepts: [.epub, .pdf, .md]   # origin: pipeline/stage0_convert.py::SUPPORTED_EXTENSIONS (D-3051; the admission plan REFUSES a container outside this set and a control in it compares the two homes)
        reads: "every .epub/.pdf/.md under the corpus home, RECURSIVELY (find_books; an .md is 'already converted' and is the only kind the corpus holds today - MEASURED 940 of 940)"
        engines: "pandoc for epub; docling for pdf, falling back to pandoc"
        writes: "the corpus home itself - the SAME tree the S0.5 cache then stamps, so the corpus is both the input and the output of S0"
        re_conversion: "pipeline/batch_convert_epubs.py (D2134, declared in config/silent_repair.yaml) re-converts a LIBRARY epub and overwrites the matching corpus .md in place. Until D-3050 it matched by FILENAME STEM and wrote on a bare run (BUG-865); it now matches through the door's OWN comparison key, refuses an ambiguous key, refuses a work the S0.5 cache already resolves (a RE-INGEST act), and is DRY by default"
        source_roots: "config/pipeline_config.yaml#source_epub_dir and #source_pdf_dir - the library kind roots. They were DECLARED as null until D-3050, so the fallback resolved to a path that does not exist and three declared writers silently converted nothing (MEASURED 2026-10-16)"
      identity:
        command: "python3 pipeline/stage0_5_extract_metadata.py"
        reads: "the file's OWN text (D-3045: a name is evidence, never identity)"
        cache: "knowledge pipeline/checkpoints/book_metadata.jsonl, reused as the door's OWN definition of a new file - its one home is source_library.metadata_cache, never restated"
        boundary: "the cache keys on the door's OWN comparison key, so a byte change under an unchanged name is INVISIBLE to the door. That is why an in-place overwrite of the corpus is a re-ingest act and not a repair (BUG-865)"
    no_sync:
      fact: "THERE IS NO SYNC between the library and the corpus, and there never was one: they are two materialisations of the same works, kept in step only by whoever last ran a conversion"
      measured: "MEASURED 2026-10-16 by --arrangement plus mtime: library books/md 852 stems, corpus 940, 830 shared names, 103 byte-identical, 727 with DIFFERENT bytes, and the corpus copy is NEWER in 727 of 727"
      therefore: "the library is the ORIGIN and the corpus is the DERIVED tree - this SUPERSEDES arrangement.library_is_a_view (D-3048), which the bytes refute"
      a_view_is_generated: "nothing generates the library, and a generated view would carry its generator and the source commit - so calling the library a view would be a claim the measurement refutes (C16)"
      better_solution: "ONE bytes home plus ONE derived tree that carries a receipt. The library md twin is the candidate: retire it (T-179, owner-worded) or declare it the originals archive with its own age budget. What stays refused is a THIRD materialisation (a topic copy) and a bridge that decides by name (BUG-865)"

  # ── T-181 / D-3051: THE ADMISSION — the FIFTH transition gets a name, a counter and a PLAN ───────────────────
  # MEASURED 2026-10-16, before this block existed: the flow had FIVE declared transitions and the middle one — the
  # step that puts a library file INTO the corpus that pipeline/stage0_convert.py reads — was declared NOWHERE. So
  # the pipeline's own INPUT PATH was the one step a human performed by hand, with no counter and no receipt
  # (D-3050/T-181). This block declares that step and gives it a READER that measures what is missing. It
  # authorises NO MOVER: the admission itself remains the owner's word, row by row, from the plan below.
  admission:
    authority: D-3051
    plan_prefix: 'governance/ADMISSION_PLAN_'
    refusal_examples: 5
    reading: "python3 scripts/plan_admission.py (the detail) | --brief (ONE line, for the ladder) | --plan (writes the plan; a bare run writes no file)"
    ladder: "python3 scripts/plan_admission.py --selftest || exit 1 (its 16 controls) and --brief || [ $? -eq 2 ] (the reading: rc 2 is OWNER-OWED, loud and never fatal - BUG-457)"
    #: THE DECLARED UNIT: a FILE, not a work. A plan row is a file the owner can point at, and the distinct KEYS
    #: those files carry are printed beside the counts, because one work may be materialised as several files.
    unit: file
    #: WHAT A PLAN ROW PROPOSES, in one sentence. It is DERIVED from the source's own arrangement, so this reader
    #: decides no TOPIC (D-2898). MEASURED 2026-10-16 over 200 sampled library/corpus pairs: the corpus copy carries
    #: the SAME stem in 199 and the SAME topic folder in only 152 - the two materialisations disagree about the
    #: folder below the axis in 48 of 200, which is exactly why a proposed path is a PROPOSAL the owner may change.
    target_rule: "a plan row proposes corpus_home / (the source file's own path BELOW its declared kind folder), with the suffix the conversion stage writes (.md). A topic is never decided by an engine: the proposed path inherits the source's OWN arrangement and the owner may move a row's folder"
    #: THE CLOSED DECISION VOCABULARY. A class this reader can produce and this block does not carry is FATAL, and a
    #: declared class that reads zero is PRINTED as zero (green by vacancy is visible, BUG-487).
    decisions:
      already_in_the_corpus: 'a file whose DOOR KEY the corpus home already holds: the pipeline has the work and there is nothing to admit'
      seen_by_an_ingest_record: "a file only the S0.5 metadata cache names, because the corpus file now carries a different key (MEASURED 2026-10-16: the corpus itself was renamed under T-130). The pipeline READ the work, so it is SEEN and not a candidate - printed because a second voice saying 'seen' is not the same voice as the corpus saying it"
      admit_candidate: "a file whose key neither the corpus nor an ingest record names, in a container the conversion stage accepts, inside its declared kind folder, under a root that declares a corpus home, carrying a name NO defect pattern matches: THE OWNER'S WORKLIST"
      refused_no_declared_corpus_home: 'its root declares admits_to: null, so NO declaration names a home its works are admitted to: the refusal names the missing declaration instead of inventing a destination (T-181 limb 2)'
      refused_container_no_stage_reads_it: 'a container the conversion stage cannot read (declared kinds such as .mobi/.azw3/.djvu/.docx are OWNED but not convertible): admitting one needs an ENGINE, which is T-180''s misplaced class and not this reader''s act'
      refused_name_repair_first: "a name a declared defect pattern matches (marker/spine/truncation): an admitted file's name becomes the CORPUS NAME and the DOOR KEY, so admitting a defect materialises it into the tree the S0.5 cache then STAMPS. The repair rides FIRST - T-176, the owner's rename plan, whose eligible rows are exactly this class"
      refused_not_in_its_kind_folder: 'the file does not sit under its declared kind folder (the placement axis, axis_depth 1), so the path its corpus twin would take cannot be derived: the misplaced class T-180 owns'
      refused_domain_not_a_corpus_domain: 'the file does not sit under a folder this root declared as its axis, or that folder is not a name the CORPUS already materialises (arrangement.share_rule): admitting it would put a new top-level name in the one corpus home and silently widen the domain vocabulary the pipeline classifies against, so the row is refused and counted instead (D-3062)'

    #: THE APPLIER'S CONTRACT (T-183/D-3068). The plan is a PROPOSAL; this block declares the SECOND document that
    #: turns a proposal into an authorisation, and the ledger that makes a batch readable afterwards. Both are
    #: declared here rather than in the writer, because a prefix in code is a second home (C12).
    #:
    #: A SIGNATURE IS NOT THE PLAN. `ADMISSION_ACCEPTED_<date>.yaml` names ONE plan file and pins its sha256, so a
    #: plan edited after signing no longer matches and the applier refuses (D-3034: only a RESOLUTION grants).
    #: `mode: all` puts every row in scope; `mode: listed` names rows by their `rel` label. A row the signature
    #: names and the plan does not hold is FATAL - an approval that cannot resolve is a wish, not a grant.
    applier:
      authority: D-3068
      command: python3 scripts/apply_admission.py
      reading: 'python3 scripts/apply_admission.py (dry run, the owner cost estimate) | --template (a ready-to-sign acceptance, pinned to the live digest) | --apply (the act) | --limit N (a tranche) | --selftest (its known-answer controls)'
      accept_prefix: 'governance/ADMISSION_ACCEPTED_'
      accept_extension: '.yaml'
      receipt_prefix: 'governance/evidence/ADMISSION_APPLIED_'
      receipt_extension: '.jsonl'
      accept_modes: [all, listed]
      accept_required: [schema_version, plan, plan_sha256, accepted_by, accepted_on, mode]
      #: THE CLOSED STATE VOCABULARY. A state this writer can produce and this list does not carry is FATAL: a
      #: receipt line whose state nobody declared is a state no reader can classify.
      states: [run, would_apply, applied, already_applied, refused, failed, summary]
      refuses:
        a_row_absent_from_the_signed_set: 'the signature is the whole authorisation; the plan is only its subject'
        a_target_that_already_exists: 'unless a receipt accounts for that target with the SAME digest - the honest reading of a rerun, never a licence to overwrite an unexplained file'
        a_source_whose_bytes_changed: 'the plan names a byte count; a file that grew or shrank is not the work that was approved'
        a_name_a_defect_pattern_still_matches: 'an admitted name becomes the CORPUS NAME and the DOOR KEY, so the repair rides first (T-176)'
        a_target_outside_the_corpus_home: 'a row may not write outside the one tree the pipeline reads'
      never:
        - 'deletes anything (R-D410); the only unlink is this writer own half-written temp file'
        - 'decides a topic (D-2898) or a name (T-176): both arrive from the plan'
        - 'uses --force on S0: force DISCARDS the stage0 checkpoint (existing = {}), which would erase every prior conversion record'


