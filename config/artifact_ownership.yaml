      the splice moves those cells and nothing else, that the registry re-derives canonical everywhere, and
      that the receipt is re-baselined in the same sitting. A rule enforced by nobody is why the exception is
      a declared route with its own controls and mutation teeth, not a writer's willingness. D-2655
