- id: CONV-015
  domain: computational art
  discipline: generative design
  source_books:
  - The Nature of Code — Daniel Shiffman
  - Generative Design — Benedikt Gross
  - A New Kind of Science — Stephen Wolfram
  cluster_segments:
  - source_book: The Nature of Code — Daniel Shiffman
    text: 'Complex behavior in natural systems often arises from simple rules repeated over

      many agents. Flocking emerges from three local rules: alignment, cohesion, and

      separation. No bird knows the flock''s global shape — it emerges from local

      interactions. This is the heart of generative art: design the rules, not the

      outcome.

      '
  - source_book: Generative Design — Benedikt Gross
    text: 'Generative design is not about coding a specific image but about coding a system

      that produces images. The designer''s role shifts from drawing the artifact to

      designing the rules and parameters that generate the artifact. Small rule changes

      produce vastly different outputs — the design space is explored computationally.

      '
  - source_book: A New Kind of Science — Stephen Wolfram
    text: 'Simple programs can produce behavior of great complexity. Wolfram''s cellular

      automata experiments show that a one-dimensional rule with three neighbors can

      produce patterns as complex as anything in nature. This suggests that complexity

      is not imported from outside but generated from within by simple rules.

      '
  is_convergent: true
  should_extract: true
  expected_fb:
    is_summary: false
    route: FB
    name: Emergent Complexity from Simple Rules
    definition: 'Complex, organic-looking systems and artifacts can be generated from simple local

      rules applied repeatedly. The creator controls the rules and parameters, not the

      final form; the form emerges from the interactions. This is the foundational

      principle of generative and computational art.

      '
    mechanism: 'Iterated local rules produce global patterns because each application of the rule

      propagates information through the system. In flocking, three local rules

      (alignment, cohesion, separation) produce coherent global motion; in cellular

      automata, simple update rules produce complex spatiotemporal patterns. Emergence

      requires iteration — one application is trivial, thousands produce complexity.

      '
    consequence: 'Designers can create systems whose output space is vastly larger than what they

      could specify by hand. The aesthetic value moves from the artifact to the rule set;

      ''interestingness'' becomes a property of the generative system, not individual

      outputs.

      '
    boundary: 'Applies when the system is iterated enough times for emergence to manifest and the

      rules are local (interactions are spatially or topologically nearby). Fails when:

      (1) rule application is too sparse to propagate; (2) rules are globally coupled

      (everything affects everything — no local structure); (3) the parameter space is

      not explored systematically.

      '
    evidence_passages:
    - 'Flocking emerges from three local rules: alignment, cohesion, and separation'
    - The designer's role shifts from drawing the artifact to designing the rules
    - Simple programs can produce behavior of great complexity
    depth: cross-domain
    evidence: cited
    jargon:
    - emergence
    - generative system
    - cellular automata
    - local rules
    keywords:
    - generative art
    - emergence
    - complexity
    - rules
    application: Generative art, procedural content generation, simulation, data art
    elaboration: 'The same principle underlies Conway''s Game of Life, reaction-diffusion systems,

