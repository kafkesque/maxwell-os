- id: d1e6a89471b3fe683a4ab6e4b51065140d86ed24e1a8368a2ce3ac97a2b0913e
  input_fb:
    name: Nasal Spray Effect
    definition: Applying the same solution repeatedly to a problem without addressing
      the root cause leads to diminishing returns and eventual failure. The principle
      describes a pattern where escalation of an ineffective approach does not improve
      outcomes but instead creates increasingly problematic consequences.
    mechanism: This is an empirical pattern describing how repeated application of
      the same ineffective solution creates a feedback loop that amplifies the original
      problem rather than solving it. The pattern shows that when a solution is misapplied
      or misidentified as the correct approach, escalating its use produces no improvement
      and often worsens the situation. The effect is observable across systems where
      the same intervention is applied despite evidence of its ineffectiveness.
    boundary: Applies when a solution is repeatedly applied to a problem without identifying
      or correcting the root cause. Fails when the solution is properly targeted to
      address the actual system dynamics or when the problem is genuinely solved through
      iterative application of the correct approach.
  silver_depth: cross-domain
  votes:
