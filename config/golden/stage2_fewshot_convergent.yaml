    name: Bimodal Risk Allocation
    definition: 'When facing uncertainty about which option is best, allocate resources bimodally: invest a large, safe base
      in the proven option while reserving a small speculative portion to explore alternatives. This avoids the ''medium risk''
      middle ground that captures the downsides of both exploration and exploitation without the upside of either.'
    mechanism: 'The bimodal split solves the explore-exploit dilemma by removing the need for a transition point. Instead
      of deciding WHEN to switch from exploration to exploitation, the strategy runs both simultaneously: the safe base exploits
      what''s known, the speculative bet explores what''s potentially better. The safe base ensures survival (downside protection),
      while the speculative portion captures convex payoffs (unlimited upside, limited downside). This is structurally different
      from ''balanced diversification'' which averages returns across correlated risks.'
    boundary: 'Applies when: (1) the payoff distribution has positive skew (rare large wins); (2) survival depends on avoiding
      catastrophic loss; (3) the time horizon is uncertain. Fails when: (1) all options have similar risk-return profiles;
      (2) the safe option has hidden risks that compound; (3) the speculative portion is large enough that its failure threatens
      the safe base.'
    consequence: A bimodal strategy outperforms both pure exploitation (which misses breakthroughs) and pure exploration (which
      risks ruin) in environments with asymmetric payoffs. The 90/10 split is a heuristic — the optimal ratio depends on payoff
