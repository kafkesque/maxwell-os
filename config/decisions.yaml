    continuous batching, speculative decoding, prompt compression/LLMLingua, distillation,
    constrained decoding). Verdict: batch CRIBS (D2265) is the reliable/viable/feasible
    choice — amortizes GPT-OSS reasoning across 4 FBs (~19.4s/FB vs ~61s/FB, ~3x).
    Fixed the wiring so _pre_classified batch results are consumed (elif cluster_id
