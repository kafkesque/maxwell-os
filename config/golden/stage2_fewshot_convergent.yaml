- id: CONV-022
  domain: computer graphics
  discipline: computational geometry
  source_books:
  - "Computer Graphics: Principles and Practice — Foley, van Dam, Feiner & Hughes"
  - SVG Essentials — J. David Eisenberg
  cluster_segments:
  - source_book: "Computer Graphics: Principles and Practice — Foley, van Dam, Feiner & Hughes"
    text: 'Bezier curves are defined by control points: two endpoints that the curve passes
      through, and intermediate anchor points that pull the curve toward them without
      being touched. The curve is computed as a weighted blend of these control points
      using Bernstein polynomials. Moving an anchor point changes the curve''s shape
      in a predictable way — pulling it further from the line between endpoints increases
      the curve''s deviation. This is the fundamental mechanism underlying all vector
      drawing tools, font outlines, and motion paths.

      '
  - source_book: SVG Essentials — J. David Eisenberg
    text: 'In SVG, the C (cubic Bezier) command takes three coordinate pairs: two control
      points and one endpoint. The curve starts at the current point, is attracted toward
      the two control points, and ends at the specified endpoint. Mastering Bezier
      curves means understanding how the position of each control point affects the
      resulting curve — control points closer to the endpoint create sharper turns,
      while control points further away create gentler arcs. The ''pen tool'' in every
      vector graphics application is fundamentally a Bezier curve editor.

      '
  is_convergent: true
  should_extract: true
  expected_fb:
    is_summary: false
    route: FB
    name: Anchor Point Control
    definition: 'Bezier curves are defined by anchor points (control points) that attract
      the curve path toward them without being touched. The curve is computed as a
      weighted parametric blend of these control points. Moving anchor points changes
      the curve''s shape in predictable ways — closer control points create sharper
      directional changes, while more distant control points produce gentler arcs.

      '
    mechanism: 'Anchor points control curve shape through weighted blending (Bernstein
      polynomials for Bezier curves). Each control point exerts a gravitational pull
      on the curve proportional to its distance from the path — the closer a control
      point is to the line between endpoints, the less it deflects the curve; the
      further it is, the more it pulls the curve toward itself. Because the blending
      functions are smooth polynomials, the resulting curve is always continuous and
      differentiable, ensuring visually smooth shapes.

      '
    boundary: 'Applies specifically to parametric curve representations (Bezier curves,
      B-splines, NURBS) in vector graphics and CAD systems. Fails when applied to
      raster graphics (pixel-based), implicit curve representations, or procedural
      generation methods that do not use control-point-based parametric blending.

      '
    consequence: 'Graphic designers and CAD operators can precisely control curve shapes
      by strategically placing anchor points. The ability to predict how a control
      point''s position affects the resulting curve enables precise shape editing
      without trial and error. This principle underlies all pen tools, font design
      software, and motion path editors.

      '
    application: null
    elaboration: ''
    extraction_type: causal_mechanism
    content_type: principle
  rationale: "CONVERGENT POSITIVE — SPECIALIZED SUB-FIELD PRINCIPLE (D2221). Two independent
    computer graphics sources converge on the same mechanism: Bernstein polynomial
    blending of control points. Depth is specialized — this is tool-bound (vector
    graphics software) and sub-field specific (computational geometry within computer
    graphics). A genuine specialized positive is essential for teaching S2 that valid
    principles can exist at narrow scope. Application is null because this is a
    descriptive technical mechanism rather than a prescriptive technique."

