- id: D277
  category: ONTOLOGY
  state: RESOLVED
  date: '2026-09-20'
  title: Three clarifications — R5 is repair-not-demote; raw and canonical are both post-hoc model stamps; the error rate is a meter, not an oracle (D-277)
  source: governance/anchor1_frozen_20260920.md
  verification: 'user-forced clarification 2026-09-20. (1) The zero-agreement DISC slots measure PIPELINE failure, not SLOT badness — two distinct causes; the initial DEMOTE vote assumed slot badness without evidence and was withdrawn. (2) The corpus has ZERO human-derived labels: both the raw string and the canonical slot are post-hoc model stamps from the 2-month-old corrupt run, so neither can be "recovered" into truth — the only path is re-derive from source text under a human-κ-bounded procedure. (3) The per-class error rate is a population statistic (a meter) that calibrates confidence and triggers abstention; it carries zero per-object information and must never flip a label.'
  description: 'R5-as-repair: every discipline slot gets a mandatory definition + include + exclude (OntoClean); measure per-slot κ against ANCHOR-1; BOUND weak slots (human review on write); MERGE only definitionally-inseparable slots into their parent group; never DEMOTE as a first move. Raw and canonical labels are BOTH demoted to provenance (G9) and never trusted for retrieval — re-derive from source segments via R1 closed menu + R2 definition NLI, stamped menu_hash + *_source. Accuracy is reported as agreement-with-human-κ, never "100%"; the classifier abstains (none) below a per-class confidence threshold set from measured error.'
