- id: D-391
  category: VERIFICATION/GOVERNANCE
  state: RESOLVED
  title: "The agreement floor has its first consumer, and the depth panel does NOT clear it"
  context: >
    config/agreement_floor.yaml was ratified with no consumer (BUG-462): a floor nothing reads is a comment. The
    depth axis was the next strategic step (D-384 freeze), so the consumer was built against it:
    scripts/depth_pass_agreement.py (Krippendorff alpha, nominal + ordinal, missing-cell capable, exclusions read
    from the artifact that OWNS each declaration). MEASURED on the 144 independent units (148 measured rows minus
    3 CARRY-FORWARD (R070/R080/R130) minus 1 declared axis-exempt (R140); R003/R146 declared absent):
    alpha nominal 0.4004 (band: below_reporting), alpha ordinal 0.5701. Reported floor 0.667 / operative 0.800.
  decision: >
    The depth axis may NOT be frozen on this instrument. 0.4004 is below the reporting floor, so by the floor's own
    band vocabulary it is "not a measurement of agreement - report the disagreement, decide nothing". The freeze
    (D-384) is therefore blocked by MEASUREMENT, not by process. Consequence: D274f (the single-coder 30-row
    test-retest ceiling) is now MANDATORY evidence, not a formality, and a frontier second coder is required before
    any depth head (D2577) may be trained or admitted. Verified: perfect agreement returns exactly 1.0 (nominal and
    ordinal) and a 3-unit/2-rater case reproduces the hand-computed Do=De=1/3, alpha=0.
  authority: "assistant measurement + senior-RAG recommendation; the freeze decision stays the owner's (C22)"
- id: D-392
  category: VERIFICATION/PROCESS
  state: RESOLVED
  title: "A test may not write outside a tmp dir - enforced, not asserted"
  context: >
    BUG-473: a pytest run renamed the live 1.03 GB t11 checkpoint. BUG-471 was the same defect (S5_LOCK_PATH is
    bound at import, so the first S5 test left a live lock in the production tree and the second died on it).
  decision: >
    tests/conftest.py snapshots every production stage artifact before the session and FAILS the session if an
    UNDECLARED path is created, deleted or modified. A test-owned run id is declared in config/test_isolation.yaml
    (globs), is tolerated, and is still REPORTED - a tolerated write must never become invisible (BUG-462 class).
    The rule is executable: the guard found the violation and the 16 tolerated smoke artifacts on its first run.
  authority: "assistant + senior-RAG (both: a standing rule that is not executed is not a control)"
- id: D-393
  category: GOVERNANCE/VERIFICATION
  state: RESOLVED
  title: "Every rate reports its denominator (148 measured of 150 declared)"
  context: >
    BUG-466: the ANCHOR-4 sheet declares rows: 150 while the owner workbook carries 148. R003/R146 are absent with
    no declared exclusion rule, so every rate had an undeclared denominator.
  decision: >
    config/cohort_declaration.yaml declares the cohort: declared_rows 150, measured 148, absent [R003, R146] with a
    reason and a forbidden-action list (no row added to the 150, no cell imputed). The agreement consumer asserts the
    arithmetic closes (measured + absent == declared) and PRINTS both denominators. D-387 ('omission is not
