- id: D282
  category: ONTOLOGY
  state: RESOLVED
  date: '2026-09-20'
  title: Depth-vs-role conflation fix — "3+ domains" is the universal-depth threshold, not the principle-role discriminator (D-282)
  source: config/content_types.yaml
  verification: 'user-forced correction 2026-09-20. The principle/quarantine/process_template boundary drafted in D-278 (and the D-275b principle description + decision-procedure step 5) imported "a filter across 3+ domains" as the principle-role test. That conflates the DEPTH axis (universal = >=3 domains) with the CONTENT-TYPE ROLE axis (principle). A domain-depth (1-2 domains) or specialized-depth (1 narrow domain) principle is still a principle — schemas.py:442 confirms "depth is NOT domain count". Fix: the principle role is "a self-contained transferable rule you KNOW/APPLY at ANY scope"; scope is the separate depth axis and never demotes a principle into quarantine.'
  description: 'Removed the domain-count criterion from (1) config/r5_slot_repair.yaml quarantine definition/include/exclude + process_template exclude, and (2) config/content_types.yaml principle description + content_type_decision_procedure step 5 + the D-2587 single-step rules. depth_test_domains_threshold: 3 remains but is now unambiguously a DEPTH-axis (scope) threshold. The closed menu was re-rendered (new menu_hash e8a8b546...) because the principle description is embedded in the menu. Also fixed a minor threshold reuse in scripts/definition_nli_verify.py (contra-dominance now uses its own constant, not the S5 entail-pass threshold).'
  files:
  - config/r5_slot_repair.yaml
  - config/content_types.yaml
  - config/closed_menu_v5.json
  - config/closed_menu_v5.sha256
