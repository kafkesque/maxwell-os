  input_fb:
    name: Emotional Design Through Psychological Heuristics
    definition: Design that considers emotional impact and psychological shortcuts
      enables more effective user experiences by aligning with how people naturally
      process information and make decisions. This principle recognizes that users
      often rely on mental shortcuts and emotional responses rather than logical analysis
      when interacting with products.
    mechanism: This is a descriptive model of how emotional and cognitive factors
      interplay in design. The principle describes the structure and relationship
      between emotional design elements (pleasure, joy, aesthetics) and psychological
      decision-making patterns (heuristics, satisficing). It categorizes design elements
      as either emotional (aesthetic, desirability) or cognitive (heuristics, mental
      shortcuts) and shows how they work together in user experience.
    boundary: Applies when design must address both emotional and cognitive aspects
      of user behavior. Fails when design focuses exclusively on one dimension (purely
      logical or purely emotional) without considering how they interact in real user
      contexts.
