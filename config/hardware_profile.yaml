# config/hardware_profile.yaml — THE DECLARATION of the personal-calibration feature (D-3178).
#
# WHAT THIS IS FOR. Whoever runs Maxwell OS should not have to repeat the search that produced
# `governance/SPECULATIVE_DECODING_M1_20261027.md`. On a new machine the OS must be able to say, in one command:
#   "this is your hardware, this is your measured ceiling, THESE are the models that fit, and this is which one
#    gets which role — with the receipt that decided it."
#
# THE THREE LAYERS (and why they are separate — each fails differently, so each is reported differently):
#   1. DETECT  — deterministic facts (chip, memory, engine ceiling, engine version). Never a claim.
#   2. PREDICT — a roofline from a MEASURED streaming bandwidth. Reported as PREDICTED and never allowed to
#                assign a role on its own (`allow_predicted_assignment: false`): a prediction is a pruning tool,
#                not a reading (D-3036).
#   3. VERIFY  — a MEASURED receipt (cold prefill + real decode + the role's accuracy gate). Only a receipt may
#                assign a role. Receipts are keyed to the hardware fingerprint AND the engine version, because a
#                reading taken on 0.7.3.dev2 is not a reading of 0.7.3rc1 (BUG-1033's instrument row).
#
# C12: no value used by scripts/hardware_calibrate.py is written in that file. Everything below is a value.

version: 1

# ── layer 3 wiring: where readings and gates are read from ────────────────────────────────────────────────
receipts: governance/calibration_receipts.jsonl   # append-only; one row per measured run

# ── THE GATES a role may name, and the receipt that RESOLVES each one ─────────────────────────────────────
# A role's `require_gate` is a GATE ID, and a gate id must resolve to exactly one artifact. Before this map a
# single `gate_bench:` path was keyed by MODEL alone, so the moment a second gate existed one gate's PASS could
# satisfy another role's gate - a row that does not say which gate it resolved (BUG-1063 limb 1).
# `row_gate_default` is the declared identity of rows written BEFORE rows carried `gate:`: a declaration, never
# an inference from the filename.
gates:
  r5_review:
    receipt: governance/r5_review_gate_bench.jsonl
    row_gate_default: r5_review
    suite: reviewing_verdict   # the harness suite that produces this gate's evidence
  plan_quality:
    receipt: governance/plan_quality_gate_bench.jsonl
    row_gate_default: plan_quality
    suite: plan_quality
out: config/model_roles.yaml                      # the resolver's output (generated, never hand-edited)

# ── layer 1: what to read, and how to name what was read ──────────────────────────────────────────────────
detect:
  sysctl_keys:
    chip: machdep.cpu.brand_string
    ram_bytes: hw.memsize
    perf_cores: hw.perflevel0.physicalcpu
    wired_limit_mb: iogpu.wired_limit_mb
    bf16_native: hw.optional.arm.FEAT_BF16
  paths:
    app_plist: /Applications/oMLX.app/Contents/Info.plist
    app_version_key: CFBundleShortVersionString
    models_root: ~/.omlx/models
    server_log: ~/.omlx/logs/server.log
  engine: config/engine.yaml        # host/port have ONE home already; this file does not repeat them
  health_path: /health

# ── layer 2: the roofline. MEASURED bandwidth, not a spec sheet ───────────────────────────────────────────
predict:
  bandwidth_probe:
    buffer_gb: 2                    # 2 GiB float32 array; large enough to leave L2, small enough to be cheap
    repeats: 5
    kind: elementwise               # `src + 1.0` is materialised: a copy view would measure nothing
    # A bandwidth reading above this is not a fast machine, it is a broken probe (MEASURED 2026-10-27: the first
    # version of this probe printed 5,149,844 GB/s because `mx.array(src)` does not materialise a copy).
    max_plausible_gbs: 1500
  # decode is weight-read bound on this chip (MEASURED: 7.58 t/s at 157 tokens vs 7.54 at 1850 — FLAT in
  # context), so the ceiling is bandwidth / bytes_read_per_token, times the efficiency this device actually
  # reaches. 0.30 is the CALIBRATED anchor from this host: 27B 4-bit = 15.4 GB, copy bandwidth ~400 GB/s,
  # predicted ceiling 26 t/s, MEASURED 7.99 t/s => 0.31.
  decode_efficiency: 0.30
  # MoE rows may declare a smaller traffic footprint than the file size. It is a CLAIM unless the row's own
  # receipt says otherwise, so the default is the honest dense assumption.
  default_bytes_read_fraction: 1.0

# ── memory gates: a model must FIT before it may be ranked ────────────────────────────────────────────────
memory:
  # the engine publishes its own ceiling (`final_ceiling` in /health); this fraction is what a model may claim
  max_resident_fraction: 0.80
  # ── THE KV RESERVE (BUG-1055 limb 4, answered 2026-10-27) ─────────────────────────────────────────────────
  # MEASURED, and it retires the model this field used to assume: this engine PAGES its KV cache - a RAM "hot tier"
  # plus an SSD tier (`~/.omlx/ssd_cache`, 103 GB observed) - so the working set is bounded by the ENGINE'S OWN HOT
  # CACHE BUDGET, not by model geometry. Four independent readings of the same model (governance/kv_working_set.jsonl)
  # put the RETAINED KV at 0.68 GiB at 8,236 prompt tokens and 0.83 GiB at 32,813 - a 4x context increase buying
  # 0.15 GiB - which is a CAP, not a slope. A per-token model would have predicted 2.0 GiB at 32k and 8 GiB at 131k;
  # the architecture says otherwise, so the reserve is DERIVED FROM THE ENGINE'S DECLARED SETTING through the
  # pointer below, never from a per-token arithmetic that this engine does not obey.
  # The pointer is WALKED, segment by segment, and every segment must RESOLVE (D-3034): `engine` is the file
  # alias (config/engine.yaml), `settings` is that block's path to the engine's own settings document, and the
  # remaining segments are keys INSIDE that document. The nesting is declared because it is real: `hot_cache_max_size`
  # is NOT a top-level key — it lives under `cache`, and a pointer naming a key that does not exist is a declaration
  # with no referent. MEASURED 2026-10-27: a first draft of this pointer omitted `cache`, which would have fallen
  # back to the 3.0 GiB fallback while a comment claimed derivation (BUG-1071).
  kv_headroom_source: engine.settings.cache.hot_cache_max_size   # POINTER: walked, never pattern-matched
  kv_headroom_gb: 3.0        # FALLBACK ONLY: used when that setting cannot be read, and the report says which one ran
  # null ON PURPOSE: the reserve is not sized against a context, so there is no context it covers. The report names
  # the roles that declare a context and says the reserve is a BUDGET, not a per-token model (D-3196).
  kv_headroom_ctx: null

  # ── THE PROBE THAT REPLACES THAT RESERVE WITH A READING (BUG-1055 limb 4) ────────────────────────────────
  # `scripts/kv_working_set.py` takes ONE point at a time: it unloads the model, reads resident, sends a 1-token
  # prompt (the LOAD receipt), reads resident again, then sends an N-token COLD prompt and reads resident at once.
  # KV(N) = resident(after N) − resident(after load). Each point is INDEPENDENT because the engine's prefix cache
  # would otherwise add one point's KV to the next and invent a slope. Sizes ascend; 65536 is the largest point
  # that is still affordable on this host (MEASURED prefill 52.3 tok/s on this model = ~21 min for that one call),
  # so the reading at the declared 131072 is an EXTRAPOLATION and says so.
  # ⚠ THE RUN LANDED AND IT RETIRED THE PLAN THAT WAS WRITTEN HERE: the note used to promise that this probe would
  # replace the reserve with a measured SLOPE. It measured a CAP instead (0.14 GiB at 8,236 tokens, 0.29 GiB at
  # 32,813 - a 4x context increase buying 0.15 GiB), so the reserve is derived from the engine's own hot-cache
  # BUDGET, and `kv_headroom_ctx` stays null because there is no context the reserve is sized against. The promise
  # is not deleted, it is RECORDED AS WRONG (D-3038): a stale promise in a comment is how a later reader rebuilds
  # a model the measurement already refuted.
  kv_probe:
    model: Qwen3.8-27B-MTP4            # the `plan` role's model: the role whose 131072 is currently unmetered
    sizes: [32768, 65536]
    timeout_s: 3600                    # per call: the largest point is ~21 min of prefill at the measured rate
    poll_s: 2                          # residency is sampled this often WHILE a prompt prefills: the KV of a
                                       # FINISHED request is released before the next status read, so a post-hoc
                                       # delta measured 0 GiB at 8k tokens (MEASURED 2026-10-27)
    settle_timeout_s: 240              # how long the engine is given to AGREE a load/unload finished (MEASURED:
                                       # the unload route is asynchronous, so a point taken without this race
                                       # produced a NEGATIVE delta and then HTTP 409 - BUG-1067)
    max_wall_s: 5400                   # the whole run; a point past this is NOT taken and the receipt says so
    receipt: governance/kv_working_set.jsonl
    extrapolate_to: [32768, 131072]

  # ── THE CEILING IS A READING, NOT A PROPERTY (BUG-1060) ─────────────────────────────────────────────────
  # `final_ceiling` is computed against AVAILABLE memory, so it MOVES as models load: MEASURED on this host
  # 2026-10-27 between 49.2 and 61.3 GiB within one hour (52,836,686,428 -> 65,794,438,328 B), and the earlier
  # readings 56.1/57.5/58.8/60.1 GiB are the same figure on other minutes. A point reading printed as a property
  # made "43.7 GiB curated into 40.4 usable" look like a standing fact when neither number was stable. So every
  # print carries the clock, a SECOND sample taken inside the same call, and the range observed over the last N
  # readings kept in the receipt below.
  ceiling_readings:
    receipt: governance/ceiling_readings.jsonl
    second_sample_gap_s: 2       # a second read in the same call: one run can show the figure moving
    report_window_n: 24          # the quoted range covers the last N readings, and N is printed with it

  # below this the machine cannot host a competent 4-bit reviewer at all — a named floor, not a surprise
  min_viable_model_gb: 4.0
  # used ONLY when the engine cannot be reached: physical RAM minus this reserve is the fallback budget
  fallback_reserve_gb: 8.0

# a receipt is a reading only if it generated enough tokens to be a sample (D-3102 / BUG-1042)
receipts_min_decode_tokens: 24
# a candidate's rate must be the median of at least this many readings before it may win a role: an MTP model's
# rate is CONTENT-dependent (draft acceptance varies with the text), MEASURED 12.34 vs 16.98 t/s on one checkpoint
min_readings_per_candidate: 3

# ── roles: the ontology the OS actually routes on ─────────────────────────────────────────────────────────
# `objective` is the declared ranking key. `require_gate` names a gate artifact that MUST pass (fail-closed).
# `min_ctx` is a hard requirement, not a preference (a reviewer reading a 4k script needs the window).
# ELIGIBILITY IS DECLARED PER CANDIDATE (`roles:` on each row below), not inferred from speed. Ranking by speed
# alone put a 2B tool-driver in the brain seat on the first run of this resolver — the slop this file exists to
# prevent. A candidate may only take a role it DECLARES, and a role that names a gate may only be filled by a
# PASSING gate. `status` in the output is QUALIFIED (gate-backed) or PROVISIONAL (measured, no role gate exists yet).
roles:
  # `ungated_accepted` is MANDATORY wherever `require_gate` is null (D-3189 limb c): a bare null read as "the
  # fastest model wins" and looked identical to a deliberate choice. Every entry states WHAT STANDS IN for the
  # missing gate and is labelled ACCEPTED-NOT-MEASURED; the resolver reports a bare null as a fault.
  brain:
    objective: decode_tps
    require_gate: null
    min_ctx: 32768
    ungated_accepted:
      date: 2026-10-27
      status: ACCEPTED-NOT-MEASURED
      reason: >-
        no generation-quality fixture exists on this host; what stands in for it is downstream verification -
        every extracted claim is NLI-checked (stage5, DeBERTa, fail-closed) and anything written is R5-reviewed by
        a different model family. The fixture that would replace this acceptance is a grounded-generation set
        graded by the production NLI path, not by another model's opinion.
  review:
    objective: seconds_per_item
    require_gate: r5_review
    min_ctx: 32768
  code:
    objective: decode_tps
    require_gate: null
    min_ctx: 32768
    ungated_accepted:
      date: 2026-10-27
      status: ACCEPTED-NOT-MEASURED
      reason: >-
        the substitute is deterministic and already enforced: generated files are compile-checked and lint-checked
        by the r5_review_gate layers and then reviewed by a model of a different family, so a broken generator
        cannot reach a commit. What is NOT measured is code QUALITY beyond correctness - no fixture ranks two
        passing generators, and none is claimed.
  plan:
    objective: decode_tps
    require_gate: plan_quality
    min_ctx: 131072
  analyze:
    objective: prefill_tps
    require_gate: plan_quality
    min_ctx: 131072
  classify:
    objective: decode_tps
    require_gate: null
    min_ctx: 8192
    ungated_accepted:
      date: 2026-10-27
      status: ACCEPTED-NOT-MEASURED
      reason: >-
        classification is checked downstream (config/eval_integrity.yaml floors and the label-distribution gates on
        the S4 output) rather than by a per-model fixture; no instrument yet isolates a model's labels from the
        pipeline's. Accepted so the absence is visible, not silent.

# ── the candidate register: what MAY be considered, and the honest footprint of each ──────────────────────
# `bytes_read_fraction` < 1.0 only for MoE rows, and the reason is recorded with the row (D-3038).
candidates:
- model: Qwen3.8-27B-MTP4
  family: qwen
  kind: dense
  moe_active_fraction: 1.0
  why: 27B hybrid (3 linear_attention + 1 full_attention per 4 layers) with the published MTP head attached; MEASURED 1.54x decode over the same checkpoint without it (D-3177)
  roles:
  - brain
  - plan
  - analyze
  min_ctx:
    brain: 32768
    review: 32768
    code: 32768
    plan: 131072
    analyze: 131072
    classify: 8192
- model: Qwen3.8-27B-MLX-4bit
  family: qwen
  kind: dense
  moe_active_fraction: 1.0
  why: the same checkpoint WITHOUT mtp.* weights; kept as the control, not as a production brain
  roles: []
  min_ctx:
    brain: 32768
    review: 32768
    code: 32768
    plan: 131072
    analyze: 131072
    classify: 8192
- model: gpt-oss-20b-MXFP4-Q8
  family: gpt-oss
  kind: moe
  moe_active_fraction: 0.3
  why: MoE ~3.6B active of 20.9B; the only model that has PASSED the R5 verdict gate (false_approve 0.0)
  roles:
  - brain
  - review
  - analyze
  min_ctx:
    brain: 32768
    review: 32768
    code: 32768
    plan: 131072
    analyze: 131072
    classify: 8192
- model: Qwen3-Coder-30B-A3B-Instruct-MLX-4bit
  family: qwen
  kind: moe
  moe_active_fraction: 0.1
  why: 30B total / 3B active; the code generator; SLOW per loop turn (MEASURED 79.9 s for 3 calls) but correct
  roles:
  - code
  min_ctx:
    brain: 32768
    review: 32768
    code: 32768
    plan: 131072
    analyze: 131072
    classify: 8192
- model: Ornith-1.5-35B-A3B-REAP-19B
  family: ornith
  kind: moe
  moe_active_fraction: 0.1
  why: REAP-pruned 35B-A3B at 19B resident; long context
  roles:
  - analyze
  - plan
  min_ctx:
    brain: 32768
    review: 32768
    code: 32768
    plan: 131072
    analyze: 131072
    classify: 8192
- model: Ornith-1.5-9B-MLX-8bit
  family: ornith
  kind: dense
  moe_active_fraction: 1.0
  why: 9B 8-bit; the fast loop driver (MEASURED 11.5 s for 3 calls)
  roles:
  - code
  min_ctx:
    brain: 32768
    review: 32768
    code: 32768
    plan: 131072
    analyze: 131072
    classify: 8192
- model: MiniCPM5-2B-MLX
  family: minicpm
  kind: dense
  moe_active_fraction: 1.0
  why: 2B; fastest completed tool loop on this host (2.1 s for 3 calls)
  roles:
  - classify
  min_ctx:
    brain: 32768
    review: 32768
    code: 32768
    plan: 131072
    analyze: 131072
    classify: 8192
- model: gemma-4-E4B-it-MLX-4bit
  family: gemma
  kind: dense
  moe_active_fraction: 1.0
  why: >-
    REFUSED by the r5_review gate (accuracy 0.7083, false_approve 0.125 against a 0.10 ceiling) and KEPT for four
    named lanes it still holds, none of which is reviewer-of-record: (1) the declared RETRY model
    (config/engine.yaml#fanout.guards.fallback_model), so a failed call has a different-family second route;
    (2) the S4 depth judge (pipeline/disagreement_sample.py, JUDGE_MODEL = S4_DEPTH_MODEL) and the fan-out's
    default reviewer model; (3) the cross-family verifier when the AUTHOR is gpt-oss/qwen - it is the only
    non-gpt-oss, non-qwen model with any reviewing_verdict history at all (48 rows; Ornith and Phi-4 have none);
    (4) the fast tier (MEASURED 0.48 s, 7.12 GB resident, the smallest resident reviewer on the host). It holds
    164 of the 178 R5 verdicts ever recorded, so deleting it would delete the review history's author, not a
    redundant copy. What is REFUSED is narrower and is the reason the register keeps it visible: it may not be
    the VERDICT OF RECORD for a review, because it approves one item in eight that should be refused.
  roles:
  - review
  min_ctx:
    brain: 32768
    review: 32768
    code: 32768
    plan: 131072
    analyze: 131072
    classify: 8192
- model: Phi-4-mini-instruct-8bit
  family: phi
  kind: dense
  moe_active_fraction: 1.0
  why: >-
    0 tool calls in 3 turns (BUG-053 shape, MEASURED), so never a loop driver; it is KEPT for the two lanes it
    wins outright: the highest MEASURED prefill on this host (343.5 tok/s at 2,608 prompt tokens) and the
    declared CONTROL model (config/agent_context.yaml), i.e. the model a prompt experiment must be re-run on so a
    gain cannot be a property of one model. 3.8 GB is the cheapest lane in the portfolio.
  roles:
  - classify
  min_ctx:
    brain: 32768
    review: 32768
    code: 32768
    plan: 131072
    analyze: 131072
    classify: 8192
- model: lmstudio-community--gemma-4-12B-it-MLX-4bit
  # THE ID WE CALL and THE REPO WE OWN BYTES FROM are two different facts, and a register that carries only the
  # first cannot declare the second (D-3034: a declaration must RESOLVE). `model` is the engine's id - the string a
  # request must carry - while `source_repo_id` is the hub repo whose bytes they are, which is the form
  # `pipeline/model_store_census.py` resolves by value. Without this field the census classified 6,773.4 MB as
  # ORPHAN while the register declared the model, and both statements were true of their own question (BUG-1069).
  source_repo_id: lmstudio-community/gemma-4-12B-it-MLX-4bit
  family: gemma
  kind: dense
  moe_active_fraction: 1.0
  why: >-
    THE OPEN REVIEWER-QUANT TEST, and the reason this row exists is the census: 6,773.4 MB of its bytes sat in
    ORPHAN because the only home that ever named it was PROSE in the research register, and a sentence that
    MENTIONS a model declares nothing (D-3034/BUG-840). MEASURED 2026-10-27 it PASSED the r5_review gate at
    accuracy 0.7083 with false_approve 0.0000 over 24 items (governance/r5_review_gate_bench.jsonl), i.e. the
    SAME accuracy as gemma-4-E4B with its false-approve defect removed (0.125 -> 0.0), while gpt-oss stays the
    model of record at 0.9167/0.0. The id is the one THE ENGINE SERVES (hub-cache form): creating a second short
    name for one set of bytes is the duplication this register refuses, so the engine's own id is the canonical
    one here. roles: [] because promotion is BLOCKED, not refused - BUG-1048 (R5 coverage silently depends on
    file length) and BUG-1041 (a tag-blind done-key lets a re-measurement pool silently) are coverage defects
    in the INSTRUMENT, and seating a model on evidence an instrument cannot re-take is the slop this file
    exists to prevent.
  roles: []
  min_ctx:
    brain: 32768
    review: 32768
    code: 32768
    plan: 131072
    analyze: 131072
    classify: 8192

# ── the record step: how a receipt is produced (composes scripts/measure_prefill.py, C21) ────────────────
record:
  prompt_tokens: 2048      # >= the engine's fixed prefill shape; small enough to be cheap per candidate
  max_tokens: 128          # a real decode sample, never a 1-token artifact (D-3102)
  timeout_s: 1800
