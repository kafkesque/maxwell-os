- id: D2634
  category: QUALITY / DATA
  state: RESOLVED
  description: 'CLASSIFICATION-ACCURACY DEPENDENCE (2026-09-14, RESOLVED analysis, CORRECTED). Question: can discipline/domain accuracy be increased, or does it need a bigger anchor? MEASURED ANSWER: accuracy
    is dominated by per-class TRAINING-sample count + label quality, NOT anchor size or architecture. Training set = the RETIRED gpt-oss SILVER pool (archive/golden_retired_D2618/stage4_golden_mined.yaml,
    1027 ex, 93.3% unverified per D2616; retired D2618 P0.5, train-only): 61 disciplines avg 16.8 ex/class, 18/61 <10; 43 domains avg 2.22 labels/row, 11 domains <20 positives. ARM-1 (D2632): flat 0.229
    vs hierarchical 0.175 discipline macro-F1; domain head near-zero 0.009. The anchor (gold_4axis, 214 rows) is the EVAL/measurement set — growing it improves measurement trust (35/56 eval classes <=3
    rows), NOT accuracy. To increase accuracy: (1) targeted ingestion of the 18 starved disciplines (D2607-D: 9 CRITICAL convergent<=3 + 8 HIGH + 1 MODERATE); (2) clean labels via reliable-pair relabel
    (D2610) or weak-sup seeded from the verified core (D2585); (3) domain -> bge-m3->taxonomy-match (D2613, training-free), NOT the sigmoid head. ROOT CAUSE: the classifier trains on UNVERIFIED silver —
    the verified core (214 rows) is too small to train a 61-way head, so the silver pool is both too small AND unverified.'
  champion: goose
  target_files:
  - scripts/ab_harness_arm1.py
  - governance/ab_harness_arm1.json
  created: '2026-09-14'
