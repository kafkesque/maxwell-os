      declare debt to turn a rail green. Not a second ruler: the RAILS remain the readers (pin_lists#readers) and
      this route only moves bytes.
    unreconciled_reason: >-
      The cover rule asks for a reconciliation entry or a reason, and the reason is that the pins ARE reconciled -
      twice, by the rails that read them. Every pin list in this file carries a STALENESS rule with teeth: a
      revocation pin whose record now names a resolvable successor fails check_revoked_references, a supersession
      pin whose record now names a successor fails reconcile#supersession_stale_pins, a forward citation whose site
      is gone fails reconcile#decision_citations_in_force, and the membership and spelling pins fail their own
      rails the same way. A reconciliation entry here would have to compare the pin list against the pin list -
      self-certifying evidence, which is the BUG-467 defect this repo keeps re-finding. What is NOT self-certified
      is the DIRECTION of the list (shrink-only), and that is now a declaration the route enforces rather than a
      sentence a reader has to trust.
