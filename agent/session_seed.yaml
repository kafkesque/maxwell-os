        persisted: true            # 2 SQLite cols: is_convergent INTEGER, origin TEXT (D2442)

# ── Pipeline (8-stage v3.0 — cluster-before-extract) ──
# D2197: stage3 removed (D2120). Pipeline is 8-stage, not 9.
pipeline:
    stages:
        stage0:    convert           # EPUB/PDF → MD (Pandoc/Docling)
        stage0_5:  extract_metadata  # Filename → author/title/year (LLM)
        stage1:    chunk             # MD → segments + SHA-256 dedup
        stage1_3:  prefilter         # Regex structural garbage filter (D2080)
        stage1_5:  embed_cluster     # FAISS clustering on raw segments (D2094)
        stage2:    extract           # Clusters → convergent FBs (1 LLM call per cluster — REWRITE D2110)
        # stage3: REMOVED (D2120) — HDBSCAN semantic dedup replaced by cluster-before-extract
        stage4:    classify          # Multi-label classification + formatting (D2066 multi-label, not SALSA)
        stage5:    verify            # DeBERTa-v3-large NLI only (D2298, D2093 fail-closed)
        stage6:    commit            # SQLite + Parquet export
    clustering:
        method: FAISS
        metric: cosine
        threshold: 0.75              # D2205: synced with pipeline_config.yaml faiss_threshold (was 0.70 on 3 books — recalibrate at 20+ books)
        embed_model: bge-m3
        min_source_diversity: 2
    classification:
        method: multi_label          # D2066: raw labels dethrone canonicals. Not SALSA.
        model: classifier            # R5: Generator (Qwen3-Coder) ≠ Classifier (gpt-oss). D2340 rename.
        max_domains_per_fb: 5
    verification:
        borp_min_sources: 2
        nli_model: MoritzLaurer/DeBERTa-v3-large-mnli-fever-anli-ling-wanli   # D2298: DeBERTa-only
        nli_entailment_threshold: 0.10
        cross_family_verifier: null   # D2298: removed (RoBERTa/Phi-4-mini/Gemma deleted)
        fail_mode: fail_closed       # D2093: QUARANTINE on any check failure, never PASS

# ── Services ──
services:
    omlx:
        host: localhost
        port: 11435
        api_key: sk-maxwell-local
        watchdog: pipeline/omlx_watchdog.py
        memory_guard: pipeline/memory_guard.py
        memory_limit_gb: 24          # BUG-017 mitigation: restart OMLX if RSS exceeds
    ollama:
        host: localhost
        port: 11434

# ── Storage ──
storage:
    canonical: knowledge pipeline/maxwell.db
    checkpoints: knowledge pipeline/checkpoints/
    parquet: knowledge pipeline/parquet/
    archive: knowledge pipeline/archive/

# ── Content-Type Ontology (D2323) ──
content_type:
    registry: config/content_types.yaml   # single source of truth (C12)
    content_types: [principle, process_template, process_instance, tool_instruction, growth_edge]
    extraction_types: [causal_mechanism, descriptive_model, normative_heuristic, empirical_pattern]
    note: "2 orthogonal axes. Core body shared; per-type extension delta. D2150 (extraction→content) + D2128 (route→content) mappings in registry."

# ── Governance ──
governance:
    constitution: CONSTITUTION.md
    decision_log: DECISION-LOG.md
    master_task_register: MASTER-TASK-REGISTER.md
    buglog: governance/buglog.md
    protected_files:
        - CONSTITUTION.md
        - DECISION-LOG.md
        - MASTER-TASK-REGISTER.md
        - AGENTS.md
        - .env
        - config/*.yaml
        - governance/*.md

# ── Boot Sequence ──
boot:
    1: Read CONSTITUTION.md
    2: Load agent/session_seed.yaml
    3: Run OMLX stress test (pipeline/omlx_watchdog.py --pre-stage)
    4: Verify OMLX + Ollama running
    5: python3 pipeline/status.py

