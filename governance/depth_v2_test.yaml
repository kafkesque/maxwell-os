examples:
- id: e24ae22a703cff5969e0c3ecfcf9a1b7ec39b38a41b7cfed46bea40fed2c35d9
  input_fb:
    name: Vivid Ideas Span Differences
    definition: A principle for making ideas more vivid by including their opposites
      and addressing opposing viewpoints to create more complete and compelling concepts.
    mechanism: Vivid Ideas become more complete and compelling when they explicitly
      account for and incorporate opposing ideas, variables, and differing opinions
      rather than ignoring them.
    boundary: Applies when ideas need to be made more complete and robust by considering
      counterpoints and alternative perspectives. Fails when the idea is already comprehensive
      or when opposing viewpoints are irrelevant to the context.
  expected_classification:
    depth: cross-domain
- id: 02098a976a18f10f36198a1df370f7ebf1562c5988a2a70ce169fe8a8b0a88fb
  input_fb:
    name: Identity-driven Behavior in Human Decision Making
    definition: A principle demonstrating that human identity can override basic survival
      instincts and financial considerations in decision-making.
    mechanism: Human identity and identification with narratives can be so powerful
      that they override basic survival instincts and financial rationality, causing
      individuals to make choices that prioritize identity over material benefit or
      even life itself.
    boundary: Applies to human behavior where identity and narrative identification
      override rational economic or survival considerations. Fails when the principle
      does not account for individual differences in identity strength or when the
      behavior is not truly driven by identity rather than other factors.
  expected_classification:
    depth: domain
- id: 84aeffca201da0c679341034989f04bd9a48f761f4d39a18a69b2ee7cbab13d1
  input_fb:
    name: Assumption Discovery and Plan Adjustment Process
    definition: A process for identifying and responding to discrepancies between
      initial assumptions and actual operational outcomes in high-uncertainty environments.
    mechanism: The process involves recognizing when initial estimates prove wrong
      in the wrong direction, then using disciplined monitoring to spot discrepancies
      and reconfigure operations to reduce negative impacts from emergent outcomes.
    boundary: Applies to social entrepreneurship contexts where assumptions about
      costs, reliability, and financing are subject to change. Fails when assumptions
      are not properly identified or monitoring processes are not implemented.
  expected_classification:
    depth: domain
- id: 441805e8b42cbd101ee187168dc50bc6ce1e3c4f7db19120bea16da119ff39b0
  input_fb:
    name: Human Planning As Evolutionary Adaptation
    definition: Planning and projection represent evolutionary adaptations that allow
      humans to simulate potential outcomes and make decisions without direct trial-and-error
      experience, effectively 'cheating' evolution by running mental simulations.
    mechanism: Planning emerges as a cognitive capability that enables humans to generate
      projections and counterfactual scenarios internally, allowing them to evaluate
      potential outcomes before acting. This mental simulation capability evolved
      as a more sophisticated alternative to primitive selection processes where only
      the fittest survived through genetic improvement.
    boundary: Applies specifically to human cognitive capacity for mental simulation
      and planning. Does not apply to primitive organisms that rely solely on genetic
      selection. Fails when applied to non-human species without similar cognitive
      abilities.
  expected_classification:
    depth: domain
- id: f4847479c5e72d30a6d0228ac1694ef347b5f1211256317ea42e7b55e28fb3f8
  input_fb:
    name: Historical Context As Design Inspiration
    definition: A design principle that emphasizes the importance of understanding
      historical and cultural contexts to inform contemporary creative solutions.
    mechanism: The process involves researching the historical background of clients
      or subjects to uncover hidden connections, cultural roots, and established elements
      that can serve as innovative starting points for design work.
    boundary: Applies when historical context can provide meaningful inspiration or
      constraints for design work. Fails when historical information is irrelevant
      or when the historical context doesn't offer useful insights for contemporary
      design.
  expected_classification:
    depth: domain
- id: 8a19cf81d2db860f075b641c7a53d2d37db10ad7d4ae50cbdcee34620a0381ee
  input_fb:
    name: Universal Symbol Systems
    definition: Symbol systems that serve universal communication needs must balance
      standardization with adaptability to local contexts. These systems achieve broad
      accessibility through shared visual language while accommodating cultural and
      linguistic differences through strategic design choices.
    mechanism: 'This is a descriptive model of how symbol systems function across
      different domains and contexts. Universal symbol systems are organized into
      categories that serve distinct communicative functions: (1) information signs
      that must be understood across languages and cultures, (2) cultural or identity
      symbols that reflect local meaning, and (3) aesthetic or emotional symbols that
      convey mood or identity. The model describes how these categories relate to
      each other in practical application, not a causal chain.'
    boundary: Applies to systems where symbols must communicate across diverse audiences
      or contexts. Fails when symbols are designed for a single, homogeneous audience
      or when the system is not intended for cross-cultural or multi-language communication.
  expected_classification:
    depth: cross-domain
- id: b7302a850552afef1c9193293ca0f4c5996f0edbf8768c5571a30b00b59449fa
  input_fb:
    name: Mona Lisa and Expectation Effect
    definition: The phenomenon where the perceived beauty and mystery of artistic
      works are significantly influenced by social expectations and cultural narratives
      rather than objective artistic qualities.
    mechanism: The beauty and mystery of artistic works like the Mona Lisa are not
      primarily determined by their technical execution or aesthetic qualities, but
      rather by the social expectations and cultural narratives that surround them.
      When individuals lack expertise in art appreciation, they rely on social cues
      and the collective expectations of others to form their judgments.
    boundary: Applies to artistic and cultural experiences where individuals lack
      deep expertise or perfect information. Fails when individuals have sufficient
      artistic knowledge to make independent judgments about technical quality.
  expected_classification:
    depth: domain
- id: 0d50efce8200b8182bf07d4dca0436decaadd156f31bc791ecb2b74f06e022f8
  input_fb:
    name: Media Narrative Dominance
    definition: Media outlets can strategically amplify specific narratives to dominate
      public attention and shape political outcomes by leveraging timing, repetition,
      and emotional resonance. This principle describes how selective news coverage
      can become a powerful tool for influencing public perception and political decision-making.
    mechanism: Media narratives gain dominance through strategic amplification of
      specific topics at critical moments, creating a feedback loop where increased
      coverage generates more attention and further coverage. When a narrative is
      repeated frequently enough and positioned at key decision points (such as election
      cycles or wartime), it becomes embedded in public consciousness and political
      discourse. The media's role in framing events as either urgent or trivial can
      shift political priorities and voter behavior, particularly when the framing
      aligns with existing biases or emotional triggers.
    boundary: Applies when media outlets have sufficient reach and audience to influence
      public perception. Fails when media coverage is too fragmented or when audiences
      are sufficiently informed to resist narrative manipulation. Also fails when
      political actors are not dependent on media attention for electoral success
      or when the narrative contradicts core audience values.
  expected_classification:
    depth: domain
- id: 6039ff8790bbd176d36e1b9aa7fd2781311c143dfacc1e68e276010ab79e25b2
  input_fb:
    name: Design Thinking for Social Impact
    definition: A methodology that combines business sustainability and social impact
      metrics to evaluate investment success, particularly in addressing systemic
      problems through system-wide approaches.
    mechanism: Design thinking enables venture capitalists and development experts
      to navigate government bureaucracies and adapt solutions to available infrastructure,
      addressing systemic problems through comprehensive system approaches rather
      than isolated interventions.
    boundary: Applies when systemic problems require system-wide solutions rather
      than traditional business metrics. Fails when problems can be addressed through
      conventional business approaches or when infrastructure limitations prevent
      adaptation.
  expected_classification:
    depth: cross-domain
- id: 2e393598326a7f7ad233e50ccf650ecbb6493b9cec835d449987b36c73297add
  input_fb:
    name: Systemic Pest Cycle
    definition: A feedback loop in which ecosystem disruption leads to pest outbreaks,
      prompting pesticide use that further degrades the system and intensifies future
      pest problems. The cycle demonstrates how short-term fixes compound long-term
      instability in managed systems.
    mechanism: This is an empirical pattern describing a recurring system behavior,
      not a verified causal chain. The pattern shows that pest outbreaks and pesticide
      application co-occur in a feedback loop structure, where ecosystem destruction
      enables pest resurgence, which then requires more pesticide use. The system
      exhibits oscillatory behavior between pest control and ecosystem degradation,
      with no stable equilibrium point. The pattern is observable across different
      contexts (agriculture, oil markets) where short-term interventions create systemic
      instability.
    boundary: 'Applies when a system has: (1) managed components that interact with
      natural controls, (2) short-term reactive responses to problems, (3) feedback
      loops where solutions create new problems. Fails when: (1) the system is not
      managed or controlled, (2) solutions are properly integrated with natural systems,
      (3) the system has stable equilibrium conditions that resist oscillation.'
  expected_classification:
    depth: cross-domain
- id: ba1ee450e129c859f62e94bf25334405b25477a2313876f1ef9220395afc8c77
  input_fb:
    name: Formula for Business Success in Existing Industries
    definition: A universal business strategy that involves copying established practices
      and formulas from successful existing businesses in known fields.
    mechanism: The approach leverages proven business models and formulas that have
      worked for millennia, allowing practitioners to succeed in any known field by
      following the same patterns used by others.
    boundary: Applies to any existing industry where proven formulas exist. Fails
      when the industry is completely novel or lacks established patterns.
  expected_classification:
    depth: domain
- id: a742bbf219499cb3bd9539b6d2df840ce46e3d26dc460d28999310bec84b3866
  input_fb:
    name: Locate Responsibility in the System
    definition: Identifying and addressing the root causes of system problems requires
      focusing on internal system structures and processes rather than external interventions.
      The principle emphasizes that solutions must emerge from within the system's
      own dynamics and capabilities.
    mechanism: This is a normative heuristic that prescribes a practical approach
      to system analysis and design. It suggests that when evaluating solutions to
      system problems, one should prioritize interventions that align with the system's
      existing structures and capacities over external inputs or interventions that
      may not integrate well with the system's natural flow.
    boundary: Applies when system problems can be addressed through internal structural
      adjustments or process modifications. Fails when external factors or constraints
      fundamentally limit the system's capacity to adapt or when the system lacks
      the necessary internal resources or feedback mechanisms to support meaningful
      change.
  expected_classification:
    depth: cross-domain
- id: 16524dd46888b90292b5aa9c37841f5d9525ab756adf9530d2f37fc4d73d8e08
  input_fb:
    name: Force Layout Visualization of Racial Divides
    definition: A data visualization technique using force-directed layouts to represent
      and emphasize racial segregation patterns in urban environments, creating a
      visual metaphor of 'fracturing' that makes demographic divisions more emotionally
      impactful than traditional maps.
    mechanism: Force layouts in D3.js create dynamic spatial arrangements where nodes
      (representing demographic groups or areas) repel each other based on similarity
      measures, visually demonstrating the separation and tension between different
      racial groups in a cityscape.
    boundary: Applies specifically to D3.js force-directed graph visualizations of
      demographic data in urban contexts. Fails when applied to non-spatial or non-demographic
      datasets.
  expected_classification:
    depth: specialized
- id: 1c86d19435a99998c90351d451cbd464e355273b8a77501c5ff5284adceff857
  input_fb:
    name: Temporal Language and Cognitive Mapping
    definition: The relationship between how languages conceptualize time and the
      cognitive patterns that emerge from those linguistic structures, where different
      languages may map temporal concepts onto spatial dimensions in distinct ways.
    mechanism: Languages that encode time spatially (like English's 'down the line')
      create different mental models for temporal reasoning, with the spatial orientation
      influencing how speakers process temporal relationships and sequences.
    boundary: Applies specifically to languages that encode temporal concepts through
      spatial metaphors. Does not apply to languages without such spatial-temporal
      mappings or to abstract temporal reasoning outside of linguistic frameworks.
  expected_classification:
    depth: cross-domain
- id: 79d104c49de1b9d8ced301518ef6722980395440c12f7e12c6d12532f18ab441
  input_fb:
    name: Metacritical Framework for Contemporary Design Analysis
    definition: A framework for critically analyzing contemporary design elements
      by recognizing their ideological and historical dimensions while developing
      intuitive responses to dominant stylistic trends.
    mechanism: The framework operates by identifying design elements as ideological
      artifacts that require critical investigation, enabling practitioners to develop
      instinctive counter-responses to prevailing aesthetic norms rather than passive
      acceptance.
    boundary: Applies when analyzing design elements that carry ideological weight
      and historical significance. Fails when applied to purely functional or technical
      design elements without cultural context.
  expected_classification:
    depth: domain
- id: 846da10dad102216aab8bfdf99d3c7e5e8a96a7e0db61e82e1b409f5b0b0d61f
  input_fb:
    name: Universal Communication Education
    definition: An educational approach that aims to prepare everyone to effectively
      communicate universal language to universal man, focusing on the transition
      from permitted ignorance to required comprehension.
    mechanism: The process involves educating individuals to move beyond childhood
      and schooling experiences that may have been damaged by social conditioning,
      enabling them to develop lucid understanding and communication skills for universal
      human interaction.
    boundary: Applies to individuals who have emerged from childhood and schooling
      with sufficient mental resilience to handle the transition from ignorance to
      required comprehension. Fails when individuals are too heavily conditioned by
      social experience to maintain lucid thinking.
  expected_classification:
    depth: domain
- id: 3c84d90661cdae79aab591834ce6c169f3548d1360ebe421c5f143fcd4f28a05
  input_fb:
    name: Translation As Methodological Challenge
    definition: A critique of monolingual methodological approaches in social research
      and the need for translation theory to address cultural and linguistic diversity
      in research.
    mechanism: Monolingualism in research methods marginalizes subaltern voices and
      risks domesticating plurilingual perspectives, while foreignizing translation
      preserves cultural differences and maintains the 'otherness' of source cultures.
    boundary: Applies when research involves cross-cultural or multilingual contexts
      where translation issues arise. Fails when research is conducted entirely within
      a single linguistic and cultural framework.
  expected_classification:
    depth: cross-domain
- id: 3f4646217a44d71b160103b179de169b5180d42932fa944413373ea6e007d84b
  input_fb:
    name: Visual Education Through Pictorial Statistics
    definition: The systematic use of visual representations and pictorial statistics
      to educate mass audiences in a rational, standardized manner. This approach
      emerged in early 20th-century Vienna as a response to the need for accessible
      information design that could bridge complex data and public understanding.
    mechanism: This is a descriptive model of how visual communication systems organize
      information for mass education. The Vienna Method of Pictorial Statistics developed
      standardized visual symbols and iconography that could be understood across
      different audiences, particularly through the work of Otto Neurath and Marie
      Neurath. These systems treat visual elements as communicative units that can
      be systematically composed and nested to convey meaning, with specific attention
      to how shapes, contours, and symbols relate to each other in ways that enhance
      comprehension.
    boundary: Applies to educational contexts where standardized visual systems are
      designed for broad public consumption. Fails when visual communication is primarily
      for artistic expression, commercial advertising, or highly specialized technical
      audiences where standardization is not required or desired.
  expected_classification:
    depth: domain
- id: 8b987c79a6c77835fc4784b5505b75aafc61d6fac0fa2031884e6dc3ee417abb
  input_fb:
    name: Interactive Electronic Book Production Process
    definition: A complex multi-person collaborative process for creating interactive
      electronic books that involves specialized roles across publishing, software
      development, and design teams.
    mechanism: The process requires coordination between traditional publishing roles
      (editors, publishers, production staff) and technical roles (software architects,
      user interface engineers, graphics designers) to integrate interactive elements
      into electronic publications.
    boundary: Applies to the production of interactive electronic books that combine
      traditional publishing workflows with technical development. Fails when the
      process is applied to purely static digital content or non-interactive physical
      books.
  expected_classification:
    depth: domain
- id: b9b69a60583356aa03538ed6d1d9d467ea6a2092782e25b06a0443f7f27fe741
  input_fb:
    name: Story Momentum and Narrative Drive
    definition: A story is defined by change over time, with momentum being more important
      than scale or ultimate destination. Stories can be dead-end yet still be compelling
      if they feel like they're heading somewhere meaningful.
    mechanism: The narrative drive comes from the perception of forward motion and
      potential development, even when the story doesn't actually progress. The psychological
      sense of momentum creates engagement regardless of actual direction.
    boundary: Applies to narratives that maintain the illusion of forward movement
      or potential development. Fails when there's no sense of momentum or when the
      story is completely static without any forward-looking elements.
  expected_classification:
    depth: domain
- id: 8a81abc7b23363c313d6a08138f3d444f3022b552fe6a0de7e6fb42b1fa6b395
  input_fb:
    name: Failure Mode Analysis
    definition: The most meaningful understanding of a system comes not from observing
      it in optimal operation, but from analyzing its behavior under suboptimal or
      failure conditions. This principle emphasizes that system resilience and robustness
      are better understood through failure mode examination than through success
      mode observation.
    mechanism: This is a descriptive model that categorizes system understanding approaches.
      The model distinguishes between 'success mode' (normal operation) and 'failure
      mode' (suboptimal or broken operation) as two distinct contexts for system analysis.
      The principle recognizes that failure modes reveal critical constraints, bottlenecks,
      and design weaknesses that normal operation conceals, making them more informative
      for system improvement and robustness engineering.
    boundary: Applies when systems can be meaningfully analyzed under stress or breakdown
      conditions. Fails when systems are so simple or deterministic that failure modes
      are not relevant or when analysis is impossible due to lack of failure data
      or controlled testing environments.
  expected_classification:
    depth: cross-domain
- id: 7c7cde09619b02fecc652bc41f30cc0f26a10828ae7b91b1d6fc2f5c1d18a114
  input_fb:
    name: Perspective Fragmentation and Systemic Understanding
    definition: The principle that understanding complex systems requires recognizing
      that individual perspectives are incomplete and must be broken down into sub-perspectives
      to reveal the full systemic picture.
    mechanism: When people attempt to understand a whole group's perspective, they
      often assume all members share identical views, but in reality, each group member
      holds unique sub-perspectives that must be analyzed to understand the complete
      system.
    boundary: Applies when analyzing complex human systems where individual perspectives
      vary within groups. Fails when assuming all members of a group hold identical
      views or when focusing only on surface-level group identity.
  expected_classification:
    depth: domain
- id: 742db5a5c6f81688b06ff6474414dc9246775647c2fd420dac470f7fbc218b75
  input_fb:
    name: Zipf's Law of Linguistic Scaling
    definition: Language evolution follows a mathematical balance between the pressure
      for semantic uniqueness (using different words for distinct meanings) and the
      pressure for semantic economy (reusing words for similar meanings). This tension
      produces a power-law distribution of word frequencies that reflects the optimal
      trade-off between ambiguity reduction and linguistic efficiency.
    mechanism: This is an empirical pattern, not a causal mechanism. The mathematical
      relationship between semantic differentiation and lexical economy creates a
      predictable distribution of word usage frequencies. Zipf's principle shows that
      when speakers balance the need for clarity (different words for different meanings)
      with the need for efficiency (reusing words for similar meanings), the resulting
      distribution follows a power law. Mandelbrot's work extended this by showing
      how scaling laws in mathematics align with Zipf's linguistic observations, though
      he did not establish a direct causal chain.
    boundary: 'Applies to natural language systems where speakers balance semantic
      clarity and linguistic efficiency. Fails for: (1) artificial languages with
      fixed rules; (2) systems where semantic uniqueness is prioritized over efficiency
      (e.g., technical jargon, specialized vocabularies); (3) languages with no semantic
      variation or where all meanings are completely distinct.'
  expected_classification:
    depth: domain
- id: 2f16d31437ab0befecefbcc869b44600cbc75a6d851975fb216c702092758ebd
  input_fb:
    name: Gradio Web Interface for Ml Models
    definition: A Python library that simplifies creating user-friendly web-based
      interfaces for machine learning models and applications.
    mechanism: Gradio provides a simple API to wrap ML model functions or classes,
      allowing developers to quickly build interactive demos that accept user inputs
      and display real-time outputs through web browsers.
    boundary: Applies to developers building interactive ML demos or web applications.
      Fails when the model or application is not compatible with Gradio's input/output
      formats or when the library is not installed.
  expected_classification:
    depth: specialized
- id: 03e4d12e1ded77704cdbe87495526e0fb3734fc033f59af1d1529f25355ffee0
  input_fb:
    name: Persona Framing for Query Construction
    definition: A method for structuring AI assistant prompts by specifying a detailed
      persona that should frame queries and responses, ensuring the output aligns
      with desired expertise and perspective.
    mechanism: The persona specification sets clear expectations for the AI's role,
      expertise domain, and output characteristics (e.g., tone, structure, bias),
      which guides the generation of more focused and relevant responses.
    boundary: Applies when constructing prompts for AI assistants where the desired
      output format and expertise level need to be explicitly defined. Fails when
      the persona is too vague or generic to guide meaningful output.
  expected_classification:
    depth: specialized
- id: 031d466d481e202480b6e3adea3b09ec4692f83f42a415f068446474ddb2c0f5
  input_fb:
    name: Fashion Cycle Acceleration
    definition: The rapid copying of fashion trends creates a need for society women
      to invest more effort in staying ahead of mass-produced styles, leading to shortened
      fashion cycles.
    mechanism: When fashion trends are quickly copied by mass producers, the novelty
      window for exclusive styles shrinks, forcing those who wish to maintain status
      through fashion to constantly seek new trends to stay ahead of the general population.
    boundary: Applies when there is a significant gap between high-end fashion and
      mass-produced copies. Fails when fashion trends are not quickly copied or when
      society women do not value status through fashion.
  expected_classification:
    depth: domain
- id: da559fda33df4fcfe9037863da8d3c4903c6f8de847a60149cfa06f39fa2aa66
  input_fb:
    name: Reciprocity-driven Behavioral Influence
    definition: The principle that giving something of value to others triggers a
      psychological obligation to reciprocate, leading to predictable behavioral changes
      in the giver's favor. This mechanism operates across interpersonal and commercial
      contexts.
    mechanism: Reciprocity functions as a social norm that creates psychological pressure
      to return favors or benefits received. When one person provides a benefit (whether
      material, emotional, or symbolic), it establishes an implicit expectation that
      the recipient will return the favor. This creates a behavioral cascade where
      the initial giver gains influence over the recipient's actions, even when the
      recipient is not consciously aware of the influence.
    boundary: Applies when a clear, voluntary benefit is provided that creates a sense
      of obligation. Fails when the benefit is perceived as forced, coerced, or when
      the recipient has no meaningful choice in accepting or repaying the favor. Also
      fails in contexts where reciprocity norms are not culturally recognized or where
      the benefit is too small to trigger the psychological response.
  expected_classification:
    depth: cross-domain
- id: c389c9bf0cdbd7ce8ab58c3a6f5ac583f050bd30ad8d2380439e2953b67f84a8
  input_fb:
    name: Hyper-evolution in Biological and Synthetic Systems
    definition: A rapid, iterative platform for creation that enables the design and
      evolution of biological systems and compounds through computational modeling,
      AI, and automated biological techniques.
    mechanism: Computational models and AI systems can generate and test novel biological
      designs through self-play and iterative optimization, while laboratory automation
      and synthetic biology tools enable rapid implementation and refinement of these
      designs.
    boundary: Applies to biological and synthetic systems where computational design
      can be rapidly translated into physical biological entities. Fails when computational
      models cannot accurately predict biological behavior or when physical implementation
      is not feasible.
  expected_classification:
    depth: cross-domain
- id: 5221775b400f5bdf302e38117fbcffb2d3cde014608fd6c47a1604df3606eeef
  input_fb:
    name: Paradigm Shift Through Social Process
    definition: Scientific and social transformation occurs through shifts in the
      underlying frameworks or 'paradigms' that guide practice, where change emerges
      not from abstract logic but from the actual processes of doing research or implementing
      social change. These shifts involve both the acceptance of new rules and the
      rejection of old ones, often requiring revolutionary actors who alter the fundamental
      game being played.
    mechanism: Change in scientific or social practice happens through the evolution
      of shared conceptual frameworks or paradigms. These frameworks are shaped by
      the psychology and sociology of research communities, influenced by embedded
      cultural and contextual factors. When a paradigm becomes inadequate or in crisis,
      it can be replaced by a new one that fundamentally alters the rules of engagement.
      This transition is not merely logical or rational but involves social processes,
      including the roles of key actors who challenge existing norms and introduce
      new models.
    boundary: Applies when there is a recognized shift in the dominant conceptual
      framework or rules of practice in a field or society. Fails when the change
      is purely incremental or when the framework remains stable despite apparent
      anomalies or challenges.
  expected_classification:
    depth: cross-domain
- id: cf9e5cbf973026fb712e034a80dcd72d5f8dae9abdc3fff5b48bced9b079c7cb
  input_fb:
    name: Cash Register As Moral Instrument
    definition: Cash registers that make dishonest behavior difficult to accomplish
      serve as effective moral instruments in civilization because they prevent the
      habit-forming nature of rewarded bad behavior, as observed by Skinner.
    mechanism: Cash registers create structural barriers that make dishonest actions
      more difficult to execute and sustain, thereby preventing the reinforcement
      and habituation of unethical behavior patterns that would otherwise be encouraged
      by rewards.
    boundary: Applies when dishonest behavior can be effectively monitored and prevented
      through structural design. Fails when behavioral incentives are not tied to
      structural constraints or when the system is bypassed.
  expected_classification:
    depth: cross-domain
- id: 04221502f1945e04a7b238c80d8dd06470ffcf3576d421786d9974f9bc386928
  input_fb:
    name: Making Your Own News Online
    definition: A public relations strategy for creating media opportunities by defining
      one's expertise and crafting compelling press releases that answer key questions.
    mechanism: The approach involves identifying one's expertise, writing concise
      press releases with exciting leads, and following up with phone calls to media
      contacts with alternative pitches ready.
    boundary: Applies to individuals or businesses seeking media attention and public
      recognition. Fails when media contacts are not accessible or when the story
      lacks compelling elements.
  expected_classification:
    depth: domain
- id: c87a9538c19e9480e728a2f1771f32c0faf16668fe950c9febd9c9bd9c252aa6
  input_fb:
    name: Scientific Misinformation and Media Amplification
    definition: A pattern where flawed scientific research is amplified by media outlets
      without proper scrutiny, leading to widespread misperceptions.
    mechanism: The process involves creating false scientific findings that appear
      legitimate through superficial peer review and then publishing in reputable-looking
      journals, which are then picked up by media outlets without critical evaluation
      of the underlying research quality.
    boundary: Applies to cases where scientific research is misrepresented or misrepresented
      in media coverage. Fails when the research is properly conducted and accurately
      reported.
  expected_classification:
    depth: cross-domain
- id: 022e46be7138a0142300f6dad35a187556cdecf9929628e41c2ec96dc8d4a6d7
  input_fb:
    name: Problem, Issue, Need, Trend Detection Framework
    definition: A method for identifying and categorizing external factors that create
      opportunities for business innovation by recognizing changes in rules, regulations,
      missing elements, or behavioral patterns.
    mechanism: 'The framework operates by systematically analyzing external conditions
      to identify four categories of change: (1) rule/regulation changes that alter
      business conditions, (2) missing elements or new desires that create demand
      gaps, (3) behavioral trends that shift market dynamics, and (4) the intersection
      of these factors that create opportunities for innovation.'
    boundary: Applies when analyzing external factors that create business opportunities
      or threats. Fails when the analysis is limited to internal factors or when the
      four categories are not properly distinguished from each other.
  expected_classification:
    depth: domain
- id: cd52ed6d07766dc1a7a2ba8add9e310155c4384e71692f94667159d44cab3499
  input_fb:
    name: Axis Mundi Symbolism
    definition: A central symbolic structure that connects multiple realms or levels
      of existence, often represented through staircases, trees, or serpents, serving
      as a metaphysical anchor for understanding cosmic order and spiritual ascent.
    mechanism: This is a descriptive model of symbolic structure, not a causal mechanism.
      The axis mundi appears across cultures as a recurring metaphorical framework
      that organizes the relationship between earthly and divine domains, connecting
      underworlds, middle worlds, and heavens through physical or conceptual pathways.
      It functions as a universal organizing principle for mythological narratives
      and cosmological systems.
    boundary: Applies to mythological and religious systems where there is a clear
      conceptual or physical structure connecting multiple levels of reality. Fails
      when the symbolic framework is purely functional or lacks a metaphysical dimension,
      such as in purely practical or secular contexts.
  expected_classification:
    depth: domain
- id: 01116fa6ff58565c9a64f37db117accde5e7d52fbf3c9bb1a1d470aa1899507c
  input_fb:
    name: Security Theatre
    definition: A concept describing security measures designed primarily to create
      the feeling of safety rather than to actually increase security, often resulting
      in resource misallocation and reduced effectiveness.
    mechanism: Security theatre occurs when policies and practices are implemented
      to satisfy the psychological need for security rather than to address actual
      security risks, leading to inefficient resource allocation and reduced real
      security.
    boundary: Applies to security policies and practices that prioritize perception
      over actual risk reduction. Fails when security measures are designed to address
      real threats rather than to create the feeling of security.
  expected_classification:
    depth: domain
- id: a1eea397e17951bf20bdf05032beef559c3234fdd4e1129aa837cc4eb83a60d4
  input_fb:
    name: Groupthink Prevention Protocol
    definition: A decision-making process designed to prevent groupthink by encouraging
      dissent, reducing hierarchy effects, and ensuring thorough analysis of all options.
    mechanism: The protocol involves removing hierarchical constraints, designating
      intellectual watchdogs to challenge assumptions, bringing in outside perspectives,
      and allowing discussion without the presence of leadership to encourage open
      debate.
    boundary: Applies to group decision-making processes where consensus-building
      might lead to groupthink. Fails when organizational culture does not support
      challenging authority or when external perspectives are not genuinely welcomed.
  expected_classification:
    depth: domain
- id: 4e335fc71872c4eb8063cffb3c315b8243e90945d38c7560aeee4026966eb1ef
  input_fb:
    name: Body Maintenance Checklist
    definition: 'A health maintenance framework comparing motorcycle engine maintenance
      to human body care using three essential elements: fuel, air, and spark.'
    mechanism: The passage analogizes human health maintenance to motorcycle maintenance,
      suggesting that just as engines need fuel, air, and spark to function properly,
      human bodies require proper nutrition, breathing, and energy to maintain optimal
      functioning.
    boundary: Applies to human health maintenance as a parallel to mechanical maintenance.
      Fails when the analogy breaks down or when the three elements don't adequately
      capture health needs.
  expected_classification:
    depth: cross-domain
- id: 194615e0d257c3ce58500dd5b30366890e894bd2b943643d8863b600b2f20bbc
  input_fb:
    name: Fisheye Lens for Graph Exploration
    definition: A visual representation technique that distorts data to maintain high
      information density while showing the enclosing structure, particularly useful
      for exploring unfamiliar or sparse graph structures.
    mechanism: The fisheye lens technique applies controlled distortion to graph data,
      magnifying local areas while preserving global context through the enclosing
      circle or sphere, allowing users to maintain overview while examining details.
    boundary: Applies when exploring unfamiliar or sparse graph structures where maintaining
      context is crucial. Fails when the distortion becomes so severe that it obscures
      important relationships or when users cannot distinguish between distorted and
      undistorted regions.
  expected_classification:
    depth: domain
- id: 0361981babbbbdf3fc6a1e9ba136d15d361e0d8b75175966dc70f82791dbd205
  input_fb:
    name: Sustained Leadership Through Internal Mastery
    definition: True leadership effectiveness requires mastering both internal personal
      development and external organizational impact. The principle describes a dual-path
      approach where leaders cultivate deep self-awareness and emotional intelligence
      while simultaneously driving external results and team success.
    mechanism: 'This is a descriptive model of leadership capability structure, not
      a causal mechanism. The model categorizes leadership as comprising two interdependent
      dimensions: the internal game (personal mastery, emotional intelligence, self-awareness)
      and the external game (organizational impact, team leadership, results). These
      dimensions are structured as complementary components rather than a cause-effect
      relationship.'
    boundary: Applies to leadership contexts where personal development and organizational
      outcomes are both valued and measurable. Fails when leadership is defined purely
      by external metrics or when internal development is explicitly undervalued in
      favor of immediate results.
  expected_classification:
    depth: domain
- id: 022f9d87669133275069785e436e2d217a8098812c2aeed9849467e03dee7200
  input_fb:
    name: Rise in Anticorporate Activism
    definition: A growing movement of public resistance to corporate advertising and
      branding practices, particularly in urban public spaces.
    mechanism: Activists use culture jamming techniques to hijack corporate advertisements
      and transform their messages, creating a form of semiotic Robin Hoodism that
      challenges corporate control over public space and discourse.
    boundary: Applies to public spaces where corporate advertising dominates and where
      activists have the means to create counter-messages. Fails when activists lack
      access to public spaces or the technical capability to modify advertisements.
  expected_classification:
    depth: domain
- id: 85d8368f9fe69b47b3ffbe38def2bf8f771e288ed2684f3815c00073bd65e4ec
  input_fb:
    name: Fundamental Full Attribution Ethos of Hard Science
    definition: A scientific approach that requires fully attributing concepts to
      their original disciplinary source and maintaining rigorous cross-disciplinary
      integration.
    mechanism: The ethos demands that knowledge from other fields be explicitly labeled
      and traced back to its source discipline (physics, biology, psychology, etc.)
      rather than being absorbed without attribution, creating a systematic approach
      to knowledge synthesis.
    boundary: Applies to scientific and analytical work where cross-disciplinary concepts
      are integrated. Fails when concepts are absorbed without proper attribution,
      leading to confusion about their origins and reducing analytical power.
  expected_classification:
    depth: cross-domain
- id: 9c56719a8eb2dadc0ebaa412bca0249d907c5825d9faacca06dc79cded4a8148
  input_fb:
    name: Indexical Sign Emergence
    definition: Indexical signs emerge at the most basic levels of physical or chemical
      systems, where they function as direct causal links between a sign and its object,
      operating without the need for integrated organisms or complex cognitive processing.
      These signs are foundational to emergent inter-subjective, dialogic mind structures.
    mechanism: Indexical signs manifest as physical or chemical entities that directly
      relate to their referents through causal connection. At the single-cell level,
      these signs operate as direct responses to environmental stimuli, such as bacterial
      flagellar rotation causing tumbling or directed swimming. The sign's relationship
      to its object is not mediated by interpretation or cognition but is intrinsic
      to the physical process, enabling primitive forms of information processing
      and adaptation.
    boundary: Applies when signs function as direct physical or chemical links between
      a sign and its referent, particularly in single-cell or primitive systems. Fails
      when signs require complex cognitive mediation, symbolic interpretation, or
      integration into higher-order organismic systems.
  expected_classification:
    depth: cross-domain
- id: 0221476f29dcecf471759802848d3d6644419d053e68164d142490f3c0b68ae0
  input_fb:
    name: Typographic Medium Evolution
    definition: The evolution of typographic systems reflects a progression from functional
      replication of handwritten forms to the exploitation of unique qualities inherent
      to the typographic medium. This transformation occurs through iterative adaptation
      and intentional design, as practitioners and theorists recognize and build upon
      the distinct affordances of typographic tools and processes.
    mechanism: The evolution of typographic systems follows a pattern where initial
      adoption of new technologies (like the printing press) begins with replication
      of older forms (manuscripts), but over time, practitioners and theorists begin
      to exploit the unique properties of the new medium. This involves both practical
      experimentation (e.g., using new tools like spray paint or chalk) and theoretical
      reflection on how the medium's characteristics shape form and meaning. The process
      is iterative, with early forms often being refined or reinterpreted as the medium's
      potential becomes better understood.
    boundary: Applies when a new medium or technology introduces distinct properties
      that differ from previous forms of communication or expression. Fails when the
      new medium is purely a functional replacement for older methods without developing
      unique characteristics or when there is no theoretical or practical reflection
      on the medium's properties.
  expected_classification:
    depth: domain
- id: c42d2805a063693c2d0a1c4467fe4a72b22df96cff26eb430d6d4472f9ca28f3
  input_fb:
    name: Ai Cognitive Offloading Effect
    definition: The phenomenon where using AI tools for cognitive tasks reduces neural
      engagement and brain activity compared to traditional problem-solving methods.
    mechanism: When individuals use AI tools like ChatGPT for tasks that would normally
      require mental effort and neural engagement, their brain activity shows reduced
      connectivity and cognitive processing compared to working without AI assistance.
    boundary: Applies to individuals using AI tools for cognitive tasks in controlled
      research settings. Fails when the research conditions don't accurately represent
      real-world AI usage or when participants have different levels of AI familiarity.
  expected_classification:
    depth: domain
- id: 6ee95415f29af4356a788954acfcebf62af9fbcd4a604784f77623a5c11257f3
  input_fb:
    name: Emotional Priming Through Attention
    definition: Emotional responses are triggered by attentional focus on specific
      stimuli, which can be manipulated through media coverage, imagery, and visual
      cues to influence perceived value and consumer behavior. This mechanism operates
      below conscious awareness and creates lasting memory structures that drive long-term
      engagement.
    mechanism: Attentional focus from media coverage, landing-page imagery, and aged
      photos creates emotional priming that bypasses rational processing and directly
      influences perceived importance. This occurs through activation of brain regions
      governing value perception, where emotional states are generated by attentional
      cues rather than logical reasoning. The emotional response becomes embedded
      in memory structures that persist beyond the initial stimulus, enabling repeated
      activation and behavioral influence.
    boundary: Applies when attention can be directed to specific visual or media elements
      that trigger emotional responses. Fails when attention is not controlled or
      when the stimuli do not activate the relevant brain regions for emotional processing.
      Also fails when individuals are highly focused on rational analysis that overrides
      emotional priming.
  expected_classification:
    depth: cross-domain
- id: 8786423c47d51188525b304fde03cdf8c2f8c580efc265a9f7acf78797014a82
  input_fb:
    name: Data Storytelling Narrative Structure
    definition: Effective data communication requires organizing information into
      narrative structures that guide interpretation and evoke emotional response.
      The principle describes how data visualization and storytelling merge to transform
      raw numbers into meaningful, memorable insights that resonate with audiences.
    mechanism: Data storytelling follows narrative patterns that align with human
      cognition and communication preferences. It uses familiar structural elements
      (like scientific experiments, case studies, or fictional threads) to frame data
      points within broader contexts. These structures help audiences process complexity
      by connecting individual data elements to overarching themes, motivations, or
      outcomes that provide meaning beyond the numbers themselves.
    boundary: Applies when data visualization is part of a larger communication strategy
      aimed at audience understanding and engagement. Fails when data is presented
      in purely technical or isolated formats without contextual framing or narrative
      purpose.
  expected_classification:
    depth: cross-domain
- id: a6dddfa5b05e1155443826d4dc9739a833d7f2f70a1972ef6ddc7954bad40bc6
  input_fb:
    name: Semiotic Interpretation Process
    definition: The semiotic process involves signs interpreting and transforming
      sensory input through habitual patterns and contextual understanding, where
      meaning emerges not from isolated elements but from the dynamic interaction
      between perception, convention, and interpretive habit. This process enables
      humans to navigate and organize chaotic sensory experiences into meaningful
      structures.
    mechanism: 'The semiotic interpretation process operates through three interconnected
      components: (1) sensory input (e.g., visual perception of colors or images),
      (2) conventional codes and habits that shape interpretation (e.g., color receptors,
      cultural norms), and (3) interpretant processes that transform raw data into
      meaningful understanding (e.g., associating a painting with emotional states).
      These components interact in a feedback loop where habitual interpretation can
      become rigid but remains malleable through conscious re-interpretation.'
    boundary: Applies when sensory input is processed through established codes and
      interpretive habits. Fails when sensory input lacks conventional reference points
      or when interpretation is purely random without any habitual or cultural framework.
  expected_classification:
    depth: cross-domain
- id: dadcdc1c34e0bca53f136cdeec388cc6be20271134dc33215e1df5eaad377719
  input_fb:
    name: Posthumanist Design Orientation
    definition: Design that transcends humanist origins and embraces uncertainty,
      not-knowing, and transhistorical perspectives. This approach challenges the
      ethical and existential limitations of human-centered design by integrating
      posthumanist principles and futuritic thinking.
    mechanism: 'This is a normative heuristic: design practices that move beyond humanist
      foundations and embrace uncertainty or ''not-knowing'' as a productive stance
      rather than a limitation. The principle prescribes a shift in design philosophy
      that accepts complexity and transhistorical connections as generative rather
      than problematic.'
    boundary: Applies when design practice seeks to move beyond humanist assumptions
      and embrace uncertainty or transhistorical perspectives. Fails when design remains
      confined to humanist frameworks or when uncertainty is treated as a problem
      to be solved rather than a condition to be embraced.
  expected_classification:
    depth: domain
- id: 068b0196d617cba2734b8990145cac68afb15a07676569f3193f831c5aa5c7b6
  input_fb:
    name: Prompt Engineering for Bias Detection and Control
    definition: Prompt engineering can be strategically designed to detect, mitigate,
      and control biases in AI outputs, as well as optimize for specific behavioral
      outcomes like style, format, and task execution. This approach involves crafting
      prompts that either reveal hidden biases or guide AI behavior toward desired
      specifications.
    mechanism: This is a practical heuristic for prompt design that enables users
      to either observe or shape AI behavior through structured instruction. By varying
      prompt components—such as system instructions, task framing, or output constraints—users
      can influence whether AI exhibits gender, racial, or other biases, or whether
      it adheres to specific formats, styles, or response structures. The effectiveness
      of such prompts depends on the specificity and clarity of the instructions provided.
    boundary: Applies when prompts are explicitly structured to either detect or control
      AI behavior. Fails when prompts are vague or lack clear directives, leading
      to unpredictable or uncontrolled AI responses. Also fails when the prompt does
      not account for the AI's training or inherent biases, which may persist despite
      careful design.
  expected_classification:
    depth: specialized
- id: 51c18ac25a86d0d810d437e57201b87209ba2a74f87c822ac3ce6676db3ccd20
  input_fb:
    name: Ooda Loop Optimization
    definition: The Observe–Orient–Decide–Act (OODA) loop is a continuous decision-making
      framework that enables agents to adaptively respond to dynamic environments
      by cycling through observation, orientation, decision, and action phases. The
      principle emphasizes minimizing cycle time to gain competitive advantage in
      real-time decision environments.
    mechanism: The OODA loop operates as a feedback-driven cycle where agents continuously
      observe environmental states, orient themselves based on contextual information
      and prior knowledge, decide on optimal actions, and act upon those decisions.
      Each iteration of the loop generates new observations that feed into the next
      orientation phase, creating a self-improving adaptive system. The cycle's efficiency
      is determined by how quickly each phase completes, with faster cycles enabling
      more responsive and accurate decision-making in rapidly changing conditions.
    boundary: Applies when environments are dynamic and require adaptive responses,
      particularly in retail and AI agent systems where real-time decision-making
      is critical. Fails when environments are static or where decisions can be precomputed
      and do not require continuous adaptation. Also fails in situations where the
      feedback loop is too slow to capture meaningful changes in state or where the
      decision space is too large to process within the available time.
  expected_classification:
    depth: cross-domain
- id: 1b656ced8631c37e04bc6f3ff94ebec9af5748d53402371f32732ccc4ed224db
  input_fb:
    name: Divine Proportion System
    definition: The divine proportion (φ ≈ 1.618) is a mathematical relationship where
      the ratio of the whole to the larger segment equals the ratio of the larger
      segment to the smaller segment. This proportion creates a harmonious geometric
      relationship that appears in both natural and designed systems.
    mechanism: The divine proportion emerges when a line is divided so that the whole
      line relates to the larger segment as the larger segment relates to the smaller
      segment. This creates a self-similar geometric relationship that can be extended
      infinitely through recursive subdivision, generating sequences of golden rectangles
      and logarithmic spirals that maintain the same proportional relationship at
      every scale.
    boundary: Applies when a geometric or design system requires proportional relationships
      that create visual harmony and self-similarity. Fails when systems prioritize
      functional constraints over aesthetic proportions or when the golden ratio is
      applied without regard to the underlying geometric construction.
  expected_classification:
    depth: cross-domain
- id: ed8cec458ab22e76283ba372397b607d608c6821162ec4aa05c8aebf7a223a3b
  input_fb:
    name: Agentic Ai Framework for Retail
    definition: A comprehensive framework for designing and implementing agentic AI
      systems in retail environments, incorporating decision-making frameworks, multi-agent
      coordination, and ethical governance.
    mechanism: The framework integrates foundational AI concepts with practical retail
      applications, emphasizing human-in-the-loop systems, transparency, and rigorous
      evaluation processes that ensure responsible AI development and deployment.
    boundary: Applies to retail and enterprise AI systems where human oversight and
      ethical considerations are paramount. Fails when the framework is not adapted
      to specific industry requirements or when ethical considerations are overlooked.
  expected_classification:
    depth: domain
- id: f1e23dc842cf43f1798ada11d92ae46802b538a3e08def193e4831fd24aa2fde
  input_fb:
    name: Industrial Method in Art
    definition: The adoption of mass production techniques and assembly methods from
      industrial culture into fine arts, beginning in the 1910s with collages and
      photomontages assembled from existing cultural elements.
    mechanism: Artists began incorporating pre-existing cultural materials (photographs,
      printed images, fragments) into new compositions, applying industrial-era methods
      of assembly and recombination rather than traditional artisan craftsmanship.
    boundary: Applies specifically to the 1910s onward when artists first adopted
      mass-produced cultural elements as raw materials for artistic creation. Does
      not apply to earlier periods or to purely traditional artisan methods.
  expected_classification:
    depth: domain
- id: 19b9270c08715b213ecbc7dd0fc2931c47b638fdd3885a5b7aaaf1345ab0893c
  input_fb:
    name: Archetypal Symbol Function in Modern Psychology
    definition: The principle that archetypal symbols in dreams and art maintain their
      psychological significance across cultures and time periods, serving as bridges
      between ancient mythological understanding and modern psychological interpretation.
    mechanism: Archetypal symbols function as universal psychological patterns that
      connect individual unconscious processes to broader cultural and historical
      symbolic traditions, enabling interpretation through both historical context
      and personal meaning.
    boundary: Applies when interpreting symbols that connect individual psychological
      experiences to broader archetypal patterns across cultures and time periods.
      Fails when symbols are interpreted only through modern rational frameworks or
      cultural bias.
  expected_classification:
    depth: cross-domain
- id: 018849255ea3653b036c7bf176bd175a76f86fa235a171deedb1f44ab879b7aa
  input_fb:
    name: Modular Design As Tactical Adaptation
    definition: Modular design enables repeated tactical adaptation and modification
      of systems in response to operational demands or constraints, allowing users
      to bypass limitations or extend functionality through interchangeable components.
      This design approach creates a persistent capacity for change and customization
      that transcends the original system's intended scope.
    mechanism: Modular design provides a framework where system components can be
      swapped, added, or modified without requiring complete system redesign. This
      enables users to adapt the system to new conditions or requirements through
      incremental changes, creating a dynamic relationship between the system's structure
      and its evolving use. The modularity becomes a resource for ongoing adaptation
      rather than a fixed constraint.
    boundary: Applies when a system's design includes interchangeable or replaceable
      components that enable functional modification or extension. Fails when components
      are tightly coupled or when the system's architecture does not support component
      substitution or addition.
  expected_classification:
    depth: cross-domain
- id: f809b580cc94559854128742953694ea9bb27250d538138e8b74ae62397aea44
  input_fb:
    name: Illustration As Cultural and Communicative Medium
    definition: Illustration functions as both a cultural artifact and a communication
      tool that bridges visual and textual understanding. It operates across multiple
      contexts—journalism, scientific documentation, children's literature, and artistic
      expression—while maintaining consistent structural and interpretive properties.
    mechanism: Illustration serves as a hybrid medium that combines visual representation
      with narrative or informational content, enabling cross-domain communication.
      It adapts to different cultural and institutional contexts (e.g., scientific,
      journalistic, artistic) while preserving its core function of enhancing comprehension
      through visual means. The medium's flexibility allows it to be shaped by the
      needs of its audience and the constraints of its medium (e.g., publication format,
      target readership).
    boundary: Applies when illustration is used to convey meaning beyond pure decoration
      or illustration as a standalone art form. Fails when illustration is purely
      ornamental or detached from communicative or cultural function, such as in abstract
      or purely aesthetic contexts.
  expected_classification:
    depth: cross-domain
- id: c0d80d4e18486d8a28bb8a641713383da213e864f53f2f438aa13285e1e13924
  input_fb:
    name: Sucker-nonsucker Distinction
    definition: A philosophical distinction between those who accept and act on the
      fundamental nonlinearities and uncertainties of systems versus those who ignore
      them, treating them as if they were linear or predictable.
    mechanism: 'The distinction operates through the lens of how actors approach risk
      and complexity: nonsuckers recognize and prepare for nonlinear effects, while
      suckers treat systems as if they follow linear patterns, leading to fragility
      and eventual failure.'
    boundary: Applies to systems where nonlinearities and volatility create unpredictable
      outcomes. Fails when actors treat all systems as linear or when the complexity
      is not recognized.
  expected_classification:
    depth: cross-domain
- id: 289756784eaf42043216267c05283edf428f2e699b23f3079b9f7bc5e3ef24f1
  input_fb:
    name: Reasoning As Structured Problem-solving
    definition: Reasoning in AI systems involves breaking down complex problems into
      logical steps, applying structured thinking to navigate uncertainty, and iteratively
      improving responses through self-evaluation. This approach enables systems to
      move beyond pattern recognition toward human-like problem-solving.
    mechanism: 'This is a practical heuristic: systematically decomposing problems
      into manageable steps, applying structured logic, and refining solutions through
      iterative evaluation. The process includes defining key reasoning steps, executing
      them sequentially, and using self-contextualization to extend knowledge beyond
      training. It is a method for enhancing LLM capabilities through structured cognitive
      processes rather than a verified causal chain.'
    boundary: Applies when systems can benefit from structured decomposition and iterative
      refinement. Fails when problems are too simple to require step-by-step analysis
      or when the system lacks the capacity for self-evaluation and adjustment. Also
      fails in domains where rigid structure prevents creative or adaptive responses.
  expected_classification:
    depth: domain
- id: adf4b2b421eeefb9cabc0c94096a984b65ac4b7bce80e07af2982b732461a697
  input_fb:
    name: Systemic Vulnerability and Adaptive Response
    definition: Complex systems face increasing instability when they fail to adapt
      to new challenges, leading to cascading failures that threaten their viability.
      The principle describes how systemic vulnerabilities—whether in social structures,
      environmental conditions, or human behaviors—can compound into crises when responses
      are inadequate or rigid.
    mechanism: 'This is an empirical pattern, not a causal mechanism. Systems that
      are exposed to new pressures (climate change, social shifts, behavioral rigidity)
      show increasing instability when they rely on outdated models or fail to evolve.
      The pattern emerges across domains: from climate instability to societal adaptation
      failures, where the same root issue—resistance to change or lack of adaptive
      capacity—repeats. The evidence shows that systems with high complexity and interdependence
      are particularly susceptible to these failures when they do not cultivate resilience
      or flexibility.'
    boundary: Applies to complex systems with multiple interdependent components and
      evolving external pressures. Fails when the system is simple, stable, or not
      subject to external change, or when adaptation is not constrained by structural
      limitations or human behavior.
  expected_classification:
    depth: cross-domain
- id: 1029697c662bedaf63de8fff3e08228663d50cd976b312cb185e3cdae1b5b8de
  input_fb:
    name: Fibonacci Sequence and Quasi-crystals
    definition: A mathematical relationship between the Fibonacci sequence and the
      properties of quasi-crystals, where the Fibonacci sequence demonstrates long-range
      order from neighborly interactions without periodicity.
    mechanism: 'The Fibonacci sequence exhibits the same mathematical property as
      quasi-crystals: producing long-range order through neighborly interactions without
      resulting in fully periodic structures, showing a direct mathematical correspondence
      between the sequence and physical crystallographic properties.'
    boundary: Applies to the mathematical correspondence between the Fibonacci sequence
      and quasi-crystal properties in physical systems. Fails when the mathematical
      relationship does not hold or when the physical system does not exhibit the
      described properties.
  expected_classification:
    depth: cross-domain
- id: 14978863dc3670b3000572271073df78dfd8e5ecf25bffb30d775f0bd778affb
  input_fb:
    name: Maximum Entropy Principle in Decision Making
    definition: The application of probability theory with prior probabilities determined
      by the principle of maximum entropy, which leads to reasonable methods for treating
      decision problems and results that correspond with common sense.
    mechanism: The principle of maximum entropy provides a method for determining
      prior probabilities that leads to mathematical equations equivalent to Gibbs
      formalism in statistical mechanics, but with broader applicability than previously
      recognized.
    boundary: Applies to decision problems where probability theory can be extended
      beyond traditional frequentist interpretations. Fails when the formalism is
      applied without proper interpretation or when the broader Laplace-Jeffreys interpretation
      is not recognized.
  expected_classification:
    depth: cross-domain
- id: 19a7c9c8c3037f6b2ea7de915f3813bdeec1b291d629a9a35ce6dc02ca8f7d8d
  input_fb:
    name: Live Performance Adaptation Principle
    definition: Live performance maintains its unique vitality through the constant
      possibility of change and unpredictability that digital media can introduce
      into the theatrical environment.
    mechanism: Digital media's capacity to create dynamic, adaptable environments
      allows live performances to continuously evolve and respond to real-time conditions,
      maintaining their unique 'live' quality that precludes perfect replication.
    boundary: Applies specifically to live theatrical performance where real-time
      adaptation and changeability are central to the art form. Does not apply to
      fixed media like film or pre-recorded television.
  expected_classification:
    depth: domain
- id: 889935b8cb42e0b615425f1feb0073ffc7dba1a710baffa8acd5c77e616dff02
  input_fb:
    name: Metaform Mapping
    definition: Meaningful communicative elements (verbs, tones, gestures) map to
      abstract conceptual structures that encode emotional or relational states. These
      mappings are culturally grounded yet exhibit cross-domain consistency in how
      they encode abstract meanings.
    mechanism: This is a descriptive model of how communicative forms relate to conceptual
      structures. The mapping operates through metaphorical and metonymic extensions
      from physical or sensory experience to abstract domains. For example, upward
      motion in gesture or higher pitch in tone becomes associated with positive or
      expansive concepts like growth or happiness, while downward motion or lower
      pitch becomes associated with negative or contracting concepts like sadness
      or decline.
    boundary: Applies when communicative elements (verbs, tones, gestures) are used
      to express abstract meanings rather than purely functional or referential content.
      Fails when communicative elements are used only for literal description or direct
      reference to objects or actions without metaphorical or symbolic extension.
  expected_classification:
    depth: cross-domain
- id: ca6127da2bcf0f37ae83220d295ad81764fee3cb5d6aacaa4ba2857ada2287a1
  input_fb:
    name: Rhetorical Method Synthesis
    definition: A research approach that synthesizes multiple scholarly traditions
      and theoretical frameworks to create a comprehensive methodological framework
      for visual rhetoric analysis.
    mechanism: The method combines principles from actor-network theory, new materialism,
      process philosophy, and other theoretical traditions to create a unified approach
      that builds upon existing scholarship rather than creating entirely new concepts.
    boundary: Applies when scholars synthesize multiple theoretical frameworks into
      a coherent research method. Fails when scholars merely reference multiple traditions
      without integration.
  expected_classification:
    depth: domain
- id: 589a92e48dc9247da1baac5a4450be4188a28534e49e8d642f73cded504cc7e6
  input_fb:
    name: Community-Based Participatory Research (CBPR) and Critical Grounded Theory
    definition: A collaborative research approach that combines community-based participatory
      research methods with critical grounded theory principles to create space for
      multiple perspectives and local ways of knowing.
    mechanism: The method integrates CBPR's community-centered, participatory approach
      with CGT's systematic data analysis and theoretical development, allowing researchers
      to work across different positionalities, identities, and historical contexts
      while maintaining attention to difference and polyvocality.
    boundary: Applies when researchers work collaboratively with community members
      who have lived experience and historical connection to the research context.
      Fails when researchers do not engage with community voices or when the community
      is not meaningfully involved in the research process.
  expected_classification:
    depth: domain
- id: e34854fec2c17f215b0cb23060e2ecc28b1cab59f65686d14a9db89ef42ca6f6
  input_fb:
    name: Fractal Self-similarity Pattern
    definition: A fractal is a geometric pattern that repeats at multiple scales,
      where smaller parts resemble the whole structure. This self-similarity occurs
      across different levels of magnification and is found in both natural and abstract
      systems.
    mechanism: Fractals exhibit self-similarity because their constituent parts are
      geometrically scaled-down versions of the whole, creating recursive patterns
      that maintain structural similarity across scales. The repetition of similar
      shapes or arrangements at different levels of magnification is a defining characteristic
      of fractal geometry.
    boundary: Applies when geometric patterns maintain structural similarity across
      multiple scales. Fails when patterns do not exhibit recursive repetition or
      when the relationship between parts and whole is not geometrically consistent.
  expected_classification:
    depth: cross-domain
- id: 06f397e33c113759ced4e2642bdd2f18acc587bfdbb4500072f21635bab9c8aa
  input_fb:
    name: Wood Engraving Technique in Illustration
    definition: A printmaking method where illustrations are cut into wooden blocks
      by professional engravers and then printed rapidly on steam presses, pioneered
      by Thomas Bewick in the 1790s.
    mechanism: Professional engravers carve illustrations into wooden blocks, which
      are then pressed onto paper using steam-powered printing presses, enabling rapid
      mass production of images.
    boundary: Applies to illustration production in the 19th century when steam presses
      were available. Fails when the technology or skilled engravers are not accessible.
  expected_classification:
    depth: specialized
- id: cc03be99f8466c48e1cd213f18083b9940b9bd70ce10f54f79ffc9930e35b92a
  input_fb:
    name: Metaphor-driven Design Process
    definition: Using metaphors as a creative catalyst in design thinking enables
      teams to recognize connections between seemingly disparate concepts and translate
      abstract ideas into tangible, relatable user experiences. The process involves
      crafting stories that embed meaningful metaphors to guide feature development
      and user engagement.
    mechanism: When designers engage with metaphors, they activate a creative cognitive
      process that bridges conceptual gaps between the design challenge and familiar
      domains. This process allows teams to identify and articulate connections between
      abstract user needs and concrete design elements, such as how a 'toxin scale'
      metaphor translates into a measurable feedback system. The metaphor serves as
      an anchor that makes abstract concepts like health tracking or personal transformation
      more accessible and actionable in the final product.
    boundary: Applies when design teams are working with abstract or complex user
      needs that benefit from conceptual anchoring. Fails when the metaphor is forced
      or irrelevant to the actual user context, or when teams rely on metaphors without
      grounding them in real user insights and behavioral data.
  expected_classification:
    depth: domain
- id: f1cedcc03452e761837ca2d3ca77f824048719763250e0af66898c520dc675e4
  input_fb:
    name: Creative Coding Community
    definition: Creative coding is a domain where technical expertise intersects with
      artistic expression, fostering innovation through interdisciplinary collaboration
      between software developers, human-computer interaction specialists, and visual
      artists. This community produces work that bridges technology and creativity,
      often gaining recognition in mainstream media and entertainment.
    mechanism: The community emerges from individuals who combine technical skills
      with creative vision, enabling them to develop novel applications of technology
      in artistic contexts. These practitioners often work across multiple domains—software
      development, interaction design, and visual arts—creating projects that are
      both technically sophisticated and aesthetically compelling. The resulting work
      gains visibility through media channels that value both innovation and artistic
      merit.
    boundary: Applies when individuals combine technical programming skills with creative
      artistic goals. Fails when practitioners are solely focused on either pure technical
      implementation or pure artistic expression without the intersection of both
      domains.
  expected_classification:
    depth: cross-domain
- id: ad367044ff24befe6734edb9f246dc35d235d4c12424cf675a354cc7d4490ac6
  input_fb:
    name: Theosophy and Spiritual Audio-visual Synchronization
    definition: A spiritual and mystical approach to audio-visual art that employs
      synesthetic means to heighten spiritual manifestations or evoke mystical experience,
      particularly in early 20th-century works.
    mechanism: Theosophy's quasi-spiritual and quasi-philosophical framework connects
      with mystical experience, where audio-visual synchronization serves as a medium
      for spiritual expression through synesthetic techniques that blend sensory modalities.
    boundary: Applies to early 20th-century audio-visual artists who were influenced
      by theosophy and sought spiritual or mystical outcomes. Fails when the work
      lacks spiritual or mystical intent or when synesthetic techniques are not employed.
  expected_classification:
    depth: specialized
- id: fdba604ec26ee550325fcbad391e8bb626837acf1c850fdbefba136363da937a
  input_fb:
    name: Cognitive Semiotics of Picture Signs
    definition: An interdisciplinary approach combining semiotics and cognitive science
      to study picture signs as distinct objects of perception and analysis, distinct
      from art history and traditional psychology.
    mechanism: The approach recognizes that pictures emerge as a unique category of
      perceptual object in psychology and semiotics, requiring specific analytical
      methods that differ from both art historical analysis and mathematical correlation
      studies in natural sciences.
    boundary: Applies to the study of picture signs as distinct perceptual objects
      in cognitive semiotics. Fails when applied to other types of visual media or
      when conflated with art history or natural science approaches.
  expected_classification:
    depth: cross-domain
- id: 1fe9bd655e4a2df3e2c2bb356d46d2535716351641a4707076109d076cbae5ee
  input_fb:
    name: Design Interactions Exhibition Approach
    definition: A design methodology that explores the social, ethical, and political
      implications of emerging technologies by creating speculative artifacts that
      provoke critical reflection on their potential uses and consequences.
    mechanism: Designers create artifacts that demonstrate potential futures or alternative
      scenarios, allowing stakeholders to experience and reflect on the implications
      of new technologies before they are fully realized.
    boundary: Applies when designers engage with scientists and stakeholders to explore
      implications rather than simply focusing on technical applications. Fails when
      the approach is purely technical or when ethical considerations are ignored.
  expected_classification:
    depth: domain
- id: 01ab928238a03072cdb18a5bebc65c5b11d2a7a8129b439e465dd9face7353da
  input_fb:
    name: Social Media Strategy Implementation
    definition: A systematic approach to establishing and managing social media presence
      for business development and client acquisition.
    mechanism: The strategy involves creating new social profiles or utilizing existing
      ones, cleaning up content, selecting appropriate platforms, planning content
      calendars, and actively engaging with potential clients through direct outreach
      and community building.
    boundary: Applies to businesses seeking to establish or improve their social media
      presence for client acquisition. Fails when the business lacks the time or resources
      to maintain consistent engagement or when the chosen platforms don't align with
      the target audience.
  expected_classification:
    depth: domain
- id: 3fe562635cf32708a1bdb543e5750f56c8ebf7f9171fc740bcc9aae337caea72
  input_fb:
    name: Empirical Method Over Theory
    definition: The empirical approach to knowledge and practice prioritizes direct
      observation, experimentation, and evidence over theoretical reasoning or prior
      beliefs. This method is particularly effective in domains where theory is incomplete
      or where practical results are more reliable than abstract models.
    mechanism: The empirical method works by observing outcomes directly and adjusting
      practices based on what works in real-world application. It relies on iterative
      experimentation and feedback loops rather than formalized theory or preconceived
      models. This approach is especially powerful in complex systems where theoretical
      understanding is limited or where prior assumptions are misleading.
    boundary: Applies when practical outcomes can be measured and adjusted based on
      results. Fails when the system is too simple to benefit from experimentation
      or when theory provides necessary predictive power that cannot be empirically
      derived.
  expected_classification:
    depth: universal
- id: bed684c5cb461e69904d176a92ccc192380cfd70daafd645936b5d2a767ebf5b
  input_fb:
    name: Extended Disorder Family
    definition: A taxonomy of concepts related to uncertainty, variability, and disorder
      that are functionally equivalent in their impact on systems.
    mechanism: The taxonomy categorizes various forms of disorder and uncertainty
      (uncertainty, variability, imperfect knowledge, chance, chaos, volatility, disorder,
      entropy, time, unknown, randomness, turmoil, stressor, error, dispersion of
      outcomes, unknowledge) as functionally equivalent in their effect on antifragile
      systems.
    boundary: Applies to systems theory and antifragility concepts in understanding
      how disorder affects systems. Fails when the concepts are not functionally equivalent
      or when the taxonomy doesn't account for all relevant types of disorder.
  expected_classification:
    depth: domain
- id: 01b8a37df35da7328610747b65eefb68fd3f42a3bace264b4891a04ed65a2857
  input_fb:
    name: Fragility and Antifragility Concept
    definition: A principle that describes systems or entities that are vulnerable
      to shocks but can be made more robust through understanding and preparation
      for fragility.
    mechanism: The principle operates through the recognition that systems with inherent
      fragility can be identified and made antifragile through understanding of their
      vulnerability patterns and preparation for potential shocks.
    boundary: Applies to systems where fragility can be identified and measured, particularly
      in financial and organizational contexts. Fails when applied to systems where
      fragility cannot be quantified or when the system is not susceptible to specific
      types of shocks.
  expected_classification:
    depth: cross-domain
- id: 3902f208cebef7037e6066f8854f01b0b5d448b8b1b958c4f168a04c9527f785
  input_fb:
    name: Behavioral Response Variability
    definition: Systemantic behavior responds to complexity by generating diverse
      responses that increase options rather than following rigid rules. This principle
      describes how systems naturally evolve toward flexibility and adaptability in
      the face of uncertainty.
    mechanism: 'The principle operates as a descriptive model of system behavior:
      when systems encounter complexity or constraints, they generate multiple potential
      responses rather than selecting a single predetermined path. These varied responses
      are not necessarily optimal but serve to maintain flexibility and expand future
      possibilities. The mechanism is structural and organizational rather than causal
      — it describes how systems naturally organize their responses rather than explaining
      why one response is preferred over another.'
    boundary: Applies when systems face uncertainty, constraints, or complex environments
      where rigid rules fail. Fails when systems operate under well-defined, stable
      conditions where single optimal responses can be determined. Also fails when
      systems lack the capacity for variation or when responses are artificially constrained
      by external forces.
  expected_classification:
    depth: cross-domain
- id: 9fc02d56f229477becca40c2c3843559bef1ed627ae510747a715f4af6d658ac
  input_fb:
    name: Log-log Law for Data Visualization
    definition: A principle stating that any set of data points will form a straight
      line when plotted on log-log paper, which is a mathematical transformation technique
      for data visualization.
    mechanism: The log-log transformation compresses the scale of both axes using
      logarithmic functions, which can linearize power-law relationships and make
      exponential patterns appear as straight lines in the transformed space.
    boundary: Applies to data visualization when examining power-law or exponential
      relationships. Fails when the data does not follow power-law patterns or when
      the transformation obscures other important features.
  expected_classification:
    depth: domain
- id: 8cf8d4c58e268570e696feaf7aa8b5d900039e12161d2bd975a2405ad201ab3f
  input_fb:
    name: Focal Point Selection
    definition: In situations with multiple viable options and no clear objective
      criteria, decision-makers gravitate toward easily identifiable focal points
      to coordinate choices and reduce uncertainty. This principle describes how human
      coordination mechanisms rely on shared reference points rather than purely rational
      optimization.
    mechanism: When faced with a set of indistinguishable or nearly equivalent options,
      individuals seek out salient, distinctive features that serve as focal points
      for decision-making. These focal points are often arbitrary but become self-reinforcing
      through social convention or shared cognitive framing. The process involves
      identifying a feature that stands out from the crowd, even if it has no inherent
      relevance to the decision at hand.
    boundary: Applies when multiple options are functionally equivalent or nearly
      so, and no objective criteria can break the tie. Fails when there are clear,
      measurable differences between options that can be used to make rational choices,
      or when the focal point is not shared or recognized by the relevant decision-makers.
  expected_classification:
    depth: cross-domain
- id: 0069df4001cb163b8bf8dc34dc4ebc168e80a4b2212c2ff0362ae52ed20dc77a
  input_fb:
    name: Long-term Time Horizon Advantage
    definition: Systems that operate with extended time horizons—spanning multiple
      generations or long-term consequences—demonstrate superior resilience, adaptability,
      and survival outcomes compared to systems optimized for short-term gains or
      immediate returns. This principle reflects a fundamental tension between temporal
      discounting and systemic stability.
    mechanism: This is an empirical pattern, not a causal mechanism. The principle
      describes a correlation between time horizon length and system performance across
      diverse contexts (from biological ecosystems to economic systems). Systems with
      longer time horizons tend to exhibit more stable, adaptive, and sustainable
      behaviors because they are less susceptible to short-term pressures that can
      destabilize or misalign decision-making. The pattern is observed in both natural
      and human-designed systems where extended planning horizons lead to better outcomes.
    boundary: Applies when systems can meaningfully incorporate future states into
      current decision-making processes. Fails when systems are constrained by rigid
      time constraints, short-term performance metrics, or irreversible commitments
      that preclude long-term consideration. Also fails in environments where external
      shocks occur faster than the system can adapt or where feedback loops are too
      delayed to influence current decisions.
  expected_classification:
    depth: cross-domain
- id: e5007bb61b4081d8b18366d99fc5a9dd3f0d1ea186c0d433fd735ba6bd8d6a38
  input_fb:
    name: Visual Data Structuring
    definition: Organizing raw data into structured visual formats enables rapid comparison,
      ranking, and pattern recognition by transforming unstructured information into
      perceptually accessible representations. The principle describes how visual
      structuring techniques make abstract numerical relationships concrete and immediately
      interpretable.
    mechanism: Visual structuring works by mapping numerical data onto spatial coordinates
      and categorical groupings that align with human perceptual processing. When
      data is presented in organized visual formats (charts, graphs, slopegraphs),
      the brain can process multiple data points simultaneously through pattern recognition
      rather than sequential counting or calculation. This transformation from raw
      numbers to visual elements leverages cognitive strengths in spatial reasoning
      and comparative judgment.
    boundary: Applies when data contains multiple values or categories that benefit
      from visual comparison. Fails when data is purely descriptive or narrative without
      numerical relationships to compare, or when the visual format doesn't align
      with the audience's cognitive processing capabilities.
  expected_classification:
    depth: domain
- id: 8349dea016320b5d702c066592c7942d200d90cfd249d2012bbe9d00205ffdd1
  input_fb:
    name: Recursive Design Systems in Art and Architecture
    definition: A design approach that uses recursive systems to create rhythmic patterns
      and structurally sound compositions.
    mechanism: Recursive systems in design create patterns through repeated application
      of rules, generating rhythmic lines in art and structurally sound compositions
      in architecture through the use of rotated concentric squares and repeated geometric
      elements.
    boundary: Applies to artistic and architectural design where recursive patterns
      can be generated through rule-based systems. Fails when the design system does
      not support recursive generation or when the patterns do not maintain structural
      integrity.
  expected_classification:
    depth: cross-domain
- id: 03f5652ac402a3bc3028b789c7c4e3182efc21e52ca7a9f4195a53919ef09090
  input_fb:
    name: Bullying and Revenge Violence Mechanism
    definition: A causal mechanism linking bullying to violent revenge actions, where
      victims with fixed mindsets may escalate to violence as a response to perceived
      injustice.
    mechanism: Bullying creates low self-esteem in victims, who then seek revenge
      through violence as a way to regain power and status. This process is amplified
      when victims have fixed mindsets that view the world in binary terms of 'judging
      back' rather than forgiveness or constructive action.
    boundary: Applies to cases where bullying has created victims with fixed mindsets
      who perceive violence as a legitimate response to injustice. Fails when victims
      have growth mindsets or when the bullying is not severe enough to trigger revenge.
  expected_classification:
    depth: domain
- id: 520d4c2e1a1bbbd6793dac1a236526b144324b7a7eca538dcb6927f75b9275f3
  input_fb:
    name: Pattern Recognition and Intuitive Learning
    definition: The principle that intuition and creative insight emerge from years
      of pattern recognition and that our brains are wired to seek out familiar patterns
      and stimuli.
    mechanism: Human intuition develops through extensive pattern recognition over
      time, where neural pathways become conditioned to respond to specific stimuli.
      When we encounter new situations, our brains seek out familiar patterns that
      activate these conditioned pathways, creating the sense of intuitive understanding.
    boundary: Applies to human cognitive processes where pattern recognition builds
      over time to create intuitive understanding. Fails when individuals don't recognize
      the role of past experience in shaping current intuition or when they dismiss
      intuitive insights as mere guesswork.
  expected_classification:
    depth: domain
- id: 8e5ea4985caf1a24e4c375bfd60586d83f146b0657d28445c36b65c85830e827
  input_fb:
    name: Cross-disciplinary Evidence-based Policymaking Framework
    definition: A collaborative approach that integrates engineering practices with
      social science methodologies to create more effective government policies through
      data-driven decision-making.
    mechanism: The framework combines big data processing, complex interaction modeling,
      and human context understanding to address policy challenges that no single
      discipline can solve alone, with AI serving as a bridge between different methodological
      approaches.
    boundary: Applies to government policy design and implementation where cross-disciplinary
      collaboration is needed. Fails when there is insufficient coordination between
      disciplines or when technical implementation tools are not properly integrated.
  expected_classification:
    depth: cross-domain
- id: 23eb11e70734c86e10e112f092b634db50081a872bc11fc5e36d6970674b20ff
  input_fb:
    name: Philosopher's Stone As Conceptual Framework
    definition: A metaphorical framework for understanding how to achieve value through
      transformation, drawing parallels between medieval alchemy's search for the
      philosopher's stone and modern financial concepts of optionality and convexity.
    mechanism: The concept of the philosopher's stone represents the idealized transformation
      process that converts base elements into valuable outcomes, analogous to how
      optionality and convexity in financial markets can transform risk into advantage
      through the proper application of mathematical principles.
    boundary: Applies to the conceptual metaphor of alchemical transformation in modern
      financial contexts. Fails when the mathematical properties of optionality and
      convexity do not align with the principles of transformation or when the metaphor
      breaks down in practical application.
  expected_classification:
    depth: cross-domain
- id: 570011ca89d6e00bf8a79d4ce3c2bc5d52802631921beb4f8896a0a87d1fe22e
  input_fb:
    name: Logical Vs Mathematical Approach to Scientific Problems
    definition: A principle distinguishing between logical reasoning and mathematical
      modeling in scientific inquiry, emphasizing that logical frameworks provide
      stronger foundations than mathematical ones alone.
    mechanism: Scientific understanding requires logical frameworks that establish
      fundamental principles before applying mathematical models, since mathematical
      models can be misleading when they don't rest on solid logical foundations.
    boundary: Applies to scientific methodology where qualitative understanding precedes
      quantitative measurement. Fails when mathematical approaches are the only valid
      method for scientific inquiry or when logical reasoning is insufficient for
      complex problems.
  expected_classification:
    depth: domain
- id: b5a142c9971921ee16f3137645f014ce783c018cec241f291d227aaca076dd8a
  input_fb:
    name: Adaptive Systems Thinking Approach
    definition: A systems thinking methodology for managing complex adaptive systems
      where individuals act as a superorganism, requiring simple rules and intrinsic
      motivation rather than micromanagement.
    mechanism: Complex adaptive systems function effectively when participants follow
      simple, adaptable rules while maintaining intrinsic motivation, allowing emergent
      behavior to solve problems in dynamic environments rather than relying on top-down
      control.
    boundary: Applies to complex adaptive systems where emergent behavior is beneficial.
      Fails when rigid control structures or overly complex rules prevent adaptive
      responses to changing conditions.
  expected_classification:
    depth: cross-domain
- id: 1a51226f1084ae32bc1dff2556eb328a1278c6a94091b5f6e1443aaa6ed0fbd8
  input_fb:
    name: Galton Quincunx Normal Distribution
    definition: A physical apparatus that demonstrates how random marble drops through
      a grid of pins create a normal distribution of outcomes, with the mean approximating
      the theoretical value as more marbles are used.
    mechanism: Marbles fall through a grid of pins arranged in a triangular pattern,
      with each marble having equal probability of bouncing left or right at each
      pin. This random walk process creates a bell curve distribution centered around
      the mean.
    boundary: Applies when marbles are dropped from a consistent height and position
      through a properly constructed pin grid. Fails when the setup is inconsistent
      or when external factors influence marble paths.
  expected_classification:
    depth: domain
- id: 092db92b21461e367a76993d95f63309082aa340049d278409b65028e9ba6ec4
  input_fb:
    name: Asterisk Symbol Usage
    definition: The asterisk symbol (*) is a versatile graphic symbol used across
      multiple domains including philology, mathematics, and bibliographical work
      to mark hypothetical reconstructions, indicate nonconjunction, and serve as
      a technical font consistency marker.
    mechanism: The asterisk functions as a standardized symbol that appears in Sumerian
      pictographic writing and has maintained continuous use for at least 5,000 years,
      serving different semantic functions depending on context - marking hypothetical
      forms in philology, indicating mathematical operations, or serving as a bibliographical
      marker.
    boundary: Applies across multiple disciplines and historical periods but maintains
      consistent visual form. Fails to function as a marker when used outside its
      recognized technical contexts or when font consistency is not maintained.
  expected_classification:
    depth: cross-domain
- id: 833c495107c4bce80eacb8dd50aa71c5966aba231bb23ae11f24faa8c0de559a
  input_fb:
    name: Cartographic Gaze and Surveillance
    definition: The cartographic gaze refers to the perspective of mapmakers and observers
      who view and represent space from a position of elevated control, often mirroring
      divine or omniscient observation. This gaze is historically tied to institutional
      power and surveillance, functioning as both a tool of domination and a mechanism
      for social order.
    mechanism: The cartographic gaze operates through the positioning of the observer
      above the observed, enabling a comprehensive view that translates into control
      over the mapped territory. This perspective is not neutral—it reflects and reinforces
      power structures by allowing the mapper to see and regulate the mapped. The
      gaze becomes a form of surveillance that enables governance, whether through
      panoptic architecture or cartographic representation.
    boundary: Applies when spatial representation is used to assert control or observe
      populations. Fails when maps are purely descriptive or used for navigation without
      power implications.
  expected_classification:
    depth: cross-domain
- id: 64aa7982c9505fcc27e62581a50102e15ba0fc76bdce6c3b2113515b4db8a111
  input_fb:
    name: Agent-centric Economic Incentives
    definition: Economic mechanisms and incentive structures are designed to align
      the behavior of autonomous AI agents with system-wide goals while enabling decentralized
      participation and resource allocation. These systems leverage tokenized rewards
      and decentralized governance to motivate agents to act in collectively beneficial
      ways.
    mechanism: Incentive design in agentic systems operates through tokenized reward
      mechanisms that directly correlate agent actions with system value creation.
      Agents are motivated to contribute to shared objectives (e.g., model training,
      data validation, protocol compliance) by receiving tokens or other digital assets
      that increase their utility or market value. These mechanisms function as a
      form of decentralized economic coordination, where individual agent interests
      align with broader ecosystem goals through programmable reward structures.
    boundary: Applies when autonomous agents operate in decentralized or distributed
      systems where individual actions can be tracked and rewarded. Fails when agents
      are not individually identifiable or when reward systems cannot distinguish
      between beneficial and harmful agent behaviors.
  expected_classification:
    depth: cross-domain
- id: 049f59021e8eae629798ec3dcb9b02436f51c98b34900bca9c419bb072b37429
  input_fb:
    name: Interview As Intellectual Framework
    definition: The structured format of an interview creates a framework that encourages
      deeper listening and more thoughtful responses by altering the perceived stakes
      and providing a clear questioning structure.
    mechanism: The interview format, whether involving recording equipment or simple
      note-taking tools, establishes a formal context that gives the interviewer permission
      to ask probing questions and creates a structured environment for meaningful
      dialogue.
    boundary: Applies when the interview structure is used to encourage deeper engagement
      and understanding. Fails when the structure is merely procedural without changing
      the fundamental approach to questioning.
  expected_classification:
    depth: cross-domain
- id: 21ad19db3b1511fedef6bfd170b05e39b9f7beef8315aa7ff6f982941c59ad73
  input_fb:
    name: Mental Model Synthesis
    definition: Effective thinking emerges from synthesizing insights across multiple
      disciplines and perspectives rather than relying on single-domain expertise.
      The principle describes a method for building comprehensive understanding by
      drawing from diverse sources of wisdom.
    mechanism: 'This is a normative heuristic: combining insights from different thinkers,
      domains, and historical contexts increases the likelihood of identifying robust
      patterns and avoiding narrow blind spots. The process involves actively seeking
      out diverse perspectives and integrating them into a coherent framework of understanding.'
    boundary: Applies when multiple disciplines or perspectives offer complementary
      insights that can be meaningfully integrated. Fails when the sources are too
      disparate to find meaningful connections or when integration leads to contradictory
      conclusions without resolution.
  expected_classification:
    depth: cross-domain
- id: f1dd5581375b35e3abbee00e2e9ce0afb5715d47f2e697707b2ce09a206ca939
  input_fb:
    name: Social Nature of Ai Intelligence
    definition: AI intelligence emerges not spontaneously but through social processes,
      reflecting collective human behavior and participation rather than individual
      cognition.
    mechanism: AI systems embody collective human knowledge and practices through
      machine learning algorithms that process and reproduce patterns from human-generated
      data, making them manifestations of plural human agency rather than individual
      intelligence.
    boundary: Applies when AI systems are trained on human-generated content or collective
      behavioral data. Fails when AI operates independently without human input or
      collective influence.
  expected_classification:
    depth: cross-domain
- id: b794c4afbf704235c7ce30e37e04968ea1e5cf822c38af909b6286ea96626ec3
  input_fb:
    name: Mythic Renewal Cycle
    definition: Cultural and psychological systems undergo cyclical transformation
      through three stages—divine, heroic, and egalitarian—driven by the restless
      human need for meaning and renewal. This cycle reflects a fundamental pattern
      in human experience where mythic structures provide metaphysical frameworks
      that evolve through stages of divine inspiration, heroic action, and societal
      equality.
    mechanism: The cycle emerges from the human capacity for mythic thinking and the
      need to constantly invent new meanings. In each stage, the mythic fantasia creates
      symbolic structures that give the world metaphysical meaning—first through divine
      figures, then through heroic narratives, and finally through egalitarian systems.
      The cycle is not merely descriptive but reflects an essential dynamic in human
      consciousness and cultural development.
    boundary: Applies when human systems are structured around mythic meaning-making
      and cultural evolution. Fails when systems are purely rational, utilitarian,
      or devoid of symbolic or mythic content. Also fails in cultures that do not
      recognize stages of development or do not value mythic renewal.
  expected_classification:
    depth: domain
- id: 2d1011347250500fcfcf7b445cb1c615d1e04787a79440d1d7dd28c28b4ad844
  input_fb:
    name: Logit-based Token Selection
    definition: Language models generate logits as raw numerical outputs for each
      possible token in their vocabulary, which can be converted into probabilities
      to guide token selection. These logits represent the model's internal confidence
      scores for each token, enabling both deterministic and probabilistic sampling
      strategies.
    mechanism: Logits are the unnormalized log-probabilities output by language models
      for each token in their vocabulary. These values can be transformed into probabilities
      using softmax or other normalization methods. The model's internal processing
      generates these logits based on input context and learned parameters, with higher
      logits indicating higher likelihood of selection. Token selection can be deterministic
      (choosing the highest logit) or stochastic (sampling from the probability distribution),
      with sampling methods like top-k and top-p modifying the probability distribution
      before selection.
    boundary: Applies when models output discrete token probabilities as numerical
      logits. Fails when models use continuous representations or when logits are
      not exposed to the user (e.g., some commercial APIs disable logit access). Also
      fails for models that do not use token-level probability distributions as their
      core output mechanism.
  expected_classification:
    depth: domain
- id: 4530db7244ba252be7aa4484febc9c3af065cd7224d510f436300be44f4e9d21
  input_fb:
    name: Collaborative Infographic Production
    definition: Infographic creation today often involves multiple specialists working
      together, combining their unique expertise in programming, animation, and geographic
      information systems to produce complex visual content.
    mechanism: The collaborative approach leverages individual strengths across different
      domains - technical programming, visual animation, and spatial mapping - to
      create comprehensive infographics that no single person could produce alone.
    boundary: Applies when infographics require specialized technical skills beyond
      individual expertise. Fails when the project can be completed by one person
      with sufficient skills in all required areas.
  expected_classification:
    depth: domain
- id: 2796c8883d2f1860ec9cb61a032a8ec2af2f686a65ba8de1d67a982d8caabb8b
  input_fb:
    name: Antifragility Detection Method
    definition: A method for detecting fragility in systems by analyzing the underlying
      nonlinearities and volatility patterns that reveal systemic weaknesses.
    mechanism: The method involves identifying systems where nonlinearities and volatility
      create unpredictable outcomes, analyzing the consequences of these effects,
      and detecting when systems are vulnerable to shocks that reveal their true fragility.
    boundary: Applies to systems where nonlinearities and volatility create unpredictable
      outcomes. Fails when the system does not exhibit the necessary characteristics
      or when the analysis is not properly conducted.
  expected_classification:
    depth: cross-domain
- id: 1cf4ed9f486b114c9b00a35713f8c527c7e90a606087f82149ad110ea868f54d
  input_fb:
    name: Modern Typography Manifesto
    definition: A radical shift in typography philosophy that rejected traditional
      layout techniques in favor of dynamic, experimental typographic forms.
    mechanism: Designers like Karel Teige advocated for abandoning tedious traditional
      layout methods in favor of more dynamic compositions using typecase materials,
      drawing inspiration from constructivist and Dadaist approaches to typography.
    boundary: Applies to the interwar period when designers were actively seeking
      to revolutionize typography through new philosophical approaches. Fails when
      traditional layout methods remain dominant or when the radical shift was not
      implemented in practice.
  expected_classification:
    depth: domain
- id: 1d2b0add67a2fef247eb9bad182efa758c0d75c1857d8a6313870694c148ba42
  input_fb:
    name: Design As Social Shaping Mechanism
    definition: A conceptual framework that design serves as a powerful tool for shaping
      social and spatial realities, creating new social conditions that can be either
      beneficial or harmful.
    mechanism: Design functions as a social action that shapes physical spaces, resource
      access, and power structures through the creation of urban networks, procedures,
      and documentation systems that become embedded in culture and institutional
      practices.
    boundary: Applies to situations where design is used as a deliberate social intervention
      rather than a purely technical or aesthetic tool. Fails when design is limited
      to surface-level aesthetic concerns or when it lacks the power to shape social
      structures.
  expected_classification:
    depth: cross-domain
- id: 4c30b4f096d52dfe148b933fe702f00b2d9fa4c4f658a6f233be5f66086acf9e
  input_fb:
    name: Modelans-modelandum Relationship
    definition: A semiotic relationship where one entity (modelans) stands for another
      (modelandum) with sufficient similarity that truths about the modelans can be
      attributed to the modelandum. This relationship enables inference and reasoning
      across different domains through structural analogy.
    mechanism: The modelans-modelandum relationship operates through structural correspondence
      — when two entities share enough common features or properties, a logical bridge
      allows inferences from one to the other. This is not merely metaphorical but
      involves a degree of similarity that makes the modelans a representative or
      proxy for the modelandum in specific contexts. The strength of this relationship
      depends on the degree of resemblance between the two elements.
    boundary: Applies when there is sufficient structural or functional similarity
      between the modelans and modelandum to support valid inference. Fails when the
      similarity is too weak or irrelevant to make meaningful cross-domain attributions
      (e.g., a cabbage having no meaningful resemblance to a king in practical or
      conceptual terms).
  expected_classification:
    depth: universal
- id: f9eda1da86b8a685c9281f9521ce028a8ce2375b1d8f42a780005d4b499967b7
  input_fb:
    name: Threshold Visibility of Ai
    definition: Artificial intelligence becomes visible and commercially viable only
      when accumulated ideas and evidence cross a critical threshold that justifies
      investment in product development or demonstration. Before this point, AI capabilities
      remain latent or embedded in systems without clear commercial recognition.
    mechanism: This is an empirical pattern, not a causal mechanism. The visibility
      of AI emerges when a critical mass of ideas and evidence accumulates to a point
      where investment becomes rational and media attention follows. The threshold
      is not a fixed technical milestone but a dynamic point determined by market
      conditions, investment availability, and media attention. The accumulation process
      is iterative and often gradual, with many ideas remaining dormant until the
      threshold is crossed.
    boundary: Applies when accumulated AI ideas and evidence reach a point where commercial
      investment becomes justified. Fails when the accumulation remains below the
      threshold for investment or when media attention does not follow the investment
      decision. Also fails in cases where the threshold is artificially created by
      hype rather than genuine capability.
  expected_classification:
    depth: domain
- id: 00246a3576082a2f8236612e84a7857df867931616ca1390187fc79222a08a02
  input_fb:
    name: Self-service Business Model
    definition: A business model that reduces personnel costs by providing only essential
      services and implementing self-service options for customers, enabling lower
      pricing and increased guest attraction.
    mechanism: The model operates by minimizing staff presence in service delivery,
      allowing customers to handle routine tasks themselves through automated or self-service
      stations, which reduces labor costs and enables lower pricing.
    boundary: Applies when customers are willing to take on additional work for lower
      prices and when DIY elements create perceived customer value. Fails when customers
      cannot or will not perform the additional work, or when the self-service approach
      creates poor customer experience.
  expected_classification:
    depth: domain
- id: 1ecdb8bcd6d932888eea9fbd0f6ac351039abc61e7ba5c49f443efd0de828795
  input_fb:
    name: Clustering Algorithm Selection
    definition: Clustering algorithms differ in their approach to grouping data points
      based on shared attributes, with some requiring pre-specified cluster counts
      and others identifying groups based on density or similarity thresholds. The
      choice of algorithm affects the structure and interpretability of the resulting
      segments.
    mechanism: Different clustering methods address distinct data characteristics
      and analytical goals. K-means requires a predetermined number of clusters and
      groups observations by minimizing within-cluster variance, making it suitable
      for well-defined, spherical groupings. DBSCAN identifies clusters based on point
      density and marks low-density regions as noise, allowing for the discovery of
      arbitrary-shaped clusters without specifying the number of groups in advance.
      The selection of one over another depends on the nature of the data distribution,
      the presence of outliers, and the analyst's prior assumptions about cluster
      structure.
    boundary: Applies when analyzing data for segmentation or grouping purposes where
      the goal is to identify natural clusters. Fails when the data lacks meaningful
      structure or when the analyst's assumptions about cluster shape or count do
      not align with the data's inherent patterns.
  expected_classification:
    depth: domain
- id: 455d2b15583cf10241fb4cd4937d4b4710d91f02eb6d1a3c225c8a05d8493476
  input_fb:
    name: Ai Jailbreaking Through Contextual Manipulation
    definition: A technique for bypassing AI safety constraints by providing contextual
      framing that alters the AI's interpretation of a request, making it appear acceptable
      within a fictional narrative.
    mechanism: The technique works by embedding a request within a fictional scenario
      that provides a plausible context for the otherwise prohibited action, allowing
      the AI to process the request as part of a creative or educational exercise
      rather than a direct command.
    boundary: Applies when the AI's constraints are based on explicit rules rather
      than fundamental ethical principles. Fails when the AI's safety protocols are
      designed to detect and block all forms of harmful content regardless of context.
  expected_classification:
    depth: specialized
- id: a866b7e03cfa3475b40e9ac730301fcfefc7f0378ea90a0611d2d70ae457b1a7
  input_fb:
    name: Assumption-dependent Impossibility Proofs
    definition: A principle that impossibility proofs in science rest on specific
      assumptions that may not hold in all circumstances, making such proofs potentially
      invalid.
    mechanism: Impossibility proofs in science are based on specific assumptions about
      physical constraints, mathematical frameworks, or experimental conditions that
      can be violated in new situations, causing the proof to fail.
    boundary: Applies to scientific impossibility claims that rest on specific assumptions.
      Fails when the underlying assumptions are not properly examined or when new
      conditions violate the original constraints.
  expected_classification:
    depth: cross-domain
- id: 1996ebab2e6e48224282564096fb6ff851572d18e202c9a9db276c6e5aa4e093
  input_fb:
    name: Mathematical Abstraction Leading to Physical Application
    definition: Mathematical concepts and models originally developed without any
      practical application in mind later prove to be essential tools for solving
      problems in physics and other sciences. This pattern demonstrates that abstract
      mathematical frameworks can unexpectedly find utility in concrete physical phenomena.
    mechanism: 'This is an empirical pattern, not a causal mechanism. The relationship
      is observed: pure mathematical constructs that were developed for theoretical
      reasons later become useful in physical applications. The mechanism is not a
      direct cause-effect chain but rather a documented historical correlation between
      abstract mathematical development and subsequent physical utility. The process
      involves mathematical discovery that precedes physical application by decades
      or centuries.'
    boundary: Applies to mathematical frameworks that were originally developed for
      abstract or theoretical reasons without any intended physical application. Fails
      when mathematical concepts are explicitly designed or immediately recognized
      as having physical applications, or when the mathematical framework is not sufficiently
      general to apply to physical systems.
  expected_classification:
    depth: cross-domain
- id: 246ef2b4d3e4ee2d738f17686ad9ad3d23681fdb0a11e2b37ee758b40604adbd
  input_fb:
    name: The Invisible Art of Film Editing
    definition: An empirical observation that film editing nominations are highly
      correlated with Best Picture wins, despite the editing award receiving little
      public attention.
    mechanism: The passage documents that since 1981, every Best Picture winner has
      been nominated for Best Film Editing, with about two-thirds of those editing
      nominees also winning Best Picture.
    boundary: Applies to the correlation between film editing and Best Picture recognition
      in the Academy Awards since 1981. Fails when the correlation doesn't hold for
      other time periods or award categories.
  expected_classification:
    depth: domain
- id: f401f4f5349e50896093dfec978c2d9431c21ee99e6d7b86545dc2db7bb819bc
  input_fb:
    name: Factual Judgment Vs Metaphorical Judgment Distinction
    definition: A principle distinguishing between factual judgments that draw from
      external reality and metaphorical judgments that establish connections within
      semantic systems, with factual judgments requiring external validation while
      metaphors operate within linguistic structures.
    mechanism: Factual judgments perceive or intellectually draw data from external
      reality to establish connections, while metaphorical judgments create new semantic
      connections internally without requiring external verification. Factual judgments
      can be falsified through contrary evidence, whereas metaphors are validated
      through semantic consistency.
    boundary: 'Applies when distinguishing between two types of linguistic judgments:
      those grounded in external reality (factual) and those operating within internal
      semantic systems (metaphorical). Fails when the distinction becomes blurred
      or when judgments cannot be clearly categorized as one or the other.'
  expected_classification:
    depth: domain
- id: 97b1d8ef6be083c6050c96e391a0405f3062cd137e24e5db78ec0ccd761877de
  input_fb:
    name: Technoanarchy As New Order
    definition: A philosophical concept that redefines anarchy as a natural order
      emerging from technological advancement and human ignorance, suggesting that
      the future society will be organized through voluntary cooperation rather than
      traditional governmental structures.
    mechanism: The concept reinterprets anarchy as a natural order that emerges from
      technological development and human ignorance, where officialdom becomes irrelevant
      and survival depends on the emergence of natural order rather than institutional
      structures.
    boundary: Applies to the philosophical framework presented in the text that reinterprets
      anarchy in the context of technological development and human consciousness.
      Fails when the philosophical premise about technology replacing officialdom
      or the relationship between ignorance and order is not accepted.
  expected_classification:
    depth: domain
- id: 015938006ab4579b9b339c2cac9fdf30a7d55f24197754dfd6e092fb160b9196
  input_fb:
    name: Passion-struck Framework for Intentional Living
    definition: A framework for intentional life development that progresses through
      stages of vision, decision-making, fear-confrontation, identity-redefinition,
      and long-term commitment.
    mechanism: The framework guides individuals through stages of intentional living
      by first establishing clear vision, then making informed decisions aligned with
      values, confronting fears, redefining identity, and committing to long-term
      progress that multiplies over time.
    boundary: Applies to individuals seeking intentional life development and personal
      transformation. Fails when individuals do not commit to the long-term process
      or when they do not confront their fears and insecurities.
  expected_classification:
    depth: domain
- id: 0a2dd35b83bfba7d1efcafcc1c7beec3509529ef7db707934f597176211968ea
  input_fb:
    name: The One Thing Principle
    definition: Extraordinarily successful companies and individuals focus on one
      core product, service, or area of expertise that generates the majority of their
      results, rather than spreading effort across multiple pursuits.
    mechanism: Success builds on success through focused repetition and refinement
      of one core area, where the most effective approach is to concentrate all efforts
      on the single most impactful element that drives results.
    boundary: Applies to business and personal development contexts where focus and
      concentration on one core element can generate disproportionate returns. Fails
      when the single focus is not actually the most impactful element or when market
      conditions change requiring broader focus.
  expected_classification:
    depth: domain
- id: 1df2a2a132fda5700e594f0c1d1c53e10392645f436424cb276316e2645c5019
  input_fb:
    name: Independent Judgments Principle
    definition: A practical rule for improving decision-making by ensuring that sources
      of information or evidence are independent to eliminate redundancy and reduce
      the impact of shared biases.
    mechanism: When multiple witnesses or sources provide information independently,
      their judgments are less likely to be influenced by each other or share common
      biases, thereby increasing the value of the collective information.
    boundary: Applies to situations where multiple sources of information or evidence
      need to be combined for decision-making. Fails when sources are inherently interdependent
      or when shared biases cannot be controlled.
  expected_classification:
    depth: cross-domain
- id: be4f02f02170c0f5e3756997c2944d69748fbb775342938a14b2faed237eb02a
  input_fb:
    name: Narrative Power Over Data
    definition: Stories can generate extraordinary influence and value even when their
      factual content is irrelevant or false, while data-driven approaches are constrained
      by their informational limitations and require validation. The principle describes
      a fundamental mismatch in how human cognition processes and values information.
    mechanism: Stories activate emotional and narrative processing pathways in human
      cognition that bypass critical evaluation of factual accuracy. The narrative
      structure creates a sense of meaning and coherence that makes audiences more
      receptive to the story's persuasive force, regardless of whether the underlying
      facts are true or meaningful. Data, in contrast, requires interpretation and
      validation to achieve similar persuasive impact, and its value is tied to the
      accuracy and relevance of the information it presents.
    boundary: Applies when human audiences are involved in processing information
      and making decisions. Fails when audiences are purely analytical or when data
      is the only relevant factor (e.g., scientific measurement, engineering design).
      Also fails when the story is so obviously false that it undermines rather than
      enhances credibility.
  expected_classification:
    depth: cross-domain
- id: 98c895d31e6141954dddc4866bb585cfbbf25c310b236eee00b7eca2db457c08
  input_fb:
    name: Quantum Theory and Semiotic Modeling
    definition: A theoretical approach suggesting that quantum mechanics' implications
      for the relationship between observer and observed can be integrated with semiotic
      theory to model complex reality.
    mechanism: Quantum theory implies that before measurement, all possibilities exist
      simultaneously, which challenges traditional semiotic models that treat meaning
      as fixed and determinate. This quantum perspective suggests that semiotic models
      must account for the dynamic, relational nature of meaning-making where observer
      and observed are not separate entities but part of an interconnected system.
    boundary: Applies to semiotic theory that seeks to incorporate modern physics
      concepts and relational approaches to meaning. Fails when traditional semiotic
      models remain rigidly fixed and fail to account for the dynamic, observer-dependent
      nature of meaning.
  expected_classification:
    depth: cross-domain
- id: 1426d66d7ae2dac652e2f0c3d3a90b8feeba71c9016d59bd479e8b566daf47a3
  input_fb:
    name: Shader Color Component Manipulation
    definition: GLSL shaders allow direct manipulation of color components through
      vector swizzling and component assignment, enabling precise control over individual
      color channels (red, green, blue, alpha) for visual effects. This technique
      is fundamental to generative art and real-time graphics programming.
    mechanism: In GLSL, color vectors are structured as vec4 with components r/g/b/a
      (or x/y/z/w) that can be accessed individually or in groups. Component assignment
      allows setting specific color channels to values or other vector components,
      while swizzling enables reordering or duplication of components. The shader's
      output color is determined by the final state of the fragColor vector after
      all component manipulations.
    boundary: Applies to GLSL shader programming where color manipulation is required.
      Fails when working with non-vector color types or in environments that don't
      support component swizzling and assignment.
  expected_classification:
    depth: specialized
- id: d6ed963288e5e3763d71efea69af9ef0713b1e4f2f95545f8ba7dd00cb4364ab
  input_fb:
    name: Decision-making As Both Rational and Emotional Process
    definition: A decision-making framework that recognizes both logical analysis
      and emotional/psychological factors in making important choices, particularly
      those involving significant risk or value.
    mechanism: Effective decision-making requires systematic analysis of key factors
      while also acknowledging the emotional investment and social/cultural influences
      that affect decision confidence and acceptance.
    boundary: Applies to high-stakes decisions where both rational analysis and emotional
      factors matter. Fails when decision-makers ignore either the logical or emotional
      components of their choices.
  expected_classification:
    depth: cross-domain
- id: 144b28de71794b47316f0d9e2a89a1c7fe9a85d8ef711999dbb5c4c3136aa7bd
  input_fb:
    name: Feedback-driven System Evolution
    definition: Systems evolve through iterative cycles of observation, feedback integration,
      and adaptation. This principle describes how feedback loops enable systems to
      refine their behavior and improve outcomes over time.
    mechanism: Feedback creates a closed-loop process where system outputs are monitored
      and used to adjust inputs or structure. In complex systems, this creates emergent
      properties and self-correcting behaviors. The feedback mechanism operates through
      multiple channels and levels, allowing for both corrective adjustments and discovery
      of new patterns or opportunities.
    boundary: Applies when systems have observable outputs and mechanisms for integrating
      feedback. Fails when feedback is absent, ignored, or when systems are static
      and unchanging.
  expected_classification:
    depth: universal
- id: 01a7920f9c69d0048ec0f047cbb7dd06eb0765364f18f3ce01565062ba154773
  input_fb:
    name: Airflow Vs Prefect Workflow Limitations
    definition: Comparative analysis of Airflow's static workflow limitations versus
      Prefect's dynamic workflow capabilities.
    mechanism: Airflow's monolithic DAGs and static nature prevent parameterization
      and runtime step creation, while Prefect's parameterized and dynamic workflows
      enable more flexible and adaptive workflow management.
    boundary: Applies to workflow management in data science and machine learning
      systems. Fails when workflows require dynamic adaptation or parameterized execution
      that Airflow cannot support.
  expected_classification:
    depth: domain
- id: 03cfa46967c04f71bc03cc2ad36c848ec936a65f97919bdc8a146f7f1b8dcc4d
  input_fb:
    name: Theme-based Concept Development
    definition: A design methodology that uses themes as conceptual foundations, where
      themes can be distinct conceptual or pictorial topics based on thoughts, emotions,
      society, nature, politics, or religion.
    mechanism: Themes serve as organizing principles that guide the development of
      design concepts, allowing designers to explore variations and combinations of
      related or unrelated elements to create unique visual solutions.
    boundary: Applies to design projects where conceptual themes provide a framework
      for creative development. Fails when themes are too abstract or disconnected
      from the project's purpose and context.
  expected_classification:
    depth: domain
- id: 9dc038626c97aefd5cb23d8e822bd82e6db867a0eb87592f811ee106993f6f1b
  input_fb:
    name: Multiskill Learning Optimization
    definition: Developing broad skill sets through deliberate learning and cross-functional
      experience creates high-value, adaptable professionals who can solve complex
      problems and drive organizational efficiency. The principle describes a strategic
      approach to career and skill development that maximizes individual impact and
      organizational flexibility.
    mechanism: 'This is a normative heuristic: optimizing for learning and multiskill
      development increases professional versatility and organizational value. The
      approach works by combining targeted skill acquisition with practical application
      across domains, enabling individuals to address diverse challenges and reduce
      coordination costs. The process involves deliberate practice, cross-functional
      exposure, and continuous feedback loops that accelerate capability growth.'
    boundary: Applies when individuals have the opportunity to develop skills across
      multiple domains and when organizations value cross-functional capabilities.
      Fails when skill development is narrowly focused on single-function expertise
      or when organizational structures prevent cross-domain application of knowledge.
  expected_classification:
    depth: domain
- id: 4c78c5cfac790f09836a2308e56dd886978f0befc9138643be000ad6c40f46b9
  input_fb:
    name: Exaptation in Biological and Technological Evolution
    definition: A biological or technological adaptation that evolves for one purpose
      but is later co-opted for a different function, providing survival or operational
      advantages in new contexts.
    mechanism: The process involves a structure or capability that originally evolved
      for one function (such as a bone for feeding) but later becomes available for
      alternative uses (such as adaptation to new environmental pressures), enabling
      survival advantages through functional flexibility.
    boundary: Applies to evolutionary biology and technological development where
      structures or capabilities can be repurposed for new functions. Fails when the
      structure or capability lacks the necessary flexibility for alternative use.
  expected_classification:
    depth: cross-domain
- id: 46d01ea2542f68f9ae5839393252f25260242269d467443c0b54672c8ffb18d7
  input_fb:
    name: Cross-pollination Studio Model
    definition: A design studio model that integrates social impact initiatives with
      regular creative work by maintaining long-term relationships with nonprofit
      organizations. This approach allows studios to apply their professional tools,
      ideas, and inspiration toward positive social change while building foundational
      support for sustained creative engagement.
    mechanism: This is a descriptive model of organizational structure and practice,
      not a causal mechanism. The model describes how studios can organize their operations
      to include social impact as a core component of their creative process. It outlines
      a framework where regular studio work and nonprofit collaboration coexist and
      reinforce each other through shared resources, knowledge exchange, and sustained
      relationship building.
    boundary: Applies to design studios that have the capacity to maintain ongoing
      partnerships with nonprofits and integrate social impact into their regular
      workflow. Fails when studios lack the time, resources, or organizational structure
      to sustain long-term nonprofit relationships, or when the nonprofit work is
      treated as a separate, isolated initiative rather than part of the studio's
      core operating model.
  expected_classification:
    depth: domain
- id: 2e9658c79275ef3ca1f61a65f121b7bd6cc7be46a11954919c21eecc2e72ca1f
  input_fb:
    name: Dikw Hierarchy
    definition: A conceptual model that organizes information from raw data through
      information, knowledge, and wisdom, representing the transformation of unstructured
      observations into meaningful understanding.
    mechanism: The hierarchy describes a progression where data (raw observations)
      becomes structured information through encoding and representation, then transforms
      into knowledge when patterns are identified and understood, and finally wisdom
      when that knowledge is applied with judgment and insight.
    boundary: Applies to the conceptual organization of information processing and
      understanding. Fails when applied to specific real-world data transformations
      that don't follow the linear progression or when the model is oversimplified
      to ignore context-dependent interpretation.
  expected_classification:
    depth: domain
- id: b4a7580a9639eb78c426912545ddca818d12f95305e4f09ad9946b07874f618c
  input_fb:
    name: Semiotics As Interdisciplinary Field (2)
    definition: A field of study characterized by diverse and seemingly disconnected
      topics that coexist under a common theoretical umbrella, reflecting varied subject
      matter and approaches rather than unified theoretical framework.
    mechanism: The field encompasses a wide range of topics from Metatheory to Symmetry
      in Crystallography, suggesting that the organizing principle is not a single
      unified theory but rather a collection of family resemblances among disparate
      areas of study.
    boundary: Applies to the interdisciplinary nature of semiotics as a field that
      includes topics from very different domains like media studies and crystallography.
      Fails when the field is reduced to a single theoretical approach or when all
      topics are required to follow one unified framework.
  expected_classification:
    depth: domain
- id: 48ca789377c01a3def5f4588722434d8874b1948cfc0b8819959154f7ce00579
  input_fb:
    name: Edge Computing Interoperability Standards
    definition: A principle describing the essential role of industry-wide standards
      and collaborative frameworks in enabling interoperable edge computing solutions
      across different hardware, software, and platforms.
    mechanism: The passage demonstrates that successful edge computing requires industry
      collaboration through organizations like LF Edge to create open, interoperable
      frameworks that work across different hardware, silicon, cloud, and operating
      systems, enabling real-world practical applications.
    boundary: Applies to edge computing implementations where cross-platform compatibility
      and industry collaboration are required. Fails when edge computing solutions
      are proprietary or limited to specific platforms.
  expected_classification:
    depth: domain
- id: 4f13639b49536e346d67db8996be74ec81e2dae7f8c37a7995f007986862222e
  input_fb:
    name: MTV and the Development of Music Video as
    definition: A transformative period in audio-visual culture where music videos
      became a dominant format that shaped the relationship between sound and image
      in popular culture.
    mechanism: MTV and other music video platforms created a technical and conceptual
      language for cross-pollination between sound and image, where music was often
      discovered through its visual representation, establishing new aesthetic principles
      and timing conventions for audio-visual synchronization.
    boundary: Applies to the late 1970s and 1980s when music video became a dominant
      cultural format, particularly in the United States. Fails when the work predates
      MTV or does not involve the specific technical and conceptual developments of
      music video as a medium.
  expected_classification:
    depth: domain
- id: 14e730833577e0af3cf3289ff9b6347c4d1231ed2d75de344070fa929494c653
  input_fb:
    name: Symbolic Authority and Cultural Transmission
    definition: Symbols that represent power, divinity, or cosmic order are transmitted
      across cultures through religious, imperial, or artistic systems, often adapting
      to local contexts while retaining core meanings. These symbols become embedded
      in cultural artifacts and practices, serving as vehicles for expressing and
      reinforcing social hierarchies or spiritual beliefs.
    mechanism: This is an empirical pattern describing how certain symbols—such as
      dragons, phalluses, circles, and the sun—are adopted and reinterpreted across
      cultures and time periods. The process involves the symbolic transfer of meaning
      from one context (e.g., imperial Chinese iconography) to another (e.g., Japanese
      or Western religious art), often through cultural contact, trade, or religious
      diffusion. These symbols are not merely decorative but carry deep cultural and
      spiritual significance that transcends their physical form.
    boundary: Applies when symbols are embedded in cultural systems with established
      meanings and are transmitted through structured practices or artifacts (e.g.,
      imperial robes, religious texts, artistic motifs). Fails when symbols are purely
      aesthetic or lack cultural or spiritual significance, or when they are not part
      of a larger symbolic or institutional framework.
  expected_classification:
    depth: cross-domain
- id: 1c0ae5922197e759f775fa5e086116c6cfc0ad0f854a74f5dc058cac67f4f433
  input_fb:
    name: 3d Spatial Audio Positioning with Ambisonics
    definition: A technique for perceptually positioning acoustic phenomena in three-dimensional
      space using ambisonics, which allows for sophisticated spatial audio control
      in multi-speaker setups.
    mechanism: Ambisonics uses specialized libraries to encode and decode audio signals
      for spatial positioning, allowing sounds to be placed in 3D space relative to
      speaker configurations. The system can handle complex speaker arrangements and
      provides tools for spatializing audio across multiple speakers.
    boundary: Applies when sophisticated 3D spatial audio positioning is required
      in multi-speaker environments. Fails when speaker configurations are not properly
      defined or when ambisonics libraries are not available.
  expected_classification:
    depth: specialized
- id: f265853433272390b941399a48004fd67764074ef38bf1b10365f03295809c9c
  input_fb:
    name: Analogical Reasoning in Scientific Problem-solving
    definition: A principle that scientists and innovators often solve problems by
      drawing analogies from other domains, particularly when they're unaware of the
      critical role these analogies play in their thinking.
    mechanism: Scientists engage in analogical reasoning by searching for similar
      problems that have been solved elsewhere and using those solutions as frameworks
      for new problems, often without conscious awareness of this process.
    boundary: Applies to scientific and engineering problem-solving contexts where
      analogies can be fruitfully applied. Fails when the problem domain lacks relevant
      analogs or when the analogy is inappropriate.
  expected_classification:
    depth: domain
- id: d0be7b3b9fd77e2a1deba6cdd1cdb29c66f8f2ee44ce894ef4f305fc69cee072
  input_fb:
    name: Market Automation and Policy Interference
    definition: A principle describing how the mechanization of crafts through visual
      methods led to the automation of consciousness and the acceptance of market
      self-regulation as a natural process that must not be impeded.
    mechanism: The transformation from craft-based to mechanized production through
      visual methods created a momentum in applied knowledge that became accepted
      as natural, leading to the automation of consciousness where policy interference
      was seen as harmful to universal good.
    boundary: Applies to the historical transformation of economic policy from craft-based
      to market-driven systems in the sixteenth through eighteenth centuries. Fails
      when applied to contexts where the relationship between visual methods and policy
      automation is not the primary concern.
  expected_classification:
    depth: domain
- id: 6466e857604cb9b8de8c83423e2f787d77c6f75cb971976574f4299ee65eac27
  input_fb:
    name: Geometric Harmony in Cultural Expression
    definition: Cultural and intellectual traditions across different historical periods
      and geographic regions consistently employ specific geometric relationships
      and symmetrical patterns as foundational elements in their artistic, architectural,
      and mathematical practices. These patterns reflect a universal human tendency
      to seek and apply proportional relationships that are perceived as aesthetically
      and conceptually harmonious.
    mechanism: This is an empirical pattern describing the recurring use of geometric
      proportions and symmetries across diverse cultural expressions. The passages
      document that specific mathematical and geometric principles—such as the golden
      ratio, pentagonal symmetry, and dynamic series—appear in various forms across
      ancient Greek philosophy, Islamic scholarship, Babylonian cosmology, and creative
      coding practices. These patterns are not necessarily causally linked but co-occur
      as recurring themes in human cultural production.
    boundary: Applies to cultural artifacts and practices where geometric proportion
      and symmetry are consciously or unconsciously integrated into design, art, or
      mathematical reasoning. Fails when geometric principles are absent or not purposefully
      applied in a given cultural or artistic context.
  expected_classification:
    depth: cross-domain
