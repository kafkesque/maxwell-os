# ============================================================================
# Maxwell v3.0 — Golden Edge-Case Classification Test Set (50 cases)
# Authority: D2066, D316, P1.7
# Purpose: Exhaustive coverage of every classification property, boundary,
#          and degenerate input for the multi-label classifier in Stage 4.
# ============================================================================
#
# Each case tests a specific edge-case property of the classification system.
# Properties tested across all 50 cases:
#   - Disciplines: 1-label, 2-label, 3-label, edge-of-known, emerging, empty
#   - Domains: 1-label, 2-label, max (5), emerging, none, all-canonical
#   - Depth: universal, cross-domain, domain, specialized, ambiguous, missing
#   - Evidence: cited, axiomatic, absent, contradictory
#   - Name/definition: short, long, empty, non-English terms, special chars
#   - Semantic: cross-domain ambiguity, jargon-heavy, overly generic, too narrow
#   - Format: JSON edge cases (extra fields, wrong types, nulls)
# ============================================================================

golden_cases:
  # ═══════════════════════════════════════════════════════════════════════
  # GROUP A: Discipline Cardinality (1-3 labels)
  # ═══════════════════════════════════════════════════════════════════════
  - id: A01_single_discipline_clear
    description: "FB clearly in ONE discipline only — should not hallucinate extras"
    fb_name: "Recursive Function Optimization"
    fb_definition: "Recursive functions can be optimized through tail-call elimination, transforming stack-consuming recursion into iterative loops that use constant stack space. This technique is specific to compiler design and functional programming paradigms."
    expected_disciplines: ["software engineering"]
    expected_domains: ["code & computation", "engineering practice"]
    expected_depth: "domain"
    expected_evidence: "cited"
    test_property: "single-discipline, no hallucination"

  - id: A02_two_disciplines_bridge
    description: "FB spans exactly 2 related disciplines — both must be returned"
    fb_name: "Data-Informed UX Architecture"
    fb_definition: "User experience architecture benefits from quantitative behavioral data to inform information hierarchy decisions. Statistical analysis of user flows reveals patterns that intuition alone cannot detect, bridging the gap between data science and design strategy."
    expected_disciplines: ["design strategy", "data science"]
    expected_domains: ["user experience", "digital product"]
    expected_depth: "cross-domain"
    expected_evidence: "cited"
    test_property: "dual-discipline bridge"

  - id: A03_three_disciplines_max
    description: "FB spans 3 distinct disciplines — max cardinality without hallucination"
    fb_name: "AI-Augmented Creative Direction"
    fb_definition: "Creative direction increasingly leverages generative AI for concept exploration, requiring directors to understand machine learning capabilities, design principles, and business strategy simultaneously. The role blends artistic vision with algorithmic thinking and market positioning."
    expected_disciplines: ["design strategy", "ai engineering", "strategic thinking"]
    expected_domains: ["creative technology", "ai & agents", "business operations", "digital product"]
    expected_depth: "cross-domain"
    expected_evidence: "cited"
    test_property: "max-discipline (3), no overflow"

  - id: A04_discipline_edge_case_emerging
    description: "FB belongs to a field not in the canonical discipline list"
    fb_name: "Bioelectric Morphogenesis Patterning"
    fb_definition: "Cellular voltage gradients serve as a medium for storing and processing pattern information during organism development. Bioelectric signals form a computational layer that operates alongside genetic and biochemical systems to control anatomical shape."
    expected_disciplines: ["emerging"]
    expected_domains: ["emerging"]
    expected_depth: "domain"
    expected_evidence: "cited"
    test_property: "emerging discipline (not in taxonomy)"

  - id: A05_discipline_ambiguous_boundary
    description: "FB could reasonably be 2 different disciplines — classifier must pick"
    fb_name: "Market Psychology in Product Launches"
    fb_definition: "Product launch success depends on psychological triggers like scarcity, social proof, and anchoring. Understanding cognitive biases allows product teams to time and frame releases for maximum adoption, blending behavioral economics with product management."
    expected_disciplines: ["strategic thinking", "marketing"]  # can also be product management
    expected_domains: ["business operations", "digital product"]
    expected_depth: "cross-domain"
    expected_evidence: "cited"
    test_property: "ambiguous discipline boundary — accepts either valid answer"
    accept_any_of_disciplines: [["strategic thinking", "marketing"], ["strategic thinking", "product management"]]

  # ═══════════════════════════════════════════════════════════════════════
  # GROUP B: Domain Cardinality (1-5 labels)
  # ═══════════════════════════════════════════════════════════════════════
  - id: B01_single_domain_narrow
    description: "FB applies to exactly ONE domain — classifier must not inflate"
    fb_name: "CSS Grid Subgrid Inheritance"
    fb_definition: "CSS Grid subgrid allows nested grid containers to inherit track definitions from parent grids, enabling consistent alignment across nested components without duplicating grid declarations."
    expected_disciplines: ["software engineering"]
    expected_domains: ["code & computation"]
    expected_depth: "specialized"
    expected_evidence: "cited"
    test_property: "single domain, specialized depth"

  - id: B02_two_domains_orthogonal
    description: "FB spans 2 domains that are not obviously related"
    fb_name: "Algorithmic Bias in Healthcare UX"
    fb_definition: "Machine learning models used in clinical decision support can encode racial and socioeconomic biases from training data. UX designers must surface these biases transparently to clinicians, requiring both healthcare domain knowledge and AI ethics awareness."
    expected_disciplines: ["ai engineering", "user research"]
    expected_domains: ["ai & agents", "user experience"]
    expected_depth: "cross-domain"
    expected_evidence: "cited"
    test_property: "orthogonal domain pairing"

  - id: B03_max_domains_five
    description: "FB genuinely spans 5 distinct domains — test the max limit"
    fb_name: "Crisis Communication Across Channels"
    fb_definition: "During organizational crises, effective communication requires coordinated messaging across social media, traditional PR, internal platforms, customer support, and regulatory bodies. Each channel demands different tone, speed, and legal considerations while maintaining narrative coherence."
    expected_disciplines: ["strategic thinking", "marketing"]
    expected_domains: ["business operations", "digital product", "user experience", "creative technology", "entrepreneurship"]
    expected_depth: "cross-domain"
    expected_evidence: "cited"
    test_property: "max domains (5), no truncation hallucination"

  - id: B04_domain_all_emerging
    description: "FB belongs to a completely novel field outside all canonical domains"
    fb_name: "Quantum Narrative Superposition"
    fb_definition: "Interactive narratives can maintain multiple simultaneous story states using quantum computing-inspired data structures, collapsing to a single timeline only upon reader observation. This creates genuinely non-deterministic storytelling where all possibilities coexist until measured."
    expected_disciplines: ["emerging"]
    expected_domains: ["emerging"]
    expected_depth: "domain"
    expected_evidence: "axiomatic"
    test_property: "all-emerging domain classification"

  - id: B05_domain_partial_emerging
    description: "FB has 2 canonical domains + 2 genuinely new domains"
    fb_name: "Neuro-Symbolic Design Systems"
    fb_definition: "Design systems augmented with neuro-symbolic AI combine neural pattern recognition with symbolic rule engines, allowing components to adapt layouts while preserving brand constraints through logical inference rather than hard-coded rules."
    expected_disciplines: ["ai engineering", "design strategy"]
    expected_domains: ["ai & agents", "creative technology", "digital product"]
    expected_depth: "cross-domain"
    expected_evidence: "axiomatic"
    test_property: "partial emerging domains (mix canonical + new)"

  # ═══════════════════════════════════════════════════════════════════════
  # GROUP C: Depth Classification
  # ═══════════════════════════════════════════════════════════════════════
  - id: C01_depth_universal
    description: "FB applies universally across ALL human endeavors"
    fb_name: "Feedback Loop Convergence"
    fb_definition: "Any system with a feedback mechanism — whether biological, economic, social, or mechanical — will converge toward a stable state or oscillate depending on loop delay and gain. Understanding this universal dynamic enables prediction across completely unrelated domains."
    expected_disciplines: ["strategic thinking"]
    expected_domains: ["engineering practice", "business operations"]
    expected_depth: "universal"
    expected_evidence: "cited"
    test_property: "universal depth, applies everywhere"

  - id: C02_depth_cross_domain
    description: "FB spans 2+ disciplines but is NOT universal"
    fb_name: "Technical Debt in Visual Interfaces"
    fb_definition: "Visual interface complexity accumulates 'design debt' analogous to technical debt — quick visual fixes create maintenance burdens that compound over releases. This pattern bridges software engineering and visual design but does not extend beyond these fields."
    expected_disciplines: ["software engineering", "design strategy"]
    expected_domains: ["code & computation", "digital product"]
    expected_depth: "cross-domain"
    expected_evidence: "cited"
    test_property: "cross-domain (not universal)"

  - id: C03_depth_domain
    description: "FB applies within ONE domain only"
    fb_name: "Typography Baseline Grid Systems"
    fb_definition: "Baseline grids in typography align text across columns and pages by establishing a consistent vertical rhythm based on line-height. This creates visual harmony in print and digital layouts through mathematical spacing rules."
    expected_disciplines: ["graphic design"]
    expected_domains: ["graphic design"]
    expected_depth: "domain"
    expected_evidence: "cited"
    test_property: "domain depth (one field)"

  - id: C04_depth_specialized
    description: "FB is a narrow sub-technique within a domain"
    fb_name: "Kerning Pair Adjustment for Display Type"
    fb_definition: "Specific letter pairs in display typefaces (AV, To, WA) require manual kerning adjustment at large sizes because automatic metrics designed for body text fail at display scales, creating visually awkward gaps that trained eyes detect immediately."
    expected_disciplines: ["graphic design"]
    expected_domains: ["graphic design"]
    expected_depth: "specialized"
    expected_evidence: "cited"
    test_property: "specialized depth (narrow sub-field)"

  - id: C05_depth_ambiguous_universal_vs_cross
    description: "FB could be universal or cross-domain — borderline case"
    fb_name: "Pattern Recognition Across Modalities"
    fb_definition: "Human pattern recognition operates similarly whether processing visual art, musical compositions, or business data trends. The cognitive mechanism of chunking complex inputs into recognizable patterns transcends specific modalities."
    expected_disciplines: ["cognitive science", "strategic thinking"]
    expected_domains: ["user experience", "business operations"]
    expected_depth: "cross-domain"  # or universal — borderline
    expected_evidence: "cited"
    test_property: "borderline universal vs cross-domain"
    accept_any_of_depth: ["cross-domain", "universal"]

  # ═══════════════════════════════════════════════════════════════════════
  # GROUP D: Evidence Type
  # ═══════════════════════════════════════════════════════════════════════
  - id: D01_evidence_cited_clear
    description: "FB is clearly grounded in cited source material"
    fb_name: "Visual Metaphor Complexity-Appreciation Curve"
    fb_definition: "Visual metaphors in advertising generate maximum audience appreciation when conceptual complexity strikes an optimal balance — too simple is boring, too complex is confusing. This inverted-U relationship was demonstrated across 12 product categories."
    expected_disciplines: ["design psychology", "marketing"]
    expected_domains: ["creative technology", "user experience"]
    expected_depth: "domain"
    expected_evidence: "cited"
    test_property: "cited evidence (clear source grounding)"

  - id: D02_evidence_axiomatic
    description: "FB is a self-evident logical truth, not empirically cited"
    fb_name: "Completeness Requires Contradiction"
    fb_definition: "Any sufficiently complete descriptive system must contain contradictions — this is a logical necessity following from Gödel's incompleteness theorems. The principle is axiomatic, not empirically observed."
    expected_disciplines: ["strategic thinking"]
    expected_domains: ["engineering practice"]
    expected_depth: "universal"
    expected_evidence: "axiomatic"
    test_property: "axiomatic evidence (logical necessity)"

  - id: D03_evidence_ambiguous
    description: "FB makes claims that could be either cited or axiomatic"
    fb_name: "Simplicity Amplifies Adoption"
    fb_definition: "Reducing feature count increases user adoption because cognitive load is the primary barrier to product engagement. This principle is widely observed across product categories."
    expected_disciplines: ["design strategy"]
    expected_domains: ["digital product", "user experience"]
    expected_depth: "cross-domain"
    expected_evidence: "cited"  # or axiomatic if interpreted as self-evident
    test_property: "ambiguous evidence — accepts cited or axiomatic"
    accept_any_of_evidence: ["cited", "axiomatic"]

  # ═══════════════════════════════════════════════════════════════════════
  # GROUP E: Input Edge Cases (name/definition format)
  # ═══════════════════════════════════════════════════════════════════════
  - id: E01_very_short_name
    description: "FB name is the minimum valid length (2 words)"
    fb_name: "Trust Decays"
    fb_definition: "Interpersonal and institutional trust erodes predictably when communication frequency drops below a threshold. The decay rate follows an exponential curve with a half-life measured in days of silence. Organizations must maintain contact cadence to preserve trust capital."
    expected_disciplines: ["strategic thinking"]
    expected_domains: ["business operations"]
    expected_depth: "cross-domain"
    expected_evidence: "cited"
    test_property: "short name (2 words)"

  - id: E02_very_long_name
    description: "FB name is near maximum length (7+ words)"
    fb_name: "The Systematic Decomposition of Complex Decision Trees Through Recursive Stakeholder Alignment and Iterative Constraint Relaxation"
    fb_definition: "Complex organizational decisions can be systematically decomposed by aligning stakeholders around shared constraints, then iteratively relaxing non-critical constraints until an acceptable solution emerges. This prevents decision paralysis in multi-stakeholder environments."
    expected_disciplines: ["strategic thinking", "engineering practice"]
    expected_domains: ["business operations", "engineering practice"]
    expected_depth: "domain"
    expected_evidence: "cited"
    test_property: "long name (9+ words) — should still classify correctly"

  - id: E03_very_short_definition
    description: "Definition is at minimum viable length (just a sentence)"
    fb_name: "Minimal Viable Principle"
    fb_definition: "Start with the smallest complete thing that works."
    expected_disciplines: ["strategic thinking"]
    expected_domains: ["business operations"]
    expected_depth: "cross-domain"
    expected_evidence: "axiomatic"
    test_property: "short definition (<50 chars)"

  - id: E04_very_long_definition
    description: "Definition is near token limit (500+ chars, dense)"
    fb_name: "Exhaustive Principle"
    fb_definition: "This is an exhaustively detailed principle that covers every possible angle, nuance, edge case, counter-argument, historical precedent, cross-cultural variation, domain-specific adaptation, implementation consideration, failure mode analysis, recovery strategy, measurement methodology, stakeholder impact assessment, ethical implication, regulatory consideration, scalability concern, maintainability factor, interoperability requirement, security implication, accessibility consideration, internationalization factor, performance characteristic, reliability concern, and future-proofing strategy for the core concept being described."
    expected_disciplines: ["strategic thinking"]
    expected_domains: ["business operations"]
    expected_depth: "domain"
    expected_evidence: "axiomatic"
    test_property: "long definition (500+ chars)"

  - id: E05_name_with_special_chars
    description: "FB name contains non-alphanumeric characters"
    fb_name: "Input → Output: The Transformation Principle™"
    fb_definition: "Every system can be understood as a transformation function mapping inputs to outputs. The quality of the transformation — not the inputs — determines system value. This framing reveals optimization opportunities at the transformation layer rather than input refinement."
    expected_disciplines: ["engineering practice"]
    expected_domains: ["engineering practice", "code & computation"]
    expected_depth: "universal"
    expected_evidence: "axiomatic"
    test_property: "special characters in name (→, ™, :)"

  - id: E06_name_non_english_terms
    description: "FB name contains non-English specialized terminology"
    fb_name: "Wabi-Sabi Aesthetic Acceptance in Digital Products"
    fb_definition: "The Japanese aesthetic philosophy of wabi-sabi — finding beauty in imperfection and transience — can be applied to digital product design by deliberately leaving 'rough edges' that signal authenticity and human craftsmanship rather than sterile perfection."
    expected_disciplines: ["design strategy"]
    expected_domains: ["digital product", "user experience", "creative technology"]
    expected_depth: "cross-domain"
    expected_evidence: "cited"
    test_property: "non-English terminology in name"

  - id: E07_definition_with_code_blocks
    description: "Definition contains code snippets — should not confuse classifier"
    fb_name: "TypeGuard Narrowing Pattern"
    fb_definition: "TypeScript's type guards (typeof, instanceof, custom predicates) narrow union types within conditional blocks: if (typeof x === 'string') { x.toUpperCase() }. This pattern eliminates runtime type errors by leveraging compile-time flow analysis."
    expected_disciplines: ["software engineering"]
    expected_domains: ["code & computation"]
    expected_depth: "specialized"
    expected_evidence: "cited"
    test_property: "code in definition text"

  - id: E08_name_with_numbers
    description: "FB name contains numbers and versioning"
    fb_name: "The 80/20 Principle v3.0: Pareto Distribution Revisited"
    fb_definition: "The Pareto principle states roughly 80% of effects come from 20% of causes. In modern complex systems, this distribution can shift based on network topology — highly connected nodes can concentrate impact even further, approaching 95/5 ratios in winner-take-all markets."
    expected_disciplines: ["strategic thinking", "data science"]
    expected_domains: ["business operations", "engineering practice"]
    expected_depth: "cross-domain"
    expected_evidence: "cited"
    test_property: "numbers and versioning in name"

  # ═══════════════════════════════════════════════════════════════════════
  # GROUP F: Semantic Complexity Edge Cases
  # ═══════════════════════════════════════════════════════════════════════
  - id: F01_overly_generic_principle
    description: "FB is so generic it could fit almost anywhere"
    fb_name: "Things Change Over Time"
    fb_definition: "All systems, organisms, and organizations undergo change as time progresses. Understanding that change is inevitable allows for better preparation and adaptation strategies in any context."
    expected_disciplines: ["strategic thinking"]
    expected_domains: ["business operations"]
    expected_depth: "universal"
    expected_evidence: "axiomatic"
    test_property: "overly generic principle — should still classify"

  - id: F02_jargon_heavy_academic
    description: "FB uses dense academic terminology from a specific field"
    fb_name: "Heteroscedasticity-Corrected Causal Inference"
    fb_definition: "When residual variance is non-constant across predictor levels (heteroscedasticity), standard ordinary least squares estimators become inefficient and standard errors biased. Heteroscedasticity-consistent standard errors (HCSE) with White's correction restore valid inference for causal claims in observational studies with uneven group variances."
    expected_disciplines: ["data science"]
    expected_domains: ["code & computation"]
    expected_depth: "specialized"
    expected_evidence: "cited"
    test_property: "dense academic jargon"

  - id: F03_definition_is_negation
    description: "FB is defined entirely by what it is NOT"
    fb_name: "Anti-Fragility in System Design"
    fb_definition: "Anti-fragile systems are NOT merely robust (resistant to shocks) and NOT merely resilient (recovering from shocks). Instead, they actively IMPROVE when exposed to volatility, randomness, and stressors — gaining strength from disorder rather than merely surviving it."
    expected_disciplines: ["strategic thinking", "engineering practice"]
    expected_domains: ["engineering practice", "business operations"]
    expected_depth: "cross-domain"
    expected_evidence: "cited"
    test_property: "definition by negation (NOT X, NOT Y, but Z)"

  - id: F04_meta_principle
    description: "FB is about principles themselves — meta-level"
    fb_name: "Principle Decay Under Organizational Scale"
    fb_definition: "First-principles thinking degrades as organizations scale because communication layers introduce abstraction that transforms concrete principles into vague mission statements. The number of management layers directly correlates with principle dilution — each layer strips context and adds generality until the original insight becomes a platitude."
    expected_disciplines: ["strategic thinking"]
    expected_domains: ["business operations"]
    expected_depth: "cross-domain"
    expected_evidence: "cited"
    test_property: "meta-principle (principle about principles)"

  - id: F05_emotionally_charged_topic
    description: "FB addresses a politically/emotionally sensitive topic"
    fb_name: "Moral Licensing in Sustainable Design"
    fb_definition: "When designers make one environmentally conscious choice (e.g., using recycled materials), they become psychologically licensed to make less sustainable choices elsewhere (e.g., ignoring supply chain emissions). This moral licensing effect undermines holistic sustainability efforts by creating an illusion of net-positive impact."
    expected_disciplines: ["design strategy", "strategic thinking"]
    expected_domains: ["digital product", "business operations"]
    expected_depth: "cross-domain"
    expected_evidence: "cited"
    test_property: "emotionally charged topic — should not bias classification"

  - id: F06_self_referential
    description: "FB definition references itself circularly"
    fb_name: "Design is Design"
    fb_definition: "The act of design recursively defines itself through the process of designing. Design cannot be separated from its practice because design thinking is design doing is design being. To understand design is to design understanding itself."
    expected_disciplines: ["design strategy"]
    expected_domains: ["creative technology"]
    expected_depth: "domain"
    expected_evidence: "axiomatic"
    test_property: "self-referential/circular definition"

  # ═══════════════════════════════════════════════════════════════════════
  # GROUP G: Content-Type Edge Cases
  # ═══════════════════════════════════════════════════════════════════════
  - id: G01_process_template_type
    description: "FB is a HOW-TO process, not a principle"
    fb_name: "Five-Step Design Sprint Protocol"
    fb_definition: "Execute a design sprint in five days: Monday-map the problem, Tuesday-sketch solutions, Wednesday-decide on approach, Thursday-prototype, Friday-test with users. Each day has specific activities and timeboxes that must be followed for the sprint to produce valid results."
    expected_disciplines: ["design strategy"]
    expected_domains: ["digital product", "user experience"]
    expected_depth: "domain"
    expected_evidence: "cited"
    test_property: "process template (HOW-TO) classified correctly"

  - id: G02_tool_specific_instruction
    description: "FB describes a specific tool feature, not a general principle"
    fb_name: "Figma Auto-Layout Nesting Strategy"
    fb_definition: "Figma's auto-layout can be nested up to 5 levels deep to create responsive components that adapt to content changes. The key pattern is: outermost frame for page structure, middle frames for sections, innermost frames for individual UI elements with hug contents enabled."
    expected_disciplines: ["graphic design"]
    expected_domains: ["digital product", "creative technology"]
    expected_depth: "specialized"
    expected_evidence: "cited"
    test_property: "tool-specific instruction — still classifiable"

  - id: G03_case_study_narrative
    description: "FB is primarily a case study with embedded principle"
    fb_name: "Netflix Personalization at Scale"
    fb_definition: "Netflix's recommendation engine processes 100M+ user profiles using collaborative filtering combined with content-based features. The key architectural insight: thumbnail personalization (showing different artwork to different users for the same title) drove more engagement improvement than algorithm accuracy gains."
    expected_disciplines: ["ai engineering", "design strategy"]
    expected_domains: ["ai & agents", "digital product", "user experience"]
    expected_depth: "domain"
    expected_evidence: "cited"
    test_property: "case study with embedded principle"

  # ═══════════════════════════════════════════════════════════════════════
  # GROUP H: JSON Output Format Edge Cases
  # ═══════════════════════════════════════════════════════════════════════
  - id: H01_discipline_as_string_not_list
