  cluster_segments:
  - source_book: The Five Dysfunctions of a Team — Patrick Lencioni
    text: 'Building a cohesive team requires navigating five sequential dysfunctions: absence of trust (unwillingness to be
      vulnerable), fear of conflict (artificial harmony), lack of commitment (ambiguity breeds hesitation), avoidance of accountability
      (low standards), and inattention to results (status and ego trump outcomes). Each dysfunction enables the next — you
      cannot have productive conflict without trust, and you cannot hold people accountable without clarity of commitment.
      The model is descriptive: it classifies team dysfunctions into categories and shows their causal sequence.'
  - source_book: The Culture Code — Daniel Coyle
    text: 'High-performing groups pass through predictable phases: first, they establish belonging cues that signal safety;
      then they navigate vulnerability loops where one person''s openness triggers reciprocal openness; finally, they establish
      a shared purpose that aligns individual action with group goals. These phases are not optional — groups that skip the
      safety phase cannot achieve honest vulnerability, and groups without vulnerability cannot sustain purpose. The model
      describes what healthy group development looks like, not why any specific group succeeds or fails.'
  is_convergent: true
  should_extract: true
  expected_fb:
    is_summary: false
    route: FB
    name: Sequential Group Development Stages
    definition: Teams and groups develop through a predictable sequence of phases — forming (orientation), storming (conflict),
      norming (cohesion), performing (productivity), and adjourning (dissolution) — with each phase building on the resolution
      of the previous phase's central tension. A descriptive model that classifies group development into categories and their
      sequential relationship.
    mechanism: 'This is a DESCRIPTIVE MODEL, not a causal mechanism. It classifies group development into stages (WHAT categories
      exist) and their sequential dependencies (HOW they relate), but does not identify a causal force that drives transition.
      Tuckman''s original formulation (1965) was observational — he reviewed 50 studies of group development and identified
      these recurring phases. Lencioni''s five dysfunctions and Coyle''s vulnerability loops describe the same pattern using
      different vocabulary: safety → vulnerability → purpose maps to forming → storming/norming → performing. The model''s
      value is diagnostic: it tells you WHERE a team is stuck and WHAT to work on next.'
    boundary: 'Applies to newly formed task-oriented groups with a shared objective and interdependent work. Fails for: (1)
      groups with no shared task (social groups); (2) groups with extreme power asymmetry where one person dictates process;
      (3) groups that disband before reaching storming. The model is descriptive, not prescriptive — some groups cycle back
      through earlier stages when membership changes.'
    consequence: Leaders who expect immediate high performance from new teams are setting them up to fail — the storming phase
      is unavoidable and productive conflict must be facilitated, not suppressed. Teams that skip the trust-building phase
