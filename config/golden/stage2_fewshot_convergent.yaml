- id: CONV-040
  domain: typography
  discipline: graphic design
  source_books:
  - About Face — Alan Cooper
  - Generative Design — Benedikt Gross
  cluster_segments:
  - source_book: About Face — Alan Cooper
    text: 'Typography in user interfaces serves two masters: readability and hierarchy. Font size, weight, spacing, and color
      create an information hierarchy that guides the user''s attention. Body text at 14-16px with a line height of 1.5 is
      optimal for reading on screens. But the real craft is in the subtle adjustments — kerning pairs (adjusting space between
      specific letter combinations like ''AV'' and ''To''), tracking (uniform letter-spacing across a word), and leading (line
      spacing) — that transform legible text into polished, professional typography.

      '
  - source_book: Generative Design — Benedikt Gross
    text: 'In computational typography, letterform spacing can be defined algorithmically rather than manually. Each glyph
      has a bounding box and sidebearings (left and right margins) that determine default spacing. Kerning exceptions override
      these defaults for specific letter pairs where the default spacing creates optical gaps — classic examples include ''AV,''
      ''WA,'' ''To,'' and ''Ve.'' In variable fonts, these spacing parameters become axes that can be interpolated continuously,
      allowing responsive typography that adapts to screen size and reading distance.

      '
  is_convergent: true
  should_extract: true
  expected_fb:
    is_summary: false
    route: FB
    name: Optical Kerning Adjustment
    definition: Specific letter pair combinations (AV, WA, To, Ve) require custom spacing overrides because the default sidebearing
      spacing creates optical gaps. Kerning pairs are hand-tuned or algorithmically defined exceptions to standard letter
      spacing that make text appear evenly spaced to the human eye, even when geometric spacing between bounding boxes is
      unequal.
    mechanism: The human eye perceives spacing between letters optically, not geometrically. Two letters with diagonal strokes
      (A and V) create a triangular gap that appears larger than the rectangular gap between straight-sided letters (H and
      I) at the same geometric distance. Kerning corrects this by reducing the space for diagonal-adjacent pairs and increasing
      it where strokes nearly touch. The adjustment is pair-specific and perceptually driven — there is no universal formula,
      only perceptual judgment refined by tradition.
    boundary: 'Applies specifically to Latin-script typography where letters are spaced side-by-side. Fails for: (1) monospaced
      fonts where all characters occupy equal width (kerning is disabled by design); (2) scripts where character spacing follows
      different rules (Arabic cursive connections, CJK ideographic squares); (3) purely geometric typefaces where optical
      correction is deliberately rejected as part of the design philosophy.'
    consequence: Well-kerned text is processed faster and perceived as more professional than unkerned text at the same content
      and layout. The difference is often unconscious — readers sense something is 'off' without identifying the cause. For
      body text, automatic kerning (metric or optical) is sufficient; for headlines, logos, and display text, manual kerning
      pair adjustment is standard practice.
    evidence_passages:
    - kerning pairs (adjusting space between specific letter combinations like 'AV' and 'To')
    - Kerning exceptions override these defaults for specific letter pairs
    - classic examples include 'AV,' 'WA,' 'To,' and 'Ve.'
    extraction_type: normative_heuristic
    content_type: principle
    depth: specialized
  rationale: 'GENUINE SPECIALIZED POSITIVE (D2226). Optical kerning is a narrow sub-technique within typography, which is
    itself a sub-field of graphic design. It passes the specialization test: most practitioners IN the parent domain (graphic
    design) would understand this, but it requires typography-specific knowledge. It is tool-adjacent (applies to any vector
