# anchor_axis_authority.yaml — WHICH artifact OWNS each ANCHOR axis, and which must follow it.
#
# WHY (BUG-605, the blindspot this closes)
#   The ANCHOR family is read through five artifacts regenerated by DIFFERENT scripts at
#   DIFFERENT times. Nothing asserted they AGREE, so the owner's D-2795 discipline re-label
#   (12 corrections) landed in ONE artifact while the consolidated/views stayed stale — and the
#   S4 golden few-shot derived from a stale copy would carry a label the gold contradicts.
#   `scripts/check_anchor_axis_consistency.py` re-derives every consumer from the authority and
#   counts the drift. Direction of authority: THIS FILE (C12/C12c) — no path, column or cohort
#   is a literal in the script.
#
# READING RULE: when asked "what is the discipline/depth/domain of anchor Rxxx?" read the
# AUTHORITY artifact named below, never a consumer's copied column (that mistake is BUG-422).
schema_version: '1.0'
decided: D-2811
status: active
depth_menu: config/depth_classes.yaml          # the numeric<->label map, read at runtime (C12)
join: {key: item_id, normalization: collapse_whitespace}

axes:
  # --- the two axes that live ONLY in the five-axis views (mutually consistent 2026-10-03) ---
  content_type:
    authority: {file: governance/ANCHOR_208_FIVE_AXIS_VIEW_20260930.csv, column: content_type, kind: csv}
    consumers:
      - {file: governance/ANCHOR_150_FIVE_AXIS_VIEW_20260927.csv, column: content_type, kind: csv}
  extraction_type:
    authority: {file: governance/ANCHOR_208_FIVE_AXIS_VIEW_20260930.csv, column: extraction_type, kind: csv}
    consumers:
      - {file: governance/ANCHOR_150_FIVE_AXIS_VIEW_20260927.csv, column: extraction_type, kind: csv}

  # --- DEPTH: the owner's D-2760 corrected map is the authority (owns 208/208) ---
  depth:
    authority: {file: governance/ANCHOR_208_DEPTH_CORRECTED_20261002.json, column: depth_label, kind: json}
    consumers:
      - {file: governance/ANCHOR_208_CONSOLIDATED_20261007.json, column: depth_label, kind: json}
      - {file: governance/depth_anchor_conformance_20261002.json, column: depth_label, kind: json, rows_key: examples}
      - {file: governance/ANCHOR_208_FIVE_AXIS_VIEW_20260930.csv, column: depth, kind: csv, normalizer: depth_numeric_to_label}
      - {file: governance/ANCHOR_150_FIVE_AXIS_VIEW_20260927.csv, column: depth, kind: csv, normalizer: depth_numeric_to_label}

  # --- DISCIPLINE: the owner-finalized rederived v8 lineage (201 rows, D-2844/D-2864/D-2866) is the
  #     authority. The legacy 204-row conformance + normalized/5-axis-view copies are SUPERSEDED (D-2868). ---
  discipline:
    authority: {file: governance/discipline_anchor_rederived_v8_20261007.json, column: discipline, kind: json}
    consumers:
      - {file: governance/ANCHOR_208_CONSOLIDATED_20261007.json, column: discipline, kind: json}

  # --- DOMAIN / PRIMARY_DOMAIN: the rederived v8 lineage owns these (D-2866/D-2868; pipe-joined
  #     `domain` + first-token `primary_domain`, schema-compatible columns added by D-2868). ---
  domain:
    authority: {file: governance/discipline_anchor_rederived_v8_20261007.json, column: domain, kind: json}
    consumers:
      - {file: governance/ANCHOR_208_CONSOLIDATED_20261007.json, column: domain, kind: json}
  primary_domain:
    authority: {file: governance/discipline_anchor_rederived_v8_20261007.json, column: primary_domain, kind: json}
    consumers:
      - {file: governance/ANCHOR_208_CONSOLIDATED_20261007.json, column: primary_domain, kind: json}

# PROPAGATION ORDER (the WRITE limb, D-2812 / BUG-628). `scripts/apply_anchor_axis_authority.py`
# walks this list: `propagate` overwrites the axis column of a VIEW archive from the authority;
# `regenerate` re-runs a consumer's own deterministic generator so no artifact is ever a
# hand-patch of a machine derivation (and its input sha256 stays honest).
propagation:
  order:
    - {kind: propagate, file: governance/ANCHOR_208_FIVE_AXIS_VIEW_20260930.csv}
    - {kind: propagate, file: governance/ANCHOR_150_FIVE_AXIS_VIEW_20260927.csv}
    - {kind: regenerate, script: scripts/regenerate_anchor_208_v8.py}

# Declared known drift (owner-owed). Ceiling is SHRINK-ONLY: a declared cell that starts
# agreeing must be REMOVED (the rail exits 2 on it), never left to hide a completed fix.
declared_drift: []
# R021 RESOLVED 2026-10-03 (owner): content_type=noise_drop -> depth and discipline do NOT apply.
# Depth + discipline cleared to empty in both views; R021 depth_label cleared in DEPTH_CORRECTED
# and CONSOLIDATED (aligned with depth_anchor_conformance's 207-row exclusion). Ceiling 2 -> 0.
# The 4 emerging-discipline rows (R040/R053/R080/R091) are DECLARED emerging: excluded from the
# golden pool, pending future owner+verifier adjudication (D-2795). Never a synthesized golden label.
declared_drift_ceiling: 0
