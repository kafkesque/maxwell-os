  source: governance/ROUNDTABLE_CROSSEXAM_20260919.md
  verification: 'ruler 150 blind rows already certified with 51 abstentions retained; no provenance column exists (BUG-298)'
  description: 'Ruling on the question whether a clean anchor is needed for golden examples or to train S2 and S4: an anchor is required, a training set is not, and no training set may be built from the current labels (D274d). The anchor is versioned and human-adjudicated: (1) ANCHOR-1 = the existing 150 blind rows, frozen, with the 51 abstentions retained as abstentions; (2) ANCHOR-2 = about 100 fresh rows drawn AFTER the vocabulary freeze, to control contamination by the R5 edits; (3) a test-retest of 30 rows after at least two weeks, which is the single-coder ceiling the floors should be anchored to; (4) per-axis conformance sets - positive, near-neighbour negative, out-of-vocabulary, contradiction-trap; (5) must-link/cannot-link pairs for work identity; (6) known-item retrieval queries derived from source_segments, which is system-independent unlike the current golden set whose ids were chosen from live hybrid search output. Every item stamped anchor_version, menu_hash, taxonomy_version, coder, date, abstention. The first thing NOT to do with the anchor is fine-tune on it.'
