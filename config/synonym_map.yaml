# ── D28 Pattern Expansion ──
# These patterns expand the D28 GENERAL_PATTERNS list to cover actual S3 vocabulary.
# Previously-missed domains: information architecture, design systems, branding,
# prototyping, agile, management, business law.
d28_expansion:
  description: >
    Addresses FM2: D28 uses hardcoded pattern lists that can't match
    actual S3 domain vocabulary. This expansion maps every S3 domain label
    to patterns that D28 can use for content-based classification.
  original_general_patterns:
    - css
    - html
    - rendering
    - physics
    - force
    - vector
    - array
    - data structure
    - code
    - programming
    - browser
    - font
    - typography
    - color
    - layout
    - grid
    - syntax
  expanded_patterns:
    - css
    - html
    - rendering
    - physics
    - force
    - vector
    - array
    - data structure
    - code
    - programming
    - browser
    - font
    - typography
    - color
    - layout
    - grid
    - syntax
    # ── New: previously missing domains ──
    - "information architecture"
    - "design system"
    - branding
    - prototyping
    - agile
    - management
    - "business law"
    - "project management"
    - workflow
    - process
    - strategy
    - framework
    - methodology
    - system
    - model
    - pattern
    - principle
    - heuristic
    - guideline
    - best practice
    - governance
    - compliance
    - risk
    - quality
    - metric
    - benchmark
    - evaluation
    - validation
    - verification

# ── D28 Routing Patterns ──
# These replace the hardcoded lists in tools/space_router.py and tools/eval_loop.py.
# Single source of truth for D28 disambiguation logic (FM2 root cause).
routing:
  agentic_patterns:
    description: "Agentic/Maxwell-specific patterns → system-phase is correct"
    patterns:
      - agentic
      - pipeline
      - orchestrat
      - harness
      - delegat
      - sub-agent
      - multi-agent
      - "llm "
      - goose
      - maxwell
      - telemetry
      - toolset
      - child agent
      - task orchestration
    routing: "private"
    when: "has_system_phase"

  personal_patterns:
    description: "Personal/psychological patterns → personal is correct"
    patterns:
      - habit
      - cognition
      - bias
      - behavior
      - motivation
      - identity
      - emotion
      - psychology
      - self
      - mindfulness
      - personal
      - individual
      - introspection
    routing: "private"
    when: "has_personal"

  general_patterns:
    description: "General knowledge patterns → system-phase/personal is WRONG → overrule to Non-Private"
    patterns:
      - css
      - html
      - rendering
      - physics
      - force
      - vector
      - array
      - data structure
      - code
      - programming
      - browser
      - font
      - typography
      - color
      - layout
      - grid
      - syntax
      - "information architecture"
      - "design system"
      - branding
      - prototyping
      - agile
      - management
      - "business law"
      - "project management"
      - workflow
      - process
      - strategy
      - framework
      - methodology
      - system
      - model
      - pattern
      - principle
      - heuristic
      - guideline
      - "best practice"
      - governance
      - compliance
      - risk
      - quality
      - metric
      - benchmark
      - evaluation
      - validation
      - verification
    routing: "non_private"
    when: "always"

  # D30: Fixed — D28 now also triggers on system-phase without professional context.
  # Previously system-phase+general knowledge fell through to "purely personal" → Private.
  # This was the root cause of ~90% false-positive rate on Private routing.
  d28_trigger_fix:
    description: "D30 fix: D28 disambiguation now triggers when ANY trigger context (personal, system-phase, design, business, academic) is present with a non-empty S3 domain. Previously required professional context."
    fixed_in: "tools/space_router.py :: route_by_fb()"
    test_cases: 12/12 passing
    date: "2026-07-08"

  ambiguous_default:
    description: "Safety-first: mixed context + no pattern match → Private"
    routing: "private"
    when: "never_matches"

# ── Usage ──
usage:
  lookup: >
    Given a search term, find the most likely domain(s) by matching against
    synonyms, keywords, and patterns. Return ranked list.
  generation: >
    python3 tools/synonym_generator.py --validate
  d28_integration: >
    Replace hardcoded GENERAL_PATTERNS in D28 with expanded_patterns from
    this file. Verify no regression on known test cases.
