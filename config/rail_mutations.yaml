  # D-2987: TWO locks for the state rule. The first protects the SIGN's completeness limb (a declared state
  # must carry a sign - the check that, on its first run, measured an undeclared 'ratified' state holding 133
  # decisions). The second protects the PARTITION limb (a state the census counts must have a bucket - the check
  # that FAILED on the pre-D-2987 config with 9 states / 1047 decisions unaccounted).
  - id: the_state_sign_completeness_limb_is_load_bearing
    subject: scripts/check_governance_faces.py
    op: replace
    find: '           for w in sorted(w for w in required if w not in gl)]'
    replace: '           for w in []]  # MUTATION (D-2676): a declared state need not carry a sign'
    runner: scripts/check_governance_faces.py
    runner_args: [--selftest]
    expect: red
    mutated_rc: 1
    marker: '  !!  a declared state with NO sign must fire (D-2987)'
    why: >-
      D-2987: a state with no sign is a state the face does not show. The mutant makes the completeness limb
      silent, so the known answer that NAMES the rule is SEEN to be load-bearing rather than only a counter.

  - id: the_state_partition_limb_is_load_bearing
    subject: scripts/check_governance_faces.py
    op: replace
    find: '    missing = sorted(counted - set(seen))'
    replace: '    missing = []  # MUTATION (D-2676): a state with no bucket is accounted for'
    runner: scripts/check_governance_faces.py
    runner_args: [--selftest]
    expect: red
    mutated_rc: 1
    marker: '  !!  a state the census counts that NO bucket holds must fire (the BUG-765 shape)'
    why: >-
      D-2987/BUG-765: the decisions line summed to 981 of 1114 because 133 decisions sat in a state no bucket
      held. The mutant pretends an unheld state is accounted for, so the control that NAMES the partition is
      SEEN to be load-bearing.

  # D-2988/T-103: the LICENSED store write for owner-ruled labels. Two guards carry the whole authority of the
  # write - the scope (a write may only execute a ruling that EXISTS) and the target (the write copies the
  # production mapper's own answer, never an invented one). Each is reduced to a no-op here, so the control that
  # NAMES it is SEEN to be load-bearing rather than only counted.
  - id: the_store_write_scope_guard_is_load_bearing
    subject: scripts/apply_relabel_store_write.py
    op: replace
    find: "        if action not in RULED_ACTIONS:\n            faults.append(f\"scope/not-ruled:"
    replace: "        if False:  # MUTATION (D-2676): a licensed unit no ruling reaches is written anyway\n            faults.append(f\"scope/not-ruled:"
    runner: scripts/apply_relabel_store_write.py
    runner_args: [--selftest]
    expect: red
    mutated_rc: 1
    marker: '  !!  scope_refuses_an_unruled_licensed_unit'
    why: >-
      D-2898: no agent mints a LABEL. With the guard inert, a unit the owner has NOT ruled (ESCALATE) is carried
      into the write, so the control that names that refusal is SEEN to be the thing standing between a licensed
      repair and a script-minted label.

  - id: the_store_write_target_agreement_is_load_bearing
    subject: scripts/apply_relabel_store_write.py
    op: replace
    find: '            if _norm(mapped) != _norm(target) or _norm(live) != _norm(target):'
    replace: '            if False:  # MUTATION (D-2676): the mapper answer need not agree with the owner target'
    runner: scripts/apply_relabel_store_write.py
    runner_args: [--selftest]
    expect: red
    mutated_rc: 1
    marker: '  !!  mapper_disagreement_is_refused'
    why: >-
      T-103/D-2988: the write's authority is that it copies the PRODUCTION MAPPER's own answer for a row an owner
      ruling already reaches. With the agreement uncompared, a row whose mapper answer, owner target and recorded
      packet answer disagree is written with whichever value arrived first - the applier choosing between three
      authorities, which is exactly the act the owner reserves.

  # D-2989: the ADVERTISED-FIELD rail. Its whole value is that a claim an agent reads is either TRUE or DECLARED,
  # and the two guards below are the two ways that could be lost while every line of the report stayed green: the
  # undeclared advert (nothing names the debt) and the owner word that would be accepted whatever it said. Each is
  # reduced to a no-op, so the control that NAMES it is SEEN to be load-bearing rather than only counted.
  - id: the_undeclared_advert_guard_is_load_bearing
    subject: scripts/check_served_fields.py
    op: replace
    find: "        return DEFECT_UNDECLARED, (\n            f\"{field} is ADVERTISED by"
    replace: "        return OK, (  # MUTATION (D-2676): an advert no declaration names passes silently\n            f\"{field} is ADVERTISED by"
    runner: scripts/check_served_fields.py
    runner_args: [--selftest]
    expect: red
    mutated_rc: 1
    marker: '  !!  advertised_flagged_undeclared_is_a_defect'
    why: >-
      D-2989: with the guard inert, a field the payload publishes while a register that owns its truth calls it
      defective is reported as OK - an agent reads a fabricated measurement and the rail says the surface is clean.
      That is the BUG-511 family by construction, and the control asserts it is refused.

  - id: the_owner_word_vocabulary_guard_is_load_bearing
    subject: scripts/check_served_fields.py
    op: replace
    find: '    if word in vocabulary:'
    replace: '    if True:  # MUTATION (D-2676): any word at all is accepted as an owner word'
    runner: scripts/check_served_fields.py
    runner_args: [--selftest]
    expect: red
    mutated_rc: 1
    marker: '  !!  a_word_outside_the_vocabulary_is_refused'
    why: >-
      T-101/D-2989: the re-anchor sheet once accepted keep/replace/drop/add - tokens NO reader implemented - and the
      owner was left guessing what to write. With this guard inert, a word outside the declared vocabulary is
      accepted and the decision it was supposed to license is read as if it were ratified. The control names the
      refusal, so the day the vocabulary stops being enforced the gate says so.

  - id: the_feedback_absence_guard_is_load_bearing
    subject: pipeline/feedback.py
    op: replace
    find: "    if n == 0:\n        return None"
    replace: "    if n == 0:\n        return 0.0  # MUTATION (D-2676): an empty ledger reports 0.0 instead of ABSENT"
    runner: scripts/check_feedback_parity.py
    runner_args: [--selftest]
    expect: red
    mutated_rc: 1
    marker: '  !!  an_empty_ledger_is_absent_not_zero'
    why: >-
      D-2957/D-2989: 'nobody has rated this FB' and 'rated 0.0' are different facts, and the aggregate is the only
      place that decides which one the store holds. With the absence branch inert, every un-rated FB reads as
      maximally bad - and because the serving path multiplies by (1.0 + score), a store migrated through this
      mutant would rank the entire corpus as discredited. The control names the absence.

  - id: the_receipt_module_count_rerecord_is_load_bearing
    subject: scripts/check_config_defaults.py
    op: replace
    find: '    return recorded if recorded != files else -1'
    replace: '    return -1  # MUTATION (D-2676): a measured receipt field is never re-recorded'
    runner: scripts/check_config_defaults.py
    runner_args: [--selftest]
    expect: red
    mutated_rc: 1
    marker: '  !!  a receipt whose MODULE count moved is STALE and must be re-recordable by the rail (D-2989)'
    why: >-
      D-2989/D-2642: the receipt carries a MEASURED module count that the paired contract compares, and the only
      re-record path used to be a CEILING change - so the measurement could go stale with no act able to refresh it
      (the D-2981 shape: a measurement with no writer). With the guard inert the drift is invisible again, the
      receipt silently disagrees with the tree, and the contract's failure would look like a test problem rather
      than a stale measurement. The control names the staleness.

  #: BUG-782 — the shrink guard. `--render`/`--apply` rebuild the DERIVED column from the tiers; with the tiers
  #: unsigned that write would have blanked the owner's 84 hand-typed words (the only record of them).
  - id: the_write_may_blank_a_hand_typed_owner_word
    subject: scripts/owner_marks.py
    op: replace
    find: '    if typed:'
    replace: '    if False:  # MUTATION (BUG-782): a write may blank a hand-typed cell again'
    runner: scripts/owner_marks.py
    runner_args: [--selftest]
    expect: red
    mutated_rc: 1
    marker: '   FAIL a_write_never_blanks_a_hand_typed_cell'
    why: >-
      BUG-782 (MEASURED 2026-10-14): the owner's 84 words were typed by hand into `owner_ruling` while --apply had
      never run, and `--render`/`--apply` rebuild that column FROM THE TIERS - so with the tiers still unsigned,
      running --apply would have written "" over all 84 cells and destroyed the only machine-readable record of
      the owner's decision. A derived column is refreshed, never ERASED. The control builds exactly that
      situation (a non-empty derived cell whose rebuilt value is empty) and the guard must refuse it by name.

  #: BUG-785 — the T-117 reader. The owner filled `owner_action` on 72/72 rows and nothing read it; the
  #: ingest is the missing bridge, and its two refusals are load-bearing: a word outside the declared
  #: vocabulary, and a home no canonical declares (writing either MINTS the owner's word, D-2898).
  - id: the_relabel_ingest_takes_an_unknown_word_on_trust
    subject: scripts/ingest_relabel_rulings.py
    op: replace
    find: '        if action not in actions:'
    replace: '        if False:  # MUTATION (BUG-785): a word outside the declared vocabulary is ingested anyway'
    runner: scripts/ingest_relabel_rulings.py
    runner_args: [--selftest]
    expect: red
    mutated_rc: 1
    marker: '  FAIL a_word_outside_the_declared_vocabulary_is_refused'
    why: >-
      BUG-785 (MEASURED 2026-10-14): the owner's 72 words sat in a column nothing read, and the bridge that now
      reads them decides 311 rows. A word outside the DECLARED vocabulary is a word the owner never said - an
      ingest that admits it writes a ruling into config/relabel_rulings.yaml on the strength of a typo, which is
      how a machine mints a label (D-2898). The control pins it: 'APPROVE' is refused, and the refusal names the
      row and the vocabulary.

  - id: the_relabel_ingest_writes_a_home_no_canonical_declares
    subject: scripts/ingest_relabel_rulings.py
    op: replace
    find: '                if lowered not in homes:'
    replace: '                if False:  # MUTATION (BUG-785): a home the taxonomy does not declare is written'
    runner: scripts/ingest_relabel_rulings.py
    runner_args: [--selftest]
    expect: red
    mutated_rc: 1
    marker: '  FAIL a_home_that_no_canonical_declares_is_refused_never_minted'
    why: >-
      BUG-785 (MEASURED 2026-10-14): 16 of the owner's CORRECT cells name a home, and each one must already exist
      as a canonical of config/taxonomy.yaml (a discipline or a domain). If the guard is inert, a CORRECT to a
      home the taxonomy does not declare creates the home by writing it - the applier then declares an alias under
      a canonical that is not in the menu, and the corpus acquires a label nothing can re-derive (C12/R14). Two
      of the 16 homes also carried trailing whitespace, which the guard normalises rather than silently
      mismatching.

  #: BUG-787 — the WRITER was wired to the generator's output while the READER used the declared sheet.
  - id: the_reanchor_writer_reads_the_generators_sheet_again
    subject: scripts/reanchor_retrieval_goldens.py
    op: replace
    find: '    return ns.reviewed_csv, ns.reviewed_draft'
    replace: "    return ns.csv, ns.yaml_out  # MUTATION (BUG-787): the writer is wired back to the GENERATOR's sheet"
    runner: scripts/reanchor_retrieval_goldens.py
    runner_args: [--selftest]
    expect: red
    mutated_rc: 1
    marker: '  !!  the_writer_reads_the_declared_reviewed_inputs_never_the_generators_output'
    why: >-
      BUG-787 (MEASURED 2026-10-14 by running the approved apply): --check read the DECLARED reviewed sheet
      (rc 0, 29/29 verdicts) while --apply was wired to args.csv/args.yaml_out, the GENERATOR's empty outputs, and
      refused all 29 queries - a COMPLETED 150-cell signed act that could never be applied. A reader wired to the
      wrong file reports a false debt; a WRITER wired to the wrong file is a permanently unrealisable step. This
      mutation returns the wiring to the generator's output and must red the control that asserts both modes
      resolve the DECLARED inputs through one helper.

  - id: the_word_provenance_guard_is_load_bearing
    subject: pipeline/ingest_gate.py
    op: replace
    find: 'if source in ("", none_token):'
    replace: 'if False:  # MUTATION (D-2676): a word with NO provenance counts as an owner act again'
    runner: scripts/check_ingest_identity_gate.py
    runner_args: [--selftest]
    expect: red
    mutated_rc: 1
    marker: '  FAIL a_word_with_no_provenance_is_owed_not_ruled'
    why: >-
      BUG-786 (MEASURED 2026-10-14): the door counted a word as RULED in all 84 collapse rows while the sheet's
      `ruling_source` said `none` for every one of them - the cells had been typed by hand into the DERIVED column,
      the one `--apply` writes - so the collapse lane could read as RELEASED without an owner act. That is the
      BUG-782 defect one column over, and the guard is the only thing that keeps the two apart. With it inert, a
      provenance-less word ends the debt again and the reading that says so stops firing. The control NAMES the
      reading, so the day a typed cell can masquerade as a signature again the gate says it.

  - id: the_anchor_set_multiplicity_guard_is_load_bearing
    subject: scripts/reanchor_retrieval_goldens.py
    op: replace
    find: 'if mode == "single" and len(anchors) > 1:'
    replace: 'if False and len(anchors) > 1:  # MUTATION (D-2676): the DECLARED anchor multiplicity stops being enforced'
    runner: scripts/reanchor_retrieval_goldens.py
    runner_args: [--selftest]
    expect: red
    mutated_rc: 1
    marker: '  !!  two_anchors_in_single_mode_are_refused'
    why: >-
      D-2991: the mode (single | set) is a DECLARED fact about a golden set, and this guard is the only thing that
      keeps the declaration honest. With it inert, a sheet that marks many anchors is silently read as a SET while
      config says single - i.e. the RULER's meaning changes with no decision, which is exactly the failure an
      inferred mode is (a ruler whose meaning depends on the data it measured). The control names the refusal, so
      the day the multiplicity stops being enforced the gate says so.
