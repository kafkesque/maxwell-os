# config/content_type_restamp.yaml - the BUG-712 retro re-stamp GATE's declarations (C12/C20: no value is typed in code).
#
# WHY THIS FILE EXISTS (MEASURED 2026-10-12, live store, 7,640 rows).
# The producer fix landed (D-2938: stage4_merge persists _resolve_content_type) and the router is calibrated
# (D-2953: open_tension_strict RATIFIED+ENABLED), so the residual the governed re-stamp acts on is no longer 122
# rows - it is the OWNER-ADJUDICATED residue. Re-derived here rather than restated (the buglog's "12" is a CLAIM
# until this tool re-derives it): the adjudication map carries 546 rows, of which 527 do NOT resolve to the live
# store at all, 7 sit ALREADY at their proposed value, 0 are STALE, and 12 are APPLICABLE.
#
# THE TWO VOCABULARIES (the finding, BUG-741): the map's `proposed` field mixes two DIFFERENT vocabularies -
#   content_types  = {principle, process_template, process_instance, tool_instruction, growth_edge}   (5)
#   dispositions   = {classified, noise_drop, quarantine}                                           (3)
# 11 of the 12 applicable rows name a declared content_type; ONE (tool_instruction -> noise_drop) names a
# DISPOSITION. Writing content_type='noise_drop' would mint a 6th content type that the schema does not declare
# (config/content_types.yaml#dropped_content_types is the cemetery for exactly that mistake), and the store carries
# ZERO rows with a disposition as their content_type (census: principle 6,577 | process_template 774 |
# process_instance 156 | tool_instruction 108 | growth_edge 25). So the disposition row is REFUSED here and
# escalated as an OWNER-RULING, never silently converted into a type.
#
# THE WARRANT RULE (why the router diff is NOT the write set): the calibrated router would move 14 rows; 12 have
# an owner warrant and 2 (BUG-735) are the strict form's own survivors, 50% precise at n=2. A store label may be
# moved by a PREDICTION only above a declared bench floor - below it an OWNER WARRANT is required. So the write
# set is (the owner's map) JOIN (the live PRE-STATE), and a router-only move can never enter it by construction.
schema_version: 1
bug: [BUG-712, BUG-741, BUG-742]
decision: D-2953

# THE WARRANT - the owner's own adjudication map, the ONE home. Never re-typed here, never copied into a receipt.
# D-2967 (BUG-741): the map's PATH and its DESTINATION KEYS are declared ONCE, in
# config/content_types.yaml#adjudication_map, and this gate READS them there instead of restating them. The router
# (tier 1) and the migration read that same block, so a rename cannot leave this gate looking at a key nobody
# writes while the router RAISES on the legacy one - one home, two readers, both loud.
# The destination is a ROLE XOR a DISPOSITION: a row carries exactly one of map_schema.role_key /
# map_schema.disposition_key, and the KEY names the vocabulary the value was drawn from.
map_schema_home: config/content_types.yaml#adjudication_map
map_warrant_key: confidence

# THE VOCABULARY HOMES. Both are READ, never restated in code (D-2646: one fact, one home).
vocab_home: config/content_types.yaml
vocab_type_keys: [content_types]
vocab_disposition_keys: [dispositions]

# THE STORE.
table: fbs
id_column: fb_id
label_column: content_type
provenance_column: content_type_source
pre_state_required: true   # a row whose live label no longer equals the map's `current` is STALE: refuse it

# THE AUTHORSHIP OF AN OWNER-ADJUDICATED LABEL (BUG-742). The owner's ruling is in, and it needs NO new vocabulary:
# the TIER-SOURCE value for a label a HUMAN ruled is `human_verbatim` - already a member of the CLOSED C29
# vocabulary (pipeline/schemas.py#PROVENANCE_LITERAL: human_verbatim | llm_extracted_from_source | llm_hypothesis
# | deterministic) and the value the F-44 `min_human_share` floor exists to count. MEASURED: the 11 rows carry
# llm_extracted_from_source today - TRUE of the label they hold, FALSE of the one the owner ruled - so writing the
# label and leaving the column alone would be a provenance LIE (the BUG-725 class, inverted), while minting a FIFTH
# value (e.g. owner_adjudication) would grow a CLOSED vocabulary to say what it already says: a human chose this
# label. The schema REJECTS an undeclared value (ValidationError), so this is not a preference - it is the only
# value that is both TRUE and DECLARED. --apply refuses -- while this is the sentinel.
provenance_value: human_verbatim

# EVIDENCE - the receipt is generated, never hand-written, and names every REFUSED id (C16: no silent skip).
# NB: the receipt lives under governance/evidence/ (an already-declared may_touch family) so the evidence a
# gate produces has a home ON THE DAY IT IS PRODUCED - a receipt that cannot be committed is not a receipt
# (D-342 class; this is the same trap that left six governance artifacts uncommittable until D-2860 cleared them).
receipt: governance/evidence/content_type_restamp_receipt.json
backup_subdir: backups
backup_prefix: maxwell.db.pre_restamp_

# -----------------------------------------------------------------------------------------------------------
# BUG-741(b) - A DISPOSITION IS NOT A CONTENT_TYPE, AND THE ACT ITS RULING ASKS FOR.
# A row the owner rules noise_drop is not a role, so this gate can never write it into content_type (measured: the
# store carries ZERO rows whose content_type is a disposition). But a DISPOSITION RULING IS NOT A NO-OP EITHER,
# and the store has no home for it today:
#   * status CANNOT express it. status is a VERIFICATION verdict (PASS | FLAG | QUARANTINE | PENDING,
#     pipeline/schemas.py#VERIFICATION_STATUS) about how far an artifact has been verified; a curation decision
#     about whether we want the artifact at all is a DIFFERENT axis. Using one to say the other is the BUG-499
#     drift class (two near-identical words for two different things).
#   * A disposition COLUMN IS NOT BUILT YET, on purpose: D-2952 says create the column in the SAME change that has
#     its WRITER, and C28 says bloat is opt-in. MEASURED 2026-10-12 with this gate: the ONE applicable disposition
#     row is ALREADY not served, so the ruling is SATISFIED IN EFFECT and there is no row for such a writer to act
#     on. A column that no reader consults at retrieval time would be an inert badge - the serving predicate reads
#     status, not a disposition - i.e. a flag that enforces nothing.
# SO THE ACT IS DECLARED AND THE GAP IS LOUD RATHER THAN SILENT: a disposition ruling on a row that IS served (the
# general case) is a WITHDRAWAL from the served store, archive-first (R-D410). This gate BLOCKS on that state
# (exit 1) and NAMES the id and the owed act, so the state can never be absorbed into a count. The writer lands
# with the first row that needs it - a trigger the gate evaluates mechanically on every run.
dispositions:
  act_for_stored_row: withdraw_with_archive   # a role is WRITTEN; a disposition is ENACTED
  writer: scripts/withdraw_curation_rows.py   # RESOLVED 2026-10-23 (D-3135): the trigger below fired on the owner's BUG-977 walk
  writer_config: config/curation_withdrawal.yaml
  writer_trigger: a disposition-ruled row whose stored state is in the SERVED path
  # "is this row served?" is asked of the SERVING layer's own predicate (D2330), never restated here (C21).
  served_predicate_home: pipeline/retrieve.py#_status_predicate
  not_served_bucket: disposition              # the ruling is already true; nothing is owed
  served_bucket: disposition_served           # BLOCKING: the act above is owed

# EXIT (BUG-457 tri-state): 0 the queue is exactly what the receipt says | 1 a ruling is OWED (loud) | 2 cannot evaluate.
exit: {clean: 0, refused: 1, cannot_evaluate: 2}

# -----------------------------------------------------------------------------------------------------------
# THE STORE CENSUS — what the VOCABULARY admits, measured over the WHOLE STORE rather than over the map (BUG-977).
#
# WHY THIS EXISTS (MEASURED 2026-10-23, live store, 7,641 rows). The `dispositions:` block above answers "what do we
# DO with a row the OWNER ruled a disposition" — and it asks that question of the MAP's ids only (19 of 546 resolve
# to the store). So the ONE instrument that owns the rule "a disposition is not a content_type" never measured the
# STORE, and 10 rows carrying content_type='noise_drop' (8) | 'quarantine' (2), SIX of them status=PASS i.e. in the
# default answer path, sat there while this gate printed `disposition 1 | disposition_served 0`. That is D-2956
# clause 4 in its purest form: the instrument's SCOPE is part of the instrument. The census below is the missing
# half — the SAME rule, over the population that matters, with the serving question still asked of the serving
# layer's own predicate (C21: never a copy of `status = 'PASS'` here).
#
# A DEBT PER CLASS, NEVER ONE TOTAL (D-2956). A single number would let a repaired disposition row be replaced by a
# NEW undeclared label while the total still read 10 — the substitution this register exists to prevent. Each class
# carries its own shrink-only ceiling (D-2642: a ceiling is never raised), MEASURED 2026-10-23.
#
# THE CEILINGS ARE A DEBT AWAITING A RULING, NOT A LICENCE. Every one of the 10 rows needs an OWNER word (which ROLE
# it carries, or the declared withdrawal act); none of them can be repaired by a script, because the label is a
# curation judgement (D-2898: never auto-certified). The ceiling therefore SHRINKS to 0 as the owner rules; it can
# never grow, and a class above its ceiling is a REFUSAL rather than a loud reading.
store_census:
  enabled: true
  direction: shrink_only
  name_column: name
  debt:
    # MEASURED TRAJECTORY (D-3134 clause 1: a measurement that licences an act is RE-TAKEN after the act; D-2642:
    # a ceiling is never raised). 2026-10-23: 6/4 (census built) -> 4/2 (the owner's 4 ROLE rulings written by this
    # gate, authorship human_verbatim) -> 0/0 (the owner's 6 DISPOSITION rulings ENACTED by the writer this block
    # names: 3 dropped + 3 held, 6 rows withdrawn archive-first, 72 graph edges pruned, vectors removed, FTS rebuilt;
    # store 7,641 -> 7,635 rows). The floor is 0 and it is now reached: any new label outside the ROLE vocabulary is
    # a REFUSAL, not a reading.
    store_disposition_served: 0   # a DISPOSITION where a ROLE belongs, IN the path a query answers from — noise served
    store_disposition_held: 0     # a DISPOSITION where a ROLE belongs, outside the served path — inert, still not a role
    store_undeclared: 0           # a label in NEITHER vocabulary — a fault with no ruling to wait for
    store_blank: 0                # the D-2938 "computed then discarded" shape, which the store ruler cannot see (BUG-726)
  # EXIT (BUG-457 tri-state). `within_debt` is OWNER-OWED — loud, never fatal, so the health ladder keeps running and
  # the debt keeps a row (this is the repo-wide meaning of rc 2; `cannot_evaluate` shares it because both mean "a
  # human must speak before this is clean"). `above_debt` is a REFUSAL: a class grew past a shrink-only ceiling.
  exit: {within_debt: 2, above_debt: 1}
