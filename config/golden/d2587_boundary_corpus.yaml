schema_version: '1.0'
decision: D2589
created: '2026-09-08'
tier: CHALLENGE
eval_scope: rules_regression_only   # D2609: content_type rules regression — NOT model-eval
held_out_from_training: true        # D2609: example_ids are a never-train set for content_type
agreement_rule: 2-of-3 independent adjudicators; disagreements -> human tiebreak
adjudication_schema:
  sequence_present: bool|null   — is there an ordered multi-action sequence?
  repeatable_method: bool|null   — is it a reusable procedure vs a historical trace?
  transferability: enum|null   — domain_specific | cross_domain | unknown
  epistemic_status: enum|null   — established | empirical | speculative
  content_type_derived: string|null — the label the 4 features IMPLY (filled by adjudicator)
  rationale: string      — why, in one line
boundary_case_categories:
- id: C01
  case: 1-step tool command
  expected: tool_instruction
- id: C02
  case: 1-step domain instruction
  expected: inline_step
- id: C03
  case: 1-step cross-domain heuristic
  expected: principle
- id: C04
  case: 2-step reusable method
  expected: process_template
- id: C05
  case: 2-step accidental instruction
  expected: tool_instruction
- id: C06
  case: 5-step historical case study
  expected: process_instance
- id: C07
  case: 5-step reusable method
  expected: process_template
- id: C08
  case: domain-specific deep principle
  expected: principle
- id: C09
  case: 3-domain shallow slogan
  expected: principle
- id: C10
  case: speculative principle
  expected: growth_edge
- id: C11
  case: decision matrix inside a PT gate
  expected: inline_gate_content
- id: C12
  case: reusable decision methodology
  expected: principle
- id: C13
  case: tool procedure (by abstraction)
  expected: tool_instruction
- id: C14
  case: empirical correlation (no cause)
  expected: growth_edge
- id: C15
  case: normative heuristic (transferable)
  expected: principle
- id: C16
  case: descriptive method (reusable, no explicit steps)
  expected: quarantine
