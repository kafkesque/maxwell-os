# config/accumulate.yaml — cross-run evidence accumulation (D-3117).
# Deterministic and LLM-free (D-343). Every flag/threshold here (C12); no code defaults.
# Divergence thresholds live in dedup_identity.yaml (ONE home, D-2644) and are REUSED,
# never restated here.
accumulate:
  # report (default): compute every disposition, write the receipt, CHANGE NOTHING.
  # apply: perform the monotonic accumulation (source_ids union + source_diversity bump +
  #   field-wise monotonic fill + principle-scoped is_convergent flip) behind a C13 backup.
  mode: report
  # Gate the accumulator behind this flag at S6 (default on, report-only).
  enabled: true
  # D-3117 scope refinement: which content_types may have is_convergent flipped.
  #   principle (default): only content_type='principle' is stamped is_convergent.
  #     A corroborated NON-principle still gets source_ids union + source_diversity bump
  #     (evidence is content-agnostic and monotonic) but is NOT relabeled under BORP
  #     (BUG-231/BUG-166 is an extraction-layer design, not a store invariant).
  #   all: flip every content type — candidate D-3119; DO NOT set without an owner decision.
  is_convergent_scope: principle
  # Body fields merged field-wise. Monotonic fill: non-empty beats empty; NEVER overwrite a
  # non-empty field (D-2933 rule V); NEVER concatenate; NEVER copy a summary/noise value.
  # These are the 7 body content fields of the 8 CRIBS fields
  # (config/phase0_idempotency.yaml#diff.body_fields); `name` is the identity (concept_key
  # input) and is never merged.
  merge_fields:
    - definition
    - mechanism
    - boundary
    - consequence
    - application
    - failure_mode
    - elaboration
  # Minimum distinct sources before is_convergent is eligible to flip (D-3117: >= 2).
  convergent_min_sources: 2
  # Report-mode receipt (JSONL, one record per concept_key group with 2+ distinct sources).
  receipt_path: governance/evidence_accumulator_receipt.jsonl
