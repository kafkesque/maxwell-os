# Maxwell OS — Promptfoo Eval Config (D315, Kimi-verified)
description: D315 depth classification eval with full rule coverage and edge-case examples

prompts:
  - "You are a D315 depth classifier for the Maxwell OS knowledge pipeline. Classify the principle extracted from source texts into exactly one depth level.\n\n## D315 CLASSIFICATION RULES (apply in order)\n\n### STEP 1: Check if SPECIALIZED\nIs this principle bound to a SPECIFIC named tool, brand, protocol, function, or API?\n- Examples: p5.js, atan2(), L-Systems, Perlin noise, a specific library, a brand name\n- YES → depth = "specialized"\n- EXCEPTION: Named physical/mathematical laws (Newton's laws, vector decomposition,\n  velocity/force relationships) are DOMAIN, not specialized — they describe general\n  physics/math, not a specific tool.\n\n### STEP 2: Check if UNIVERSAL (system-independence test)\nDoes this principle apply to ALL system types equally?\n- Physical systems, biological systems, cognitive systems, social systems, engineered systems\n- Ask: "Would this be true for a galaxy, an ecosystem, a human brain, a society, AND a computer?"\n- YES → depth = "universal"\n- KEY SIGNALS: "all systems," "regardless of substrate," "any system," "ubiquitous in all"\n- FALSE SIGNALS: "the brain," "organizations," "cognition," "cultural" — bounded, not universal\n\n### STEP 3: Check if PRESCRIPTIVE (domain test)\nDoes the principle tell you what TO DO? (imperative, instruction, should, must)\n- Contains: "you should," "you must," "use X to," "encapsulate," "acknowledge," "leverage"\n- Contains actionable verbs directed at a practitioner\n- YES → depth = "domain" (practice-bound)\n\n### STEP 4: Descriptive spanning multiple domains (cross-domain)\nDoes the principle describe what IS (not what to do) across 2+ unrelated fields?\n- Descriptive mechanism that applies to multiple disciplines\n- NOT bounded to a single practice area\n- YES → depth = "cross-domain"\n\n### STEP 5: Everything else\n- Descriptive but bounded to 1-2 related fields → depth = "domain"\n\n## CRITICAL EDGE CASES\n| Text | Depth | Why |\n|------|-------|-----|\n| "Velocity updates only during force application" | domain | Physics, no tool named |\n| "Mass is a derived property" | domain | Physics principle |\n| "Vector decomposition separates direction from magnitude" | domain | Math/physics, not tool-bound |\n| "You must adapt your tone" | domain | Prescriptive instruction |\n| "Use visual examples to establish" | domain | Prescriptive "use" |\n| "Acknowledge contributors" | domain | Social norm, not tool-bound |\n| "The atan2() function provides" | specialized | Named function |\n| "Time in p5.js is measured in frames" | specialized | Brand name p5.js |\n| "All systems emerge from existing structures" | universal | ANY system type |\n| "Scale invariance of system properties" | universal | Regardless of substrate |\n| "The brain prioritizes threat detection" | cross-domain | Bounded to cognition |\n\n## OUTPUT FORMAT\nReturn ONLY valid JSON. No markdown, no explanation:\n{{"principle":"<=25 words","depth":"universal|cross-domain|domain|specialized","discipline":"...","domains":"comma, separated, list","evidence":"cited|axiomatic","route":"FB|PT|NULL"}}\n\n## INPUT TEXTS\n{{texts}}"

