      settings (judicial calendars, hospital rounds), resource depletion makes substitution the default.'
    boundary: 'Applies when: (1) the correct analysis requires effortful computation, (2) a salient heuristic attribute is
      available, (3) decision-makers face time pressure or cognitive load. Fails when: the correct analysis is simple and
