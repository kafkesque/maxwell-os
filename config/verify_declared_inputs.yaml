# scripts/verify_declared_inputs.py - which roots to scan, and the moves already known (C12/C-3).
# A fingerprint file claims "these outputs were computed against this exact input". A repair script
# that rewrites the input in place turns that claim silently false. Unacknowledged move => RED.
schema_version: "1.0"
roots:
  - knowledge pipeline
fingerprint_suffix: .input_fingerprint.json
# Moves that ARE known and already recorded. Each must carry a reason and the bug/decision id, so an
# exception is a DECLARED exception and never a hidden one (same pattern as flag exempt_reason, D-339).
acknowledged_moves:
  - fingerprint: "knowledge pipeline/stage5_verify/t11/checkpoint.jsonl.input_fingerprint.json"
    declared_input_sha256: "2f8b34fb0f104bbecc32d5b7cd3a37a272e9f3bc7b533db4a0e5b43fbff13992"
    reason: >-
      C-3/BUG-376 (2026-09-23): the S4 enriched checkpoint was rewritten 65 min AFTER the 7995-record
      S5 run completed, so the run's declared input no longer resolves and the verified image is gone
      from disk. Not a new defect; owner gate = re-verify (~1.3 h) or freeze the pair and cite it.
    ref: C-3
  - fingerprint: "knowledge pipeline/stage5_verify/rechunk-v4-20260929/checkpoint.jsonl.input_fingerprint.json"
    declared_input_sha256: "ef77e346c812ccf707b2457675a82d94cfdeaadb4ac8dc4b88df2018c8a2cb9f"
    reason: >-
      C-3 (2026-10-24): the stage4_merge rechunk-v4 checkpoint was EXTENDED (not destructively rewritten)
      after the 2026-10-11 S5 run — single-concept records (D-3130, e.g. 'Planck's Constant Derivation'
      fb_id c0d5b9b8..., PASS/entail) were appended and committed to the store, so the store is CURRENT
      and the fingerprint's declared hash is stale only because the checkpoint grew. Not a data defect;
      owner gate = re-cite the fingerprint against the grown checkpoint or keep this declared exception.
    ref: C-3
