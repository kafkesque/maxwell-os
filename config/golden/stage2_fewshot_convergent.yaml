      removes the cognitive cost of deciding when to act and leverages the consistency principle, where initial small commitments
      create self-reinforcing patterns of aligned behavior.
    mechanism: 'Two mechanisms converge: (1) Cue automation — the existing habit provides a reliable, automatic trigger that
      bypasses decision fatigue. When ''pour coffee'' reliably precedes ''meditate,'' the brain links them and the trigger
