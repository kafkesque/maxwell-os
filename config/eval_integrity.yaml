    content_type: "CT (1-7)"
    discipline: "DISC (1-62)"
    extraction_type: "FORM (1-4)"
  frozen_fields:                    # frozen-JSON human/stored field -> axis
    content_type: ct
    discipline: disc
    extraction_type: form
  row_id_column: item_id
  limit: 150
  nli_batch_size: 16
  device: auto                      # mps > cuda > cpu (arm layer must not silently run on CPU)
  report:
    constant_arm: constant          # same-run TRIVIALITY floor
    incumbent_arm: pairwise         # deployed configuration: candidates are judged against THIS
    min_decided_ratio: 0.5          # an arm deciding <50% of rows is INVALID, not a tie
    min_error_gain_pp: 5.0          # pre-registered D-300 deploy margin (absolute pp)
    abstain_sweep: [0.0, 0.1, 0.25, 0.5]   # ranked-by-margin abstention curve (D-300 rec: calibration)
  nli_batch_size_note: padded forward batches (per-pair scoring was ~1 s/pair)   # BUG-335: comment restored to its key
  omlx_path: /v1/chat/completions     # BUG-319: every production caller uses /v1 (pipeline/omlx_call.py etc.)
  omlx_model: Qwen3-Coder-30B-A3B-Instruct-MLX-4bit
  omlx_timeout_s: 180
  hypothesis_template: "This definition is an instance of the discipline {label}. {definition}"
  prompt_template: |-
    You are a taxonomy adjudicator for a knowledge pipeline.
    Choose the ONE {axis} for the item below from the closed menu, or reply with choice null to abstain.
    MENU:
    {menu}
    ITEM: {name}
    DEFINITION: {definition}
    Reply with JSON only: {"choice": "<menu label or null>", "confidence": <0..1>, "abstain": <bool>}
  log:
    - "2026-09-21 (D-298): created with the arm wiring. arm_constant modal is computed over HUMAN labels."
    - "2026-09-21 (D-312): added named label sources (bakeoff.active_source + bakeoff.sources.anchor1)
       and the pre-registered R1-R4 arbitration block, so the R3 held-out run is source- and rule-explicit."
  r3_measurement:                       # D-314: measured on the pre-registered held-out set, NOT adopted
    n_scored: 57                        # of 58 pre-registered rows (1 row carries no human verdict, BUG-334)
    error_rate: {pairwise: 0.5088, r3: 0.5088, r2: 0.4286, r4: 0.5965, constant: 0.8421}
    gain_pp: {pairwise: 0.0, r3: 0.0, r2: 8.02, r4: -8.77}
    queue_rate: {pairwise: 0.0, r3: 0.0, r2: 0.754, r4: 0.0}
    adopted: false
    report: governance/R3_HELDOUT_RESULT_20260921.md
  # ── ANCHOR-3 (D-337): the frozen authority an arm comparison CITES. The eval does not swap its
  #    truth source silently - bakeoff.sources.anchor2 (60-row blind sheet + key, D-311 pre-registration)
  #    stays the R3 truth source. This block only names the authority and its bound so a report can
  #    state which reference it stands on, and scripts/r3_preflight.py refuses to run a comparison whose
  #    reference cannot be verified. Swapping the reference is a SCIENTIFIC change: it needs a decision.
  anchor_ref:
    manifest: governance/ANCHOR_MANIFEST_20260923.json
    artifact_id: ANCHOR-3
    tier: human-mixed+llm-attested
    bound: RELATIVE-ONLY (D-337) - arm ranking and deltas; no absolute error floor (D-329/D-331)
    verify: scripts/verify_anchor_manifest.py
  # ── D-312 (C12): named label sources. The flat keys ABOVE are the `ruler` source and stay its only
  #    definition; a source is never inferred from a filename — a run names it. ─────────────────────
  active_source: ruler
  sources:
    anchor2:                              # ANCHOR-2 (renamed 2026-09-21 from 'anchor1'; bytes unchanged) - R3 held-out adjudication source (D-311)
      legacy_names: [anchor1]             # name collision fix 2026-09-21: the 60-row set is ANCHOR-2; ANCHOR-1 = the 150-row ruler
      sheet: governance/ANCHOR2_BLIND_SHEET_20260920.csv
      key: governance/ANCHOR2_KEY_20260920.json
      key_shape: by_fb_id                 # key is {fb_id: {pipeline_*}} — NOT key['rows']
      truth_from: sheet                   # human verdicts live on the SHEET; pipeline labels in the key
      row_id_column: fb_id
      limit: 60
      verdict_columns:
        discipline: discipline_verdict
      key_stored_fields:
        content_type: pipeline_content_type
        discipline: pipeline_discipline
      definition_column: definition
      name_column: name
      include_catch_all: true             # taxonomy meta.catch_all_discipline is a LEGAL verdict slot
      normalize_through_menu: true        # truth AND stored labels map onto the closed menu
      exclude_rows_without_truth: true    # an unlabelled row cannot be scored (D-275a)
      row_allowlist_file: governance/ANCHOR2_HELDOUT_SET_20260921.json
      row_allowlist_field: heldout_fb_ids # n=58 pre-registered held-out rows
      pre_registered_n: 58             # D-311 pre-registration (BUG-334: the measurable n is checked, not assumed)
      output: governance/bakeoff_typed_decision_anchor2_20260921.json
  arbitration:                            # D-300/D-311: pre-registered combine rules (R1-R4)
    incumbent_arm: pairwise
    challenger_arm: qwen3coder
    margin_scale: percent_rank            # arms have different margin scales (NLI margin vs LLM conf)
    r4_confidence_floor: 0.5
    rules:
      r1: incumbent_only
      r2: agree_accept_disagree_human_queue
      r3: agree_accept_disagree_higher_margin
      r4: agree_accept_disagree_challenger_if_conf_at_least_floor
    source: anchor2
    report: governance/r3_heldout_20260921.json

