[tool.ruff]
target-version = "py312"
line-length = 100
# D2201: Removed "knowledge pipeline/" from exclusions — pipeline code is NOT optional.
# The most critical code (stage2_extract, stage4_merge, stage5_verify) must pass lint.
# Previous exclusion was a deliberate blindspot where bugs lived.
extend-exclude = ["backup/", "agent/archive/", "external/"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
exclude = "(backup/|agent/archive/|external/)"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
