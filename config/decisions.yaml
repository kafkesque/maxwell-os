    gained ~6 pp over the incumbent pairwise verifier. Scored on the 58-row pre-registered held-out set (D311,
    n_scored=57) it gains 0.00 pp at equal abstention (error 0.5088 = the incumbent exactly), because the two
    arms agree on only 24.6% of rows and the tie-break resolves to the incumbent. R2 (disagree -> human queue)
    reaches 0.4286 but only by queueing 75.4% of rows, which violates the D-300 equal-or-lower-abstention
    clause; R4 is worse than the incumbent (-8.77 pp). NOT adopted: the incumbent pairwise verifier,
    serving_gate as the single deploy gate, and the disabled abstention operating point all remain unchanged.
