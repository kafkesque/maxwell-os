# Maxwell OS v3.0 — Content-Type Ontology (single source of truth)
# =============================================================================
# Decision: D2323 (2026-08-13) — Content-Type Ontology Consolidation
#
# Replaces hardcoded enums scattered across:
#   pipeline/schemas.py               (content_type docstring + PT/PI/GE classes)
#   pipeline/stage2_extract.py        (_VALID_CONTENT_TYPES frozenset)
#   pipeline/stage4_merge.py          (routing lists + D2072/D2073 writes)
#   config/golden/stage2_fewshot_convergent.yaml  (STALE content_type values)
#
# C12: config-first. This file is authoritative — code imports from it, never
#      re-declares the enum. Append-only: new content_types accumulate via the
#      `raw` label path (D2066 self-evolving taxonomy), never deleted in place.
#
# Two ORTHOGONAL axes (this is the fix — they were conflated):
#   content_type    = functional ROLE   → consumer: S4 router (where to store)
#   extraction_type = epistemic FORM    → persisted S4→S6 for future epistemic-aware
#                                         verification; S5 (DeBERTa NLI) does NOT yet
#                                         consume it (W5 drift, documented 2026-08-14).
# Neither is a subtype of the other. A single role accepts multiple forms.

schema_version: "3.0"
decision: D2323
last_updated: "2026-08-13"

# ─────────────────────────────────────────────────────────────────────────────
# AXIS 1 — content_type: functional ROLE (what kind of object) — 5 values
# ─────────────────────────────────────────────────────────────────────────────
content_types:

  principle:
    description: "Conceptual knowledge — why/when something works. The Foundation Block. D275b/D283 (2026-09-20): a PRINCIPLE is a single self-contained epistemic claim you KNOW/APPLY (a transferable filter — ANY scope: universal/cross-domain/domain/specialized) that the text states as SETTLED knowledge — not as an open question or an unverified correlation. Discriminated from process_template by procedural INTENT + a done-condition (NOT step count: a 3-step causal chain and a 12-category taxonomy both have '>=2 steps' yet are principles), and from growth_edge by epistemic STATUS (established vs speculative) — NOT by scope. D282 (2026-09-20): scope is the SEPARATE depth axis, never the role discriminator — a 1-domain or specialized principle is still a principle."
    route_to: "foundation_block"
    output_file: "fbs.jsonl"
    extension_fields:
      - application
      - failure_mode
      # keywords moved to metadata.discovery (search/retrieval labels) per D2349
      # jargon moved to core_body (body-only, after elaboration) per D2349
      - procedural_skill
      - prerequisite_fbs
      - contradicts_fbs
      - related_fbs
      - context
      - accessibility
      - intimacy_boundary
      - provenance
      - source_text
      - difficulty_level
      - temporal_scope
      - confidence_score
    zone_body:
      - { icon: "🏛️", section: "DEFINITION",   binds: [definition],    note: "what it IS, ≤4 sentences, first word not an action verb" }
      - { icon: "🔥", section: "APPLICATION",  binds: [application],   note: "when [trigger] → [action]" }
      - { icon: "⚠️", section: "FAILURE MODE", binds: [failure_mode] }
      - { icon: "✅", section: "EVIDENCE",      binds: [evidence, source_books], note: "reusable · cross-domain · tested" }

  process_template:
    description: "Repeatable how-to method with steps. Layer-2 product primitive (FB→PT→PI→Recipe). D275b (2026-09-20): a process_template is a procedure you EXECUTE — trigger + ordered steps + a done-condition/gate (procedural INTENT, not step count). D2587's 'SEQUENCE of >=2 steps' is necessary but NOT sufficient. A single step/instruction is NOT a template."
    min_steps: 2
    route_to: "process_template"
    output_file: "process_templates.jsonl"
    extension_fields:
      - steps
      - trigger
      - prerequisite
      - done_condition
      - failure_mode
      - template_source
      - consulted_fbs
      - fb_query_domain
      - fb_query_intent
    zone_body:
      - { icon: "🔥", section: "TRIGGER",        binds: [trigger] }
      - { icon: "🔧", section: "PREREQUISITE",   binds: [prerequisite] }
      - { icon: "📋", section: "PHASES",         binds: [steps], note: "Step N [Required/Optional/Conditional] + gate decision matrix" }
      - { icon: "📦", section: "OUTPUT",         binds: [] }
      - { icon: "✅", section: "DONE CONDITION", binds: [done_condition] }

  process_instance:
    description: "Concrete case study of a PT actually executed — the proof it works."
    route_to: "process_instance"
    output_file: "process_instances.jsonl"
    extension_fields:
      - parent_pt_id
      - instance_text
      - actors
      - outcome_metric
      - outcome_qualitative
      - domain_context
    zone_body:
      - { icon: "🔥", section: "TRIGGER",        binds: [trigger], note: "filled — what actually triggered it" }
      - { icon: "📋", section: "PHASES",         binds: [steps],  note: "☑/☐ checkboxes active" }
      - { icon: "📦", section: "OUTPUT",         binds: [outcome_metric, outcome_qualitative] }
      - { icon: "✅", section: "DONE CONDITION", binds: [done_condition], note: "filled + real result" }

  tool_instruction:
    description: "Tool/software-specific command or feature. Knowledge object (NOT a live callable binding)."
    route_to: "tool_instruction"
    output_file: "tool_instructions.jsonl"
    # D2323: 13-field schema grounded in MCP + JSON Schema + OpenAPI + man pages.
    # Semantically compatible with the MCP `Tool` contract so a TI can be promoted
    # into a Recipe step / MCP tool at Layer 2 without rework (C21).
    extension_fields:
      - tool_name        # MCP `name` — canonical identifier
      - platform         # where it runs (CLI / API / app / OS)
      - description      # MCP `description` / man DESCRIPTION — what it achieves, when to use
      - syntax           # man SYNOPSIS — the invocation template
      - parameters       # JSON Schema `properties` / OpenAPI `parameters` — structured list
      - output           # MCP `outputSchema` / man OUTPUT — what it returns
      - example          # man EXAMPLES — worked input → output (primary LLM learning signal)
      - annotations      # MCP `annotations` — readOnlyHint / destructiveHint / idempotentHint
      - caveats          # man BUGS — failure modes / gotchas
      - version          # OpenAPI — staleness detection (tools change → knowledge rots)
      - source           # where documented (book / chapter)
      - alternatives     # man SEE ALSO — related tools
    zone_body:
      - { icon: "🗺️", section: "PURPOSE",            binds: [description] }
      - { icon: "📋", section: "FOUNDATION BLOCKS",  binds: [prerequisite_fbs] }
      - { icon: "⌨️", section: "SYNTAX",             binds: [syntax, parameters] }
      - { icon: "📤", section: "OUTPUT",             binds: [output] }

  growth_edge:
    description: "Speculative/unresolved insight — idea inbox upstream of verified knowledge. POSITIVE ENTRY CRITERION (BUG-230): MUST articulate an OPEN TENSION or an UNVERIFIED CORRELATION — NOT a dump for failed depth-tests, and NOT a bare 'utilizable fact' (a bare fact/trend with no articulated tension → noise_drop). D-2747 (2026-10-02): also admits a CONTESTED/UNFALSIFIABLE claim — a conspiracy theory or disputed thesis whose sources contradict. Such records carry `contested: true` and are RETAINED (never noise_drop / never quarantine) by the retention guard in stage4_merge."
    route_to: "growth_edge"
    output_file: "growth_edges.jsonl"
    extension_fields:
      - body
      - source            # manual | pipeline | import
      - category
      - actionable
      - status            # open → investigating → implementing → promoted | archived
      - contested         # D-2747: bool — disputed/unfalsifiable claim (sources contradict); retention guard never drops/quarantines it
      - parent_fb_ids
      - parent_pt_id
      - promoted_to_type
      - promoted_to_id
      - promoted_at
      - tags
      - priority
    zone_body:
      - { icon: "🌊", section: "OPEN TENSION",   binds: [body] }
      - { icon: "🔗", section: "RELATED FBs",    binds: [parent_fb_ids] }
      - { icon: "❓", section: "OPEN QUESTIONS", binds: [] }
      - { icon: "✅", section: "RESOLVES WHEN",  binds: [], note: "tension articulated + pattern tested across 3+ contexts" }

# ─────────────────────────────────────────────────────────────────────────────
# AXIS 2 — extraction_type: epistemic FORM (how justified) — 4 values
# ─────────────────────────────────────────────────────────────────────────────
extraction_types:
  causal_mechanism:
    description: "X→Y because Z — a verified cause→effect chain."
    verification_standard: "evidence must show the causal chain"
  descriptive_model:
    description: "A taxonomy/classification describing WHAT categories exist and how they relate."
    verification_standard: "categories complete + mutually exclusive"
  normative_heuristic:
    description: "Practical rule of thumb with clear steps, or a widely-applicable heuristic."
    verification_standard: "practical efficacy"
  empirical_pattern:
    description: "Strong correlation WITHOUT a proven causal chain — speculative."
    verification_standard: "correlation only — flag, do not assert causation"

# ─────────────────────────────────────────────────────────────────────────────
# D2128 mapping — route (S2 legacy field) → content_type
#   ACTIVE fallback in stage4._resolve_content_type: when a record lacks an
#   explicit content_type, S2's legacy `route` (FB/PT/PI/GE/TI) is mapped here.
#   (Previously inert; D2128 closed the gap and it is now live — NOT dead.)
# ─────────────────────────────────────────────────────────────────────────────
route_to_content_type:
  FB: principle
  PT: process_template
  PI: process_instance
  GE: growth_edge
  TI: tool_instruction

# ─────────────────────────────────────────────────────────────────────────────
# D2417 — content_type → extraction_type (conflation-rescue default)
#   BUG-145: the model occasionally writes a content_type ROLE into the
#   extraction_type FORM field (e.g. extraction_type="tool_instruction").
#   Rather than fail-closed (discarding a correctly-identified object), trust
#   the role and default the FORM to the epistemic register that role most
#   commonly expresses. S4 may re-derive the form during classification.
#   Weakest-honest default chosen per role to avoid over-claiming (D2376).
#   RECONCILIATION (D2432/D1 vs D2427): this table is a REPAIR fail-safe, NOT a
#   routing rule — it fires ONLY when the model confuses the two orthogonal axes
#   (D2323). D2427's justification×modality split would remove the need for a
#   role→form default entirely; until that lands, these values are weakest-honest
#   ASSUMPTIONS (e.g. tool_instruction→normative_heuristic), revisited post-R2.
# ─────────────────────────────────────────────────────────────────────────────
content_to_extraction_type:
  principle: normative_heuristic     # D-2749: a principle is a transferable RULE (normative), not a "describes" FORM
  process_template: normative_heuristic  # repeatable method → prescriptive "do X"
  process_instance: descriptive_model    # case study → what happened (structure)
  growth_edge: empirical_pattern         # speculative insight → correlation w/o proven cause
  tool_instruction: normative_heuristic  # command → prescriptive "do X"

# ─────────────────────────────────────────────────────────────────────────────
# CONTENT-TYPE CLASSIFICATION RULES (D2587) — decision procedure for the
# content_type axis. Enforces the three discriminators that the 2026-09-08
# triage exposed as the root cause of the vacuous 100%-principle axis.
# Order matters: answer the FIRST rule that matches, top-down.
# ─────────────────────────────────────────────────────────────────────────────
content_type_rules:
  # Q1 (D2587): a process_template is a SEQUENCE, never a single step.
  process_template_min_steps: 2
  single_step_resolution:
    # A single step/instruction is NOT a template. Resolve it:
    tool_specific: tool_instruction       # software/tool command, syntax, feature
    transferable_instruction: principle   # a self-contained instruction you would APPLY as a rule (D282: depth is the separate axis, not a role test)
    method_bound_step: inline_step        # belongs inside a PT's steps; never a standalone object
  # Q2 (D2587): a decision matrix is NEVER a standalone content type.
  decision_matrix:
    specific_grid: inline_gate_content    # lives in a PT's gate (steps/decision field)
    reusable_methodology: principle_or_process_template  # by the sequence / self-containedness test
  # Q3 (D2587): instruction-vs-principle is decided by whether the instruction is a
  # SELF-CONTAINED transferable rule you would APPLY (a principle at ANY scope),
  # not by whether the text prescribes, and not by a domain count. Scope
  # (universal vs cross-domain vs domain vs specialized) is the SEPARATE depth axis
  # (D282: it must never act as the principle-role discriminator).
  instruction_is_principle_when: "one-sentence prescriptive claim that acts as a self-contained transferable filter (any scope — depth is the separate axis)"
  instruction_is_process_template_when: "sequence of >=2 steps with a gate or done condition"
  # D2591 (2026-09-08): descriptive summaries + ambiguous objects are NOT roles.
  descriptive_summary_resolution: noise_drop  # historical/descriptive summary with no prescriptive filter, no template, no named method-execution → DROP (a "fact", D2323 dropped it)
  ambiguous_resolution: quarantine           # carries SOME value but no clean role (no steps / method / applicable mechanism / transferable principle) → HOLD for later identification
  # D2596/BUG-230 (2026-09-09): growth_edge is NOT the catch-all for "utilizable facts".
  growth_edge_entry_criterion: "MUST articulate an OPEN TENSION or UNVERIFIED CORRELATION; NOT a dump for failed depth-tests or bare utilizable facts (those → noise_drop)"

# ─────────────────────────────────────────────────────────────────────────────
# CONTENT-TYPE DECISION PROCEDURE (D275b, ratified 2026-09-20) — the
# authoritative top-down classifier. Answer the FIRST question that matches.
# Mechanism A (this procedure) DECIDES the bin. Mechanism B (the stored error
# rate, ANCHOR-1) is a METER — it calibrates confidence + abstention, and is
# NEVER used to flip a label (a population statistic carries no per-object
# information). See D-275a/D-276/D-277.
# ─────────────────────────────────────────────────────────────────────────────
content_type_decision_procedure:
  order: first-match-wins
  atomic_unit: "ONE self-contained epistemic claim (not one sentence)"
  discriminator: "procedural INTENT + done-condition (EXECUTE vs KNOW/APPLY) — not step count"
  steps:
    - { test: "tool/software-specific command, syntax, or feature", resolve: tool_instruction }
    - { test: "articulates an OPEN TENSION or an UNVERIFIED CORRELATION", resolve: growth_edge }
    - { test: "bare fact / descriptive summary — no prescriptive filter, no method, no transferable value", resolve: noise_drop }
    - { test: "a procedure you EXECUTE — trigger + ordered steps + a done-condition/gate", resolve: process_template }
    - { test: "a single self-contained claim you KNOW/APPLY — a transferable filter (any scope)", resolve: principle }
    - { test: "has SOME value but no clean role", resolve: quarantine }
  edge_rules:
    checklist: process_template          # a checklist is a procedure
    decision_matrix: inline_gate_content # NEVER standalone — lives inside a PT gate (steps/decision field)
    taxonomy: principle_or_split         # ONE FB iff statable as one self-contained claim; else split by self-containedness
  calibration:
    error_rate_is_a_meter: true          # per-class error sets confidence thresholds + BOUND classes; never picks the label
    abstention_value: none               # first-class "does not fit" (R1)
    provenance_stamps: [menu_hash, content_type_source, discipline_source, extraction_type_source]

# ─────────────────────────────────────────────────────────────────────────────
# DISPOSITIONS (D2591) — what to DO when an object has no clean role.
# NOT content_types (the 5-role axis stays CLOSED — no 6th type). These are
# OUTCOMES the classifier emits instead of force-fitting an ambiguous object:
#   classified = the object has one of the 5 roles
#   noise_drop = descriptive/historical summary or fact — no prescriptive filter,
#                no template, no named method-execution, no transferable value
#   quarantine = carries SOME value but no clean role — hold, do not force.
# ─────────────────────────────────────────────────────────────────────────────
dispositions:
  classified: "object has a content_type (one of the 5 roles)"
  noise_drop: "descriptive/historical summary or fact — no prescriptive filter, no template, no named method-execution, no transferable value → DROP"
  quarantine: "carries SOME value but no clean role (ambiguous) → HOLD for later identification (does it carry steps? a method? an applicable mechanism? a transferable principle?)"

# ─────────────────────────────────────────────────────────────────────────────
# APPLICABILITY AXIS (D-2757, 2026-10-02) — consumer/teleology, AXIS 3.
# ORTHOGONAL to content_type (role), extraction_type (form), and depth (scope).
# Answers "WHO consumes this and WHY" — which the closed 5-role FORM axis cannot.
# The 234-record quarantine blob (BUG-611) was heterogeneous precisely because it
# lacked this axis: definitional/terminological (educational) records were
# quarantined alongside prescriptive (operational) and ethics/values
# (philosophical_educational) records as if they were one category.
#
# DETERMINISTIC (never LLM-classified — D-343 measured content_type LLM at
# -2.98pp vs constant baseline; applicability shares that failure mode). Derived
# from lexical markers + owner adjudication, provenance-stamped.
# ─────────────────────────────────────────────────────────────────────────────
applicability:
  values: [operational, educational, philosophical_educational, heuristic_tip]
  default: operational
  operational: "prescriptive transferable rule you APPLY in practice (KNOW/APPLY, D275b) — the normal target of a principle/process_template/tool_instruction"
  educational: "terminological/theoretical/descriptive (frontend, user-facing) — teaches WHAT something is; a definitional or explanatory object, not an applied rule"
  philosophical_educational: "ethics/values/reflection — a normative stance on values, justice, cooperation, or the human condition (subtype of educational with a values teleology)"
  heuristic_tip: "surface-level wisdom, tip, or trick — a low-cost practical suggestion without a causal skeleton or done-condition"
  derive_order: [adjudication, lexical]

# ─────────────────────────────────────────────────────────────────────────────
# SHARED CORE BODY — the READABLE knowledge content an agent consumes.
# S2 emits the name/definition skeleton for every content_type. S4 (CRIBS)
# appends application / failure_mode (principle) / jargon (body-only, AFTER
# elaboration).
# ─────────────────────────────────────────────────────────────────────────────
# D2475: `mechanism` / `boundary` / `consequence` are PRINCIPLE-ONLY — they are
# the epistemic register of a Foundation Block (how/why it works). Non-principle
# roles (PT/PI/TI/GE) carry their own tailored segments (steps/actors/parameters/
# body — see `s2_body_fields`) and do NOT require the causal skeleton. They MAY
# still carry it (legacy S2 emits it) but the contract no longer REQUIRES it.
# `elaboration` is likewise S2-emitted but PRINCIPLE-ONLY (empty for PT/PI/GE/TI).
# `principle_only_body` below is the machine-readable cardinality contract.
# ─────────────────────────────────────────────────────────────────────────────
# NOTE (D2349): is_summary, evidence_passages, extraction_type, content_type
# were previously listed here but are NOT body content — they are flags,
# provenance, and classification labels. Moved to `classification` / `metadata`
# below so `core_body` reflects only what renders as the knowledge object's body.
# NOTE (D2432/C2): `failure_mode` has DUAL provenance — S4-CRIBS for `principle`
# (how the principle breaks), but S2-extracted for `process_template` (see
# `s2_body_fields`). Both are valid; the source differs by content_type.
core_body:
  - name           # S2 — SHARED skeleton (all content_types)
  - definition     # S2 — SHARED skeleton (all content_types)
  - mechanism      # S2 — PRINCIPLE-ONLY (D2475)
  - boundary       # S2 — PRINCIPLE-ONLY (D2475)
  - consequence    # S2 — PRINCIPLE-ONLY (D2475)
  - elaboration    # S2 — PRINCIPLE-ONLY (REQUIRED for principle; empty for PT/PI/GE/TI)
  - application    # S4 (CRIBS) — prescriptive trigger→action, body-only
  - failure_mode   # principle: S4 (CRIBS); process_template: S2 (see s2_body_fields)
  - jargon        # S4 (CRIBS) — body-only per D2123, renders AFTER elaboration

# ─────────────────────────────────────────────────────────────────────────────
# D2475 — body-field cardinality contract (machine-readable, config-first C12).
#   shared_body             → REQUIRED non-empty for EVERY content_type.
#   principle_only_body     → REQUIRED non-empty ONLY for `principle`; OPTIONAL
#                             (may be absent or empty) for PT/PI/TI/GE.
#   principle_required_body → S4 CRIBS fields REQUIRED non-empty ONLY for
#                             `principle` (application D2371, failure_mode D2488,
#                             elaboration). NOT optional — an empty application/
#                             failure_mode/elaboration must quarantine the FB.
#   principle_optional_body → S4 CRIBS fields OPTIONAL for `principle` (jargon only).
#   (D2488: previously `application`/`failure_mode` were only prose-mentioned and
#    misread as optional by audit_s4_fields.py. Now machine-readable + enforced.)
# ─────────────────────────────────────────────────────────────────────────────
shared_body:
  - name
  - definition
principle_only_body:
  - mechanism
  - boundary
  - consequence
principle_required_body:
  - application       # D2371 — enforced: empty/short → quarantine
  - failure_mode      # D2488 — enforced: empty/short → quarantine
  - elaboration       # REQUIRED (was prose-special-cased, now explicit)
principle_optional_body:
  - jargon            # D2123 — omit entirely if no specialized terms

# ─────────────────────────────────────────────────────────────────────────────
# SHARED CLASSIFICATION — emitted by S2/S4, all content types.
# D2349: content_type (functional ROLE) + extraction_type (epistemic FORM) are
# classification labels, NOT body content. is_summary is a gate flag, NOT body.
# ─────────────────────────────────────────────────────────────────────────────
classification:
  - content_type       # functional role (D2323 Axis 1)
  - extraction_type    # epistemic form (D2323 Axis 2)
  - is_summary         # gate flag (summary vs principle)
  - domains
  - discipline
  - depth
  - evidence          # flag: cited | axiomatic (NOT evidence_passages — those are provenance metadata)
  - domains_raw        # raw LLM label preserved forever (G9)
  - discipline_raw     # raw LLM label preserved forever (G9)
  - applicability      # D-2757: consumer/teleology axis (Axis 3, orthogonal to role+form+scope)
  - applicability_source  # D-2757: provenance of the applicability label (deterministic|owner_adjudicated)
  - classify_model     # D2476: classifier model that labelled this record (gpt-oss-20b).
                       # PRINCIPLE-ONLY — non-principle sidecars are routed, not classified.

# ─────────────────────────────────────────────────────────────────────────────
# SHARED METADATA / STAMPS — R14 + provenance + runtime
# ─────────────────────────────────────────────────────────────────────────────
metadata:
  stamps:       [schema_version, gen_model, pipeline_commit, pipeline_run_id, taxonomy_version, manifest_hash, created_at]  # classify_model is PRINCIPLE-ONLY (in classification block, not stamps — non-principle sidecars are routed, not classified)
  provenance:   [source_books, source_clusters, source_segments, evidence_passages, citation, source_authors, source_diversity, primary_source]  # evidence_passages = up to 5 verbatim source quotes; citation/source_authors/source_diversity/primary_source carried from S2 (F1)
  discovery:    [keywords]                  # search/retrieval labels (3-5 comma-separated terms)
  versioning:   [object_version]            # canonical name (currently `fb_version` in code)
  runtime:      [usage_count, last_retrieved_at, feedback_score, feedback_count]

# ─────────────────────────────────────────────────────────────────────────────
# ─────────────────────────────────────────────────────────────────────────────
# S2 EXTRACTABLE BODY FIELDS — per content_type (P2-1, BUG-152 follow-up)
#   The fields S2's single-source/singleton prompt must emit BEYOND the shared
#   core_body (name/definition/mechanism/boundary/consequence/elaboration).
#   Cross-reference/metadata fields (consulted_fbs, fb_query_*, parent_pt_id,
#   parent_fb_ids, promoted_*, template_source, source, version, tags,
#   annotations, alternatives) are DERIVED later (S4.5/D2345), NOT extracted here.
#   `steps` (PT/PI), `actors` (PI) and `parameters` (TI) are JSON arrays; the
#   rest are strings.
# ─────────────────────────────────────────────────────────────────────────────
s2_body_fields:
  principle: []   # shared core_body only
  process_template:
    - trigger
    - prerequisite
    - steps            # array of step strings (ordered)
    - done_condition
    - failure_mode
  process_instance:
    - instance_text
    - actors           # array of actor/role strings
    - outcome_metric
    - outcome_qualitative
    - domain_context
  tool_instruction:
    - tool_name
    - platform
    - description
    - syntax
    - parameters       # array of {name, type, description}
    - output
    - example
    - caveats
  growth_edge:
    - body
    - category
    - actionable
    - status
    - priority

# ─────────────────────────────────────────────────────────────────────────────
# D-2747 — deterministic non-principle REROUTE (BUG-611 / BUG-170).
#   S4 routes non-principle records WITHOUT re-classifying them (BUG-170), so an
#   S2 mislabel reaches S6 unverified. D-343: content_type must NOT be LLM-classified
#   (measured -2.98pp vs constant baseline), so the correction is DETERMINISTIC.
#   Three tiers, first-match-wins: (1) owner-adjudicated map (fb_id → role, highest
#   authority, lives in governance/content_type_adjudication.json); (2) keyword
#   denylist below (config-driven, C12); (3) structural checks in code (a TI with
#   neither syntax nor parameters is quarantine). The contested retention guard is a
#   SEPARATE, orthogonal rule: a `contested: true` record is NEVER noise_drop/quarantine.
# ─────────────────────────────────────────────────────────────────────────────
reroute:
  # tool_instruction → process_template promotion (D-2747 tier 3). TWO conditions — a NAME is a
  # PRIOR, never EVIDENCE:
  #  (1) VOCABULARY — the name must denote a PROCEDURE. D-2949 dropped 'protocol'/'pipeline'/'process'
  #      ("Item Validation Protocol", "Transformers Pipeline API") as common TOOL-name suffixes but
  #      KEPT 'system'/'framework', the same class pointing the other way: they name software
  #      ARTIFACTS that are USED ('OpenFrameworks', a C++ creative-coding library, twice; 'Layout
  #      Analysis System'; 'Inventory Management System'), not methods that are EXECUTED. MEASURED
  #      2026-10-12 over the 108 stored tool_instruction rows: the four old keywords fired on 10 rows
  #      and NOT ONE of the ten is a procedure under the ratified D275b procedure, which tests
  #      "tool/software-specific command, syntax, or feature" FIRST — so a name-suffix promotion
  #      INVERTS the owner-ratified order. 'system'/'framework' REMOVED; the survivors denote
  #      procedures. The structural check (TI with neither syntax nor parameters) and the tier-1
  #      owner map still catch genuinely-underspecified TIs.
  ti_to_pt_keywords: [workflow, methodology]

  # D-2955 (BUG-729) — require BODY EVIDENCE for the promotion above. true = a promoted record must
  # carry an ordered procedure AND a done-condition/gate in its OWN body (D275b: "trigger + ordered
  # steps + a done-condition"), i.e. the SAME test tier 2 applies to a principle. false restores the
  # name-only behaviour, which is MEASURED WRONG on the current store (0 of 10 promotions survive it);
  # it exists only as the calibration instrument's second side. Flipping it is an OWNER call
  # (content_type is S4-owned ontology, D-2933) — same shape as open_tension_strict below, where the
  # SAFE value ships and the DESTRUCTIVE one needs an owner.
  ti_to_pt_require_body_evidence: true
  # D-2953 (BUG-712 CALIBRATION) — tier-2 tension test MODE. false = the historical LOOSE form
  # (`_OPEN_TENSION`, BARE words). true = the STRICT form, which requires an affirmative STATUS
  # construction ("the evidence is contested", "contested claim") instead of reading an ordinary
  # predicate about the record's SUBJECT as an epistemic statement about its CLAIM.
  #
  # MEASURED 2026-10-12 over the 7,640-row store (scripts/calibrate_content_type_router.py):
  #   loose  = 100 `principle -> growth_edge` moves, 88 of them (88%) SUBJECT-MATTER FALSE
  #            POSITIVES that a governed re-stamp would have written into the store (1.2% of it);
  #   strict = far fewer moves with the FP rate in the D-2953 record;
  #   recall (gated by the same status test) = 0 in BOTH forms — the token list is not too NARROW,
  #            which is why this fix is PRECISION-ONLY.
  # The strict form is the SAFE direction and the loose one is the DESTRUCTIVE value. It therefore
  # shipped DISABLED (behaviour bit-for-bit unchanged, D-2953) until the owner RATIFIED it ENABLED on
  # 2026-10-12, one word, after the two-sided measurement above. The strict form's own move count is
  # what a governed BUG-712 re-stamp may act on: the loose form's 100 moves are 88% router error, so
  # writing them would have injected a defect into the store FROM a repair pass.
  #
  # NOTE (see BUG-730): this key lives inside the EXISTING `reroute:` mapping on purpose. A second
  # top-level `reroute:` block appended to this file silently REPLACED this one (PyYAML keeps the
  # last duplicate), which emptied `ti_to_pt_keywords` and killed the TI->process_template tier
  # without a single error. scripts/check_config_duplicate_keys.py now fails the build on that.
  open_tension_strict: true   # RATIFIED by the owner 2026-10-12 (D-2953); was false pending ratification

# DROPPED — vestigial content_type enum values (were schema-only, never used)
#   `fact`  (domain factoid): never emitted/validated/trained; a bare factoid
#           cannot meet the ≥2-source convergent bar — absorbed into a
#           principle's evidence_passages or not extracted.
#   `meta`  (navigation text): filtered at Stage 1.3 prefilter before S2, so an
#           S2 output type of `meta` is unreachable. Leftover from the old
#           stage-3a classification taxonomy.
# ─────────────────────────────────────────────────────────────────────────────
# ─────────────────────────────────────────────────────────────────────────────
# COMMIT GATE (D-2965, 2026-10-12) — LEAF-LABEL ADMISSION at the ordinary write path.
#   WHY. D-2938 fixed the PRODUCER half of BUG-712 (S4 computed the routed role and then persisted
#   the RAW S2 label, so the store contradicted the decision it had been routed by). Nothing
#   stopped the SILENT half: stage6.insert_fb validated against CONTENT_TYPES_ALL (5 roles + 2
#   dispositions) and TOLERATED an empty label. So (a) a COMPUTED-THEN-DISCARDED label could still
#   reach the store as '' — a shape the store ruler CANNOT see ('' is not in HOLLOW, BUG-726) — and
#   (b) a DISPOSITION could be written into the content_type column (BUG-741: a disposition is not a
#   content_type, and the store has no disposition column). MEASURED 2026-10-12 on the live
#   artifact: 7,640 rows · 0 blanks · 0 dispositions — this gate is NEUTRAL today and closes a
#   pathway that is ARMED, not a defect that is firing.
#   NOT A NEW RULE. scripts/restamp_content_type_adjudications.py (D-2964) already refuses exactly
#   these shapes for an OWNER-WARRANT write. D-2965 applies the SAME rule at the path that writes
#   100% of rows (D-2646: the rule's home is the ontology module).
#   CONSEQUENCE (declared, not discovered). A refusal is a FAILED insert, and pipeline_config.yaml
#   sets stage6.max_failed_ratio: 0.0 — so ONE refused row HALTS the commit and rolls back (BUG-708).
#   That is the intended fail-closed semantics: a leaf with no ROLE is not knowledge, and an untyped
#   row must never enter the governed store. An absent label at S6 means the S4 producer path was
#   bypassed or regressed (S4 already routes a missing label to `quarantine`, D2616) — so S6
#   REFUSES rather than manufactures.
#   READS ARE LOUD (pipeline/content_types.py): a missing key is an IMPORT defect, never a default
#   (D-2938/BUG-731 — a .get(key, default) moves the value out of config AND adds a shadowed-declared
#   census key, and that census is already over its ceiling).
commit_gate:
  decision: D-2965
  require_role: true          # an absent/blank content_type is REFUSED, never written as ''
  refuse_dispositions: true   # quarantine | noise_drop are REFUSED as content_type values

dropped_content_types:
  - fact
  - meta

# ─────────────────────────────────────────────────────────────────────────────
# NLI PARAPHRASE (D-284, 2026-09-20) — R2 content_type NLI hypothesis = arm C.
#   BUG-305 proved the category META-definition under-entails on principle ("a
#   single self-contained claim… NOT a procedure you EXECUTE" self-negates, so a
#   specific instance never entails the meta-definition). Arm C uses a paraphrase
#   CONTENT-CLAIM as the hypothesis instead. A/B (r2_ab_harness.py): paraphrase
#   beats definition as a mislabel detector (wrong-contra 91% vs 55%; false-contra
#   0.233 vs 0.267). Single source for scripts/definition_nli_verify.py (R2) and
#   scripts/r2_ab_harness.py (measurement).
# ─────────────────────────────────────────────────────────────────────────────
nli_paraphrase:
  principle: "This describes a general rule or principle that can be applied to understand or decide something."
  process_template: "This describes an ordered sequence of steps for carrying out a procedure."
  process_instance: "This describes a specific real case in which a procedure was actually carried out."
  tool_instruction: "This describes how to use a specific software tool or command."
  growth_edge: "This describes a speculative idea, an open question, or an unverified correlation."
  noise_drop: "This is a bare factual summary with no rule or method to apply."
  quarantine: "This has some value but does not clearly fit any single category."

