stage1_5:
  faiss_threshold: 0.75
  min_cluster_size: 2
  max_cluster_size: 500
  min_source_diversity: 2
  neighbor_k: 50
  embed_model: bge-m3
  embed_dim: 512
  embed_backend: ollama
  embed_model_hf: BAAI/bge-m3
  embed_native_mrl: false  # D2551: Ollama 'dimensions' (trained MRL 512d head) vs manual 1024→512 truncate. Default false (index built with truncation); enable only with full re-embed + index rebuild.
  embed_chunk_size: 20000
  embed_batch_size: 64
  max_embed_drop_rate: 0.005
  embed_checkpoint_enabled: true
  fingerprint_files:
    - pipeline/stage1_5_embed_cluster.py
    - pipeline/io_guard.py
stage0:
  max_failed_ratio: 0.0
  fingerprint_files:
    - pipeline/stage0_convert.py
    - pipeline/io_guard.py
  #: BUG-897/D-3076 — THE BUDGET IS DECLARED, NEVER A MAGIC NUMBER. Two constants used to sit between the owner's
  #: acceptance and a work's admission (`timeout=180` for Docling, `timeout=120` for Pandoc), and they decided WHICH
  #: BOOKS ENTER THE LIBRARY. MEASURED 2026-10-17: Wim Wenders — The Logic of Images converted rc=0 in 287.28 s with
  #: the ceiling lifted, and was quarantined as "failed" at 180 s. The ceiling discriminates against LONG, SCANNED,
  #: IMAGE-HEAVY works first — exactly the part of a library that costs most to replace.
  #: The allowance is computed FROM THE WORK (`basis`), so a big book is not refused for being big.
  conversion_budget:
    basis: bytes            # the signal the allowance is derived from (no page-count dependency: cross-platform, C26)
    pandoc_timeout_s: 300   # epub: flat — Pandoc reads an epub in seconds regardless of size
    docling_floor_s: 300    # pdf: the smallest allowance any work gets
    docling_per_mb_s: 40    # pdf: allowance per MiB of source (a scanned page is bytes; a text page is few)
    docling_ceiling_s: 1500 # pdf: the largest allowance any single work may claim
    stage_timeout_s: 1800   # the applier's per-book subprocess ceiling; MUST exceed docling_ceiling_s (checked at import)
    docling_fast_ceiling_s: 300  # born-digital pdf (text-layer probe passes): no OCR/tables — measured 2026-10-18 a 1.3MB book still exceeded 60s, so align to the floor; still 5x under the 1500s OCR ceiling
  #: English-only / convert-text-only (owner 2026-10-18) — THE PDF READER ROUTES BY TEXT LAYER, NOT SUFFIX.
  #: MEASURED 2026-10-18 on the live tranche: docling's default runs --ocr + --tables on EVERY pdf, so a
  #: born-digital book (Goffman, 3.4 MB, 142 selectable chars on page 1) burned its full 436s allowance and failed
  #: `budget_expired`. A pdftotext probe on the leading pages splits the work: born-digital (>= min_chars) takes a
  #: FAST path (--no-ocr --no-tables --no-enrich-formula), an image-heavy scan (< min_chars) is SKIPPED (no
  #: extractable text; the owner declared image-heavy books need no conversion).
  text_layer:
    probe_pages: 2        # leading pages the probe reads (a cover is often a full-page image)
    min_chars: 100        # stripped selectable chars at/above this => born-digital TEXT; below => SCAN/image-heavy
    scan_policy: skip     # skip | ocr  (skip: image-heavy is a declared skip; ocr: opt-in for a rare valuable scan)
    #: BUG-896/D-3038 REGISTERED the pandoc-for-pdf fallback as an accepted negative (pandoc has NO pdf reader, so it
    #: was a guaranteed second failure). pdftotext IS a reader, so THIS is a real fallback and not that failure:
    #: a born-digital PDF that Docling under-produces (< 100-byte floor) is re-read from its text layer, not lost.
    pdf_text_fallback: true   # true | false  (born-digital pdf Docling under-produced → extract the text layer via pdftotext)
  #: BUG-918/D-3086 — THE ARTEFACT'S SHAPE IS DECLARED, AND IT IS NOT THE ENGINE'S DEFAULT.
  #: MEASURED 2026-10-18 on ONE library work (Souls Of Distortion Awakening.pdf, 4.06 MB), same file, same machine,
  #: two argv forms. With docling's shipped default `--image-export-mode embedded` the artefact was 19.371 MB and
  #: carried 95 `data:image` base64 blobs; with `--image-export-mode placeholder` it was 0.538 MB carrying ZERO,
  #: and the TEXT was identical (519,083 vs 518,893 normalised chars — every difference was the image marker
  #: itself, plus one figure/table reflow). 97.2% of the artefact was PICTURE BYTES, and they were never read.
  #: Across the stopped night that default wrote 100 artefacts = 2,599.7 MB, of which 16 files = 2,311.3 MB (89%)
  #: were above 30 MB, the largest 895.2 MB for ONE book. A 895 MB .md is not a book: it is a picture archive no
  #: tokenizer can read, and S1 would have chunked base64 into the claim store. So the shape is DECLARED here,
  #: VERIFIED after every conversion, and an artefact that violates it is REFUSED before it reaches the corpus.
  artifact:
    image_export_mode: placeholder   # placeholder | embedded | referenced (docling --image-export-mode)
    max_embedded_images: 0           # an artefact carrying MORE `data:image` blobs than this is refused
    max_artifact_mb: 8               # a text artefact above this ceiling is refused; a real book is 0.3–3 MB
    min_output_bytes: 100             # T-206/D-3153: below this a "success" wrote a receipt, not a work (C20)
  #: D-3077 — A LIBRARY'S DECLARED KINDS MAY NOT EXCEED ITS STAGE'S DECLARED READERS. MEASURED 2026-10-17 on the
  #: live plan: 389 of 626 refusals were `refused_container_no_stage_reads_it` — works the door says the library OWNS
  #: (books root kinds: epub, pdf, md, mobi, azw3, djvu; journals:notes kinds: pdf, docx, md, txt) that Stage 0 could
  #: not open, because this stage's reader set was a three-item literal in code: {.epub, .pdf, .md}.
  #: The container axis is therefore DECLARED HERE, one line per container, naming the READER that opens it. Adding a
  #: format is a config edit plus a reader function — never a scramble through the dispatch. MEASURED that same day,
  #: each reader below on a real library file:
  #:   .docx  pandoc      rc=0  0.5 s  35,122 B  10 headings   (99 works unlocked)
  #:   .pptx  pandoc      rc=0  0.1 s   1,693 B   1 heading    (4 works)
  #:   .rtf   pandoc      rc=0  0.1 s     515 B   0 headings   (5 works; pandoc's RTF reader is thin — a receipt
  #:                                                          field quality_status is what catches a thin result)
  #:   .mobi  kindleunpack+pandoc  unpack 0.21 s + pandoc 1.93 s -> 576,244 B, 435 images, on a 36.7 MB MOBI
  #:   .txt   pandoc -f plain       rc=0 (the DEFAULT reader escaped the text: `-\> Under \$500` — declared, not assumed)
  #: NOT DECLARED, and why (D-3038: what we reject is registered, so it cannot be re-proposed from memory):
  #:   .doc / .ppt  legacy OLE binaries. MEASURED: docling ACCEPTS the format and then FAILS on the real file
  #:                ("failed to convert", rc=0 with no output) — declaring a container whose engine cannot open THIS
  #:                library's files would add rows to the plan that are guaranteed to fail (max_failed_ratio is 0.0).
  #:                Remedy when the owner wants them: `soffice --headless --convert-to docx` (LibreOffice) as the reader.
  #:   .djvu        needs `djvutxt` (djvulibre); ABSENT on this machine. One work.
  #:   .png/.jpg/.jpeg/.gif/.psd/.ai/.indd/.idml/.aep/.jsx/.ttc/.zip/.rar  ASSETS, not text works: 232 of the 389.
  #:                The door's reason for these reads "a container the conversion stage cannot read", which claims the
  #:                stage SHOULD read a PSD. It should not. This is the accepted negative, not an engine debt.
  #:   .xlsx/.xls/.numbers  DATA, not prose: 41 works. Deliberately left to an OWNER WORD rather than decided here —
  #:                pandoc DOES read xlsx into markdown tables, so this is a judgement about the corpus's contents
  #:                (a spreadsheet is not a book), not a missing engine.
  containers:
    .md:   native_md             # already converted: the file IS the artifact
    .epub: pandoc_epub
    .pdf:  docling_pdf           # budget derived from the work's own bytes (conversion_budget); no fallback (BUG-896)
    .mobi: kindleunpack_pandoc   # KindleUnpack (pure python) unpacks to HTML/EPUB, then the SAME pandoc step
    .azw:  kindleunpack_pandoc
    .azw3: kindleunpack_pandoc
    .docx: pandoc_docx
    .pptx: pandoc_pptx
    .rtf:  pandoc_rtf
    .txt:  native_text           # no converter: pandoc's only text reader escapes the bytes (MEASURED 2026-10-17)
    .doc:  textutil_doc          # Word 97-2003 (OLE): pandoc has NO doc reader, and docling accepts-then-fails on this library's own files (MEASURED 2026-10-17). textutil ships with macOS and is NAMED when absent
  #: BUG-898 — A RECEIPT MUST CARRY THE DIAGNOSIS, NOT THE TAIL. Four failures printed the same sentence structure, so
  #: the real causes (an epub parse error, a budget expiry, a void fallback) were unrecoverable without re-running by
  #: hand. Every failed conversion now names ONE of these, and the meaning says what the owner should do about it.
  failure_classes:
    converter_absent: "the converter is NOT INSTALLED on this machine — the work is whole and nothing was tried against it"
    budget_expired: "the converter did not finish inside its DECLARED budget — this is a timeout, and its remedy is MORE TIME, never a new copy"
    container_unreadable: "the converter refused the work's own container (a broken spine reference, a missing manifest) — the bytes pass a zip/PDF probe, so this is an authoring defect, not a truncated download"
    no_output: "the converter reported success and wrote nothing — the RECEIPT is defective, not the book; re-run before touching the source"
    deferred_for_identity: "the INGEST DOOR refused to duplicate a work already in the corpus (D-2997/BUG-781) — the book is whole and was never converted; it needs an OWNER WORD on identity, not a new copy"
    unsupported_format: "the container is not one of the readers this stage DECLARES (config/pipeline_config.yaml#stage0.containers) — the library may own the format, but S0 has no engine for it, so this is a DOOR/PLAN fault and never a book fault. It used to print 'Unsupported format' and SKIP the file: a silent skip is indistinguishable from a conversion, which is exactly the blindness D-3077 exists to end"
    artifact_images_embedded: "the converter produced an artefact carrying inline base64 images — the bytes are a picture archive, not a book, and no tokenizer reads them; the work is WHOLE and this is the ENGINE'S declared default, so the remedy is the declared artifact.image_export_mode, never a new copy"
    artifact_oversize: "the artefact exceeded stage0.artifact.max_artifact_mb — a text conversion of a book does not reach this ceiling, so an artefact this large is the engine dumping a layout, and it was REFUSED before it could enter the corpus"
    #: DELIBERATELY ABSENT: `quality_failed`. D2326's quality check is a RECEIPT FIELD today
    #: (`quality_status` in the checkpoint), not an admission gate — no code path can produce that class yet, and a
    #: declared class with no producer is a declaration with no referent (D-3034). When the quality check becomes a
    #: gate it emits its own class, in the change that makes it a gate.
stage0_5:
