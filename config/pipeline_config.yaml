    - fundamental
    - any system
    contemporary:
    - '202'
    - current
    - modern
    - recent
    - today
    - now
  difficulty_map:
    specialized: expert
    universal: beginner
    cross-domain: intermediate
    domain_single: expert
    domain_multi: intermediate
  universal_signals:
  - entropy
  - thermodynamic
  - evolution
  - natural selection
  - system 1
  - system 2
  - cognitive bias
  - feedback loop
  - power law
  - exponential
  - equilibrium
  - conservation
  - symmetry
  - optimization
  - gradient
  max_failed_ratio: 0.01
  checkpoint_interval: 5
  fb_name_max_words: 8
s2:
  dspy_max_labeled_demos: 3
  dspy_max_bootstrapped_demos: 3
  dspy_max_tokens: 4096
  dspy_program_path: null    # BUG-397(b)/D-364: data/dspy_mipro_optimized.json has never existed and no program was
                             # ever trained to it. null = declared-absent, deliberately NOT deleted: .get(k, default)
                             # would resurrect the code-level default from pipeline_paths.py. Set it only when a real
                             # optimizer run has written a program (pipeline/dspy_trainer.py).
  dspy_enabled: false
  gate:
    enabled: false
    model: Qwen3-Coder-30B-A3B-Instruct-MLX-4bit
    max_tokens: 64
    temperature: 0.0
    system_prompt: You are a principle discovery gate. Answer ONLY with 'FB' or 'NULL'.
      No explanation.
    user_prompt_template: 'Examine these text segments from {n_sources} different
      books.


      {segments}


      Does this cluster contain a discoverable convergent principle —

