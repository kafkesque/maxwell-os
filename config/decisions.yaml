- id: D-357
  category: ARCHITECTURE
  state: RESOLVED
  date: 2026-09-23
  title: "The vec integrity contract is per table: a dormant store must be EMPTY"
  decision: >-
    D-354 fixed one contract for every listed vec store (live == fbs, orphans == 0, missing == 0). That contract is
    correct for the production vector leg and WRONG for a store R26 forbids production from reading: emptying a
    dormant store converts its dead entries into MISSING rows, so the same rule calls the repaired state RED and
    "0 RED" is unreachable. The contract is therefore PER TABLE: required true asserts the mirror contract;
    required false asserts DORMANT (orphans == 0 AND live == 0, missing == fbs EXPECTED, an absent table passes).
    A bare string defaults to required (fail-closed). Instantiates D-355 in a new place: the assertion must describe
    the state the store is in, not the state it was built for.
  artifacts: [config/vec_integrity.yaml, scripts/verify_vec_integrity.py, scripts/repair_vec_integrity.py, governance/FORENSIC_AUDIT_20260923e.md]
  related: [D-354, D-355, BUG-394, BUG-104]
- id: D-355
  category: ARCHITECTURE
  state: RESOLVED
  date: 2026-09-23
  title: A control must assert the state it is in, not the state it was built for
  decision: >-
    A pin, gate or control artifact MUST resolve the configured state it depends on, and must assert the
    contract of THAT state fail-closed in both directions. When the state is off the assertion INVERTS (the
    ruled bytes must be absent from every arm AND the stamp must not claim them) instead of asserting a premise
    that can no longer be true. BUG-392, BUG-393, BUG-395 and BUG-396 are four instances of one class: a check
    that cannot resolve the state it exists to check. Corollary (BUG-396): a gate in a run harness MUST be
    chained to the commit with && - a gate that is not chained is decoration.
  artifacts: [scripts/verify_boundary_injection.py, justfile, governance/FORENSIC_AUDIT_20260923d.md]
  related: [D-318, D-327, BUG-395, BUG-396]
