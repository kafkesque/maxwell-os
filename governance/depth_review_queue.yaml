      should view scenes through a veil to achieve correct perspective, contrasting
      with later mathematical understandings of vanishing points.
    mechanism: Alberti's method involved looking through a thin veil or velo to capture
      the correct view of a scene, which was distinct from the mathematical understanding
      of vanishing points that emerged later with the work of Guidobaldo del Monte,
      Simon Stevin, and Girard Desargues.
    boundary: Applies to Renaissance-era perspective drawing methods that predate
      mathematical understanding of vanishing points. Fails when the method involves
      mathematical principles of perspective that were not yet understood.
