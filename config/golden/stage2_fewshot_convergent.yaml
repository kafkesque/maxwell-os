examples:
- id: CONV-001
  domain: pricing
  source_books:
  - Predictably Irrational — Dan Ariely
  - Thinking, Fast and Slow — Daniel Kahneman
  - Priceless — William Poundstone
  cluster_segments:
  - source_book: Predictably Irrational — Dan Ariely
    text: 'The Economist''s subscription page became a famous case study. They offered three options:

      Web-only for $59, Print-only for $125, and Print+Web for $125. The Print-only option was

      the decoy — nobody chose it, but its presence made Print+Web look like a bargain. Dan Ariely

      tested this with his students: when the decoy was present, 84% chose Print+Web. When he

      removed the decoy and offered only Web ($59) and Print+Web ($125), only 32% chose Print+Web.

      '
  - source_book: Thinking, Fast and Slow — Daniel Kahneman
    text: 'The dominance relationship makes choices easier. When A dominates B in all respects, people

      choose A without hesitation. But when A is better than B on some dimensions and worse on

      others, choice becomes difficult and people often defer. This is why adding a clearly inferior

      option that is dominated by the target can increase the target''s share dramatically.

      '
  - source_book: Priceless — William Poundstone
    text: 'Williams-Sonoma sold a bread maker for $279 — it flopped. Then they introduced a larger,

      deluxe model for $429. The $279 model suddenly looked reasonable and sales nearly doubled.

      The expensive model wasn''t meant to sell; it was there to make the original look like a

      good deal. This is asymmetric dominance at work in retail.

      '
  is_convergent: true
  should_extract: true
  expected_fb:
    is_summary: false
    route: FB
    name: Asymmetric Dominance Decoy
    definition: 'Introducing an inferior decoy option that is dominated by a target option on all salient

      dimensions shifts choice toward the target by making its relative value obvious. The decoy

      is not meant to be chosen — it exists solely to make the target appear superior through

      contrast, exploiting the human preference for easy dominance comparisons over difficult

      trade-off evaluations.

      '
    mechanism: 'Decoys cause preference shifts because System 1 (intuitive) reasoning resolves dominance

      comparisons effortlessly, while trade-off comparisons between non-dominated options trigger

      System 2 (deliberative) reasoning that often results in choice deferral. The decoy

      eliminates the need for difficult trade-off analysis by providing an obvious loser.

      '
    boundary: 'Applies when the decoy is clearly inferior to the target on all relevant dimensions AND

      the target and competitor are difficult to compare directly (each has advantages). Fails

      when: (1) the decoy is not clearly dominated — if it has ANY advantage over the target,

      it becomes a legitimate option; (2) the target and competitor are already easily comparable

      — no need for a decoy; (3) consumers have strong pre-existing preferences that overwhelm

      contextual cues.

      '
    consequence: 'Markets structured with decoy options produce systematically different choices than markets

      with only genuinely competitive options. This means the same consumer with the same true

      preferences will make different choices depending on whether a decoy is present — the

      preference is constructed at the moment of choice, not revealed by it.

      '
    evidence_passages:
    - when the decoy was present, 84% chose Print+Web
    - When he removed the decoy and offered only Web ($59) and Print+Web ($125), only 32% chose Print+Web
    - adding a clearly inferior option that is dominated by the target can increase the target's share dramatically
    - Williams-Sonoma sold a bread maker for $279 — it flopped. Then they introduced a larger, deluxe model for $429. The
      $279 model suddenly looked reasonable and sales nearly doubled
    extraction_type: causal_mechanism
    content_type: principle
    depth: domain
  rationale: 'Three independent sources (Ariely, Kahneman, Poundstone) with three different empirical cases

    (Economist subscriptions, general dominance logic, Williams-Sonoma bread makers) converging

    on the same mechanism. Convergent extraction MUST synthesize across all sources, not paraphrase

    any single one. The mechanism/boundary/consequence structure forces the LLM to go beyond

    observation ("decoys work") to explanation ("they work because...") and limits ("they fail when...").

    '
  discipline: behavioral economics
- id: CONV-002
  domain: behavioral_change
  source_books:
  - Atomic Habits — James Clear
  - The Power of Habit — Charles Duhigg
  cluster_segments:
  - source_book: Atomic Habits — James Clear
    text: 'Implementation intentions leverage the two most common cues: time and location. The format

      is ''I will [BEHAVIOR] at [TIME] in [LOCATION].'' For example: ''I will meditate for one minute

      at 7 a.m. in my kitchen.'' Research by Peter Gollwitzer has shown that people who use

      implementation intentions are two to three times more likely to follow through. The specificity

      of the plan creates an automatic trigger — when the time and place arrive, the behavior

      is initiated without conscious deliberation.

      '
  - source_book: The Power of Habit — Charles Duhigg
    text: 'The cue-routine-reward loop explains why some behaviors become automatic while others require

      constant effort. The cue is the trigger that tells your brain to go into automatic mode.

      Implementation intentions work because they manufacture a clear, unambiguous cue. When you say

      ''I will exercise at 6 p.m. in the park,'' the clock striking six becomes a cue that initiates

      the routine without requiring a decision.

      '
  - source_book: Atomic Habits — James Clear
    text: 'The problem with vague goals like ''I want to exercise more'' is that they leave too many

      decisions unmade. Each day you must decide when, where, and how to exercise. Each decision

      is an opportunity to opt out. Implementation intentions remove these decision points by

      pre-committing to a specific plan. When the moment arrives, there is nothing to decide.

      '
  is_convergent: true
  should_extract: true
  expected_fb:
    is_summary: false
    route: FB
    name: Implementation Intention Triggering
    definition: 'Specifying the exact time, location, and behavioral format of an intended action (''I will

      [BEHAVIOR] at [TIME] in [LOCATION]'') increases follow-through 2-3x by converting vague

      intentions into automatic cue-response triggers. The specificity eliminates the decision

      points where willpower typically fails.

      '
    mechanism: 'Implementation intentions cause behavior follow-through because they manufacture a clear,

      unambiguous situational cue (time + location) that triggers automatic initiation of the

      planned behavior without requiring conscious deliberation. This bypasses the decision-fatigue

      bottleneck where vague intentions break down — when the specified time and place arrive,

      the pre-committed plan executes as if on autopilot.

      '
    boundary: 'Applies when the target behavior is simple, specific, and the cue is unambiguous (e.g.,

      ''meditate at 7am in the kitchen''). Fails when: (1) the behavior is complex and cannot be

      reduced to a simple trigger (e.g., ''write a novel at 9am'' — the behavior itself requires

      ongoing decisions); (2) the cue is frequently unpredictable (e.g., ''exercise when I feel

      energized''); (3) the person has no genuine motivation — implementation intentions amplify

      existing motivation, they do not create it.

      '
    consequence: 'People who use implementation intentions are 2-3x more likely to follow through compared to

      those with equivalent motivation but vague plans. The effect compounds: each successful

      automatic execution reinforces the cue-response link, making future execution even more likely.

      '
    evidence_passages:
    - people who use implementation intentions are two to three times more likely to follow through
    - Implementation intentions work because they manufacture a clear, unambiguous cue
    - Implementation intentions remove these decision points by pre-committing to a specific plan
    extraction_type: causal_mechanism
    content_type: principle
    depth: domain
  rationale: 'Two sources (Clear and Duhigg) converging on the same mechanism with complementary explanations.

    Clear provides the specificity + Gollwitzer research data. Duhigg provides the neurological

    explanation (cue-routine-reward loop). A good convergent extraction synthesizes both: the

    "what" from Clear + the "why" from Duhigg.

    '
  discipline: psychology
- id: CONV-003
  domain: advertising
  source_books:
  - Pictorial Metaphor in Advertising — Charles Forceville (Routledge, 1996)
  - 'Visual Rhetoric in Advertising: Text-Interpretive, Experimental, and Reader-Response Analyses — Edward F. McQuarrie &
    David Glen Mick (Journal of Consumer Research, 1999)'
  cluster_segments:
  - source_book: Pictorial Metaphor in Advertising — Charles Forceville (Routledge, 1996)
    text: 'Pictorial metaphors in advertising are not merely decorative; they require the viewer

      to construct an interpretation. The more unconventional the metaphor — the further

      the source domain is from the target — the more interpretive work the viewer

      must do. Whether the effort pays off depends on the viewer''s ability to resolve the

      mapping: metaphors that can be resolved reward the viewer with insight, while

      those that cannot produce confusion rather than persuasion.

      '
  - source_book: 'Visual Rhetoric in Advertising: Text-Interpretive, Experimental, and Reader-Response Analyses — Edward F.
      McQuarrie & David Glen Mick (Journal of Consumer Research, 1999)'
    text: 'Rhetorical figures vary in complexity, and complexity shapes response. Figures at a

      moderate level of complexity — demanding some interpretive effort but resolvable

      — produce more favorable attitudes toward the advertisement than figures that are

      either simple or overly complex. The resolution of a figure rewards the reader with a

      self-generated insight, and this pleasure of resolution is what makes moderately

      complex figures persuasive.

      '
  is_convergent: true
  should_extract: true
  expected_fb:
    is_summary: false
    route: FB
    name: Metaphor Complexity Inverted-U
    definition: 'Visual metaphors in advertising have a curvilinear (inverted-U) relationship with persuasive

      impact: moderate conceptual complexity produces the strongest brand attitudes and message

      elaboration, while too-simple metaphors are dismissed as trivial and too-complex metaphors

      cause disengagement or misinterpretation. The optimal level triggers an ''aha'' resolution

      moment that rewards the viewer''s cognitive effort.

      '
    mechanism: 'Moderate metaphor complexity causes stronger persuasion because it triggers elaborative

      processing — the viewer invests cognitive effort to resolve the metaphor and is rewarded

      with an ''aha'' insight. This self-generated insight is more memorable and persuasive than

      a message that is simply received passively. Too little complexity provides no reward;

      too much complexity prevents resolution entirely.

      '
    boundary: 'Applies when the audience has sufficient domain knowledge to resolve the metaphor (cultural

      references, category familiarity). Fails when: (1) the audience lacks prerequisite knowledge

      — a moderately complex metaphor becomes too complex; (2) the medium limits processing time

      (e.g., billboards vs. magazine ads); (3) the product category is high-involvement where

      literal information is preferred over metaphorical.

      '
    consequence: 'Ads with moderately complex metaphors generate higher recall, more favorable brand attitudes,

      and greater message elaboration than either literal or highly abstract ads. The processing

      effort itself becomes a persuasive force — we value insights we work for more than those

      we receive passively.

      '
    evidence_passages:
    - the more interpretive work the viewer must do
    - metaphors that can be resolved reward the viewer with insight
    - Figures at a moderate level of complexity
    - this pleasure of resolution is what makes moderately complex figures persuasive
    extraction_type: causal_mechanism
    content_type: principle
    depth: domain
  rationale: 'Two independent research traditions converge on the inverted-U relationship between

    metaphor complexity and persuasive impact: Forceville (cognitive linguistics,

    Routledge book) supplies the interpretive-demand theory; McQuarrie & Mick

    (consumer research, JCR experimental study) supply evidence that moderately complex

    figures produce the most favorable attitudes. Independent authors, no citation chain.

    D2206: replaces fabricated D2204 sources ("Finding the Tipping Point"; Mostafa)

    with verifiable publications.

    '
  discipline: communication science
- id: CONV-004
  domain: persuasion
  source_books:
  - Influence — Robert Cialdini
  - Made to Stick — Chip & Dan Heath
  cluster_segments:
  - source_book: Influence — Robert Cialdini
    text: 'Social proof is most effective when the proof comes from similar others. Showing that ''10,000

      people bought this'' is less persuasive than showing that ''people like you bought this.'' The

      effect is strongest when people are uncertain about what to do — in ambiguous situations, we

      look to others'' behavior as a heuristic for correct action.

      '
  - source_book: Made to Stick — Chip & Dan Heath
    text: 'NFL Films tells the story of an undrafted rookie who made the team. Rather than listing

      statistics, they show veterans talking about ''that kid who reminds me of myself.'' The

      similarity between the viewer (who sees themselves as overlooked) and the rookie creates

      emotional resonance that raw achievement data cannot. The principle: people believe stories

      about people who remind them of themselves.

      '
  is_convergent: true
  should_extract: true
  expected_fb:
    is_summary: false
    route: FB
    name: Similarity-Weighted Social Proof
    definition: 'Social proof persuades through perceived similarity, not volume. A message showing that

      ''people like you'' took an action is more influential than showing that ''10,000 people'' took

      it, because relevance amplifies the heuristic. The effect is strongest under uncertainty —

      when people don''t know what to do, they look to similar others as a decision shortcut.

      '
    mechanism: 'Similarity-weighted social proof causes persuasion because it activates self-relevant

      processing — the viewer sees the referenced group as a proxy for themselves (''if they did

      it, I should too''). Volume-based proof (10,000 people) activates statistical reasoning,

      which is weaker than identity-based reasoning. The mechanism is amplified by uncertainty:

      the less someone knows what to do, the more they rely on similar-other behavior as a

      decision heuristic.

      '
    boundary: 'Applies when the reference group shares a relevant, visible identity characteristic with

      the target audience. Fails when: (1) the similarity is on irrelevant dimensions — ''people

      who drink coffee bought this'' doesn''t persuade if the decision has nothing to do with

      coffee drinking; (2) the reference group''s behavior is undesirable — similarity backfires

      if the referenced behavior is stigmatized; (3) the audience has strong independent

      preferences that override social cues.

      '
    consequence: 'Social proof campaigns that emphasize ''people like you'' consistently outperform volume-based

      campaigns (''X million served'') in conversion and engagement. The identity connection creates

      an emotional resonance that statistical proof cannot match.

      '
    evidence_passages:
    - Showing that '10,000 people bought this' is less persuasive than showing that 'people like you bought this.'
    - people believe stories about people who remind them of themselves
    - The effect is strongest when people are uncertain about what to do
    extraction_type: causal_mechanism
    content_type: principle
    depth: domain
  rationale: 'Cialdini provides the mechanism (similarity amplifies social proof under uncertainty).

    Heath provides the narrative application (NFL Films example). Convergent extraction must

    synthesize the mechanism with the application, not just paraphrase Cialdini.

    '
  discipline: social psychology
- id: CONV-005
  domain: marketing
  source_books:
  - Hacking Growth — Sean Ellis
  - $100M Offers — Alex Hormozi
  cluster_segments:
  - source_book: Hacking Growth — Sean Ellis
    text: 'When Dropbox launched, Drew Houston created a 3-minute demo video showing the product in

      action — syncing files across devices, recovering deleted files, sharing folders. The video

      demonstrated the outcome before mentioning price or features. Beta signups jumped from

      5,000 to 75,000 overnight.

      '
  - source_book: $100M Offers — Alex Hormozi
    text: 'The grand slam offer is not about listing features. It is about making the prospect feel

      the outcome so vividly that the price becomes an afterthought. You must articulate the

      transformation — where they are now versus where they will be after using your product —

      with such specificity that they experience the relief of the problem being solved before

      they pay a cent.

      '
  is_convergent: true
  should_extract: true
  expected_fb:
    is_summary: false
    route: FB
    name: Value-First Demonstration
    definition: 'Leading with the experienced outcome of a product — rather than its features, specifications,

      or price — increases conversion by allowing prospects to feel the transformation before

      evaluating the cost. The value demonstration makes the price an afterthought rather than a

      barrier, because the prospect has already internalized the benefit.

      '
    mechanism: 'Value-first demonstration causes higher conversion because outcome visualization

      creates a vivid internal reference point — prospects imagine the transformation so

      concretely that the price is evaluated against the relief of the solved problem rather

      than against competitor feature lists. When the prospect has already experienced the

      outcome in their mind, the price becomes the cost of not achieving that outcome, not

      the cost of the product.

      '
    boundary: 'Applies when the product delivers a clear, emotionally resonant transformation (productivity,

      status, relief, connection). Fails when: (1) the product is a commodity where all competitors

      deliver equivalent outcomes — value demonstration can''t differentiate; (2) the audience

      already understands the outcome and is evaluating features/price — value-first becomes

      redundant; (3) the product requires explanation of how it works before prospects trust the

      outcome claim.

      '
    consequence: 'Products marketed with value-first demonstration consistently outperform feature-first

      marketing on conversion metrics. Dropbox''s video approach (5K→75K signups) is the canonical

      example: showing the outcome created demand that feature lists never generated.

      '
    evidence_passages:
    - Beta signups jumped from 5,000 to 75,000 overnight
    - making the prospect feel the outcome so vividly that the price becomes an afterthought
    - they experience the relief of the problem being solved before they pay a cent
    extraction_type: causal_mechanism
    content_type: principle
    depth: domain
  rationale: 'Ellis provides the case study (Dropbox, 5K→75K). Hormozi provides the mechanism

    (outcome visualization, price as afterthought). Convergent extraction must combine

    the empirical evidence with the source-grounded mechanism.

    '
  discipline: marketing
- id: NEG-CONV-001
  domain: pricing
  source_books:
  - Predictably Irrational — Dan Ariely
  cluster_segments:
  - source_book: Predictably Irrational — Dan Ariely
    text: 'When we encounter a new product, the first price we see becomes an anchor. This initial

      price influences not just what we''re willing to pay for that product, but what we''re willing

      to pay for related products in the same category. Arbitrary anchors can have effects that

      persist even when people know the anchor was arbitrary.

      '
  is_convergent: false
  should_extract: false
  expected_fb:
    is_summary: false
    route: 'NULL'
    name: Anchoring
    definition: ''
    mechanism: ''
    boundary: ''
    consequence: ''
    evidence_passages: []
    extraction_type: causal_mechanism
    content_type: principle
  rationale: 'HARD NEGATIVE: This is a single-source segment passed as a "cluster" with only ONE book.

    Stage 2 should detect that source_diversity < 2 and route this to non-convergent path

    (no extraction, or extract with is_convergent=false and flag for single-source verification).

    The golden example trains the LLM to recognize when it does NOT have enough sources for

    convergent synthesis.

    '
- id: NEG-CONV-002
  domain: business
  source_books:
  - Good to Great — Jim Collins
  - Built to Last — Jim Collins
  cluster_segments:
  - source_book: Good to Great — Jim Collins
    text: 'Great companies have great people. The right people are the most important asset of any

      organization. Getting the right people on the bus and in the right seats is the first

      step to building a great company.

      '
  - source_book: Built to Last — Jim Collins
    text: 'Visionary companies prioritize people development. They invest heavily in training and

      create cultures where talented people can thrive and grow. The commitment to people

      is what separates the truly great companies from the merely good ones.

      '
  is_convergent: true
  should_extract: false
  expected_fb:
    is_summary: false
    route: 'NULL'
    name: ''
    definition: ''
    mechanism: ''
    boundary: ''
    consequence: ''
    evidence_passages: []
    extraction_type: causal_mechanism
    content_type: principle
  rationale: 'HARD NEGATIVE: Both segments say "good people are important" in different words. This is

    a platitude, not a principle. There is no mechanism (HOW do great people cause great

    outcomes?), no boundary (when does great talent NOT help?), no testable consequence. All

    segments agree, but they agree on a truism. Stage 2 should detect the absence of causal

    mechanism and reject this cluster. Even though there are 2 sources, having multiple sources

    echoing the same platitude does not create a convergent principle.


    NOTE: Collins'' "First Who, Then What" IS a defended principle with a mechanism in Good to

    Great (Chapter 3: rigorous people decisions → right people self-motivate → no need for

    heavy management). However, the EXCERPTS selected for this cluster deliberately omit that

    mechanism. This teaches the LLM to evaluate the cluster it RECEIVES — not the books it

    recognizes — and reject when the provided segments lack causal depth, even if the source

    material contains it elsewhere.

    '
- id: NEG-CONV-003
  domain: management
  source_books:
  - Thanks for the Feedback — Douglas Stone & Sheila Heen
  - Reinventing Organizations — Frederic Laloux
  cluster_segments:
  - source_book: Thanks for the Feedback — Douglas Stone & Sheila Heen
    text: 'Receiving feedback triggers one of three reactions: truth-triggers (is this accurate?), relationship-triggers (what
      does this say about our relationship?), and identity-triggers (what does this say about who I am?). The key to receiving
      feedback well is recognizing which trigger is firing and separating the message from the emotional reaction. Even well-intentioned
      feedback can provoke defensiveness if it threatens the recipient''s sense of competence or belonging.'
  - source_book: Reinventing Organizations — Frederic Laloux
    text: Self-managing organizations replace hierarchical oversight with peer-based feedback loops. Instead of a manager
      conducting annual reviews, colleagues give real-time feedback through structured processes like the "advice process"
      — anyone can make a decision, but must first seek advice from affected parties and subject-matter experts. This distributes
      feedback across the organization and makes it a continuous, operational function rather than a periodic, evaluative
      one.
  is_convergent: true
  should_extract: false
  expected_fb:
    is_summary: false
    route: 'NULL'
    name: ''
    definition: ''
    mechanism: ''
    boundary: ''
    consequence: ''
    evidence_passages: []
    extraction_type: causal_mechanism
    content_type: principle
  rationale: 'HARD NEGATIVE — FALSE CONVERGENCE. Both segments use the word "feedback" and discuss its role in organizations,
    creating a strong topical overlap. But they operate at completely different levels of analysis: Stone & Heen address interpersonal
    psychology (emotional triggers, identity threat, individual defensiveness), while Laloux addresses organizational structure
    (peer processes, distributed decision-making, system-level feedback loops). There is NO shared causal mechanism — one
    says "feedback fails because of emotional triggers" and the other says "feedback works when structured as an organizational
    process." Merging these would create a false synthesis. Stage 2 must detect that topical overlap without causal convergence
    = NULL. This is more challenging than single-source rejection (NEG-CONV-001) or platitude detection (NEG-CONV-002) because
    both sources are legitimate and well-argued — they just describe different mechanisms at different levels, making this
    the most common real-world false-convergence pattern.'
- id: CONV-006
  domain: economics
  source_books:
  - Thinking, Fast and Slow — Daniel Kahneman
  - Misbehaving — Richard Thaler
  - Predictably Irrational — Dan Ariely
  cluster_segments:
  - source_book: Thinking, Fast and Slow — Daniel Kahneman
    text: The default option is the one that will be chosen if the decision-maker does nothing. Defaults are powerful because
      opting out requires an active decision, which engages System 2. When people are uncertain or the choice is complex,
      they tend to stay with the default — not because they prefer it, but because changing it costs mental effort. This is
      why organ donation rates are above 90% in countries with opt-out defaults and below 15% in countries with opt-in defaults,
      despite similar underlying preferences.
  - source_book: Misbehaving — Richard Thaler
    text: 'Choice architecture is the design of the environment in which people make decisions. A nudge is any aspect of the
      choice architecture that alters behavior without forbidding options or changing economic incentives. Automatic enrollment
      in retirement savings plans — where employees are enrolled by default but can opt out — increases participation from
      roughly 40% to over 90%. The power of defaults comes not from coercion but from inertia: people tend to stick with whatever
      option requires no action.'
  - source_book: Predictably Irrational — Dan Ariely
    text: When people face too many options, they often fail to choose at all. In one experiment, shoppers presented with
      24 jam varieties were far less likely to buy than those shown only 6 varieties — despite being more attracted to the
      larger display. The cognitive cost of evaluating many options exceeds the benefit of having more choices. Choice, beyond
      a certain point, becomes paralyzing rather than liberating.
  - source_book: Thinking, Fast and Slow — Daniel Kahneman
    text: When faced with a difficult question, System 1 often substitutes an easier one without the person noticing. This
      is why people who are asked "how happy are you with your life?" before being asked "how many dates have you had recently?"
      show no correlation between the two, but when asked in the reverse order, the correlation jumps to 0.66. Complex evaluations
      are frequently replaced by simpler proxies that happen to be accessible.
  is_convergent: true
  should_extract: true
  expected_fb:
    is_summary: false
    route: FB
    name: Default Inertia Effect
    definition: When a default option is pre-selected, people disproportionately stick with it because opting out requires
      an active decision that engages costly System 2 deliberation. The default becomes the status quo, and changing it feels
      like a potential loss — even when the alternative would be objectively better. This is why opt-out systems (organ donation,
      retirement savings) achieve dramatically higher participation than opt-in systems.
    mechanism: 'Defaults work through two interacting mechanisms: (1) cognitive effort avoidance — changing the default requires
      engaging System 2 reasoning to evaluate alternatives, compare trade-offs, and justify the switch, all of which are mentally
      costly; (2) loss aversion — once the default becomes the reference point, any departure is coded as a potential loss,
      and losses hurt ~2× more than equivalent gains feel good. Together, these create a powerful status quo bias that makes
      the default "sticky" even when the stakes are high.'
    boundary: 'Applies when: (1) the decision is complex or the chooser is uncertain; (2) the cost of switching is non-zero
      (cognitive or procedural); (3) no strong pre-existing preference overrides the default. Fails when: (1) the default
      is clearly harmful or morally objectionable (people will opt out); (2) the chooser has strong expertise and clear preferences;
      (3) the choice is trivial and requires no deliberation — then defaults have no sticking power.'
    consequence: The same population with identical underlying preferences will show radically different outcomes depending
      on the default. Organ donation consent is ~90% in opt-out countries and ~15% in opt-in countries — a 6× difference that
      cannot be explained by cultural or religious factors alone. Retirement savings participation follows the same pattern.
      Default choice architecture is one of the most powerful — and ethically charged — tools in behavioral policy design.
    evidence_passages:
    - organ donation rates are above 90% in countries with opt-out defaults and below 15% in countries with opt-in defaults
    - Automatic enrollment in retirement savings plans — where employees are enrolled by default but can opt out — increases
      participation from roughly 40% to over 90%.
